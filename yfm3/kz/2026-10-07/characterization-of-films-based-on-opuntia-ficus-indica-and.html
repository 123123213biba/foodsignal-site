            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"181\" cy=\"148\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"579\" cy=\"233\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PACKAGING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Пластик орнына кактус:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;опунция қалдықтарынан жаңа&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қаптама&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f1.jpg\" alt=\"(a) Қалыңдығы, (b) созылу беріктігі және (c) OFICP/пектин негізіндегі үлдірлердің үзілу кезіндегі салыстырмалы ұзаруы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Қалыңдығы, (b) созылу беріктігі және (c) OFICP/пектин негізіндегі үлдірлердің үзілу кезіндегі салыстырмалы ұзаруы&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер кептірілген опунция сабағының ұнтағы мен пектин негізінде экологиялық таза қаптама материалын әзірледі. Бұл материал топырақта 28 күн ішінде толық ыдырайды. Үлдір жоғары беріктікке ие және өнімдерді ультракүлгін сәулелерден қорғайды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Пектин қосқанда үлдір беріктігі 232%-ға артты.&lt;/li&gt;\n&lt;li&gt;Материал 28 күн ішінде топырақта толық ыдырайды.&lt;/li&gt;\n&lt;li&gt;Жоғары мөлдір еместік өнімді ультракүлгіннен қорғайды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Үлдірді жасау үшін 2 г кептірілген опунция сабағының ұнтағы (OFICP), пластификатор ретінде 30% глицерин және 0,5-тен 2,0 г-ға дейінгі пектин қолданылды. Құрамдағы пектин мөлшерінің артуы материалдың механикалық қасиеттерін айтарлықтай жақсартты: созылуға төзімділік F1-ден F3 құрамына өткенде 232%-ға (2,62-ден 8,69 МПа-ға дейін) өсті.&lt;/p&gt;\n&lt;p&gt;Материал гидрофильді қасиеттерге ие, бұл төмен жанасу бұрыштарымен (30,29–39,39°) және жоғары ылғалдылықпен (25,11–35,98%) расталады. Топырақтағы сынақтар үлдірлердің 12-күннен бастап визуалды түрде ыдырай бастағанын және 28-күнге қарай толық дерлік жойылып кеткенін көрсетті. Үлдірлердің жоғары мөлдір еместігі (22–25%) оларды жарық әсерінен майлы өнімдердің тотығуынан қорғау үшін пайдалануға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зертханалық жағдайда жүргізілген, сондықтан әртүрлі сақтау режимдерінде үлдір қасиеттерін қосымша тексеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Пластикалық қаптама тамақ өнеркәсібінде кеңінен қолданылады, алайда оның қоршаған ортада ғасырлар бойы сақталуы биологиялық ыдырайтын баламаларға деген қызығушылықты арттырды. Бұл зерттеудің мақсаты — мұздатып кептірілген Opuntia ficus-indica кладодияларының ұнтағын (OFICP) (2 г), глицеринді (30%, масса бойынша) және коммерциялық пектиннің әртүрлі мөлшерін: 0,5 г (F1), 1,0 г (F2), 1,5 г (F3) және 2,0 г (F4) пайдалана отырып, биологиялық ыдырайтын пленка жасау болды. Пектин мөлшерінің пленкалардың механикалық, термиялық, құрылымдық, түстік және ылғалға байланысты қасиеттеріне әсері, сондай-ақ олардың топырақта және имитацияланған теңіз ортасында биологиялық ыдырауы жүйелі түрде бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пектин мөлшерінің артуы созылуға төзімділікті 232%-ға (2,62-ден 8,69-ға дейін) арттырды және пленкалардың термиялық тұрақтылығын жақсартты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пектин мөлшері жоғары құрамдар жақсартылған механикалық сипаттамаларды, соның ішінде F1 (2,62) мен F3 (8,69) арасындағы созылуға төзімділіктің 232%-ға артуын, сондай-ақ жоғары термиялық тұрақтылықты көрсетті. Пектин мен OFICP-тің гидрофильді табиғатына байланысты пленкалар төмен жанасу бұрыштарын (30,29–39,39°) және жоғары ылғалдылықты (25,11–35,98%) көрсетті. Гидрофильді табиғаты мен ылғалға байланысты қасиеттерін ескере отырып, бұл пленкалар ылғалдылығы төмен тамақ өнімдері үшін қолайлырақ болуы мүмкін; алайда олардың жарамдылығын растау үшін әртүрлі сақтау және қоршаған орта жағдайларында қосымша зерттеулер қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зертханалық жағдайда жүргізілді; пленкалардың нақты тамақ өнімдеріне жарамдылығын растау үшін қосымша сынақтар талап етіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, эксперименттік жағдайда пленкалар топырақта біртіндеп визуалды ыдырауды көрсетті: F1 және F2 құрамдары 12-ші күнге қарай айтарлықтай бұзылды, ал барлық құрамдар 28-ші күнге қарай дерлік толығымен ыдырап кетті. Осылайша, алынған нәтижелер OFICP-ті коммерциялық пектинмен араластыру жақсартылған қасиеттері бар пленкаларды өндіруге мүмкіндік беретінін және олардың тамақ өнімдерін қаптауда қолдану әлеуеті бар екенін көрсетеді. Сонымен қатар, Opuntia ficus-indica қосымша өнімдерін қайта өңдеу ауыл шаруашылығы қалдықтарын басқаруда экологиялық жауапты тәсілді қамтамасыз етеді және тамақ өнімдерін қаптауға арналған биоматериалдардың жаңа буынын дамытуға қолдау көрсетеді.&lt;/p&gt;\n&lt;p&gt;Түйінді сөздер: Полисахаридтер · Кактус · Тұрақты даму · Тамақ өнімдерін қаптау · Мұздатып кептірілген · Қосымша өнім&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Пластикалық қаптаманы қарқынды пайдаланудың экологиялық салдарына қатысты алаңдаушылықтың артуы тұрақты баламаларды іздеуді ынталандырды, әсіресе материалдарды кәдеге жарату көлемі жоғары азық-түлік секторында. Негізінен жаңартылмайтын көздерден алынатын пластикалық қаптама биологиялық тұрғыдан ыдырамайды және қоршаған ортаның ластануына және қатты қалдықтардың жиналуына айтарлықтай үлес қосады. Осы тұрғыда табиғи биополимерлерден жасалған биологиялық ыдырайтын үлдірлер (пленкалар) технологиялық функционалдылықты қоршаған ортаға тигізетін әсерінің төмендігімен үйлестіре отырып, айналмалы экономика мен тұрақты даму қағидаттарына сәйкес келетін перспективалы шешім ретінде пайда болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Табиғи полимерлерден жасалған биологиялық ыдырайтын үлдірлер дәстүрлі пластикке экологиялық таза балама ұсынады және тұрақты даму қағидаттарына сәйкес келеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл материалдардың ішінде өсімдік тектес полисахаридтер өздерінің құрылымдық әртүрлілігі мен үздіксіз полимерлік матрицаларды қалыптастыру қабілетіне байланысты ерекше қызығушылық тудырады. Осы тұрғыдан алғанда, жартылай құрғақ аймақтарда кеңінен өсірілетін кактус түрі Opuntia ficus-indica перспективалы, бірақ толық зерттелмеген ресурс болып табылады. Оның кладодиялары ауыл шаруашылығы жұмыстары кезінде көп мөлшерде түзіледі және көбінесе лақтырылады немесе толық пайдаланылмайды, дегенмен олар полисахаридтерге, тағамдық талшықтарға және басқа да функционалдық компоненттерге бай. Соңғы зерттеулер Opuntia ficus-indica кладодияларынан алынған материалдарды қолайлы механикалық және тосқауылдық қасиеттері бар биологиялық ыдырайтын үлдірлерді өндіру үшін пайдалануға болатынын көрсетті. Алайда, бұл тәсілдердің көпшілігі шырышты немесе арнайы фракцияларды экстракциялауға сүйенеді, бұл өңдеудің күрделілігін арттырады және ауқымдылығын шектейді. Баламалы стратегия — кептіруден кейін тұтас кладодияларды тікелей пайдалану, бұл биомассаны толық бағалауға мүмкіндік береді және өңдеу кезеңдерін жеңілдетеді. &lt;a href=\"concepts/vfd.html\"&gt;Лиофилизация&lt;/a&gt; (мұздатып кептіру) құрылымдық компоненттерді сақтауға мүмкіндік береді және үлдір құрамына жарамды біртекті ұнтақтарды алуды жеңілдетеді.&lt;/p&gt;\n&lt;p&gt;Әлеуетіне қарамастан, биологиялық негіздегі үлдірлер иілгіштік пен механикалық төзімділік сияқты сипаттамаларды оңтайландыру үшін құрамына қосымша молекулаларды талап етеді. Галактурон қышқылының бірліктеріне бай және әдетте цитрустық жемістерден алынатын полисахарид — пектин бұл мақсат үшін тиімді нұсқа болып табылады. Өзінің ішкі гельдену және үлдір түзу қабілетінің арқасында ол биологиялық ыдырайтын матрицаларға жақсы интеграцияланады және олардың механикалық, термиялық және тосқауылдық сипаттамаларын жақсартады. Осылайша, оның үлдір құрамына қосылуы құрылымдық тұрақтылығы мен функционалдық тиімділігі жоғары материалдарды әзірлеуге ықпал етеді. Пластификаторлар да сынғыштықты жеңу және иілгіштікті жақсарту үшін биополимер негізіндегі үлдірлерде маңызды рөл атқарады. Глицерин гидрофильді полимерлермен үйлесімділігі және тізбектердің қозғалғыштығын арттыру қабілетіне байланысты ең көп қолданылатын пластификаторлардың бірі болып табылады. Opuntia ficus-indica кладодиясынан алынған материал, пектин және глицерин комбинациясы осы компоненттердің бір-бірін толықтыратын сипаттамаларын пайдаланатын және үлдірдің өнімділігін жақсарта алатын рецептуралық стратегияны білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лиофилизация — бұл шикізаттың құрылымы мен қасиеттерін сақтау үшін вакуумда мұздатылған өнімнен ылғалды кетіру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бірқатар зерттеулер Opuntia ficus-indica немесе пектиннен жеке-жеке алынған үлдірлерді зерттегенімен, оларды бірге қолдануды зерттеу әлі де шектеулі. Пектин мөлшері мұздатып кептірілген Opuntia ficus-indica кладодиясының ұнтағын қамтитын үлдірлердің физика-химиялық, механикалық, термиялық және тосқауылдық қасиеттеріне қалай әсер ететінін түсіну тұрақты қаптама материалдарын дамыту үшін өте маңызды. Сондықтан, бұл зерттеу мұздатып кептірілген Opuntia ficus-indica кладодиясының ұнтағы (OFICP), пектин және глицерин негізінде биологиялық ыдырайтын аралас үлдірлерді әзірлеуге және сипаттауға, сондай-ақ олардың азық-түлік қаптамасында әлеуетті қолданылуына жарамдылығын бағалау үшін физика-химиялық, механикалық, термиялық және тосқауылдық қасиеттерін бағалауға бағытталған.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"plenkanyng-syrtkhy-tueri\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#plenkanyng-syrtkhy-tueri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пленканың сыртқы түрі&lt;/span&gt;&lt;/a&gt;Пленканың сыртқы түрі&lt;/h4&gt;\n&lt;p&gt;Бастапқыда OFICP және глицериннің әртүрлі концентрацияларын қолдана отырып, пленка түзу бойынша алдын ала сынақтар жүргізілді. Алайда, бұл құрамдар Петри табақшаларынан ажырату қиын болатын сынғыш материалдардың түзілуіне әкелді және олар қолдануға немесе кейінгі сипаттамаға жарамсыз болды. Нәтижесінде, бақылау жүйесі ретінде тек пектиннен тұратын құрам (2 г пектин + глицерин) таңдалды, ол OFICP/пектин композиттік пленкаларымен салыстыру үшін эталондық матрица ретінде қызмет етті. Сонымен қатар, барлық композиттік құрамдар (F1–F4) көрінетін жарықтарсыз немесе ауа көпіршіктерінсіз біртекті пленкалар алуға мүмкіндік берді және олармен жұмыс істеу оңай болды (S1-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау ретінде тек пектинді қолдану тұрақты матрицаны жасауға мүмкіндік берді, ал барлық композиттік құрамдар (F1–F4) біртекті және қолдануға ыңғайлы пленкаларды қалыптастырды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sumen-bajlanysty-khasietter\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#sumen-bajlanysty-khasietter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сумен байланысты қасиеттер&lt;/span&gt;&lt;/a&gt;Сумен байланысты қасиеттер&lt;/h4&gt;\n&lt;p&gt;Су тағам өнімдерінің визуалды сапасына да, бұзылу процестеріне де айтарлықтай әсер етеді, бұл оны сақтау кезінде қауіпсіздікті қамтамасыз етудегі негізгі факторға айналдырады. Азық-түлік өнімдерін қорғалған күйде сақтау үшін орауыш материалдары сыртқы ылғалға қарсы тосқауыл бола отырып, ылғалдың тасымалдануын тиімді бақылауы керек. Сондықтан ылғалдылық мөлшері, жанасу бұрышы, су белсенділігі (Aw) және су буының өткізгіштігі (WVP) сияқты сумен байланысты қасиеттерді бағалау OFICP/пектин қоспасынан жасалған пленкалардың сипаттамаларын түсіну және оңтайландыру үшін өте маңызды. 1-кестеде пленкалардың ылғалдылық мөлшері, Aw, WVP, жанасу бұрышы және пленка бетіндегі су тамшысының кескіні берілген. Пленкалардың ылғалдылық мөлшері құрамға байланысты өзгеріп отырды. Қоспа пленкаларға келетін болсақ, пектин мөлшерінің 1,5 г-ға дейін артуы ылғалдылық мөлшерінің төмендеуіне әкелді. Мұны OFICP мен пектин арасында сутектік байланыстардың түзілуімен түсіндіруге болады, бұл сумен әрекеттесе алатын –OH топтарының санын азайтады. Бұл нәтижелер алдыңғы зерттеулермен сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Су белсенділігі (Aw) — бұл өнімдегі немесе материалдағы микроорганизмдердің өсуіне ықпал ететін еркін судың қолжетімділік көрсеткіші.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пленка түзуші ерітіндінің көлемі барлық үлгілер үшін бірдей болғандықтан және құрғақ заттардың мөлшері әртүрлі болғандықтан, пленка қалыңдығы тәуелсіз айнымалы ретінде бақыланбады, бұл WVP нәтижелеріне әсер еткен болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;OFICP-тің қосылуы Aw және WVP мәндеріне әсер етті, олар белгілі бір үрдіске сәйкес келді: пектин мөлшері артқан сайын су буының өткізгіштігі мен су белсенділігі де артты, бұл өткізгіштігі жоғары құрылымды көрсетеді. Су белсенділігі F1-де 0,408-ден бақылау пленкасында 0,470-ке дейін өзгерді, бұл пектин негізіндегі пленкалар үшін әдебиетте келтірілген мәндерден (0,614–0,652) төмен. Айырмашылықтарға қарамастан, алынған Aw мәндері пленка матрицасы ішіндегі еркін су мөлшерінің төмендігін көрсетеді, бұл қолданылған полимерлердің физика-химиялық қасиеттеріне сәйкес келеді. Айта кету керек, құрамдар арасындағы пленка қалыңдығындағы айырмашылықтар WVP және механикалық қасиеттердегі байқалған өзгерістерге ықпал еткен болуы мүмкін. WVP мәндері бақылау пленкасы үшін 2,78 (г·м⁻¹·с⁻¹·Па⁻¹) мен F4 құрамы үшін 0,54 (г·м⁻¹·с⁻¹·Па⁻¹) аралығында өзгерді. Ең жоғары мәндер F3 және F4 құрамдарында байқалды, олар F1 және бақылау пленкасынан айтарлықтай ерекшеленді. Бұл өсуді құрамдарға қатты заттардың қосылуымен, атап айтқанда, OFICP-тің өзіне қосылған пектиннің үлкен мөлшерімен түсіндіруге болады. Сонымен қатар, полимерлердің де, пластификатордың да гидрофильдік сипатын ескеру қажет, өйткені глицериннің гигроскопиялығы су молекулаларымен күштірек әрекеттесуді ынталандырады, сіңіру мен өткізгіштікті күшейтеді, сонымен бірге пленканың тосқауылдық қасиеттерін төмендетеді.&lt;/p&gt;\n&lt;p&gt;1-кесте Ылғалдылық мөлшері, су белсенділігі (Aw), су буының өткізгіштігі (WVP), жанасу бұрышы және C = бақылау пленкасы (2 г пектин); F1 (0,5 г пектин + 2 г OFICP), F2 (1,0 г пектин + 2 г OFICP), F3 (1,5 г пектин + 2 г OFICP), F4 (2 г пектин + 2 г OFICP) бетіндегі су тамшысының кескіні. Стандартты ауытқумен үш өлшемнің орташа мәні, бағандағы бірдей әріп Тьюки тесті (p &amp;lt; 0,05) бойынша орташа мәндер арасында айтарлықтай айырмашылық жоқ екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Жанасу бұрышы пленкалардың беттік сулануы туралы түсінік береді. Кішірек бұрыштар (&amp;lt; 90°) жоғары сулануды, ал үлкенірек бұрыштар (&amp;gt; 90°) гидрофобты бетті білдіреді. Осы зерттеудегі барлық пленкалар 90°-тан төмен жанасу бұрыштарына ие болды, бұл олардың гидрофильді табиғатын растайды. Олардың ішінде тек бақылау пленкасы айтарлықтай жоғары жанасу бұрышын (p &amp;lt; 0,05) көрсетті, бұл аралас құрамдарға қарағанда сулануы төмен бетті білдіреді. Бұл нәтижелер алдыңғы зерттеулермен сәйкес келеді: pH өңдеуі жоқ крахмал/OFICP пленкалары үшін 26,94° жанасу бұрышы мәндері туралы хабарланған, ал 30% (м/м) глицерині бар OFICP–агар пленкалары үшін 26,40° мәндері байқалған. Қызығы, pH-ты реттеу сулануға күшті әсер ететіні де көрсетілген, pH 12-де өңделген крахмал/OFICP пленкалары үшін 70,85° жанасу бұрышы туралы хабарланған. Бұл OFICP-тің pH модификациясы болашақ құрамдарда беттік гидрофобтылықты реттеу үшін перспективалы стратегия болуы мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"plenkalardyng-moeldir-emestigi-men-tuesi\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#plenkalardyng-moeldir-emestigi-men-tuesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пленкалардың мөлдір еместігі мен түсі&lt;/span&gt;&lt;/a&gt;Пленкалардың мөлдір еместігі мен түсі&lt;/h4&gt;\n&lt;p&gt;Пленка қалыңдығы олардың жалпы өнімділігін анықтауда шешуші рөл атқарады, механикалық беріктік, тосқауыл тиімділігі және қолдану ыңғайлылығы сияқты сипаттамаларға айтарлықтай әсер етеді. 1-суретте әзірленген пленкалардың қалыңдығы мен механикалық қасиеттері көрсетілген. 1a-суретте көрсетілгендей, қоспалардағы пектиннің артуы қалыңырақ пленкалардың түзілуіне әкелді, қалыңдық мәндері F1 формуласы үшін 0,137 мм-ден F4 үшін 0,177 мм-ге дейін өзгерді. Бұл үрдіс құрғақ заттар мөлшерінің артуына байланысты күтілген болатын.&lt;/p&gt;\n&lt;h4 id=\"mehanikalykh-khasietteri\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#mehanikalykh-khasietteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механикалық қасиеттері&lt;/span&gt;&lt;/a&gt;Механикалық қасиеттері&lt;/h4&gt;\n&lt;p&gt;OFICP қоспасыз 2 г пектині бар бақылау формуласы биоыдырайтын пленкалардың қасиеттеріне кладодия ұнтағының әсерін бағалау үшін эталондық пленка ретінде пайдаланылды. Созылу беріктігіне қатысты (1b-сурет), бақылау пленкасы (C) ең жоғары мәнді (15,23 МПа) көрсетті, бұл барлық басқа формулалардан айтарлықтай асып түсті. Керісінше, OFICP/пектин пленкаларының созылу беріктігі F1 (2,62 МПа) мен F3 (8,69 МПа) арасында біртіндеп өсті, бұл ретте F3 пен F4 арасында айтарлықтай айырмашылық байқалмады. Бұл плато пектиннің нығайту әсері белгілі бір концентрациядан кейін қанығу нүктесіне жетуі мүмкін екенін, одан кейін созылу беріктігінің одан әрі өсуі болмайтынын білдіреді. *C = бақылау пленкасы (2 г пектин); F1 = (0,5 г пектин + 2 г OFICP), F2 = (1,0 г пектин + 2 г OFICP), F3 = (1,5 г пектин + 2 г OFICP), F4 = (2 г пектин + 2 г OFICP). Алдыңғы зерттеулермен салыстырғанда, қазіргі нәтижелер айтарлықтай жақсаруды көрсетеді. Де Фариас және т.б. крахмал мен OFICP-тен тұратын пленкалар үшін төменірек созылу беріктігін (3,0 МПа) хабарлады, ал Махлуфи және т.б. агар, OFICP және 30% глицерині (м/м) бар пленкалар үшін 6,7 МПа мәнін бақылады. Бұл салыстырулар кактус негізіндегі пленкалардың созылу беріктігін айтарлықтай арттыру үшін пектиннің орташа концентрациясының әлеуетін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау пленкасы максималды беріктікке (15,23 МПа), бірақ минималды иілгіштікке (1,86%) ие, ал OFICP қосу пленкалардың икемділігін арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пленкалардың механикалық қасиеттері созылу беріктігі мен ұзару арасындағы әдеттегі ымыраны ашты. Бақылау пленкасы ең жоғары созылу беріктігін көрсетті, бұл оның үзілгенге дейін үлкен күшке төтеп бере алатынын білдіреді. Алайда, ол сонымен қатар ең төменгі үзілу кезіндегі ұзаруды (1,86%) көрсетті, бұл шектеулі икемділігі бар қатты және сынғыш құрылымды білдіреді. Керісінше, F1 және F2 формулалары айтарлықтай төмен созылу беріктігін, бірақ жоғарырақ ұзару мәндерін (сәйкесінше 10,30% және 12,46%) көрсетті, бұл серпімді және пластикалық табиғатты көрсетеді. Нәтижесінде, бұл пленкалар күшті жүктеме кезінде жыртылуға бейім болғанымен, олар механикалық кернеуге бейімделу және созылу қабілетіне ие. Бұл нәтижелер биоыдырайтын пленкаларды әзірлеуде беріктік пен икемділік арасындағы тепе-теңдікті модуляциялаудағы OFICP-тің көпфункционалды рөлін көрсетеді: бақылау пленкасы төзімдірек, бірақ сынғыш, ал F2 пленкасы азырақ төзімді, бірақ икемдірек.&lt;/p&gt;\n&lt;h4 id=\"termiyalykh-turakhtylykh\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#termiyalykh-turakhtylykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Термиялық тұрақтылық&lt;/span&gt;&lt;/a&gt;Термиялық тұрақтылық&lt;/h4&gt;\n&lt;p&gt;Ыдырауды бағалау. Пленканың ыдырау мінез-құлқы топырақ және теңіз жағдайларында бағаланды. Әртүрлі формулалардың ыдырау мінез-құлқы уақыт өте келе үлгілерді визуалды тексеру арқылы сапалық тұрғыдан бағаланды. Топырақ бөлшектерінің пленка беттеріне қатты жабысуына байланысты салмақ жоғалтуды өлшеу мүмкін болмады; сондықтан визуалды талдау ыдырау процесін бақылаудың негізгі әдісі ретінде қабылданды. Пленкалардың құрылымы уақыт өте келе біртіндеп бұзылды (SN4-сурет). Сынақтың алтыншы күніне қарай барлық пленка үлгілері түсі мен құрылымдық тұтастығында айтарлықтай өзгерістерге ұшырады, бұл полимердің ыдырауының басталғанын көрсетті. Бұл процесс негізінен қоршаған ортаның ылғалдылығы мен температурасымен басқарылатын сияқты, олар пленканың ісінуіне және кейіннен фрагментациялануына әкеледі. 12-күнге қарай F1 және F2 пленкалары дерлік толығымен ыдырады, ал пектин мөлшері жоғары формулалар ыдырауға көбірек төзімділік көрсетті. Бұл құбылысты Opuntia ficus-indica кладодия ұнтағының суға жоғары жақындығымен түсіндіруге болады: гидрофильді сипаттағы пленкалар ылғал мен микроорганизмдердің олардың құрылымына оңайырақ енуіне мүмкіндік береді, нәтижесінде ыдырау процесі жеделдейді. 28-күнге қарай барлық формулалар кең ауқымды ыдырауға ұшырады және қалған пленка қалдықтары айналадағы топырақтан визуалды түрде ажыратылмайтын болды. Бұл ыдырау әдеттегі пластикалық қаптамалар үшін байқалатыннан айтарлықтай тезірек жүрді. Бұл нәтижелер Mannai және т.б. мен López-Díaz және т.б. алдыңғы нәтижелерімен сәйкес келеді, олар сәйкесінше топырақ пен органикалық компостта 28–40 күн ішінде Opuntia ficus-indica және питайя (Hylocereus undatus) шырышынан жасалған пленкалардың осындай жылдам ыдырауы туралы хабарлаған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ыдырауды бағалау визуалды түрде жүргізілді; ыдырау кинетикасын дәл анықтау үшін сандық әдістер (мысалы, CO₂ бөлінуін өлшеу) қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Теңіз ортасындағы ыдырауды имитациялау сынағында барлық пленка үлгілері 2 сағат 55 минут ішінде толығымен ыдырады. Бұл жылдам ыдырау пленка матрицасында, әсіресе OFICP және пектинде бар полимерлердің гидрофильді табиғатын ескере отырып күтілген болатын. Бұл нәтижелер экологиялық маңызды жағдайларда ыдыраудың сапалық дәлелдерін ұсынғанымен, ыдырау кинетикасын дәл анықтау және дәстүрлі материалдармен толығырақ салыстыруды қамтамасыз ету үшін стандартталған әдістерді (мысалы, бақыланатын компосттау кезіндегі масса жоғалту, CO₂ бөлінуі немесе ASTM/ISO биоыдырау сынақтары) пайдалана отырып сандық талдаулар қажет болады.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Бұл зерттеуде Opuntia ficus-indica кладодияларының ұнтағы мен пектин негізінде биоыдырайтын пленкалар сәтті әзірленіп, сипатталды, бұл тұрақты орауыш қолданбалары үшін табиғи макромолекулалардың, атап айтқанда полисахаридтердің маңыздылығын көрсетеді. Нәтижелер Opuntia ficus-indica кладодияларының ұнтағы (OFICP) мен пектиннің қосындысы тиісті механикалық көрсеткіштерге, жақсы термиялық тұрақтылыққа және топырақ пен теңіз жағдайында тиімді биоыдырау қабілетіне ие пленкалар беретінін көрсетеді. Пектин мөлшерінің артуы пленканың бірқатар қасиеттерін жақсартқаны, ал F3 және F4 құрамдары барлық бағалаулар бойынша ең теңгерімді нәтижелерді көрсеткені атап өтілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;F3 және F4 құрамдары механикалық және термиялық қасиеттердің ең жақсы теңгерімін көрсетті, бұл оларды ылғалдылығы төмен өнімдерді орау үшін перспективалы етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өзінің гидрофильді табиғаты мен физика-химиялық сипаттамаларына байланысты бұл пленкалар биоыдырайтын орауыш жүйелерінде және тиісті салаларда, әсіресе ылғалдылығы төмен өнімдер үшін әлеуетті қолданысқа ие. Дегенмен, олардың тамақ өнімдерін орауға жарамдылығын растау үшін нақты тамақ өнімдерінің модельдері мен сақтау шарттарын қамтитын қосымша зерттеулер қажет. Сонымен қатар, Opuntia ficus-indica тұтас кладодиялары сияқты аз пайдаланылатын полисахаридтерді коммерциялық пектинмен бірге қолдану әлеуетті экологиялық пайдасы бар тұрақты биоматериалдарды дамытудың перспективалы стратегиясы болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл нәтижелер зертханалық жағдайда алынған; пленкалардың тамақ өнімдерін орауға жарамдылығын растау үшін нақты тамақ өнімдерімен сынақтар өткізу талап етіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Материалдар мен әдістер қосымша материалдар ретінде ұсынылған.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f1.jpg\" alt=\"(a) Қалыңдығы, (b) созылу беріктігі және (c) OFICP/пектин негізіндегі үлдірлердің үзілу кезіндегі салыстырмалы ұзаруы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Қалыңдығы, (b) созылу беріктігі және (c) OFICP/пектин негізіндегі үлдірлердің үзілу кезіндегі салыстырмалы ұзаруы&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f2.jpg\" alt=\"(a) Үлдірлердің және (b) шикізаттың инфрақызыл спектроскопиясы (FTIR); сондай-ақ (c) үлдірлердің және (d) шикізаттың рен\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Үлдірлердің және (b) шикізаттың инфрақызыл спектроскопиясы (FTIR); сондай-ақ (c) үлдірлердің және (d) шикізаттың рентгендік дифракциялық (XRD) өрнектері&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Пластикпен&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қоршаған&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ортаның&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ластануы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Опунция ұнтағы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мен пектинді&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;араластыру&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Берік&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;биоыдырайтын&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;үлдір&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Азық-түлікке&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арналған&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;экологиялық&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қаптама&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Plant foods for human nutrition (Dordrecht, Netherlands) журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Plant foods for human nutrition (Dordrecht, Netherlands) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;packaging&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авто
