        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"205\" cy=\"135\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"535\" cy=\"265\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · MICRONUTRIENTS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Бауырдың майлы ауруы: неге&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жаңа жағдайлар саны 30 жылда&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;екі есе өсті&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f1.jpg\" alt=\"NAJBP сырқаттанушылық көрсеткіштерінің жаһандық өсуі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;NAJBP сырқаттанушылық көрсеткіштерінің жаһандық өсуі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;NAJBP сырқаттанушылық көрсеткіштерінің жаһандық өсуі. (A) 1990-2021 жылдар аралығындағы 5 SDI аймағы бойынша NAJBP-мен байланысты өлім-жітім үлесінің әр аймақтағы халық үлесіне қатынасының өзгеруі. (B) 1990-2021 жылдар аралығындағы SDI квинтильдері бойынша NAJBP сырқаттанушылық көрсеткіштерінің трендтері. &lt;a href=\"concepts/aerobic-plate-count.html\"&gt;APC&lt;/a&gt; = жас-кезең-когорта, NAJBP = алкогольсіз майлы бауыр ауруы, SDI = әлеуметтік-демографиялық индекс.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;1990-2021 жылдар аралығында алкогольсіз майлы бауыр ауруы (АМБА) бойынша жаңа жағдайлар саны екі есеге жуық өсті. 204 елдің деректерін қамтитын зерттеу өмір салты мен метаболикалық өзгерістердің әсерін көрсетеді. Аурудың өсу қарқыны әсіресе орташа табысы бар аймақтарда жоғары.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;АМБА жағдайлары 1990-2021 жылдар аралығында 24,9 млн-нан 48,4 млн-ға дейін өсті.&lt;/li&gt;\n&lt;li&gt;Ең жоғары жылдық өсім 25–29 жас аралығындағы топта байқалды.&lt;/li&gt;\n&lt;li&gt;2021 жылы жаһандық ASIR көрсеткіші 100 000 адамға 593,28-ді құрады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Global Burden of Disease 2021 деректері бойынша, АМБА жағдайлары 1990 жылғы 24,9 миллионнан 2021 жылы 48,4 миллионға жетті. 2021 жылы жас бойынша стандартталған аурушаңдық көрсеткіші (ASIR) әр 100 000 адамға 593,28-ді құрады. Зерттеушілер «жас-кезең-когорта» (APC) моделін қолданып, демографиялық өзгерістер мен уақытша трендтерді саралады. Аурушаңдықтың таза ығысуы (net drift) жылына 0,56%-ды құрады.&lt;/p&gt;\n&lt;p&gt;Ең жоғары жылдық өсім (0,886%) 25–29 жас аралығындағы топта тіркелді. 45 жасқа дейін ерлер қауіп тобында болса, одан кейін әйелдер арасында аурушаңдық көрсеткіші артады. Табысы жоғары елдерде 30–34 жас аралығындағы адамдарда өсім қарқыны 1,415%-ды құрайды. Бұл деректер аурудың жасарып бара жатқанын және еңбекке қабілетті халық үшін қауіп төндіретінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу GBD 2021 модельденген бағалауларына негізделген, бұл диагностикалық хаттамалардағы аймақтық айырмашылықтарды ескермеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Алкогольсіз майлы бауыр ауруы (АМБА) бүкіл әлемде бауырдың созылмалы ауруларының жетекші себептерінің біріне айналды, бұл негізінен семіздік, 2-типті қант диабеті және метаболикалық синдром көрсеткіштерінің өсуімен байланысты. Соңғы онжылдықтарда бұл аурулардың тез таралуына байланысты АМБА таралуы күрт өсіп, қоғамдық денсаулық сақтау жүйесі алдына күрделі мәселелер қойды. АМБА тек бауыр денсаулығына ғана емес, сонымен қатар алкогольсіз стеатогепатит, цирроз және гепатоцеллюлярлы карцинома сияқты ауыр жағдайларға өту қаупін де тудырады. АМБА таралуы кеңінен зерттелгенімен, аурушаңдық деңгейі туралы деректер шектеулі күйінде қалуда. Таралу бойынша зерттеулер ауру жүктемесін бағалауға мүмкіндік береді, бірақ жаңа жағдайлардың пайда болу жылдамдығын тіркемейді. Аурушаңдық деңгейі туралы деректер ауру құрылымын түсіну, жаңа үрдістерді анықтау және қоғамдық денсаулық сақтау шараларының тиімділігін бағалау үшін өте маңызды. Бұл деректер сонымен қатар АМБА-мен байланысты диета және физикалық белсенділік сияқты халық деңгейіндегі қауіп факторларындағы өзгерістерді де көрсетеді. Соңғы деректер АМБА дамуы мен аурушаңдығын азайтуда қоғамдық денсаулық сақтау стратегияларының, соның ішінде санитарлық-ағарту жұмыстарының, диеталық кеңестердің және өмір салтын өзгертудің рөлін атап көрсетеді. Медбикелер басқаратын пациенттерді оқыту және өмір салтын өзгертуге бағытталған бастамалар қауіпті азайтуда және дамуды бәсеңдетуде перспективалы екенін көрсетті. Бұл күш-жігер қоғамдық денсаулық сақтау бағдарламаларымен біріктірілгенде, негізгі қауіп факторларына әсер ету арқылы халықтың денсаулық көрсеткіштерін айтарлықтай жақсарта алады. Алайда, АМБА аурушаңдығы бойынша зерттеулердің көпшілігі аймақтық сипатқа ие, бұл жаһандық деректердің бөлшектенуіне әкеледі. АМБА аурушаңдығы бойынша кешенді ұзақ мерзімді деректердің жоқтығы экономикалық өзгерістер мен өмір салтының өзгеруі АМБА аурушаңдығына қалай әсер еткенін түсінуді қиындатады. Бұл зерттеу 1990 жылдан 2021 жылға дейін 204 ел мен аумақта «жас-кезең-когорта» (APC) моделін қолдану арқылы АМБА аурушаңдығының үрдістерін зерттеу арқылы осы олқылықты толтыруға бағытталған. APC моделі жас, кезең және когорта әсерін тиімді бөліп береді және аурушаңдық үрдістеріне ықпал ететін факторлар туралы құнды ақпарат ұсынады. Бұл талдау соңғы 3 онжылдықтағы АМБА үрдістері бойынша кешенді көзқарасты қамтамасыз етеді және осы өсіп келе жатқан ауру жүктемесімен күресу бойынша жаһандық қоғамдық денсаулық сақтау стратегияларын хабардар етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;АМБА бойынша жаһандық аурушаңдық деңгейі 30 жыл ішінде екі еседен астамға өсті, бұл тек жалпы таралуға емес, жаңа жағдайлар бойынша деректерге негізделген қоғамдық денсаулық сақтау стратегияларын әзірлеуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеуде Global Burden of Disease (GBD) 2021 деректер базасы пайдаланылды, ол академиялық басылымдар, аурулар тізілімдері, үй шаруашылықтарын сауалнамалау және клиникалық деректер сияқты 100 000-нан астам дереккөздерден алынған ақпаратты біріктіріп, жаһандық эпидемиологияның жан-жақты өкілдігін қамтамасыз етеді. Атап айтқанда, GBD 2021 деректер базасы стандартталған бағалау рәсімдерінің көмегімен жас топтары, жыныс және географиялық орналасу бойынша АМБА аурушаңдығының модельденген бағаларын ұсынады. АМБА ауру жүктемесінің бағалары ауруды модельдеу мета-регрессиясының 2.1-нұсқасы және кеңістіктік-уақыттық Гаусс процесінің регрессиялық модельдері көмегімен жасалды, олар Байес жүйесі арқылы жас топтары, жыныс және географиялық аймақтар бойынша өзгерістерді ескереді. Сонымен қатар, табыс, білім және туу коэффициенттерінің композиттік өлшемі болып табылатын әлеуметтік-демографиялық индекс (SDI) аймақтарды жіктеу және әлеуметтік-экономикалық дамудың әртүрлі деңгейлеріндегі үрдістерді бағалау үшін пайдаланылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мета-регрессия — әртүрлі дереккөздерден алынған деректерді біріктіріп, олардың біркелкі еместігін ескере отырып, бірыңғай бағалауды алуға мүмкіндік беретін статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;АМБА аурушаңдығының уақытша үрдістері барлық жас топтары бойынша барлық жастағы аурушаңдық көрсеткіштерін (AAIR) және жасқа қарай стандартталған аурушаңдық көрсеткіштерін (ASIR) ескере отырып, жасқа қатысты үрдістерге ерекше назар аудара отырып бағаланды. Аурушаңдық көрсеткіштері GBD 2021-де қолданылатын жаһандық халық құрылымына негізделіп, 100 000 адам-жыл үшін жас бойынша стандартталды. Сонымен қатар, әрбір жас тобындағы жағдайлар үлесін анықтау және кез келген елеулі өзгерістерді бақылау үшін аурушаңдықтың таралуы 9 жас санаты (мысалы, 15–19, 20–24, 25–29, …, 50–69, 70+ жас) бойынша зерттелді.&lt;/p&gt;\n&lt;p&gt;АМБА аурушаңдығына уақытша және ұрпақтық әсерді бағалау үшін біз APC моделін қолдандық. Бұл статистикалық тәсіл жас, кезең және когорта әсерін бөлуге мүмкіндік береді және уақыт өте келе аурушаңдықты басқаратын динамиканы тереңірек түсінуді ұсынады. APC моделі ауру көрсеткіштерінің жалпы жылдық өзгеруін білдіретін «таза дрейф» (net drift) және аурушаңдықтың жасқа қатысты өзгерістерін көрсететін «жергілікті дрейф» (local drift)ті анықтауға мүмкіндік береді. Салыстырмалы қауіптерді талдау арқылы модель уақытша және когорта әсерінің АМБА аурушаңдығына әсерін сандық бағалайды, мұнда &amp;gt;1 мәндер қауіптің өскенін, &amp;lt;1 мәндер қауіптің азайғанын көрсетеді. APC айнымалылары арасындағы коллинеарлық мәселесін жұмсарту үшін ішкі бағалау әдісі (intrinsic estimator) қолданылды, бұл олардың сызықтық тәуелділігіне қарамастан, бұл әсерлерді тәуелсіз бағалауды қамтамасыз етеді. APC талдауы GBD 2021-ден алынған АМБА аурушаңдығы бойынша 16 жас тобын (15–19-дан 90–94 жасқа дейін) және 1896–1904-тен 1996–2004-ке дейінгі 21 бір-бірінің үстіне түсетін туылу когортасын қамтитын деректерді қамтиды. Модель Ұлттық қатерлі ісік институты ұсынған веб-құрал арқылы қолданылды, визуализациялар R статистикалық бағдарламасы (4.4.2-нұсқа; R Foundation for Statistical Computing) көмегімен жасалды. Статистикалық маңыздылық P = 0,05 шекті мәнімен екі жақты тесттер көмегімен анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;APC моделі GBD 2021 модельденген деректеріне негізделген; нәтижелер әрбір пациенттің тікелей клиникалық бақылауларын емес, статистикалық бағаларды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-сурет A, B және 2-сурет, 1-кесте және S1-кестеде (қосымша сандық контент 1) келтірілген аурушаңдық деректері халық санын, жалпы жағдайлар санын, AAIR, ASIR және зерттелетін кезең ішіндегі аурушаңдық көрсеткіштерінің таза дрейфін қамтиды. 1990 жылдан 2021 жылға дейін АМБА бойынша жаһандық аурушаңдық 24 856 159 жағдайдан (95% сенім аралығы [СА]: 22 579 697,49–27 333 109,87) 48 353 272 жағдайға (95% СА: 44 229 138,51–52 358 017,44) көтерілді. 2021 жылы ASIR 100 000 адамға 593,28-ді құрады (95% СА: 542,72–643,7). Бұл кезеңде APC моделімен АМБА аурушаңдығының таза дрейфі 0,56 (95% СА: 0,53–0,6) деңгейінде бағаланды.&lt;/p&gt;\n&lt;p&gt;Аймақтық деңгейде, орташа SDI-і бар аудандарда 2021 жылы АМБА үшін ең жоғары AAIR байқалды — 100 000 адамға 695 (95% СА: 635,18–752,12), ал төмен SDI-і бар аймақтарда AAIR төменірек болды — 100 000 адамға 483 (95% СА: 434,72–535,87). Сонымен қатар, ең жоғары ASIR орташа SDI-і бар аймақтарда тіркелді — 656,97/100 000 (95% СА: 602,08–712,86), ал ең төмен ASIR (450,03/100 000; 95% СА: 412,2–488,43) жоғары SDI-і бар аймақтарда байқалды. APC моделі бойынша таза дрейф болжамдары бұл аймақтарда қарама-қарсы үрдістерді анықтады. Ұлттық деңгейде Қытай 2021 жылы АМБА аурушаңдығының ең көп санын тіркеді — 9 572 435,36 (95% СА: 8 788 951,07–10 377 517,46), одан кейін Үндістан (8 267 947,86; 95% СА: 7 485 362,61–9 068 568,69), Индонезия (2 080 647; 95% СА: 1 898 615,39–2 275 132,87), Бразилия (1 545 088,94; 95% СА: 1 422 183,53–1 665 108,04) және АҚШ (1 502 212,17; 95% СА: 1 374 518,06–1 626 330,09) тұрады. Қатарда ең жоғары AAIR — 100 000 адамға 1309,14 (95% СА: 1163,31–1470,03) байқалды, Данияда ең төмен AAIR — 100 000 адамға 341,52 (95% СА: 312,86–369,42) тіркелді. 2021 жылы Мысырда ең жоғары ASIR — 100 000 халыққа 1188,57 (95% СА: 1107,18–1268,67) байқалды, Финляндияда ең төмен ASIR — 100 000 адамға 310,17 (95% СА: 284,58–338,28) байқалды. Таза дрейф мәндері әртүрлі болды: Суданда ең жоғары мән 0,75 (95% СА: 0,69–0,8), Грузияда ең төмен мән 0,12 (95% СА: 0,04–0,2) байқалды (2-сурет, S1-кесте, қосымша сандық контент 1 және S1-сурет, қосымша сандық контент 2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;АМБА бойынша жаһандық аурушаңдық 1990 жылғы 24,8 миллион жағдайдан 2021 жылы 48,3 миллион жағдайға көтерілді, мұнда ең жоғары ASIR көрсеткіштері орташа әлеуметтік-демографиялық индексі (SDI) бар елдерде байқалуда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1990 жылдан 2021 жылға дейінгі барлық жас топтарында АМБА аурушаңдығының жаһандық өсуі 3A-суретте көрсетілген. Ең жоғары жылдық өсу 0,886% (95% СА: 0,855%–0,917%) 25–29 жас тобында байқалды. 45–49 жас тобынан кейін аурушаңдықтың өсуі біртіндеп бәсеңдейді және 90–94 жас тобында ең кіші өсу 0,107% (95% СА: -0,394%-дан 0,612%-ға дейін) жетеді. Бұл үрдіс жоғары және орташа SDI-і бар аймақтарда дәйекті болды, мұнда ең елеулі өсу жоғары SDI-і бар елдерде 30–34 жас тобында орын алды және жылдық өсу 1,415% (95% СА: 1,363%–1,467%) құрады. 15–19 жас тобы жоғары-орташа, төмен-орташа және төмен SDI-і бар аймақтарда ең үлкен өсуді көрсетті, одан кейін келесі жас топтарында біртіндеп төмендеу байқалды. 45 жасқа дейінгі ерлерде аурушаңдық деңгейі әйелдерге қарағанда жоғары болған; алайда 45 жастан кейін бұл жағдай керісінше өзгерді. Жоғары SDI-і бар елдерде ерлерде аурушаңдық деңгейінің өсуі әйелдерге қарағанда азырақ болған, төмен-орташа және төмен SDI-і бар халықта елеулі жыныстық айырмашылықтар байқалмады.&lt;/p&gt;\n&lt;p&gt;3B-суретте уақыт өте келе АМБА жағдайларының жас бойынша бөлінуіндегі өзгерістер суреттелген. 1990 жылы 30 жасқа дейінгі тұлғалар жаһандық АМБА жағдайларының жартысын құраған, ең жоғары үлес 20–24 жас тобына тиесілі болды. 2021 жылға қарай 50–69 жас тобында АМБА аурушаңдығының елеулі өсуі байқалды және бұл топ дүние жүзі бойынша ең көп таралған топқа айналды. Бұл жағдай жоғары, жоғары-орташа және орташа SDI-і бар аймақтарда дәйекті байқалды, мұнда ең елеулі өсу 50–69 жас тобында орын алды. Керісінше, төмен және төмен-орташа SDI-і бар аймақтарда жасқа қатысты үрдістерде кішігірім өзгерістер байқалды. S2-сурет (қосымша сандық контент 3) әртүрлі елдерде жасқа қатысты АМБА аурушаңдығы үлгілерінің жан-жақты шолуын ұсынады.&lt;/p&gt;\n&lt;p&gt;SDI квинтильдері бойынша топтастырылған АМБА аурушаңдығына APC әсерін талдау 4-суретте келтірілген. Жасқа қатысты үрдістер жоғары SDI-і бар аймақтарды қоспағанда, барлық SDI квинтильдері бойынша негізінен ұқсас болған. Жаһандық халықта АМБА аурушаңдық көрсеткіштері 2 жас бөлінуінің шыңын көрсетті. Бірінші шың жаһандық деңгейде 20–24 жас тобында орын алды, жоғары SDI-і бар аймақтарда ол 15–19 жас тобына ауысты, бұл топ ең жоғары аурушаңдық деңгейіне ие болды. Екінші шың 65–69 жас тобында байқалды, одан кейін жас ұлғаюымен төмендеу және 90–94 жас тобында аздаған өсу байқалды (4A-сурет). Жыныстық айырмашылықтар да бүкіл дүние жүзі бойынша айқын көрінді, 50 жасқа дейінгі ерлерде аурушаңдық деңгейі әйелдерге қарағанда айтарлықтай жоғары болды, 50 жастан кейін үрдіс керісінше өзгерді, әйелдер жоғарырақ көрсеткіштерді көрсетті, әсіресе әртүрлі SDI аймақтарында.&lt;/p&gt;\n&lt;p&gt;Жаһандық деңгейде кезең әсері уақыт өте келе АМБА қаупінің үнемі өсуін көрсетті (4B-сурет), бұл барлық аймақтар үшін тән жағдай. Жоғары-орташа және орташа SDI-і бар аймақтарды қоспағанда, кезең әсерінде минималды жыныстық айырмашылықтар байқалды, бұл аймақтарда ерлер әйелдерге қарағанда жоғары аурушаңдық деңгейін көрсетті, әсіресе 2003 жылға дейін, бұл аймақтық айырмашылықтарды атап көрсетеді. Жаһандық деңгейде когорта әсері жақында туылған когорталарда АМБА қаупінің тұрақты өсуін көрсетті, ең жоғары қауіп 2000 жылғы когортада байқалды. Жоғары, жоғары-орташа, төмен-орташа және төмен SDI-і бар аймақтарда ұқсас үрдістер байқалды. Орташа SDI аймағында 1950 жылға дейін туылған туылу когорталары салыстырмалы түрде тұрақты қауіптерді көрсетті, бірақ 1950 жылдан кейін туылғандарда қауіптің елеулі өсуі байқалды, бұл жас жас топтарына сәйкес келеді (4C-сурет). 1950 жылға дейін туылған когорталар үшін ерлерде аурушаңдық қаупі әйелдерге қарағанда айтарлықтай жоғары болған, бірақ бұл жыныстық айырмашылық кейінгі когорталарда азайды, орташа SDI аймақтарын қоспағанда, онда ерлер жоғары қауіпке ие болуды жалғастырды. S3, S4 және S5-суреттер (қосымша сандық контент 4) әртүрлі елдерде APC әсерінің АМБА аурушаңдығына әсері туралы қосымша ақпаратты ұсынады.&lt;/p&gt;\n&lt;p&gt;АМБА бүкіл дүние жүзі бойынша қоғамдық денсаулық сақтаудың негізгі мәселесіне айналды, бірінші кезекте семіздік және 2-типті қант диабеті сияқты метаболикалық аурулармен байланыстылығына байланысты. Басқа көптеген бауыр ауруларынан айырмашылығы, АМБА алкогольді тұтынумен тікелей байланысты емес, бұл оның емдеу және профилактикасын өмір салтын өзгерту және қоғамдық денсаулық сақтау араласуларына қатты тәуелді етеді. Аурудың алкогольсіз стеатогепатит және цирроз сияқты ауыррақ түрлеріне өту әлеуеті ерте анықтау және араласу қажеттілігін атап көрсетеді. Таралу бойынша зерттеулер ауру жүктемесінің белгілі бір уақыттағы жағдайын көрсетсе де, аурушаңдық деректері жаңа жағдайлардың пайда болу жылдамдығы туралы түсінік береді. Бұл ауру динамикасын түсіну, жаңа үрдістерді анықтау және профилактика шараларының тиімділігін бағалау үшін өте маңызды. АМБА бойынша кешенді аурушаңдық деректерінің жоқтығы оның эпидемиологиясын терең түсінуге және мақсатты қоғамдық денсаулық сақтау стратегияларын әзірлеуге кедергі келтірді. 1990 жылдан 2021 жылға дейін АМБА бойынша жаһандық аурушаңдық екі еседен астамға өсті — шамамен 24,9 миллион жағдайдан (95% СА: 22,6–27,3 миллион) 48,4 миллион жағдайға (95% СА: 44,2–52,4 миллион), бұл біздің GBD 2021 деректер базасын пайдалану арқылы жүргізілген зерттеуімізде хабарланған. ASIR де өсті, 2021 жылы ASIR 100 000 адамға 593,28-ді (95% СА: 542,72–643,7) құрады, бұл халықтың қартаюын ескергеннен кейін де қауіптің өсіп бара жатқанын көрсетеді. Азия мен Латын Америкасының бөліктері сияқты орташа SDI аймақтары ең жоғары ауру жүктемесін көтереді, мұнда AAIR де, ASIR де Солтүстік Америка мен Еуропа сияқты жоғары SDI аймақтарына қарағанда жоғарырақ. Мысалы, біздің нәтижелерімізге сәйкес, Қытай 2021 жылы АМБА аурушаңдығының ең көп санын тіркеді — 9,6 миллион (95% СА: 8,8–10,4 миллион), одан кейін Үндістан 8,3 миллион (95% СА: 7,5–9,1 миллион) тұрады. Ұлттық деңгейде Қатарда ең жоғары AAIR — 100 000 адамға 1309,14 (95% СА: 1163,31–1470,03) байқалды, Мысырда ең жоғары ASIR — 100 000 адамға 1188,57 (95% СА: 1107,18–1268,67) байқалды, бұл аймақтық айырмашылықтарды атап көрсетеді.&lt;/p&gt;\n&lt;p&gt;Жасқа қатысты үрдістер АМБА аурушаңдығының жаһандық деңгейдегі ең жоғары өсуі 25–29 жас тобында орын алғанын көрсетеді, жылдық өсу 0,886% (95% СА: 0,855%–0,917%) құрады, бұл біздің нәтижелерімізде суреттелген. Уақыт өте келе жас бөлінуінде елеулі өзгеріс орын алды, 50–69 жас тобы 2021 жылға қарай ең көп таралған топқа айналды, 1990 жылғы 20–24 жас сияқты жас топтарға қарағанда. Бірнеше факторлар АМБА аурушаңдығындағы байқалған үрдістерге ықпал етуі мүмкін. Олардың ішінде семіздік пен басқа метаболикалық ауытқулардың жаһандық өсуі маңызды үлес қосушы фактор болуы мүмкін. Семіздік АМБА үшін жақсы ұйымдастырылған қауіп факторы болып табылады және 381 655 қатысушыны қамтитын 21 когорта зерттеуінің мета-талдауы семіздіктің АМБА даму қаупінің 3,53 есе жоғары болуымен байланысты екенін көрсетті, мұнда BMI өсуімен қауіп дозаға байланысты артады. Бұл байланысқа сәйкес, жаһандық жүйелі шолу және мета-талдау артық салмақты және семіз халық арасында АМБА-ның жоғары таралуын хабарлады, біріктірілген бағалар сәйкесінше 69,99% және 75,27% құрады. Алайда, семіздік пен АМБА арасындағы байланыс елдер мен халықтың кіші топтары бойынша бірдей болуы екіталай. Жаһандық талдаулар соңғы онжылдықтарда артық салмақ пен семіздіктің айтарлықтай өскенін, елдер мен халық топтары бойынша айтарлықтай біркелкі еместікті көрсетті. Семіздік эпидемиясының көлемі мен уақытындағы мұндай айырмашылықтар біздің зерттеуімізде байқалған АМБА аурушаңдығының географиялық және уақытша біркелкі еместігіне ішінара ықпал етуі мүмкін. Атап айтқанда, көптеген орташа табысты жағдайларда тез урбанизация, диетаның өзгеруі және физикалық белсенділіктегі өзгерістер семіздікті тудыратын ортаға әсерді арттырған болуы мүмкін, бұл орташа SDI аймақтарында байқалған салыстырмалы түрде жоғары АМБА аурушаңдығына ықпал етуі мүмкін. Әлеуметтік-экономикалық жағдайлар халық деңгейіндегі семіздікпен байланысты қауіп факторларына әсерді одан әрі күшейтуі мүмкін, өйткені 1,2 миллионнан астам тұлғаны қамтитын жүйелі шолу және мета-талдауда төменірек махалла әлеуметтік-экономикалық мәртебесі артық салмақ пен семіздіктің жоғары ықтималдығымен байланысты болған. Соған қарамастан, бұл қатынастар күрделі және сонымен қатар денсаулық сақтауға қол жеткізу мүмкіндігі, диагностикалық қабілет, диета үлгілері және басқа метаболикалық қауіп факторларындағы айырмашылықтар әсерінде болуы мүмкін.&lt;/p&gt;\n&lt;p&gt;Жасқа қатысты үлгілер байқалған үрдістер туралы қосымша ақпарат бере алады. Біздің APC талдауымызда АМБА аурушаңдығының ең үлкен жылдық өсуі 25–29 жастағы тұлғалар арасында байқалды, сол уақытта ауру жағдайларының үлесі егде жас топтарына ауысты, 50–69 жас тобы 2021 жылы 1990 жылға қарағанда үлкенірек үлесті құрады. Үлкен перспективалы когорта зерттеуінен алынған деректер ерте есейген кезеңде салмақ өсуі АМБА-ның кейінгі қаупімен айтарлықтай байланысты екенін көрсетеді, бұл өмір бойы кумулятивті адипоз әсерінің әлеуетті маңыздылығын қолдайды. Сондықтан біздің зерттеуімізде жақында туылған когорталар арасында байқалған өсіп келе жатқан қауіп ішінара кезектесіп келе жатқан ұрпақтар бойында семіздікті тудыратын ортаға әсерді көрсете алады. Алайда, семіздікті байқалған үлгілер үшін жеткілікті түсіндіру деп санамау керек, өйткені АМБА семіз емес тұлғаларда да кездеседі және метаболикалық дисфункция, диеталық факторлар, физикалық қозғалмаушылық, генетикалық бейімділік және басқа қоршаған орта детерминанттары әсерінде болуы мүмкін. Сондықтан байқалған географиялық, жасқа қатысты және когортаға қатысты үлгілер семіздіктің өзін емес, семіздік пен басқа өзара әсер ететін метаболикалық және қоршаған орта факторларының бірлескен әсерін көрсете алады. APC моделіне негізделіп, 0,56%/жыл (95% СА: 0,53%–0,60%) оң таза дрейф зерттелетін кезеңде АМБА аурушаңдығының жалпы өсуін көрсетеді. Когорта әсері де жақында туылған когорталарда, әсіресе 1950 жылдан кейін туылғандарда жоғары салыстырмалы қауіптерді көрсетті. Бұл нәтижелер бұл когорталар қартаюымен АМБА аурушаңдығы мен оның метаболикалық қауіп факторларын үнемі бақылап отыру маңыздылығын атап көрсетеді. АМБА-ның өсіп келе жатқан жүктемесін шешу үшін жаһандық консенсус мәлімдемесінде ілгерілетілгендей, көп қырлы тәсіл қажет. Теңгерімді диета мен тұрақты физикалық белсенділікті қамтитын салауатты өмір салтын насихаттайтын жұртшылық хабардарлығы науқандары маңызды мәнге ие. Мысалы, қаныққан май мөлшері төмендігімен танымал Орта жер теңізі диетасы АМБА қаупін азайтатыны көрсетілген. Жоғары қауіпті популяцияларда, әсіресе семіздік немесе диабетпен ауыратындарда тиісті қауіпті бағалау және ерте анықтау стратегияларын жүзеге асыру АМБА-ны ерте анықтауға және басқаруға көмектесе алады. Семіздік, диабет және басқа метаболикалық қауіп факторларын басқару үшін бейімделген бағдарламалар өте маңызды, деректер салмақ жоғалту АМБА белгілерін жақсартатынын немесе қайтаратынын көрсетеді, бұл өмір салтын өзгерту маңыздылығын атап көрсетеді. Салауатты тамақ ортасын насихаттау және физикалық белсенділікті ынталандыру бойынша реттеу шаралары, мысалы, аэробикалық жаттығулармен біріктірілген төмен гликемиялық индексті Орта жер теңізі диетасы АМБА аурушаңдығын азайтуы мүмкін. АМБА аурушаңдығы мен оның қауіп факторларын үнемі мониторингтеу араласулардың тиімділігін бағалау және жаңа үрдістерді анықтау үшін маңызды. Біздің зерттеуіміз құнды ақпаратты ұсынса да, бірнеше шектеулерді мойындау керек. Біріншіден, елдер бойынша деректердің қолжетімділігі, жағдайларды анықтау және диагностикалық тәжірибедегі айырмашылықтар GBD бағаларының салыстырылуына әсер етуі мүмкін және денсаулық сақтауға қол жеткізу мүмкіндігі мен диагностикалық қабілет шектеулілігіне байланысты төмен SDI аймақтарында жеткіліксіз диагноз қойылуы көбірек болуы мүмкін. Екіншіден, семіздік пен басқа метаболикалық қауіп факторлары АМБА-ға маңызды үлес қосса да, қазіргі талдау семіздік таралуын немесе басқа метаболикалық әсерлерді уақыт өте келе өзгеретін түсіндіруші айнымалылар ретінде енгізген жоқ. Сондықтан олардың байқалған уақытша, жасқа қатысты және когортаға қатысты үлгілерге тәуелсіз үлесі тікелей сандық бағалана алмады. Соған орай, мұнда талқыланған қатынастар себеп-салдар байланыстары емес, контекстік түсіндірулер ретінде түсіндірілуі керек. Болашақта елдер бойынша семіздік, метаболикалық қауіп факторлары, өмір салты сипаттамалары және АМБА аурушаңдығы бойынша үйлестірілген деректерді біріктірген болашақ лонгитудтық зерттеулер АМБА аурушаңдығы үрдістеріндегі байқалған біркелкі еместіктің негізгі механизмдерін анықтауға көмектесуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Семіздік пен АМБА арасындағы байқалған байланыстар корреляциялық сипатқа ие; зерттеу барлық метаболикалық факторларды ескерген жоқ, сондықтан себептер туралы қорытындылар контекстік болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорытындылай келе, бұл зерттеу АМБА-ның жаһандық жүктемесінің өсіп келе жатқанын, әсіресе орташа табысты елдерде, атап көрсетеді және бұл үрдіске ықпал еткен негізгі жас, кезең және когорта әсерін анықтайды. Нәтижелер АМБА-мен байланысты өзгертілуі мүмкін қауіп факторларын шешу және оның аурушаңдығын азайту үшін бағытталған қоғамдық денсаулық сақтау стратегияларын жүзеге асыру маңыздылығын атап көрсетеді. Алдағы зерттеулер АМБА-ның түпкі себептерін одан әрі зерттеуі және осы өсіп келе жатқан қоғамдық денсаулық сақтау мәселесінің әсерін азайтуда профилактикалық және терапиялық тәсілдердің табыстылығын бағалауы керек.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f1.jpg\" alt=\"NAJBP сырқаттанушылық көрсеткіштерінің жаһандық өсуі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;NAJBP сырқаттанушылық көрсеткіштерінің жаһандық өсуі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;NAJBP сырқаттанушылық көрсеткіштерінің жаһандық өсуі. (A) 1990-2021 жылдар аралығындағы 5 SDI аймағы бойынша NAJBP-мен байланысты өлім-жітім үлесінің әр аймақтағы халық үлесіне қатынасының өзгеруі. (B) 1990-2021 жылдар аралығындағы SDI квинтильдері бойынша NAJBP сырқаттанушылық көрсеткіштерінің трендтері. APC = жас-кезең-когорта, NAJBP = алкогольсіз майлы бауыр ауруы, SDI = әлеуметтік-демографиялық индекс.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f2.jpg\" alt=\"Таза ауытқу (A), AAIR\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Таза ауытқу (A), AAIR&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Таза ауытқу (A), AAIR (B) және ASIR (C) 204 ел мен аумақ бойынша. (A) NAJBP сырқаттанушылық көрсеткіштеріндегі таза ауытқуларды көрсететін әлем картасы, күнтізбелік жылдар мен туылу когорталарына байланысты трендтерді көрсетеді. NAJBP сырқаттанушылық көрсеткіші үшін жаһандық таза ауытқу 0,564% (95% CI: 0,530–0,598) құрады. (B) 2021 жылғы NAJBP үшін AAIR көрсететін әлем картасы, 100 000 адамға шаққандағы 612,74 (95% CI: 560,48–663,49) жаһандық AAIR-мен. (C) 2021 жылғы NAJBP үшін ASIR әлем картасы, 100 000 адамға шаққандағы 593,28 (95% CI: 542,72–643,7) жаһандық ASIR-мен. AAIR = барлық жастағы сырқаттанушылық деңгейі, ASIR = жас бойынша стандартталған сырқаттанушылық деңгейі, CI = сенімділік аралығы, NAJBP = алкогольсіз майлы бауыр ауруы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f3.jpg\" alt=\"1990-2021 жылдар аралығындағы SDI квинтильдері бойынша сырқаттанушылық көрсеткіштерінің жергілікті ауытқулары және NAJBP\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1990-2021 жылдар аралығындағы SDI квинтильдері бойынша сырқаттанушылық көрсеткіштерінің жергілікті ауытқулары және NAJBP жағдайларының жас бойынша таралуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1990-2021 жылдар аралығындағы SDI квинтильдері бойынша сырқаттанушылық көрсеткіштерінің жергілікті ауытқулары және NAJBP жағдайларының жас бойынша таралуы. (A) 1990-2021 жылдар аралығындағы 16 жас тобы (15–19, 20–24, 25–29, …, 90–94 жас) бойынша NAJBP сырқаттанушылық көрсеткіштерінің жергілікті ауытқулары (жас-кезең-когорта модельдері бойынша бағаланған). Нүктелер мен штрихталған аймақтар сырқаттанушылық көрсеткішінің жылдық пайыздық өзгеруін (%/жыл) тиісті 95% сенімділік аралығымен (CI) білдіреді. (B) 1990-2021 жылдар аралығындағы әртүрлі жас топтары (15–19, 20–24, 25–29, 30–34, 35–39, 40–44, 45–49, 50–69, 70+ жас) бойынша NAJBP сырқаттанушылықтың салыстырмалы таралуының уақыт өте келе өзгеруі. ASIR = жас бойынша стандартталған сырқаттанушылық деңгейі, CI = сенімділік аралығы, NAJBP = алкогольсіз майлы бауыр ауруы, SDI = әлеуметтік-демографиялық индекс.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f4.jpg\" alt=\"Жастың, кезеңнің және когортаның SDI квинтильдері бойынша NAJBP сырқаттанушылығына әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жастың, кезеңнің және когортаның SDI квинтильдері бойынша NAJBP сырқаттанушылығына әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Жастың, кезеңнің және когортаның SDI квинтильдері бойынша NAJBP сырқаттанушылығына әсері. (A) Кезеңдік ауытқуларға түзетілген, сырқаттанушылықтың (100 000 адам-жыл үшін) түзетілген бойлық жас қисықтарымен берілген жастық әсерлер. (B) 1990–1994 жылдардағы жасқа қатысты көрсеткіштердің (2000–2004 жылдар референттік кезең ретінде) 2015–2019 жылдарға қатынасы ретінде есептелген сырқаттанушылықтың салыстырмалы қаупі (сырқаттанушылық деңгейінің қатынасы) арқылы көрсетілген кезеңдік әсерлер. (C) 1950 жылғы когорта референттік ретінде алынған, 1900 және 2000 жылдардағы когорталар арасындағы жасқа қатысты көрсеткіштердің қатынасы ретінде есептелген сырқаттанушылықтың салыстырмалы қаупімен берілген когорталық әсерлер. Нүктелер мен штрихталған аймақтар сырқаттанушылық көрсеткіштерін немесе қатынастарын тиісті 95% сенімділік аралығымен (CI) бірге көрсетеді. CI = сенімділік аралығы, NAJBP = алкогольсіз майлы бауыр ауруы, SDI = әлеуметтік-демографиялық индекс.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Бауыр&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ауруларының&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өсуі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;GBD 1990-2021&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректерін&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдау&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жаңа жағдайлар&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;екі есе өсті&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;45 жасқа дейін&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алдын алу&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маңызды&lt;/text&gt;&lt;/svg&gt;&lt;/
