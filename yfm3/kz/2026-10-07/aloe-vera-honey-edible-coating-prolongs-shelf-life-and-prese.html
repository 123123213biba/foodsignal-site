        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"221\" cy=\"165\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"619\" cy=\"193\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · GELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Алоэ вера гелі кесілген&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мангоны бүлінуден қалай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;сақтайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f1.jpg\" alt=\"Үлгілерді дайындаудың схемалық диаграммасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Үлгілерді дайындаудың схемалық диаграммасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Кесілген жемістер ылғалдың булануы мен микробтардың әсерінен тез бүлінеді. Зерттеу көрсеткендей, алоэ вера гелінен жасалған жұқа қабықша сенімді тосқауыл болады. Бұл әдіс мангоны 4°C-тан төмен температурада 20 күнге дейін дәрумендері мен құрылымын сақтай отырып сақтауға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;100% алоэ вера гелі ылғал жоғалтуды 48%-ға, бүлінуді 50%-ға азайтады.&lt;/li&gt;\n&lt;li&gt;Бал қаптама құрамындағы полисахаридтік матрицаның қорғаныш қасиетін төмендетеді.&lt;/li&gt;\n&lt;li&gt;Қаптама 4°C температурада С дәрумені мен антиоксиданттарды сақтайды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Қорғаныш қаптамасын жасау үшін зерттеушілер 1% глицерин (пластификатор), 1,5% карбоксиметилцеллюлоза (қабықша түзуші), 1% сірке қышқылы (pH деңгейін төмендету үшін) және 2% метанол қосылған алоэ вера гелін қолданды. Қоспа 70°C-қа дейін қыздырылып, манго кесектері ерітіндіге 2 минутқа батырылды. Тәжірибеде балдың әртүрлі концентрациясы салыстырылды, бірақ 100% алоэ вера гелі ең жақсы нәтиже көрсетті.&lt;/p&gt;\n&lt;p&gt;Таза алоэ вера гелі 20 күн сақтау мерзімі ішінде бақылау үлгілерімен салыстырғанда салмақ жоғалтуды 48%-ға, ал өнімнің бүлінуін 50%-ға азайтты. Талдау көрсеткендей, балдың жоғары гигроскопиялық қасиеті алоэмен араласқанда полисахаридтік матрицаның құрылымын бұзып, қаптаманың қорғаныш қасиетін төмендетеді. Таза алоэны қолдану фенолдарды, флавоноидтарды және С дәруменін жақсы сақтауға мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу Бангладештегі жергілікті манго сұрыпында жүргізілген, сондықтан нәтижелер басқа жеміс түрлері үшін өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;DMRT — Дунканның көптік салыстыру тесті, FN — қаттылық, HPMC — гидроксипропилметилцеллюлоза, LDPE — төмен тығыздықтағы полиэтилен, PAL — фенилаланин-аммиак-лиаза, PCA — микроорганизмдерді санауға арналған агар, PDA — картоп-декстрозалы агар, QC — сапа бақылауы, TA — титрленетін қышқылдылық, TFC — флавоноидтардың жалпы мөлшері, TPC — полифенолдардың жалпы мөлшері, TSS — еритін құрғақ заттардың жалпы мөлшері.&lt;/p&gt;\n&lt;p&gt;Манго (Mangifera indica) — Anacardiaceae тұқымдасына жататын, бүкіл әлемде кеңінен өсірілетін, экономикалық маңызы зор тропикалық жеміс. Бангладеште 2025 жылы шамамен 139 мың гектар жерде өсірілген манго өнімі 1872 мың метрикалық тоннадан асты. Манго климактериялық жемістер санатына жатады — бұл макронутриенттер (көмірсулар, талшықтар), микронутриенттер (A, B9, C, K дәрумендері) және минералдар (темір, магний, кальций, калий, мырыш), сондай-ақ антиоксиданттар (каротиноидтар, фенолдар, флавоноидтар) көзі болып табылады және тез бұзылатын өнім. Кесілген жемістер жиналғаннан кейін су белсенділігі жоғары болғандықтан, микробтық және физиологиялық бүлінуге бейім келеді, бұл оларды пайдалану мен экспорттауды шектейді. Сондықтан тиімді, нәрлі және тұрақты сақтау әдістері қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу кесілген мангоны сақтауда алоэ вера мен бал жабындарының әсерін салыстырады, өйткені олардың үйлесімі балдың гигроскопиялығына байланысты жабынның тұрақтылығын жақсартуы немесе керісінше, әлсіретуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өсімдік тектес заттар мен тағамдық жабындар перспективалы болып табылады. Алоэ вера мен бал антиоксиданттық, микробқа қарсы, зеңге қарсы қасиеттерге, сондай-ақ ылғал мен көмірқышқыл газын (CO₂) ұстап тұру қабілетіне ие. Алоэ вера (су, дәрумендер, глюкоманнандар, стеролдар, амин қышқылдары) бактериялардың өсуін шектейді, жемістердің тыныс алуын бақылайды және тотығу нәтижесінде пайда болатын қараюды азайтады. Аралас гүл балы табиғи антиоксидант болып табылады және синтетикалық аналогтарды алмастыра алады. Алдыңғы жұмыстар алоэ вера гелі мен бал жабыны жемістің дәмін, иісін және текстурасын өзгертпейтінін көрсетті. Алайда, кесілген мангоны сақтауда осы заттар үйлесімінің әлеуеті туралы мәліметтер жеткіліксіз. Бұл зерттеу кесілген жергілікті мангода таза және аралас алоэ вера мен бал жабындарын алғашқы жүйелі салыстыруды ұсынады.&lt;/p&gt;\n&lt;p&gt;Толық піскен манголар (жергілікті Ashwina сорты, алтын-сары түсті жұмсақ) 2025 жылдың сәуір айының ортасынан маусым айының ортасына дейін Бангладештің Дакка қаласындағы Kanchan базарынан алынды. Алоэ вера (Barbadensis Miller сорты), аралас гүл балы және төмен тығыздықтағы полиэтилен (LDPE) пакеттері де жергілікті базардан сатып алынды. Ас үй құралдары 70% этил спирті ерітіндісімен зарарсыздандырылды. Манголар жуылып, тазартылып, текше түрінде (2 × 2 × 2 см) кесілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жабындарды дайындау үшін алоэ вера гелі, аралас гүл балы, глицерин (1%), карбоксиметилцеллюлоза (CMC, 1,5%), сірке қышқылы (1%) және метанол (2%) пайдаланылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алоэ вера гелі жапырақтардан бөлініп, блендерде ұсақталды (18 000 айн/мин, 3 минут, бөлме температурасында) және 850 мкм тордан өткізілді. Экстракт 63°C-та 15 минут бойы пастерленді. Ерітінділер глицерин, CMC, сірке қышқылы және метанол қосылып дайындалды, 70°C-қа дейін қыздырылды және тез суытылды. Алоэ вера мен балдың бес түрлі қатынасы (100:0, 75:25, 50:50, 25:75, 0:100) сыналды (1-кесте).&lt;/p&gt;\n&lt;p&gt;Mango текшелері ерітіндіге 2 минутқа батырылды, содан кейін бөлме температурасында 20 минут бойы кептірілді. Барлығы 350 жеміс пайдаланылды. Үлгілер LDPE пакеттерінде &amp;gt; 4°C температурада және 85% салыстырмалы ылғалдылықта 20 күн бойы сақталды. Әрбір өңдеу үш биологиялық қайталанымға ие болды. Әр 5 күн сайын сапасы бағаланды (pH, титрленетін қышқылдылық, TSS, C дәрумені, фенолдар, флавоноидтар, сенсорлық бағалау, микробиологиялық талдау).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау және эксперименттік сипатқа ие; нәтижелер манго сорты мен сақтау шарттарына байланысты. Үй жағдайында консервациялауға арналған нұсқаулық емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық топтарда ылғал жоғалтудың айтарлықтай (p ≤ 0,05) өсуі байқалды. 20-күні T₁ тобында (100% алоэ вера) ылғал жоғалту 14,28% ± 0,42% құрады, бұл бақылау тобына (T₀, 27,80% ± 0,69%) қарағанда айтарлықтай төмен. Бұл жабын газ алмасуды шектейтін және жемістің қартаюын баяулататын жартылай өткізгіш пленка түзілетінін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;100% алоэ вера жабыны (T₁) ылғалды сақтау және қаттылықты сақтау бойынша ең жақсы нәтижелерді көрсетіп, бал қоспаларынан басым түсті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қаттылық пенетрометр көмегімен бағаланды (3,5 мм зонд). 100% алоэ вера (T₁) және T₄ қоспасы (75% алоэ вера + 25% бал) қаттылықты жақсырақ сақтауды қамтамасыз етті (&amp;gt; 90% және &amp;gt; 71%). Балдың гигроскопиялық қанттары полисахарид матрицасын әлсіреткен болуы мүмкін, сондықтан T₂, T₃ және T₅ үлгілері тезірек жұмсарды.&lt;/p&gt;\n&lt;p&gt;Еритін құрғақ заттар (TSS) мөлшері сақтау барысында өсті. Өңделген үлгілерде TSS өсуі бақылауға қарағанда азырақ байқалды, бұл тыныс алу процесінің баяулағанын көрсетеді. Титрленетін қышқылдылық (TA) 5, 10, 15 және 20-күндері сәйкесінше 20%, 27%, 68,9% және 65%-ға төмендеді. Дәм тепе-теңдігін көрсететін TSS/TA қатынасы өңделген үлгілерде жоғарырақ болды.&lt;/p&gt;\n&lt;p&gt;Сақтау уақытында pH мәндері сәл өсті. Алоэ вера мен балмен өңдеу бақылауға қарағанда pH тұрақтылығын сақтауға көмектесті, бұл бүліну процестерінің баяулағанын көрсетеді.&lt;/p&gt;\n&lt;p&gt;C дәруменінің концентрациясы сақтау барысында айтарлықтай төмендеді. 20-күнге қарай бақылау тобы (T₀) 23,8 мг/100 г C дәруменін жоғалтты, ал T₁ тобы (100% алоэ вера) 7,91 мг/100 г жоғалтты, бұл жабынның қорғаныс әсерін растайды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f1.jpg\" alt=\"Үлгілерді дайындаудың схемалық диаграммасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Үлгілерді дайындаудың схемалық диаграммасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f2.jpg\" alt=\"Алоэ вера және аралас гүл балынан жасалған жабынның тоңазытқышта сақтау кезінде шырынның жоғалуына әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Алоэ вера және аралас гүл балынан жасалған жабынның тоңазытқышта сақтау кезінде шырынның жоғалуына әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Алоэ вера және аралас гүл балынан жасалған жабынның тоңазытқышта сақтау кезінде шырынның жоғалуына әсері. Мәндер орташа ± стандартты ауытқу (n = 3) түрінде берілген. Әртүрлі жоғарғы индексті әріптер бірдей сақтау мерзіміндегі өңдеу нұсқалары арасындағы статистикалық маңызды айырмашылықтарды көрсетеді (p &amp;lt; 0,05), DMRT тестіне сәйкес. Екі факторлы дисперсиялық талдау (ANOVA) өңдеудің (T), уақыттың (D) және олардың өзара әрекеттесуінің (T × D) p &amp;lt; 0,05 деңгейінде маңызды әсерін көрсетті (егер басқаша көрсетілмесе). T0 — өңделмеген бақылау үлгісі (манго); T1 — 100% алоэ вера жабыны бар манго; T2 — 100% аралас гүл балы жабыны бар манго; T3 — 50% аралас гүл балы және 50% алоэ вера жабыны бар манго; T4 — 25% аралас гүл балы және 75% алоэ вера жабыны бар манго; T5 — 75% аралас гүл балы және 25% алоэ вера жабыны бар манго.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f5.jpg\" alt=\"Сақтау мерзімі мен жеуге жарамды жабын түрлерінің мангоның айнымалы белгілерімен, биохимиялық, микробиологиялық және физ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сақтау мерзімі мен жеуге жарамды жабын түрлерінің мангоның айнымалы белгілерімен, биохимиялық, микробиологиялық және физиологиялық параметрлерімен өзара байланысының Пирсон корреляциялық талдауы (p ≤ 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сақтау мерзімі мен жеуге жарамды жабын түрлерінің мангоның айнымалы белгілерімен, биохимиялық, микробиологиялық және физиологиялық параметрлерімен өзара байланысының Пирсон корреляциялық талдауы (p ≤ 0,05). FN — қаттылық; ML — ылғалдың жоғалуы; TA — титрленетін қышқылдылық; TFC — жалпы флавоноидтар мөлшері; TMY — зең және ашытқы саңырауқұлақтарының жалпы саны; TPC — жалпы фенолдар мөлшері; TSS — жалпы еритін құрғақ заттар; TSS/TA қатынасы — дәм индексі; TVC — тірі микроорганизмдердің жалпы саны; Vit C — С дәрумені.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f6.jpg\" alt=\"Сақтау мерзімі мен жеуге жарамды жабын түрлерінің мангоның айнымалы белгілерімен, биохимиялық, микробиологиялық және физ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сақтау мерзімі мен жеуге жарамды жабын түрлерінің мангоның айнымалы белгілерімен, биохимиялық, микробиологиялық және физиологиялық параметрлерімен өзара байланысының басты компоненттер талдауы (PCA).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сақтау мерзімі мен жеуге жарамды жабын түрлерінің мангоның айнымалы белгілерімен, биохимиялық, микробиологиялық және физиологиялық параметрлерімен өзара байланысының басты компоненттер талдауы (PCA). FN — қаттылық; ML — ылғалдың жоғалуы; TA — титрленетін қышқылдылық; TFC — жалпы флавоноидтар мөлшері; TMY — зең және ашытқы саңырауқұлақтарының жалпы саны; TPC — жалпы фенолдар мөлшері; TSS — жалпы еритін құрғақ заттар; TSS/TA қатынасы — дәм индексі; TVC — тірі микроорганизмдердің жалпы саны; Vit C — С дәрумені.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кесілген&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мангоның тез&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бүлінуі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алоэ вера&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гелімен қаптау&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бүліну 50&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пайызға азайды&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жемістерді&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сақтаудың&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;экологиялық&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әдісі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p cla
