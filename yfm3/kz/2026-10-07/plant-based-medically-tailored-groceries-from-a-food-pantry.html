        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"277\" cy=\"151\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"663\" cy=\"228\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Азық-түлік себеті дәрінің&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;орнын баса ала ма: ұзақ&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мерзімді диета тәжірибесі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Ғалымдар табысы төмен адамдар үшін апта сайынғы өсімдік тектес азық-түлік жиынтықтарының денсаулыққа әсерін талдады. 2,7 жыл ішінде қатысушылар жаңа піскен көкөністер, жемістер, бұршақ дақылдары мен дәнді дақылдарды алып отырды. Мұндай тәсіл алынған жиынтықтар санына байланысты қан қысымы мен дене салмағының индексін төмендетуге көмектесетіні анықталды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Әр 100 азық-түлік жиынтығы диастолалық қысымды 3,21 мм с.б.-ға төмендетеді.&lt;/li&gt;\n&lt;li&gt;Әр 100 жиынтық үшін орташа салмақ жоғалту 2,63 кг-ды құрады.&lt;/li&gt;\n&lt;li&gt;Гипертониямен ауыратын науқастарда систолалық қысым 5,83 мм с.б.-ға төмендеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу 2019-2025 жылдар аралығында MGH Revere Food Pantry азық-түлік орталығының базасында жүргізілді. Таңдамаға USDA 2020 ұсынымдарына сәйкес диетолог құрастырған апта сайынғы азық-түлік жиынтықтарын алған 68 ересек адам кірді. Рацион жаңа піскен жемістер, көкөністер, консервіленген бұршақ дақылдары, жаңғақ пастасы және дәнді дақылдарды қамтып, күніне үш мезгіл тамақтануды қамтамасыз етті.&lt;/p&gt;\n&lt;p&gt;Нәтижелерді бағалау үшін жас, жыныс және COVID-19 пандемиясының әсерін ескеретін аралас эффектілі сызықтық модельдер қолданылды. Әрбір алынған 100 азық-түлік жиынтығы (MTGs) диастолалық қысымның 3,21 мм с.б. және салмақтың 2,63 кг-ға төмендеуіне әкелді. Бастапқы көрсеткіштері жоғары қатысушыларда әсер айқынырақ болды: систолалық қысым 5,83 мм с.б., ал диастолалық қысым 6,23 мм с.б.-ға төмендеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеуде бақылау тобы болмады және деректер клиникалық өлшемдерге негізделді, олар өзгермелі болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;«Тамақ — бұл дәрі» (Food Is Medicine, FIM) тұжырымдамасы аясындағы араласулар, мысалы, медициналық көрсеткіштерді ескере отырып азық-түлік жиынтықтарымен қамтамасыз ету (MTG), мамандандырылған тамақтану және көкөністерге арналған рецепттер рацион сапасын жақсарту және азық-түлік қауіпсіздігінің жоқтығы деңгейін төмендету қабілетін көрсетеді. Алайда, FIM-араласуларының жүрек-қантамыр, бүйрек және метаболикалық (CKM) денсаулық көрсеткіштеріне әсері әртүрлі болып қалуда.&lt;/p&gt;\n&lt;p&gt;Бүгінгі күнге дейін FIM бойынша жүргізілген зерттеулердің көпшілігі бірнеше апта немесе аймен шектелген және олардың аз бөлігі ғана нутритивті сапаны оңтайландыруға бағытталған. Бұл есеп өсімдік негізіндегі MTG әсерін 3 жылға жуық бақылау барысында бағалауымен ерекшеленеді.&lt;/p&gt;\n&lt;p&gt;Өсімдік негізіндегі FIM-араласулары перспективалы; CKM денсаулығын жақсарту үшін болашақ бағдарламалар ұзағырақ мерзімді болуы керек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу көрсеткендей, 3 жылға жуық уақыт ішінде өсімдік негізіндегі азық-түлік жиынтықтарын (MTG) алу диастолалық қан қысымының, дене салмағының және ДСИ-дің дозаға тәуелді төмендеуіне әкелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Азық-түлік қауіпсіздігінің жоқтығы тамақтану сапасының төмендігімен және жүрек-қантамыр, бүйрек және метаболикалық (CKM) денсаулықтың нашарлауымен, соның ішінде гипертензия, семіздік және 2-типті қант диабетінің жоғары көрсеткіштерімен байланысты. Соңғы жылдары азық-түлік қауіпсіздігін қамтамасыз етуге, созылмалы аурулардың алдын алуға және емдеуге бағытталған MTG, мамандандырылған тамақтану және рецепттер сияқты FIM-араласулары кең тарады. Олар рацион сапасын жақсартқанымен, CKM денсаулығына әсері әртүрлі. Доза әсерін зерттеу FIM үшін де, фармацевтикалық араласулар үшін де өте маңызды. FIM дозасының төрт негізгі факторы — жиілік, сапа, мөлшер және ұзақтық. FIM-араласуларын ең құнарлы азық-түліктерді көбірек мөлшерде және ұзағырақ уақыт бойы ұсыну арқылы күшейтуге болады. Бұл зерттеудің мақсаты азық-түлік банкінен алынған жиі, құнарлы және көлемді өсімдік негізіндегі MTG жиынтықтары мен азық-түлік қауіпсіздігі төмен ересектердегі ұзақ мерзімді CKM нәтижелері арасындағы дозаға тәуелді байланысты зерттеу болды.&lt;/p&gt;\n&lt;p&gt;MGH Revere (Массачусетс) азық-түлік банкі қоғамдық денсаулық сақтау орталығында орналасқан және апта сайынғы өсімдік негізіндегі MTG-мен қамтамасыз етеді. MTG алушы науқастар негізінен ағылшын тілін білмейтін, әлеуметтік-экономикалық жағдайы төмен және мемлекеттік медициналық сақтандыруды пайдаланатын тұлғалар. Диетолог бастапқыда АҚШ Ауыл шаруашылығы министрлігінің 2020 жылғы диеталық ұсынымдары негізінде өнім таңдауды бағыттады және әр отбасы мүшесін аптасына күніне үш рет тамақпен қамтамасыз етті. MTG құрамында жаңа піскен жемістер мен көкөністер, консервіленген бұршақ дақылдары және/немесе жаңғақ пастасы, сондай-ақ тұтас дәнді өнімдер бар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ретроспективті зерттеу: тікелей себеп-салдарлық байланысты орнату мүмкіндігін шектейтін бақылау тобынсыз, көмек алған науқастар деректерін талдау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл ретроспективті зерттеу жүкті емес ересектерді (≥18 жас) қамтыды, олар: 1) 2019 жылғы 20 желтоқсаннан 2025 жылғы 1 сәуірге дейін кемінде 26 MTG алған; 2) кемінде бір бастапқы CKM өлшеміне ие болған (бірінші MTG алғанға дейін 12 ай ішінде; өлшемдер медианасы = 4); 3) кемінде бір бақылау CKM өлшеміне ие болған (бірінші MTG алғаннан кейін 6 ай өткен соң және соңғы MTG алғаннан кейін 3 ай өткен соң; өлшемдер медианасы = 8). Бірінші реттік нәтижелер систолалық және диастолалық қан қысымы мен гликирленген гемоглобинді (HbA1c) қамтыды. Екінші реттік нәтижелер ДСИ және дене салмағын қамтыды.&lt;/p&gt;\n&lt;p&gt;Біз нәтижелердің ұзақ мерзімді көрсеткіштерін электронды медициналық карталардан алдық. Бой мен салмақ деректері Daymont және басқалардың алгоритмі көмегімен тазартылды. Аралас эффектілі сызықтық модельдер алынған MTG мөлшері мен нәтижелердің өзгеру қарқынындағы айырмашылықтар арасындағы байланысты бағалады. 1-модель (түзетілмеген) алынған MTG (жүздеген қаптамада), зерттеу кезеңі және олардың өзара әсері үшін тұрақты эффектілерді қамтыды. 2-модель қосымша жас, жыныс, бастапқы мәндер және өлшемдер арасындағы уақытқа қарай түзетілді. 3-модель қосымша COVID-19 пандемиясы кезеңдерін ескерді.&lt;/p&gt;\n&lt;p&gt;68 ересек қатысушы арасында (Сурет) 47-сі (69,1%) әйелдер, орташа жас 57,4 (13,7) жасты құрады. 50-інде (80,6%) бастапқы ДСИ 25 немесе одан жоғары болған; орташа систолалық қан қысымы — 130,3 (20,0) мм сын. бағ.; орташа диастолалық қан қысымы — 76,5 (8,4) мм сын. бағ.; орташа HbA1c — 6,9% (1,8%). Орташа есеппен қатысушылар 2,7 жыл бойы әр 1,4 апта сайын MTG алған (Кесте 1). Әр 100 алынған MTG үшін диастолалық қан қысымының өзгеру қарқыны толық түзетілген модельдерде 3,21 мм сын. бағ.-на (95% CI, -4,89-дан -1,52-ге дейін) төмендеген (Кесте 2). Жалпы топта систолалық қан қысымы немесе HbA1c-тің елеулі өзгерістері байқалмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шектеу: бақылау тобының болмауы және өлшем шарттарына қарай өзгеруі мүмкін кеңселік биометриялық өлшемдерді пайдалану.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сезімталдықты талдауда бастапқыда жоғары систолалық қан қысымы (≥130 мм сын. бағ.) бар тұлғалар арасында әр 100 MTG үшін систолалық қан қысымының өзгеру қарқыны 5,83 мм сын. бағ.-на (95% CI, -10,09-дан -1,57-ге дейін) төмендеген; жоғары диастолалық қан қысымы (≥80 мм сын. бағ.) барлар арасында диастолалық қан қысымының өзгеру қарқыны 6,23 мм сын. бағ.-на (95% CI, -9,25-тен -3,32-ге дейін) төмендеген. Әр 100 MTG үшін ДСИ өзгеру қарқыны 1,04 кг/м²-ге (95% CI, -1,50-ден -0,58-ге дейін) және салмақтың өзгеру қарқыны 2,63 кг-ға (95% CI, -3,73-тен -1,53-ке дейін) төмендеген.&lt;/p&gt;\n&lt;p&gt;Бұл ретроспективті зерттеуде біз диастолалық қан қысымы, салмақ және ДСИ көрсеткіштерінің дозаға тәуелді жақсарғанын байқадық. Бастапқыда жоғары көрсеткіштері бар тұлғаларда систолалық қан қысымының да жақсарғаны байқалды. HbA1c деңгейінде елеулі өзгерістердің болмауы басқа FIM зерттеулерімен сәйкес келеді, бұл емделуге бейілділік және дене белсенділігі сияқты көптеген факторлардың әсерімен байланысты болуы мүмкін. Болашақ зерттеулер рандомизацияланған дизайнды және биометриялық көрсеткіштерді өлшеудің дәлірек әдістерін пайдалануы керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тамақтану мен&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;созылмалы&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аурулар&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;2,7 жылдық&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;азық-түлікпен&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қамту талдауы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қан қысымы мен&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;салмақтың&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;төмендеуі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;салауатты&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тамаққа ұзақ&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мерзімді&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қолжетімділік&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Preventing chronic disease журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Preventing chronic disease (Europe PMC)&lt;/td&gt;\n&lt;td&gt;plant_based&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Mirsky JB, Wu AJ, Luo M, Perkins ME, Locascio JJ, Hivert MF, Burgun R, Schuckel MF, Taveras EM, Fiechtner L.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13632926\" target=\"_blank\" re
