        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;соединяет кухню и науку: пробует, измеряет, пишет технологические карты&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-rd_chef.jpg\" alt=\"Шеф-технолог (R&amp;amp;D-шеф)\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;соединяет кухню и науку: пробует, измеряет, пишет технологические карты&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;кулинария, физика кухни, документирование&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Білім&lt;/td&gt;\n&lt;td&gt;Профильное образование в области пищевых технологий, биотехнологий, химии или физики.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қайда жұмыс істейді&lt;/td&gt;\n&lt;td&gt;Ресторанные холдинги, пищевые производства, R&amp;amp;D-лаборатории, фудтех-стартапы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-thermal.html\"&gt;Пісіру технологиялары&lt;/a&gt;, &lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"ne-istejdi\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#ne-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не істейді&lt;/span&gt;&lt;/a&gt;Не істейді&lt;/h2&gt;\n&lt;p&gt;Шеф-технолог (R&amp;amp;D-шеф) — гастрономия мен тамақ ғылымының тоғысында аспаздық процестерді жобалайтын маман. Ол шығармашылық идеяларды қайталанатын технологиялық хаттамаларға айналдырып, өнімнің дәмі, құрылымы мен қауіпсіздігін қамтамасыз етеді.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Негізгі міндет — стандартталған технологиялық карталарды жасау. Тәжірибеде бұған мыналар кіреді:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Рецептураларды әзірлеу: ингредиенттердің функционалдық қасиеттерін ескере отырып.&lt;/li&gt;\n&lt;li&gt;Процестерді оңтайландыру: сақтау мерзімін ұзарту немесе өнімнің гликемиялық жауабын өзгерту үшін өңдеу параметрлерін (температура, қысым) таңдау.&lt;/li&gt;\n&lt;li&gt;Сапаны бақылау: дегустациялар өткізу және аспаптық талдау (мысалы, қуырылған өнімдердегі пиразиндерді анықтау үшін биосенсорлар).&lt;/li&gt;\n&lt;li&gt;Тәуекелдерді бағалау: шикізатты ауыр металдар немесе микробиологиялық қауіпсіздік тұрғысынан талдау.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Кәсіп аспаздық шеберлік пен инженерлік көзқарасты талап етеді:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Өңдеу әдістері: су-вид, экструзия, сублимация, ультрадыбыстық эмульсия.&lt;/li&gt;\n&lt;li&gt;Аналитикалық құралдар: электронды мұрындар (биосенсорлар), құрылым мен ылғалдылықты өлшеу әдістері.&lt;/li&gt;\n&lt;li&gt;Құжаттау: HACCP, ISO 22000 хаттамаларын жасау.&lt;/li&gt;\n&lt;li&gt;Сенсорлық талдау: ISO 5492 стандарттары бойынша дәм мен иісті бағалау.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khajda-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#khajda-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу керек&lt;/h2&gt;\n&lt;p&gt;Кәсіпке жол әдетте тамақ технологиялары немесе биотехнологиялар саласындағы білім арқылы өтеді. Физика мен химия бойынша базалық білім шикізат құрылымының өзгеру процестерін терең түсінуге көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"khajda-zhumys-isteu-zhaene-khalaj-oesu\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#khajda-zhumys-isteu-zhaene-khalaj-oesu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда жұмыс істеу және қалай өсу&lt;/span&gt;&lt;/a&gt;Қайда жұмыс істеу және қалай өсу&lt;/h2&gt;\n&lt;p&gt;R&amp;amp;D-шефтер ірі мейрамхана холдингтерінде, тамақ өндірісі кәсіпорындарында, стартаптарда және ғылыми-зерттеу зертханаларында жұмыс істейді. Мансаптық өсу кіші технологтан инновациялар департаментінің басшысына дейін болуы мүмкін.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%83%D0%BD%D1%82%D0%BE%D0%BB%D0%B0%2C_%D0%A2%D1%83%D0%BE%D0%BC%D0%BE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Сунтола, Туомо — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Tuomo_Suntola,_2014.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Riikka Puurunen, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"соединяет кухню и науку: пробует, измеряет, пишет технологические карты"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Шеф-технолог (R&amp;D-шеф)","description":"соединяет кухню и науку: пробует, измеряет, пишет технологические карты","vcsPath":"reference/professions/prof-rd_chef.md"},"headings":[{"title":"Не істейді","href":"reference/professions/prof-rd_chef.html#ne-istejdi","level":2},{"title":"Типтік міндеттер","href":"reference/professions/prof-rd_chef.html#tiptik-mindetter","level":2},{"title":"Дағдылар мен құралдар","href":"reference/professions/prof-rd_chef.html#daghdylar-men-khuraldar","level":2},{"title":"Қайда оқу керек","href":"reference/professions/prof-rd_chef.html#khajda-okhu-kerek","level":2},{"title":"Қайда жұмыс істеу және қалай өсу","href":"reference/professions/prof-rd_chef.html#khajda-zhumys-isteu-zhaene-khalaj-oesu","level":2},{"title":"Дереккөздер","href":"reference/professions/prof-rd_chef.html#derekkoezder","level":2}],"title":"Шеф-технолог (R&amp;D-шеф)"},"router":{"pathname":"reference/professions/prof-rd_chef","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
