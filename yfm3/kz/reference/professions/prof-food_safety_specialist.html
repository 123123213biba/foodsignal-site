        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;оценивает риски, сроки годности, упаковку и аллергены&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;оценивает риски, сроки годности, упаковку и аллергены&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;HACCP, токсикология, регуляторика (ЕАЭС, Codex)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Білім&lt;/td&gt;\n&lt;td&gt;Пищевые технологии, ветеринария, микробиология, стандарты ISO 22000.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қайда жұмыс істейді&lt;/td&gt;\n&lt;td&gt;Пищевые производства, лаборатории контроля, госорганы, R&amp;amp;D центры.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-safety.html\"&gt;Қауіпсіздік және сақтау&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nemen-ajnalysady\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#nemen-ajnalysady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Немен айналысады&lt;/span&gt;&lt;/a&gt;Немен айналысады&lt;/h2&gt;\n&lt;p&gt;Тамақ өнімдерінің қауіпсіздігі жөніндегі маман — өндірістен бастап қаптамаға дейінгі барлық кезеңдерде тамақ өнімдерінің белгіленген сапа және гигиена стандарттарына сәйкестігін қамтамасыз ететін кәсіпқой. Оның жұмысы өнімнің бұзылуына немесе тұтынушылардың ауруына әкелуі мүмкін биологиялық, химиялық және физикалық қауіптердің алдын алуға бағытталған.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Күнделікті жұмыс өндірістік процестерді мониторингтеуді және өнімнің бұзылу себептерін талдауды қамтиды. Маман соустардың қаптамада неліктен «ашитынын» немесе жарық әсерінен майлардың тотығуын қалай болдырмау керектігін зерттейді. Жобалар аясында ол сақтаудың жаңа технологияларын енгізеді: көкөністер мен еттің балғындығын сақтау үшін цитрус сығындылары негізіндегі жеуге жарамды пленкалардан бастап, жөке (тимьян) эфир майы қосылған биоыдырайтын қаптамаларға дейін.&lt;/p&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құрал — HACCP (ХАССП) жүйесі, яғни қауіптерді талдау және сыни бақылау нүктелерінің хаттамасы. Маман токсикологиялық талдау әдістерін меңгеруі, ЕАЭО (КО ТР 021/2011 және 029/2012) және Codex Alimentarius талаптарын білуі тиіс. Сондай-ақ микробиологиялық тұрақтылықты бағалау және иондаушы сәулеленудің әсерін зерттеу маңызды.&lt;/p&gt;\n&lt;h2 id=\"khajda-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#khajda-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу керек&lt;/h2&gt;\n&lt;p&gt;Базалық білім тамақ технологиялары, ветеринариялық медицина немесе микробиология саласын қамтиды. Мамандар тамақтану гигиенасы, тамақ химиясы және сапаны басқару пәндерін оқиды. Қосымша білім беру ISO 22000 жүйелерін енгізу бойынша курстар арқылы жүзеге асырылады.&lt;/p&gt;\n&lt;h2 id=\"khajda-zhumys-isteu-zhaene-khalaj-oesu-kerek\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#khajda-zhumys-isteu-zhaene-khalaj-oesu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда жұмыс істеу және қалай өсу керек&lt;/span&gt;&lt;/a&gt;Қайда жұмыс істеу және қалай өсу керек&lt;/h2&gt;\n&lt;p&gt;Мамандар тамақ өндірісінде, сапаны бақылау зертханаларында, мемлекеттік қадағалау органдарында және ғылыми-зерттеу орталықтарында сұранысқа ие. Мансаптық өсу сапа жөніндегі инженерден қауіпсіздік бөлімінің басшысына немесе халықаралық жүйелердің аудиторына дейін болуы мүмкін.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D0%B1%D0%BB%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%D0%BE%D0%B2_%D0%BF%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Облучение продуктов питания — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://europepmc.org/article/MED/9262857\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ecosystem health as a clinical rotation for senior students in Canadian veterinary schools&lt;/a&gt; — шолу, Can Vet J 1997&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"оценивает риски, сроки годности, упаковку и аллергены"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Специалист по безопасности пищевых продуктов","description":"оценивает риски, сроки годности, упаковку и аллергены","vcsPath":"reference/professions/prof-food_safety_specialist.md"},"headings":[{"title":"Немен айналысады","href":"reference/professions/prof-food_safety_specialist.html#nemen-ajnalysady","level":2},{"title":"Типтік міндеттер","href":"reference/professions/prof-food_safety_specialist.html#tiptik-mindetter","level":2},{"title":"Дағдылар мен құралдар","href":"reference/professions/prof-food_safety_specialist.html#daghdylar-men-khuraldar","level":2},{"title":"Қайда оқу керек","href":"reference/professions/prof-food_safety_specialist.html#khajda-okhu-kerek","level":2},{"title":"Қайда жұмыс істеу және қалай өсу керек","href":"reference/professions/prof-food_safety_specialist.html#khajda-zhumys-isteu-zhaene-khalaj-oesu-kerek","level":2},{"title":"Дереккөздер","href":"reference/professions/prof-food_safety_specialist.html#derekkoezder","level":2}],"title":"Специалист по безопасности пищевых продуктов"},"router":{"pathname":"reference/professions/prof-food_safety_specialist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
