        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Биотехнология и пищевые технологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;XXI век (активное развитие)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Культивирование клеток, экструзия, 3D-печать, сенсорный анализ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Emerging Infectious Diseases, Advances in Nutrition&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-newfood.html\"&gt;Жаңа тағам&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"ne-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#ne-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не зерттейді&lt;/span&gt;&lt;/a&gt;Не зерттейді&lt;/h2&gt;\n&lt;p&gt;«Жаңа тамақ» (novel food) — бұл дәстүрлі емес көздерден немесе инновациялық технологияларды қолдану арқылы азық-түлік өнімдерін әзірлеуді зерттейтін ғылыми бағыт. Зерттеу пәніне өсімдік тектес аналогтар, культивацияланған ет, жеуге жарамды жәндіктер, саңырауқұлақтар мен балдырлар сияқты баламалы ақуыз көздері, сондай-ақ оларды өңдеу әдістері, соның ішінде 3D-басып шығару кіреді.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Бағыттың дамуы азық-түлік қауіпсіздігін арттыру және ауыл шаруашылығына түсетін салмақты азайту жолдарын іздеуден басталды. Негізгі кезеңдердің бірі — тағамдық талшықтар көзі ретінде цикорий (Cichorium intybus L.) тамырлары сияқты өсімдік шикізатының құрамын зерттеу болды. Соңғы онжылдықтарда назар биотехнологиялық әдістерге ауысты: жануарлардан алынатын компоненттерді қолданудан жержаңғақ пен киноа сияқты өсімдік ақуыздары негізіндегі қоректік ортада жасушаларды өсіруге көшу.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;«Жаңа тамақ» саласында екі негізгі тәсіл бар. Біріншісі — дәстүрлі өнімдердің құрылымы мен дәмін имитациялауға бағытталған технологиялық тәсіл. Екіншісі — жасушалық құрылымдарды жасауға бағытталған биотехнологиялық тәсіл. Зерттеушілер тұтынушылардың мінез-құлқын да талдайды.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;«Жаңа тамақ» әдістеріне биореакторларда жасушаларды өсіру, талшықты құрылым жасау үшін өсімдік ақуыздарын экструзиялау және күрделі тағам пішіндерін қалыптастыру үшін 3D-басып шығару жатады. Сапаны бағалау үшін ISO стандарттары бойынша сенсорлық талдау және HACCP қағидаттарына сәйкес қауіпсіздікті бақылау әдістері қолданылады.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;«Жаңа тамақ» биотехнологиямен, тағам химиясымен, нутрициологиямен және экологиямен тығыз байланысты. Ол өнімдерді соңғы тұтынушыға жеткізуді қамтамасыз ететін Yandex Eda сияқты логистикалық қызметтермен қиылысады.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Бағытты оқу азық-түлік технологиялары, биотехнология және нутрициология бағдарламалары аясында жүзеге асырылуы мүмкін. Тереңірек зерттеу үшін азық-түлік қауіпсіздігі және инновациялық технологиялар бойынша ғылыми журналдарға жүгіну ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AF%D0%BD%D0%B4%D0%B5%D0%BA%D1%81_%D0%95%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Яндекс Еда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3201/eid0304.970403\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Emerging foodborne diseases: an evolving public health challenge&lt;/a&gt; — шолу, Emerg Infect Dis 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.brainresbull.2018.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Konzo: a distinct neurological disease associated with food (cassava) cyanogenic poisoning&lt;/a&gt; — шолу, Brain Res Bull 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/advances/nmaa025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Back to the Roots: Revisiting the Use of the Fiber-Rich Cichorium intybusL. Taproots&lt;/a&gt; — шолу, Adv Nutr 2020&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Жаңа тағам","description":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.","vcsPath":"reference/disciplines/dir-newfood.md"},"headings":[{"title":"Не зерттейді","href":"reference/disciplines/dir-newfood.html#ne-zerttejdi","level":2},{"title":"Тарихы және негізгі жаңалықтар","href":"reference/disciplines/dir-newfood.html#tarihy-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-newfood.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-newfood.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-newfood.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қай жерде оқу және не оқу керек","href":"reference/disciplines/dir-newfood.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-newfood.html#derekkoezder","level":2}],"title":"Жаңа тағам"},"router":{"pathname":"reference/disciplines/dir-newfood","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_asset
