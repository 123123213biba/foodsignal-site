            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Пищевая химия и технологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;Исторически — с момента использования консервантов; научно — XX век&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Химический анализ, микробиологические тесты, органолептическая оценка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Codex Alimentarius, отчеты JECFA и EFSA&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"ne-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#ne-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не зерттейді&lt;/span&gt;&lt;/a&gt;Не зерттейді&lt;/h2&gt;\n&lt;p&gt;Тағамдық қоспалар — бұл өнімнің қажетті қасиеттерін (дәмі, иісі, түсі, сақтау мерзімі) қамтамасыз ету үшін өндіріс, орау немесе тасымалдау кезінде қосылатын заттар. Бұл ғылыми бағыт заттардың химиялық құрамын, функционалдық қасиеттерін және қауіпсіздігін зерттейді.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Қоспаларды қолдану тұз бен дәмдеуіштерді консервант ретінде пайдаланудан басталды. XX ғасырда тағам химиясының дамуымен E-кодтар жүйесі енгізілді. Қазіргі зерттеулер қалдықтардан биополимерлер алуға бағытталған. Мысалы, цитрус қабығынан жасалған жабындар көкөністерді зеңнен қорғайды, ал грейпфрут сығындысы қосылған желатин пленкалары ет өнімдерін мұздатқышта 5 айға дейін сақтауға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Технологиялық тәсіл өнім сапасын жақсартуға, ал қауіпсіздік тәсілі әр зат үшін рұқсат етілген тәуліктік тұтыну мөлшерін (ADI) белгілеуге бағытталған. Қазіргі таңда синтетикалық заттарды өсімдік шикізатынан алынған табиғи ингредиенттермен алмастыру басымдыққа ие.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Химиялық талдау, микробиологиялық тесттер және органолептикалық бағалау (дегустация) негізгі әдістер болып табылады. Жаңа жабындардың тиімділігін тексеру үшін өнімдердің жеделдетілген қартаю әдістері мен микроорганизмдердің өсуін бақылау қолданылады.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Тағамдық қоспалар консерванттармен, эмульгаторлармен, тұрақтандырғыштармен, бояғыштармен және антиоксиданттармен тығыз байланысты. Сондай-ақ, орауыш материалдарының қоршаған ортаға әсерін зерттейтін экология ғылымдарымен де байланысты.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Тағамдық технологиялар бойынша білім техникалық университеттердің «Тағамдық инженерия» бағыттарында беріледі. Қауіпсіздік қағидаттарын түсіну үшін Codex Alimentarius құжаттары мен JECFA/EFSA есептері негізгі дереккөздер болып табылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5_%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Пищевые добавки — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/ieam.258\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Perfluoroalkyl and polyfluoroalkyl substances in the environment: terminology, classification, and origins&lt;/a&gt; — шолу, Integr Environ Assess Manag 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.marpolbul.2011.09.025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microplastics as contaminants in the marine environment: a review&lt;/a&gt; — шолу, Mar Pollut Bull 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1098/rstb.2008.0205\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accumulation and fragmentation of plastic debris in global environments&lt;/a&gt; — шолу, Philos Trans R Soc Lond B Biol Sci 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"E-коды без мифов: что это, зачем, как работает и что говорят исследования."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Тағамдық қоспалар","description":"E-коды без мифов: что это, зачем, как работает и что говорят исследования.","vcsPath":"reference/disciplines/dir-additives.md"},"headings":[{"title":"Не зерттейді","href":"reference/disciplines/dir-additives.html#ne-zerttejdi","level":2},{"title":"Тарихы және негізгі жаңалықтар","href":"reference/disciplines/dir-additives.html#tarihy-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-additives.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-additives.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-additives.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қай жерде оқу және не оқу керек","href":"reference/disciplines/dir-additives.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-additives.html#derekkoezder","level":2}],"title":"Тағамдық қоспалар"},"router":{"pathname":"reference/disciplines/dir-additives","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
