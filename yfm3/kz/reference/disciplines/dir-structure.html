        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Пищевая физика и реология&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;XX век (на стыке коллоидной химии и физики)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Реология, текстурный профильный анализ (ТПА), микроскопия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Journal of Food Science, Food Hydrocolloids&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-structure.html\"&gt;Текстура және тағам физикасы&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"neni-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#neni-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нені зерттейді&lt;/span&gt;&lt;/a&gt;Нені зерттейді&lt;/h2&gt;\n&lt;p&gt;Тағам текстурасы мен физикасы — бұл тағам өнімдерінің микроқұрылымы мен олардың сенсорлық қасиеттері арасындағы байланысты зерттейтін ғылыми бағыт (процесс). Зерттеу нысандары ретінде эмульсиялар, көбіктер, гельдер және кристалдар сияқты материалдық мәндер қарастырылады. Ғалымдар құрамдағы өзгерістердің, мысалы, балық фаршына көкөніс ұнтақтарын қосудың немесе балық терісінен алынған коллагенді пайдаланудың өнімнің реологиялық көрсеткіштеріне (тұтқырлық, серпімділік және беріктік) қалай әсер ететінін талдайды.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Тағам текстурасы ғылымы коллоидтық химия мен полимерлер физикасының тоғысында қалыптасты. Негізгі жаңалықтар ақуыздар мен көмірсулардың термиялық өңдеу кезіндегі мінез-құлқын түсінумен байланысты. Соңғы онжылдықтарда назар функционалдық материалдарды жасауға аударылды: мысалы, аквакультура қалдықтарынан (теңіз балығының терісі) биологиялық ыдырайтын қабықшалар әзірлеу.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Екі негізгі тәсіл бар: эмпирикалық және құрылымдық-механикалық. Эмпирикалық тәсіл сенсорлық талдауға сүйенеді. Құрылымдық-механикалық тәсіл тағамды күрделі физикалық жүйе ретінде қарастырады, мұнда тұтас өнімнің қасиеттері молекулалардың өзара әрекеттесуімен анықталады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Текстураны зерттеу үшін реология (деформация мен ағынды өлшеу), текстуралық профильдік талдау (TPA) және микроскопия сияқты аспаптық әдістер қолданылады. Заманауи зерттеулер рецептура өзгерген кезде тағамдық жүйелердің мінез-құлқын болжау үшін компьютерлік модельдеуді де пайдаланады.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Бұл бағыт тағам химиясымен, материалтанумен және биотехнологиямен тығыз байланысты. Ол эмульсиялар мен көбіктердің тұрақтылығын түсіндіру үшін коллоидтық химия қағидаларын қолданады.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Пәнді оқу техникалық университеттердің тағамдық технологиялар және нутрициология бағдарламалары аясында қолжетімді. Негізгі білім физикалық химияны, термодинамиканы және микробиологияны қамтиды.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Survivalcraft\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Survivalcraft — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — шолу, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — шолу, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — шолу, Nature 2015&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Текстура және тағам физикасы","description":"Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.","vcsPath":"reference/disciplines/dir-structure.md"},"headings":[{"title":"Нені зерттейді","href":"reference/disciplines/dir-structure.html#neni-zerttejdi","level":2},{"title":"Тарихы және негізгі жаңалықтар","href":"reference/disciplines/dir-structure.html#tarihy-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-structure.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-structure.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-structure.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қай жерде оқу және не оқу керек","href":"reference/disciplines/dir-structure.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-structure.html#derekkoezder","level":2}],"title":"Текстура және тағам физикасы"},"router":{"pathname":"reference/disciplines/dir-structure","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
