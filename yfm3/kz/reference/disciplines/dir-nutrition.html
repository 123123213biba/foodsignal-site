            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Нутрициология&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;Начало XX века (открытие витаминов)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Хроматография, масс-спектрометрия, метаболический мониторинг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Journal of Dairy Science, Thyroid, The Lancet&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенттер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"neni-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#neni-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нені зерттейді&lt;/span&gt;&lt;/a&gt;Нені зерттейді&lt;/h2&gt;\n&lt;p&gt;Нутрициология — тағамның химиялық құрамын, ағзаның қоректік заттарды сіңіру процестерін және олардың тіршілік әрекетіне әсерін зерттейтін ғылыми бағыт. Қоректік заттар (биологиялық маңызды элементтер) — метаболизмді, өсуді және тіндерді қалпына келтіруді қамтамасыз ету үшін қажетті химиялық заттар. Сала макронутриенттердің (ақуыздар, майлар, көмірсулар) ыдырау механизмдерін, микронутриенттердің (дәрумендер, минералдар) және биоактивті қосылыстардың (полифенолдар) гомеостазды сақтаудағы рөлін қамтиды.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Пәннің қалыптасуы тапшылық жағдайларын зерттеумен байланысты. XX ғасырдың басында дәрумендер ашылды, бұл белгілі бір ауруларды микроэлементтердің жетіспеушілігімен байланыстыруға мүмкіндік берді. Кейінірек назар метаболикалық жолдарды зерттеуге ауысты. Қазіргі кезең қоректік заттардың ішек микробиотасымен өзара әрекеттесуін және бірге тамақтану сияқты әлеуметтік факторлардың көмірсулар алмасуына әсерін зерттеумен сипатталады.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Нутрициологияда тағамның трансформациясының молекулалық механизмдеріне бағытталған биохимиялық тәсіл және рационның денсаулыққа әсерін бағалайтын клиникалық тәсіл бөлінеді. Қазіргі зерттеулер «нутритивті инженерия» тұжырымдамасын белсенді қолданады: мысалы, сарысу ақуызының ыдырауын баяулату үшін полифенолдардан қорғаныш қабықшаларын жасау.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Тағам құрамын бағалау үшін хроматография және масс-спектрометрия сияқты аналитикалық әдістер қолданылады. Клиникалық зерттеулерде гликемиялық жауапты мониторингтеу және дене құрамын талдау әдістері қолданылады. 1-типті диабетпен ауыратын науқастарды оқыту үшін интерактивті цифрлық платформалар дәстүрлі баспа материалдарына қарағанда тиімдірек екені анықталды.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Нутрициология гастроэнтерологиямен (ас қорыту процестері), эндокринологиямен (зат алмасуды реттеу) және микробиологиямен тығыз байланысты. Клетчатканың микробиотамен өзара әрекеттесуін түсіну иммундық жүйенің жалпы жағдайын бағалау үшін маңызды.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Нутрициологияны зерттеу биохимия және адам физиологиясы саласында іргелі дайындықты талап етеді. Білім беру бағдарламалары университеттердің медициналық және биологиялық факультеттерінде ұсынылады. Тереңдетіп оқу үшін «Journal of Dairy Science» немесе «Thyroid» сияқты рецензияланатын ғылыми журналдарға, сондай-ақ «The Lancet» деңгейіндегі басылымдарда жарияланған жүйелі шолуларға жүгіну ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8_%D0%B7%D0%BD%D0%B0%D1%87%D0%B8%D0%BC%D1%8B%D0%B5_%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Биологически значимые элементы — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3168/jds.s0022-0302(91)78551-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Methods for dietary fiber, neutral detergent fiber, and nonstarch polysaccharides in relation to animal nutrition&lt;/a&gt; — шолу, J Dairy Sci 1991&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(21)02724-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis&lt;/a&gt; — шолу, Lancet 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/thy.2015.0020\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer: The American Thyroid Association Guidelines Task Force on Thyroid Nodules and Differentiated Thyroid Cancer&lt;/a&gt; — шолу, Thyroid 2016&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Нутриенттер","description":"Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.","vcsPath":"reference/disciplines/dir-nutrition.md"},"headings":[{"title":"Нені зерттейді","href":"reference/disciplines/dir-nutrition.html#neni-zerttejdi","level":2},{"title":"Тарихы және негізгі жаңалықтар","href":"reference/disciplines/dir-nutrition.html#tarihy-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-nutrition.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-nutrition.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-nutrition.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қай жерде оқу және не оқу керек","href":"reference/disciplines/dir-nutrition.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-nutrition.html#derekkoezder","level":2}],"title":"Нутриенттер"},"router":{"pathname":"reference/disciplines/dir-nutrition","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
