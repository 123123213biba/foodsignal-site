        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-thermal.jpg\" alt=\"Пісіру технологиялары\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Пищевая инженерия и биотехнология&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;Древнейшие методы термической обработки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Экструзия, sous vide, конвекционный нагрев, пастеризация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Journal of Food Engineering, Food Chemistry&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-thermal.html\"&gt;Пісіру технологиялары&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"neni-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#neni-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нені зерттейді&lt;/span&gt;&lt;/a&gt;Нені зерттейді&lt;/h2&gt;\n&lt;p&gt;Тағам дайындау технологиялары — бұл тағамдық шикізаттың жылу энергиясы әсерінен болатын физика-химиялық өзгерістерін зерттейтін ғылыми бағыт. Зерттеу пәні — өнімдерді қыздыру, салқындату немесе механикалық өңдеу кезіндегі құрылымының, құрамының және сенсорлық қасиеттерінің өзгеруі.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Тағамды өңдеу — адамзаттың ең ежелгі технологиясы. Тарихи тұрғыдан әдістер ашық оттан өнеркәсіптік процестерге дейін дамыды. Негізгі жаңалық — термиялық өңдеудің тек дәмді ғана емес, макронутриенттердің биожетімділігін де өзгертетінін түсіну болды. Мысалы, шоколад құрамындағы қант пен сүттің экструзиясы өнімнің гликемиялық жауабын өзгерте алады. Басқа зерттеулер пальма ұзынтұмсығының дернәсілдерін қуыру мен пісіру ақуыз үлесін екі есе арттыратынын, бірақ ауыр металдардың жиналу қаупіне байланысты қауіпсіздікті бақылауды талап ететінін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Тағам технологиясында екі негізгі тәсіл бар: эмпирикалық (дәстүрлі әдістер, мысалы, қурутоб дайындау) және инженерлік (процестерді модельдеу). Инженерлік тәсіл термодинамика мен реакция кинетикасына негізделген.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі әдістерге конвекциялық қыздыру (қуыру, пісіру), контактілі қыздыру (гриль), вакуумдық төмен температуралы өңдеу (sous vide) және физика-механикалық өңдеу (экструзия) жатады. Құрал-жабдықтарға температура датчиктері мен текстураны бағалау аспаптары кіреді.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Тағам дайындау технологиялары тағам химиясымен, нутрициологиямен және микробиологиямен тығыз байланысты. Қыздыру процестерін түсіну қауіпсіздікті қамтамасыз ету (пастерлеу) үшін қажет.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Бағыт техникалық университеттердің тағам технологиялары және биотехнология бағдарламалары аясында оқытылады. Негізгі білімді тағам инженериясы мен тамақтану биохимиясы бойынша академиялық шолулардан алуға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Курутоб — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Muhammad 9009, CC0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/thy.2015.0020\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer: The American Thyroid Association Guidelines Task Force on Thyroid Nodules and Differentiated Thyroid Cancer&lt;/a&gt; — шолу, Thyroid 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/jcc.21287\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CHARMM: the biomolecular simulation program&lt;/a&gt; — шолу, J Comput Chem 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41572-020-00240-3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hepatocellular carcinoma&lt;/a&gt; — шолу, Nat Rev Dis Primers 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Пісіру технологиялары","description":"Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.","vcsPath":"reference/disciplines/dir-thermal.md"},"headings":[{"title":"Нені зерттейді","href":"reference/disciplines/dir-thermal.html#neni-zerttejdi","level":2},{"title":"Тарихы және негізгі жаңалықтар","href":"reference/disciplines/dir-thermal.html#tarihy-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-thermal.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-thermal.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-thermal.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қай жерде оқу және не оқу керек","href":"reference/disciplines/dir-thermal.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-thermal.html#derekkoezder","level":2}],"title":"Пісіру технологиялары"},"router":{"pathname":"referen
