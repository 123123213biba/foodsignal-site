            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-safety.jpg\" alt=\"Қауіпсіздік және сақтау\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Пищевая безопасность и технологии хранения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;Развитие промышленной пищевой безопасности (XX век)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;HACCP, физико-химический анализ, метаанализ, биоразлагаемые покрытия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Lancet, BMJ, PLoS Medicine&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-safety.html\"&gt;Қауіпсіздік және сақтау&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"neni-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#neni-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нені зерттейді&lt;/span&gt;&lt;/a&gt;Нені зерттейді&lt;/h2&gt;\n&lt;p&gt;Тамақ өнімдерінің қауіпсіздігі мен сақталуы — азық-түліктің бұзылуының, ластануының және сапасының жоғалуының алдын алу әдістерін зерттейтін ғылыми бағыт. Негізгі міндеті — өнімнің тұтастығын қамтамасыз ету, оның тағамдық құндылығын сақтау және физикалық, химиялық және биологиялық факторларды басқару арқылы тұтынушының денсаулығына төнетін қауіптерді азайту.&lt;/p&gt;\n&lt;h2 id=\"tarihy-men-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#tarihy-men-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы мен негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы мен негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Бағыттың дамуы қолөнер әдістерінен өнеркәсіптік технологияларға көшумен байланысты. Микроорганизмдердің тағамның бұзылуындағы рөлін түсіну маңызды кезең болды. Соңғы онжылдықтарда назар ультраөңделген тағамдардың метаболизмге әсеріне ауысты: 8,8 миллион адам қатысқан метаталдау күніне 100 г ультраөңделген тағамды тұтыну жүрек-қан тамырлары ауруларының қаупін 14%-ға арттыратынын көрсетті. Қазіргі зерттеулер белсенді қаптамаларға, мысалы, өнімді қорғау үшін хитозан гидрогельдеріне немесе еттегі бактериялардың өсуін баяулату үшін тимьян эфир майы қосылған биоыдырайтын материалдарға бағытталған.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Ғылымда екі тәсіл бөлінеді: реактивті (дайын өнімнің сапасын бақылау) және превентивті (өндіріс кезеңінде тәуекелдерді басқару). Превентивті тәсіл HACCP қағидаттарына негізделген. Зерттеулер сыртқы факторлардың әсерін де ескереді: мысалы, қан іздері мен күн сәулесі өсімдік майын бірнеше сағат ішінде альдегидтер көзіне айналдыруы мүмкін.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Әдістер физика-химиялық талдауды, микробиологиялық мониторингті және қаптаманы стресс-тестілеуді қамтиды. Құралдар «ақылды» жабындар жасаудан бастап, зақымданған кезде ағза тіндерін қалпына келтіруге қабілетті рекомбинантты ақуыздарды әзірлеуге дейінгі ауқымды қамтиды.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Бұл бағыт микробиология, полимерлер химиясы, нутрициология және материалдар технологиясымен тығыз байланысты. Ол микробтық қауіпсіздік, қаптама миграциясы және процестік ластаушыларды зерттеумен интеграцияланған.&lt;/p&gt;\n&lt;h2 id=\"khajda-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#khajda-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Оқыту «Тамақ инженериясы» және «Тамақ жүйелерінің қауіпсіздігі» бағдарламалары аясында жүргізіледі. Ғылыми деректердің ашықтығын қамтамасыз ететін PRISMA стандарттары бойынша ресімделген жүйелі шолулар мен метаталдауларды зерттеу ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F_%D0%B1%D0%B5%D0%B7%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D0%BE%D1%81%D1%82%D1%8C\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Информационная безопасность — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Posters_for_information_security_for_the_Ministry_of_Defense_of_the_Russian_Federation.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: MoD of Russian Federation, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — шолу, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(21)02724-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis&lt;/a&gt; — шолу, Lancet 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — шолу, PLoS Med 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Қауіпсіздік және сақтау","description":"Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.","vcsPath":"reference/disciplines/dir-safety.md"},"headings":[{"title":"Нені зерттейді","href":"reference/disciplines/dir-safety.html#neni-zerttejdi","level":2},{"title":"Тарихы мен негізгі жаңалықтар","href":"reference/disciplines/dir-safety.html#tarihy-men-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-safety.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","hre
