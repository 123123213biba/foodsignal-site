nal-chinese-fermented.html\"&gt;Қытайлық доужир сусыны тұмауға қарсы көмектесе ала ма?&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RSC advances&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Қызанақ пен цитрустарды шіруден қорғайтын көрінбейтін хитозан қабықшасы&lt;/a&gt;, &lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Сұйық түтін мен наноэмульсия су-вид мидиясының сақталуын 24 күнге дейін ұзартады&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Advanced science (Weinheim, Baden-Wurttemberg, Germany)&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html\"&gt;Коллаген асқазанды алкогольдің әсерінен қорғай ала ма&lt;/a&gt;, &lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html\"&gt;Сарысу ақуызын ұзағырақ жұмыс істету: бұлшықетке арналған молекулалық «желім»&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Preventing chronic disease&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Азық-түлік себеті дәрінің орнын баса ала ма: ұзақ мерзімді диета тәжірибесі&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Medicine&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Бауырдың майлы ауруы: неге жаңа жағдайлар саны 30 жылда екі есе өсті&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Plant foods for human nutrition (Dordrecht, Netherlands)&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html\"&gt;Пластик орнына кактус: опунция қалдықтарынан жаңа қаптама&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Aquaculture nutrition&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html\"&gt;Мырыш және көмірсулар: балықтардың рационын қалай дұрыстау керек&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Brazilian journal of microbiology : [publication of the Brazilian Society for Microbiology]&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html\"&gt;Кешью ірімшігінің жасырын өмірі: ферменттелген өнімдерде не бар&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;EFSA journal. European Food Safety Authority&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html\"&gt;ББҚ-дағы каннабидиол кристалдары: еуропалық реттеуші изолят қауіпсіздігін мақұлдамады&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PloS one&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html\"&gt;Қанша жегеніңізді дәл білу: цифрлық тағам атласы&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Family medicine and community health&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html\"&gt;Дайын тағамдар мен тіскебасарлар: 8,8 млн адамға жасалған талдау өңделген өнімдердің салдарын көрсетті&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Food safety (Tokyo, Japan)&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Жасымық пен ноқаттағы жасырын қауіп: зең өсімдік ақуызын қалай бұзады&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Food science of animal resources&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Цитрус қабығы тауық котлеттерін ұзақ сақтауға қалай көмектеседі&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;JMIR diabetes&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html\"&gt;Диабеті бар жасөспірімдерге арналған цифрлық білім беру платформасы&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MicrobiologyOpen&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Якон тамырынан маннит: тәтті түйнекті пайдалы қант алмастырғышқа айналдыру&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Molecules (Basel, Switzerland)&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Апельсин қабығы мен қалампыр қызанақтың сақталу мерзімін қалай ұзартады&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Journal of food science&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html\"&gt;Жасушалық ет: жержаңғақ пен киноа жануар ақуызын алмастырады&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Science advances&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html\"&gt;Неліктен жалғыз тамақтанғаннан көрі бірге кешкі ас ішкен денсаулыққа пайдалырақ&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Журналдар мен дереккөздер","description":"","vcsPath":"reference/sources.md"},"headings":[],"title":"Журналдар мен дереккөздер"},"router":{"pathname":"reference/sources","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface
