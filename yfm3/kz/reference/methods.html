        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;29 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ftir-spectroscopy.html\"&gt;FTIR-спектроскопия&lt;/a&gt; — Амидтік жолақтарды сәйкестендіру арқылы желатиннің құрылымдық тұтастығын растау үшін қолданылатын аналитикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maldi-tof-mass-spectrometry.html\"&gt;MALDI-TOF масс-спектрометрия&lt;/a&gt; — Иондалған молекулалардың масса-спектрометриялық талдауына негізделген микроорганизмдерді сәйкестендірудің аналитикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-absorption-spectrometry.html\"&gt;Атомно-абсорбционная спектрометрия&lt;/a&gt; — Дернәсілдердегі қорғасын мен кадмий концентрациясын анықтау үшін қолданылатын сандық химиялық талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hurdle-technology.html\"&gt;барьерный подход&lt;/a&gt; — Синтетикалық консерванттарсыз микроорганизмдерді басу және сақтау мерзімін ұзарту үшін бірнеше әсер ету факторларын біріктіру арқылы тамақ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/winterization.html\"&gt;Винтеризация&lt;/a&gt; — Липидті фракцияларды тұндыру және кейіннен алып тастау үшін салқындату арқылы экстрактіні тазартудың технологиялық процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hplc.html\"&gt;ВЭЖХ&lt;/a&gt; — Дәнді-дақылдардағы микотоксиндердің мөлшерін сандық анықтау үшін қолданылатын аналитикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-chromatography-mass-spectrometry.html\"&gt;Газовая хроматография-масс-спектрометрия&lt;/a&gt; — Тимьян эфир майының құрамындағы 29 қосылысты анықтау үшін қолданылатын аналитикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha-based-sourdough.html\"&gt;Закваска на основе комбучи&lt;/a&gt; — Комбуча симбиотикалық қауымдастығын астық матрицасына бейімдеу арқылы алынған нан пісіруге арналған микробтық инокулят.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;ИК-спектроскопия с преобразованием Фурье&lt;/a&gt; — Асқабақ ұнтағының әсерінен ақуыздардың екіншілік құрылымындағы өзгерістерді анықтау үшін қолданылған талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elisa.html\"&gt;ИФА&lt;/a&gt; — Шикізаттағы микотоксиндерді анықтау үшін қолданылатын зертханалық скрининг әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meta-analysis.html\"&gt;Метаанализ&lt;/a&gt; — Зерттеу нәтижелерінің жалпыланған бағасын алу үшін бірнеше тәуелсіз зерттеулердің нәтижелерін біріктірудің статистикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/check-all-that-apply.html\"&gt;Метод CATA&lt;/a&gt; — Қатысушылар ұсынылған дескрипторлар тізімінен өнімнің сәйкес сипаттамаларын таңдайтын сенсорлық талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;Метод бляшкообразующих единиц&lt;/a&gt; — Үлгідегі тіршілікке қабілетті вирус бөлшектерінің концентрациясын сандық анықтауға арналған стандартты зертханалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kjeldahl-method.html\"&gt;Метод Кьельдаля&lt;/a&gt; — Тағам өнімдеріндегі шикі ақуыз мөлшерін 6,25 қайта есептеу коэффициентін қолдану арқылы анықтаудың аналитикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/technology-acceptance-model.html\"&gt;модель принятия технологий&lt;/a&gt; — Дэвис сауалнамасына негізделген және пайдаланушылар қабылдайтын пайдалылық пен қолдану қарапайымдылығын өлшейтін цифрлық құралды бағалау…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molecular-docking.html\"&gt;Молекулярный докинг&lt;/a&gt; — Полифенол молекулаларының нысана-ақуыздармен өзара әрекеттесуін модельдеу және жақындық энергиясын бағалау үшін қолданылатын компьютерлік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observational-cross-sectional-study.html\"&gt;Наблюдательное кросс-секционное исследование&lt;/a&gt; — Жасанды интеллект пен дәрігерлер топтарының жұмыс нәтижелерін бір мезгілде салыстыруға негізделген құралдардың тиімділігін бағалаудың…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/carbohydrate-counting.html\"&gt;подсчет углеводов&lt;/a&gt; — Әрбір тамақтанудағы көмірсулар тұтынуын есептеуді және гликемиялық профиль мен дене белсенділігіне байланысты қысқа әсерлі инсулин дозасын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;Сверхвысокоэффективная жидкостная хроматография&lt;/a&gt; — Үлгілердегі бос қанттар мен фенолды фракциялардың құрамын бөлу және анықтаудың аналитикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/16s-rrna-gene-sequencing.html\"&gt;секвенирование гена 16S рРНК&lt;/a&gt; — 16S рРНҚ генінің гипервариабельді аймақтарын зерттеу арқылы ішек микробиотасын талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-protein-particle-encapsulation-sppe.html\"&gt;Система капсулирования отдельных белковых частиц&lt;/a&gt; — Жеке ақуыз бөлшектерін капсулалау жүйемі — асқазан-ішек жолында ақуыздың бөліну жылдамдығын бақылау үшін ақуыз микросфераларының…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;сканирующая электронная микроскопия&lt;/a&gt; — Гельдің ақуыз торының тығыз орналасуын растау үшін пайдаланылған микроскопиялық талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hot-air-drying.html\"&gt;сушка горячим воздухом&lt;/a&gt; — Майяр реакциясының жүруіне ықпал ететін, жоғары температурада тағамдық шикізатты сусыздандыру технологиясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-polymerization.html\"&gt;Термическая полимеризация&lt;/a&gt; — Термиялық полимерлену — капсулалау үшін негіз ретінде пайдаланылатын тұрақты микросфераларды қалыптастыру үшін ақуыз изолятын қыздыру…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enzymatic-modification.html\"&gt;Ферментативная модификация&lt;/a&gt; — Алма шырынының көмегімен төмендетілген pH деңгейінде кофе фенолдарын белоктармен байланыстырудың технологиялық процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt; — Ашыту — бұл микроорганизмдердің көмегімен өсімдік шикізатын биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/alkaline-extraction.html\"&gt;Щелочная экстракция&lt;/a&gt; — Ортаның pH деңгейін өзгерту арқылы шикізаттан ақуызды бөліп алу технологиялық процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt; — Экструзия — бұл тағамдық компоненттердің құрылымын өзгерту үшін жоғары температура мен қысымда үздіксіз араластыру және илеу процесі.…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sds-page.html\"&gt;Электрофорез в полиакриламидном геле&lt;/a&gt; — Ақуыз молекулаларының агрегациясын талдау үшін қолданылатын, ақуыздарды молекулалық салмағы бойынша бөлу әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"29 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Әдістер","description":"29 ұғым","vcsPath":"reference/methods.md"},"headings":[],"title":"Әдістер"},"router":{"pathname":"reference/methods","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
        </script>
