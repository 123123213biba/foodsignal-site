        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;реология и структура пищевых продуктов&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;реология и структура пищевых продуктов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество специалистов по реологии и структуре пищевых продуктов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Регулярно, согласно графику профильных научных ассоциаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научный симпозиум с представлением тезисов и публикацией трудов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы профильных научных ассоциаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-structure.html\"&gt;Текстура және тағам физикасы&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;ISFRS (International Symposium on Food Rheology and Structure) — тамақ өнімдерінің физикалық қасиеттерін зерттеуге арналған ғылыми іс-шара. Реология мұнда материяның деформациясы мен ағыны туралы ғылым ретінде, ал құрылым — өнім ішіндегі компоненттердің кеңістіктік орналасуын сипаттау ретінде қарастырылады. Конференция физиктерді, химиктерді және технологтарды тамақ микроқұрылымы оның текстурасын, тұрақтылығын және өңдеу кезіндегі мінез-құлқын қалай анықтайтынын талқылау үшін біріктіреді.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;ISFRS — тамақ физикасының іргелі қағидаларын талқылайтын халықаралық алаң. Конференция молекулалық өзара әрекеттесулерді біз тұтынатын өнімдердің макроскопиялық қасиеттерімен байланыстыра отырып, пәнаралық тәсілге назар аударады.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференцияның негізгі тақырыптары келесі мәселелерді қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Күрделі жүйелер реологиясы: эмульсиялар, гельдер мен көбіктердің мінез-құлқын зерттеу.&lt;/li&gt;\n&lt;li&gt;Құрылымдық талдау: тамақ матрицаларының ішкі архитектурасын өлшеу әдістері.&lt;/li&gt;\n&lt;li&gt;Текстураны модификациялау: мысалы, балық фаршының қасиеттерін жақсарту үшін көкөніс ұнтақтарын қолдану.&lt;/li&gt;\n&lt;li&gt;Биоматериалдар мен қаптама: балық терісінен жасалған жеуге жарамды пленкалар.&lt;/li&gt;\n&lt;li&gt;Метаболикалық аспектілер: тамақ құрылымы мен оның сіңімділігі арасындағы байланыс.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ol-zherde-ne-usynylady\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#ol-zherde-ne-usynylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ол жерде не ұсынылады&lt;/span&gt;&lt;/a&gt;Ол жерде не ұсынылады&lt;/h2&gt;\n&lt;p&gt;ISFRS-те тамақ технологияларына деген көзқарасты өзгертетін зерттеу нәтижелері көрсетіледі. Мысалы, асқабақ ұнтағының сурими балық фаршындағы ақуыз байланыстарына әсері немесе биологиялық ыдырайтын қаптама материалдары. Конференция полимерлер физикасы саласындағы іргелі жаңалықтар өнеркәсіп үшін қолданбалы шешімдерге айналатын орын болып табылады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Қатысу үшін зерттеушілер әдетте өз жұмыстарының тезистерін ұсынады. Нәтижелерді конференция еңбектерінің жинақтары арқылы бақылауға болады. Қатысу мамандарға тұтқырлықты, серпімділікті және беріктікті өлшеу әдістемелері бойынша деректер алмасуға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"реология и структура пищевых продуктов"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ISFRS — Food Rheology and Structure","description":"реология и структура пищевых продуктов","vcsPath":"reference/conferences/conf-isfrs.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-isfrs.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-isfrs.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-isfrs.html#takhyryptar-men-sekciyalar","level":2},{"title":"Ол жерде не ұсынылады","href":"reference/conferences/conf-isfrs.html#ol-zherde-ne-usynylady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-isfrs.html#khalaj-bakhylaugha-zhaene-kh
