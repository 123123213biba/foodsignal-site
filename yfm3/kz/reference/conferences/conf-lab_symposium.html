        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;молочнокислые бактерии и ферментация&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;молочнокислые бактерии и ферментация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-ferment.html\"&gt;Ашыту&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Symposium on Lactic Acid Bacteria (Сүт қышқылы бактериялары симпозиумы) — Еуропалық микробиологиялық қоғамдар федерациясы (FEMS) ұйымдастырған мамандандырылған ғылыми алаң. Конференция сүт қышқылы бактерияларын (СҚБ) және олардың тамақ технологияларындағы, медицина мен биотехнологиядағы рөлін зерттеу нәтижелерін ұсыну процесі болып табылады. Іс-шараның негізгі мақсаты — ашыту механизмдерін және микроорганизмдердің тамақ өнімдерінің қасиеттеріне әсерін талқылау.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Ұйымдастырушы — Еуропаның микробиологиялық қоғамдарын біріктіретін халықаралық FEMS ұйымы. Симпозиум тұрақты түрде өткізіледі және академиялық ғалымдар мен тамақ өнеркәсібі мамандары үшін орталық кездесу орны болып табылады. Іс-шара микробиологияның іргелі зерттеулеріне бағытталған, олар кейіннен кешью жаңғағынан жасалған ірімшік аналогтары немесе доужир сияқты дәстүрлі сусындар сияқты жаңа өнімдерді жасауда қолданылады.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Ғылыми бағдарлама бактериялардың генетикасы мен метаболизмінен бастап, олардың адам денсаулығына әсеріне дейінгі кең ауқымды мәселелерді қамтиды. Негізгі секциялар:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;СҚБ метаболизмі мен физиологиясы: бактериялардың көмірсуларды сүт қышқылына айналдыру процестерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Тамақ қауіпсіздігі және сапасы: крафт өнімдеріндегі тәуекелдерді бағалау және микробиологиялық құрамды бақылау.&lt;/li&gt;\n&lt;li&gt;Функционалды өнімдер: ашытылған сусындардың (мысалы, қарағай тұқымы немесе мунг бұршағы) ішек тосқауылдарының функциясы мен иммунитетке әсерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Ашытқы технологиялары: нан ашытуын жеделдету және оның органолептикалық қасиеттеilerini жақсарту үшін комбуча сияқты мәдениеттерді пайдалану.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;Симпозиумда тамақ өндірісіне деген көзқарасты өзгертетін деректер алғаш рет жарияланады. Қатысушылар ашытқы құрамын талдау нәтижелерін, баламалы сүт өнімдерінің қауіпсіздігі туралы деректерді және дәстүрлі ашытылған сусындардың биологиялық белсенділігінің дәлелдерін ұсынады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Нәтижелерді тезистер мен FEMS есептері арқылы бақылауға болады. Қатысу өз зерттеулеріңізді стендтік немесе ауызша сессияға ұсынуды көздейді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Sourdough\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sourdough — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"молочнокислые бактерии и ферментация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Symposium on Lactic Acid Bacteria (FEMS)","description":"молочнокислые бактерии и ферментация","vcsPath":"reference/conferences/conf-lab_symposium.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-lab_symposium.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-lab_symposium.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-lab_symposium.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-lab_symposium.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"refere
