        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;европейская конференция по пищевой химии&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;европейская конференция по пищевой химии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;программа, тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;EuChemS (Отделение пищевой химии)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Регулярно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Международная научная конференция (доклады, тезисы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы EuChemS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Қауіпсіздік және сақтау&lt;/a&gt;, &lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенттер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Euro Food Chem — тамақ химиясының іргелі және қолданбалы аспектілеріне арналған халықаралық ғылыми конференциялар сериясы. Іс-шара зерттеушілер, технологтар және тамақ өнеркәсібі өкілдері арасында деректер алмасу алаңы болып табылады. Конференцияның негізгі мақсаты — тамақ өнімдерін өндіру, сақтау және қайта өңдеу кезінде жүретін химиялық процестерді талқылау, сондай-ақ осы процестердің тағам сапасы мен қауіпсіздігіне әсерін бағалау.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-men-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#ujymdastyrushylar-men-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар мен тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар мен тарихы&lt;/h2&gt;\n&lt;p&gt;Конференция Еуропалық химиялық қоғамдар қауымдастығының (EuChemS) Тамақ химиясы бөлімінің қолдауымен өткізіледі. Іс-шара тұрақты түрде өткізіліп, азық-түлік ғылымындағы өзекті мәселелерді талқылау үшін бүкіл әлемнен сарапшыларды жинайды. Бұл ғылыми конференцияны тыңайтқыштар өндіретін «Еврохим» химиялық компаниясымен шатастырмау керек: бұлар бір-біріне қатысы жоқ әртүрлі ұғымдар.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Euro Food Chem ғылыми бағдарламасы пәндердің кең спектрін қамтиды. Негізгі секциялар әдетте мыналарды қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тамақ өнімдерінің аналитикалық химиясы: құрам мен сапаны анықтау әдістері.&lt;/li&gt;\n&lt;li&gt;Қайта өңдеу технологиялары: шикізат қасиеттерін өзгерту әдістері.&lt;/li&gt;\n&lt;li&gt;Қауіпсіздік және тұрақтылық: өнімдердің бұзылу процестерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Нутрициология және функционалдық тамақтану: тағам компоненттерінің ағзаға әсерін зерттеу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;Euro Food Chem-де болашақта тамақ технологияларына әсер ететін зерттеу нәтижелері алғаш рет ұсынылады. Оларға қалдықтарды құнды ақуызға айналдыру әдістері, көкөністердің сақталу мерзімін ұзарту үшін қорғаныш жабындары және пробиотикалық штаммдардың клиникалық сынақтары жатады. Конференция алғашқы деректер ғылыми қауымдастықтың сараптамалық бағасынан өтетін сүзгі қызметін атқарады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференцияға қатысу өз ғылыми жұмыстарын ауызша баяндамалар немесе стендтік сессиялар түрінде ұсынуды көздейді. Жеке қатыспайтындар үшін негізгі ақпарат көзі іс-шара қорытындысы бойынша жарияланатын тезистер жинағы (Abstract Books) болып табылады. Хабарландыруларды EuChemS ресми ресурстары арқылы бақылауға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%95%D0%B2%D1%80%D0%BE%D1%85%D0%B8%D0%BC\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Еврохим — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"европейская конференция по пищевой химии"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Euro Food Chem","description":"европейская конференция по пищевой химии","vcsPath":"reference/conferences/conf-eurofoodchem.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-eurofoodchem.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар мен тарихы","href":"reference/conferences/conf-eurofoodchem.html#ujymdastyrushylar-men-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-eurofoodchem.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-eurofoodchem.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-eurofoodchem.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-eurofoodchem.html#derekkoezder","level":2}],"title":"Euro Food Chem"},"router":{"pathname":"reference/conferences/conf-eurofoodchem","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
