        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Институт пищевых технологов (США): крупнейшая научная программа и выставка&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-ift_first.jpg\" alt=\"IFT FIRST\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Институт пищевых технологов (США): крупнейшая научная программа и выставка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;программа и аннотации докладов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;Institute of Food Technologists (IFT)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научная конференция и выставка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;ift.org&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-thermal.html\"&gt;Пісіру технологиялары&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt;, &lt;a href=\"concepts/spec-newfood.html\"&gt;Жаңа тағам&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Қауіпсіздік және сақтау&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;IFT FIRST (Food Improved by Research, Science, and Technology) — тамақ технологиялары, нутрициология және азық-түлік қауіпсіздігі саласындағы сарапшыларды біріктіретін жыл сайынғы ғылыми іс-шара. Конференция зертханалық хаттамаларды өнеркәсіптік шешімдерге айналдыратын қолданбалы зерттеулерді ұсыну алаңы болып табылады. Іс-шараның негізгі мақсаты — күнделікті тұтынатын тағамның сапасын, қоректік құндылығы мен қауіпсіздігін арттыратын инновацияларды көрсету.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Іс-шараны Азық-түлік технологтары институты (Institute of Food Technologists, IFT) өткізеді. Бұл АҚШ-та орналасқан, тамақ өнеркәсібінің ғалымдары мен инженерлерін біріктіретін халықаралық кәсіби ұйым. Конференция осы саладағы ең ірі бағдарлама болып табылады.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференция бағдарламасы тамақ инженериясы мен химиясына қатысты пәндердің кең спектрін қамтиды. Негізгі бағыттар: өңдеу технологиялары, қауіпсіздік және сақтау, функционалды ингредиенттер және тәуекелдерді талдау.&lt;/p&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;IFT FIRST-те тамақ өндірісіне деген көзқарасты өзгертетін зерттеу нәтижелері алғаш рет көрсетіледі. Мысалы, қант пен сүтті экструзиялау параметрлерін өзгерту арқылы гликемиялық жауапты төмендету әдістері немесе сұйық түтін мен наноэмульсия көмегімен өнімдердің балғындығын сақтау әдістері талқыланады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Қатысушылар институт жариялайтын тезистер жинақтары мен баяндама аннотациялары арқылы ғылыми нәтижелермен таныса алады. Мамандар үшін конференция материалдарына қол жеткізу жаңа қауіпсіздік стандарттарының негізі болатын зерттеу хаттамаларын зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D0%B8%D1%81%D0%BE%D0%BA_%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D0%BA%D0%BE%D0%B2_%D1%80%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%BD%D0%BE%D1%81%D0%B8%D1%82%D0%B5%D0%BB%D1%8F_Starship\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Список запусков ракеты-носителя Starship — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Starship-IFT2-ascent_(cropped).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Osunpokeh, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrg2774\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The primary cilium: a signalling centre during vertebrate development&lt;/a&gt; — шолу, Nat Rev Genet 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.tibs.2015.09.003\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IFT-Cargo Interactions and Protein Transport in Cilia&lt;/a&gt; — шолу, Trends Biochem Sci 2015&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1083/jcb.200709133\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Intraflagellar transport motors in cilia: moving along the cell's antenna&lt;/a&gt; — шолу, J Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Институт пищевых технологов (США): крупнейшая научная программа и выставка"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IFT FIRST","description":"Институт пищевых технологов (США): крупнейшая научная программа и выставка","vcsPath":"reference/conferences/conf-ift_first.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-ift_first.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-ift_first.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-ift_first.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-ift_first.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-ift_first.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-ift_first.html#derekkoezder","level":2}],"title":"IFT FIRST"},"router":{"pathname":"reference/conferences/conf-ift_first","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
