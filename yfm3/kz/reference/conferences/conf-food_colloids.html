        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;коллоиды, эмульсии, пены и гели в пищевых системах&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-food_colloids.jpg\" alt=\"Food Colloids\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;коллоиды, эмульсии, пены и гели в пищевых системах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;Академиялық институттар мен кәсіби қоғамдастықтар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Тұрақты түрде (жыл сайын немесе екі жылда бір)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Халықаралық ғылыми конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Арнайы конференциялық веб-сайттар немесе ғылыми порталдар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-structure.html\"&gt;Текстура және тағам физикасы&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Food Colloids — тағамдық жүйелердің физикалық-химиялық қасиеттерін зерттеуге арналған халықаралық ғылыми конференциялар сериясы. Зерттеушілердің назарында коллоидтық құрылымдар: эмульсиялар, көбіктер, гельдер және суспензиялар тұрады. Конференция тағам химиясы, полимерлер физикасы және материалтану мамандарын біріктіреді.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Food Colloids конференциялары әртүрлі академиялық институттар мен кәсіби қоғамдастықтардың қолдауымен тұрақты түрде өткізіледі. Іс-шаралар іргелі ғылым мен тағам өнеркәсібінің қолданбалы технологиялары арасында ақпарат алмасуға бағытталған.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференция бағдарламасы келесі бағыттарды қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тағамдық жүйелер физикасы: ақуыздардың, полисахаридтердің және липидтердің микроскопиялық деңгейдегі әрекеті.&lt;/li&gt;\n&lt;li&gt;Жаңа материалдарды әзірлеу: биологиялық ыдырайтын пленкалар мен жеуге жарамды қаптамалар жасау.&lt;/li&gt;\n&lt;li&gt;Текстура дизайны: өнім қасиеттерін өзгерту үшін қоспаларды пайдалану.&lt;/li&gt;\n&lt;li&gt;Компоненттердің өзара әрекеттесуі: тағам құрылымының ас қорыту процестеріне әсері.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-neler-koersetiledi\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#onda-neler-koersetiledi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда нелер көрсетіледі&lt;/span&gt;&lt;/a&gt;Онда нелер көрсетіледі&lt;/h2&gt;\n&lt;p&gt;Конференцияда кейіннен өндіріске енгізілетін зерттеу нәтижелері ұсынылады. Мысалы, аквакультура қалдықтарынан экологиялық қаптамалар жасау немесе сурими текстурасын жақсарту үшін өсімдік қоспаларын қолдану. Қатысушылар коллоидтық бөлшектерді көруге мүмкіндік беретін сканерлеуші электронды микроскопия әдістерін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Қатысу үшін зерттеушілер өз жұмыстарының тезистерін ұсынады. Конференция материалдары әдетте ғылыми журналдардың арнайы шығарылымдарында жарияланады. Өзекті зерттеулерді бақылау үшін «Critical Reviews in Food Science and Nutrition» немесе «Journal of Texture Studies» сияқты басылымдарға жүгіну ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Food_Machinery_and_Chemical_Corporation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Food Machinery and Chemical Corporation — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:SEM_Image_of_Colloidal_Particles.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Yasrena, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/10408398.2014.939263\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of polysaccharides in food, digestion, and health&lt;/a&gt; — шолу, Crit Rev Food Sci Nutr 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1289/ehp.01109983\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Review of harmful gastrointestinal effects of carrageenan in animal experiments&lt;/a&gt; — шолу, Environ Health Perspect 2001&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/jtxs.12356\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Aging-related changes in quantity and quality of saliva: Where do we stand in our understanding?&lt;/a&gt; — шолу, J Texture Stud 2019&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"коллоиды, эмульсии, пены и гели в пищевых системах"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Food Colloids","description":"коллоиды, эмульсии, пены и гели в пищевых системах","vcsPath":"reference/conferences/conf-food_colloids.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-food_colloids.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-food_colloids.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-food_colloids.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда нелер көрсетіледі","href":"reference/conferences/conf-food_colloids.html#onda-neler-koersetiledi","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-food_colloids.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-food_colloids.html#derekkoezder","level":2}],"title":"Food Colloids"},"router":{"pathname":"reference/conferences/conf-food_colloids","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
