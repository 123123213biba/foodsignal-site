        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;главный научный симпозиум по химии вкуса и аромата&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-weurman.jpg\" alt=\"Weurman Flavour Research Symposium\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;главный научный симпозиум по химии вкуса и аромата&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;сборники трудов, аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество специалистов по химии вкуса и аромата.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Регулярно, периодичность определяется оргкомитетом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научная конференция с публикацией сборников трудов и аннотаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальный сайт симпозиума обновляется перед каждым мероприятием.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Weurman Flavour Research Symposium — тағам өнімдерінің дәмі мен хош иісінің химиясын зерттеуге арналған халықаралық ғылыми конференция. Іс-шара химиктер, биологтар және тамақ өнеркәсібінің технологтары арасындағы деректер алмасу алаңы болып табылады. Симпозиумның негізгі мақсаты — дәм мен иісті қабылдаудың молекулалық механизмдері туралы білімді жүйелеу және оларды талдау әдістерін талқылау.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-men-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#ujymdastyrushylar-men-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар мен тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар мен тарихы&lt;/h2&gt;\n&lt;p&gt;Симпозиум газ хроматографиясы және хош иісті қосылыстарды талдау саласының пионері Корнелис Вурманның (Cornelis Weurman) құрметіне аталған. Конференция тұрақты түрде өткізіліп, тағам химиясының іргелі және қолданбалы аспектілерін талқылау үшін жетекші сарапшыларды жинайды.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Симпозиум жұмысы сенсорлық талдау және тағамның химиялық құрамына қатысты кең ауқымды тақырыптарды қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ұшқыш қосылыстарды сәйкестендіру: иісті талдау әдістері, соның ішінде рецепторлар негізіндегі «электронды мұрын» мен биосенсорларды қолдану.&lt;/li&gt;\n&lt;li&gt;Технологиялық процестер: өңдеу әдістерінің (сублимация, термиялық өңдеу, ашыту) өнімнің химиялық профиліне әсері.&lt;/li&gt;\n&lt;li&gt;Компоненттердің өзара әрекеттесуі: ақуыздар, майлар және көмірсулардың дәмдік сезімдерді (мысалы, умами немесе тәттілік) қалыптастыруы.&lt;/li&gt;\n&lt;li&gt;Биотехнологиялар: микробиологиялық синтез арқылы тағамдық қоспалар мен қант алмастырғыштарды алу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-usynylady\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#onda-ne-usynylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не ұсынылады&lt;/span&gt;&lt;/a&gt;Онда не ұсынылады&lt;/h2&gt;\n&lt;p&gt;Симпозиумда тағам өндірісіне деген көзқарасты өзгертетін зерттеу нәтижелері алғаш рет ұсынылады. Мысалы, мұнда қуырылған иіске жауап беретін пиразиндерді анықтауға арналған жаңа биосенсорлар немесе өнімдегі омега-майларын сақтап қалуға мүмкіндік беретін инновациялық кептіру әдістері талқыланады. Қатысушылар химиялық процестерді ашытумен алмастырудың (мысалы, якон тамырынан маннит алу) соңғы өнімнің тазалығы мен қасиеттеріне қалай әсер ететіні туралы деректерді ұсынады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Симпозиум нәтижелерін кездесулер қорытындысы бойынша жарияланатын ғылыми еңбектер жинағы мен баяндамалар аннотациялары арқылы бақылауға болады. Қатысу өз зерттеулерін стендтік немесе ауызша баяндамалар түрінде ұсынуды көздейді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Vanilla\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vanilla — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Vanilla_planifolia_(6998639597).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Malcolm Manners from Lakeland FL, USA, CC BY 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"главный научный симпозиум по химии вкуса и аромата"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Weurman Flavour Research Symposium","description":"главный научный симпозиум по химии вкуса и аромата","vcsPath":"reference/conferences/conf-weurman.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-weurman.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар мен тарихы","href":"reference/conferences/conf-weurman.html#ujymdastyrushylar-men-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-weurman.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не ұсынылады","href":"reference/conferences/conf-weurman.html#onda-ne-usynylady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-weurman.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-weurman.html#derekkoezder","level":2}],"title":"Weurman Flavour Research Symposium"},"router":{"pathname":"reference/conferences/conf-weurman","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
