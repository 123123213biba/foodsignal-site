            {"data":{"leading":false,"html":"&lt;p&gt;15 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/antimicrobial-resistance.html\"&gt;Антибиотикорезистентность&lt;/a&gt; — Микроорганизмдердің арнайы гендердің болуына байланысты антибиотиктердің әсеріне қарамастан тіршілік қабілетін сақтап қалу қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secondary-nucleation.html\"&gt;Вторичная нуклеация&lt;/a&gt; — Қазірдің өзінде бар кристалдардың немесе бөлшектердің болуына байланысты қаныққан ерітіндіде жаңа кристалдардың түзілу процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-production.html\"&gt;газообразование&lt;/a&gt; — Микроорганизмдердің тіршілік әрекетінен туындайтын және қаптаманың ісінуіне әкелетін тамақ өнімдерінің бұзылу ақауы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glycogen-hepatopathy.html\"&gt;Гликогеновая гепатопатия&lt;/a&gt; — Жоғары көмірсутекті рационнан туындаған бауырда гликогеннің шамадан тыс жиналуымен сипатталатын патологиялық жағдай.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimorbidity.html\"&gt;Мультиморбидность&lt;/a&gt; — Бір пациентте бір уақытта екі немесе одан да көп созылмалы аурулардың болуы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acute-gastric-mucosal-lesion.html\"&gt;Острое повреждение слизистой оболочки желудка&lt;/a&gt; — Этанолды шамадан тыс тұтыну нәтижесінде туындайтын және асқазанның шырышты қабығының тосқауылдық қызметінің бұзылуына әкелетін патологиялық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postprandial-metabolic-response.html\"&gt;Постпрандиальный метаболический ответ&lt;/a&gt; — Тамақтанғаннан кейін адам қанындағы глюкоза, инсулин және триглицеридтер деңгейінің өзгеруі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maillard-reaction.html\"&gt;реакция Майяра&lt;/a&gt; — Қыздыру кезінде аминқышқылдары мен қанттар арасындағы химиялық реакция, ол өзіндік хош иісті және дәмдік қосылыстарды түзеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sarcopenia.html\"&gt;Саркопения&lt;/a&gt; — Саркопения — бұлшықет массасы мен күшінің жоғалуымен сипатталатын, физикалық әлсіздікке әкелетін жасқа байланысты дегенеративті ауру.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/type-1-diabetes.html\"&gt;сахарный диабет 1 типа&lt;/a&gt; — Балалар мен жасөспірімдер арасында кең таралған, гликемиялық бақылауды, инсулин енгізуді және тамақтануды басқаруды талап ететін созылмалы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pi3k-akt-mtor-signaling-pathway.html\"&gt;Сигнальный путь PI3K/AKT/mTOR&lt;/a&gt; — Белсендірілуі бұлшықет ақуызының синтезіне және бұлшықет атрофиясын басуға ықпал ететін биохимиялық жол.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-physiology.html\"&gt;Социальная физиология&lt;/a&gt; — Жақын адамның қатысуы стресстік әсерлер кезінде ағзаға түсетін физиологиялық жүктемені азайтатын құбылыс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/disconfirmation.html\"&gt;Феномен дезавуирования&lt;/a&gt; — Өнім туралы қосымша ақпарат алғаннан кейін тұтынушының бағалауының өзгеруінің психологиялық әсері.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-constipation.html\"&gt;функциональный запор&lt;/a&gt; — Сирек дәретпен (аптасына үш реттен аз), қатты нәжіспен және ішектің толық босамау сезімімен сипатталатын созылмалы ішек бұзылысы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cytokine-storm.html\"&gt;Цитокиновый шторм&lt;/a&gt; — Ағза тіндерін зақымдайтын қабынуға қарсы цитокиндердің бақылаусыз бөлінуімен сипатталатын шамадан тыс қабыну жағдайы.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"15 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Құбылыстар","description":"15 ұғым","vcsPath":"reference/phenomena.md"},"headings":[],"title":"Құбылыстар"},"router":{"pathname":"reference/phenomena","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedba
