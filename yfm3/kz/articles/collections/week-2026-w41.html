        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;18 мақала&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Азық-түлік себеті дәрінің орнын баса ала ма: ұзақ мерзімді диета тәжірибесі&lt;/a&gt; — Зерттеу көрсеткендей, өсімдік тектес өнімдерді жүйелі түрде тұтыну үш жыл ішінде қан қысымы мен салмаққа оң әсер етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html\"&gt;Балмұздақтағы гиалурон қышқылы: молекулалық салмақ текстураны қалай өзгертеді&lt;/a&gt; — Ғалымдар гиалурон қышқылы балмұздақ құрамындағы әдеттегі тұрақтандырғыштарды алмастыра алатынын тексеріп көрді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Бауырдың майлы ауруы: неге жаңа жағдайлар саны 30 жылда екі есе өсті&lt;/a&gt; — Бауырдың майлы ауруы жаһандық мәселеге айналды. Соңғы 30 жылдағы статистикалық трендтер не дейді?&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html\"&gt;Кофе мен алманы біріктіру: функционалды тағамдарға арналған табиғи катализатор&lt;/a&gt; — Ғалымдар кофе антиоксиданттарын сүт пептидтерімен қосу үшін агрессивті химияның орнына алма шырынын қолдану әдісін тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html\"&gt;Пластик орнына кактус: опунция қалдықтарынан жаңа қаптама&lt;/a&gt; — Ғалымдар опунция кактусының қалдықтарынан пластикті алмастыра алатын биоыдырайтын үлдір жасап шығарды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Алоэ вера гелі кесілген мангоны бүлінуден қалай сақтайды&lt;/a&gt; — Ғалымдар алоэ вера гелінен жасалған қаптама кесілген мангоны балға қарағанда екі есе тиімді қорғайтынын анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/comparative-evaluation-of-white-quinoa-and-tri-color-quinoa.html\"&gt;Асқазан жарасынан қорғаныс: неге түрлі-түсті киноа ақ дәнге қарағанда әлдеқайда пайдалы&lt;/a&gt; — Қабынуға қарсы дәрілер асқазанды зақымдайды, бірақ үш түсті киноа қосылған нан некрозды 83%-ға азайтты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html\"&gt;Крахмалды қайта қыздыру неге әрқашан ас қорытуды жеңілдетпейді&lt;/a&gt; — Ыстық тағам оңай қорытылады деген түсінік крахмалға келгенде өзгереді. Гель құрылымының ас қорытуға әсерін талдаймыз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html\"&gt;Теңіз өнімдерінің қалдықтарын құнды ақуызға айналдыру&lt;/a&gt; — Тарақ моллюскасының мантиясы әдетте қоқысқа кетеді. Технологтар pH деңгейін өзгерту арқылы оны пайдалы ақуызға айналдыру жолын тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Кендір мен сұлы: ферментация өсімдік ақуызының құрылымын қалай өзгертеді&lt;/a&gt; — Кендір мен сұлы күнжарасын араластыру және ферментациялау өсімдік еті аналогтарының сапасын қалай жақсартатынын талдаймыз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html\"&gt;Мырыш және көмірсулар: балықтардың рационын қалай дұрыстау керек&lt;/a&gt; — Крахмалға бай жем балық метаболизмін бұзады, ал мырыш қоспасы инсулинге сезімталдықты қалпына келтіруге көмектеседі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html\"&gt;Кешью ірімшігінің жасырын өмірі: ферменттелген өнімдерде не бар&lt;/a&gt; — Біз кешью жаңғағынан жасалған қолөнер ірімшіктерін тексеріп, пайдалы бактериялардан бөлек қызықты нәрселерді таптық.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Қуырылған өнімдердің иісі: пиразиндерді анықтайтын жаңа биосенсор&lt;/a&gt; — Ғалымдар кофе мен нан иісін адам секілді сезетін, бірақ дәлірек жұмыс істейтін «электронды мұрын» жасап шығарды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html\"&gt;ББҚ-дағы каннабидиол кристалдары: еуропалық реттеуші изолят қауіпсіздігін мақұлдамады&lt;/a&gt; — EFSA каннабидиолды мақұлдамады: өндіруші тасымалдаушы майдағы нанобөлшектерді зерттемеген.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html\"&gt;Тәтті алмалар антиоксиданттық қорғаныс жағынан қышқыл сорттарға жол береді&lt;/a&gt; — 12 алма сортының химиялық талдауы көрсеткендей: қанттың көптігі көбінесе фенолдардың аздығын білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html\"&gt;L-теанин және ауыр металдар: шай құрамындағы зат бауырды қалай қорғайды?&lt;/a&gt; — Ғалымдар шай құрамындағы аминқышқылы кадмий тудыратын бауыр зақымдануын азайтуы мүмкін екенін анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Аналық немесе аталық: неге кейбір мидиялар мұздатқышта тезірек бұзылады&lt;/a&gt; — Мидиялар мұздатылғанда жынысына байланысты әртүрлі өзгереді: аналықтарында липидтердің тотығуы 1,7 есе жоғары.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html\"&gt;Қанша жегеніңізді дәл білу: цифрлық тағам атласы&lt;/a&gt; — Ғалымдар тағамдардың фотосуреттері мен құрамы бар база жасады, бұл порция көлемі мен калорияны дәл бағалауға көмектеседі.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"18 мақала"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Апта 2026-10-05 — 2026-10-07","description":"18 мақала","vcsPath":"articles/collections/week-2026-w41.md"}
