        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандық&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/spec-additives.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/spec-additives.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Тағамдық қоспалар — бұл өндіру, орау, тасымалдау немесе сақтау кезеңдерінде технологиялық мақсаттарда тағам өнімдеріне қосылатын заттар. Олардың негізгі міндеті — өнімге қажетті қасиеттерді, мысалы, белгілі бір хош иіс, түс, дәм, консистенция немесе сақтау мерзімін беру. Кең мағынада бұған тіпті үйреншікті тұз бен бұрыш та жатады, алайда өнеркәсіпте бұл термин халықаралық және ұлттық нормалармен реттелетін стандартталған компоненттерді білдіреді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-additives.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Тағамдық қоспа — бұл ақпараттық мән және материалдық мән: химиялық қосылыс ретінде ол физика-химиялық қасиеттерге ие, ал құрамдас бөлік ретінде өнімнің функциясы туралы ақпаратты тасымалдайды. Қоспалардың жіктелуі олардың функционалдық класына (мысалы, консерванттар, бояғыштар, эмульгаторлар) негізделеді. Оларды пайдалану қағидаттары JECFA және EFSA сияқты халықаралық ұйымдар жүргізетін қауіпсіздікті бағалауға сүйенеді. Негізгі ұғым — рұқсат етілген тәуліктік тұтыну (РТТ), бұл адам денсаулығына қауіп төндірмей, өмір бойы күн сайын қабылдауға болатын зат мөлшері.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/spec-additives.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Қоспалардың жұмыс істеуі өнімнің физика-химиялық ортасын өзгерту қабілетіне негізделген. Мысалы, антиоксиданттар майлардың тотығуын баяулатады, ал консерванттар микроорганизмдердің өсуін тежейді. Заманауи технологияларда қоспалар көбінесе жеуге жарамды жабындардың құрамында қолданылады. Бұл жабындар өнім мен сыртқы орта арасында кедергі жасап, ылғалдың жоғалуын және патогендердің енуін болдырмайды.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/spec-additives.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Қоспалардың тиімділігін бағалаудың негізгі әдісі — зертханалық сынақтар. Зерттеушілер өнімдердің модельдерін жасап, оларға заттардың әртүрлі концентрацияларын енгізеді, содан кейін сапа көрсеткіштерін: микробиологиялық тазалықты, органолептикалық қасиеттерді (дәм, иіс) және физикалық тұрақтылықты өлшейді.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/spec-additives.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Қоспаларды пайдалану технологиялары өнімдердің балғындығын сақтау саласында белсенді дамып келеді. «Цитрус қабығы тауық бургерлерін ұзағырақ сақтауға қалай көмектеседі» мақаласында желатин пленкасына грейпфрут сығындысын қосу арқылы еттің мұздатқышта сақталу мерзімін 5 айға ұзарту сипатталған. «Апельсин қабығы мен қалампыр қызанақтардың ұзағырақ балғын болып қалуына қалай көмектеседі» зерттеуінде ғалымдар цитрус қалдықтарынан көкөністерді шіру мен зеңнен қорғайтын жеуге жарамды жабын әзірледі.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/spec-additives.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Басты шектеу — ТР ТС 021/2011 және 029/2012 белгілеген дозаларды қатаң сақтау қажеттілігі. Зертханалық жағдайдағы тиімділік өнеркәсіптік ауқымда әрқашан бірдей нәтижеге кепілдік бермейтінін түсіну маңызды. Сонымен қатар, кез келген қоспалар басқа тағам компоненттерімен жағымсыз әрекеттесулердің жоқтығы үшін тексерілуі тиіс.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Тағамдық қоспалар&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%D0%B4%D1%8B%D2%9B%20%D2%9B%D0%BE%D1%81%D0%BF%D0%B0%5D%20--%3E%7C%D0%B0%D0%BD%D1%8B%D2%9B%D1%82%D0%B0%D0%B9%D0%B4%D1%8B%7C%20B%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D0%B4%D1%8B%D2%9B%20%D0%BA%D0%BB%D0%B0%D1%81%D1%81%5D%0A%20%20A%20--%3E%7C%D1%80%D0%B5%D1%82%D1%82%D0%B5%D0%BB%D0%B5%D0%B4%D1%96%7C%20C%5B%D0%A5%D0%B0%D0%BB%D1%8B%D2%9B%D0%B0%D1%80%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BD%D0%BE%D1%80%D0%BC%D0%B0%D0%BB%D0%B0%D1%80%5D%0A%20%20A%20--%3E%7C%D3%A9%D0%B7%D0%B0%D1%80%D0%B0%20%D3%99%D1%80%D0%B5%D0%BA%D0%B5%D1%82%D1%82%D0%B5%D1%81%D0%B5%D0%B4%D1%96%7C%20D%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%D1%81%D1%8B%5D%0A%20%20A%20--%3E%7C%D2%9B%D0%B0%D0%BC%D1%82%D0%B0%D0%BC%D0%B0%D1%81%D1%8B%D0%B7%20%D0%B5%D1%82%D0%B5%D0%B4%D1%96%7C%20E%5B%D0%A1%D0%B0%D2%9B%D1%82%D0%B0%D1%83%20%D0%BC%D0%B5%D1%80%D0%B7%D1%96%D0%BC%D1%96%5D%0A%20%20A%20--%3E%7C%D0%B6%D0%B0%D2%9B%D1%81%D0%B0%D1%80%D1%82%D0%B0%D0%B4%D1%8B%7C%20F%5B%D0%9E%D1%80%D0%B3%D0%B0%D0%BD%D0%BE%D0%BB%D0%B5%D0%BF%D1%82%D0%B8%D0%BA%D0%B0%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D0%B1%D0%B5%D0%BB%D0%B3%D1%96%D0%BB%D0%B5%D0%B9%D0%B4%D1%96%7C%20G%5B%D0%A0%D2%B1%D2%9B%D1%81%D0%B0%D1%82%20%D0%B5%D1%82%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20%D1%82%D3%99%D1%83%D0%BB%D1%96%D0%BA%D1%82%D1%96%D0%BA%20%D1%82%D2%B1%D1%82%D1%8B%D0%BD%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/spec-additives.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/spec-additives.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html\"&gt;Балмұздақтағы гиалурон қышқылы: молекулалық салмақ текстураны қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html\"&gt;Тәтті алмалар антиоксиданттық қорғаныс жағынан қышқыл сорттарға жол береді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html\"&gt;Теңіз өнімдерінің қалдықтарын құнды ақуызға айналдыру&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Цитрус қабығы тауық котлеттерін ұзақ сақтауға қалай көмектеседі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Апельсин қабығы мен қалампыр қызанақтың сақталу мерзімін қалай ұзартады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/spec-additives.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5_%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Пищевые добавки — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/ieam.258\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Perfluoroalkyl and polyfluoroalkyl substances in the environment: terminology, classification, and origins&lt;/a&gt; — шолу, Integr Environ Assess Manag 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.marpolbul.2011.09.025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microplastics as contaminants in the marine environment: a review&lt;/a&gt; — шолу, Mar Pollut Bull 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1098/rstb.2008.0205\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accumulation and fragmentation of plastic debris in global environments&lt;/a&gt; — шолу, Philos Trans R Soc Lond B Biol Sci 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"E-коды без мифов: что это, зачем, как работает и что говорят исследования."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Тағамдық қоспалар","description":"E-коды без мифов: что это, зачем, как работает и что говорят исследования.","vcsPath":"concepts/spec-additives.md"},"headings":[{"title":"Анықтама","href":"concepts/spec-additives.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/spec-additives.html#sholu","level":2},{"title":"Теория","href":"concepts/spec-additives.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/spec-additives.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/spec-additives.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/spec-additives.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қиындықтар","href":"concepts/spec-additives.html#shekteuler-men-khiyndykhtar","level":2},{"title":"Байланысты ұғымдар","href":"concepts/spec-additives.html#bajlanysty-ughymdar","level":2},{"title":"Қай жерде кездеседі","href":"concepts/spec-additives.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts/spec-additives.html#derekkoezder","level":2}],"title":"Тағамдық қоспалар"},"router":{"pathname":"concepts/spec-additives","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
