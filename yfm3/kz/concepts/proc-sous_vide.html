        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Sous vide cooking of beef loin: time and temperature for tenderness&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-sous_vide.jpg\" alt=\"Sous vide и низкотемпературная готовка\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Pedro.serna, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Sous_Vide_Cooking.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Точная температура, долгое время: мясо, рыба, яйца.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Sous vide — бұл өнім герметикалық қаптамаға салынып, ұзақ уақыт бойы қатаң бақыланатын температурадағы су моншасында термиялық өңдеуден өтетін пісіру процесі. Бұл әдіс төмен температурада ұзақ пісіру (LTLT) ретінде де белгілі. Дәстүрлі әдістерден айырмашылығы, мұнда ортаның температурасы өнімнің мақсатты температурасына тең болады, бұл бүкіл өнім бойынша біркелкі пісу дәрежесіне қол жеткізуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Sous vide сұйық орта арқылы жылу алмасу принципіне негізделген. Дәстүрлі қуыру әдістерінде өнімнің беті мен ортасы арасындағы температура айырмашылығы үлкен болады, бұл сыртқы қабаттардың кеуіп кетуіне әкеледі. Sous vide әдісінде су температурасы өнімнің ішіндегі қажетті температураға теңестіріледі, бұл ақуыздар мен ферменттердің жұмсақ күйге келуін қамтамасыз етеді.&lt;/p&gt;\n&lt;h2 id=\"khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Процесс үш кезеңнен тұрады: өнімді дайындау, вакуумдау және термиялық өңдеу. Өнім полимерлі пакетке салынып, ауасы сорылады, бұл тотығудың алдын алады. Содан кейін пакет термостатқа түсіріледі, онда су циркуляциясы температураны дәл ұстап тұрады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құрал — иммерсиялық циркулятор (термостат). Ол қыздыру элементінен, температура датчигінен және суды араластырып тұратын сорғыдан тұрады. Пакеттерді вакуумдау үшін арнайы вакуумдық қаптау жабдықтары қолданылады.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Технология ет, балық және жұмыртқаны пісіруде қолданылады. «Жидкий дым и наноэмульсия продлевают свежесть мидий су-вид до 24 дней» мақаласында моллюскаларды 85 °C температурада өңдеу және сақтау мерзімін ұзарту әдістері сипатталған.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу — дұрыс емес температура режимінде анаэробты бактериялардың көбею қаупі. Төмен температураларда (55 °C-тан төмен) микробтардың көбеюіне жол бермеу үшін уақытты қатаң бақылау қажет. Сондай-ақ, әдіс Майяр реакциясын қамтамасыз етпейді, сондықтан қытырлақ қабықша алу үшін қосымша өңдеу талап етіледі.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Sous vide и низкотемпературная готовка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%20%D0%B2%20%D0%BF%D0%B0%D0%BA%D0%B5%D1%82%D0%B5%5D%20--%3E%20B%5B%D0%92%D0%B0%D0%BA%D1%83%D1%83%D0%BC%D0%BD%D1%8B%D0%B9%20%D1%83%D0%BF%D0%B0%D0%BA%D0%BE%D0%B2%D1%89%D0%B8%D0%BA%5D%0A%20%20B%20--%3E%20C%5B%D0%92%D0%BE%D0%B4%D1%8F%D0%BD%D0%B0%D1%8F%20%D0%B1%D0%B0%D0%BD%D1%8F%5D%0A%20%20D%5B%D0%98%D0%BC%D0%BC%D0%B5%D1%80%D1%81%D0%B8%D0%BE%D0%BD%D0%BD%D1%8B%D0%B9%20%D1%86%D0%B8%D1%80%D0%BA%D1%83%D0%BB%D1%8F%D1%82%D0%BE%D1%80%5D%20--%3E%7C%D0%BD%D0%B0%D0%B3%D1%80%D0%B5%D0%B2%20%D0%B8%20%D1%86%D0%B8%D1%80%D0%BA%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%7C%20C%0A%20%20C%20--%3E%20E%5B%D0%93%D0%BE%D1%82%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A%20%20E%20--%3E%20F%5B%D0%A4%D0%B8%D0%BD%D0%B8%D1%88%D0%BD%D0%B0%D1%8F%20%D0%BE%D0%B1%D0%B6%D0%B0%D1%80%D0%BA%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Пісіру технологиялары&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Сұйық түтін мен наноэмульсия су-вид мидиясының сақталуын 24 күнге дейін ұзартады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Sous_vide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sous vide — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Sous_Vide_Cooking.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Pedro.serna, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.00228-20\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tools and Techniques for Severe Acute Respiratory Syndrome Coronavirus 2 (SARS-CoV-2)/COVID-19 Detection&lt;/a&gt; — шолу, Clin Microbiol Rev 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu14030453\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effect of Dietary Protein and Processing on Gut Microbiota-A Systematic Review&lt;/a&gt; — шолу, Nutrients 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/foods9091334\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of Sensory Evaluation in Consumer Acceptance of Plant-Based Meat Analogs and Meat Extenders: A Scoping Review&lt;/a&gt; — шолу, Foods 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Точная температура, долгое время: мясо, рыба, яйца."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Sous vide и низкотемпературная готовка","description":"Точная температура, долгое время: мясо, рыба, яйца.","vcsPath":"concepts/proc-sous_vide.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-sous_vide.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-sous_vide.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-sous_vide.html#teoriya","level":2},{"title":"Қалай жұмыс істейді","href":"concepts/proc-sous_vide.html#khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/proc-sous_vide.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/proc-sous_vide.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қауіптер","href":"concepts/proc-sous_vide.html#shekteuler-men-khauipter","level":2},{"title":"Байланысты ұғымдар","href":"concepts/proc-sous_vide.html#bajlanysty-ughymdar","level":2},{"title":"Қай жерде кездеседі","href":"concepts/proc-sous_vide.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"conce
