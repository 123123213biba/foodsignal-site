        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Әдіс&lt;/strong&gt; · &lt;em&gt;Extrusion&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Coyau, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/extrusion.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Экструзия — бұл тағамдық компоненттердің құрылымын өзгерту үшін жоғары температура мен қысымда үздіксіз араластыру және илеу процесі. Технология снектер, құрғақ таңғы астар мен өсімдік ақуыздарынан текстураттар өндіруде қолданылады.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/extrusion.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Экструзия — бұл тамақ шикізатын пішіндеуші саңылау арқылы өткізу кезінде үздіксіз араластыру, сығу және термиялық өңдеу процесі. Технология ингредиенттердің физика-химиялық қасиеттерін өзгертіп, белгіленген текстурасы мен құрылымы бар өнімдерді жасауға мүмкіндік береді. Тамақ өнеркәсібінде бұл әдіс ұнтақ немесе тұтқыр қоспаларды дайын өнімдерге, мысалы, снектерге, құрғақ таңғы астарға немесе текстураланған өсімдік ақуыздарына айналдырады.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/extrusion.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Экструзия шектелген кеңістік жағдайында материалға механикалық күш қолдану принципіне негізделген. Экструдер ішінде шикізат сығу және ығысу кернеулеріне ұшырайды. Жоғары температура мен қысым ақуыздардың денатурациясына және крахмалдың желатинденуіне әкеледі. Бұл процестер компоненттердің молекулалық архитектурасын өзгертеді, бұл олардың функционалдығына, сіңімділігіне және сенсорлық сипаттамаларына әсер етеді.&lt;/p&gt;\n&lt;h2 id=\"khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/extrusion.html#khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Процесс шикізатты тиеу бункеріне беруден басталады. Цлиндрлік корпус ішінде шнек айналып, массаны біртіндеп тығыздап алға жылжытады. Қозғалыс барысында материал үйкеліс және сыртқы қыздыру элементтері есебінен қызады. Жоғары қысым аймағында қарқынды араластыру жүреді. Шығу кезінде масса матрица (фильера) арқылы басып шығарылады. Матрицадан шыққанда қысымның күрт төмендеуі өнімнің кеңеюіне және кеуекті құрылымның түзілуіне әкеледі.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/extrusion.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құрал — экструдер. Ол электр қозғалтқышынан, беру жүйесінен, бір немесе екі шнекті цилиндрден және матрицадан тұрады. Заманауи жүйелер процесс параметрлерін нақты уақыт режимінде бақылауға мүмкіндік беретін температура мен қысым датчиктерімен жабдықталған.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/extrusion.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Технология өнім қасиеттерін модификациялау үшін қолданылады. «Экструзия қант шыңына қарсы: шикізатты өңдеу шоколадтың сіңуін қалай өзгертеді» мақаласында қант пен сүтті алдын ала экструзиялау ағзаның гликемиялық жауабына әсер ететіні көрсетілген. Сондай-ақ, «Жасымық пен ноқаттағы жасырын қауіп: зең өсімдік ақуызын қалай өзгертеді» мақаласында бұршақ дақылдарымен жұмыс істегенде шикізат сапасын бақылау маңыздылығы атап өтіледі, себебі микотоксиндер өңдеуден кейін де изоляттарда қалуы мүмкін.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/extrusion.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Экструзия — жоғары энергияны қажет ететін процесс, ол температуралық режимдерді қатаң сақтауды талап етеді. Дұрыс емес параметрлер қоректік заттардың деградациясына немесе дәмнің қалаусыз өзгеруіне әкелуі мүмкін. Сонымен қатар, технология шикізатта болған микотоксиндер сияқты биологиялық ластануларды толық залалсыздандыра алмайды.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Экструзия&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A8%D0%B8%D0%BA%D1%96%D0%B7%D0%B0%D1%82%20%D0%B1%D0%B5%D1%80%D1%83%5D%20--%3E%20B%5B%D0%A8%D0%BD%D0%B5%D0%BA%D0%BF%D0%B5%D0%BD%20%D1%81%D1%8B%D2%93%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%A2%D0%B5%D1%80%D0%BC%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D3%A9%D2%A3%D0%B4%D0%B5%D1%83%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%20%D0%B0%D1%80%D2%9B%D1%8B%D0%BB%D1%8B%20%D0%BF%D1%96%D1%88%D1%96%D0%BD%D0%B4%D0%B5%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D2%9A%D1%8B%D1%81%D1%8B%D0%BC%D0%BD%D1%8B%D2%A3%20%D1%82%D3%A9%D0%BC%D0%B5%D0%BD%D0%B4%D0%B5%D1%83%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%94%D0%B0%D0%B9%D1%8B%D0%BD%20%D3%A9%D0%BD%D1%96%D0%BC%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анықтама автоматты түрде тексерілді, редакцияның бекітуін күтуде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"anykhtamalykh\"&gt;&lt;a href=\"concepts/extrusion.html#anykhtamalykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтамалық&lt;/span&gt;&lt;/a&gt;Анықтамалық&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;температура&lt;/td&gt;\n&lt;td&gt;105 °C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;давление&lt;/td&gt;\n&lt;td&gt;0,05 МПа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"baskha-ataulary\"&gt;&lt;a href=\"concepts/extrusion.html#baskha-ataulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа атаулары&lt;/span&gt;&lt;/a&gt;Басқа атаулары&lt;/h2&gt;\n&lt;p&gt;термомеханическая пластификация&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/extrusion.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Қант секірісіне қарсы экструзия: шоколадты өңдеу ағзаның реакциясын қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Жасымық пен ноқаттағы жасырын қауіп: зең өсімдік ақуызын қалай бұзады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/methods.html\"&gt;Әдістер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/extrusion.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Extrusion\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extrusion — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — шолу, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/bjc.1972.33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a basic biological phenomenon with wide-ranging implications in tissue kinetics&lt;/a&gt; — шолу, Br J Cancer 1972&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm2330\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Membrane lipids: where they are and how they behave&lt;/a&gt; — шолу, Nat Rev Mol Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Экструзия — бұл тағамдық компоненттердің құрылымын өзгерту үшін жоғары температура мен қысымда үздіксіз араластыру және илеу процесі. Технология снектер, құрғақ"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Экструзия","description":"Экструзия — бұл тағамдық компоненттердің құрылымын өзгерту үшін жоғары температура мен қысымда үздіксіз араластыру және илеу процесі. Технология снектер, құрғақ","vcsPath":"concepts/extrusion.md"}
