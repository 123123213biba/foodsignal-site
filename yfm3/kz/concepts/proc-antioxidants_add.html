            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Rosemary extract as an antioxidant in repeated frying oil&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-antioxidants_add.jpg\" alt=\"Антиоксиданты\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Wu X, Beecher GR, Holden JM, Haytowitz DB, Gebhardt SE, Prior RL, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Foods_highest_in_antioxidants.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Антиоксиданттар — органикалық қосылыстардың тотығу процесін тежейтін немесе алдын алатын заттар. Тамақ өнеркәсібінде олар майлар мен басқа да компоненттердің оттегі әсерінен бұзылуына жол бермей, өнім сапасын сақтау үшін қолданылады. Антиоксиданттар табиғи немесе синтетикалық болуы мүмкін.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Тотығу — молекулалардың электрон жоғалтуымен сипатталатын химиялық процесс. Тамақ өнімдерінде бұл процесс көбінесе бос радикалдар арқылы басталады. Антиоксиданттар электрон донорлары ретінде қызмет етеді: олар өз электронын бос радикалға беріп, оны тұрақтандырады және тотығу тізбегін үзеді. Тамақ технологиясында олар липидтердің ашуынан, витаминдер мен пигменттердің ыдырауынан қорғайтын қоспалар класына жатады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Өнімді қорғау процесі антиоксиданттардың бос радикалдар үшін «тұзақ» қызметін атқаруына негізделген. Антиоксидант радикалмен реакцияға түскенде, ол өзі аз белсенді болып қалады және жаңа бұзушы процестерді тудырмайды. Тиімділік антиоксидант молекуласының құрылымына, ортадағы оттегі концентрациясына және температураға байланысты.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Антиоксиданттық белсенділікті бағалау үшін спектрофотометрия сияқты зертханалық әдістер қолданылады. Тамақ өнеркәсібінде қоспалардың өнімнің дәмі мен иісіне әсерін тексеру үшін дегустациялық панельдер өткізіледі.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Антиоксиданттар майлардың, ет өнімдерінің және жартылай фабрикаттардың сақтау мерзімін ұзарту үшін қолданылады. «Тәтті алмалар қышқылдарына қарағанда антиоксиданттық қорғанысы бойынша төмен» мақаласында көрсетілгендей, жемістердің табиғи құрамы олардың тотығуға төзімділігіне тікелей әсер етеді: 12 алма сортын талдау нәтижесінде, қант мөлшерінің жоғары болуы көбінесе антиоксиданттық қасиеті бар фенолдық қосылыстардың аздығымен байланысты екені анықталды.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Антиоксиданттар өнімді шексіз сақтауға арналған әмбебап құрал емес. Олардың тиімділігі мөлшерлеуге және сыртқы орта жағдайларына байланысты шектеулі. Шамадан тыс тотығу термиялық өңдеу, мысалы, қуыруға арналған майды қайта пайдалану кезінде орын алуы мүмкін. Антиоксиданттардың болуы өнімді медициналық тұрғыдан «пайдалы» етпейді; олардың негізгі қызметі — технологиялық қорғаныс.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Антиоксиданты&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%91%D0%BE%D1%81%20%D1%80%D0%B0%D0%B4%D0%B8%D0%BA%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%20--%3E%7C%D1%82%D0%BE%D1%82%D1%8B%D2%93%D1%83%D0%B4%D1%8B%20%D1%82%D1%83%D0%B4%D1%8B%D1%80%D0%B0%D0%B4%D1%8B%7C%20B%5B%D0%9B%D0%B8%D0%BF%D0%B8%D0%B4%D1%82%D0%B5%D1%80%5D%0A%20%20C%5B%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D0%BD%D1%82%D1%82%D0%B0%D1%80%5D%20--%3E%7C%D1%8D%D0%BB%D0%B5%D0%BA%D1%82%D1%80%D0%BE%D0%BD%20%D0%B1%D0%B5%D1%80%D0%B5%D0%B4%D1%96%7C%20A%0A%20%20A%20--%3E%7C%D1%82%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D0%B0%D0%BD%D0%B0%D0%B4%D1%8B%7C%20D%5B%D0%A2%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D1%8B%20%D0%BC%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D0%B0%5D%0A%20%20C%20--%3E%7C%D2%9B%D0%BE%D1%80%D2%93%D0%B0%D0%B9%D0%B4%D1%8B%7C%20B%0A%20%20E%5B%D0%97%D0%B5%D1%80%D1%82%D1%85%D0%B0%D0%BD%D0%B0%D0%BB%D1%8B%D2%9B%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%20--%3E%7C%D3%A9%D0%BB%D1%88%D0%B5%D0%B9%D0%B4%D1%96%7C%20C%0A%20%20F%5B%D0%94%D0%B5%D0%B3%D1%83%D1%81%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%20--%3E%7C%D0%B1%D0%B0%D2%93%D0%B0%D0%BB%D0%B0%D0%B9%D0%B4%D1%8B%7C%20B%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html\"&gt;Тәтті алмалар антиоксиданттық қорғаныс жағынан қышқыл сорттарға жол береді&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D0%BD%D1%82%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Антиоксиданты — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Foods_highest_in_antioxidants.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Wu X, Beecher GR, Holden JM, Haytowitz DB, Gebhardt SE, Prior RL, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.2147/vhrm.1.1.55.58939\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Endothelial cell dysfunction and the vascular complications associated with type 2 diabetes: assessing the health of the endothelium&lt;/a&gt; — шолу, Vasc Health Risk Manag 2005&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu12113366\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nutrition in Cancer Therapy in the Elderly-An Epigenetic Connection?&lt;/a&gt; — шолу, Nutrients 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ijms24054408\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Towards a New Biomarker for Diabetic Retinopathy: Exploring RBP3 Structure and Retinoids Binding for Functional Imaging of Eyes In Vivo&lt;/a&gt; — шолу, Int J Mol Sci 2023&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Токоферолы, розмарин, TBHQ: как замедляют окисление."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Антиоксиданты","description":"Токоферолы, розмарин, TBHQ: как замедляют окисление.","vcsPath":"concepts/proc-antioxidants_add.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-antioxidants_add.html#anykhtama","level":2},{"title":"Шолу","href":"concep
