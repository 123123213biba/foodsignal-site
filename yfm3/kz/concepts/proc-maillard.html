        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Maillard browning and pyrazine formation in roasted barley&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-maillard.jpg\" alt=\"Реакция Майяра и карамелизация\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: J. Patrick Fischer, CC BY 2.5&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Creme_brulee.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-maillard.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-maillard.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Майяр реакциясы мен карамелдену — тағам өнімдерін термиялық өңдеудің екі негізгі процесі, олар өнімнің түсін, дәмі мен хош иісін қалыптастырады. Екі процесс те ферментативті емес қоңырлануға жатады және қыздыру кезінде жүреді, бірақ олар химиялық механизмдері мен қажетті жағдайлары бойынша ерекшеленеді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-maillard.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Майяр реакциясы — қыздыру кезінде қалпына келтіруші қанттар мен аминқышқылдарының немесе ақуыздардың өзара әрекеттесу процесі, нәтижесінде күрделі хош иісті қосылыстар мен меланоидиндер түзіледі. Ол карамелденуге қарағанда төмен температурада жүреді және нан, ет және кофе дәмінің қалыптасуына жауап береді.&lt;/p&gt;\n&lt;p&gt;Карамелдену — аминқышқылдары болмаған кезде қанттардың термиялық ыдырау процесі, нәтижесінде карамеландар мен карамелиндер түзіледі. Бұл процесс жоғары температураны (әдетте 150 °C-тан жоғары) талап етеді. Екі процесс те дәм мен хош иісті зерттеудің кең саласына жатады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-maillard.html#khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Майяр реакциясы қант пен амин тобының конденсациясынан басталады, бұл пиразиндер сияқты аралық өнімдердің түзілуіне әкеледі. Реакция жылдамдығы ортаның pH деңгейіне, температураға және ылғалдылыққа байланысты.&lt;/p&gt;\n&lt;p&gt;Карамелдену өнімнен бос суды шығарып тастауды талап етеді. Ылғал буланғанша беткі температура 100 °C шамасында қалады, бұл карамелдену үшін жеткіліксіз. Беті кепкеннен кейін ғана температура көтеріліп, қанттың деградация процесі басталады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-maillard.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Бұл процестердің нәтижелерін талдау үшін газ хроматографиясы мен масс-спектрометрия әдістері қолданылады. Заманауи зерттеулер жоғары сезімтал сенсорларды жасауға бағытталған. Мысалы, «Қуырылған иісті қалай ұстау керек: пиразиндерді анықтауға арналған жаңа биосенсор» мақаласында адам рецепторлары негізіндегі «электронды мұрын» әзірленгені сипатталған.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-maillard.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Майяр реакциясы мен карамелденуді басқару технологиялары тамақ өнеркәсібінде өнімдердің дәмдік сапасын стандарттау үшін қолданылады. Бұл процестерді түсіну кофе дәндерін қуыру, нан өнімдерін пісіру және кондитерлік өнімдерді өндіру кезінде иіс қарқындылығын бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/proc-maillard.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу — үй жағдайында қыздырудың біркелкі болмауына байланысты реакцияларды бақылаудың қиындығы. Сонымен қатар, шамадан тыс қыздыру қалаусыз қосымша өнімдердің түзілуіне әкелуі мүмкін. Термиялық өңделген өнімдердің денсаулыққа әсері туралы деректер әлі де зерттелуде.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Реакция Майяра и карамелизация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9D%D0%B0%D0%B3%D1%80%D0%B5%D0%B2%5D%20--%3E%20B%5B%D0%A0%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%20%D0%9C%D0%B0%D0%B9%D1%8F%D1%80%D0%B0%5D%0A%20%20A%20--%3E%20C%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20D%5B%D0%9F%D0%B8%D1%80%D0%B0%D0%B7%D0%B8%D0%BD%D1%8B%5D%0A%20%20B%20--%3E%20E%5B%D0%9C%D0%B5%D0%BB%D0%B0%D0%BD%D0%BE%D0%B8%D0%B4%D0%B8%D0%BD%D1%8B%5D%0A%20%20C%20--%3E%20F%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B0%D0%BD%D1%8B%5D%0A%20%20C%20--%3E%20G%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B5%D0%BD%D1%8B%5D%0A%20%20D%20--%3E%20H%5B%D0%90%D1%80%D0%BE%D0%BC%D0%B0%D1%82%5D%0A%20%20E%20--%3E%20I%5B%D0%A6%D0%B2%D0%B5%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-maillard.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-maillard.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Қуырылған өнімдердің иісі: пиразиндерді анықтайтын жаңа биосенсор&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-maillard.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Карамелизация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Creme_brulee.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: J. Patrick Fischer, CC BY 2.5&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — шолу, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001209\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2024 Heart Disease and Stroke Statistics: A Report of US and Global Data From the American Heart Association&lt;/a&gt; — шолу, Circulation 2024&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/gutjnl-2021-326789\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gut microbiome and health: mechanistic insights&lt;/a&gt; — шолу, Gut 2022&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Реакция Майяра и карамелизация","description":"Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.","vcsPath":"concepts/proc-maillard.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-maillard.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-maillard.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-maillard.html#teoriya","level":2},{"title":"Қалай жұмыс істейді","href":"concepts/proc-maillard.html#khalaj-zhumys-istejdi","level":2},{"title":"Әд
