    <body class="g-root g-root_theme_light">

        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандық&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/spec-flavor.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/spec-flavor.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Дәм мен хош иіс — бұл тағамнан келетін химиялық сигналдарды қабылдаудың кешенді жүйесі. Қарапайым дәмнен айырмашылығы, хош иіс — мыңдаған ұшпалы органикалық қосылыстарды танудың нәтижесі. Олар бірге тағамнан алынатын ләззат пен оның биологиялық құндылығын анықтайтын «флейворды» (flavor) қалыптастырады.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-flavor.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Дәмді сезіну тілдегі рецепторлардың тағам молекулаларымен өзара әрекеттесуінен басталады. Хош иіс ретроназальды иіс сезу арқылы қосылады: ұшпалы заттар ауыз қуысынан мұрын-жұтқыншаққа өтіп, иіс сезу рецепторларын белсендіреді. Бұл процестер Майяр реакциясы немесе карамелизация сияқты химиялық түрленулермен тығыз байланысты.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/spec-flavor.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Жүйе биохимиялық анализатор ретінде жұмыс істейді. Тілдегі рецепторлар негізгі дәмдер туралы сигнал берсе, мұрындағы иіс сезу эпителийі ұшпалы қосылыстардың профилін анықтайды. Ми бұл деректерді біртұтас бейнеге біріктіреді. Мысалы, басмати күрішінің иісі дәннің пісу процесінде дамитын ерекше қосылыстарға байланысты.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/spec-flavor.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Дәм мен иісті талдау үшін газ хроматографиясы мен масс-спектрометрия әдістері қолданылады. Аспаздықта өнімнің бастапқы қасиеттерін сақтау үшін сублимация немесе шикізаттың химиялық құрамын өзгертетін ферментация сияқты технологиялар басқару құралы болып табылады.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/spec-flavor.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Дәм химиясын түсіну жаңа өнімдер жасауға көмектеседі. «Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке» мақаласында сублимацияның асшаянның нәзік умами дәмін қалай сақтайтыны көрсетілген. «Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель» материалында бактериялардың көмегімен тамырдың дәмдік профилін өзгерту тәсілі сипатталған.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/spec-flavor.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Басты қиындық хош иісті қосылыстардың тұрақсыздығында. Олардың көбісі қыздырғанда оңай тотығады немесе ыдырайды. Сондай-ақ, рецепторлардың жеке сезімталдығы дәмді қабылдауды субъективті етеді.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Дәм мен хош иіс&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D1%8B%20%D0%BF%D0%B8%D1%89%D0%B8%5D%20--%3E%20B%5B%D0%AF%D0%B7%D1%8B%D0%BA%D0%BE%D0%B2%D1%8B%D0%B5%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D0%BE%D1%80%D1%8B%5D%0A%20%20A%20--%3E%20C%5B%D0%9E%D0%B1%D0%BE%D0%BD%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D0%BE%D1%80%D1%8B%5D%0A%20%20B%20--%3E%20D%5B%D0%A1%D0%B8%D0%B3%D0%BD%D0%B0%D0%BB%20%D0%B2%20%D0%BC%D0%BE%D0%B7%D0%B3%5D%0A%20%20C%20--%3E%20D%0A%20%20D%20--%3E%20E%5B%D0%92%D0%BE%D1%81%D0%BF%D1%80%D0%B8%D1%8F%D1%82%D0%B8%D0%B5%20%D0%B2%D0%BA%D1%83%D1%81%D0%B0%5D%0A%20%20D%20--%3E%20F%5B%D0%92%D0%BE%D1%81%D0%BF%D1%80%D0%B8%D1%8F%D1%82%D0%B8%D0%B5%20%D0%B0%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B0%5D%0A%20%20E%20--%3E%20G%5B%D0%A4%D0%BB%D0%B5%D0%B9%D0%B2%D0%BE%D1%80%5D%0A%20%20F%20--%3E%20G%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/spec-flavor.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-lipid_aroma.html\"&gt;Окисление жиров и ароматы&lt;/a&gt; — Прогоркание, «рыбный» запах, ароматы жареного масла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/spec-flavor.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Қуырылған өнімдердің иісі: пиразиндерді анықтайтын жаңа биосенсор&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Аналық немесе аталық: неге кейбір мидиялар мұздатқышта тезірек бұзылады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Суық вакуум немесе пеш: кептіру асшаянның дәмі мен ақуызын қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Якон тамырынан маннит: тәтті түйнекті пайдалы қант алмастырғышқа айналдыру&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/spec-flavor.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B0%D1%81%D0%BC%D0%B0%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Басмати — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — шолу, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41591-019-0675-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Chronic inflammation in the etiology of disease across the life span&lt;/a&gt; — шолу, Nat Med 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.12.4.564\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Plant products as antimicrobial agents&lt;/a&gt; — шолу, Clin Microbiol Rev 1999&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Дәм мен хош иіс","description":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.","vcsPath":"concepts/spec-flavor.md"},"headings":[{"title":"Анықтама","href":"concepts/spec-flavor.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/spec-flavor.html#sholu","level":2},{"title":"Теория","href":"concepts/spec-flavor.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/spec-flavor.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/spec-flavor.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/spec-flavor.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қиындықтар","href":"concepts/spec-flavor.html#shekteuler-men-khiyndykhtar","lev
