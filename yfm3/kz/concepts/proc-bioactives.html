        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Polyphenol and flavonoid content of green tea infusions&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-bioactives.jpg\" alt=\"Полифенолы и биоактивные вещества\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: No machine-readable author provided. Jorgealfonso assumed (based on copyright claims)., CC BY-SA 2.5&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Mate_en_calabaza.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-bioactives.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Полифенолы, каротиноиды, флавоноиды.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-bioactives.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Полифенолдар мен биоактивті заттар — өсімдіктерде қорғаныш қызметін атқаратын және тағам ретінде тұтынғанда физиологиялық процестерге әсер ететін өсімдіктердің екінші реттік метаболиттері. Олар маңызды қоректік заттар емес, бірақ ақуыздармен және ішек микробиотасымен өзара әрекеттесе отырып, метаболикалық реакцияларға қатысады.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-bioactives.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Биоактивті заттарға полифенолдар, флавоноидтар және каротиноидтар жатады. Бұл молекулалар өсімдіктердің қорғаныш жүйесінің бөлігі болып табылады, ультракүлгін сәулелер мен патогендерге төзімділікті қамтамасыз етеді. Адам ағзасында олар биохимиялық процестердің модуляторы ретінде қызмет атқарады.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-bioactives.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Полифенолдардың басқа тағам компоненттерімен өзара әрекеттесуі молекулалардың ақуыздармен ковалентті емес байланыстар түзу қабілетіне негізделген. Бұл процесс ақуыздардың физика-химиялық қасиеттерін, мысалы, ферменттер арқылы ыдырау жылдамдығын өзгертеді.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-bioactives.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Биоактивті заттарды зерттеу үшін экстракция және хроматографиялық талдау әдістері қолданылады. Зерттеулерде көбінесе антиоксиданттық белсенділік пен ақуыздармен байланысу қабілеті бағаланады.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-bioactives.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Полифенолдарды пайдалану технологиялары функционалды тағам өнімдерін жасауда енгізілуде:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;«Кофе мен алманы қалай достастыруға болады: функционалды өнімдерге арналған табиғи катализатор» мақаласында кофе антиоксиданттарын сүт пептидтерімен байланыстыру үшін алма шырынын қолдану әдісі сипатталған.&lt;/li&gt;\n&lt;li&gt;«Сарысу ақуызын ұзағырақ жұмыс істеуге мәжбүрлеу: бұлшықеттерге арналған молекулалық желім» мақаласында сарысу ақуызының айналасында полифенолдардан «тұқым қабығын» жасау арқылы оның ыдырауын баяулату әдісі қарастырылады.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/proc-bioactives.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу — көптеген полифенолдардың биожетімділігінің төмендігі: олардың едәуір бөлігі аш ішекте сіңбейді. Сондай-ақ, in vitro зерттеулерінің нәтижелері адам ағзасында әрқашан қайталанбайды.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Полифенолы и биоактивные вещества&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A0%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D0%B5%5D%20--%3E%7C%D1%81%D0%B8%D0%BD%D1%82%D0%B5%D0%B7%D0%B8%D1%80%D1%83%D0%B5%D1%82%7C%20B%5B%D0%9F%D0%BE%D0%BB%D0%B8%D1%84%D0%B5%D0%BD%D0%BE%D0%BB%D1%8B%5D%0A%20%20B%20--%3E%7C%D0%B2%D0%B7%D0%B0%D0%B8%D0%BC%D0%BE%D0%B4%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D1%83%D0%B5%D1%82%7C%20C%5B%D0%91%D0%B5%D0%BB%D0%BA%D0%B8%5D%0A%20%20B%20--%3E%7C%D1%84%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B8%D1%80%D1%83%D0%B5%D1%82%D1%81%D1%8F%7C%20D%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D1%82%D0%B0%5D%0A%20%20C%20--%3E%7C%D0%B8%D0%B7%D0%BC%D0%B5%D0%BD%D1%8F%D0%B5%D1%82%7C%20E%5B%D0%A1%D0%BA%D0%BE%D1%80%D0%BE%D1%81%D1%82%D1%8C%20%D1%83%D1%81%D0%B2%D0%BE%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%7C%D0%BF%D1%80%D0%BE%D0%B8%D0%B7%D0%B2%D0%BE%D0%B4%D0%B8%D1%82%7C%20F%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D1%82%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-bioactives.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенттер&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-micronutrients.html\"&gt;Витамины и минералы&lt;/a&gt; — Содержание, потери при готовке, обогащение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-bioactives.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html\"&gt;Кофе мен алманы біріктіру: функционалды тағамдарға арналған табиғи катализатор&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html\"&gt;Сарысу ақуызын ұзағырақ жұмыс істету: бұлшықетке арналған молекулалық «желім»&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-bioactives.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D1%82%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Мате — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Mate_en_calabaza.jpg\" target=\"_blank\" rel=\"noreferrer
