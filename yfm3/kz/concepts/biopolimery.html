        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Термин&lt;/strong&gt; · &lt;em&gt;Chitosan&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/biopolimery.jpg\" alt=\"Биополимерлер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Aariuser I, CC BY-SA 2.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Chitosan.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/biopolimery.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Биополимерлер — бұл өнімдерді сыртқы ортадан қорғайтын экологиялық таза қаптама жасау үшін қолданылатын табиғи полимерлер (ақуыздар немесе полисахаридтер). Зерттеушілер хитозан сияқты биополимерлерді белсенді пленкалар жасау үшін негіз ретінде пайдаланады.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/biopolimery.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Биополимерлер — тірі ағзалардың құрамына кіретін және экологиялық таза орауыш материалдарын жасау үшін негіз болатын табиғи шығу тегі бар макромолекулалар. Тамақ өнеркәсібінде олар өнімдердің сақтау мерзімін ұзартуға және оларды микробиологиялық бүлінуден қорғауға қабілетті белсенді пленкалар мен жабындарды әзірлеу үшін қолданылады.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/biopolimery.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Биополимерлер қайталанатын құрылымдық бірліктерден — мономерлерден тұратын полимерлер класы болып табылады. Негізгі биополимер түрлеріне ақуыздар (мономерлері — аминқышқылдары) және полисахаридтер (мономерлері — моносахаридтер) жатады. Синтетикалық пластиктерден айырмашылығы, биополимерлер биологиялық ыдырау қасиетіне ие, бұл оларды орауыш өндірісінде перспективалы балама етеді.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/biopolimery.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Биополимер матрицасы эфир майлары немесе өсімдік сығындылары сияқты белсенді заттарды ұстап тұратын физикалық қаңқаны қалыптастырады. Мұндай пленка немесе жабын өнімге жағылғанда, ол бактериялардың өсуін және зеңнің дамуын баяулататын орта жасайды. Мысалы, грейпфрут сығындысын немесе тимьян майын полимер құрылымына енгізу микробқа қарсы қосылыстардың біртіндеп бөлінуін қамтамасыз етеді.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/biopolimery.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құрал — композиттік материалдарды жасау, мұнда биополимер (мысалы, желатин немесе хитозан) матрица, ал өсімдік қоспалары функционалды агент қызметін атқарады. Зерттеушілер цитрус жемістерінің қабығы сияқты тамақ өндірісінің қалдықтарынан белсенді заттарды алу үшін экстракция әдістерін пайдаланады.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/biopolimery.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Биополимерлерге негізделген технологиялар өнімдерді сақтау мәселелерін шешу үшін белсенді зерттелуде:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;«Цитрус қабығы тауық бургерлерін ұзағырақ сақтауға қалай көмектеседі» мақаласында грейпфрут сығындысы қосылған желатин пленкасы еттің мұздатқыштағы балғындығын 5 айға ұзартатыны сипатталған.&lt;/li&gt;\n&lt;li&gt;«Тимьян эфир майы тауық филесін ұзағырақ балғын сақтауға қалай көмектеседі» жұмысында тимьян майы бар биологиялық ыдырайтын орауыш тауық филесінде бактериялардың өсуін баяулататыны көрсетілген.&lt;/li&gt;\n&lt;li&gt;«Апельсин қабығы мен қалампыр қызанақтарды ұзағырақ балғын сақтауға қалай көмектеседі» зерттеуінде көкөністерді зеңнен қорғайтын цитрус қалдықтарынан жасалған жеуге жарамды жабын ұсынылған.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/biopolimery.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Биополимерлі орауыштар әлі әмбебап шешім емес. Олардың тиімділігі сақтау шарттарына, өнім құрамына және белсенді заттардың концентрациясына байланысты. Өндірісті кеңейтуде және пленкалардың қасиеттерін тұрақты сақтауда қиындықтар бар. Сондай-ақ, эфир майлары сияқты қоспалар өнімнің дәмі мен иісіне әсер етуі мүмкін екенін ескеру қажет.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Биополимерлер&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%91%D0%B8%D0%BE%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%5D%20--%3E%20B%5B%D0%90%D0%BA%D1%82%D0%B8%D0%B2%D0%BD%D1%8B%D0%B5%20%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8%5D%0A%20%20B%20--%3E%7C%D0%B8%D0%BD%D0%BA%D0%B0%D0%BF%D1%81%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%7C%20A%0A%20%20A%20--%3E%20C%5B%D0%97%D0%B0%D1%89%D0%B8%D1%82%D0%BD%D0%B0%D1%8F%20%D0%BF%D0%BB%D0%B5%D0%BD%D0%BA%D0%B0%5D%0A%20%20C%20--%3E%7C%D0%B1%D0%B0%D1%80%D1%8C%D0%B5%D1%80%7C%20D%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A%20%20D%20--%3E%7C%D1%83%D0%B2%D0%B5%D0%BB%D0%B8%D1%87%D0%B5%D0%BD%D0%B8%D0%B5%20%D1%81%D1%80%D0%BE%D0%BA%D0%B0%7C%20E%5B%D0%A5%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анықтама автоматты түрде тексерілді, редакцияның бекітуін күтуде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"anykhtamalykh\"&gt;&lt;a href=\"concepts/biopolimery.html#anykhtamalykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтамалық&lt;/span&gt;&lt;/a&gt;Анықтамалық&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;moisture_reduction&lt;/td&gt;\n&lt;td&gt;46.3% to 28.03%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"baskha-ataulary\"&gt;&lt;a href=\"concepts/biopolimery.html#baskha-ataulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа атаулары&lt;/span&gt;&lt;/a&gt;Басқа атаулары&lt;/h2&gt;\n&lt;p&gt;CTS, Хитозан&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/biopolimery.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Цитрус қабығы тауық котлеттерін ұзақ сақтауға қалай көмектеседі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Қызанақ пен цитрустарды шіруден қорғайтын көрінбейтін хитозан қабықшасы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html\"&gt;Киікшөп майы мен хитозан: тауық етін сақтаудың жаңа тәсілі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Апельсин қабығы мен қалампыр қызанақтың сақталу мерзімін қалай ұзартады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/biopolimery.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Биополимеры — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Chitosan.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Aariuser I, CC BY-SA 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41577-019-0165-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The NLRP3 inflammasome: molecular activation and regulation to therapeutics&lt;/a&gt; — шолу, Nat Rev Immunol 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrd.2017.243\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mRNA vaccines - a new era in vaccinology&lt;/a&gt; — шолу, Nat Rev Drug Discov 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12951-018-0392-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nano based drug delivery systems: recent developments and future prospects&lt;/a&gt; — шолу, J Nanobiotechnology 2018&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Биополимерлер — бұл өнімдерді сыртқы ортадан қорғайтын экологиялық таза қаптама жасау үшін қолданылатын табиғи полимерлер (ақуыздар немесе полисахаридтер). Зерт"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Биополимерлер","description":"Биополимерлер — бұл өнімдерді сыртқы ортадан қорғайтын экологиялық таза қаптама жасау үшін қолданылатын табиғи полимерлер (ақуыздар немесе полисахаридтер). Зерт","vcsPath":"concepts/biopolimery.md"},"headings":[{"title":"Анықтама","href":"concepts/biopolimery.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/biopolimery.html#sholu","level":2},{"title":"Теория","href":"concepts/biopolimery.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/biopolimery.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/biopolimery.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/biopolimery.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қиындықтар","href":"concepts/biopolimery.html#shekteuler-men-khiyndykhtar","level":2},{"title":"Анықтамалық","href":"concepts/biopolimery.html#anykhtamalykh","level":2},{"title":"Басқа атаулары","href":"concepts/biopolimery.html#baskha-ataulary","level":2},{"title":"Қай жерде кездеседі","href":"concepts/biopolimery.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts/biopolimery.html#derekkoezder","level":2}],"title":"Биополимерлер"},"router":{"pathname":"concepts/biopolimery","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
