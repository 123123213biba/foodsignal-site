        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Әдіс&lt;/strong&gt; · &lt;em&gt;Fermentation&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/fermentation.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Ашыту — бұл микроорганизмдердің көмегімен өсімдік шикізатын биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа функционалдық қасиеттердің пайда болуына әкеледі.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/fermentation.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Ашыту (ферментация) — микроорганизмдер немесе олардың ферменттері арқылы органикалық заттарды биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа қасиеттер береді. Тамақ өнеркәсібінде бұл әдіс шикізатты күрделі химиялық өңдеусіз өзгертіп, оның дәмі мен функционалдық сипаттамаларын жақсартуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/fermentation.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Ашыту — бактериялар, ашытқылар немесе зең саңырауқұлақтары сияқты микроорганизмдердің метаболикалық белсенділік процесі. Процестің негізінде күрделі органикалық қосылыстарды (көмірсулар, ақуыздар, липидтер) қарапайым молекулаларға ыдырату жатыр. Бұл процестерді зерттейтін ғылым зимология деп аталады. Биохимиялық тұрғыдан алғанда, ашыту жасушаларға оттегі шектеулі жағдайда энергия алуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/fermentation.html#khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Процесс субстратты — өсімдік немесе жануар шикізатын дайындаудан басталады. Оған микроорганизмдердің арнайы штамдары енгізіледі, олар ферменттер бөліп шығара бастайды. Бұл катализатор ақуыздар химиялық реакцияларды жылдамдатып, бастапқы қоректік заттарды органикалық қышқылдар, спирттер немесе арнайы қанттар сияқты жаңа қосылыстарға айналдырады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/fermentation.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құрал — температура, ылғалдылық және аэрация параметрлері бақыланатын биореактор. Бұл шарттарды бақылау мақсатты микроорганизмдердің үстемдігін қамтамасыз ету және патогенді микрофлораның өсуін болдырмау үшін өте маңызды.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/fermentation.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Технология белгіленген қасиеттері бар өнімдерді жасау үшін кеңінен қолданылады. Мысалы, «Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель» мақаласында яконь тамырынан тәттілендіргіш алу үшін бактерияларды пайдалану сипатталған. «Может ли сок из семян алеппской сосны укрепить кишечный барьер» зерттеуінде ашытылған сусынның ішек жасушаларының тұтастығына әсері қарастырылады.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/fermentation.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Ашыту қалаусыз микроорганизмдердің дамуын болдырмау үшін қауіпсіздік хаттамаларын қатаң сақтауды талап етеді. Зерттеу нәтижелері, мысалы, ішек тосқауылына әсері, көбінесе алдын ала сипатқа ие және адамдарда клиникалық сынақтардан өтуді талап етеді.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Ферментация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D1%8B%5D%0A%20%20B%20--%3E%20C%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D1%8B%5D%0A%20%20D%20--%3E%20E%5B%D0%A5%D0%B8%D0%BC%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5%20%D1%80%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D0%B8%5D%0A%20%20E%20--%3E%20F%5B%D0%9D%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анықтама автоматты түрде тексерілді, редакцияның бекітуін күтуде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"anykhtamalykh\"&gt;&lt;a href=\"concepts/fermentation.html#anykhtamalykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтамалық&lt;/span&gt;&lt;/a&gt;Анықтамалық&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;conversion_efficiency&lt;/td&gt;\n&lt;td&gt;&amp;gt;0.6 г маннита на 1 г ФОС&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;temperature&lt;/td&gt;\n&lt;td&gt;25°C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;duration&lt;/td&gt;\n&lt;td&gt;24 ч&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;pH&lt;/td&gt;\n&lt;td&gt;5.2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"baskha-ataulary\"&gt;&lt;a href=\"concepts/fermentation.html#baskha-ataulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа атаулары&lt;/span&gt;&lt;/a&gt;Басқа атаулары&lt;/h2&gt;\n&lt;p&gt;молочнокислое брожение&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/fermentation.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html\"&gt;Алеппо қарағайы тұқымының шырыны ішек тосқауылын нығайта ала ма&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Якон тамырынан маннит: тәтті түйнекті пайдалы қант алмастырғышқа айналдыру&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Кендір мен сұлы: ферментация өсімдік ақуызының құрылымын қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/methods.html\"&gt;Әдістер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/fermentation.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — шолу, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3168/jds.s0022-0302(91)78551-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Methods for dietary fiber, neutral detergent fiber, and nonstarch polysaccharides in relation to animal nutrition&lt;/a&gt; — шолу, J Dairy Sci 1991&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41577-019-0165-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The NLRP3 inflammasome: molecular activation and regulation to therapeutics&lt;/a&gt; — шолу, Nat Rev Immunol 2019&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ашыту — бұл микроорганизмдердің көмегімен өсімдік шикізатын биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа функционалдық қасиеттердің пай"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Ферментация","description":"Ашыту — бұл микроорганизмдердің көмегімен өсімдік шикізатын биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа функционалдық қасиеттердің пай","vcsPath":"concepts/fermentation.md"},"headings":[{"title":"Анықтама","href":"concepts/fermentation.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/fermentation.html#sholu","level":2},{"title":"Теория","href":"concepts/fermentation.html#teoriya","level":2},{"title":"Қалай жұмыс істейді","href":"concepts/fermentation.html#khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/fermentation.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/fermentation.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қиындықтар","href":"concepts/fermentat
