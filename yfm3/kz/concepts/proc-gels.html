        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Gel strength of gelatin and agar desserts&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-gels.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-gels.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Гель — бұл полимерлі қаңқа мен еріткіштен тұратын, пішінін сақтау және деформацияға қарсы тұру сияқты қатты денелердің қасиеттеріне ие құрылымдалған жүйелер. Тамақ өнеркәсібінде гельдену — бұл сұйық компоненттердің температура, pH немесе арнайы қоспалардың әсерінен жартылай қатты немесе қатты құрылымдарға айналу процесі.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-gels.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Гель — бұл дисперсті жүйе болып табылатын материалдық мән. Гельдің негізін макромолекулалардың (ақуыздар немесе полисахаридтер) үш өлшемді торы құрайды, ол өзінің ішінде төмен молекулалы еріткішті, көбінесе суды ұстап тұрады. Гельдің беріктігі — бұл қаңқа ішіндегі байланыстардың тығыздығымен анықталатын сапа.&lt;/p&gt;\n&lt;h2 id=\"khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-gels.html#khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Гельдену процесі полимер молекулаларының денатурациясынан немесе белсендірілуінен басталады. Қыздыру немесе химиялық орта өзгерген кезде ақуыз немесе крахмал молекулалары ашылып, бір-бірімен әрекеттесе бастайды және тор түйіндерін құрайды. Осы түйіндердің концентрациясы критикалық деңгейге жеткенде, жүйе аққыштығын жоғалтады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-gels.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Гельдердің сапасын бағалау үшін материалдың тұтқыр-серпімді қасиеттерін өлшейтін реология әдістері қолданылады. Негізгі құрал — бұл гель құрылымын бұзу үшін қажетті күшті өлшейтін текстура анализаторы.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-gels.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Гельдену технологиялары жаңа тамақ өнімдерін жасау үшін маңызды. «Тыква в рыбном фарше: как улучшить текстуру сурими с помощью овощного порошка» мақаласында өсімдік компоненттерінің балық фаршының ақуыздық қаңқасын нығайтуға қалай қатысатыны сипатталған. «Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку» зерттеуінде балық терісінен алынған коллагеннің қалай берік биологиялық ыдырайтын пленка құрайтыны көрсетілген.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/proc-gels.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Гельдер сыртқы жағдайларға сезімтал. Температураның ауытқуы синерезиске — полимер торының сығылуына байланысты гельден сұйықтықтың бөліну процесіне әкелуі мүмкін. Сондай-ақ, гельдің беріктігі химиялық құраммен шектелген: тұздардың немесе қышқылдықтың өзгеруі молекулааралық байланыстарды бұзуы мүмкін.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Гели и желе&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%BB%D0%B5%D1%80%5D%20--%3E%7C%D0%91%D0%B0%D0%B9%D0%BB%D0%B0%D0%BD%D1%8B%D1%81%D1%83%7C%20B%5B%D2%AE%D1%88%20%D3%A9%D0%BB%D1%88%D0%B5%D0%BC%D0%B4%D1%96%20%D1%82%D0%BE%D1%80%5D%0A%20%20B%20--%3E%7C%D0%95%D1%80%D1%96%D1%82%D0%BA%D1%96%D1%88%D1%82%D1%96%20%D2%B1%D1%81%D1%82%D0%B0%D1%83%7C%20C%5B%D0%93%D0%B5%D0%BB%D1%8C%20%D2%9B%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%D1%8B%5D%0A%20%20C%20--%3E%7C%D0%A2%D0%B5%D0%BC%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D1%83%D1%80%D0%B0%20%D3%99%D1%81%D0%B5%D1%80%D1%96%7C%20D%5B%D0%94%D0%B5%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%D2%93%D0%B0%20%D1%82%D3%A9%D0%B7%D1%96%D0%BC%D0%B4%D1%96%D0%BB%D1%96%D0%BA%5D%0A%20%20C%20--%3E%7C%D0%A1%D1%8B%D1%80%D1%82%D2%9B%D1%8B%20%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D1%80%D0%BB%D0%B0%D1%80%7C%20E%5B%D0%A1%D0%B8%D0%BD%D0%B5%D1%80%D0%B5%D0%B7%D0%B8%D1%81%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-gels.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structure.html\"&gt;Текстура және тағам физикасы&lt;/a&gt; — Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-gels.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Алоэ вера гелі кесілген мангоны бүлінуден қалай сақтайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Балық фаршына асқабақ ұнтағын қосу: сурими текстурасын жақсарту&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Теңіз алабұғасының терісі: балық өңдеу қалдықтарынан жеуге жарамды қаптама&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-gels.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D0%BB%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Гели — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm.2017.7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Biomolecular condensates: organizers of cellular biochemistry&lt;/a&gt; — шолу, Nat Rev Mol Cell Biol 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41573-020-0090-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Engineering precision nanoparticles for drug delivery&lt;/a&gt; — шолу, Nat Rev Drug Discov 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cell.2007.06.009\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;AKT/PKB signaling: navigating downstream&lt;/a&gt; — шолу, Cell 2007&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Желатин, агар, белковые гели: прочность и тающая текстура."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Гели и желе","description":"Желатин, агар, белковые гели: прочность и тающая текстура.","vcsPath":"concepts/proc-gels.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-gels.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-gels.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-gels.html#teoriya","level":2},{"title":"Қалай жұмыс істейді","href":"concepts/proc-gels.html#khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/proc-gels.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/proc-gels.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қиындықтар","href":"concepts/proc-gels.html#shekteuler-men-khiyndykhtar","level":2},{"title":"Байланысты ұғымдар","href":"concepts/proc-gels.html#bajlanysty-ughymdar","level":2},{"title":"Қай жерде кездеседі","href":"concepts/proc-gels.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts/proc-gels.html#derekkoezder","level":2}],"title":"Гели и желе"},"router":{"pathname":"concepts/proc-gels","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
