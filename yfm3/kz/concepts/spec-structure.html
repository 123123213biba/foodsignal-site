        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандық&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/spec-structure.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/spec-structure.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Тағам текстурасы — өнімнің сипап сезу, көру және есту арқылы қабылданатын физикалық қасиеттерінің жиынтығы. Ол материалдың ішкі құрылымымен, компоненттердің таралуымен және олардың арасындағы өзара әрекеттесу күштерімен анықталады. Текстура физикасын түсіну өнімдердің сақтау, термиялық өңдеу және тұтыну кезіндегі мінез-құлқын болжауға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-structure.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Текстура реологияға, яғни материяның деформациясы мен ағыны туралы ғылымға негізделген. Тағам өнімдері күрделі коллоидтық жүйелер: эмульсиялар, көбіктер, гельдер және кристалдар болып табылады. Бұл құрылымдардың негізінде қаңқа құрайтын немесе ылғалды ұстап тұратын макромолекулалар (ақуыз, полисахарид, липид) жатыр.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/spec-structure.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Тағам құрылымы фазалық ауысулар және молекулааралық байланыстар арқылы қалыптасады. Мысалы, қыздырған кезде ақуыздар денатурацияға ұшырап, суды ұстап тұратын үш өлшемді тор түзеді, бұл гель текстурасын жасайды. Эмульсияларда май тамшылары сулы ортада таралады, ал тұрақтандырғыштар олардың қосылуына жол бермейді.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/spec-structure.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Текстураны талдау үшін текстуралық профильді талдау (TPA) сияқты аспаптық әдістер қолданылады, олар сығылу кезінде үлгінің қаттылығын, жабысқақтығын және серпімділігін өлшейді. Реологиялық зерттеулер тұтқырлық пен аққыштық шегін анықтайды.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/spec-structure.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Текстураны басқару принциптері өнім сапасын жақсарту үшін қолданылады. «Балық фаршындағы асқабақ: көкөніс ұнтағының көмегімен сурими текстурасын қалай жақсартуға болады» мақаласында өсімдік қоспаларының ақуыздың өзара әрекеттесуін өзгертіп, фарштың тығыздығы мен серпімділігін қалай арттыратыны сипатталған. «Сибас терісі: аквакультура қалдықтары жеуге жарамды қаптамаға қалай айналады» жұмысында ақуыз матрицасының физикалық қасиеттері материалдың беріктігін қамтамасыз ететін биоыдырайтын пленкалар жасау қарастырылады.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/spec-structure.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу биологиялық жүйелердің күрделілігінде: шикізат құрамы өзгеруі мүмкін, бұл түпкілікті нәтижеге әсер етеді. Зертханалық модельдер өнеркәсіптік өндіріс жағдайларын әрқашан дәл қайталамайды.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Текстура және тағам физикасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%20%D1%82%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%D1%81%D1%8B%5D%20--%3E%20B%5B%D0%A0%D0%B5%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20B%20--%3E%20C%5B%D0%AD%D0%BC%D1%83%D0%BB%D1%8C%D1%81%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20B%20--%3E%20D%5B%D0%93%D0%B5%D0%BB%D1%8C%D0%B4%D0%B5%D1%80%5D%0A%20%20B%20--%3E%20E%5B%D0%9A%D1%80%D0%B8%D1%81%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20F%5B%D0%A2%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D1%8B%D0%BB%D1%8B%D2%9B%5D%0A%20%20D%20--%3E%20F%0A%20%20E%20--%3E%20F%0A%20%20F%20--%3E%20G%5B%D0%A2%D2%B1%D1%82%D1%8B%D0%BD%D1%83%D1%88%D1%8B%D0%BB%D1%8B%D2%9B%20%D1%81%D0%B0%D0%BF%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/spec-structure.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gels.html\"&gt;Гели и желе&lt;/a&gt; — Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/spec-structure.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Алоэ вера гелі кесілген мангоны бүлінуден қалай сақтайды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html\"&gt;Мырыш және көмірсулар: балықтардың рационын қалай дұрыстау керек&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html\"&gt;ББҚ-дағы каннабидиол кристалдары: еуропалық реттеуші изолят қауіпсіздігін мақұлдамады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Балық фаршына асқабақ ұнтағын қосу: сурими текстурасын жақсарту&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Теңіз алабұғасының терісі: балық өңдеу қалдықтарынан жеуге жарамды қаптама&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/spec-structure.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Survivalcraft\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Survivalcraft — Википедия
