            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Xanthan and guar thickeners for dysphagia diets&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Ксантан, агар, пектин, каррагинан.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Қоюлатқыштар мен гидроколлоидтар — өнімдердің физикалық қасиеттерін өзгертіп, тұтқырлығын арттыратын немесе гель құрылымын жасайтын тағамдық қоспалар тобы. Олар текстураны бақылауға, ылғалды сақтауға және ингредиенттердің бөлініп кетуіне жол бермеуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Гидроколлоидтар сумен әрекеттескенде коллоидтық жүйелерді түзе алатын гидрофильді полимерлер болып табылады. Олардың негізгі қасиеті — гидратациялану, яғни су молекулаларын сіңіріп, полимер тізбектерінің ісінуі және ортаның тұтқырлығын арттыру.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Қоюлану процесі полимердің ұзын молекулалық тізбектерінің механикалық тоғысуына негізделген. Гидроколлоид суға түскенде, оның молекулалары ашылып, өзара әрекеттеседі және үш өлшемді тор құрайды. Бұл тор су молекулаларының қозғалғыштығын шектейді, бұл тұтқырлықтың артуына әкеледі.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Қоюлатқыштардың тиімділігін бағалау үшін реологиялық әдістер қолданылады. Зертханалық жағдайда вискозиметрлер мен текстурометрлер пайдаланылады, олар қоспаның өнімнің сақталуы мен тұтынылуына әсерін анықтауға көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-kholdanylady\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#khaj-zherde-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде қолданылады&lt;/span&gt;&lt;/a&gt;Қай жерде қолданылады&lt;/h2&gt;\n&lt;p&gt;Гидроколлоидтар функционалдық жабындар жасау және өнімдердің консистенциясын жақсарту үшін қолданылады. Мысалы, «Апельсин қабығы мен қалампыр қызанақтардың ұзағырақ жаңа күйде қалуына қалай көмектеседі» мақаласында гидроколлоидтар көкөністер бетінде белсенді компоненттерді ұстап тұру үшін негіз ретінде сипатталады. Сондай-ақ, олар дисфагиямен ауыратын адамдарға арналған диеталарда маңызды рөл атқарады.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу — гидроколлоидтар қасиеттерінің сыртқы факторларға: ортаның pH деңгейіне, температураға, тұздар мен қанттардың болуына тәуелділігі. Қоюлатқышты дұрыс таңдамау синерезиске — сақтау кезінде гельден судың бөлініп шығуына әкелуі мүмкін.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Загустители и гидроколлоиды&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%93%D0%B8%D0%B4%D1%80%D0%BE%D0%BA%D0%BE%D0%BB%D0%BB%D0%BE%D0%B8%D0%B4%5D%20--%3E%20B%5B%D0%93%D0%B8%D0%B4%D1%80%D0%B0%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B0%D0%B1%D1%83%D1%85%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%B0%5D%0A%20%20C%20--%3E%20D%5B%D0%9E%D0%B1%D1%80%D0%B0%D0%B7%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%20%D1%81%D0%B5%D1%82%D0%BA%D0%B8%5D%0A%20%20D%20--%3E%20E%5B%D0%9F%D0%BE%D0%B2%D1%8B%D1%88%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B2%D1%8F%D0%B7%D0%BA%D0%BE%D1%81%D1%82%D0%B8%5D%0A%20%20E%20--%3E%20F%5B%D0%A1%D1%82%D0%B0%D0%B1%D0%B8%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%B3%D0%B5%D0%BB%D1%8C%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi
