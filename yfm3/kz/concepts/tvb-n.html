        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Термин&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/tvb-n.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Жалпы ұшпа негізді азот (TVB-N) — ақуыздың ыдырауы мен бактериялардың көбеюі нәтижесінде етте жиналатын балғындық көрсеткіші. Көрсеткіштің төмен болуы өнімнің сапалы екенін білдіреді, ал 35 мг N/100 г нормасынан асуы өнімнің бұзылғанын көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/tvb-n.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Жалпы ұшпа негіздік азот (TVB-N) — бұл ақуыздардың ыдырауы мен микроорганизмдердің тіршілік әрекеті нәтижесінде түзілетін азотты қосылыстардың концентрациясын өлшейтін тағам сапасының көрсеткіші. Тамақ өнеркәсібінде бұл параметр ет, балық және теңіз өнімдерінің балғындығын анықтаудың негізгі индикаторы болып табылады. TVB-N-нің жоғары мәндері өнімнің бұзылу процестерін көрсетеді, бұл оны тағам қауіпсіздігін бақылаудың маңызды құралына айналдырады.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/tvb-n.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;TVB-N (Total Volatile Basic Nitrogen) аммиак, диметиламин және триметиламин сияқты ұшпа негіздердің жиынтығы болып табылады. Бұл заттар ақуыздар мен аминқышқылдарының ферментативті ыдырауының және өнімнің бұзылуын тудыратын бактериялар метаболизмінің нәтижесінде түзіледі. Балғын етте бұл қосылыстардың мөлшері минималды болады. Сақтау барысында микрофлора мен эндогенді ферменттердің белсенділігі артып, ұшпа азотты қосылыстардың жинақталуына әкеледі.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/tvb-n.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;TVB-N жинақталу процесі микробиологиялық процестердің дамуымен қатар жүреді. Ақуыздар деградацияға ұшырағанда, аминқышқылдары бөлініп шығады және бактериялар арқылы дезаминацияланады. Нәтижесінде газ фазасына өтуге қабілетті ұшпа қосылыстар түзіледі. Бұл көрсеткішті өлшеу өнімнің жай-күйін объективті бағалауға мүмкіндік береді. Көптеген ет өнімдері үшін нормативтік шек 100 г өнімге 35 мг азот деп есептеледі.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/tvb-n.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;TVB-N-ді анықтау үшін дистилляция және титрлеу әдістері қолданылады. Өнім үлгісі гомогенделеді, содан кейін ұшпа негіздер сілті қатысуымен су буымен айдау арқылы бөліп алынады. Алынған дистиллят жалпы азот мөлшерін анықтау үшін қышқыл ерітіндісімен титрленеді.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/tvb-n.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;TVB-N көрсеткіші жаңа консервациялау әдістерінің тиімділігін бағалау үшін қолданылады. «Цитрус қабығы тауық бургерлерін ұзағырақ сақтауға қалай көмектеседі» мақаласында грейпфрут сығындысы қосылған желатин пленкасы ыдырау өнімдерінің жинақталуын баяулатып, еттің балғындығын 5 айға ұзартатыны сипатталған. «Сұйық түтін мен наноэмульсия су-вид мидияларының балғындығын 24 күнге дейін ұзартады» зерттеуінде 85 °C температурада өңдеу, сұйық түтін және ультрадыбыстық эмульсия комбинациясы TVB-N өсуін тежеуде тиімді екенін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/tvb-n.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;TVB-N интегралды көрсеткіш болып табылады, ол әрқашан бұзылуды тудырған микроорганизмдердің нақты түрін анықтауға мүмкіндік бермейді. TVB-N мәндері жануар түріне, сақтау шарттарына және өнімнің бастапқы ластану деңгейіне байланысты өзгеруі мүмкін. Бұл әдіс зертханалық жабдықты талап етеді және үй жағдайында қолдануға арналған экспресс-тест болып табылмайды.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: TVB-N&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%90%D2%9B%D1%83%D1%8B%D0%B7%5D%20--%3E%20B%5B%D0%91%D0%B0%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20B%20--%3E%20C%5B%D0%90%D0%BC%D0%B8%D0%BD%D2%9B%D1%8B%D1%88%D2%9B%D1%8B%D0%BB%D0%B4%D0%B0%D1%80%D1%8B%5D%0A%20%20C%20--%3E%20D%5B%D2%B0%D1%88%D0%BF%D0%B0%20%D0%BD%D0%B5%D0%B3%D1%96%D0%B7%D0%B4%D0%B5%D1%80%5D%0A%20%20D%20--%3E%20E%5BTVB-N%20%D0%BA%D3%A9%D1%80%D1%81%D0%B5%D1%82%D0%BA%D1%96%D1%88%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%A1%D0%B0%D0%BF%D0%B0%D0%BD%D1%8B%20%D0%B1%D0%B0%D2%93%D0%B0%D0%BB%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анықтама автоматты түрде тексерілді, редакцияның бекітуін күтуде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"anykhtamalykh\"&gt;&lt;a href=\"concepts/tvb-n.html#anykhtamalykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтамалық&lt;/span&gt;&lt;/a&gt;Анықтамалық&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;единицы&lt;/td&gt;\n&lt;td&gt;мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;значение для 4% грейпфрута&lt;/td&gt;\n&lt;td&gt;11,20 мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;критический_норматив&lt;/td&gt;\n&lt;td&gt;35 мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"baskha-ataulary\"&gt;&lt;a href=\"concepts/tvb-n.html#baskha-ataulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа атаулары&lt;/span&gt;&lt;/a&gt;Басқа атаулары&lt;/h2&gt;\n&lt;p&gt;total volatile basic nitrogen, летучий базисный азот, общее содержание летучих основных азотистых соединений, общий летучий базисный азот, общий летучий основной азот&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/tvb-n.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Цитрус қабығы тауық котлеттерін ұзақ сақтауға қалай көмектеседі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Сұйық түтін мен наноэмульсия су-вид мидиясының сақталуын 24 күнге дейін ұзартады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/tvb-n.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дерекк
