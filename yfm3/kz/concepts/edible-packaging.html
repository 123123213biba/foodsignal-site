        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Материал&lt;/strong&gt; · &lt;em&gt;Edible packaging&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/edible-packaging.jpg\" alt=\"Съедобная упаковка\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: File:Edible packaging film.pdf: Paul Pierlot derivative work: Sebastian Wallroth, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Edible_packaging_film.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/edible-packaging.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Жемілі қаптама — бұл өнімдердегі ылғал жоғалуын азайтуға және микроорганизмдердің өсуін тежеуге арналған, тағамдық компоненттерден жасалған биологиялық ыдырайтын қорғаныс қабаты.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/edible-packaging.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Жейтін орама — бұл тағамдық компоненттерден жасалған, өнім бетіне жағылатын немесе үлдір түрінде қалыптасатын биоыдырағыш қорғаныш тосқауылы. Материалдың негізгі функциясы — ылғал жоғалуын азайту, тотығуды баяулату және микроорганизмдердің өсуін тежеу арқылы өнімнің балғындығын сақтау.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/edible-packaging.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Жейтін орама биоыдырағыш материалдың бір түрі болып табылады. Технологияның негізінде табиғи макромолекулалардан: полисахаридтер (крахмал, альгинаттар), ақуыздар (казеин, желатин) немесе липидтер (балауыз, майлар) полимерлік матрица жасау жатыр. Бұл компоненттер өнім мен қоршаған орта арасындағы газдардың, су буының және еріген заттардың алмасуын шектейтін үздіксіз тор құрайды.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/edible-packaging.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Ораманы қалыптастыру процесі ерітінді немесе суспензия дайындауды, содан кейін оны өнімге батыру, бүрку немесе құю әдісімен жағуды қамтиды. Еріткіш (әдетте су немесе этанол) буланғаннан кейін жұқа қабат түзіледі. Бұл қабаттың құрылымы оның тосқауылдық қасиеттерін анықтайды: ақуыздар механикалық беріктікті қамтамасыз етеді, липидтер судың булануына кедергі жасайды, ал полисахаридтер құрылымдық қаңқаны жасайды.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/edible-packaging.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі әдістерге ылғалды қалыптау (casting), экструзия және электроспиннинг жатады. Құралдар өндіріс көлеміне байланысты: жабындарды жағуға арналған зертханалық қондырғылардан бастап, тамақ өнімдерін орау процесіне біріктірілген өнеркәсіптік желілерге дейін. Әдісті таңдау бастапқы құрамның тұтқырлығына және қорғаныш қабатының қажетті қалыңдығына байланысты.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/edible-packaging.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Технология тамақ өнеркәсібінің қалдықтарын қайта өңдеуде қолданылады. Мысалы, «Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку» мақаласында балық шаруашылығының қосымша өнімдерінен берік үлдір жасау сипатталған. «Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими» зерттеуінде көкөністерді бұзылудан қорғайтын жабын жасау үшін цитрус қалдықтарын пайдалану көрсетілген.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/edible-packaging.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеулер физика-химиялық тұрақтылыққа байланысты: жейтін орама қоршаған ортаның ылғалдылығына сезімтал, бұл қорғаныш қасиеттерінің жоғалуына әкелуі мүмкін. Сондай-ақ, өндірісті кеңейту және орама компоненттері өнімнің дәмі мен иісіне әсер етпеуі үшін органолептикалық бейтараптықты қамтамасыз ету қажеттілігіне байланысты қиындықтар бар. Материалдардың қауіпсіздігі JECFA немесе КО ТР 029/2012 сияқты халықаралық стандарттарға сәйкес келуі тиіс.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Съедобная упаковка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5%20%D0%BA%D0%BE%D0%BC%D0%BF%D0%BE%D0%BD%D0%B5%D0%BD%D1%82%D1%8B%5D%20--%3E%20B%5B%D0%9F%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%97%D0%B0%D1%89%D0%B8%D1%82%D0%BD%D1%8B%D0%B9%20%D0%B1%D0%B0%D1%80%D1%8C%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%BD%D0%B8%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BF%D0%BE%D1%82%D0%B5%D1%80%D0%B8%20%D0%B2%D0%BB%D0%B0%D0%B3%D0%B8%5D%0A%20%20C%20--%3E%20E%5B%D0%9F%D0%BE%D0%B4%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D0%BE%D0%B2%5D%0A%20%20C%20--%3E%20F%5B%D0%97%D0%B0%D0%BC%D0%B5%D0%B4%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BE%D0%BA%D0%B8%D1%81%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20G%5B%D0%A1%D0%BE%D1%85%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5%20%D1%81%D0%B2%D0%B5%D0%B6%D0%B5%D1%81%D1%82%D0%B8%5D%0A%20%20E%20--%3E%20G%0A%20%20F%20--%3E%20G%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анықтама автоматты түрде тексерілді, редакцияның бекітуін күтуде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"anykhtamalykh\"&gt;&lt;a href=\"concepts/edible-packaging.html#anykhtamalykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтамалық&lt;/span&gt;&lt;/a&gt;Анықтамалық&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;film_thickness&lt;/td&gt;\n&lt;td&gt;0,14 мм&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tensile_strength&lt;/td&gt;\n&lt;td&gt;6,53 МПа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;elongation_at_break&lt;/td&gt;\n&lt;td&gt;94,55%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;storage_temperature&lt;/td&gt;\n&lt;td&gt;4 °C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;storage_duration&lt;/td&gt;\n&lt;td&gt;15 days&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"baskha-ataulary\"&gt;&lt;a href=\"concepts/edible-packaging.html#baskha-ataulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа атаулары&lt;/span&gt;&lt;/a&gt;Басқа атаулары&lt;/h2&gt;\n&lt;p&gt;Edible coating, Биоупаковочный материал, биоразлагаемое покрытие&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/edible-packaging.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Теңіз алабұғасының терісі: балық өңдеу қалдықтарынан жеуге жарамды қаптама&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Апельсин қабығы мен қалампыр қызанақтың сақталу мерзімін қалай ұзартады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/materials.html\"&gt;Материалдар&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/edible-packaging.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%8A%D0%B5%D0%B4%D0%BE%D0%B1%D0%BD%D0%B0%D1%8F_%D0%BF%D0%BE%D1%81%D1%83%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Съедобная посуда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Edible_packaging_film.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: File:Edible packaging film.pdf: Paul Pierlot derivative work: Sebastian Wallroth, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.carbpol.2020.116178\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Polysaccharides, Protein and Lipid -Based Natural Edible Films in Food Packaging: A Review&lt;/a&gt; — шолу, Carbohydr Polym 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/foods7100170\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Alginate-Based Edible Films and Coatings for Food Packaging Applications&lt;/a&gt; — шолу, Foods 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.foodres.2020.109582\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Film formation and deposition methods of edible coating on food products: A review&lt;/a&gt; — шолу, Food Res Int 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Жемілі қаптама — бұл өнімдердегі ылғал жоғалуын азайтуға және микроорганизмдердің өсуін тежеуге арналған, тағамдық компоненттерден жасалған биологиялық ыдырайты"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Съедобная упаковка","description":"Жемілі қаптама — бұл өнімдердегі ылғал жоғалуын азайтуға және микроорганизмдердің өсуін тежеуге арналған, тағамдық компоненттерден жасалған биологиялық ыдырайты","vcsPath":"concepts/edible-packaging.md"},"headings":[{"title":"Анықтама","href":"concepts/edible-packaging.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/edible-packaging.html#sholu","level":2},{"title":"Теория","href":"concepts/edible-packaging.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/edible-packaging.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/edible-packaging.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/edible-packaging.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қиындықтар","href":"concepts/edible-packaging.html#shekteuler-men-khiyndykhtar","level":2},{"title":"Анықтамалық","href":"concepts/edible-packaging.html#anykhtamalykh","level":2},{"title":"Басқа атаулары","href":"concepts/edible-packaging.html#baskha-ataulary","level":2},{"title":"Қай жерде кездеседі","href":"concepts/edible-packaging.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts/edible-packaging.html#derekkoezder","level":2}],"title":"Съ
