        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;High-moisture extrusion of pea protein into fibrous texture&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Coyau, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-extrusion.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Хлопья, снеки, текстурированный белок: как работает экструдер.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-extrusion.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Экструзия — тұтқыр материалды немесе қою пастаны пішіндеуші саңылау арқылы өткізу арқылы бұйымдар алудың технологиялық процесі. Тамақ өнеркәсібінде бұл әдіс шикізатты құрғақ таңғы астар, снектер немесе текстураланған өсімдік ақуыздары сияқты белгіленген құрылымы мен пішіні бар өнімдерге айналдыруға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-extrusion.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Экструзия процесі тамақ шикізатына механикалық ығысу, қысым және температура әсеріне негізделген. Экструдер ішінде материал тұтқыр балқыма күйіне ауысады. Процестің негізгі қағидалары деформация, араластыру және пішіндеуді қамтиды. Жылу негізінен беті арқылы берілетін пісіру немесе қуырудан айырмашылығы, экструзия термиялық өңдеуді қарқынды механикалық әсермен біріктіреді.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-extrusion.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Экструзия жүйесі жүктеу бункерінен, шнек механизмінен және пішіндеуші бастиектен тұрады. Шикізат камераға беріледі, онда айналмалы шнектер жоғары қысым тудырады және араластыруды қамтамасыз етеді. Қозғалыс барысында материал қызады, бұл оның тұтқырлығын төмендетеді. Шығу кезінде балқыма фильерадан — өнімге соңғы пішін беретін белгілі бір пішіндегі саңылаудан өтеді.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-extrusion.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құрал — экструдер. Шнектердің құрылымына қарай бір шнекті және екі шнекті жүйелер бөлінеді. Екі шнекті экструдерлер материалдың камерада болу уақытын және ығысу жүктемелерінің қарқындылығын дәлірек бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-extrusion.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Технология өнімдердің кең спектрін жасау үшін қолданылады. Мысалы, «Экструзия қант шыңына қарсы: шикізатты өңдеу шоколадтың сіңуін қалай өзгертеді» мақаласында қант пен сүтті алдын ала экструзиялау организмнің гликемиялық жауабын айтарлықтай өзгертетіні көрсетілген.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/proc-extrusion.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу — температура, шикізат ылғалдылығы және шнектердің айналу жылдамдығы сияқты параметрлерді қатаң бақылау қажеттілігі. Дұрыс таңдалмаған режим қоректік құндылықтың жоғалуына немесе дәмдік сапаның өзгеруіне әкелуі мүмкін.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Экструзия&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A8%D0%B8%D0%BA%D1%96%D0%B7%D0%B0%D1%82%5D%20--%3E%20B%5B%D0%96%D2%AF%D0%BA%D1%82%D0%B5%D1%83%20%D0%B1%D1%83%D0%BD%D0%BA%D0%B5%D1%80%D1%96%5D%0A%20%20B%20--%3E%20C%5B%D0%A8%D0%BD%D0%B5%D0%BA%20%D0%BC%D0%B5%D1%85%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D1%96%5D%0A%20%20C%20--%3E%7C%D2%9A%D1%8B%D1%81%D1%8B%D0%BC%20%D0%BC%D0%B5%D0%BD%20%D0%B6%D1%8B%D0%BB%D1%83%7C%20D%5B%D0%9F%D1%96%D1%88%D1%96%D0%BD%D0%B4%D0%B5%D1%83%D1%88%D1%96%20%D0%B1%D0%B0%D1%81%D1%82%D0%B8%D0%B5%D0%BA%5D%0A%20%20D%20--%3E%20E%5B%D0%A4%D0%B8%D0%BB%D1%8C%D0%B5%D1%80%D0%B0%5D%0A%20%20E%20--%3E%20F%5B%D0%94%D0%B0%D0%B9%D1%8B%D0%BD%20%D1%8D%D0%BA%D1%81%D1%82%D1%80%D1%83%D0%B4%D0%B0%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-extrusion.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Пісіру технологиялары&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-extrusion.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Қант секірісіне қарсы экструзия: шоколадты өңдеу ағзаның реакциясын қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-extrusion.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AD%D0%BA%D1%81%D1%82%D1%80%D1%83%D0%B7%D0%B8%D1%8F_(%D1%82%D0%B5%D1%85%D0%BD%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%81)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Экструзия (технологический процесс) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — шолу, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/bjc.1972.33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a basic biological phenomenon with wide-ranging implications in tissue kinetics&lt;/a&gt; — шолу, Br J Cancer 1972&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm2330\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Membrane lipids: where they are and how they behave&lt;/a&gt; — шолу, Nat Rev Mol Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Хлопья, снеки, текстурированный белок: как работает экструдер."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Экструзия","description":"Хлопья, снеки, текстурированный белок: как работает экструдер.","vcsPath":"concepts/proc-extrusion.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-extrusion.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-extrusion.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-extrusion.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/proc-extrusion.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/proc-extrusion.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/proc-extrusion.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қиындықтар","href":"concepts/proc-extrusion.html#shekteuler-men-khiyndykhtar","level":2},{"title":"Байланысты ұғымдар","href":"concepts/proc-extrusion.html#bajlanysty-ughymdar","level":2},{"title":"Қай жерде кездеседі","href":"concepts/proc-extrusion.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts/proc-
