        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"185\" cy=\"143\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"575\" cy=\"245\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · BIOACTIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Сарысу ақуызын ұзағырақ&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жұмыс істету: бұлшықетке&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;арналған молекулалық «желім»&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Сарысу ақуызы саркопениямен күресуде алтын стандарт болып саналады, бірақ оның тез сіңуі тиімділігін төмендетеді. Зерттеушілер ақуызды қорғайтын және асқазан-ішек жолында біртіндеп бөлінуін қамтамасыз ететін инкапсуляция жүйесін жасап шығарды. Жаңа технология металл-полифенол торлары мен гиалурон қышқылынан «молекулалық желім» ретінде пайдаланып, тұқым құрылымын қайталайды. Бұл шешім бұлшықет ақуызының синтезін ұзақ уақыт бойы қолдауға көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/whey-protein-isolate.html\"&gt;WPI&lt;/a&gt;-ді 90°C және pH 4,5-те полимерлеу инкапсуляция үшін тұрақты негіз жасайды.&lt;/li&gt;\n&lt;li&gt;Ca2+ бар металл-полифенол торлары (&lt;a href=\"concepts/mpns.html\"&gt;MPNs&lt;/a&gt;) ақуызбен берік байланысты қамтамасыз етеді.&lt;/li&gt;\n&lt;li&gt;Жүйе PI3K/AKT/mTOR жолын белсендіріп, тәжірибелік модельдерде бұлшықет атрофиясын басады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Инкапсуляция жүйесін жасау үшін сарысу изолятын (WPI) алдымен pH 4,5 және 90°C температурада 20 минут бойы термиялық полимерлеуден өткізді, бұл 425 ± 106 нм болатын бөлшектердің түзілуіне әкелді. Содан кейін бұл бөлшектердің бетіне проантоцианидиндер мен кальций иондарынан (Ca2+) тұратын металл-полифенол торларының (MPNs) қабаты жағылды, ал сыртқы қорғаныс қабаты ретінде гиалурон қышқылы (HA) қолданылды. Нәтижесінде бөлшектердің көлемі 743 ± 182 нм-ге дейін өсті, ал қорғаныс қабығының қалыңдығы 159 нм болды. Изотермиялық титрлеу әдісімен жүргізілген зерттеу MPNs-тің ақуызбен байланысуы негізінен гидрофобты өзара әрекеттесулер мен 6,7 × 10^8 л/моль байланысу константасы (Ka) арқылы сутектік байланыстар есебінен жүретінін көрсетті.&lt;/p&gt;\n&lt;p&gt;Саркопенияның тышқан моделіндегі тәжірибелерде PWPI@MPNs25/HA қабылдаған топ ұстау күші мен төзімділік сияқты физикалық көрсеткіштердің айтарлықтай жақсарғанын көрсетті. Молекулалық талдау жүйенің PI3K/AKT/mTOR сигналдық жолын белсендіретінін және бұлшықет атрофиясының факторлары MuRF-1 мен Atrogin-1 экспрессиясын басатынын анықтады. Мұндай «тұқым қабығын» пайдалану ақуыз гидролизінің жылдамдығын тиімді бақылауға, оның несепнәрге тым тез метаболизденуінің алдын алуға және аминқышқылдарын бұлшықет тіндерінің қажеттіліктеріне бағыттауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқан моделінде жүргізілген, сондықтан нәтижелер адамдардағы клиникалық сынақтармен расталуы керек. Жүйенің тиімділігі микробиота мен асқазан-ішек жолының pH ортасына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сарысу&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақуызының тез&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сіңуі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;полифенол&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;торына&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инкапсуляция&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қоректік&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;заттардың&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бақылаулы&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бөлінуі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұлшықет&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;синтезін&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тиімді қолдау&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Advanced science (Weinheim, Baden-Wurttemberg, Germany) журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпк
