            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"88\" cy=\"106\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"191\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · MICRONUTRIENTS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Диабеті бар жасөспірімдерге&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;арналған цифрлық білім беру&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;платформасы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f1.jpg\" alt=\"Жоба кезеңдерінің жиынтығы. TAM: Технологияларды қабылдау моделі (Technology Acceptance Model).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жоба кезеңдерінің жиынтығы. TAM: Технологияларды қабылдау моделі (&lt;a href=\"concepts/technology-acceptance-model.html\"&gt;Technology Acceptance Model&lt;/a&gt;).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;1-типті қант диабеті жасөспірімдер үшін үлкен психологиялық жүктеме, сондықтан тамақтануды бақылау қиынға соғады. Зерттеушілер медицина қызметкерлері мен пациенттердің қажеттіліктеріне негізделген интерактивті веб-платформа әзірледі. Бұл құрал дәстүрлі нұсқаулықтардан айырмашылығы, оқу процесін қызықты әрі түсінікті етеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;97,5% маман платформаны оқыту үшін өте ыңғайлы деп тапты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-centered-design.html\"&gt;HCD&lt;/a&gt; тәсілі құралды жасөспірімдер үшін интуитивті әрі қызықты етті.&lt;/li&gt;\n&lt;li&gt;90% медбикелер платформаны клиникалық тәжірибеде қолдануды жоспарлап отыр.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Платформа адамға бағытталған дизайн (HCD) қағидаттары бойынша жасалған, ол пайдаланушының эмоционалдық және техникалық қажеттіліктерін ескереді. Алғашқы кезеңде медбикелермен фокус-топтар өткізіліп, қолданыстағы оқу материалдарындағы кемшіліктер анықталды. React технологиясы негізінде жасалған платформа барлық құрылғыларда ыңғайлы жұмыс істейді.&lt;/p&gt;\n&lt;p&gt;40 маман қатысқан сынақтар платформаның жоғары тиімділігін көрсетті. Технологияны қабылдау моделі (TAM) бойынша жүргізілген сауалнамада 97,5% қатысушы құралды оқу процесін жеңілдететін деп бағалады. 90% маман оны өз жұмысында қолдануға дайын екенін білдірді. Ойын элементтері жасөспірімдердің күрделі медициналық ақпаратты игеруін айтарлықтай жеңілдетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек медицина қызметкерлерінің пікіріне негізделген, пациенттердің ұзақ мерзімді клиникалық нәтижелері зерттелмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;1-типті қант диабеті (1ТҚД) — барлық диабет жағдайларының 10%-ын ғана құрағанымен, педиатриялық және жасөспірімдер популяциясында жоғары таралуымен сипатталатын созылмалы аутоиммундық ауру. Оның басталуы науқас үшін де, оның отбасылық ортасы үшін де өте ауыр тиеді. Испанияда 15 жасқа дейінгі 30 000-нан астам бала осы патологиямен өмір сүреді, аурушаңдық деңгейі жылына әр 100 000 балаға 17 жағдайды құрайды, ал Андалусия ең жоғары көрсеткіштерге ие аймақтардың бірі болып табылады. Клиникалық деңгейде 1ТҚД-ның метаболикалық әсері жақсы сипатталған; алайда, диагноз қойылған кездегі психоәлеуметтік әсері онша байқалмайды және оны шешу қиынырақ. Отбасылар кенеттен күрделі міндеттерге тап болады: гликемиялық бақылау, инсулин енгізу және ең бастысы, нан бірліктері әдісін қолдана отырып, күнделікті тамақтануды басқару. Бұл процесс жоғары эмоционалдық жүктеме, қорқыныш, кінә сезімі, стресс және ақпараттың шамадан тыс көптігі жағдайында өтеді. Дәл осы себепті аурудың алғашқы сәттері шешуші маңызға ие: тек емдеу негізі ғана емес, сонымен қатар науқас, оның отбасы және денсаулық сақтау жүйесі арасындағы қарым-қатынас үні де белгіленеді. Дәл осы жерде маңызды білім беру кедергілері пайда болады: техникалық түсініктерді меңгерудегі қиындықтар, төмен нутритивтік сауаттылық, көмірсуларды санауға немқұрайлы қарау және отбасылардың нақты мүмкіндіктеріне бейімделген құралдардың шектеулілігі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Педиатриялық популяцияда 1ТҚД-ны басқарудың негізгі тіректерінің бірі — көмірсуларға негізделген диетаны басқаруды дұрыс үйрену және қолдану. Бұл тәсіл әр тамақтану үшін көмірсулар мөлшерін есептеуді және гликемиялық профиль мен физикалық белсенділікке қарай инсулиннің жедел дозаларын түзетуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дәстүрлі оқу құралдары қолжетімді болғанымен, олардың көпшілігі отбасылар аурудың басталу кезеңінде бастан кешіретін стресс пен күшті сезімдер үшін жарамсыз. Инсулин терапиясы мен диабет технологияларындағы жетістіктерге қарамастан, қазіргі клиникалық нұсқаулар шектеулі диеталық модельдерден гөрі жеке және науқасқа бағытталған тәсілдерді баса көрсетеді. Алайда, бұл стратегиялар барлық жерде қабылданбаған және көптеген науқастар әлі күнге дейін күнделікті гликемиялық бақылау үшін негізгі құрал ретінде көмірсуларды санауға сүйенеді. Соңғы зерттеулер көрсеткендей, тіпті дамыған денсаулық сақтау жүйелерінде де әр науқастың өмірлік және мәдени кезеңдеріне бейімделген диабеттік білім беруді қамтамасыз етуде құрылымдық кемшіліктер бар. Диеталық ұсыныстарды орындамау білімнің жетіспеушілігімен емес, білім беру құралдары мен пайдаланушылардың тәжірибесі арасындағы алшақтықпен түсіндіріледі. Бұл алшақтық цифрлық ортада одан сайын күшейе түседі: отбасылар, әсіресе жастар, интуитивті, интерактивті және геймификацияланған технологияларға үйренген. Алайда, көптеген білім беру бағдарламалары қатаң, бір бағытты және тартымсыз оқу жоспарларын ұсынады. Сонымен қатар, диабет бойынша медбике-педагогтар балалар мен жасөспірімдерге күтім жасау тәртібіне интеграциялай алатын нақты және келісілген цифрлық материалдардың жоқтығын атап өтеді.&lt;/p&gt;\n&lt;p&gt;Осы шындықты ескере отырып, адамға бағытталған дизайн (HCD) соңғы пайдаланушының шынайылығына бейімделген технологиялық шешімдер арқылы күрделі денсаулық сақтау мәселелерін шешу үшін берік әдіснамалық балама ретінде қалыптасқан. HCD үш негізгі қағидамен сипатталады: пайдаланушыға терең эмпатия, пайдаланушының белсенді қатысуымен үздіксіз итерация және нақты контексттерге бейімделген функционалдық дизайн. Бұл көзқарас технологиялық дизайнның классикалық модельдерінен алшақтайды, мұнда науқас пассивті қабылдаушы болып табылады. Ол науқасты ашу кезеңінен бастап түпкілікті валидацияға дейінгі процестің тең авторына айналдырады. Сонымен қатар, бұл тәсіл тамақтану немесе созылмалы ауруларда өзіне-өзі күтім жасау сияқты мінез-құлық өзгерістерін талап ететін денсаулық сақтау шараларында әсіресе тиімді екенін дәлелдеді. Эмпатия карталары, жедел прототиптеу, практиктермен бірлесіп жасау және нақты пайдаланушылармен дәйекті валидациялар сияқты құралдарды қоса отырып, HCD ұзақ мерзімді перспективада пайдалануға ыңғайлы, эмоционалды түрде қолайлы және тұрақты өнімдерді қамтамасыз етеді. Осы тұрғыда, бұл зерттеу кеш басталған (жасөспірімдік кезеңдегі) 1ТҚД кезінде тамақтану бойынша білім беруде диабет бойынша медбике-педагогтарды қолдау үшін арналған, веб-негізделген, интерактивті және геймификацияланған платформа — &lt;a href=\"concepts/smartcloth-odyssey.html\"&gt;SMARTCLOTH-Odyssey&lt;/a&gt;-дің дизайн және бағалау процесін сипаттауға бағытталған.&lt;/p&gt;\n&lt;p&gt;Бұл зерттеу HCD қағидаларына сәйкес келетін және итеративті үздіксіз жетілдіру процесіне негізделген аралас және дәйекті әдіснамалық тәсілді ұстанды. Платформаны әзірлеу үш негізгі кезеңнен тұрды: фокус-топтар арқылы зерттеудің бірінші сапалық кезеңі; сынақпен дизайн және функционалдық прототиптеудің екінші кезеңі; және диабет бойынша медбике-педагогтар тарапынан цифрлық құралдың қабылдануы талданған үшінші бағалау кезеңі (1-сурет). Бастапқы кезеңде 1ТҚД дебюті бойынша диабеттік білім беруде тікелей тәжірибесі бар денсаулық сақтау мамандарының пікірлері жинақталды. Бұл деректер прототипті жүзеге асыру және итеративті қайта қарау арқылы жетілдірілген функционалдық дизайн ұсынысы үшін негіз болды. Параллель түрде, платформаның пайдалану ыңғайлылығы мен технологиялық қабылдануына бағытталған бағалау жоспарланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HCD (Адамға бағытталған дизайн) — бұл пайдаланушының қажеттіліктері мен тәжірибесін (бұл жағдайда 1ТҚД-мен ауыратын балалардың отбасылары мен медбикелер) әзірлеудің барлық кезеңдерінде бірінші орынға қоятын жобалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеудің бірінші кезеңі Андалусияның (Испания) әртүрлі провинцияларында жұмыс істейтін диабет бойынша медбике-педагогтардың тәжірибесін, қабылдауын және қажеттіліктерін терең зерттеу үшін онлайн фокус-топтарға негізделген сапалық тәсілді қабылдады. Бұл бірінші тәсіл оқу бағдарламасын кейіннен дамыту 1ТҚД-ның алғашқы кезеңдерінде тамақтану бойынша білім беру жүретін клиникалық ортаны шынайы және контекстке сай түсінуге негізделуін қамтамасыз ету үшін жүзеге асырылды. 2024 жылғы 6 және 7 наурызда бейнеконференция арқылы екі фокус-топ сессиясы өткізілді. Фокус-топтар сапалық зерттеулер мен диабеттік білім беру бойынша тәжірибесі бар зерттеу тобының мүшелерімен өткізілді. Екі сессияда да педиатриялық диабеттік білім беруде белсенді, әртүрлі деңгейдегі кәсіби тәжірибесі бар медбикелер қатысты (1-кесте). Сессиялар бейнеге түсіріліп, құпиялылықтың этикалық қағидаларына қатаң сәйкес толық транскрипцияланды: жеке деректер мен араласулар кейінгі сапалық талдау үшін анонимдендірілді және кодталды. Таңдау мақсатты болды және аумақтық және кәсіби әртүрлілікті қамтамасыз ету үшін әдейі ұйымдастырылды.&lt;/p&gt;\n&lt;p&gt;1-кесте. Фокус-топ қатысушылары.&lt;br /&gt;\nКодтық аты / Жасы (жыл) / Педагог ретіндегі тәжірибесі (жыл) / Провинция&lt;br /&gt;\nN1 / 61 / 10 / Кордова&lt;br /&gt;\nN2 / 56 / 6 / Альмерия&lt;br /&gt;\nN3 / 40 / 1 / Кадис&lt;br /&gt;\nN4 / 36 / 2 / Хаэн&lt;br /&gt;\nN5 / 44 / 3 / Малага&lt;br /&gt;\nN6 / 37 / 2 (сонымен қатар нутрициолог) / Севилья&lt;/p&gt;\n&lt;p&gt;Топтар жоба мақсаттары мен HCD тұжырымдамалық негіздері негізінде әзірленген жалпы сценарий айналасында құрылды. Бұл сценарий төрт кең талдамалық өлшемге топтастырылған ашық сұрақтарды қамтыды: (1) Технологияны (цифрлық кітаптар мен нұсқаулықтар, қосымшалар мен цифрлық платформалар) қамтитын білім беру құралдарын пайдалану тәжірибесі. (2) Медбике тұрғысынан да, науқас пен отбасы тұрғысынан да тиімдірек және тиімділігі төмен құралдарды қабылдау. (3) Техникалық, коммуникативті және эмоционалдық аспектілерді қамтитын білім беру ресурстарын таңдау үшін жеке критерийлер. (4) Науқастар мен олардың қамқоршыларының қажеттіліктері туралы түсінік, әсіресе тамақтануды емдеу дебюті және оны орындау контекстінде. Өкілдік сұрақтар \"Сіз қандай технологиялық ресурстарды пайдаландыңыз немесе ұсындыңыз?\", \"Қай құралдарды ең тиімді деп санайсыз және неге?\" немесе \"Отбасылар үшін қолжетімді құралдарда қандай олқылықтарды байқадыңыз?\" сияқты сұрақтарды қамтыды. Бұл құрылым жалпы тәжірибелер және қабылданған кедергілер, байланысты сезімдер мен күтулер сияқты негізгі субъективті элементтер туралы ақпарат алуға мүмкіндік берді. Жиналған деректер сөзбе-сөз транскрипцияланды және тақырыптық категориялық кодтау стратегиясы арқылы талданды. Бұл тәсіл қатысушылар арасында жалпы және өзгеше өрнектерді анықтауға мүмкіндік берді және цифрлық платформаның кейінгі дизайнын хабардар етті. Деректерді жинау тақырыптық қанықтылыққа жеткенге дейін жалғасты. Талдау екі зерттеушімен тәуелсіз жүргізілді, келіспеушіліктер талқылау арқылы шешілді.&lt;/p&gt;\n&lt;p&gt;Бастапқы сапалық зерттеу кезеңінен кейін, 2 диабет бойынша медбике-педагог, 1 педиатриялық эндокринология бойынша маман дәрігер, 2 веб-әзірлеуші және ғылыми білім беру бойынша тәжірибесі бар 1 университет оқытушысымен бірлесіп жасау сессиясы ұйымдастырылды. Платформаның мазмұндық блоктары мен педагогикалық хикаясы осы кеңістікте белгіленді және фокус-топтардың нәтижелеріне сәйкес прогрессивті оқу модульдеріне бөлінді. 2024 жылғы сәуірде ұсынылған құрылым мен мазмұн қатысушы медбикелерге ұсынылды, олар оны растады және жақсарту бойынша ұсыныстар берді. Кейіннен мазмұнды педагогикалық және техникалық қарап шығуда ынтымақтасу үшін үш жұмыс тобы құрылды. Содан кейін платформаның графикалық дизайны мен бағдарламалау бойынша дәйекті жетістіктерге қол жеткізілді. SMARTCLOTH-Odyssey-дің функционалдық нұсқасы жүзеге асырылғаннан кейін, уақыт кестесінің әртүрлі кезеңдерінде үш құрылымдық сынақ сессиясы өткізілді: (1) 2024 жылғы 24 қазан: диабет бойынша медбике-педагогтар қатысты; (2) 2025 жылғы 20 наурыз: диеталық терапия және диабеттік білім беру бойынша білімі бар, тамақтану күтімі курсын өткен медбикелік студенттер қатысты; және (3) 2025 жылғы 15 мамыр: медбикелер мен педиатрлар қатысты, бұл көбірек клиникалық және интегративті көріністі қамтамасыз ету үшін (2-кесте).&lt;/p&gt;\n&lt;p&gt;2-кесте. Сынақ сессияларының қатысушылары.&lt;br /&gt;\nСессия / Кодтық аты / Жасы / Тәжірибесі / Провинция&lt;br /&gt;\n24 қазан 2024 / N7–N11 / 36–56 / 3–15 / Кадис, Кордова, Альмерия, Севилья, Хаэн&lt;br /&gt;\n20 наурыз 2025 / NS1–NS7 / 18–20 / N/A / Севилья, Кордова, Уэльва, Хаэн&lt;br /&gt;\n15 мамыр 2025 / N11–N20, P1–P2 / 34–59 / 3–37 / Уэльва, Кордова, Кадис, Альмерия, Хаэн&lt;/p&gt;\n&lt;p&gt;Наурыз сессиясы цифрлық сауаттылығы жоғары соңғы пайдаланушыларға (жасөспірімдерге) жақын көріністі алу үшін жас студенттерді қамтыды. Платформа React (Meta Platforms, Inc) көмегімен әзірленді, ол жұмыс үстелі, планшет және смартфондарда сәйкестікті қамтамасыз ететін сезгір дизайнды қолдайды. Сынақ сессиялары негізінен жұмыс үстелі ортасында өткізілді, бұл экранды жазуды және \"think-aloud\" хаттамасы көмегімен құрылған бақылау деректерін жинауды жеңілдетті. Сессиялар барысында объективті бағалау блоктары мен сапалық бақылаумен құрылған пайдалану ыңғайлылығы талдауының торлары қолданылды. Ортаны жалпы түсіну, тапсырмаларды орындау ыңғайлылығы, мәзірлер, мазмұн және мультимедиамен өзара әрекеттесу, спонтанды реакциялар, ұсыныстар мен қиындықтар талданды. Ұсынылған тапсырмалар профиль жасау, геймификацияланған мазмұнға кіру, бейнелерді зерттеу, сұрақтарға жауап беру және кейбір видео ойындарды ойнауды қамтыды. \"Think-aloud\" техникасы қатысушылардан қарап шығу кезінде өз ойлары, қабылдаулары мен шешімдерін ауызша айтуды сұрап қолданылды. Бұл техника бізге үйкеліс, шатасу немесе артық жүктеме орындарын анықтауға және мотивация немесе қанағаттану тудыратын элементтерді растауға мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Соңғы сессия соңында қатысушылар бүйір мәзірінде қолжетімді веб-платформаға бейімделген Технологияны қабылдау моделі сауалнамасын толтырды. Бұл нұсқа Дэвистің бастапқы ұсынысына және оның кейінгі кеңейтілуіне негізделген, жобаның нақты контексті үшін бейімделген және расталған. Сауалнама келесі өлшемдерді бағалады: (1) қабылданған пайдалылық, (2) қабылданған пайдалану ыңғайлылығы, (3) пайдалануға деген көзқарас және (4) пайдалану ниеті. Жауаптар сауалнамадағы мәлімдемелерге төрт деңгейлі келісіммен Лайкерт типті шкала көмегімен түсіндірілді.&lt;/p&gt;\n&lt;p&gt;Бұл зерттеудің талдамалық тәсілі SMARTCLOTH-Odyssey платформасын жобалау, әзірлеу және валидациялау процесінің әртүрлі кезеңдерінде пайдаланушы мінез-құлқын, тәжірибесін және қабылдануын жан-жақты түсінуді қамтамасыз ету үшін сапалық және сандық әдістерді біріктірді. Сапалық деректер бойынша фокус-топ сессияларының транскрипттері мен \"think-aloud\" арқылы пайдалану ыңғайлылығы сынақтары бойынша тақырыптық мазмұн талдауы жүргізілді. Екіншісі пайдаланушы тесттері кезінде қолданылды және қатысушылар құралмен өзара әрекеттескенде білдірген ойлау, қиындықтар, күмәндар немесе пайымдауларды нақты уақыт режимінде қамтуға мүмкіндік берді. Аудиолар транскрипцияланып, анонимдендірілді, ауызша өрнектер түсіну, навигация, қабылданған пайдалылық, технологиялық кедергілер және веб-жетілдіру бойынша ұсыныстарға қатысты алдын ала белгіленген және пайда болған категориялар бойынша кодталды және сыныпталды. Сандық деректерге келетін болсақ, қатысушыларды әлеуметтік-демографиялық және кәсіби айнымалыларға (жасы, тәжірибе жылдары және т.б.) қарай сипаттау үшін сипаттамалық статистика қолданылды, сапалық айнымалылар абсолютті және салыстырмалы жиіліктерде, сандық айнымалылар орталық тенденция мен дисперсия өлшемдері (медиана және IQR) арқылы өрнектелді. Платформаның технологиялық қабылдануын бағалау үшін жауаптар төрт деңгейлі Лайкерт типті шкала көмегімен түсіндірілді және әр деңгей үшін жауап пайыздары зерттелді. Бұл сыныптау платформаның қабылдану деңгейін объективті анықтауға және оны сессияларда жасалған сапалық бақылаулармен салыстыруға мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Бұл зерттеу Испанияда адамдар қатысатын зерттеулер бойынша қолданыстағы нормаларға сәйкес, 2018 жылғы 5 желтоқсандағы Жеке деректерді қорғау және цифрлық құқықтарға кепілдік беру туралы 3/2018-ші Органикалық заңда белгіленген ережелерді сақтай отырып жүргізілді. Сол сияқты, Хельсинки декларациясы, Еуропа Кеңесінің Адам құқықтары және биомедицина туралы конвенциясы және ЮНЕСКО (Біріккен Ұлттар Ұйымының Білім, ғылым және мәдениет мәселелері жөніндегі ұйымы) Адам геномы және адам құқықтары туралы жалпыға ортақ декларациясында (1997) қамтылған негізгі этикалық қағидалар сақталды. Қатысушылардан ешқандай клиникалық немесе сезімтал деректер жиналмады, өйткені қызмет тек пайдалану ыңғайлылығын талдауға және Технологияны қабылдау моделі сауалнамасы арқылы технологиялық қабылдануын бағалауға бағытталған еді. Алайда, сынақ сессиялары кезінде бейне және аудио жазбалар алынғандығын ескере отырып, барлық қатысушылар хабардар етілген келісім нысанын және бейне құқықтарын беру үшін арнайы келісім нысанын қол қойды. Бұл зерттеу Кордова провинциясының Зерттеулер жөніндегі этика комитеті (Comité de Ética de la Investigación Provincial de Córdoba) тарапынан 2024 жылғы 24 сәуірде өткен 361-ші отырысында этикалық мақұлдау алған SMARTCLOTH технологиялық шешімдер экожүйесін дамытушы кеңірек зерттеу жобасының бір бөлігі болып табылады. Қатысушылар өз қатысулары үшін ешқандай қаржылық өтемақы алмады.&lt;/p&gt;\n&lt;p&gt;Екі фокус-топ Андалусияның әртүрлі провинцияларынан барлығы 6 диабет бойынша медбике-педагогты біріктірді. Талқылаулар еркін, кең ауқымды және бай нюанстарға ие болды, бұл зерттеу тобына педиатриялық 1ТҚД дебюті бойынша нақты білім беру тәжірибесінің егжей-тегжейлі көрінісін ұсынды (3 және 4-кестелер).&lt;/p&gt;\n&lt;p&gt;3-кесте. SMARTCLOTH-Odyssey планеталары бойынша білім беру мазмұнын бөлу.&lt;br /&gt;\nПланета / Мазмұны / Геймификация&lt;br /&gt;\nNewland / 1ТҚД-ға жалпы кіріспе, гликемия мен гипергликемия анықтамасы, симптомдар / Енгізілмеген&lt;br /&gt;\nDiabion / 1ТҚД дегеніміз не? Глюкозаның энергиядағы рөлі, метаболизм, инсулин / Сұрақ және жауаптар&lt;br /&gt;\nGlucopolis / Диабет қалай басқарылады? Тамақтану мен инсулиннің маңызы / Ағзалар орналасуы, лабиринттер, әліппе сорпасы&lt;br /&gt;\nGluconebula / Өзімді қалай сезінемін? Эмоционалдық және психологиялық жағдайлар / Енгізілмеген&lt;br /&gt;\nAlimentarium / Күн сайын не жейміз? Макронутриенттер құрамы / Азық-түлікті макронутриентке қарай сұрыптау (Drag and drop)&lt;br /&gt;\nDexteria Prime / Гликемиялық индекс және гликемиялық жүктеме / Гликемиялық индекс және жүктеме викторинасы&lt;br /&gt;\nPlatopia / Қалай тамақтануым керек? Азық-түлік таңдау, жиілік, порция өлшемдері / Гарвард салауатты тәрелкесіне азық-түлік қою&lt;br /&gt;\nSportland / Диабетпен спорт ойнау / Физикалық белсенділік кезіндегі тамақтану ерекшеліктері / Енгізілмеген&lt;br /&gt;\nRacionix / Рационды қалай есептеуге болады? Рацион түсінігі және есептеу әдісі / Рацион есептеу үшін ыдыстар мен азық-түлік мысалдары&lt;br /&gt;\nGluconix / Азық-түлік жапсырмасы / Рацион есептеу үшін жапсырмалар мысалдары&lt;br /&gt;\nOn the way home / Қайталау / Әр блокта алынған білімді бекіту үшін сұрақтар / Әр тақырыптық блоктан кездейсоқ сұрақтар&lt;br /&gt;\nEarth / Мәзір құру және рационды есептеу / Мәзір құру үшін азық-түлікті орналастыру&lt;/p&gt;\n&lt;p&gt;4-кесте. Фокус-топтарда талдау категориялары бойынша алынған ақпараттар қысқаша мазмұны.&lt;br /&gt;\nКатегория / Негізгі ақпараттар / Кейбір дәйексөздер [испан тілінен аударылған]&lt;br /&gt;\nБілім беру материалдары мен стратегияларының әртүрлілігі / Практиктер өз критерийлеріне бейімделген әртүрлі ресурстарды пайдаланады, бірақ жалпы өрнексіз. / \"Және Диабет қорының кестесі, онда рационды қамтамасыз ететін шикі және пісірілген тамақтың салмағы бар, ол да Диабет қорынан. Ол да.\"&lt;br /&gt;\nЭмоционалдық кедергілер мен бейімделу қиындықтары / Дебют айтарлықтай эмоционалдық әсер және оқуға кедергі келтіретін контексттік кедергілермен өтеді. / \"...Мен бұны (тамақтану бойынша білім беру) жасап жатқанда, отбасы өте езілген және білім беру тәсілі ең көп бас тартуға себеп болатын бөлік...\"&lt;br /&gt;\nГомогенизация мен жүйелеу қажеттілігі / Қолда бар мазмұнды ұйымдастыру, сүзу және біріктіру таралудың алдын алу үшін қажет. / \"Барлығы келісілген болуы және біз бәріміз...\"&lt;br /&gt;\nЦифрлық және геймификацияланған құралдарды бағалау / Қатысушылар технологиялар мен ойындарды пайдалануды инновациялық білім беру көмегі ретінде бағалайды. / \"...басқаша айтқанда, мен түсінемін, XXI ғасырда баспа PDF беруден ұяламын...\"&lt;/p&gt;\n&lt;p&gt;Ең айқын нәтижелердің бірі практиктер қолданатын материалдар мен тәсілдердің үлкен әртүрлілігі мен сапасы болды. Рацион диетасын үйрету маңыздылығы бойынша бәрі келіссе де, қолданылған пішін мен ресурстар гетерогенді болды. Осылайша, N2 былай деді: Егер біз азық-түлік жапсырмаларын оқығымыз келсе және олар пропорция ережелерін қалай жасауды білсе, мен басқа түсіндірмеймін, бірақ болмаса, оларға HC калькулятор қосымшасын жүктеп алуды айтамын... N3 және N6 болса, отбасылар мен медбикелер тарапынан жақсы қабылданған технологияға негізделген құралдар мен білім беру веб-сайттарын бөліп көрсетті: Мысалы, маған La Mesa Azul өте ұнайды, өйткені мен айтқандай, олар нутрициологтар, олар қатысады және диабет туралы көп нәрсені біледі және жаңартылған. [N3]&lt;/p&gt;\n&lt;p&gt;Барлық қатысушылар диагноз қойылған сәтте отбасылар мен науқастарды оқытудың эмоционалдық қиындығын, жоғары эмоционалдық жүктеме мен осалдық контекстін атап өтті. Сол сияқты, бір уақытта үлкен көлемдегі ақпаратты ұсыну, тіпті тез оқылуы керек бүкіл негізгі кітаптар да стресс көзі ретінде қарастырылады. N6 былай деді: Және мен бұны зеріктіретін және өте шаршататын деп білемін... Олар сәл езілген күйде келеді. \"Мен кітапты оқуға үлгермедім\". Біз жауап береміз, \"Жарайды, уайымдамаңыз...\"&lt;/p&gt;\n&lt;p&gt;Ең айқын консенсустардың бірі күнделікті, қолжетімді, жалпы және сенімді негіз ретінде қызмет ететін құралға деген қажеттілік болды, N3 атап өткендей: Меніңше, ақыр соңында біз консенсусқа жетуіміз керек және біз пайдаланатын барлық материалдар... әріптесіміз бұрын айтып өткен нәрсе болуы керек. Барлығы келісілген болуы және біз бәріміз... Мен сенімді веб-сайттар болуын меңзеп тұрмын.&lt;/p&gt;\n&lt;p&gt;Цифрлық құралдар мен олардың әлеуеті туралы қабылдау оң болды, әсіресе жасөспірімдерге қатысты. Кеңес беру кезінде кейде пайдалануға мәжбүр болған жұмыс туралы қабылдаудың сипаттамасы ерекшеленеді: Бұл жоқ. Меніңше, XXI ғасырда баспа PDF беруден ұяламын. Мен сізге уәде беремін... Мобильді телефоныңыздан Қытайдан бағыңыздың қандай екенін көре алсаңыз, біз беретін шешімдер тарихқа дейінгі нәрселер. [N6]&lt;/p&gt;\n&lt;p&gt;Ақыр соңында, талдаудан топ тарапынан бөлісілген және кейінгі дизайн кезеңін басқарған бірнеше негізгі нүктелер пайда болды: (1) құнды және сенімді ақпараттар мен ресурстар байлығы бар; (2) бұл ақпараттар кең таралған және әрқашан қайта пайдалану үшін пайдалы түрде ұйымдастырылмаған немесе құрылымдалмаған; (3) әр медбике өзі үшін ең ыңғайлы және тиімді материалдар мен әдістерді пайдаланады, бұл оқытудағы теңсіздіктерге әкеледі; және (4) дидактикалық, қарапайым және бейімделгіш түрде негізгі мазмұнды біріктіретін стандартты цифрлық құралға деген қажеттілік бар.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f1.jpg\" alt=\"Жоба кезеңдерінің жиынтығы. TAM: Технологияларды қабылдау моделі (Technology Acceptance Model).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жоба кезеңдерінің жиынтығы. TAM: Технологияларды қабылдау моделі (Technology Acceptance Model).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f2.jpg\" alt=\"2025 жылғы 15 мамырдағы пайдаланушылық тестілеу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2025 жылғы 15 мамырдағы пайдаланушылық тестілеу.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f3.jpg\" alt=\"TAM сауалнамасын толтыруға арналған веб-сайттың скриншоты (испан тілінде). Profes.: медицина маманының түрі; TAM: Технол\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;TAM сауалнамасын толтыруға арналған веб-сайттың скриншоты (испан тілінде). Profes.: медицина маманының түрі; TAM: Технологияларды қабылдау моделі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f4.jpg\" alt=\"SMARTCLOTH-Odyssey басты экраны.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SMARTCLOTH-Odyssey басты экраны.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f5.jpg\" alt=\"SMARTCLOTH-Odyssey жүйесіне кіру экраны (испан тілінде).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SMARTCLOTH-Odyssey жүйесіне кіру экраны (испан тілінде).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f6.jpg\" alt=\"SMARTCLOTH-Odyssey жұлдыз картасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SMARTCLOTH-Odyssey жұлдыз картасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f7.jpg\" alt=\"SMARTCLOTH-Odyssey бүйірлік мәзірі. TAM: Технологияны қабылдау моделі (Technology Acceptance Model).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SMARTCLOTH-Odyssey бүйірлік мәзірі. TAM: Технологияны қабылдау моделі (Technology Acceptance Model).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жасөспірімдерд&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;і диетаға&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;үйрету&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қиындығы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;HCD негізінде&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;платформа&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасау&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fil
