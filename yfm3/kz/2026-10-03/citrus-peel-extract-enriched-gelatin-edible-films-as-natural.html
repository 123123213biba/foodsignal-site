        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"252\" cy=\"130\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"628\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PRESERVATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Цитрус қабығы тауық&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;котлеттерін ұзақ сақтауға&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай көмектеседі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural-f1.jpg\" alt=\"1-сурет. Цитрус қабығының экстракты косылған желатинді пленкалармен қапталған тауық котлеттерінің (бургерлерінің) 147 кү\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Цитрус қабығының экстракты косылған желатинді пленкалармен қапталған тауық котлеттерінің (бургерлерінің) 147 күн бойы тоңазытылған сақтау кезіндегі микробиологиялық сапасының өзгерістері&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Цитрус қабығының экстракты косылған желатинді пленкалармен қапталған тауық котлеттерінің (бургерлерінің) 147 күн бойы тоңазытылған сақтау кезіндегі микробиологиялық сапасының өзгерістері: (A) жалпы психрофильді бактериялар, (B) жалпы аэробты мезофильді бактериялар, (C) жалпы колиформды бактериялар, (D) жалпы сүт қышқылы бактериялары және (E) жалпы зең мен ашытқы саңырауқұлақтарының саны. Мәндер орташа ± стандартты ауытқу (n = 3) түрінде көрсетілген. Микробтар саны log КӨБ/г арқылы берілген. Тиісті деректер кестесіндегі әртүрлі әріптер өңдеу түрлері мен сақтау мерзімдері арасындағы статистикалық маңызды айырмашылықтарды көрсетеді (P &amp;lt; 0,05).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Зерттеушілер мұздатылған жартылай фабрикаттардың бүлінуін баяулататын табиғи әдісті тапты. Цитрус қабығының сығындысымен байытылған &lt;a href=\"concepts/gelatin.html\"&gt;желатин&lt;/a&gt; қабықшасы тотығу мен бактериялардың көбеюін тиімді тежейді. 4% грейпфрут сығындысы 147 күн бойы котлеттердің сапасын сақтауда ең жақсы нәтиже көрсетті.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Желатин қабықшасындағы 4% грейпфрут сығындысы майлардың тотығуын ең жақсы тежейді.&lt;/li&gt;\n&lt;li&gt;Қаптама -18 °C температурада психрофильді және мезофильді бактериялардың өсуін басады.&lt;/li&gt;\n&lt;li&gt;Цитрус сығындылары табиғи консервант ретінде жұмыс істейтін фенолды қосылыстарға бай.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Тәжірибеде 1%, 2% және 4% грейпфрут, апельсин және лимон сығындылары қосылған желатин қабықшалары қолданылды. Сығындылар 45 °C температурада кептірілген қабықтардан &lt;a href=\"concepts/ultrazvukovaya-ekstraktsiya.html\"&gt;ультрадыбыстық экстракция&lt;/a&gt; (40 кГц, 30 °C) әдісімен алынды. Котлеттер -18 °C температурада сақталып, олардың жай-күйі бірнеше апта сайын талданды.&lt;/p&gt;\n&lt;p&gt;147-күні 4% грейпфрут сығындысы бар қабықшаға оралған үлгілерде асқын тотығу саны (4,50 мэкв O₂/кг) мен тиобарбитур қышқылының көрсеткіші (0,74 мг &lt;a href=\"concepts/malondialdehyde.html\"&gt;МДА&lt;/a&gt;/кг) ең төмен болды, бұл жоғары антиоксиданттық қорғанысты білдіреді. Сондай-ақ, бақылау тобымен салыстырғанда аэробты мезофильді және психрофильді бактериялардың, зең мен ашытқылардың жалпы саны айтарлықтай азайғаны анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зертханалық жағдайда жүргізілгендіктен, қабықшаның өндірістік ауқымдағы тиімділігі қосымша тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Бұл зерттеуде цитрус жемістерінің қабығынан алынған сығындылармен (грейпфрут, апельсин және лимон) 1%, 2% және 4% концентрацияда байытылған жеуге жарамды желатин пленкаларының − 18 °C температурада мұздатылған күйде сақталатын тауық бургерлерінің сапасы мен сақтау мерзіміне әсері 147 күн бойы зерттелді. Маңыздысы, байытылған желатин пленкаларын қолдану арқылы микробтық өсу мен тотығуды тежеу арқылы сақтау мерзімі ұзартылды. 147-күні 4% грейпфрут қабығының сығындысы бар үлгілер бақылау тобындағы орамасыз үлгілерге қарағанда айтарлықтай төмен асқын тотығу мәнін (4,50 мэкв O₂/кг), тиобарбитур қышқылының мәнін (0,74 мг МДА/кг), жалпы ұшпа негіздік азотты (11,20 мг N/100 г) және pH (6,77) көрсеткіштерін көрсетті (p ≤ 0,05). Сонымен қатар, микробиологиялық талдау 4% цитрус қабығы сығындылары бақылау және басқа топтармен салыстырғанда бургерлердегі жалпы аэробты психрофильді бактериялардың, мезофильді бактериялардың, колиформды бактериялардың, сүт қышқылы бактерияларының, сондай-ақ ашытқы мен зең саңырауқұлақтарының жалпы санын айтарлықтай тежегенін көрсетті. Грейпфрут қабығы ең жоғары антиоксиданттық және фенолдық құрамға ие болды, одан кейін апельсин және лимон қабықтары тұр. Жалпы алғанда, 4% цитрус қабығы сығындыларымен байытылған желатин пленкалары жақсартылған антиоксиданттық және бактерияға қарсы қабілеттерін көрсетті, бұл олардың ет өнімдерін сақтау үшін табиғи белсенді орау материалдары ретіндегі әлеуетін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4% грейпфрут сығындысы қосылған желатин пленкалары тотығу мен микрофлораның өсуін бәсеңдетіп, мұздатылған тауық бургерлерінің сақтау мерзімін 147 күнге дейін ұзартады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Түйінді сөздер: Белсенді орау · Цитрус қабығының сығындысы · Сақтау мерзімі · Жеуге жарамды желатин пленкасы · Тауық бургерлері · Антимикробтық қасиеттер · Мұздатылған күйде сақтау · Липидтердің тотығуы · Табиғи консервант&lt;/p&gt;\n&lt;p&gt;Тауық еті ақуыздарды, майдың аз мөлшерін, бос аминқышқылдарын, дәрумендер мен минералдарды қамтитын жоғары тағамдық құндылыққа ие. Алайда, тауық еті төмен температурада сақталса да, тез бұзылатын өнім болып табылады. Бұзылуға ықпал ететін негізгі факторларға оттегі, табиғи ферменттер және микробтық белсенділік жатады. Тоңазытқышта сақтау кезінде Pseudomonas spp., Enterobacteriaceae, Brochothrix thermosphacta және сүт қышқылы бактериялары сияқты психротрофты бактериялардың метаболикалық белсенділігі көбінесе физика-химиялық өзгерістерге әкеледі. Жалпы алғанда, тауық етіндегі бұл бұзылу процестері pH өзгеруіне, шырыш түзілуіне және құрылымдық компоненттердің деградациясына себеп болады. Сондықтан қазіргі уақытта зерттеушілер микробтық өсу мен тотығуды тежеу үшін табиғи әдістерді, соның ішінде биополимерлерді (желатин, &lt;a href=\"concepts/chitosan.html\"&gt;хитозан&lt;/a&gt;, &lt;a href=\"concepts/sodium-alginate.html\"&gt;альгинат&lt;/a&gt;, крахмал, агар, каррагинан, коллаген және кератин) консервант ретінде пайдалануды зерттеп жатыр. Бұл &lt;a href=\"concepts/biopolimery.html\"&gt;биополимерлер&lt;/a&gt; биопластиктерге, жеуге жарамды пленкаларға немесе функционалды қоспаларға айналдырылады. Жеуге жарамды пленка — бұл тағам өнімінің бетіне тікелей жағылатын жеуге жарамды материалдың жұқа қабаты. Оның негізгі қызметі...&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биополимерлер — бұл тағам өнімдерін сыртқы ортадан қорғау үшін қолданылатын, табиғатта кездесетін ақуыз немесе полисахарид негізіндегі экологиялық таза материалдар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Тауық еті бүкіл әлемде ең көп тұтынылатын ет түрлерінің бірі болып табылады және жануарлар ақуызының маңызды көзі қызметін атқарады. Ол өзінің қасиеттеріне байланысты салауатты тамақтану нұсқасы болып саналады. Пленкалардың негізгі қызметі микробтардың өсуі, оттегі мен су буының өткізгіштігі және хош иісті заттардың жоғалуы сияқты бүліну факторларын азайту, осылайша азық-түлік өнімдерінің сақтау мерзімін ұзарту болып табылады. Мұндай пленкалар әдетте полисахаридтер мен ақуыздар сияқты биополимерлерді қолдану арқылы өндіріледі. Демек, бұл биополимерлердің физикалық қасиеттері мен құрылымдық сипаттамалары матрицаның құрамы мен құрылымына байланысты өзгеруі мүмкін. Желатин ең маңызды және көрнекті биополимерлердің бірі болып табылады. Бұл ақуыз туындысы, өзінің бірегей қасиеттеріне, соның ішінде гель түзу қабілетіне, беттік белсенділігіне, тұтқырлықты бақылауға және тамаша пленка түзу қабілетіне байланысты тамақ өнеркәсібінде кеңінен қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Желатин негізіндегі биополимерлі пленкалар микробтар мен оттегі үшін тосқауыл жасап, өнімдердің бүлінуін тиімді баяулатады, алайда тотығудан қорғау үшін қоспаларды қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биополимерлер — бұл азық-түлік өнімдерін орау үшін қолданылуы мүмкін табиғи полимерлер (ақуыз, крахмал).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алайда, бұл артықшылықтарға қарамастан, таза желатин және желатин негізіндегі пленкалар өздеріне тән антиоксиданттық және микробқа қарсы қасиеттерінің болмауына байланысты қолданылуы шектеулі. Бұл шектеуді еңсеру үшін соңғы зерттеулер биологиялық ыдырайтын пленкалардың функционалдық қасиеттерін табиғи өсімдік антиоксиданттарын, мысалы, сығындылар мен эфир майларын қосу арқылы жақсартуға бағытталған. Фенолды қосылыстарға бай және әртүрлі өсімдік бөліктерінен (мысалы, жемістер, жапырақтар, тұқымдар және қабықтар) алынған бұл өсімдік сығындылары желатин негізіндегі пленкалар мен жабындарды әзірлеуде белсенді ингредиенттер ретінде тиімді қолданылған. Осы себепті, цитрус жемістері өзінің тартымды түсі, дәмі мен хош иісі арқасында әлемдегі ең танымал жеміс дақылдарының бірі болып табылады. Әлем бойынша цитрус өндірісі жылына 157 миллион тоннадан астамға өсті. Бұл жемістер 1300-ден астам түрді қамтитын Rutaceae тұқымдасына жатады. Апельсин, лимон, мандарин, лайм және грейпфрут әлемде ең көп тұтынылатын цитрус жемістері болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу пленкалардың зертханалық моделіне бағытталған; өнеркәсіптік ауқымда нәтижелер өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дегенмен, цитрус жемістері қалдықтарының шамамен 50–60%-ы тұтынудан немесе өңдеуден кейін жарамсыз болып қалады, оған қабықтар, тұқымдар, жұмсақ ет және сегмент қалдықтары жатады. Көптеген зерттеулер цитрус қабығының тамақ өнеркәсібіндегі әлеуетін зерттеді, өйткені олар эфир майлары, дәрумендер, флавоноидтар, тағамдық талшықтар, ақуыздар, пектин және әртүрлі фенолды қосылыстар сияқты құнды биоактивті компоненттердің бай көзі болып табылады. Цитрус қабығы сығындыларының антиоксиданттық және микробқа қарсы қасиеттері фенолды қышқылдар, эфир майлары және флавоноидтар (мысалы, гесперидин және нарингин) сияқты биоактивті қосылыстардың болуымен байланысты, олар алдыңғы зерттеулерде сипатталғандай, азық-түлік жүйелерінде табиғи консерванттар ретінде үлкен әлеуетке ие екенін көрсетті. Алдыңғы зерттеулер көрсеткендей, цитрус қабығынан алынған биоактивті қосылыстарды биополимерлі матрицаларға қосу су буының өткізгіштігі, оттегі тосқауылының қабілеті және механикалық беріктік сияқты маңызды физикалық қасиеттерді өзгертуі мүмкін. Бұл модификациялар жеуге жарамды пленкалардың антиоксиданттық және микробқа қарсы қасиеттерін айтарлықтай жақсартып, осылайша азық-түлік сапасын арттырып, сақтау мерзімін ұзартуы мүмкін. Сонымен қатар, цитрус қабығы сығындылары азық-түлік жүйелерінде табиғи консерванттар ретінде үлкен әлеуетке ие фенолды қосылыстарға, флавоноидтарға және басқа фитохимиялық заттарға бай.&lt;/p&gt;\n&lt;p&gt;Алайда, бұл перспективалы нәтижелерге қарамастан, мұздатылған күйде ұзақ уақыт сақтау кезінде тауық котлеттерін сақтау үшін желатин негізіндегі жеуге жарамды пленкаларға қосылған грейпфрут, апельсин және лимон қабығы сығындыларының салыстырмалы тиімділігі туралы мәліметтер шектеулі. Біздің мәліметтеріміз бойынша, аз ғана зерттеулер бұл цитрус қабығы сығындыларының консерванттық тиімділігін бірдей құрамдар мен сақтау шарттарында әртүрлі деңгейлерде қосқанда жүйелі түрде салыстырған, сонымен бірге олардың физика-химиялық қасиеттерге, тотығу тұрақтылығына және микробиологиялық сапаға әсерін бағалаған. Сондықтан, бұл зерттеу 1%, 2% және 4% грейпфрут, апельсин және лимон қабығы сығындыларымен байытылған желатинді жеуге жарамды пленкалардың − 18 °C температурада 147 күн бойы мұздатылған күйде сақтау кезінде тауық котлеттерінің сапасы мен сақтау мерзіміне әсерін бағалауға бағытталған. Негізінен жеке цитрус сығындыларын немесе пленкаларды бөлек зерттеген алдыңғы зерттеулерден айырмашылығы, бұл зерттеу бірдей құрамдар мен мұздатылған күйде сақтау шарттарында желатин негізіндегі жеуге жарамды пленкаларға қосылған грейпфрут, апельсин және лимон қабығы сығындыларын жүйелі салыстырмалы бағалауды ұсынады. Нәтижелер ауыл шаруашылығы қалдықтарын қайта өңдеуді қолдай отырып, цитрус өнімдерін қайта өңдеудің қосымша өнімдерінің ет өнімдері үшін табиғи консерванттар ретіндегі әлеуетін көрсетіп, тұрақты белсенді орау жүйелерін дамытуға үлес қосады.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"zhelatindi-khabykhshalardyng-fizika-himiyalykh-khasietteri\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#zhelatindi-khabykhshalardyng-fizika-himiyalykh-khasietteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Желатинді қабықшалардың физика-химиялық қасиеттері&lt;/span&gt;&lt;/a&gt;Желатинді қабықшалардың физика-химиялық қасиеттері&lt;/h4&gt;\n&lt;p&gt;Цитрус қабығының сығындылары желатинді қабықшалардың механикалық сапасына айтарлықтай әсер етіп, олардың иілгіштігі мен пайдалылығын арттырды. Тауық етінің балғындығын анықтайтын екі маңызды фактор — pH және жалпы ұшпалы негіздік азот (&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt;) мәндері, ал бұл көрсеткіштердің өсуі өнімнің бұзылуын білдіреді. Бастапқыда барлық үлгілердің pH мәні 6,10 болды. 147 күндік сақтау мерзімі ішінде барлық топтарда pH деңгейінің аздап көтерілгені байқалды (1-кесте). Цитрус қабығының сығындыларының жоғары концентрациясы (4%) бар желатинді қабықшалармен өңделген тауық котлеттерінде pH деңгейінің баяу өсуі байқалды, бұл биохимиялық реакциялардың бірқалыпты жүргенін көрсетеді. Сақтау мерзімінің соңында G-G4, G-O4 және G-L4 топтарындағы мәндер сәйкесінше 6,77, 6,88 және 6,80 болды. Керісінше, C және G-C топтарында pH мәндері айтарлықтай жоғары — 7,13 болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қабықшалар құрамында 4% цитрус сығындыларын пайдалану pH және TVB-N өсуін баяулатады, бұл мұздатылған ет өнімдерінің балғындығын ұзақ сақтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мұздатылған күйде сақтау кезінде байқалған pH деңгейінің біртіндеп өсуі тек ақуыздың деградациясымен ғана емес, сонымен қатар бұзылумен байланысты микробтық метаболизм және ақуыздың ыдырауы кезінде түзілетін аммиак пен биогенді аминдер сияқты сілтілі метаболиттердің жинақталуымен байланысты. Бұл түсіндірме сақтау кезеңінде TVB-N мәндерінің бір мезгілде өсуімен де расталады, бұл сапаның нашарлауына байланысты ұшпалы азотты қосылыстардың біртіндеп түзілуін көрсетеді. Осыған ұқсас бақылаулар Farokhzad және т.б. (2023) жұмысында келтірілген, олар өңделмеген бақылау үлгілеріндегі жоғары pH мәндерін сақтау кезіндегі бұзылуға байланысты тереңірек биохимиялық өзгерістермен түсіндірген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TVB-N (жалпы ұшпалы негіздік азот) — бұл етте бактериялар көбейіп, ақуыздар ыдыраған сайын артатын көрсеткіш; бұл мән неғұрлым төмен болса, өнім соғұрлым балғын болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, жеуге жарамды желатинді қабықшалар құрамына енгізілген грейпфрут, апельсин және лимон қабығы сығындыларының концентрациясын арттыру мұздатылған күйде сақтау кезінде pH өсуін тиімді баяулатты. Бұл қорғаныш әсерін цитрус қабығының фитохимиялық заттарының, соның ішінде фенолды қосылыстар мен флавоноидтардың антиоксиданттық қасиеттері мен табиғи микробқа қарсы белсенділігімен түсіндіруге болады, олар бұзылуға байланысты биохимиялық реакцияларды азайтуға және сақтау кезінде тауық котлеттерінің физика-химиялық тұрақтылығын сақтауға көмектеседі (Ebrahimian және т.б., 2023). Сол сияқты, 1-кестеде көрсетілгендей, бақылау үлгісі өңделген үлгілерге қарағанда жоғары TVB-N мәндерін көрсетті, бұл еттегі бұзылу белсенділігі мен ақуыздың ыдырауы жоғары екенін білдіреді (Manthey және т.б., 1988). Дегенмен, сығындысы бар қабықшалар (G-G4, G-O4, G-L4), (G-G2, G-O2, G-L2) және (G-G1, G-O1, G-L1) мұздатылған күйде сақтау кезінде котлеттердің TVB-N мәніне айтарлықтай әсер етті (P &amp;lt; 0,05). Сақтау мерзімінің соңында ең төменгі TVB-N мәні тіркелді...&lt;/p&gt;\n&lt;h4 id=\"grejpfrut-khabyghynyng-syghyndylary\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#grejpfrut-khabyghynyng-syghyndylary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Грейпфрут қабығының сығындылары&lt;/span&gt;&lt;/a&gt;Грейпфрут қабығының сығындылары&lt;/h4&gt;\n&lt;p&gt;Цитрус жемістерінің қабығы фенолды қосылыстарға, лимоноидтарға және флавоноидтарға бай. 2-кестеде көрсетілгендей, грейпфрут, апельсин және лимон қабығы сығындыларының жалпы антиоксиданттық және фенолдық қосылыстарының құрамында айтарлықтай айырмашылық байқалды (P&amp;lt;0,05). Грейпфрут қабығы ең көп фенолды қосылыстар мен антиоксиданттық белсенділікке ие, одан кейін апельсин және лимон қабықтары тұрады. Бұл айырмашылық әрбір цитрус қабығындағы фенолдық химиялық заттардың құрамы мен концентрациясының әртүрлілігімен түсіндіріледі. Грейпфрут қабығы сығындысының антиоксиданттық мәні 70% этанолды сығындыда 687,48 мкмоль trolox/г деп тіркелді. Сол сияқты, лимон қабығы сығындысы ең төменгі мәнді (227,40 мкмоль trolox/г) көрсетті. Нәтижелерге сәйкес, фенолды қосылыстар сәйкесінше грейпфрутта (598,45 мг &lt;a href=\"concepts/gallic-acid-equivalent.html\"&gt;GAE&lt;/a&gt;/г), апельсин қабығында (428,62 мг GAE/г) және лимон қабығында (364,8 мг GAE/г) тіркелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Грейпфрут қабығының сығындысы ең жоғары антиоксиданттық белсенділікті (687,48 мкмоль trolox/г) және фенолдық құрамды (598,45 мг GAE/г) көрсетті, бұл оны зерттелген үлгілер арасындағы ең тиімді табиғи консервантқа айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қолда бар нәтижелер цитрус қабықтарындағы жалпы фенолдар мөлшері 188,2-ден 766,7 мг GAE/100 г-ға дейін өзгергені туралы зерттеулермен сәйкес келеді. Сол сияқты, 70% этанолды апельсин қабығы сығындысы 607,67 мкмоль trolox/г мәнімен күшті антиоксиданттық белсенділікке ие екендігі, ал лимон қабығы сығындысы 203,22 мкмоль trolox/г екендігі атап өтілді. Басқа зерттеуде 50% этанолды апельсин қабығы сығындысында (OPE) 189,7 мг GAE/100 г жалпы фенолдар тіркелген. Табылған нәтижелер грейпфрут қабығының жалпы антиоксиданттық белсенділігі мен фенолдық құрамы мандарин қабығынан жоғары екенін растайды.&lt;/p&gt;\n&lt;p&gt;Пероксидтер липидтердің тотығуының бастапқы реактивті өнімдері болып табылады және бастапқы тотығуға жауап береді. Сақтау басында пероксидтік сан (PV) 1,00 мэкв O₂/кг деп тіркелді және бұл мән сақтау барысында барлық үлгілерде өсті (3-кесте). Цитрус қабығының сығындысы бар желатинді пленкамен оралған үлгілер (G-G, G-O және G-L топтары) сақтау кезінде айтарлықтай төмен PV мәндерін сақтап қалды (P &amp;lt; 0,05). Сақтау мерзімінің соңында бақылау тобының PV мәні 7,00 мэкв O₂/кг, ал G-G4 тобында 4,50 мэкв O₂/кг деп тіркелді. Бұл нәтижелер алдыңғы есептермен сәйкес келеді. PV мәнінің уақыт өте келе артуы сақтау мерзімімен бірге тотығу процесінің күшеюімен байланысты. Липидтердің тотығуының жанама көрсеткіші болып табылатын &lt;a href=\"concepts/thiobarbituric-acid-reactive-substances.html\"&gt;TBARS&lt;/a&gt; мәндерінде де ұқсас үрдіс байқалды, бұл иістің өзгеруін, түс пен жағымсыз дәмдердің пайда болуын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пероксидтік сан (PV) және TBARS — бұл майлардың «балғындығын» көрсететін зертханалық көрсеткіштер. Олар неғұрлым төмен болса, өнім соғұрлым баяу ашиды және бұзылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бастапқы TBARS деңгейі өңделген және өңделмеген тауық бургерлерінде 0,15 мг MDA/кг құрады (3-кесте). Сақтау уақытының ұлғаюымен барлық сыналған бургерлердің TBARS мәндері өсті (p &amp;lt; 0,05). Сақтаудың 147-ші күнінде TBARS мәндері C және G-C топтарында (1,01 және 0,92 мг MDA/кг) және цитрус қабығы сығындысы бар пленка топтарында: G-G4 (0,74 мг MDA/кг), G-O4 (0,75 мг MDA/кг) және G-L4 (0,80 мг MDA/кг) құрады. Бұл нәтижелер желатин және апельсин қабығы сығындысымен өңделген үлгілердің сақтау кезінде ең жоғары антиоксиданттық белсенділікті көрсеткені туралы деректермен сәйкес келеді. 3-кестеде көрсетілгендей, барлық үлгілердің PV және TBARS мәндері сақтау кезінде біртіндеп өсті.&lt;/p&gt;\n&lt;p&gt;2-кесте. Грейпфрут, апельсин және лимон қабығы сығындыларының жалпы фенолдық қосылыстары мен антиоксиданттық сыйымдылығы&lt;br /&gt;\nҮлгілер / Жалпы фенолдық қосылыстар (мг GAE/г) / Жалпы антиоксиданттық сыйымдылығы (мкмоль trolox/г)&lt;br /&gt;\nГрейпфрут қабығы / 598,45 ± 112,16a / 687,48 ± 94,60a&lt;br /&gt;\nАпельсин қабығы / 428,62 ± 105,82a / 533,91 ± 102,80ab&lt;br /&gt;\nЛимон қабығы / 364,8 ± 64,61ab / 227,40 ± 170,36b&lt;br /&gt;\nЕскертпе: Әртүрлі кіші әріптер үлгілер арасындағы айтарлықтай айырмашылықты көрсетеді (P &amp;lt; 0,05). Мәндер орташа ± стандартты ауытқу (n = 3) ретінде көрсетілген.&lt;/p&gt;\n&lt;h4 id=\"grejpfrut-khabyghynyng-syghyndylary1\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#grejpfrut-khabyghynyng-syghyndylary1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Грейпфрут қабығының сығындылары&lt;/span&gt;&lt;/a&gt;Грейпфрут қабығының сығындылары&lt;/h4&gt;\n&lt;p&gt;Цитрусты жемістердің қабығы фенолды қосылыстарға, лимоноидтарға және флавоноидтарға бай. 2-кестеде көрсетілгендей, грейпфрут, апельсин және лимон қабығы сығындыларының жалпы антиоксиданттық және фенолдық қосылыстарының құрамында айтарлықтай айырмашылық болды (P&amp;lt;0,05). Грейпфрут қабығы ең көп фенолды қосылыстар мен антиоксиданттық белсенділікке ие, одан кейін апельсин және лимон қабықтары келеді. Бұл айырмашылық әрбір цитрус қабығындағы фенолды химиялық заттардың құрамы мен концентрациясындағы алшақтықтармен түсіндірілуі мүмкін. 70% этанолды сығындыдағы грейпфрут қабығы сығындысының антиоксиданттық мәні 687,48 мкмоль тролокс/г деп белгіленді, сол сияқты лимон қабығы сығындысы ең төменгі мәнді (227,40 мкмоль тролокс/г) көрсетті. Сондай-ақ, нәтижелерге сәйкес, фенолды қосылыстар грейпфрут қабығында (598,45 мг GAE/г), апельсин қабығында (428,62 мг GAE/г) және лимон қабығында (364,8 мг GAE/г) сәйкесінше анықталды. Қолда бар нәтижелер цитрус қабықтарындағы жалпы фенолдар мөлшері 188,2-ден 766,7 мг GAE/100 г-ға дейін өзгергенін хабарлаған зерттеулермен сәйкес келеді. Сол сияқты, 70% этанолды апельсин қабығы сығындысы 607,67 мкмоль тролокс/г ең жоғары мәнімен күшті антиоксиданттық белсенділікке ие екені, ал лимон қабығы сығындысы 203,22 мкмоль тролокс/г екені атап өтілді. Сондай-ақ, 50% этанолды апельсин қабығы сығындысында (OPE) жалпы фенолдар (189,7 мг GAE/100 г) байқалды. Нәтижелер грейпфрут қабығының жалпы антиоксиданттық белсенділігі мен фенолдық құрамы мандарин қабығына қарағанда жоғары екенін атап өткен зерттеулермен сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Грейпфрут қабығының сығындысы ең жоғары антиоксиданттық белсенділік (687,48 мкмоль тролокс/г) пен фенолдық құрамды (598,45 мг GAE/г) көрсетіп, апельсин мен лимон сығындыларынан асып түсті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GAE (Галл қышқылының эквиваленті) — үлгідегі фенолды қосылыстардың мөлшерін галл қышқылының бірліктерімен өлшеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы зерттеуде байқалған грейпфрут қабығы сығындысының жоғары консерванттық өнімділігі, бәлкім, тек жалпы фенолдық құраммен емес, оның фитохимиялық құрамындағы айырмашылықтармен байланысты. Грейпфрут қабығы әсіресе флаванон нарингинге, сонымен қатар фуранокумариндерге, лимоноидтарға, фенолды қышқылдарға және эфир майының құрамдас бөліктеріне бай, ал апельсин қабығы гесперидиннің жоғары концентрациясын қамтиды, ал лимон қабығы эриоцитрин мен басқа да флаванон гликозидтерінің молдығымен сипатталады. Бұл фитохимиялық заттар бос радикалдарды залалсыздандыру, металл иондарын хелаттау, липидтердің асқын тотығуын тежеу, микробтық жасуша мембраналарын бұзу және микробтардың метаболикалық процестеріне кедергі келтіру сияқты көптеген механизмдер арқылы өзара толықтырушы антиоксиданттық және микробқа қарсы қасиеттерге ие. Демек, осы биоактивті құрамдас бөліктердің бірлескен әсері мен салыстырмалы молдығы осы зерттеуде байқалған грейпфрут қабығы сығындысының жоғары антиоксиданттық және микробқа қарсы тиімділігін түсіндіруі мүмкін. Дегенмен, &lt;a href=\"concepts/hplc.html\"&gt;HPLC&lt;/a&gt; немесе GC-MS сияқты аналитикалық әдістерді қолдана отырып, цитрус қабығы сығындыларының кешенді фитохимиялық сипаттамасы осы әсерлерге жауапты қосылыстар туралы толығырақ түсінік береді және болашақ зерттеулерде қарастырылуы керек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу желатинді пленкалармен шектелген; пленкалардың антиоксиданттық қасиеттері тікелей бағаланбаған, бұл дайын өнімнің тиімділігін анықтауды қиындатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы зерттеу цитрус қабығы сығындысы қосылған желатинді жеуге жарамды пленкалардың мұздатылған күйде сақтау кезінде тауық бургерлерінің физика-химиялық тұрақтылығы мен микробиологиялық сапасын жақсарту әлеуетін көрсеткенімен, бірнеше шектеулерді мойындау керек. Біріншіден, цитрус қабығы сығындылары қосылғаннан кейін композиттік желатинді пленкалардың антиоксиданттық қасиеттері тікелей бағаланбады, дегенмен жеке цитрус қабығы сығындыларының антиоксиданттық белсенділігі анықталды. Желатинді матрицаға енгізу биоактивті қосылыстардың функционалдық қасиеттеріне әсер етуі мүмкін болғандықтан, болашақ зерттеулер әзірленген жеуге жарамды пленкалардың антиоксиданттық сипаттамаларын зерттеуі керек. Екіншіден, цитрус қабығы сығындылары мен дайындалған желатинді пленкалардың pH деңгейі өлшенбеді, бұл олардың физика-химиялық мінез-құлқы мен консервация механизмдері туралы қосымша ақпарат берер еді. Сонымен қатар, бұл зерттеу мұздатылған сақтау жағдайында консерванттық тиімділікті көрсеткенімен, салқындатылған күйде сақтау және механизмдерді тереңірек зерттеу олардың функционалдығын жақсырақ түсінуге көмектеседі. Ақырында, сақтау кезінде жеуге жарамды пленкалардан бөлінетін биоактивті қосылыстарды кешенді сипаттау ет өнімдерін сақтаудағы үлесі туралы құнды ақпарат береді. Болашақ зерттеулер сондай-ақ тамақ өнеркәсібінде тұрақты белсенді орау материалдары ретінде пайдалануды жеңілдету үшін масштабтауды, механикалық қасиеттерді, тұтынушылардың сенсорлық қабылдауын және коммерциялық қолданылуын бағалауы керек.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Осы зерттеу грейпфрут, апельсин және лимон қабығының сығындыларымен байытылған желатин негізіндегі жеуге жарамды үлдірлердің мұздатылған тауық котлеттерін сақтау үшін тұрақты белсенді орауыш материалдары ретінде үлкен әлеуетке ие екенін көрсетті. Цитрус қабығы сығындыларын қосу желатин үлдірлерінің антиоксиданттық және микробқа қарсы қасиеттерін жақсартты, бұл ретте грейпфрут қабығының сығындысы сыналған нұсқалар арасында ең жоғары консервілеу тиімділігін көрсетті. Цитрус сығындысы қосылған желатин үлдірлерімен қапталған тауық котлеттері мұздатылған күйде сақтау кезінде қаптамасы жоқ бақылау үлгілерімен салыстырғанда pH, жалпы ұшпа негіздік азот (TVB-N), асқын тотығу саны (PV), тиобарбитур қышқылымен әрекеттесетін заттар (TBARS) және микробтар санының төмен көрсеткіштерін тұрақты түрде көрсетті, бұл физика-химиялық тұрақтылықтың жақсарғанын және сақтау мерзімінің ұзарғанын білдіреді. Консервілеу әсері сығынды концентрациясының артуымен күшейді, мұнда 4% құрамдар ең жоғары қорғанысты қамтамасыз етті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4% грейпфрут қабығының сығындысы қосылған желатин үлдірі мұздатылған ет өнімдерінің тотығуын және микробтардың көбеюін барынша азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жалпы алғанда, алынған нәтижелер цитрус өнімдерін өңдеуден қалған қалдықтарды биологиялық ыдырайтын желатин үлдірлерінде табиғи консерванттар ретінде сәтті қайта пайдалануға болатынын дәлелдейді. Бұл ет өнімдерінің сақталуын жақсарту үшін экологиялық тұрақты тәсілді қамтамасыз етеді және тамақ өнімдерін белсенді орау жүйелерін дамытуға қолдау көрсетеді. Болашақ зерттеулер әзірленген үлдірлердің физика-химиялық сипаттамаларын одан әрі зерттеуге, олардың антиоксиданттық және микробқа қарсы белсенділік механизмдерін анықтауға, әртүрлі сақтау жағдайларында тиімділігін бағалауға және тамақ өнімдерін орау индустриясында коммерциялық қолданылуын айқындауға бағытталуы тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TVB-N және TBARS — еттің балғындығын объективті өлшеуге мүмкіндік беретін зертханалық көрсеткіштер: біріншісі ақуыздардың ыдырауын, екіншісі майлардың тотығуын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"citrus-khabyghynyng-syghyndylaryn-dajyndau\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#citrus-khabyghynyng-syghyndylaryn-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цитрус қабығының сығындыларын дайындау&lt;/span&gt;&lt;/a&gt;Цитрус қабығының сығындыларын дайындау&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеуде грейпфрут, апельсин және лимон Нигдедегі жергілікті базардан алынды. Жемістер зертханаға жеткізіліп, ағынды сумен жуылды және қабығы аршылды. Грейпфрут, апельсин және лимон қабықтары зертханалық конвекциялық кептіргіш пеште 45 °C температурада 48 сағат бойы кептірілді. Содан кейін ұнтақталған қабық ұнтағы экстракция үшін пайдаланылды. Экстракция үшін 10 г ұнтақ 100 мл 70% этанолға қосылып, қоспа ультрадыбыстық өңдеуден (CUB-5, Citizen, 40 кГц, 220–240 В) 30 °C температурада 45 минут бойы өткізілді. Қоспалар этанолды бөліп алу үшін сүзгі қағазы арқылы сүзілді, ол 45 °C температурада роторлы вакуумды булантқышта 45 минут бойы қолданылып, сығынды алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ультрадыбыстық экстракция — бұл жоғары жиілікті дыбыс толқындары арқылы шикізаттан пайдалы заттарды бөліп алу әдісі, ол жасуша қабырғаларын бұзып, процесті тездетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tauykh-burgerin-dajyndau\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#tauykh-burgerin-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тауық бургерін дайындау&lt;/span&gt;&lt;/a&gt;Тауық бургерін дайындау&lt;/h4&gt;\n&lt;p&gt;Шамамен 22 кг жаңа тауық еті (төс және сирақ бөліктері) Bayaz базарынан сатып алынып, мұзбен тасымалданды, тазартылды, жуылды және сүйегінен ажыратылды. Тауық бургерлері тауық төсінің қимасы (69,5%), бидай ұны (10,0%), жүгері крахмалы (10,0%), соя майы (5,0%), күріш ұны (2,0%), тұз (1,0%), пияз ұнтағы (2,0%), сарымсақ ұнтағы (0,20%), қара бұрыш (0,10%), кәдік (0,10%) және зире (0,10%) қосылып дайындалды. Содан кейін 100 г бургер котлеттері (1 × 8 см) пішінделіп, әрқайсысы екі пленка арасына жеке оралды. Салыстыру үшін үлгілер 11 топқа бөлінді: бақылау (өңделмеген); сығындысыз желатин пленкалы топ (C-G); 1%, 2% және 4% грейпфрут сығындысымен байытылған желатин пленкалы үш топ (G-G1, G-G2, G-G4); 1%, 2% және 4% апельсин сығындысымен (G-O1, G-O2, G-O4) және 1%, 2% және 4% лимон сығындысымен (G-L1, G-L2, G-L4). Тауық бургерінің үлгілері −18 °C температурада 147 күн бойы сақталды, бұл коммерциялық мұздатылған тауық бургерлерінің ұзақ сақтау мерзімін имитациялайды. Физика-химиялық және микробиологиялық талдаулар 0, 21, 42, 63, 84, 105 және 147-күндері жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"zhelatin-plenkasyn-tuezushi-eritindilerdi-dajyndau\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#zhelatin-plenkasyn-tuezushi-eritindilerdi-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Желатин пленкасын түзуші ерітінділерді дайындау&lt;/span&gt;&lt;/a&gt;Желатин пленкасын түзуші ерітінділерді дайындау&lt;/h4&gt;\n&lt;p&gt;Желатин пленкалары Gómez-Estaca және т.б. (2009) сипаттаған құю техникасы арқылы 3 кезеңде дайындалды. Желатин пленка түзуші агент ретінде қолданылды. Глицерин иілгіштікті арттыру үшін, ал d-сорбитол пластификатор ретінде қосылды. Цитрус сығындылары табиғи функционалды қоспалар ретінде желатин ерітіндісіне қосылды. 1%, 2% және 4% концентрациялар жеуге жарамды пленкалар құрамындағы тиімді қосу деңгейлері туралы бұрынғы зерттеулерге негізделіп таңдалды. Бұл концентрациялар консерванттық әлеуетті бағалау үшін төмен, орташа және жоғары деңгейлер ретінде қабылданды. 3% концентрация бастапқы эксперименттік жоспарға кірмегендіктен пайдаланылмады.&lt;/p&gt;\n&lt;h4 id=\"fizika-himiyalykh-taldau-uelgining-ph-maenin-anykhtau\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#fizika-himiyalykh-taldau-uelgining-ph-maenin-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Физика-химиялық талдау: Үлгінің pH мәнін анықтау&lt;/span&gt;&lt;/a&gt;Физика-химиялық талдау: Үлгінің pH мәнін анықтау&lt;/h4&gt;\n&lt;p&gt;pH Manthey және т.б. (1988) әдісі бойынша анықталды. Сандық pH-метр (Hanna HI2211, Hanna Instruments, Румыния) қолданылды. Шамамен 10 г үлгі 90 мл дистилденген сумен зертханалық гомогенизаторда 1–2 минут бойы араластырылды. pH-метр өлшеу алдында pH 4,0 және 7,0 стандартты буферлік ерітінділермен калибрленді. Үлгіні гомогенизациялағаннан кейін электрод орналастырылды және көрсеткіш тұрақтанғаннан кейін pH мәні жазылып алынды. Өлшеулер үш рет қайталанып, орташа мәндер нәтиже ретінде қолданылды.&lt;/p&gt;\n&lt;h4 id=\"zhalpy-ushpa-negizdik-azot-tvb-n\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#zhalpy-ushpa-negizdik-azot-tvb-n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы ұшпа негіздік азот (TVB-N)&lt;/span&gt;&lt;/a&gt;Жалпы ұшпа негіздік азот (TVB-N)&lt;/h4&gt;\n&lt;p&gt;TVB-N мөлшері Schormüller (1968) әдісі бойынша өлшенді. Қысқаша айтқанда, 20 г гомогенизацияланған тауық бургеріне 50 мл дистилденген су қосылды. Содан кейін көбікке қарсы агент ретінде шамамен 1 қасық магний оксиді (MgO) қосылды. Дистиллят 0,1 N тұз қышқылы (HCl) бар қабылдағыш колбаға жиналды, онда ұшпа негіздер сіңірілді. Кейіннен қышқылдың артық мөлшері тең нормальды негіз ерітіндісімен (0,1 N NaOH) кері титрленді. Пайдаланылған титрант көлемі жазылып алынды және TVB-N мөлшері әр 100 г үлгіге шаққандағы азот миллиграммымен (мг/100 г) есептелді.&lt;/p&gt;\n&lt;h4 id=\"askhyn-totykh-sany-pv\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#askhyn-totykh-sany-pv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Асқын тотық саны (PV)&lt;/span&gt;&lt;/a&gt;Асқын тотық саны (PV)&lt;/h4&gt;\n&lt;p&gt;Тауық етінің асқын тотық санын (POV) анықтау AOAC (1990) және AOAC (1998) әдістері бойынша жүргізілді. Асқын тотық санын анықтау үшін қолданылған химиялық заттар: 1 г үлгі, 30 мл хлороформ–сірке қышқылы ерітіндісі (2:3, v/v), 1 мл қаныққан калий йодиді (KI), 75 мл дистилденген су, 0,5 мл крахмал және 0,1 M натрий тиосульфаты (Na₂S₂O₃). Үлгілердің асқын тотық сандары мэкв/кг-мен есептелді.&lt;/p&gt;\n&lt;h4 id=\"tiobarbitur-khyshkhylymen-aerekettesetin-zattar-tbars\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#tiobarbitur-khyshkhylymen-aerekettesetin-zattar-tbars\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тиобарбитур қышқылымен әрекеттесетін заттар (TBARS)&lt;/span&gt;&lt;/a&gt;Тиобарбитур қышқылымен әрекеттесетін заттар (TBARS)&lt;/h4&gt;\n&lt;p&gt;TBARS мөлшері AOAC (1998) әдісі бойынша анықталды. 0,100 г үлгі үшін келесі химиялық заттар қолданылды: 5 мл n-бутанол, 5 мл тиобарбитур қышқылы (TBA) реагенті. Алынған супернатанттың абсорбциясы 530 нм толқын ұзындығында спектрофотометр көмегімен өлшенді. Нәтижелер төмендегі формула бойынша есептеліп, мг малондіальдегид / кг үлгі түрінде көрсетілді.&lt;/p&gt;\n&lt;h4 id=\"mikrobiologiyalykh-taldau\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#mikrobiologiyalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микробиологиялық талдау&lt;/span&gt;&lt;/a&gt;Микробиологиялық талдау&lt;/h4&gt;\n&lt;p&gt;Микробиологиялық есептеулер 10 г үлгіні 90 мл Рингер ерітіндісінде стомакер көмегімен гомогенизациялау арқылы жүргізілді. Психрофильді бактериялар 7–10 °C температурада бір апта инкубациядан кейін Tryptone Glucose Yeast (TGYE Agar) ортасында есептелді. Мезофильді бактериялардың саны Tryptone Glucose Yeast (TGYE Agar) ортасын қолдана отырып, 30 °C температурада 2 күн инкубациялау арқылы құйма табақша әдісімен анықталды. Колиформды бактериялар 37 °C температурада 24–48 сағат инкубацияланған Violet Red Bile Agar (VRBA) ортасында есептелді. Сүт қышқылы бактериялары олардың өсуін қолдайтын Man Rogosa and Sharpe (MRS) агарында 30 °C температурада 48 сағат инкубациядан кейін есептелді. Зеңдер мен ашытқылар 25 °C температурада 5 күн инкубациядан кейін BAM Media M127 ортасында есептелді. Барлық микробиологиялық көрсеткіштер log CFU/g бірлігімен көрсетілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-stomahera.html\"&gt;Стомакер әдісі&lt;/a&gt; — бұл үлгіні стерильді пакетте механикалық күрекшелер арқылы ұсақтау, бұл өнімнің ішіндегі микроорганизмдерді жасушаларға зақым келтірмей бөліп алуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bioaktivti-komponentterdi-taldau\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#bioaktivti-komponentterdi-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биоактивті компоненттерді талдау&lt;/span&gt;&lt;/a&gt;Биоактивті компоненттерді талдау&lt;/h4&gt;\n&lt;p&gt;Антиоксиданттық белсенділік. Грейпфрут, апельсин және лимон қабығы сығындысының антиоксиданттық белсенділігі Re және т.б. (1999) сипаттаған әдіс бойынша анықталды. Үлгілердің антиоксиданттық белсенділігі ABTS тестін қолдана отырып, күшті сызықтық корреляция (r = 0,971) негізінде есептелді және (µmol TE/g) түрінде көрсетілді.&lt;/p&gt;\n&lt;p&gt;Жалпы фенолдық құрам. Жалпы фенолдық құрамды (TPC) анықтау үшін Folin-Ciocalteu колориметриялық әдісі қолданылды. Үлгілердің жалпы фенолдық құрамы күшті қисық сызық (r = 0,995) көмегімен есептелді және нәтиже бір граммға шаққандағы галл қышқылының эквиваленті (мг GAE/g) ретінде көрсетілді.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Әрбір цитрус қабығының сығындысы үш тәуелсіз партияда дайындалды және әрбір желатинді пленка рецептурасы үш тәуелсіз қайталауда жасалды. Барлық физика-химиялық және микробиологиялық талдаулар әрбір өңдеу түрі үшін және әрбір сынама алу аралығында үш қайталаудан (n = 3) орындалды. Нәтижелер орташа мән ± стандартты ауытқу (SD) ретінде берілген. Статистикалық талдау IBM SPSS Statistics (IBM Corp., Армонк, Нью-Йорк, АҚШ) көмегімен жүргізілді. Өңдеу орташа мәндері арасындағы айырмашылықтар бір факторлы дисперсиялық талдау (ANOVA) және одан кейінгі Тьюкидің көптік салыстыру тесті арқылы бағаланды. Статистикалық маңыздылық p &amp;lt; 0,05 деңгейінде деп есептелді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural-f1.jpg\" alt=\"1-сурет. Цитрус қабығының экстракты косылған желатинді пленкалармен қапталған тауық котлеттерінің (бургерлерінің) 147 кү\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Цитрус қабығының экстракты косылған желатинді пленкалармен қапталған тауық котлеттерінің (бургерлерінің) 147 күн бойы тоңазытылған сақтау кезіндегі микробиологиялық сапасының өзгерістері&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Цитрус қабығының экстракты косылған желатинді пленкалармен қапталған тауық котлеттерінің (бургерлерінің) 147 күн бойы тоңазытылған сақтау кезіндегі микробиологиялық сапасының өзгерістері: (A) жалпы психрофильді бактериялар, (B) жалпы аэробты мезофильді бактериялар, (C) жалпы колиформды бактериялар, (D) жалпы сүт қышқылы бактериялары және (E) жалпы зең мен ашытқы саңырауқұлақтарының саны. Мәндер орташа ± стандартты ауытқу (n = 3) түрінде көрсетілген. Микробтар саны log КӨБ/г арқылы берілген. Тиісті деректер кестесіндегі әртүрлі әріптер өңдеу түрлері мен сақтау мерзімдері арасындағы статистикалық маңызды айырмашылықтарды көрсетеді (P &amp;lt; 0,05).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мұздатылған&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;еттің тез&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бүлінуі&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сығындысы бар&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;желатин&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қабық
