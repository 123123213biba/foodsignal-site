        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"177\" cy=\"62\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"523\" cy=\"295\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;L-теанин және ауыр металдар:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;шай құрамындағы зат бауырды&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай қорғайды?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f1.jpg\" alt=\"Жедел Cd әсеріне ұшыраған тышқандардағы LT-нің өлім-жітімге әсері. (A) LT химиялық құрылымы. (B) Жануарларға жасалған тә\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жедел Cd әсеріне ұшыраған тышқандардағы LT-нің өлім-жітімге әсері. (A) LT химиялық құрылымы. (B) Жануарларға жасалған тәжірибенің схемалық диаграммасы. (C) Cd-мен өңдегеннен кейінгі өмір сүру уақыты (n = 8). # p &amp;lt; 0,05, Cd тобымен салыстырғанда.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Кадмий — ағзада жиналып, жасушаларды тазарту процесін бұзатын улы металл. Тышқандарда жүргізілген зерттеу шай жапырағындағы L-теаниннің бұл процестерді қалпына келтіруге көмектесетінін көрсетті. Бұл зат қорғаныс механизмдерін белсендіріп, тотығу стрессін азайтады және бауырдағы зат алмасуды жақсартады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;L-теанин &lt;a href=\"concepts/amp-activated-protein-kinase.html\"&gt;AMPK&lt;/a&gt;-ны белсендіріп, бауыр жасушаларындағы аутофагия мен энергия алмасуын қалпына келтіреді.&lt;/li&gt;\n&lt;li&gt;Қоспа &lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;DPP&lt;/a&gt;-4 белсенділігін төмендетіп, SIRT1 деңгейін арттырады және митохондрияларды қорғайды.&lt;/li&gt;\n&lt;li&gt;L-теанин кадмий әсерінен туындайтын ферроптоз бен липидтердің жиналуын бөгейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Кадмий (Cd) аутофагияны — жасушаларды тазарту жүйесін бұзады, бұл зақымдалған митохондриялардың жиналуына және ферроптозға (темірдің артық мөлшерінен жасушалардың өлуі) әкеледі. 8 мг/кг кадмий хлоридімен (CdCl2) жедел улану тәжірибесінде өлім деңгейі 8 сағат ішінде 100%-ды құрады. 200 мг/кг дозада L-теанин қабылдау орташа өмір сүру уақытын 4 сағаттан 16 сағатқа дейін ұзартты және өлімді 60%-ға дейін төмендетті.&lt;/p&gt;\n&lt;p&gt;Созылмалы әсер кезінде L-теанин AMPK/mTOR сигналдық жолын белсендіреді, DPP-4 ферментінің белсенділігін төмендетеді және SIRT1 ақуызының деңгейін арттырады. Бұл энергия тепе-теңдігін қалпына келтіреді: бауырда гликоген мен липидтердің жиналуы азаяды, PGC-1α/Nrfs/TFAM жолының белсендірілуі есебінен митохондриялар жұмысы қалыпқа келеді. Нәтижесінде, L-теанин тотығу стрессі кезінде жасушалардың өлуіне жол бермейтін GPX4 ферментінің ыдырауын тоқтатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқандарда жүргізілген, сондықтан дозаларды адамдарға тікелей қолдану сақтықты талап етеді. Жұмыс L-теаниннің адам ағзасында ұзақ мерзімді жиналу әсерін қарастырмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қазіргі уақытта әлемдегі егістік жерлердің 14–17 пайызы кем дегенде бір уытты металлмен, соның ішінде кадмий (Cd), мышьяк, кобальт, хром, мыс, никель және қорғасынмен ластанған, бұл 0,9–1,4 миллиард адамның денсаулығы мен экологиялық қауіп-қатер жағдайында өмір сүруіне әкеледі. Кадмий ауыл шаруашылығы топырақтарында ең көп таралған ластаушы зат болып табылады (9,0%). Cd-дің адам ағзасындағы биологиялық жартылай шығарылу кезеңі 20–40 жылды құрайды. Тіпті төмен дозаларда да Cd бауыр ауруларымен, жүрек-қан тамыр жүйесі, диабет, остеопороз және нейродегенерациямен байланысты. Cd әсері өлім-жітімді шамамен 17 пайызға арттырады. Cd әсерінің 90 пайызы тамақ өнімдеріне тиесілі (орташа әлемдік тұтыну ~2,20 мкг/кг дене салмағына күніне), темекі шегу күніне 2–4 мкг қосады. Кәсіби әсер ету ЕО-да 207 350 және АҚШ-та 525 000 жұмысшыны қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кадмий ағзада ондаған жылдар бойы жиналады және оның 90 пайызы рационмен байланысты, бұл бауырды уытты әсердің негізгі нысанасына айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Cd уыттылығы митохондриялық дисфункция, эндокриндік бұзылулар, эндоплазмалық тор стрессі, тотығу стрессі және қабыну арқылы көрінеді. Аутофагия — жасуша компоненттерін қайта өңдеу процесі — екіжақты рөл атқарады: орташа стресс кезінде аман қалу немесе қауіпсіздік шегінен асқанда жасушаның өлімі. Аутофагияның бұзылуы Cd цитоуыттылығының негізінде жатыр. Қолданыстағы хелаторлар (димеркаптоянта қышқылы және т.б.) жедел улану кезінде тиімді, бірақ уыттылығы жоғары және өмірлік маңызды микроэлементтердің (K⁺, Ca²⁺, Mg⁺) жоғалуына әкеледі. Созылмалы Cd интоксикациясына қарсы тиімді әдістер жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аутофагия — бұл жасушаның «өзін-өзі тазарту» процесі, онда жасуша энергия мен құрылыс материалдарын алу үшін зақымдалған құрылымдарды қайта өңдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;L-теанин (LT) — шай (&lt;em&gt;Camellia sinensis&lt;/em&gt; L.) құрамындағы аминқышқылы — антиоксиданттық және нейропротекторлық қасиеттерге ие. Тышқандарда жүргізілген зерттеулер LT-дің Cd тудырған нейроуыттылықтан және PC12 жасушаларының апоптозынан қорғайтынын көрсетті. LT АҚШ-тың Азық-түлік және дәрі-дәрмек басқармасы (FDA) тарапынан қауіпсіз (GRAS) деп танылған, ұсынылатын норма — күніне 1200 мг-ға дейін. Бұл жұмыста LT-дің бауырдағы аутофагияны қолдай алатыны және тышқандардағы Cd әсеріне қарсы тұра алатыны туралы гипотеза тексерілді.&lt;/p&gt;\n&lt;p&gt;Зерттеу 3 апталық Куньмин (Kunming) желісіндегі еркек тышқандарда жүргізілді. Хаттамалар зертханалық жануарлар этикасы комитетімен мақұлданды (нөмірі LLSC410240005). Жедел өлім тәжірибесінде тышқандар 3 күндік LT (200 мг/кг, ауызша) енгізілгеннен кейін CdCl₂ (8 мг/кг, іш қуысына) алды. Созылмалы тәжірибеде тышқандар 10 апта бойы CdCl₂ (2,5 мг/кг, ауызша) алды, LT ауыз сумен (1 немесе 2 мг/мл) берілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқандарда жүргізілген; нәтижелер адамдарда немесе бауыр органоидтарының модельдерінде клиникалық сынақтар арқылы расталуы керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LT жедел Cd әсері кезінде тышқандардың өлім-жітімін 100 пайыздан 60 пайызға дейін төмендетті және аман қалу медианасын 4 сағаттан 16 сағатқа дейін ұзартты. Созылмалы әсер кезінде Cd бауыр гипертрофиясын, майлы инфильтрацияны және фиброзды тудырды. LT бұл зақымданулардың алдын алды. LT-дің әсер ету механизмі SIRT1/PGC-1α жолын реттеумен, митохондриялар функциясын қалпына келтірумен және AMPK/mTOR жолын белсендіру арқылы ферроптозды (темірге тәуелді жасуша өлімі) бөгеумен байланысты.&lt;/p&gt;\n&lt;p&gt;LT тіндерде Cd жиналуына әсер етпейді, бұл оны хелаторлардан ерекшелендіреді. Оның қорғаныс әсері метаболикалық бұзылуларды түзетуге және аутофагияны қалпына келтіруге негізделген. Шектеуі сол, қазіргі деректер аутофагосомалардың түзілуінің белсендірілуі мен олардың деградациясының бұзылуын нақты ажыратуға мүмкіндік бермейді. Ақуыз деңгейінде және аутофагия ағыны бойынша кейінгі зерттеулер талап етіледі.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f1.jpg\" alt=\"Жедел Cd әсеріне ұшыраған тышқандардағы LT-нің өлім-жітімге әсері. (A) LT химиялық құрылымы. (B) Жануарларға жасалған тә\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жедел Cd әсеріне ұшыраған тышқандардағы LT-нің өлім-жітімге әсері. (A) LT химиялық құрылымы. (B) Жануарларға жасалған тәжірибенің схемалық диаграммасы. (C) Cd-мен өңдегеннен кейінгі өмір сүру уақыты (n = 8). # p &amp;lt; 0,05, Cd тобымен салыстырғанда.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f2.jpg\" alt=\"Субсозылмалы Cd әсеріне ұшыраған тышқандардағы LT-нің дене салмағына, бауыр гистологиясы мен функциясына әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Субсозылмалы Cd әсеріне ұшыраған тышқандардағы LT-нің дене салмағына, бауыр гистологиясы мен функциясына әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Субсозылмалы Cd әсеріне ұшыраған тышқандардағы LT-нің дене салмағына, бауыр гистологиясы мен функциясына әсері. (A) Жануарларға жасалған тәжірибенің схемалық диаграммасы. (B, C) Азық пен сұйықтық тұтыну. (D, E) Дене салмағы және дене салмағының өсуі. (F) Бауыр морфологиясы. (G) Бауыр салмағы. (H) Бауыр индексі. (I–K) H&amp;amp;E, Oil Red O және Массон бойынша бояу. (L, M) Гликоген деңгейлері және PAS бояуы. (N, O) Сарысу мен бауырдағы АКФ белсенділік деңгейлері. (P–R) Бауырдағы, сарысудағы және нәжістегі Cd деңгейлері. (S) MT1 және MT2 мРНҚ экспрессиясының салыстырмалы деңгейлері. Деректер орташа ± стандартты қателік (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;) ретінде ұсынылған (n = 9). * p &amp;lt; 0,05, ** p &amp;lt; 0,01 және *** p &amp;lt; 0,001, бақылау тобымен салыстырғанда. # p &amp;lt; 0,05, ## p &amp;lt; 0,01 және ### p &amp;lt; 0,001, Cd тобымен салыстырғанда.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f3.jpg\" alt=\"Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің митохондриялық функцияға, SIRT1/PGC-1α сигналдық жолына жә\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің митохондриялық функцияға, SIRT1/PGC-1α сигналдық жолына және оның төменгі нысандарына әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің митохондриялық функцияға, SIRT1/PGC-1α сигналдық жолына және оның төменгі нысандарына әсері. (A, B) COX және SDH деңгейлері (n = 9). (C) SIRT1/PGC-1α сигналдық жолымен байланысты ақуыздар (n = 3). (D) TFAM және NRF1 мРНҚ экспрессиясының салыстырмалы деңгейлері (n = 9). (E) Nrf2 ақуызының экспрессиясы. (F, G) Фиброзға байланысты ақуыздар мен гендер. (H) Инсулин сигналдық жолының ақуыздары (n = 3). Деректер орташа ± стандартты қателік (SEM) ретінде ұсынылған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f4.jpg\" alt=\"Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің ферроптозға әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің ферроптозға әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің ферроптозға әсері. (A, B) Сарысу мен бауырдағы Fe2+ деңгейлері. (C, D) MDA және GSH деңгейлері. (E) GPX1, GPX3 және GPX4 мРНҚ-ның салыстырмалы деңгейлері (n = 9). (F) GPX4, FSP1 және ACSL4 ақуыздарының экспрессиясы. (G) Мембраналық FSP1 ақуызының экспрессиясы. (H) Убиквитин ақуызының экспрессиясы (n = 3). Деректер орташа ± стандартты қателік (SEM) ретінде ұсынылған. * p &amp;lt; 0,05, ** p &amp;lt; 0,01 және *** p &amp;lt; 0,001, бақылау тобымен салыстырғанда. # p &amp;lt; 0,05, ## p &amp;lt; 0,01 және ### p &amp;lt; 0,001, Cd тобымен салыстырғанда.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f5.jpg\" alt=\"Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің AMPK/mTOR арқылы жүретін аутофагия сигналдық жолына және A\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің AMPK/mTOR арқылы жүретін аутофагия сигналдық жолына және AMPK реттейтін глюко-липид алмасуының гендері мен ақуыздарына әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Субсозылмалы Cd әсеріне ұшыраған тышқандар бауырындағы LT-нің AMPK/mTOR арқылы жүретін аутофагия сигналдық жолына және AMPK реттейтін глюко-липид алмасуының гендері мен ақуыздарына әсері. (A) DPP-4 деңгейі (n = 9). (B) p-AMPK (Thr172) ақуызының экспрессиясы (n = 3). (C) LC3B мРНҚ-ның салыстырмалы деңгейлері (n = 9). (D) p-mTOR (Ser2481) және p-p70S6K (Ser371) ақуыздарының экспрессиясы (n = 3). (E, F) Май қышқылдарының синтезіне байланысты гендер (n = 9) және ақуыздар (n = 3). (G, H) Май қышқылдарының тотығуына байланысты гендер (n = 9) және ақуыздар (n = 3). (I) Глюконеогенез гендері TXNIP және Trx1 мРНҚ-ның салыстырмалы деңгейлері (n = 9). (J, K) Глюкоза тасымалдаушысы GLUT2 және мембраналық GLUT2 экспрессиясы (n = 3). Деректер орташа ± стандартты қателік (SEM) ретінде ұсынылған. * p &amp;lt; 0,05, ** p &amp;lt; 0,01 және *** p &amp;lt; 0,001, бақылау тобымен салыстырғанда. # p &amp;lt; 0,05 және ## p &amp;lt; 0,01, Cd тобымен салыстырғанда.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f6.jpg\" alt=\"LT-нің кадмий тудырған митохондриялық дисфункцияны, ферроптозды және глюкоза-липидтік алмасудың бұзылуын DPP4/AMPK/mTOR \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;LT-нің кадмий тудырған митохондриялық дисфункцияны, ферроптозды және глюкоза-липидтік алмасудың бұзылуын DPP4/AMPK/mTOR және SIRT1/AMPK/LKB1/mTOR сигналдық жолдары арқылы модуляцияланатын аутофагияны белсендіру жолымен жеңілдету механизмдерін көрсететін схемалық диаграмма.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Кадмий бауыр&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасушаларын&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өлтіреді&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тышқандарды&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;L-теанинмен&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;емдеу&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Аутофагия мен&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өміршеңдік&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қалпына келді&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Шай қорғаныш&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;агенті ретінде&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Nutrients журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nutrients (Europe PMC)&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Ban Q, Chi W, Wang Q, Li J, Xia Y, Meng Y, Li M, Zhao R, Yu Y, Kan Z, Li N, Ma Y, Huang X, Wang D, Zhao G.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13610715\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/articles/PMC13610715?pdf=render\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.3390/nu18183098\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Метаданные Crossref&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://api.crossref.org/works/10.3390/nu18183098\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;api.crossref.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Europe PMC&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/search?query=DOI%3A%2210.3390/nu18183098%22\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Иллюстрация&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Tea_Leaves._Also_known_as_%22Camellia_Sinensis%22.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;co
