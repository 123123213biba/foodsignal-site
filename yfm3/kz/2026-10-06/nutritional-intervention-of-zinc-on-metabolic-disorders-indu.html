            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"100\" cy=\"80\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"600\" cy=\"254\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · STARCH   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Мырыш және көмірсулар:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;балықтардың рационын қалай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;дұрыстау керек&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f1.jpg\" alt=\"M. salmoides балықтарының денесіндегі, гепатопанкреасындағы және бұлшықеттеріндегі Zn мөлшері (A), сондай-ақ Zn ұсталуы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;M. salmoides балықтарының денесіндегі, гепатопанкреасындағы және бұлшықеттеріндегі Zn мөлшері (A), сондай-ақ Zn ұсталуы&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;M. salmoides балықтарының денесіндегі, гепатопанкреасындағы және бұлшықеттеріндегі Zn мөлшері (A), сондай-ақ Zn ұсталуы (B) (Zn деңгейі әртүрлі рационмен қоректенгенде). Маңыздылық деңгейі p &amp;lt; 0,05, n = 3 (әр топқа) деп белгіленді. Денедегі бастапқы мырыш мөлшері 19,2 мг/кг құрады. Жұлдызша белгілері * p &amp;lt; 0,05 деңгейіндегі айтарлықтай айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Балық жеміндегі крахмалдың артық болуы бауырда гликогеннің жиналуына және инсулинге төзімділікке әкеледі. &lt;a href=\"concepts/micropterus-salmoides.html\"&gt;Micropterus salmoides&lt;/a&gt; балығына жасалған зерттеу мырыштың метаболизмді реттеудегі маңызды рөлін көрсетті. Рационға 150 мг/кг мырыш қосу ферменттердің жұмысын жақсартып, инсулинге сезімталдықты қалпына келтіреді. Бұл нәтижелер аквакультурадағы жем рецептурасын оңтайландыруға көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Мырыш крахмал әсерінен төмендеген гликолиз ферменттерінің жұмысын қалпына келтіреді.&lt;/li&gt;\n&lt;li&gt;150 мг/кг мырыш PI3K/AKT жолы арқылы инсулинге сезімталдықты арттырады.&lt;/li&gt;\n&lt;li&gt;Мырышсыз жоғары крахмалды жем балық бауырының қызметін бұзады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Тәжірибеде 600 дана Micropterus salmoides балығы крахмал (11,5% және 16,3%) пен мырыштың (0, 20, 150 мг/кг) әртүрлі деңгейлерімен қоректендірілді. Мырышсыз жоғары крахмалды диета (HS-LZn) гепатопанкреаста гликогеннің жиналуына және гликолиздің негізгі ферменттері: гексокиназа (HK), фосфофруктокиназа (PFK) және пируваткиназа (PK) белсенділігінің төмендеуіне әкелді. Сонымен қатар, инсулин сигналында маңызды рөл атқаратын фосфорланған AKT (p-AKT) деңгейінің төмендегені байқалды.&lt;/p&gt;\n&lt;p&gt;150 мг/кг мырыш қосу (HS-HZn) HK, PFK, цитратсинтаза (CS) және қышқылды альфа-глюкозидаза (GAA) белсенділігін айтарлықтай арттырды. Иммунофлуоресцентті талдау PI3K/AKT сигналдық жолының қалпына келгенін растады, бұл глюкоза алмасуы үшін өте маңызды. Зерттеу мырыштың крахмал тудырған стресс жағдайында көмірсу алмасуын жақсартатынын дәлелдеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек бір балық түріне жүргізілген, нәтижелер басқа түрлер үшін өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Көмірсулар балықтар үшін энергияның негізгі көзі болып табылады және бұл көрсеткіш бойынша майлар мен ақуыздардан асып түседі. Фермерлік шаруашылықтарда өсірілетін балықтардың рационына көмірсуларды қосу ақуыз бен липидтердің сақталуына ықпал етеді, аквакультураның ағынды суларындағы азот жүктемесін азайтады және жем түйіршіктерінің тұрақтылығын арттырады. Алайда, балықтардың көмірсуларды метаболизмдеу қабілеті шектеулі болғандықтан, рациондағы көмірсулар деңгейін арттыру глюкоза (Glu) тудыратын метаболикалық бұзылуларды шешуді талап етеді. Мұндай жағдайлардың бірі — гепатоциттерде гликогеннің шамадан тыс жиналуымен сипатталатын гликогендік гепатопатия. Бұл қайтымды жағдайды диагностикалаудың «алтын стандарты» — мерзімді қышқыл-Шифф (PAS) бояу әдісі.&lt;/p&gt;\n&lt;p&gt;Инсулин балықтарда Glu метаболизмінде, сүтқоректілердегідей, маңызды рөл атқарады. Балықтар жалпы алғанда Glu-ға төзімсіз деп саналады, ал крахмалға бай рацион оларда тұрақты гипергликемияны тудырады. Glu-ға төзімсіздік бойынша ең көп таралған гипотеза — инсулинге төзімділік (резистенттілік). Бұл генетикалық немесе қоршаған орта факторларымен, атап айтқанда, рацион құрамымен байланысты. Жасушалық деңгейде ол тіндердің Glu-ны қабылдауы мен пайдалануының бұзылуымен, ал молекулалық деңгейде инсулин сигналдық жолдарының істен шығуымен көрінеді. Мырыш (Zn) инсулин секрециясы мен сезімталдығына қатысатын маңызды микроэлемент болып табылады. Адамдарда инсулин құрамында екі Zn²⁺ және бір Ca²⁺ ионын сақтайтын гексамерлі кристалдар түрінде болады. Егеуқұйрықтарда жүргізілген зерттеулер Zn қоспалары инсулинге сезімталдықты арттырғанын көрсетті. Бұл зерттеуде инсулинге төзімділікке бейім ірі ауызды алабұға (&lt;em&gt;Micropterus salmoides&lt;/em&gt;) крахмалға бай рацион тудыратын метаболикалық бұзылуларға мырыштың әсерін зерттеу үшін таңдап алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Крахмалға бай рацион балықтарда метаболикалық бұзылуларды, соның ішінде гликогендік гепатопатия мен инсулинге төзімділікті тудырады, ал мырыш инсулинге сезімталдықты жақсартудың әлеуетті құралы ретінде қарастырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорытындылай келе, крахмалға бай рациондар жем тұтынуды төмендетті және гликогеннің айтарлықтай жиналуына әкелді, алайда жемді пайдалану мен ақуыздың сақталуын жақсартты. Мырыш бауырдағы гликогеннің қалыптан тыс жиналуын жеңілдетті, бұл әлеуетті түрде гликофагияның күшеюі есебінен болды. Сонымен қатар, мырыш AKT фосфорлануын күшейтті, бұл оның инсулинге сезімталдықты жақсарту қабілетін көрсетеді. Мақсатты емес метаболомика Zn қоспаларынсыз крахмалға бай рациондар көптеген аминқышқылдары метаболизмі жолдарын тежегенін көрсетті. Өсімдік ақуызы құрамындағы өзгерістер осы зерттеу нәтижелеріне әсер ететін фактор болып табылады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f1.jpg\" alt=\"M. salmoides балықтарының денесіндегі, гепатопанкреасындағы және бұлшықеттеріндегі Zn мөлшері (A), сондай-ақ Zn ұсталуы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;M. salmoides балықтарының денесіндегі, гепатопанкреасындағы және бұлшықеттеріндегі Zn мөлшері (A), сондай-ақ Zn ұсталуы&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;M. salmoides балықтарының денесіндегі, гепатопанкреасындағы және бұлшықеттеріндегі Zn мөлшері (A), сондай-ақ Zn ұсталуы (B) (Zn деңгейі әртүрлі рационмен қоректенгенде). Маңыздылық деңгейі p &amp;lt; 0,05, n = 3 (әр топқа) деп белгіленді. Денедегі бастапқы мырыш мөлшері 19,2 мг/кг құрады. Жұлдызша белгілері * p &amp;lt; 0,05 деңгейіндегі айтарлықтай айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f2.jpg\" alt=\"M. salmoides балықтарының дене (A) және бұлшықет (B) құрамы, сондай-ақ ақуыз бен энергияның ұсталуы (C) (Zn деңгейі әртү\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;M. salmoides балықтарының дене (A) және бұлшықет (B) құрамы, сондай-ақ ақуыз бен энергияның ұсталуы (C) (Zn деңгейі әртүрлі рационмен қоректенгенде). Маңыздылық деңгейі p &amp;lt; 0,05, n = 3 (әр топқа) деп белгіленді. Жұлдызша белгілері * p &amp;lt; 0,05 деңгейіндегі айтарлықтай айырмашылықтарды көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f3.jpg\" alt=\"Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы гликоген алмасуы және гликолиз.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы гликоген алмасуы және гликолиз.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы гликоген алмасуы және гликолиз. (A) Гепатопанкреас пен бұлшықеттегі гликоген мөлшері. (B) Гепатопанкреастағы гликолиз. (C, D) Гепатопанкреастағы гликоген алмасуы. Маңыздылық деңгейі p &amp;lt; 0,05, n = 3 (әр топқа) деп белгіленді. CS, цитратсинтаза; GAA, қышқыл альфа-глюкозидаза; gabarapl1, гамма-аминомай қышқылы рецепторымен байланысқан ақуыз; GPa, гликогенфосфорилаза a; GS, гликогенсинтаза; GSK-3β, гликогенсинтаза-киназа-3β; HK, гексокиназа; PFK, фосфофруктокиназа-1; PK, пируваткиназа; stbd1, крахмал байланыстырушы домен 1. Жұлдызша белгілері * p &amp;lt; 0,05 деңгейіндегі айтарлықтай айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f4.jpg\" alt=\"Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы липид алмасуы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы липид алмасуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы липид алмасуы. (A, B) Гепатопанкреас гистологиясы және май қызыл О (oil red O) бояуы бойынша боялған аудан статистикасы. (C) Тіндердегі липид мөлшері. (D, E) Сарысу мен гепатопанкреастағы липид алмасуына қатысты параметрлер. (F) Липид алмасуына қатысатын гендер экспрессиясы. Маңыздылық деңгейі p &amp;lt; 0,05, n = 3 (әр топқа) деп белгіленді. acadm, орташа тізбекті ацил-КоА-дегидрогеназа; acc1, ацетил-КоА-карбоксилаза 1; atgl, адипозды триглицеридлипаза; cpt1, карнитинпальмитоилтрансфераза 1; dgat1, диацилглицерол-О-ацилтрансфераза 1; fasn, май қышқылы синтазасы; gpat4, глицерол-3-фосфат-ацилтрансфераза 4; hadh, гидроксиацил-КоА-дегидрогеназа; HDL-C, жоғары тығыздықтағы липопротеин холестерині; hsl, гормонға сезімтал липаза; LDL-C, төмен тығыздықтағы липопротеин холестерині; lpin1, аутосомды-рецессивті липин-1; lpl, липопротеинлипаза; pparα, пероксисома пролифераторымен белсендірілетін рецептор α; TBA, жалпы өт қышқылы; TC, жалпы холестерин; TG, триглицерид. Жұлдызша белгілері * p &amp;lt; 0,05 деңгейіндегі айтарлықтай айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f5.jpg\" alt=\"Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы іш қуысына глюкоза енгізу арқылы өткізілген толеран\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы іш қуысына глюкоза енгізу арқылы өткізілген толеранттылық сынағы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Zn деңгейі әртүрлі рационмен қоректенген M. salmoides балықтарындағы іш қуысына глюкоза енгізу арқылы өткізілген толеранттылық сынағы. (A, B, C) Сарысудағы TC, TG және Glu деңгейлері, сондай-ақ AUC және &lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;iAUC&lt;/a&gt;. Маңыздылық деңгейі p &amp;lt; 0,05, n = 3 (әр топқа) деп белгіленді. AUC, қисық астындағы аудан; Glu, глюкоза; iAUC, инкременталды қисық астындағы аудан; TC, жалпы холестерин; TG, триглицерид. Жұлдызша белгілері * p &amp;lt; 0,05 деңгейіндегі айтарлықтай айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f6.jpg\" alt=\"Құрамында әртүрлі деңгейдегі мырыш (Zn) бар жеммен қоректенген M. salmoides балықтарына іш қуысына инсулин енгізу арқылы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Құрамында әртүрлі деңгейдегі мырыш (Zn) бар жеммен қоректенген M. salmoides балықтарына іш қуысына инсулин енгізу арқылы жүргізілген төзімділік сынағы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Құрамында әртүрлі деңгейдегі мырыш (Zn) бар жеммен қоректенген M. salmoides балықтарына іш қуысына инсулин енгізу арқылы жүргізілген төзімділік сынағы. (A, B, C) Сарысудағы жалпы холестерин (TC), триглицеридтер (TG) және глюкоза (Glu) деңгейлері, сондай-ақ AUC және iAUC. Маңыздылық деңгейі p &amp;lt; 0,05 деп белгіленген, әр топта n = 3. AUC — қисық астындағы аудан; Glu — глюкоза; iAUC — қисық астындағы қосымша аудан; TC — жалпы холестерин; TG — триглицеридтер. Жұлдызша белгілері * p &amp;lt; 0,05 деңгейінде статистикалық маңызды айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f7.jpg\" alt=\"Тағамдық мырыштың инсулин сигналдық жолына әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Тағамдық мырыштың инсулин сигналдық жолына әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Тағамдық мырыштың инсулин сигналдық жолына әсері. (A, D, F) Гепатопанкреастағы PI3K (жасыл) және p-AKT (қызыл) бірлескен боялуының өкілді конфокалды кескіндері мен статистикасы. (B) Сарысудағы инсулин деңгейі. (C) Инсулин сигналдық жолына қатысатын гендер экспрессиясы. (E, G) Гепатопанкреастағы p-AKT және PI3K ақуыздарының экспрессиясы. Маңыздылық деңгейі p &amp;lt; 0,05 деп белгіленген, әр топта n = 3. akt1 — серин/треонин киназа 1; foxo1 — forkhead транскрипция факторы FKHR; glut2 — 2-глюкоза тасымалдаушысын кодтайтын SLC2A2; ira — инсулин рецепторы a; irb — инсулин рецепторы b; pi3kr1 — фосфатидилинозит-3-киназа p85 α. Жұлдызша белгілері * p &amp;lt; 0,05 деңгейінде статистикалық маңызды айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f8.jpg\" alt=\"Әртүрлі деңгейдегі мырыш (Zn) бар жеммен қоректенген M. salmoides балықтарының мақсатсыз (untargeted) метаболомикалық де\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі деңгейдегі мырыш (Zn) бар жеммен қоректенген M. salmoides балықтарының мақсатсыз (untargeted) метаболомикалық деректер жиынтығы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әртүрлі деңгейдегі мырыш (Zn) бар жеммен қоректенген M. salmoides балықтарының мақсатсыз (untargeted) метаболомикалық деректер жиынтығы. (A) Үш салыстыру тобындағы (HS-LZn бақылау тобына қарсы, HS-MZn бақылау тобына қарсы, HS-LZn HS-MZn-ге қарсы) айтарлықтай ерекшеленетін метаболиттер саны. (B) Мақсатсыз метаболит профильдерінің басты компоненттер талдауы (PCA). (C, D) KEGG метаболикалық жолдарын байыту графигі (көпіршікті диаграмма) және екі салыстыру тобы (HS-LZn бақылау тобына қарсы, HS-MZn бақылау тобына қарсы) арасындағы дифференциалды көрсеткіштер. (E) Екі салыстыру тобына (HS-LZn бақылау тобына қарсы, HS-MZn бақылау тобына қарсы) ортақ дифференциалды метаболиттер. Жұлдызша белгілері * p &amp;lt; 0,05 және ** p &amp;lt; 0,01 деңгейінде статистикалық маңызды айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Крахмалдан&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;туындаған&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инсулин&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;төзімділігі&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Балық&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рационына&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мырыш қосу&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Глюкоза&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алмасуының&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жақсаруы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Балық жемі&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрамын&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оңтайландыру&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Aquaculture nutrition журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Aquaculture nutrition (Europe PMC)&lt;/td&gt;\n&lt;td&gt;starch&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар
