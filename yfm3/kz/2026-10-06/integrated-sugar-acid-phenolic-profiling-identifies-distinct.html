        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"160\" cy=\"100\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"680\" cy=\"207\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · ANTIOXIDANTS_ADD   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Тәтті алмалар&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;антиоксиданттық қорғаныс&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жағынан қышқыл сорттарға жол&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;береді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f1.jpg\" alt=\"12 сорттан алынған 25 алма жұмсағы үлгісінің химиялық құрамы және in vitro антиоксиданттық белсенділігі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12 сорттан алынған 25 алма жұмсағы үлгісінің химиялық құрамы және in vitro антиоксиданттық белсенділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;12 сорттан алынған 25 алма жұмсағы үлгісінің химиялық құрамы және in vitro антиоксиданттық белсенділігі. (A) Алма материалдары және эксперименттік жұмыс барысы. (B, C) Жалпы фенолдар мен жалпы флавоноидтардың мөлшері. (D) 16 нысаналы фенолдық және флавоноидтық қосылыстардың жылу картасы. (E) Фруктоза, глюкоза және сахароза мөлшерінің жылу картасы. (F) Алма және хин қышқылдары мөлшерінің жылу картасы. (G–I) DPPH радикалдарының сіңірілу белсенділігі, FRAP қалпына келтіру қабілеті және ABTS радикалдарының сіңірілу белсенділігі. Химиялық мәндер әр үлгі үшін бес биологиялық қайталаудың орташа мәні ретінде (n = 5), әр қайталау үшін бір жемістен пайдаланылып берілген. Қателік сызықтары стандартты ауытқуларды көрсетеді. &lt;a href=\"concepts/gallic-acid-equivalent.html\"&gt;GAE&lt;/a&gt; — галл қышқылының эквиваленттері; RE — рутин эквиваленттері; FW — жас салмағы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Алманың сапасын тек тәттілігіне қарап бағалау оның нақты антиоксиданттық құндылығын ескермейді. 25 үлгінің жұмсағын талдау жемістерді төрт химиялық түрге бөлді, оларда негізінен фруктоза мен алма қышқылы басым. Бос радикалдарды бейтараптандыру қабілеті қант немесе қышқылға емес, полифенолдарға байланысты. Жасушалық модельдерде фенолға бай сорттардың сығындылары тотығу стресін анағұрлым тиімді төмендетті.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Алма жұмсағында дәм үйлесімін түзететін фруктоза мен алма қышқылы басым&lt;/li&gt;\n&lt;li&gt;Тәтті сорттарда фенолдар аз болып, антиоксиданттық қуаты төмендеу болады&lt;/li&gt;\n&lt;li&gt;5 мкг/мл полифенол сығындысы &lt;a href=\"concepts/hepg2.html\"&gt;HepG2&lt;/a&gt; жасушасындағы тотығу стресін азайтады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Алма жұмсағының құрамы 12 коммерциялық сорттан (Malus × domestica) алынған 25 үлгіде 5 биологиялық қайталаныммен (n = 5) зерттелді. Бос қанттар (глюкоза, фруктоза, сахароза) &lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;UPLC&lt;/a&gt;-ELSD әдісімен, ал органикалық қышқылдар (алма және хин қышқылдары) мен фенолды қосылыстар UPLC-PDA-MS арқылы анықталды. Негізгі қант фруктоза, ал басым қышқыл алма қышқылы (&lt;a href=\"concepts/malic-acid.html\"&gt;E296&lt;/a&gt;) болды. Жеті белгі бойынша жүргізілген иерархиялық кластерлеу үлгілерді төрт топқа бөлді: қышқылды, фенолы аз тәтті, аралық және фенолға бай.&lt;/p&gt;\n&lt;p&gt;Антиоксиданттық белсенділік ABTS, DPPH және FRAP әдістерімен бағаланды. Талдау көрсеткендей, қант пен қышқылдың бос радикалдарды байланыстырудағы үлесі полифенолдар мен флавоноидтардан әлдеқайда төмен. Қорғаныс қасиеттері HepG2 адам гепатомасы жасушаларында дәлелденді: 5 мкг/мл қауіпсіз концентрациядағы сығынды сутек асқын тотығы (500 мкМ H2O2, 1 сағ) мен t-BHP (1 мМ, 1,5 сағ) тудырған оттектің белсенді түрлерін айтарлықтай тежеді. Ең жоғары жасушалық қорғанысты фенолдары басым TPGSH үлгісі көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Үлгілер коммерциялық бақтардан жиналғандықтан, өсіру және сақтау шарттары толық бақыланбаған, ал сынақтар тек бір жасуша желісінде жасалған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"suretter\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#suretter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Суреттер&lt;/span&gt;&lt;/a&gt;Суреттер&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f2.jpg\" alt=\"12 сорттан алынған 25 алма жұмсағы үлгісіндегі жеті қайталанбайтын химиялық белгінің дөңгелек иерархиялық кластерлік жыл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12 сорттан алынған 25 алма жұмсағы үлгісіндегі жеті қайталанбайтын химиялық белгінің дөңгелек иерархиялық кластерлік жылу картасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;12 сорттан алынған 25 алма жұмсағы үлгісіндегі жеті қайталанбайтын химиялық белгінің дөңгелек иерархиялық кластерлік жылу картасы. Жылу картасы бес биологиялық қайталаудан алынған фруктоза, глюкоза, сахароза, алма қышқылы, хин қышқылы, жалпы фенолдар және жалпы флавоноидтардың орташа мөлшері негізінде құрылды. Әр белгі үшін деректер үлгілер бойынша Z-баллмен стандартталды: қызғылт сары түс орташа мәннен жоғары, ақ түс орташа мәнге жақын, көгілдір түс орташа мәннен төмен көрсеткіштерді білдіреді. Иерархиялық кластерлеу Евклид қашықтығы және Ward.D2 байланыстыру әдісі арқылы орындалды, дендрограмма үлгілер деңгейінде төрт химиялық түрге бөлінді. Ішкі түсті секторлар мен сыртқы көлеңкелі жолақтар тиісті түрге жататынын көрсетеді. Түр нөмірлері ерікті кластер идентификаторлары болып табылады және үлгілер сапасының рейтингін білдірмейді. Тұтас жемістердің өкілдік фотосуреттері морфологиялық анықтама үшін жылу картасының айналасында тиісті үлгі ретінде орналастырылған, ал барлық химиялық өлшеулер алма жұмсағын пайдаланып жүргізілді. Үлгілердің қысқартулары және шығу тегі туралы толық ақпарат S1-кестеде берілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f3.jpg\" alt=\"12 сорттан алынған 25 алма жұмсағы үлгісіндегі антиоксиданттық қабілет және оның химиялық белгілермен байланысы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12 сорттан алынған 25 алма жұмсағы үлгісіндегі антиоксиданттық қабілет және оның химиялық белгілермен байланысы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;12 сорттан алынған 25 алма жұмсағы үлгісіндегі антиоксиданттық қабілет және оның химиялық белгілермен байланысы. (A) Төрт химиялық түр арасындағы қалыпқа келтірілген ABTS, DPPH, FRAP және жиынтық антиоксиданттық балл. Жиынтық балл қалыпқа келтірілген ABTS, DPPH және FRAP мәндерінің арифметикалық орташасы ретінде есептелді. Қораптар квартиларалық ауқымды, көлденең сызықтар медианаларды, «мұртшалар» 1,5 квартиларалық ауқымды, нүктелер жеке үлгілерді білдіреді. (B) Антиоксиданттық индекстер мен таңдалған химиялық белгілер арасындағы Спирмен корреляциясы. Сандар Спирменнің rho мәнін білдіреді; *, ** және *** сәйкесінше p &amp;lt; 0,05, p &amp;lt; 0,01 және p &amp;lt; 0,001 мәндерін білдіреді. (C, D) Жиынтық антиоксиданттық баллдың жалпы фенол (C) және жалпы флавоноид (D) мөлшерімен байланысы. Сызықтар сызықтық регрессияны, көлеңкелі аймақтар 95% сенімділік интервалдарын көрсетеді. Түстер химиялық түрлерді білдіреді; үшбұрыштар жасушалық валидация үшін таңдалған бес үлгіні, шеңберлер қалған үлгілерді білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f4.jpg\" alt=\"HepG2 жасушаларында цитотоксикалықты бағалау және тотығу стрессі модельдерін құру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HepG2 жасушаларында цитотоксикалықты бағалау және тотығу стрессі модельдерін құру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HepG2 жасушаларында цитотоксикалықты бағалау және тотығу стрессі модельдерін құру. (A, B) Алма жұмсағы полифенол сығындыларының сәйкесінше 5 және 10 мкг/мл концентрацияда жасушалардың өміршеңдігіне әсері. (C) t-BHP концентрациясы мен әсер ету ұзақтығының жасушалардың өміршеңдігіне әсері. (D) 1 сағаттық әсерден кейінгі H2O2 концентрациясының әсері. (E) С дәруменімен немесе алма полифенол сығындыларымен алдын ала өңдеуден кейін, H2O2 және t-BHP тудырған тотығу стрессі кезіндегі жасуша ішілік ROS-тың өкілдік &lt;a href=\"concepts/dcfh-da.html\"&gt;DCFH-DA&lt;/a&gt; флуоресцентті суреттері. (F, G) Сәйкесінше H2O2 және t-BHP модельдеріндегі ROS флуоресценциясын сандық анықтау. Деректер орташа ± стандартты ауытқу (n = 3) ретінде берілген. *** p &amp;lt; 0,001, Model тобымен салыстырғанда.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f5.jpg\" alt=\"Алма жұмсағы полифенол сығындыларының HepG2 жасушаларындағы тотығу зақымдануы мен антиоксиданттық қорғанысқа әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Алма жұмсағы полифенол сығындыларының HepG2 жасушаларындағы тотығу зақымдануы мен антиоксиданттық қорғанысқа әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Алма жұмсағы полифенол сығындыларының HepG2 жасушаларындағы тотығу зақымдануы мен антиоксиданттық қорғанысқа әсері. H2O2 (A, C, E, G) және t-BHP (B, D, F, H) тудырған тотығу стрессі жағдайында LDH бөлінуі (A, B), CAT белсенділігі (C, D), SOD белсенділігі (E, F) және MDA мөлшері (G, H) анықталды. Жасушалар С дәруменімен немесе таңдалған бес алма жұмсағы үлгісінен алынған полифенол сығындыларымен алдын ала өңделді. Деректер орташа ± стандартты ауытқу (n = 3) ретінде берілген. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001, Model тобымен салыстырғанда.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Алма дәмі мен &lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;антиоксидантты&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қ байланыс&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;UPLC хроматогр&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;афиясы және&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;HepG2 тесті&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;4 хемотип;&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фенолдар&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қанттан&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әлдеқайда&lt;/text&gt;&lt;text x=\"426\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маңызды&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қышқыл сорттар&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өңдеу&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өндірісіне&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пайдалы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Foods (Basel, Switzerland) журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;s
