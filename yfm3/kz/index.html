afety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html\"&gt;ББҚ-дағы каннабидиол кристалдары: еуропалық реттеуші изолят қауіпсіздігін мақұлдамады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Балық фаршына асқабақ ұнтағын қосу: сурими текстурасын жақсарту&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Теңіз алабұғасының терісі: балық өңдеу қалдықтарынан жеуге жарамды қаптама&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/structure.html\"&gt;Тақырыптың барлық материалдары →&lt;/a&gt;&lt;/p&gt;\n","media":{"image":"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-card.jpg"}},{"title":"Жаңа тағам","tabName":"Жаңа тағам · 5","text":"&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Азық-түлік себеті дәрінің орнын баса ала ма: ұзақ мерзімді диета тәжірибесі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Кендір мен сұлы: ферментация өсімдік ақуызының құрылымын қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Жасымық пен ноқаттағы жасырын қауіп: зең өсімдік ақуызын қалай бұзады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;Өсімдік йогурты: таңдау кезінде дәм маңызды ма әлде жапсырма ма?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html\"&gt;Жасушалық ет: жержаңғақ пен киноа жануар ақуызын алмастырады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/newfood.html\"&gt;Тақырыптың барлық материалдары →&lt;/a&gt;&lt;/p&gt;\n","media":{"image":"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry-card.jpg"}},{"title":"Қауіпсіздік және сақтау","tabName":"Қауіпсіздік және сақтау · 7","text":"&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html\"&gt;Пластик орнына кактус: опунция қалдықтарынан жаңа қаптама&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html\"&gt;Жарықта тұрған етті май күткеннен де тез бұзылады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Қызанақ пен цитрустарды шіруден қорғайтын көрінбейтін хитозан қабықшасы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html\"&gt;Дайын тағамдар мен тіскебасарлар: 8,8 млн адамға жасалған талдау өңделген өнімдердің салдарын көрсетті&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html\"&gt;Васаби қаптамасы неге ісінеді және оны қалай тоқтатуға болады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/safety.html\"&gt;Тақырыптың барлық материалдары →&lt;/a&gt;&lt;/p&gt;\n","media":{"image":"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-card.jpg"}},{"title":"Нутриенттер","tabName":"Нутриенттер · 7","text":"&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Бауырдың майлы ауруы: неге жаңа жағдайлар саны 30 жылда екі есе өсті&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html\"&gt;Крахмалды қайта қыздыру неге әрқашан ас қорытуды жеңілдетпейді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html\"&gt;Кофе мен алманы біріктіру: функционалды тағамдарға арналған табиғи катализатор&lt;/a&gt;&lt;/l :"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-card.jpg"},"content":{"title":"Балмұздақтағы гиалурон қышқылы: молекулалық салмақ текстураны қалай өзгертеді","text":"&lt;p&gt;Ғалымдар гиалурон қышқылы балмұздақ құрамындағы әдеттегі тұрақтандырғыштарды алмастыра алатынын тексеріп көрді.&lt;/p&gt;\n","links":[{"url":"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-card.jpg"},"content":{"title":"Бауырдың майлы ауруы: неге жаңа жағдайлар саны 30&amp;nbsp;жылда екі есе өсті","text":"&lt;p&gt;Бауырдың майлы ауруы жаһандық мәселеге айналды. Соңғы 30 жылдағы статистикалық трендтер не дейді?&lt;/p&gt;\n","links":[{"url":"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-card.jpg"},"content":{"title":"Пластик орнына кактус: опунция қалдықтарынан жаңа қаптама","text":"&lt;p&gt;Ғалымдар опунция кактусының қалдықтарынан пластикті алмастыра алатын биоыдырайтын үлдір жасап шығарды.&lt;/p&gt;\n","links":[{"url":"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-card.jpg"},"content":{"title":"Алоэ вера гелі кесілген мангоны бүлінуден қалай сақтайды","text":"&lt;p&gt;Ғалымдар алоэ вера гелінен жасалған қаптама кесілген мангоны балға қарағанда екі есе тиімді қорғайтынын анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-card.jpg"},"content":{"title":"Крахмалды қайта қыздыру неге әрқашан ас&amp;nbsp;қорытуды жеңілдетпейді","text":"&lt;p&gt;Ыстық тағам оңай қорытылады деген түсінік крахмалға келгенде өзгереді. Гель құрылымының ас қорытуға әсерін талдаймыз.&lt;/p&gt;\n","links":[{"url":"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Шығарылым &amp;middot; 06.10.2026","url":"2026-10-06/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-card.jpg"},"content":{"title":"Кендір мен сұлы: ферментация өсімдік ақуызының құрылымын қалай өзгертеді","text":"&lt;p&gt;Кендір мен сұлы күнжарасын араластыру және ферментациялау өсімдік еті аналогтарының сапасын қалай жақсартатынын талдаймыз.&lt;/p&gt;\n","links":[{"url":"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-card.jpg"},"content":{"title":"Мырыш және көмірсулар: балықтардың рационын қалай дұрыстау керек","text":"&lt;p&gt;Крахмалға бай жем балық метаболизмін бұзады, ал мырыш қоспасы инсулинге сезімталдықты қалпына келтіруге көмектеседі.&lt;/p&gt;\n","links":[{"url":"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe-card.jpg"},"content":{"title":"Кешью ірімшігінің жасырын өмірі: ферменттелген өнімдерде не&amp;nbsp;бар","text":"&lt;p&gt;Біз кешью жаңғағынан жасалған қолөнер ірімшіктерін тексеріп, пайдалы бактериялардан бөлек қызықты нәрселерді таптық.&lt;/p&gt;\n","links":[{"url":"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-card.jpg"},"content":{"title":"Қуырылған өнімдердің иісі: пиразиндерді анықтайтын жаңа биосенсор","text":"&lt;p&gt;Ғалымдар кофе мен нан иісін адам секілді сезетін, бірақ дәлірек жұмыс істейтін «электронды мұрын» жасап шығарды.&lt;/p&gt;\n","links":[{"url":"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n-card.jpg"},"content":{"title":"ББҚ-дағы каннабидиол кристалдары: еуропалық реттеуші изолят қауіпсіздігін мақұлдамады","text":"&lt;p&gt;EFSA каннабидиолды мақұлдамады: өндіруші тасымалдаушы майдағы нанобөлшектерді зерттемеген.&lt;/p&gt;\n","links":[{"url":"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-card.jpg"},"content":{"title":"Тәтті алмалар антиоксиданттық қорғаныс жағынан қышқыл сорттарға жол береді","text":"&lt;p&gt;12 алма сортының химиялық талдауы көрсеткендей: қанттың көптігі көбінесе фенолдардың аздығын білдіреді.&lt;/p&gt;\n","links":[{"url":"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-card.jpg"},"content":{"title":"L-теанин және ауыр металдар: шай құрамындағы зат бауырды қалай қорғайды?","text":"&lt;p&gt;Ғалымдар шай құрамындағы аминқышқылы кадмий тудыратын бауыр зақымдануын азайтуы мүмкін екенін анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-card.jpg"},"content":{"title":"Аналық немесе аталық: неге кейбір мидиялар мұздатқышта тезірек бұзылады","text":"&lt;p&gt;Мидиялар мұздатылғанда жынысына байланысты әртүрлі өзгереді: аналықтарында липидтердің тотығуы 1,7 есе жоғары.&lt;/p&gt;\n","links":[{"url":"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo-card.jpg"},"content":{"title":"Қанша жегеніңізді дәл білу: цифрлық тағам атласы","text":"&lt;p&gt;Ғалымдар тағамдардың фотосуреттері мен құрамы бар база жасады, бұл порция көлемі мен калорияны дәл бағалауға көмектеседі.&lt;/p&gt;\n","links":[{"url":"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Шығарылым &amp;middot; 05.10.2026","url":"2026-10-05/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides-card.jpg"},"content":{"title":"Кофе мен алманы біріктіру: функционалды тағамдарға арналған табиғи катализатор","text":"&lt;p&gt;Ғалымдар кофе антиоксиданттарын сүт пептидтерімен қосу үшін агрессивті химияның орнына алма шырынын қолдану әдісін тапты.&lt;/p&gt;\n","links":[{"url":"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/comparative-evaluation-of-white-quinoa-and-tri-color-quinoa-card.jpg"},"content":{"title":"Асқазан жарасынан қорғаныс: н
