            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"205\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"595\" cy=\"165\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · EXTRUSION   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Қант секірісіне қарсы&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;экструзия: шоколадты өңдеу&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ағзаның реакциясын қалай&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өзгертеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f1.jpg\" alt=\"Зерттеу дизайнының CONSORT ағын диаграммасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Зерттеу дизайнының &lt;a href=\"concepts/consort.html\"&gt;CONSORT&lt;/a&gt; ағын диаграммасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Тәттілер қандағы глюкоза мен майлардың күрт көтерілуіне әкеледі. Жапон зерттеушілері шоколадтың рецептурасын өзгертпей, тек ингредиенттердің физикалық құрылымын өзгерту арқылы бұл әсерді тежеуге болатынын тексерді. Қант, какао массасы және құрғақ сүттің бір бөлігі 105 °C температурада қос шнекті экструдерден өткізілді. Мұндай шоколад инсулин бөлінуін едәуір азайтып, тоқтық сезімін ұзартты.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Құрамы бірдей: 33,5% сахароза және 34% май, айырмашылық тек шикізатты экструзиялауда&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt; 30-минуттағы инсулин шыңын 26,8-ден 20,6 мкХБ/мл-ге дейін түсірді&lt;/li&gt;\n&lt;li&gt;Қанттың баяу еруі қатысушыларға ұзағырақ тоқтық сезімін сыйлады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу барысында химиялық құрамы бірдей екі шоколад үлгісі дайындалды: 100 грамға шаққанда 33,5 г сахароза, 14,5–14,9 г лактоза және шамамен 34 г май. Тәжірибелік үлгіде (Cw/E) 33,55% қант, 6,6% үгілген какао және 14,85% майлы құрғақ сүт &lt;a href=\"concepts/twin-screw-extruder.html\"&gt;Coperion ZSK34Mv Plus&lt;/a&gt; қос шнекті экструдерінде алдын ала өңделді (шнек жылдамдығы 200 айн/мин, шығу температурасы 105 °C). Алынған экструдат 1 мм електен ұнтақталып, әдеттегідей конштаудан өтіп, 28–30 °C температурада темперленді.&lt;/p&gt;\n&lt;p&gt;Рандомизацияланған сынаққа 18 сау ер адам қатысып, аш қарынға 76 г шоколад жеді. Экструзияланған өнімді жегенде 45-минутта глюкоза өсімі 17,8 ± 6,0 мг/дл болды (бақылау тобында 25,1 ± 6,4 мг/дл), ал 30-минуттағы инсулин көрсеткіші 26,8-ден 20,6 мкХБ/мл-ге дейін төмендеді. Триглицеридтер деңгейі де 180 минут бойы айтарлықтай төмен болып, ерігіштік тесті қанттың баяу бөлінетінін дәлелдеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сынақ тек салмағы қалыпты 18 жапон ер адамына жүргізілді, әйелдер мен қант диабеті бар жандардағы әсер бөлек тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қант пен липидтер маңызды қоректік компоненттер болғанымен, оларды шамадан тыс тұтыну семіздік, метаболикалық синдром, қант диабеті және жүрек-қан тамыр ауруларымен байланысты. Гипергликемия және тамақтан кейін қандағы глюкоза деңгейінің күрт өзгеруі эндотелий функциясына теріс әсер етіп, тотығу стрессін күшейтеді. Қандағы глюкоза деңгейін оңтайлы бақылау денсаулықты сақтау үшін маңызды. Тамақтануға заманауи көзқарас қатаң шектеулерден бас тартып, тағамға тұтас қарауды, яғни тек қоректік заттардың мөлшерін ғана емес, сонымен қатар олардың сіңуіне әсер ететін өңдеу әдістерін де ескеруді ұсынады.&lt;/p&gt;\n&lt;p&gt;Экструзия — жоғары температура мен қысым астында үздіксіз араластыру және илеу процесі — тағамдар мен құрғақ таңғы астарды өндіруде кеңінен қолданылады. Зерттеулер көрсеткендей, экструзия крахмал мен липидтердің құрылымын өзгертіп, олардың қорытылуына әсер етуі мүмкін. Бұл зерттеуде экструзияланған шоколадтың тамақтан кейінгі метаболикалық жауапқа және қанттардың суда еруге төзімділігіне әсері тексерілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шоколадты экструзиялау қанттардың еруін баяулатып, тамақтан кейінгі қандағы глюкоза, инсулин және триглицеридтер деңгейін төмендетуі мүмкін, бұл ұзақ уақыт бойы тоқтық сезімін қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рандомизацияланған екі жақты соқыр сынақта (CONSORT) 18 сау жапон ер адамдары (20–60 жас, BMI 20,0–24,9) қатысты. Қатысушылар экструзия жасалған (Cw/E) немесе жасалмаған (Cw/oE) шоколадты тұтынды. Екі үлгінің құрамы бірдей болды. Глюкоза, инсулин және триглицеридтер деңгейі аш қарынға және тамақтан кейін 180 минут ішінде өлшенді. Сондай-ақ тәбет көрсеткіштері және шоколад компоненттерінің жасанды асқазан ортасында еруге төзімділігі бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CONSORT — рандомизацияланған сынақтар үшін есеп беру стандарты, ол зерттеу дизайнының ашықтығын қамтамасыз етеді және қателіктерді азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын топта (18 адам) тек сау ер адамдардың қатысуымен өткізілді, бұл нәтижелерді әйелдерге, балаларға және метаболикалық аурулары бар адамдарға қолдану мүмкіндігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аш қарынға глюкоза, инсулин және триглицеридтер деңгейі топтар арасында ерекшеленбеді. Cw/E тұтынғаннан кейін Cw/oE-ге қарағанда инсулин (30-минутта) және триглицеридтер (30 және 45-минуттарда) деңгейі төменірек болды. Инсулин үшін интегралды көрсеткіштер (&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;iAUC&lt;/a&gt;) Cw/E тобында айтарлықтай төмен болды. 120-минутта тоқтық сезімі Cw/E тобында жоғарырақ болды. In vitro сынақтарында Cw/E шоколадынан сахароза мен лактозаның еруі Cw/oE-ге қарағанда баяу жүрді.&lt;/p&gt;\n&lt;p&gt;Нәтижелер тағам өнімдерін өңдеу әдісі метаболикалық жауапқа әсер ететінін растайды. Экструзиядан өткен шоколадтағы қанттардың баяу еруі, мүмкін, құрылымдық «қаңқаның» түзілуімен немесе тұтқырлықтың өзгеруімен байланысты, бұл қоректік заттардың сіңуін баяулатады. Бұл метаболизмге түсетін жүктемені азайта отырып, өнімнің дәмдік сапасын сақтауға мүмкіндік береді. Ұзақ мерзімді әсерлерді және тоқтық гормондарына (мысалы, GLP-1) әсер ету механизмдерін бағалау үшін қосымша зерттеулер қажет.&lt;/p&gt;\n&lt;p&gt;Шоколадты экструзиялау тамақтан кейінгі глюкоза, инсулин және триглицеридтер деңгейінің күрт көтерілуін азайтады және тоқтық сезімін сақтауға көмектеседі. Өңдеудің бұл әдісі метаболикалық денсаулықты қолдайтын өнімдерді жасау үшін перспективалы құрал болып табылады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f1.jpg\" alt=\"Зерттеу дизайнының CONSORT ағын диаграммасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Зерттеу дизайнының CONSORT ағын диаграммасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f2.jpg\" alt=\"Экструзия әдісімен немесе онсыз өңделген шоколадты (сәйкесінше Cw/E немесе Cw/oE) тұтынғаннан кейінгі (A) плазмадағы глю\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Экструзия әдісімен немесе онсыз өңделген шоколадты (сәйкесінше Cw/E немесе Cw/oE) тұтынғаннан кейінгі (A) плазмадағы глюкоза, (B) сарысудағы инсулин және (C) сарысудағы триглицеридтер деңгейінің уақытқа байланысты өзгеруі. Қателік сызықтары орташа мәннің стандартты қателігін (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;) көрсетеді. &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1, екі топ арасындағы айырмашылық.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f3.jpg\" alt=\"Экструзия әдісімен немесе онсыз өңделген шоколадты (сәйкесінше Cw/E немесе Cw/oE) тұтынғаннан кейінгі (A) плазмадағы глю\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Экструзия әдісімен немесе онсыз өңделген шоколадты (сәйкесінше Cw/E немесе Cw/oE) тұтынғаннан кейінгі (A) плазмадағы глюкоза, (B) сарысудағы инсулин және (C) сарысудағы триглицеридтер деңгейінің өзгеруі үшін уақытқа байланысты қисық астындағы инкременталды аудандар (iAUC). Қателік сызықтары SEM-ді көрсетеді. &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1, екі топ арасындағы айырмашылық.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f4.jpg\" alt=\"Экструзия әдісімен немесе онсыз өңделген шоколадты (сәйкесінше Cw/E немесе Cw/oE) тұтынғаннан кейінгі қатысушылардың тәб\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Экструзия әдісімен немесе онсыз өңделген шоколадты (сәйкесінше Cw/E немесе Cw/oE) тұтынғаннан кейінгі қатысушылардың тәбет көрсеткіштерінің өзгеруі. (A) Аштық сезімі; (B) тоқтық сезімі; (C) тамақтануға деген құлшыныс. Қателік сызықтары SEM-ді көрсетеді. &lt;em&gt;p &amp;lt; 0,05; екі топ арасындағы айырмашылық.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f5.jpg\" alt=\"Экструзия әдісімен немесе онсыз өңделген шоколадты (сәйкесінше Cw/E немесе Cw/oE) пайдаланып, асқазанның имитациялық ері\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Экструзия әдісімен немесе онсыз өңделген шоколадты (сәйкесінше Cw/E немесе Cw/oE) пайдаланып, асқазанның имитациялық ерітіндісінде инкубациялау кезіндегі (A) сахароза эквиваленті мен (B) лактозаның концентрациялық профильдері. Қателік сызықтары SEM-ді көрсетеді. &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1; екі топ арасындағы айырмашылық.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewB f\" font-size=\"15\" font-weight=\"600\"&gt;ұзақ тоқтық&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Өңдеу арқылы&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гликемияны&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;басқару&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Food science &amp;amp; nutrition журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Food science &amp;amp; nutrition (Europe PMC)&lt;/td&gt;\n&lt;td&gt;extrusion&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Kinta Y, Maruki-Uchida H, Umehara M, Ito R, Shiga R, Yasumoto Y, Mo
