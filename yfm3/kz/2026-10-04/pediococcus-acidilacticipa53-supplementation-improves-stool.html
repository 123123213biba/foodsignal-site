        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"270\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"630\" cy=\"284\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · FIBRE_MICROBIOME   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ашытқыдағы сүт қышқылы&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;бактериясы іш қатуды&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жеңілдетеді: PA53 штаммының&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;клиникалық сынағы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f1.jpg\" alt=\"Клиникалық зерттеудің блок-схемасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Клиникалық зерттеудің блок-схемасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Функционалдық іш қату көбінесе ішек микробиотасының бұзылуымен және перистальтиканың баяулауымен байланысты. Жаңа зерттеуде &lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; PA53 штаммы ересектердегі нәжіс тығыздығын қалыпқа келтіруге көмектесетінін көрсетті. Бұл бактерияны күнделікті қабылдау ішек қозғалысын реттейтін гормондар мен цитокиндерге оң әсер етті. Дегенмен, дәреттің жиілігі бойынша топтар арасындағы айырмашылық статистикалық тұрғыдан байқалмады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Күніне 3,0 × 10¹⁰ КТБ PA53 қабылдау Бристоль шкаласы бойынша нәжісті 8 аптада сенімді түрде жұмсартты.&lt;/li&gt;\n&lt;li&gt;Штамм моторика стимуляторы &lt;a href=\"concepts/motilin.html\"&gt;мотилин&lt;/a&gt; мен IL-10-ды арттырып, қабыну тудыратын IL-6 деңгейін азайтты.&lt;/li&gt;\n&lt;li&gt;Дәретке отыру жиілігі бойынша пробиотик пен плацебо топтарының арасындағы айырмашылық дәлелденбеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Pediococcus acidilactici — ашытылған тағамдарда жиі кездесетін грамоң гомоферментті сүт қышқылы бактериясы. Рим IV критерийлері бойынша іш қатуы анықталған 87 қатысушы 8 апта бойы күн сайын 3,0 × 10¹⁰ КТБ PA53 штаммын немесе декстрин плацебосын қабылдады. Нәтиже Бристоль нәжіс формасы шкаласы (&lt;a href=\"concepts/bristol-stool-form-scale.html\"&gt;BSFS&lt;/a&gt;) бойынша бағаланды, мұнда 1–2 балдар тығыз әрі қатты массаны білдіреді. Зерттеу соңында пробиотик тобында BSFS көрсеткіші плацебодағы 2,03 ± 0,85-пен салыстырғанда 2,76 ± 0,93-ке дейін өсті (p = 0,004), яғни нәжіс едәуір жұмсарды.&lt;/p&gt;\n&lt;p&gt;Қан сарысуының биохимиялық көрсеткіштері моторика мен иммундық жауаптың өзгергенін көрсетті: PA53 қабылдағандарда перистальтиканы күшейтетін мотилин гормоны мен қабынуға қарсы интерлейкин-10 (IL-10) мөлшері артты. Сонымен қатар, моториканы тежейтін &lt;a href=\"concepts/somatostatin.html\"&gt;соматостатин&lt;/a&gt; және қабыну маркері саналатын интерлейкин-6 (IL-6) деңгейі төмендеді. 16S рРНҚ генін секвенирлеу Pediococcus үлесінің артқанын және микробтық әртүрліліктің оң өзгергенін растады. Аптасына 4–6 рет дәретке шыққандар үлесі бұл топта 16,7%-дан 38,1%-ға дейін өскенімен, топтар арасындағы соңғы айырмашылық мәнді болмады (p = 0,144).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сынақ бір ғана орталықта 87 адам арасында өтті және дәретке отыру жиілігі плацебодан едәуір артық екенін көрсете алмады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Функционалды іш қатуы (ФІҚ) — ішектің жиі кездесетін созылмалы бұзылысы, ол әдетте іштің сирек жүруімен (аптасына үш реттен аз), қатты нәжіспен (Бристоль нәжіс пішіні шкаласы, BSFS бойынша 1–2-түрлер) және толық босамау сезімімен сипатталады. Ересектерде ФІҚ-ның жаһандық таралуы 10–14%-ды, ал қарттарда 30%-ға дейін жетуі мүмкін. ФІҚ патофизиологиясы көпфакторлы: тоқ ішектің моторикасының бұзылуы, ішкі мүшелердің жоғары сезімталдығы және «ішек-ми» осінің реттелуінің бұзылуы. ФІҚ кезіндегі дисбиоз қысқа тізбекті май қышқылдарын өндіретін бактериялар санының азаюымен және микробтық әртүрліліктің төмендеуімен байланысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 8 апталық рандомизацияланған екі жақты соқыр, плацебо-бақыланатын сынақ барысында ересектердегі функционалды іш қатуы кезінде Pediococcus acidilactici PA53 пробиотигінің тиімділігін бағалайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дәстүрлі емдеу өмір салтын өзгертуді және іш жүргізетін дәрілерді қамтиды, алайда олардың тиімділігі жанама әсерлермен және пациенттердің емге төмен деңгейде бейімделуімен шектелген. Bifidobacterium lactis HN019 және Weizmannia coagulans BC99 сияқты пробиотиктер нәжіс консистенциясын және транзит уақытын жақсартуда орташа тиімділік көрсетеді. Pediococcus acidilactici — әлеуетті иммуномодуляциялық қасиеттерге және педиоцин өндіру қабілетіне ие грам-оң гомоферментативті сүт қышқылы бактериясы.&lt;/p&gt;\n&lt;p&gt;Зерттеу Нинся медициналық университетінің ауруханасында (Қытай) 2024 жылдың 1 тамызы мен 2025 жылдың 30 мамыры аралығында өткізілді (NCT06761443 тіркеу нөмірі). Рим IV критерийлері бойынша ФІҚ диагнозы қойылған 87 қатысушы (18–70 жас) қамтылды. Зерттеу басталғанға дейін 4 апта бұрын іш жүргізетін дәрілер немесе пробиотиктер қабылдаған, сондай-ақ ауыр қатар жүретін аурулары бар тұлғалар шығарылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рандомизацияланған екі жақты соқыр, плацебо-бақыланатын зерттеу — клиникалық сынақтардың «алтын стандарты» болып табылады, мұнда қатысушылар да, зерттеушілер де кімнің белсенді препарат, кімнің плацебо алып жатқанын білмейді, бұл бұрмалаушылықты азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қатысушылар екі топқа (1:1) рандомизацияланды: PA53 тобы (3 г декстрин және 3,0 × 10¹⁰ CFU P. acidilactici PA53) және плацебо тобы (3 г декстрин). Бастапқы нәтиже — BSFS шкаласы бойынша нәжіс консистенциясының өзгеруі. Қосымша нәтижелер — спонтанды дефекация жиілігі (SBM), өмір сапасы (PAC-QOL), психологиялық жағдай (DASS-21), биохимиялық және қабыну маркерлері, сондай-ақ микробиота құрамы (16S rRNA секвенирлеу).&lt;/p&gt;\n&lt;p&gt;Зерттеуге 81 адам (PA53 тобында 42, плацебо тобында 39) қатысты. 8 аптадан кейін PA53 тобында BSFS көрсеткіші айтарлықтай өсті (1,93 ± 0,80-ден 2,76 ± 0,93-ке дейін, p = 0,001), бұл плацебо тобындағыдан жоғары болды (2,03 ± 0,85, p = 0,004). PA53 тобында дефекация жиілігі топ ішінде жақсарды (p = 0,028), алайда топтар арасында елеулі айырмашылық анықталмады (p = 0,144).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гормондар (MTL, SS) және цитокиндер (IL-6, IL-10) деңгейіндегі байқалған өзгерістер негізінен топ ішілік сипатқа ие болды, бұл емнің тікелей әсерінен гөрі уақытша ауытқуларды көрсетуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Биохимиялық қауіпсіздік көрсеткіштері (альбумин, АЛТ, АСТ, креатинин, несеп қышқылы, мочевина, глюкоза) қалыпты шекте қалды. Микробиота талдауы 8-аптаға қарай PA53 тобында Pediococcus тұқымдасының көбейгенін көрсетті. Топтар арасындағы альфа және бета әртүрліліктегі айырмашылықтар статистикалық маңыздылық шегіне жетпеді.&lt;/p&gt;\n&lt;p&gt;Нәтижелер 8 апта бойы күнделікті P. acidilactici PA53 қабылдау функционалды іш қатуы бар ересектерде нәжіс консистенциясын жақсартуға көмектесетінін көрсетеді. Нейроэндокриндік ось арқылы моторикаға әсер ету механизмдері гипотеза деңгейінде қалғанымен, анықталған IL-6 төмендеуі және IL-10 көтерілуі әлеуетті иммуномодуляциялық әсерді көрсетеді. Зерттеу шектеулері таңдаманың салыстырмалы түрде аздығын және диетаны қатаң бақылаудың жоқтығын қамтиды, бұл кең ауқымды көп орталықты сынақтарды өткізуді талап етеді.&lt;/p&gt;\n&lt;p&gt;P. acidilactici PA53 қоспасы қауіпсіз, жақсы сіңеді және функционалды іш қатуы бар пациенттерде нәжіс пішінін айтарлықтай жақсартады, сонымен бірге дефекация жиілігіне әсері азырақ байқалады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f1.jpg\" alt=\"Клиникалық зерттеудің блок-схемасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Клиникалық зерттеудің блок-схемасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f2.jpg\" alt=\"Плацебо және PA53 топтарындағы 5-HT, MTL, SS және цитокиндердің (IL-4, IL-6, IL-10) деңгейлері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Плацебо және PA53 топтарындағы 5-HT, MTL, SS және цитокиндердің (IL-4, IL-6, IL-10) деңгейлері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Плацебо және PA53 топтарындағы 5-HT, MTL, SS және цитокиндердің (IL-4, IL-6, IL-10) деңгейлері. 5-HT: 5-гидрокситриптамин, MTL: мотилин, SS: соматостатин, IL-4: интерлейкин-4, IL-6: интерлейкин-6, IL-10: интерлейкин-10. Placebo_W0, Placebo_W4, Placebo_W8 плацебо тобындағы сәйкесінше 0, 4 және 8 аптадағы уақыт нүктелерін білдіреді. PA53_W0, PA53_W4, PA53_W8 PA53 тобындағы сәйкесінше 0, 4 және 8 аптадағы уақыт нүктелерін білдіреді. Барлық көрсетілген p-мәндері Бенджамини–Хохбергтің жалған ашу деңгейі (FDR) әдісін қолдану арқылы көптік салыстырулар үшін түзетілді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f3.jpg\" alt=\"Бастапқы деңгейдегі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Бастапқы деңгейдегі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Бастапқы деңгейдегі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы. (A–C) Альфа-әртүрлілік индекстері (ACE, Chao1 және Shannon). (D) Брей–Кертис диссимилярлығына негізделген негізгі координаттар талдауының (PCoA) графигі. (E) Тип деңгейіндегі ішек микробиотасының құрамы. (F) Топтар арасындағы дифференциалдық молшылықты көрсететін сызықтық дискриминанттық талдау (LDA) эффектінің өлшемі (LEfSe) талдауынан алынған LDA ұпайларының гистограммасы. p-мәндері көптік салыстырулар үшін Бенджамини–Хохбергтің жалған ашу деңгейі (FDR) түзетуі арқылы реттелді. LEfSe көмегімен анықталған дифференциалдық таксондар LDA ұпайы &amp;gt; 2,5 шекті мәні негізінде іріктелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f4.jpg\" alt=\"4 апталық араласудан кейінгі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4 апталық араласудан кейінгі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4 апталық араласудан кейінгі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы. (A–C) Альфа-әртүрлілік индекстері (ACE, Chao1 және Shannon). (D) Брей–Кертис диссимилярлығына негізделген негізгі координаттар талдауының (PCoA) графигі. (E) Тип деңгейіндегі ішек микробиотасының құрамы. (F) Топтар арасындағы дифференциалдық молшылықты көрсететін сызықтық дискриминанттық талдау (LDA) эффектінің өлшемі (LEfSe) талдауынан алынған LDA ұпайларының гистограммасы. p-мәндері көптік салыстырулар үшін Бенджамини–Хохбергтің жалған ашу деңгейі (FDR) түзетуі арқылы реттелді. LEfSe көмегімен анықталған дифференциалдық таксондар LDA ұпайы &amp;gt; 2,5 шекті мәні негізінде іріктелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f5.jpg\" alt=\"8 апталық араласудан кейінгі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8 апталық араласудан кейінгі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8 апталық араласудан кейінгі PA53 және плацебо топтарындағы ішек микробиотасының әртүрлілігі мен құрамы. (A–C) Альфа-әртүрлілік индекстері (ACE, Chao1 және Shannon). (D) Брей–Кертис диссимилярлығына негізделген негізгі координаттар талдауының (PCoA) графигі. (E) Тип деңгейіндегі ішек микробиотасының құрамы. (F) Топтар арасындағы дифференциалдық молшылықты көрсететін сызықтық дискриминанттық талдау (LDA) эффектінің өлшемі (LEfSe) талдауынан алынған LDA ұпайларының гистограммасы. Мәндер көптік салыстырулар үшін Бенджамини–Хохбергтің жалған ашу деңгейі (FDR) түзетуі арқылы реттелді. LEfSe көмегімен анықталған дифференциалдық таксондар LDA ұпайы &amp;gt; 2,5 шекті мәні негізінде іріктелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f6.jpg\" alt=\"Интервенцияның 0, 4 және 8-апталарындағы PA53 тобындағы ішек микробиотасының динамикасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Интервенцияның 0, 4 және 8-апталарындағы PA53 тобындағы ішек микробиотасының динамикасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Интервенцияның 0, 4 және 8-апталарындағы PA53 тобындағы ішек микробиотасының динамикасы. (A–C) Альфа-әртүрлілік индекстері (ACE, Chao1 және Shannon). (D) Брей-Кертис диссимиляциясы негізіндегі бета-әртүрліліктің негізгі координаттар талдауы (PCoA). (E) Тип деңгейіндегі салыстырмалы таксономиялық молшылық. (F) LEfSe талдауы арқылы анықталған дифференциалды таксондар. p-мәндері көптік салыстырулар үшін Бенджамини-Хохбергтің жалған ашылу деңгейі (FDR) түзетуін қолдану арқылы түзетілді. LEfSe арқылы анықталған дифференциалды таксондар LDA балының шекті мәні &amp;gt; 2,5 негізінде іріктелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f7.jpg\" alt=\"Интервенцияның 0, 4 және 8-апталарындағы плацебо тобындағы ішек микробиотасының динамикасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Интервенцияның 0, 4 және 8-апталарындағы плацебо тобындағы ішек микробиотасының динамикасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Интервенцияның 0, 4 және 8-апталарындағы плацебо тобындағы ішек микробиотасының динамикасы. (A–C) Альфа-әртүрлілік индекстері (ACE, Chao1 және Shannon). (D) Брей-Кертис диссимиляциясы негізіндегі бета-әртүрліліктің негізгі координаттар талдауы (PCoA). (E) Тип деңгейіндегі салыстырмалы таксономиялық молшылық.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Созылмалы іш&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қату және&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тығыз нәжіс&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;8 апталық қос&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;соқыр РБК&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сынағы&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;BSFS 2,76-ға&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жетті, нәжіс&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жұмсарды&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\"
