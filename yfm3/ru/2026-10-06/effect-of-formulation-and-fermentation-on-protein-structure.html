        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"244\" cy=\"174\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"496\" cy=\"172\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Конопля и овес: как&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ферментация меняет структуру&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;растительного белка&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f1.jpg\" alt=\"Анализ главных компонент общего содержания аминокислот.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Анализ главных компонент общего содержания аминокислот.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Анализ главных компонент общего содержания аминокислот. Биплоты компоненты 1 (PC1, 59,9%) и компоненты 2 (PC2, 20,0%), иллюстрирующие взаимосвязи между измеренными переменными. (A) Биплот с образцами, сгруппированными по методу обработки. (B) Биплот с образцами, сгруппированными по составу.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Исследователи изучили, как сочетание конопляного и овсяного жмыха влияет на свойства будущих продуктов. Выяснилось, что &lt;a href=\"concepts/fermentation.html\"&gt;ферментация&lt;/a&gt; молочнокислыми бактериями помогает частично восстановить растворимость белка, нарушенную при термической обработке. Оптимальным балансом для текстуры и питательности стало соотношение 75% конопли к 25% овса.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ферментация при pH 5,2 частично восстанавливает растворимость белка после пастеризации.&lt;/li&gt;\n&lt;li&gt;Соотношение 75:25 конопляного и овсяного жмыха — оптимальный баланс питательности.&lt;/li&gt;\n&lt;li&gt;Овсяный &lt;a href=\"concepts/oilseed-cake.html\"&gt;жмых&lt;/a&gt; служит источником углеводов, необходимых для метаболизма молочнокислых бактерий.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе исследования лежит использование побочных продуктов масложировой промышленности — жмыха. Конопляный жмых богат белком (20–40%), но беден углеводами, необходимыми для питания бактерий, поэтому в состав добавили овсяный жмых. Образцы пастеризовали при 80 °C в течение 10 минут, а затем ферментировали стартовой культурой &lt;a href=\"concepts/streptococcus-thermophilus-and-lactobacillus-delbrueckii.html\"&gt;Streptococcus thermophilus и Lactobacillus delbrueckii&lt;/a&gt; (100 DCU/кг) при 40 °C до достижения pH 5,2.&lt;/p&gt;\n&lt;p&gt;Анализ показал, что пастеризация вызывает агрегацию белков, что подтверждается данными SDS-PAGE (&lt;a href=\"concepts/sds-page.html\"&gt;электрофорез в полиакриламидном геле&lt;/a&gt;). Ферментация, напротив, способствует частичному восстановлению растворимости белка за счет изменения pH и структурных перестроек. Соотношение 75:25 (конопля:овес) показало лучшие результаты по функциональным свойствам, сохранив при этом высокое содержание белка и улучшив профиль аминокислот по сравнению с чистым конопляным жмыхом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на единственной партии каждого образца, что ограничивает статистическую достоверность результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Растущее распространение веганских, вегетарианских и флекситарианских диет обусловлено различными факторами, такими как этика обращения с животными, экологические проблемы, питание и риски для здоровья. Хотя многие люди по-прежнему ценят мясо за его сенсорные свойства или культурное значение в местной кухне, растительное сырье все чаще используется для производства аналогов мяса. Кроме того, в индустрии растительных продуктов наблюдается тенденция сочетать новые методы структурирования, такие как 3D-печать и мокрое формование, с известными биохимическими методами обработки, например ферментацией, для создания питательных и устойчивых вариантов, привлекательных для потребителей. Жмыхи, &lt;a href=\"concepts/side-streams.html\"&gt;побочные продукты&lt;/a&gt; маслоэкстракционной промышленности, становятся ценным сырьем для производства продуктов питания благодаря высокому содержанию белка и биологически активных соединений. Конопляный жмых (HPC), получаемый при холодном отжиме семян конопли для получения масла, представляет особый интерес среди жмыхов масличных культур из-за относительно высокого содержания белка (20–40%), высокого уровня незаменимых аминокислот и аргинина, а также расширяющейся индустрии конопляного масла в Литве, которая генерирует значительные объемы этого побочного продукта с ограниченным использованием в пищевых целях. Несмотря на потенциал, жмыхи часто недоиспользуются, многие из них выбрасываются или ограничиваются низкоценными применениями, такими как корм для животных. Небелковая фракция жмыхов, включающая пищевые волокна, минералы и биологически активные соединения, остается в значительной степени неиспользованной в промышленных процессах, направленных на производство белковых концентратов и изолятов. Дополнительные этапы обработки, такие как осаждение, фильтрация и концентрирование, также потребляют значительные энергетические и водные ресурсы, вызывая опасения по поводу устойчивости. Более того, растворимость растительного белка остается сложным ограничением для большинства традиционных методов экстракции. Переход к минимальной обработке и прямому включению жмыхов в рецептуры продуктов питания может сократить отходы и энергопотребление, повышая общую устойчивость растительных продовольственных систем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конопляный жмых содержит 20–40% белка и богат аргинином, однако его потенциал в пищевой промышленности ограничен из-за неполного использования небелковых компонентов и высоких затрат на экстракцию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Использование жмыхов в качестве источников белка не лишено проблем. Растительные белки обычно считаются менее качественными, чем животные, из-за ограничений в профилях незаменимых аминокислот и сниженной усвояемости. Кроме того, растительные матрицы содержат антипитательные факторы, такие как фитиновая кислота, танины, сапонины и лектины, которые препятствуют усвоению питательных веществ и перевариванию белка, ингибируя пищеварительные ферменты. Ферментация является перспективной стратегией для улучшения питательных и функциональных свойств жмыхов. Ферментация может повысить усвояемость белка за счет частичной денатурации запасных белков, увеличения растворимости белка и улучшения доступности аминокислот. Кроме того, было показано, что ферментация значительно снижает содержание антипитательных факторов, таких как фитиновая кислота, в зерновых и псевдозерновых культурах, и может оказывать аналогичное воздействие на жмыхи. Помимо улучшения питательной ценности, ферментация может также улучшить технофункциональные свойства жмыхов, такие как &lt;a href=\"concepts/water-holding-capacity.html\"&gt;влагоудерживающая способность&lt;/a&gt; (ВУС), эмульгирующие и гелеобразующие свойства, которые критически важны для их применения в рецептурах пищевых продуктов. Хотя потенциал ферментации некоторых отдельных видов жмыхов был изучен, влияние ферментации на комбинированные матрицы жмыхов остается в значительной степени неисследованным.&lt;/p&gt;\n&lt;p&gt;Конопляный жмых был выбран в качестве основной матрицы в данном исследовании из-за высокого содержания белка и клетчатки. Однако низкое содержание углеводов (~3,7 г/100 г) ограничивает доступность ферментируемого субстрата для молочнокислых бактерий, которые используют водорастворимые углеводы в качестве основного источника углерода. Овсяный жмых был включен в качестве функционального модификатора для решения этого ограничения: остаточное содержание крахмала может служить дополнительным источником ферментируемых углеводов, одновременно способствуя модуляции расширения и текстуры на дальнейших этапах обработки (например, &lt;a href=\"concepts/extrusion.html\"&gt;экструзия&lt;/a&gt; при высокой влажности). Сочетание этих двух видов жмыха было направлено на использование их композиционной взаимодополняемости, поскольку смешивание растительных ингредиентов с различными питательными и функциональными профилями было предложено в качестве стратегии для взаимной компенсации индивидуальных ограничений. Ферментация этой комбинированной матрицы может дополнительно изменить ее питательную ценность и технофункциональные свойства, поддерживая ее потенциальное применение в разработке растительных продуктов питания. Данное исследование направлено на изучение влияния молочнокислой ферментации на структуру белка, питательные характеристики и технофункциональные параметры комбинированных матриц жмыхов. В частности, в исследовании оцениваются изменения в профилях окисления, деградации и связей белка, профилях аминокислот и биогенных аминов, а также содержание фитиновой кислоты. Кроме того, исследуются ВУС, маслоудерживающая способность (МУС) и размер частиц с целью разработки устойчивых и питательных растительных рецептур. Мы предполагаем, что молочнокислая ферментация комбинированных матриц конопляного и овсяного жмыха будет модулировать их структуру белка, питательные характеристики и технофункциональные свойства в зависимости от рецептуры, с ожидаемым снижением содержания антипитательных факторов и окисления белка, а также улучшением растворимости белка, ВУС и МУС по сравнению с необработанными материалами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является предварительным: использовалась только одна репрезентативная партия для каждой комбинации рецептуры и обработки из-за ограничений ресурсов, что требует подтверждения в будущих работах с независимыми повторностями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Органические гранулы конопляного жмыха (HPC) были получены от Allive Europe UAB, Вошконяй, Литва. Материал был получен из семян конопли холодного отжима (максимальная температура на выходе 40 °C) и впоследствии спрессован в гранулы. Химическая обработка не применялась. В лаборатории KTU Food Institute гранулы измельчались в два этапа для обеспечения однородности размера частиц. Грубое измельчение проводилось с помощью ручной мясорубки, а более мелкое — с помощью универсальной мельницы для сухих продуктов (MLVS-M100, Мажейкяй, Литва). Измельченный материал просеивали через сито из нержавеющей стали с размером ячеек 500 мкм (Glenammer, Шотландия, Великобритания) и разделяли на две фракции: с размером частиц &amp;gt;500 мкм и &amp;lt;500 мкм; для всех дальнейших экспериментов использовали фракцию с меньшим размером частиц. Овсяный жмых (OPC) производился на месте из коммерческого овса (Pranciškaus malūnas, Каунас, Литва). Овсяные хлопья смешивали с дистиллированной водой в течение 20 с и отжимали через марлю. Овсяный жмых сушили в печи при 45 °C в течение 12 ч, механически измельчали в кофемолке и просеивали (размер ячеек 500 мкм).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Размер частиц &amp;lt;500 мкм был выбран для обеспечения стандартизации сырья, что критически важно для воспроизводимости процессов ферментации и последующих анализов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для экспериментов по ферментации были подготовлены две рецептуры комбинированных матриц растительного жмыха, состоящие из HPC и OPC, с соотношением смешивания HPC:OPC 75:25 (H75:O25) и 50:50 (H50:O50). Эти соотношения были выбраны для представления градиента включения OPC: соотношение 75:25 сохраняет HPC как доминирующую фракцию, сохраняя его белковый вклад при введении умеренного количества OPC для модуляции доступности субстрата для ферментации и функциональных свойств, тогда как соотношение 50:50 представляет верхний уровень включения до того, как содержание белка будет скомпрометировано более низким содержанием белка в OPC. Третья рецептура чистого HPC (H100) также была включена в качестве базового контроля.&lt;/p&gt;\n&lt;p&gt;Для сырых образцов (RAW) 500 г каждой рецептуры жмыха (H100, H75:O25 и H50:O50) оставляли без обработки, переносили в пластиковые пакеты, вакуумировали и хранили при 4 °C до анализа. Для пастеризованных образцов (PAS) 500 г каждой рецептуры жмыха смешивали с 1450 мл дистиллированной воды в стеклянной банке объемом 2 л. Смеси пастеризовали следующим образом: нагрев до 80 °C проводили на водяной бане на индукционной плите. Температуру поддерживали в течение 10 мин, контролируя термометром. Смесь перемешивали каждую минуту стерильным металлическим столовым ножом. Через 10 мин смесь немедленно охлаждали до 40 °C, погружая закрытую банку в ледяную баню. Полученные смеси распределяли на жестяном противне и сушили в печи при 60 °C в течение 24 ч. Высушенные образцы переносили в пластиковые пакеты, вакуумировали и хранили при 4 °C до анализа. Пастеризация была включена в качестве промежуточного контроля процесса, так как предварительные эксперименты показали, что &lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;молочнокислые бактерии&lt;/a&gt; не способны ферментировать непастеризованные образцы жмыха. Эта группа позволила дифференцировать термические эффекты только пастеризации и биохимические эффекты, обусловленные молочнокислой ферментацией. Для ферментированных образцов (FER) 500 г каждой рецептуры жмыха смешивали с 1450 мл дистиллированной воды в стеклянной банке объемом 2 л. Смеси сначала пастеризовали, как указано выше — нагревали до 80 °C на водяной бане на индукционной плите. Температуру поддерживали в течение 10 мин, контролируя термометром. Смесь перемешивали каждую минуту стерильным металлическим столовым ножом. Через 10 мин смесь немедленно охлаждали до 40 °C, погружая закрытую банку в ледяную баню. Затем в смеси добавляли 0,375 г лиофилизированной коммерческой стартовой культуры Y883 LYO 50 DCU (штаммы Streptococcus thermophilus и Lactobacillus delbrueckii subsp. bulgaricus) (Danisco, Копенгаген, Дания), что приводило к норме инокуляции 25 DCU/л или 100 DCU/кг. Ферментацию проводили в течение 4–5 ч в инкубаторе (BINDER, Тутлинген, Германия) при 40 °C. Каждые 30 мин измеряли pH с помощью pH-метра SevenCompact S220 (Mettler Toledo, Колумбус, Огайо, США). Ферментацию останавливали, когда pH достигал примерно 5,2, помещая образец при 4 °C. Начальный и конечный pH, а также время ферментации для каждой рецептуры указаны ниже: H100 — начальный pH 6,50, конечный pH 5,22, время ферментации 5 ч; H75:O25 — начальный pH 6,42, конечный pH 5,20, время ферментации 4 ч; H50:O50 — начальный pH 6,35, конечный pH 5,22, время ферментации 4 ч. Титруемая кислотность и количество жизнеспособных молочнокислых бактерий в данном исследовании не измерялись, что является ограничением оценки микробной активности. Полученные смеси распределяли на жестяном противне и сушили в печи при 60 °C в течение 24 ч. Сухие образцы переносили в пластиковые пакеты, вакуумировали и хранили при 4 °C до анализа. Были произведены две партии каждой комбинации рецептуры и обработки, но из-за ограничений по времени и ресурсам для дальнейших анализов использовалась только одна репрезентативная партия. Это признается ограничением настоящего исследования.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f1.jpg\" alt=\"Анализ главных компонент общего содержания аминокислот.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Анализ главных компонент общего содержания аминокислот.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Анализ главных компонент общего содержания аминокислот. Биплоты компоненты 1 (PC1, 59,9%) и компоненты 2 (PC2, 20,0%), иллюстрирующие взаимосвязи между измеренными переменными. (A) Биплот с образцами, сгруппированными по методу обработки. (B) Биплот с образцами, сгруппированными по составу.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f2.jpg\" alt=\"Анализ главных компонент содержания свободных аминокислот.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Анализ главных компонент содержания свободных аминокислот.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Анализ главных компонент содержания свободных аминокислот. Биплоты компоненты 1 (PC1, 63,4%) и компоненты 2 (PC2, 18,7%), иллюстрирующие взаимосвязи между измеренными переменными. (A) Биплот с образцами, сгруппированными по методу обработки. (B) Биплот с образцами, сгруппированными по составу.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f3.jpg\" alt=\"Анализ главных компонент (PCA) содержания четырех индивидуальных биогенных аминов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Анализ главных компонент (PCA) содержания четырех индивидуальных биогенных аминов.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Анализ главных компонент (PCA) содержания четырех индивидуальных биогенных аминов. Биплоты компоненты 1 (PC1, 52,7%) и компоненты 2 (PC2, 36,3%), иллюстрирующие взаимосвязи между измеренными переменными. (A) Биплот с образцами, сгруппированными по методу обработки. (B) Биплот с образцами, сгруппированными по составу. (C) Индивидуальный график.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f4.jpg\" alt=\"Окисление белка в комбинированных матрицах на растительной основе, рассчитанное по содержанию карбонильных групп методом\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Окисление белка в комбинированных матрицах на растительной основе, рассчитанное по содержанию карбонильных групп методом DNPH (H100: жмых конопли, H75:O25: состав 75% жмыха конопли и 25% жмыха овса, H50:O50: состав 50% жмыха конопли и 50% жмыха овса, P…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Окисление белка в комбинированных матрицах на растительной основе, рассчитанное по содержанию карбонильных групп методом DNPH (H100: жмых конопли, H75:O25: состав 75% жмыха конопли и 25% жмыха овса, H50:O50: состав 50% жмыха конопли и 50% жмыха овса, P: пастеризованный, F: ферментированный). Погрешности представляют собой стандартное отклонение (SD). Горизонтальные линии с символом (*) указывают на заметные наблюдаемые попарные различия между образцами одинаковых составов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f5.jpg\" alt=\"Растворимость белка в комбинированных составах жмыха конопли и овса (H100, H75:O25, H50:O50), вызванная различными экстр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Растворимость белка в комбинированных составах жмыха конопли и овса (H100, H75:O25, H50:O50), вызванная различными экстрагирующими растворами, разрушающими специфические химические связи (H100: жмых конопли, H75:O25: состав 75% жмыха конопли и 25% жмыха овса…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Растворимость белка в комбинированных составах жмыха конопли и овса (H100, H75:O25, H50:O50), вызванная различными экстрагирующими растворами, разрушающими специфические химические связи (H100: жмых конопли, H75:O25: состав 75% жмыха конопли и 25% жмыха овса, H50:O50: состав 50% жмыха конопли и 50% жмыха овса, P: пастеризованный, F: ферментированный). (A) Белок в нативном состоянии; (B) Водородные связи; (C) Дисульфидные связи; (D) Гидрофобные взаимодействия; (E) Водородные связи x дисульфидные связи; (F) Водородные связи x гидрофобные взаимодействия; (G) Дисульфидные связи x гидрофобные взаимодействия; (H) Водородные связи x дисульфидные связи x гидрофобные взаимодействия. Звездочки указывают на заметные попарные различия, основанные на оцененных маргинальных средних с поправкой Тьюки, приведены только для описательных целей (p ≤ 0,05 (&lt;em&gt;), ≤0,01 (&lt;strong&gt;), ≤0,001 (&lt;/strong&gt;&lt;/em&gt;), ≤0,0001 (****)).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f6.jpg\" alt=\"SDS-PAGE гель комбинированных смесей жмыха конопли и овса (H100: жмых конопли, H75:O25: смесь 75% жмыха конопли и 25% жм\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SDS-PAGE гель комбинированных смесей жмыха конопли и овса (H100: жмых конопли, H75:O25: смесь 75% жмыха конопли и 25% жмыха овса, H50:O50: смесь 50% жмыха конопли и 50% жмыха овса, P: пастеризованный, F: ферментированный, EXT: сухое экструдирование) в восстанавливающих (A) и невосстанавливающих (B) условиях.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f7.jpg\" alt=\"Содержание фитиновой кислоты в растительных комбинированных матрицах, рассчитанное по содержанию фосфора.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Содержание фитиновой кислоты в растительных комбинированных матрицах, рассчитанное по содержанию фосфора.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Содержание фитиновой кислоты в растительных комбинированных матрицах, рассчитанное по содержанию фосфора. (H100: жмых конопли, H75:O25: смесь 75% жмыха конопли и 25% жмыха овса, H50:O50: смесь 50% жмыха конопли и 50% жмыха овса, P: пастеризованный, F: ферментированный). Погрешности соответствуют стандартному отклонению (SD). Горизонтальные линии со знаком (*) над ними указывают на значимые наблюдаемые попарные различия между образцами одной и той же рецептуры.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;низкая функцио&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нальность&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жмыха&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ферментация&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;конопляно-&lt;/text&gt;&lt;text x=\"226
