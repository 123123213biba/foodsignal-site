        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"124\" cy=\"89\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"616\" cy=\"232\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · CRYSTALS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кристаллы каннабидиола в&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;БАДах: европейский регулятор&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;не признал безопасность&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;изолята&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n-f1.jpg\" alt=\"Химическая структура КБД.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Химическая структура КБД.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Европейское агентство по безопасности пищевых продуктов (EFSA) не смогло подтвердить безопасность изолята каннабидиола (&lt;a href=\"concepts/cannabidiol.html\"&gt;CBD&lt;/a&gt;) чистотой от 98% для БАДов. Заявитель предлагал суточную дозу до 60 мг, однако не предоставил данные о генотоксичности и наличии наночастиц при растворении в масляных носителях. В партиях обнаружили до 1320 мг/кг пентана и до 938 мг/кг гептана после кристаллизации. Без ответов на запросы регулятора рынок добавок с CBD в ЕС остается в подвешенном состоянии.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Заявка на 60 мг CBD в сутки отклонена EFSA из-за нехватки токсикологических данных&lt;/li&gt;\n&lt;li&gt;В кристаллическом изоляте обнаружено до 1320 мг/кг пентана и до 938 мг/кг гептана&lt;/li&gt;\n&lt;li&gt;Поведение нерастворенных микрокристаллов CBD в маслах-носителях не изучено&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Технологический цикл получения изолята CBD (C21H30O2, молярная масса 314,46 г/моль) включает экстракцию сухой биомассы Cannabis sativa L. этанолом, &lt;a href=\"concepts/winterization.html\"&gt;вымораживание липидных фракций&lt;/a&gt; (винтеризацию) и фильтрацию. Сырая смола проходит декарбоксилирование и перегонку, после чего фазовый переход и образование твердого кристаллического осадка вызывают с помощью неполярных растворителей — смеси пентана, гексана и гептана. В полученных кристаллах содержание CBD составляло от 95,70% до 99,86% по массе, примеси дельта-9-тетрагидроканнабинола (Δ9-THC) не превышали 0,03%, а каннабидиварина (CBDV) — 0,38%.&lt;/p&gt;\n&lt;p&gt;Главные сомнения экспертов вызвали &lt;a href=\"concepts/residual-organic-solvents.html\"&gt;остаточные органические растворители&lt;/a&gt; и поведение кристаллической фазы в готовых рецептурах. В изученных партиях хроматографический анализ зафиксировал до 1320 мг/кг пентана, до 938 мг/кг гептана и следы гексана (1 мг/кг). Заявитель планировал растворять кристаллы в липидных носителях (триглицеридах) в концентрациях от 3% до 50% масс., однако не оценил предел насыщения раствора и риск образования устойчивых субмикронных кристаллов или наночастиц. С реологической точки зрения неполное растворение высококонцентрированного липофильного кристаллического вещества в масле может приводить к спонтанной вторичной нуклеации и неконтролируемой биодоступности при приеме.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка EFSA не доказывает прямой вред CBD, а лишь констатирует неполноту представленных производителем досье и тестов на токсичность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Европейское агентство по безопасности продуктов питания (EFSA) рассмотрело заявку на одобрение каннабидиола (КБД), выделенного из Cannabis sativa L., в качестве нового пищевого продукта (novel food). Заявитель планировал использовать КБД в составе биологически активных добавок (БАД) для взрослых, за исключением беременных и кормящих женщин, с максимальной дозировкой 60 мг/сут. Ранее EFSA уже указывало на нехватку данных о безопасности этого вещества, включая отсутствие долгосрочных исследований на людях и животных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;EFSA пришло к выводу, что безопасность КБД как нового пищевого продукта не может быть установлена из-за неполноты данных, предоставленных заявителем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оценка проводилась на основе материалов, предоставленных компанией-заявителем. EFSA дважды запрашивало дополнительную информацию (в 2022 и 2023 годах), однако ответы на эти запросы не были получены. Методология соответствовала руководствам EFSA по оценке новых пищевых продуктов, включая проверку производственных процессов, состава и токсикологических характеристик.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Новый пищевой продукт» (novel food) — это категория продуктов, которые не употреблялись в пищу в ЕС в значительной степени до 1997 года и требуют строгой проверки безопасности перед выходом на рынок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Заявленный продукт представляет собой КБД чистотой ≥ 98% (масс./масс.). В составе присутствуют другие каннабиноиды, такие как каннабидиварин (КБДВ, ≤ 0,7%) и дельта-9-тетрагидроканнабинол (Δ9-ТГК, ≤ 0,03%). Эксперты отметили, что заявитель не предоставил сертификаты анализа для стандартов, использованных при валидации методов контроля. Также отсутствуют данные о наличии в продукте наночастиц, что критически важно для оценки безопасности.&lt;/p&gt;\n&lt;p&gt;Производство заявлено как соответствующее принципам GMP и ISO 22000:2018. Сырье (листья конопли) экстрагируется этанолом, проходит очистку, декарбоксилирование и кристаллизацию с использованием пентана, гексана и гептана. Эксперты сочли описание процесса недостаточным, так как заявитель не ответил на вопросы о контроле окислительных процессов и составе конечных формул БАД. Исследования стабильности также признаны неубедительными из-за отсутствия данных по конкретным коммерческим формам продукта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Из-за отсутствия ответов на запросы EFSA о методах анализа и составе, эксперты не смогли подтвердить стабильность и чистоту продукта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Единственное предоставленное исследование — тест на бактериальную мутагенность (OECD TG 471) — не является достаточным для оценки безопасности. Заявитель не предоставил данные о репродуктивной токсичности и исследования на людях. Кроме того, не был оценен риск аллергенности, связанный с потенциальным наличием растительных белков (например, Can s 3), которые могут вызывать перекрестную аллергию.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n-f1.jpg\" alt=\"Химическая структура КБД.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Химическая структура КБД.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Безопасность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CBD в пищевых&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;добавках&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ досье и&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;химического&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;состава&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Дефицит данных&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;по&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;токсикологии&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рынку нужны&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;строгие тесты&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;растворов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале EFSA journal. European Food Safety Authority. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;EFSA journal. European Food Safety Authority (Europe PMC)&lt;/td&gt;\n&lt;td&gt;crystals&lt;/td&gt;\n&lt;td&gt;CC BY-ND 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: EFSA Panel on Nutrition, Novel Foods and Food Allergens (NDA), Turck D, Bohn T, Cámara M, Castenmiller J, De Henauw S, Jos Á, Maciuk A, Mangelsdorf I, McNulty B, Naska A, Pentieva K, Siani A, Thies F, Cubadda F, McArdle HJ, Trezza V, Albert O, Beneventi E, Laganaro M, Nuin Garciarena I, Rossi A, Berrío Cruz S, Seminati F, Magani M, Hirsch-Ernst KI.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt
