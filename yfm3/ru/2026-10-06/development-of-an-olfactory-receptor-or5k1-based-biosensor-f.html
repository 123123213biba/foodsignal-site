        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"106\" cy=\"80\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"514\" cy=\"252\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · MAILLARD   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как поймать аромат жареного:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;новый биосенсор для&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;определения пиразинов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-f1.jpg\" alt=\"Схематическое изображение обонятельного биосенсора на основе NVs-AuNPs-PB/ZIF-8@SWCNT/Ti3C2 MXene для обнаружения пирази\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Схематическое изображение обонятельного биосенсора на основе NVs-AuNPs-PB/ZIF-8@SWCNT/Ti3C2 MXene для обнаружения пиразиновых соединений. (A) Иллюстрация синтеза ZIF-8@SWCNT. (B, C) Схематическое изображение процесса изготовления обонятельного биосенсора.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/pyrazines.html\"&gt;Пиразины&lt;/a&gt; отвечают за аппетитные ноты жареного, орехового и хлебного ароматов. Традиционный газовый хроматограф дорог и сложен, поэтому исследователи разработали &lt;a href=\"concepts/biosensor.html\"&gt;биосенсор&lt;/a&gt; с использованием обонятельного рецептора OR5K1. Устройство способно улавливать даже следовые количества этих веществ, имитируя работу человеческого носа.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Биосенсор определяет пиразины с чувствительностью до 10^-14 М.&lt;/li&gt;\n&lt;li&gt;Матрица из MXene и наночастиц золота обеспечивает стабильность сигнала.&lt;/li&gt;\n&lt;li&gt;Точность прибора подтверждена на образцах пивоваренного солода.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе сенсора лежит &lt;a href=\"concepts/olfactory-receptor-or5k1.html\"&gt;обонятельный рецептор OR5K1&lt;/a&gt;, который специфически реагирует на пиразины. Для усиления сигнала ученые создали матрицу из наночастиц золота (AuNPs), металлоорганических каркасов (ZIF-8), одностенных углеродных нанотрубок (SWCNT) и MXene (Ti3C2). Эта комбинация обеспечивает высокую проводимость и стабильность рецептора. При связывании пиразина с рецептором происходит изменение тока, которое фиксируется прибором.&lt;/p&gt;\n&lt;p&gt;Испытания на четырех видах солода показали, что сенсор работает в диапазоне концентраций от 10^-14 до 10^-9 М с пределом обнаружения 10^-14 М. Корреляция с данными газовой хроматографии составила 0,96. Молекулярное моделирование подтвердило, что взаимодействие между OR5K1 и пиразинами происходит за счет водородных связей и гидрофобных взаимодействий с ключевыми аминокислотами, такими как Leu14 и Phe85, с энергией связывания до -6,0 ккал/моль.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в лабораторных условиях с использованием очищенных мембранных фракций, что требует дальнейшей адаптации для полевых тестов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Пиразины (1,4-диазабензол) — класс азотсодержащих гетероциклических соединений с пиразиновым ядром. Они широко распространены в натуральных продуктах: кофе, солоде, мясе и китайском байцзю. Благодаря крайне низким порогам восприятия запаха пиразины являются ключевыми ароматическими соединениями, а их концентрация часто используется как индикатор сенсорного качества пищевых продуктов. Они преимущественно образуются в ходе реакции Майяра и придают продуктам приятные ноты выпечки, жареного и орехов. Помимо ароматических свойств, пиразины являются семиохимическими веществами, синтезируемыми живыми организмами и обладающими определенной устойчивостью в окружающей среде. Многие пиразины опосредуют химическую передачу сигналов между особями разных видов, например, вызывая реакции избегания или страха.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пиразины — ключевые ароматические соединения с низким порогом восприятия, образующиеся при реакции Майяра и играющие роль сигнальных молекул в природе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Обоняние начинается со специфического связывания молекул одоранта с обонятельными рецепторами (OR), что запускает сигнальный каскад, интерпретируемый мозгом как запах. Обонятельный рецептор OR5K1 был охарактеризован как специализированный для обнаружения пиразинов. Исследование 1100 активаторов для 273 функциональных рецепторов человека выявило 2,5-диметилпиразин как специфический агонист OR5K1. Среди 616 аллелей рецепторов человека только OR5K1 и его близкие гомологи сильно реагировали на 2,3,5-триметилпиразин, демонстрируя высокую селективность. OR5K1, расположенный на хромосоме 3 (3q11.2), является одним из наиболее распространенных обонятельных рецепторов у человека (около 6%). Он относится к семейству родопсиноподобных рецепторов класса А (GPCR) и обладает характерной семиспиральной трансмембранной архитектурой. В отличие от несенсорных GPCR класса А, OR5K1 имеет низкую гомологию последовательностей и остается «сиротским» рецептором с ограниченным числом известных мишеней. Связывание лиганда вызывает конформационные изменения, активирующие G-белки, что ведет к повышению уровня cAMP, открытию каналов и генерации потенциалов действия, передаваемых в обонятельную луковицу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GPCR (G-белок-сопряженные рецепторы) — это белки-сенсоры на поверхности клеток, которые передают внешние сигналы (например, молекулы запаха) внутрь клетки через каскад химических реакций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Высокочувствительное и селективное обнаружение пиразинов имеет практическую ценность. Традиционные методы (&lt;a href=\"concepts/gas-chromatography-mass-spectrometry.html\"&gt;ГХ-МС&lt;/a&gt;, ГХ-ТОФ/МС) точны, но требуют дорогостоящего оборудования, сложны в эксплуатации и не являются портативными. Коммерческие «электронные носы» портативны, но их сенсоры на основе проводящих наноматериалов часто не обладают достаточной специфичностью из-за неспецифических взаимодействий. В последние годы для улучшения характеристик электрохимических биосенсоров исследуются наноматериалы. Металлорганические каркасы (MOF), такие как ZIF-8, обладают исключительной термической стабильностью, сверхвысокой пористостью и большой удельной площадью поверхности, что делает их идеальными носителями для иммобилизации ферментов и усиления сигнала. Wang et al. синтезировали наночастицы серебра (AgNPs) на ZIF-67. Наночастицы золота (AuNPs) облегчают перенос электронов и обеспечивают биосовместимые интерфейсы для иммобилизации рецепторов через ковалентные связи Au–S. Одностенные углеродные нанотрубки (SWCNTs) обладают высокой проводимостью, улучшая эффективность транспорта электронов. Ti3C2 MXene (двумерный карбид переходного металла) был выбран благодаря металлической проводимости, гидрофильности и наличию функциональных групп (–O, –OH, –F), которые усиливают электрохимические сигналы и создают благоприятную среду для иммобилизации биомолекул. В данном композите ZIF-8 обеспечивает большую площадь поверхности, SWCNTs служат проводящими путями, MXene повышает проводимость электрода, а AuNPs улучшают перенос электронов. Синергия этих материалов позволяет создавать высокоэффективные обонятельные биосенсоры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оговорка: большинство описанных методов наноматериалов являются лабораторными протоколами; их эффективность в реальных условиях требует дальнейшей валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пиразин, 2,3,5-триметилпиразин (TMP), 2,3,5,6-тетраметилпиразин (TTMP), 2,6-диметилпиразин (2,6-DMeP), 2,3-диметилпиразин (2,3-DMeP) и 2,5-диметилпиразин (2,5-DMeP) были приобретены у Adamas Reagent Co., Ltd. (Шанхай, Китай). Метанол, поливинилпирролидон (PVPP), лимонная кислота, безводный сульфат натрия, хлорид натрия, гидрофосфат динатрия, нитрат цинка, 2-метилимидазол и DL-дитиотреитол (DTT) — у Shanghai Aladdin Biochemical Technology Co., Ltd. (Шанхай, Китай). Одностенные углеродные нанотрубки (SWCNTs), &lt;a href=\"concepts/chitosan.html\"&gt;хитозан&lt;/a&gt;, феррицианид калия, ферроцианид калия, хлорид калия, тетрахлорозолотая кислота, BSA, глицерин и дигидрофосфат калия — у Shanghai McLean Biochemical Technology Co., Ltd. (Шанхай, Китай). Буфер HEPES, дрожжевой экстракт, пептон, NP-40, набор для определения белка BCA, фенилметилсульфонилфторид (PMSF) — у Sangon Biotech (Шанхай, Китай). 2-октанол (99,5%, хроматографической чистоты) и нормальные парафины (C7–C22) — у Sigma-Aldrich (Сент-Луис, США и Шанхай, Китай). Ti3C2Tx MXene — у Nanjing Xianfeng Nanotechnology Co., Ltd. (Нанкин, Китай). Стерильные фильтры Millex-GP (0,22 мкм) — у Merck (Дармштадт, Германия).&lt;/p&gt;\n&lt;p&gt;Использовались четыре вида солода: мюнхенский (MM, влажность 3,4%, цветность 16 EBC, экстрактивность 81,5), пильзенский (PM, влажность 4,4%, цветность 3,7 EBC, экстрактивность 82,5), кристаллический (CrM, влажность 3,4%, цветность 328 EBC, экстрактивность 75,9) и карамельный (CaM, влажность 2,7%, цветность 800 EBC, экстрактивность 70,6).&lt;/p&gt;\n&lt;p&gt;Штамм дрожжей DJO1 (BY4741 trp1Δ::natMX) трансформировали методом лития ацетата. Дрожжевые колонии выращивали в среде YPD при 30 °C в течение 48–72 ч для индукции экспрессии OR5K1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гетерологичная экспрессия — метод, при котором ген одного организма (в данном случае человека) вставляется в другой организм (дрожжи) для производства соответствующего белка в лабораторных условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нановезикулы готовили согласно предыдущим экспериментам. Культуру дрожжей (OD600: 0,6–0,8) центрифугировали при 5000 об/мин 2 мин для сбора клеток. Клетки дважды промывали 5 мл ледяной воды (0 °C) при 5000 об/мин в течение 2 мин. Затем клетки промывали 500 мкл холодного лизирующего буфера (pH 6,8, 40 мМ HEPES, 0,2% (&lt;a href=\"concepts/w-w.html\"&gt;w/w&lt;/a&gt;) NP-40, 10 мМ DTT, 1 мМ PMSF), собирали центрифугированием, ресуспендировали в 1,5 мл лизирующего буфера и переносили в пробирки объемом 1,5 мл. Нановезикулы получали методом разрушения стеклянными шариками (0,5 мм). Суспензию обрабатывали в быстром измельчителе при 65 Гц в течение 1 мин, затем оставляли на льду на 1 мин. Цикл повторяли 8–10 раз. Смесь центрифугировали при 6000 об/мин и 4 °C в течение 24 мин для удаления неразрушенных клеток. Супернатант центрифугировали при 4 °C в течение 60 мин при 100 000 g. Осадок нановезикул ресуспендировали в лизирующем буфере с 10% (w/w) глицерина и хранили при −80 °C. Концентрацию белка определяли набором BCA с использованием бычьего сывороточного альбумина (BSA) в качестве стандарта. Перед использованием суспензию разбавляли в 10 мМ PBS (pH 7,2–7,4), обрабатывали ультразвуком в ледяной воде 10 мин и фильтровали через стерильный фильтр (0,22 мкм).&lt;/p&gt;\n&lt;p&gt;Экспрессию OR5K1 подтверждали вестерн-блоттингом. Образцы NVs и дрожжевых клеток (10 мкг/мл белка) подвергали электрофорезу в полиакриламидном геле. Белки переносили на PVDF-мембрану. Мембраны блокировали в TBST с 1% обезжиренного молока 20 мин, инкубировали с первичными антителами к c-Myc (Abbkine, разведение 1:1000) 1 ч при 25 °C, затем со вторичными антителами (HRP-конъюгированные, Abbkine, разведение 1:5000) 1 ч при 25 °C. Мембраны промывали трижды в TBST по 10 мин и проявляли с помощью хемилюминесцентного реагента.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-f1.jpg\" alt=\"Схематическое изображение обонятельного биосенсора на основе NVs-AuNPs-PB/ZIF-8@SWCNT/Ti3C2 MXene для обнаружения пирази\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Схематическое изображение обонятельного биосенсора на основе NVs-AuNPs-PB/ZIF-8@SWCNT/Ti3C2 MXene для обнаружения пиразиновых соединений. (A) Иллюстрация синтеза ZIF-8@SWCNT. (B, C) Схематическое изображение процесса изготовления обонятельного биосенсора.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-f2.jpg\" alt=\"Характеристика OR5K1, полученного в дрожжах DJO1, и наноматериалов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Характеристика OR5K1, полученного в дрожжах DJO1, и наноматериалов.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Характеристика OR5K1, полученного в дрожжах DJO1, и наноматериалов. (A) Аминокислотная последовательность &lt;a href=\"concepts/mobile-genetic-elements.html\"&gt;плазмиды&lt;/a&gt; ClhN-4Myc-Ura, кодирующей OR5K1. (B) Вестерн-блоттинг анализ OR5K1 в дрожжевых клетках и полученных из них NVs. (C) СЭМ-изображения SWCNT. (D) СЭМ-изображения ZIF-8@SWCNT. (E) ТЭМ-изображения и ЭДС-картирование ZIF-8@SWCNT. (F) ТЭМ-изображения и ЭДС-картирование Ti3C2 MXene.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-f3.jpg\" alt=\"Характеристика электрохимического поведения обонятельного биосенсора и оптимизация экспериментальных условий.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Характеристика электрохимического поведения обонятельного биосенсора и оптимизация экспериментальных условий.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Характеристика электрохимического поведения обонятельного биосенсора и оптимизация экспериментальных условий. (A) ЦВА. (B) Кривые ДПВ различных модифицированных электродов в растворе 5,0 мМ (Fe(CN)6)3−/4−, содержащем 0,1 М KCl: (a) GCE, (b) Ti3C2 MXene, (c) ZIF-8@SWCNT/GCE, (d) ZIF-8@SWCNT/Ti3C2 MXene/GCE, (e) AuNP–PB/ZIF-8@SWCNT/Ti3C2 MXene/GCE, (f) OR5K1–NV–AuNP–PB/ZIF-8@SWCNT/Ti3C2 MXene/GCE, (g) BSA/OR5K1–NV–AuNP–PB/ZIF-8@SWCNT/Ti3C2 MXene/GCE и (h) BSA/OR5K1–NV–AuNP–PB/ZIF-8@SWCNT/Ti3C2 MXene-TMP. (C) Концентрация Ti3C2 MXene. (D) Массовое соотношение ZIF-8 к SWCNT. (E) Количество циклов сканирования. (F) Концентрация рецептора. (G) Время инкубации.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-f4.jpg\" alt=\"Отклик обонятельного биосенсора на пиразиновые соединения.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Отклик обонятельного биосенсора на пиразиновые соединения.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Отклик обонятельного биосенсора на пиразиновые соединения. (A) ДПВ-отклик OR5K1–NV–AuNP–PB/ZIF-8@SWCNT/Ti3C2 MXene/GCE на различные концентрации TMP (a–g: 0, 10−14, 10−13, 10−12, 10−11, 10−10 и 10−9 М). (B) Калибровочная кривая OR5K1–NV–AuNP–PB/ZIF-8@SWCNT/Ti3C2 MXene/GCE для обнаружения TMP (n = 5). (C) Селективный отклик сенсора на пиразиновые соединения (пиразин, TMP, TTMP, 2,6-DMeP, 2,3-DMeP, 2,5-DMeP, этанол, гексаналь, ацетон, фенол). (D) Отклики сенсора на TMP во время хранения. (E) Воспроизводимость откликов сенсора.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-f5.jpg\" alt=\"Обнаружение пиразиновых соединений в четырех образцах солода с помощью обонятельного биосенсора и ГХ-TOF/МС. Столбчатая \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Обнаружение пиразиновых соединений в четырех образцах солода с помощью обонятельного биосенсора и ГХ-TOF/МС. Столбчатая диаграмма представляет значения токового отклика обонятельного сенсора, а линейный график — концентрации пиразиновых соединений в солоде, определенные методом ГХ-TOF/МС.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-f6.jpg\" alt=\"3D- и 2D-графики оптимальных конформаций докинга между шестью пиразиновыми соединениями и обонятельным рецептором OR5K1.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3D- и 2D-графики оптимальных конформаций докинга между шестью пиразиновыми соединениями и обонятельным рецептором OR5K1. (A) OR5K1-пиразин, (B) OR5K1-TMP, (C) OR5K1-TTMP, (D) OR5K1-2,6-DMeP, (E) OR5K1-2,3-DMeP, (F) OR5K1-2,5-DMeP.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точного&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализа&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ароматов&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Создание&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;биосенсора с&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рецептором&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;OR5K1&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;селективность&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и чувствительн&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ость&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Контроль&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;качества&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;продуктов&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;питания&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Foods (Basel, Switzerland). Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Foods (Basel, Switzerland) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;maillard&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Zhang L, Chen YP, Tan SY, Xie Z, Wang X, Liu Y.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13606829\" target=\"_blank\" rel=\"noreferre
