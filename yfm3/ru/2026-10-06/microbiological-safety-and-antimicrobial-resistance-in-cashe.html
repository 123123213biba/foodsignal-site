            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"141\" cy=\"165\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"619\" cy=\"193\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · DAIRY_FERM   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Скрытая жизнь орехового&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;сыра: что на самом деле&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;происходит в&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ферментированных аналогах&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe-f1.jpg\" alt=\"Распределение бактериальных изолятов среди проанализированных образцов (a) и общее количество изолятов, идентифицированн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Распределение бактериальных изолятов среди проанализированных образцов (a) и общее количество изолятов, идентифицированных для каждого вида (b)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Растущая популярность растительных сыров из кешью требует пристального контроля их микробиологического состава. Исследование 13 образцов из Бразилии показало отсутствие опасных патогенов, таких как сальмонелла. Однако в продуктах обнаружены бактерии с генами устойчивости к антибиотикам, что требует внимания производителей.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;В сырах из кешью не найдены опасные патогены, но обнаружены бактерии с генами устойчивости к антибиотикам.&lt;/li&gt;\n&lt;li&gt;Высокое содержание плесени и дрожжей в ферментированных продуктах является нормой, если они были внесены намеренно.&lt;/li&gt;\n&lt;li&gt;Наличие мобильных генетических элементов в штаммах требует строгого контроля безопасности заквасок.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи проанализировали 13 образцов крафтовых сыров из кешью, используя методы MALDI-TOF масс-спектрометрии для идентификации микрофлоры и полногеномное секвенирование для поиска генов антибиотикорезистентности (&lt;a href=\"concepts/antimicrobial-resistance.html\"&gt;AMR&lt;/a&gt;). В образцах не выявлено Salmonella spp., E. coli или коагулазоположительных стафилококков, что говорит о приемлемом уровне гигиены производства. Однако в одном из образцов был обнаружен Bacillus cereus, а также идентифицированы Cronobacter malonaticus и Delftia acidovorans.&lt;/p&gt;\n&lt;p&gt;Из 176 выделенных штаммов молочнокислых бактерий (&lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;LAB&lt;/a&gt;) наиболее распространенными оказались Enterococcus faecium и Lactiplantibacillus plantarum. Анализ выявил 8 генов устойчивости к антибиотикам, причем 4 из них находились на плазмидах — мобильных генетических элементах, способных передаваться другим бактериям. Штаммы C. malonaticus и Levilactobacillus brevis показали наличие таких генов, что подчеркивает риск переноса резистентности через ферментированные продукты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование охватило только 13 образцов из одного региона, поэтому результаты нельзя экстраполировать на все виды растительных сыров.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;В последние годы спрос на растительные аналоги сыра вырос, что обусловлено как распространением веганских и вегетарианских диет, так и стремлением потребителей найти альтернативы продуктам животного происхождения. Их производство опирается на разнообразное сырье и часто включает процессы ферментации с участием плесневых грибов, дрожжей и молочнокислых бактерий (МКБ). В этом контексте обеспечение безопасности пищевых продуктов, включая аспекты устойчивости к противомикробным препаратам (&lt;a href=\"concepts/ultra-processed-foods.html\"&gt;УПП&lt;/a&gt;), имеет важное значение из-за сложных микробных сообществ, участвующих в ферментации. В связи с этим в данном исследовании изучалось присутствие бактериальных видов, потенциально значимых для общественного здравоохранения, а также оценивались профили и гены УПП в растительных аналогах сыра, приобретенных в Бразилии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В исследованных образцах не обнаружены Salmonella spp., коагулазоположительные Staphylococcus и Escherichia coli, однако в одном образце выявлен Bacillus cereus.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ни в одном из протестированных образцов не были обнаружены Salmonella spp., коагулазоположительные Staphylococcus или Escherichia coli, в то время как Bacillus cereus был обнаружен в одном образце. Две атипичные колонии, выделенные на селективных средах для Salmonella, были идентифицированы как Cronobacter malonaticus и Delftia acidovorans. Большинство образцов показали высокое содержание плесневых грибов и дрожжей, что, вероятно, связано с процессами ферментации и созревания. Среди 176 изолятов МКБ с помощью MALDI-TOF было идентифицировано 11 видов, и двадцать репрезентативных штаммов были отобраны для тестирования на антимикробную чувствительность. Устойчивость была выявлена у ограниченного числа изолятов, главным образом к ципрофлоксацину, тетрациклину и гентамицину, тогда как C. malonaticus проявил устойчивость к пенициллину.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MALDI-TOF — метод масс-спектрометрии, позволяющий быстро идентифицировать микроорганизмы по их белковому профилю.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Было проведено полногеномное секвенирование Lactiplantibacillus plantarum, Levilactobacillus brevis, &lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt;, Enterococcus faecium и C. malonaticus. Всего было идентифицировано восемь генов устойчивости к противомикробным препаратам, четыре из которых находились в плазмидах у C. malonaticus и L. brevis. Эти результаты показывают, что микроорганизмы, связанные с растительными аналогами сыра, могут выступать в качестве резервуаров детерминант устойчивости к противомикробным препаратам, что подчеркивает важность оценки безопасности и микробиологического надзора за штаммами, предназначенными для технологического или пробиотического применения.&lt;/p&gt;\n&lt;p&gt;Ключевые слова: Микробиологическая безопасность · Молочнокислые бактерии · Полногеномное секвенирование · &lt;a href=\"concepts/mobile-genetic-elements.html\"&gt;Мобильные генетические элементы&lt;/a&gt; · Гены устойчивости&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"mikrobiologicheskaya-bezopasnost-fermentirovannyh-produktov\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#mikrobiologicheskaya-bezopasnost-fermentirovannyh-produktov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Микробиологическая безопасность ферментированных продуктов&lt;/span&gt;&lt;/a&gt;Микробиологическая безопасность ферментированных продуктов&lt;/h4&gt;\n&lt;p&gt;Безопасность пищевых продуктов остается важной проблемой общественного здравоохранения во всем мире, особенно в отношении продуктов, производство которых основано на микробной ферментации. Ферментированные продукты содержат сложные микробные сообщества, которые определяют качество, стабильность и сенсорные характеристики продукта, но также могут включать нежелательные микроорганизмы, попадающие через сырье, производственную среду или в процессе постпроизводственного загрязнения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Микробные сообщества в ферментированных продуктах критически важны для качества, однако они могут содержать патогены, попавшие из внешней среды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В последние годы рынок аналогов сыра на растительной основе значительно вырос из-за растущего потребительского спроса на устойчивые, этичные и полезные для здоровья альтернативы продуктам животного происхождения. Эти продукты обычно производятся из орехов, бобовых, семян, крахмалов и растительных масел и часто включают процессы ферментации с участием дрожжей, плесневых грибов и молочнокислых бактерий (LAB) для улучшения вкуса, текстуры, срока годности и общей приемлемости продукта. Среди этих микробов LAB играют центральную технологическую роль, способствуя подкислению, формированию вкуса и подавлению микроорганизмов порчи.&lt;/p&gt;\n&lt;h4 id=\"riski-i-antimikrobnaya-rezistentnost\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#riski-i-antimikrobnaya-rezistentnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Риски и антимикробная резистентность&lt;/span&gt;&lt;/a&gt;Риски и антимикробная резистентность&lt;/h4&gt;\n&lt;p&gt;Несмотря на быстрый рост сектора растительных сыров, информация о микробиологической безопасности этих продуктов остается ограниченной. Это особенно актуально, поскольку многие продукты производятся мелкими предприятиями и могут не подвергаться термической обработке или ферментации, что потенциально повышает их восприимчивость к загрязнению оппортунистическими или патогенными микроорганизмами. Кроме того, микробные популяции, присутствующие в ферментированных продуктах, привлекают все большее внимание как потенциальные резервуары детерминант антимикробной резистентности (AMR).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Антимикробная резистентность (AMR) — это способность микроорганизмов выживать при воздействии антибиотиков, что затрудняет лечение инфекций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя LAB общепризнаны как безопасные и широко используются в качестве стартовых культур и пробиотиков, сообщалось, что некоторые штаммы содержат приобретенные гены антимикробной резистентности (ARG), особенно связанные с мобильными генетическими элементами, которые могут способствовать горизонтальному переносу генов внутри микробных сообществ. Наличие ARG у пищевых микроорганизмов не обязательно представляет прямой риск для здоровья; однако мониторинг этих детерминант способствует лучшему пониманию потенциальной роли продуктов питания в экологии и распространении AMR. Следовательно, оценка как микробиологической безопасности, так и профилей AMR стала все более актуальной в системах ферментированных пищевых продуктов.&lt;/p&gt;\n&lt;p&gt;В данном контексте в настоящем исследовании оценивалась микробиологическая безопасность бразильских аналогов сыра на основе кешью и исследовались профили антимикробной чувствительности молочнокислых бактерий и бактериальных контаминантов, выделенных из этих продуктов. Кроме того, отобранные изоляты были охарактеризованы с помощью полногеномного секвенирования для оценки наличия генов AMR.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"identifikaciya-indikatornyh-i-patogennyh-mikroorganizmov\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#identifikaciya-indikatornyh-i-patogennyh-mikroorganizmov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация индикаторных и патогенных микроорганизмов&lt;/span&gt;&lt;/a&gt;Идентификация индикаторных и патогенных микроорганизмов&lt;/h4&gt;\n&lt;p&gt;Ни в одном из проанализированных образцов не было выявлено Salmonella spp., E. coli или коагулазоположительных Staphylococcus (Таблица 1). Ни одна из предполагаемых колоний B. cereus не была подтверждена согласно методу подсчета, основанному на стандарте ISO. Однако один изолят, полученный при выделении молочнокислых бактерий (LAB), был классифицирован как B. cereus с помощью MALDI-TOF MS. Отсутствие основных пищевых патогенов и индикаторов гигиены позволяет предположить, что проанализированные продукты были произведены в удовлетворительных гигиенических условиях. Аналогичные результаты были получены в исследовании Correia et al. (2026), где не было обнаружено Salmonella spp. или Listeria monocytogenes в коммерческих аналогах сыра на растительной основе из Бразилии, но споры B. cereus были выявлены в 27% оцененных продуктов. В настоящем исследовании, хотя был обнаружен только один изолят B. cereus, который не был выявлен при селективном подсчете, его наличие заслуживает внимания, поскольку некоторые штаммы могут продуцировать токсины, связанные с пищевыми отравлениями. Поскольку этот микроорганизм обычно связан с растительными ингредиентами и источниками в окружающей среде, его присутствие может отражать загрязнение, исходящее от сырья или производственной среды, что подчеркивает важность мониторинга спорообразующих бактерий на протяжении всей производственной цепочки аналогов сыра на растительной основе. Большинство образцов показали высокое содержание плесневых грибов и дрожжей, с преобладанием последних (Таблица 1). Согласно бразильскому законодательству (IN № 313/2024), микробиологические пределы для плесеней и дрожжей не применяются к продуктам, намеренно произведенным с использованием жизнеспособных микроорганизмов. Следовательно, такие высокие показатели в ферментированных аналогах сыра на растительной основе не обязательно следует интерпретировать как индикаторы низкого микробиологического качества. В нескольких образцах, проанализированных в этом исследовании, на этикетках было заявлено использование пробиотических, мезофильных или веганских культур, что может частично объяснить наблюдаемые показатели. Кроме того, не заявленные микроорганизмы, связанные со спонтанной ферментацией, также могут вносить вклад в эти микробные популяции. С технологической точки зрения дрожжи и плесени могут быть желательны в ферментированных аналогах сыра на растительной основе из-за их вклада в развитие вкуса во время созревания. Такие виды, как Geotrichum candidum, обычно используются в качестве культур для созревания из-за их липолитической и протеолитической активности, которые могут улучшить сенсорные свойства. Однако в продуктах, не предназначенных для процессов ферментации или созревания, повышенное содержание дрожжей может указывать на потенциал порчи или недостаточный контроль процесса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В исследованных образцах не обнаружено патогенов (Salmonella, E. coli, S. aureus), однако выявлено присутствие B. cereus и высокие уровни дрожжей, что требует контроля на производстве.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vydelenie-i-identifikaciya-molochnokislyh-bakterij-lab\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#vydelenie-i-identifikaciya-molochnokislyh-bakterij-lab\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выделение и идентификация молочнокислых бактерий (LAB)&lt;/span&gt;&lt;/a&gt;Выделение и идентификация молочнокислых бактерий (LAB)&lt;/h4&gt;\n&lt;p&gt;Предполагаемые LAB были обнаружены в 10 из 13 проанализированных образцов, в результате чего было получено 176 изолятов, в то время как в остальных трех образцах LAB не были выделены. Распределение видов бактерий варьировалось между продуктами (Рис. 1A). Наблюдалась заметная вариация в структуре бактериального сообщества в разных образцах. В то время как в некоторых продуктах доминировал один вид, другие содержали более широкий спектр бактериальных таксонов. Эти паттерны могут отражать различия в сырье, условиях обработки, применении стартовых культур и возникновении спонтанной ферментации. В сообществе LAB доминировали E. faecium (39 изолятов), L. plantarum (32 изолята), &lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; (24 изолята), L. mesenteroides (23 изолята), Pediococcus pentosaceus (17 изолятов) и Lacticaseibacillus paracasei (15 изолятов) (Рис. 1B). Кроме того, было идентифицировано несколько видов, не относящихся к LAB, а именно Bacillus subtilis, B. cereus, Cronobacter malonaticus и Delftia acidovorans. Некоторые из преобладающих видов, идентифицированных в этом исследовании, ранее уже упоминались в ферментированных аналогах сыра на растительной основе. В частности, L. plantarum, Leuconostoc spp. и Pediococcus spp. хорошо адаптированы к субстратам на растительной основе и играют важную роль в подкислении, развитии вкуса и формировании текстуры во время ферментации. Однако преобладание E. faecium, наблюдаемое здесь, отличается от предыдущих исследований, в которых Lactococcus lactis и L. mesenteroides были зарегистрированы как наиболее распространенные виды. Хотя Enterococcus spp. обычно встречаются в ферментированных продуктах и могут способствовать процессам ферментации, некоторые штаммы были связаны с устойчивостью к противомикробным препаратам (AMR) и оппортунистическими инфекциями. Следовательно, их высокая распространенность в проанализированных образцах подчеркивает необходимость дальнейшей характеристики на уровне штаммов для оценки их безопасности и технологической значимости.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe-f1.jpg\" alt=\"Распределение бактериальных изолятов среди проанализированных образцов (a) и общее количество изолятов, идентифицированн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Распределение бактериальных изолятов среди проанализированных образцов (a) и общее количество изолятов, идентифицированных для каждого вида (b)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Идентификация микроорганизмов проводилась методом MALDI-TOF MS — это масс-спектрометрия, позволяющая быстро определять вид бактерии по её белковому профилю.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"identifikaciya-drugih-bakterij-s-potencialnoj-patogennostyu\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#identifikaciya-drugih-bakterij-s-potencialnoj-patogennostyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация других бактерий с потенциальной патогенностью&lt;/span&gt;&lt;/a&gt;Идентификация других бактерий с потенциальной патогенностью&lt;/h4&gt;\n&lt;p&gt;Помимо целевых микроорганизмов, атипичные колонии, выделенные на среде BGA, были идентифицированы как C. malonaticus и Delftia acidovorans (Рис. 1). В Таблице 1 представлены результаты микробиологического анализа образцов аналогов сыра на основе кешью. C. malonaticus был обнаружен в двух образцах (S4 и S5). Этот вид заслуживает особого внимания из-за своего оппортунистического патогенного потенциала и связи с инфекциями у людей. Представители рода Cronobacter выделялись из широкого спектра пищевых продуктов, включая злаки, травы, овощи, молочные продукты и сухие детские смеси. Хотя основные резервуары Cronobacter spp. остаются недостаточно изученными, растительное сырье и производственная среда считаются важными источниками загрязнения. Кроме того, способность этих бактерий образовывать биопленки может способствовать их выживанию на производстве, повышая риск контаминации в процессе изготовления продуктов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В образцах аналогов сыра из кешью выявлены C. malonaticus и D. acidovorans, что указывает на возможное загрязнение из окружающей среды или сырья.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Delftia acidovorans — это бактерия окружающей среды, часто обнаруживаемая в водных системах и биопленках. Хотя она обычно считается микроорганизмом с низкой вирулентностью, её иногда связывают с оппортунистическими инфекциями, особенно у лиц с ослабленным иммунитетом. Обнаружение этого вида в данном исследовании, скорее всего, отражает загрязнение из окружающей среды, исходящее от сырья или производственных помещений, а не прямое участие в процессе ферментации.&lt;/p&gt;\n&lt;h4 id=\"antimikrobnaya-rezistentnost\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#antimikrobnaya-rezistentnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Антимикробная резистентность&lt;/span&gt;&lt;/a&gt;Антимикробная резистентность&lt;/h4&gt;\n&lt;p&gt;Из 69 репрезентативных изолятов для тестирования на антимикробную чувствительность было отобрано 20 штаммов. Резистентность была выявлена у 11 изолятов (55%), представляющих четыре вида бактерий (Таблица 2). Фенотипы резистентности были связаны преимущественно с ципрофлоксацином, тетрациклином, гентамицином и пенициллином. Два изолята E. faecium проявили устойчивость к гентамицину и ципрофлоксацину, что согласуется с предыдущими отчетами об антимикробной резистентности (AMR) среди Enterococcus spp., ассоциированных с пищевыми продуктами. В отличие от них, D. acidovorans была чувствительна ко всем протестированным антимикробным препаратам, тогда как C. malonaticus проявил устойчивость к пенициллину. Предыдущие исследования также подтверждали наличие резистентности среди молочнокислых бактерий (LAB), выделенных из ферментированных продуктов, особенно к ванкомицину, аминогликозидам и хинолонам. Эти данные подчеркивают важность мониторинга AMR у микроорганизмов, связанных с ферментированными пищевыми продуктами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование носит наблюдательный характер: выявленная резистентность у 55% отобранных изолятов требует дальнейшего изучения для оценки рисков для потребителей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"genomnoe-sekvenirovanie-i-analiz-rezistoma\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#genomnoe-sekvenirovanie-i-analiz-rezistoma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Геномное секвенирование и анализ резистома&lt;/span&gt;&lt;/a&gt;Геномное секвенирование и анализ резистома&lt;/h4&gt;\n&lt;p&gt;Было проведено полногеномное секвенирование пяти репрезентативных изолятов, отобранных на основе их профилей чувствительности к антимикробным препаратам. Среди секвенированных штаммов гены антимикробной резистентности (AMR) были обнаружены только в геноме C. malonaticus. Идентифицированные детерминанты резистентности, соответствующие им классы антимикробных препаратов и механизмы устойчивости представлены в Таблице 3. C. malonaticus — это грамотрицательный оппортунистический патоген, известный своим потенциалом вирулентности и способностью приобретать и сохранять детерминанты AMR. Большинство генов устойчивости, обнаруженных у этого вида, были связаны с системами эффлюкса с множественной лекарственной устойчивостью и регуляторными путями, что может способствовать снижению чувствительности к нескольким классам антимикробных препаратов, включая фторхинолоны, цефалоспорины и тетрациклины, а также к дезинфицирующим и антисептическим соединениям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гены AMR обнаружены только у C. malonaticus; они связаны с системами эффлюкса, обеспечивающими устойчивость к нескольким классам антибиотиков и антисептикам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Что касается детерминант резистентности, расположенных в плазмидных областях, гены, связанные с устойчивостью к ванкомицину, хлорамфениколу, фосфомицину и тетрациклину, были обнаружены у C. malonaticus и L. brevis (Таблица 4). У C. malonaticus большинство идентифицированных генов были связаны с системами эффлюкса с множественной лекарственной устойчивостью и регуляторными механизмами, обычно встречающимися у грамотрицательных бактерий. Напротив, L. brevis содержал гены, кодирующие тетрациклиновые эффлюксные транспортеры, принадлежащие суперсемейству главных фасилитаторов (MFS). Хотя внутренняя устойчивость является признанной характеристикой некоторых видов молочнокислых бактерий (LAB), наличие генов AMR, переносимых мобильными генетическими элементами в бактериях, связанных с пищевыми продуктами, вызывает обеспокоенность из-за их потенциала к горизонтальному распространению.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффлюкс — это механизм, при котором бактериальная клетка активно «выкачивает» антибиотик наружу, предотвращая его накопление внутри.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В этом контексте обнаружение устойчивых микроорганизмов и детерминант резистентности в ферментированных продуктах растительного происхождения подчеркивает важность интеграции стратегий микробиологического и геномного мониторинга, особенно для штаммов с потенциальным технологическим или пробиотическим применением. Хотя распространенность устойчивости среди оцененных изолятов была ограниченной, обнаружение этих генов подчеркивает потенциальную роль микроорганизмов, связанных с пищевыми продуктами, в качестве резервуаров детерминант AMR и указывает на ценность сочетания фенотипических и геномных подходов для целей эпиднадзора. (Таблица 2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на ограниченной выборке из пяти изолятов; результаты не могут быть экстраполированы на все пищевые продукты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"sbor-obrazcov\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#sbor-obrazcov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор образцов&lt;/span&gt;&lt;/a&gt;Сбор образцов&lt;/h4&gt;\n&lt;p&gt;Тринадцать образцов (S1–S13) аналогов сыра на основе кешью бразильского производства были приобретены в местных супермаркетах, на ярмарках и через платформы электронной коммерции (Дополнительная таблица 1). Отбор образцов проводился путем поиска в таких сетях, как Google, с учетом продуктов, доступных в период с августа 2023 года по январь 2024 года. Образцы хранились при температуре 4 °C, а микробиологические анализы проводились до истечения срока годности, указанного на этикетке продукта.&lt;/p&gt;\n&lt;h4 id=\"identifikaciya-indikatornyh-i-patogennyh-mikroorganizmov1\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#identifikaciya-indikatornyh-i-patogennyh-mikroorganizmov1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификация индикаторных и патогенных микроорганизмов&lt;/span&gt;&lt;/a&gt;Идентификация индикаторных и патогенных микроорганизмов&lt;/h4&gt;\n&lt;p&gt;Выбор исследуемых микроорганизмов был основан на Приложении I к Нормативной инструкции (IN) № 161 от 1 июля 2022 года, изданной Бразильским агентством по санитарному надзору (ANVISA), в частности, для группы 4 (прочие продукты на растительной основе), категории (c): охлажденный тофу, суфу и аналогичные продукты. Микробиологический анализ включал обнаружение Salmonella spp. и количественное определение коагулазоположительных Staphylococcus, Escherichia coli, предполагаемых Bacillus cereus, а также плесневых грибов и дрожжей. Методы основывались на стандартах Международной организации по стандартизации (ISO) 6579:2002, ISO 6888-1:1999, ISO 16649-2:2001, ISO 7932:2004 и ISO 21527-1:2008 с адаптациями. Для каждого анализа 25 г образца гомогенизировали в буферной пептонной воде (BPW; Oxoid, Бейзингсток, Великобритания). Коагулазоположительные Staphylococcus, предполагаемые B. cereus, а также плесневые грибы и дрожжи подсчитывали методом поверхностного посева 0,1 мл разведенного образца на селективные среды. Агар Бэрд-Паркера (BP; Oxoid) использовали для коагулазоположительных Staphylococcus, агар с маннитом, яичным желтком и полимиксином (MYP; Oxoid) — для предполагаемых B. cereus, а агар с дрожжевым экстрактом, глюкозой и хлорамфениколом (YGC; Merck, Германия) — для плесневых грибов и дрожжей. Чашки засевали с помощью шпателя Дригальского и инкубировали в аэробных условиях при 35 ± 1 °C в течение 48 ± 2 ч (BP), при 30 ± 1 °C в течение 18–24 ч (MYP) и при 25 ± 1 °C в течение 5 суток (YGC). Escherichia coli подсчитывали методом посева в чашки Петри, куда переносили 1 мл разведенного образца с последующим добавлением агара с триптон-желчью и X-глюкуронидом (TBX; Neogen, США). После гомогенизации чашки инкубировали в аэробных условиях при 44 ± 1 °C в течение 24 ч. Для обнаружения Salmonella spp. суспензии в BPW подвергали предварительному обогащению при 37 ± 1 °C в течение 18–24 ч. Впоследствии аликвоты по 0,1 мл и 1 мл переносили в бульон Раппапорта-Вассилиадиса с соей (RVS; Oxoid) и тетратионатный бульон Мюллера-Кауфманна с новобиоцином (MKTTn; Oxoid) и инкубировали при 45 ± 1 °C и 37 ± 1 °C соответственно в течение 24 ± 3 ч. Для последующего селективного обогащения 10 мкл предварительно обогащенного образца высевали на ксилозо-лизин-дезоксихолатный агар (XLD) и бриллиантовый зеленый агар (BGA; Oxoid). Для количественного определения плесневых грибов и дрожжей готовили серийные десятичные разведения в BPW, и по 0,1 мл каждого разведения высевали на агар YGC. Все чашки анализировали на наличие колоний с типичной морфологией целевого микроорганизма. Дополнительно морфологически отличные колонии, выращенные на питательном агаре (NA; Neogen, США), отбирали и идентифицировали с помощью матрично-активированной лазерной десорбции/ионизации с времяпролетным масс-спектрометрическим анализом (MALDI-TOF MS).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод MALDI-TOF MS позволяет быстро идентифицировать микроорганизмы, анализируя их уникальный белковый профиль с помощью лазера и масс-спектрометра.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vydelenie-i-identifikaciya-molochnokislyh-bakterij-mkb\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#vydelenie-i-identifikaciya-molochnokislyh-bakterij-mkb\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выделение и идентификация молочнокислых бактерий (МКБ)&lt;/span&gt;&lt;/a&gt;Выделение и идентификация молочнокислых бактерий (МКБ)&lt;/h4&gt;\n&lt;p&gt;МКБ выделяли по методу, адаптированному из ISO 15214:1998. Серийные десятичные разведения образцов готовили в BPW, и 0,1 мл высевали на агар MRS с помощью шпателя Дригальского. Чашки инкубировали в анаэробных условиях при 30 ± 2 °C в течение 48 ± 3 ч. После инкубации колонии отбирали на основе морфологических характеристик, таких как размер, форма, цвет, текстура и край, при этом из каждого образца выделяли до 24 колоний. Изоляты очищали в бульоне MRS и инкубировали в тех же условиях перед идентификацией методом MALDI-TOF MS.&lt;/p&gt;\n&lt;h4 id=\"testirovanie-antimikrobnoj-chuvstvitelnosti\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#testirovanie-antimikrobnoj-chuvstvitelnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тестирование антимикробной чувствительности&lt;/span&gt;&lt;/a&gt;Тестирование антимикробной чувствительности&lt;/h4&gt;\n&lt;p&gt;Тест на антимикробную чувствительность проводили методом диффузии в агар (метод Кирби-Бауэра) в соответствии с рекомендациями BrCAST. Перед тестированием изоляты МКБ и отдельные колонии C. malonaticus и D. acidovorans культивировали в бульонах MRS и BHI. Тестировались следующие антибиотики: ванкомицин (30 мкг), тетрациклин (30 мкг), хлорамфеникол (30 мкг), амоксициллин (10 мкг), гентамицин (120 мкг), ампициллин (10 мкг), стрептомицин (300 мкг), эритромицин (15 мкг), ципрофлоксацин (5 мкг) и пенициллин (10 мкг). Бактериальные суспензии доводили до стандарта 0,5 по Макфарланду в 0,85% физиологическом растворе и распределяли по соответствующей агаровой среде с помощью стерильного тампона. Диски с антибиотиками помещали на поверхность агара, а чашки инкубировали либо в анаэробных условиях при 30 ± 2 °C (MRS), либо в аэробных условиях при 36 ± 2 °C в течение 24 ч (BHI), в зависимости от требований к росту каждого изолята. Диаметры зон ингибирования измеряли и интерпретировали как чувствительные или резистентные согласно критериям BrCAST.&lt;/p&gt;\n&lt;h4 id=\"polnogenomnoe-sekvenirovanie-i-genomnyj-analiz\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#polnogenomnoe-sekvenirovanie-i-genomnyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Полногеномное секвенирование и геномный анализ&lt;/span&gt;&lt;/a&gt;Полногеномное секвенирование и геномный анализ&lt;/h4&gt;\n&lt;p&gt;Для полногеномного секвенирования были отобраны пять изолятов на основе их профилей антимикробной чувствительности: Lactiplantibacillus plantarum, Levilactobacillus brevis, Leuconostoc mesenteroides, Enterococcus faecium и Cronobacter malonaticus. Геномная ДНК была выделена с использованием набора PureLink™ Genomic DNA Mini Kit и количественно определена с помощью набора Qubit™ dsDNA Quantification Assay Kit. Образцы с концентрацией ДНК ≥ 10 нг/мкл были направлены на дробовое секвенирование (shotgun sequencing) в IPEC Guarapuava (Бразилия) с использованием платформы Illumina NovaSeq 6000 с парно-концевыми прочтениями. Анализ данных включал этап первичного контроля качества прочтений с помощью программы fastp (v0.23.2) с флагами -q 30 -w 30 --cut_front --cut_tail --n_base_limit 0 --length_required 50.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полногеномное секвенирование (WGS) — это метод определения полной последовательности нуклеотидов в ДНК организма, позволяющий идентифицировать гены устойчивости к антибиотикам и факторы патогенности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сборка генома de novo выполнялась с использованием программного обеспечения SPAdes (v3.15.5) с применением флага «--isolate» в связи с высоким полученным покрытием. Гены устойчивости к противомикробным препаратам (AMR) были идентифицированы с помощью инструмента RGI (Resistance Gene Identifier, v6.0.0) по базе данных CARD (Comprehensive Antibiotic Resistance Database, v3.2.6) с использованием основных функций, строгих порогов выравнивания и идентичности совпадающего региона ≥ 85%. Мобильные генетические элементы и связанные с ними гены устойчивости исследовались с помощью geNomad с параметрами по умолчанию. Сиквенс-типы (ST) определялись с использованием базы данных многолокусного сиквенс-типирования (MLST). Патогенный потенциал каждого генома впоследствии оценивался с помощью веб-сервера PathogenFinder 1.1, который прогнозирует вероятность того, что бактерия является патогеном для человека, на основе геномных характеристик. Геномы с прогнозируемой вероятностью патогенности ≥ 0,5 классифицировались как потенциально патогенные.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Безопасность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;растительных&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сыров&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spac te yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Brazilian journal of microbiology : (publication of the Brazilian Society for Microbiology). Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Brazilian journal of microbiology : (publication of the Brazilian Society for Microbiology) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;dairy_ferm&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Dalmina NZ, Toigo AL, Krebs KRK, Kothe CI, Mariot RF, Motta H, Kmetzsch L, Suhre T, Klain V, Frazzon APG, Mayer FQ, Frazzon J.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13601488\" target=\"_blank\" rel=\"norefe
