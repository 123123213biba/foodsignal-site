        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Rosemary extract as an antioxidant in repeated frying oil&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-antioxidants_add.jpg\" alt=\"Антиоксиданты\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Wu X, Beecher GR, Holden JM, Haytowitz DB, Gebhardt SE, Prior RL, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Foods_highest_in_antioxidants.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Антиоксиданты — это вещества, которые ингибируют (замедляют или предотвращают) процесс окисления органических соединений. В пищевой промышленности они применяются для сохранения качества продуктов, предотвращая порчу жиров и других компонентов под воздействием кислорода. Антиоксиданты могут быть как природного происхождения, так и синтетическими соединениями, которые нейтрализуют свободные радикалы.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Окисление — это химический процесс, при котором молекулы теряют электроны. В пищевых продуктах этот процесс часто запускается свободными радикалами — нестабильными молекулами с неспаренным электроном. Антиоксиданты функционируют как доноры электронов: они отдают свой электрон свободному радикалу, стабилизируя его и прерывая цепную реакцию окисления. В контексте пищевых технологий антиоксиданты являются функциональным классом добавок, которые защищают липиды от прогоркания, а витамины и пигменты — от разрушения.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс защиты продукта антиоксидантами основан на их способности выступать в роли «ловушек» для свободных радикалов. Когда антиоксидант вступает в реакцию с радикалом, он сам становится менее активным, не запуская новых разрушительных процессов. Эффективность этого процесса зависит от химической структуры молекулы антиоксиданта, концентрации кислорода в среде, температуры и наличия катализаторов (например, ионов металлов).&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для оценки антиоксидантной активности применяются лабораторные методы химического анализа, такие как спектрофотометрия. Они измеряют способность вещества нейтрализовать модельные радикалы в контролируемых условиях. В пищевой индустрии также проводят дегустационные панели для оценки сенсорных свойств (вкуса, аромата) продуктов, обработанных антиоксидантами, чтобы убедиться, что добавка не искажает профиль продукта.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Антиоксиданты используются для продления срока годности масел, жиров, мясных изделий и полуфабрикатов. В статье «Сладкие яблоки уступают кислым по антиоксидантной защите» показано, что природный состав плодов напрямую влияет на их устойчивость к окислению: химический анализ 12 сортов яблок выявил, что высокое содержание сахара часто коррелирует с более низким содержанием фенольных соединений, обладающих антиоксидантными свойствами.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Антиоксиданты не являются универсальным средством для бесконечного хранения продуктов. Их эффективность ограничена дозировкой и условиями внешней среды. Чрезмерное окисление может быть вызвано термической обработкой, например, при повторном использовании масла для жарки. Важно помнить, что наличие антиоксидантов в составе не делает продукт «полезным» в медицинском смысле; их основная функция — технологическая защита качества продукта.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Антиоксиданты&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%91%D0%BE%D1%81%20%D1%80%D0%B0%D0%B4%D0%B8%D0%BA%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%20--%3E%7C%D1%82%D0%BE%D1%82%D1%8B%D2%93%D1%83%D0%B4%D1%8B%20%D1%82%D1%83%D0%B4%D1%8B%D1%80%D0%B0%D0%B4%D1%8B%7C%20B%5B%D0%9B%D0%B8%D0%BF%D0%B8%D0%B4%D1%82%D0%B5%D1%80%5D%0A%20%20C%5B%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D0%BD%D1%82%D1%82%D0%B0%D1%80%5D%20--%3E%7C%D1%8D%D0%BB%D0%B5%D0%BA%D1%82%D1%80%D0%BE%D0%BD%20%D0%B1%D0%B5%D1%80%D0%B5%D0%B4%D1%96%7C%20A%0A%20%20A%20--%3E%7C%D1%82%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D0%B0%D0%BD%D0%B0%D0%B4%D1%8B%7C%20D%5B%D0%A2%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D1%8B%20%D0%BC%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D0%B0%5D%0A%20%20C%20--%3E%7C%D2%9B%D0%BE%D1%80%D2%93%D0%B0%D0%B9%D0%B4%D1%8B%7C%20B%0A%20%20E%5B%D0%97%D0%B5%D1%80%D1%82%D1%85%D0%B0%D0%BD%D0%B0%D0%BB%D1%8B%D2%9B%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%20--%3E%7C%D3%A9%D0%BB%D1%88%D0%B5%D0%B9%D0%B4%D1%96%7C%20C%0A%20%20F%5B%D0%94%D0%B5%D0%B3%D1%83%D1%81%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%20--%3E%7C%D0%B1%D0%B0%D2%93%D0%B0%D0%BB%D0%B0%D0%B9%D0%B4%D1%8B%7C%20B%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html\"&gt;Сладкие яблоки уступают кислым по антиоксидантной защите&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D0%BD%D1%82%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Антиоксиданты — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Foods_highest_in_antioxidants.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Wu X, Beecher GR, Holden JM, Haytowitz DB, Gebhardt SE, Prior RL, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.2147/vhrm.1.1.55.58939\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Endothelial cell dysfunction and the vascular complications associated with type 2 diabetes: assessing the health of the endothelium&lt;/a&gt; — обзор, Vasc Health Risk Manag 2005&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu12113366\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nutrition in Cancer Therapy in the Elderly-An Epigenetic Connection?&lt;/a&gt; — обзор, Nutrients 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ijms24054408\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Towards a New Biomarker for Diabetic Retinopathy: Exploring RBP3 Structure and Retinoids Binding for Functional Imaging of Eyes In Vivo&lt;/a&gt; — обзор, Int J Mol Sci 2023&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Токоферолы, розмарин, TBHQ: как замедляют окисление."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Антиоксиданты","description":"Токоферолы, розмарин, TBHQ: как замедляют окисление.","vcsPath":"concepts/proc-antioxidants_add.md"},"headings":[{"title":"Определение","href":"concepts/proc-antioxidants_add.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-antioxidants_add.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-antioxidants_add.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-antioxidants_add.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-antioxidants_add.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-antioxidants_add.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-antioxidants_add.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-antioxidants_add.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-antioxidants_add.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/proc-antioxidants_add.html#istochniki","level":2}],"title":"Антиоксиданты"},"router":{"pathname":"concepts/proc-antioxidants_add","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
