        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Gel strength of gelatin and agar desserts&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-gels.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-gels.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Гели — это структурированные системы, состоящие из полимерного каркаса и растворителя, которые обладают свойствами твердых тел, включая способность сохранять форму и сопротивляться деформации. В пищевой индустрии гелеобразование является процессом создания текстуры, при котором жидкие компоненты превращаются в полутвердые или твердые структуры под воздействием температуры, pH или специфических добавок.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-gels.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Гель является материальной сущностью, представляющей собой дисперсную систему. Основу геля составляет трехмерная сетка из макромолекул (белков или полисахаридов), которая удерживает внутри себя низкомолекулярный растворитель, чаще всего воду. Прочность геля — это качество, определяемое плотностью связей внутри каркаса. В отличие от эмульсий, где фазы разделены, в геле полимерный каркас пронизывает весь объем, обеспечивая отсутствие текучести.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-gels.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс гелеобразования начинается с денатурации или активации молекул-полимеров. При нагревании или изменении химической среды молекулы белка или крахмала разворачиваются и начинают взаимодействовать друг с другом, образуя узлы сетки. Когда концентрация таких узлов достигает критического уровня, система теряет текучесть. Взаимодействие между цепями происходит за счет водородных связей, гидрофобных взаимодействий или ионных мостиков. Результат зависит от концентрации полимера: чем больше молекул участвует в создании каркаса, тем выше прочность и эластичность конечного продукта.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-gels.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для оценки качества гелей применяются методы реологии, измеряющие вязкоупругие свойства материала. Основным инструментом является текстурный анализатор, который измеряет силу, необходимую для разрушения структуры геля. Также используются методы микроскопии для визуализации трехмерной сетки и анализа распределения пор, заполненных жидкостью.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-gels.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии гелеобразования критически важны для создания новых пищевых продуктов. В статье «Тыква в рыбном фарше: как улучшить текстуру сурими с помощью овощного порошка» описывается, как растительные компоненты участвуют в укреплении белкового каркаса рыбного фарша, предотвращая его распад. В исследовании «Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку» показано, как коллаген из кожи рыбы формирует прочную биоразлагаемую пленку, выступая в роли структурного полимера.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-gels.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Гели чувствительны к внешним условиям. Температурные колебания могут вызвать синерезис — процесс выделения жидкости из геля из-за сжатия полимерной сетки. Также прочность геля ограничена химическим составом: наличие солей или изменение кислотности может разрушить связи между молекулами, превращая твердый гель обратно в жидкость или пасту.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Гели и желе&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%BB%D0%B5%D1%80%5D%20--%3E%7C%D0%91%D0%B0%D0%B9%D0%BB%D0%B0%D0%BD%D1%8B%D1%81%D1%83%7C%20B%5B%D2%AE%D1%88%20%D3%A9%D0%BB%D1%88%D0%B5%D0%BC%D0%B4%D1%96%20%D1%82%D0%BE%D1%80%5D%0A%20%20B%20--%3E%7C%D0%95%D1%80%D1%96%D1%82%D0%BA%D1%96%D1%88%D1%82%D1%96%20%D2%B1%D1%81%D1%82%D0%B0%D1%83%7C%20C%5B%D0%93%D0%B5%D0%BB%D1%8C%20%D2%9B%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%D1%8B%5D%0A%20%20C%20--%3E%7C%D0%A2%D0%B5%D0%BC%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D1%83%D1%80%D0%B0%20%D3%99%D1%81%D0%B5%D1%80%D1%96%7C%20D%5B%D0%94%D0%B5%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%D2%93%D0%B0%20%D1%82%D3%A9%D0%B7%D1%96%D0%BC%D0%B4%D1%96%D0%BB%D1%96%D0%BA%5D%0A%20%20C%20--%3E%7C%D0%A1%D1%8B%D1%80%D1%82%D2%9B%D1%8B%20%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D1%80%D0%BB%D0%B0%D1%80%7C%20E%5B%D0%A1%D0%B8%D0%BD%D0%B5%D1%80%D0%B5%D0%B7%D0%B8%D1%81%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-gels.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structure.html\"&gt;Текстура и физика еды&lt;/a&gt; — Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-gels.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Гель из алоэ вера против порчи манго: как сохранить свежесть фруктов&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Тыква в рыбном фарше: как улучшить текстуру сурими с помощью овощного порошка&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-gels.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D0%BB%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Гели — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm.2017.7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Biomolecular condensates: organizers of cellular biochemistry&lt;/a&gt; — обзор, Nat Rev Mol Cell Biol 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41573-020-0090-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Engineering precision nanoparticles for drug delivery&lt;/a&gt; — обзор, Nat Rev Drug Discov 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cell.2007.06.009\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;AKT/PKB signaling: navigating downstream&lt;/a&gt; — обзор, Cell 2007&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Желатин, агар, белковые гели: прочность и тающая текстура."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Гели и желе","description":"Желатин, агар, белковые гели: прочность и тающая текстура.","vcsPath":"concepts/proc-gels.md"},"headings":[{"title":"Определение","href":"concepts/proc-gels.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-gels.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-gels.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-gels.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-gels.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts
