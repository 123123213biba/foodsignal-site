            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Метод&lt;/strong&gt; · &lt;em&gt;hot air drying&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/hot-air-drying.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Технология обезвоживания пищевого сырья при повышенной температуре, способствующая протеканию реакции Майяра.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение собрано из статей выпуска автоматически и ждёт проверки редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/hot-air-drying.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Хотя сушка горячим воздухом экономична и широко используется, она часто предполагает высокие температуры, которые могут привести к значительной деградации питательных веществ, окислению липидов и образованию нежелательных привкусов.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/hot-air-drying.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;
