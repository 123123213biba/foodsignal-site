        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Метод&lt;/strong&gt; · &lt;em&gt;Fermentation&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/fermentation.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Ферментация — это процесс биологической переработки растительного сырья с помощью микроорганизмов, приводящий к изменению химического состава и появлению новых функциональных свойств продукта.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/fermentation.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Ферментация — это процесс биологической переработки органических веществ с помощью микроорганизмов или их ферментов, приводящий к изменению химического состава и появлению новых свойств продукта. В пищевой индустрии этот метод позволяет трансформировать сырье, улучшая его вкусовые качества и функциональные характеристики без сложной химической обработки.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/fermentation.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Ферментация является процессом метаболической активности микроорганизмов, таких как бактерии, дрожжи или плесневые грибы. В основе процесса лежит расщепление сложных органических соединений (углеводов, белков, липидов) на более простые молекулы. Наука, изучающая эти процессы, называется зимологией. С точки зрения биохимии, ферментация позволяет клеткам получать энергию в условиях ограниченного доступа кислорода, что фундаментально отличается от процессов клеточного дыхания, связанных с эффектом Варбурга.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/fermentation.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс начинается с подготовки субстрата — растительного или животного сырья. В него вносятся специфические штаммы микроорганизмов, которые начинают вырабатывать ферменты. Эти белки-катализаторы ускоряют химические реакции, превращая исходные нутриенты в новые соединения, такие как органические кислоты, спирты или специфические сахара. В результате изменяется pH среды, текстура и аромат продукта, а также его биологическая ценность.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/fermentation.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным инструментом является биореактор — емкость с контролируемыми параметрами температуры, влажности и аэрации. Контроль этих условий критически важен для обеспечения доминирования целевых микроорганизмов и предотвращения роста патогенной микрофлоры. Современные методы включают использование чистых культур микроорганизмов для стандартизации результата.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/fermentation.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технология широко используется для создания продуктов с заданными свойствами. Например, в статье «Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель» описывается использование бактерий для получения подсластителя из корня якона. В исследовании «Может ли сок из семян алеппской сосны укрепить кишечный барьер» рассматривается влияние ферментированного напитка на целостность клеток кишечника, что демонстрирует потенциал метода в создании функционального питания.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/fermentation.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Ферментация требует строгого соблюдения протоколов безопасности для предотвращения развития нежелательных микроорганизмов. Результаты исследований, такие как влияние на кишечный барьер, часто являются предварительными и требуют подтверждения в клинических испытаниях на людях. Также необходимо учитывать, что изменение химического состава может влиять на биодоступность нутриентов, что требует тщательного анализа в каждом конкретном случае.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Ферментация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D1%8B%5D%0A%20%20B%20--%3E%20C%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D1%8B%5D%0A%20%20D%20--%3E%20E%5B%D0%A5%D0%B8%D0%BC%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5%20%D1%80%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D0%B8%5D%0A%20%20E%20--%3E%20F%5B%D0%9D%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение проверено автоматически и ждёт утверждения редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/fermentation.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Исследователи предложили более экологичный путь: ферментацию порошка корня якона с помощью молочнокислых бактерий. Этот метод позволяет напрямую использовать фруктоолигосахариды растения без предварительного расщепления.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/fermentation.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;conversion_efficiency&lt;/td&gt;\n&lt;td&gt;&amp;gt;0.6 г маннита на 1 г ФОС&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;temperature&lt;/td&gt;\n&lt;td&gt;25°C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;duration&lt;/td&gt;\n&lt;td&gt;24 ч&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;pH&lt;/td&gt;\n&lt;td&gt;5.2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/fermentation.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;молочнокислое брожение&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/fermentation.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html\"&gt;Может ли сок из семян алеппской сосны укрепить кишечный барьер&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Конопля и овес: как ферментация меняет структуру растительного белка&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/methods.html\"&gt;Методы&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/fermentation.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — обзор, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3168/jds.s0022-0302(91)78551-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Methods for dietary fiber, neutral detergent fiber, and nonstarch polysaccharides in relation to animal nutrition&lt;/a&gt; — обзор, J Dairy Sci 1991&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41577-019-0165-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The NLRP3 inflammasome: molecular activation and regulation to therapeutics&lt;/a&gt; — обзор, Nat Rev Immunol 2019&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ферментация — это процесс биологической переработки растительного сырья с помощью микроорганизмов, приводящий к изменению химического состава и появлению новых "}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Ферментация","description":"Ферментация — это процесс биологической переработки растительного сырья с помощью микроорганизмов, приводящий к изменению химического состава и появлению новых ","vcsPath":"concepts/fermentation.md"},"headings":[{"title":"Определение","href":"concepts/fermentation.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/fermentation.html#obzor","level":2},{"title":"Теория","href":"concepts/fermentation.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/fermentation.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/fermentation.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/fermentation.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/fermentation.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Как об этом пишут в статьях","href":"concepts/fermentation.html#kak-ob-etom-pishut-v-statyah","level":2},{"title":"Справка","href":"concepts/fermentation.html#spravka","level":2},{"title":"Другие названия","href":"concepts/fermentation.html#drugie-nazvaniya","level":2},{"title":"Где встречается","href":"concepts/fermentation.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/fermentation.html#istochniki","level":2}],"title":"Ферментация"},"router":{"pathname":"concepts/fermentation","depth":2,"base":"../"},"lang":"
