        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Plant-based burger meat analogue with pea and soy protein&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-plant_based.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-plant_based.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Растительные аналоги (plant-based analogues) — это пищевые продукты, имитирующие органолептические свойства и питательную ценность продуктов животного происхождения, созданные из растительного сырья. В их основе лежат технологии переработки белков, жиров и углеводов для воспроизведения структуры, вкуса и аромата мяса, молока или яиц.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-plant_based.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Растительный аналог является видом пищевого продукта, который имитирует физико-химические свойства и сенсорные характеристики (вкус, текстуру, запах) продуктов животного происхождения. Ключевой принцип заключается в создании матричной структуры из растительных белков (изолятов), которая при термической обработке или механическом воздействии имитирует волокнистость мышечной ткани или эмульсионную стабильность молочных продуктов. Эти продукты относятся к категории «Новая еда».&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-plant_based.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс создания аналога включает выделение белка из бобовых или зерновых культур, его очистку и последующую структуризацию. Для имитации жировой фазы используются растительные масла, которые смешиваются с белками для достижения нужной консистенции. Ароматизаторы и красители добавляются для соответствия сенсорному профилю целевого продукта. Стабильность структуры обеспечивается эмульгаторами и стабилизаторами, разрешенными ТР ТС 029/2012.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-plant_based.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным методом является экструзия — процесс продавливания белковой массы через фильеры под высоким давлением и температурой, что вызывает денатурацию и переориентацию белковых молекул в волокна. Также применяются методы ферментации для улучшения вкусоароматических качеств и повышения биодоступности нутриентов. Контроль качества осуществляется на основе принципов HACCP, обеспечивающих безопасность сырья и готовой продукции.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-plant_based.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Растительные аналоги используются как альтернатива традиционным продуктам в рационе. В статье «Почему мы выбираем растительный йогурт: вкус или этикетка?» рассматривается баланс между потребительским восприятием пользы и реальными вкусовыми качествами. В материале «Скрытая угроза в чечевице и нуте: как плесень меняет растительный белок» подчеркивается важность контроля качества сырья, так как бобовые, используемые для производства изолятов, могут подвергаться воздействию микотоксинов.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-plant_based.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основными ограничениями являются наличие антинутриентов в растительном сырье и риск загрязнения микотоксинами при нарушении условий хранения. Также существует проблема усвояемости растительных белков по сравнению с животными. Потребителю важно учитывать, что состав аналогов может быть сложным, а высокая степень переработки требует строгого контроля безопасности на всех этапах производства.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Растительные аналоги&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A0%D0%B0%D1%81%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5%20%D1%81%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%92%D1%8B%D0%B4%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B1%D0%B5%D0%BB%D0%BA%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%A1%D1%82%D1%80%D1%83%D0%BA%D1%82%D1%83%D1%80%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%94%D0%BE%D0%B1%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B6%D0%B8%D1%80%D0%BE%D0%B2%5D%0A%20%20D%20--%3E%20E%5B%D0%90%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20E%20--%3E%20F%5B%D0%93%D0%BE%D1%82%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%B0%D0%BD%D0%B0%D0%BB%D0%BE%D0%B3%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-plant_based.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-newfood.html\"&gt;Новая еда&lt;/a&gt; — Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-plant_based.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Может ли продуктовая корзина заменить лекарства: опыт долгосрочной диеты&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Конопля и овес: как ферментация меняет структуру растительного белка&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Скрытая угроза в чечевице и нуте: как плесень меняет растительный белок&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;Почему мы выбираем растительный йогурт: вкус или этикетка?&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-plant_based.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%80%D0%B5%D0%B4_(%D1%80%D0%B0%D1%81%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5_%D0%BC%D0%B0%D1%81%D0%BB%D0%BE)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спред (растительное масло) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature11550\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diversity, stability and resilience of the human gut microbiota&lt;/a&gt; — обзор, Nature 2012&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — обзор, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12951-018-0392-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nano based drug delivery systems: recent developments and future prospects&lt;/a&gt; — обзор, J Nanobiotechnology 2018&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Растительные аналоги","description":"Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.","vcsPath":"concepts/proc-plant_based.md"},"headings":[{"title":"Определение","href":"concepts/proc-plant_based.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-plant_based.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-plant_based.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-plant_based.html#kak-eto-ustro
