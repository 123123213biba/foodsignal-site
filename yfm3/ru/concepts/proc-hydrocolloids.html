            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Xanthan and guar thickeners for dysphagia diets&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Ксантан, агар, пектин, каррагинан.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Загустители и гидроколлоиды — это группа пищевых добавок, которые изменяют физические свойства продуктов, увеличивая их вязкость или создавая гелевую структуру. Они позволяют контролировать текстуру, удерживать влагу и предотвращать расслоение ингредиентов. В пищевой промышленности эти вещества классифицируются как стабилизаторы и загустители, обеспечивающие стабильность эмульсий и суспензий.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Гидроколлоиды являются гидрофильными полимерами, которые при взаимодействии с водой образуют коллоидные системы. В отличие от простых растворов, эти системы обладают способностью удерживать значительные объемы жидкости внутри своей структуры. Ключевым свойством гидроколлоидов является способность к гидратации — поглощению молекул воды, что приводит к набуханию полимерных цепей и повышению вязкости среды. Они относятся к категории пищевых добавок и часто используются в сочетании с эмульгаторами для создания сложных текстур.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс загущения основан на механическом переплетении длинных молекулярных цепей полимера. Когда гидроколлоид попадает в воду, его молекулы разворачиваются и начинают взаимодействовать друг с другом, создавая трехмерную сетку. Эта сетка ограничивает подвижность молекул воды, что макроскопически проявляется как загустение. Некоторые гидроколлоиды, такие как агар или каррагинан, при охлаждении образуют упорядоченные спиральные структуры, превращая жидкость в гель.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для оценки эффективности загустителей применяются реологические методы, измеряющие вязкость и предел текучести продукта. В лабораторных условиях используются вискозиметры и текстурометры, позволяющие определить, как добавка влияет на поведение продукта при хранении и употреблении. Важным инструментом является контроль концентрации: даже малые добавки (от 0,1% до 1%) способны существенно изменить текстуру.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Гидроколлоиды используются для создания функциональных покрытий и улучшения консистенции продуктов. Например, в статье «Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими» описывается создание съедобного покрытия, где гидроколлоиды выступают основой для удержания активных компонентов на поверхности овощей. Также они незаменимы в диетах для людей с дисфагией, где загустители (ксантан, гуар) позволяют придать пище безопасную для глотания консистенцию.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основным ограничением является зависимость свойств гидроколлоидов от внешних факторов: pH среды, температуры, наличия солей и сахаров. Неправильный выбор загустителя может привести к синерезису — выделению воды из геля при хранении. Кроме того, при разработке продуктов необходимо учитывать индивидуальную переносимость и соответствие нормам безопасности, установленным регуляторами, такими как ТР ТС 029/2012.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Загустители и гидроколлоиды&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%93%D0%B8%D0%B4%D1%80%D0%BE%D0%BA%D0%BE%D0%BB%D0%BB%D0%BE%D0%B8%D0%B4%5D%20--%3E%20B%5B%D0%93%D0%B8%D0%B4%D1%80%D0%B0%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B0%D0%B1%D1%83%D1%85%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%B0%5D%0A%20%20C%20--%3E%20D%5B%D0%9E%D0%B1%D1%80%D0%B0%D0%B7%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%20%D1%81%D0%B5%D1%82%D0%BA%D0%B8%5D%0A%20%20D%20--%3E%20E%5B%D0%9F%D0%BE%D0%B2%D1%8B%D1%88%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B2%D1%8F%D0%B7%D0%BA%D0%BE%D1%81%D1%82%D0%B8%5D%0A%20%20E%20--%3E%20F%5B%D0%A1%D1%82%D0%B0%D0%B1%D0%B8%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%B3%D0%B5%D0%BB%D1%8C%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%93%D0%B8%D0%B4%D1%80%D0%BE%D0%BA%D0%BE%D0%BB%D0%BB%D0%BE%D0%B8%D0%B4%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Гидроколлоиды — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — обзор, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — обзор, PLoS Med 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/wound.2015.0635\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Challenges in the Treatment of Chronic Wounds&lt;/a&gt; — обзор, Adv Wound Care (New Rochelle) 2015&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ксантан, агар, пектин, каррагинан."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Загустители и гидроколлоиды","description":"Ксантан, агар, пектин, каррагинан.","vcsPath":"concepts/proc-hydrocolloids.md"},"headings":[{"title":"Определение","href":"concepts/proc-hydrocolloids.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-hydrocolloids.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-hydrocolloids.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-hydrocolloids.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-hydrocolloids.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-hydrocolloids.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-hydrocolloids.html#o
