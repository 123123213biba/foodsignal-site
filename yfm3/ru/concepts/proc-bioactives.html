        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Polyphenol and flavonoid content of green tea infusions&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-bioactives.jpg\" alt=\"Полифенолы и биоактивные вещества\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: No machine-readable author provided. Jorgealfonso assumed (based on copyright claims)., CC BY-SA 2.5&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Mate_en_calabaza.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-bioactives.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Полифенолы, каротиноиды, флавоноиды.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-bioactives.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Полифенолы и биоактивные вещества — это вторичные метаболиты растений, которые выполняют защитные функции в растительных организмах и оказывают влияние на физиологические процессы при употреблении в пищу. Они не являются эссенциальными нутриентами, но участвуют в метаболических реакциях, взаимодействуя с белками и микробиотой кишечника.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-bioactives.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Биоактивные вещества представляют собой широкий класс органических соединений, включая полифенолы, флавоноиды и каротиноиды. Эти молекулы являются частью защитной системы растений, обеспечивая устойчивость к ультрафиолету и патогенам. В организме человека они функционируют как модуляторы биохимических процессов. Полифенолы классифицируются по химической структуре (фенольные кислоты, флавоноиды, стильбены). Они тесно связаны с концепцией микробиоты: непереваренные полифенолы достигают толстого кишечника, где ферментируются бактериями, превращаясь в метаболиты с высокой биологической активностью.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-bioactives.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс взаимодействия полифенолов с другими компонентами пищи основан на способности молекул образовывать нековалентные связи, например, с белками. Это взаимодействие изменяет физико-химические свойства белков, например, скорость их расщепления ферментами. В пищевых системах полифенолы могут выступать в роли стабилизаторов, создавая защитные структуры вокруг молекул нутриентов, что замедляет их усвоение или защищает от окисления.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-bioactives.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для изучения биоактивных веществ применяются методы экстракции (извлечение из растительного сырья) и хроматографического анализа (разделение и идентификация соединений). В исследованиях часто оценивается антиоксидантная активность и способность соединений связываться с белками. Примером служит анализ содержания флавоноидов в настоях зеленого чая, где измеряется концентрация веществ для оценки качества продукта.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-bioactives.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии использования полифенолов внедряются в создание функциональных продуктов питания:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;В статье «Как подружить кофе и яблоки: природный катализатор для создания функциональных продуктов» описан метод использования яблочного сока для соединения кофейных антиоксидантов с молочными пептидами, что исключает применение агрессивных химических реагентов.&lt;/li&gt;\n&lt;li&gt;В статье «Как заставить сывороточный белок работать дольше: молекулярный «клей» для мышц» рассматривается создание «семенной оболочки» из полифенолов вокруг сывороточного белка, что позволяет замедлить его распад в организме.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-bioactives.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основное ограничение заключается в низкой биодоступности многих полифенолов: значительная их часть не всасывается в тонком кишечнике. Кроме того, результаты исследований in vitro (в пробирке) не всегда воспроизводятся в организме человека из-за сложного состава рациона и индивидуальных различий микробиоты. Важно помнить, что наличие биоактивных веществ в продукте не гарантирует терапевтического эффекта, а лишь указывает на потенциальное участие в метаболических процессах.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Полифенолы и биоактивные вещества&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A0%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D0%B5%5D%20--%3E%7C%D1%81%D0%B8%D0%BD%D1%82%D0%B5%D0%B7%D0%B8%D1%80%D1%83%D0%B5%D1%82%7C%20B%5B%D0%9F%D0%BE%D0%BB%D0%B8%D1%84%D0%B5%D0%BD%D0%BE%D0%BB%D1%8B%5D%0A%20%20B%20--%3E%7C%D0%B2%D0%B7%D0%B0%D0%B8%D0%BC%D0%BE%D0%B4%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D1%83%D0%B5%D1%82%7C%20C%5B%D0%91%D0%B5%D0%BB%D0%BA%D0%B8%5D%0A%20%20B%20--%3E%7C%D1%84%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B8%D1%80%D1%83%D0%B5%D1%82%D1%81%D1%8F%7C%20D%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D1%82%D0%B0%5D%0A%20%20C%20--%3E%7C%D0%B8%D0%B7%D0%BC%D0%B5%D0%BD%D1%8F%D0%B5%D1%82%7C%20E%5B%D0%A1%D0%BA%D0%BE%D1%80%D0%BE%D1%81%D1%82%D1%8C%20%D1%83%D1%81%D0%B2%D0%BE%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%7C%D0%BF%D1%80%D0%BE%D0%B8%D0%B7%D0%B2%D0%BE%D0%B4%D0%B8%D1%82%7C%20F%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D1%82%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-bioactives.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенты&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-micronutrients.html\"&gt;Витамины и минералы&lt;/a&gt; — Содержание, потери при готовке, обогащение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-bioactives.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html\"&gt;Как подружить кофе и яблоки: природный катализатор для создания функциональных продуктов&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html\"&gt;Как заставить сывороточный белок работать дольше: молекулярный «клей» для мышц&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-bioactives.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D1%82%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Мате — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Mate_en_calabaza.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: No machine-readable author provided. Jorgealfonso assumed (based on copyright claims)., CC BY-SA 2.5&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/gutjnl-2015-309990\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The gut microbiota and host health: a new clinical frontier&lt;/a&gt; — обзор, Gut 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/circulationaha.115.018585\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Dietary and Policy Priorities for Cardiovascular Disease, Diabetes, and Obesity: A Comprehensive Review&lt;/a&gt; — обзор, Circulation 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.biotechadv.2015.08.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Discovery and resupply of pharmacologically active plant-derived natural products: A review&lt;/a&gt; — обзор, Biotechnol Adv 2015&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"gener
