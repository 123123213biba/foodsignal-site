        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Maillard browning and pyrazine formation in roasted barley&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-maillard.jpg\" alt=\"Реакция Майяра и карамелизация\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: J. Patrick Fischer, CC BY 2.5&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Creme_brulee.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-maillard.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-maillard.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Реакция Майяра и карамелизация — это два ключевых процесса термической обработки пищевых продуктов, которые формируют их цвет, вкус и аромат. Оба процесса относятся к неферментативному побурению и происходят при нагревании, однако различаются химическими механизмами и необходимыми условиями.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-maillard.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Реакция Майяра (реакция меланоидинообразования) — это процесс взаимодействия восстанавливающих сахаров с аминокислотами или белками при нагревании, результатом которого является образование сложных ароматических соединений и меланоидинов. Она протекает при более низких температурах, чем карамелизация, и отвечает за формирование вкуса жареного хлеба, мяса и кофе.&lt;/p&gt;\n&lt;p&gt;Карамелизация — это процесс термического разложения сахаров, происходящий при отсутствии аминокислот, в результате которого образуются карамеланы, карамелены и карамелины. Этот процесс требует более высоких температур (обычно выше 150 °C). Оба процесса являются частью более широкой области изучения вкуса и аромата, тесно связанной с восприятием летучих соединений вкусовыми рецепторами.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-maillard.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Реакция Майяра начинается с конденсации сахара и аминогруппы, что приводит к образованию промежуточных продуктов, включая пиразины — соединения, ответственные за характерный «жареный» аромат. Скорость реакции зависит от pH среды, температуры и содержания влаги.&lt;/p&gt;\n&lt;p&gt;Карамелизация требует удаления свободной воды из продукта. Пока влага испаряется, температура поверхности остается около 100 °C, что недостаточно для начала карамелизации. Только после высыхания поверхности температура поднимается, запуская процесс деградации сахаров. Эти процессы часто протекают параллельно, создавая сложный профиль вкуса, например, в десертах типа крем-брюле.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-maillard.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для анализа результатов этих процессов применяются методы газовой хроматографии и масс-спектрометрии. Современные исследования направлены на создание высокочувствительных сенсоров. Например, в статье «Как поймать аромат жареного: новый биосенсор для определения пиразинов» описывается разработка «электронного носа» на основе человеческих рецепторов, который позволяет точно фиксировать концентрацию пиразинов, образующихся в процессе реакции Майяра в кофе и хлебе.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-maillard.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии управления реакцией Майяра и карамелизацией используются в пищевой промышленности для стандартизации вкусовых качеств продуктов. Понимание этих процессов позволяет контролировать интенсивность аромата при обжарке зерен кофе, выпечке хлебобулочных изделий и производстве кондитерских изделий.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-maillard.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основным ограничением является сложность контроля протекания реакций в домашних условиях из-за неоднородности нагрева. Кроме того, чрезмерное нагревание может привести к образованию нежелательных побочных продуктов. Важно учитывать, что данные о влиянии продуктов термической обработки на здоровье человека, включая микробиом кишечника и сердечно-сосудистую систему, продолжают изучаться в рамках крупных эпидемиологических обзоров, и любые выводы о долгосрочном воздействии требуют осторожной интерпретации.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Реакция Майяра и карамелизация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9D%D0%B0%D0%B3%D1%80%D0%B5%D0%B2%5D%20--%3E%20B%5B%D0%A0%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%20%D0%9C%D0%B0%D0%B9%D1%8F%D1%80%D0%B0%5D%0A%20%20A%20--%3E%20C%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20D%5B%D0%9F%D0%B8%D1%80%D0%B0%D0%B7%D0%B8%D0%BD%D1%8B%5D%0A%20%20B%20--%3E%20E%5B%D0%9C%D0%B5%D0%BB%D0%B0%D0%BD%D0%BE%D0%B8%D0%B4%D0%B8%D0%BD%D1%8B%5D%0A%20%20C%20--%3E%20F%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B0%D0%BD%D1%8B%5D%0A%20%20C%20--%3E%20G%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B5%D0%BD%D1%8B%5D%0A%20%20D%20--%3E%20H%5B%D0%90%D1%80%D0%BE%D0%BC%D0%B0%D1%82%5D%0A%20%20E%20--%3E%20I%5B%D0%A6%D0%B2%D0%B5%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-maillard.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-maillard.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Как поймать аромат жареного: новый биосенсор для определения пиразинов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-maillard.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Карамелизация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Creme_brulee.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: J. Patrick Fischer, CC BY 2.5&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — обзор, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001209\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2024 Heart Disease and Stroke Statistics: A Report of US and Global Data From the American Heart Association&lt;/a&gt; — обзор, Circulation 2024&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/gutjnl-2021-326789\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gut microbiome and health: mechanistic insights&lt;/a&gt; — обзор, Gut 2022&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Реакция Майяра и карамелизация","description":"Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.","vcsPath":"concepts/proc-maillard.md"},"headings":[{"title":"Определение","href":"concepts/proc-maillard.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-maillard.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-maillard.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-maillard.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-maillard.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-maillard.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-maillard.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-maillard.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-maillard.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/proc-maillard.html#istochniki","level":2}],"title":"Реакция Майяра и карамелизация"},"router":{"pathname":"concepts/proc-maillard","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
