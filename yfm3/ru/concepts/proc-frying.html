        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Oil uptake and crust formation of potato strips in deep frying and air frying&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-frying.jpg\" alt=\"Жарка во фритюре и аэрогриле\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Algont at Dutch Wikipedia, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Frituurpan-gesloten.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-frying.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-frying.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Жарка во фритюре и приготовление в аэрогриле — это процессы термической обработки продуктов, направленные на создание хрустящей корочки и изменение текстуры. Фритюр предполагает полное погружение продукта в нагретый жир, тогда как аэрогриль использует конвекцию горячего воздуха с минимальным количеством масла или без него. Оба метода значительно влияют на физико-химические свойства пищи, включая содержание влаги, липидов и образование специфических соединений.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-frying.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;В основе обоих процессов лежит реакция Майяра — химическое взаимодействие между аминокислотами и восстанавливающими сахарами, которое происходит при нагреве выше 140 °C. Результатом является формирование характерного цвета, аромата и вкуса корочки. Фритюр является видом тепловой обработки, где тепло передается через жидкую среду (масло), обладающую высокой теплоемкостью. Аэрогриль является видом конвекционного нагрева, где теплоносителем выступает поток горячего воздуха. Основное различие заключается в скорости теплопередачи и механизме обезвоживания поверхности продукта.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-frying.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;При жарке во фритюре масло проникает в поверхностные слои продукта, замещая испаряющуюся влагу. Это создает плотную, насыщенную жиром структуру. В аэрогриле интенсивный поток воздуха быстро удаляет влагу с поверхности, способствуя образованию корочки без глубокого проникновения жира. В обоих случаях критически важным является контроль температуры: при превышении определенных значений в крахмалосодержащих продуктах может образовываться акриламид — органическое соединение, возникающее как побочный продукт реакции Майяра.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-frying.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Фритюрница — аппарат для жарки, обеспечивающий поддержание стабильной температуры масла. Аэрогриль — устройство, использующее вентилятор для циркуляции горячего воздуха вокруг продукта, помещенного в перфорированную корзину. Эффективность методов оценивается по органолептическим показателям (текстура, цвет) и химическому составу (содержание жира, влажность).&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-frying.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии используются для приготовления широкого спектра продуктов, от картофеля до белковых концентратов. Например, в статье «Хрустящие личинки пальмового долгоносика: белковый концентрат с неожиданными рисками» показано, что жарка и запекание удваивают долю белка в личинках, однако требуют осторожности из-за потенциального накопления тяжелых металлов в процессе обработки.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-frying.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основное ограничение фритюра — высокое содержание жиров в конечном продукте, что при избыточном потреблении связывают с рисками для сердечно-сосудистой системы. Аэрогриль позволяет снизить калорийность, но не исключает образование акриламида при перегреве. Важно учитывать, что термическая обработка не нейтрализует химические загрязнения, такие как тяжелые металлы, присутствующие в исходном сырье.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Жарка во фритюре и аэрогриле&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%20--%3E%20B%5B%D0%A2%D0%B5%D0%BF%D0%BB%D0%BE%D0%B2%D0%B0%D1%8F%20%D0%BE%D0%B1%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D0%BA%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%A4%D1%80%D0%B8%D1%82%D1%8E%D1%80%5D%0A%20%20B%20--%3E%20D%5B%D0%90%D1%8D%D1%80%D0%BE%D0%B3%D1%80%D0%B8%D0%BB%D1%8C%5D%0A%20%20C%20--%3E%20E%5B%D0%A0%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%20%D0%9C%D0%B0%D0%B9%D1%8F%D1%80%D0%B0%5D%0A%20%20D%20--%3E%20E%0A%20%20E%20--%3E%20F%5B%D0%A5%D1%80%D1%83%D1%81%D1%82%D1%8F%D1%89%D0%B0%D1%8F%20%D0%BA%D0%BE%D1%80%D0%BE%D1%87%D0%BA%D0%B0%5D%0A%20%20C%20--%3E%20G%5B%D0%92%D0%BF%D0%B8%D1%82%D1%8B%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B0%D1%81%D0%BB%D0%B0%5D%0A%20%20D%20--%3E%20H%5B%D0%9A%D0%BE%D0%BD%D0%B2%D0%B5%D0%BA%D1%86%D0%B8%D1%8F%20%D0%B2%D0%BE%D0%B7%D0%B4%D1%83%D1%85%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-frying.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-frying.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html\"&gt;Как перестать гадать, сколько вы съели: цифровой атлас порций&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/nutritional-composition-chemical-safety-and-microbiological.html\"&gt;Хрустящие личинки пальмового долгоносика: белковый концентрат с неожиданными рисками&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-frying.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D1%80%D0%B8%D1%82%D1%8E%D1%80%D0%BD%D0%B8%D1%86%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Фритюрница — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Frituurpan-gesloten.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Algont at Dutch Wikipedia, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — обзор, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1289/ehp.7339\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nanotoxicology: an emerging discipline evolving from studies of ultrafine particles&lt;/a&gt; — обзор, Environ Health Perspect 2005&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.4161/oxim.2.5.9498\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Plant polyphenols as dietary antioxidants in human health and disease&lt;/a&gt; — обзор, Oxid Med Cell Longev 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Впитывание масла, корочка, акриламид, аэрофритюр против фритюра."}],"style":["_assets/biosignal.css","_assets/cut-extension.c
