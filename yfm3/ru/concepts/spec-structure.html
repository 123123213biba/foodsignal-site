        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-structure.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-structure.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Текстура еды является совокупностью физических свойств продукта, воспринимаемых осязанием, зрением и слухом. Она определяется внутренней структурой материала, распределением компонентов и силами взаимодействия между ними. Понимание физики текстуры позволяет предсказывать поведение продуктов при хранении, термической обработке и употреблении.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-structure.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Текстура базируется на реологии — науке о деформации и течении материи. Пищевые продукты представляют собой сложные коллоидные системы: эмульсии, пены, гели и кристаллы. В основе этих структур лежат макромолекулы (белки, полисахариды, липиды), которые образуют каркасы или удерживают влагу. Физические свойства зависят от того, как эти молекулы организованы в пространстве: в виде упорядоченной кристаллической решетки, хаотичной сетки геля или дисперсной фазы в эмульсии.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-structure.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Структура еды формируется через фазовые переходы и создание межмолекулярных связей. Например, при нагревании белки денатурируют и образуют трехмерную сеть, удерживающую воду, что создает текстуру геля. В эмульсиях капли жира распределены в водной среде, а стабилизаторы предотвращают их слияние. Кристаллизация сахара или жира создает твердую, хрустящую или гладкую текстуру в зависимости от размера и формы кристаллов.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-structure.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для анализа текстуры применяются инструментальные методы, такие как текстурный профильный анализ (TPA), измеряющий твердость, адгезивность и упругость образца при сжатии. Реологические исследования определяют вязкость и предел текучести. Также используются микроскопические методы для визуализации распределения компонентов внутри матрицы продукта.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-structure.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Принципы управления текстурой используются для улучшения качества продуктов. В статье «Тыква в рыбном фарше: как улучшить текстуру сурими с помощью овощного порошка» описывается, как растительные добавки изменяют взаимодействие белков, повышая плотность и упругость фарша. В работе «Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку» рассматривается создание биоразлагаемых пленок, где физические свойства белкового матрикса обеспечивают прочность и барьерные функции материала.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-structure.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основное ограничение заключается в сложности биологических систем: состав сырья может варьироваться, что влияет на конечный результат. Лабораторные модели не всегда точно воспроизводят условия промышленного производства. При масштабировании процессов важно учитывать, что малые изменения в температуре или скорости перемешивания могут привести к изменению фазового состояния продукта.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Текстура и физика еды&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%20%D1%82%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%D1%81%D1%8B%5D%20--%3E%20B%5B%D0%A0%D0%B5%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20B%20--%3E%20C%5B%D0%AD%D0%BC%D1%83%D0%BB%D1%8C%D1%81%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20B%20--%3E%20D%5B%D0%93%D0%B5%D0%BB%D1%8C%D0%B4%D0%B5%D1%80%5D%0A%20%20B%20--%3E%20E%5B%D0%9A%D1%80%D0%B8%D1%81%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20F%5B%D0%A2%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D1%8B%D0%BB%D1%8B%D2%9B%5D%0A%20%20D%20--%3E%20F%0A%20%20E%20--%3E%20F%0A%20%20F%20--%3E%20G%5B%D0%A2%D2%B1%D1%82%D1%8B%D0%BD%D1%83%D1%88%D1%8B%D0%BB%D1%8B%D2%9B%20%D1%81%D0%B0%D0%BF%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-structure.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gels.html\"&gt;Гели и желе&lt;/a&gt; — Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-structure.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Гель из алоэ вера против порчи манго: как сохранить свежесть фруктов&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html\"&gt;Цинк против углеводного стресса: как накормить рыбу правильно&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html\"&gt;Кристаллы каннабидиола в БАДах: европейский регулятор не признал безопасность изолята&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Тыква в рыбном фарше: как улучшить текстуру сурими с помощью овощного порошка&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-structure.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Survivalcraft\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Survivalcraft — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — обзор, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — обзор, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — обзор, Nature 2015&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Текстура и физика еды","description":"Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.","vcsPath":"concepts/spec-structure.md"},"headings":[{"title":"Определение","href":"concepts/spec-structure.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/spec-structure.html#obzor","level":2},{"title":"Теория","href":"concepts/spec-structure.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/sp
