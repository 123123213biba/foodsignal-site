        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;High-moisture extrusion of pea protein into fibrous texture&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-extrusion.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Хлопья, снеки, текстурированный белок: как работает экструдер.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-extrusion.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Экструзия — это технологический процесс получения изделий путём продавливания вязкого материала или густой пасты через формующее отверстие. В пищевой промышленности этот метод позволяет трансформировать сырье в продукты с заданной структурой, формой и текстурой, такие как сухие завтраки, снеки или текстурированные растительные белки.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-extrusion.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Процесс экструзии основывается на воздействии механического сдвига, давления и температуры на пищевое сырье. Внутри экструдера материал переходит в состояние вязкого расплава. Основные принципы процесса включают деформацию, перемешивание и формование. В отличие от выпечки или жарки, где тепло передается преимущественно через поверхность, экструзия сочетает термическую обработку с интенсивным механическим воздействием. Это позволяет изменять физико-химические свойства компонентов, например, крахмалов и белков, создавая новые текстуры, которые невозможно получить традиционными методами.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-extrusion.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Система экструзии состоит из загрузочного бункера, шнекового механизма и формующей головки. Сырье подается в камеру, где вращающиеся шнеки создают высокое давление и обеспечивают перемешивание. В процессе движения материал подвергается нагреву, что снижает его вязкость и способствует гомогенизации. На выходе расплав проходит через фильеру — отверстие определенной формы, которое придает продукту конечный вид. После выхода из экструдера продукт (экструдат) быстро остывает и фиксирует свою структуру.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-extrusion.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным инструментом является экструдер. В зависимости от конструкции шнеков выделяют одношнековые и двухшнековые системы. Двухшнековые экструдеры обеспечивают более точный контроль над временем пребывания материала в камере и интенсивностью сдвиговых нагрузок. Современные методы включают высокотемпературную экструзию с короткой выдержкой, что позволяет минимизировать термическую деградацию нутриентов при сохранении желаемых структурных изменений.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-extrusion.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технология используется для создания широкого спектра продуктов. Например, в статье «Экструзия против сахарного пика: как обработка сырья меняет усвоение шоколада» показано, что предварительная экструзия сахара и молока существенно меняет гликемический ответ организма на готовое изделие. Также метод незаменим при производстве текстурированного растительного белка, где экструзия позволяет имитировать волокнистую структуру мяса.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-extrusion.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основным ограничением является необходимость строгого контроля параметров: температуры, влажности сырья и скорости вращения шнеков. Неправильный подбор режима может привести к потере питательной ценности или нежелательным изменениям вкусовых качеств. Кроме того, экструзия — это энергоемкий процесс, требующий специализированного оборудования и соблюдения протоколов безопасности для предотвращения перегрева или блокировки системы.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Экструзия&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A8%D0%B8%D0%BA%D1%96%D0%B7%D0%B0%D1%82%5D%20--%3E%20B%5B%D0%96%D2%AF%D0%BA%D1%82%D0%B5%D1%83%20%D0%B1%D1%83%D0%BD%D0%BA%D0%B5%D1%80%D1%96%5D%0A%20%20B%20--%3E%20C%5B%D0%A8%D0%BD%D0%B5%D0%BA%20%D0%BC%D0%B5%D1%85%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D1%96%5D%0A%20%20C%20--%3E%7C%D2%9A%D1%8B%D1%81%D1%8B%D0%BC%20%D0%BC%D0%B5%D0%BD%20%D0%B6%D1%8B%D0%BB%D1%83%7C%20D%5B%D0%9F%D1%96%D1%88%D1%96%D0%BD%D0%B4%D0%B5%D1%83%D1%88%D1%96%20%D0%B1%D0%B0%D1%81%D1%82%D0%B8%D0%B5%D0%BA%5D%0A%20%20D%20--%3E%20E%5B%D0%A4%D0%B8%D0%BB%D1%8C%D0%B5%D1%80%D0%B0%5D%0A%20%20E%20--%3E%20F%5B%D0%94%D0%B0%D0%B9%D1%8B%D0%BD%20%D1%8D%D0%BA%D1%81%D1%82%D1%80%D1%83%D0%B4%D0%B0%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-extrusion.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-extrusion.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Экструзия против сахарного пика: как обработка сырья меняет усвоение шоколада&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-extrusion.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AD%D0%BA%D1%81%D1%82%D1%80%D1%83%D0%B7%D0%B8%D1%8F_(%D1%82%D0%B5%D1%85%D0%BD%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%81)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Экструзия (технологический процесс) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — обзор, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/bjc.1972.33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a basic biological phenomenon with wide-ranging implications in tissue kinetics&lt;/a&gt; — обзор, Br J Cancer 1972&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm2330\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Membrane lipids: where they are and how they behave&lt;/a&gt; — обзор, Nat Rev Mol Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Хлопья, снеки, текстурированный белок: как работает экструдер."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Экструзия","description":"Хлопья, снеки, текстурированный белок: как работает экструдер.","vcsPath":"concepts/proc-
