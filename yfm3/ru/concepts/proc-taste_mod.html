            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Sugar reduction in yogurt using stevia and allulose blends&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-taste_mod.jpg\" alt=\"Сахарозаменители и управление вкусом\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Sergio Calleja (Life is a trip), CC BY-SA 2.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Old_Mods_photo.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Как снизить сахар и соль без потери вкуса.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Сахарозаменители — это вещества и химические соединения, придающие пищевым продуктам сладкий вкус и применяемые вместо сахара и близких ему подсластителей. Процесс управления вкусом при снижении сахара направлен на сохранение сенсорного профиля продукта при изменении его состава. Основная задача заключается в компенсации потери объема, текстуры и специфического послевкусия, которые сахар обеспечивает помимо сладости.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Восприятие сладкого вкуса основано на взаимодействии молекул подсластителя с рецепторами T1R2 и T1R3 на поверхности вкусовых клеток. Сахарозаменители делятся на интенсивные подсластители (обладают сладостью в сотни раз выше сахарозы) и объемные сахарозаменители (полиолы, углеводы, близкие по массе к сахару). Управление вкусом требует учета синергии: сочетание нескольких веществ часто позволяет достичь профиля сладости, максимально близкого к сахарозе, при снижении общей калорийности.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс замены сахара включает выбор агента, который имитирует не только вкус, но и физические свойства сахара. Сахар участвует в реакциях Майяра и карамелизации, влияя на цвет и аромат. При использовании интенсивных подсластителей, таких как стевия, необходимо добавлять наполнители для восстановления текстуры. Современные методы используют микробиологический синтез для получения редких сахаров или натуральных подсластителей, что позволяет избежать сложной химической обработки.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным инструментом является сенсорный анализ, проводимый панелью экспертов согласно стандартам ISO. Технологический процесс включает подбор смесей (блендов), где один компонент маскирует горечь другого, а другой обеспечивает начальный «удар» сладости. Использование бактериальной ферментации позволяет получать функциональные ингредиенты из растительного сырья, сохраняя их природную структуру.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии снижения сахара активно внедряются в молочную промышленность. Например, в статье «Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель» описывается метод получения подсластителя из корня якона с помощью бактерий. Также популярны комбинации стевии и аллюлозы для производства йогуртов, позволяющие снизить содержание сахара без потери органолептических качеств.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главное ограничение — изменение текстуры и стабильности продукта. Многие сахарозаменители имеют иное время наступления сладости и длительность послевкусия по сравнению с сахарозой. Также существуют регуляторные ограничения: использование добавок должно соответствовать ТР ТС 021/2011 и 029/2012, а дозировки не должны превышать установленные нормы безопасности (ДСП/ADI), определенные JECFA и EFSA.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Сахарозаменители и управление вкусом&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20C%5B%D0%A2%D3%99%D1%82%D1%82%D1%96%D0%BB%D0%B5%D0%BD%D0%B4%D1%96%D1%80%D0%B3%D1%96%D1%88%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%D0%BB%D1%8B%D2%9B%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D3%A8%D0%BD%D1%96%D0%BC%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D1%83%D1%80%D0%B0%D1%81%D1%8B%5D%0A%20%20E%20--%3E%20F%5B%D0%A2%D2%B1%D1%82%D1%8B%D0%BD%D1%83%D1%88%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%B0%D1%85%D0%B0%D1%80%D0%BE%D0%B7%D0%B0%D0%BC%D0%B5%D0%BD%D0%B8%D1%82%D0%B5%D0%BB%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Сахарозаменители — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Old_Mods_photo.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Sergio Calleja (Life is a trip), CC BY-SA 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s00018-006-6077-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Natural sweet macromolecules: how sweet proteins work&lt;/a&gt; — обзор, Cell Mol Life Sci 2006&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Как снизить сахар и соль без потери вкуса."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Сахарозаменители и управление вкусом","description":"Как снизить сахар и соль без потери вкуса.","vcsPath":"concepts/proc-taste_mod.md"},"headings":[{"title":"Определение","href":"concepts/proc-taste_mod.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-taste_mod.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-taste_mod.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-taste_mod.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-taste_mod.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-taste_mod.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-taste_mod.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-tast
