        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Материал&lt;/strong&gt; · &lt;em&gt;CTS-ZnO&amp;amp;CA hydrogel&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Съедобное гидрогелевое покрытие на базе хитозана, наночастиц оксида цинка и хлорогеновой кислоты с добавлением бета-глицерофосфата, обладающее антибактериальными и антиоксидантными свойствами для защиты плодов от порчи.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение собрано из статей выпуска автоматически и ждёт проверки редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Для комплексной защиты разработан гидрогель CTS-ZnO&amp;amp;CA с массовым соотношением хитозана, наночастиц оксида цинка (ZnO) и экстрагированной из жимолости хлорогеновой кислоты (CA) 1:0,1:0,1.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Хитозановая невидимая броня против гниения томатов и цитрусов&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;соотношение компонентов&lt;/td&gt;\n&lt;td&gt;1:0,1:0,1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;размер пор&lt;/td&gt;\n&lt;td&gt;10–30 мкм&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;съедобное гидрогелевое покрытие&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Хитозановая невидимая броня против гниения томатов и цитрусов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/materials.html\"&gt;Материалы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Съедобное гидрогелевое покрытие на базе хитозана, наночастиц оксида цинка и хлорогеновой кислоты с добавлением бета-глицерофосфата, обладающее антибактериальным"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"гидрогель CTS-ZnO&amp;CA","description":"Съедобное гидрогелевое покрытие на базе хитозана, наночастиц оксида цинка и хлорогеновой кислоты с добавлением бета-глицерофосфата, обладающее антибактериальным","vcsPath":"concepts/cts-zno-ca-hydrogel.md"},"headings":[{"title":"Определение","href":"concepts/cts-zno-ca-hydrogel.html#opredelenie","level":2},{"title":"Как об этом пишут
