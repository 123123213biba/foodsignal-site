        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Метод&lt;/strong&gt; · &lt;em&gt;Extrusion&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/extrusion.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Экструзия — это процесс непрерывного смешивания и замешивания сырья при высоких температурах и давлении, применяемый для изменения структуры пищевых компонентов. Технология используется в производстве снеков, сухих завтраков и текстуратов из растительных белков.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/extrusion.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Экструзия — это процесс непрерывного смешивания, сжатия и термической обработки пищевого сырья при прохождении через формующее отверстие. Технология позволяет изменять физико-химические свойства ингредиентов, создавая продукты с заданной текстурой и структурой. В пищевой промышленности метод превращает порошкообразные или вязкие смеси в готовые формы, такие как снеки, сухие завтраки или текстурированные растительные белки.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/extrusion.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;В основе экструзии лежит принцип приложения механического усилия к материалу в условиях ограниченного пространства. Внутри экструдера сырье подвергается воздействию сжимающих и сдвиговых напряжений. Высокая температура и давление вызывают денатурацию белков и желатинизацию крахмала. Эти процессы меняют молекулярную архитектуру компонентов, что влияет на их функциональность, усвояемость и сенсорные характеристики. Метод позволяет работать с хрупкими материалами, так как они испытывают преимущественно сжимающие нагрузки, что минимизирует риск разрушения структуры до момента формования.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/extrusion.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс начинается с подачи сырья в загрузочный бункер. Внутри цилиндрического корпуса вращается шнек, который перемещает массу, постепенно уплотняя её. По мере продвижения материал нагревается за счет трения и внешних нагревательных элементов. В зоне высокого давления происходит интенсивное смешивание. На выходе масса продавливается через матрицу (фильеру) — металлическую пластину с отверстиями определенного профиля. При выходе из матрицы резкое падение давления приводит к расширению продукта, что формирует его пористую структуру.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/extrusion.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным инструментом является экструдер. Он состоит из электродвигателя, системы подачи, цилиндра с одним или двумя шнеками и матрицы. Современные системы оснащены датчиками температуры и давления, которые позволяют контролировать параметры процесса в реальном времени. Выбор конфигурации шнека зависит от требуемой степени измельчения и перемешивания компонентов.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/extrusion.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технология используется для модификации свойств продуктов. В статье «Экструзия против сахарного пика: как обработка сырья меняет усвоение шоколада» показано, что предварительная экструзия сахара и молока влияет на гликемический ответ организма, изменяя скорость усвоения компонентов. Также метод применяется в производстве растительных аналогов мяса. Однако существуют риски: в статье «Скрытая угроза в чечевице и нуте: как плесень меняет растительный белок» отмечается, что при работе с бобовыми культурами важно контролировать качество сырья, так как микотоксины могут оставаться в изолятах после обработки.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/extrusion.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Экструзия — это высокоэнергозатратный процесс, требующий точного соблюдения температурных режимов. Неправильные параметры могут привести к деградации питательных веществ или нежелательным изменениям вкуса. Кроме того, технология не всегда способна полностью нейтрализовать биологические загрязнения, такие как микотоксины, если они присутствовали в исходном сырье. Эффективность метода зависит от влажности, состава и размера частиц подаваемого материала.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Экструзия&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A8%D0%B8%D0%BA%D1%96%D0%B7%D0%B0%D1%82%20%D0%B1%D0%B5%D1%80%D1%83%5D%20--%3E%20B%5B%D0%A8%D0%BD%D0%B5%D0%BA%D0%BF%D0%B5%D0%BD%20%D1%81%D1%8B%D2%93%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%A2%D0%B5%D1%80%D0%BC%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D3%A9%D2%A3%D0%B4%D0%B5%D1%83%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%20%D0%B0%D1%80%D2%9B%D1%8B%D0%BB%D1%8B%20%D0%BF%D1%96%D1%88%D1%96%D0%BD%D0%B4%D0%B5%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D2%9A%D1%8B%D1%81%D1%8B%D0%BC%D0%BD%D1%8B%D2%A3%20%D1%82%D3%A9%D0%BC%D0%B5%D0%BD%D0%B4%D0%B5%D1%83%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%94%D0%B0%D0%B9%D1%8B%D0%BD%20%D3%A9%D0%BD%D1%96%D0%BC%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение проверено автоматически и ждёт утверждения редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/extrusion.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Экструзия — процесс непрерывного смешивания и замешивания при высоких температурах и давлении — широко используется в производстве снеков и сухих завтраков. Исследования показывают, что экструзия может изменять структуру крахмала и липидов, влияя на их перевариваемость.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Экструзия против сахарного пика: как обработка сырья меняет усвоение шоколада&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/extrusion.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;температура&lt;/td&gt;\n&lt;td&gt;105 °C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;давление&lt;/td&gt;\n&lt;td&gt;0,05 МПа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/extrusion.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;термомеханическая пластификация&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/extrusion.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Экструзия против сахарного пика: как обработка сырья меняет усвоение шоколада&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Скрытая угроза в чечевице и нуте: как плесень меняет растительный белок&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/methods.html\"&gt;Методы&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/extrusion.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Extrusion\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extrusion — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" ta
