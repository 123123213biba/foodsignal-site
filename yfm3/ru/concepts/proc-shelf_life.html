        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Predicting shelf life of fresh bread with accelerated storage tests&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-shelf_life.jpg\" alt=\"Срок годности\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Edward Betts, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Expiration.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Порча, прогнозирование срока хранения.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Срок годности — это период времени, в течение которого пищевой продукт сохраняет свои качественные характеристики и остается безопасным для употребления при соблюдении условий хранения. Этот показатель является ключевым инструментом управления качеством, позволяющим минимизировать риски для здоровья потребителя и сократить количество пищевых отходов.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Срок годности представляет собой информационную сущность, основанную на прогнозировании деградационных процессов. Процесс порчи продукта — это совокупность физико-химических и микробиологических изменений, таких как окисление липидов, ферментативное разложение или рост патогенных микроорганизмов. Безопасность продукта определяется отсутствием токсичных концентраций продуктов распада или патогенов. Срок годности тесно связан с концепциями «Микробная безопасность» и «Упаковка и миграция», так как барьерные свойства упаковки напрямую влияют на скорость протекания процессов порчи.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Определение срока годности базируется на моделировании скорости деградации. В основе лежат кинетические уравнения, описывающие зависимость скорости химических реакций от внешних факторов: температуры, влажности, освещенности и состава газовой среды. Производители используют ускоренные испытания, при которых продукт помещается в стрессовые условия, чтобы спрогнозировать его поведение при нормальном хранении. Если критический порог качества (например, уровень альдегидов в масле или вздутие упаковки из-за газообразования) достигается раньше установленного времени, срок годности корректируется.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для оценки стабильности применяются аналитические методы: хроматография для определения продуктов окисления, микробиологические посевы для контроля патогенов и сенсорный анализ (дегустация) для оценки органолептических свойств. Современные подходы включают использование защитных покрытий, таких как хитозановые гидрогели, которые замедляют потерю влаги и рост бактерий. Также активно внедряются методы математического моделирования, позволяющие предсказывать срок хранения на основе данных о составе продукта и параметрах окружающей среды.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Принципы прогнозирования срока годности критически важны для предотвращения порчи продуктов. Например, в статье «Почему вздувается упаковка васаби и как это остановить» рассматривается проблема газообразования, требующая изменения условий упаковки. Исследование «Мясо в масле на свету портит жир быстрее, чем кажется» демонстрирует, как внешние факторы, такие как свет, ускоряют окисление, сокращая срок годности. В работе «Хитозановая невидимая броня против гниения томатов и цитрусов» показано применение защитных технологий для продления жизни свежих овощей и фруктов.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Прогнозирование срока годности — это вероятностная модель, а не абсолютная гарантия. Ускоренные испытания не всегда точно отражают реальные условия логистики и хранения в домашних условиях. Кроме того, ультраобработанные продукты, часто имеющие длительные сроки хранения, могут нести скрытые риски для здоровья, что подчеркивается в метаанализе «Хрустящие снеки и готовая еда: метаанализ на 8,8 млн человек показал скрытую цену ультраобработки». Важно помнить, что срок годности действителен только при строгом соблюдении условий хранения, указанных на упаковке.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Срок годности&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%82%D2%9B%D1%8B%20%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D1%80%D0%BB%D0%B0%D1%80%5D%20--%3E%7C%D3%98%D1%81%D0%B5%D1%80%20%D0%B5%D1%82%D0%B5%D0%B4%D1%96%7C%20B%5B%D0%94%D0%B5%D0%B3%D1%80%D0%B0%D0%B4%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20B%20--%3E%7C%D3%A8%D0%B7%D0%B3%D0%B5%D1%80%D1%96%D1%81%D1%82%D0%B5%D1%80%7C%20C%5B%D0%A1%D0%B0%D0%BF%D0%B0%20%D0%BA%D3%A9%D1%80%D1%81%D0%B5%D1%82%D0%BA%D1%96%D1%88%D1%82%D0%B5%D1%80%D1%96%5D%0A%20%20C%20--%3E%7C%D0%91%D0%B0%D2%9B%D1%8B%D0%BB%D0%B0%D1%83%7C%20D%5B%D0%96%D0%B0%D1%80%D0%B0%D0%BC%D0%B4%D1%8B%D0%BB%D1%8B%D2%9B%20%D0%BC%D0%B5%D1%80%D0%B7%D1%96%D0%BC%D1%96%5D%0A%20%20D%20--%3E%7C%D0%A8%D0%B5%D0%BA%D1%82%D0%B5%D1%83%7C%20E%5B%D2%9A%D0%B0%D1%83%D1%96%D0%BF%D1%81%D1%96%D0%B7%D0%B4%D1%96%D0%BA%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt; — Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-packaging.html\"&gt;Упаковка и миграция&lt;/a&gt; — Пластик, биоразлагаемые плёнки, миграция веществ в еду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-contaminants.html\"&gt;Загрязнители процесса&lt;/a&gt; — Акриламид, ПАУ, фуран: как образуются и как снизить.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbial.html\"&gt;Микробная безопасность&lt;/a&gt; — Патогены, биоплёнки, обеззараживание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergens.html\"&gt;Аллергены&lt;/a&gt; — Выявление и снижение аллергенности.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html\"&gt;Мясо в масле на свету портит жир быстрее, чем кажется&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Хитозановая невидимая броня против гниения томатов и цитрусов&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html\"&gt;Хрустящие снеки и готовая еда: метаанализ на 8,8 млн человек показал скрытую цену ультраобработки&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html\"&gt;Почему вздувается упаковка васаби и как это остановить&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html\"&gt;Может ли коллаген защитить желудок от последствий алкоголя&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%80%D0%BE%D0%BA_%D0%B3%D0%BE%D0%B4%D0%BD%D0%BE%D1%81%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Срок годности — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Expiration.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Edward Betts, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/j.1364-3703.2011.00783.x\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Top 10 fungal pathogens in molecular plant pathology&lt;/a&gt; — обзор, Mol Plant Pathol 2012&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/pharmaceutics10020057\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Impact of Particle Size and Polydispersity Index on the Clinical Applications of Lipidic Nanocarrier Systems&lt;/a&gt; — обзор, Pharmaceutics 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/j.1753-4887.2011.00456.x\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global nutrition transition and the pandemic of obesity in developing countries&lt;/a&gt; — обзор, Nutr Rev 2012&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Порча, прогнозирование срока хранения."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Срок годности","description":"Порча, прогнозирование срока хранения.","vcsPath":"concepts/proc-shelf_life.md"},"headings":[{"title":"Определение","href":"concepts/proc-shelf_life.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-shelf_life.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-shelf_life.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-shelf_life.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-shelf_life.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-shelf_life.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-shelf_life.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-shelf_life.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-shelf_life.html#gde-vstrechaetsya","level":2},{"ti
