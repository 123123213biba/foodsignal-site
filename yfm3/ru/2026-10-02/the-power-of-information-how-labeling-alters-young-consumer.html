        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"140\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"500\" cy=\"240\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему мы выбираем&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;растительный йогурт: вкус&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;или этикетка?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Исследование показало, что при выборе растительных альтернатив йогурту потребители ориентируются прежде всего на сенсорные ощущения. Хотя информация о составе и пользе формирует ожидания, она не может компенсировать низкое качество вкуса и текстуры. Кокосовый йогурт оказался наиболее близким к молочному аналогу по восприятию.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Вкус, кремовость и густота — ключевые факторы, определяющие выбор потребителя.&lt;/li&gt;\n&lt;li&gt;Кокосовый йогурт показал наилучшие сенсорные показатели среди растительных аналогов.&lt;/li&gt;\n&lt;li&gt;Информация на этикетке не спасает продукт, если его вкус не оправдывает ожиданий.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В эксперименте участвовали 77 молодых потребителей, которые оценивали кокосовые, овсяные, соевые и кешью-йогурты. Физико-химические показатели, включая pH и синерезис (&lt;a href=\"concepts/sinerezis.html\"&gt;отделение сыворотки&lt;/a&gt;), измерялись при 4 °C. Сенсорный профиль определялся методом CATA (&lt;a href=\"concepts/check-all-that-apply.html\"&gt;Check-All-That-Apply&lt;/a&gt;), где участники выбирали характеристики из 18 предложенных дескрипторов.&lt;/p&gt;\n&lt;p&gt;Результаты показали, что вкус, кремовость и густота являются главными драйверами симпатии. Напротив, «пустой» вкус, серый оттенок и жидкая консистенция снижали оценки. Кокосовый вариант показал лучшие результаты, максимально приближаясь к молочному йогурту. Информация на этикетке влияла на ожидания, но итоговое решение о покупке зависело от того, подтвердил ли реальный вкус эти обещания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на ограниченной группе из 77 человек, преимущественно молодых, что может не отражать мнение всей популяции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Мировой рынок растительных альтернатив молочным продуктам оценивался примерно в 36,8 млрд долларов США в 2025 году и, как ожидается, достигнет почти 96 млрд долларов США к 2033 году. Растительные напитки доминируют в этой категории, но именно альтернативы йогурту составляют самый быстрорастущий подсегмент. Розничные данные с развитых европейских рынков, таких как Германия и Франция, указывают на относительно ограниченный рост альтернатив йогурту на растительной основе, тогда как более сильный рост наблюдается в Испании, Нидерландах и Великобритании, что отражает различия в стадии развития рынка в разных европейских странах. Европейские потребители, сокращающие потребление мяса, также склонны чаще употреблять растительные альтернативы йогурту. В Европе в 2023 году растительные альтернативы йогурту были вторым по частоте потребления продуктом на растительной основе среди флекситарианцев после растительных напитков. Сдвиг в сторону альтернатив йогурту может быть связан с их потенциалом по снижению негативного воздействия на окружающую среду, связанного с молочным животноводством, которое признано ресурсоемким, особенно из-за значительных потребностей в земельных ресурсах, а также затрат воды и кормов, способствующих выбросам парниковых газов. Этот растущий интерес также обусловлен заботой о здоровье, поскольку растительные йогурты являются альтернативным источником белка для веганов и потребителей с непереносимостью лактозы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Растительные альтернативы йогурту — самый быстрорастущий сегмент рынка, привлекающий потребителей экологичностью и пользой для здоровья, несмотря на технологические сложности с текстурой и вкусом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для разработки ферментированных растительных аналогов молочных продуктов можно использовать множество различных растений, включая бобовые, семена (в основном масличные), орехи, зерновые (злаки и псевдозлаки) и даже фруктовые пюре. Эти ингредиенты влияют не только на пищевую ценность растительной альтернативы йогурту, но и на текстуру и вкус. По сравнению с молочным йогуртом, растительные альтернативы содержат уникальные фитохимические компоненты и пищевые волокна, но большинство из них имеют низкое содержание белка, за исключением нута и сои. Более того, нежелательные привкусы, такие как бобовый, ореховый и «красочный» (окисленный), выявленные ранее в растительных альтернативах йогурту, могут снизить потребительское признание, так же как водянистая, жидкая и расслоившаяся текстура. Текстурные свойства, особенно гелевые структуры и удержание влаги, слабее в растительных альтернативах йогурту; поэтому добавление стабилизаторов встречается чаще, чем в молочных продуктах. Вкус признан важным ограничивающим фактором приемлемости и рыночного потенциала растительных продуктов. В настоящее время сенсорное качество обычного растительного йогурта довольно низкое, и его улучшение остается критически важным.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/krasochnyy-painty-privkus.html\"&gt;Красочный» (painty) привкус&lt;/a&gt; — это специфический дефект вкуса, напоминающий запах масляной краски, часто возникающий при окислении жиров в растительном сырье.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt; молочнокислыми бактериями представляется экологически чистым, безопасным и мягким решением для устранения посторонних привкусов и образования летучих соединений, которые придают конечному продукту богато насыщенный вкусовой профиль. В ферментированных растительных продуктах это также улучшает функциональные, питательные и текстурные свойства. Если сенсорное качество пищи не соответствует ожиданиям потребителей, это может привести к снижению общего уровня принятия. Сенсорные характеристики пищи признаны ключевыми факторами потребительского выбора и общего предпочтения. Ожидания играют чрезвычайно важную роль в принятии пищи; они в основном основаны на предыдущем опыте работы с аналогичным продуктом, особенно на визуальном восприятии и информации с упаковки и этикетки продукта. Влияние упаковки, брендинга, маркировки и суждений приписывается сложным психологическим механизмам, главным образом когнитивным ожиданиям, которые влияют на фактические суждения о продукте. Оценка потребителями пищевых продуктов только в соответствии с их предпочтениями и сенсорными атрибутами может существенно измениться, когда раскрывается информация о продукте. Этот сильный &lt;a href=\"concepts/disconfirmation.html\"&gt;эффект информации на предпочтение&lt;/a&gt; после дегустации известен в литературе как феномен дезавуирования (disconfirmation). Восприятие сенсорного атрибута может быть затронуто как положительно, так и отрицательно. Использование внешних переменных для улучшения восприимчивости пищевого продукта — одна из стратегий, влияющих на потребительский выбор, принятие и потребление посредством процесса «переноса ощущений», при котором внешние атрибуты переносятся на наше сенсорное восприятие продукта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование фокусируется на молодых потребителях, чьи предпочтения могут отличаться от других возрастных групп, что ограничивает экстраполяцию результатов на всё население.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для исследования были выбраны коммерческие молочные и растительные альтернативы йогурту от производителей из Европейского Союза. Молочный йогурт и растительные альтернативы йогурту на различной растительной основе (кешью, кокос, овес и соя) были приобретены исходя из их региональной доступности. Все ферментированные продукты были без добавок, чтобы исключить потенциальную вариативность сенсорных характеристик из-за различных вкусов и наполнителей. Коммерческие названия и бренды не указаны. Образцы хранились при температуре 4 °C до тестирования. Подробное описание, включая ингредиенты и пищевую ценность образцов, можно найти в Таблице 1. Образцы были маркированы в соответствии с европейским законодательством (Регламент ЕС 1169/2011); вся информация доступна всем участникам рынка и не раскрывает ноу-хау компании. Все измерения проводились в трех повторностях.&lt;/p&gt;\n&lt;p&gt;Активная кислотность ферментированных продуктов измерялась с помощью pH-метра CP-411 (ELMETRON, Забже, Польша), который был откалиброван перед измерением. Измерения проводились при комнатной температуре, результаты выражались в единицах pH. Титруемая кислотность определялась на основе нейтрализации кислот, присутствующих в образце, 0,1 моль/л раствором NaOH, в соответствии с рекомендациями польского стандарта. На основе результата был рассчитан процент молочной кислоты (LA%).&lt;/p&gt;\n&lt;p&gt;Оптические свойства ферментированных продуктов количественно оценивались с помощью компактного спектрофотометра Konica Minolta CM-600d (KONICA MINOLTA Inc., Осака, Япония) с ксеноновой лампой D65 в качестве источника света и углом наблюдения 10°. Результаты колориметрии могут быть определены как &lt;a href=\"concepts/cielab-color-space.html\"&gt;цветовые индексы CIELab&lt;/a&gt; (L*, a* и b*). Индекс L* — это значение светлоты образца по шкале 0–100, где 0 — черный, а 100 — белый. Индекс a* выражает положение в цветовом пространстве на оси зеленый-красный, а b* — на оси синий-желтый. Отрицательное a* — зеленый, положительное a* — красный; отрицательное b* — синий, положительное b* — желтый. Перед началом измерений прибор был откалиброван по белому стандарту. Разница в цвете между образцами (ΔE&lt;em&gt;ab) была рассчитана по формуле CIE76 (Уравнение (1)). (1) ΔE&lt;/em&gt;ab = √((ΔL*)² + (Δa*)² + (Δb*)²) и &lt;a href=\"concepts/hunter-whiteness-index.html\"&gt;индекс белизны Хантера&lt;/a&gt; (1960) был рассчитан как (Уравнение (2)): (2) WI = L* − 3b*.&lt;/p&gt;\n&lt;p&gt;Анализ синерезиса ферментированных продуктов проводился путем центрифугирования по методу Жбиковской и соавт. Кратко: 5,0 г образца центрифугировали при 2500 об/мин в течение 20 минут при 7 °C. Супернатант взвешивали, и индекс синерезиса рассчитывали по Уравнению (3): (3) Синерезис (%) = (вес супернатанта (г) / общий вес (г)) × 100%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синерезис — это процесс отделения сыворотки от сгустка, который визуально воспринимается как появление жидкости на поверхности йогурта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сенсорный эксперимент с потребителями проводился в лаборатории сенсорного тестирования в 2024 году в Познанском экономическом университете (PUEB) в соответствии с требованиями ISO 8589:2007 и другими соответствующими институциональными руководствами и правилами. Всего в исследовании приняли участие 77 неподготовленных потребителей, в основном относящихся к поколению молодых взрослых (93,5%), 63,5% женщин и 36,5% мужчин (Таблица 2). Участники были набраны с использованием личных контактов и социальных сетей. Их спрашивали о пищевой аллергии и непереносимости лактозы, чтобы допустить к исследованию. Эксперимент обеспечивал анонимность. Перед участием в исследовании все участники предоставили информированное согласие (подтвердив условия) и были проинформированы о том, что участие является добровольным и анонимным, и что они могут выйти из исследования в любое время без объяснения причин. Чувствительные персональные данные не собирались, данные были деидентифицированы и анализировались только в агрегированном виде. После завершения каждой сессии участникам было дано указание воздерживаться от обсуждения деталей исследования после выхода из тестовой комнаты. Все участники получили небольшой подарок за участие в исследовании.&lt;/p&gt;\n&lt;p&gt;В первой части эксперимента всех участников попросили ответить на вопросы об их социально-демографических характеристиках и о том, есть ли у них какая-либо пищевая аллергия или непереносимость лактозы. Они были проинформированы о продукте, проинструктированы о процедуре тестирования и попрошены заполнить бумажные формы. Все участники приняли участие в 3 отдельных тестовых сессиях (слепая, ожидаемая и информированная). Названия брендов и конкретная информация о продуктах были неизвестны потребителям на первом этапе эксперимента, чтобы минимизировать потенциальную предвзятость и позволить более аутентичную оценку внутренних качеств всех продуктов. Во второй части эксперимента участники увидели информацию о пищевой ценности и ингредиентах продуктов (Таблица 1), а на третьем этапе они получили полную информацию о протестированных продуктах. Участники пробовали образцы только во время первой и третьей сессий. Участники сначала оценивали предпочтение атрибутов качества по 9-балльной гедонистической шкале, где 1 означало «крайне не нравится», а 9 — «крайне нравится», а затем определяли сенсорные характеристики ферментированных продуктов с помощью опросника Check-All-That-Apply (CATA). В ознакомительной сессии участники получили исчерпывающие инструкции о задаче CATA и процессе тестирования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод CATA (Check-All-That-Apply) позволяет потребителю выбрать из списка все характеристики, которые, по его мнению, подходят к данному продукту, что дает более точный сенсорный профиль, чем просто оценка «нравится/не нравится».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Опросник состоял из 18 терминов, каждый из которых относился к различным сенсорным атрибутам. Эти атрибуты были получены в результате обширного обзора литературы и были дополнительно уточнены группой подготовленных и опытных экспертов из PUEB. Атрибуты, включенные в CATA, были рандомизированы, чтобы обеспечить достоверность нашего опросника и смягчить любую потенциальную предвзятость, которая могла возникнуть из-за порядка представления. Для оценки намерения покупки использовалась 5-балльная шкала Лайкерта, где 1 означало «определенно нет», а 5 — «определенно да». Образцы подавались при температуре 15 °C, общим объемом 20 г (около 2 столовых ложек), гарантируя, что потребители могут повторно пробовать образец несколько раз во время сессии. В исследовании использовались прозрачные пластиковые стаканчики без запаха. Образцы представлялись в монадической последовательности, закодированные случайными трехзначными числами, следуя сбалансированному порядку рандомизации, чтобы избежать влияния порядка образцов. Образцы осторожно перемешивали, чтобы преодолеть любое разделение жидкости, которое могло произойти до представления образца. Во время всех сессий сенсорной оценки потребителям предлагали либо негазированную, либо газированную воду для очистки неба, а также сухие несоленые хлебные палочки, чтобы минимизировать эффекты переноса от одного образца к другому.&lt;/p&gt;\n&lt;p&gt;Статистический анализ проводился с использованием XLSTAT 2023.1.6 (Addinsoft, Париж, Франция) и Statistica 13.3 (TIBCO Software Inc., Талса, ОК, США). Уровень значимости был установлен на α = 0,05. Физико-химические данные анализировались с использованием однофакторного дисперсионного анализа (ANOVA). Тест Тьюки HSD использовался для апостериорных сравнений между средними значениями продуктов. Данные о гедонистическом предпочтении анализировались с использованием ANOVA с повторными измерениями (RM-ANOVA). Там, где это было уместно, парные сравнения корректировались с использованием процедуры Холма, а обобщенный эта-квадрат (ηG²) сообщался как мера размера эффекта. Взаимосвязи между общим предпочтением и отдельными атрибутами сенсорного качества в слепых условиях изучались с использованием коэффициентов корреляции Пирсона. Данные CATA анализировались с использованием теста Кокрена Q, за которым следовали парные сравнения Макнемара. Общая связь между продуктами и дескрипторами оценивалась с использованием теста хи-квадрат, а анализ соответствий на основе расстояний хи-квадрат использовался для визуализации их взаимосвязей. Корреляции Пирсона и анализ штрафов/подъемов (penalty/lift analysis) использовались для выявления сенсорных дескрипторов, связанных с увеличением или уменьшением общего предпочтения. Многофакторный анализ (MFA) использовался для интеграции трех активных блоков данных, включающих сенсорное предпочтение, дескрипторы CATA и физико-химические характеристики. Перед глобальным анализом каждый блок анализировался отдельно и нормализовался в соответствии с его первым сингулярным значением, чтобы сбалансировать влияние различных блоков данных. Нормализованные блоки впоследствии объединялись в глобальном MFA. Общее предпочтение в слепых условиях было включено как дополнительная переменная и поэтому не способствовало построению измерений MFA. Сходство между конфигурациями, предоставленными активными блоками данных, количественно оценивалось с использованием коэффициентов RV, варьирующихся от 0 до 1, при этом более высокие значения указывали на большее сходство между многомерными конфигурациями. Эффекты ожиданий оценивались с использованием разностей «ожидаемое минус слепое», «информированное минус слепое» и «информированное минус ожидаемое». Индивидуальные ответы ассимиляции и контраста классифицировались с использованием направления отношения (I − B)/(E − B); нулевые или неопределенные отношения классифицировались как отсутствие эффекта или неясные ответы. Намерение покупки анализировалось с использованием теста Фридмана для сравнения продуктов и тестов Уилкоксона со знаком ранга для сравнения ожидаемых и информированных условий. Взаимосвязи между общим предпочтением и намерением покупки изучались с использованием корреляций рангов Спирмена отдельно для каждого продукта в ожидаемых и информированных условиях. Линейные смешанные модели использовались для изучения того, предсказывало ли общее предпочтение намерение покупки. Отдельные модели были подобраны для ожидаемых и информированных условий, с намерением покупки в качестве зависимой переменной и общим предпочтением и продуктом в качестве фиксированных эффектов. Дополнительная модель изучала, предсказывало ли изменение общего предпочтения «информированное минус ожидаемое» соответствующее изменение намерения покупки. Потребитель был включен как случайное пересечение, чтобы учесть неавтономность пяти оценок продукта, предоставленных каждым участником. Модели оценивались с использованием ограниченного метода максимального правдоподобия (REML), а степени свободы оценивались с использованием аппроксимации Саттертуэйта. Предположения модели оценивались путем изучения распределений остатков и графиков остатков против предсказанных значений.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Слабая&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сенсорная прив&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;лекательность&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аналогов&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Слепое и инфор&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мированное&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тестирование&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Вкус важнее&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маркетинговых&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;заявлений&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&
