            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"235\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"545\" cy=\"282\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · GELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кожа сибаса: как отходы&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;аквакультуры превращаются в&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;съедобную упаковку&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Ежегодно переработка рыбы оставляет тонны отходов, которые обычно выбрасываются. Исследователи из Турции нашли способ превратить кожу сибаса в качественный &lt;a href=\"concepts/gelatin.html\"&gt;желатин&lt;/a&gt;. Полученный материал по своим свойствам не уступает промышленным аналогам и может стать основой для съедобной упаковки.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Содержание белка в желатине из кожи сибаса достигает 90,93%.&lt;/li&gt;\n&lt;li&gt;Прочность геля составляет 189,5 г, что делает его конкурентоспособным.&lt;/li&gt;\n&lt;li&gt;Пленки обладают прочностью 6,53 МПа и высокой эластичностью.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"concepts/sea-bass-skin-gelatin.html\"&gt;Желатин из кожи сибаса&lt;/a&gt; (&lt;a href=\"concepts/european-sea-bass.html\"&gt;Dicentrarchus labrax&lt;/a&gt;) представляет собой высокобелковый полимер с содержанием протеина 90,93%. Для его получения кожу очищали от жира при 35°C, обрабатывали 0,2 M раствором NaOH для удаления примесей и 0,05 M HCl для набухания коллагеновой матрицы. В результате была получена структура, богатая глицином (27,27%) и иминокислотами (18,71%), что обеспечивает прочность геля на уровне 189,5 г.&lt;/p&gt;\n&lt;p&gt;Из этого желатина были созданы пленки толщиной 0,14 мм с использованием глицерина в качестве пластификатора. Испытания показали предел прочности при растяжении 6,53 МПа и относительное удлинение при разрыве 94,55%. Спектроскопия FTIR подтвердила наличие ключевых амидных полос (A, B, I, II и III), что доказывает структурную целостность материала, сравнимую с коммерческими стандартами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в лабораторных условиях с ограниченным объемом сырья, поэтому масштабируемость процесса требует дополнительных проверок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Желатин как белковый полимер подвержен специфическим биохимическим реакциям и может расщепляться на составляющие аминокислоты и пептиды под действием различных протеолитических ферментов. Структурно он сохраняет характерный повторяющийся мотив Gly–X–Y, унаследованный от коллагена, с высокой концентрацией глицина наряду с иминокислотами пролином и гидроксипролином (Рис. 1). Молекулярные механизмы, обеспечивающие уникальную способность этого биополимерного матрикса связывать масло, остаются до конца не изученными. Поэтому данное исследование направлено на обоснование устойчивого пути переработки кожи D. labrax путем всесторонней характеристики её физико-химических, структурных и механических свойств, что создаст надежную базу для её использования в качестве конкурентоспособного, универсального и халяльного биоупаковочного материала. Желатин часто применяется в рецептурах с пониженным содержанием жира для воспроизведения кремовой текстуры и объема, обычно обеспечиваемых липидами. Помимо пищевой промышленности, он находит применение в передовых биомедицинских областях: текущие исследования подчеркивают его роль в тканевой инженерии, в частности для разработки систем доставки лекарств, каркасов регенеративной медицины и матриц для клеточной дифференцировки. Кроме того, желатин обладает преимуществами, включая низкую иммуногенность, биоразлагаемость и биосовместимость. Структурно желатин содержит аминокислотную последовательность RGD (Arg–Gly–Asp), способствующую адгезии клеток. В то же время он содержит как однослойные, так и двухслойные гидрофильные цепи, что способствует его высоким пленкообразующим свойствам. Благодаря многочисленным полезным свойствам желатин используется в широком спектре областей. Растворы желатина при охлаждении образуют термообратимые гели, поскольку цепи претерпевают конформационный переход «беспорядок–порядок», позволяя им восстановить тройную спиральную структуру коллагена. Разработка съедобной биоупаковки из морских биополимеров предлагает значимые альтернативы для замены синтетических материалов на основе нефти. Желатиновые пленки можно формировать с добавлением пластификаторов; их можно использовать для инкапсуляции пищевых компонентов с низким содержанием влаги или жира. Они также могут применяться для создания пленок и покрытий на мясе для защиты от кислорода, влаги и миграции липидов (Рис. 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Желатин — это универсальный биополимер, который благодаря своей тройной спиральной структуре и способности к термообратимому гелеобразованию является перспективной экологичной альтернативой синтетической упаковке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Из-за быстрого роста населения мира спрос на желатин, используемый в продуктах питания и добавках, в последние годы увеличился, достигнув 6,51 млрд долларов США в 2023 году, и, как ожидается, будет расти со среднегодовым темпом роста (CAGR) 10,1% до 2030 года. Удовлетворение этого растущего промышленного спроса требует использования ресурсов крупных региональных центров переработки аквакультуры, которые генерируют высококонцентрированные, отслеживаемые потоки чистого сырья. На долю кожи и связок свиного и бычьего происхождения приходится более 90% желатина на рынке. Однако из-за определенных религиозных ограничений желатин, произведенный из млекопитающих, часто не соответствует требованиям халяль и кошерности. Кроме того, желатин млекопитающих создает риски, связанные с опасениями по поводу губчатой энцефалопатии крупного рогатого скота и ящура. Следовательно, спрос на более безопасные источники желатина, полученные из морепродуктов, привлекает все больше внимания. &lt;a href=\"concepts/side-streams.html\"&gt;Побочные продукты&lt;/a&gt; рыбной промышленности могут составлять до 75% от общего веса рыбы и часто используются для производства продуктов с низкой коммерческой ценностью (таких как силос, удобрения и рыбная мука) или выбрасываются как органические отходы на свалки или в море. Биоконверсия этих побочных продуктов, которые обычно включают кожу, кости, головы, чешую и внутренности, в функциональный биополимер, такой как желатин, имеет первостепенное значение для современной безотходной переработки морепродуктов и циклической биоэкономики. Свойства желатина зависят от множества факторов, таких как вид животного, возраст, исходная ткань и условия экстракции. Желатин получают с более высоким выходом и лучшим качеством из рыбьей кожи, чем из костей. На сегодняшний день сообщалось об экстракции и характеристике желатина из кожи различных видов рыб, таких как черная кошачья акула (Galeus melastomus), спинорог (B. viridescens), атлантическая треска, красная тилапия, белый амур и морской окунь. Турция является передовой страной в аквакультуре морских и пресноводных продуктов в Средиземноморском регионе. С объемом производства 156 602 тонны европейский сибас является наиболее широко выращиваемым видом в аквакультуре. Переработанный сибас продается на национальных и международных рынках в свежем, охлажденном или филетированном виде. Растущий потребительский спрос на переработанные морепродукты, особенно на рыбное филе, привел к пропорциональному росту объемов побочных потоков переработки. После процесса получения филе без кожи кожа и кости выбрасываются или используются в кормовой промышленности. В секторах морского рыболовства и аквакультуры европейский сибас представляет собой высокоценный коммерческий вид, филетирование и промышленная переработка которого генерируют значительные объемы побочных продуктов в виде кожи, составляющих до 30% от общего объема отходов переработки. Стратегия заключается в том, чтобы представить переработку европейского сибаса как быстрорастущий сектор в Средиземноморском бассейне, который создает огромную локализованную экологическую нагрузку.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Побочные продукты (side-streams) — это части рыбы (кожа, кости, чешуя), которые остаются после производства филе. Их переработка в желатин превращает отходы в ценный ресурс, снижая экологический след производства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя желатин из сибаса уже экстрагировался ранее, наше исследование устанавливает точный эталон по сравнению как с млекопитающими, так и с коммерческими стандартами морского желатина холодных вод, используя уникальное структурное и оптическое перекрестное сравнение. Более того, молекулярные механизмы, обеспечивающие уникальную способность этого биополимерного матрикса связывать масло, остаются до конца не изученными. Поэтому данное исследование направлено на обоснование устойчивого пути переработки кожи D. labrax путем всесторонней характеристики её физико-химических, структурных и механических свойств, создавая окончательную базу для его эффективности как конкурентоспособного, глобально инклюзивного, халяльного биоупаковочного материала. Предыдущие исследования в основном фокусировались на выходе или реологическом профилировании культивируемого желатина из кожи сибаса (SSG). В настоящее время существует явный недостаток комплексных исследований, которые напрямую сравнивают первичные аминокислотные последовательности и распределение иминокислот этого вида с коммерческим желатином из кожи млекопитающих и рыб, одновременно исследуя XRD, &lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt; и оптическую прозрачность полученных желатиновых пленок. Превращение кожи европейского сибаса в высокоценный желатин — основная цель этого исследования — напрямую согласуется со стратегиями управления экологическими отходами и принципами циклической биоэкономики. Кроме того, гибкая конформация полипептидной цепи облегчает эффективное проникновение и диффузию пластификатора во время изготовления съедобной пленки, позволяя разрабатывать когезионные, прозрачные и структурно стабильные матрицы съедобной упаковки. В связи с этим из кожи сибаса был экстрагирован высокоценный природный полимер — желатин, который был всесторонне охарактеризован. Также из экстрагированного желатина были приготовлены съедобные пленки.&lt;/p&gt;\n&lt;p&gt;Сибас был приобретен на местных рынках в Адане, Турция, и доставлен в лабораторию в изолированных контейнерах, наполненных льдом. Изолированную рыбью кожу собирали в контейнер, наполненный колотым льдом, при соотношении кожи ко льду 1:2 (&lt;a href=\"concepts/w-w.html\"&gt;w/w&lt;/a&gt;) для предотвращения протеолитической деградации. Затем кожу промывали холодной очищенной водой для удаления крови и других остатков. Впоследствии её хранили в полиэтиленовых пакетах при температуре −20°C до процесса экстракции. Для характеристики экстрагированного желатина использовали желатин из бычьей кожи (CBG; Sigma, CAS №: 9000-70-8) и желатин из кожи рыб холодных вод (CFG; Sigma, CAS №: 9000-70-8). Коммерческий желатин из бычьей кожи (CBG) был выбран в качестве промышленного эталона для высокой механической прочности и плотности иминокислот, в то время как желатин из кожи рыб холодных вод (CFG) использовался для обеспечения прямого коммерческого базового уровня для альтернатив морского происхождения, что позволило точно оценить структурную жизнеспособность экстрагированного матрикса SSG. Все остальные химические вещества, использованные в этом исследовании, были аналитической чистоты и были получены от Sigma-Aldrich, Германия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;w/w (weight/weight) — массовая доля, соотношение массы одного компонента к массе другого. В данном случае 1:2 означает 1 кг кожи на 2 кг льда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Образцы кожи сибаса промывали очищенной водой и нарезали на мелкие кусочки. Процесс обезжиривания повторяли несколько раз в очищенной воде при 35°C при постоянном перемешивании до тех пор, пока на поверхности не оставалось частиц масла. Чрезвычайно низкое конечное содержание липидов, в сочетании с тем фактом, что в эталонном исследовании процесс обезжиривания при перемешивании в воде проводился при 22°C, убедительно подтверждает, что температура, использованная здесь, вполне достаточна для удаления липидов из рыбьей кожи. Более того, примененная температура 35°C достаточно эффективна для расплавления и устранения рыбьего жира, одновременно предотвращая преждевременное выщелачивание и термическую деградацию нативного коллагенового матрикса. Эффективность этого безхимического этапа была явно подтверждена удивительно низким остаточным содержанием липидов (0,13%). Экстракция желатина проводилась путем модификации метода, использованного Jongjareonrak et al. (2006). Для удаления неколлагеновых белков и пигментов из образцов кожи их непрерывно перемешивали с 0,2 М раствором NaOH при соотношении кожи к раствору 1:10 (Рис. 2). Каждую щелочную обработку проводили в течение 30 минут, после чего фильтровали. Оставшуюся воду сливали и нейтрализовали промывкой водопроводной водой до нейтрального или слабощелочного состояния (pH 7,0–7,5). Затем кожу смешивали с 0,05 М HCl при соотношении кожи к раствору 1:10 и инкубировали при 25°C в течение 3 часов. Обработанную кислотой кожу промывали водопроводной водой, как описано ранее. Преимущество последовательного применения двойной предварительной обработки, использованной в нашем исследовании (0,2 М NaOH с последующим 0,05 М HCl), заключается в двухэтапном механизме: щелочная обработка эффективно устраняет неколлагеновые белки и пигментные примеси, в то время как последующий мягкий кислотный этап разрушает нековалентные поперечные связи, разбухая кожу без расщепления полипептидных основ. Этот подход обеспечивает получение высокочистого полимера, богатого альфа-цепями, что имеет первостепенное значение для достижения стабильного пленкообразования (Jongjareonrak et al. 2006). (Рис. 2). Промытую кожу сибаса непрерывно перемешивали в дистиллированной воде при 45°C, используя соотношение кожи к воде 1:10 в течение 12 часов для экстракции желатина. Раствор растворенного желатина фильтровали для удаления остаточных фрагментов кожи. Затем желатин лиофилизировали с использованием лиофилизатора (Labconco, Freezone) (Рис. 3).&lt;/p&gt;\n&lt;p&gt;Выход желатина рассчитывали по следующей формуле (Jongjareonrak et al. 2006). Выход желатина = (Вес сухого желатина / Вес влажной рыбьей кожи) × 100.&lt;/p&gt;\n&lt;p&gt;Анализ пищевой ценности образцов желатина проводился в соответствии с методом AOAC (2000). Содержание сырого белка в образцах желатина определяли методом Кьельдаля. Для расчета общего содержания белка полученное содержание азота умножали на коэффициент пересчета азота в белок 5,4. Содержание влаги в образцах желатина определяли путем высушивания образцов при 105°C в течение 18 часов до постоянного веса и выражали в процентах. Содержание золы определяли путем сжигания образцов при 550°C в течение 4 часов до достижения постоянного веса. Содержание липидов измеряли методом Блайя и Дайера (Bligh and Dyer 1959). Все анализы проводились в трех повторностях.&lt;/p&gt;\n&lt;p&gt;Значения pH образцов желатина измеряли с использованием 1% (w/v, на основе белка) растворов желатина, приготовленных при 60°C, которым давали остыть до комнатной температуры. Измерения проводились в трех повторностях с использованием pH-метра Orion, модель 420A (Orion Research Inc., Беверли, Массачусетс, США).&lt;/p&gt;\n&lt;p&gt;Все спектры порошка желатина были получены с использованием ИК-фурье-спектрометра JASCO ATR Pro One модели 6700 (JASCO International Co. Ltd., Хатиодзи, Токио, Япония). Измерения проводились в диапазоне 4000–500 см−1, сигналы собирались автоматически за 32 сканирования с разрешением 4 см−1. Спектральные данные анализировались с использованием кросс-платформенного программного обеспечения Spectra Manager TM II (JASCO).&lt;/p&gt;\n&lt;p&gt;Прочность геля 6,67% (w/v) образцов желатина, приготовленных путем растворения желатина в дистиллированной воде при 60°C и магнитного перемешивания при 30 об/мин (IKA C-MAG HS 7, Штауфен, Германия), определяли в соответствии с методом AOAC (AOAC 2000). Образцы помещали в банки Блума (Schott, Майнц, Германия), и прочность геля измеряли с помощью стандартного зонда на анализаторе текстуры TA.XT-Plus (Stable Micro Systems, Суррей, Великобритания). Максимальное усилие (г) регистрировалось при достижении глубины проникновения 4 мм при скорости поршня 0,5 мм/с.&lt;/p&gt;\n&lt;p&gt;10% (w/v) раствор желатина помещали в пробирки и хранили при 7°C в холодильнике в течение 16–18 часов перед переносом на водяную баню при 10°C. Постепенно добавляли теплую воду (45°C), и температуру, при которой гель плавился, регистрировали как температуру плавления (Muyonga et al. 2004).&lt;/p&gt;\n&lt;p&gt;Для определения температуры гелеобразования 10% раствор желатина сначала уравновешивали на водяной бане при 40°C. Система подвергалась контролируемому процессу охлаждения, снижая температуру с постоянной скоростью 2°C в минуту. На протяжении этого перехода тепловой профиль раствора контролировался термометром с интервалом 30 секунд. Конкретная точка, в которой раствор переставал течь или капать, была определена и зарегистрирована как температура гелеобразования.&lt;/p&gt;\n&lt;p&gt;Влагопоглощающая и маслосвязывающая способности оценивались с помощью центробежного подхода, описанного Diniz и Martin (1997). Для этих измерений 1 г образца желатина вводили в центрифужные пробирки, содержащие либо 50 мл дистиллированной воды, либо 10 мл подсолнечного масла. Полученным смесям давали уравновеситься при комнатной температуре в течение 1 часа. Для обеспечения постоянного взаимодействия между фазами образцы перемешивали с помощью вихревого смесителя 5-секундными импульсами с 15-минутными интервалами. После периода инкубации растворы обрабатывали в охлаждаемой центрифуге при 2800×g в течение 20 минут для облегчения разделения фаз для окончательных расчетов емкости. Супернатант отделяли фильтрацией через фильтровальную бумагу. Измерялась разница между начальными объемами дистиллированной воды/подсолнечного масла, добавленными к образцам желатина, и объемом супернатанта, и результаты сообщались в процентах.&lt;/p&gt;\n&lt;p&gt;Образцы желатина гидролизовали в вакууме в 6 N HCl при 110°C в течение 24 часов. Аминокислотный анализ проводили с использованием &lt;a href=\"concepts/hplc.html\"&gt;ВЭЖХ&lt;/a&gt;-устройства Shimadzu Nexera-X2. Дериватизированный образец объемом 2 мкл вводили в колонку Shimadzu Shim-pack XR-ODS II, которую поддерживали при 40°C. Использованными подвижными фазами были (A) 1 мМ водный раствор K2HPO4 и KH2PO4 и (B) смесь ацетонитрила, метанола и воды в соотношении 45:40:15. Аминокислоты идентифицировали и количественно определяли на основе времени их удерживания и площадей пиков относительно стандартов.&lt;/p&gt;\n&lt;p&gt;Поверхности образцов желатина покрывали золотом-палладием (Au/Pd) для придания им проводимости со скоростью примерно 2 Å с−1. Сканирующая электронная микроскопия (SEM) проводилась с использованием модели Quanta 650 (FEI, Колумбус, Огайо, США).&lt;/p&gt;\n&lt;p&gt;Желатиновые пленки готовили в соответствии с методом Jongjareonrak et al. (2006). Раствор желатина готовили до концентрации белка 3%, и глицерин добавляли в качестве пластификатора в количестве 25% относительно концентрации белка. Затем смесь перемешивали при 60°C в течение 30 минут для создания пленкообразующего раствора (Рис. 4). Приготовленный пленкообразующий раствор выливали в полимерную форму (50–55 мм). Пузырьки воздуха в пленкообразующем растворе удаляли в ультразвуковой ванне (ультразвуковая ванна Elmasonic S), а пленки сушили при 50°C в печи Nuve FN500P (Рис. 4).&lt;/p&gt;\n&lt;p&gt;Толщину пленки измеряли ручным микрометром Mitutoyo Corp., модель MDC-25SX, серийный № 67473329; Кавасаки, Япония, с точностью 0,001 мм. Пленку измеряли в десяти случайных позициях. Среднее значение этих величин принималось за толщину пленки.&lt;/p&gt;\n&lt;p&gt;Измерения цвета пленок проводились с использованием Hunter &lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;Lab&lt;/a&gt; Scan (Hunter Associates Laboratory Inc., Рестон, Вирджиния, США). Непрозрачность пленок определяли по показаниям абсорбции при 600 нм с использованием спектрофотометра (Cary 7000, Agilent Technologies, Санта-Клара, Калифорния, США), следуя методу, описанному Gómez-Estaca et al. (2009). Шесть образцов пленки размером 1 × 4 см вырезали и помещали в тестовую кювету. В качестве эталона использовали пустую тестовую кювету. Непрозрачность рассчитывали по следующему уравнению: Непрозрачность O = Abs600 / x, где Abs600 = значение абсорбции при 600 нм, «x» = толщина пленки (мм).&lt;/p&gt;\n&lt;p&gt;Растворимость пленок в воде определяли в соответствии с методом Shakila et al. (2012). Пленки с площадью поверхности 4 см2 вырезали и взвешивали для определения начального веса (Ai ±0,0001 г). Пленки индивидуально погружали в 15 мл дистиллированной воды и осторожно перемешивали при комнатной температуре (22°C–25°C) в течение 15 часов, затем фильтровали через фильтровальную бумагу Whatman № 1. Нерастворенную фракцию пленки, собранную на фильтровальной бумаге, сушили в сушильном шкафу с горячим воздухом при 105°C в течение 24 часов и взвешивали (As). Каждая пленка тестировалась в трех повторностях, и среднее значение использовалось в качестве результата. Растворимость пленки рассчитывали по следующему уравнению: Растворимость % = (Ai − As) / Ai × 100, где Ai = начальный вес пленки, As = нерастворенная фракция пленки.&lt;/p&gt;\n&lt;p&gt;Механические свойства желатиновых пленок, такие как прочность на разрыв (TS) и удлинение при разрыве (EAB), определяли в соответствии со стандартным методом ASTM (1995) с использованием анализатора текстуры TA.XTP plus (Stable Micro Systems Ltd., Суррей, Великобритания). Толщину пленки измеряли с помощью цифрового микрометра Mitutoyo (Mitutoyo Corporation, Япония); для получения средней толщины было проведено шесть измерений. Для теста десять образцов (20 × 50 мм2) с начальной длиной захвата 30 мм растягивали со скоростью 30 мм/мин. Для каждой пленки было выполнено не менее пяти повторных измерений, и были записаны средние значения.&lt;/p&gt;\n&lt;p&gt;ИК-фурье-спектроскопия (FTIR) желатиновых пленок проводилась с использованием ИК-фурье-спектрометра (JASCO International Co. Ltd., Хатиодзи, Токио, Япония). Пленки помещали на кристаллическую ячейку, и спектры собирались автоматически в диапазоне 4000–500 см−1 с разрешением 4 см−1 за 32 сканирования при комнатной температуре. Анализ спектральных данных проводился с использованием кросс-платформенного программного обеспечения Spectra Manager TM II (JASCO).&lt;/p&gt;\n&lt;p&gt;Анализ методом рентгеновской дифракции (XRD) проводился для измерения кристаллических и аморфных характеристик пленок. Использовался рентгеновский дифрактометр (Empyrean, Panalytical BV, Алмело, Нидерланды) с медным источником при комнатной температуре, работающий при 40 кВ и 30 мА. Использованный диапазон углов дифракции составлял 2θ = 3°–80°; каждый образец измерялся дважды.&lt;/p&gt;\n&lt;p&gt;Поверхностные и поперечные микроструктуры желатиновых пленок исследовали с помощью сканирующего электронного микроскопа (SEM) модели Quanta 650 (FEI (Колумбус, Огайо, США)). Непроводящие образцы покрывали золотом-палладием (Au/Pd) со скоростью примерно 2 Å с−1. Поверхности и поперечные сечения пленок наблюдались при 30 кВ.&lt;/p&gt;\n&lt;p&gt;Все собранные данные анализировались с помощью дисперсионного анализа (ANOVA), а значимые различия между средними значениями определялись с использованием теста множественных сравнений Дункана.&lt;/p&gt;\n&lt;p&gt;Выход желатина, экстрагированного из кожи сибаса, составил 7,88% ± 0,14%. Нагревание коллагена в воде при 45°C или выше разрушает его тройную спиральную структуру, в результате чего образуется желатин — гетерогенная структура, состоящая из α-, β- и γ-цепей. Поэтому различия в содержании коллагена в коже различных видов рыб, а также различия в выходе желатина, о которых сообщается в литературе, можно объяснить такими факторами, как типы и концентрации используемых кислот и применяемые методы экстракции (Sinthusamran et al. 2015; Valcarcel et al. 2021). Выход желатина в этом исследовании выше, чем ранее сообщавшиеся выходы из кожи серого спинорога (Balistes capriscus) (5,67%) (Jellouli et al. 2011), кожи морского карася (6,60% ± 0,46%) и кожи сибаса (6,83% ± 0,39%) (Valcarcel et al. 2021). Однако более высокие выходы также сообщались для желатина, экстрагированного из кожи змееголова и акулы; сообщаемые выходы варьировались от 32,2% ± 1,24% до 33,9% ± 1,60% для кожи змееголова и от 31,6% ± 1,02% до 31,1% ± 1,01% для кожи акулы (Yu et al. 2024).&lt;/p&gt;\n&lt;p&gt;Пищевая ценность CBG, CFG и экстрагированного SSG показана в Таблице 1. (Таблица 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экстрагированный из кожи сибаса желатин (SSG) показал высокую чистоту белка (90,93%) и крайне низкое содержание липидов (0,13%), что делает его качественным сырьем для пищевой промышленности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Содержание белка в экстрагированном SSG (90,93% ± 0,41%) было выше, чем в FSG (89,31% ± 0,46%) (p &amp;lt; 0,05) и аналогично таковому в BSG (90,41% ± 0,42%) (p &amp;gt; 0,05). Высокое содержание белка в желатине указывает на то, что экстракция была эффективной. Содержание белка в желатине, полученном в нашем исследовании, выше, чем у Nemipterus japonicus (72,63%) (Koli et al. 2012). Содержание воды в экстрагированном SSG (8,11% ± 0,13%) было аналогично таковому в CBG (8,49% ± 0,11%; p &amp;gt; 0,05), но ниже, чем в CFG (9,65% ± 0,18%; p &amp;lt; 0,05). Кроме того, содержание жира в SSG (0,13% ± 0,01%) было ниже, чем в CFG (0,45% ± 0,02%) и CBG (0,41% ± 0,01%) (p &amp;lt; 0,05). Низкие уровни влаги и жира в порошкообразных продуктах повышают стабильность продукта за счет снижения микробного роста и окислительной деградации (Kumari et al. 2023).&lt;/p&gt;\n&lt;p&gt;Содержание влаги в SSG, полученном в этом исследовании, было ниже, чем сообщаемое значение 10,64% ± 0,45% для желатина из кожи Galeus melastomus. Содержание жира было значительно ниже, чем содержание жира, сообщаемое для желатина, экстрагированного из кожи четырех видов пангасиуса (Pangasius hypophthalmus, Pangasius larnaudii, Pangasius larnaudi и Pangasius bocoarti) (0,77%–1,73%) (Promchote et al. 2018; Karayannakidis et al. 2024). Для высококачественного желатина содержание золы должно быть ниже 0,5%. В нашем исследовании содержание золы в желатине, экстрагированном из SSG (0,31% ± 0,02%), было ниже этого значения; оно было выше, чем у CFG (0,20% ± 0,01%) (p &amp;lt; 0,05), но ниже, чем у CBG (0,43% ± 0,04%) (p &amp;lt; 0,05). Содержание золы в желатине, полученном в этом исследовании, было ниже ранее сообщавшегося значения (1,34% ± 0,17%) (Khushboo et al. 2023). Эти различия в содержании золы проистекают из минерального состава сырья и методов экстракции. Как правило, желатин с содержанием золы до 2,0% является приемлемым для пищевых применений (GME 2005).&lt;/p&gt;\n&lt;p&gt;Значения pH 1% растворов желатина, экстрагированных из SSG, CBG и CFG, представлены в Таблице 1. Измерение pH желатина важно, так как оно влияет на другие свойства, такие как вязкость и прочность геля. В нашем исследовании значение pH экстрагированного желатина (pH 5,66) оказалось выше, чем у CFG и CBG, демонстрируя статистически значимые различия по всем оцениваемым группам (p &amp;lt; 0,05). Эти статистические вариации pH в первую очередь объясняются протоколами химической предварительной обработки и промывки, примененными в процессе экстракции. Это значение также соответствует стандарту pH 4,5–6,5, установленному Институтом производителей желатина Америки (GMIA) для пищевых желатинов (GMIA 2019a, 2019b). Как правило, когда желатин экстрагируется без кислоты или щелочи, ожидается значение pH выше 6. pH желатинов варьируется в зависимости от условий предварительной обработки, примененных перед экстракцией (Songchotikunpan et al. 2008). В нашем исследовании использованный метод позволил получить желатин, предварительно обработанный как кислотой, так и щелочью перед экстракцией, что привело к измеренному pH 5,66. Значение pH, которое мы определили в нашем исследовании, выше, чем сообщалось для желатинов, полученных из кожи других видов рыб с использованием различных методов экстракции, таких как Channa striatus (5,39), Pangasius sutchi (5,27), Clarias batrachus (5,22) и Oreochromis niloticus (5,50) (See et al. 2010), Pangasius pangasius (5,8), Hemibagrus nemurus (5,9), Oreochromis niloticus (5,7) и Channa striata (5,8) (Ratnasari et al. 2013), а также выше, чем сообщаемые значения pH для Scoliodon sorrakowah (4,3), Labeo rohita (4,2) и Katsuwonus pelamis (4,3) (Shyni et al. 2014). Различия в значениях pH желатина также возникают из-за типов и силы химических веществ, используемых при предварительной обработке.&lt;/p&gt;\n&lt;p&gt;ИК-фурье-спектр SSG характеризуется несколькими заметными полосами, соответствующими колебательным переходам в пептидных цепях (Azilawati et al. 2015; Derkach et al. 2022). Анализ FTIR проводился на SSG, CBG и CFG; значимые амидные полосы спектров FTIR показаны на Рис. 5, а значения пиков для спектральных областей и их соответствующие назначения представлены в Таблице 2. Все образцы желатина демонстрировали схожие спектральные характеристики с отчетливыми амидными областями. Полоса Амид А, связанная с водородно-связанными валентными колебаниями N–H, наблюдалась при 3280, 3279 и 3279 см−1 в образцах SSG, CFG и CBG соответственно. Напротив, несколько более высокая частота Амид А, наблюдаемая в SSG, подтверждает существование более гибкой, открытой сети взаимодействий, что весьма характерно для нерегулярного нитевидного расположения, наблюдаемого с помощью SEM. Это спектральное поведение идеально согласуется с более широкими, более аморфными картинами рассеяния, подтвержденными в профилях XRD 30°–40° (2θ), химически подтверждая уникальную структурную конформацию и гибкость этих морских биополимеров (Рис. 5, Таблица 2).&lt;/p&gt;\n&lt;p&gt;Kittiphattanabawon et al. (2016) сообщили, что водородные связи, присутствующие в желатине, разрушаются высокими температурами экстракции и/или предварительной обработкой (кислотой или щелочью), что приводит к образованию амидной полосы при более низких частотах. Аналогичные результаты были получены для желатинов, экстрагированных из чешуи черной тилапии (Sockalingam и Abdullah 2015), кожи и костей Channa striata (Rosmawati et al. 2021) и кожи сома (Pangasius hypophthalmus) (Hidayati et al. 2021). В нашем исследовании амидные полосы SSG, CFG и CBG были обнаружены при волновых числах 2986,23, 2936,09 и 2987,20 см−1 соответственно. Амидная полоса связана с асимметричным валентным колебанием групп =C–H и –NH3 (Muyonga et al. 2004). Амидная полоса поглощения SSG оказалась схожей с таковой у CBG, тогда как полоса CFG находится при более низкой частоте; эта более низкая частота была приписана степени деформации вторичной структуры коллагена (Ahmad и Benjakul 2010).&lt;/p&gt;\n&lt;p&gt;Наблюдаемые амидные частоты для желатина из кожи сибаса (SSG) согласуются с установленной литературой для желатина, полученного из различных морских тканей, включая чешую и кости (Rosmawati et al. 2021; Nazeer и Kavya Deepthi 2013). В частности, полоса Амид I — критический индикатор вторичной структуры белка — возникла из валентных колебаний полипептидных связей C=O. Сложный контур этой полосы отражает суперпозицию различных конформационных состояний внутри цепи желатина (Derkach et al. 2022). Полоса Амид I, которая весьма чувствительна к валентным колебаниям карбонила вдоль пептидного остова, сместилась к более низкой частоте в CBG по сравнению с SSG. Это смещение указывает на более высокую плотность стабильных зон соединения тройной спирали в CBG, обусловленную интенсивными водородными связями, которые сильно ограничивают гибкость остова (Yu et al. 2024). Что касается области Амид II, пики были идентифицированы при 1537 см−1 для SSG, 1527 см−1 для коммерческого рыбного желатина (CFG) и 1518 см−1 для коммерческого бычьего желатина (CBG). Уровни интенсивности в этих образцах следовали четкой иерархии: SSG демонстрировал самую высокую интенсивность, а CBG — самую низкую. Однако сохранение первичных структурных белков в SSG убедительно подтверждается высокой интенсивностью полос Амид I (1630,52 см−1) и Амид II (1536,99 см−1) (Таблица 2). Полоса Амид I весьма чувствительна к сохранению валентных колебаний карбонила внутри неповрежденных пептидных остовов. Резкий, нерасширенный профиль этой области указывает на то, что низкотемпературная экстракция горячей водой (45°C в течение 12 часов) эффективно предотвратила термический сверхгидролиз до пептидов с низкой молекулярной массой. Эта структурная целостность дополнительно подтверждается надежными механическими характеристиками приготовленных пленок, которые демонстрировали прочность на разрыв 6,53 МПа. Это, в свою очередь, требует желатинового матрикса, внутренне доминируемого высокомолекулярными α- и β-цепными биополимерными компонентами для поддержания непрерывного межмолекулярного сшивания (Muyonga et al. 2004). Эти значения сопоставимы с диапазоном 1539–1586 см−1, отмеченным Salem et al. (2023) для желатина из кожи M. mustelus. Кроме того, полосы Амид III, которые связаны с колебательными модами тройной спирали коллагена (в частности, остатками глицина и пролина), появились при 1242 см−1 (SSG), 1241 см−1 (CFG) и 1231 см−1 (CBG). Muyonga et al. (2004) связали низкую интенсивность полосы Амид III с разрушением тройной спиральной структуры во время температурно-индуцированного превращения коллагена в желатин. В соответствии со спектрами FTIR, которые мы получили для всех трех образцов желатина, Kanwate et al. (2019) сообщили о полосах Амид III при 1236, 1239 и 1236 см−1 для лиофилизированных, распылительно-высушенных и вакуум-высушенных образцов рыбного желатина, экстрагированных из плавательных пузырей Labeo rohita соответственно.&lt;/p&gt;\n&lt;p&gt;Прочность геля зависит от множества факторов, таких как химическая обработка, температура экстракции, а также размер и возраст рыбы (Shahiri Tabarestani et al. 2014). Это также функция соотношения α-цепей в желатине и количества β-компонентов, оба из которых определяются сложными взаимодействиями (Gómez-Guillén et al. 2002). В нашем исследовании прочность геля желатина, экстрагированного из SSG (189,45 ± 2,10 г), была значительно ниже, чем у CBG (285,88 ± 0,84 г) и CFG (205,75 ± 3,90 г) (p &amp;lt; 0,05) (Таблица 3). Одно исследование сообщило, что прочность геля желатина, полученного из кожи сибаса, была ниже, чем полученная в нашем исследовании (181,0 ± 7,8 г), тогда как желатин из кожи дорады и кожи форели был зарегистрирован как 229,5 ± 12,7 г и 95,0 ± 2,0 г соответственно (Valcarcel et al. 2021). Кроме того, было установлено, что прочность геля желатина, полученного из кожи азиатского сибаса, варьируется от 233 до 369 (Sinthusamran et al. 2015). Согласно стандартам Института производителей желатина Америки (GMIA), прочность геля коммерческого желатина должна составлять от 100 до 300 г для использования в промышленном секторе (GMIA 2019a). Таким образом, прочность геля желатина, полученного в настоящем исследовании, соответствует этим стандартам. (Таблица 3).&lt;/p&gt;\n&lt;p&gt;Температура плавления SSG (25,63°C ± 0,46°C) была значительно выше, чем у CFG (14,02°C ± 0,17°C), но ниже, чем у CBG (32,75°C ± 0,51°C) (p &amp;lt; 0,05) (Таблица 3). Температура гелеобразования SSG, полученная в нашем исследовании, была аналогична температурам гелеобразования, сообщенным для желатина из кожи спинорога Ahmad et al. (2024), которые использовали ультразвуковой метод (25,96°C и 31,86°C). Более низкая температура плавления SSG по сравнению с CBG может быть объяснена более низким содержанием иминокислот (пролина и гидроксипролина) в желатине из сибаса (Ninan et al. 2014).&lt;/p&gt;\n&lt;p&gt;CBG (312,67%) обладал самой высокой влагоудерживающей способностью и самой низкой маслосвязывающей способностью (287,02%) (p &amp;lt; 0,05); SSG обладал самой высокой маслосвязывающей способностью (346,95%); а CFG обладал самой низкой влагоудерживающей способностью (227,44%) (p &amp;lt; 0,05) (Таблица 3). Маслосвязывающая способность желатина связана с содержанием в нем гидрофобных аминокислот, в то время как его &lt;a href=\"concepts/water-holding-capacity.html\"&gt;влагоудерживающая способность&lt;/a&gt; связана с содержанием гидрофильных аминокислот. Высокая влагоудерживающая способность в первую очередь связана с повышенными уровнями гидрофильных аминокислот и повышенным содержанием гидроксипролина (Ninan et al. 2011). Действительно, в нашем исследовании CBG с самым высоким содержанием гидроксипролина также продемонстрировал самую высокую влагоудерживающую способность.&lt;/p&gt;\n&lt;p&gt;В этом исследовании высокая маслосвязывающая способность SSG объясняется содержанием в нем тирозина; тирозин — это гидрофобный остаток, который более распространен в SSG, чем в других желатинах. В пищевой промышленности включение желатина с высокой маслосвязывающей способностью в мясные продукты (такие как сосиски и салями) желательно не только для снижения содержания жира, но и для минимизации потери влаги при хранении. В этом отношении SSG, экстрагированный в нашем исследовании, был более подходящим, чем другие типы желатина.&lt;/p&gt;\n&lt;p&gt;Качество и функциональные характеристики желатина фундаментально определяются его аминокислотным распределением. Сравнительные профили для SSG, CFG и CBG подробно описаны в Таблице 4. Оценка 17 проанализированных аминокислот показала, что глицин был основным компонентом во всех образцах. В частности, CBG демонстрировал значительно большую концентрацию глицина (Gly) (32,68% ± 0,66%) по сравнению с SSG (27,24% ± 1,04%) и CFG (28,95% ± 0,99%) (p &amp;lt; 0,05). Пролин (Pro) следовал за ним как второй по распространенности остаток, отражая тенденцию глицина с его пиковой концентрацией, обнаруженной в CBG (12,88% ± 0,06%; p &amp;lt; 0,05). Напротив, не наблюдалось существенной разницы между уровнями пролина в SSG (10,55% ± 0,13%) и CFG (10,42% ± 0,24%) (p &amp;gt; 0,05), что указывает на сопоставимый профиль иминокислот для двух желатинов морского происхождения. Высокие концентрации Gly, Pro и Ala во всех образцах согласуются с результатами по аминокислотам, сообщенными для желатинов из кожи толстолобика и кожи кеты (Yang, Tian, et al. 2022; Liu et al. 2023). Аминокислотная последовательность макромолекулы желатина может быть определена общей формулой Gly–X–Y, где позиция X обычно занята пролином, а позиция Y — гидроксипролином (Salvatore et al. 2020). Аланин занимает неполярные области, где преобладают последовательности Gly–Pro–Y, при этом третий остаток занят либо гидроксипролином, либо аланином. В нашем исследовании содержание аланина было выше в CBG (9,18% ± 0,38%) и CFG (9,49% ± 0,24%), чем в SSG (7,43% ± 0,40%) (p &amp;lt; 0,05). Как правило, желатины млекопитающих содержат более высокие уровни иминокислот (Pro и Hyp), чем рыбные желатины (Usman et al. 2025). Подтверждая это, содержание иминокислот в SSG (18,71% ± 0,67%) и CFG (15,20% ± 0,55%) в этом исследовании было ниже, чем в CBG (млекопитающих) (19,45% ± 0,30%) (p &amp;lt; 0,05). Отчетливые различия в прочности геля и температуре плавления, наблюдаемые среди образцов, в первую очередь определяются первичной структурой полипептидов. Как указано в Таблице 4, CBG демонстрировал самое высокое содержание иминокислот (19,45%), за ним следовали SSG (18,71%) и CFG (15,20%). Структурно остатки иминокислот незаменимы для конформации тройной спирали; жесткие пирролидиновые кольца этих иминокислот механически ограничивают конформационную гибкость полипептидных цепей, тем самым стабилизируя зоны соединения во время термообратимого гелеобразования (Joy et al. 2024). Поскольку гидроксипролин действует как связующее звено для водородных связей через свои гидроксильные группы, значительно более высокое содержание гидроксипролина в CBG по сравнению с SSG объясняет соответствующие различия в прочности геля (285,88 г против 189,45 г) и температуре плавления (32,75°C против 25,63°C). Более того, хотя SSG является желатином рыбного происхождения, содержание иминокислот в нем (18,71%) статистически ближе к таковому у стандартных желатинов млекопитающих, чем к желатину из кожи рыб холодных вод (15,20%), что отражает то, что нативные матриксы желатина из кожи Dicentrarchus labrax требуют более высокой термической стабильности. (Таблица 4).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Утилизация&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;отходов&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;переработки&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рыбы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Экстракция&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;коллагена из&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кожи сибаса&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Создание&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;прочной&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;съедобной&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пленки&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-s
