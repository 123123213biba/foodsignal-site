            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"185\" cy=\"143\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"575\" cy=\"245\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · BIOACTIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как заставить сывороточный&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;белок работать дольше:&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;молекулярный «клей» для мышц&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Сывороточный белок считается золотым стандартом для борьбы с саркопенией, но его высокая скорость усвоения часто снижает эффективность. Исследователи разработали систему инкапсуляции, которая защищает белок и обеспечивает его постепенное высвобождение в ЖКТ. Новая технология использует «молекулярный клей» из металл-полифенольных сетей и гиалуроновой кислоты, имитируя структуру семени. Это решение помогает поддерживать синтез мышечного белка на протяжении более длительного времени.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Полимеризация &lt;a href=\"concepts/whey-protein-isolate.html\"&gt;WPI&lt;/a&gt; при 90°C и pH 4,5 создает стабильную основу для инкапсуляции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mpns.html\"&gt;Металл-полифенольные сети&lt;/a&gt; (MPNs) с Ca2+ обеспечивают прочное сцепление с белком.&lt;/li&gt;\n&lt;li&gt;Система активирует путь PI3K/AKT/mTOR, подавляя мышечную атрофию у подопытных моделей.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Для создания системы инкапсуляции сывороточный изолят (WPI) сначала подвергали тепловой полимеризации при pH 4,5 и 90°C в течение 20 минут, что приводило к образованию частиц размером 425 ± 106 нм. Затем на поверхность этих частиц наносили слой металл-полифенольных сетей (MPNs) из проантоцианидинов и ионов кальция (Ca2+), а в качестве внешнего защитного слоя использовали гиалуроновую кислоту (HA). В результате размер частиц увеличился до 743 ± 182 нм, а толщина защитной оболочки составила 159 нм. Исследование методом изотермического титрования показало, что связывание MPNs с белком происходит преимущественно за счет гидрофобных взаимодействий и водородных связей с константой связывания (Ka) 6,7 × 10^8 л/моль.&lt;/p&gt;\n&lt;p&gt;В экспериментах на мышиной модели саркопении группа, получавшая PWPI@MPNs25/HA, продемонстрировала значительное улучшение физических показателей, включая силу хвата и выносливость. Молекулярный анализ показал, что система активирует &lt;a href=\"concepts/pi3k-akt-mtor-signaling-pathway.html\"&gt;сигнальный путь PI3K/AKT/mTOR&lt;/a&gt; и подавляет экспрессию факторов атрофии мышц MuRF-1 и Atrogin-1. Использование такой «семенной оболочки» позволяет эффективно контролировать скорость гидролиза белка, предотвращая его чрезмерно быструю метаболизацию в мочевину и направляя аминокислоты на нужды мышечной ткани.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на мышиной модели, поэтому результаты требуют подтверждения в клинических испытаниях на людях. Эффективность системы зависит от индивидуальных особенностей микробиоты и pH-среды ЖКТ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Старение населения — это глобальный феномен, сопровождающийся ростом распространенности заболеваний опорно-двигательного аппарата и возрастных патологий, включая остеопороз, когнитивные нарушения и саркопению. &lt;a href=\"concepts/sarcopenia.html\"&gt;Саркопения&lt;/a&gt; ведет к инвалидизации, утрате самостоятельности и физической слабости, являясь серьезной проблемой здравоохранения, существенно снижающей качество жизни пожилых людей. Нутрицевтическая коррекция выступает перспективной стратегией управления саркопенией.&lt;/p&gt;\n&lt;p&gt;В настоящее время сывороточный белок (WP) служит основным протеиновым компонентом в лечебном питании при саркопении. По сравнению с другими пищевыми белками, WP содержит высокий уровень незаменимых аминокислот (EAAs) и аминокислот с разветвленной цепью (BCAAs). На долю BCAAs приходится 35% аминокислот (AAs) в белках скелетных мышц; они играют ключевую роль в стимуляции синтеза мышечного белка (MPS). Поскольку организм человека не способен синтезировать BCAAs, они должны поступать с пищей. Таким образом, WP эффективно повышает плазменную концентрацию EAAs и BCAAs, запуская MPS. При этом для построения мышечной ткани также требуются заменимые аминокислоты (NEAAs), которыми WP снабжает организм в изобилии. Потеря мышечной массы происходит, когда скорость распада мышечного белка (MPB) превышает скорость MPS. Белки скелетных мышц обновляются со скоростью около 2% в сутки. Для поддержания непрерывного MPS необходимо постоянное наличие AAs в крови. Однако WP относится к «быстроусвояемым белкам»: пик концентрации AAs в плазме наблюдается примерно через 1 ч после приема. Большая часть AAs, поступающих в кровь в высоком объеме за короткий промежуток времени, утилизируется в мочевину, а не встраивается в мышцы. Поэтому разработка систем пролонгированного высвобождения WP имеет критическое значение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Главная проблема сывороточного белка при саркопении — слишком быстрое усвоение (пик через 1 ч), из-за чего избыток аминокислот уходит в мочевину, а мышцы не успевают их усвоить.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Большинство существующих систем пролонгированного WP базируются на ферментативном сшивании с получением «казеиноподобного» состояния. Однако эти гели имеют недостатки: они вызывают трудности при проглатывании у пожилых людей, а скорость их переваривания трудно контролировать (мягкие и твердые гели WP полностью гидролизуются уже через 240 мин). В последние годы внимание исследователей привлекли металл-полифенольные сети (MPNs) — самособирающиеся покрытия, образующиеся за счет хелатирования ионов металлов полифенолами. MPNs способны быстро (за несколько минут) формировать защитный слой на различных подложках, предохраняя содержимое от УФ-излучения и ферментативного расщепления.&lt;/p&gt;\n&lt;p&gt;Изолят сывороточного белка (WPI) богат функциональными группами (амино-, гидроксильными и карбоксильными), что облегчает сборку MPNs на его поверхности. Однако MPNs чувствительны к pH: они собираются в нейтральной или щелочной среде и разрушаются в кислой. Выполняя роль «молекулярного клея», MPNs могут связывать WPI с сахаридами, формируя двухслойную нанооболочку по технологии послойной самосборки. Сахариды, устойчивые к изменениям pH и ферментам, подобно семенной кожуре, способны защитить WPI и регулировать его высвобождение. В данном исследовании проантоцианидины (PC), ионы кальция (Ca²⁺) и &lt;a href=\"concepts/hyaluronic-acid.html\"&gt;гиалуроновая кислота&lt;/a&gt; (HA) были выбраны в качестве моделей полифенола, иона металла и сахарида. Вдохновившись строением растительного семени, авторы разработали систему «капсулирования отдельных белковых частиц» (&lt;a href=\"concepts/single-protein-particle-encapsulation-sppe.html\"&gt;SPPE&lt;/a&gt;). Сначала WPI переводили в частицы полимеризованного изолята (PWPI), затем наносили промежуточный слой MPNs (получая PWPI@MPNs), а сверху формировали внешнюю «семенную кожуру» из HA, получая комплекс PWPI@MPNs/HA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Металл-полифенольные сети (MPNs) — это гибкие нанооболочки, возникающие при мгновенном связывании ионов металлов (например, кальция) с растительными полифенолами.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Перевод WPI в PWPI необходим для уменьшения площади поверхности и сокращения расхода расходных материалов (MPNs и HA). Для этого применили термическую полимеризацию при значении изоэлектрической точки (pI) WPI, которая составила 4,5 (Рис. S1). Нагрев WPI проводили при pH 4,5 и температуре 90°C в течение 0–40 мин. В начале нагрева размер частиц PWPI увеличивался, но после 20 мин нагревания стабилизировался (Рис. S2), а степень полимеризации вышла на плато. Мутность (Рис. S3) и растворимость (Рис. S4) после 20 мин нагрева также не менялись (Рис. S5). Поэтому оптимальными условиями были признаны: pH 4,5, 90°C и 20 мин.&lt;/p&gt;\n&lt;p&gt;При изучении механизма было установлено, что при нагревании возрастают поверхностная гидрофобность (Рис. S6) и количество свободных тиольных групп (Рис. S7). Интенсивность флуоресценции увеличивалась (Рис. S8, Таблица S1), а λmax смещалась в длинноволновую область (&amp;gt; 330 нм при нагреве ≥ 10 мин), что свидетельствует об экспонировании внутренних гидрофобных остатков триптофана наружу. На ИК-спектрах с Фурье-преобразованием (&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;FT-IR&lt;/a&gt;, Рис. S9) полоса валентных колебаний O─H (3293 cm⁻¹) демонстрировала незначительный незначительный синий сдвиг. Анализ полосы Амид I (1700–1600 cm⁻¹) показал снижение доли β-слоев и β-поворотов при неизменном содержании α-спиралей и росте неупорядоченных спиралей (Таблица S2). Таким образом, нагрев раскрывает гидрофобные группы и дисульфидные связи WPI, переводя структуру из упорядоченной в неупорядоченную с последующей агрегацией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Оптимальный режим получения основы PWPI — прогрев при 90°C и pH 4,5 в течение 20 минут. Это создает стабильные белковые микросферы и снижает необходимый расход компонентов оболочки.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Микроструктуру PWPI, PWPI@MPNs и PWPI@MPNs/HA изучали методом сканирующей электронной микроскопии (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;; Рис. 1A–C). На снимках SEM видно, что в PWPI сохраняются отдельные микросферы диаметром 425 ± 106 нм (Рис. 1A, D), сформированные в агрегаты размером 50,4 мкм (Рис. S2). Капсулирование в MPN делает частицы более плотными и неправильной формы (Рис. 1B), а нанесение HA существенно увеличивает их размер (Рис. 1C) до 743 ± 182 нм (Рис. 1E, F). Расчетная толщина двойного покрытия MPN/HA составила около 159 нм (Рис. 1G, H).&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"%5Czeta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;-потенциал исходах частиц PWPI составлял 4,66 мВ (Рис. 1I). После нанесения MPNs он упал до −20,80 мВ из-за изобилия фенольных гидроксилов с сильным отрицательным зарядом. Крайний слой HA сгладил charge-эффект, подняв &lt;span class=\"yfm-latex\" data-content=\"%5Czeta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;-потенциал PWPI@MPNs/HA до −7.56 мВ. Энергодисперсионная спектрометрия (EDS) подтвердила равномерное распределение Ca²⁺ по поверхности PWPI (Рис. 1J) с полуколичественным содержанием 13,68% (Рис. 1K). Лазерная конфокальная сканирующая микроскопия (CLSM) с метками Rhodamine B (для MPNs) и FITC (для HA) досказала четкую ко-локализацию всех слоев на поверхности белка (Рис. 1L).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Толщина защитной нанооболочки из полифенолов, кальция и гиалуроновой кислоты составляет всего 159 нм, но она кардинально меняет электрический заряд и свойства поверхности белковой частицы.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Спектроскопия флуоресценции показала падение a.u.max при переходе от PWPI к PWPI@MPNs (Рис. 2A, Таблица S3), что говорит об экранировании гидрофобных групп. В группе PWPI@MPNs25 тушение флуоресценции белка достигло 96,91 ± 0,16%. Константа связывания (K_a) составила 6,7 × 10⁸ L·mol⁻¹ (число мест связывания n = 1,96), что указывает на высокое сродство. Константа скорости тушения (K_q = 1,54 × 10¹³ L·mol⁻¹·s⁻¹) превысила порог 2,0 × 10¹⁰ L·mol⁻¹·s⁻¹, подтверждая статическое, а не динамическое тушение.&lt;/p&gt;\n&lt;p&gt;На ИК-спектрах (Рис. 2B) пик O─H проантоцианидинов (3356 cm⁻¹) в MPNs смещался в область 3190,79 cm⁻¹ из-за координации Ca²⁺ с ─OH-группами. В PWPI@MPNs полоса O─H смещалась к 3349 cm⁻¹, отражая усиление водородных связей. Ослабление полос Амид I (1653 cm⁻¹) и Амид II (1541 cm⁻¹) указывает на участие групп C═O и N─H в связывании. Структура белка при этом становилась более упорядоченной (Рис. 2C).&lt;/p&gt;\n&lt;p&gt;Изотермическая титрационная калориметрия (ITC, Рис. 2D) взаимодействия MPNs и HA показала Δ G = -1603 кал/моль (спонтанный процесс) и константу связывания K = 1,67 × 10⁵ M⁻¹. Отрицательная энтальпия (Δ H = -1098 кал/моль) говорит о преобладании водородных связей.&lt;/p&gt;\n&lt;p&gt;При увеличении соотношения PWPI:MPNs от 100:5 до 100:100 адсорбция MPNs росла (Рис. 2E), но эффективность связывания падала: при соотношениях 100:5 и 100:10 связались почти 100% MPNs, а при ≥ 100:25 эффективность снижалась (Рис. 2F). Рост слоя MPNs способствовал большему связыванию избыточной HA (Рис. 2G).&lt;/p&gt;\n&lt;p&gt;Дифференциальная сканирующая калориметрия (DSC, Рис. 2H) продемонстрировала рост температуры термического перехода от 94,15°C (PWPI) до 111,35°C (PWPI@MPNs100/HA), что подтверждает высочайшую &lt;a href=\"concepts/thermal-stability.html\"&gt;термостабильность&lt;/a&gt; системы. Ускоренные испытания стабильности вакуумированного PWPI@MPNs25/HA (Рис. S10) показали, что при 65°C и влажности 75% разрушение оболочки наступает через 12 дней (безопасный срок — 9 дней, Рис. S11), при 55°C — 24 дня (Рис. S12), что по расчетному уравнению эквивалентно 455,1 дням хранения при 25°C. Частицы сохраняли размер. В имитации желудочного сока без ферментов за 2 ч инкубации не выявлено выхода свободных PC и Ca²⁺ (Рис. S13). В ЖКТ мышей in vivo через 8 ч после зондового введения восстанавливалось более половины PC и Ca²⁺ в составе частиц при низком уровне их свободных форм (Рис. S14, S15).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Разработанные наночастицы PWPI@MPNs25/HA обладают высокой стабильностью: расчётный срок хранения при 25°C составляет около 455 дней, а структура оболочки полностью устойчива к перистальтике и кислой среде желудка.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При моделировании переваривания in vitro (Рис. 3A) чистый PWPI гидролизовался мгновенно (почти полностью за 30 мин кишечной фазы). С ростом доли оболочки MPNs/HA скорость расщепления падала; в группе PWPI@MPNs100/HA белок практически не переваривался. Визуально (Рис. 3B, Рис. S16) и по показателям мутности (Рис. 3C–H) растворы с защищенным белком сохраняли непрозрачность. При продлении кишечной фазы до 8 ч (Рис. S17) степень гидролиза (DH) и мутность (Рис. S18) в группах PWPI@MPNs50/HA и PWPI@MPNs100/HA оставались на низком уровне, сохраняя высокую мутность даже к 480-й минуте.&lt;/p&gt;\n&lt;p&gt;Анализ &lt;a href=\"concepts/sds-page.html\"&gt;SDS-PAGE&lt;/a&gt; показал, что полосы α-лактальбумина (α-La) и β-лактоглобулина (β-Lg) исчезали через 2 ч желудочного переваривания в контроле и при малых дозах MPNs, но сохранялись в группе PWPI@MPNs100/HA даже через 2 и 8 ч кишечной фазы (Рис. 3I–K). Гель-проникающая хроматография (Таблица S4) выявила, что доля низкомолекулярных фракций (&amp;lt; 500 Да) у чистого PWPI составляла 53,89%, тогда как у PWPI@MPNs100/HA — лишь 37,01%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Степень гидролиза (DH) показывает, какой процент белковых связей расщеплен ферментами. Чем ниже DH во времени, тем сложнее ферментам добраться до белка и тем дольше он высвобождается.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После перорального введения мышам (Рис. 4A) чистый PWPI вызывал пик аминокислот в сыворотке крови уже через 1–2 ч (Рис. 4B). В группах PWPI@MPNs5/HA и PWPI@MPNs10/HA ранний пик снижался, а концентрация к 4–6 ч возрастала (Рис. 4C, D). Группа PWPI@MPNs25/HA продемонстрировала идеальное пролонгированное высвобождение: уровень AAs в плазме был умеренным на 1–2 ч и стабильно высоким на протяжении 4–6 ч (Рис. 4E). В группах 50/HA и 100/HA уровень AAs оставался крайне низким (Рис. 4F, G). В целом PWPI@MPNs25/HA поддерживал высокий уровень аминокислот в крови в течение 1–6 ч, что на 400% дольше по времени, чем чистый PWPI (Рис. 4H).&lt;/p&gt;\n&lt;p&gt;Аналогичная динамика зафиксирована для BCAAs (лейцина, изолейцина, валина; Рис. 4I–L). В сравнении с традиционными формами — казеином (CAS) и ферментативно сшитым белком (CWPI, размер 722,7 нм, Рис. S19), которые давали резкий спад уровня AAs уже к 3-му часу (Рис. S20), форма PWPI@MPNs25/HA увеличивала время действия минимум на 100%. Дробное 6-кратное введение обычного WP (группа EWPI) воспроизводило профиль всасывания PWPI@MPNs25/HA (Рис. S21).&lt;/p&gt;\n&lt;p&gt;Флуоресцентное флуоресцентное флуоресцентное флуоресцентное флуоресцентное флуоресцентное imaging in vivo (Рис. 4M, Рис. S22) показало, что PWPI-Cy5 исчезает из ЖКТ за 4 ч, а PWPI-Cy5@MPNs25/HA сохраняет свечение даже через 6–8 ч. Частицы достигали слепой кишки за 6 ч (против 4 ч у контроля), что связано с мукоадгезивными свойствами MPNs и HA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Капсулированная форма PWPI@MPNs25/HA продлевает поддержание высокой концентрации аминокислот и BCAA в крови с 1–2 часов до 6 часов (на 400% дольше по сравнению с обычным сывороточным белком).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Саркопению индуцировали введением дексаметазона (Dex) в течение 14 дней (Рис. 5A). Инъекции Dex вызывали значительное снижение массы тела (Рис. 5B) при одинаковом потреблении корма во всех группах (Рис. 5C). У мышей группы Dex существенно снижалась тощая масса и росла жировая (Рис. 5D, E, Рис. S23). Введение PWPI и PWPI@MPNs5/HA–PWPI@MPNs25/HA эффективно обращало эти изменения, тогда как дозы 50/HA и 100/HA эффекта не дали из-за блокировки высвобождения белка.&lt;/p&gt;\n&lt;p&gt;Тесты физической формы: сила хвата передних (Рис. 5F) и задних лап (Рис. 5G), время удержания на сетке (Рис. 5H), время до истощения (Рис. 5I) и дистанция (Рис. 5J) подтвердили тяжелые нарушения в группе Dex. Лучшие результаты восстановления показов комплекс PWPI@MPNs25/HA.&lt;/p&gt;\n&lt;p&gt;Анатомический анализ мышечных тканей (Рис. 6A–E) показал снятие атрофии камбаловидной (SOL), икроножной (GA), передней большеберцовой (TA) и четырёхглавой мышцы бедра (QA). Гистология H&amp;amp;E (Рис. 6F, G) выявила, что площадь поперечного сечения (CSA) мышечных волокон GA и TA в группе Dex резко уменьшалась, а их структура нарушалась. PWPI@MPNs25/HA обеспечил максимальное восстановление площади волокон CSA благодаря длительному (до 6–8 ч) снабжению аминокислотами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Состав PWPI@MPNs25/HA полностью защищает мышцы от атрофии, вызванной стероидами: восстанавливается масса тощей ткани, площадь сечения волокон и физическая сила мышей.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Синтез белка регулируется сигнальным путем PI3K/AKT/mTOR. В группе Dex уровень фосфорилирования p-AKT, p-mTOR и p-P70S6K был глубоко подавлен (Рис. 7A, C–K). Применение PWPI@MPNs25/HA максимально восстанавливало экспрессию p-AKT, p-mTOR и p-P70S6K, а также суммарные белки. Лейцин из WP активирует mTORC1 через ослабление взаимодействия Sestrin2 с GATOR2.&lt;/p&gt;\n&lt;p&gt;На этапе инициации трансляции PWPI@MPNs25/HA достоверно повышал уровень скаффолд-протеина eIF4G (Рис. 7B, O) и снижал экспрессию репрессора 4E-BP1 и p-4E-BP1 (Рис. 7L–N), высвобождая eIF4E для сборки комплекса eIF4F (Рис. 8I).&lt;/p&gt;\n&lt;p&gt;Параллельно оценивали путь распада белка (UPS). Экспрессия ключевых E3-убиквитинлигаз — Atrogin-1 и MuRF-1 — была сильно повышена в группе Dex, но существенно подавлялась при лечении PWPI@MPNs25/HA (Рис. 7P, Q, Рис. 8E, F). ПЦР в реальном времени подтвердила аналогичную динамику мРНК генов &lt;em&gt;PI3K&lt;/em&gt;, &lt;em&gt;AKT&lt;/em&gt;, &lt;em&gt;mTOR&lt;/em&gt;, &lt;em&gt;FoxO&lt;/em&gt;, &lt;em&gt;MuRF-1&lt;/em&gt; и &lt;em&gt;Atrogin-1&lt;/em&gt; (Рис. 8A–F).&lt;/p&gt;\n&lt;p&gt;Таким образом, пролонгированное поступление аминокислот под действием PWPI@MPNs25/HA одновременно синергетически активирует анаболический путь PI3K/AKT/mTOR и подавляет катаболический путь UPS, возвращая мышечную ткань в состояние динамического равновесия (Рис. 8G, H).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Непрерывный приток аминокислот запускает главный каскад синтеза белка (PI3K/AKT/mTOR) и одновременно блокирует работу ферментов разрушения мышц (Atrogin-1 и MuRF-1).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;&lt;strong&gt;Промышленное применение:&lt;/strong&gt; Технологию микрокапсулирования сывороточного белка с помощью кальция, проантоцианидина (экстракта косточек винограда) и гиалуроновой кислоты можно внедрить на молочных заводах и фабриках спортивного/медицинского питания. Это позволит создавать функциональные напитки и сухие смеси пролонгированного действия против саркопении и возрастной потери мышц.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;быстрое&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;усвоение&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сывороточного&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белка&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инкапсуляция в&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;полифенольную&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сеть&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\"
