        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Биотехнология и пищевые технологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;XXI век (активное развитие)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Культивирование клеток, экструзия, 3D-печать, сенсорный анализ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Emerging Infectious Diseases, Advances in Nutrition&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-newfood.html\"&gt;Новая еда&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;«Новая еда» (novel food) — это научное направление, изучающее разработку и производство пищевых продуктов из нетрадиционных источников или с применением инновационных технологий. Предмет исследования включает альтернативные источники белка, такие как растительные аналоги, культивируемое мясо, съедобные насекомые, грибы и водоросли, а также методы их переработки, включая 3D-печать. Цель направления — создание продуктов, которые по питательной ценности и сенсорным характеристикам соответствуют традиционным аналогам, но имеют иные экологические или ресурсные показатели.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Развитие направления началось с поиска способов повышения продовольственной безопасности и снижения нагрузки на сельское хозяйство. Ключевым этапом стало изучение состава растительного сырья, например, корней цикория (Cichorium intybus L.) как источника пищевых волокон. В последние десятилетия фокус сместился на биотехнологические методы: переход от использования компонентов животного происхождения к культивированию клеток в питательных средах на основе растительных белков, таких как арахис и киноа. Параллельно развиваются исследования безопасности, направленные на предотвращение пищевых инфекций и токсикологических рисков, связанных с новыми видами сырья.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;В области «Новой еды» выделяют два основных подхода. Первый — технологический, сосредоточенный на имитации текстуры и вкуса традиционных продуктов (растительные аналоги). Второй — биотехнологический, направленный на создание клеточных структур (культивируемое мясо). Исследователи также анализируют потребительское поведение, изучая, что является определяющим фактором при выборе продукта: реальные сенсорные ощущения или информация о пользе, указанная на упаковке.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Методы «Новой еды» включают культивирование клеток в биореакторах, экструзию растительных белков для создания волокнистой структуры и 3D-печать для формирования сложных пищевых форм. Для оценки качества применяются сенсорный анализ по стандартам ISO, а также методы контроля безопасности, соответствующие принципам HACCP и требованиям ТР ТС 021/2011. Важным инструментом является анализ состава сырья для исключения токсических соединений, таких как цианогенные гликозиды в некоторых видах растений.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;«Новая еда» тесно связана с биотехнологией, пищевой химией, нутрициологией и экологией. Она пересекается с логистическими сервисами, такими как Яндекс Еда, которые обеспечивают доставку продуктов до конечного потребителя. Исследования в этой области опираются на данные о безопасности пищевых продуктов (foodborne diseases) и токсикологии.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Изучение направления возможно в рамках программ по пищевым технологиям, биотехнологии и нутрициологии в профильных университетах. Для углубленного изучения рекомендуется обращаться к рецензируемым научным журналам, публикующим обзоры по пищевой безопасности, нутрициологии и инновационным технологиям переработки сырья.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AF%D0%BD%D0%B4%D0%B5%D0%BA%D1%81_%D0%95%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Яндекс Еда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3201/eid0304.970403\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Emerging foodborne diseases: an evolving public health challenge&lt;/a&gt; — обзор, Emerg Infect Dis 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.brainresbull.2018.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Konzo: a distinct neurological disease associated with food (cassava) cyanogenic poisoning&lt;/a&gt; — обзор, Brain Res Bull 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/advances/nmaa025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Back to the Roots: Revisiting the Use of the Fiber-Rich Cichorium intybusL. Taproots&lt;/a&gt; — обзор, Adv Nutr 2020&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Новая еда","description":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.","vcsPath":"reference/disciplines/dir-newfood.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-newfood.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-newfood.html#istoriya-i-klyuchevye-otkrytiya","level":2},{"title":"Основные школы и подходы","href":"reference/disciplines/dir-newfood.html#osnovnye-shkoly-i-podhody","level":2},{"title":"Методы и инструменты","href":"reference/disciplines/dir-newfood.html#metody-i-instrumenty","level":2},{"title":"Связи с другими направлениями","href":"reference/disciplines/dir-newfood.html#svyazi-s-drugimi-napravleniyami","level":2},{"title":"Где учиться и что читать","href":"reference/disciplines/dir-newfood.html#gde-uchitsya-i-chto-chitat","level":2},{"title":"Источники","href":"reference/disciplines/dir-newfood.html#istochniki","level":2}],"title":"Новая еда"},"router":{"pathname":"reference/disciplines/dir-newfood","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
