        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Зимология (биотехнология)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;Исторически — с древности, как наука — XIX век&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Биореакторный синтез, секвенирование микробиома, хроматография&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Science, J Lipid Res, Clin Microbiol Rev&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-ferment.html\"&gt;Ферментация&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Ферментация — это биохимическая переработка органических веществ под воздействием ферментов или микроорганизмов. Научное направление, изучающее эти процессы и их практическое применение, называется зимологией. Предметом изучения является метаболическая активность микроорганизмов, которая преобразует субстраты в новые продукты, изменяя их органолептические свойства, состав и биологическую активность. Исследования охватывают как традиционные методы (хлебопечение, квашение, производство напитков), так и современные биотехнологии, включая прецизионную ферментацию.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Исторически ферментация использовалась для консервации продуктов и улучшения их усвояемости. Научное понимание процесса началось с изучения роли микроорганизмов в метаболизме. Ключевым этапом стало открытие ферментативной природы брожения, что позволило перевести кустарные методы в область контролируемого производства. Современные исследования сфокусированы на влиянии продуктов ферментации на метаболизм человека, включая целостность кишечного барьера и модуляцию иммунного ответа.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;В современной зимологии выделяют два основных подхода: эмпирический и молекулярно-биологический. Эмпирический подход опирается на традиционные методы, такие как использование заквасок или коджи, и изучает их влияние на конечный продукт, например, ускорение выпечки хлеба при использовании комбучи. Молекулярный подход исследует метаболические пути микроорганизмов, их взаимодействие с субстратом и влияние побочных продуктов, таких как короткоцепочечные жирные кислоты, на энергетический обмен организма-хозяина.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основными инструментами являются контролируемые биореакторы и аналитические методы оценки состава продуктов. В лабораторных условиях применяются методы секвенирования микробиома для идентификации активных штаммов и хроматографический анализ для определения состава метаболитов. Практическое применение включает использование специфических культур для направленного изменения свойств сырья, например, бобов мунг или семян сосны, для получения функциональных напитков.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Зимология тесно связана с микробиологией, биохимией и диетологией. Она пересекается с изучением пробиотиков, так как многие ферментированные продукты содержат активные культуры. Также существует связь с иммунологией через изучение влияния ферментированных продуктов на кишечный барьер и борьбу с патогенами. Понимание метаболических процессов при ферментации дополняет знания об энергетическом обмене клеток, включая эффекты, подобные эффекту Варбурга.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Для глубокого изучения направления рекомендуется обращаться к академическим программам по пищевой биотехнологии и микробиологии. Базовые знания можно получить из профильных обзоров в научных журналах по липидологии, клинической микробиологии и метаболической биологии. Рекомендуется изучать стандарты безопасности пищевых производств и актуальные исследования влияния ферментированных продуктов на здоровье человека.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — обзор, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1194/jlr.r036012\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The role of short-chain fatty acids in the interplay between diet, gut microbiota, and host energy metabolism&lt;/a&gt; — обзор, J Lipid Res 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.11.1.142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diarrheagenic Escherichia coli&lt;/a&gt; — обзор, Clin Microbiol Rev 1998&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ферментация","description":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.","vcsPath":"reference/disciplines/dir-ferment.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-ferment.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-ferment.html#
