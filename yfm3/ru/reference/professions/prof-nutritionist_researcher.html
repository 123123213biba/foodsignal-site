        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Профессии&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;изучает, как еда влияет на обмен веществ и микробиом&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-nutritionist_researcher.jpg\" alt=\"Нутрициолог-исследователь\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Чем занимается&lt;/td&gt;\n&lt;td&gt;изучает, как еда влияет на обмен веществ и микробиом&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что нужно уметь&lt;/td&gt;\n&lt;td&gt;биохимия питания, клинические исследования&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Образование&lt;/td&gt;\n&lt;td&gt;Академическая подготовка в области нутрициологии, диетологии или биохимии.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Где работают&lt;/td&gt;\n&lt;td&gt;НИИ, R&amp;amp;D-отделы пищевых корпораций, государственные органы здравоохранения.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенты&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chem-zanimaetsya\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#chem-zanimaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем занимается&lt;/span&gt;&lt;/a&gt;Чем занимается&lt;/h2&gt;\n&lt;p&gt;Нутрициолог-исследователь — это специалист, изучающий взаимодействие питательных веществ с метаболизмом и микробиомом человека на основе клинических данных и биохимии. В отличие от диетолога, который работает с лечебным питанием при патологиях, нутрициолог-исследователь фокусируется на механизмах усвоения нутриентов, влиянии пищевых матриц на здоровье и разработке стратегий здорового питания. Он анализирует, как изменения в составе пищи, например, добавление полифенолов к белкам или использование специфических бактериальных штаммов, влияют на физиологические маркеры.&lt;/p&gt;\n&lt;h2 id=\"tipichnye-zadachi\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#tipichnye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типичные задачи&lt;/span&gt;&lt;/a&gt;Типичные задачи&lt;/h2&gt;\n&lt;p&gt;Специалист проводит анализ влияния компонентов пищи на организм. В индустрии это может быть поиск способов замедления распада сывороточного белка с помощью растительных соединений или использование яблочного сока как катализатора для создания функциональных продуктов. В клинической практике нутрициолог-исследователь оценивает эффективность вмешательств, например, влияние штамма Pediococcus acidilactici PA53 на маркеры воспаления и работу ЖКТ. Также в задачи входит разработка методов обучения, таких как геймификация для пациентов с диабетом, и анализ социальных факторов, например, влияния совместных приемов пищи на метаболизм углеводов.&lt;/p&gt;\n&lt;h2 id=\"navyki-i-instrumenty\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#navyki-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Навыки и инструменты&lt;/span&gt;&lt;/a&gt;Навыки и инструменты&lt;/h2&gt;\n&lt;p&gt;Для работы требуются знания биохимии питания, микробиологии и методов клинических исследований. Инструментарий включает статистические пакеты для обработки данных мета-анализов и систематических обзоров. Важным навыком является владение методами оценки состава тела и интерпретация данных о нутриентном составе продуктов. Специалист должен уметь работать с поведенческими теориями для разработки стратегий изменения пищевого поведения, опираясь на доказательную базу.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#gde-uchitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться&lt;/span&gt;&lt;/a&gt;Где учиться&lt;/h2&gt;\n&lt;p&gt;Базовое образование включает академическую подготовку в области нутрициологии, диетологии или биохимии. Профессиональный путь предполагает изучение систематических обзоров и мета-анализов, а также участие в клинических исследованиях. Образовательные программы должны включать курсы по методологии научных исследований и статистическому анализу, что позволяет специалисту критически оценивать эффективность диетических вмешательств.&lt;/p&gt;\n&lt;h2 id=\"gde-rabotayut-i-kak-rasti\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#gde-rabotayut-i-kak-rasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают и как расти&lt;/span&gt;&lt;/a&gt;Где работают и как расти&lt;/h2&gt;\n&lt;p&gt;Нутрициологи-исследователи работают в научно-исследовательских институтах, R&amp;amp;D-отделах пищевых корпораций, государственных органах здравоохранения и образовательных центрах. Карьерный рост связан с публикацией результатов исследований в рецензируемых журналах, участием в разработке национальных стандартов питания и руководством проектами по созданию функциональных продуктов питания.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D1%83%D1%82%D1%80%D0%B8%D1%86%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нутрициология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Nutrition_label.gif\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Wikimedia Commons, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pone.0251142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Assessment of body composition in spinal cord injury: A scoping review&lt;/a&gt; — обзор, PLoS One 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12884-025-07185-z\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effective dietary interventions during pregnancy: a systematic review and meta-analysis of behavior change techniques to promote healthy eating&lt;/a&gt; — обзор, BMC Pregnancy Childbirth 2025&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu13114161\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Trends in the Number of Behavioural Theory-Based Healthy Eating Interventions Inclusive of Dietitians/Nutritionists in 2000-2020&lt;/a&gt; — обзор, Nutrients 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Профессии&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"изучает, как еда влияет на обмен веществ и микробиом"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Нутрициолог-исследователь","description":"изучает, как еда влияет на обмен веществ и микробиом","vcsPath":"reference/professions/prof-nutritionist_researcher.md"},"headings":[{"title":"Чем занимается","href":"reference/professions/prof-nutritionist_researcher.html#chem-zanimaetsya","level":2},{"title":"Типичные задачи","href":"reference/professions/prof-nutritionist_researcher.html#tipichnye-zadachi","level":2},{"title":"Навыки и инструменты","href":"reference/professions/prof-nutritionist_researcher.html#navyki-i-instrumenty","level":2},{"title":"Где учиться","href":"reference/professions/prof-nutritionist_researcher.html#gde-uchitsya","level":2},{"title":"Где работают и как расти","href":"reference/professions/prof-nutritionist_researcher.html#gde-rabotayut-i-kak-rasti","level":2},{"title":"Источники","href":"reference/professions/prof-nutritionist_researcher.html#istochniki","level":2}],"title":"Нутрициолог-исследователь"},"router":{"pathname":"reference/professions/prof-nutritionist_researcher","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
