        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-imars.jpg\" alt=\"IMARS — International Maillard Reaction Society\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;International Maillard Reaction Society (IMARS)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Регулярно (симпозиумы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Международная научная конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальные публикации тезисов и сборники материалов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt;, &lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;IMARS (International Maillard Reaction Society) — это международное научное сообщество и серия симпозиумов, посвященных изучению реакции Майяра. Реакция Майяра представляет собой процесс взаимодействия аминокислот и восстанавливающих сахаров при нагревании, который приводит к образованию широкого спектра ароматических соединений, меланоидинов (пигментов) и потенциальных загрязнителей. Конференция является ключевой площадкой для обмена данными между химиками пищевых производств, нутрициологами и специалистами по безопасности продуктов питания.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Сообщество IMARS объединяет исследователей со всего мира, занимающихся фундаментальными и прикладными аспектами неферментативного потемнения продуктов. Деятельность организации направлена на систематизацию знаний о механизмах реакции, протекающей при различных технологических процессах: от сушки креветок горячим воздухом до экструзии компонентов шоколада. Конференции проводятся на регулярной основе для обсуждения актуальных вызовов пищевой индустрии.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Научная программа симпозиумов охватывает несколько критических направлений:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Сенсорный профиль: влияние продуктов реакции Майяра на вкус, аромат и цвет готовых изделий. Исследователи анализируют, как изменение температурных режимов при сушке или термической обработке меняет органолептические свойства.&lt;/li&gt;\n&lt;li&gt;Химическая безопасность: изучение образования акриламида и других потенциально опасных соединений в процессе ультраобработки продуктов. Это направление тесно связано с оценкой рисков при производстве снеков и готовой еды.&lt;/li&gt;\n&lt;li&gt;Технологии контроля: методы управления реакцией для улучшения качества продуктов, включая использование вакуумной сушки или специфических добавок, замедляющих нежелательные процессы порчи.&lt;/li&gt;\n&lt;li&gt;Биологические эффекты: усвояемость продуктов реакции организмом и их влияние на гликемический ответ, что критически важно для понимания метаболических последствий употребления ультраобработанной пищи.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На симпозиумах IMARS впервые представляются результаты метаанализов, лабораторных экспериментов по стабилизации продуктов и инновационных подходов к хранению. Участники обсуждают, как, например, комбинация жидкого дыма и ультразвуковой эмульсии позволяет продлить свежесть морепродуктов, или как экструзия сахара меняет гликемический индекс шоколада. Эти данные служат основой для разработки новых стандартов безопасности и технологических регламентов.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Следить за деятельностью сообщества можно через публикацию тезисов докладов и сборников материалов конференций. Участие предполагает представление собственных исследований, проходящих рецензирование. Для специалистов в области пищевых технологий это основной источник верифицированной информации о том, как контролировать химические изменения в продуктах на молекулярном уровне.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Mars\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mars — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Mars_-_August_30_2021_-_Flickr_-_Kevin_M._Gill.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Kevin Gill from Los Angeles, CA, United States, CC BY 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IMARS — International Maillard Reaction Society","description":"симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса","vcsPath":"reference/conferences/conf-imars.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-imars.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-imars.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-imars.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-imars.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-imars.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-imars.html#istochniki","level":2}],"title":"IMARS — International Maillard Reaction Society"},"router":{"pathname":"reference/conferences/conf-imars","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"se
