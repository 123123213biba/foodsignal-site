        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;европейская конференция по пищевой химии&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;европейская конференция по пищевой химии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;программа, тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;EuChemS (Отделение пищевой химии)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Регулярно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Международная научная конференция (доклады, тезисы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы EuChemS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt;, &lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенты&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Euro Food Chem — это серия международных научных конференций, посвященных фундаментальным и прикладным аспектам химии пищевых продуктов. Мероприятие является площадкой для обмена данными между исследователями, технологами и представителями пищевой промышленности. Основная цель конференции — обсуждение химических процессов, происходящих в продуктах питания при их производстве, хранении и переработке, а также оценка влияния этих процессов на качество и безопасность еды.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференция проводится под эгидой Отделения пищевой химии Европейской ассоциации химических обществ (EuChemS). Мероприятие проходит регулярно, собирая экспертов со всего мира для обсуждения актуальных вызовов в области продовольственной науки. Важно не путать данную научную конференцию с одноименной химической компанией «Еврохим», занимающейся производством удобрений: это разные сущности, не связанные между собой.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Научная программа Euro Food Chem охватывает широкий спектр дисциплин. Ключевые секции обычно включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Аналитическая химия пищевых продуктов: методы определения состава и качества (например, создание биосенсоров для анализа ароматических соединений, таких как пиразины).&lt;/li&gt;\n&lt;li&gt;Технологии переработки: методы изменения свойств сырья, включая использование природных катализаторов для создания функциональных продуктов.&lt;/li&gt;\n&lt;li&gt;Безопасность и стабильность: изучение процессов порчи продуктов, влияния света и химических реакций на состав жиров и белков.&lt;/li&gt;\n&lt;li&gt;Нутрициология и функциональное питание: исследование влияния компонентов пищи на организм, включая метаанализы связи ультраобработанных продуктов с состоянием здоровья.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На Euro Food Chem впервые представляются результаты исследований, которые в дальнейшем влияют на пищевые технологии. Примеры таких разработок включают методы превращения отходов (например, мантии гребешка) в ценный белок, создание защитных покрытий (хитозановая броня) для увеличения срока годности овощей и фруктов, а также результаты клинических испытаний пробиотических штаммов. Конференция служит фильтром, где предварительные данные проходят экспертную оценку научного сообщества.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участие в конференции предполагает представление собственных научных работ в виде устных докладов или стендовых сессий. Для тех, кто не участвует лично, основным источником информации являются сборники тезисов (Abstract Books), которые публикуются по итогам мероприятия. Эти документы содержат краткие описания представленных исследований, методологий и полученных результатов. Следить за анонсами можно через официальные ресурсы EuChemS, где публикуются даты проведения, требования к оформлению тезисов и информация о регистрации.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%95%D0%B2%D1%80%D0%BE%D1%85%D0%B8%D0%BC\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Еврохим — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"европейская конференция по пищевой химии"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Euro Food Chem","description":"европейская конференция по пищевой химии","vcsPath":"reference/conferences/conf-eurofoodchem.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-eurofoodchem.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-eurofoodchem.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-eurofoodchem.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-eurofoodchem.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-eurofoodchem.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-eurofoodchem.html#istochniki","level":2}],"title":"Euro Food Chem"},"router":{"pathname":"reference/conferences/conf-eurofoodchem","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
