        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;реология и структура пищевых продуктов&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;реология и структура пищевых продуктов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество специалистов по реологии и структуре пищевых продуктов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Регулярно, согласно графику профильных научных ассоциаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научный симпозиум с представлением тезисов и публикацией трудов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы профильных научных ассоциаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-structure.html\"&gt;Текстура и физика еды&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;ISFRS (International Symposium on Food Rheology and Structure) — это научное мероприятие, посвященное изучению физических свойств пищевых продуктов. Реология здесь выступает как наука о деформации и течении материи, а структура — как описание пространственного расположения компонентов внутри продукта. Конференция объединяет физиков, химиков и технологов для обсуждения того, как микроструктура еды определяет её текстуру, стабильность и поведение при переработке.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;ISFRS является международной площадкой, где эксперты обсуждают фундаментальные принципы физики еды. Конференция фокусируется на междисциплинарном подходе, связывая молекулярные взаимодействия с макроскопическими свойствами продуктов, которые мы потребляем. Точные даты основания и организационный комитет могут меняться от выпуска к выпуску, поэтому актуальную информацию следует искать на официальных ресурсах профильных научных ассоциаций.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Основные темы конференции охватывают широкий спектр вопросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Реология сложных систем: изучение поведения эмульсий, гелей и пен.&lt;/li&gt;\n&lt;li&gt;Структурный анализ: методы визуализации и измерения внутренней архитектуры пищевых матриц.&lt;/li&gt;\n&lt;li&gt;Модификация текстуры: использование добавок, таких как овощные порошки, для изменения свойств фарша или других белковых систем.&lt;/li&gt;\n&lt;li&gt;Биоматериалы и упаковка: создание съедобных пленок из отходов аквакультуры, например, из кожи рыб.&lt;/li&gt;\n&lt;li&gt;Метаболические аспекты: связь между структурой пищи и её усвояемостью, включая влияние добавок на обмен веществ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На ISFRS представляют результаты исследований, которые меняют подход к пищевым технологиям. Например, здесь обсуждают, как добавление тыквенного порошка в рыбный фарш сурими меняет белковые связи, улучшая текстуру продукта. Также рассматриваются инновации в области безопасности: от анализа наночастиц в БАДах до разработки биоразлагаемых упаковочных материалов. Конференция служит местом, где фундаментальные открытия в физике полимеров превращаются в прикладные решения для пищевой промышленности.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Для участия в ISFRS исследователи обычно подают тезисы своих работ, которые проходят рецензирование. Следить за результатами можно через сборники трудов конференции, где публикуются доклады о новых методах анализа и технологических решениях. Участие позволяет специалистам обмениваться данными о методологиях измерения вязкости, упругости и прочности пищевых систем.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"реология и структура пищевых продуктов"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ISFRS — Food Rheology and Structure","description":"реология и структура пищевых продуктов","vcsPath":"reference/conferences/conf-isfrs.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-isfrs.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-isfrs.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-isfrs.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-isfrs.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-isfrs.html#kak-sledit-i-uchastvovat","level":2}],"title":"ISFRS — Food Rheology and Structure"},"router":{"pathname":"reference/conferences/conf-isfrs","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
