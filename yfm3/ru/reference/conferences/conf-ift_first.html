        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Институт пищевых технологов (США): крупнейшая научная программа и выставка&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-ift_first.jpg\" alt=\"IFT FIRST\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Институт пищевых технологов (США): крупнейшая научная программа и выставка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;программа и аннотации докладов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;Institute of Food Technologists (IFT)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научная конференция и выставка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;ift.org&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt;, &lt;a href=\"concepts/spec-newfood.html\"&gt;Новая еда&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;IFT FIRST (Food Improved by Research, Science, and Technology) — это ежегодное научное мероприятие, объединяющее экспертов в области пищевых технологий, нутрициологии и безопасности продуктов питания. Конференция служит площадкой для представления прикладных исследований, которые трансформируют лабораторные протоколы в промышленные решения. Основная цель события — демонстрация инноваций, способных повысить качество, питательную ценность и безопасность еды, которую мы потребляем ежедневно.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Мероприятие проводится Институтом пищевых технологов (Institute of Food Technologists, IFT). Это профессиональная международная организация, базирующаяся в США, которая объединяет ученых, инженеров и специалистов пищевой индустрии. Конференция является крупнейшей в своем роде программой, где ежегодно обсуждаются актуальные вызовы: от переработки побочных продуктов производства до борьбы с микробиологической порчей сырья.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа конференции охватывает широкий спектр дисциплин, связанных с пищевой инженерией и химией. Ключевые направления включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Технологии обработки: методы экструзии, термической обработки и ультразвуковой эмульсии для изменения структуры продуктов.&lt;/li&gt;\n&lt;li&gt;Безопасность и хранение: разработка защитных покрытий, таких как хитозановые гидрогели, и методы предотвращения порчи в упаковке.&lt;/li&gt;\n&lt;li&gt;Функциональные ингредиенты: переработка отходов (например, мантии гребешка) в ценные белковые компоненты.&lt;/li&gt;\n&lt;li&gt;Анализ рисков: изучение влияния ультраобработки на здоровье человека и контроль микотоксинов в растительных белках.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На IFT FIRST впервые демонстрируются результаты исследований, которые меняют подход к производству еды. Например, здесь обсуждаются способы снижения гликемического ответа через изменение параметров экструзии сахара и молока, а также методы продления свежести продуктов, таких как мидии су-вид, с помощью комбинации жидкого дыма и наноэмульсий. Конференция является первичным источником данных о новых способах стабилизации жиров и защиты урожая от патогенов, что позволяет специалистам внедрять проверенные научные методы в реальное производство.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участники могут ознакомиться с научными результатами через официальные сборники тезисов и аннотации докладов, публикуемые институтом. Для специалистов доступ к материалам конференции открывает возможность изучить протоколы исследований, которые впоследствии становятся основой для новых стандартов безопасности и качества пищевой продукции. Участие в мероприятии позволяет отслеживать актуальные тренды в пищевой науке и получать доступ к верифицированным данным о влиянии различных технологий обработки на состав и свойства продуктов.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D0%B8%D1%81%D0%BE%D0%BA_%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D0%BA%D0%BE%D0%B2_%D1%80%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%BD%D0%BE%D1%81%D0%B8%D1%82%D0%B5%D0%BB%D1%8F_Starship\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Список запусков ракеты-носителя Starship — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Starship-IFT2-ascent_(cropped).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Osunpokeh, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrg2774\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The primary cilium: a signalling centre during vertebrate development&lt;/a&gt; — обзор, Nat Rev Genet 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.tibs.2015.09.003\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IFT-Cargo Interactions and Protein Transport in Cilia&lt;/a&gt; — обзор, Trends Biochem Sci 2015&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1083/jcb.200709133\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Intraflagellar transport motors in cilia: moving along the cell's antenna&lt;/a&gt; — обзор, J Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Институт пищевых технологов (США): крупнейшая научная программа и выставка"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IFT FIRST","description":"Институт пищевых технологов (США): крупнейшая научная программа и выставка","vcsPath":"reference/conferences/conf-ift_first.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-ift_first.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история"
