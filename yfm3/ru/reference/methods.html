        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;29 концепций&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ftir-spectroscopy.html\"&gt;FTIR-спектроскопия&lt;/a&gt; — Аналитический метод, используемый для подтверждения структурной целостности желатина через идентификацию амидных полос.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maldi-tof-mass-spectrometry.html\"&gt;MALDI-TOF масс-спектрометрия&lt;/a&gt; — Аналитический метод идентификации микроорганизмов, основанный на масс-спектрометрическом анализе ионизированных молекул.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-absorption-spectrometry.html\"&gt;Атомно-абсорбционная спектрометрия&lt;/a&gt; — Метод количественного химического анализа, применяемый в работе для выявления концентрации свинца и кадмия в личинках.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hurdle-technology.html\"&gt;барьерный подход&lt;/a&gt; — Метод консервации продуктов питания путем объединения нескольких факторов воздействия для подавления микроорганизмов и продления срока…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/winterization.html\"&gt;Винтеризация&lt;/a&gt; — Технологический процесс очистки экстракта путем охлаждения для осаждения и последующего удаления липидных фракций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hplc.html\"&gt;ВЭЖХ&lt;/a&gt; — Аналитический метод, используемый для количественного определения содержания микотоксинов в зернобобовых культурах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-chromatography-mass-spectrometry.html\"&gt;Газовая хроматография-масс-спектрометрия&lt;/a&gt; — Аналитический метод, использованный для идентификации 29 соединений в составе эфирного масла тимьяна.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha-based-sourdough.html\"&gt;Закваска на основе комбучи&lt;/a&gt; — Микробный инокулят для хлебопечения, полученный путем адаптации симбиотического сообщества комбучи к зерновой матрице.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;ИК-спектроскопия с преобразованием Фурье&lt;/a&gt; — Аналитический метод, примененный для обнаружения изменений во вторичной структуре белков под воздействием тыквенного порошка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elisa.html\"&gt;ИФА&lt;/a&gt; — Метод лабораторного скрининга, применяемый для обнаружения микотоксинов в сырье.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meta-analysis.html\"&gt;Метаанализ&lt;/a&gt; — Статистический метод объединения результатов нескольких независимых исследований для получения обобщенной оценки эффекта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/check-all-that-apply.html\"&gt;Метод CATA&lt;/a&gt; — Метод сенсорного анализа, при котором участники выбирают подходящие характеристики продукта из предложенного списка дескрипторов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;Метод бляшкообразующих единиц&lt;/a&gt; — Стандартный лабораторный метод для количественного определения концентрации жизнеспособных вирусных частиц в образце.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kjeldahl-method.html\"&gt;Метод Кьельдаля&lt;/a&gt; — Аналитический метод определения содержания сырого протеина в пищевых продуктах с использованием коэффициента пересчета 6,25.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/technology-acceptance-model.html\"&gt;модель принятия технологий&lt;/a&gt; — Метод оценки цифрового инструмента, основанный на опроснике Дэвиса и измеряющий воспринимаемую пользователями полезность и простоту…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molecular-docking.html\"&gt;Молекулярный докинг&lt;/a&gt; — Компьютерный метод моделирования взаимодействия молекул полифенолов с белками-мишенями для оценки энергии сродства.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observational-cross-sectional-study.html\"&gt;Наблюдательное кросс-секционное исследование&lt;/a&gt; — Научный метод оценки эффективности инструментов, основанный на одномоментном сравнении результатов работы ИИ и групп врачей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/carbohydrate-counting.html\"&gt;подсчет углеводов&lt;/a&gt; — Подход к диетотерапии, требующий расчета потребления углеводов на каждый прием пищи и коррекции доз инсулина короткого действия с учетом…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;Сверхвысокоэффективная жидкостная хроматография&lt;/a&gt; — Аналитический метод разделения и определения состава свободных сахаров и фенольных фракций в образцах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/16s-rrna-gene-sequencing.html\"&gt;секвенирование гена 16S рРНК&lt;/a&gt; — Метод анализа микробиоты кишечника путем исследования гипервариабельных регионов гена 16S рРНК.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-protein-particle-encapsulation-sppe.html\"&gt;Система капсулирования отдельных белковых частиц&lt;/a&gt; — Технология создания защитной оболочки вокруг белковых микросфер для контроля скорости их высвобождения в ЖКТ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;сканирующая электронная микроскопия&lt;/a&gt; — Метод микроскопического анализа, использованный для подтверждения плотной упаковки белковой сети геля.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hot-air-drying.html\"&gt;сушка горячим воздухом&lt;/a&gt; — Технология обезвоживания пищевого сырья при повышенной температуре, способствующая протеканию реакции Майяра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-polymerization.html\"&gt;Термическая полимеризация&lt;/a&gt; — Процесс нагревания белкового изолята для формирования стабильных микросфер, используемых в качестве основы для инкапсуляции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enzymatic-modification.html\"&gt;Ферментативная модификация&lt;/a&gt; — Технологический процесс связывания кофейных фенолов с белками с помощью яблочного сока при пониженном pH.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt; — Ферментация — это процесс биологической переработки растительного сырья с помощью микроорганизмов, приводящий к изменению химического…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/alkaline-extraction.html\"&gt;Щелочная экстракция&lt;/a&gt; — Технологический процесс извлечения белка из сырья путем изменения уровня pH среды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt; — Экструзия — это процесс непрерывного смешивания и замешивания сырья при высоких температурах и давлении, применяемый для изменения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sds-page.html\"&gt;Электрофорез в полиакриламидном геле&lt;/a&gt; — Метод разделения белков по их молекулярной массе, используемый для анализа агрегации белковых молекул.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"29 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Методы","description":"29 концепций","vcsPath":"reference/methods.md"},"headings":[],"title":"Методы"},"router":{"pathname":"reference/methods","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
