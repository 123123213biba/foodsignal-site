            {"data":{"leading":false,"html":"&lt;p&gt;15 концепций&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/antimicrobial-resistance.html\"&gt;Антибиотикорезистентность&lt;/a&gt; — Способность микроорганизмов сохранять жизнеспособность при воздействии антибиотиков, обусловленная наличием специфических генов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secondary-nucleation.html\"&gt;Вторичная нуклеация&lt;/a&gt; — Процесс образования новых кристаллов в пересыщенном растворе, вызванный присутствием уже существующих кристаллов или частиц.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-production.html\"&gt;газообразование&lt;/a&gt; — Дефект порчи пищевых продуктов, вызываемый жизнедеятельностью микроорганизмов и приводящий к вздутию упаковки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glycogen-hepatopathy.html\"&gt;Гликогеновая гепатопатия&lt;/a&gt; — Патологическое состояние, характеризующееся избыточным накоплением гликогена в печени, вызванное высокоуглеводным рационом.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimorbidity.html\"&gt;Мультиморбидность&lt;/a&gt; — Состояние, при котором у одного пациента одновременно присутствуют два или более хронических заболевания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acute-gastric-mucosal-lesion.html\"&gt;Острое повреждение слизистой оболочки желудка&lt;/a&gt; — Патологическое состояние, вызванное чрезмерным потреблением этанола, приводящее к нарушению барьерной функции слизистой оболочки желудка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postprandial-metabolic-response.html\"&gt;Постпрандиальный метаболический ответ&lt;/a&gt; — Изменение уровней глюкозы, инсулина и триглицеридов в крови человека после приема пищи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maillard-reaction.html\"&gt;реакция Майяра&lt;/a&gt; — Химическая реакция между аминокислотами и сахарами при нагревании, формирующая специфические ароматические и вкусовые соединения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sarcopenia.html\"&gt;Саркопения&lt;/a&gt; — Возрастное дегенеративное заболевание, характеризующееся потерей мышечной массы и силы, ведущее к физической слабости.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/type-1-diabetes.html\"&gt;сахарный диабет 1 типа&lt;/a&gt; — Хроническое аутоиммунное заболевание с высокой распространенностью среди детей и подростков, требующее гликемического контроля, введения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pi3k-akt-mtor-signaling-pathway.html\"&gt;Сигнальный путь PI3K/AKT/mTOR&lt;/a&gt; — Биохимический путь, активация которого способствует синтезу мышечного белка и подавлению мышечной атрофии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-physiology.html\"&gt;Социальная физиология&lt;/a&gt; — Феномен, при котором присутствие близкого человека снижает физиологическую нагрузку на организм при стрессовых воздействиях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/disconfirmation.html\"&gt;Феномен дезавуирования&lt;/a&gt; — Психологический эффект изменения оценки продукта потребителем после получения дополнительной информации о нем.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-constipation.html\"&gt;функциональный запор&lt;/a&gt; — Хроническое расстройство кишечника, проявляющееся редкой дефекацией (менее трех раз в неделю), твердым стулом и чувством неполного…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cytokine-storm.html\"&gt;Цитокиновый шторм&lt;/a&gt; — Состояние избыточного воспаления, характеризующееся неконтролируемым выбросом провоспалительных цитокинов, повреждающее ткани организма.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"15 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Явления","description":"15 концепций","vcsPath":"reference/phenomena.md"},"headings":[],"title":"Явления"},"router":{"pathname":"reference/phenomena","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{
