            {"data":{"leading":false,"html":"&lt;p&gt;229 концепций&lt;/p&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-micronutrients.html\"&gt;Витамины и минералы&lt;/a&gt; — Содержание, потери при готовке, обогащение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/v-dannom-issledovanii-ispolzuetsya-model-caco-2.html\"&gt;В данном исследовании используется модель Caco-2&lt;/a&gt; — Линия клеток аденокарциномы толстой кишки человека, которая при культивировании образует монослой, имитирующий эпителий кишечника.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/winterization.html\"&gt;Винтеризация&lt;/a&gt; — Технологический процесс очистки экстракта путем охлаждения для осаждения и последующего удаления липидных фракций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/water-holding-capacity.html\"&gt;влагоудерживающая способность&lt;/a&gt; — Свойство геля удерживать влагу, возрастающее на 11,21% при добавлении оптимальной дозы тыквенного порошка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extracellular-matrix.html\"&gt;Внеклеточный матрикс&lt;/a&gt; — Структурная основа, состоящая из белков, которая необходима клеткам для прикрепления к поверхности и деления.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secondary-nucleation.html\"&gt;Вторичная нуклеация&lt;/a&gt; — Процесс образования новых кристаллов в пересыщенном растворе, вызванный присутствием уже существующих кристаллов или частиц.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hplc.html\"&gt;ВЭЖХ&lt;/a&gt; — Аналитический метод, используемый для количественного определения содержания микотоксинов в зернобобовых культурах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_based.html\"&gt;Растительные аналоги&lt;/a&gt; — Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/randomizirovannoe-dvoynoe-slepoe-platsebo-kontroliruemoe-iss.html\"&gt;Рандомизированное двойное слепое плацебо-контролируемое исследование&lt;/a&gt; — «золотой стандарт» клинических испытаний, где ни участники, ни исследователи не знают, кто получает активный препарат.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plant-based-yogurt-alternative.html\"&gt;Растительный аналог йогурта&lt;/a&gt; — Ферментированный пищевой продукт на растительной основе, предназначенный для замены молочного йогурта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/margin-of-exposure.html\"&gt;Расчетный предел воздействия&lt;/a&gt; — Показатель химической безопасности, используемый для оценки рисков воздействия свинца, где значение ниже 10 считается небезопасным по…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maillard-reaction.html\"&gt;реакция Майяра&lt;/a&gt; — Химическая реакция между аминокислотами и сахарами при нагревании, формирующая специфические ароматические и вкусовые соединения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recombinant-human-type-iii-collagen.html\"&gt;Рекомбинантный человеческий коллаген III типа&lt;/a&gt; — Биотехнологически полученный белок внеклеточного матрикса, используемый как биоматериал для защиты слизистой оболочки желудка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/trichiurus-haumela.html\"&gt;рыба-сабля&lt;/a&gt; — Вид рыбы, миофибриллярные белки которой обладают слабой способностью к формированию прочного геля.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-shelf_life.html\"&gt;Срок годности&lt;/a&gt; — Порча, прогнозирование срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sarcopenia.html\"&gt;Саркопения&lt;/a&gt; — Возрастное дегенеративное заболевание, характеризующееся потерей мышечной массы и силы, ведущее к физической слабости.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/type-1-diabetes.html\"&gt;сахарный диабет 1 типа&lt;/a&gt; — Хроническое аутоиммунное заболевание с высокой распространенностью среди детей и подростков, требующее гликемического контроля, введения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;Сверхвысокоэффективная жидкостная хроматография&lt;/a&gt; — Аналитический метод разделения и определения состава свободных сахаров и фенольных фракций в образцах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/16s-rrna-gene-sequencing.html\"&gt;секвенирование гена 16S рРНК&lt;/a&gt; — Метод анализа микробиоты кишечника путем исследования гипервариабельных регионов гена 16S рРНК.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pi3k-akt-mtor-signaling-pathway.html\"&gt;Сигнальный путь PI3K/AKT/mTOR&lt;/a&gt; — Биохимический путь, активация которого способствует синтезу мышечного белка и подавлению мышечной атрофии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sinerezis.html\"&gt;Синерезис&lt;/a&gt; — Процесс самопроизвольного отделения сыворотки от гелевой структуры ферментированного продукта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-protein-particle-encapsulation-sppe.html\"&gt;Система капсулирования отдельных белковых частиц&lt;/a&gt; — Технология создания защитной оболочки вокруг белковых микросфер для контроля скорости их высвобождения в ЖКТ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;сканирующая электронная микроскопия&lt;/a&gt; — Метод микроскопического анализа, использованный для подтверждения плотной упаковки белковой сети геля.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/somatostatin.html\"&gt;соматостатин&lt;/a&gt; — Сывороточный регуляторный фактор, угнетающий моторную активность кишечника.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/potassium-sorbate.html\"&gt;сорбат калия&lt;/a&gt; — Пищевой консервант, используемый для подавления роста газообразующих бактерий в соусе васаби.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wasabi-sauce.html\"&gt;соус васаби&lt;/a&gt; — Приправа, изготавливаемая преимущественно из корня хрена (Armoracia rusticana), обладающая антимикробными свойствами и остротой за счет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-physiology.html\"&gt;Социальная физиология&lt;/a&gt; — Феномен, при котором присутствие близкого человека снижает физиологическую нагрузку на организм при стрессовых воздействиях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mediterranean-mussel.html\"&gt;средиземноморская мидия&lt;/a&gt; — Вид двустворчатых моллюсков, используемый в исследовании в качестве объекта консервации и характеризующийся высоким содержанием белка и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Показатель точности расчетов, отражающий среднее отклонение значений, полученных ИИ или экспертами, от эталонных данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/surimi.html\"&gt;сурими&lt;/a&gt; — Рыбный фарш, текстура и белковая сеть геля которого могут быть укреплены добавлением растительного порошка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hot-air-drying.html\"&gt;сушка горячим воздухом&lt;/a&gt; — Технология обезвоживания пищевого сырья при повышенной температуре, способствующая протеканию реакции Майяра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/edible-packaging.html\"&gt;Съедобная упаковка&lt;/a&gt; — Съедобная упаковка — это биоразлагаемый защитный барьер из пищевых компонентов, предназначенный для снижения потери влаги и подавления…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whey-protein-isolate.html\"&gt;Сывороточный изолят&lt;/a&gt; — Высокоочищенная форма белка молочной сыворотки, содержащая значительное количество незаменимых аминокислот.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l\"&gt;&lt;a href=\"reference/glossary.html#l\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Л&lt;/span&gt;&lt;/a&gt;Л&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rhynchophorus-phoenicis-larvae.html\"&gt;Личинки пальмового долгоносика&lt;/a&gt; — Вид съедобных насекомых, используемый как источник белка, требующий контроля чистоты субстрата из-за накопления тяжелых металлов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-lipid_aroma.html\"&gt;Окисление жиров и ароматы&lt;/a&gt; — Прогоркание, «рыбный» запах, ароматы жареного масла.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/olfactory-receptor-or5k1.html\"&gt;Обонятельный рецептор OR5K1&lt;/a&gt; — Белковая структура, используемая в биосенсоре для специфического распознавания молекул пиразинов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/total-antioxidant-capacity.html\"&gt;Общая антиоксидантная способность&lt;/a&gt; — Показатель, отражающий способность организма противостоять окислительному стрессу.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aerobic-plate-count.html\"&gt;Общая обсемененность мезофиллами&lt;/a&gt; — Микробиологический показатель, отражающий уровень загрязнения сырья, используемый для оценки эффективности термообработки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/residual-organic-solvents.html\"&gt;Остаточные органические растворители&lt;/a&gt; — Химические соединения, используемые в процессе кристаллизации, следы которых остаются в конечном продукте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acute-gastric-mucosal-lesion.html\"&gt;Острое повреждение слизистой оболочки желудка&lt;/a&gt; — Патологическое состояние, вызванное чрезмерным потреблением этанола, приводящее к нарушению барьерной функции слизистой оболочки желудка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hazard-ratio.html\"&gt;Отношение рисков&lt;/a&gt; — Показатель, отражающий соотношение вероятности наступления события в группе воздействия к вероятности в контрольной группе за определенный…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structure.html\"&gt;Текстура и физика еды&lt;/a&gt; — Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gel-hardness.html\"&gt;твердость геля&lt;/a&gt; — Показатель механической прочности сурими, достигающий значения 313,69 ± 2,54 г при добавлении 1,1% порошка тыквы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-polymerization.html\"&gt;Термическая полимеризация&lt;/a&gt; — Процесс нагревания белкового изолята для формирования стабильных микросфер, используемых в качестве основы для инкапсуляции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-stability.html\"&gt;Термостабильность&lt;/a&gt; — Способность белкового продукта сохранять свои свойства при воздействии высоких температур.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/test-s-trubkami-darema.html\"&gt;Тест с трубками Дарема&lt;/a&gt; — Лабораторный метод, применяемый в микробиологии для обнаружения газообразующих бактерий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thiobarbituric-acid-reactive-substances.html\"&gt;тиобарбитуровое число&lt;/a&gt; — Метрика содержания малонового диальдегида, отражающая интенсивность окислительной порчи липидов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transepithelial-electrical-resistance.html\"&gt;Трансэпителиальное электрическое сопротивление&lt;/a&gt; — Показатель целостности и барьерной функции клеточного монослоя, измеряемый в Ом·см².&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tricolor-quinoa.html\"&gt;Трехцветное киноа&lt;/a&gt; — Смесь зерен белого, красного и черного киноа, используемая как добавка в рацион для защиты слизистой оболочки желудка.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zh\"&gt;&lt;a href=\"reference/glossary.html#zh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ж&lt;/span&gt;&lt;/a&gt;Ж&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gelatin.html\"&gt;желатин&lt;/a&gt; — Белковый биополимер, используемый в пищевой промышленности для создания пленок благодаря способности к гелеобразованию, контролю вязкости и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sea-bass-skin-gelatin.html\"&gt;Желатин из кожи сибаса&lt;/a&gt; — Высокобелковый биополимер, полученный из отходов переработки кожи европейского сибаса, используемый как основа для съедобной упаковки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/liquid-smoke.html\"&gt;жидкий дым&lt;/a&gt; — Пищевой ароматизатор, получаемый путем пиролиза биомассы и содержащий карбонилы и фенолы, обладающие антибактериальной и антиоксидантной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zhiznesposobnost-kletok.html\"&gt;Жизнеспособность клеток&lt;/a&gt; — Процент «живых» клеток в культуре после воздействия повреждающего фактора.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oilseed-cake.html\"&gt;Жмых&lt;/a&gt; — Твердый остаток, получаемый после извлечения масла из семян масличных культур.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s1\"&gt;&lt;a href=\"reference/glossary.html#s1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S&lt;/span&gt;&lt;/a&gt;S&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scoby.html\"&gt;SCOBY&lt;/a&gt; — Симбиотическое сообщество бактерий и дрожжей, осуществляющее ферментацию комбучи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smartcloth-odyssey.html\"&gt;SMARTCLOTH-Odyssey&lt;/a&gt; — Веб-платформа с геймифицированным интерфейсом на фреймворке React, созданная для помощи медсестрам-педагогам в обучении подростков с СД1…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/streptococcus-thermophilus-and-lactobacillus-delbrueckii.html\"&gt;Streptococcus thermophilus и Lactobacillus delbrueckii&lt;/a&gt; — Стартовая культура молочнокислых бактерий, применяемая для ферментации растительного сырья.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e\"&gt;&lt;a href=\"reference/glossary.html#e\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Э&lt;/span&gt;&lt;/a&gt;Э&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-extrusion.html\"&gt;Экструзия&lt;/a&gt; — Хлопья, снеки, текстурированный белок: как работает экструдер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eugenol.html\"&gt;Эвгенол&lt;/a&gt; — Компонент эфирного масла гвоздики, обеспечивающий антиоксидантную активность покрытия.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html\"&gt;экстракт кожуры грейпфрута&lt;/a&gt; — Растительный экстракт, богатый фенольными соединениями и антиоксидантами, используемый в качестве активного природного консерванта для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/broccoli-sprout-extract.html\"&gt;Экстракт ростков брокколи&lt;/a&gt; — Биологически активная добавка, полученная из ростков брокколи, используемая для активации защитных механизмов организма.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt; — Экструзия — это процесс непрерывного смешивания и замешивания сырья при высоких температурах и давлении, применяемый для изменения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/electronic-nose.html\"&gt;электронный нос&lt;/a&gt; — Аналитический прибор, применяемый в исследовании для регистрации и сопоставления сенсорных профилей летучих ароматических веществ образцов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sds-page.html\"&gt;Электрофорез в полиакриламидном геле&lt;/a&gt; — Метод разделения белков по их молекулярной массе, используемый для анализа агрегации белковых молекул.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thyme-essential-oil.html\"&gt;Эфирное масло тимьяна&lt;/a&gt; — Природное соединение, добавляемое в состав пленки для подавления роста бактерий и замедления окисления белков и липидов в мясе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservation_heat.html\"&gt;Пастеризация и стерилизация&lt;/a&gt; — Тепловая обработка ради безопасности и срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-probiotics.html\"&gt;Пробиотики&lt;/a&gt; — Живые культуры и их выживание в продуктах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioactives.html\"&gt;Полифенолы и биоактивные вещества&lt;/a&gt; — Полифенолы, каротиноиды, флавоноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gpaef-peptide.html\"&gt;Пептид GPAEF&lt;/a&gt; — Пентапептид, образующийся при расщеплении рекомбинантного коллагена в желудке, который активирует синтез простагландинов через…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peroxide-value.html\"&gt;перекисное число&lt;/a&gt; — Показатель степени окисления жиров, используемый для оценки свежести мясных продуктов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pyrazines.html\"&gt;Пиразины&lt;/a&gt; — Гетероциклические органические соединения, отвечающие за формирование ароматов жареного, орехового и хлебного профилей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;Площадь под гликемической кривой&lt;/a&gt; — Показатель, отражающий общую величину и длительность отклонения уровня глюкозы в крови от базового уровня после приема пищи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/side-streams.html\"&gt;Побочные продукты&lt;/a&gt; — Части рыбы (кожа, кости, чешуя), которые остаются после производства филе. Их переработка в желатин превращает отходы в ценный ресурс…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/carbohydrate-counting.html\"&gt;подсчет углеводов&lt;/a&gt; — Подход к диетотерапии, требующий расчета потребления углеводов на каждый прием пищи и коррекции доз инсулина короткого действия с учетом…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenols.html\"&gt;Полифенолы&lt;/a&gt; — Группа химических соединений в составе яблок, обеспечивающая основную способность плодов нейтрализовать свободные радикалы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenol-oxidase.html\"&gt;Полифенолоксидаза&lt;/a&gt; — Фермент, катализирующий окисление фенольных соединений, используемый для модификации белков в мягких условиях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polosa-sore.html\"&gt;Полоса Соре&lt;/a&gt; — Интенсивная полоса поглощения в спектре гемоглобина при 407 нм, используемая для контроля целостности молекулы белка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;порошок сушеной тыквы&lt;/a&gt; — Овощная добавка, изменяющая вторичную структуру белков и укрепляющая гелевую сеть сурими при дозировке 1,1%.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postprandial-metabolic-response.html\"&gt;Постпрандиальный метаболический ответ&lt;/a&gt; — Изменение уровней глюкозы, инсулина и триглицеридов в крови человека после приема пищи.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-veg_ferm.html\"&gt;Квашения и соленья&lt;/a&gt; — Кимчи, квашеная капуста, соленья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-koji_precision.html\"&gt;Коджи и прецизионная ферментация&lt;/a&gt; — Aspergillus, мисо, соевый соус; белки, выращенные микробами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cannabidiol.html\"&gt;Каннабидиол&lt;/a&gt; — Липофильное кристаллическое вещество, получаемое из биомассы Cannabis sativa L., используемое в качестве активного компонента биологически…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/intestinal-barrier.html\"&gt;Кишечный барьер&lt;/a&gt; — Структурно-функциональная система эпителиальных клеток и белков, контролирующая проницаемость кишечника для веществ и защищающая организм…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nova-classification.html\"&gt;Классификация NOVA&lt;/a&gt; — Система категоризации пищевых продуктов, основанная на степени их промышленной технологической переработки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ges-1-cells.html\"&gt;Клетки GES-1&lt;/a&gt; — Линия эпителиальных клеток желудка человека, используемая в качестве модели для изучения повреждений слизистой оболочки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cultured-meat.html\"&gt;Клеточное мясо&lt;/a&gt; — Продукт, полученный путем культивирования мышечных клеток в искусственной среде без использования цельного организма животного.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha.html\"&gt;Комбуча&lt;/a&gt; — Слабокислый ферментированный напиток из подслащенного чая, получаемый в результате деятельности симбиотического сообщества бактерий и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/short-chain-fatty-acids.html\"&gt;Короткоцепочечные жирные кислоты&lt;/a&gt; — Метаболиты, образующиеся в кишечнике в результате жизнедеятельности микробиоты, участвующие в модуляции иммунного ответа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/krasochnyy-painty-privkus.html\"&gt;Красочный» (painty) привкус&lt;/a&gt; — Специфический дефект вкуса, напоминающий запах масляной краски, часто возникающий при окислении жиров в растительном сырье.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shrimp-meat-floss.html\"&gt;креветочный флосс&lt;/a&gt; — Обезвоженный волокнистый продукт из вареного мяса креветок, полученный путем приправки, сушки и измельчения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergens.html\"&gt;Аллергены&lt;/a&gt; — Выявление и снижение аллергенности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/active-packaging.html\"&gt;Активная упаковка&lt;/a&gt; — Упаковочный материал на основе хитозана и эфирного масла, предназначенный для продления срока свежести куриного филе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sodium-alginate.html\"&gt;Альгинат натрия&lt;/a&gt; — Природный полисахарид, используемый в качестве основы для создания защитного биоразлагаемого покрытия на поверхности плодов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/antimicrobial-resistance.html\"&gt;Антибиотикорезистентность&lt;/a&gt; — Способность микроорганизмов сохранять жизнеспособность при воздействии антибиотиков, обусловленная наличием специфических генов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/antioxidant-potential.html\"&gt;Антиоксидантный потенциал&lt;/a&gt; — Количественная характеристика способности вещества нейтрализовать свободные радикалы, измеряемая методами ABTS, DPPH и FRAP.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-absorption-spectrometry.html\"&gt;Атомно-абсорбционная спектрометрия&lt;/a&gt; — Метод количественного химического анализа, применяемый в работе для выявления концентрации свинца и кадмия в личинках.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aflatoxin-b1.html\"&gt;Афлатоксин B1&lt;/a&gt; — Опасный вторичный метаболит плесневых грибов, классифицированный IARC как канцероген группы 1.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z\"&gt;&lt;a href=\"reference/glossary.html#z\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;З&lt;/span&gt;&lt;/a&gt;З&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sourdough.html\"&gt;Закваска и хлеб&lt;/a&gt; — Дикие дрожжи и молочнокислые бактерии в тесте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-contaminants.html\"&gt;Загрязнители процесса&lt;/a&gt; — Акриламид, ПАУ, фуран: как образуются и как снизить.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha-based-sourdough.html\"&gt;Закваска на основе комбучи&lt;/a&gt; — Микробный инокулят для хлебопечения, полученный путем адаптации симбиотического сообщества комбучи к зерновой матрице.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f\"&gt;&lt;a href=\"reference/glossary.html#f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ф&lt;/span&gt;&lt;/a&gt;Ф&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-ferment.html\"&gt;Ферментация&lt;/a&gt; — Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-beverage_ferm.html\"&gt;Ферментированные напитки&lt;/a&gt; — Пиво, вино, комбуча, квас.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/disconfirmation.html\"&gt;Феномен дезавуирования&lt;/a&gt; — Психологический эффект изменения оценки продукта потребителем после получения дополнительной информации о нем.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enzymatic-modification.html\"&gt;Ферментативная модификация&lt;/a&gt; — Технологический процесс связывания кофейных фенолов с белками с помощью яблочного сока при пониженном pH.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt; — Ферментация — это процесс биологической переработки растительного сырья с помощью микроорганизмов, приводящий к изменению химического…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/flexitarians.html\"&gt;Флекситарианцы&lt;/a&gt; — Группа потребителей, которые осознанно сокращают потребление мяса и чаще выбирают растительные альтернативы молочным продуктам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/photooxidation.html\"&gt;Фотоокисление&lt;/a&gt; — Процесс химического разрушения жирных кислот под действием света и фотосенсибилизаторов, приводящий к порче липидов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fructooligosaccharides.html\"&gt;Фруктоолигосахариды&lt;/a&gt; — Углеводные соединения, содержащиеся в корне якона, которые служат сырьем для получения маннита путем ферментации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-constipation.html\"&gt;функциональный запор&lt;/a&gt; — Хроническое расстройство кишечника, проявляющееся редкой дефекацией (менее трех раз в неделю), твердым стулом и чувством неполного…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dairy_ferm.html\"&gt;Молочная ферментация&lt;/a&gt; — Йогурт, кефир, сыры: закваски и созревание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbial.html\"&gt;Микробная безопасность&lt;/a&gt; — Патогены, биоплёнки, обеззараживание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malondialdehyde.html\"&gt;Малоновый диальдегид&lt;/a&gt; — Токсичный продукт глубокого окисления липидов, используемый как маркер порчи жиросодержащих продуктов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mannitol.html\"&gt;Маннит&lt;/a&gt; — Шестиатомный спирт, используемый в качестве низкокалорийного сахарозаменителя с низким гликемическим индексом.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scallop-mantle.html\"&gt;Мантия гребешка&lt;/a&gt; — Побочный продукт переработки морепродуктов, используемый как сырье для получения пищевого белка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensor-matrix.html\"&gt;Матрица сенсора&lt;/a&gt; — Композитный материал из наночастиц золота, металлоорганических каркасов, углеродных нанотрубок и MXene, обеспечивающий проводимость и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meta-analysis.html\"&gt;Метаанализ&lt;/a&gt; — Статистический метод объединения результатов нескольких независимых исследований для получения обобщенной оценки эффекта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mpns.html\"&gt;Металл-полифенольные сети&lt;/a&gt; — Самособирающееся нанопокрытие, образующееся при хелатировании ионов металлов полифенолами, используемое для защиты белковых частиц.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-backslopping.html\"&gt;Метод «backslopping»&lt;/a&gt; — Традиционный способ поддержания закваски, при котором часть зрелой закваски используется для ферментации новой порции муки и воды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/check-all-that-apply.html\"&gt;Метод CATA&lt;/a&gt; — Метод сенсорного анализа, при котором участники выбирают подходящие характеристики продукта из предложенного списка дескрипторов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dpph-assay.html\"&gt;Метод DPPH&lt;/a&gt; — Аналитический метод оценки антиоксидантной активности образцов через измерение способности поглощать свободные радикалы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-prisma.html\"&gt;Метод PRISMA&lt;/a&gt; — Стандарт отчетности для систематических обзоров, обеспечивающий прозрачность отбора исследований и минимизирующий предвзятость при анализе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-ct.html\"&gt;Метод ΔΔCt&lt;/a&gt; — Стандартный способ количественного сравнения уровней экспрессии генов, позволяющий определить, во сколько раз изменилось количество мРНК…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;Метод бляшкообразующих единиц&lt;/a&gt; — Стандартный лабораторный метод для количественного определения концентрации жизнеспособных вирусных частиц в образце.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kjeldahl-method.html\"&gt;Метод Кьельдаля&lt;/a&gt; — Аналитический метод определения содержания сырого протеина в пищевых продуктах с использованием коэффициента пересчета 6,25.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-stomahera.html\"&gt;Метод стомахера&lt;/a&gt; — Измельчение образца в стерильном пакете с помощью механических лопаток, что позволяет извлечь микроорганизмы из глубины продукта без…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sous-vide.html\"&gt;Метод су-вид&lt;/a&gt; — Метод тепловой обработки продуктов, предусматривающий их пастеризацию в вакуумной упаковке при точно контролируемой температуре и времени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mycotoxins.html\"&gt;Микотоксины&lt;/a&gt; — Токсичные вторичные метаболиты, вырабатываемые плесневыми грибами, которые снижают питательную ценность сырья и представляют опасность для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microbial-load.html\"&gt;Микробная нагрузка&lt;/a&gt; — Показатель количества бактерий в продукте, измеряемый в логарифмических единицах колониеобразующих единиц на грамм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/c2c12-myoblasts.html\"&gt;Миобласты C2C12&lt;/a&gt; — Линия мышечных клеток мыши, используемая в качестве модели для изучения адгезии и пролиферации в исследованиях клеточного мяса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mobile-genetic-elements.html\"&gt;Мобильные генетические элементы&lt;/a&gt; — Фрагменты ДНК, способные перемещаться внутри генома или переноситься между бактериальными клетками, включая гены устойчивости.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/technology-acceptance-model.html\"&gt;модель принятия технологий&lt;/a&gt; — Метод оценки цифрового инструмента, основанный на опроснике Дэвиса и измеряющий воспринимаемую пользователями полезность и простоту…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molecular-docking.html\"&gt;Молекулярный докинг&lt;/a&gt; — Компьютерный метод моделирования взаимодействия молекул полифенолов с белками-мишенями для оценки энергии сродства.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;Молочнокислые бактерии&lt;/a&gt; — Группа микроорганизмов, преобразующих углеводы в молочную кислоту, которые являются основными агентами ферментации в растительных сырах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/motilin.html\"&gt;мотилин&lt;/a&gt; — Гормон, стимулирующий перистальтику и регулирующий моторику желудочно-кишечного тракта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimorbidity.html\"&gt;Мультиморбидность&lt;/a&gt; — Состояние, при котором у одного пациента одновременно присутствуют два или более хронических заболевания.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gels.html\"&gt;Гели и желе&lt;/a&gt; — Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-chromatography-mass-spectrometry.html\"&gt;Газовая хроматография-масс-спектрометрия&lt;/a&gt; — Аналитический метод, использованный для идентификации 29 соединений в составе эфирного масла тимьяна.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-production.html\"&gt;газообразование&lt;/a&gt; — Дефект порчи пищевых продуктов, вызываемый жизнедеятельностью микроорганизмов и приводящий к вздутию упаковки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hemoglobin.html\"&gt;Гемоглобин&lt;/a&gt; — Железосодержащий белок крови, который при воздействии света выступает катализатором окисления липидов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyaluronic-acid.html\"&gt;Гиалуроновая кислота&lt;/a&gt; — Сахарид, используемый в качестве внешнего защитного слоя наночастиц для имитации структуры семенной кожуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/giant-freshwater-prawn.html\"&gt;гигантская пресноводная креветка&lt;/a&gt; — Вид пресноводных ракообразных, используемый в качестве сырья для производства высокобелковых пищевых продуктов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html\"&gt;гидрогель CTS-ZnO&amp;amp;CA&lt;/a&gt; — Съедобное гидрогелевое покрытие на базе хитозана, наночастиц оксида цинка и хлорогеновой кислоты с добавлением бета-глицерофосфата…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glycogen-hepatopathy.html\"&gt;Гликогеновая гепатопатия&lt;/a&gt; — Патологическое состояние, характеризующееся избыточным накоплением гликогена в печени, вызванное высокоуглеводным рационом.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glucose-homeostasis.html\"&gt;Глюкозный гомеостаз&lt;/a&gt; — Процесс поддержания постоянства внутренней среды организма при углеводной нагрузке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n\"&gt;&lt;a href=\"reference/glossary.html#n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Н&lt;/span&gt;&lt;/a&gt;Н&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-newfood.html\"&gt;Новая еда&lt;/a&gt; — Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенты&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observational-cross-sectional-study.html\"&gt;Наблюдательное кросс-секционное исследование&lt;/a&gt; — Научный метод оценки эффективности инструментов, основанный на одномоментном сравнении результатов работы ИИ и групп врачей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc-oxide-nanoparticles.html\"&gt;наночастицы оксида цинка&lt;/a&gt; — Компонент гидрогеля, синтезируемый методом термического разложения при 260 °C, который генерирует активные формы кислорода и высвобождает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nanoemulsion.html\"&gt;наноэмульсия&lt;/a&gt; — Коллоидная дисперсная система из несмешивающихся жидкостей с размером капель нанометрового диапазона, применяемая для повышения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-steroidal-anti-inflammatory-drugs.html\"&gt;Нестероидные противовоспалительные препараты&lt;/a&gt; — Лекарственные средства, вызывающие поражение желудка путем угнетения ферментов циклооксигеназ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3\"&gt;&lt;a href=\"reference/glossary.html#3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3&lt;/span&gt;&lt;/a&gt;3&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Б&lt;/span&gt;&lt;/a&gt;Б&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt; — Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hurdle-technology.html\"&gt;барьерный подход&lt;/a&gt; — Метод консервации продуктов питания путем объединения нескольких факторов воздействия для подавления микроорганизмов и продления срока…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tight-junction-proteins.html\"&gt;Белки плотных контактов&lt;/a&gt; — Молекулярные структуры в межклеточных соединениях, регулирующие транспорт веществ между апикальной и базолатеральной сторонами эпителия.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;бета-глицерофосфат&lt;/a&gt; — Сшивающий агент, используемый в виде 50%-го раствора для формирования пористой пленки гидрогеля с равномерным распределением активных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biozate1.html\"&gt;БиоЗейт1&lt;/a&gt; — Молочный пептид, используемый в качестве субстрата для связывания с фенолами кофе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biopolimery.html\"&gt;Биополимеры&lt;/a&gt; — Биополимеры — это природные полимеры, такие как белки или полисахариды, используемые для создания экологически чистой упаковки. Они могут…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biosensor.html\"&gt;Биосенсор&lt;/a&gt; — Аналитическое устройство, имитирующее работу человеческого носа для определения концентрации пиразинов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/micropterus-salmoides.html\"&gt;Большеротый окунь&lt;/a&gt; — Вид рыб, используемый в качестве биологической модели для изучения влияния состава кормов на метаболизм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bristol-stool-form-scale.html\"&gt;Бристольская шкала формы кала&lt;/a&gt; — Медицинская шкала оценки формы и консистенции стула, где значения 1–2 соответствуют чрезмерно плотным массам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-packaging.html\"&gt;Упаковка и миграция&lt;/a&gt; — Пластик, биоразлагаемые плёнки, миграция веществ в еду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultrazvukovaya-ekstraktsiya.html\"&gt;Ультразвуковая экстракция&lt;/a&gt; — Метод извлечения биологически активных веществ из растительного сырья с помощью ультразвуковых волн.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-processed-foods.html\"&gt;Ультраобработанные пищевые продукты&lt;/a&gt; — Ультраобработанные пищевые продукты (UPF) — это готовые к употреблению изделия, содержащие большое количество соли, сахара…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"5\"&gt;&lt;a href=\"reference/glossary.html#5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5&lt;/span&gt;&lt;/a&gt;5&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/5-caffeoylquinic-acid.html\"&gt;5-кофеилхинная кислота&lt;/a&gt; — Основной фенольный компонент кофейных зерен, способный связываться с белками после окисления в о-хиноны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a1\"&gt;&lt;a href=\"reference/glossary.html#a1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A&lt;/span&gt;&lt;/a&gt;A&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/amp-activated-protein-kinase.html\"&gt;AMPK&lt;/a&gt; — Фермент, регулирующий энергетический обмен в клетках.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b1\"&gt;&lt;a href=\"reference/glossary.html#b1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/bacillus-licheniformis-qjl3.html\"&gt;Bacillus licheniformis QJL3&lt;/a&gt; — Бактериальный штамм, идентифицированный как основной источник газообразования и вздутия упаковок соуса васаби.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/c2c12.html\"&gt;C2C12&lt;/a&gt; — Линия мышиных миобластов, используемая в экспериментах для оценки адгезии и пролиферации клеток на растительных покрытиях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/caco-2-cells.html\"&gt;Caco-2&lt;/a&gt; — Линия раковых клеток толстой кишки человека, используемая как модель кишечного эпителия in vitro.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/consort.html\"&gt;CONSORT&lt;/a&gt; — Стандарт отчетности для рандомизированных испытаний, обеспечивающий прозрачность дизайна исследования и минимизацию предвзятости.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D&lt;/span&gt;&lt;/a&gt;D&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcfh-da.html\"&gt;DCFH-DA&lt;/a&gt; — Флуоресцентный зонд, применяемый для детекции и количественного измерения уровня активных форм кислорода (АФК) в клеточных исследованиях.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f1\"&gt;&lt;a href=\"reference/glossary.html#f1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F&lt;/span&gt;&lt;/a&gt;F&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ftir-spectroscopy.html\"&gt;FTIR-спектроскопия&lt;/a&gt; — Аналитический метод, используемый для подтверждения структурной целостности желатина через идентификацию амидных полос.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g1\"&gt;&lt;a href=\"reference/glossary.html#g1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G&lt;/span&gt;&lt;/a&gt;G&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/g-quadruplexes.html\"&gt;G-квадруплексы&lt;/a&gt; — Вторичная структура ДНК в промоторной области гена, регулирующая транскрипцию через взаимодействие с регуляторными молекулами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gallic-acid-equivalent.html\"&gt;GAE&lt;/a&gt; — Единица измерения, показывающая, сколько фенольных соединений содержится в образце, в пересчете на галловую кислоту.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-centered-design.html\"&gt;HCD&lt;/a&gt; — Методологический подход к созданию решений в здравоохранении, основанный на глубокой эмпатии к пользователю, непрерывной итерации с его…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hepg2.html\"&gt;HepG2&lt;/a&gt; — Культура клеток гепатокарциномы человека, используемая в качестве модели для оценки антиоксидантной защиты экстрактов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l1\"&gt;&lt;a href=\"reference/glossary.html#l1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L&lt;/span&gt;&lt;/a&gt;L&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/lactococcus-lactis-subsp-cremoris-d2022.html\"&gt;Lactococcus lactis subsp. cremoris D2022&lt;/a&gt; — Штамм грамположительных молочнокислых бактерий, выделенный из Дучжиэра, обладающий пробиотической активностью против вируса гриппа А.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt; — Микроорганизмы, способные эффективно перерабатывать фруктозу и фруктоолигосахариды в маннит при мягких температурных условиях.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/maldi-tof-mass-spectrometry.html\"&gt;MALDI-TOF масс-спектрометрия&lt;/a&gt; — Аналитический метод идентификации микроорганизмов, основанный на масс-спектрометрическом анализе ионизированных молекул.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n1\"&gt;&lt;a href=\"reference/glossary.html#n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;N&lt;/span&gt;&lt;/a&gt;N&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/nlrp3-inflammasome.html\"&gt;NLRP3-инфламмасома&lt;/a&gt; — Белковый комплекс, который запускает воспалительные процессы в организме.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p1\"&gt;&lt;a href=\"reference/glossary.html#p1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P&lt;/span&gt;&lt;/a&gt;P&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; — Грамположительная гомоферментативная молочнокислая бактерия, традиционно встречающаяся в заквасках и обладающая иммуномодулирующими…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pseudomonas-aeruginosa.html\"&gt;Pseudomonas aeruginosa&lt;/a&gt; — Бактериальный патоген, вызывающий очаги гниения плодов и используемый в исследовании для оценки антибактериальной эффективности гидрогеля.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r1\"&gt;&lt;a href=\"reference/glossary.html#r1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;R&lt;/span&gt;&lt;/a&gt;R&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgd-motifs.html\"&gt;RGD-мотивы&lt;/a&gt; — Специфические аминокислотные последовательности, которые взаимодействуют с интегринами на поверхности клеток и обеспечивают их прикрепление…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t1\"&gt;&lt;a href=\"reference/glossary.html#t1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T&lt;/span&gt;&lt;/a&gt;T&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt; — Общий летучий основной азот (TVB-N) — это показатель свежести мяса, отражающий накопление продуктов распада белков и жизнедеятельности…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v1\"&gt;&lt;a href=\"reference/glossary.html#v1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;V&lt;/span&gt;&lt;/a&gt;V&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/vfd.html\"&gt;VFD&lt;/a&gt; — Метод консервации пищевых продуктов путем удаления влаги при низких температурах и вакууме для сохранения питательных веществ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"w\"&gt;&lt;a href=\"reference/glossary.html#w\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;W&lt;/span&gt;&lt;/a&gt;W&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/w-w.html\"&gt;w/w&lt;/a&gt; — Массовая доля, соотношение массы одного компонента к массе другого..&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d1\"&gt;&lt;a href=\"reference/glossary.html#d1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/twin-screw-extruder.html\"&gt;Двухшнековый экструдер&lt;/a&gt; — Прибор для термомеханической обработки пищевого сырья, обеспечивающий заданные параметры давления и температуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/douzhier.html\"&gt;Доужир&lt;/a&gt; — Традиционный китайский ферментированный продукт из маша, получаемый путем спонтанной ферментации крахмального молока.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e1\"&gt;&lt;a href=\"reference/glossary.html#e1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Е&lt;/span&gt;&lt;/a&gt;Е&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/european-sea-bass.html\"&gt;Европейский сибас&lt;/a&gt; — Вид морской рыбы, являющийся основным объектом аквакультуры в Средиземноморском регионе и источником сырья для производства желатина.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/isothiocyanates.html\"&gt;изотиоцианаты&lt;/a&gt; — Химические соединения, образующиеся при ферментативном гидролизе глюкозинолатов и придающие соусу васаби характерный аромат и остроту.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;ИК-спектроскопия с преобразованием Фурье&lt;/a&gt; — Аналитический метод, примененный для обнаружения изменений во вторичной структуре белков под воздействием тыквенного порошка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hunter-whiteness-index.html\"&gt;Индекс белизны Хантера&lt;/a&gt; — Показатель степени белизны образца, рассчитываемый на основе колориметрических индексов L* и b*.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ulcer-index.html\"&gt;Индекс язвенных повреждений&lt;/a&gt; — Показатель степени повреждения слизистой оболочки желудка, измеряемый в баллах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ipp.html\"&gt;ИПП&lt;/a&gt; — Препараты, которые «выключают» насосы в клетках желудка, производящие кислоту, что снижает кислотность желудочного сока.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/artificial-intelligence.html\"&gt;Искусственный интеллект&lt;/a&gt; — Программные системы, способные анализировать данные и предоставлять рекомендации по диете на основе текстовых запросов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elisa.html\"&gt;ИФА&lt;/a&gt; — Метод лабораторного скрининга, применяемый для обнаружения микотоксинов в сырье.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h1\"&gt;&lt;a href=\"reference/glossary.html#h1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Х&lt;/span&gt;&lt;/a&gt;Х&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/chitosan.html\"&gt;Хитозан&lt;/a&gt; — Катионный полисахарид, который при взаимодействии с альгинатом и пектином уплотняет структуру защитной пленки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chlorogenic-acid.html\"&gt;хлорогеновая кислота&lt;/a&gt; — Экстрагированное из жимолости вещество, входящее в состав гидрогеля для нейтрализации свободных радикалов на поверхности плодов и…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c1\"&gt;&lt;a href=\"reference/glossary.html#c1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ц&lt;/span&gt;&lt;/a&gt;Ц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/cielab-color-space.html\"&gt;Цветовые индексы CIELab&lt;/a&gt; — Система количественной оценки оптических свойств продукта через параметры светлоты (L*) и цветовых осей (a* и b*).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc.html\"&gt;Цинк&lt;/a&gt; — Микроэлемент, выступающий регулятором метаболизма углеводов и восстанавливающий активность ферментов гликолиза при избытке крахмала.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cytokine-storm.html\"&gt;Цитокиновый шторм&lt;/a&gt; — Состояние избыточного воспаления, характеризующееся неконтролируемым выбросом провоспалительных цитокинов, повреждающее ткани организма.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sh\"&gt;&lt;a href=\"reference/glossary.html#sh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ш&lt;/span&gt;&lt;/a&gt;Ш&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/pin-mill.html\"&gt;Штифтовая мельница&lt;/a&gt; — Инструмент для измельчения экструдата до состояния порошка с заданным размером частиц.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sh1\"&gt;&lt;a href=\"reference/glossary.html#sh1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Щ&lt;/span&gt;&lt;/a&gt;Щ&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/alkaline-extraction.html\"&gt;Щелочная экстракция&lt;/a&gt; — Технологический процесс извлечения белка из сырья путем изменения уровня pH среды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ya\"&gt;&lt;a href=\"reference/glossary.html#ya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Я&lt;/span&gt;&lt;/a&gt;Я&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/malic-acid.html\"&gt;Яблочная кислота&lt;/a&gt; — Органическая кислота, являющаяся доминирующим компонентом кислого вкуса в мякоти яблок.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"229 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Глоссарий А–Я","description":"229 концепций","vcsPath":"reference/glossary.md"},"headings":[{"title":"В","href":"reference/glossary.html#v","level":2},{"title":"Р","href":"reference/glossary.html#r","level":2},{"title":"С","href":"reference/glossary.html#s","level":2},{"title":"Л","href":"reference/glossary.html#l","level":2},{"title":"О","href":"reference/glossary.html#o","level":2},{"title":"Т","href":"reference/glossary.html#t","level":2},{"title":"Ж","href":"reference/glossary.html#zh","level":2},{"title":"S","href":"reference/glossary.html#s1","level":2},{"title":"Э","href":"reference/glossary.html#e","level":2},{"title":"П","href":"reference/glossary.html#p","level":2},{"title":"К","href":"reference/glossary.html#k","level":2},{"title":"А","href":"reference/glossary.html#a","level":2},{"title":"З","href":"reference/glossary.html#z","level":2},{"title":"Ф","href":"reference/glossary.html#f","level":2},{"title":"М","href":"reference/glossary.html#m","level":2},{"title":"Г","href":"reference/glossary.html#g","level":2},{"title":"Н","href":"reference/glossary.html#n","level":2},{"title":"3","href":"reference/glossary.html#3","level":2},{"title":"Б","href":"reference/glossary.html#b","level":2},{"title":"У","href":"reference/glossary.html#u","level":2},{"title":"5","href":"reference/glossary.html#5","level":2},{"title":"A","href":"reference/glossary.html#a1","level":2},{"title":"B","href":"reference/glossary.html#b1","level":2},{"title":"C","href":"reference/glossary.html#c","level":2},{"title":"D","href":"reference/glossary.html#d","level":2},{"title":"F","href":"reference/glossary.html#f1","level":2},{"title":"G","href":"reference/glossary.html#g1","level":2},{"title":"H","href":"reference/glossary.html#h","level":2},{"title":"L","href":"reference/glossary.html#l1","level":2},{"title":"M","href":"reference/glossary.html#m1","level":2},{"title":"N","href":"reference/glossary.html#n1","level":2},{"title":"P","href":"reference/glossary.html#p1","level":2},{"title":"R","href":"reference/glossary.html#r1","level":2},{"title":"T","href":"reference/glossary.html#t1","level":2},{"title":"V","href":"reference/glossary.html#v1","level":2},{"title":"W","href":"reference/glossary.html#w","level":2},{"title":"Д","href":"reference/glossary.html#d1","level":2},{"title":"Е","href":"reference/glossary.html#e1","level":2},{"title":"И","href":"reference/glossary.html#i","level":2},{"title":"Х","href":"reference/glossary.html#h1","level":2},{"title":"Ц","href":"reference/glossary.html#c1","level":2},{"title":"Ш","href":"reference/glossary.html#sh","level":2},{"title":"Щ","href":"reference/glossary.html#sh1","level":2},{"title":"Я","href":"reference/glossary.html#ya","level":2}],"title":"Глоссарий А–Я"},"router":{"pathname":"reference/glossary","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
