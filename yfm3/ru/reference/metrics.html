            {"data":{"leading":false,"html":"&lt;p&gt;18 концепций&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/antioxidant-potential.html\"&gt;Антиоксидантный потенциал&lt;/a&gt; — Количественная характеристика способности вещества нейтрализовать свободные радикалы, измеряемая методами ABTS, DPPH и FRAP.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/water-holding-capacity.html\"&gt;влагоудерживающая способность&lt;/a&gt; — Свойство геля удерживать влагу, возрастающее на 11,21% при добавлении оптимальной дозы тыквенного порошка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hunter-whiteness-index.html\"&gt;Индекс белизны Хантера&lt;/a&gt; — Показатель степени белизны образца, рассчитываемый на основе колориметрических индексов L* и b*.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ulcer-index.html\"&gt;Индекс язвенных повреждений&lt;/a&gt; — Показатель степени повреждения слизистой оболочки желудка, измеряемый в баллах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dpph-assay.html\"&gt;Метод DPPH&lt;/a&gt; — Аналитический метод оценки антиоксидантной активности образцов через измерение способности поглощать свободные радикалы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microbial-load.html\"&gt;Микробная нагрузка&lt;/a&gt; — Показатель количества бактерий в продукте, измеряемый в логарифмических единицах колониеобразующих единиц на грамм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/total-antioxidant-capacity.html\"&gt;Общая антиоксидантная способность&lt;/a&gt; — Показатель, отражающий способность организма противостоять окислительному стрессу.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aerobic-plate-count.html\"&gt;Общая обсемененность мезофиллами&lt;/a&gt; — Микробиологический показатель, отражающий уровень загрязнения сырья, используемый для оценки эффективности термообработки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hazard-ratio.html\"&gt;Отношение рисков&lt;/a&gt; — Показатель, отражающий соотношение вероятности наступления события в группе воздействия к вероятности в контрольной группе за определенный…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peroxide-value.html\"&gt;перекисное число&lt;/a&gt; — Показатель степени окисления жиров, используемый для оценки свежести мясных продуктов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;Площадь под гликемической кривой&lt;/a&gt; — Показатель, отражающий общую величину и длительность отклонения уровня глюкозы в крови от базового уровня после приема пищи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/margin-of-exposure.html\"&gt;Расчетный предел воздействия&lt;/a&gt; — Показатель химической безопасности, используемый для оценки рисков воздействия свинца, где значение ниже 10 считается небезопасным по…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Показатель точности расчетов, отражающий среднее отклонение значений, полученных ИИ или экспертами, от эталонных данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gel-hardness.html\"&gt;твердость геля&lt;/a&gt; — Показатель механической прочности сурими, достигающий значения 313,69 ± 2,54 г при добавлении 1,1% порошка тыквы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-stability.html\"&gt;Термостабильность&lt;/a&gt; — Способность белкового продукта сохранять свои свойства при воздействии высоких температур.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thiobarbituric-acid-reactive-substances.html\"&gt;тиобарбитуровое число&lt;/a&gt; — Метрика содержания малонового диальдегида, отражающая интенсивность окислительной порчи липидов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transepithelial-electrical-resistance.html\"&gt;Трансэпителиальное электрическое сопротивление&lt;/a&gt; — Показатель целостности и барьерной функции клеточного монослоя, измеряемый в Ом·см².&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cielab-color-space.html\"&gt;Цветовые индексы CIELab&lt;/a&gt; — Система количественной оценки оптических свойств продукта через параметры светлоты (L*) и цветовых осей (a* и b*).&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"18 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Метрики","description":"18 концепций","vcsPath":"reference/metrics.md"},"headings":[],"title":"Метрики"},"router":{"pathname":"reference/metrics","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
