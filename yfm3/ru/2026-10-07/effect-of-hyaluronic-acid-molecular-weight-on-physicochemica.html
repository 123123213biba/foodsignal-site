        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"132\" cy=\"147\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"568\" cy=\"236\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · EMULSIFIERS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Гиалуроновая кислота в&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мороженом: как молекулярный&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;вес меняет текстуру десерта&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f1.jpg\" alt=\"Производство смеси для мороженого и мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Производство смеси для мороженого и мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи изучили влияние гиалуроновой кислоты (ГК) разной молекулярной массы на свойства мороженого. Выяснилось, что полимеры с массой 1550 и 2550 кДа значительно улучшают стабильность смеси и вязкость продукта. Хотя ГК не заменяет полностью эмульгаторы, она открывает новые возможности для создания текстурированных десертов.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Высокомолекулярная ГК (от 1550 кДа) повышает вязкость и стабильность смеси.&lt;/li&gt;\n&lt;li&gt;ГК эффективно удерживает влагу, предотвращая расслоение эмульсии.&lt;/li&gt;\n&lt;li&gt;Использование ГК влияет на скорость таяния, но не меняет объем взбитости.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В эксперименте использовали гиалуроновую кислоту с молекулярной массой 320, 980, 1550 и 2550 кДа в концентрации 0,3%. Образцы сравнивали с контрольной смесью, содержащей стандартный промышленный стабилизатор (гуаровая камедь, каррагинан, моно- и диглицериды). Реологические тесты на реометре Anton Paar при 4°C показали, что с ростом молекулярной массы ГК увеличиваются модуль накопления (G'), модуль потерь (G'') и кажущаяся вязкость смеси.&lt;/p&gt;\n&lt;p&gt;Анализ стабильности показал, что высокомолекулярная ГК (1550–2550 кДа) эффективно снижает индекс кремообразования (Creaming Index) в течение 21 дня хранения при 4°C. При этом скорость таяния образцов с высокой молекулярной массой оказалась выше, чем у контроля. Важно отметить, что все образцы с ГК не содержали дополнительных эмульгаторов, в отличие от контрольного состава, что делает результаты показательными для оценки функциональности самого полимера.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование не доказывает возможность полной замены промышленных эмульгаторов, так как контрольный образец имел иной состав.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Мороженое — один из самых популярных молочных десертов в мире, ценимый за нежную текстуру, насыщенный вкус и освежающие свойства. Несмотря на широкое потребление, производство высококачественного мороженого сопряжено с рядом технических сложностей. Одной из них остается поддержание стабильной структуры, желаемой текстуры и постоянных сенсорных свойств на протяжении всего срока годности. Это обусловлено сложной природой продукта: частично замороженной эмульсией, содержащей воздушные ячейки, жировые глобулы, кристаллы льда и непрерывную водную фазу. Рецептура должна быть тщательно разработана для контроля перекристаллизации льда, поведения при таянии и структурной стабильности во время замораживания, хранения и транспортировки. Для решения этих задач в состав мороженого обычно вводят стабилизаторы на основе полисахаридов, которые контролируют миграцию влаги, подавляют перекристаллизацию льда и улучшают общую текстуру. Широко используемые стабилизаторы, такие как гуаровая камедь, каррагинан, камедь рожкового дерева и карбоксиметилцеллюлоза (КМЦ), улучшают вязкость и стабильность при циклах замораживания-оттаивания. Однако, в зависимости от концентрации и взаимодействия с другими ингредиентами, они могут придавать нежелательные характеристики, например, чрезмерную «резиновость». Это вызывает интерес к альтернативным полисахаридам, способным обеспечить функциональность при сохранении сенсорных свойств.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/hyaluronic-acid.html\"&gt;Гиалуроновая кислота&lt;/a&gt; (ГК) рассматривается как потенциальный функциональный ингредиент благодаря высокой способности связывать воду. В молочных продуктах, таких как молоко и плавленый сыр, ГК повышает влагоудерживающую способность и влияет на структурные свойства. Предыдущие исследования указывают, что ГК может улучшать стабильность эмульсии и взаимодействие белков в молочных системах. ГК — это линейный полисахарид, состоящий из повторяющихся дисахаридных звеньев β-1,4-D-глюкуроновой кислоты и β-1,3-N-ацетил-D-глюкозамина. Высокая плотность отрицательного заряда позволяет ей связывать большие объемы воды и формировать вязкие системы. Важной характеристикой ГК является зависимость функциональности от молекулярной массы (ММ). Коммерческая ГК доступна в диапазоне от нескольких кДа до более 3000 кДа: ГК с высокой ММ обычно ассоциируется с повышенной вязкостью и выраженным вязкоупругим поведением, тогда как низкомолекулярная ГК вносит ограниченный структурный вклад.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гиалуроновая кислота с высокой молекулярной массой (≥ 980 кДа) улучшает вязкость и стабильность молочных систем благодаря способности связывать воду.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вязкоупругость — способность материала проявлять свойства как твердого тела (упругость), так и жидкости (вязкость), что критично для «тела» мороженого.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На данный момент FDA (США) не одобрило ГК как общую пищевую добавку для всех категорий продуктов, однако она разрешена в Японии, Южной Корее, Китае и ряде стран ЕС. Целью данного исследования была оценка влияния ГК различной молекулярной массы на физико-химические, реологические и текстурные свойства мороженого при использовании в качестве стабилизатора, без прямой демонстрации полной замены традиционных систем «стабилизатор-эмульгатор».&lt;/p&gt;\n&lt;p&gt;Исследование оценивало влияние ГК различной ММ (320 кДа, 980 кДа, 1550 кДа и 2550 кДа) при замене традиционных стабилизаторов. Контрольный образец (IC-C) содержал стандартную смесь стабилизаторов (0,3%). Образцы IC-1, IC-2, IC-3 и IC-4 содержали 0,3% ГК соответствующей ММ.&lt;/p&gt;\n&lt;p&gt;Базовая смесь включала 33,92% сливок, 41,8% обезжиренного молока, 5,89% сухого обезжиренного молока (СОМ), 14,8% сахара и 3,29% сухого кукурузного сиропа. В контроле использовали 0,3% коммерческого стабилизатора (смесь гуаровой камеди, моно- и диглицеридов, камеди рожкового дерева, каррагинана и полисорбата 80). В опытных образцах использовали только ГК (0,3%) без добавления эмульгаторов. Итоговый состав: 12,2% жира, 4,1% белка, 11,2% СОМ, 41,8% сухих веществ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контрольный образец содержал эмульгаторы, а образцы с ГК — нет. Различия в свойствах могут быть обусловлены как типом стабилизатора, так и отсутствием эмульгаторов в опытных группах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ингредиенты смешивали в термомиксере (10 мин, скорость 3, последние 60 с — скорость 5). Смесь пастеризовали при 85°C в течение 20 с, затем «старили» при 4°C в течение 12–16 ч. Замораживание проводили в батч-фризере в течение 15 мин, закаливание — при -20°C в течение 24 ч.&lt;/p&gt;\n&lt;p&gt;Стабильность к кремообразованию (CI) определяли по индексу разделения фаз при хранении (4°C, 21 день). Реологические характеристики (модуль накопления G', модуль потерь G'', вязкость) измеряли на реометре при 4°C в диапазоне угловых частот 0,1–62,8 рад/с.&lt;/p&gt;\n&lt;p&gt;Взбитость (overrun) рассчитывали по разнице веса смеси и готового продукта. Твердость и адгезивность измеряли методом пенетрации (глубина 3 мм, температура -20°C). Скорость таяния определяли по потере массы образца (100 г) при 25°C в течение 3 ч.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Взбитость (overrun) — показатель объема воздуха, включенного в мороженое; чем выше значение, тем «легче» продукт.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Контроль и IC-1 (320 кДа) имели более низкую вязкость и проявляли признаки разделения фаз при старении, в отличие от образцов с ГК более высокой ММ.&lt;/p&gt;\n&lt;p&gt;Все образцы показали рост CI за 21 день. Контроль и IC-1 имели самые высокие значения CI (&amp;gt;40%), свидетельствующие о нестабильности. Образцы с ГК 1550 кДа и 2550 кДа показали минимальное разделение фаз.&lt;/p&gt;\n&lt;p&gt;Наблюдалась прямая зависимость: с ростом ММ ГК увеличивались G', G'' и кажущаяся вязкость. Образец ICM-4 (2550 кДа) показал наибольшую вязкость и сопротивление течению.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ГК с высокой ММ (2550 кДа) обеспечивает наиболее стабильную и вязкую структуру смеси, что коррелирует с лучшей устойчивостью к расслоению.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Значимых различий (p &amp;gt; 0,05) между образцами не выявлено (диапазон 29,20–30,86%). Добавление ГК не препятствовало включению воздуха.&lt;/p&gt;\n&lt;p&gt;Образцы с ГК ≥ 980 кДа были значительно тверже контроля и IC-1. Различий в адгезивности между образцами не выявлено.&lt;/p&gt;\n&lt;p&gt;Образцы с ГК 1550 кДа и 2550 кДа таяли медленнее, чем контроль и IC-1, что указывает на лучшую термостойкость структуры.&lt;/p&gt;\n&lt;p&gt;ГК с ММ ≥ 980 кДа улучшает твердость, вязкость, стабильность эмульсии и термостойкость мороженого. Однако из-за отсутствия эмульгаторов в опытных образцах результаты не означают полную эквивалентность традиционным системам. Требуются дополнительные исследования с учетом микроструктурного и сенсорного анализа.&lt;/p&gt;\n&lt;p&gt;Гиалуроновая кислота (особенно 1550 и 2550 кДа) является перспективным структурообразователем для мороженого, улучшающим физико-химические свойства. Для полноценной замены традиционных стабилизаторов-эмульгаторов необходимы дальнейшие исследования с сопоставимыми рецептурами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f1.jpg\" alt=\"Производство смеси для мороженого и мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Производство смеси для мороженого и мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f2.jpg\" alt=\"Индекс кремообразования образцов смеси для мороженого с гиалуроновой кислотой различной молекулярной массы после 21 дня \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Индекс кремообразования образцов смеси для мороженого с гиалуроновой кислотой различной молекулярной массы после 21 дня хранения при температуре 4°C.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f3.jpg\" alt=\"Влияние гиалуроновой кислоты различной молекулярной массы на модуль потерь (G'': Па) образцов смеси для мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние гиалуроновой кислоты различной молекулярной массы на модуль потерь (G'': Па) образцов смеси для мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f4.jpg\" alt=\"Влияние гиалуроновой кислоты различной молекулярной массы на модуль накопления (G': Па) образцов смеси для мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние гиалуроновой кислоты различной молекулярной массы на модуль накопления (G': Па) образцов смеси для мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f5.jpg\" alt=\"Влияние гиалуроновой кислоты различной молекулярной массы на вязкость (мПа·с) образцов смеси для мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние гиалуроновой кислоты различной молекулярной массы на вязкость (мПа·с) образцов смеси для мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f6.jpg\" alt=\"Влияние гиалуроновой кислоты с различной молекулярной массой на взбитость образцов мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние гиалуроновой кислоты с различной молекулярной массой на взбитость образцов мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f7.jpg\" alt=\"Влияние гиалуроновой кислоты с различной молекулярной массой на твердость образцов мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние гиалуроновой кислоты с различной молекулярной массой на твердость образцов мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f8.jpg\" alt=\"Влияние гиалуроновой кислоты с различной молекулярной массой на адгезивность образцов мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние гиалуроновой кислоты с различной молекулярной массой на адгезивность образцов мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f9.jpg\" alt=\"Влияние гиалуроновой кислоты с различной молекулярной массой на скорость таяния (г/мин) образцов мороженого.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние гиалуроновой кислоты с различной молекулярной массой на скорость таяния (г/мин) образцов мороженого.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Нестабильность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;структуры&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мороженого&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Добавление ГК&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;разной&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;молекулярной&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;массы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая масса&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;улучшает&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вязкость&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Перспективный&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;структурный&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ингредиент&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Food science &amp;amp; nutrition. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\
