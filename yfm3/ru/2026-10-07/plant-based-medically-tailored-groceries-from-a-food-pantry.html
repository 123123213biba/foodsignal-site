        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"277\" cy=\"151\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"663\" cy=\"228\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Может ли продуктовая корзина&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;заменить лекарства: опыт&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;долгосрочной диеты&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Ученые проанализировали влияние еженедельных наборов растительной пищи на здоровье людей с низким доходом. В течение 2,7 лет участники получали свежие овощи, фрукты, бобовые и цельные злаки. Выяснилось, что такой подход помогает снизить артериальное давление и индекс массы тела в зависимости от количества полученных наборов.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Каждые 100 наборов продуктов снижают диастолическое давление на 3,21 мм рт. ст.&lt;/li&gt;\n&lt;li&gt;Среднее снижение веса составило 2,63 кг на каждые 100 полученных продуктовых пакетов.&lt;/li&gt;\n&lt;li&gt;У пациентов с гипертонией систолическое давление упало на 5,83 мм рт. ст.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследование проводилось на базе продовольственного центра MGH Revere Food Pantry с 2019 по 2025 год. В выборку вошли 68 взрослых пациентов, которые получали еженедельные наборы продуктов, составленные диетологом согласно рекомендациям USDA 2020 года. Рацион включал свежие фрукты, овощи, консервированные бобовые, ореховую пасту и цельнозерновые продукты, обеспечивая три приема пищи в день.&lt;/p&gt;\n&lt;p&gt;Для оценки результатов использовали линейные модели со смешанными эффектами, учитывающие возраст, пол и влияние пандемии COVID-19. Каждые 100 полученных продуктовых наборов (MTGs) приводили к снижению диастолического давления на 3,21 мм рт. ст. и веса на 2,63 кг. У участников с исходно повышенными показателями эффект был выражен сильнее: систолическое давление снижалось на 5,83 мм рт. ст., а диастолическое — на 6,23 мм рт. ст.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В исследовании отсутствовала контрольная группа, а данные основывались на клинических измерениях, которые могут быть вариативны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Вмешательства в рамках концепции «Еда как лекарство» (Food Is Medicine, FIM), такие как предоставление продуктовых наборов с учетом медицинских показаний (MTG), специализированное питание и рецепты на овощи и фрукты, демонстрируют способность улучшать качество рациона и снижать уровень отсутствия продовольственной безопасности. Однако влияние FIM-вмешательств на показатели сердечно-сосудистого, почечного и метаболического (CKM) здоровья остается неоднозначным.&lt;/p&gt;\n&lt;p&gt;Большинство исследований FIM до настоящего времени были ограничены периодом в несколько недель или месяцев, и лишь немногие из них были направлены на оптимизацию нутритивного качества. Данный отчет уникален тем, что оценивает эффект растительных MTG в ходе наблюдения длительностью почти 3 года.&lt;/p&gt;\n&lt;p&gt;Растительные FIM-вмешательства перспективны; для улучшения CKM-здоровья будущие программы должны быть более продолжительными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показало, что при получении растительных продуктовых наборов (MTG) в течение почти 3 лет наблюдалось дозозависимое снижение диастолического артериального давления, массы тела и ИМТ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Отсутствие продовольственной безопасности связано с низким качеством питания и ухудшением сердечно-сосудистого, почечного и метаболического (CKM) здоровья, включая более высокие показатели гипертензии, ожирения и сахарного диабета 2 типа. В последние годы получили распространение FIM-вмешательства, такие как MTG, специализированное питание и рецепты на овощи, направленные на борьбу с отсутствием продовольственной безопасности, профилактику и лечение хронических заболеваний. Хотя они улучшают качество рациона, их влияние на CKM-здоровье неоднозначно. Изучение дозового эффекта критически важно для FIM, как и для фармацевтических вмешательств. Четыре ключевых фактора дозировки FIM — частота, качество, количество и продолжительность. FIM-вмешательства могут быть усилены за счет более частого предоставления наиболее питательных продуктов в больших количествах и в течение более длительного времени. Целью данного исследования было изучение дозозависимой связи между получением частых, питательных и объемных растительных продуктовых наборов (MTG) из продовольственного банка и долгосрочными CKM-исходами у взрослых с отсутствием продовольственной безопасности.&lt;/p&gt;\n&lt;p&gt;Продовольственный банк MGH Revere (Массачусетс) расположен при общественном центре здравоохранения и предоставляет еженедельные растительные MTG. Пациенты, получающие MTG, — это преимущественно лица с низким социально-экономическим статусом, не владеющие английским языком и пользующиеся государственным медицинским страхованием. Диетолог первоначально направлял выбор продуктов на основе Диетических рекомендаций Министерства сельского хозяйства США 2020 года, обеспечивая каждого члена семьи тремя приемами пищи в день в течение недели. MTG содержат свежие фрукты и овощи, консервированные бобовые и/или ореховую пасту, а также цельные злаки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ретроспективное исследование: анализ данных пациентов, которые уже получали помощь, без формирования контрольной группы, что ограничивает возможность установления прямой причинно-следственной связи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Это ретроспективное исследование включило небеременных взрослых (≥18 лет), которые: 1) получили не менее 26 MTG в период с 20 декабря 2019 года по 1 апреля 2025 года; 2) имели хотя бы одно исходное измерение CKM (до 12 месяцев до получения первого MTG; медиана измерений = 4); 3) имели хотя бы одно последующее измерение CKM (от 6 месяцев после получения первого MTG до 3 месяцев после получения последнего MTG; медиана измерений = 8). Первичные исходы включали систолическое и диастолическое артериальное давление и гликированный &lt;a href=\"concepts/hemoglobin.html\"&gt;гемоглобин&lt;/a&gt; (HbA1c). Вторичные исходы включали ИМТ и массу тела.&lt;/p&gt;\n&lt;p&gt;Мы извлекли продольные показатели исходов из электронных медицинских карт. Данные о росте и весе были очищены с использованием алгоритма Daymont et al. Линейные модели со смешанными эффектами оценивали связь между количеством полученных MTG и различиями в темпах изменения исходов. Модель 1 (нескорректированная) включала фиксированные эффекты для полученных MTG (в сотнях упаковок), период исследования и их взаимодействие. Модель 2 дополнительно корректировалась на возраст, пол, исходные значения и время между измерениями. Модель 3 дополнительно учитывала периоды пандемии COVID-19.&lt;/p&gt;\n&lt;p&gt;Среди 68 взрослых участников (Рис.) 47 (69,1%) были женщинами, средний возраст составил 57,4 (13,7) года. У 50 (80,6%) исходный ИМТ составлял 25 или более; среднее систолическое АД — 130,3 (20,0) мм рт. ст.; среднее диастолическое АД — 76,5 (8,4) мм рт. ст.; средний HbA1c — 6,9% (1,8%). В среднем участники получали MTG каждые 1,4 недели в течение 2,7 лет (Таблица 1). На каждые 100 полученных MTG темп изменения диастолического АД снижался на 3,21 мм рт. ст. (95% ДИ, от -4,89 до -1,52) в полностью скорректированных моделях (Таблица 2). Значимых изменений систолического АД или HbA1c в общей группе не наблюдалось.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничение: отсутствие контрольной группы и использование офисных измерений биометрических показателей, которые могут варьироваться в зависимости от условий проведения замеров.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В анализе чувствительности среди лиц с исходно высоким систолическим АД (≥130 мм рт. ст.) на каждые 100 MTG темп изменения систолического АД снижался на 5,83 мм рт. ст. (95% ДИ, от -10,09 до -1,57); среди лиц с высоким диастолическим АД (≥80 мм рт. ст.) темп изменения диастолического АД снижался на 6,23 мм рт. ст. (95% ДИ, от -9,25 до -3,32). На каждые 100 MTG темп изменения ИМТ снижался на 1,04 кг/м² (95% ДИ, от -1,50 до -0,58), а темп изменения веса — на 2,63 кг (95% ДИ, от -3,73 до -1,53).&lt;/p&gt;\n&lt;p&gt;В этом ретроспективном исследовании мы наблюдали дозозависимое улучшение показателей диастолического АД, веса и ИМТ. У лиц с исходно высокими показателями также наблюдалось улучшение систолического АД. Отсутствие значимых изменений в уровне HbA1c согласуется с рядом других исследований FIM, что может быть связано с влиянием множества факторов, таких как приверженность лечению и физическая активность. Будущие исследования должны использовать рандомизированный дизайн и более точные методы измерения биометрических показателей.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;связь питания&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и хронических&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;болезней&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализ 2,7 лет&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выдачи наборов&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;еды&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;снижение&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;давления и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;массы тела&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;важность&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;долгосрочного&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;доступа к еде&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Preventing chronic disease. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Preventing chronic disease (Europe PMC)&lt;/td&gt;\n&lt;td&gt;plant_based&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Mirsky JB, Wu AJ, Luo M, Perkins ME, Locascio JJ, Hivert MF, Burgun R, Schuckel MF, Taveras EM, Fiechtner L.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&g
