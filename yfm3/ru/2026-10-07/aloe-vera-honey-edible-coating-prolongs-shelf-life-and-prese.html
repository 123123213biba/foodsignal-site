        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"221\" cy=\"165\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"619\" cy=\"193\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · GELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Гель из алоэ вера против&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;порчи манго: как сохранить&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;свежесть фруктов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f1.jpg\" alt=\"Схема подготовки образцов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Схема подготовки образцов.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Нарезанные фрукты быстро теряют вид и вкус из-за испарения влаги и микробов. Исследование показало, что тонкая пленка из геля алоэ вера создает надежный барьер. Этот метод позволяет хранить манго до 20 дней при температуре ниже 4°C, сохраняя витамины и текстуру.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;100% гель алоэ вера снижает потерю влаги на 48% и порчу на 50%.&lt;/li&gt;\n&lt;li&gt;Мед в составе покрытия ухудшает барьерные свойства полисахаридной матрицы.&lt;/li&gt;\n&lt;li&gt;Покрытие сохраняет витамин C, антиоксиданты и текстуру при 4°C.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Для создания защитного покрытия исследователи использовали гель алоэ вера, обогащенный 1% глицерином (пластификатор), 1,5% карбоксиметилцеллюлозой (пленкообразователь), 1% уксусной кислотой (для снижения pH) и 2% метанолом. Смесь нагревали до 70°C, после чего кусочки манго погружали в раствор на 2 минуты. В эксперименте сравнивались составы с разным содержанием меда, однако именно 100% гель алоэ вера показал лучшие результаты.&lt;/p&gt;\n&lt;p&gt;Чистый гель алоэ вера снизил потерю веса на 48% и замедлил порчу продукта на 50% по сравнению с контрольными образцами за 20 дней хранения. Анализ показал, что высокая гигроскопичность меда при смешивании с алоэ нарушает структуру полисахаридной матрицы, снижая защитные свойства покрытия. Использование чистого алоэ позволило лучше сохранить содержание фенолов, флавоноидов и витамина C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на конкретном местном сорте манго в Бангладеш, поэтому результаты могут отличаться для других видов фруктов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;DMRT — тест множественного сравнения Дункана, FN — твердость, HPMC — гидроксипропилметилцеллюлоза, LDPE — полиэтилен низкой плотности, PAL — фенилаланин-аммиак-лиаза, PCA — агар для подсчета микроорганизмов, PDA — картофельно-декстрозный агар, QC — контроль качества, TA — титруемая кислотность, TFC — общее содержание флавоноидов, TPC — общее содержание полифенолов, TSS — общее содержание растворимых сухих веществ.&lt;/p&gt;\n&lt;p&gt;Манго (Mangifera indica) — однодомное растение, наиболее экономически важный тропический фрукт семейства Anacardiaceae, широко культивируемый по всему миру. Ежегодное производство манго в Бангладеш, выращиваемого почти на 139 тысячах гектаров, в 2025 году превысило 1872 тысячи метрических тонн. Манго относится к климактерическим фруктам — это отличный источник макронутриентов (углеводы, клетчатка), микронутриентов (витамины A, B9, C, K) и минералов (железо, магний, кальций, калий, &lt;a href=\"concepts/zinc.html\"&gt;цинк&lt;/a&gt;), а также антиоксидантов (каротиноиды, фенолы, флавоноиды). Это скоропортящийся продукт. Из-за высокой активности воды в нарезанных плодах после сбора урожая они уязвимы для микробной и физиологической порчи, что ограничивает их потребление и экспорт. Поэтому необходимы инновационные методы хранения, которые эффективны, питательны и устойчивы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование сравнивает влияние покрытий из алоэ вера и меда на сохранность нарезанного манго, так как их комбинация может как улучшить барьерные свойства, так и ослабить матрицу покрытия из-за гигроскопичности меда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Новые исследования подчеркивают потенциал веществ растительного происхождения и пищевых покрытий. Алоэ вера и мед обладают антиоксидантными, антимикробными, противогрибковыми свойствами и способностью удерживать влагу и диоксид углерода (CO₂). Алоэ вера (вода, витамины, глюкоманнаны, стеролы, аминокислоты) ограничивает рост бактерий, контролирует дыхание плодов и минимизирует потемнение, вызванное окислением. Смешанный цветочный мед является природным антиоксидантом и может заменить синтетические аналоги. Предыдущие работы показали, что покрытие из геля алоэ вера с медом не меняет вкус, запах и текстуру фруктов. Однако данных о потенциале комбинации этих веществ для хранения нарезанного манго недостаточно. Большинство исследований фокусировались на отдельных компонентах; эффекты их сочетания на микробную безопасность, физиологические и сенсорные характеристики остаются неизвестными. Это исследование представляет первое систематическое сравнение чистых и смешанных покрытий из алоэ вера и меда на нарезанном местном манго.&lt;/p&gt;\n&lt;p&gt;Полностью зрелые манго (местный сорт Ashwina, золотисто-желтая мякоть) были получены на рынке Kanchan (Дакка, Бангладеш) в период с середины апреля по середину июня 2025 года. Алоэ вера (сорт Barbadensis Miller), смешанный цветочный мед и пакеты из полиэтилена низкой плотности (LDPE) также были приобретены на местном рынке. Кухонный инвентарь дезинфицировали 70% раствором этанола. Манго мыли, очищали и нарезали кубиками (2 × 2 × 2 см).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для создания покрытий использовали гель алоэ вера, смешанный цветочный мед, глицерин (1%), карбоксиметилцеллюлозу (CMC, 1,5%), уксусную кислоту (1%) и метанол (2%).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гель алоэ вера отделяли от листьев, измельчали в блендере (18 000 об/мин, 3 мин, 200 г на партию при комнатной температуре) и пропускали через сито 850 мкм. Экстракт пастеризовали при 63°C в течение 15 мин. Растворы готовили путем добавления глицерина, CMC, уксусной кислоты и метанола, нагревали до 70°C и быстро охлаждали. Было протестировано пять соотношений алоэ вера и меда (100:0, 75:25, 50:50, 25:75, 0:100) (Таблица 1).&lt;/p&gt;\n&lt;p&gt;Кубики манго погружали в раствор на 2 минуты, затем сушили 20 минут при комнатной температуре. Всего использовали 350 плодов. Образцы хранили в пакетах LDPE при температуре &amp;gt; 4°C и относительной влажности 85% в течение 20 дней. Каждая обработка имела три биологические повторности. Каждые 5 дней проводили оценку качества (pH, титруемая кислотность, TSS, витамин C, фенолы, флавоноиды, сенсорная оценка, микробиологический анализ).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является наблюдательным и экспериментальным; результаты зависят от конкретных сортов манго и условий хранения. Не является руководством по консервированию в домашних условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наблюдалось значительное (p ≤ 0,05) увеличение потери влаги во всех группах. На 20-й день в группе T₁ (100% алоэ вера) потеря влаги составила 14,28% ± 0,42%, что значительно ниже, чем в контрольной группе T₀ (27,80% ± 0,69%). Это подтверждает, что покрытие создает полупроницаемую пленку, ограничивающую газообмен и замедляющую старение плодов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;100% покрытие из алоэ вера (T₁) показало наилучшие результаты по удержанию влаги и сохранению твердости, превзойдя смеси с медом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Твердость оценивали с помощью пенетрометра (зонд 3,5 мм). Покрытия из 100% алоэ вера (T₁) и смеси T₄ (75% алоэ вера + 25% меда) обеспечили лучшую сохранность твердости (&amp;gt; 90% и &amp;gt; 71% соответственно). Гигроскопичные сахара меда, вероятно, ослабляли полисахаридную матрицу, поэтому образцы T₂, T₃ и T₅ размягчались быстрее.&lt;/p&gt;\n&lt;p&gt;Содержание растворимых сухих веществ (TSS) увеличивалось в течение хранения. В обработанных образцах рост TSS был менее выраженным, чем в контроле, что указывает на замедление дыхания. Титруемая кислотность (TA) снизилась на 20%, 27%, 68,9% и 65% на 5, 10, 15 и 20-й дни соответственно. Соотношение TSS/TA, отражающее баланс вкуса, было выше в обработанных образцах.&lt;/p&gt;\n&lt;p&gt;Значения pH немного увеличились за время хранения. Обработка алоэ вера и медом помогла поддерживать большую стабильность pH по сравнению с контролем, что указывает на замедление процессов порчи.&lt;/p&gt;\n&lt;p&gt;Концентрация витамина C значительно снизилась за время хранения. К 20-му дню контрольная группа (T₀) потеряла 23,8 мг/100 г витамина C, тогда как группа T₁ (100% алоэ вера) — 7,91 мг/100 г, что подтверждает защитный эффект покрытия.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f1.jpg\" alt=\"Схема подготовки образцов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Схема подготовки образцов.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f2.jpg\" alt=\"Влияние покрытия из алоэ вера и смеси цветочного меда на потерю сока при холодильном хранении.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние покрытия из алоэ вера и смеси цветочного меда на потерю сока при холодильном хранении.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Влияние покрытия из алоэ вера и смеси цветочного меда на потерю сока при холодильном хранении. Значения представлены как среднее ± стандартное отклонение (n = 3). Разные надстрочные буквы указывают на статистически значимые различия между вариантами обработки в пределах одного срока хранения (p &amp;lt; 0,05) согласно тесту Дункана (DMRT). Двухфакторный дисперсионный анализ (ANOVA) показал значимое влияние обработки (T), времени (D) и их взаимодействия (T × D) при p &amp;lt; 0,05, если не указано иное. T0 — контрольный образец манго без обработки; T1 — манго с покрытием из 100% алоэ вера; T2 — манго с покрытием из 100% смеси цветочного меда; T3 — манго с покрытием из 50% смеси цветочного меда и 50% алоэ вера; T4 — манго с покрытием из 25% смеси цветочного меда и 75% алоэ вера; T5 — манго с покрытием из 75% смеси цветочного меда и 25% алоэ вера.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f5.jpg\" alt=\"Корреляционный анализ Пирсона (p ≤ 0,05) срока хранения и вариантов съедобных покрытий с учетом взаимосвязей переменных \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Корреляционный анализ Пирсона (p ≤ 0,05) срока хранения и вариантов съедобных покрытий с учетом взаимосвязей переменных признаков, биохимических, микробиологических и физиологических параметров манго.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Корреляционный анализ Пирсона (p ≤ 0,05) срока хранения и вариантов съедобных покрытий с учетом взаимосвязей переменных признаков, биохимических, микробиологических и физиологических параметров манго. FN — твердость; ML — потеря влаги; TA — титруемая кислотность; TFC — общее содержание флавоноидов; TMY — общее количество плесневых грибов и дрожжей; TPC — общее содержание фенолов; TSS — общее содержание растворимых сухих веществ; TSS/TA — индекс вкуса; TVC — общее количество жизнеспособных микроорганизмов; Vit C — витамин С.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f6.jpg\" alt=\"Анализ главных компонент (PCA) срока хранения и вариантов съедобных покрытий с учетом взаимосвязей переменных признаков,\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Анализ главных компонент (PCA) срока хранения и вариантов съедобных покрытий с учетом взаимосвязей переменных признаков, биохимических, микробиологических и физиологических параметров манго.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Анализ главных компонент (PCA) срока хранения и вариантов съедобных покрытий с учетом взаимосвязей переменных признаков, биохимических, микробиологических и физиологических параметров манго. FN — твердость; ML — потеря влаги; TA — титруемая кислотность; TFC — общее содержание флавоноидов; TMY — общее количество плесневых грибов и дрожжей; TPC — общее содержание фенолов; TSS — общее содержание растворимых сухих веществ; TSS/TA — индекс вкуса; TVC — общее количество жизнеспособных микроорганизмов; Vit C — витамин С.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;быстрая порча&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нарезанного&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;манго&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;покрытие гелем&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алоэ вера&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;снижение порчи&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на 50&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;процентов&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;экологичный&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;способ&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;хранения&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фруктов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Food science &amp;amp; nutrition. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Food science &amp;amp; nutrition (Europe PMC)&lt;/td&gt;\n&lt;td&gt;gels&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Khatun T, Asaduzzaman M.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;t
