        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"104\" cy=\"137\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"696\" cy=\"259\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SOURDOUGH   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Чайный гриб вместо закваски:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;как комбуча разгоняет&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;брожение хлеба&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea-f1.jpg\" alt=\"Эволюция pH в процессе ферментации.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Эволюция pH в процессе ферментации.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Эволюция pH в процессе ферментации. (A) Изменение pH чайного гриба (комбучи) в течение 7 дней ферментации. (B) Изменение pH закваски на основе комбучи (KS) в течение 5 дней, необходимых для её приготовления. Значения представляют собой среднее арифметическое ± стандартное отклонение для трёх биологических повторностей.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Выведение традиционной закваски спонтанного брожения часто затягивается на недели. Технологи предложили нестандартный ход: использовать жидкую комбучу с ее симбиотическим сообществом бактерий и дрожжей в качестве стартера. Всего за пять дней омоложений опара достигает технологической зрелости, выдавая хлеб классической текстуры. При этом готовый мякиш накапливает заметно больше фенольных соединений, чем традиционный каравай.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha-based-sourdough.html\"&gt;Закваска на основе комбучи&lt;/a&gt; созревает до рабочей плотности всего за 5 дней при 23 °C.&lt;/li&gt;\n&lt;li&gt;Хлеб замешивали на 33% закваски от массы муки и расстаивали 12 часов при 4 °C.&lt;/li&gt;\n&lt;li&gt;Мякиш показал стандартную пористость, но превзошел контроль по уровню антиоксидантов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Классическое ведение закваски первого типа (спонтанное брожение муки и воды с регулярными освежениями) требует долгой стабилизации микробиоты. В исследовании стартером выступила семидневная &lt;a href=\"concepts/kombucha.html\"&gt;комбуча&lt;/a&gt; на черном чае (инфузия 12 г/л Camellia sinensis при 70 °C в течение 60 с). В первый день смешали 100 г муки тонкого помола с высоким содержанием белка (15,5%) и 100 мл комбучи, выдержав смесь при 23 °C. На вторые сутки внесли 100 г муки и 50 мл воды, а на третий и четвертый дни объем воды сократили до 45 мл для адаптации гидратации к привычной густоте закваски.&lt;/p&gt;\n&lt;p&gt;Уже через пять суток закваска на комбуче вышла на стабильный рабочий уровень. Тесто замешивали по ремесленной рецептуре: 600 г муки, 500 г воды, 200 г закваски (около 33% к массе муки) и 12 г соли. Брожение вели при 28 °C до удвоения объема, формовали буханки по 325 г, расстаивали 12 часов при 4 °C и выпекали на камне при 250 °C в течение 40 минут. Пористость, удельный объем и скорость черствения мякиша совпали с контрольным ремесленным хлебом, но хлеб на комбуче превзошел контроль по общему содержанию полифенолов и антиоксидантной емкости в тесте DPPH.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперимент проведен на ограниченном числе лабораторных партий с одним сортом чая и муки без долгосрочной проверки стабильности микробиоты при постоянных пересевах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;В последние годы растущая осведомленность потребителей о связи между питанием и здоровьем стимулирует спрос на продукты, обладающие не только пищевой ценностью, но и дополнительными физиологическими и функциональными преимуществами. Разнообразие и качество пищевых продуктов значительно изменились, чтобы соответствовать этим ожиданиям. Это привело к развитию функциональных продуктов питания — изделий, способных оказывать благоприятное воздействие на одну или несколько функций организма сверх базовой питательной ценности. Среди ферментированных продуктов в этой категории особое внимание привлекает чайный гриб (комбуча). Комбуча — это слабокислый, слегка сладкий ферментированный напиток, традиционно получаемый из подслащенного черного или зеленого чая, хотя изучались и альтернативные субстраты, такие как настои на основе фруктов и растений. Его &lt;a href=\"concepts/fermentation.html\"&gt;ферментация&lt;/a&gt; осуществляется симбиотической культурой бактерий и дрожжей (&lt;a href=\"concepts/scoby.html\"&gt;SCOBY&lt;/a&gt;) в аэробных условиях, что приводит к образованию широкого спектра биоактивных соединений, включая органические кислоты, &lt;a href=\"concepts/polyphenols.html\"&gt;полифенолы&lt;/a&gt;, витамины, аминокислоты и минералы. Благодаря сложному биохимическому составу и наличию полезных микроорганизмов, комбуча ассоциируется с антиоксидантными, антимикробными и противовоспалительными эффектами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Комбуча — это ферментированный напиток, получаемый с помощью симбиотической культуры бактерий и дрожжей (SCOBY), который содержит широкий спектр биоактивных соединений и обладает потенциальными функциональными свойствами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Несмотря на то, что многие исследования изучали роль микробиоты комбучи в производстве метаболитов, лишь немногие сосредоточены на использовании комбучи в качестве микробной закваски для других ферментированных продуктов, таких как сыр, йогурт или хлеб. Хлеб является основным компонентом рациона человека на протяжении веков и традиционно производится путем ферментации теста на основе злаков. Хотя пекарские дрожжи (Saccharomyces cerevisiae) остаются основным разрыхлителем в промышленном хлебопечении, растет интерес к стратегиям ферментации, направленным на улучшение питательных и функциональных свойств хлеба. В этом контексте использование микробных консорциумов, полученных из комбучи, в качестве альтернативной закваски для ферментации закваски представляет собой новый и малоизученный подход. Вместо прямого внесения в тесто комбучу можно использовать как микробный инокулят для создания закваски, которая затем применяется для выпечки хлеба. Эта стратегия позволяет комплексному симбиотическому сообществу бактерий и дрожжей адаптироваться к зерновой матрице и сформировать стабильную экосистему закваски. Такой подход может значительно ускорить созревание закваски, одновременно влияя на технологические, сенсорные и функциональные свойства конечного продукта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данное исследование является экспериментальным: авторы использовали жидкую комбучу как инокулят для создания закваски и сравнивали полученный хлеб с традиционным хлебом на закваске.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В настоящем исследовании изучалось прямое использование жидкой комбучи в качестве естественно сложного инокулята для создания обновляемой системы закваски путем последовательных пересадок (backslopping) и её использование в процессе хлебопечения. Физико-химический, структурный и сенсорный анализы показали, что хлеб на комбуче сохраняет большинство характеристик традиционного хлеба на закваске, при этом содержание фенолов и антиоксидантная активность оказались значительно выше.&lt;/p&gt;\n&lt;p&gt;Чай и комбуча готовились по методу Cardoso et al. с небольшими изменениями. Для получения 1 л комбучи 12 г листьев черного чая (Camellia sinensis L.) заливали 1 л стерильной воды при 70°C и настаивали 60 с. Затем настой фильтровали через чистую хлопчатобумажную ткань и охлаждали до комнатной температуры. В качестве инокулята использовали 10% (об./об.) комбучи и 3% (масс./об.) SCOBY из лабораторной культуры, поддерживаемой более 2 лет. Емкости накрывали хлопчатобумажной тканью и ферментировали 7 дней при 23°C. Ежедневно измеряли pH. По окончании ферментации полученный SCOBY удаляли, а комбучу хранили при 4°C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-backslopping.html\"&gt;Метод «backslopping»&lt;/a&gt; (пересадка) — это традиционный способ поддержания закваски, при котором часть зрелой закваски используется для ферментации новой порции муки и воды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Использовалась пшеничная мука Petra 6384 (для закваски) и Petra 5037 (для хлеба). &lt;a href=\"concepts/microbial-load.html\"&gt;Микробная нагрузка&lt;/a&gt; муки определялась путем растворения 1 г муки в 9 мл буферной пептонной воды с последующим высевом на агар для подсчета микроорганизмов (Plate Count Agar) и инкубацией при 30°C в течение 48 ч.&lt;/p&gt;\n&lt;p&gt;Процесс подготовки закваски на основе комбучи (KS) занимает 5 дней. 100 г муки смешивали со 100 мл комбучи и инкубировали при 23°C в течение 24 ч. В последующие дни проводили «освежение»: смешивали 100 г ферментированного теста, 100 г муки и 50 мл (затем 45 мл) водопроводной воды. pH контролировали ежедневно. В качестве традиционной закваски (TS) использовали ежедневно обновляемую ремесленную закваску I типа.&lt;/p&gt;\n&lt;p&gt;Тесто готовили из 600 г пшеничной муки, 500 г минеральной воды, 200 г закваски (около 33% от массы муки) и 12 г хлорида натрия. Замес проводили в течение 20 мин. Основная ферментация проходила при 28°C до удвоения объема. Затем тесто делили на 4 порции по 325 г, расстаивали при 4°C в течение 12 ч и выпекали на разогретом камне при 250°C в течение 40 мин.&lt;/p&gt;\n&lt;p&gt;Уксуснокислые бактерии подсчитывали на среде GYC (глюкоза 50 г/л, дрожжевой экстракт 10 г/л, карбонат кальция 5 г/л, агар 20 г/л), &lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;молочнокислые бактерии&lt;/a&gt; — на среде MRS, дрожжи — на среде YPD. Среды дополняли циклогексимидом (100 мг/л) или хлорамфениколом (100 мг/л).&lt;/p&gt;\n&lt;p&gt;10 г закваски смешивали с 90 мл 0,9% раствора хлорида натрия в гомогенизаторе Seward Stomacher 400 (2,5 мин, 260 об/мин). Дрожжи и уксуснокислые бактерии подсчитывали на YPD и GYC, молочнокислые бактерии — на среде MRS5 (инкубация 96 ч при 30°C в анаэробных условиях).&lt;/p&gt;\n&lt;p&gt;Образцы замораживали при -20°C, лиофилизировали, измельчали в порошок. 1 г порошка смешивали с 5 мл 80% (об./об.) водно-метанольного раствора, обрабатывали ультразвуком (15 мин), центрифугировали (10 мин, 5000 об/мин). Процесс повторяли дважды.&lt;/p&gt;\n&lt;p&gt;Антиоксидантную активность оценивали методами DPPH (&lt;a href=\"concepts/dpph-assay.html\"&gt;радикальное поглощение&lt;/a&gt;), FRAP (восстановление железа) и методом Фолина-Чокальтеу (общее содержание фенолов, TPC). Результаты выражали в мг эквивалента тролокса (TE) или галловой кислоты (&lt;a href=\"concepts/gallic-acid-equivalent.html\"&gt;GAE&lt;/a&gt;) на 100 мл или 1 г образца.&lt;/p&gt;\n&lt;p&gt;Объем хлеба определяли методом вытеснения рапса (AACC 10–05.01). Влажность и активность воды (aw) измеряли сразу после охлаждения (T0) и через 48 ч (T48). Цвет оценивали в системе CIE Lab*. Структуру мякиша анализировали с помощью сканера и ПО ImageJ2. Текстурный профиль (TPA) определяли с помощью анализатора текстуры TA.Xtplus (двойное сжатие на 30% высоты).&lt;/p&gt;\n&lt;p&gt;Оценка проводилась группой из 30 неподготовленных судей (25–55 лет). Оценивались визуальный вид, вкус, запах и текстура. Ответы собирались в бинарной форме (наличие/отсутствие атрибута).&lt;/p&gt;\n&lt;p&gt;Использовалось ПО R (версия 4.2.3). Статистическая значимость установлена при p &amp;lt; 0,05. Различия оценивались с помощью ANOVA, критерия Тьюки и t-критерия Уэлча.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea-f1.jpg\" alt=\"Эволюция pH в процессе ферментации.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Эволюция pH в процессе ферментации.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Эволюция pH в процессе ферментации. (A) Изменение pH чайного гриба (комбучи) в течение 7 дней ферментации. (B) Изменение pH закваски на основе комбучи (KS) в течение 5 дней, необходимых для её приготовления. Значения представляют собой среднее арифметическое ± стандартное отклонение для трёх биологических повторностей.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea-f2.jpg\" alt=\"Рабочий процесс анализа изображения мякиша хлеба, приготовленного на традиционной (T) закваске и закваске на основе комб\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рабочий процесс анализа изображения мякиша хлеба, приготовленного на традиционной (T) закваске и закваске на основе комбучи (K). Слева направо: изображение поперечного среза ломтика хлеба с выделенной областью интереса (ROI), увеличенное полутоновое изображение области интереса и соответствующее бинарное изображение, используемое для количественного анализа морфологии пор.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Долгий вывод&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;закваски с&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нуля&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сбраживание&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;муки комбучей&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;5 дней&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Быстрый подъем&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;антиоксиданты&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Экспресс-старт&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;крафтового&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;хлеба&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Food science &amp;amp; nutrition. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Food science &amp;amp; nutrition (Europe PMC)&lt;/td&gt;\n&lt;td&gt;sourdough&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Chinello M, Tawfik RNR, Canazza E, Nadai C, de Barros FAR, Lomolino G, Lante A, Corich V, Giacomini A.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;s
