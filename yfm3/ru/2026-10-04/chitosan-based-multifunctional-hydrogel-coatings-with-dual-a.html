        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"207\" cy=\"135\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"653\" cy=\"265\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Хитозановая невидимая броня&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;против гниения томатов и&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;цитрусов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f1.jpg\" alt=\"Морфологический анализ гидрогеля CTS-ZnO&amp;amp;CA. СЭМ-изображения гидрогеля CTS-ZnO&amp;amp;CA: (A) поперечное сечение, (B) продольно\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Морфологический анализ гидрогеля &lt;a href=\"concepts/biopolimery.html\"&gt;CTS&lt;/a&gt;-ZnO&amp;amp;CA. СЭМ-изображения гидрогеля CTS-ZnO&amp;amp;CA: (A) поперечное сечение, (B) продольное сечение. СЭМ-изображения поперечного сечения гидрогеля CTS-ZnO&amp;amp;CA (C) и соответствующее картирование (D–G) (кислород — зеленый, углерод — синий, &lt;a href=\"concepts/zinc.html\"&gt;цинк&lt;/a&gt; — красный, азот — оранжевый) и (H) ЭДС-спектр.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Около трети мировых запасов свежих овощей и фруктов теряется из-за микробов и окисления. Исследователи создали &lt;a href=\"concepts/cts-zno-ca-hydrogel.html\"&gt;съедобное гидрогелевое покрытие&lt;/a&gt; на базе хитозана с наночастицами оксида цинка и хлорогеновой кислотой. Состав действует сразу в двух направлениях: подавляет опасные бактерии и предотвращает окислительную порчу. Обработанные томаты и цитрусы значительно дольше сохраняют товарный вид и сочность при хранении.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Гидрогель на базе хитозана, ZnO и хлорогеновой кислоты объединяет антиоксидантную и антибактериальную защиту.&lt;/li&gt;\n&lt;li&gt;Состав разрушает биопленки патогенов MDR S. aureus и &lt;a href=\"concepts/pseudomonas-aeruginosa.html\"&gt;P. aeruginosa&lt;/a&gt; за счет генерации АФК и выхода ионов цинка.&lt;/li&gt;\n&lt;li&gt;Покрытие снижает испарение влаги у томатов и блокирует очаги гниения на поврежденной кожуре цитрусовых.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Проблема быстрого увядания томатов и цитрусовых часто кроется в одновременном воздействии двух факторов: окислительного стресса и размножения патогенов, включая Pseudomonas aeruginosa и устойчивые штаммы Staphylococcus aureus (MDR S. aureus). Для комплексной защиты разработан гидрогель CTS-ZnO&amp;amp;CA с массовым соотношением хитозана, наночастиц оксида цинка (ZnO) и экстрагированной из жимолости хлорогеновой кислоты (CA) 1:0,1:0,1. В качестве сшивающего агента выступил 50%-й раствор бета-глицерофосфата (&lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;β-GP&lt;/a&gt;), позволивший сформировать пористую пленку с равномерным распределением активных компонентов.&lt;/p&gt;\n&lt;p&gt;Антибактериальный эффект обусловлен синергией: &lt;a href=\"concepts/zinc-oxide-nanoparticles.html\"&gt;наночастицы ZnO&lt;/a&gt; генерируют активные формы кислорода (АФК) и высвобождают ионы Zn²⁺, которые повреждают мембраны бактерий, вызывая утечку нуклеиновых кислот и разрушая бактериальные биопленки. &lt;a href=\"concepts/chlorogenic-acid.html\"&gt;Хлорогеновая кислота&lt;/a&gt; нейтрализует свободные радикалы на поверхности плодов и хелатирует цинк, пролонгируя антимикробное действие. В тестах на свежих томатах пленка заметно снизила потерю массы за счет испарения воды, а на цитрусах с поврежденной кожурой остановила разрастание очагов гнили, вызванных P. aeruginosa при инкубации при 37 °C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в лабораторных условиях с искусственным заражением патогенами, а токсикологическая безопасность наноматериалов требует расширенной валидации в реальных пищевых цепочках.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Глобальный рост населения и технологический прогресс повышают спрос на безопасные и качественные продукты питания. Несмотря на совершенствование технологий производства, порча продуктов остается критической проблемой. Ежегодно в мире выбрасывается более 1 трлн кг продовольствия, при этом около трети потерь связано с порчей из-за микробного загрязнения или окислительных реакций при хранении и транспортировке. Особенно уязвимы скоропортящиеся продукты, такие как овощи и фрукты, подверженные воздействию температурных колебаний и влажности.&lt;/p&gt;\n&lt;p&gt;Основными причинами порчи являются микробное загрязнение (например, Staphylococcus aureus и Pseudomonas aeruginosa) и окисление питательных веществ. Традиционные консерванты (окислители, восстановители, кислоты) могут влиять на вкус и представлять риски для здоровья. В последние годы перспективным направлением стала «зеленая химия» и использование природных полисахаридов (&lt;a href=\"concepts/chitosan.html\"&gt;хитозан&lt;/a&gt;, &lt;a href=\"concepts/sodium-alginate.html\"&gt;альгинат&lt;/a&gt;, каррагинан), обладающих антимикробными и антиоксидантными свойствами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разработанное антимикробное гидрогелевое покрытие на основе хитозана (CTS-ZnO&amp;amp;CA) с добавлением хлорогеновой кислоты (CA) и наночастиц оксида цинка (ZnO) эффективно подавляет рост бактерий и замедляет окисление, продлевая срок хранения фруктов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является лабораторной моделью: эффективность покрытия проверялась на томатах и цитрусовых в контролируемых условиях, что требует дальнейшей проверки для промышленного масштабирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Синтез наночастиц ZnO проводился методом термического разложения при 260 °C. Гидрогель CTS-ZnO&amp;amp;CA получали путем смешивания хитозана (CTS) с β-глицерофосфатом (β-GP), наночастицами ZnO и хлорогеновой кислотой (CA) в массовом соотношении 1:0,1:0,1. Антибактериальная активность оценивалась против MDR S. aureus и P. aeruginosa. Цитотоксичность проверялась на мезенхимальных стволовых клетках (MSC) и клетках рака легкого (NCI-H1299) с использованием набора CCK-8.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод микроразведений в бульоне (broth microdilution) позволяет определить минимальную ингибирующую концентрацию (МИК) — наименьшее количество вещества, подавляющее видимый рост бактерий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Физико-химический анализ (СЭМ, РФЭС, ИК-фурье) подтвердил пористую структуру гидрогеля с размером пор 10–30 мкм и равномерное распределение наночастиц ZnO. Исследования на гемосовместимость показали, что даже при концентрации 500 мкг/мл гидрогель не вызывает гемолиза эритроцитов. Тесты на цитотоксичность подтвердили, что выживаемость клеток MSC и NCI-H1299 остается выше 95%.&lt;/p&gt;\n&lt;p&gt;Антибактериальная активность: МИК для обоих штаммов составила 250 мкг/мл, МБК (минимальная бактерицидная концентрация) — 500 мкг/мл. Механизм действия включает разрушение биопленок, повреждение мембран (подтверждено утечкой нуклеиновых кислот) и индукцию окислительного стресса через генерацию активных форм кислорода (АФК).&lt;/p&gt;\n&lt;p&gt;Применение на томатах показало, что покрытие CTS-ZnO&amp;amp;CA значительно снижает потерю массы и замедляет порчу по сравнению с контрольной группой. Антиоксидантная активность была подтверждена тестами DPPH и ABTS. На модели цитрусовых, зараженных P. aeruginosa, покрытие эффективно ограничило расширение зон поражения.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f1.jpg\" alt=\"Морфологический анализ гидрогеля CTS-ZnO&amp;amp;CA. СЭМ-изображения гидрогеля CTS-ZnO&amp;amp;CA: (A) поперечное сечение, (B) продольно\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Морфологический анализ гидрогеля CTS-ZnO&amp;amp;CA. СЭМ-изображения гидрогеля CTS-ZnO&amp;amp;CA: (A) поперечное сечение, (B) продольное сечение. СЭМ-изображения поперечного сечения гидрогеля CTS-ZnO&amp;amp;CA (C) и соответствующее картирование (D–G) (кислород — зеленый, углерод — синий, цинк — красный, азот — оранжевый) и (H) ЭДС-спектр.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f2.jpg\" alt=\"XPS-спектры гидрогеля CTS-ZnO&amp;amp;CA. (A) Обзорный спектр, (B) O 1s, (C) C 1s, (D) Zn 2p, (E) N 1s и (F) P 2p спектры.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;XPS-спектры гидрогеля CTS-ZnO&amp;amp;CA. (A) Обзорный спектр, (B) O 1s, (C) C 1s, (D) Zn 2p, (E) N 1s и (F) P 2p спектры.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f3.jpg\" alt=\"Изображения и анализ гемолитической активности гидрогеля CTS-ZnO&amp;amp;CA. (A и E) изображения гемолитического анализа и относ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Изображения и анализ гемолитической активности гидрогеля CTS-ZnO&amp;amp;CA. (A и E) изображения гемолитического анализа и относительные показатели гемолиза для CTS, (B и F) для CA, (C и G) для ZnO, (D и H) для гидрогеля CTS-ZnO&amp;amp;CA.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f4.jpg\" alt=\"Оценка цитотоксичности гидрогеля CTS-ZnO&amp;amp;CA. Цитотоксическое действие CTS-ZnO&amp;amp;CA на клетки MSC (A и B) и клетки NCI-H129\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Оценка цитотоксичности гидрогеля CTS-ZnO&amp;amp;CA. Цитотоксическое действие CTS-ZnO&amp;amp;CA на клетки MSC (A и B) и клетки NCI-H1299 (C и D) после 12 и 24 часов воздействия.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f5.jpg\" alt=\"Оценка антибактериальной активности гидрогеля CTS-ZnO&amp;amp;CA. Антибактериальный эффект CTS-ZnO&amp;amp;CA в отношении (A) MDR S. aur\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Оценка антибактериальной активности гидрогеля CTS-ZnO&amp;amp;CA. Антибактериальный эффект CTS-ZnO&amp;amp;CA в отношении (A) MDR S. aureus и (B) P. aeruginosa, а также (C и D) соответствующие показатели антибактериальной активности.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f6.jpg\" alt=\"Оценка антибактериального механизма гидрогеля CTS-ZnO&amp;amp;CA.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Оценка антибактериального механизма гидрогеля CTS-ZnO&amp;amp;CA.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Оценка антибактериального механизма гидрогеля CTS-ZnO&amp;amp;CA. Микроскопические изображения биопленок (A) MDR S. aureus и P. aeruginosa после обработки различными концентрациями CTS-ZnO&amp;amp;CA. (B) Трехмерные проекции CLSM биопленок, окрашенных кристаллическим фиолетовым. (C) Уровень искоренения биопленок CTS-ZnO&amp;amp;CA в отношении MDR S. aureus и P. aeruginosa.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f7.jpg\" alt=\"Уровень утечки нуклеиновых кислот у (A) MDR S. aureus и (B) P. aeruginosa после обработки различными концентрациями CTS-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Уровень утечки нуклеиновых кислот у (A) MDR S. aureus и (B) P. aeruginosa после обработки различными концентрациями CTS-ZnO&amp;amp;CA. Уровень внутриклеточных АФК у (C) MDR S. aureus и (D) P. aeruginosa после обработки CTS-ZnO&amp;amp;CA.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f8.jpg\" alt=\"Эффективность сохранения и антиоксидантная активность различных покрытий на томатах во время хранения.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Эффективность сохранения и антиоксидантная активность различных покрытий на томатах во время хранения.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Эффективность сохранения и антиоксидантная активность различных покрытий на томатах во время хранения. (A) Схематическая иллюстрация процесса сохранения томатов с использованием антибактериального гидрогелевого покрытия CTS-ZnO&amp;amp;CA. (B) Репрезентативные фотографии, демонстрирующие изменения внешнего вида томатов, обработанных контрольным составом, CTS, ZnO&amp;amp;CA и покрытием CTS-ZnO&amp;amp;CA, во время хранения при комнатной температуре в течение 14 дней. (C) Изменения скорости потери массы томатов во время хранения. Механизм, профили поглощения и способность поглощения свободных радикалов CTS-ZnO&amp;amp;CA в отношении двух различных свободных радикалов: (D) DPPH, (E) ABTS (n = 3).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f9.jpg\" alt=\"Антикоррозийная и антибактериальная эффективность различных видов обработки in vivo на цитрусовых, инфицированных P. aer\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Антикоррозийная и антибактериальная эффективность различных видов обработки in vivo на цитрусовых, инфицированных P. aeruginosa.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Антикоррозийная и антибактериальная эффективность различных видов обработки in vivo на цитрусовых, инфицированных P. aeruginosa. (A) Схематическая иллюстрация процедуры заражения и обработки цитрусовых in vivo. (B) Репрезентативные фотографии, демонстрирующие прогрессирование симптомов гниения на цитрусовых, обработанных контрольным составом, CTS, ZnO&amp;amp;CA и покрытием CTS-ZnO&amp;amp;CA, в течение 15 дней хранения при 37 °C. Изображения сделаны на 1, 3, 5, 7, 9, 11, 13 и 15 дни после инокуляции. (C) Фотографии чашек с мазками гомогенатов инфицированных тканей. (D) Количественная оценка площади поражения с течением времени для различных групп обработки. (E) Антибактериальная активность, определенная путем измерения оптической плотности гомогенизированных инфицированных тканей после инкубации в среде LB в течение 2 ч.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Быстрая порча&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;плодов от&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;микробов&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Гидрогель из&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;хитозана ZnO и&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CA&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Подавление&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бактерий и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;удержание&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;влаги&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Продление&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;свежести&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;плодов без&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;химии&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале RSC advances. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;RSC advances (Europe PMC)&lt;/td&gt;\n&lt;td&gt;shelf_life&lt;/td&gt;\n&lt;td&gt;CC BY-NC 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Qu L, Xu D, Ren Y, Ren J, Huang L, Hua L, Wu H, Wang L.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13599508\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/articles/PMC13599508?pdf=render\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt
