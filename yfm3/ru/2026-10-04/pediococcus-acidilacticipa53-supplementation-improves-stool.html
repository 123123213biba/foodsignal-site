        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"270\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"630\" cy=\"284\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · FIBRE_MICROBIOME   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Молочнокислая бактерия из&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;заквасок смягчает стул:&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;клинические испытания штамма&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;PA53&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f1.jpg\" alt=\"Блок-схема клинического исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Блок-схема клинического исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Хронический &lt;a href=\"concepts/functional-constipation.html\"&gt;функциональный запор&lt;/a&gt; часто связан со снижением микробного разнообразия и задержкой транзита. В рандомизированном исследовании штамм &lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; PA53 показал способность корректировать плотность стула у взрослых. Ежедневный прием микроорганизма изменил профиль гормонов моторики кишечника и цитокинов. При этом общая частота дефекаций между группами существенно не разошлась, сместив фокус эффекта на консистенцию.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Прием 3,0 × 10¹⁰ КОЕ PA53 в день за 8 недель достоверно смягчил консистенцию стула по Бристольской шкале.&lt;/li&gt;\n&lt;li&gt;Штамм повысил уровень регулятора моторики мотилина и IL-10, параллельно снизив маркер воспаления IL-6.&lt;/li&gt;\n&lt;li&gt;Разница в частоте дефекаций между группами пробиотика и плацебо оказалась статистически незначимой.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Pediococcus acidilactici — это грамположительная гомоферментативная молочнокислая бактерия, традиционно встречающаяся в ферментированных растительных и мясных заквасках. В двойном слепом плацебо-контролируемом исследовании 87 взрослых с функциональным запором (по критериям Rome IV) получали либо 3,0 × 10¹⁰ КОЕ/день штамма PA53 в 3 граммах декстрина, либо чистый декстрин на протяжении 8 недель. Первичной точкой оценки служила &lt;a href=\"concepts/bristol-stool-form-scale.html\"&gt;Бристольская шкала формы кала&lt;/a&gt; (BSFS), где значения 1–2 соответствуют чрезмерно плотным массам. К концу эксперимента в группе пробиотика балл BSFS достиг 2,76 ± 0,93 против 2,03 ± 0,85 в группе плацебо (p = 0,004), что указывает на достоверное смягчение консистенции.&lt;/p&gt;\n&lt;p&gt;Биохимический анализ сыворотки выявил сдвиг в регуляции моторики и иммунного ответа: внутри группы PA53 повысился уровень мотилина (гормона, стимулирующего перистальтику ЖКТ) и противовоспалительного интерлейкина-10 (IL-10). Параллельно снизились уровни соматостатина, угнетающего моторику, и провоспалительного цитокина интерлейкина-6 (IL-6). Секвенирование гипервариабельных регионов V3–V4 гена 16S рРНК подтвердило увеличение доли рода Pediococcus и перестройку структуры микробиоты кишечника. Хотя доля участников с 4–6 дефекациями в неделю в опытной группе выросла с 16,7% до 38,1%, межгрупповая разница по частоте стула не достигла статистической значимости (p = 0,144).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в одном центре на выборке из 87 человек и не выявило преимуществ перед плацебо по частоте дефекаций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Функциональный запор (ФЗ) — распространенное хроническое расстройство кишечника, характеризующееся редким стулом (менее трех раз в неделю), твердой консистенцией (типы 1–2 по Бристольской шкале формы кала, BSFS) и чувством неполного опорожнения. Глобальная распространенность ФЗ у взрослых оценивается в 10–14%, у пожилых людей — до 30%. Патофизиология ФЗ многофакторна: нарушение моторики толстой кишки, висцеральная гиперчувствительность и дисрегуляция оси «кишечник-мозг». Дисбиоз при ФЗ связан со снижением количества бактерий, продуцирующих &lt;a href=\"concepts/short-chain-fatty-acids.html\"&gt;короткоцепочечные жирные кислоты&lt;/a&gt;, и уменьшением микробного разнообразия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование оценивает эффективность пробиотика Pediococcus acidilactici PA53 при функциональном запоре у взрослых в ходе 8-недельного рандомизированного двойного слепого плацебо-контролируемого испытания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Традиционное лечение включает изменение образа жизни и слабительные средства, однако их эффективность ограничена побочными эффектами и низкой приверженностью пациентов. Пробиотики, такие как Bifidobacterium lactis HN019 и Weizmannia coagulans BC99, показывают умеренную эффективность в улучшении консистенции стула и времени транзита. Pediococcus acidilactici — грамположительная гомоферментативная молочнокислая бактерия, обладающая потенциальными иммуномодулирующими свойствами и способностью вырабатывать педиоцин.&lt;/p&gt;\n&lt;p&gt;Исследование проводилось в больнице Нинсяского медицинского университета (Китай) с 1 августа 2024 г. по 30 мая 2025 г. (регистрация NCT06761443). Включено 87 участников (18–70 лет) с ФЗ по критериям Рим IV. Исключались лица, принимавшие слабительные или пробиотики за 4 недели до начала, а также имеющие тяжелые сопутствующие заболевания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/randomizirovannoe-dvoynoe-slepoe-platsebo-kontroliruemoe-iss.html\"&gt;Рандомизированное двойное слепое плацебо-контролируемое исследование&lt;/a&gt; — «золотой стандарт» клинических испытаний, где ни участники, ни исследователи не знают, кто получает активный препарат, а кто — плацебо, что минимизирует предвзятость.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Участники были рандомизированы (1:1) на две группы: группа PA53 (3 г декстрина с 3,0 × 10¹⁰ КОЕ P. acidilactici PA53) и группа плацебо (3 г декстрина). Первичный исход — изменение консистенции стула по шкале BSFS. Вторичные исходы — частота спонтанных дефекаций (SBM), качество жизни (PAC-QOL), психологический статус (DASS-21), биохимические и воспалительные маркеры, а также состав микробиоты (&lt;a href=\"concepts/16s-rrna-gene-sequencing.html\"&gt;секвенирование 16S рРНК&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;В исследовании завершили участие 81 человек (42 в группе PA53, 39 в группе плацебо). После 8 недель в группе PA53 показатель BSFS значимо увеличился (с 1,93 ± 0,80 до 2,76 ± 0,93, p = 0,001), что было выше, чем в группе плацебо (2,03 ± 0,85, p = 0,004). Частота дефекаций в группе PA53 улучшилась внутригруппово (p = 0,028), однако значимой разницы между группами не выявлено (p = 0,144).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые изменения уровней гормонов (MTL, SS) и цитокинов (IL-6, IL-10) носили преимущественно внутригрупповой характер, что может отражать временные колебания, а не прямой эффект терапии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Биохимические показатели безопасности (альбумин, АЛТ, АСТ, креатинин, мочевая кислота, мочевина, глюкоза) оставались в пределах нормы. Анализ микробиоты показал обогащение рода Pediococcus в группе PA53 к 8-й неделе. Различия в альфа- и бета-разнообразии между группами не достигли порогов статистической значимости.&lt;/p&gt;\n&lt;p&gt;Результаты показывают, что ежедневный прием P. acidilactici PA53 в течение 8 недель способствует улучшению консистенции стула у взрослых с функциональным запором. Хотя механизмы влияния на моторику через нейроэндокринную ось остаются гипотетическими, выявленное снижение IL-6 и повышение IL-10 указывают на потенциальный иммуномодулирующий эффект. Ограничения исследования включают относительно малый размер выборки и отсутствие строгого контроля диеты, что требует проведения более крупных многоцентровых испытаний.&lt;/p&gt;\n&lt;p&gt;Добавка P. acidilactici PA53 безопасна, хорошо переносится и значимо улучшает форму стула у пациентов с функциональным запором, при этом влияние на частоту дефекаций менее выражено.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f1.jpg\" alt=\"Блок-схема клинического исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Блок-схема клинического исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f2.jpg\" alt=\"Уровни 5-HT, MTL, SS и цитокинов (IL-4, IL-6, IL-10) в группах плацебо и PA53.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Уровни 5-HT, MTL, SS и цитокинов (IL-4, IL-6, IL-10) в группах плацебо и PA53.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Уровни 5-HT, MTL, SS и цитокинов (IL-4, IL-6, IL-10) в группах плацебо и PA53. 5-HT: 5-гидрокситриптамин, MTL: &lt;a href=\"concepts/motilin.html\"&gt;мотилин&lt;/a&gt;, SS: &lt;a href=\"concepts/somatostatin.html\"&gt;соматостатин&lt;/a&gt;, IL-4: интерлейкин-4, IL-6: интерлейкин-6, IL-10: интерлейкин-10. Placebo_W0, Placebo_W4, Placebo_W8 представляют собой временные точки 0, 4 и 8 недель в группе плацебо соответственно. PA53_W0, PA53_W4, PA53_W8 представляют собой временные точки 0, 4 и 8 недель в группе PA53 соответственно. Все представленные p-значения были скорректированы для множественных сравнений с использованием метода ложной частоты обнаружения (FDR) Бенджамини–Хохберга.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f3.jpg\" alt=\"Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо на исходном уровне.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо на исходном уровне.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо на исходном уровне. (A–C) Индексы альфа-разнообразия (ACE, Chao1 и Shannon). (D) График анализа главных координат (PCoA), основанный на индексе несходства Брея–Кертиса. (E) Состав микробиоты кишечника на уровне типа. (F) Гистограмма LDA-баллов анализа размера эффекта линейного дискриминантного анализа (LEfSe), выделяющая роды с дифференциальной представленностью между группами. p-значения были скорректированы с использованием поправки Бенджамини–Хохберга на ложную частоту обнаружения (FDR) для множественных сравнений. Дифференциальные таксоны, идентифицированные с помощью LEfSe, были отобраны на основе порогового значения LDA-балла &amp;gt; 2,5.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f4.jpg\" alt=\"Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо через 4 недели вмешательства.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо через 4 недели вмешательства.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо через 4 недели вмешательства. (A–C) Индексы альфа-разнообразия (ACE, Chao1 и Shannon). (D) График анализа главных координат (PCoA), основанный на индексе несходства Брея–Кертиса. (E) Состав микробиоты кишечника на уровне типа. (F) Гистограмма LDA-баллов анализа размера эффекта линейного дискриминантного анализа (LEfSe), выделяющая роды с дифференциальной представленностью между группами. p-значения были скорректированы с использованием поправки Бенджамини–Хохберга на ложную частоту обнаружения (FDR) для множественных сравнений. Дифференциальные таксоны, идентифицированные с помощью LEfSe, были отобраны на основе порогового значения LDA-балла &amp;gt; 2,5.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f5.jpg\" alt=\"Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо через 8 недель вмешательства.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо через 8 недель вмешательства.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Разнообразие и состав микробиоты кишечника в группах PA53 и плацебо через 8 недель вмешательства. (A–C) Индексы альфа-разнообразия (ACE, Chao1 и Shannon). (D) График анализа главных координат (PCoA), основанный на индексе несходства Брея–Кертиса. (E) Состав микробиоты кишечника на уровне типа. (F) Гистограмма LDA-баллов анализа размера эффекта линейного дискриминантного анализа (LEfSe), выделяющая роды с дифференциальной представленностью между группами. Значения были скорректированы с использованием поправки Бенджамини–Хохберга на ложную частоту обнаружения (FDR) для множественных сравнений. Дифференциальные таксоны, идентифицированные с помощью LEfSe, были отобраны на основе порогового значения LDA-балла &amp;gt; 2,5.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f6.jpg\" alt=\"Динамика микробиоты кишечника в группе PA53 на 0, 4 и 8-й неделях вмешательства.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Динамика микробиоты кишечника в группе PA53 на 0, 4 и 8-й неделях вмешательства.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Динамика микробиоты кишечника в группе PA53 на 0, 4 и 8-й неделях вмешательства. (A–C) Индексы альфа-разнообразия (ACE, Chao1 и Shannon). (D) Анализ главных координат (PCoA) бета-разнообразия на основе индекса несходства Брея-Кертиса. (E) Относительное таксономическое обилие на уровне типа. (F) Дифференциально представленные таксоны, выявленные с помощью анализа LEfSe. Значения p были скорректированы с использованием поправки Бенджамини-Хохберга на ложное обнаружение (FDR) для множественных сравнений. Дифференциальные таксоны, выявленные с помощью LEfSe, были отобраны на основе порогового значения LDA-балла &amp;gt; 2,5.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f7.jpg\" alt=\"Динамика микробиоты кишечника в группе плацебо на 0, 4 и 8-й неделях вмешательства.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Динамика микробиоты кишечника в группе плацебо на 0, 4 и 8-й неделях вмешательства.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Динамика микробиоты кишечника в группе плацебо на 0, 4 и 8-й неделях вмешательства. (A–C) Индексы альфа-разнообразия (ACE, Chao1 и Shannon). (D) Анализ главных координат (PCoA) бета-разнообразия на основе индекса несходства Брея-Кертиса. (E) Относительное таксономическое обилие на уровне типа.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Плотный стул&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;при запоре&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;снижает&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;качество&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;РКИ: 8 недель&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;приема PA53&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;против плацебо&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Балл BSFS&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вырос до 2,76,&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стихли маркеры&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Перспективный&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;штамм для&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мягкого&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пищеварения&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Food science &amp;amp; nutrition. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Food scienc
