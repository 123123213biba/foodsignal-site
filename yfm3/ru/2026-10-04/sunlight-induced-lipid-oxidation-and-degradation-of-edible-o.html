            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"263\" cy=\"171\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"517\" cy=\"179\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Мясо в масле на свету портит&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жир быстрее, чем кажется&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f1.jpg\" alt=\"(a) Изменения в УФ-видимых спектрах и процент сохранившихся эритроцитов в системе «растительное масло — эритроциты» при \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Изменения в УФ-видимых спектрах и процент сохранившихся эритроцитов в системе «растительное масло — эритроциты» при фотоокислении под действием видимого света. (b) Изменение перекисного числа (ПЧ) во времени в процессе фотоокисления. Различные заглавные буквы обозначают статистически значимые различия по критерию Дункана (p &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Присутствие даже малейших следов гемоглобина делает растительное масло крайне уязвимым к солнечному свету. В модельной водной эмульсии с каноловым маслом комплекс белка крови и видимого света запустил бурное перекисное окисление всего за 2,5 часа. Исследователи доказали, что разрушение жирных кислот идет сразу двумя путями — через синглетный кислород и свободные радикалы. Это явление критично для маринадов и открывает новые способы очистки жирных промышленных стоков.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Свет и &lt;a href=\"concepts/hemoglobin.html\"&gt;гемоглобин&lt;/a&gt; разогнали &lt;a href=\"concepts/peroxide-value.html\"&gt;перекисное число&lt;/a&gt; масла до 9,7 мэкв/кг за 2,5 часа&lt;/li&gt;\n&lt;li&gt;Разрушено более 30% ненасыщенных связей с образованием альдегида &lt;a href=\"concepts/malondialdehyde.html\"&gt;МДА&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;Окисление тормозится антиоксидантом BHT и гасителем синглетного кислорода&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В эксперименте эмульсию канолового масла (2% v/v) и суспензии эритроцитов бараньей крови с концентрацией белка около 1,0 мг/мл облучали симулятором солнечного света (380–780 нм, освещенность 59 660 лк) при 25 °C с непрерывной продувкой воздухом. Всего за 2,5 часа перекисное число (ПЧ) подскочило со следовых значений до 9,7 мэкв O2/кг, в то время как в темноте или без гемоглобина окисление оставалось минимальным. Под действием натурального солнечного света интенсивностью 61 200 лк перекисное число достигло 10,5 мэкв O2/кг.&lt;/p&gt;\n&lt;p&gt;Ядерный магнитный резонанс (1H ЯМР) после 6 часов облучения показал падение доли винильных протонов на 31,2% и бис-аллильных протонов на 36,9%, что свидетельствует о массовом распаде ненасыщенных жирных кислот. Одновременно зафиксирован сигнал при 9,5 ppm, подтверждающий образование малонового диальдегида (МДА) — токсичного маркера глубокой порчи липидов. Добавление антиоксиданта бутилгидрокситолуола (BHT, 0,0016 ммоль) снизило перекисное число до 3,8 мэкв O2/кг, а ловушки синглетного кислорода азида натрия (NaN3) — до 3,1 мэкв O2/кг, подтвердив двойную природу реакции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование выполнено на водной эмульсии с растворителем ацетонитрилом (9:1), что не отражает поведение безводного чистого масла или сложных многокомпонентных соусов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Окисление и &lt;a href=\"concepts/photooxidation.html\"&gt;фотоокисление&lt;/a&gt; липидов признаны ключевыми факторами, влияющими на качество, питательную ценность и срок годности пищевых масел и других жиросодержащих продуктов питания. Окислительная порча липидов приводит к образованию гидропероксидов, альдегидов и других вторичных продуктов окисления, которые отрицательно сказываются на вкусоароматических свойствах, безопасности и потребительской приемлемости. Среди данных маркеров окисления перекисное число (ПЧ) и накопление малонового диальдегида (МДА) общепризнаны в качестве ключевых индикаторов первичной и глубокой стадий перекисного окисления липидов в пищевых системах соответственно. Поскольку фотоокисление представляет собой один из основных путей окислительной деструкции, понимание его механизмов необходимо для разработки эффективных стратегий повышения стабильности продуктов, оптимизации условий их хранения и совершенствования технологических процессов.&lt;/p&gt;\n&lt;p&gt;Помимо окисления при хранении, переработка растительных масел и пищевое производство сопровождаются образованием сточных вод с высоким содержанием липидов, что создает серьезные экологические и технологические трудности. Традиционные методы очистки на основе окисления, такие как озонирование и процессы Фентона, позволяют эффективно разрушать органические загрязнители, однако они часто требуют применения агрессивных химических окислителей и энергоемких условий ведения процесса. В связи с этим растет интерес к экологически устойчивым технологиям на основе действия света, в которых используются природные биомолекулы.&lt;/p&gt;\n&lt;p&gt;Гемоглобин — железосодержащий гемопротеин, в больших количествах присутствующий в тканях животных и побочных продуктах убоя скота, — традиционно известен своей функцией транспорта кислорода в мышечной ткани. Вместе с тем гемопротеины признаны важными медиаторами окисления липидов в мясе и других пищевых матрицах. Простетическая группа гема, представляющая собой порфириновую структуру с атомом железа в центре, способна участвовать в окислительно-восстановительных реакциях, инициирующих образование и распространение липидных радикалов. При воздействии света гемовые системы могут дополнительно генерировать активные формы кислорода, включая синглетный кислород, тем самым ускоряя окислительные процессы. Предшествующие исследования показали, что системы на основе порфиринов и гемоглобина способны катализировать аэробное фотоокисление жирных кислот и липидов под действием видимого света.&lt;/p&gt;\n&lt;p&gt;Опираясь на эти предпосылки, авторы настоящей работы поставили цель выяснить механизм индуцированного солнечным светом окисления липидов, опосредованного гемоглобином эритроцитов, в водной модельной системе пищевого масла. Научная новизна исследования заключается в применении структурно интактного гемоглобина эритроцитарного происхождения в качестве нативного фотосенсибилизатора на границе раздела фаз «вода — масло» при солнечном облучении, что связывает теоретическую фотохимию с биомиметическими условиями. Работа объединяет пути с участием синглетного кислорода и радикальные/гемовые реакции в единой нативной системе под действием видимого света, позволяя оценить их суммарный вклад в деструкцию липидов. Помимо углубления фундаментальных представлений о механизме фотоокисления с участием гемоглобина, данное исследование формирует основу для использования белков крови в качестве недорогих и доступных природных фотосенсибилизаторов при очистке маслосодержащих сточных вод пищевых производств. На основании тестов с перехватчиками радикалов и спектроскопических анализов предложен двойной окислительный механизм действия гемоглобина, включающий (i) генерацию синглетного кислорода за счет передачи энергии и (ii) предположительный радикальный путь с участием железа гема. Совместное действие этих процессов приводит к существенной деградации ненасыщенных жирных кислот в мягких условиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Интактный гемоглобин эритроцитов на свету запускает распад ненасыщенных жиров через синглетный кислород и радикальные пути, что делает его перспективным природным агентом для очистки маслосодержащих стоков пищепрома.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бенгальский розовый, антрацен, бутилгидрокситолуол (BHT), KMnO₄, NaN₃, ацетонитрил (CH₃CN), этанол (EtOH), ацетон ((CH₃)₂CO), метанол (MeOH) и диметилсульфоксид (ДМСО) были приобретены у компаний Fluka и Merck и использовались в исходном виде без дополнительной очистки. Коммерческое пищевое рапсовое масло (марка Oila) приобретено на местном рынке и использовалось без очистки.&lt;/p&gt;\n&lt;p&gt;Мембраны эритроцитов получали по стандартному методу Доджа. Дефибринированную кровь овец приобретали у компании Kimiakavoshazma Company (Иран). По прибытии образцы хранили при 4°C и использовали в течение 48 часов. Цельную кровь центрифугировали при 3000 об/мин в течение 10 минут при 4°C для отделения эритроцитарной фракции от плазмы. Отобранные эритроциты трижды промывали фосфатно-солевым буфером (PBS; 10 мМ, pH 7,4), после чего ресуспендировали в фосфатном буфере (10 мМ, pH 7,4). Концентрацию белка в суспензии доводили приблизительно до 1,0 мг/мл; для всех экспериментов готовили свежие суспензии. Концентрацию гемоглобина нормализовали перед каждым опытом выравниванием содержания белка во всех пробах фосфатным буфером (10 мМ, pH 7,4).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;&lt;a href=\"concepts/polosa-sore.html\"&gt;Полоса Соре&lt;/a&gt; — интенсивная полоса поглощения в синей области спектра (~407 нм), характерная для порфириновых структур гема; ее оптическая плотность напрямую отражает концентрацию и целостность молекулы гемоглобина.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Концентрацию гемоглобина спектрофотометрически верифицировали по полосе поглощения Соре перед началом измерений на УФ-видимом спектрофотометре Shimadzu (UV-2100) при длине волны 407 нм.&lt;/p&gt;\n&lt;p&gt;Раствор, содержащий пищевое масло (2 × 10⁻² об./об.) и суспензию эритроцитов (2 × 10⁻² об./об.), облучали с помощью солнечного симулятора, оснащенного 276 светодиодными лампами (1 Вт, 2,3 В; 380–780 нм; 59 660 лк; 8,74 мВт/см²), в течение 2,5 ч при температуре 25°C и атмосферном давлении в водно-ацетонитрильной системе (9:1 по объему). В процессе облучения через стеклянный барботер в реакционную смесь непрерывно нагнетали воздух для поддержания аэробных условий с примерной объемной скоростью 50 мл/мин при постоянном магнитном перемешивании. Контрольные эксперименты проводили в темноте и без добавления гемоглобина. Отбор проб осуществляли через фиксированные временные интервалы. Перекисные числа определяли иодометрическим методом и выражали в мэкв O₂/кг масла. Правильность работы прибора подтверждали растворами пероксидов. Деградацию эритроцитов отслеживали при 407 нм. Спектры поглощения регистрировали в кварцевых кюветах с длиной оптического пути 1 см в диапазоне 200–800 нм с разрешением 1 нм относительно смеси растворителей.&lt;/p&gt;\n&lt;p&gt;Для спектроскопии ¹H ЯМР смесь пищевого масла (2 × 10⁻² об./об.) и эритроцитов (2 × 10⁻² об./об.) облучали в аналогичных условиях в течение 6 ч. Спектры снимали на спектрометре Bruker AMX (300 МГц) при 25°C (внутренний стандарт — тетраметилсилан, ТМС; 32 накопления, задержка релаксации 1 с). Сигналы альдегидных протонов в диапазоне δ 9,4–9,6 м.д. служили доказательством образования МДА.&lt;/p&gt;\n&lt;p&gt;Для теста обесцвечивания антрацена смесь антрацена (4 × 10⁻⁴ М), масла (2 × 10⁻² об./об.) и эритроцитов (2 × 10⁻² об./об.) облучали 4 ч и анализировали при 375 нм. Влияние растворителей изучали в водно-органических смесях (9:1 об./об.) в течение 2,5 ч. Сравнение со стандартными окислителями проводили параллельно с раствором бенгальского розового (1 × 10⁻⁴ М) на свету и KMnO₄ (1 × 10⁻⁴ М) в темноте.&lt;/p&gt;\n&lt;p&gt;Все эксперименты проводили в трех независимых повторностях (n = 3). Данные выражали как среднее ± стандартное отклонение (SD). Статистическую обработку выполняли методом однофакторного дисперсионного анализа (ANOVA) с апостериорным тестом Данкана в пакете SAS 9.4 при критическом уровне значимости p &amp;lt; 0,05.&lt;/p&gt;\n&lt;p&gt;Эритроциты были использованы как естественная гемоглобинсодержащая система, формирующая биосовместимую среду для фотосенсибилизации. Применение интактных или лизированных клеток позволяет сохранить природную конформацию и редокс-свойства белка при облучении (Рис. 1a). После 24 ч имитации солнечного освещения смесь масла и эритроцитов продемонстрировала снижение мутности и интенсивности желтой окраски. По данным УФ-видимой спектроскопии интенсивность полосы Соре снизилась на 69,8%, что указывает на глубокую фотохимическую трансформацию хромофора гемоглобина (Рис. 1a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f1.jpg\" alt=\"(a) Изменения в УФ-видимых спектрах и процент сохранившихся эритроцитов в системе «растительное масло — эритроциты» при \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Изменения в УФ-видимых спектрах и процент сохранившихся эритроцитов в системе «растительное масло — эритроциты» при фотоокислении под действием видимого света. (b) Изменение перекисного числа (ПЧ) во времени в процессе фотоокисления. Различные заглавные буквы обозначают статистически значимые различия по критерию Дункана (p &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Контрольные пробы в темноте, без гемоглобина и при дефиците кислорода показали следовые уровни окисления (Таблица 1, строки 1–4). Схожесть спектров светодиодного симулятора и реального солнечного света подтвердила технологическую применимость системы в естественных условиях (Таблица 1, строка 5). Введение BHT как тушителя свободных радикалов снизило ПЧ с 9,7 до 3,8 мэкв O₂/кг (Таблица 1, строка 6). Ловушка синглетного кислорода NaN₃ уменьшила этот показатель до 3,1 мэкв O₂/кг (Таблица 1, строка 7).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Для глубокого окисления масла строго необходимо одновременное наличие гемоглобина, света и кислорода: ПЧ достигает максимума 9,7 мэкв O₂/кг за 2,5 часа, тогда как без белка или в темноте реакция практически не идет.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таблица 1. Фотоокисление пищевого масла эритроцитарной системой гемоглобина в различных условиях реакции.&lt;/p&gt;\n&lt;p&gt;/ Номер / Условия реакции / ПЧ (мэкв O₂/кг) /&lt;br /&gt;\n/ :--- / :--- / :--- /&lt;br /&gt;\n/ 1 / Пищевое масло + эритроциты + воздух + видимый свет / 9,7 /&lt;br /&gt;\n/ 2 / Пищевое масло + воздух + видимый свет / Следы /&lt;br /&gt;\n/ 3 / Пищевое масло + эритроциты + воздух / Следы /&lt;br /&gt;\n/ 4 / Пищевое масло + эритроциты + видимый свет / Следы /&lt;br /&gt;\n/ 5 / Пищевое масло + эритроциты + воздух + солнечный свет / 10,5 /&lt;br /&gt;\n/ 6 / Пищевое масло + эритроциты + воздух + видимый свет + BHT / 3,8 /&lt;br /&gt;\n/ 7 / Пищевое масло + эритроциты + воздух + видимый свет + NaN₃ / 3,1 /&lt;/p&gt;\n&lt;p&gt;Как видно из Рис. 1b, перекисное число непрерывно нарастало на протяжении первых 2,5 ч облучения, достигнув 9,7 мэкв O₂/кг, после чего незначительно снизилось вследствие деструкции первичных гидропероксидов во вторичные продукты.&lt;/p&gt;\n&lt;p&gt;Анализ методом ¹H ЯМР выявил изменения в жирнокислотном профиле масла под действием света в присутствии гемоглобина (Рис. 2). Сигналы винильных протонов (δ 5,2–5,4 м.д.), чувствительных к еновым реакциям под действием ¹O₂, уменьшились на 31,2%, тогда как сигналы бисаллильных протонов (δ 2,7–2,8 м.д.) снизились на 36,9%. Более выраженная убыль бисаллильных протонов согласуется с реакциями отрыва водорода, характерными для радикального пути с возможным участием феррильных интермедиатов гема. Появление резонансного сигнала при δ 9,5 м.д. (Рис. 2b) подтвердило образование малонового диальдегида (МДА).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f2.jpg\" alt=\"(a) Спектры 1H ЯМР растительного масла до и (b) после фотоокисления в присутствии эритроцитов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Спектры 1H ЯМР растительного масла до и (b) после фотоокисления в присутствии эритроцитов.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Прямая оценка образования синглетного кислорода с использованием антрацена в качестве зонда показала падение полосы поглощения при 375 нм на 33% за 4 ч облучения (Рис. 3), что вызвано формированием эндопероксида. Добавление NaN₃ подавляло этот процесс, доказывая преимущественный вклад ¹O₂ в фотообесцвечивание зонда.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f3.jpg\" alt=\"(a) Спектры поглощения антрацена в УФ-видимой области до и после облучения в присутствии эритроцитов. (b) Схематическое \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Спектры поглощения антрацена в УФ-видимой области до и после облучения в присутствии эритроцитов. (b) Схематическое изображение фотооксигенации антрацена с участием синглетного кислорода (1O2). Различные заглавные буквы обозначают статистически значимые различия по критерию Дункана (p &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Эффективность окисления масла закономерно зависела от природы полярного органического растворителя в ряду: ацетонитрил &amp;gt; этанол &amp;gt; ацетон &amp;gt; метанол &amp;gt; ДМСО (Таблица 2). Это согласуется со временем жизни ¹O₂ в среде: около 65 мкс в ацетонитриле против ~19 мкс в ДМСО. Кроме того, ДМСО способен координироваться по активному центру гема и ингибировать образование реакционноспособных феррильных форм (HbFe(IV)═O).&lt;/p&gt;\n&lt;p&gt;Таблица 2. Фотоокисление пищевого масла гемоглобином в присутствии различных растворителей.&lt;/p&gt;\n&lt;p&gt;/ Номер / Растворитель / ПЧ (мэкв O₂/кг) /&lt;br /&gt;\n/ :--- / :--- / :--- /&lt;br /&gt;\n/ 1 / Ацетонитрил / 9,7 /&lt;br /&gt;\n/ 2 / Этанол / 8,5 /&lt;br /&gt;\n/ 3 / Ацетон / 7,6 /&lt;br /&gt;\n/ 4 / Метанол / 7,4 /&lt;br /&gt;\n/ 5 / ДМСО / 2,6 /&lt;/p&gt;\n&lt;p&gt;По показателю ПЧ (мэкв O₂/кг) сравниваемые окислительные системы распределились следующим образом: Hb (9,7) &amp;gt; бенгальский розовый (6,8) &amp;gt; KMnO₄ (2,1). Превосходство гемоглобина обусловлено синергизмом одновременной генерации ¹O₂ и феррил-опосредованного окисления.&lt;/p&gt;\n&lt;p&gt;Результаты исследования указывают на то, что гемоглобин стимулирует перекисное окисление липидов посредством двух сопряженных путей: генерации синглетного кислорода и свободных радикалов. Участие ¹O₂ подтверждено обесцвечиванием антрацена, тушением процесса азидом натрия, корреляцией со временем жизни частицы в растворителях и избирательным расходом винильных связей. В то же время гипотеза об участии высоковалентного оксоферрильного комплекса (HbFe(IV)═O) опирается на косвенные свидетельства: ингибирование реакции фенольным антиоксидантом BHT, селективный отрыв бисаллильных протонов по данным ЯМР и падение активности в ДМСО.&lt;/p&gt;\n&lt;p&gt;Схема двойного окислительного механизма представлена на Рис. 4. Путь через ¹O₂ реализует еновые реакции по кратным связям (δ 5,2–5,4 м.д.), давая гидропероксиды. Параллельно феррил-гемовый комплекс отрывает водород от бисаллильных центров (δ 2,7–2,8 м.д.), стимулируя радикальную деструкцию углеродных цепей с выходом вторичных продуктов, включая МДА. Помимо этого, в спектрах ЯМР зарегистрировано изменение сигналов протонов глицеринового фрагмента при ~4,10 м.д., что свидетельствует о разрыве сложноэфирных связей -CH₂-O-CO- в триглицеридах в результате радикального β-распада. Молекулы синглетного кислорода непосредственно расщеплять сложноэфирные связи не способны.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f4.jpg\" alt=\"Предлагаемые механизмы гемоглобин-опосредованного фотоокисления растительного масла, включающие образование синглетного \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Предлагаемые механизмы гемоглобин-опосредованного фотоокисления растительного масла, включающие образование синглетного кислорода и феррил-/радикальный путь окисления.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;С экологической точки зрения гемоглобин представляет собой биоразлагаемый белок, массово получаемый в качестве побочного продукта мясной промышленности. Применение отходов переработки убоя в циркулярной экономике позволяет проводить деструкцию липидов в сточных водах под действием солнечного света без внесения синтетических реагентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Исследование выполнено на чистом модельном рапсовом масле в лабораторном реакторе; на реальных сточных водах предприятий эффективность системы пока не проверялась, а наличие феррильных форм железа требует прямого подтверждения.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;К ограничениям работы относятся использование упрощенной модельной системы «вода — масло» вместо реальных промышленных стоков со сложным химическим составом, отсутствие данных о стабильности структуры белка при длительном облучении, а также нерешенные инженерные вопросы масштабирования (проникновение света, аэрация и регенерация белка). Кроме того, образование интермедиата феррила железа показано косвенно и требует прямого спектроскопического доказательства.&lt;/p&gt;\n&lt;p&gt;В работе детально раскрыт механизм фотоокисления липидов под действием солнечного света, катализируемого эритроцитарным гемоглобином. Совокупность данных подтверждает параллельное протекание реакций синглетного кислорода и радикальных стадий, приводящих к окислению двойных связей, отрыву водорода от бисаллильных звеньев, гидролизу эфирных связей триглицеридов и формированию МДА. Полученные результаты открывают путь к использованию дешевых белков крови из отходов мясной индустрии в качестве возобновляемых фотокатализаторов для обезвреживания жиросодержащих технологических стоков пищевых производств. Будущие исследования должны быть сфокусированы на технологиях иммобилизации и стабилизации белка для создания масштабируемых систем солнечной водоочистки.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Порча масел&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;при контакте с&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кровью&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Облучение&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эмульсии с&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гемоглобином&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\"
