        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"146\" cy=\"138\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"514\" cy=\"258\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · BIOACTIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как подружить кофе и яблоки:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;природный катализатор для&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;создания функциональных&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;продуктов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи изучили, как фермент &lt;a href=\"concepts/polyphenol-oxidase.html\"&gt;полифенолоксидаза&lt;/a&gt; из яблок помогает связывать хлорогеновые кислоты кофе с молочными пептидами. Этот метод позволяет модифицировать структуру белков без использования жестких химических реагентов. В работе сравнивались два подхода: щелочная обработка и ферментативное воздействие яблочным соком. Результаты открывают новые возможности для создания функционального питания с улучшенными свойствами.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/5-caffeoylquinic-acid.html\"&gt;5-CQA&lt;/a&gt; — основной фенол кофе, способный связываться с белками через окисление в о-хиноны.&lt;/li&gt;\n&lt;li&gt;Яблочный сок сорта Braeburn показал высокую активность PPO (6262,4 Ед/л) для ферментативного катализа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enzymatic-modification.html\"&gt;Ферментативная модификация&lt;/a&gt; при pH 4,7 позволяет проводить связывание пептидов в мягких условиях.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе исследования лежит взаимодействие хлорогеновых кислот (CQA), составляющих до 12% сухой массы зеленых кофейных зерен, с молочными пептидами &lt;a href=\"concepts/biozate1.html\"&gt;BioZate1&lt;/a&gt; и гликомакропептидом (GMP). Основным компонентом кофе является 5-кофеилхинная кислота (5-CQA), способная к окислению в реакционноспособные о-хиноны. Для катализа этого процесса использовали полифенолоксидазу (PPO) из яблок сорта Braeburn, активность которой составила 6262,4 ± 462,6 Ед/л.&lt;/p&gt;\n&lt;p&gt;Эксперимент проводился при комнатной температуре (25°C) в течение 24 часов. При ферментативном методе (pH 4,7) в смесь добавляли 3 мл яблочного сока, что обеспечивало внесение около 18,8 Ед PPO. Сравнительный анализ показал, что щелочная обработка (pH 9) приводит к более высокому содержанию связанных фенолов (14,95 мкг/мг белка для ABZ1), однако использование яблочного сока представляет собой более экологичную альтернативу для модификации белков.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отсутствие контроля с инактивированным ферментом не позволяет однозначно отделить эффект PPO от других компонентов яблочного сока.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Поиск мягких&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;методов&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модификации&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белков&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ферментация&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;яблочным соком&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и pH 9&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Успешное&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;связывание&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фенолов и&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пептидов&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Создание&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;функциональных&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ингредиентов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Food science &amp;amp; nutrition. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Food science &amp;amp; nutrition (Europe PMC)&lt;/td&gt;\n&lt;td&gt;bioactives&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Hamadneh BN, Mustafa ED, Alkafafy ME, Khojah E, Samra BN, Wapet DEM, Mahmoud MM, Badawy WZ, Khalil M, Salama MA, Abdin M, Ali M.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13627869\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/articles/PMC13627869?pdf=render\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.1002/fsn3.72435\" target=\"_blank\" rel=\"noreferrer noopene
