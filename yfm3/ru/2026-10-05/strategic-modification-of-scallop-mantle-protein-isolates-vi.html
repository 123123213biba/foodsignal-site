        <title>Как превратить отходы морепродуктов в ценный пищевой белок | ФудСигнал</title>

        <meta name="description" content="Мантия гребешка обычно отправляется в мусор. Технологи нашли способ превратить её в функциональный белок с помощью изменения pH.">

        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"109\" cy=\"75\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"551\" cy=\"264\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PRESERVATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как превратить отходы&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;морепродуктов в ценный&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;пищевой белок&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Ежегодно тонны мантии гребешка выбрасываются как побочный продукт переработки. Исследование показало, что &lt;a href=\"concepts/alkaline-extraction.html\"&gt;щелочная экстракция&lt;/a&gt; при pH 8–12 позволяет эффективно извлекать из этого сырья качественный белок. Оптимальные функциональные свойства, такие как эмульгирующая способность, достигаются при pH 10.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Выход белка достигает 96,29% при pH 12, но оптимальная чистота и функциональность наблюдаются при pH 10.&lt;/li&gt;\n&lt;li&gt;Щелочная экстракция меняет структуру белка, превращая альфа-спирали в бета-листы и повышая гидрофобность.&lt;/li&gt;\n&lt;li&gt;При pH 10 достигается наилучшая стабильность эмульсий, а при pH 11 — максимальная &lt;a href=\"concepts/thermal-stability.html\"&gt;термостабильность&lt;/a&gt; продукта.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Процесс щелочной экстракции и последующего кислотного осаждения позволяет перевести белки мантии гребешка в растворимое состояние. При повышении pH с 8 до 12 выход белка увеличивается с 5,01% до 96,29%, достигая максимальной чистоты 96,01% при pH 10. В ходе обработки происходит деградация белков до пептидов и изменение вторичной структуры: альфа-спирали переходят в бета-листы, что меняет гидрофобность поверхности и размер частиц.&lt;/p&gt;\n&lt;p&gt;Результаты показывают, что выбор pH критически важен для конечных свойств продукта. При pH 10 белок демонстрирует лучшие показатели стабильности эмульсии и пенообразования, а при pH 11 — повышенную термостабильность. В то же время, при pH 12 наблюдается потемнение цвета, что может быть нежелательно для пищевого применения. Эти данные позволяют настраивать технологический процесс под конкретные задачи, превращая отходы в ценный ингредиент.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в лабораторных условиях на одной партии сырья, поэтому масштабируемость процесса требует дополнительных испытаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Утилизация&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;отходов мантии&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гребешка&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Щелочная&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;экстракция при&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;pH 8-12&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокий выход&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;функциональный&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белок&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Создание&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ценных пищевых&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;добавок&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Foods (Basel, Switzerland). Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Foods (Basel, Switzerland) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;preservatives&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Xie Y, Zheng Y, Cao W, Tan M.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13606834\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/articles/PMC13606834?pdf=render\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.3390/foods15183352\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Метаданные Crossref&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://api.crossref.org/works/10.3390/foods15183352\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;api.crossref.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Europe PMC&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/search?query=DOI%3A%2210.3390/foods15183352%22\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podelitsya\"&gt;&lt;a href=
