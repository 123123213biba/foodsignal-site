            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"231\" cy=\"115\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"669\" cy=\"170\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · VOLATILES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Холодный вакуум или печь:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;что происходит со вкусом и&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;белком креветки при сушке&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;При изготовлении креветочного флосса (хрустящей волокнистой закуски) способ сушки радикально меняет вкусовой букет и пищевую ценность. Исследователи сопоставили вакуумную сублимацию (VFD) и конвекционную горячую сушку (&lt;a href=\"concepts/hot-air-drying.html\"&gt;HAD&lt;/a&gt;) вареного и маринованного мяса гигантской пресноводной креветки &lt;a href=\"concepts/giant-freshwater-prawn.html\"&gt;Macrobrachium rosenbergii&lt;/a&gt;. &lt;a href=\"concepts/vfd.html\"&gt;Сублимация&lt;/a&gt; надежнее сберегает термолабильные полиненасыщенные жирные кислоты и свободные аминокислоты, ответственные за умами. Горячий воздух ускоряет реакции Майяра, формируя насыщенный жареный профиль, но маринад заглушает природную сладость мяса.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Сублимация при 0,035 мбар сберегает термолабильные омега-жиры и исходный умами-профиль креветки&lt;/li&gt;\n&lt;li&gt;Сушка при 70 °C формирует жареный аромат за счет реакции Майяра, но снижает долю ценных аминокислот&lt;/li&gt;\n&lt;li&gt;Маринование маскирует естественную сладость креветочного мяса за счет кисло-соленых компонентов&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Технологический маршрут переработки гигантской пресноводной креветки (Macrobrachium rosenbergii) включал варку тушек массой около 35,5 г в течение 3–5 минут, маринование со специями и сахаром и сушку до состояния рассыпчатого флосса. Для сравнения использовали вакуумную сублимационную сушку (VFD при давлении 0,035 мбар, температуре конденсатора −84 °C в течение 21 ч) и сушку горячим воздухом (HAD при 70 °C в течение 21 ч). Концентрация белка, липидов и аминокислот закономерно возросла во всех группах за счет удаления свободной влаги, однако термодеструкция в печах оказалась глубже. Анализ жирнокислотного состава методом ГЖХ на капиллярной колонке HP-88 (100 м) показал, что VFD вареного сырья обеспечивает максимальное удержание полиненасыщенных жирных кислот (ПНЖК) и нативных метиловых эфиров жирных кислот (FAME), чувствительных к окислению при длительном нагреве.&lt;/p&gt;\n&lt;p&gt;Анализ аминокислотного профиля выявил важную трансформацию: цистин был обнаружен исключительно в термообработанных немаринованных группах. Это указывает на индуцированную нагревом окислительную димеризацию цистеина (образование дисульфидных связей между тиольными группами), тогда как в маринованных образцах реакция блокировалась сильной восстановительной средой, созданной сахарами в реакциях Майяра. Сенсорные профили электронного носа (&lt;a href=\"concepts/electronic-nose.html\"&gt;PEN3&lt;/a&gt;) и языка подтвердили фундаментальную разницу матриц: сублимация обеспечила сбалансированный пик насыщенности и глутаматного умами, тогда как обдув воздухом при 70 °C сгенерировал азотистые летучие соединения (включая N,N-диметилметанамин) и ноты поджаривания, при этом маринад резко усилил солено-кислый тон, замаскировав эндогенную сладость глицина.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперимент проведен на девяти группах одной партии пресноводных креветок без привлечения живой дегустационной панели, ограничившись инструментальными датчиками (e-nose, e-tongue).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Гигантская пресноводная креветка (Macrobrachium rosenbergii) является одним из наиболее коммерчески ценных водных продуктов в мире, высоко ценимым за высокое содержание белка, обилие незаменимых аминокислот и уникальный вкусовой профиль. Однако из-за высокого содержания влаги и богатого питательными веществами состава мясо этой креветки крайне подвержено быстрой порче, вызванной ростом микробов и ферментативной активностью. Для увеличения срока хранения и облегчения дистрибуции применяются различные методы обработки, среди которых сушка остается традиционным и эффективным методом консервации. &lt;a href=\"concepts/shrimp-meat-floss.html\"&gt;Мясные волокна&lt;/a&gt; (meat floss) — популярный сушеный мясной продукт, характеризующийся рыхлой, волокнистой текстурой и пикантным вкусом, — включают несколько этапов производства: варку, измельчение, приправку и сушку. Качество конечного продукта, особенно его пищевая ценность и ароматические характеристики, глубоко зависит от конкретного метода сушки, используемого при производстве. Различные технологии сушки, такие как сушка горячим воздухом (HAD), вакуумная сублимационная сушка (VFD), микроволновая сушка и солнечная сушка, оказывают различное влияние на физико-химические свойства пищевой матрицы. Хотя сушка горячим воздухом экономична и широко используется, она часто предполагает высокие температуры, которые могут привести к значительной деградации питательных веществ, окислению липидов и образованию нежелательных привкусов. Исследования показывают, что термическая обработка изменяет структуру белков, снижает биодоступность незаменимых аминокислот и способствует реакции Майяра; хотя это придает желаемые жареные ноты, неконтролируемые условия могут также привести к образованию вредных соединений. Напротив, вакуумная сублимационная сушка проводится в условиях низких температур и вакуума, эффективно сохраняя исходную морфологию материала, питательные компоненты и летучие ароматические соединения. Отчеты показывают, что по сравнению с традиционной термической сушкой этот метод позволяет сохранить более качественные белки и углеводы в продуктах из креветок. Ароматический профиль креветок является критическим фактором потребительского признания и состоит из сложной смеси летучих органических соединений (VOCs), образующихся в процессе обработки. Ключевые ароматообразующие соединения в креветках включают альдегиды, кетоны, спирты и серосодержащие вещества, которые возникают в результате окисления липидов, деградации аминокислот и реакции Майяра. Тип метода сушки существенно влияет на состав и концентрацию этих летучих соединений. Вакуумная сублимационная сушка лучше сохраняет исходные компоненты сушеной креветки, тогда как сушка горячим воздухом способствует образованию новых вкусовых соединений. Более того, VFD наиболее эффективна для сохранения термочувствительных компонентов, таких как астаксантин, хотя и при более высокой стоимости; напротив, хотя HAD может вызвать некоторую изомеризацию и деградацию астаксантина, она поддерживает высокую биологическую активность с большей эффективностью при оптимизированных условиях. Последние исследования показывают, что взаимодействие между условиями обработки и технологиями сушки определяет конечные сенсорные атрибуты, при этом некоторые методы усиливают сладость и карамельные ноты, в то время как другие могут усиливать рыбный или прогорклый запах. Несмотря на обширные исследования сушки цельных креветок или порошка из креветок, объект исследования ограничен Litopenaeus vannamei. Litopenaeus vannamei и Macrobrachium rosenbergii имеют значительные различия в качестве мяса. Содержание сырого жира, содержание ненасыщенных жирных кислот и индекс незаменимых аминокислот у Macrobrachium rosenbergii были значительно выше, чем у Litopenaeus vannamei. По-прежнему не хватает комплексных исследований динамических изменений питательных веществ и ароматических соединений на различных этапах обработки волокон гигантской пресноводной креветки при различных условиях сушки. Понимание того, как конкретные методы сушки влияют на эволюцию параметров качества от сырья до конечного продукта в виде волокон, имеет решающее значение для оптимизации технологий переработки. Данное исследование направлено на изучение влияния двух различных методов сушки на содержание питательных веществ и профили летучих ароматов волокон гигантской пресноводной креветки на различных этапах обработки. Сравнивая сохранение белков, липидов и ключевых вкусовых соединений, данное исследование стремится обеспечить теоретическую основу и практическое руководство для производства высококачественных волокон гигантской пресноводной креветки с превосходными питательными и сенсорными характеристиками.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод сушки (VFD против HAD) критически влияет на сохранение нутриентов и ароматический профиль, при этом VFD лучше сохраняет исходные компоненты, а HAD способствует образованию новых вкусовых соединений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гигантские пресноводные креветки (Macrobrachium rosenbergii) были закуплены у коммерческого поставщика (Along Aquatic Products Store, Хучжоу, Чжэцзян, Китай) 25 августа 2025 года. Экземпляры были первоначально выловлены с помощью невода. Средний вес креветки составлял 35,5 г. В соответствии с различными процессами сушки образцы были разделены на следующие девять категорий: A (сырое мясо креветки), B (сырое мясо креветки VFD), C (сырое мясо креветки HAD), D (вареное мясо креветки без приправ), E (вареное мясо креветки VFD без приправ), F (вареное мясо креветки HAD без приправ), TD (вареное мясо креветки с приправами), TE (вареное мясо креветки VFD с приправами), TF (вареное мясо креветки HAD с приправами). Состав приправы (на 5 кг очищенных креветок с выходом мяса 36,3%): 2500 г сырого вина (cooking wine), 900 г леденцового сахара, 20 г листьев сладкой травы, 20 г бадьяна, 30 г корицы, 50 г сливы, 120 г имбиря, 120 г зеленого лука, 450 г лимона, 2500 г вина для готовки, 4 л чистой воды.&lt;/p&gt;\n&lt;p&gt;Метод VFD: Всего 5 кг креветок (размер выборки определялся в соответствии с требуемым количеством мяса креветок для эксперимента) обрабатывались путем варки в течение 3–5 минут для получения мяса. Все процедуры проводились в соответствии с этическими нормами для минимизации страданий животных. Мясо креветок замачивали в растворе приправ для придания вкуса. Приправленное мясо креветок предварительно охлаждали до 0–4 °C. Предварительно охлажденное мясо креветок подвергали вакуумной сублимационной сушке в течение 21 часа. Образцы сушили сублимацией с использованием вакуумной сублимационной сушилки (LABCONCO, Канзас-Сити, Миссури, США). В процессе лиофилизации вакуумное давление поддерживалось на уровне 0,035 мбар, а температура конденсатора (коллектора) была установлена на −84 °C. Вакуумно-сублимированное мясо креветок измельчали для получения мясных волокон.&lt;/p&gt;\n&lt;p&gt;Метод HAD: Метод получения мяса креветок был таким же, как и для VFD. Мясо креветок замачивали в растворе приправ для придания вкуса. Замоченное мясо креветок сушили при 70 °C в течение 21 часа. Мясные волокна представляли собой обезвоженный, волокнистый, пушистый продукт, полученный из вареного мяса креветок (Macrobrachium rosenbergii) после приправки, сушки (путем вакуумной сублимационной сушки или сушки горячим воздухом) и механического измельчения. Он характеризовался низкой активностью воды, высоким содержанием белка и пикантным вкусом, обычно используемым в качестве приправы или готовой к употреблению закуски. Не было существенной разницы в весе креветок, замоченных в каждом процессе сушки горячим воздухом и вакуумной сублимационной сушки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VFD (вакуумная сублимационная сушка) — это удаление влаги из замороженного продукта в вакууме, что позволяет сохранить структуру и питательные вещества лучше, чем при нагреве. HAD (сушка горячим воздухом) — традиционный метод, более дешевый, но вызывающий термическую деградацию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Были определены содержание белка (GB 5009.5-2016, первый метод), содержание жира (GB 5009.6-2016, первый метод), содержание углеводов (GB 28050-2011), содержание влаги (GB 5009.3-2016, первый метод), содержание золы (GB 5009.4-2016, первый метод), содержание натрия (GB 5009.91-2017, четвертый метод), содержание общих жирных кислот (GB 5009.168-2016, первый метод), сумма аминокислот, определенных с использованием процедур, применяемых в этом исследовании (см. раздел 2.3), для образцов A, B, C, D, E, F, TD, TE и TF. Различия между образцами сравнивались. Каждый образец анализировался 4 раза повторно.&lt;/p&gt;\n&lt;p&gt;Определение триптофана: Образец измельчали до прохождения через сито 40 меш и тщательно перемешивали. Точно взвешенную порцию гомогенизированного образца массой 0,2 г переносили в гидролизную трубку объемом 35 мл. С помощью пипетки объемом 10 мл добавляли 10 мл 4 моль/л раствора гидроксида натрия. Трубку продували азотом высокой чистоты, немедленно плотно закрывали завинчивающейся крышкой и помещали в электрический термостатический сушильный шкаф при 110 °C для гидролиза в течение 24 часов. После гидролиза трубку вынимали и давали остыть до комнатной температуры. Гидролизат количественно переносили в мерную колбу объемом 50 мл. Гидролизную трубку несколько раз промывали буферным раствором ацетата натрия, и к объединенным промывным водам добавляли 7,5 мл 6 моль/л соляной кислоты для нейтрализации. После тщательного перемешивания и охлаждения до комнатной температуры раствор доводили до метки буферным раствором ацетата натрия и хорошо перемешивали. Полученный раствор центрифугировали, а супернатант фильтровали через органическую мембрану перед анализом методом жидкостной хроматографии. Условия жидкостной хроматографии были следующими: колонка Waters Symmetry C18 (4,6 × 250 мм, 4,6 мкм); температура колонки 40 °C; длина волны детектирования 280 нм; объем инъекции 10 мкл; скорость потока 1,2 мл/мин; время работы 16 мин; подвижная фаза A — ацетонитрил (5%); подвижная фаза B — буфер уксусная кислота–ацетат натрия (95%): 2,5 г ацетата натрия, 1,5 мл триэтиламина и 1,17 мл ледяной уксусной кислоты, растворенных в 1 л очищенной воды.&lt;/p&gt;\n&lt;p&gt;Другие аминокислоты (за исключением триптофана): Точно взвешенное количество образца переносили в гидролизную трубку так, чтобы содержание белка в образце находилось в диапазоне 10–20 мг (примерно 100 мг для образца D и примерно 25 мг для образцов E и F). Затем добавляли 15 мл 6 моль/л раствора соляной кислоты (содержащего 0,1% фенола). Гидролизную трубку помещали в охлаждающую смесь и замораживали на 3–5 минут, затем вакуумировали и продували азотом. Трубку окончательно запаивали или плотно закрывали в атмосфере азота. Запаянную гидролизную трубку помещали в печь при 110 °C для гидролиза в течение 22 часов. После гидролиза трубку вынимали и давали остыть до комнатной температуры. Гидролизную трубку открывали, и гидролизат фильтровали в мерную колбу объемом 50 мл. Гидролизную трубку несколько раз промывали небольшими порциями воды, и промывные воды объединяли в той же мерной колбе объемом 50 мл. Раствор окончательно доводили до метки водой, тщательно перемешивали и встряхивали. Аликвоту фильтрата объемом 1,0 мл точно переносили в пробирку объемом 15 мл и выпаривали досуха под током азота с использованием концентратора пробирок при 50 °C. Высушенный остаток снова растворяли в воде и снова выпаривали досуха. Полученный остаток восстанавливали соответствующим объемом буферного раствора цитрата натрия с pH 2,2, хорошо перемешивали и фильтровали через мембрану. Затем фильтрат анализировали с использованием аминокислотного анализатора Scion Artemis 6000C (Scion Instruments, Ливингстон, Шотландия, Великобритания).&lt;/p&gt;\n&lt;p&gt;Состав жирных кислот определяли по методу, описанному в GB 5009.168-2016, с небольшими модификациями. Соответствующее количество гомогенизированного образца креветки (примерно 0,5–1,0 г, точно взвешенного до 0,001 г) переносили в гидролизную трубку с завинчивающейся крышкой и добавляли известный объем раствора внутреннего стандарта (триглицерид C11:0). Для образцов с видимым содержанием жира проводили прямое омыление и метилирование. Для образцов, требующих полного извлечения липидов, применяли следующую процедуру экстракции: образец гидролизовали при соответствующих условиях, после чего добавляли этанол при тщательном перемешивании. Затем последовательно добавляли уксусную кислоту и петролейный эфир, и смесь подвергали жидкостно-жидкостной экстракции три раза подряд. Верхние органические слои от каждой экстракции объединяли и выпаривали досуха.&lt;/p&gt;\n&lt;p&gt;Полученный липидный остаток подвергали щелочному омылению и метилированию для превращения жирных кислот в соответствующие метиловые эфиры жирных кислот (FAMEs). Полученные FAMEs собирали и повторно растворяли в н-гексане для последующего ГХ-анализа. Метиловые эфиры жирных кислот анализировали с использованием газового хроматографа Agilent 7820A (Agilent Technologies, Санта-Клара, Калифорния, США), оснащенного пламенно-ионизационным детектором (FID). Хроматографическое разделение проводили на капиллярной колонке Agilent HP-88 (100 м × 0,25 мм внутр. диам., толщина пленки 0,20 мкм). Температуру инжектора и детектора устанавливали на 270 °C и 280 °C соответственно. Гелий (чистота ≥ 99,999%) использовали в качестве газа-носителя при постоянной скорости потока 1,0 мл/мин. Образцы вводили в режиме деления потока с коэффициентом деления 30:1. Программа температуры термостата колонки была следующей: начальная температура 100 °C выдерживалась в течение 13 минут; повышение до 180 °C со скоростью 10 °C/мин и выдержка 6 минут; повышение до 200 °C со скоростью 1 °C/мин и выдержка 12 минут; повышение до 230 °C со скоростью 10 °C/мин и выдержка 8 минут. Пики жирных кислот идентифицировали путем сравнения времен удерживания с таковыми для аутентичных стандартов FAME (смесь FAME из 37 компонентов Supelco, Sigma-Aldrich, Сент-Луис, Миссури, США). Количественное определение проводили с использованием метода калибровки по внутреннему стандарту (триглицерид C11:0). Результаты выражали в граммах каждой жирной кислоты на 100 г сухого вещества (г/100 г сухого веса). Все образцы анализировались в четырехкратной повторности (n = 4), результаты представлены как среднее значение ± стандартное отклонение (SD).&lt;/p&gt;\n&lt;p&gt;Образец измельчали до состояния кашицы, брали 2 г образца и помещали в центрифужную пробирку объемом 50 мл. Каждый образец брали в трех повторностях, запечатывали уплотнительной мембраной и выдерживали 30 минут. После обогащения проводили тест. Инъекционную иглу вводили непосредственно в герметичную центрифужную пробирку, содержащую образец, с использованием метода прямого всасывания из паровой фазы, а определение проводили с использованием немецкого электронного носа PEN3 (AIRSENSE Analytics GmbH, Шверин, Германия). Условия определения: газом-носителем для электронного носа был очищенный воздух, анализ проводился при комнатной температуре. Время отбора проб составляло 1 с/группа; время самоочистки датчика — 60 с. Время ввода образца составляло 5 с; скорость потока при вводе — 400 мл мин−1. Время отбора проб для анализа составляло 80 с. Данные с 69–71 с были взяты в качестве результатов для обобщения и анализа. Десять датчиков и соответствующие чувствительные вещества показаны в Таблице 1. Каждый образец анализировался 9 раз повторно.&lt;/p&gt;\n&lt;p&gt;Таблица 1. Чувствительные вещества датчиков немецкого электронного носа PEN3.&lt;br /&gt;\n/ № датчика / Код датчика / Чувствительные вещества /&lt;br /&gt;\n/ :--- / :--- / :--- /&lt;br /&gt;\n/ 1 / W1C / Ароматические соединения /&lt;br /&gt;\n/ 2 / W5S / Оксиды азота /&lt;br /&gt;\n/ 3 / W3C / Аммиак, ароматические молекулы /&lt;br /&gt;\n/ 4 / W6S / Гидриды /&lt;br /&gt;\n/ 5 / W5C / Алкены, ароматические соединения, полярные молекулы /&lt;br /&gt;\n/ 6 / W1S / Алканы /&lt;br /&gt;\n/ 7 / W1W / Серосодержащие соединения /&lt;br /&gt;\n/ 8 / W2S / Спирты, некоторые ароматические соединения /&lt;br /&gt;\n/ 9 / W2W / Ароматические соединения, органические серосодержащие соединения /&lt;br /&gt;\n/ 10 / W3S / Алканы и алифатические соединения /&lt;/p&gt;\n&lt;p&gt;Использовались шесть датчиков (C00, AE1, CA0, CT0, AAE, GL1) и три стандартных электрода. Датчики тестировались после активации и калибровки. Информация о соответствии между датчиком и вкусовым значением показана в Таблице 2.&lt;/p&gt;\n&lt;p&gt;Таблица 2. Информация о соответствии между датчиком и вкусовым значением.&lt;br /&gt;\n/ Датчик / Соответствующий вкус / Вкусовая информация /&lt;br /&gt;\n/ :--- / :--- / :--- /&lt;br /&gt;\n/ C00 / Кислотность-горечь / Горечь, послевкусие-B /&lt;br /&gt;\n/ AE1 / Терпкость / Терпкость, послевкусие-A /&lt;br /&gt;\n/ CA0 / Кислотность / Кислотность /&lt;br /&gt;\n/ CT0 / Соленость / Соленость /&lt;br /&gt;\n/ AAE / Умами / Умами, насыщенность /&lt;br /&gt;\n/ GL1 / Сладость / Сладость /&lt;/p&gt;\n&lt;p&gt;Образец 1: 20 измельчали с чистой водой, центрифугировали и фильтровали, а затем идентифицировали с помощью электронного языка SA402B. Баланс: Датчик промывали в чистящем растворе в течение 90 с, в эталонном растворе в течение 120 с, а затем в другом эталонном растворе в течение 120 с. Датчик обнуляли в положении равновесия в течение 30 с. Тест: Время теста составляло 30 с, фиксировалось первое значение вкуса; после очистки эталонным раствором в течение 3 с датчик вставляли в новый эталонный раствор для проверки послевкусия в течение 30 с. Пять датчиков вкуса пищи C00, AE1, CA0, CT0, AAE и датчики горечи ANO и BTO тестировались 4 раза. Среднее значение последних трех раз принималось за результат теста после удаления первого цикла. Датчик сладости GL1 тестировался 5 раз, и среднее значение средних 3 тестов принималось за результат теста после удаления первого и последнего циклов. Каждый образец анализировался 3 раза повторно.&lt;/p&gt;\n&lt;p&gt;Подготовка образца: Каждый образец (1–2 г, точно взвешенный до 0,001 г) переносили во флакон для паровой фазы объемом 20 мл, совместимый с автосамплером твердофазной микроэкстракции (SPME). Впоследствии добавляли 100 мкл 0,1% (об./об.) рабочего раствора внутреннего стандарта циклогексанона, и смесь тщательно перемешивали на вортексе в течение 30 с для обеспечения гомогенизации. Затем флаконы помещали в нагревательный модуль системы &lt;a href=\"concepts/gas-chromatography-mass-spectrometry.html\"&gt;ГХ-МС&lt;/a&gt; и уравновешивали при 70 °C в течение 10 минут при легком перемешивании. После уравновешивания волокно SPME (80 мкм DVB/углерод/PDMS, Agilent China Ltd., Пекин, Китай) подвергали воздействию паровой фазы в течение 40 минут для обеспечения адсорбции летучих соединений. Наконец, волокно втягивали и немедленно вводили в инжектор ГХ для термической десорбции при 250 °C в течение 5 минут.&lt;/p&gt;\n&lt;p&gt;Инструментальные условия: Хроматографическое разделение проводили с использованием газового хроматографа Agilent 8890, соединенного с тройным квадрупольным масс-спектрометром Agilent 7000E (Agilent Technologies, Санта-Клара, Калифорния, США). Температуру инжектора поддерживали на уровне 250 °C, все инъекции выполнялись в режиме без деления потока. Гелий (чистота ≥ 99,999%) использовали в качестве газа-носителя при постоянной скорости потока 1,0 мл/мин. Аналиты разделяли на капиллярной колонке HP-5MS UI (30 м × 0,25 мм внутр. диам., толщина пленки 0,25 мкм; Agilent). Время задержки растворителя было установлено на 1,0 мин.&lt;/p&gt;\n&lt;p&gt;Программа температуры термостата колонки была следующей: начальная температура 40 °C выдерживалась 4 минуты, повышение до 90 °C со скоростью 3 °C/мин и выдержка 3 минуты, затем повышение до 100 °C со скоростью 1 °C/мин и выдержка 1 минута, с последующим повышением до 120 °C со скоростью 3 °C/мин с выдержкой 1 минута, и, наконец, повышение до 250 °C со скоростью 6 °C/мин и выдержка 3 минуты. Масс-спектрометр работал в режиме электронной ионизации (EI) при энергии электронов 70 эВ. Температуры источника ионов, квадруполя и линии передачи были установлены на 200 °C, 150 °C и 250 °C соответственно. Масс-спектры полного сканирования были получены в диапазоне отношения массы к заряду (m/z) 35–500. Все образцы анализировались в трех повторностях (n = 3) для обеспечения воспроизводимости данных. Для оценки потенциальных матричных эффектов, возникающих из-за внутреннего стандарта, холостые образцы (приготовленные без добавления циклогексанона) анализировались параллельно с образцами с добавками (содержащими 100 мкл 0,1% циклогексанона) при идентичных инструментальных условиях, чтобы определить, не элюировались ли какие-либо целевые соединения совместно с внутренним стандартом или не превращались ли они из него. Эта валидация проводилась для всех групп образцов (сырые, вареные и приправленные) для обеспечения надежности идентификации летучих соединений.&lt;/p&gt;\n&lt;p&gt;Все эксперименты проводились как минимум с тремя независимыми биологическими повторностями на группу обработки (n ≥ 3), при этом каждая повторность была получена из отдельно обработанных образцов креветок для обеспечения учета реальной биологической вариабельности. Аналитические определения проксимального состава, аминокислот и жирных кислот проводились в четырехкратной повторности (n = 4) на биологическую повторность, в то время как анализы электронного языка и ГХ-МС проводились в трехкратной повторности (n = 3), а анализ электронного носа — в девятикратной повторности (n = 9). Результаты выражены как среднее значение ± стандартное отклонение (SD). Статистический анализ проводился с использованием SPSS Statistics (версия 19.0, IBM Corp., Армонк, Нью-Йорк, США). Перед параметрическим тестированием нормальность распределения данных оценивалась с помощью теста Шапиро–Уилка (p &amp;gt; 0,05 указывает на нормальность), а гомогенность дисперсий проверялась с помощью теста Левена (p &amp;gt; 0,05 указывает на равные дисперсии). Для наборов данных, удовлетворяющих обоим предположениям, использовался однофакторный дисперсионный анализ (ANOVA) с последующим апостериорным тестом Тьюки (HSD) для попарных множественных сравнений. Для наборов данных, нарушающих предположение о нормальности или гомогенности дисперсий, применялся непараметрический тест Краскела–Уоллиса с последующим апостериорным тестом Данна с поправкой Бонферрони для множественных сравнений, чтобы контролировать частоту ошибок в семействе. Порог значимости α = 0,05 был установлен для всех статистических тестов, и различия считались статистически значимыми при p &amp;lt; 0,05. Разные надстрочные буквы в таблицах и на рисунках обозначают значимые различия между группами. Для многомерных наборов данных, полученных в результате анализа электронного носа и электронного языка, выполнялся анализ главных компонент (PCA) с использованием OriginPro 2026b (OriginLab Corporation, Нортгемптон, Массачусетс, США) для визуализации кластеризации образцов и идентификации ключевых дискриминирующих переменных (для электронного носа и электронного языка; и программного обеспечения Taste Analysis Application V1.1/V1.2 системы сенсорного анализа вкуса SA402B, Insent Inc., Ацуги, Япония, для электронного языка). Сообщались кумулятивные показатели вклада дисперсии первых двух главных компонент (PC1 и PC2) для оценки адекватности снижения размерности. Все модели PCA были валидированы с использованием полной перекрестной проверки (leave-one-out) для оценки надежности модели. Перед PCA данные подвергались автомасштабированию (центрирование по среднему и деление на стандартное отклонение) для устранения масштабных эффектов между переменными. Графическая визуализация, включая радарные диаграммы, биплоты, круговые тепловые карты и хордовые диаграммы, была создана с использованием OriginPro 2026b (OriginLab Corporation, Нортгемптон, Массачусетс, США). Воспроизводимость всех инструментальных анализов проверялась путем расчета относительного стандартного отклонения (RSD) для повторных запусков, при этом критерии приемлемости были установлены на уровне RSD &amp;lt; 15% для данных ГХ-МС и электронного языка и RSD &amp;lt; 10% для ответов датчиков электронного носа. Выбросы идентифицировались с помощью теста Граббса (α = 0,05) и исключались только тогда, когда аналитические или инструментальные ошибки были однозначно подтверждены; в противном случае все валидные точки данных сохранялись в окончательном анализе.&lt;/p&gt;\n&lt;p&gt;Все питательные параметры — включая белок, жир, углеводы, золу, натрий, общие жирные кислоты и общие аминокислоты — представлены на основе сухого вещества (г/100 г сухого веса). Содержание влаги представлено отдельно в процентах на влажной основе, чтобы отразить эффективность удаления воды в процессе обработки.&lt;/p&gt;\n&lt;p&gt;Значения белка варьировались от 71,18 ± 0,12 г/100 г (TE) до 89,27 ± 0,10 г/100 г (C). Среди сырых образцов C (сырой, сушеный в печи, 89,27) был значительно выше, чем A (свежий сырой, 86,32) и B (сырой, сублимированный, 83,75) (p &amp;lt; 0,05), что указывает на то, что сушка в печи может вызвать относительную концентрацию белковых компонентов даже на сухой основе. Для вареных не приправленных групп D (85,29), E (85,91) и F (85,61) были статистически схожими (p &amp;gt; 0,05), а также сопоставимыми с A, что предполагает, что одна только варка не изменяет существенно содержание белка на основе сухого вещества. Примечательно, что все приправленные образцы (TD 75,08, TE 71,18, TF 74,76) были значительно ниже, чем их не приправленные аналоги (D/E/F) (p &amp;lt; 0,05), при этом TE показал минимальное значение.&lt;/p&gt;\n&lt;p&gt;Содержание жира увеличилось с 3,20 ± 0,31 (A) до 11,18 ± 0,42 г/100 г (TD). Сырые B (4,26) и C (4,65) существенно не различались (p &amp;gt; 0,05), но оба превышали A. Вареные не приправленные образцы D–F (8,54–8,98) образовали гомогенный кластер (p &amp;gt; 0,05) и были значительно выше, чем сырые группы, что подразумевает, что варка способствует концентрации или удержанию липидов даже после нормализации по сухому весу, возможно, из-за денатурации белка и структурных изменений, которые уменьшают потерю жира во время обработки. Приправленный TD показал самое высокое содержание жира (11,18), тогда как TE (6,70) и TF (7,00) были значительно ниже, чем TD, но выше, чем сырые образцы, отражая дифференциальное поглощение приправ и способности связывания жира среди методов сушки. Общие жирные кислоты следовали почти идентичной тенденции, со значениями от 2,97 (A) до 8,44 (TD). Все группы существенно различались, за исключением E против F (p &amp;gt; 0,05). Сильная корреляция между жиром и общими жирными кислотами указывает на то, что большинство липидов присутствуют в виде жирных кислот, а влияние обработки на жир является преимущественно физическим, а не композиционным.&lt;/p&gt;\n&lt;p&gt;Содержание углеводов демонстрировало чрезвычайно высокую вариабельность, варьируясь от 0,08 ± 0,01 г/100 г (C) до 14,72 ± 0,57 г/100 г (TE). При отсутствии приправ сублимированная сырая креветка (B, 6,13 ± 0,86 г/100 г) показала значительно более высокое содержание углеводов, чем свежая сырая креветка (A, 4,10 ± 0,44 г/100 г) (p &amp;lt; 0,05). Аналогично, сублимированная вареная креветка (E, 0,65 ± 0,06 г/100 г) показала значительно более высокое значение, чем ее не сушеный аналог (D, 1,66 ± 0,17 г/100 г) (p &amp;lt; 0,05). Это явление можно объяснить тем, что во время сублимационной сушки низкотемпературная сублимация быстро удаляет влагу, создавая пористую структуру внутри матрицы креветки и приводя к усадке скелета сухого вещества, тем самым увеличивая относительную долю углеводов на основе сухого веса. Между тем, сублимационная сушка вызывает минимальные потери углеводов при деградации, что приводит к эффекту кажущегося накопления на основе сухого вещества. Однако влияние сушки в печи отличалось заметно. Сушеная в печи сырая креветка (C, 0,08 ± 0,01 г/100 г) и сушеная в печи вареная креветка (F, 0,75 ± 0,05 г/100 г) существенно не различались друг от друга (p &amp;gt; 0,05), и обе оставались на чрезвычайно низких уровнях. Это в первую очередь объясняется повышенными температурами, используемыми при сушке в печи (обычно 50–70 °C или выше), которые ускоряют деградацию и потребление углеводов. С одной стороны, высокие температуры способствуют реакции Майяра между восстанавливающими сахарами и свободными аминокислотами в мясе креветок, потребляя значительное количество сахаров. С другой стороны, длительный нагрев может вызвать карамелизацию или термическое разложение некоторых олигосахаридов, дополнительно снижая содержание углеводов. Кроме того, медленный процесс обезвоживания во время сушки в печи может привести к миграции сахаров к поверхности вместе с влагой, где они подвергаются потерям при термической деградации, что приводит к гораздо более низким уровням углеводов на основе сухого веса по сравнению с сублимированными образцами. После добавления приправ содержание углеводов резко возрастало независимо от метода сушки: TD (приправленная вареная, не сушеная) достигло 6,25 ± 0,10 г/100 г, TF (приправленная вареная, сушеная в печи) достигло 10,60 ± 0,11 г/100 г, а TE (приправленная вареная, сублимированная) достигло 14,72 ± 0,57 г/100 г, что значительно выше, чем у их соответствующих не приправленных аналогов (D/E/F) (p &amp;lt; 0,05). Это существенное увеличение однозначно объясняется экзогенным добавлением углеводсодержащих ингредиентов в рецептуру приправы (например, сахарозы, мальтодекстрина и крахмала). Среди них приправленная сублимированная группа (TE) продемонстрировала самое высокое содержание углеводов, что стало результатом как добавления экзогенного сахара, так и эффекта концентрации сухого вещества при сублимационной сушке. Все три приправленные группы были значительно выше, чем их не приправленные аналоги, что указывает на то, что приправа является доминирующим фактором, определяющим содержание углеводов в продуктах из креветок, значительно перевешивая влияние самих методов обработки.&lt;/p&gt;\n&lt;p&gt;Содержание золы варьировалось от 4,51 ± 0,09 (D) до 7,64 ± 0,10 г/100 г (TF). Сырые образцы A (6,38), B (5,86) и C (6,00) все существенно различались (p &amp;lt; 0,05), что предполагает, что методы сушки по-разному влияют на удержание или концентрацию минералов. Вареные не приправленные D–F показали самые низкие значения золы (4,51–4,66) и были статистически гомогенными (p &amp;gt; 0,05), что подразумевает, что варка может вымывать некоторые минералы. Приправленные образцы TD, TE и TF продемонстрировали самое высокое содержание золы (7,50–7,64), при этом TF значительно превышал TD и TE (p &amp;lt; 0,05), подтверждая, что сублимационная сушка лучше сохраняет исходную пропорцию золы в образце. Содержание натрия, хотя и чрезвычайно низкое во всех не приправленных группах (0,30–0,40 мг/100 г, p &amp;gt; 0,05), резко возросло в приправленных продуктах: TD 1,63, TE 1,99 и TF 1,84 мг/100 г (все существенно различались друг от друга и от не приправленных групп, p &amp;lt; 0,05). Это однозначно идентифицирует добавленную соль как основной источник натрия, а вариации среди приправленных групп отражают различную эффективность включения соли во время обработки.&lt;/p&gt;\n&lt;p&gt;Общее содержание аминокислот варьировалось от 62,32 ± 2,47 (A) до 91,10 ± 1,84 г/100 г (E). Сырой B (85,88), C (82,67) и вареный D (83,73) были статистически схожими (p &amp;gt; 0,05), в то время как E (91,10) и F (90,31) были значительно выше, чем все остальные группы. Это предполагает, что комбинированная варка и сушка — особенно сублимационная сушка после варки — могут улучшить экстрагируемость или измерение аминокислот без фактического чистого синтеза. Приправленные образцы TD, TE и TF (70,97–71,23) не имели существенных различий друг с другом (p &amp;gt; 0,05), но были заметно ниже, чем их не приправленные аналоги, снова демонстрируя эффект разбавления от матриц приправ, а не деградацию белка/аминокислот.&lt;/p&gt;\n&lt;p&gt;Содержание влаги (г/100 г влажного образца) варьировалось от 5,36 ± 0,09 (E) до 76,56 ± 0,30 (A), и все группы существенно различались друг от друга (p &amp;lt; 0,05). Свежая сырая A имела самую высокую влажность, в то время как все сушеные продукты (B, C, E, F, TE, TF) показали существенно более низкие значения (5,36–21,93). Примечательно, что D и TD сохранили высокую влажность, сопоставимую со свежими образцами. Эти данные подтверждают, что процессы сушки (сублимационная сушка и сушка в печи) являются высокоэффективными при удалении влаги, и что приправа не мешает эффективности сушки. Важно отметить, что, поскольку все питательные компоненты выражены на основе сухого вещества, различия во влажности не искажают сравнения между группами.&lt;/p&gt;\n&lt;p&gt;Варка сама по себе (D против A) увеличила содержание жира и жирных кислот, но уменьшила содержание золы на сухой основе. Содержание белка оставалось стабильным, а общее содержание аминокислот увеличилось. Сушка сама по себе (B/C против A) дала переменные эффекты: сублимационная сушка оказала лучший эффект удержания аминокислот и углеводов, в то время как сушка значительно увеличила содержание белка, золы и общих жирных кислот. Приправа была доминирующим фактором, заметно повышая содержание натрия, золы и углеводов, при этом разбавляя белок, аминокислоты и (в некоторых случаях) общие жирные кислоты. Для получения дополнительных сведений см. Таблицу 3.&lt;/p&gt;\n&lt;p&gt;Профили аминокислот образцов креветок, подвергнутых различным условиям обработки, представлены в Таблице 4. Было идентифицировано в общей сложности 18 аминокислот. Все содержания аминокислот выражены на основе сухого вещества (г/100 г сухого веса). Значительные различия наблюдались между группами обработки для большинства аминокислот (p &amp;lt; 0,05), что отражает существенное влияние методов обработки на аминокислотный профиль мяса креветок.&lt;/p&gt;\n&lt;p&gt;По сравнению со свежей сырой креветкой (A), как сублимационная сушка (B), так и сушка в печи (C) значительно увеличили содержание большинства аминокислот (p &amp;lt; 0,05). Лизин и аргинин продемонстрировали наиболее выраженное увеличение. Содержание лизина увеличилось с 4,69 ± 0,24 г/100 г в A до 7,67 ± 0,23 г/100 г в B и 7,12 ± 0,06 г/100 г в C (p &amp;lt; 0,05). Содержание аргинина увеличилось с 3,62 ± 0,10 г/100 г в A до 8,43 ± 0,78 г/100 г в B и 8,21 ± 0,05 г/100 г в C (p &amp;lt; 0,05). Сходные тенденции к увеличению наблюдались для Asp, Glu и Leu, при этом значения в сушеных образцах были значительно выше, чем в свежих образцах (p &amp;lt; 0,05) или демонстрировали тенденции к увеличению. Эти результаты предполагают, что даже на основе сухого вещества как VFD, так и HAD эффективно увеличивают содержание большинства аминокислот в креветках.&lt;/p&gt;\n&lt;p&gt;В вареной креветке влияние различных методов сушки на содержание аминокислот следовало тенденциям, сходным с теми, что наблюдались в сырой креветке. По сравнению с вареной креветкой (D), сублимированная вареная креветка (E) и сушеная в печи вареная креветка (F) в целом демонстрировали увеличенное содержание большинства аминокислот. Лизин увеличился с 8,27 ± 0,27 г/100 г в D до 9,02 ± 0,16 г/100 г в E и 9,02 ± 0,36 г/100 г в F (p &amp;lt; 0,05). Содержание триптофана в E (9,41 ± 0,14 г/100 г) было значительно ниже, чем в D (9,52 ± 0,06 г/100 г) и F (10,66 ± 0,07 г/100 г).&lt;/p&gt;\n&lt;p&gt;Сравнение между вареной креветкой (D, E, F) и приправленной вареной креветкой (TD, TE, TF) показало, что приправа оказывала значительное и дифференциальное влияние на аминокислотный профиль. Негативные эффекты (значительные снижения): приправа в целом вызывала значительные снижения содержания аминокислот. Leu, Tyr и Phe не показали существенных различий между любыми вареными группами (D, E, F) и их приправленными аналогами (TD, TE, TF) (p &amp;gt; 0,05). Цистин продемонстрировал уникальный паттерн распределения. Он не был идентифицирован (0,00 г/100 г) в сырых группах (A, B, C) или в любых приправленных группах (TD, TE, TF), но был последовательно идентифицирован в вареных не приправленных группах D (0,34 ± 0,12), E (0,35 ± 0,03) и F (0,44 ± 0,11) (p &amp;lt; 0,05).&lt;/p&gt;\n&lt;p&gt;На основе комплексных данных по аминокислотам можно резюмировать следующие основные тенденции и ключевые выводы. Эффект сушки: как VFD, так и HAD значительно увеличили содержание большинства аминокислот на единицу сухого вещества как в сырой, так и в вареной креветке (за исключением Trp). Эффект обогащения VFD аминокислотами был лучше, чем у HAD. Эффект варки: варка значительно увеличила содержание большинства аминокислот, но значительно снизила Tyr и Trp (p &amp;lt; 0,05). Эффект приправы: большинство аминокислот было значительно снижено в группе приправ. Характеристики удержания аминокислот: цистин был идентифицирован только в не приправленной вареной группе, но не во всех свежих и приправленных группах, что предполагает, что восстанавливающие сахара или соли в приправах могут мешать стабильности или обнаружению цистина. Триптофан хорошо сохранялся в сырых и приправленных сублимированных образцах, но значительно терялся в не приправленных вареных образцах, что указывает на то, что выбор метода обработки и рецептуры приправы был решающим для удержания триптофана. Аминокислотный спектр показан на Рисунке 1.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Профили жирных кислот образцов креветок, подвергнутых различным условиям обработки, представлены в Таблице 5. Было идентифицировано в общей сложности 14 основных жирных кислот, включая 5 насыщенных жирных кислот (SFA: C14:0, C15:0, C16:0, C17:0, C18:0), 4 мононенасыщенные жирные кислоты (MUFA: C16:1, C18:1, C20:1) и 5 полиненасыщенных жирных кислот (PUFA: C18:2, C18:3, C20:2, C20:4, EPA, DHA). Все содержания жирных кислот выражены на основе сухого вещества (г/100 г сухого веса). Значительные различия мы...&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt; troke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сравнение VFD&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и HAD при 70&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;°C&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;VFD бережет&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;умами, HAD&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дает жареный&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тон&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y
