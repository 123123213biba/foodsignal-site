            {"data":{"leading":false,"html":"&lt;p&gt;18 статей&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Может ли продуктовая корзина заменить лекарства: опыт долгосрочной диеты&lt;/a&gt; — Исследование показало, как регулярное получение растительных продуктов влияет на давление и вес в течение трех лет.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html\"&gt;Гиалуроновая кислота в мороженом: как молекулярный вес меняет текстуру десерта&lt;/a&gt; — Ученые проверили, может ли гиалуроновая кислота заменить привычные стабилизаторы в составе домашнего мороженого.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Жировая болезнь печени: почему число новых случаев удвоилось за три десятилетия&lt;/a&gt; — Неалкогольная жировая болезнь печени становится глобальным вызовом. Разбираемся в статистике и трендах за последние 30 лет.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html\"&gt;Как подружить кофе и яблоки: природный катализатор для создания функциональных продуктов&lt;/a&gt; — Ученые нашли способ соединить кофейные антиоксиданты с молочными пептидами, используя яблочный сок вместо агрессивной химии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html\"&gt;Кактус вместо пластика: новая жизнь отходов опунции в упаковке&lt;/a&gt; — Ученые превратили отходы кактуса опунции в биоразлагаемую пленку, которая может заменить пластик в пищевой промышленности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Гель из алоэ вера против порчи манго: как сохранить свежесть фруктов&lt;/a&gt; — Ученые выяснили, что покрытие из алоэ вера вдвое эффективнее меда защищает нарезанное манго от порчи и потери влаги.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/comparative-evaluation-of-white-quinoa-and-tri-color-quinoa.html\"&gt;Разноцветная крупа против язвы: почему смесь киноа защищает желудок лучше белых зерен&lt;/a&gt; — Обезболивающие разрушают слизистую желудка, но хлеб с трехцветным киноа снизил некроз тканей на 83%.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html\"&gt;Почему разогрев крахмала не всегда делает его легче для пищеварения&lt;/a&gt; — Мы привыкли, что горячая еда усваивается лучше, но с крахмалистыми продуктами всё сложнее. Разбираемся, как структура геля меняет правила игры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html\"&gt;Как превратить отходы морепродуктов в ценный пищевой белок&lt;/a&gt; — Мантия гребешка обычно отправляется в мусор. Технологи нашли способ превратить её в функциональный белок с помощью изменения pH.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Конопля и овес: как ферментация меняет структуру растительного белка&lt;/a&gt; — Разбираемся, как смешивание жмыха конопли и овса с последующей ферментацией помогает улучшить качество растительных аналогов мяса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html\"&gt;Цинк против углеводного стресса: как накормить рыбу правильно&lt;/a&gt; — Высокоуглеводная диета вредит рыбе, но добавление цинка помогает восстановить обмен веществ и чувствительность к инсулину.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html\"&gt;Скрытая жизнь орехового сыра: что на самом деле происходит в ферментированных аналогах&lt;/a&gt; — Мы проверили крафтовые сыры из кешью на безопасность и нашли там кое-что интересное, кроме полезных бактерий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Как поймать аромат жареного: новый биосенсор для определения пиразинов&lt;/a&gt; — Ученые создали «электронный нос» на основе человеческого рецептора, который чувствует запах жареного хлеба и кофе точнее приборов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html\"&gt;Кристаллы каннабидиола в БАДах: европейский регулятор не признал безопасность изолята&lt;/a&gt; — EFSA заблокировала заявку на изолят CBD: производитель не подтвердил наночастицы и чистоту сырья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html\"&gt;Сладкие яблоки уступают кислым по антиоксидантной защите&lt;/a&gt; — Химический анализ мякоти 12 сортов яблок показал: высокое содержание сахара часто означает минимум фенолов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html\"&gt;L-теанин против токсинов: как чай помогает печени справляться с тяжелыми металлами&lt;/a&gt; — Ученые выяснили, что аминокислота из чая может защищать клетки печени от повреждений, вызванных кадмием.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Самцы или самки: почему одни мидии в морозилке прогоркают быстрее других&lt;/a&gt; — Самки и самцы толстостенной мидии стареют на холоде совершенно по-разному: окисление липидов у самок в 1,7 раза выше.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html\"&gt;Как перестать гадать, сколько вы съели: цифровой атлас порций&lt;/a&gt; — Ученые создали базу данных с фотографиями и составом блюд, чтобы точно оценивать размер порций и калорийность рациона.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"18 статей"}],"sty
