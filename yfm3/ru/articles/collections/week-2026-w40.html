            {"data":{"leading":false,"html":"&lt;p&gt;27 статей&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html\"&gt;Клеточное мясо: арахис и киноа заменят животный белок в производстве&lt;/a&gt; — Ученые нашли способ выращивать культивируемое мясо без использования компонентов животного происхождения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html\"&gt;Почему ужинать вдвоем полезнее для здоровья, чем в одиночку&lt;/a&gt; — Ученые доказали, что присутствие близкого человека рядом помогает организму быстрее усваивать углеводы и снижает уровень сахара в крови.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html\"&gt;Чайный гриб вместо закваски: как комбуча разгоняет брожение хлеба&lt;/a&gt; — Готовая закваска всего за пять дней: комбуча ускоряет выпечку ремесленного хлеба и обогащает его антиоксидантами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html\"&gt;Как эфирное масло тимьяна помогает куриному филе дольше оставаться свежим&lt;/a&gt; — Ученые создали биоразлагаемую упаковку с маслом тимьяна, которая замедляет порчу мяса и рост бактерий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Экструзия против сахарного пика: как обработка сырья меняет усвоение шоколада&lt;/a&gt; — Один и тот же состав плитки дал разный гликемический ответ: дело в предварительной экструзии сахара и молока.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html\"&gt;Мясо в масле на свету портит жир быстрее, чем кажется&lt;/a&gt; — Следы крови и солнечный свет способны превратить растительное масло в рассадник альдегидов за пару часов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html\"&gt;Может ли коллаген защитить желудок от последствий алкоголя&lt;/a&gt; — Ученые выяснили, как рекомбинантный человеческий коллаген III типа помогает восстанавливать слизистую желудка при повреждениях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html\"&gt;Хрустящие снеки и готовая еда: метаанализ на 8,8 млн человек показал скрытую цену ультраобработки&lt;/a&gt; — Каждые лишние 100 граммов ультраобработанной еды в день повышают риск сердечно-сосудистых катастроф на 14%.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/nutritional-composition-chemical-safety-and-microbiological.html\"&gt;Хрустящие личинки пальмового долгоносика: белковый концентрат с неожиданными рисками&lt;/a&gt; — Жарка и запекание удваивают долю белка в личинках долгоносика, но скрывают проблемы с тяжелыми металлами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html\"&gt;Китайский напиток доужир против гриппа: что нашла наука&lt;/a&gt; — Традиционный ферментированный напиток из бобов мунг может стать союзником иммунитета в борьбе с вирусом гриппа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;Почему мы выбираем растительный йогурт: вкус или этикетка?&lt;/a&gt; — Разбираемся, что важнее для потребителя: реальный вкус продукта или информация о его пользе на упаковке.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html\"&gt;Как заставить сывороточный белок работать дольше: молекулярный «клей» для мышц&lt;/a&gt; — Сывороточный белок усваивается слишком быстро. Ученые придумали, как замедлить его распад с помощью «семенной оболочки» из полифенолов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку&lt;/a&gt; — Ученые научились делать биоразлагаемую пленку из кожи сибаса. Это прочный, халяльный и экологичный материал для пищевой промышленности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/broccoli-sprout-extract-restores-renal-lipid-metabolism-in-h.html\"&gt;Могут ли ростки брокколи защитить почки при избытке жиров в рационе&lt;/a&gt; — Исследование на мышах показало, как экстракт ростков брокколи помогает почкам справляться с последствиями высокожировой диеты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель&lt;/a&gt; — Ученые научились делать популярный подсластитель из корня якона с помощью бактерий, минуя сложную химическую обработку.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html\"&gt;Молочнокислая бактерия из заквасок смягчает стул: клинические испытания штамма PA53&lt;/a&gt; — Штамм Pediococcus acidilactici PA53 за восемь недель улучшил консистенцию стула и снизил маркеры воспаления.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Хитозановая невидимая броня против гниения томатов и цитрусов&lt;/a&gt; — Гидрогель из панцирей ракообразных, оксида цинка и жимолости защищает урожай от бактерий и потери влаги.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html\"&gt;Почему вздувается упаковка васаби и как это остановить&lt;/a&gt; — Любите васаби? Разбираемся, почему соус начинает «бродить» в упаковке и как производители решают эту проблему.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Жидкий дым и наноэмульсия продлевают свежесть мидий су-вид до 24 дней&lt;/a&gt; — Комбинация термообработки при 85 °C, жидкого дыма и ультразвуковой эмульсии замедляет порчу моллюсков без лишней химии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке&lt;/a&gt; — Сублимация сохраняет омега-жиры и нежный умами креветки, а горячий воздух запускает жареные ноты, перебивая естественную сладость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Скрытая угроза в чечевице и нуте: как плесень меняет растительный белок&lt;/a&gt; — Бобовые спасают планету, но остаются уязвимыми перед плесенью. Почему микотоксины в изолятах — слепая зона?&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Как кожура цитрусовых помогает дольше хранить куриные бургеры&lt;/a&gt; — Обычная желатиновая пленка с добавлением экстракта грейпфрута продлевает свежесть мяса в морозилке на 5 месяцев.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими&lt;/a&gt; — Ученые создали съедобное покрытие из отходов цитрусовых, которое защищает овощи от порчи и плесени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Тыква в рыбном фарше: как улучшить текстуру сурими с помощью овощного порошка&lt;/a&gt; — Рыбный фарш капризен, но щепотка тыквенного порошка может изменить всё. Разбираемся, как это работает на уровне белков.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html\"&gt;Как геймификация помогает подросткам с диабетом считать углеводы&lt;/a&gt; — Разбираемся, почему интерактивные платформы эффективнее бумажных брошюр в обучении детей с диабетом 1 типа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html\"&gt;Может ли сок из семян алеппской сосны укрепить кишечный барьер&lt;/a&gt; — Исследуем, как ферментированный напиток из семян сосны влияет на целостность клеток кишечника.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html\"&gt;Нейросети против диетологов: кому доверить проверку детской тарелки&lt;/a&gt; — ИИ отлично видит степень обработки еды и разнообразие блюд, но серьезно ошибается в калориях и детских порциях.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"27 статей"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Неделя 2026-10-01 — 2026-10-04","description":"27 статей","vcsPath":"articles/collections/week-2026-w40.md"},"headings":[],"title":"Неделя 2026-10-01 — 2026-10-04"},"router":{"pathname":"articles/collections/week-2026-w40","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
