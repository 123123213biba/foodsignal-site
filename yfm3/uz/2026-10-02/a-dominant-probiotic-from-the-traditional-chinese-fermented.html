        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"233\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"567\" cy=\"283\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PROBIOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Xitoyning an'anaviy&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ichimligi grippga qarshi&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kurashda yordam berishi&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mumkin&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar xitoycha douzhier mahsulotidan &lt;a href=\"concepts/lactococcus-lactis-subsp-cremoris-d2022.html\"&gt;Lactococcus lactis subsp. cremoris D2022&lt;/a&gt; shtammini ajratib olishdi. Sichqonlar ustida o‘tkazilgan tajribalar shuni ko‘rsatdiki, ushbu probiotik gripp A virusi ta’sirini yumshatadi. U organizmga virusni tezroq yengishga va yallig‘lanish jarayonlarini nazorat qilishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;D2022 shtammi interferon-beta javobini kuchaytirib, grippda omon qolishni 30% ga oshiradi.&lt;/li&gt;\n&lt;li&gt;Probiotik infeksiyaning kechki bosqichida yallig‘lanish belgilarini (IL-1β, IL-6, TNF-α) kamaytiradi.&lt;/li&gt;\n&lt;li&gt;Ta’sir mexanizmi ichak metabolitlari, xususan, yog‘ kislotalari darajasining o‘zgarishi bilan bog‘liq.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Olimlar C57BL/6J sichqonlarini gripp A (PR8 shtammi) bilan zararlashdi. Kuniga 2 × 10^9 CFU (koloniya hosil qiluvchi birlik) D2022 shtammini olgan guruhda omon qolish darajasi 30% ni tashkil etdi, nazorat guruhida esa bu ko‘rsatkich 0% edi. Bakteriyalar interferon-beta (IFN-β) ishlab chiqarilishini erta bosqichda rag‘batlantirib, virusning organizmdan chiqib ketishini tezlashtirdi.&lt;/p&gt;\n&lt;p&gt;Infeksiyaning kechki bosqichlarida (7-kun) probiotik yallig‘lanishga qarshi sitokinlar (IL-1β, IL-6 va TNF-α) darajasini pasaytirdi. Metabolomik tahlillar qisqa zanjirli yog‘ kislotalari va deaminotirozin (DAT) miqdorining oshganini ko‘rsatdi. Bu moddalar immunitetni modulyatsiya qilishda muhim rol o‘ynaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqonlar modelida o‘tkazilgan, shuning uchun natijalarni to‘g‘ridan-to‘g‘ri odamlarga tatbiq etish uchun klinik sinovlar zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Duchjier (Douzhier) — Sun sulolasi davridan boshlab 1000 yildan ortiq tarixga ega bo‘lgan an’anaviy xitoy fermentlangan oziq-ovqat mahsulotidir. U o‘ziga xos ta’mga ega va ayniqsa Pekin aholisi orasida mashhur. Duchjier moshdan o‘z-o‘zidan fermentatsiyalash orqali olinadi. Mosh suvda ivitiladi, maydalanadi va kraxmal sutini olish uchun suziladi. Ushbu sutga Duchjierning oldingi partiyasidan achitqi qo‘shiladi va fermentatsiyaga qoldiriladi. Tinch turganda u zichligiga qarab uch qatlamga ajraladi: pastki qatlam kraxmaldan; oqsillarga boy o‘rta qatlam madoufu (an’anaviy Pekinแกแก snacks) deb ataladi; yuqori qatlam esa kulrang-yashil suyuqlik — xom Duchjierdir. Xom Duchjier keyinchalik pishirilib, tayyor mahsulot olinadi. Fermentatsiya jarayoni mikrobiota va erkin aminokislotalar kabi fermentativ metabolitlar miqdorining sezilarli o‘zgarishi bilan kechadi.&lt;/p&gt;\n&lt;p&gt;Mavsumiy gripp dunyo bo‘ylab har yili taxminan 1 milliard yuqshish, 3–5 million og‘ir holat va 290 000–650 000 nafas yo‘llari o‘limiga sabab bo‘ladigan jiddiy muammodir. AQShda 2024–2025 yillar mavsumida gripp 51 million kasallanish, 710 000 shifoxonaga yotqizish va 45 000 o‘limga olib keldi. Vaksinalar keng qo‘llaniladi, ammo virusning yuqori mutatsiya darajasi ularning samaradorligini kamaytiradi. Kichik molekulali virusga qarshi dorilar esa uzoq muddatli profilaktika uchun mos emas va rezistentlik rivojlanish xavfiga ega. Shu sababli, grippning yangi profilaktika va davolash usullarini ishlab chiqish dolzarbdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Probiotiklar viruslarga qarshi organizmning nomaxsus mexanizmlarini (I turdagi interferolarni kuchaytirish va giperyallig‘lanishni pasaytirish) faollashtirish orqali hibs qiladi, bu esa mutatsiyalarga bog‘liq emas.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqotlar shuni ko‘rsatadiki, ba’zi probiotiklarning (masalan, Lactococcus lactis, Lactobacillus plantarum, &lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt;, Akkermansia muciniphila va Bacteroides fragilis) virusga qarshi ta’siri I turdagi interferon javobini kuchaytirish va ortiqcha yallig‘lanishni kamaytirish bilan bog‘liq. Probiotiklarni fermentlangan taomlar tarkibida iste’mol qilish uzoq muddatli himoyani ta’minlaydi.&lt;/p&gt;\n&lt;p&gt;Pekin Duchjierida Lactococcus lactis subsp. cremoris (L. cremoris) bakteriyasi ustunlik qiladi. Bu tur kefir va qatiq kabi mahsulotlarda ham uchraydi. Probiotik faollik shtammga juda bog‘liq: masalan, L. cremoris FC shtammi gripp virusiga qarshi o‘pkani himoya qiladi va tirik qolishni oshiradi. Ushbu tadqiqotda Duchjierdan yangi L. cremoris D2022 shtammi ajratib olindi va uning gripp A virusiga (IAV) qarshi xususiyatlari o‘rganildi.&lt;/p&gt;\n&lt;p&gt;Tadqiqotda 120 ta 6 haftalik urg‘ochi C57BL/6J sichqonlaridan foydalanildi (4 ta mustaqil tajriba, har birida n = 10 dan 3 guruh: nazorat, IAV + PBS va IAV + D2022). Gripp virusi A/Puerto Rico/8/34 (H1N1 PR8) MDCK hujayralarida ko‘paytirildi. L. cremoris D2022 shtammi Duchjierdan ajratildi, to‘liq genom ketma-ketligi aniqlandi (BioProject PRJNA1014919) va kvertsetinni parchalash faoliyati baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Virusi va bakteriyalar miqdorini &lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;PFU&lt;/a&gt; va CFU/ml birliklarida o‘lchash namunadagi tirik virus va bakteriya hujayralarining aniq sonini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sichqonlarga -5 kundan 7 kungacha har kuni peroral ravishda 200 mkl L. cremoris D2022 (2 × 10⁹ CFU) yoki PBS yuborildi. Virus bilan zararlash anesteziya ostida infranazal amalga oshirildi: noletal doza 450 PFU (1, 3 va 7 dpi kunlari namuna olindi) yoki letal doza 900 PFU (14 dpi gacha tirik qolish kuzatildi). O‘pka indeksi [o‘pka vazni (g) / tana vazni (g) × 100%], yo‘g‘on ichak uzunligi, OT-PTsR orqali virus yuklamasi va gistologik o‘zgarishlar (5 mkm kesmalar, gematoksilin-eoziyn bo‘yog‘i, 1-4 ballik shkala) baholandi.&lt;/p&gt;\n&lt;p&gt;Zardob va o‘pka gomogenatidagi 8 ta sitokin va xemokinlar (IL-1β, IL-6, TNF-α, KC, IL-4, IL-10, IL-12, IFN-γ) Luminex 200 tizimida o‘lchandi. O‘pka transkriptom tahlili BGISEQ-500 platformasida RNK ketma-ketligini aniqlash orqali o‘tkazildi (NCBI SRA: PRJNA1100256, PRJNA1102099). NF-κB yo‘li oqsillari (P65, p-P65, IκBα, p-IκBα) vestern-blotting usulida β-aktinga nisbatan tahlil qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;HM700 maqsadli metabolomik tahlili &lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;UPLC&lt;/a&gt;-MS/MS apparatida bir vaqtning o‘zida 700 dan ortiq kichik metabolitlar konsentratsiyasini yuqori aniqlikda o‘lchaydi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In vitro tajribalarda sichqon suyak ko‘migi dentritik hujayralari (mBMDCs) D2022 bilan 10:1 nisbatda 24 soat davomida inkubatsiya qilinib, ELISA usulida IFN-β darajasi o‘lchandi. Ko‘r ichak metabolom tahlili UPLC-MS/MS tizimida bajartirildi. Adaptiv immun javob oqimli sitometriya (FACSCalibur) va ELISpot (iSpot Spectrum) usullari yordamida splenotsitlarda IFN-γ sekretsiyasi bo‘yicha baholandi.&lt;/p&gt;\n&lt;p&gt;Duchjier namunasida taxminan 3 × 10⁷ CFU/ml bakteriya mavjud bo‘lib, L. cremoris D2022 ustunlik qildi. Ushbu gram-musbat shtamm kvertsetinning 65% ini parchalash faolligini ko‘rsatdi (Rasm SN2). Genom hajmi 2,63 Mb, GC tarkibi 35,42% ni tashkil etdi. Genomda o‘t kislotalari gidrolazasiga (BSH) nomzod gen topildi, lekin BaiE geni aniqlanmadi (Jadval S1, Jadval S2, Rasm SN1).&lt;/p&gt;\n&lt;p&gt;Noletal zararlanishda D2022 bilan davolangan sichqonlarda 7-kunda o‘pka indeksi (1,48 ± 0,16 ga nisbatan 2,06 ± 0,32), yo‘g‘on ichak uzunligi (7,78 ± 0,17 sm ga nisbatan 6,82 ± 0,20 sm) va tana vazni saqlanishi (83,6 ± 5,22% ga nisbatan 75,3 ± 4,66%) PBS guruhiga nisbatan sezilarli darajada yaxshilandi (Rasm 1C–E). Zararlanishning 3-kunida D2022 guruhida o‘pkadagi virus miqdori kutilganidan kamroq bo‘ldi (146 000 ± 56 000 PFU ga nisbatan 396 000 ± 220 000 PFU), lekin 7-kunga kelib farq yoqoldi (Rasm 1F–G). Letal doza (900 PFU) berilganda PBS guruhidagi barcha sichqonlar 13 kunda o‘ldi, D2022 guruhida esa 30% (10 tadan 3 ta) sichqon 14 kun davomida tirik qoldi (Rasm 1B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;L. cremoris D2022 qo‘llanilishi letal grippda sichqonlarning tirik qolishini 0% dan 30% ga oshirdi va 3 dpi da o‘pkadagi virus yuklamasini 2,7 barobarga kamaytirdi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Gistologik jihatdan D2022 guruhida alveolalar devorining qalinlashishi, yallig‘lanish hujayralari infiltratsiyasi va tomirlar atrofidagi shish kamayib, patologiya balli 1,72 ± 0,38 dan 1,26 ± 0,42 ga tushdi (Rasm 2A–D).&lt;/p&gt;\n&lt;p&gt;Sitokinlar tahlili shuni ko‘rsatdiki, 7-kunda D2022 guruhi o‘pkasi va zardobida pro-yallig‘lanish sitokinlari (IL-6, KC, IL-1β, TNF-α) hamda IL-10 darajasi pasaygan (Rasm 3, Rasm 4). Adaptiv immunitet sitokinlari (IL-12, IFN-γ) esa oshish tendensiyasini ko‘rsatdi.&lt;/p&gt;\n&lt;p&gt;O‘pka transkriptomida 1 dpi da 495 ta DEG (391 ta oshgan) va 7 dpi da 627 ta DEG (359 ta kamaygan) aniqlandi (Rasm 5A,B). 1 dpi da RIG-I, Toll-simon va JAK-STAT yo‘llari (IRF1, IRF7, IFN-α, IFN-β, ISG lar) faollashgan bo‘lsa (Rasm 5C–G), 7 dpi da IL-17, NF-κB, NOD va TNF yallig‘lanish yo‘llari (IL-1β, IL-6, TNF-α, NLRP3) tormozlandi (Rasm 5H–L). Vestern-blotting p-P65 va p-IκBα oqsillari darajasi kamayganini tasdiqladi (Rasm 6).&lt;/p&gt;\n&lt;p&gt;mBMDCs hujayralarida D2022 in vitro sharoitda IFN-β sekretsiyasini oshirdi (Rasm 7A). Sichqonlar o‘pkasida IFN-β darajasi 1 dpi kuniyoq keskin ko‘tarildi (Rasm 7B–D). Ko‘r ichak metabolomi tahlili D2022 ta’sirida qisqa zanjirli yog‘ kislotalari (moy va propion), ikkilamchi o‘t kislotalari (UDCA, Iso-UDCA, IsoalloLCA) va dezaminotirozin (DAT) darajasi qayta tiklanganini ko‘rsatdi (Rasm 8). T-hujayralar faolligi (IFN-γ ajratuvchi CD4+ va CD8+ T-hujayralar) ham oshdi (Rasm 9).&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot Duchjier an’anaviy mahsulotidan ajratilgan L. cremoris D2022 shtammi sichqonlarni gripp A virusidan samarali himoya qilishini ko‘rsatadi. Probiotikni og‘iz orqali qabul qilish kasallikning ilk bosqichida (3 dpi) virus ko‘payishini cheklaydi va o‘lim ko‘rsatkichini kamaytiradi. Virus replikatsiyasini tezda to‘xtatish mexanizmi 1-kundanoq I turdagi interferonlar (IFN-β va ISG) javobining faollashishi bilan bog‘liq. D2022 shtammining kvertsetinni parchalab, interferon signalini kuchaytiruvchi dezaminotirozin (DAT) hosil qilish xususiyati bunga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;L. cremoris D2022 ning virusga qarshi ta’siri ikki bosqichli: 1 dpi da IFN-β ning tezkor induksiyasi virus tarqalishini to‘xtatadi, 7 dpi da NF-κB bloklanishi esa sitokin bo‘ronining oldini oladi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kasallikning kechki bosqichida (7 dpi) D2022 NF-κB, NOD, IL-17 va TNF signal yo‘llarini tormozlash orqali kuchli immunomodulyator ta’sir ko‘rsatadi. Bu yallig‘lanish sitokinlari (IL-1β, IL-6, TNF-α, KC) darajasini pasaytiradi va o‘pka hamda ichak to‘qimalarini zararlanishdan saqlaydi.&lt;/p&gt;\n&lt;p&gt;Ichak metabolitlari ham muhim rol o‘ynaydi: D2022 moy va propion kislotalari hamda ikkilamchi o‘t kislotalari (UDCA, IsoalloLCA) miqdorini oshiradi. Ushbu birikmalar yallig‘lanishni jilovlovchi regulyator T-hujayralar (Treg) rivojlanishiga ko‘maklashadi. Bundan tashqari, D2022 virusga qarshi adaptiv T-hujayra javobini tezlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Probiotikning yallig‘lanishga qarshi xususiyatlari ratsionda bakteriyalar foydali metabolitlar ishlab chiqarishi uchun zarur bo‘lgan kletchatka (prebiotiklar) mavjudligiga bog‘liq.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqotning amaliy ahamiyati shundaki, fermentlangan mahsulotlardan (Duchjier, kefir, qatiq) ajratilgan L. cremoris shtammlari nafas yo‘llari virusli infektsiyalarining oldini olish uchun funktsional oziq-ovqat komponenti sifatida ishlatilishi mumkin. Sanoatda ushbu shtamm probiotik achitqilar tarkibiga kiritilishi mumkin. Maishiy sharoitda esa L. cremoris ga boy fermentlangan taomlarni yetarli miqdordagi prebiotik kletchatka bilan birga muntazam iste’mol qilish immun tizimini mustahkamlashning qulay usulidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Gripp&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;virusining&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yuqori&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;mutatsiyasi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;D2022&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;shtammini&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sichqonlarda&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sinash&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yallig‘lanishn&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ing kamayishi&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va omon qolish&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Immunitetni&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qo‘llab-&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;quvvatlovchi&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;probiotik&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maqola taqriz qilinadigan Nutrients jurnalida nashr etilgan. Ammo bu ham bitta tadqiqot, yakuniy xulosa emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Litsenziya&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nutrients (Europe PMC)&lt;/td&gt;\n&lt;td&gt;probiotics&lt;/td&gt;\n&lt;td&gt;C
