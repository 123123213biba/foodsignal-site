        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Replacing nitrite in cured sausages with natural preservatives&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-preservatives.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-preservatives.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Konservantlar — bu oziq-ovqat mahsulotlarining mikroorganizmlar yoki kimyoviy jarayonlar taʼsirida buzilishini sekinlashtiradigan yoki oldini oladigan oziq-ovqat qoʻshimchalari. Ularning asosiy vazifasi mahsulotning saqlash muddatini uzaytirish va xavfsizligini taʼminlashdir. Oziq-ovqat sanoatida ular funksional maqsadiga koʻra tasniflanadi va xavfsizlik standartlari, masalan, TR TS 029/2012 bilan tartibga solinadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-preservatives.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Konservantlar bakteriyalar, mogʻor zamburugʻlari va achitqilarning hayotiy faoliyatini bostiradigan moddalardir. Ularning taʼsir mexanizmi mikroorganizmlar yashaydigan muhitni oʻzgartirishga, yaʼni hujayra membranalarini shikastlashga yoki fermentativ reaksiyalarni toʻxtatishga asoslangan. Yogʻlarning oksidlanishini sekinlashtiradigan antioksidantlardan farqli oʻlaroq, konservantlar biologik barqarorlikka qaratilgan.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-preservatives.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Konservantning ishlash mexanizmi uning kimyoviy tabiatiga bogʻliq. Masalan, sorbatlar va benzoatlar kislotali muhitda mikroorganizm hujayrasiga kirib, uning ichki muvozanatini buzadigan molekulalarni ajratib chiqaradi. Nitritlar goʻsht mahsulotlarida patogen bakteriyalar oʻsishini cheklaydi. Zamonaviy tadqiqotlar oʻsimlik ekstraktlarining tabiiy mikroblarga qarshi xususiyatlaridan foydalangan holda konservantlarga tabiiy muqobillar izlashga qaratilgan.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-preservatives.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Konservatsiya texnologiyalari kimyoviy birikmalarni qoʻshishni ham, pH darajasini oʻzgartirish kabi fizik usullarni ham oʻz ichiga oladi. Innovatsion yondashuvlar koʻpincha ikkala usulni birlashtiradi. Masalan, greyfurt ekstrakti qoʻshilgan jelatin plyonkasi mahsulotni himoya qiladi va mikroblarga qarshi komponentlarni ajratib chiqaradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-preservatives.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qoʻllaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qoʻllaniladi&lt;/h2&gt;\n&lt;p&gt;Konservantlar goʻsht, baliq va sut mahsulotlari ishlab chiqarishda qoʻllaniladi. «Dengiz mahsulotlari chiqindilarini qimmatli oziq-ovqat oqsiliga aylantirish» maqolasida oqsil fraksiyalarini barqarorlashtirish uchun pH darajasini oʻzgartirish usuli tasvirlangan. «Sitrus poʻstlogʻi tovuq burgerlarini qanday uzoqroq saqlashga yordam beradi» tadqiqotida tabiiy ekstraktlar goʻshtning muzlatgichdagi saqlash muddatini 5 oyga uzaytirishi koʻrsatilgan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-preservatives.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Konservantlardan foydalanish xalqaro tashkilotlar (JECFA/EFSA) tomonidan belgilangan ruxsat etilgan sutkalik dozalar (RSD) bilan cheklangan. Asosiy xavflar notoʻgʻri dozalashda mikroorganizmlarning antiseptiklarga chidamliligi bilan bogʻliq. Shuningdek, tabiiy konservantlar mahsulot taʼmi va hidiga taʼsir qilishi mumkinligini hisobga olish kerak.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Консерванты&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9A%D0%BE%D0%BD%D1%81%D0%B5%D1%80%D0%B2%D0%B0%D0%BD%D1%82%D1%8B%5D%20--%3E%20B%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%B1%D0%B8%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D1%8C%5D%0A%20%20A%20--%3E%20C%5B%D0%A5%D0%B8%D0%BC%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%B1%D0%B8%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D1%8C%5D%0A%20%20B%20--%3E%20D%5B%D0%9F%D0%BE%D0%B4%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D0%B7%D0%BC%D0%B0%20%D0%B1%D0%B0%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D0%B9%5D%0A%20%20C%20--%3E%20E%5B%D0%97%D0%B0%D0%BC%D0%B5%D0%B4%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BE%D0%BA%D0%B8%D1%81%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20F%5B%D0%9F%D1%80%D0%BE%D0%B4%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D1%81%D1%80%D0%BE%D0%BA%D0%B0%20%D1%85%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20E%20--%3E%20F%0A%20%20F%20--%3E%20G%5B%D0%91%D0%B5%D0%B7%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D0%BE%D1%81%D1%82%D1%8C%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-preservatives.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Oziq-ovqat qo'shimchalari&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-preservatives.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html\"&gt;Dengiz mahsulotlari chiqindilarini qimmatli oqsilga aylantirish&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Sitrus po‘stlog‘i tovuq kotletlarini uzoqroq saqlashga qanday yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"
