        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-safety.jpg\" alt=\"Xavfsizlik va saqlash\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: MoD of Russian Federation, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Posters_for_information_security_for_the_Ministry_of_Defense_of_the_Russian_Federation.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-safety.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/spec-safety.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat xavfsizligi va saqlash — bu mahsulotning buzilishi, mikrobial ifloslanishi va kimyoviy degradatsiyasining oldini olishga qaratilgan chora-tadbirlar majmuidir. Asosiy maqsad mahsulotning yaxlitligini va inson salomatligi uchun xavfsizligini saqlashdan iborat. Zamonaviy yondashuvlar qadoqlash kabi fizik to‘siqlarni muhitni nazorat qilishning kimyoviy va biologik usullari bilan birlashtiradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-safety.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat xavfsizligi xatarlarni boshqarishga asoslanadi. Asosiy tushunchalarga mikrobial xavfsizlik, kimyoviy barqarorlik va fizik yaxlitlik kiradi. Ushbu jarayonlar o‘zaro bog‘liq: masalan, qadoqning buzilishi mikrobial ifloslanishga yoki yog‘larning oksidlanishiga olib keladi. Xatarlarni boshqarish mahsulotning yorug‘lik, kislorod yoki haroratga sezgirligi kabi zaif tomonlarini aniqlashni va tegishli himoya vositalarini tanlashni talab qiladi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-safety.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Xavfsizlikni ta’minlash jarayoni vaqt o‘tishi bilan rivojlanadi. Ishlab chiqarish bosqichida to‘siqlar: antioksidantlar, himoya muhitlari yoki biologik parchalanadigan materiallar qo‘llanadi. Saqlash jarayonida mahsulot yorug‘lik, issiqlik va namlik ta’siriga uchraydi. Agar qadoq himoya qila olmasa, degradatsiya jarayonlari: lipidlarning oksidlanishi, bakteriyalarning ko‘payishi yoki istalmagan fermentatsiya boshlanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-safety.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Mahsulotlarni himoya qilish uchun faol va passiv usullar qo‘llaniladi. Passiv usullar kislorod va namlik kirishini to‘suvchi germetik qadoqlashni o‘z ichiga oladi. Faol usullar funksional qo‘shimchalarni joriy etadi: masalan, antibakterial xususiyatlarga ega efir moylari yoki sabzavotlar yuzasida himoya qatlamini hosil qiluvchi xitozan qoplamalari.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-safety.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Xavfsizlik tamoyillari zamonaviy tadqiqotlarda o‘z aksini topadi. «Как эфирное масло тимьяна помогает куриному филе дольше оставаться свежим» maqolasida bakteriyalar o‘sishini sekinlashtirish uchun biologik parchalanadigan qadoqlashdan foydalanish ko‘rsatilgan. «Почему вздувается упаковка васаби и как это остановить» tadqiqoti fermentatsiyani nazorat qilish usullarini ochib beradi. «Мясо в масле на свету портит жир быстрее, чем кажется» ishida yorug‘likning lipidlar oksidlanishiga ta’siri tahlil qilinadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavfli-jihatlar\"&gt;&lt;a href=\"concepts/spec-safety.html#cheklovlar-va-xavfli-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavfli jihatlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavfli jihatlar&lt;/h2&gt;\n&lt;p&gt;Xavfsizlik mutlaq emas. Ilg‘or texnologiyalardan foydalanilganda ham mahsulotlarni ultra-qayta ishlash bilan bog‘liq xatarlar mavjud, bu «Хрустящие снеки и готовая еда: метаанализ на 8,8 млн человек показал скрытую цену ультраобработки» meta-tahlilida tasdiqlangan. Har qanday himoya qoplamalari yoki qo‘shimchalar qo‘llanilish chegaralariga ega: ular ba’zi mikroorganizmlarga qarshi samarali bo‘lishi, boshqalariga esa ta’sir qilmasligi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Xavfsizlik va saqlash&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D3%A8%D0%BD%D1%96%D0%BC%5D%20--%3E%20B%5B%D2%9A%D0%BE%D1%80%D2%93%D0%B0%D0%BD%D1%8B%D1%81%20%D0%BA%D0%B5%D0%B4%D0%B5%D1%80%D0%B3%D1%96%D1%81%D1%96%5D%0A%20%20B%20--%3E%7C%D2%9A%D0%BE%D1%80%D2%93%D0%B0%D1%83%7C%20C%5B%D0%A1%D1%8B%D1%80%D1%82%D2%9B%D1%8B%20%D0%BE%D1%80%D1%82%D0%B0%5D%0A%20%20C%20--%3E%7C%D3%98%D1%81%D0%B5%D1%80%20%D0%B5%D1%82%D1%83%7C%20D%5B%D0%94%D0%B5%D0%B3%D1%80%D0%B0%D0%B4%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%7C%D0%A2%D0%BE%D1%82%D1%8B%D2%93%D1%83%7C%20E%5B%D0%A1%D0%B0%D0%BF%D0%B0%D0%BD%D1%8B%D2%A3%20%D1%82%D3%A9%D0%BC%D0%B5%D0%BD%D0%B4%D0%B5%D1%83%D1%96%5D%0A%20%20D%20--%3E%7C%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%B1%D1%82%D0%B0%D1%80%7C%20E%0A%20%20A%20--%3E%20F%5B%D0%91%D0%B0%D2%9B%D1%8B%D0%BB%D0%B0%D1%83%5D%0A%20%20F%20--%3E%7C%D0%A2%D3%99%D1%83%D0%B5%D0%BA%D0%B5%D0%BB%D0%B4%D0%B5%D1%80%D0%B4%D1%96%20%D0%B1%D0%B0%D1%81%D2%9B%D0%B0%D1%80%D1%83%7C%20B%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-safety.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-shelf_life.html\"&gt;Срок годности&lt;/a&gt; — Порча, прогнозирование срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-packaging.html\"&gt;Упаковка и миграция&lt;/a&gt; — Пластик, биоразлагаемые плёнки, миграция веществ в еду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-contaminants.html\"&gt;Загрязнители процесса&lt;/a&gt; — Акриламид, ПАУ, фуран: как образуются и как снизить.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbial.html\"&gt;Микробная безопасность&lt;/a&gt; — Патогены, биоплёнки, обеззараживание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergens.html\"&gt;Аллергены&lt;/a&gt; — Выявление и снижение аллергенности.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-safety.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html\"&gt;Plastik o‘rniga kaktus: opuntiya chiqindilaridan yangi qadoqlash&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html\"&gt;Yorug'likdagi go'shtli yog' kutilganidan tezroq buziladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Pomidor va sitruslarni chirishdan asrovchi ko‘rinmas xitozan qoplamasi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html\"&gt;Do‘kon gazaklari va yarim tayyor taomlar: 8,8 mln kishilik tahlil sanoat ozuqasining asoratini ochdi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html\"&gt;Vasabi qadog‘i nega shishib ketadi va buni qanday to‘xtatish mumkin&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html\"&gt;Kollagen oshqozon shilliq qavatini alkogol ta'siridan himoya qila oladimi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html\"&gt;Zig'ir moyi va xitozan: tovuq go'shtini saqlashning yangi usuli&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-safety.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F_%D0%B1%D0%B5%D0%B7%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D0%BE%D1%81%D1%82%D1%8C\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Информационная безопасность — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Posters_for_information_security_for_the_Ministry_of_Defense_of_the_Russian_Federation.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: MoD of Russian Federation, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — sharh, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(21)02724-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis&lt;/a&gt; — sharh, Lancet 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — sharh, PLoS Med 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Xavfsizlik va saqlash","description":"Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.","vcsPath":"concepts/spec-safety.md"},"headings":[{"title":"Ta'rif","href":"concepts/spec-safety.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/spec-safety.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/spec-safety.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/spec-safety.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/spec-safety.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo‘llaniladi","href":"concepts/spec-safety.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavfli jihatlar","href":"concepts/spec-safety.html#cheklovlar-va-xav
