        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-nutrition.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/spec-nutrition.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Nutriyentlar — bu oziq-ovqat bilan birga organizmga kiradigan va hayotiy faoliyatni, o‘sishni hamda to‘qimalarni tiklashni ta’minlaydigan kimyoviy birikmalar. Ular makronutriyentlar (oqsil, yog‘, uglevod) va mikronutriyentlar (vitaminlar, minerallar)ga bo‘linadi. Nutriyentlarni tushunish ratsion tarkibi metabolik jarayonlarga qanday ta’sir qilishini baholash imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-nutrition.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Nutriyentlar biokimyoviy reaksiyalarda ishtirok etuvchi moddiy mohiyatlardir. Makronutriyentlar organizmni energiya va tarkibiy qismlar bilan ta’minlaydi. Mikronutriyentlar fermentativ jarayonlarda kofaktor vazifasini bajaradi. Nutriyentlarning organizm bilan o‘zaro ta’siri ularning biologik mavjudligiga — moddaning oshqozon-ichak traktida so‘rilishi va qon oqimiga yetib borish ulushiga bog‘liq.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-nutrition.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Nutriyentlarni o‘zlashtirish jarayoni oziq-ovqatning mexanik va kimyoviy parchalanishidan boshlanadi. Ingichka ichakda nutriyentlar epitelial to‘siqdan o‘tadi. Bu jarayonning tezligi turlicha: masalan, zardob oqsili tez parchalanadi, ammo polifenollarning qo‘shilishi himoya qobig‘ini hosil qilib, bu jarayonni sekinlashtirishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-nutrition.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Nutriyentlarni baholash uchun xromatografiya va mass-spektrometriya kabi tahliliy usullar qo‘llaniladi. Klinik amaliyotda glyukoza darajasini va boshqa markerlarni monitoring qilish protokollari qo‘llaniladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-nutrition.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Nutriyentlar haqidagi bilimlar parhezshunoslik va oziq-ovqat mahsulotlarini ishlab chiqishda asos bo‘lib xizmat qiladi. «Zardob oqsilini qanday qilib uzoqroq ishlashga majbur qilish kerak: mushaklar uchun molekulyar yelim» maqolasida oqsil so‘rilishini o‘zgartirish uchun polifenollardan foydalanish tasvirlangan. «Geymifikatsiya qandli diabet bilan og‘rigan o‘smirlarga uglevodlarni hisoblashda qanday yordam beradi» tadqiqoti glyukoza darajasini nazorat qilish uchun makronutriyentlarni aniq hisobga olish muhimligini ko‘rsatadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/spec-nutrition.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Nutriyentlar haqidagi ma’lumotlar metabolizmning individual o‘zgaruvchanligi bilan cheklangan. Ko‘pgina tadqiqotlar kuzatuv xarakteriga ega, bu esa aniq nutriyent va sog‘liq holati o‘rtasidagi sabab-oqibat bog‘liqligini aniqlashni qiyinlashtiradi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Nutrientlar&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%5D%20--%3E%20B%5B%D0%90%D1%81%20%D2%9B%D0%BE%D1%80%D1%8B%D1%82%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%9C%D0%B0%D0%BA%D1%80%D0%BE%D0%BD%D1%83%D1%82%D1%80%D0%B8%D0%B5%D0%BD%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20B%20--%3E%20D%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BD%D1%83%D1%82%D1%80%D0%B8%D0%B5%D0%BD%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20E%5B%D0%AD%D0%BD%D0%B5%D1%80%D0%B3%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20F%5B%D2%9A%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%5D%0A%20%20D%20--%3E%20G%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20E%20--%3E%20H%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D0%B7%D0%BC%5D%0A%20%20F%20--%3E%20H%0A%20%20G%20--%3E%20H%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-nutrition.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-micronutrients.html\"&gt;Витамины и минералы&lt;/a&gt; — Содержание, потери при готовке, обогащение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioactives.html\"&gt;Полифенолы и биоактивные вещества&lt;/a&gt; — Полифенолы, каротиноиды, флавоноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-nutrition.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Jigar yog'lanishi: nima uchun kasallanish holatlari 30 yilda ikki baravar oshdi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html\"&gt;Nima uchun kraxmalni qayta isitish har doim ham hazm qilishni osonlashtirmaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html\"&gt;Qahva va olmani birlashtirish: funksional oziq-ovqat uchun tabiiy katalizator&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html\"&gt;Achitqi bakteriyasi ich qotishini yumshatadi: PA53 shtammining klinik sinovlari&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html\"&gt;Qandli diabeti bor o‘smirlar uchun raqamli ta’lim platformasi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html\"&gt;Zardob oqsilini uzoqroq ishlashga majbur qilish: mushaklar uchun molekulyar «yelim»&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html\"&gt;Nima uchun yolg'iz ovqatlangandan ko'ra birga kechki ovqat qilish foydaliroq&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-nutrition.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8_%D0%B7%D0%BD%D0%B0%D1%87%D0%B8%D0%BC%D1%8B%D0%B5_%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Биологически значимые элементы — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3168/jds.s0022-0302(91)78551-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Methods for dietary fiber, neutral detergent fiber, and nonstarch polysaccharides in relation to animal nutrition&lt;/a&gt; — sharh, J Dairy Sci 1991&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(21)02724-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis&lt;/a&gt; — sharh, Lancet 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/thy.2015.0020\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer: The American Thyroid Association Guidelines Task Force on Thyroid Nodules and Differentiated Thyroid Cancer&lt;/a&gt; — sharh, Thyroid 2016&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Nutrientlar","description":"Что еда даёт организму: витамины, биоактивные веще
