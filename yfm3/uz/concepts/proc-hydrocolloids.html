        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Xanthan and guar thickeners for dysphagia diets&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Ксантан, агар, пектин, каррагинан.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Quyultirgichlar va gidrokolloidlar oziq-ovqat mahsulotlarining fizik xossalarini o‘zgartiradigan, ularning qovushqoqligini oshiradigan yoki gel tuzilmasini hosil qiladigan oziq-ovqat qo‘shimchalari guruhidir. Ular teksturani nazorat qilish, namlikni saqlash va ingredientlarning ajralib ketishining oldini olish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Gidrokolloidlar suv bilan o‘zaro ta’sirlashganda kolloid tizimlarni hosil qiluvchi gidrofil polimerlardir. Ularning asosiy xossasi gidratlanish qobiliyatidir — suv molekulalarini yutib, polimer zanjirlarining shishishi va muhit qovushqoqligining oshishiga olib keladi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Quyultirish jarayoni polimerning uzun molekulyar zanjirlarining mexanik chirmashuviga asoslanadi. Gidrokolloid suvga tushganda, uning molekulalari ochilib, bir-biri bilan o‘zaro ta’sirlashadi va uch o‘lchamli to‘r hosil qiladi. Bu to‘r suv molekulalarining harakatchanligini cheklaydi, bu esa qovushqoqlikning oshishiga olib keladi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Quyultirgichlarning samaradorligini baholash uchun reologik usullar qo‘llaniladi. Laboratoriya sharoitida viskozimetrlar va teksturometrlardan foydalaniladi, ular qo‘shimchaning mahsulot saqlanishi va iste’mol qilinishiga ta’sirini aniqlashga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Gidrokolloidlar funksional qoplamalar yaratish va mahsulotlar konsistensiyasini yaxshilash uchun ishlatiladi. Masalan, «Apelsin po‘stlog‘i va chinnigul pomidorlarning uzoqroq yangi qolishiga qanday yordam beradi» maqolasida gidrokolloidlar sabzavotlar yuzasida faol komponentlarni ushlab turish uchun asos bo‘lib xizmat qiladi. Shuningdek, ular disfagiya bilan og‘rigan odamlar uchun parhezda muhimdir.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov gidrokolloidlar xossalarining tashqi omillarga: muhit pH darajasi, harorat, tuzlar va qandlar mavjudligiga bog‘liqligidir. Noto‘g‘ri tanlangan quyultirgich sinerezisga — saqlash vaqtida geldan suv ajralib chiqishiga olib kelishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Загустители и гидроколлоиды&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%93%D0%B8%D0%B4%D1%80%D0%BE%D0%BA%D0%BE%D0%BB%D0%BB%D0%BE%D0%B8%D0%B4%5D%20--%3E%20B%5B%D0%93%D0%B8%D0%B4%D1%80%D0%B0%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20C%5B%D0%9D%D0%B0%D0%B1%D1%83%D1%85%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%B0%5D%0A%20%20C%20--%3E%20D%5B%D0%9E%D0%B1%D1%80%D0%B0%D0%B7%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%20%D1%81%D0%B5%D1%82%D0%BA%D0%B8%5D%0A%20%20D%20--%3E%20E%5B%D0%9F%D0%BE%D0%B2%D1%8B%D1%88%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B2%D1%8F%D0%B7%D0%BA%D0%BE%D1%81%D1%82%D0%B8%5D%0A%20%20E%20--%3E%20F%5B%D0%A1%D1%82%D0%B0%D0%B1%D0%B8%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%B3%D0%B5%D0%BB%D1%8C%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Oziq-ovqat qo'shimchalari&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Apelsin po‘sti va chinnigul pomidorlarni uzoqroq saqlashga qanday yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-hydrocolloids.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%93%D0%B8%D0%B4%D1%80%D0%BE%D0%BA%D0%BE%D0%BB%D0%BB%D0%BE%D0%B8%D0%B4%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Гидроколлоиды — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — sharh, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — sharh, PLoS Med 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/wound.2015.0635\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Challenges in the Treatment of Chronic Wounds&lt;/a&gt; — sharh, Adv Wound Care (New Rochelle) 2015&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ксантан, агар, пектин, каррагинан."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Загустители и гидроколлоиды","description":"Ксантан, агар, пектин, каррагинан.","vcsPath":"concepts/proc-hydrocolloids.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-hydrocolloids.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/proc-hydrocolloids.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/proc-hydrocolloids.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/proc-hydrocolloids.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/proc-hydrocolloids.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo‘llaniladi","href":"concepts/proc-hydrocolloids.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavflar","href":"concepts/proc-hydrocolloids.html#cheklovlar-va-xavflar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/proc-hydrocolloids.html#bogliq-tushunchalar","level":2},{"title":"Qayerda uchraydi","href":"concepts/proc-hydrocolloids.html#qayerda-uchraydi","level":2},{"title":"Manbalar","href":"concepts/proc-hydrocolloids.html#manbalar","level":2}],"title":"Загустители и гидроколлоиды"},"router":{"pathname":"concepts/proc-hydrocolloids","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
