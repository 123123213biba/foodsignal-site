        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Vitamin C losses during cooking and iron fortification of flour&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-micronutrients.jpg\" alt=\"Витамины и минералы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Schekinov Alexey Victorovich, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%94%D1%80%D0%B0%D0%B6%D0%B5._%D0%A0%D0%B5%D0%B2%D0%B8%D1%82_(%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%90,_%D0%921,_%D0%922_%D0%B8_%D0%A1).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Содержание, потери при готовке, обогащение.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Vitaminlar va minerallar mikronutriyentlar hisoblanadi — bular inson organizmi oziq-ovqat orqali oz miqdorda oladigan zarur kimyoviy birikmalardir. Ular hujayra metabolizmi, fermentativ reaksiyalarni boshqarish va to‘qimalarning strukturaviy yaxlitligini saqlashda ishtirok etadi. Makronutriyentlardan (oqsil, yog‘ va uglevodlar) farqli o‘laroq, mikronutriyentlar energiya manbai bo‘lib xizmat qilmaydi, lekin organizmdagi barcha biokimyoviy jarayonlarning kechishini ta’minlaydi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Vitaminlar organik molekulalar bo‘lib, ular eruvchanligiga ko‘ra tasniflanadi: suvda eruvchan (B guruhi, S vitamini) va yog‘da eruvchan (A, D, E, K). Minerallar — bu organizmda sintezlanmaydigan va tashqaridan kelishi kerak bo‘lgan noorganik elementlardir (masalan, temir, kalsiy, magniy). Mikronutriyentlar metabolik yo‘llarning bir qismi bo‘lib, ular kofaktorlar sifatida — fermentlarni faollashtirish uchun zarur bo‘lgan komponentlar sifatida ishlaydi. Ularning yetishmasligi gomeostazni buzadi va patologik holatlarga olib kelishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Mikronutriyentlarning so‘rilish jarayoni ularning kimyoviy shakliga, oziq-ovqatning boshqa komponentlari bilan o‘zaro ta’siriga va ovqat hazm qilish tizimining holatiga bog‘liq. Masalan, o‘simlik manbalaridan olingan temirning biologik mavjudligi hayvonot mahsulotlariga qaraganda pastroq. Termik ishlov berish S vitamini kabi issiqlikka sezgir vitaminlarning parchalanishiga olib keladi. Oziq-ovqat mahsulotlarini boyitish (fortifikatsiya) — bu aholi o‘rtasida tanqislikning oldini olish uchun un yoki boshqa mahsulotlar tarkibiga mikronutriyentlar qo‘shish texnologik jarayonidir.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Mikronutriyentlar miqdorini baholash uchun tahliliy usullar qo‘llaniladi: vitaminlar uchun yuqori samarali suyuqlik xromatografiyasi (YS SX) va mineral elementlar uchun atom-absorbsion spektrometriya. Klinik amaliyotda qon tahlillari qo‘llaniladi. Muhim vosita — bu nutrisiologik monitoring bo‘lib, u ozuqa moddalarini iste’mol qilishni insonning fiziologik holati bilan bog‘lash imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Mikronutriyentlarning rolini tushunish ovqatlanish strategiyalarini ishlab chiqish uchun zarur. «Geymifikatsiya diabetga chalingan o‘smirlarga uglevodlarni hisoblashda qanday yordam beradi» maqolasida metabolik muvozanatni saqlash uchun ratsion tarkibini nazorat qilish muhimligi ko‘rib chiqiladi. «Nega yolg‘iz emas, juftlikda kechki ovqatlanish sog‘liq uchun foydaliroq» materialida psixosotsial omillarning metabolizmga ta’siri muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavfli-jihatlar\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#cheklovlar-va-xavfli-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavfli jihatlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavfli jihatlar&lt;/h2&gt;\n&lt;p&gt;Asosiy qiyinchilik — bu ozuqa moddalarining biologik mavjudligidagi o‘zgaruvchanlikdir. Mahsulotlardagi vitaminlar miqdori haqidagi ma’lumotlar ko‘pincha o‘rtacha hisoblanadi va saqlash hamda pishirish jarayonidagi yo‘qotishlarni hisobga olmaydi. Biologik faol qo‘shimchalarni nazoratsiz qabul qilishda ortiqcha iste’mol qilish xavfi mavjud. Ilmiy konsensus shuni ta’kidlaydiki, muvozanatli ratsion izolyatsiya qilingan qo‘shimchalarga qaraganda mikronutriyentlarning afzal manbai hisoblanadi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Витамины и минералы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BD%D1%83%D1%82%D1%80%D0% , пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Jigar yog'lanishi: nima uchun kasallanish holatlari 30 yilda ikki baravar oshdi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html\"&gt;Qandli diabeti bor o‘smirlar uchun raqamli ta’lim platformasi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html\"&gt;Nima uchun yolg'iz ovqatlangandan ko'ra birga kechki ovqat qilish foydaliroq&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%B3%D1%80%D1%83%D0%BF%D0%BF%D1%8B_B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Витамины группы B — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%94%D1%80%D0%B0%D0%B6%D0%B5._%D0%A0%D0%B5%D0%B2%D0%B8%D1%82_(%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%90,_%D0%921,_%D0%922_%D0%B8_%D0%A1).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Schekinov Alexey Victorovich, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(12)62167-9\" target=\"_blank\" re
