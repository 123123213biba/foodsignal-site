        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-ferment.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/spec-ferment.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya — bu fermentlar yoki mikroorganizmlar taʼsirida organik moddalarni biokimyoviy qayta ishlash jarayoni. Oziq-ovqat texnologiyalarida bu jarayon xomashyoni yangi taʼm, xushboʻylik va ozuqaviy xususiyatlarga ega mahsulotlarga aylantiradi. Zimologiya — fermentatsiya jarayonlarini va ularning amaliy qoʻllanilishini oʻrganadigan amaliy fan.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-ferment.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya — bu mikroorganizmlar (bakteriyalar, achitqilar, mogʻor zamburugʻlari) kislorodsiz muhitda energiya olish uchun uglevodlar kabi murakkab organik birikmalarni parchalaydigan metabolizm jarayoni. Asosiy natija metabolitlar: organik kislotalar, spirtlar, gazlar va xushboʻy birikmalarning toʻplanishidir. Bu jarayon ichak mikrobiotasi bilan chambarchas bogʻliq boʻlib, u fermentatsiya mahsulotlaridan, masalan, qisqa zanjirli yogʻ kislotalaridan mezbonning energiya almashinuvini tartibga solish uchun foydalanadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-ferment.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Jarayon substratni — ozuqa moddalariga boy muhitni tayyorlashdan boshlanadi. Keyin tizimga maxsus mikroorganizmlar kiritiladi yoki xomashyoning oʻz fermentlari faollashtiriladi. Reaksiya davomida mikroblar qandlarni isteʼmol qiladi va mahsulotning pH darajasi, teksturasi va kimyoviy tarkibini oʻzgartiruvchi hayotiy mahsulotlarni ajratib chiqaradi. Harorat, namlik va kislorod kirishini nazorat qilish madaniyatda aynan qaysi mikroorganizmlar ustunlik qilishini belgilaydi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-ferment.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vositalar — muhitning belgilangan parametrlarini taʼminlaydigan bioreaktorlar yoki fermentatsiya idishlari. Uy va sanoat sharoitida achitqilar, kodji (mogʻor zamburugʻlari madaniyati) va kombucha kabi tabiiy boshlangʻich madaniyatlar qoʻllanadi. Zamonaviy usullar aniq molekulalarni sintez qilish uchun dasturlashtirilgan mikroorganizmlardan foydalanadigan aniq fermentatsiyani oʻz ichiga oladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollanadi\"&gt;&lt;a href=\"concepts/spec-ferment.html#qayerda-qollanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qoʻllanadi&lt;/span&gt;&lt;/a&gt;Qayerda qoʻllanadi&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya keng turdagi mahsulotlarni yaratish uchun ishlatiladi. «Choy qoʻziqorini achitqi oʻrniga: kombucha non achitishni qanday tezlashtiradi» maqolasida non pishirishni tezlashtirish va nonni antioksidantlar bilan boyitish uchun kombuchadan foydalanish tasvirlangan. «Aleppo qaragʻayi urugʻidan olingan sharbat ichak toʻsigʻini mustahkamlay oladimi» ishida fermentlangan ichimlikning ichak hujayralari yaxlitligiga taʼsiri oʻrganiladi. «Xitoyning doujir ichimligi grippga qarshi: fan nimani aniqladi» tadqiqoti fermentlangan mung loviyalarining immunitetni qoʻllab-quvvatlashdagi salohiyatini koʻrsatadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/spec-ferment.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov — xavfsizlik protokollari buzilganda patogen mikroorganizmlarning rivojlanish xavfidir. Fermentatsiya steril jarayon emas, shuning uchun madaniyat tozaligini va muhit sharoitlarini nazorat qilish buzilishning oldini olish uchun juda muhimdir. Hujayra modellari yoki hayvonlarda oʻtkazilgan tadqiqotlar natijalari har doim ham toʻgʻridan-toʻgʻri odamga oʻtkazilmaydi, bu sogʻliq uchun foydali maʼlumotlarni talqin qilishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Fermentatsiya&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%83%D0%B1%D1%81%D1%82%D1%80%D0%B0%D1%82%5D%20--%3E%20B%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D0%B4%D0%B5%D1%80%5D%0A%20%20B%20--%3E%7C%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%7C%20C%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D3%A8%D0%BD%D1%96%D0%BC%D0%BD%D1%96%D2%A3%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%D1%96%5D%0A%20%20D%20--%3E%20E%5B%D0%94%D3%99%D0%BC%5D%0A%20%20D%20--%3E%20F%5B%D0%A5%D0%BE%D1%88%20%D0%B8%D1%96%D1%81%5D%0A%20%20D%20--%3E%20G%5B%D0%A2%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%5D%0A%20%20D%20--%3E%20H%5B%D0%A1%D0%B0%D2%9B%D1%82%D0%B0%D0%BB%D1%83%20%D0%BC%D0%B5%D1%80%D0%B7%D1%96%D0%BC%D1%96%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-ferment.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dairy_ferm.html\"&gt;Молочная ферментация&lt;/a&gt; — Йогурт, кефир, сыры: закваски и созревание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sourdough.html\"&gt;Закваска и хлеб&lt;/a&gt; — Дикие дрожжи и молочнокислые бактерии в тесте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-veg_ferm.html\"&gt;Квашения и соленья&lt;/a&gt; — Кимчи, квашеная капуста, соленья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-beverage_ferm.html\"&gt;Ферментированные напитки&lt;/a&gt; — Пиво, вино, комбуча, квас.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-koji_precision.html\"&gt;Коджи и прецизионная ферментация&lt;/a&gt; — Aspergillus, мисо, соевый соус; белки, выращенные микробами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-probiotics.html\"&gt;Пробиотики&lt;/a&gt; — Живые культуры и их выживание в продуктах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-ferment.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html\"&gt;Kashyu pishlog'ining yashirin hayoti: fermentlangan mahsulotlarda nimalar yashiringan&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html\"&gt;Choy qo'ziqorini xamirturush o'rnida: kombucha non achishini qanday tezlashtiradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html\"&gt;Aleppo qarag'ayi urug'i suvi ichak to'sig'ini mustahkamlay oladimi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html\"&gt;Xitoyning an'anaviy ichimligi grippga qarshi kurashda yordam berishi mumkin&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-ferment.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — sharh, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1194/jlr.r036012\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The role of short-chain fatty acids in the interplay between diet, gut microbiota, and host energy metabolism&lt;/a&gt; — sharh, J Lipid Res 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.11.1.142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diarrheagenic Escherichia coli&lt;/a&gt; — sharh, Clin Microbiol Rev 1998&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Fermentatsiya","
