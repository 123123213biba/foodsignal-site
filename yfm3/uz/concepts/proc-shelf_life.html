        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Predicting shelf life of fresh bread with accelerated storage tests&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-shelf_life.jpg\" alt=\"Срок годности\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Edward Betts, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Expiration.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Порча, прогнозирование срока хранения.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Yaroqlilik muddati — bu oziq-ovqat mahsuloti saqlash sharoitlariga rioya qilinganda o'z sifat ko'rsatkichlarini saqlab qoladigan va iste'mol uchun xavfsiz bo'lib qoladigan vaqt oralig'i. Bu ko'rsatkich sifatni boshqarishning asosiy vositasi bo'lib, iste'molchi salomatligi uchun xavflarni kamaytirish va oziq-ovqat chiqindilarini qisqartirish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Yaroqlilik muddati degradatsiya jarayonlarini bashorat qilishga asoslangan axborot mohiyatidir. Mahsulotning buzilishi — bu lipidlarning oksidlanishi, fermentativ parchalanish yoki patogen mikroorganizmlarning ko'payishi kabi fizik-kimyoviy va mikrobiologik o'zgarishlar majmuidir. Mahsulot xavfsizligi parchalanish mahsulotlari yoki patogenlarning toksik konsentratsiyalari yo'qligi bilan belgilanadi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Yaroqlilik muddatini belgilash degradatsiya tezligini modellashtirishga asoslanadi. Asosda kimyoviy reaksiyalar tezligining tashqi omillar: harorat, namlik, yorug'lik va gaz muhiti tarkibiga bog'liqligini tavsiflovchi kinetik tenglamalar yotadi. Ishlab chiqaruvchilar mahsulotni normal saqlash sharoitidagi xatti-harakatlarini bashorat qilish uchun tezlashtirilgan sinovlardan foydalanadilar.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Barqarorlikni baholash uchun analitik usullar qo'llaniladi: oksidlanish mahsulotlarini aniqlash uchun xromatografiya, patogenlarni nazorat qilish uchun mikrobiologik ekish va organoleptik xususiyatlarni baholash uchun sensorli tahlil. Zamonaviy yondashuvlar namlik yo'qotilishini va bakteriyalar o'sishini sekinlashtiradigan xitozan gidrogellari kabi himoya qoplamalaridan foydalanishni o'z ichiga oladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Yaroqlilik muddatini bashorat qilish tamoyillari mahsulot buzilishining oldini olish uchun juda muhimdir. «Nima uchun vasabi qadoqlari shishadi va buni qanday to'xtatish kerak» maqolasida qadoqlash sharoitlarini o'zgartirishni talab qiladigan gaz hosil bo'lishi muammosi ko'rib chiqiladi. «Yog'dagi go'sht yorug'likda yog'ni o'ylagandan tezroq buzadi» tadqiqoti yorug'lik kabi tashqi omillar oksidlanishni tezlashtirib, yaroqlilik muddatini qisqartirishini ko'rsatadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavfli-jihatlar\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#cheklovlar-va-xavfli-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavfli jihatlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavfli jihatlar&lt;/h2&gt;\n&lt;p&gt;Yaroqlilik muddatini bashorat qilish — bu mutlaq kafolat emas, balki ehtimollik modelidir. Tezlashtirilgan sinovlar har doim ham logistika va uy sharoitidagi haqiqiy saqlash sharoitlarini aniq aks ettirmaydi. Shuningdek, ultra-qayta ishlangan mahsulotlar sog'liq uchun yashirin xavflarni keltirib chiqarishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Срок годности&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%82%D2%9B%D1%8B%20%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D1%80%D0%BB%D0%B0%D1%80%5D%20--%3E%7C%D3%98%D1%81%D0%B5%D1%80%20%D0%B5%D1%82%D0%B5%D0%B4%D1%96%7C%20B%5B%D0%94%D0%B5%D0%B3%D1%80%D0%B0%D0%B4%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20B%20--%3E%7C%D3%A8%D0%B7%D0%B3%D0%B5%D1%80%D1%96%D1%81%D1%82%D0%B5%D1%80%7C%20C%5B%D0%A1%D0%B0%D0%BF%D0%B0%20%D0%BA%D3%A9%D1%80%D1%81%D0%B5%D1%82%D0%BA%D1%96%D1%88%D1%82%D0%B5%D1%80%D1%96%5D%0A%20%20C%20--%3E%7C%D0%91%D0%B0%D2%9B%D1%8B%D0%BB%D0%B0%D1%83%7C%20D%5B%D0%96%D0%B0%D1%80%D0%B0%D0%BC%D0%B4%D1%8B%D0%BB%D1%8B%D2%9B%20%D0%BC%D0%B5%D1%80%D0%B7%D1%96%D0%BC%D1%96%5D%0A%20%20D%20--%3E%7C%D0%A8%D0%B5%D0%BA%D1%82%D0%B5%D1%83%7C%20E%5B%D2%9A%D0%B0%D1%83%D1%96%D0%BF%D1%81%D1%96%D0%B7%D0%B4%D1%96%D0%BA%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-safety.html\"&gt;Xavfsizlik va saqlash&lt;/a&gt; — Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-packaging.html\"&gt;Упаковка и миграция&lt;/a&gt; — Пластик, биоразлагаемые плёнки, миграция веществ в еду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-contaminants.html\"&gt;Загрязнители процесса&lt;/a&gt; — Акриламид, ПАУ, фуран: как образуются и как снизить.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbial.html\"&gt;Микробная безопасность&lt;/a&gt; — Патогены, биоплёнки, обеззараживание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergens.html\"&gt;Аллергены&lt;/a&gt; — Выявление и снижение аллергенности.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-shelf_life.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html\"&gt;Yorug'likdagi go'shtli yog' kutilganidan tezroq buziladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Pomidor va sitruslarni chirishdan asrovchi ko‘rinmas xitozan qoplamasi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html\"&gt;Do‘kon gazaklari va yarim tayyor taomlar: 8,8 mln kishilik tahlil sanoat ozuqasining asoratini ochdi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/isolation-and-identif
