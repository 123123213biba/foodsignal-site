        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-structure.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/spec-structure.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat teksturasi mahsulotning teginish, ko'rish va eshitish orqali seziladigan fizik xususiyatlarining yig'indisidir. U materialning ichki tuzilishi, komponentlarning taqsimlanishi va ular orasidagi o'zaro ta'sir kuchlari bilan belgilanadi. Tekstura fizikasi mahsulotlarning saqlash, issiqlik bilan ishlov berish va iste'mol qilish jarayonidagi xulq-atvorini bashorat qilishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-structure.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Tekstura reologiyaga, ya'ni materiyaning deformatsiyasi va oqimi haqidagi faniga asoslanadi. Oziq-ovqat mahsulotlari murakkab kolloid tizimlar: emulsiyalar, ko'piklar, gellar va kristallar hisoblanadi. Ushbu tuzilmalarning negizida karkas hosil qiluvchi yoki namlikni ushlab turuvchi makromolekulalar (oqsil, polisaxarid, lipid) yotadi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-structure.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat tuzilishi faza o'zgarishlari va molekulalararo bog'lanishlar orqali shakllanadi. Masalan, qizdirilganda oqsillar denaturatsiyaga uchraydi va suvni ushlab turuvchi uch o'lchamli tarmoq hosil qiladi, bu gel teksturasini yaratadi. Emulsiyalarda yog' tomchilari suvli muhitda taqsimlanadi, stabilizatorlar esa ularning birlashishiga yo'l qo'ymaydi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-structure.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Teksturani tahlil qilish uchun teksturaviy profil tahlili (TPA) kabi instrumental usullar qo'llaniladi, ular siqilish paytida namunaning qattiqligi, yopishqoqligi va elastikligini o'lchaydi. Reologik tadqiqotlar qovushqoqlik va oquvchanlik chegarasini aniqlaydi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-structure.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Teksturani boshqarish tamoyillari mahsulot sifatini yaxshilash uchun ishlatiladi. «Baliq qiyma tarkibidagi qovoq: sabzavot kukuni yordamida surimi teksturasini qanday yaxshilash mumkin» maqolasida o'simlik qo'shimchalari oqsil o'zaro ta'sirini o'zgartirib, qiyma zichligi va elastikligini qanday oshirishi tasvirlangan. «Sibas terisi: akvakultura chiqindilari qanday qilib yeyiladigan qadoqqa aylanadi» ishida esa oqsil matritsasining fizik xususiyatlari materialning mustahkamligini ta'minlaydigan biologik parchalanadigan plyonkalar yaratish ko'rib chiqiladi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/spec-structure.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov biologik tizimlarning murakkabligidadir: xomashyo tarkibi o'zgarishi mumkin, bu yakuniy natijaga ta'sir qiladi. Laboratoriya modellari sanoat ishlab chiqarish sharoitlarini har doim ham aniq takrorlamaydi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Tekstura va oziq-ovqat fizikasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%20%D1%82%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%D1%81%D1%8B%5D%20--%3E%20B%5B%D0%A0%D0%B5%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20B%20--%3E%20C%5B%D0%AD%D0%BC%D1%83%D0%BB%D1%8C%D1%81%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20B%20--%3E%20D%5B%D0%93%D0%B5%D0%BB%D1%8C%D0%B4%D0%B5%D1%80%5D%0A%20%20B%20--%3E%20E%5B%D0%9A%D1%80%D0%B8%D1%81%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%0A%20%20C%20--%3E%20F%5B%D0%A2%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D1%8B%D0%BB%D1%8B%D2%9B%5D%0A%20%20D%20--%3E%20F%0A%20%20E%20--%3E%20F%0A%20%20F%20--%3E%20G%5B%D0%A2%D2%B1%D1%82%D1%8B%D0%BD%D1%83%D1%88%D1%8B%D0%BB%D1%8B%D2%9B%20%D1%81%D0%B0%D0%BF%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-structure.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gels.html\"&gt;Гели и желе&lt;/a&gt; — Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-structure.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Aloe vera geli kesilgan mangoni yangi saqlashga yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html\"&gt;Sink va uglevodlar: baliqlar uchun ratsionni qanday to‘g‘rilash kerak&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html\"&gt;BFQlardagi kannabidiol kristallari: Yevropa regulyatori izolyat xavfsizligini tasdiqlamadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Baliq qiyma mahsulotlarini qovoq kukuni bilan yaxshilash siri&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Sibas terisi: baliqchilik chiqindilaridan yeyiladigan qadoqlar&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-structure.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/spa
