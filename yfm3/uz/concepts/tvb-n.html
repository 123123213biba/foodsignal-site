        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Atama&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/tvb-n.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Umumiy uchuvchan asosli azot (TVB-N) — go‘shtning yangiligini ko‘rsatuvchi ko‘rsatkich bo‘lib, u oqsil parchalanishi va bakteriyalar ko‘payishi natijasida hosil bo‘ladi. Past ko‘rsatkich mahsulot yangiligini bildiradi, 35 mg N/100 g normadan oshishi esa buzilishdan dalolat beradi.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/tvb-n.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Umumiy uchuvchi asosli azot (TVB-N) — bu oqsillarning parchalanishi va mikroorganizmlar hayotiy faoliyati natijasida hosil bo'ladigan azotli birikmalar konsentratsiyasini o'lchaydigan oziq-ovqat sifati ko'rsatkichidir. Oziq-ovqat sanoatida bu parametr go'sht, baliq va dengiz mahsulotlarining yangiligini aniqlash uchun asosiy indikator hisoblanadi. TVB-N ning yuqori qiymatlari mahsulotning buzilish jarayonlarini ko'rsatadi, bu esa uni oziq-ovqat xavfsizligini nazorat qilishning muhim vositasiga aylantiradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/tvb-n.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;TVB-N (Total Volatile Basic Nitrogen) ammiak, dimetilamin va trimetilamin kabi uchuvchi asoslarning yig'indisidir. Bu moddalar oqsillar va aminokislotalarning fermentativ parchalanishi hamda mahsulotning buzilishiga olib keladigan bakteriyalar metabolizmi natijasida hosil bo'ladi. Yangi go'shtda bu birikmalarning miqdori minimal bo'ladi. Saqlash jarayonida mikroflora va endogen fermentlar faolligi ortadi, bu esa uchuvchi azotli birikmalarning to'planishiga olib keladi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/tvb-n.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;TVB-N to'planish jarayoni mikrobiologik jarayonlarning rivojlanishi bilan bir vaqtda vaqt o'tishi bilan sodir bo'ladi. Oqsillar degradatsiyaga uchraganda, aminokislotalar ajralib chiqadi va bakteriyalar tomonidan dezaminatsiyalanadi. Natijada gaz fazasiga o'tishga qodir uchuvchi birikmalar hosil bo'ladi. Ushbu ko'rsatkichni o'lchash mahsulot holatini ob'ektiv baholash imkonini beradi. Ko'pgina go'sht mahsulotlari uchun normativ chegara 100 g mahsulotga 35 mg azot deb hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/tvb-n.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;TVB-N ni aniqlash uchun distillash va titrlash usullari qo'llaniladi. Mahsulot namunasi gomogenlanadi, so'ngra uchuvchi asoslar ishqor ishtirokida suv bug'i bilan haydash orqali ajratib olinadi. Olingan distillat umumiy azot miqdorini aniqlash uchun kislota eritmasi bilan titrlanadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/tvb-n.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;TVB-N ko'rsatkichi yangi konservatsiya usullarining samaradorligini baholash uchun ishlatiladi. «Greypfrut po'stlog'i tovuq burgerlarini qanday qilib uzoqroq saqlashga yordam beradi» maqolasida greypfrut ekstrakti qo'shilgan jelatin plyonkasi parchalanish mahsulotlarining to'planishini sekinlashtirishi va go'sht yangiligini 5 oyga uzaytirishi tasvirlangan. «Suyuq tutun va nanoemulsiya sous-vid midiyalarining yangiligini 24 kungacha uzaytiradi» tadqiqotida 85 °C haroratda ishlov berish, suyuq tutun va ultratovushli emulsiya kombinatsiyasi TVB-N o'sishini cheklashda samarali ekanligini ko'rsatadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavfli-jihatlar\"&gt;&lt;a href=\"concepts/tvb-n.html#cheklovlar-va-xavfli-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavfli jihatlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavfli jihatlar&lt;/h2&gt;\n&lt;p&gt;TVB-N integral ko'rsatkich bo'lib, u har doim ham buzilishni keltirib chiqargan mikroorganizmlarning aniq turini aniqlashga imkon bermaydi. TVB-N qiymatlari hayvon turiga, saqlash sharoitlariga va mahsulotning dastlabki ifloslanish darajasiga qarab farq qilishi mumkin. Bu usul laboratoriya jihozlarini talab qiladi va uy sharoitida foydalanish uchun ekspress-test hisoblanmaydi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: TVB-N&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%90%D2%9B%D1%83%D1%8B%D0%B7%5D%20--%3E%20B%5B%D0%91%D0%B0%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20B%20--%3E%20C%5B%D0%90%D0%BC%D0%B8%D0%BD%D2%9B%D1%8B%D1%88%D2%9B%D1%8B%D0%BB%D0%B4%D0%B0%D1%80%D1%8B%5D%0A%20%20C%20--%3E%20D%5B%D2%B0%D1%88%D0%BF%D0%B0%20%D0%BD%D0%B5%D0%B3%D1%96%D0%B7%D0%B4%D0%B5%D1%80%5D%0A%20%20D%20--%3E%20E%5BTVB-N%20%D0%BA%D3%A9%D1%80%D1%81%D0%B5%D1%82%D0%BA%D1%96%D1%88%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%A1%D0%B0%D0%BF%D0%B0%D0%BD%D1%8B%20%D0%B1%D0%B0%D2%93%D0%B0%D0%BB%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasdig'ini kutmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"malumot\"&gt;&lt;a href=\"concepts/tvb-n.html#malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumot&lt;/span&gt;&lt;/a&gt;Ma'lumot&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;единицы&lt;/td&gt;\n&lt;td&gt;мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;значение для 4% грейпфрута&lt;/td&gt;\n&lt;td&gt;11,20 мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;критический_норматив&lt;/td&gt;\n&lt;td&gt;35 мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"boshqa-nomlari\"&gt;&lt;a href=\"concepts/tvb-n.html#boshqa-nomlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa nomlari&lt;/span&gt;&lt;/a&gt;Boshqa nomlari&lt;/h2&gt;\n&lt;p&gt;total volatile basic nitrogen, летучий базисный азот, общее содержание летучих основных азотистых соединений, общий летучий базисный азот, общий летучий основной азот&lt;/p&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/tvb-n.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Sitrus po‘stlog‘i tovuq kotletlarini uzoqroq saqlashga qanday yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Suyuq tutun va nanoemulsiya sous-vide midiyalarining saqlanishini 24 kunga uzaytiradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/tvb-n.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Hello_Kitty\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hello Kitty — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/foods7100170\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Alginate-Based Edible Films and Coatings for Food Packaging Applications&lt;/a&gt; — sharh, Foods 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fnut.2022.1040259\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Impacts of turmeric and its principal bioactive curcumin on human health: Pharmaceutical, medicinal, and food applications: A comprehensive review&lt;/a&gt; — sharh, Front Nutr 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/antiox13081001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Potential Health Benefits of Gallic Acid: Therapeutic and Food Applications&lt;/a&gt; — sharh, Antioxidants (Basel) 2024&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Umumiy uchuvchan asosli azot (TVB-N) — go‘shtning yangiligini ko‘rsatuvchi ko‘rsatkich bo‘lib, u oqsil parchalanishi va bakteriyalar ko‘payishi natijasida hosil"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"TVB-N","description":"Umumiy uchuvchan asosli azot (TVB-N) — go‘shtning yangiligini ko‘rsatuvchi ko‘rsatkich bo‘lib, u oqsil parchalanishi va bakteriyalar ko‘payishi natijasida hosil","vcsPath":"concepts/tvb-n.md"},"headings":[{"title":"Ta'rif","href":"concepts/tvb-n.html#tarif","level":2},{"title":"Umumiy ko'rinish","href":"concepts/tvb-n.html#umumiy-korinish","level":2},{"title":"Nazariya","href":"concepts/tvb-n.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/tvb-n.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/tvb-n.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/tvb-n.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavfli jihatlar","href":"concepts/tvb-n.html#cheklovlar-va-xavfli-jihatlar","level":2},{"title":"Ma'lumot","href":"concepts/tvb-n.html#malumot","level":2},{"title":"Boshqa nomlari","href":"concepts/tvb-n.html#boshqa-nomlari","level":2},{"title":"Qayerda uchraydi","href":"concepts/tvb-n.html#qayerda-uchraydi","level":2},{"title":"Manbalar","href":"concepts/tvb-n.html#manbalar","level":2}],"title":"TVB-N"},"router":{"pathname":"concepts/tvb-n","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
