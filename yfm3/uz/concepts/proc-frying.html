            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Oil uptake and crust formation of potato strips in deep frying and air frying&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-frying.jpg\" alt=\"Жарка во фритюре и аэрогриле\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Algont at Dutch Wikipedia, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Frituurpan-gesloten.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-frying.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-frying.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Friturda qovurish va aerogrilda pishirish — bu mahsulotlarga qarsildoq qobiq berish va teksturasini o'zgartirishga qaratilgan termik ishlov berish jarayonlari. Fritur mahsulotni qizdirilgan yog'ga to'liq botirishni nazarda tutsa, aerogril issiq havo konveksiyasidan foydalanadi. Ikkala usul ham oziq-ovqatning fizik-kimyoviy xossalariga, jumladan namlik, lipidlar miqdori va o'ziga xos birikmalarning hosil bo'lishiga sezilarli ta'sir ko'rsatadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-frying.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Ikkala jarayonning negizida Mayyar reaksiyasi yotadi — bu aminokislotalar va qandlar o'rtasidagi kimyoviy o'zaro ta'sir bo'lib, 140 °C dan yuqori haroratda sodir bo'ladi. Natijada qobiqning o'ziga xos rangi, hidi va ta'mi shakllanadi. Fritur issiqlik o'tkazuvchi muhit sifatida yog'dan foydalanadigan issiqlik bilan ishlash turi hisoblanadi. Aerogril esa issiq havo oqimi yordamida konveksion isitish turidir.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-frying.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Friturda qovurilganda yog' mahsulotning sirt qatlamlariga kirib boradi va bug'lanayotgan namlik o'rnini egallaydi. Aerogrilda esa kuchli havo oqimi sirt namligini tezda yo'qotib, yog'ning chuqur kirib borishisiz qobiq hosil qiladi. Ikkala holatda ham haroratni nazorat qilish muhim, chunki kraxmalli mahsulotlarda akrilamid hosil bo'lishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-asboblar\"&gt;&lt;a href=\"concepts/proc-frying.html#usullar-va-asboblar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va asboblar&lt;/span&gt;&lt;/a&gt;Usullar va asboblar&lt;/h2&gt;\n&lt;p&gt;Friturnitsa — yog' haroratini barqaror saqlaydigan qovurish apparati. Aerogril — mahsulot atrofida issiq havoni aylantiruvchi ventilyatorli qurilma. Usullarning samaradorligi organoleptik ko'rsatkichlar va kimyoviy tarkib bo'yicha baholanadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-frying.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Texnologiyalar turli mahsulotlarni tayyorlashda ishlatiladi. Masalan, «Xrustashie lichinki palmovogo dolgonosika: belkoviy kontsentrat s neojidannimi riskami» maqolasida qovurish va pishirish lichinkalardagi oqsil ulushini ikki barobar oshirishi, ammo og'ir metallar to'planishi xavfi tufayli ehtiyotkorlik talab qilishi ko'rsatilgan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-frying.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Friturning asosiy cheklovi — tayyor mahsulotdagi yog' miqdorining yuqoriligi. Aerogril kaloriya miqdorini kamaytirishga imkon beradi, ammo qizib ketganda akrilamid hosil bo'lishini istisno etmaydi. Termik ishlov berish xomashyodagi og'ir metallar kabi kimyoviy ifloslantiruvchilarni zararsizlantirmasligini yodda tutish kerak.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Жарка во фритюре и аэрогриле&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%20--%3E%20B%5B%D0%A2%D0%B5%D0%BF%D0%BB%D0%BE%D0%B2%D0%B0%D1%8F%20%D0%BE%D0%B1%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D0%BA%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%A4%D1%80%D0%B8%D1%82%D1%8E%D1%80%5D%0A%20%20B%20--%3E%20D%5B%D0%90%D1%8D%D1%80%D0%BE%D0%B3%D1%80%D0%B8%D0%BB%D1%8C%5D%0A%20%20C%20--%3E%20E%5B%D0%A0%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%20%D0%9C%D0%B0%D0%B9%D1%8F%D1%80%D0%B0%5D%0A%20%20D%20--%3E%20E%0A%20%20E%20--%3E%20F%5B%D0%A5%D1%80%D1%83%D1%81%D1%82%D1%8F%D1%89%D0%B0%D1%8F%20%D0%BA%D0%BE%D1%80%D0%BE%D1%87%D0%BA%D0%B0%5D%0A%20%20C%20--%3E%20G%5B%D0%92%D0%BF%D0%B8%D1%82%D1%8B%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B0%D1%81%D0%BB%D0%B0%5D%0A%20%20D%20--%3E%20H%5B%D0%9A%D0%BE%D0%BD%D0%B2%D0%B5%D0%BA%D1%86%D0%B8%D1%8F%20%D0%B2%D0%BE%D0%B7%D0%B4%D1%83%D1%85%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-frying.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-frying.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html\"&gt;Qancha yeganingizni aniq bilish: raqamli oziq-ovqat atlasi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/nutritional-composition-chemical-safety-and-microbiological.html\"&gt;Palma uzunburun qurtlari: oqsilga boy qarsildoq luqma va uning yashirin xavflari&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-frying.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D1%80%D0%B
