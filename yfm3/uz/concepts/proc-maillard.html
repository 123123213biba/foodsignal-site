        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Maillard browning and pyrazine formation in roasted barley&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-maillard.jpg\" alt=\"Реакция Майяра и карамелизация\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: J. Patrick Fischer, CC BY 2.5&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Creme_brulee.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-maillard.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-maillard.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Maillard reaksiyasi va karamellanish — oziq-ovqat mahsulotlarini termik qayta ishlashning ikki asosiy jarayoni bo'lib, ular mahsulotning rangi, ta'mi va hidini shakllantiradi. Ikkala jarayon ham fermentativ bo'lmagan qizarishga kiradi va qizdirilganda yuz beradi, ammo ular kimyoviy mexanizmlari va zarur sharoitlari bilan farqlanadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-maillard.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Maillard reaksiyasi — bu qizdirilganda qaytaruvchi shakar va aminokislotalar yoki oqsillarning o'zaro ta'siri jarayoni bo'lib, natijada murakkab aromatik birikmalar va melanoidinlar hosil bo'ladi. U karamellanishga qaraganda pastroq haroratlarda kechadi va non, go'sht va qahvaning qovurilgan ta'mini shakllantirish uchun javobgardir.&lt;/p&gt;\n&lt;p&gt;Karamellanish — bu aminokislotalar bo'lmagan sharoitda shakarlarning termik parchalanish jarayoni bo'lib, natijada karamelanlar va karamelinlar hosil bo'ladi. Bu jarayon yuqoriroq haroratni (odatda 150 °C dan yuqori) talab qiladi. Ikkala jarayon ham ta'm va hidni o'rganishning kengroq sohasiga kiradi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-maillard.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Maillard reaksiyasi shakar va aminoguruhning kondensatsiyasi bilan boshlanadi, bu esa pirazinlar kabi oraliq mahsulotlarning hosil bo'lishiga olib keladi. Reaksiya tezligi muhitning pH darajasi, harorat va namlikka bog'liq.&lt;/p&gt;\n&lt;p&gt;Karamellanish mahsulotdan erkin suvni chiqarib tashlashni talab qiladi. Namlik bug'lanib ketguncha sirt harorati 100 °C atrofida qoladi, bu karamellanish uchun yetarli emas. Sirt qurigandan keyingina harorat ko'tarilib, shakar degradatsiyasi jarayoni boshlanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-maillard.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Ushbu jarayonlar natijalarini tahlil qilish uchun gaz xromatografiyasi va mass-spektrometriya usullari qo'llaniladi. Zamonaviy tadqiqotlar yuqori sezgir sensorlarni yaratishga qaratilgan. Masalan, «Qovurilgan hidni qanday tutish kerak: pirazinlarni aniqlash uchun yangi biosensor» maqolasida inson retseptorlari asosidagi «elektron burun» ishlab chiqilgani tasvirlangan.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-maillard.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Maillard reaksiyasi va karamellanishni boshqarish texnologiyalari oziq-ovqat sanoatida mahsulotlarning ta'm sifatini standartlashtirish uchun ishlatiladi. Bu jarayonlarni tushunish qahva donalarini qovurish, non mahsulotlarini pishirish va qandolat mahsulotlarini ishlab chiqarishda hid intensivligini nazorat qilish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-maillard.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov — bu uy sharoitida isitishning notekisligi tufayli reaksiyalarni nazorat qilishning qiyinligidir. Haddan tashqari qizdirish istalmagan qo'shimcha mahsulotlarning hosil bo'lishiga olib kelishi mumkin. Termik ishlov berilgan mahsulotlarning sog'liqqa ta'siri bo'yicha ma'lumotlar hali ham o'rganilmoqda.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Реакция Майяра и карамелизация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9D%D0%B0%D0%B3%D1%80%D0%B5%D0%B2%5D%20--%3E%20B%5B%D0%A0%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%20%D0%9C%D0%B0%D0%B9%D1%8F%D1%80%D0%B0%5D%0A%20%20A%20--%3E%20C%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20D%5B%D0%9F%D0%B8%D1%80%D0%B0%D0%B7%D0%B8%D0%BD%D1%8B%5D%0A%20%20B%20--%3E%20E%5B%D0%9C%D0%B5%D0%BB%D0%B0%D0%BD%D0%BE%D0%B8%D0%B4%D0%B8%D0%BD%D1%8B%5D%0A%20%20C%20--%3E%20F%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B0%D0%BD%D1%8B%5D%0A%20%20C%20--%3E%20G%5B%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B5%D0%BD%D1%8B%5D%0A%20%20D%20--%3E%20H%5B%D0%90%D1%80%D0%BE%D0%BC%D0%B0%D1%82%5D%0A%20%20E%20--%3E%20I%5B%D0%A6%D0%B2%D0%B5%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-maillard.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-maillard.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Qovurilgan mahsulotlar hidi: pirazinlarni aniqlovchi yangi biosensor&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-maillard.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9A%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D0%BB%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Карамелизация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Creme_brulee.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: J. Patrick Fischer, CC BY 2.5&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — sharh, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001209\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2024 Heart Disease and Stroke Statistics: A Report of US and Global Data From the American Heart Association&lt;/a&gt; — sharh, Circulation 2024&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/gutjnl-2021-326789\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gut microbiome and health: mechanistic insights&lt;/a&gt; — sharh, Gut 2022&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Реакция Майяра и карамелизация","description":"Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.","vcsPath":"concepts/proc-maillard.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-maillard.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/proc-maillard.html#
