        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Usul&lt;/strong&gt; · &lt;em&gt;Extrusion&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Coyau, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/extrusion.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Ekstruziya — bu oziq-ovqat tarkibiy qismlarining tuzilishini o'zgartirish uchun yuqori harorat va bosim ostida doimiy aralashtirish va qorishtirish jarayoni. Texnologiya gazaklar, quruq nonushtalar va o'simlik oqsillaridan teksturatlar ishlab chiqarishda qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/extrusion.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Ekstruziya — bu oziq-ovqat xomashyosini shakl beruvchi teshikdan o‘tkazish jarayonida uzluksiz aralashtirish, siqish va termik ishlov berish jarayoni. Texnologiya ingredientlarning fizik-kimyoviy xossalarini o‘zgartirib, belgilangan tekstura va tuzilishga ega mahsulotlarni yaratishga imkon beradi. Oziq-ovqat sanoatida ushbu usul kukunsimon yoki qovushqoq aralashmalarni tayyor mahsulotlarga, masalan, sneklar, quruq nonushtalar yoki teksturalangan o‘simlik oqsillariga aylantiradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/extrusion.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Ekstruziya chegaralangan makon sharoitida materialga mexanik kuch qo‘llash tamoyiliga asoslanadi. Ekstruder ichida xomashyo siquvchi va siljituvchi kuchlanishlarga duchor bo‘ladi. Yuqori harorat va bosim oqsillarning denaturatsiyasiga va kraxmalning jelatinlanishiga olib keladi. Bu jarayonlar komponentlarning molekulyar arxitekturasini o‘zgartiradi, bu esa ularning funksionalligi, hazm bo‘lishi va sensor xususiyatlariga ta’sir qiladi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/extrusion.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Jarayon xomashyoni yuklash bunkeriga berishdan boshlanadi. Silindrsimon korpus ichida shnek aylanadi va massani asta-sekin zichlab oldinga suradi. Harakatlanish jarayonida material ishqalanish va tashqi isitish elementlari hisobiga qiziydi. Yuqori bosim zonasida intensiv aralashtirish sodir bo‘ladi. Chiqishda massa matritsa (filyera) orqali bosib chiqariladi. Matritsadan chiqishda bosimning keskin pasayishi mahsulotning kengayishiga va g‘ovakli tuzilish hosil bo‘lishiga olib keladi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/extrusion.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vosita — ekstruder. U elektr dvigatel, uzatish tizimi, bir yoki ikki shnekli silindr va matritsadan iborat. Zamonaviy tizimlar jarayon parametrlarini real vaqt rejimida nazorat qilish imkonini beruvchi harorat va bosim datchiklari bilan jihozlangan.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/extrusion.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Texnologiya mahsulot xossalarini modifikatsiya qilish uchun ishlatiladi. «Ekstruziya qandli cho‘qqiga qarshi: xomashyoni qayta ishlash shokoladning o‘zlashtirilishini qanday o‘zgartiradi» maqolasida shakar va sutni dastlabki ekstruziya qilish organizmning glikemik javobiga ta’sir qilishi ko‘rsatilgan. Shuningdek, «Yasmiq va no‘xatdagi yashirin xavf: mog‘or o‘simlik oqsilini qanday o‘zgartiradi» maqolasida dukkakli ekinlar bilan ishlashda xomashyo sifatini nazorat qilish muhimligi ta’kidlanadi, chunki mikotoksinlar ishlov berilgandan keyin ham izolyatlarda qolishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/extrusion.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Ekstruziya yuqori energiya talab qiladigan jarayon bo‘lib, harorat rejimlariga qat’iy rioya qilishni talab qiladi. Noto‘g‘ri parametrlar ozuqa moddalarining degradatsiyasiga yoki ta’mning istalmagan o‘zgarishlariga olib kelishi mumkin. Bundan tashqari, texnologiya xomashyoda mavjud bo‘lgan mikotoksinlar kabi biologik ifloslanishlarni to‘liq zararsizlantira olmaydi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Экструзия&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A8%D0%B8%D0%BA%D1%96%D0%B7%D0%B0%D1%82%20%D0%B1%D0%B5%D1%80%D1%83%5D%20--%3E%20B%5B%D0%A8%D0%BD%D0%B5%D0%BA%D0%BF%D0%B5%D0%BD%20%D1%81%D1%8B%D2%93%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%A2%D0%B5%D1%80%D0%BC%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D3%A9%D2%A3%D0%B4%D0%B5%D1%83%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%20%D0%B0%D1%80%D2%9B%D1%8B%D0%BB%D1%8B%20%D0%BF%D1%96%D1%88%D1%96%D0%BD%D0%B4%D0%B5%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D2%9A%D1%8B%D1%81%D1%8B%D mog‘or o‘simlik oqsilini qanday buzadi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt; · &lt;a href=\"reference/methods.html\"&gt;Usullar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/extrusion.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Extrusion\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extrusion — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — sharh, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/bjc.1972.33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a basic biological phenomenon with wide-ranging implications in tissue kinetics&lt;/a&gt; — sharh, Br J Cancer 1972&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm2330\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Membrane lipids: where they are and how they behave&lt;/a&gt; — sharh, Nat Rev Mol Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ekstruziya — bu oziq-ovqat tarkibiy qismlarining tuzilishini o'zgartirish uchun yuqori harorat va bosim ostida doimiy aralashtirish va qorishtirish jarayoni. Te"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"titl
