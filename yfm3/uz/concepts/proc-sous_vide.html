        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Sous vide cooking of beef loin: time and temperature for tenderness&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-sous_vide.jpg\" alt=\"Sous vide и низкотемпературная готовка\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Pedro.serna, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Sous_Vide_Cooking.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Точная температура, долгое время: мясо, рыба, яйца.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Sous vide — bu mahsulot germetik o‘ramga joylanib, uzoq vaqt davomida aniq nazorat qilinadigan haroratdagi suv hammomida termik ishlov beriladigan pishirish jarayoni. Bu usul past haroratli, uzoq muddatli pishirish (LTLT) sifatida ham tanilgan. An’anaviy usullardan farqli o‘laroq, bu yerda muhit harorati mahsulotning maqsadli haroratiga teng bo‘ladi, bu esa butun mahsulot bo‘ylab bir xil pishish darajasiga erishish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Sous vide suyuq muhit orqali issiqlik o‘tkazish prinsipiga asoslanadi. An’anaviy qovurish usullarida mahsulot yuzasi va markazi o‘rtasidagi harorat farqi katta bo‘lib, bu tashqi qatlamlarning quriб qolishiga olib keladi. Sous vide usulida suv harorati mahsulot ichidagi kerakli haroratga tenglashtiriladi, bu esa oqsillar va fermentlarning yumshoq holatga kelishini ta’minlaydi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Jarayon uch bosqichdan iborat: mahsulotni tayyorlash, vakuumlash va termik ishlov berish. Mahsulot polimer paketga joylanadi va havo chiqarib tashlanadi, bu oksidlanishning oldini oladi. So‘ngra paket termostatga tushiriladi, u yerda suv sirkulyatsiyasi haroratni aniq ushlab turadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-asboblar\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#usullar-va-asboblar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va asboblar&lt;/span&gt;&lt;/a&gt;Usullar va asboblar&lt;/h2&gt;\n&lt;p&gt;Asosiy asbob — immersion sirkulyator (termostat). U isitish elementi, harorat datchigi va suvni aralashtirib turadigan nasosdan iborat. Paketlarni vakuumlash uchun maxsus vakuum qadoqlash uskunalari qo‘llaniladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Texnologiya go‘sht, baliq va tuxumni pishirishda ishlatiladi. «Jidkiy dym i nanoemulsiya prodlevayut svezhest midiy su-vid do 24 dney» maqolasida mollyuskalarni 85 °C haroratda qayta ishlash va saqlash muddatini uzaytirish usullari tasvirlangan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov — noto‘g‘ri harorat rejimida anaerob bakteriyalarning ko‘payish xavfi. Past haroratlarda (55 °C dan past) mikroblar ko‘payishining oldini olish uchun vaqtni qat’iy nazorat qilish kerak. Shuningdek, usul Mayyar reaksiyasini ta’minlamaydi, shuning uchun qarsildoq qobiq hosil qilish uchun qo‘shimcha ishlov berish talab etiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Sous vide и низкотемпературная готовка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%20%D0%B2%20%D0%BF%D0%B0%D0%BA%D0%B5%D1%82%D0%B5%5D%20--%3E%20B%5B%D0%92%D0%B0%D0%BA%D1%83%D1%83%D0%BC%D0%BD%D1%8B%D0%B9%20%D1%83%D0%BF%D0%B0%D0%BA%D0%BE%D0%B2%D1%89%D0%B8%D0%BA%5D%0A%20%20B%20--%3E%20C%5B%D0%92%D0%BE%D0%B4%D1%8F%D0%BD%D0%B0%D1%8F%20%D0%B1%D0%B0%D0%BD%D1%8F%5D%0A%20%20D%5B%D0%98%D0%BC%D0%BC%D0%B5%D1%80%D1%81%D0%B8%D0%BE%D0%BD%D0%BD%D1%8B%D0%B9%20%D1%86%D0%B8%D1%80%D0%BA%D1%83%D0%BB%D1%8F%D1%82%D0%BE%D1%80%5D%20--%3E%7C%D0%BD%D0%B0%D0%B3%D1%80%D0%B5%D0%B2%20%D0%B8%20%D1%86%D0%B8%D1%80%D0%BA%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%7C%20C%0A%20%20C%20--%3E%20E%5B%D0%93%D0%BE%D1%82%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A%20%20E%20--%3E%20F%5B%D0%A4%D0%B8%D0%BD%D0%B8%D1%88%D0%BD%D0%B0%D1%8F%20%D0%BE%D0%B1%D0%B6%D0%B0%D1%80%D0%BA%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Suyuq tutun va nanoemulsiya sous-vide midiyalarining saqlanishini 24 kunga uzaytiradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Sous_vide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sous vide — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Sous_Vide_Cooking.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Pedro.serna, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.00228-20\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tools and Techniques for Severe Acute Respiratory Syndrome Coronavirus 2 (SARS-CoV-2)/COVID-19 Detection&lt;/a&gt; — sharh, Clin Microbiol Rev 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu14030453\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effect of Dietary Protein and Processing on Gut Microbiota-A Systematic Review&lt;/a&gt; — sharh, Nutrients 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/foods9091334\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of Sensory Evaluation in Consumer Acceptance of Plant-Based Meat Analogs and Meat Extenders: A Scoping Review&lt;/a&gt; — sharh, Foods 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Точная температура, долгое время: мясо, рыба, яйца."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Sous vide и низкотемпературная готовка","description":"Точная температура, долгое время: мясо, рыба, яйца.","vcsPath":"concepts/proc-sous_vide.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-sous_vide.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/proc-sous_vide.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/proc-sous_vide.html#nazariya","level":2},{"title":"Qanday ishlaydi","href":"concepts/proc-sous_vide.html#qanday-ishlaydi","level":2},{"title":"Usullar va asboblar","href":"concepts/proc-sous_vide.html#usullar-va-asboblar","level":2},{"title":"Qayerda qo‘llaniladi","href":"concepts/proc-sous_vide.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavflar","href":"concepts/proc-sous_vide.html#cheklovlar-va-xavflar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/proc-sous_vide.html#bogliq-tushunchalar","level":2},{"title":"Qayerda uchraydi","href":"concepts/proc-sous_vide.
