        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Atama&lt;/strong&gt; · &lt;em&gt;Ultra-processed foods&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;O‘ta qayta ishlangan oziq-ovqat mahsulotlari (UPF) — bu tarkibida tuz, shakar, gidrogenlangan yog‘lar va ko‘p komponentli texnologik qo‘shimchalar yuqori bo‘lgan iste’molga tayyor mahsulotlardir.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Ultra-qayta ishlangan oziq-ovqat mahsulotlari (UPF) — bu besh va undan ortiq ingredientlardan iborat bo'lgan, tarkibida oqsil izolyatlari, gidrogenlangan yog'lar, qo'shilgan shakar, bo'yoqlar, xushbo'ylashtiruvchi moddalar va emulsifikatorlar mavjud bo'lgan sanoat mahsulotlari. Bunday mahsulotlar ta'mi, tuzilishi va saqlash muddatini o'zgartirishga qaratilgan chuqur texnologik ishlovdan o'tadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;UPF tushunchasi NOVA tasnifiga asoslanadi, u oziq-ovqat mahsulotlarini sanoat qayta ishlash darajasiga ko'ra to'rt guruhga ajratadi. Ultra-qayta ishlash ushbu ierarxiyaning eng yuqori bosqichidir. UPF ning asosiy farqi shundaki, unda uy sharoitida ishlatilmaydigan moddalar qo'llaniladi va xomashyoning tabiiy hujayra tuzilishi buziladi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;UPF ishlab chiqarish — bu xomashyoni ko'p bosqichli qayta ishlash jarayoni: ekstruziya, fraksiyalash va komponentlarni kimyoviy modifikatsiya qilish. Natijada yuqori energiya zichligiga ega bo'lgan mahsulot olinadi. Ko'p komponentli qo'shimchalar go'sht yoki sut mahsulotlari kabi tabiiy mahsulotlarning ta'mi va tuzilishini taqlid qilish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Mahsulotlarni qayta ishlash darajasini baholash uchun tadqiqotchilar NOVA tasnifidan foydalanadilar. Zamonaviy tadqiqotlarda sun'iy intellekt algoritmlari ham qo'llaniladi, ular oziq-ovqat mahsulotlarini avtomatik tasniflash uchun tasvirlar va ingredientlar ro'yxatini tahlil qiladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;UPF tushunchasi aholi salomatligiga ovqatlanishning ta'sirini baholash uchun epidemiologik tadqiqotlarda faol qo'llaniladi. «Xrustyaschie sneki i gotovaya yeda: metaanaliz na 8,8 mln chelovek pokazal skrytuyu cenu ultraobrabotki» maqolasida har kuni 100 gramm ortiqcha ultra-qayta ishlangan ovqat iste'mol qilish yurak-qon tomir kasalliklari xavfini 14 foizga oshirishi ko'rsatilgan. Shuningdek, «Neyroseti protiv dietologov: komu doverit proverku detskoy tarelki» maqolasida sun'iy intellektning bolalar ratsionidagi mahsulotlarni tahlil qilishdagi o'rni yoritilgan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;UPF bo'yicha ma'lumotlarning aksariyati kuzatuv tadqiqotlaridan olingan, bu esa sabab-oqibat bog'liqligini emas, balki korrelyatsiyani anglatadi. Shuningdek, NOVA tasnifi alohida komponentlarning ozuqaviy qiymatini hisobga olmaydi, bu esa natijalarni talqin qilishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Ультраобработанные пищевые продукты&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%A2%D0%B5%D1%85%D0%BD%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F%20%D0%BE%D0%B1%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D0%BA%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%98%D0%B7%D0%BE%D0%BB%D1%8F%D1%82%D1%8B%20%D0%B8%20%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8%5D%0A%20%20C%20--%3E%20D%5B%D0%A3%D0%BB%D1%8C%D1%82%D1%80%D0%B0%D0%BE%D0%B1%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D0%B0%D0%BD%D0%BD%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A%20%20D%20--%3E%20E%5B%D0%92%D1%8B%D1%81%D0%BE%D0%BA%D0%B0%D1%8F%20%D0%B2%D0%BA%D1%83%D1%81%D0%BE%D0%B2%D0%B0%D1%8F%20%D0%BF%D1%80%D0%B8%D0%B2%D0%BB%D0%B5%D0%BA%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D1%8C%5D%0A%20%20D%20--%3E%20F%5B%D0%94%D0%BB%D0%B8%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D1%81%D1%80%D0%BE%D0%BA%20%D1%85%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20G%5B%D0%A0%D0%B8%D1%81%D0%BA%20%D0%B4%D0%BB%D1%8F%20%D0%B7%D0%B4%D0%BE%D1%80%D0%BE%D0%B2%D1%8C%D1%8F%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasdig'ini kutmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"boshqa-nomlari\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#boshqa-nomlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa nomlari&lt;/span&gt;&lt;/a&gt;Boshqa nomlari&lt;/h2&gt;\n&lt;p&gt;UPF, УПП, Ультраобработанные продукты, уровень ультраобработки&lt;/p&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html\"&gt;Do‘kon gazaklari va yarim tayyor taomlar: 8,8 mln kishilik tahlil sanoat ozuqasining asoratini ochdi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html\"&gt;Sun'iy intellekt bolalar taomnomasini tekshirishda mutaxassislarga yuta oladimi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/ultra-processed-foods.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Beyond_Meat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Beyond Meat — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — sharh, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41591-019-0675-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Chronic inflammation in the etiology of disease across the life span&lt;/a&gt; — sharh, Nat Med 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/j.1753-4887.2011.00456.x\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global nutrition transition and the pandemic of obesity in developing countries&lt;/a&gt; — sharh, Nutr Rev 2012&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"O‘ta qayta ishlangan oziq-ovqat mahsulotlari (UPF) — bu tarkibida tuz, shakar, gidrogenlangan yog‘lar va ko‘p komponentli texnologik qo‘shimchalar yuqori bo‘lga"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Ультраобработанные пищевые продукты","description":"O‘ta qayta ishlangan oziq-ovqat mahsulotlari (UPF) — bu tarkibida tuz, shakar, gidrogenlangan yog‘lar va ko‘p komponentli texnologik qo‘shimchalar yuqori bo‘lga","vcsPath":"concepts/ultra-processed-foods.md"},"headings":[{"title":"Ta'rif","href":"concepts/ultra-processed-foods.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/ultra-processed-foods.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/ultra-processed-foods.html#nazariya","level":2},{"title":"Qanday ishlaydi","href":"concepts/ultra-processed-foods.html#qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/ultra-processed-foods.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/ultra-processed-foods.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavflar","href":"concepts/ultra-processed-foods.html#cheklovlar-va-xavflar","level":2},{"title":"Boshqa nomlari","href":"concepts/ultra-processed-f
