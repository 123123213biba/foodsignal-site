        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Gel strength of gelatin and agar desserts&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-gels.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-gels.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Jellar — bu polimer karkas va erituvchidan tashkil topgan, shaklini saqlab qolish va deformatsiyaga qarshilik ko'rsatish kabi qattiq jismlar xususiyatlariga ega bo'lgan tizimlar. Oziq-ovqat sanoatida jellanish — bu suyuq komponentlarning harorat, pH yoki maxsus qo'shimchalar ta'sirida yarim qattiq yoki qattiq tuzilmalarga aylanish jarayonidir.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-gels.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Jel — bu dispers tizim bo'lgan moddiy mohiyatdir. Jel asosi makromolekulalarning (oqsil yoki polisaxaridlar) uch o'lchamli to'ridan iborat bo'lib, u o'z ichida past molekulyar erituvchini, ko'pincha suvni ushlab turadi. Jel mustahkamligi — bu karkas ichidagi bog'lanishlar zichligi bilan belgilanadigan sifatdir.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-gels.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Jellanish jarayoni polimer molekulalarining denaturatsiyasi yoki faollashuvi bilan boshlanadi. Isitish yoki kimyoviy muhit o'zgarganda, oqsil yoki kraxmal molekulalari ochilib, bir-biri bilan o'zaro ta'sir qila boshlaydi va to'r tugunlarini hosil qiladi. Ushbu tugunlar konsentratsiyasi kritik darajaga yetganda, tizim oquvchanligini yo'qotadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-gels.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Jellar sifatini baholash uchun materialning viskoelastik xususiyatlarini o'lchaydigan reologiya usullari qo'llaniladi. Asosiy vosita — bu jel tuzilishini buzish uchun zarur bo'lgan kuchni o'lchaydigan tekstura analizatoridir.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-gels.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Jellanish texnologiyalari yangi oziq-ovqat mahsulotlarini yaratish uchun muhimdir. «Тыква в рыбном фарше: как улучшить текстуру сурими с помощью овощного порошка» maqolasida o'simlik komponentlari baliq qiyma oqsil karkasini mustahkamlashda qanday ishtirok etishi tasvirlangan. «Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку» tadqiqotida baliq terisidan olingan kollagen qanday qilib mustahkam biologik parchalanadigan plyonka hosil qilishi ko'rsatilgan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/proc-gels.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Jellar tashqi sharoitlarga sezgir. Harorat o'zgarishi sinerezisga — polimer to'rining siqilishi tufayli jeldan suyuqlik ajralib chiqish jarayoniga olib kelishi mumkin. Shuningdek, jel mustahkamligi kimyoviy tarkib bilan cheklangan: tuzlar yoki kislotalikning o'zgarishi molekulalararo bog'lanishlarni buzishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Гели и желе&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%BB%D0%B5%D1%80%5D%20--%3E%7C%D0%91%D0%B0%D0%B9%D0%BB%D0%B0%D0%BD%D1%8B%D1%81%D1%83%7C%20B%5B%D2%AE%D1%88%20%D3%A9%D0%BB%D1%88%D0%B5%D0%BC%D0%B4%D1%96%20%D1%82%D0%BE%D1%80%5D%0A%20%20B%20--%3E%7C%D0%95%D1%80%D1%96%D1%82%D0%BA%D1%96%D1%88%D1%82%D1%96%20%D2%B1%D1%81%D1%82%D0%B0%D1%83%7C%20C%5B%D0%93%D0%B5%D0%BB%D1%8C%20%D2%9B%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%D1%8B%5D%0A%20%20C%20--%3E%7C%D0%A2%D0%B5%D0%BC%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D1%83%D1%80%D0%B0%20%D3%99%D1%81%D0%B5%D1%80%D1%96%7C%20D%5B%D0%94%D0%B5%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%D2%93%D0%B0%20%D1%82%D3%A9%D0%B7%D1%96%D0%BC%D0%B4%D1%96%D0%BB%D1%96%D0%BA%5D%0A%20%20C%20--%3E%7C%D0%A1%D1%8B%D1%80%D1%82%D2%9B%D1%8B%20%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D1%80%D0%BB%D0%B0%D1%80%7C%20E%5B%D0%A1%D0%B8%D0%BD%D0%B5%D1%80%D0%B5%D0%B7%D0%B8%D1%81%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-gels.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structure.html\"&gt;Tekstura va oziq-ovqat fizikasi&lt;/a&gt; — Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-gels.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Aloe vera geli kesilgan mangoni yangi saqlashga yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Baliq qiyma mahsulotlarini qovoq kukuni bilan yaxshilash siri&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Sibas terisi: baliqchilik chiqindilaridan yeyiladigan qadoqlar&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-gels.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D0%BB%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Гели — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm.2017.7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Biomolecular condensates: organizers of cellular biochemistry&lt;/a&gt; — sharh, Nat Rev Mol Cell Biol 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41573-020-0090-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Engineering precision nanoparticles for drug delivery&lt;/a&gt; — sharh, Nat Rev Drug Discov 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cell.2007.06.009\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;AKT/PKB signaling: navigating downstream&lt;/a&gt; — sharh, Cell 2007&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Желатин, агар, белковые гели: прочность и тающая текстура."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Гели и желе","description":"Желатин, агар, белковые гели: прочность и тающая текстура.","vcsPath":"concepts/proc-gels.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-gels.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/proc-gels.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/proc-gels.html#nazariya","level":2},{"title":"Qanday ishlaydi","href":"concepts/proc-gels.html#qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/proc-gels.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/proc-gels.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va qiyinchiliklar","href":"concepts/proc-gels.html#cheklovlar-va-qiyinchiliklar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/proc-gels.html#bogliq-tushunchalar","level":2},{"title":"Qayerda uchraydi","href":"concepts/proc-gels.html#qayerda-uchraydi","level":2},{"title":"Manbalar","href":"concepts/proc-gels.html#manbalar","level":2}],"title":"Гели и желе"},"router":{"pathname":"concepts/proc-gels","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true
