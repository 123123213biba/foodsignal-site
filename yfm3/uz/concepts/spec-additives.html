        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-additives.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/spec-additives.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat qo‘shimchalari — bu ishlab chiqarish, qadoqlash, tashish yoki saqlash jarayonida texnologik maqsadlarda mahsulotlarga qo‘shiladigan moddalardir. Ularning asosiy vazifasi mahsulotga kerakli xususiyatlarni, masalan, ma’lum bir hid, rang, ta’m, konsistensiya yoki saqlash muddatini berishdir. Keng ma’noda tuz va murch ham qo‘shimchalarga kiradi, biroq sanoatda bu atama xalqaro va milliy normalar bilan tartibga solinadigan standartlashtirilgan komponentlarni anglatadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-additives.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat qo‘shimchasi axborot mohiyati va moddiy mohiyat hisoblanadi: kimyoviy birikma sifatida u fizik-kimyoviy xususiyatlarga ega, tarkibiy qism sifatida esa mahsulot funksiyasi haqida ma’lumot beradi. Qo‘shimchalar tasnifi ularning funksional sinfiga (masalan, konservantlar, bo‘yoqlar, emulsifikatorlar) asoslanadi. Ulardan foydalanish tamoyillari JECFA va EFSA kabi xalqaro tashkilotlar tomonidan o‘tkaziladigan xavfsizlik baholashiga tayanadi. Asosiy tushuncha — ruxsat etilgan sutkalik iste’mol (RSI) bo‘lib, bu inson sog‘lig‘iga xavf tug‘dirmasdan umr davomida har kuni qabul qilishi mumkin bo‘lgan modda miqdori.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-additives.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Qo‘shimchalarning ishlashi mahsulotning fizik-kimyoviy muhitini o‘zgartirish qobiliyatiga asoslanadi. Masalan, antioksidantlar yog‘larning oksidlanishini sekinlashtiradi, konservantlar esa mikroorganizmlarning ko‘payishini to‘xtatadi. Zamonaviy texnologiyalarda qo‘shimchalar ko‘pincha yeyiladigan qoplamalar tarkibida ishlatiladi. Bu qoplamalar mahsulot va tashqi muhit o‘rtasida to‘siq hosil qilib, namlik yo‘qolishining va patogenlarning kirib kelishining oldini oladi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-additives.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Qo‘shimchalar samaradorligini baholashning asosiy usuli laboratoriya sinovlaridir. Tadqiqotchilar mahsulot modellarini yaratib, ularga moddalarning turli konsentratsiyalarini kiritadilar va sifat ko‘rsatkichlarini: mikrobiologik tozalik, organoleptik xususiyatlar (ta’m, hid) va fizik barqarorlikni o‘lchaydilar.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-additives.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Qo‘shimchalardan foydalanish texnologiyalari mahsulotlarni saqlash sohasida faol rivojlanmoqda. «Sitrus po‘stlog‘i tovuq burgerlarini uzoqroq saqlashga qanday yordam beradi» maqolasida jelatin plyonkasiga greyfurt ekstrakti qo‘shilishi go‘shtning muzlatgichda saqlash muddatini 5 oyga uzaytirgani tasvirlangan. «Apelsin po‘stlog‘i va chinnigul pomidorlarning uzoqroq yangi qolishiga qanday yordam beradi» tadqiqotida olimlar sitrus chiqindilaridan sabzavotlarni chirish va mog‘ordan himoya qiluvchi yeyiladigan qoplama ishlab chiqdilar.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavfli-jihatlar\"&gt;&lt;a href=\"concepts/spec-additives.html#cheklovlar-va-xavfli-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavfli jihatlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavfli jihatlar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov — TR TS 021/2011 va 029/2012 tomonidan belgilangan dozalarga qat’iy rioya qilish zarurati. Laboratoriya sharoitidagi samaradorlik sanoat miqyosida har doim ham bir xil natijani kafolatlamasligini tushunish muhimdir. Bundan tashqari, har qanday qo‘shimchalar boshqa oziq-ovqat komponentlari bilan nomaqbul o‘zaro ta’sirlar yo‘qligi uchun tekshirilishi kerak.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Oziq-ovqat qo'shimchalari&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%D0%B4%D1%8B%D2%9B%20%D2%9B%D0%BE%D1%81%D0%BF%D0%B0%5D%20--%3E%7C%D0%B0%D0%BD%D1%8B%D2%9B%D1%82%D0%B0%D0%B9%D0%B4%D1%8B%7C%20B%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D0%B4%D1%8B%D2%9B%20%D0%BA%D0%BB%D0%B0%D1%81%D1%81%5D%0A%20%20A%20--%3E%7C%D1%80%D0%B5%D1%82%D1%82%D0%B5%D0%BB%D0%B5%D0%B4%D1%96%7C%20C%5B%D0%A5%D0%B0%D0%BB%D1%8B%D2%9B%D0%B0%D1%80%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BD%D0%BE%D1%80%D0%BC%D0%B0%D0%BB%D0%B0%D1%80%5D%0A%20%20A%20--%3E%7C%D3%A9%D0%B7%D0%B0%D1%80%D0%B0%20%D3%99%D1%80%D0%B5%D0%BA%D0%B5%D1%82%D1%82%D0%B5%D1%81%D0%B5%D0%B4%D1%96%7C%20D%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%D1%81%D1%8B%5D%0A%20%20A%20--%3E%7C%D2%9B%D0%B0%D0%BC%D1%82%D0%B0%D0%BC%D0%B0%D1%81%D1%8B%D0%B7%20%D0%B5%D1%82%D0%B5%D0%B4%D1%96%7C%20E%5B%D0%A1%D0%B0%D2%9B%D1%82%D0%B0%D1%83%20%D0%BC%D0%B5%D1%80%D0%B7%D1%96%D0%BC%D1%96%5D%0A%20%20A%20--%3E%7C%D0%B6%D0%B0%D2%9B%D1%81%D0%B0%D1%80%D1%82%D0%B0%D0%B4%D1%8B%7C%20F%5B%D0%9E%D1%80%D0%B3%D0%B0%D0%BD%D0%BE%D0%BB%D0%B5%D0%BF%D1%82%D0%B8%D0%BA%D0%B0%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D0%B1%D0%B5%D0%BB%D0%B3%D1%96%D0%BB%D0%B5%D0%B9%D0%B4%D1%96%7C%20G%5B%D0%A0%D2%B1%D2%9B%D1%81%D0%B0%D1%82%20%D0%B5%D1%82%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20%D1%82%D3%99%D1%83%D0%BB%D1%96%D0%BA%D1%82%D1%96%D0%BA%20%D1%82%D2%B1%D1%82%D1%8B%D0%BD%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-additives.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-additives.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html\"&gt;Muzqaymoqda gialuron kislotasi: molekulyar og'irlik teksturani qanday o'zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html\"&gt;Shirin olmalar antioksidant himoya bo‘yicha nordonlaridan ortda qoladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html\"&gt;Dengiz mahsulotlari chiqindilarini qimmatli oqsilga aylantirish&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Sitrus po‘stlog‘i tovuq kotletlarini uzoqroq saqlashga qanday yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Apelsin po‘sti va chinnigul pomidorlarni uzoqroq saqlashga qanday yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-additives.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5_%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Пищевые добавки — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/ieam.258\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Perfluoroalkyl and polyfluoroalkyl substances in the environment: terminology, classification, and origins&lt;/a&gt; — sharh, Integr Environ Assess Manag 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.marpolbul.2011.09.025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microplastics as contaminants in the marine environment: a review&lt;/a&gt; — sharh, Mar Pollut Bull 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1098/rstb.2008.0205\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accumulation and fragmentation of plastic debris in global environments&lt;/a&gt; — sharh, Philos Trans R Soc Lond B Biol Sci 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"E-коды без мифов: что это, зачем, как работает и что говорят исследования."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Oziq-ovqat qo'shimchalari","description":"E-коды без мифов: что это, зачем, как работает и что говорят исследования.","vcsPath":"concepts/spec-additives.md"},"headings":[{"title":"Ta'rif","href":"concepts/spec-additives.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/spec-additives.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/spec-additives.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/spec-additives.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/spec-additives.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo‘llaniladi","href":"concepts/spec-additives.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavfli jihatlar","href":"concepts/spec-additives.html#cheklovlar-va-xavfli-jihatlar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/spec-additives.html#bogliq-tushunchalar","level":2},{"title":"Qayerda uchraydi","href":"concepts/spec-additives.html#qayerda-uchraydi","level":2},{"title":"Manbalar","href":"concepts/spec-additives.html#manbalar","level":2}],"title":"Oziq-ovqat qo'shimchalari"},"router":{"pathname":"concepts/
