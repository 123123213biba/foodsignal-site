        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"160\" cy=\"100\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"680\" cy=\"207\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · ANTIOXIDANTS_ADD   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Shirin olmalar antioksidant&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;himoya bo‘yicha&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;nordonlaridan ortda qoladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f1.jpg\" alt=\"12 xil navdagi 25 ta olma eti namunalarining kimyoviy tarkibi va in vitro antioksidant faolligi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12 xil navdagi 25 ta olma eti namunalarining kimyoviy tarkibi va in vitro antioksidant faolligi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;12 xil navdagi 25 ta olma eti namunalarining kimyoviy tarkibi va in vitro antioksidant faolligi. (A) Olma materiallari va eksperimental ish jarayoni. (B, C) Umumiy fenollar va umumiy flavonoidlar miqdori. (D) 16 ta maqsadli fenol va flavonoid birikmalarining issiqlik xaritasi. (E) Fruktoza, glyukoza va saxaroza miqdorining issiqlik xaritasi. (F) Olma va xin kislotalari miqdorining issiqlik xaritasi. (G–I) DPPH radikallarini tozalash faolligi, FRAP qaytarish qobiliyati va ABTS radikallarini tozalash faolligi. Kimyoviy qiymatlar har bir namuna uchun beshta biologik takrorlashning oʻrtacha qiymati sifatida (n = 5), har bir takrorlash uchun bitta mevadan foydalanilgan holda keltirilgan. Xatolik chiziqlari standart ogʻishlarni koʻrsatadi. &lt;a href=\"concepts/gallic-acid-equivalent.html\"&gt;GAE&lt;/a&gt; — gall kislotasi ekvivalentlari; RE — rutin ekvivalentlari; FW — yangi vazn.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Olma sifatini faqat shirinligiga qarab baholash ularning haqiqiy biologik qiymatini aks ettirmaydi. 25 ta namuna pulpasini tahlil qilish mevalarni to‘rtta kimyoviy turga ajratish imkonini berdi, ularda fruktoza va olma kislotasi ustunlik qiladi. Erkin radikallarni neytrallash qobiliyati shakar yoki kislotalarga emas, balki polifenollarga bog‘liq. Hujayra modellarida fenolga boy navlar oksidlovchi stressni eng samarali pasaytirdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Olma etida ta'm balansini belgilovchi fruktoza va olma kislotasi ustunlik qiladi&lt;/li&gt;\n&lt;li&gt;Shirin navlarda fenollar kamroq bo‘lib, antioksidantlik faolligi pastroq chiqdi&lt;/li&gt;\n&lt;li&gt;5 mkg/ml polifenol ekstrakti &lt;a href=\"concepts/hepg2.html\"&gt;HepG2&lt;/a&gt; hujayralarida oksidlovchi stressni susaytiradi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotda 12 ta tijoriy olma navidan (Malus × domestica) olingan 25 ta namuna 5 ta biologik takroriylikda (n = 5) o‘rganildi. Erkin shakar miqdori &lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;UPLC&lt;/a&gt;-ELSD usulida, organik kislotalar (olma va xin kislotalari) hamda fenol birikmalari esa UPLC-PDA-MS yordamida aniqlandi. Asosiy shakar fruktoza, yetakchi organik kislota esa olma kislotasi (&lt;a href=\"concepts/malic-acid.html\"&gt;E296&lt;/a&gt;) ekani tasdiqlandi. Yetti kimyoviy belgi bo‘yicha klasterlash namunalarni to‘rt turga ajratdi: nordon, kam fenolli shirin, oraliq va fenolga boy.&lt;/p&gt;\n&lt;p&gt;Antioksidantlik qobiliyati ABTS, DPPH va FRAP testlari orqali baholandi. Korrelyatsiya tahlili shakar va kislotalarning radikallarni bog‘lashdagi roli polifenollar va flavonoidlarga nisbatan ancha past ekanini ko‘rsatdi. Himoya xususiyatlari HepG2 inson hujayralarida tekshirildi: 5 mkg/ml xavfsiz konsentratsiyadagi polifenol ekstraktlari vodorod peroksidi (500 mkM H2O2, 1 soat) va t-BHP (1 mM, 1,5 soat) keltirib chiqargan reaktiv kislorod shakllarini keskin kamaytirdi. Eng yuqori hujayra himoyasini fenollarga boy bo‘lgan TPGSH namunasi ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mevalar savdo tarmoqlaridan olingani sababli agrotexnika va saqlash sharoitlari to‘liq nazorat qilinmagan, sinovlar faqat bitta hujayra liniyasida o‘tkazilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"rasmlar\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#rasmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rasmlar&lt;/span&gt;&lt;/a&gt;Rasmlar&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f2.jpg\" alt=\"12 xil navdagi 25 ta olma eti namunalaridagi yetti xil takrorlanmas kimyoviy belgilarning doiraviy ierarxik klasterli is\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12 xil navdagi 25 ta olma eti namunalaridagi yetti xil takrorlanmas kimyoviy belgilarning doiraviy ierarxik klasterli issiqlik xaritasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;12 xil navdagi 25 ta olma eti namunalaridagi yetti xil takrorlanmas kimyoviy belgilarning doiraviy ierarxik klasterli issiqlik xaritasi. Issiqlik xaritasi beshta biologik takrorlashdan olingan fruktoza, glyukoza, saxaroza, olma kislotasi, xin kislotasi, umumiy fenollar va umumiy flavonoidlarning oʻrtacha miqdori asosida tuzilgan. Har bir belgi uchun maʼlumotlar namunalar boʻyicha Z-ball bilan standartlashtirilgan: toʻq sariq rang oʻrtacha qiymatdan yuqori, oq rang oʻrtacha qiymatga yaqin, firuza rangi esa oʻrtacha qiymatdan past koʻrsatkichlarni bildiradi. Ierarxik klasterlash Yevklid masofasi va Ward.D2 bogʻlanish usuli yordamida amalga oshirilgan, dendrogramma namunalar darajasidagi toʻrt xil kimyoviy turga boʻlingan. Ichki rangli sektorlar va tashqi soyali chiziqlar tegishli turga mansublikni koʻrsatadi. Tur raqamlari ixtiyoriy klaster identifikatorlari boʻlib, namunalar sifatining reytingini anglatmaydi. Butun mevalarning vakillik fotosuratlari morfologik maʼlumot uchun issiqlik xaritasi atrofida tegishli namuna tartibida joylashtirilgan, barcha kimyoviy oʻlchovlar esa olma eti yordamida amalga oshirilgan. Namuna qisqartmalari va kelib chiqishi haqidagi batafsil maʼlumotlar S1-jadvalda keltirilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f3.jpg\" alt=\"12 xil navdagi 25 ta olma eti namunalarida antioksidant qobiliyati va uning kimyoviy belgilar bilan bogʻliqligi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12 xil navdagi 25 ta olma eti namunalarida antioksidant qobiliyati va uning kimyoviy belgilar bilan bogʻliqligi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;12 xil navdagi 25 ta olma eti namunalarida antioksidant qobiliyati va uning kimyoviy belgilar bilan bogʻliqligi. (A) Toʻrt xil kimyoviy tur oʻrtasidagi normallashtirilgan ABTS, DPPH, FRAP va umumiy antioksidant ballar. Umumiy ball normallashtirilgan ABTS, DPPH va FRAP qiymatlarining arifmetik oʻrtachasi sifatida hisoblangan. Qutilar kvartillararo masofani, gorizontal chiziqlar medianalarni, «moʻylovlar» 1,5 kvartillararo masofani, nuqtalar esa alohida namunalarni ifodalaydi. (B) Antioksidant indekslari va tanlangan kimyoviy belgilar oʻrtasidagi Spirman korrelyatsiyasi. Raqamlar Spirman rho qiymatini bildiradi; *, ** va *** mos ravishda p &amp;lt; 0,05, p &amp;lt; 0,01 va p &amp;lt; 0,001 qiymatlarini anglatadi. (C, D) Umumiy antioksidant ballning umumiy fenol (C) va umumiy flavonoid (D) miqdori bilan bogʻliqligi. Chiziqlar chiziqli regressiya moslashuvini, soyali hududlar esa 95% ishonch intervallarini koʻrsatadi. Ranglar kimyoviy turlarni bildiradi; uchburchaklar hujayrali validatsiya uchun tanlangan beshta namunani, doiralar esa qolgan namunalarni ifodalaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f4.jpg\" alt=\"HepG2 hujayralarida sitotoksiklikni baholash va oksidlovchi stress modellarini yaratish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;HepG2 hujayralarida sitotoksiklikni baholash va oksidlovchi stress modellarini yaratish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;HepG2 hujayralarida sitotoksiklikni baholash va oksidlovchi stress modellarini yaratish. (A, B) Olma eti polifenol ekstraktlarining mos ravishda 5 va 10 mkg/ml konsentratsiyada hujayralar hayotchanligiga taʼsiri. (C) t-BHP konsentratsiyasi va taʼsir davomiyligining hujayralar hayotchanligiga taʼsiri. (D) 1 soatlik taʼsirdan keyin H2O2 konsentratsiyasining taʼsiri. (E) S vitamin yoki olma polifenol ekstraktlari bilan oldindan ishlov berilgandan soʻng, H2O2 va t-BHP keltirib chiqargan oksidlovchi stress ostida hujayra ichidagi ROSning vakillik &lt;a href=\"concepts/dcfh-da.html\"&gt;DCFH-DA&lt;/a&gt; floresan tasvirlari. (F, G) Mos ravishda H2O2 va t-BHP modellarida ROS floresansiyasini miqdoriy aniqlash. Maʼlumotlar oʻrtacha ± standart ogʻish (n = 3) sifatida keltirilgan. *** p &amp;lt; 0,001, Model guruhiga nisbatan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-f5.jpg\" alt=\"Olma eti polifenol ekstraktlarining HepG2 hujayralarida oksidlovchi shikastlanish va antioksidant himoyaga taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Olma eti polifenol ekstraktlarining HepG2 hujayralarida oksidlovchi shikastlanish va antioksidant himoyaga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Olma eti polifenol ekstraktlarining HepG2 hujayralarida oksidlovchi shikastlanish va antioksidant himoyaga taʼsiri. H2O2 (A, C, E, G) va t-BHP (B, D, F, H) keltirib chiqargan oksidlovchi stress sharoitida LDH ajralishi (A, B), CAT faolligi (C, D), SOD faolligi (E, F) va MDA miqdori (G, H) aniqlandi. Hujayralar S vitamini yoki tanlangan beshta olma eti namunasidan olingan polifenol ekstraktlari bilan oldindan ishlov berildi. Maʼlumotlar oʻrtacha ± standart ogʻish (n = 3) sifatida keltirilgan. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001, Model guruhiga nisbatan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Olma ta'mi va &lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;antioksidantla&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;r bog‘liqligi&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;UPLC xromatogr&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;afiyasi va&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;HepG2 testlari&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fi
