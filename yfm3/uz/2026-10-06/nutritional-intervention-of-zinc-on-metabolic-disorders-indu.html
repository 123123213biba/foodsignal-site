            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"100\" cy=\"80\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"600\" cy=\"254\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · STARCH   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sink va uglevodlar: baliqlar&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;uchun ratsionni qanday&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;to‘g‘rilash kerak&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f1.jpg\" alt=\"M. salmoides baliqlarining tana, gepatopankreas va mushaklaridagi Zn miqdori\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;M. salmoides baliqlarining tana, gepatopankreas va mushaklaridagi Zn miqdori&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;M. salmoides baliqlarining tana, gepatopankreas va mushaklaridagi Zn miqdori (A) hamda Zn ushlab qolinishi (B) (turli darajadagi Zn bilan oziqlantirilganda). Ahamiyatlilik darajasi p &amp;lt; 0,05, n = 3 (har bir guruh uchun) deb belgilandi. Dastlabki tana rux miqdori 19,2 mg/kg ni tashkil etdi. Yulduzcha belgilari * p &amp;lt; 0,05 darajasidagi sezilarli farqlarni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Baliqlar uchun ozuqadagi ortiqcha kraxmal jigar glikogenining to‘planishiga va insulin qarshiligiga olib keladi. Micropterus salmoides baliqlarida o‘tkazilgan tadqiqot sinkning metabolizmni tartibga solishdagi muhim rolini ko‘rsatdi. Ratsionga 150 mg/kg sink qo‘shilishi fermentlar faoliyatini yaxshilaydi va insulin sezgirligini tiklaydi. Bu natijalar akvakultura uchun samarali ozuqa retseptlarini yaratishda qo‘llaniladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Sink kraxmal ta'sirida pasaygan glikoliz fermentlari faoliyatini tiklaydi.&lt;/li&gt;\n&lt;li&gt;150 mg/kg sink insulin sezgirligini PI3K/AKT yo‘li orqali yaxshilaydi.&lt;/li&gt;\n&lt;li&gt;Sinksiz yuqori kraxmalli ozuqa baliq jigari faoliyatini buzadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tajribada 600 ta Micropterus salmoides baliqlari turli darajadagi kraxmal (11,5% va 16,3%) va sink (0, 20, 150 mg/kg) bilan oziqlantirildi. Sinksiz yuqori kraxmalli parhez (HS-LZn) gepatopankreasda glikogen to‘planishiga va glikolizning asosiy fermentlari: geksokinaza (HK), fosfofruktokinaza (PFK) va piruvatkinaza (PK) faolligining pasayishiga olib keldi. Shuningdek, insulin signalizatsiyasida muhim bo‘lgan fosforillangan AKT (p-AKT) darajasining pasayishi kuzatildi.&lt;/p&gt;\n&lt;p&gt;150 mg/kg sink qo‘shilishi (HS-HZn) HK, PFK, sitratsintaza (CS) va kislotali alfa-glyukozidaza (GAA) faolligini sezilarli darajada oshirdi. Immunoflyuoresan tahlil PI3K/AKT signal yo‘lining tiklanganini tasdiqladi, bu glyukoza almashinuvi uchun juda muhimdir. Tadqiqot shuni ko‘rsatdiki, sink aynan uglevod almashinuvini yaxshilash orqali stress ta'sirini kamaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat bitta baliq turi ustida o‘tkazilgan, natijalar boshqa turlar uchun turlicha bo‘lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Uglevodlar baliqlar uchun asosiy energiya manbai hisoblanadi va bu koʻrsatkich boʻyicha yogʻlar va oqsillardan ustun turadi. Fermer xoʻjaliklarida yetishtiriladigan baliqlar ratsioniga uglevodlarni kiritish oqsil va lipidlarning saqlanishiga yordam beradi, akvakultura oqava suvlaridagi azot yuklamasini kamaytiradi va yem granulalarining barqarorligini oshiradi. Biroq, baliqlarning uglevodlarni metabolizm qilish qobiliyati cheklanganligi sababli, ratsiondagi uglevodlar miqdorini oshirish glyukoza (Glu) keltirib chiqaradigan metabolik buzilishlarni hal qilishni talab qiladi. Bunday holatlardan biri gepatotsitlarda glikogenning haddan tashqari toʻplanishi bilan tavsiflanadigan glikogen gepatopatiyasidir. Ushbu qaytariladigan holatni tashxislashning \"oltin standarti\" davriy kislota-Shiff (PAS) boʻyash usuli hisoblanadi.&lt;/p&gt;\n&lt;p&gt;Insulin baliqlarda Glu metabolizmida, xuddi sutemizuvchilardagidek, muhim rol oʻynaydi. Baliqlar odatda Glu ga nisbatan tolerant emas deb hisoblanadi va kraxmalga boy ratsion ularda doimiy giperglikemiyani keltirib chiqaradi. Glu ga nisbatan tolerantlikning yoʻqligi boʻyicha eng keng tarqalgan gipoteza insulin rezistentligidir. Bu genetik yoki atrof-muhit omillari, xususan, ratsion tarkibi bilan bogʻliq. Hujayra darajasida u toʻqimalar tomonidan Glu ni qabul qilish va ishlatishning buzilishi, molekulyar darajada esa insulin signal yoʻllarining ishdan chiqishi bilan namoyon boʻladi. Rux (Zn) insulin sekretsiyasi va sezgirligida ishtirok etuvchi muhim mikroelementdir. Odamlarda insulin tarkibida ikkita Zn²⁺ va bitta Ca²⁺ ionini saqlovchi geksamer kristallar shaklida boʻladi. Kalamushlarda oʻtkazilgan tadqiqotlar Zn qoʻshimchalari insulin sezgirligini oshirganini koʻrsatdi. Ushbu tadqiqotda insulin rezistentligiga moyil boʻlgan katta ogʻizli okun (&lt;em&gt;Micropterus salmoides&lt;/em&gt;) kraxmalga boy ratsion keltirib chiqaradigan metabolik buzilishlarga ruxning taʼsirini oʻrganish uchun tanlab olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kraxmalga boy ratsion baliqlarda metabolik buzilishlarni, jumladan glikogen gepatopatiyasi va insulin rezistentligini keltirib chiqaradi, rux esa insulin sezgirligini yaxshilash uchun potensial vosita sifatida koʻrib chiqiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xulosa qilib aytganda, kraxmalga boy ratsionlar yem isteʼmolini kamaytirdi va glikogenning sezilarli darajada toʻplanishiga olib keldi, biroq yemdan foydalanish va oqsilning saqlanishini yaxshiladi. Rux jigar glikogenining gʻayritabiiy toʻplanishini yengillashtirdi, bu potensial ravishda glikofagiyaning kuchayishi hisobiga yuz berdi. Bundan tashqari, rux AKT fosforillanishini kuchaytirdi, bu uning insulin sezgirligini yaxshilash qobiliyatidan dalolat beradi. Maqsadli boʻlmagan metabolomika shuni koʻrsatdiki, Zn qoʻshimchalarisiz kraxmalga boy ratsionlar koʻplab aminokislotalar metabolizmi yoʻllarini susaytirgan. Oʻsimlik oqsili tarkibidagi oʻzgarishlar ushbu tadqiqot natijalariga taʼsir qiluvchi omil hisoblanadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f1.jpg\" alt=\"M. salmoides baliqlarining tana, gepatopankreas va mushaklaridagi Zn miqdori\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;M. salmoides baliqlarining tana, gepatopankreas va mushaklaridagi Zn miqdori&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;M. salmoides baliqlarining tana, gepatopankreas va mushaklaridagi Zn miqdori (A) hamda Zn ushlab qolinishi (B) (turli darajadagi Zn bilan oziqlantirilganda). Ahamiyatlilik darajasi p &amp;lt; 0,05, n = 3 (har bir guruh uchun) deb belgilandi. Dastlabki tana rux miqdori 19,2 mg/kg ni tashkil etdi. Yulduzcha belgilari * p &amp;lt; 0,05 darajasidagi sezilarli farqlarni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f2.jpg\" alt=\"M. salmoides baliqlarining tana (A) va mushak (B) tarkibi, hamda oqsil va energiya ushlab qolinishi (C) (turli darajadag\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;M. salmoides baliqlarining tana (A) va mushak (B) tarkibi, hamda oqsil va energiya ushlab qolinishi (C) (turli darajadagi Zn bilan oziqlantirilganda). Ahamiyatlilik darajasi p &amp;lt; 0,05, n = 3 (har bir guruh uchun) deb belgilandi. Yulduzcha belgilari * p &amp;lt; 0,05 darajasidagi sezilarli farqlarni ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f3.jpg\" alt=\"Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida glikogen almashinuvi va glikoliz.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida glikogen almashinuvi va glikoliz.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida glikogen almashinuvi va glikoliz. (A) Gepatopankreas va mushaklardagi glikogen miqdori. (B) Gepatopankreasdagi glikoliz. (C, D) Gepatopankreasdagi glikogen almashinuvi. Ahamiyatlilik darajasi p &amp;lt; 0,05, n = 3 (har bir guruh uchun) deb belgilandi. CS, sitrat sintaza; GAA, kislotali alfa-glyukozidaza; gabarapl1, gamma-aminomoy kislotasi retseptori bilan bog'liq oqsil; GPa, glikogen fosforilaza a; GS, glikogen sintaza; GSK-3β, glikogen sintaza kinaza-3β; HK, geksokinaza; PFK, fosfofruktokinaza-1; PK, piruvat kinaza; stbd1, kraxmal bog'lovchi domen 1. Yulduzcha belgilari * p &amp;lt; 0,05 darajasidagi sezilarli farqlarni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f4.jpg\" alt=\"Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida lipid almashinuvi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida lipid almashinuvi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida lipid almashinuvi. (A, B) Gepatopankreas gistologiyasi va yog' qizil O (oil red O) bo'yash usuli bo'yicha bo'yalgan maydon statistikasi. (C) To'qimalardagi lipid miqdori. (D, E) Zardob va gepatopankreasdagi lipid almashinuvi bilan bog'liq parametrlar. (F) Lipid almashinuvida ishtirok etuvchi genlar ekspressiyasi. Ahamiyatlilik darajasi p &amp;lt; 0,05, n = 3 (har bir guruh uchun) deb belgilandi. acadm, o'rta zanjirli atsil-KoA degidrogenaza; acc1, atsil-KoA karboksilaza 1; atgl, adipoz triglitserid lipaza; cpt1, karnitin palmitoiltransferaza 1; dgat1, diatsilglitserol O-atsiltransferaza 1; fasn, yog' kislotasi sintazasi; gpat4, glitserol-3-fosfat atsiltransferaza 4; hadh, gidroksiatsil-KoA degidrogenaza; HDL-C, yuqori zichlikdagi lipoprotein xolesterini; hsl, gormonga sezgir lipaza; LDL-C, past zichlikdagi lipoprotein xolesterini; lpin1, autosom-retsessiv lipin-1; lpl, lipoprotein lipaza; pparα, peroksisoma proliferatori bilan faollashadigan retseptor α; TBA, umumiy o't kislotasi; TC, umumiy xolesterin; TG, triglitserid. Yulduzcha belgilari * p &amp;lt; 0,05 darajasidagi sezilarli farqlarni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f5.jpg\" alt=\"Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida qorin bo'shlig'iga glyukoza yuborish orqali o'tkazilg\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida qorin bo'shlig'iga glyukoza yuborish orqali o'tkazilgan tolerantlik testi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli darajadagi Zn bilan oziqlantirilgan M. salmoides baliqlarida qorin bo'shlig'iga glyukoza yuborish orqali o'tkazilgan tolerantlik testi. (A, B, C) Zardobdagi TC, TG va Glu darajalari, hamda AUC va &lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;iAUC&lt;/a&gt;. Ahamiyatlilik darajasi p &amp;lt; 0,05, n = 3 (har bir guruh uchun) deb belgilandi. AUC, egri chiziq ostidagi maydon; Glu, glyukoza; iAUC, inkremental egri chiziq ostidagi maydon; TC, umumiy xolesterin; TG, triglitserid. Yulduzcha belgilari * p &amp;lt; 0,05 darajasidagi sezilarli farqlarni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f6.jpg\" alt=\"Turli darajadagi rux (Zn) bilan oziqlantirilgan M. salmoides baliqlarida qorin boʻshligʻiga insulin yuborish orqali oʻtk\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli darajadagi rux (Zn) bilan oziqlantirilgan M. salmoides baliqlarida qorin boʻshligʻiga insulin yuborish orqali oʻtkazilgan tolerantlik testi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli darajadagi rux (Zn) bilan oziqlantirilgan M. salmoides baliqlarida qorin boʻshligʻiga insulin yuborish orqali oʻtkazilgan tolerantlik testi. (A, B, C) Zardobdagi umumiy xolesterin (TC), triglitseridlar (TG) va glyukoza (Glu) darajalari, shuningdek AUC va iAUC. Ahamiyatlilik darajasi p &amp;lt; 0,05 etib belgilangan, har bir guruhda n = 3. AUC — egri chiziq ostidagi maydon; Glu — glyukoza; iAUC — egri chiziq ostidagi qoʻshimcha maydon; TC — umumiy xolesterin; TG — triglitseridlar. Yulduzcha belgilari * p &amp;lt; 0,05 darajasida statistik ahamiyatli farqlarni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f7.jpg\" alt=\"Ruxning insulin signal yoʻliga taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ruxning insulin signal yoʻliga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Ruxning insulin signal yoʻliga taʼsiri. (A, D, F) Gepatopankreasda PI3K (yashil) va p-AKT (qizil) birgalikda boʻyalishining vakillik konfokal tasvirlari va statistikasi. (B) Zardobdagi insulin darajasi. (C) Insulin signal yoʻlida ishtirok etuvchi genlar ekspressiyasi. (E, G) Gepatopankreasdagi p-AKT va PI3K oqsillari ekspressiyasi. Ahamiyatlilik darajasi p &amp;lt; 0,05 etib belgilangan, har bir guruhda n = 3. akt1 — serin/treonin kinaza 1; foxo1 — forkhead transkripsiya faktori FKHR; glut2 — glyukoza tashuvchi 2 oqsilini kodlovchi SLC2A2; ira — insulin retseptori a; irb — insulin retseptori b; pi3kr1 — fosfatidilinozit-3-kinaza p85 α. Yulduzcha belgilari * p &amp;lt; 0,05 darajasida statistik ahamiyatli farqlarni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f8.jpg\" alt=\"Turli darajadagi rux (Zn) bilan oziqlantirilgan M. salmoides baliqlarining maqsadsiz (untargeted) metabolomika maʼlumotl\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli darajadagi rux (Zn) bilan oziqlantirilgan M. salmoides baliqlarining maqsadsiz (untargeted) metabolomika maʼlumotlar toʻplami.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli darajadagi rux (Zn) bilan oziqlantirilgan M. salmoides baliqlarining maqsadsiz (untargeted) metabolomika maʼlumotlar toʻplami. (A) Uchta taqqoslash guruhida (HS-LZn nazoratga nisbatan, HS-MZn nazoratga nisbatan, HS-LZn HS-MZn ga nisbatan) sezilarli darajada farq qiluvchi metabolitlar soni. (B) Maqsadsiz metabolit profillarining asosiy komponentlar tahlili (PCA). (C, D) KEGG metabolik yoʻllarini boyitish grafigi (pufakchali diagramma) va ikkita taqqoslash guruhi (HS-LZn nazoratga nisbatan, HS-MZn nazoratga nisbatan) oʻrtasidagi differensial koʻrsatkichlar. (E) Ikkita taqqoslash guruhida (HS-LZn nazoratga nisbatan, HS-MZn nazoratga nisbatan) umumiy boʻlgan differensial metabolitlar. Yulduzcha belgilari * p &amp;lt; 0,05 va ** p &amp;lt; 0,01 darajasida statistik ahamiyatli farqlarni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true
