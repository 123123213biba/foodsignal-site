            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"244\" cy=\"174\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"496\" cy=\"172\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Nasha va suli: fermentatsiya&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o‘simlik oqsilini qanday&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o‘zgartiradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f1.jpg\" alt=\"Umumiy aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Umumiy aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Umumiy aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili. Oʻlchangan oʻzgaruvchilar oʻrtasidagi bogʻliqlikni koʻrsatuvchi 1-komponent (PC1, 59,9%) va 2-komponent (PC2, 20,0%) biplotlari. (A) Ishlov berish usuli boʻyicha guruhlangan namunalar bilan biplot. (B) Tarkibi boʻyicha guruhlangan namunalar bilan biplot.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Tadqiqotchilar nasha va suli kunjarasining aralashmasi kelajakdagi mahsulotlar xossalariga qanday ta’sir qilishini o‘rgandilar. Sut kislotasi bakteriyalari bilan fermentatsiya issiqlik bilan ishlov berish natijasida buzilgan oqsil eruvchanligini qisman tiklashga yordam berishi aniqlandi. Tekstura va ozuqaviylik uchun 75% nasha va 25% suli nisbati optimal deb topildi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;pH 5,2 darajasidagi fermentatsiya pasterizatsiyadan keyin oqsil eruvchanligini tiklaydi.&lt;/li&gt;\n&lt;li&gt;75:25 nasha va suli kunjarasi nisbati ozuqaviylik uchun eng maqbulidir.&lt;/li&gt;\n&lt;li&gt;Suli kunjarasi sut kislotasi bakteriyalari uchun uglevod manbai vazifasini bajaradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqot yog‘-moy sanoati qo‘shimcha mahsuloti bo‘lgan kunjaradan foydalanishga asoslangan. Nasha kunjarasi oqsilga boy (20–40%), ammo bakteriyalar uchun zarur bo‘lgan uglevodlarga kambag‘al, shuning uchun tarkibga suli kunjarasi qo‘shildi. Namunalar 80 °C haroratda 10 daqiqa davomida pasterizatsiya qilindi, so‘ngra 40 °C haroratda pH 5,2 darajasigacha Streptococcus thermophilus va Lactobacillus delbrueckii (100 DCU/kg) madaniyati bilan fermentatsiya qilindi.&lt;/p&gt;\n&lt;p&gt;Tahlillar shuni ko‘rsatdiki, pasterizatsiya oqsil agregatsiyasini keltirib chiqaradi, bu SDS-PAGE (poliakrilamid gel elektroforezi) ma’lumotlari bilan tasdiqlangan. Fermentatsiya esa pH o‘zgarishi va strukturaviy qayta qurish hisobiga oqsil eruvchanligini qisman tiklashga yordam beradi. 75:25 nisbati (nasha:suli) funksional xossalar bo‘yicha eng yaxshi natijalarni ko‘rsatdi va sof nasha kunjarasiga nisbatan oqsil miqdori hamda aminokislotalar profilini saqlab qoldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot har bir namuna uchun bitta partiyada o‘tkazilgan, bu natijalarning statistik ishonchliligini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Vegan, vegetarian va fleksitarian parhezlarning tobora ommalashib borishi hayvonlar etikasi, atrof-muhit muammolari, ovqatlanish va sog'liq uchun xavflar kabi turli omillar bilan bog'liq. Ko'pchilik odamlar go'shtni uning sensor xususiyatlari yoki mahalliy oshxonalardagi madaniy ahamiyati uchun qadrlashsa-da, o'simlik xomashyosi go'sht o'rnini bosuvchi mahsulotlar yoki analoglar ishlab chiqarish uchun tobora ko'proq foydalanilmoqda. Bundan tashqari, o'simlik asosidagi sanoatda iste'molchilar uchun jozibador bo'lgan to'yimli va barqaror variantlarni taklif qilish uchun 3D-bosib chiqarish va nam yigiruv kabi yangi strukturaviy texnikalarni fermentatsiya kabi yaxshi ma'lum bo'lgan biokimyoviy qayta ishlash usullari bilan birlashtirish tendentsiyasi o'sib bormoqda. Yog' olish sanoatining qo'shimcha mahsuloti bo'lgan press-keklar (kunjaralar) oqsil va bioaktiv birikmalarga boyligi tufayli oziq-ovqat ishlab chiqarish uchun qimmatli xomashyo sifatida paydo bo'lmoqda. Kanop urug'idan moy olish uchun sovuq presslash natijasida olingan kanop press-keklari (HPC) moyli ekinlar press-keklari orasida nisbatan yuqori oqsil miqdori (20–40%), muhim aminokislotalar va argininning yuqori darajasi hamda Litvada kengayib borayotgan kanop moyi sanoati tufayli alohida qiziqish uyg'otadi, bu esa inson oziq-ovqatida cheklangan foydalanishga ega bo'lgan ushbu qo'shimcha mahsulot hajmini tobora ko'paytirmoqda. Potentsialiga qaramay, press-keklar ko'pincha kam foydalaniladi, ularning ko'pchiligi tashlab yuboriladi yoki hayvonlar yemi kabi past qiymatli ilovalar bilan cheklanadi. Press-keklarning oqsil bo'lmagan fraktsiyasi, shu jumladan xun tolasi, minerallar va bioaktiv birikmalar oqsil kontsentratlari va izolatlarini ishlab chiqarishga qaratilgan sanoat jarayonlarida asosan foydalanilmay qoladi. Cho'ktirish, filtrlash va kontsentratsiyalash kabi qo'shimcha qayta ishlash bosqichlari ham sezilarli energiya va suv resurslarini sarflaydi, bu esa barqarorlik bo'yicha xavotirlarni keltirib chiqaradi. Bundan tashqari, o'simlik oqsilining eruvchanligi ko'pgina an'anaviy ekstraktsiya usullari uchun qiyin cheklov bo'lib qolmoqda. Minimal qayta ishlashga o'tish va press-keklarni to'g'ridan-to'g'ri oziq-ovqat formulalariga kiritish chiqindilar va energiya sarfini kamaytirishi, shu bilan birga o'simlik asosidagi oziq-ovqat tizimlarining umumiy barqarorligini oshirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kanop press-keki 20–40% oqsilni o'z ichiga oladi va argininga boy, ammo uning oziq-ovqat sanoatidagi potentsiali oqsil bo'lmagan komponentlardan to'liq foydalanilmasligi va ekstraktsiya xarajatlarining yuqoriligi tufayli cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Press-keklardan oqsil manbai sifatida foydalanish qiyinchiliklarsiz emas. O'simlik oqsillari odatda muhim aminokislotalar profillaridagi cheklovlar va hazm bo'lish darajasining pasayishi tufayli hayvon oqsillariga qaraganda sifatsizroq deb hisoblanadi. Bundan tashqari, o'simlik matritsalari fitin kislotasi, taninlar, saponinlar va lektinlar kabi antinutritiv omillarni o'z ichiga oladi, ular hazm qilish fermentlarini inhibe qilish orqali ozuqa moddalarining so'rilishiga va oqsilning hazm bo'lishiga xalaqit beradi. Fermentatsiya press-keklarning ozuqaviy va funktsional xususiyatlarini yaxshilash uchun istiqbolli strategiyadir. Fermentatsiya saqlash oqsillarini qisman denaturatsiya qilish, oqsil eruvchanligini oshirish va aminokislotalar mavjudligini yaxshilash orqali oqsilning hazm bo'lishini oshirishi mumkin. Bundan tashqari, fermentatsiya donli va soxta donli ekinlarda fitin kislotasi kabi antinutritiv omillarni sezilarli darajada kamaytirishi ko'rsatilgan va press-keklarga ham shunga o'xshash ta'sir ko'rsatishi mumkin. Ozuqaviy yaxshilanishlardan tashqari, fermentatsiya press-keklarning suvni ushlab turish qobiliyati (&lt;a href=\"concepts/water-holding-capacity.html\"&gt;WHC&lt;/a&gt;), emulsifikatsiya va gellanish xususiyatlari kabi texno-funktsional xususiyatlarini ham oshirishi mumkin, bu ularning oziq-ovqat formulalarida qo'llanilishi uchun juda muhimdir. Ba'zi alohida press-keklarning fermentatsiya potentsiali o'rganilgan bo'lsa-da, fermentatsiyaning birlashtirilgan press-kek matritsalariga ta'siri asosan o'rganilmagan.&lt;/p&gt;\n&lt;p&gt;Kanop press-keki o'zining sezilarli oqsil va tola miqdori tufayli ushbu tadqiqotda asosiy matritsa sifatida tanlangan. Biroq, uning past uglevod miqdori (~3,7 g/100 g) sut kislotasi bakteriyalari uchun fermentlanadigan substrat mavjudligini cheklaydi, ular uglerod manbai sifatida asosan suvda eriydigan uglevodlarga tayanadi. Suli press-keki ushbu cheklovni bartaraf etish uchun funktsional modifikator sifatida kiritilgan: uning qoldiq kraxmal miqdori qo'shimcha fermentlanadigan uglevod manbai bo'lib xizmat qilishi mumkin, shu bilan birga keyingi qayta ishlash bosqichlarida (ya'ni, yuqori namlikli ekstruziya) kengayish va teksturani modulyatsiya qilishga hissa qo'shadi. Ushbu ikki press-kekni birlashtirish ularning tarkibiy komplementarligidan foydalanishga qaratilgan, chunki o'simlikdan olingan ingredientlarni turli xil ozuqaviy va funktsional profillar bilan aralashtirish individual cheklovlarni o'zaro qoplash strategiyasi sifatida taklif qilingan. Ushbu birlashtirilgan matritsaning fermentatsiyasi uning ozuqaviy qiymati va texno-funktsional xususiyatlarini yanada o'zgartirishi mumkin, bu uning o'simlik asosidagi oziq-ovqat mahsulotlarini ishlab chiqishda potentsial qo'llanilishini qo'llab-quvvatlaydi. Hozirgi tadqiqot sut kislotasi fermentatsiyasining oqsil tuzilishiga, ozuqaviy xususiyatlariga va birlashtirilgan press-kek matritsalarining texno-funktsional parametrlariga ta'sirini o'rganishga qaratilgan. Xususan, tadqiqot oqsil oksidlanishi, degradatsiyasi va bog'lanish profillaridagi, aminokislotalar va biogen aminlar profillaridagi hamda fitin kislotasi miqdoridagi o'zgarishlarni baholaydi. Bundan tashqari, tadqiqot barqaror va to'yimli o'simlik asosidagi oziq-ovqat formulalarini ishlab chiqish maqsadida WHC, moyni ushlab turish qobiliyati (OHC) va zarracha hajmini o'rganadi. Biz kanop-suli press-keki birlashtirilgan matritsalarining sut kislotasi fermentatsiyasi ularning oqsil tuzilishini, ozuqaviy xususiyatlarini va texno-funktsional xususiyatlarini formulaga bog'liq holda modulyatsiya qilishini, antinutritiv omillar miqdori va oqsil oksidlanishining kamayishi hamda qayta ishlanmagan materiallarga nisbatan oqsil eruvchanligi, WHC va OHCning yaxshilanishi kutilayotganini taxmin qilamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot dastlabki hisoblanadi: resurslar cheklanganligi sababli har bir formula va ishlov berish kombinatsiyasi uchun faqat bitta vakillik partiyasi ishlatilgan, bu mustaqil takrorlashlar bilan kelajakdagi ishlarda tasdiqlashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Organik kanop press-keki (HPC) granulalari Allive Europe UAB, Voškoniai, Litvadan olingan. Material sovuq presslangan organik kanop urug'laridan (maksimal chiqish harorati 40 °C) olingan va keyinchalik granulalarga presslangan. Qayta ishlash jarayonida hech qanday kimyoviy ishlov berilmagan. KTU Oziq-ovqat instituti laboratoriyasida granulalar zarracha hajmining bir xilligini ta'minlash uchun ikki bosqichda maydalangan. Qo'pol maydalash qo'lda go'sht maydalagich bilan, nozikroq maydalash esa universal quruq mahsulot tegirmoni (MLVS-M100, Mažeikiai, Litva) bilan amalga oshirilgan. Maydalangan material 500 mkm o'lchamdagi zanglamaydigan po'latdan yasalgan elak (Glenammer, Shotlandiya, Buyuk Britaniya) yordamida elangan va zarracha hajmi &amp;gt;500 mkm va &amp;lt;500 mkm bo'lgan ikki fraktsiyaga ajratilgan; barcha keyingi tajribalar uchun kichikroq zarracha hajmi fraktsiyasi ishlatilgan. Suli press-keki (OPC) tijorat sulisidan (Pranciškaus malūnas, Kaunas, Litva) joyida ishlab chiqarilgan. Suli parchalari distillangan suv bilan 20 soniya davomida aralashtirilgan va doka orqali siqilgan. Suli press-keki pechda 45 °C haroratda 12 soat davomida quritilgan, kofe maydalagich bilan mexanik ravishda maydalangan va elangan (elak o'lchami 500 mkm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&amp;lt;500 mkm zarracha hajmi xomashyoni standartlashtirishni ta'minlash uchun tanlangan, bu fermentatsiya jarayonlari va keyingi tahlillarning takrorlanishi uchun juda muhimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fermentatsiya tajribalari uchun HPC va OPC dan tashkil topgan o'simlik asosidagi press-kek matritsalarining ikkita formulasi HPC:OPC aralashtirish nisbatlarida 75:25 (H75:O25) va 50:50 (H50:O50) tayyorlangan. Ushbu nisbatlar OPC kiritilishining gradientini ifodalash uchun tanlangan: 75:25 nisbati HPC ni dominant fraktsiya sifatida saqlab qoladi, uning oqsil hissasini saqlab qolgan holda, fermentatsiya substrati mavjudligi va funktsional xususiyatlarini modulyatsiya qilish uchun o'rtacha miqdorda OPC kiritadi, 50:50 nisbati esa oqsil miqdori OPC ning pastroq oqsil miqdori bilan xavf ostiga qo'yilishidan oldingi yuqori kiritish darajasini ifodalaydi. Sof HPC (H100) ning uchinchi formulasi ham asosiy mos yozuvlar sifatida kiritilgan.&lt;/p&gt;\n&lt;p&gt;Xom namunalar (RAW) uchun har bir press-kek formulasining (H100, H75:O25 va H50:O50) 500 g miqdori ishlov berilmagan holda qoldirilgan, plastik qoplarga o'tkazilgan, vakuum bilan yopilgan va tahlilgacha 4 °C da saqlangan. Pasterizatsiya qilingan namunalar (PAS) uchun har bir press-kek formulasining (H100, H75:O25 va H50:O50) 500 g miqdori 2 l hajmli shisha idishda 1450 ml distillangan suv bilan aralashtirilgan. Aralashmalar quyidagicha pasterizatsiya qilingan: induksion plita ustidagi suv hammomi yordamida 80 °C gacha qizdirilgan. Harorat 10 daqiqa davomida ushlab turilgan va termometr yordamida nazorat qilingan. Aralashma har daqiqada steril metall stol pichog'i yordamida aralashtirilgan. 10 daqiqadan so'ng aralashma yopiq idishni muzli suv hammomiga botirish orqali darhol 40 °C gacha sovutilgan. Olingan aralashmalar qalay patnisga yoyilgan va 60 °C da 24 soat davomida pechda quritilgan. Quritilgan namunalar plastik qoplarga o'tkazilgan, vakuum bilan yopilgan va tahlilgacha 4 °C da saqlangan. Pasterizatsiya jarayonning oraliq nazorati sifatida kiritilgan, chunki dastlabki tajribalar sut kislotasi bakteriyalari pasterizatsiya qilinmagan press-kek namunalarini fermentatsiya qila olmasligini ko'rsatdi. Ushbu guruh faqat pasterizatsiyaning termal ta'siri va sut kislotasi fermentatsiyasiga bog'liq biokimyoviy ta'sirlarni farqlash imkonini berdi. Fermentlangan namunalar (FER) uchun har bir press-kek formulasining (H100, H75:O25 va H50:O50) 500 g miqdori 2 l hajmli shisha idishda 1450 ml distillangan suv bilan aralashtirilgan. Aralashmalar avval yuqorida aytib o'tilganidek pasterizatsiya qilingan — induksion plita ustidagi suv hammomi yordamida 80 °C gacha qizdirilgan. Harorat 10 daqiqa davomida ushlab turilgan va termometr yordamida nazorat qilingan. Aralashma har daqiqada steril metall stol pichog'i yordamida aralashtirilgan. 10 daqiqadan so'ng aralashma yopiq idishni muzli suv hammomiga botirish orqali darhol 40 °C gacha sovutilgan. Keyin aralashmalarga 0,375 g liofilizatsiyalangan tijorat starter madaniyati Y883 LYO 50 DCU (Streptococcus thermophilus va Lactobacillus delbrueckii subsp. bulgaricus shtammlari) (Danisco, Kopengagen, Daniya) qo'shilgan, bu 25 DCU/l yoki 100 DCU/kg inokulyatsiya tezligiga olib keldi. Fermentatsiya 4–5 soat davomida inkubatorda (BINDER, Tuttlingen, Germaniya) 40 °C da amalga oshirilgan. Har 30 daqiqada pH SevenCompact S220 pH-metri (Mettler Toledo, Kolumbus, OH, AQSh) yordamida tekshirilgan. Fermentatsiya pH taxminan 5,2 ga yetganda namunani 4 °C ga qo'yish orqali to'xtatilgan. Har bir formula uchun boshlang'ich va yakuniy pH, shuningdek fermentatsiya vaqti quyida ko'rsatilgan: H100 — boshlang'ich pH 6,50, yakuniy pH 5,22, fermentatsiya vaqti 5 soat; H75:O25 — boshlang'ich pH 6,42, yakuniy pH 5,20, fermentatsiya vaqti 4 soat; H50:O50 — boshlang'ich pH 6,35, yakuniy pH 5,22, fermentatsiya vaqti 4 soat. Titrlanadigan kislotalilik va hayotiy &lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;LAB&lt;/a&gt; soni ushbu tadqiqot uchun o'lchanmagan va mikrobial faollikni baholashning cheklovi hisoblanadi. Olingan aralashmalar qalay patnisga yoyilgan va 60 °C da 24 soat davomida pechda quritilgan. Quruq namunalar plastik qoplarga o'tkazilgan, vakuum bilan yopilgan va tahlilgacha 4 °C da saqlangan. Har bir formula × ishlov berish kombinatsiyasining ikkita partiyasi ishlab chiqarilgan, ammo vaqt va resurslar cheklanganligi sababli, keyingi tahlillar uchun faqat bitta vakillik partiyasi ishlatilgan. Bu hozirgi tadqiqotning cheklovi sifatida tan olingan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f1.jpg\" alt=\"Umumiy aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Umumiy aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Umumiy aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili. Oʻlchangan oʻzgaruvchilar oʻrtasidagi bogʻliqlikni koʻrsatuvchi 1-komponent (PC1, 59,9%) va 2-komponent (PC2, 20,0%) biplotlari. (A) Ishlov berish usuli boʻyicha guruhlangan namunalar bilan biplot. (B) Tarkibi boʻyicha guruhlangan namunalar bilan biplot.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f2.jpg\" alt=\"Erkin aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Erkin aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Erkin aminokislotalar miqdori boʻyicha asosiy komponentlar tahlili. Oʻlchangan oʻzgaruvchilar oʻrtasidagi bogʻliqlikni koʻrsatuvchi 1-komponent (PC1, 63,4%) va 2-komponent (PC2, 18,7%) biplotlari. (A) Ishlov berish usuli boʻyicha guruhlangan namunalar bilan biplot. (B) Tarkibi boʻyicha guruhlangan namunalar bilan biplot.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f3.jpg\" alt=\"Toʻrtta alohida biogen aminlar miqdori boʻyicha asosiy komponentlar tahlili (PCA).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Toʻrtta alohida biogen aminlar miqdori boʻyicha asosiy komponentlar tahlili (PCA).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Toʻrtta alohida biogen aminlar miqdori boʻyicha asosiy komponentlar tahlili (PCA). Oʻlchangan oʻzgaruvchilar oʻrtasidagi bogʻliqlikni koʻrsatuvchi 1-komponent (PC1, 52,7%) va 2-komponent (PC2, 36,3%) biplotlari. (A) Ishlov berish usuli boʻyicha guruhlangan namunalar bilan biplot. (B) Tarkibi boʻyicha guruhlangan namunalar bilan biplot. (C) Individual grafik.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f4.jpg\" alt=\"DNPH usuli bilan karbonil miqdori sifatida hisoblangan oʻsimlik asosli kombinatsiyalangan matritsalardagi oqsil oksidlan\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;DNPH usuli bilan karbonil miqdori sifatida hisoblangan oʻsimlik asosli kombinatsiyalangan matritsalardagi oqsil oksidlanishi (H100: kanop kunjarasi, H75:O25: 75% kanop kunjarasi va 25% suli kunjarasi tarkibi, H50:O50: 50% kanop kunjarasi va 50% suli kunjarasi…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;DNPH usuli bilan karbonil miqdori sifatida hisoblangan oʻsimlik asosli kombinatsiyalangan matritsalardagi oqsil oksidlanishi (H100: kanop kunjarasi, H75:O25: 75% kanop kunjarasi va 25% suli kunjarasi tarkibi, H50:O50: 50% kanop kunjarasi va 50% suli kunjarasi tarkibi, P: pasterizatsiya qilingan, F: fermentatsiya qilingan). Xatolik chiziqlari standart ogʻishni (SD) ifodalaydi. (*) belgisi boʻlgan gorizontal chiziqlar bir xil tarkibdagi namunalar oʻrtasidagi sezilarli juftlik farqlarini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f5.jpg\" alt=\"Turli xil kimyoviy bogʻlanishlarni erituvchi ekstraksiya qiluvchi eritmalar taʼsirida kanop va suli kunjarasi kombinatsi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli xil kimyoviy bogʻlanishlarni erituvchi ekstraksiya qiluvchi eritmalar taʼsirida kanop va suli kunjarasi kombinatsiyalangan tarkiblarining (H100, H75:O25, H50:O50) oqsil eruvchanligi (H100: kanop kunjarasi, H75:O25: 75% kanop kunjarasi va 25% suli…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Turli xil kimyoviy bogʻlanishlarni erituvchi ekstraksiya qiluvchi eritmalar taʼsirida kanop va suli kunjarasi kombinatsiyalangan tarkiblarining (H100, H75:O25, H50:O50) oqsil eruvchanligi (H100: kanop kunjarasi, H75:O25: 75% kanop kunjarasi va 25% suli kunjarasi tarkibi, H50:O50: 50% kanop kunjarasi va 50% suli kunjarasi tarkibi, P: pasterizatsiya qilingan, F: fermentatsiya qilingan). (A) Nativ holatdagi oqsil; (B) Vodorod bogʻlanishlari; (C) Disulfid bogʻlanishlari; (D) Gidrofobik oʻzaro taʼsirlar; (E) Vodorod bogʻlanishlari x disulfid bogʻlanishlari; (F) Vodorod bogʻlanishlari x gidrofobik oʻzaro taʼsirlar; (G) Disulfid bogʻlanishlari x gidrofobik oʻzaro taʼsirlar; (H) Vodorod bogʻlanishlari x disulfid bogʻlanishlari x gidrofobik oʻzaro taʼsirlar. Yulduzchalar Tukey tuzatilgan baholangan marjinal oʻrtacha qiymatlarga asoslangan sezilarli juftlik farqlarini koʻrsatadi, faqat tavsifiy maqsadlarda keltirilgan (p ≤ 0,05 (&lt;em&gt;), ≤0,01 (&lt;strong&gt;), ≤0,001 (&lt;/strong&gt;&lt;/em&gt;), ≤0,0001 (****)).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f6.jpg\" alt=\"Kenevir va suli kunjarasi aralashmalarining SDS-PAGE geli (H100: kenevir kunjarasi, H75:O25: 75% kenevir kunjarasi va 25\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kenevir va suli kunjarasi aralashmalarining SDS-PAGE geli (H100: kenevir kunjarasi, H75:O25: 75% kenevir kunjarasi va 25% suli kunjarasi aralashmasi, H50:O50: 50% kenevir kunjarasi va 50% suli kunjarasi aralashmasi, P: pasterizatsiya qilingan, F: fermentatsiyalangan, EXT: quruq ekstruditsiya qilingan) qaytaruvchi (A) va qaytarmaydigan (B) sharoitlarda.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f7.jpg\" alt=\"Fosfor miqdori boʻyicha hisoblangan oʻsimlik asosli kombinatsiyalangan matritsalardagi fitin kislotasi miqdori.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Fosfor miqdori boʻyicha hisoblangan oʻsimlik asosli kombinatsiyalangan matritsalardagi fitin kislotasi miqdori.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Fosfor miqdori boʻyicha hisoblangan oʻsimlik asosli kombinatsiyalangan matritsalardagi fitin kislotasi miqdori. (H100: kenevir kunjarasi, H75:O25: 75% kenevir kunjarasi va 25% suli kunjarasi aralashmasi, H50:O50: 50% kenevir kunjarasi va 50% suli kunjarasi aralashmasi, P: pasterizatsiya qilingan, F: fermentatsiyalangan). Xatolik chiziqlari standart ogʻishni (SD) ifodalaydi. Ustidagi (*) belgisi boʻlgan gorizontal chiziqlar bir xil tarkibdagi namunalar oʻrtasida kuzatilgan sezilarli juftlik farqlarini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kunjaralarning&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;past&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;funksionalligi&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;nasha va suli&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;aralashmasini &lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;fermentatsiyal&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ash&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;oqsil eruvchan&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ligining&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yaxshilanishi&lt;/tex
