        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"221\" cy=\"165\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"619\" cy=\"193\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · GELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Aloe vera geli kesilgan&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mangoni yangi saqlashga&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yordam beradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f1.jpg\" alt=\"Namunalarni tayyorlashning sxematik diagrammasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Namunalarni tayyorlashning sxematik diagrammasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Kesilgan mevalar namlik bug‘lanishi va mikroblar ta’sirida tezda o‘z sifatini yo‘qotadi. Tadqiqot shuni ko‘rsatdiki, aloe vera gelidan tayyorlangan yupqa parda samarali to‘siq vazifasini o‘taydi. Bu usul 4°C dan past haroratda mangoni 20 kungacha vitaminlar va tuzilishini saqlagan holda saqlash imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;100% aloe vera geli namlik yo‘qotishni 48% ga, buzilishni 50% ga kamaytiradi.&lt;/li&gt;\n&lt;li&gt;Asal qoplama tarkibida polisaxarid matritsasining to‘siq xususiyatini pasaytiradi.&lt;/li&gt;\n&lt;li&gt;Qoplama 4°C haroratda S vitamini va antioksidantlarni saqlab qoladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Himoya qoplamasini yaratish uchun tadqiqotchilar 1% glitserin (plastifikator), 1,5% karboksimetilsellyuloza (plyonka hosil qiluvchi), 1% sirka kislotasi (pH ni pasaytirish uchun) va 2% metanol bilan boyitilgan aloe vera gelidan foydalanishdi. Aralashma 70°C gacha qizdirildi va mango bo‘laklari eritmaga 2 daqiqaga botirildi. Tajribada asalning turli konsentratsiyalari solishtirildi, ammo aynan 100% aloe vera geli eng yaxshi natijani ko‘rsatdi.&lt;/p&gt;\n&lt;p&gt;Sof aloe vera geli 20 kunlik saqlash davomida nazorat namunalariga nisbatan vazn yo‘qotishni 48% ga va mahsulotning buzilishini 50% ga kamaytirdi. Tahlillar shuni ko‘rsatdiki, asalning yuqori gigroskopikligi aloe bilan aralashtirilganda polisaxarid matritsasini buzadi va qoplamaning himoya xususiyatlarini pasaytiradi. Sof aloe ishlatish fenollar, flavonoidlar va S vitaminini saqlab qolishga yordam berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot Bangladeshdagi mahalliy mango navida o‘tkazilgan, shuning uchun natijalar boshqa meva turlari uchun farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;DMRT — Dunkan koʻp qatorli taqqoslash testi, FN — qattiqlik, HPMC — gidroksipropilmetilsellyuloza, LDPE — past zichlikdagi polietilen, PAL — fenilalanin-ammiak-liaza, PCA — mikroorganizmlarni hisoblash uchun agar, PDA — kartoshka-dekstrozli agar, QC — sifat nazorati, TA — titrlanadigan kislotalilik, TFC — umumiy flavonoidlar miqdori, TPC — umumiy polifenollar miqdori, TSS — umumiy eruvchan quruq moddalar.&lt;/p&gt;\n&lt;p&gt;Mango (Mangifera indica) — bir uyli oʻsimlik, Anacardiaceae oilasiga mansub, butun dunyoda keng yetishtiriladigan iqtisodiy jihatdan eng muhim tropik meva. Bangladeshda 2025-yilda qariyb 139 ming gektar maydonda yetishtirilgan mango hosili 1872 ming metrik tonnadan oshdi. Mango klimakterik mevalar toifasiga kiradi — u makronutriyentlar (uglevodlar, kletchatka), mikronutriyentlar (A, B9, C, K vitaminlari) va minerallar (temir, magniy, kalsiy, kaliy, rux), shuningdek, antioksidantlar (karotinoidlar, fenollar, flavonoidlar) manbai hisoblanadi va tez buziladigan mahsulotdir. Kesilgan mevalar hosil yigʻib olingandan keyin yuqori suv faolligiga ega boʻlgani uchun mikrobial va fiziologik buzilishlarga moyil boʻladi, bu esa ulardan foydalanish va eksport qilishni cheklaydi. Shu sababli samarali, toʻyimli va barqaror saqlash usullari zarur.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kesilgan mangoni saqlashda aloe vera va asal qoplamalarining taʼsirini solishtiradi, chunki ularning kombinatsiyasi asalning gigroskopikligi tufayli qoplamaning barqarorligini yaxshilashi yoki aksincha, zaiflashtirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oʻsimlik asosidagi moddalar va oziq-ovqat qoplamalari istiqbolli hisoblanadi. Aloe vera va asal antioksidant, mikroblarga qarshi, zamburugʻlarga qarshi xususiyatlarga hamda namlik va karbonat angidridni (CO₂) ushlab turish qobiliyatiga ega. Aloe vera (suv, vitaminlar, glyukomannanlar, sterollar, aminokislotalar) bakteriyalar oʻsishini cheklaydi, mevalarning nafas olishini nazorat qiladi va oksidlanish natijasida yuzaga keladigan qorayishni kamaytiradi. Aralash gul asali tabiiy antioksidant boʻlib, sintetik analoglarni almashtirishi mumkin. Oldingi ishlar aloe vera geli va asal qoplamasi mevaning taʼmi, hidi va teksturasini oʻzgartirmasligini koʻrsatgan. Biroq, kesilgan mangoni saqlashda ushbu moddalar kombinatsiyasining salohiyati haqida maʼlumotlar yetarli emas. Bu tadqiqot kesilgan mahalliy mangoda sof va aralash aloe vera va asal qoplamalarini birinchi tizimli solishtirishni taqdim etadi.&lt;/p&gt;\n&lt;p&gt;Toʻliq yetilgan mangolar (mahalliy Ashwina navi, oltin-sariq rangli eti) 2025-yil aprel oʻrtalaridan iyun oʻrtalarigacha Bangladeshning Dakka shahridagi Kanchan bozoridan olingan. Aloe vera (Barbadensis Miller navi), aralash gul asali va past zichlikdagi polietilen (LDPE) paketlar ham mahalliy bozordan sotib olingan. Oshxona anjomlari 70% li etanol eritmasi bilan dezinfeksiya qilingan. Mangolar yuvilgan, tozalangan va kub shaklida (2 × 2 × 2 sm) kesilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qoplamalar tayyorlash uchun aloe vera geli, aralash gul asali, glitserin (1%), karboksimetilsellyuloza (CMC, 1,5%), sirka kislotasi (1%) va metanol (2%) ishlatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aloe vera geli barglardan ajratib olingan, blenderda maydalangan (18 000 ayl/min, 3 daqiqa, xona haroratida) va 850 mkm li elakdan oʻtkazilgan. Ekstrakt 63°C da 15 daqiqa davomida pasterizatsiya qilingan. Eritmalar glitserin, CMC, sirka kislotasi va metanol qoʻshib tayyorlangan, 70°C gacha qizdirilgan va tez sovutilgan. Aloe vera va asalning besh xil nisbati (100:0, 75:25, 50:50, 25:75, 0:100) sinovdan oʻtkazilgan (1-jadval).&lt;/p&gt;\n&lt;p&gt;Mango kubiklari eritma ichiga 2 daqiqaga botirilgan, soʻngra xona haroratida 20 daqiqa davomida quritilgan. Jami 350 ta meva ishlatilgan. Namunalar LDPE paketlarda &amp;gt; 4°C haroratda va 85% nisbiy namlikda 20 kun davomida saqlangan. Har bir ishlov berish uchta biologik takroriylikka ega boʻlgan. Har 5 kunda sifat baholangan (pH, titrlanadigan kislotalilik, TSS, C vitamini, fenollar, flavonoidlar, sensor baholash, mikrobiologik tahlil).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv va eksperimental xarakterga ega; natijalar mango navi va saqlash sharoitlariga bogʻliq. Uy sharoitida konservatsiya qilish uchun qoʻllanma emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha guruhlarda namlik yoʻqotilishining sezilarli (p ≤ 0,05) oʻsishi kuzatilgan. 20-kuni T₁ guruhida (100% aloe vera) namlik yoʻqotilishi 14,28% ± 0,42% ni tashkil etgan, bu nazorat guruhiga (T₀, 27,80% ± 0,69%) qaraganda sezilarli darajada past. Bu qoplama gaz almashinuvini cheklaydigan va mevaning qarishini sekinlashtiradigan yarim oʻtkazuvchan plyonka hosil qilishini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;100% aloe vera qoplamasi (T₁) namlikni saqlash va qattiqlikni saqlash boʻyicha eng yaxshi natijalarni koʻrsatib, asal aralashmalaridan ustun keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qattiqlik penetrometr yordamida baholangan (3,5 mm zond). 100% aloe vera (T₁) va T₄ aralashmasi (75% aloe vera + 25% asal) qattiqlikni yaxshiroq saqlashni taʼminlagan (&amp;gt; 90% va &amp;gt; 71%). Asalning gigroskopik qandlari polisaxarid matritsasini zaiflashtirgan boʻlishi mumkin, shuning uchun T₂, T₃ va T₅ namunalari tezroq yumshagan.&lt;/p&gt;\n&lt;p&gt;Eruvchan quruq moddalar (TSS) miqdori saqlash davomida oshgan. Ishlov berilgan namunalarda TSS oʻsishi nazoratga qaraganda kamroq ifodalangan, bu nafas olish jarayoni sekinlashganini koʻrsatadi. Titrlanadigan kislotalilik (TA) 5, 10, 15 va 20-kunlarda mos ravishda 20%, 27%, 68,9% va 65% ga kamaygan. Taʼm muvozanatini aks ettiruvchi TSS/TA nisbati ishlov berilgan namunalarda yuqoriroq boʻlgan.&lt;/p&gt;\n&lt;p&gt;Saqlash vaqtida pH qiymatlari biroz oshgan. Aloe vera va asal bilan ishlov berish nazoratga qaraganda pH barqarorligini saqlashga yordam bergan, bu esa buzilish jarayonlari sekinlashganini koʻrsatadi.&lt;/p&gt;\n&lt;p&gt;C vitamini konsentratsiyasi saqlash davomida sezilarli darajada kamaygan. 20-kunga kelib nazorat guruhi (T₀) 23,8 mg/100 g C vitaminini yoʻqotgan, T₁ guruhi (100% aloe vera) esa 7,91 mg/100 g ni yoʻqotgan, bu qoplamaning himoya taʼsirini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f1.jpg\" alt=\"Namunalarni tayyorlashning sxematik diagrammasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Namunalarni tayyorlashning sxematik diagrammasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f2.jpg\" alt=\"Aloe vera va aralash gul asalidan tayyorlangan qoplamaning muzlatgichda saqlash vaqtida sharbat yo‘qotilishiga ta’siri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Aloe vera va aralash gul asalidan tayyorlangan qoplamaning muzlatgichda saqlash vaqtida sharbat yo‘qotilishiga ta’siri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Aloe vera va aralash gul asalidan tayyorlangan qoplamaning muzlatgichda saqlash vaqtida sharbat yo‘qotilishiga ta’siri. Qiymatlar o‘rtacha ± standart og‘ish (n = 3) ko‘rinishida keltirilgan. Har xil ustki belgilar bir xil saqlash muddati ichida ishlov berish usullari o‘rtasidagi statistik jihatdan sezilarli farqlarni ko‘rsatadi (p &amp;lt; 0,05), DMRT testiga muvofiq. Ikki faktorli dispersiya tahlili (ANOVA) ishlov berish (T), vaqt (D) va ularning o‘zaro ta’siri (T × D) p &amp;lt; 0,05 darajasida sezilarli ta’sir ko‘rsatishini aniqladi (agar boshqacha qayd etilmagan bo‘lsa). T0 — ishlov berilmagan nazorat namunasi (mango); T1 — 100% aloe vera qoplamali mango; T2 — 100% aralash gul asali qoplamali mango; T3 — 50% aralash gul asali va 50% aloe vera qoplamali mango; T4 — 25% aralash gul asali va 75% aloe vera qoplamali mango; T5 — 75% aralash gul asali va 25% aloe vera qoplamali mango.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f5.jpg\" alt=\"Saqlash muddati va iste’mol qilinadigan qoplama turlarining mango o‘zgaruvchan belgilari, biokimyoviy, mikrobiologik va \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Saqlash muddati va iste’mol qilinadigan qoplama turlarining mango o‘zgaruvchan belgilari, biokimyoviy, mikrobiologik va fiziologik parametrlari bilan o‘zaro bog‘liqligining Pirson korrelyatsion tahlili (p ≤ 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Saqlash muddati va iste’mol qilinadigan qoplama turlarining mango o‘zgaruvchan belgilari, biokimyoviy, mikrobiologik va fiziologik parametrlari bilan o‘zaro bog‘liqligining Pirson korrelyatsion tahlili (p ≤ 0,05). FN — qattiqlik; ML — namlik yo‘qotilishi; TA — titrlanadigan kislotalilik; TFC — umumiy flavonoidlar miqdori; TMY — umumiy mog‘or va achitqi zamburug‘lari soni; TPC — umumiy fenollar miqdori; TSS — umumiy eruvchan quruq moddalar; TSS/TA nisbati — ta’m indeksi; TVC — umumiy hayotchan mikroorganizmlar soni; Vit C — S vitamini.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-f6.jpg\" alt=\"Saqlash muddati va iste’mol qilinadigan qoplama turlarining mango o‘zgaruvchan belgilari, biokimyoviy, mikrobiologik va \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Saqlash muddati va iste’mol qilinadigan qoplama turlarining mango o‘zgaruvchan belgilari, biokimyoviy, mikrobiologik va fiziologik parametrlari bilan o‘zaro bog‘liqligining asosiy komponentlar tahlili (PCA).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Saqlash muddati va iste’mol qilinadigan qoplama turlarining mango o‘zgaruvchan belgilari, biokimyoviy, mikrobiologik va fiziologik parametrlari bilan o‘zaro bog‘liqligining asosiy komponentlar tahlili (PCA). FN — qattiqlik; ML — namlik yo‘qotilishi; TA — titrlanadigan kislotalilik; TFC — umumiy flavonoidlar miqdori; TMY — umumiy mog‘or va achitqi zamburug‘lari soni; TPC — umumiy fenollar miqdori; TSS — umumiy eruvchan quruq moddalar; TSS/TA nisbati — ta’m indeksi; TVC — umumiy hayotchan mikroorganizmlar soni; Vit C — S vitamini.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"
