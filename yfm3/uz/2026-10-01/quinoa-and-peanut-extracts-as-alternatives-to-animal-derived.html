        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"243\" cy=\"66\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"637\" cy=\"286\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · CULTIVATED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Hujayra go‘shti: yeryong‘oq&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;va kinva hayvon oqsiliga&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;muqobil bo‘ladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Hujayra go‘shti ishlab chiqarish an’anaviy ravishda hayvonlardan olingan hujayradan tashqari matritsa oqsillariga tayanadi. Tadqiqotchilar yeryong‘oq va kinva ekstraktlari tarkibida bu komponentlarni muvaffaqiyatli almashtiradigan RGD-motivlari borligini aniqladilar. O‘simlik oqsillari mushak hujayralarining yopishishi va o‘sishini ta’minlab, ishlab chiqarish jarayonini yanada axloqiy va barqaror qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Yeryong‘oq va kinva ekstraktlari hayvon matritsa oqsillarini almashtiruvchi RGD-motivlariga ega.&lt;/li&gt;\n&lt;li&gt;O‘simlik qoplamalari &lt;a href=\"concepts/c2c12.html\"&gt;C2C12&lt;/a&gt; va qoramol hujayralarining o‘sishini ta’minlaydi.&lt;/li&gt;\n&lt;li&gt;Usul hayvon tarkibiy qismlaridan xoli bo‘lgan kultivatsiya muhitini yaratishga imkon beradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Hujayra go‘shtini yaratish uchun kollagen yoki jelatin kabi hujayradan tashqari matritsa (&lt;a href=\"concepts/extracellular-matrix.html\"&gt;ECM&lt;/a&gt;) oqsillari kerak bo‘ladi, ular hujayralarning yuzaga yopishishi va bo‘linishiga yordam beradi. Bu oqsillar hujayra yuzasidagi integrinlar bilan o‘zaro ta’sir qiluvchi RGD-motivlari (arginin-glitsin-aspartik kislota) deb ataladigan maxsus aminokislota ketma-ketliklarini o‘z ichiga oladi. Tadqiqot davomida olimlar o‘simlik oqsillarida shunday motivlarni izlash uchun bioinformatik tahlildan foydalandilar va yeryong‘oq hamda kinvani tanladilar.&lt;/p&gt;\n&lt;p&gt;Ekstraktlar urug‘larni suyuq azotda maydalash va 40°C haroratda fosfat-tuzli buferda (PBS) ekstraktsiya qilish orqali tayyorlandi. Olingan 3,15 mkg/sm² konsentratsiyali eritma bilan Petri idishlari qoplandi. Sichqonlarning C2C12 mioblastlari va qoramol yo‘ldosh hujayralarida o‘tkazilgan tajribalar shuni ko‘rsatdiki, o‘simlik qoplamalari an’anaviy hayvon analoglariga teng darajada yopishish va ko‘payishni ta’minlaydi. Hujayrasiz ekspressiya tizimidan foydalanish yeryong‘oq va kinvadagi RGD-oqsillari aynan shu ta’sir uchun javobgar ekanligini tasdiqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya sharoitida cheklangan hujayra liniyalarida o‘tkazilgan va sanoat miqyosida qo‘llash uchun kengaytirishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"rasmlar\"&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html#rasmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rasmlar&lt;/span&gt;&lt;/a&gt;Rasmlar&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/  font-weight=\"600\"&gt;yopishishi va&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o‘sishi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Axloqiy&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;hujayra&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;go‘shti ishlab&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;chiqarish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maqola taqriz qilinadigan Journal of food science jurnalida nashr etilgan. Ammo bu ham bitta tadqiqot, yakuniy xulosa emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Litsenziya&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Journal of food science (Europe PMC)&lt;/td&gt;\n&lt;td&gt;cultivated&lt;/td&gt;\n&lt
