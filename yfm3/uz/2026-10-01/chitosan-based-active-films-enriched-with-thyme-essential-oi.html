            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"241\" cy=\"134\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"599\" cy=\"267\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PACKAGING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Zig'ir moyi va xitozan:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tovuq go'shtini saqlashning&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yangi usuli&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Xitozan va zig'ir moyi asosidagi yangi faol qadoqlash plastik chiqindilarni kamaytirish va oziq-ovqat xavfsizligini ta'minlash uchun istiqbolli yechimdir. Tadqiqot shuni ko'rsatdiki, ushbu plyonka E. coli va L. innocua bakteriyalarining ko'payishini samarali to'xtatadi. Bu usul sovutgichda saqlanadigan tovuq filesi sifatini besh kungacha saqlab qolishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;2,5% zig'ir moyi qo'shilgan xitozan plyonkasi E. coli va L. innocua bakteriyalariga qarshi samarali.&lt;/li&gt;\n&lt;li&gt;Faol qadoqlash sovutgichdagi tovuq go'shtida oqsil va lipidlarning oksidlanishini kamaytiradi.&lt;/li&gt;\n&lt;li&gt;Moy konsentratsiyasining 2,5% dan yuqori bo'lishi 5 kundan keyin go'shtning tashqi ko'rinishiga salbiy ta'sir qilishi mumkin.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar xitozanni — qisqichbaqasimonlar qobig'idan olinadigan biopolimerni — faol plyonka yaratish uchun asos sifatida ishlatdilar. Tarkibga gaz xromatografiyasi-mass-spektrometriya yordamida 29 ta birikma, jumladan p-tsimen (30,56%) va timol (24,59%) aniqlangan zig'ir efir moyi (&lt;a href=\"concepts/thyme-essential-oil.html\"&gt;TEO&lt;/a&gt;) qo'shildi. Plyonkalar 2,5% va 3% moy konsentratsiyasi bilan tayyorlandi va 5 °C haroratda tovuq filesida sinovdan o'tkazildi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, moy qo'shilishi nazorat namunalariga nisbatan mikrobial yukni sezilarli darajada kamaytiradi, nazorat namunalarida esa beshinchi kunga kelib bakteriyalar darajasi 6-7 log CFU/g dan oshib ketgan. Faol qadoqlash oqsil va lipidlarning oksidlanishini sekinlashtiradi. Biroq, 3% moy konsentratsiyasida beshinchi kunga kelib go'sht rangining sezilarli darajada yomonlashishi kuzatildi, bu sanoat ishlab chiqarishida e'tiborga olinishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 5 °C haroratda laboratoriya sharoitida o'tkazilgan, ta'm va hid kabi organoleptik xususiyatlarga ta'siri qo'shimcha baholashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;go'shtning&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;buzilishi va&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;plastik&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;chiqindilar&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;xitozan va&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;zig'ir moyidan&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;plyonka&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bakteriyalar&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va oksidlanish&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ning kamayishi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yaroqlilik&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;muddatini&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ekologik&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;uzaytirish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maqola taqriz qilinadigan Foods (Basel, Switzerland) jurnalida nashr etilgan. Ammo bu ham bitta tadqiqot, yakuniy xulosa emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&l
