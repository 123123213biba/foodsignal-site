            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"88\" cy=\"106\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"191\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · MICRONUTRIENTS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Qandli diabeti bor o‘smirlar&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;uchun raqamli ta’lim&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;platformasi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f1.jpg\" alt=\"Loyiha bosqichlari xulosasi. TAM: Texnologiyalarni qabul qilish modeli (Technology Acceptance Model).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Loyiha bosqichlari xulosasi. &lt;a href=\"concepts/technology-acceptance-model.html\"&gt;TAM&lt;/a&gt;: Texnologiyalarni qabul qilish modeli (Technology Acceptance Model).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;1-turdagi qandli diabet tashxisi o‘smirlar uchun katta psixologik yuk bo‘lib, ovqatlanishni nazorat qilishni qiyinlashtiradi. Tadqiqotchilar hamshiralar va bemorlar ehtiyojlariga moslashtirilgan interaktiv veb-platformani yaratdilar. Ushbu vosita an’anaviy qo‘llanmalardan farqli o‘laroq, o‘quv jarayonini qiziqarli va tushunarli qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;97,5% mutaxassislar platformani ta’lim uchun qulay deb topdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-centered-design.html\"&gt;HCD&lt;/a&gt; yondashuvi vositani o‘smirlar uchun intuitiv va qiziqarli qildi.&lt;/li&gt;\n&lt;li&gt;90% hamshiralar platformani klinik amaliyotda qo‘llashni rejalashtirmoqda.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Platforma inson markazli dizayn (HCD) tamoyillari asosida ishlab chiqilgan bo‘lib, u foydalanuvchining hissiy va texnik ehtiyojlarini hisobga oladi. Dastlabki bosqichda hamshiralar ishtirokida fokus-guruhlar o‘tkazilib, mavjud ta’lim materiallaridagi kamchiliklar aniqlandi. React texnologiyasi yordamida yaratilgan platforma barcha turdagi qurilmalarda moslashuvchan ishlash imkonini beradi.&lt;/p&gt;\n&lt;p&gt;40 nafar mutaxassis ishtirokida o‘tkazilgan sinovlar platformaning yuqori samaradorligini ko‘rsatdi. Texnologiyani qabul qilish modeli (TAM) asosida o‘tkazilgan so‘rovnomada 97,5% ishtirokchilar vositani ta’lim jarayonini osonlashtiruvchi deb baholadilar. 90% mutaxassislar uni o‘z ish faoliyatida qo‘llashga tayyor ekanliklarini bildirishdi. O‘yin elementlari o‘smirlarning murakkab tibbiy ma’lumotlarni o‘zlashtirishini sezilarli darajada osonlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat tibbiyot xodimlarining fikriga tayanadi, bemorlarning uzoq muddatli klinik natijalari o‘rganilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;1-turdagi qandli diabet (T1DM) surunkali autoimmun kasallik boʻlib, u diabetning barcha holatlarining atigi 10% ini tashkil etsa-da, pediatrik va oʻsmirlar populyatsiyasida yuqori tarqalish koʻrsatkichiga ega. Uning boshlanishi ham bemor, ham uning oilaviy muhiti uchun ayniqsa ogʻir kechadi. Ispaniyada 15 yoshgacha boʻlgan 30 000 dan ortiq bolalar ushbu patologiya bilan yashaydi, kasallanish darajasi yiliga har 100 000 bolaga 17 ta holatni tashkil etadi va geografik nomutanosibliklar Andalusiyani eng yuqori koʻrsatkichlarga ega hududlar qatoriga kiritadi. Klinik darajada T1DM ning metabolik taʼsiri yaxshi tasvirlangan; ammo, tashxis qoʻyilgan vaqtdagi psixososyal taʼsiri kamroq koʻzga tashlanadi va uni hal qilish qiyinroq. Oilalar toʻsatdan murakkab masʼuliyatlarga duch kelishadi: glikemik nazorat, insulin yuborish va eng muhimi, ratsion parhez usuli yordamida kundalik ovqatlanishni boshqarish. Bu jarayon yuqori hissiy yuk, qoʻrquv, aybdorlik hissi, stress va axborotning haddan tashqari koʻpligi sharoitida yuz beradi. Aynan shu sababli kasallikning ilk lahzalari hal qiluvchi ahamiyatga ega: nafaqat davolash asosi, balki bemor, uning oilasi va sogʻliqni saqlash tizimi oʻrtasidagi munosabatlar ohangi ham belgilanadi. Aynan shu yerda muhim taʼlim toʻsiqlari paydo boʻladi: texnik tushunchalarni oʻzlashtirishdagi qiyinchiliklar, past nutritiv savodxonlik, uglevodlarni hisoblashga rioya qilmaslik va oilalarning real imkoniyatlariga moslashtirilgan vositalarning cheklanganligi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pediatrik populyatsiyada T1DM ni boshqarishning asosiy toshlaridan biri uglevodlarga asoslangan parhezni boshqarishni toʻgʻri oʻrganish va qoʻllashdir. Bu yondashuv har bir ovqatlanish uchun uglevod miqdorini hisoblashni va glikemik profil hamda jismoniy faoliyatga qarab tezkor insulin dozalarini sozlashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Anʼanaviy oʻquv qoʻllanmalari mavjud boʻlsa-da, ularning koʻpchiligi oilalar kasallik boshlanishida boshdan kechiradigan stress va kuchli his-tuygʻular uchun mos emas. Insulin terapiyasi va diabet texnologiyalaridagi yutuqlarga qaramay, hozirgi klinik koʻrsatmalar cheklovchi parhez modellaridan koʻra individual va bemorga yoʻnaltirilgan yondashuvlarni taʼkidlaydi. Biroq, bu strategiyalar hamma joyda qabul qilinmagan va koʻplab bemorlar hali ham kundalik glikemik nazorat uchun asosiy vosita sifatida uglevodlarni hisoblashga tayanadilar. Soʻnggi tadqiqotlar shuni koʻrsatdiki, hatto ilgʻor sogʻliqni saqlash tizimlarida ham har bir bemorning hayotiy va madaniy bosqichlariga moslashtirilgan diabet taʼlimini taqdim etishda tarkibiy kamchiliklar mavjud. Parhez tavsiyalariga rioya qilmaslik bilim yetishmasligi bilan emas, balki taʼlim vositalari va foydalanuvchilar tajribasi oʻrtasidagi uzilish bilan izohlanadi. Bu boʻshliq raqamli muhitda yanada kuchayadi: oilalar, ayniqsa yoshlar, intuitiv, interaktiv va geymifikatsiyalangan texnologiyalarga oʻrganib qolgan. Biroq, koʻplab taʼlim dasturlari qatʼiy, bir tomonlama va jozibador boʻlmagan oʻquv rejalarini taklif qiladi. Bundan tashqari, diabet boʻyicha hamshira-pedagoglar bolalar va oʻsmirlar bilan parvarishlash tartiblariga integratsiya qila oladigan aniq va kelishilgan raqamli materiallarning yoʻqligini taʼkidlaydilar.&lt;/p&gt;\n&lt;p&gt;Ushbu voqelikni hisobga olgan holda, inson markazli dizayn (HCD) oxirgi foydalanuvchining realligiga moslashtirilgan texnologik yechimlar orqali murakkab sogʻliqni saqlash muammolarini hal qilish uchun mustahkam uslubiy muqobil sifatida shakllantirilgan. HCD uchta asosiy tamoyil bilan tavsiflanadi: foydalanuvchiga chuqur empatiya, foydalanuvchining faol ishtiroki bilan uzluksiz iteratsiya va real kontekstlarga moslashtirilgan funksional dizayn. Bu istiqbol texnologik dizaynning klassik modellaridan uzoqlashadi, bu yerda bemor passiv qabul qiluvchi hisoblanadi. U bemorni kashfiyot bosqichidan yakuniy validatsiyagacha boʻlgan jarayonning hammuallifiga aylantiradi. Bundan tashqari, bu yondashuv ovqatlanish yoki surunkali kasalliklarda oʻz-oʻzini parvarish qilish kabi xulq-atvor oʻzgarishlarini talab qiladigan sogʻliqni saqlash aralashuvlarida ayniqsa samarali ekanligini isbotladi. Empatiya xaritalari, tezkor prototiplash, amaliyotchilar bilan birgalikda yaratish va real foydalanuvchilar bilan ketma-ket validatsiyalar kabi vositalarni oʻz ichiga olgan holda, HCD uzoq muddatda yanada foydalanishga yaroqli, hissiy jihatdan maqbul va barqaror mahsulotlarni taʼminlaydi. Shu nuqtai nazardan, ushbu tadqiqot kech boshlangan (oʻsmirlik davridagi) T1DM da ovqatlanish taʼlimida diabet boʻyicha hamshira-pedagoglarni qoʻllab-quvvatlash uchun moʻljallangan, veb-asosli, interaktiv va geymifikatsiyalangan platforma — &lt;a href=\"concepts/smartcloth-odyssey.html\"&gt;SMARTCLOTH-Odyssey&lt;/a&gt; ning dizayn va baholash jarayonini tasvirlashga qaratilgan.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot HCD tamoyillariga mos keladigan va iterativ uzluksiz takomillashtirish jarayoniga asoslangan aralash va ketma-ket uslubiy yondashuvga amal qildi. Platformani ishlab chiqish uchta asosiy bosqichda tuzilgan: fokus-guruhlar orqali izlanishning birinchi sifat bosqichi; sinov bilan dizayn va funksional prototiplashning ikkinchi bosqichi; va diabet boʻyicha hamshira-pedagoglar tomonidan raqamli vositaning idrok etilgan qabul qilinishi tahlil qilingan uchinchi baholash bosqichi (1-rasm). Dastlabki bosqichda T1DM debuti boʻyicha diabet taʼlimida bevosita tajribaga ega boʻlgan sogʻliqni saqlash mutaxassislarining qarashlari toʻplandi. Ushbu maʼlumotlar prototipni amalga oshirish va iterativ koʻrib chiqish orqali takomillashtirilgan funksional dizayn taklifi uchun asos boʻldi. Parallel ravishda, platformaning foydalanish qulayligi va texnologik qabul qilinishiga qaratilgan baholash rejalashtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HCD (Inson markazli dizayn) — bu foydalanuvchining ehtiyojlari va tajribasini (bu holda T1DM bilan ogʻrigan bolalar oilalari va hamshiralar) ishlab chiqishning barcha bosqichlarida birinchi oʻringa qoʻyadigan loyihalash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotning birinchi bosqichi Andalusiyaning (Ispaniya) turli provinsiyalarida ishlaydigan diabet boʻyicha hamshira-pedagoglarning tajribasi, idroki va ehtiyojlarini chuqur oʻrganish uchun onlayn fokus-guruhlarga asoslangan sifat yondashuvini qabul qildi. Ushbu birinchi yondashuv oʻquv dasturini keyingi rivojlantirish T1DM ning dastlabki bosqichlarida ovqatlanish taʼlimi yuz beradigan klinik muhitni real va kontekstuallashtirilgan tushunishga asoslanishini taʼminlash uchun amalga oshirildi. 2024-yil 6 va 7-mart kunlari videokonferensiya orqali ikkita fokus-guruh sessiyasi oʻtkazildi. Fokus-guruhlar sifat tadqiqotlari va diabet taʼlimi boʻyicha tajribaga ega boʻlgan tadqiqot guruhi aʼzolari tomonidan oʻtkazildi. Ikkala sessiyada ham pediatrik diabet taʼlimida faol boʻlgan, turli darajadagi professional tajribaga ega hamshiralar ishtirok etdi (1-jadval). Sessiyalar videoga olindi va maxfiylikning axloqiy tamoyillariga qatʼiy rioya qilgan holda toʻliq transkripsiya qilindi: shaxsiy maʼlumotlar va aralashuvlar keyingi sifat tahlili uchun anonimlashtirildi va kodlandi. Tanlash maqsadli edi va hududiy va professional xilma-xillikni taʼminlash uchun ataylab tashkil etildi.&lt;/p&gt;\n&lt;p&gt;1-jadval. Fokus-guruh ishtirokchilari.&lt;br /&gt;\nKod nomi / Yosh (yillar) / Pedagog sifatidagi tajriba (yillar) / Provinsiya&lt;br /&gt;\nN1 / 61 / 10 / Kordova&lt;br /&gt;\nN2 / 56 / 6 / Almeriya&lt;br /&gt;\nN3 / 40 / 1 / Kadis&lt;br /&gt;\nN4 / 36 / 2 / Xaen&lt;br /&gt;\nN5 / 44 / 3 / Malaga&lt;br /&gt;\nN6 / 37 / 2 (shuningdek nutrisiolog) / Sevilya&lt;/p&gt;\n&lt;p&gt;Guruhlar loyiha maqsadlari va HCD kontseptual asoslari asosida ishlab chiqilgan umumiy ssenariy atrofida tuzilgan. Ushbu ssenariy toʻrtta keng tahliliy oʻlchovga guruhlangan ochiq savollarni oʻz ichiga olgan: (1) Texnologiyani (raqamli kitoblar va qoʻllanmalar, ilovalar va raqamli platformalar) oʻz ichiga olgan taʼlim vositalaridan foydalanish tajribasi. (2) Hamshira nuqtai nazaridan ham, bemor va oila nuqtai nazaridan ham samaraliroq va kamroq samarali vositalarni idrok etish. (3) Texnik, kommunikativ va hissiy jihatlarni oʻz ichiga olgan taʼlim resurslarini tanlash uchun shaxsiy mezonlar. (4) Bemorlar va ularning gʻamxoʻrlari ehtiyojlari haqida tushuncha, ayniqsa ovqatlanishni davolash debuti va unga rioya qilish kontekstida. Vakillik savollari \"Siz qanday texnologik resurslardan foydalangansiz yoki tavsiya qilgansiz?\", \"Qaysi vositalarni eng samarali deb hisoblaysiz va nima uchun?\" yoki \"Oilalar uchun mavjud vositalarda qanday boʻshliqlarni aniqladingiz?\" kabilarni oʻz ichiga olgan. Ushbu tuzilma umumiy amaliyotlar va idrok etilgan toʻsiqlar, bogʻliq his-tuygʻular va kutishlar kabi asosiy subyektiv elementlar haqida maʼlumot olish imkonini berdi. Toʻplangan maʼlumotlar soʻzma-soʻz transkripsiya qilindi va tematik kategoriyali kodlash strategiyasi yordamida tahlil qilindi. Ushbu yondashuv ishtirokchilar oʻrtasida umumiy va farqli naqshlarni aniqlash imkonini berdi va raqamli platformaning keyingi dizaynini xabardor qildi. Maʼlumotlarni yigʻish tematik toʻyinganlikka erishilgunga qadar davom etdi. Tahlil ikki tadqiqotchi tomonidan mustaqil ravishda oʻtkazildi, kelishmovchiliklar muhokama orqali hal qilindi.&lt;/p&gt;\n&lt;p&gt;Dastlabki sifat tadqiqot bosqichidan soʻng, 2 nafar diabet boʻyicha hamshira-pedagog, 1 nafar pediatrik endokrinologiya boʻyicha mutaxassis shifokor, 2 nafar veb-dasturchi va fan taʼlimi boʻyicha tajribaga ega 1 nafar universitet oʻqituvchisi bilan birgalikda yaratish sessiyasi tashkil etildi. Platformaning tarkibiy bloklari va pedagogik hikoyasi ushbu makonda belgilandi va fokus-guruhlar topilmalariga koʻra progressiv oʻquv modullariga boʻlindi. 2024-yil aprel oyida taklif etilgan tuzilma va tarkib ishtirokchi hamshiralarga taqdim etildi, ular buni tasdiqladilar va yaxshilash boʻyicha tavsiyalar berdilar. Keyinchalik tarkibni pedagogik va texnik koʻrib chiqishda hamkorlik qilish uchun uchta ishchi guruh tashkil etildi. Shundan soʻng, platformaning grafik dizayni va dasturlash boʻyicha ketma-ket yutuqlarga erishildi. SMARTCLOTH-Odyssey ning funksional versiyasi amalga oshirilgandan soʻng, vaqt jadvalining turli bosqichlarida uchta tuzilgan sinov sessiyasi oʻtkazildi: (1) 2024-yil 24-oktabr: diabet boʻyicha hamshira-pedagoglar ishtirok etdi; (2) 2025-yil 20-mart: parhez terapiyasi va diabet taʼlimi boʻyicha bilimga ega boʻlgan, ovqatlanish parvarishi kursini oʻtagan hamshiralik talabalari ishtirok etdi; va (3) 2025-yil 15-may: ham hamshiralar, ham pediatrlar ishtirok etdi, bu koʻproq klinik va integrativ koʻrinishni taʼminlash uchun (2-jadval).&lt;/p&gt;\n&lt;p&gt;2-jadval. Sinov sessiyalari ishtirokchilari.&lt;br /&gt;\nSessiya / Kod nomi / Yosh / Tajriba / Provinsiya&lt;br /&gt;\n24 okt 2024 / N7–N11 / 36–56 / 3–15 / Kadis, Kordova, Almeriya, Sevilya, Xaen&lt;br /&gt;\n20 mart 2025 / NS1–NS7 / 18–20 / N/A / Sevilya, Kordova, Uelva, Xaen&lt;br /&gt;\n15 may 2025 / N11–N20, P1–P2 / 34–59 / 3–37 / Uelva, Kordova, Kadis, Almeriya, Xaen&lt;/p&gt;\n&lt;p&gt;Mart sessiyasi raqamli savodxonligi yuqori boʻlgan oxirgi foydalanuvchilarga (oʻsmirlarga) yaqin koʻrinishni olish uchun yosh talabalarni oʻz ichiga oldi. Platforma React (Meta Platforms, Inc) yordamida ishlab chiqilgan boʻlib, u ish stoli, planshet va smartfonlarda moslikni taʼminlaydigan sezgir dizaynni qoʻllab-quvvatlaydi. Sinov sessiyalari asosan ish stoli muhitida oʻtkazildi, bu ekran yozib olish va \"think-aloud\" protokoli yordamida tuzilgan kuzatuv maʼlumotlarini yigʻishni osonlashtirdi. Sessiyalar davomida obyektiv baholash bloklari va sifatli kuzatuv bilan tuzilgan foydalanish qulayligi tahlili panjaralari ishlatildi. Atrof-muhitni umumiy tushunish, vazifalarni bajarish qulayligi, menyular, tarkib va multimedia bilan oʻzaro taʼsir, spontan reaksiyalar, takliflar va qiyinchiliklar tahlil qilindi. Taklif etilgan vazifalar profil yaratish, geymifikatsiyalangan tarkibga kirish, videolarni oʻrganish, savollarga javob berish va baʼzi video oʻyinlarni oʻynashni oʻz ichiga olgan. \"Think-aloud\" texnikasi ishtirokchilardan koʻrib chiqish paytida oʻz fikrlari, idroklari va qarorlarini ogʻzaki ifodalashni soʻrab ishlatildi. Ushbu texnika bizga ishqalanish, chalkashlik yoki ortiqcha yuklanish joylarini aniqlash va motivatsiya yoki qoniqish hosil qiluvchi elementlarni tasdiqlash imkonini berdi.&lt;/p&gt;\n&lt;p&gt;Oxirgi sessiya oxirida ishtirokchilar yon menyuda mavjud boʻlgan veb-platformaga moslashtirilgan Texnologiyani qabul qilish modeli soʻrovnomasini toʻldirdilar. Ushbu versiya Devisning asl taklifiga va uning keyingi kengaytmasiga asoslangan boʻlib, loyihaning aniq konteksti uchun moslashtirilgan va tasdiqlangan. Soʻrovnoma quyidagi oʻlchovlarni baholadi: (1) idrok etilgan foydalilik, (2) idrok etilgan foydalanish qulayligi, (3) foydalanishga boʻlgan munosabat va (4) foydalanish niyati. Javoblar soʻrovnomadagi bayonotlarga toʻrt darajali kelishuv bilan Likert tipidagi shkala yordamida talqin qilindi.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqotning tahliliy yondashuvi SMARTCLOTH-Odyssey platformasini loyihalash, ishlab chiqish va validatsiya qilish jarayonining turli bosqichlarida foydalanuvchi xulq-atvori, tajribasi va qabul qilinishini har tomonlama tushunishni taʼminlash uchun sifat va miqdoriy usullarni birlashtirdi. Sifat maʼlumotlari boʻyicha fokus-guruh sessiyalari transkriptlari va \"think-aloud\" bilan foydalanish qulayligi sinovlari boʻyicha tematik tarkib tahlili oʻtkazildi. Ikkinchisi foydalanuvchi testlari davomida qoʻllanildi va ishtirokchilar vosita bilan oʻzaro taʼsir oʻtkazayotganda ifodalagan fikrlash, qiyinchiliklar, shubhalar yoki hukmlarni real vaqt rejimida qamrab olish imkonini berdi. Audiolar transkripsiya qilindi va anonimlashtirildi, ogʻzaki ifodalar tushunish, navigatsiya, idrok etilgan foydalilik, texnologik toʻsiqlar va veb-takomillashtirish boʻyicha takliflar bilan bogʻliq oldindan belgilangan va paydo boʻlgan kategoriyalar boʻyicha kodlandi va tasniflandi. Miqdoriy maʼlumotlarga kelsak, ishtirokchilarni sotsiodemografik va professional oʻzgaruvchilarga (yosh, tajriba yillari va h.k.) koʻra tavsiflash uchun tavsiflovchi statistika qoʻllanildi, sifat oʻzgaruvchilari mutlaq va nisbiy chastotalarda, miqdoriy oʻzgaruvchilar esa markaziy tendensiya va dispersiya oʻlchovlari (median va IQR) orqali ifodalandi. Platformaning texnologik qabul qilinishini baholash uchun javoblar toʻrt darajali Likert tipidagi shkala yordamida talqin qilindi va har bir daraja uchun javob foizlari oʻrganildi. Ushbu tasnif platformaning qabul qilinish darajasini obyektiv aniqlash va uni sessiyalarda qilingan sifat kuzatuvlari bilan solishtirish imkonini berdi.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot Ispaniyada inson ishtirokchilari ishtirokidagi tadqiqotlar boʻyicha amaldagi qoidalarga muvofiq, 2018-yil 5-dekabrdagi Shaxsiy maʼlumotlarni himoya qilish va raqamli huquqlarni kafolatlash toʻgʻrisidagi 3/2018-sonli Organik qonunda belgilangan qoidalarga rioya qilgan holda oʻtkazildi. Xuddi shunday, Xelsinki deklaratsiyasi, Yevropa Kengashining Inson huquqlari va biotibbiyot toʻgʻrisidagi konvensiyasi va YUNESKO (Birlashgan Millatlar Tashkilotining Taʼlim, fan va madaniyat masalalari boʻyicha tashkiloti) Inson genomi va inson huquqlari toʻgʻrisidagi umumjahon deklaratsiyasida (1997) mavjud boʻlgan asosiy axloqiy tamoyillarga rioya qilindi. Ishtirokchilardan hech qanday klinik yoki sezgir maʼlumotlar toʻplanmadi, chunki faoliyat faqat foydalanish qulayligini tahlil qilish va Texnologiyani qabul qilish modeli soʻrovnomasi orqali texnologik qabul qilinishini baholashga qaratilgan edi. Biroq, sinov sessiyalari davomida video va audio yozuvlar olinganligini hisobga olgan holda, barcha ishtirokchilar xabardor qilingan rozilik shaklini va tasvir huquqlarini oʻtkazish uchun maxsus rozilik shaklini imzoladilar. Ushbu tadqiqot Kordova provinsiyasining Tadqiqotlar boʻyicha axloq qoʻmitasi (Comité de Ética de la Investigación Provincial de Córdoba) tomonidan 2024-yil 24-aprelda boʻlib oʻtgan 361-sonli yigʻilishida axloqiy tasdiq olgan SMARTCLOTH texnologik yechimlar ekotizimini rivojlantiruvchi kengroq tadqiqot loyihasining bir qismidir. Ishtirokchilar oʻz ishtiroklari uchun hech qanday moliyaviy kompensatsiya olmadilar.&lt;/p&gt;\n&lt;p&gt;Ikki fokus-guruh Andalusiyaning turli provinsiyalaridan jami 6 nafar diabet boʻyicha hamshira-pedagogni birlashtirdi. Muhokamalar ravon, keng qamrovli va boy nuanslarga ega boʻlib, tadqiqot guruhiga pediatrik T1DM debuti boʻyicha haqiqiy taʼlim amaliyotining batafsil koʻrinishini taqdim etdi (3 va 4-jadvallar).&lt;/p&gt;\n&lt;p&gt;3-jadval. SMARTCLOTH-Odyssey sayyoralari boʻyicha taʼlim mazmunini taqsimlash.&lt;br /&gt;\nSayyora / Mazmun / Geymifikatsiya&lt;br /&gt;\nNewland / T1DM ga umumiy kirish, glikemiya va giperglikemiya taʼrifi, simptomlar / Kiritilmagan&lt;br /&gt;\nDiabion / T1DM nima? Glyukozaning energiyadagi roli, metabolizm, insulin / Savol va javoblar&lt;br /&gt;\nGlucopolis / Diabet qanday boshqariladi? Ovqatlanish va insulinning ahamiyati / Organlar joylashuvi, labirintlar, alifbo shoʻrvasi&lt;br /&gt;\nGluconebula / Oʻzimni qanday his qilyapman? Hissiy va psixologik vaziyatlar / Kiritilmagan&lt;br /&gt;\nAlimentarium / Har kuni nima yeymiz? Makronutriyentlar tarkibi / Oziq-ovqatni makronutriyentga koʻra saralash (Drag and drop)&lt;br /&gt;\nDexteria Prime / Glikemik indeks va glikemik yuk / Glikemik indeks va yuk viktorinasi&lt;br /&gt;\nPlatopia / Qanday ovqatlanishim kerak? Oziq-ovqat tanlash, chastota, porsiya oʻlchamlari / Garvard sogʻlom likopchasiga oziq-ovqat qoʻyish&lt;br /&gt;\nSportland / Diabet bilan sport oʻynash / Jismoniy faoliyat davomida ovqatlanish xususiyatlari / Kiritilmagan&lt;br /&gt;\nRacionix / Ratsionni qanday hisoblash mumkin? Ratsion tushunchasi va hisoblash usuli / Ratsion hisoblash uchun idishlar va oziq-ovqat misollari&lt;br /&gt;\nGluconix / Oziq-ovqat yorligʻi / Ratsion hisoblash uchun yorliqlar misollari&lt;br /&gt;\nOn the way home / Koʻrib chiqish / Har bir blokda olingan bilimlarni mustahkamlash uchun savollar / Har bir tematik blokdan tasodifiy savollar&lt;br /&gt;\nEarth / Menyu tuzish va ratsionni hisoblash / Menyu tuzish uchun oziq-ovqatni joylashtirish&lt;/p&gt;\n&lt;p&gt;4-jadval. Fokus-guruhlarda tahlil kategoriyalariga koʻra olingan maʼlumotlar xulosasi.&lt;br /&gt;\nKategoriya / Asosiy maʼlumotlar / Baʼzi iqtiboslar [ispan tilidan tarjima qilingan]&lt;br /&gt;\nTaʼlim materiallari va strategiyalarining xilma-xilligi / Amaliyotchilar oʻz mezonlariga moslashtirilgan turli resurslardan foydalanadilar, ammo umumiy naqshsiz. / \"Va Diabet jamgʻarmasi jadvali, unda ratsionni taʼminlaydigan xom va pishirilgan ovqatning vazni bor, u ham Diabet jamgʻarmasidan. U ham.\"&lt;br /&gt;\nHissiy toʻsiqlar va moslashish qiyinchiliklari / Debut sezilarli hissiy taʼsir va oʻrganishga toʻsqinlik qiladigan kontekstual toʻsiqlar bilan kechadi. / \"...Men buni (ovqatlanish taʼlimi) qilayotganimda, oila juda ezilgan va taʼlim yondashuvi eng koʻp rad etishga sabab boʻladigan qism...\"&lt;br /&gt;\nHomogenizatsiya va tizimlashtirish zarurati / Mavjud tarkibni tashkil etish, filtrlash va birlashtirish tarqalishning oldini olish uchun zarur. / \"Hamma narsa kelishilgan boʻlishi va biz hammamiz...\"&lt;br /&gt;\nRaqamli va geymifikatsiyalangan vositalarni baholash / Ishtirokchilar texnologiyalar va oʻyinlardan foydalanishni innovatsion taʼlim yordami sifatida qadrlashadi. / \"...boshqacha aytganda, men tushunaman, XXI asrda bosma PDF berishdan uyalaman...\"&lt;/p&gt;\n&lt;p&gt;Eng aniq topilmalardan biri amaliyotchilar tomonidan qoʻllaniladigan materiallar va yondashuvlarning katta xilma-xilligi va sifati edi. Ratsion parhezini oʻrgatish muhimligi boʻyicha hamma rozi boʻlsa-da, ishlatilgan shakl va resurslar geterogen edi. Shunday qilib, N2 shunday dedi: Agar biz oziq-ovqat yorliqlarini oʻqimoqchi boʻlsak va ular uchlik qoidalarini qanday qilishni bilishsa, men boshqa tushuntirmayman, lekin boʻlmasa, ularga HC kalkulyator ilovasini yuklab olishni aytaman... N3 va N6 esa oilalar va hamshiralar tomonidan yaxshi qabul qilingan texnologiyaga asoslangan vositalar va taʼlim veb-saytlarini ajratib koʻrsatishdi: Masalan, menga La Mesa Azul juda yoqadi, chunki men aytganimdek, ular nutrisiologlar, ular ishtirok etishadi va diabet haqida koʻp narsani bilishadi va yangilangan. [N3]&lt;/p&gt;\n&lt;p&gt;Barcha ishtirokchilar tashxis qoʻyilgan paytda oilalar va bemorlarni oʻrgatishning hissiy qiyinchiligini, yuqori hissiy yuk va zaiflik kontekstini taʼkidladilar. Xuddi shunday, bir vaqtning oʻzida katta hajmdagi maʼlumotni taqdim etish, hatto tezda oʻqilishi kerak boʻlgan butun asosiy kitoblar ham stress manbai sifatida koʻriladi. N6 shunday dedi: Va men buni zerikarli va juda charchatadigan deb bilaman... Ular biroz ezilgan holda kelishadi. \"Men kitobni oʻqishga ulgurmadim\". Biz javob beramiz, \"Xoʻsh, xavotir olmang...\"&lt;/p&gt;\n&lt;p&gt;Eng aniq konsensuslardan biri kundalik, qulay, umumiy va ishonchli asos boʻlib xizmat qiladigan vositaga boʻlgan ehtiyoj edi, N3 taʼkidlaganidek: Menimcha, oxir-oqibat biz konsensusga erishishimiz kerak va biz foydalanadigan barcha materiallar... hamkasbimiz ilgari aytib oʻtgan narsa boʻlishi kerak. Hamma narsa kelishilgan boʻlishi va biz hammamiz... Men ishonchli veb-saytlar boʻlishini nazarda tutyapman.&lt;/p&gt;\n&lt;p&gt;Raqamli vositalar va ularning salohiyati haqidagi idrok ijobiy edi, ayniqsa oʻsmirlarga nisbatan. Maslahatlashuv davomida baʼzan foydalanishga majbur boʻlgan ish haqidagi idrokning tavsifi ajralib turadi: Bu mavjud emas. Menimcha, XXI asrda bosma PDF berishdan uyalaman. Men sizga vaʼda beraman... Mobil telefoningizdan Xitoydan bogʻingiz qandayligini koʻra olsangiz, biz beradigan yechimlar tarixgacha boʻlgan narsalardir. [N6]&lt;/p&gt;\n&lt;p&gt;Oxir-oqibat, tahlildan guruh tomonidan baham koʻrilgan va keyingi dizayn bosqichini boshqargan bir nechta asosiy nuqtalar paydo boʻldi: (1) qimmatli va ishonchli maʼlumotlar va resurslar boyligi mavjud; (2) bu maʼlumotlar keng tarqalgan va har doim ham qayta foydalanish uchun foydali tarzda tashkil etilmagan yoki tuzilmagan; (3) har bir hamshira oʻzi uchun eng qulay va samarali boʻlgan materiallar va usullardan foydalanadi, bu esa oʻqitishda tengsizliklarga olib keladi; va (4) didaktik, sodda va moslashuvchan tarzda asosiy tarkibni birlashtiradigan standart raqamli vositaga boʻlgan ehtiyoj mavjud.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f1.jpg\" alt=\"Loyiha bosqichlari xulosasi. TAM: Texnologiyalarni qabul qilish modeli (Technology Acceptance Model).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Loyiha bosqichlari xulosasi. TAM: Texnologiyalarni qabul qilish modeli (Technology Acceptance Model).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f2.jpg\" alt=\"2025-yil 15-maydagi foydalanuvchi testlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2025-yil 15-maydagi foydalanuvchi testlari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f3.jpg\" alt=\"TAM so‘rovnomasini to‘ldirish uchun veb-sayt skrinshoti (ispan tilida). Profes.: tibbiyot mutaxassisi turi; TAM: Texnolo\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;TAM so‘rovnomasini to‘ldirish uchun veb-sayt skrinshoti (ispan tilida). Profes.: tibbiyot mutaxassisi turi; TAM: Texnologiyalarni qabul qilish modeli.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f4.jpg\" alt=\"SMARTCLOTH-Odyssey asosiy ekrani.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SMARTCLOTH-Odyssey asosiy ekrani.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f5.jpg\" alt=\"SMARTCLOTH-Odyssey tizimiga kirish ekrani (ispan tilida).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SMARTCLOTH-Odyssey tizimiga kirish ekrani (ispan tilida).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f6.jpg\" alt=\"SMARTCLOTH-Odyssey yulduz xaritasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SMARTCLOTH-Odyssey yulduz xaritasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete-f7.jpg\" alt=\"SMARTCLOTH-Odyssey yon menyusi. TAM: Texnologiyani qabul qilish modeli (Technology Acceptance Model).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;SMARTCLOTH-Odyssey yon menyusi. TAM: Texnologiyani qabul qilish modeli (Technology Acceptance Model).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect widt
