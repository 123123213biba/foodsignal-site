            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"203\" cy=\"146\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"677\" cy=\"239\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt bolalar&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;taomnomasini tekshirishda&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mutaxassislarga yuta oladimi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Ota-onalar bolalar taomnomasini tahlil qilishda borgan sari ko'proq neyrotarmoqlarga tayanmoqda. Yangi tadqiqotda 42 ta sun'iy intellekt platformasi va 260 nafar shifokorning baholari ekspert konsiliumi xulosasi bilan solishtirildi. Algoritmlar oziq-ovqatning qayta ishlanish darajasi va xilma-xilligini aniqlashda odamlardan o'zib ketdi. Biroq kaloriyalar va porsiya hajmini hisoblashda sun'iy intellekt eng katta xatolikka yo'l qo'ydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Sun'iy intellekt ovqatning qayta ishlanish darajasini shifokorlardan aniqroq topdi&lt;/li&gt;\n&lt;li&gt;Neyrotarmoq bolalar menyusi kaloriyasida o'rtacha 260,3 kkal adashdi&lt;/li&gt;\n&lt;li&gt;Algoritmlar umumiy tahlil uchun qulay, ammo porsiyani mutaxassis tekshirishi shart&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqot uchun 3, 7 va 12 yoshli sog'lom bolalarning taomnoma kundaliklari, porsiya vaznlari va fotosuratlari asos qilib olindi. Pediatrik konsilium USDA FoodData Central ma'lumotlar bazasi yordamida har bir holat bo'yicha etalon ko'rsatkichlarni belgiladi. So'ngra ushbu ma'lumotlar 42 ta AI platformasiga (turli sozlamalarda jami 84 ta baholash) va 260 nafar mutaxassisga taqdim etildi.&lt;/p&gt;\n&lt;p&gt;Sifat tahlilida algoritmlar yuqori aniqlik ko'rsatdi: taom xilma-xilligi bo'yicha sun'iy intellektning etalondan og'ishi bor-yo'g'i 0,37 ± 0,49 ballni, oziq-ovqatning sanoatda qayta ishlanish darajasi bo'yicha esa 0,33 ± 0,47 ballni tashkil etdi (shifokorlarda bu tafovut 1,15 dan 1,57 gacha yetdi, p = 0,0001).&lt;/p&gt;\n&lt;p&gt;Biroq miqdoriy hisob-kitoblarda sun'iy intellekt pand berdi: kunlik kaloriyani baholashda uning mutlaq xatosi 260,3 ± 194,3 kkalga yetdi (nutritsiologlarda bu ko'rsatkich 148,4 ± 81,5 kkal). Porsiya o'lchamini baholashdagi og'ish esa 0,488 ni tashkil etdi. Shu sababli neyrotarmoqlar yashirin yog'lar va pishirishdagi yo'qotishlarni hisoblashda mutaxassis o'rnini bosa olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat uchta bolalar keysi bilan cheklangan va kaloriya tahlili bor-yo'g'i 77 ta to'liq javob asosida o'tkazilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ovqatlanish oʻsish, neyrorivojlanish, semizlik va parhez bilan bogʻliq kardiometabolik kasalliklarning oldini olishda muhim ahamiyatga ega. Biroq, klinik va jamoat sharoitlarida bolalar menyusini muntazam baholash koʻp vaqt talab qiladi va mutaxassisning individual tajribasiga bogʻliq. Oziq-ovqat isteʼmolini baholash uchun texnologik vositalar standartlashtirishni yaxshilash va respondentlar yuklamasini kamaytirish uchun ishlab chiqilgan, ammo ularning haqiqiyligi va foydalanish qulayligi turlicha, koʻplari esa hali ham ekspert talqinini talab qiladi. Shu bilan birga, katta til modellari (&lt;a href=\"concepts/artificial-intelligence.html\"&gt;LLM&lt;/a&gt;) va sunʼiy intellekt (AI) asosidagi chat-botlar erkin va keng foydalanish mumkin boʻlib qoldi, bu esa ota-onalarga tibbiyot xodimlari bilan bevosita aloqasiz bolalari uchun tezkor parhez va sogʻliq haqida maʼlumot olish imkonini beradi. Soʻnggi tadqiqotlar shuni koʻrsatadiki, ota-onalar pediatrik tibbiy va oziqlanish soʻrovlari uchun AIdan tobora koʻproq foydalanmoqdalar va baʼzan AI tomonidan yaratilgan kontentga ekspertlar maʼlumotidan koʻra koʻproq ishonishlari mumkin, bu esa xavfsizlik va malakali maslahatlarning oʻrnini bosish xavfi boʻyicha xavotirlarni keltirib chiqaradi.&lt;/p&gt;\n&lt;p&gt;Tasvirlar va mobil interfeyslarga asoslangan AI parhezni baholash vositalari oziq-ovqatni aniqlash va porsiyani baholashda istiqbolli natijalarni koʻrsatadi, ammo ozuqa moddalari va energiyani miqdoriy baholash qiyinligicha qolmoqda, ayniqsa taomlar tarkibida nomaʼlum ingredientlar, aralash taomlar, oʻzgaruvchan retseptlar hamda qoʻshilgan yogʻlar, souslar va pishirish jarayonidagi yoʻqotishlarning aniq boʻlmagan miqdorlari mavjud boʻlganda. AIni qoʻllab-quvvatlovchi parhezni baholashga qiziqish ortib borayotganiga qaramay, mavjud adabiyotlar asosan oziq-ovqatni tanib olish, porsiyani baholash yoki ozuqa moddalarini bashorat qilish kabi alohida vazifalarni soddalashtirilgan sharoitlarda oʻrgangan. Bolalar menyusini baholashda AI natijalarini bir nechta inson baholovchi guruhlari bilan bevosita solishtirgan tadqiqotlar kam. Natijada, AI menyuni baholashning miqdoriy va sifat jihatlarida turlicha ishlashi aniq emas. Nazorat qilinadigan sharoitlarda istiqbolli aniqlikka qaramay, hozirgi LLMga asoslangan oziqlanish vositalari tashqi haqiqiylikda muhim cheklovlarni koʻrsatadi, ularning ishlashi prompt dizayni, til konteksti va real dunyo maʼlumotlarining toʻliq emasligi bilan belgilanadi. Polshada oʻtkazilgan parhez tasnifi tadqiqotida uchta model ekspertlar bilan 90,3–94,2% kelishuvga erishdi, ammo model va inson oʻrtasidagi sezilarli farqlar saqlanib qoldi va ekspert nazorati zarur boʻlib qoldi. Ushbu tadqiqot uchta inson baholovchi guruhi (oziqlanish mutaxassislari, pediatriyaga yoʻnaltirilgan shifokorlar va boshqa mutaxassislikdagi shifokorlar) va AI platformalari tomonidan yaratilgan bolalar menyusi baholashlarining aniqligi va domenga bogʻliq samaradorligini solishtirish uchun ishlab chiqilgan boʻlib, bunda energiya isteʼmoli, porsiya, miqdoriy baholashlar va asosiy sifat atributlari boʻyicha ekspertlar tomonidan belgilangan reytinglardan foydalanildi. Etalon standartdan chetlanishlarni miqdoriy aniqlash va inson ekspertlari oʻrtasidagi binar muvofiqlik koʻrsatkichlari hamda baholovchi xususiyatlarini oʻrganish orqali biz AIning koʻp tarmoqli klinik ekspertiza oʻrnini bosuvchi emas, balki tuzilgan bolalar menyusi skriningi va oziqlanish taʼlimi uchun yordamchi vosita sifatidagi hozirgi rolini aniqlashtirishni maqsad qildik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI oziq-ovqatni aniqlashda istiqbolli natijalarni koʻrsatadi, ammo energiya va ozuqa moddalarini aniq hisoblashda qiyinchiliklarga duch keladi, bu esa uni almashtiruvchi emas, balki yordamchi vositaga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz Ruminiyaning Targu-Muresh shahrida anonimlashtirilgan pediatrik holatlar va standartlashtirilgan menyuni baholash vositalaridan foydalangan holda kuzatuvchi, kesma, qiyosiy tadqiqot oʻtkazdik. Baholashlar 2026-yil martidan iyunigacha inson baholovchilar uchun xavfsiz soʻrov havolalari va AI platformalari uchun individual sessiyalar orqali onlayn yakunlandi. Tadqiqot Targu-Muresh shahridagi Jorje Emil Palade nomidagi Tibbiyot, farmatsiya, fan va texnologiya universiteti Etika qoʻmitasi tomonidan tasdiqlangan (hujjat № 3904/4 mart 2026-yil).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatuv tadqiqoti oʻzgaruvchilar oʻrtasidagi bogʻliqlikni qayd etadi, ammo sabab-oqibat bogʻliqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Surunkali kasalliklari boʻlmagan uchta pediatrik holat (7 yoshli oʻgʻil bola, 12 yoshli qiz bola, 3 yoshli qiz bola) aniq antropometrik va kardiometabolik profillarni ifodalash uchun tanlab olindi. Har bir holat yosh, jins, vazn, boʻy, BMI foizlari, dam olishdagi metabolik tezlik, kardiometabolik parametrlar va porsiya tavsiflari (grammdagi vazn), fotosuratlar va ovqatlanish jadvali bilan batafsil oziq-ovqat kundaligini oʻz ichiga olgan. Uchta klinik oziqlanish mutaxassisi, ikkita pediatr va bitta maktab shifokoridan iborat koʻp tarmoqli panel holatga xos ekspert reytinglarini belgiladi. Umumiy energiya va ozuqa moddalari qiymatlari USDA FoodData Central maʼlumotlar bazasidan foydalangan holda hisoblab chiqildi.&lt;/p&gt;\n&lt;p&gt;Ruminiyalik ishtirokchilar quyidagi guruhlarga boʻlindi: (1) oziqlanish mutaxassislari (n = 116), (2) pediatriyaga yoʻnaltirilgan shifokorlar (oilaviy tibbiyot, maktab tibbiyoti, pediatriya, bolalar gastroenterologiyasi va boshqalar; n = 56), (3) boshqa mutaxassislikdagi shifokorlar (laboratoriya tibbiyoti, patologiya, gigiyena va boshqalar; n = 88).&lt;/p&gt;\n&lt;p&gt;42 ta AI platformasi tanlab olindi, bu ikki kirish konfiguratsiyasi (bepul/pullik) bilan 84 ta baholashni tashkil etdi. Har bir AI baholashi bitta pediatrik holatning yakunlangan tahlilini ifodaladi. Ruminiya tilidagi prompt quyidagilarni talab qildi: (1) isteʼmolni miqdoriy baholash, (2) sifatli baholash (xilma-xillik, ishlov berish, rang, jozibadorlik), (3) menyu tasnifi, (4) 1–10 shkalasi boʻyicha beshta reyting.&lt;/p&gt;\n&lt;p&gt;Inson baholovchilar AI promptiga oʻxshash tuzilgan hisobotni toʻldirishdi. Har bir ekspertga tasodifiy ravishda bitta holat tayinlandi. Birlamchi tahliliy birlik «ekspert–holat» baholashi edi. Barcha natijalar ekspertlar paneli tomonidan belgilangan etalondan chetlanish sifatida hisoblandi.&lt;/p&gt;\n&lt;p&gt;Microsoft Excel va GraphPad Prism 9 ishlatildi. Statistik ahamiyatlilik α = 0,05. Bir faktorli ANOVA va Kruskal–Uollis testi, soʻngra koʻp sonli taqqoslashlar uchun Tyuki yoki Danna testi qoʻllanildi. Soxta kashfiyotlar darajasi Benjamini–Kriger–Yekutieli tartibi bilan nazorat qilindi.&lt;/p&gt;\n&lt;p&gt;344 ta baholash kiritildi (84 AI, 116 oziqlanish mutaxassisi, 56 pediatr, 88 boshqa mutaxassislikdagi shifokor).&lt;/p&gt;\n&lt;p&gt;Oʻrtacha mutlaq xato (MAE_kcal) sezilarli darajada farq qildi (p = 0,0016). AI eng katta xatoni koʻrsatdi (260,3 ± 194,3 kkal), undan keyin oziqlanish mutaxassislari (148,4 ± 81,5 kkal) va boshqa mutaxassislikdagi shifokorlar (60,4 ± 53,3 kkal).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AIning energiyani baholashdagi xatosi eng yuqori boʻlib chiqdi, bu pediatriyada kritik ahamiyatga ega, chunki kaloriya nomutanosibligi oʻsish va metabolizmga taʼsir qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Porsiyalarni baholashda guruhlar oʻrtasidagi farqlar ahamiyatli edi (p = 0,003). AI xilma-xillik va mahsulotlarga ishlov berish darajasini baholashda eng kichik chetlanishlarni koʻrsatdi, inson guruhlari esa tanqidiyroq edi. Oziqlanish qiymatini baholashda oziqlanish mutaxassislari boshqa guruhlarga nisbatan eng katta chetlanishni koʻrsatdi (1,00 ± 1,02).&lt;/p&gt;\n&lt;p&gt;Natijalar samaradorlik baholash domeniga bogʻliqligini koʻrsatadi. AI tavsiflovchi atributlar (xilma-xillik, ishlov berish) bilan yaxshiroq ishlaydi, lekin miqdoriy aniqlikda (energiya, porsiya) ortda qoladi. Bu gibrid model zarurligini tasdiqlaydi: AI majburiy ekspert nazorati ostidagi birlamchi skrining vositasi sifatida.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI menyuni sifat belgilari boʻyicha birlamchi skrining qilish uchun samarali, ammo ozuqa moddalarini miqdoriy baholash uchun professional nazoratni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL
