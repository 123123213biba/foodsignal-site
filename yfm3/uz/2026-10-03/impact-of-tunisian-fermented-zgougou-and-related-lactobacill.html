            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"104\" cy=\"132\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"656\" cy=\"272\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PROBIOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Aleppo qarag'ayi urug'i suvi&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ichak to'sig'ini&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mustahkamlay oladimi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f1.jpg\" alt=\"Caco-2 monolayi uchun oʻrtacha transepiteliya elektr qarshiligi (TEER; Om·sm²) oʻlchovlari LPS (musbat nazorat) bilan is\" /&gt;&lt;/p&gt;\n&lt;p&gt;*&lt;a href=\"concepts/caco-2-cells.html\"&gt;Caco-2&lt;/a&gt; monolayi uchun oʻrtacha transepiteliya elektr qarshiligi (&lt;a href=\"concepts/transepithelial-electrical-resistance.html\"&gt;TEER&lt;/a&gt;; Om·sm²) oʻlchovlari LPS (musbat nazorat) bilan ishlov berilgandan 10 daqiqa, 30 daqiqa, 1 soat, 2 soat, 6 soat va 24 soat oʻtgach; (*p &amp;lt; 0,05; **&lt;em&gt;p &amp;lt; 0,001).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ichak to'sig'i organizmni toksinlardan himoya qiladi, ammo stress va yallig'lanish uni zaiflashtirishi mumkin. Olimlar probiyotiklar yordamida fermentlangan Aleppo qarag'ayi urug'i suvi hujayralararo bog'lanishlarga qanday ta'sir qilishini tekshirdilar. Natijalar shuni ko'rsatdiki, ushbu ichimlik to'siq funksiyasini bakteriyalarning o'zidan yoki ularning metabolitlaridan ko'ra yaxshiroq mustahkamlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Qarag'ay urug'i fermentatsiyasi TEER ni 963,33 Ohm·sm² gacha oshiradi.&lt;/li&gt;\n&lt;li&gt;Ichimlik Caco-2 hujayralarida zich bog'lovchi oqsillar ifodasini kuchaytiradi.&lt;/li&gt;\n&lt;li&gt;Fermentatsiya mahsuloti alohida metabolitlardan ko'ra samaraliroq.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotda ichak epiteliyasini taqlid qiluvchi Caco-2 hujayralarining mononatlari ishlatilgan. Hujayralar 21 kun davomida to'liq differensiatsiyagacha yetkazilgan va ularning yaxlitligi trans-epitelial elektr qarshiligini (TEER) o'lchash orqali nazorat qilingan. Qarag'ay urug'i sharbatini (2:3 nisbatda) fermentlash uchun 8 log CFU/g zichlikdagi Lactiplantibacillus paraplantarum A1 va L. plantarum A2 shtammlari qo'llanilgan.&lt;/p&gt;\n&lt;p&gt;25°C haroratda 24 soatlik fermentatsiyadan so'ng, namunalar Caco-2 hujayralariga ta'sir ettirilgan. Tadqiqotchilar RT-qPCR usuli yordamida TEER va okkludin (OCLN) hamda klaudin-2 (CLDN2) kabi zich bog'lovchi oqsillar (&lt;a href=\"concepts/tight-junction-proteins.html\"&gt;TJP&lt;/a&gt;) ifodalanish darajasini o'lchashgan. Fermentlangan sharbatni qo'llash TEER qiymatlarini 690–963,33 Ohm·sm² gacha oshirgan, bu to'siqning mustahkamlanganini bildiradi. Shuningdek, hujayralararo birikmalar yaxlitligi uchun mas'ul genlar ifodalanishining regulyatsiyasi kuzatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat in vitro hujayra modelida o'tkazilgan, shuning uchun natijalarni klinik sinovlarsiz to'g'ridan-to'g'ri odamga tatbiq etib bo'lmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Aleppo qaragʻayi (Pinus halepensis Mill.) urugʻlari Tunisda fermentlangan «Assidet zgougou» deb nomlanuvchi oziq-ovqat mahsulotining asosiy tarkibiy qismi hisoblanadi. Uning sogʻliq uchun taxminiy foydalari haqida maʼlumotlar mavjud. Bu foydali xususiyatlar uning tarkibidagi fitokimyoviy moddalar, ayniqsa ogʻriq qoldiruvchi, yalligʻlanishga qarshi va antioksidant qobiliyatga ega fenolik birikmalar bilan bogʻliq boʻlishi mumkin. Fitokimyoviy moddalardan tashqari, zgougou sharbatini ishlab chiqarishda xos boʻlgan sut kislotali fermentatsiya fermentatsiyani boshqaruvchi mikroorganizmlar hisobiga mikroblarga qarshi va antioksidant faollikka olib kelishi mumkin. Oʻz navbatida, bunday faollik ichak mikrobiotasi tarkibi va funksiyasiga ijobiy taʼsir koʻrsatib, ichak toʻsiq funksiyasini yaxshilashga olib keladi.&lt;/p&gt;\n&lt;p&gt;Inson tanasini sogʻlom saqlashda muhim rol oʻynaydigan ichak epitelial toʻsigʻi biokimyoviy, immunologik, mikrobial va tarkibiy komponentlarni oʻz ichiga olgan murakkab oʻzaro taʼsirlar natijasidir. Shilliq qavat va ichak mikrobiotasidan tashqari, ichak epiteliyasining zich birikma oqsillari (TJP) uning «darvoza va toʻsiq» funksiyasi uchun juda muhimdir. Aslida, TJP odatda endotelial va epitelial hujayralar oʻrtasidagi zona occludensda joylashgan. Ular tananing apikal (boʻshliq) va bazolateral (boʻshliqdan tashqari) tomonlarini ajratib turuvchi selektiv oʻtkazuvchan hujayra toʻsiqlarini yaratish orqali paratsellyar yoʻl orqali harakatlanadigan suv, ionlar va boshqa erigan moddalarga hujayra oʻtkazuvchanligini nazorat qilish uchun zarurdir. Bu zich birikmalarga transport jarayonlarini nazorat qilish va gomeostazni saqlash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Okklyudin va klaudinlar kabi zich birikma oqsillari (TJP) ionlar va molekulalar uchun oʻtkazuvchanlikni tartibga solish orqali ichak toʻsigʻi yaxlitligini saqlashda juda muhimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Okklyudin va klaudinlar kabi TJP ekspressiyasi yuqori darajada toʻqimalarga xos, dinamik va nozik tartibga solinadi. Okklyudin (OCLN), birinchi aniqlangan TJP, ichak epitelial hujayralari oʻrtasidagi zich birikmalarni barqarorlashtiradi va tarkibiy yaxlitligini taʼminlaydi. Haddan tashqari sintezlanganda, u sitokinlar keltirib chiqaradigan ichak oʻtkazuvchanligining oshishini cheklaydi va uning ekspressiya namunalari rivojlanish jarayonida yoki saraton kabi kasallik holatlarida oʻzgaradi. Klaudin izoformalari (masalan, 1, 3, 5, 11) buyrak, oʻpka, ichak kabi organlarga, shuningdek, qon-miya toʻsigʻiga noyob toʻsiq xususiyatlarini beradi. Xususan, Klaudin-2 (CLDN2) ichak epiteliyasining yaxshilangan oʻtkazuvchanligi bilan bogʻliq.&lt;/p&gt;\n&lt;p&gt;Lactiplantibacillus plantarum ichak toʻsigʻini sezilarli darajada yaxshilaydi va zich birikmalarni (TJs) yaxshilash orqali «ichak oʻtkazuvchanligi sindromi»ning oldini oladi. Ushbu turning baʼzi shtammlari tegishli genlarning transkripsiya darajasini oshirish orqali Zonula occludens-1 (ZO-1), okklyudin va klaudin-1 kabi TJP ishlab chiqarish va toʻgʻri lokalizatsiyasini oshiradi; bu esa oʻz navbatida ichak oʻtkazuvchanligini kamaytiradi va yalligʻlanishdan himoya qiladi. Oʻsma nekrozi omili-α (TNFα) — bu TJs yaxlitligini OCLN internalizatsiyasi orqali tartibga soluvchi yalligʻlanishga qarshi sitokin boʻlib, u ichak oʻtkazuvchanligini oshiradi. Lipokalin-2 (LCN2) — ichak epitelial toʻsigʻining yana bir oqsil komponenti boʻlib, antibakterial faollikka ega va yalligʻlanish stimullari tomonidan qoʻzgʻatilishi mumkin. LCN2 tugʻma immunitetda temir moddasini tartibga soluvchi muhim omil va bakteriostatik omil boʻlib, yalligʻlanishli ichak kasalliklari (IBD), saraton va metabolik buzilishlar kabi turli kasalliklarda murakkab rollarni oʻynaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/v-dannom-issledovanii-ispolzuetsya-model-caco-2.html\"&gt;Ushbu tadqiqotda Caco-2 modeli&lt;/a&gt; — ichak epiteliyasini taqlid qiluvchi monolayer hosil qiluvchi inson yoʻgʻon ichak adenokarsinomasi hujayra liniyasi qoʻllaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Baʼzi oldingi hisobotlar L. plantarum guruhi bakteriyalari LCN2 bilan asosan immunitet tizimi orqali oʻzaro taʼsir qilishini koʻrsatdi. L. plantarumning baʼzi shtammlari makrofaglarni LCN2 ajratishga undashi mumkin, bu esa istalmagan bakteriyalar tomonidan temir bilan oziqlanishni cheklashdan tashqari, oʻsmaga qarshi immunitetni kuchaytiradi yoki yalligʻlanishga taʼsir qiladi. Oksidlovchi stress va bir qator patologik holatlar ichak toʻsigʻi yaxlitligiga zarar yetkazishi mumkin, bu esa patogen mikroorganizmlar va ularning toksik metabolitlarining ichak boʻshligʻidan ostki qatlamlarga (masalan, immun funksiyaga ega shilliq qavatning xususiy plastinkasi) oʻtishini osonlashtiradi. Yaqinda baʼzi probiotik bakteriyalar ichak toʻsigʻi funksiyasini tiklash orqali mezbon sogʻligʻiga foyda keltirishi koʻrsatildi. Masalan, L. plantarum guruhi va Bifidobacterium longum subsp. infantis probiotik shtammlari TJsda ishtirok etuvchi genlarning transkripsiya darajasini oshirish orqali ichak toʻsigʻini tiklashi mumkin. Toʻsiq funksiyasini tiklashga probiotik mikroorganizmlardan olingan hujayrasiz supernatantni (CFS) kiritish orqali ham erishish mumkin, bu esa «postbiotik» chegarani ochadi. Bundan tashqari, probiotiklar oziq-ovqat tarkibiy qismi sifatida kiritilganda ham oʻzlarining foydali faolligini namoyon qilishi mumkin.&lt;/p&gt;\n&lt;p&gt;Biroq, ikkinchi holatda oziq-ovqat matritsasi va probiotiklar oʻrtasidagi chegaralarni kuzatilgan foydali taʼsirga qoʻshgan hissasi nuqtai nazaridan aniqlash qiyin. Ushbu tadqiqot probiotik xususiyatlarga ega ikki tanlangan laktobatsillaning ichak oʻtkazuvchanligi va OCLN, CLDN2 va LCN2 ekspressiya darajasiga in vitro taʼsirini tushunishga qaratilgan. Laktobatsillar turli preparatlarda sinovdan oʻtkazildi: (i) yagona suyuq kulturadan olingan hujayra biomassasi; (ii) yagona suyuq kulturadan olingan CFS; (iii) ikki laktobatsillaning kombinatsiyasi orqali olingan zgougou. Bundan tashqari, oʻz-oʻzidan fermentlangan zgougou ham inson Caco-2 hujayralari monolayeridan foydalangan holda in vitro model sifatida xuddi shu tahlillardan oʻtkazildi.&lt;/p&gt;\n&lt;p&gt;ATCC (Rokvill, AQSH) dan sotib olingan yoʻgʻon ichak saraton hujayralari liniyasi boʻlgan Caco-2 (inson yoʻgʻon ichak adenokarsinomasi) hujayralari 0,4 mkm gʻovak oʻlchamli (Corning Inc., Nyu-York, AQSH) Transwell 12-quduqli planshetlarning yuqori qismiga ekildi. Tarkibida L-glutamin, 10% issiqlik bilan inaktivatsiyalangan homila buqa zardobi (Thermo Fisher Scientific), 1% (1 M) 4-(2-gidroksietil)-1-piperazin etansulfon kislotasi (HEPES, Sigma-Aldrich, Sent-Luis, AQSH), 1% natriy piruvat (100 mM) eritmasi (Sigma-Aldrich), 1% streptomitsin (10 mg/ml) eritmasi va penitsillin (10 000 U/ml) eritmasi (Thermo Fisher Scientific) boʻlgan Dulbecco Modified Eagles Medium (DMEM, Thermo Fisher Scientific, Massachusets, AQSH) muhiti ishlatildi. Hujayralar 37°C haroratda 5% CO2 atmosferasida 21 kun davomida inkubatsiya qilindi va har kuni yangi DMEM muhiti bilan oziqlantirildi. Monolayerning toʻliq differensiatsiyasi Millicell ERS volt-ommetri (Millipore, Eshborn, Germaniya) yordamida transepitelial elektr qarshiligini (TEER) oʻlchash va boshqa manbalarda keltirilgan qadamlarga rioya qilgan holda mikroskop yordamida hujayra qatlami yaxlitligini vizual nazorat qilish orqali tasdiqlandi.&lt;/p&gt;\n&lt;p&gt;Ilgari anʼanaviy zgougou (Missaoui et al. 2019) dan ajratilgan va Bari ALDO MORO universiteti (Italiya) Tuproq, oʻsimlik va oziq-ovqat fanlari departamenti hamda Monastir universiteti (Tunis) Biotexnologiya oliy instituti Bio-resurslar: integrativ biologiya va valorizatsiya departamenti madaniyatlar kolleksiyasiga tegishli Lactiplantibacillus paraplantarum A1 va L. plantarum A2 de Man Rogosa va Sharpe (MRS) bulonida (Oxoid, Bezingstok, Xempshir, Buyuk Britaniya) 37°C da 24 soat davomida anaerob sharoitda yetishtirildi. Keyin madaniyat buloni sentrifugalandi (10 000× g, 20 min, 4°C) va CFS hujayra biomassasidan ajratildi. Zgougou sharbati maydalangan Aleppo qaragʻayi urugʻlari va suv aralashmasidan 2:3 (w:v) nisbatda olindi, L. paraplantarum A1 va L. plantarum A2 (J A1 + A2) bilan inokulyatsiya qilindi (har ikkalasi 8 log CFU/g hujayra zichligida) va 25°C da 24 soat davomida fermentatsiya qilindi. Bundan tashqari, oʻz-oʻzidan fermentlangan zgougou (J) sharbati laktobatsillalar qoʻshmasdan 25°C da 24 soat davomida fermentatsiyadan keyin olindi. Tanlangan laktobatsillar bilan boshlangan zgougou ham, oʻz-oʻzidan fermentatsiya orqali olingan zgougou ham tahlilgacha -20°C da saqlandi.&lt;/p&gt;\n&lt;p&gt;Differensiatsiyadan soʻng (21 kun, TEER qiymati: taxminan 193 Ohm·sm2), Caco-2 hujayralari yangi Transwell 12-quduqli planshetlarga oʻtkazildi. Konflyuentlikka erishilganda (taxminan 6 kun), hujayralar 24 soat davomida quyidagilar bilan alohida stimullandi: MRS bulonida yetishtirilgan probiotik bakteriyalar A1 va A2 biomassasi (har ikkalasi 8 log CFU/ml tartibidagi hujayra zichligida), xuddi shu bakteriyalardan olingan CFS, oʻz-oʻzidan fermentlangan zgougou sharbati (J) va probiotik bakteriyalar A1 va A2 bilan fermentlangan zgougou sharbati (J (A1 + A2)). Hujayralarni oʻz ichiga olmaydigan boʻsh quduq blank sifatida ishlatildi. Har qanday bakterial preparat yoki zgougou sharbatiga taʼsir etmagan hujayralar barcha tajribalarda salbiy nazorat sifatida ishlatildi (tashuvchi). Ijobiy nazorat sifatida 1 mkg/ml Escherchia coli lipopolisaxaridi (LPS) (Sigma-Aldrich) ishlatildi. Keyin planshetlar 37°C da 10% CO2 va 90% havo muhitida inkubatsiya qilindi. TEER Millicell ERS volt-ommetri yordamida oʻlchandi va hujayra monolayerining yaxlitligi ilgari xabar qilingan qadamlarga rioya qilgan holda mikroskop ostida vizual nazorat qilindi. Monolayer yaxlitligi 10 daqiqa, 30 daqiqa, 1, 2, 6 va 24 soatlik inkubatsiyadan keyin baholandi. Oʻlchovlar blankda oʻlchangan qarshilikning oʻrtacha qiymatlarini ayirgandan soʻng standart birliklarda (Ohm·sm2) ifodalandi. Biologik triplikatlarning ikkita texnik takrori amalga oshirildi.&lt;/p&gt;\n&lt;p&gt;Ichak toʻsigʻi yaxlitligi bilan bogʻliq genlarning ekspressiya darajasi RT-qPCR orqali tahlil qilindi. Umumiy RNK 24 soat davomida yuqorida koʻrsatilgan muolajalarga taʼsir etgan hujayralardan ishlab chiqaruvchining koʻrsatmalariga rioya qilgan holda Invitrogen TRIzol reaktivi (Thermo Fisher Scientific) yordamida ajratib olindi. Umumiy RNK (500 ng) boshqa manbalarda tasvirlanganidek, tasodifiy praymerlar bilan iScript cDNA Synthesis kit (Biorad, Kaliforniya, AQSH) yordamida cDNK ga teskari transkripsiya qilindi. Quyidagi TaqMan (Thermo Fisher Scientific) gen ekspressiyasi tahlillari ishlatildi: oʻsma nekrozi omilini kodlovchi TNFα geni uchun Hs00174128_m1; klaudin 2 ni kodlovchi CLDN2 geni uchun Hs00252666_s1; okklyudinni kodlovchi OCLN geni uchun Hs05465837_g1; lipokalin 2 ni kodlovchi LCN2 geni uchun Hs01008571_m1; va glitseraldegid-3-fosfatdegidrogenazani kodlovchi GAPDH geni uchun Hs02758991_g1. Oxirgisi uy xoʻjaligi geni sifatida ishlatilgan. PZR CFX96 tizimida (Biorad) Talà et al. (2022) tomonidan xabar qilingan reaksiya aralashmasi va sharoitlaridan foydalangan holda amalga oshirildi. Maqsadli genlarning ekspressiya darajasi GAPDH genining ekspressiya darajasiga nisbatan &lt;a href=\"concepts/metod-ct.html\"&gt;ΔΔCt usuli&lt;/a&gt; yordamida hisoblandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ΔΔCt usuli — gen ekspressiyasini miqdoriy solishtirishning standart usuli boʻlib, nazoratga nisbatan maqsadli gen mRNK miqdori necha barobar oʻzgarganini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biologik triplikatlarning uchta texnik takrori amalga oshirildi.&lt;/p&gt;\n&lt;p&gt;Turli muolajalarga taʼsir etgan hujayralarni oʻz ichiga olgan quduqlarning yuqori va pastki qismidan hujayra madaniyati muhiti olindi va sentrifugalandi (10 min). Supernatantlar Bermudez-Brito et al. (2015) tomonidan tasvirlanganidek, 96-quduqli planshetlar bilan ELISA toʻplami (RD Systems, Minneapolis, MN, AQSH) yordamida TNFα ni miqdoriy aniqlashdan oʻtkazildi. Biologik triplikatlarning ikkita texnik takrori amalga oshirildi.&lt;/p&gt;\n&lt;p&gt;Statistik tahlil Graphpad Prism 9.3.1 yordamida amalga oshirildi. Barcha maʼlumotlar oʻrtacha ± SD sifatida ifodalandi. Statistik ahamiyatlilik ikki tomonlama Student t-testi va ikki tomonlama Anova testi (* p &amp;lt; 0,05; ** p &amp;lt; 0,01; *** p &amp;lt; 0,001; **** p &amp;lt; 0,0001) bilan baholandi. Natijalar p &amp;lt; 0,05 da statistik jihatdan ahamiyatli deb hisoblandi.&lt;/p&gt;\n&lt;p&gt;Bizning maʼlumotlarimizga koʻra, bu zgougou (Missaoui et al. 2019) dan ajratilgan ikki laktobatsillaning (L. paraplantarum A1 va L. plantarum A2), ularning CFS, yuqoridagi laktobatsillar bilan fermentlangan zgougou sharbati (J (A1 + A2)) (Minervini et al. 2020) va oʻz-oʻzidan fermentlangan zgougou sharbatining (J) ichak epitelial hujayralari yaxlitligiga taʼsirini tahlil qilgan birinchi tadqiqotdir. Tahlillarda inson ichak epiteliyasining in vitro modeli sifatida Caco-2 monolayer hujayralaridan foydalanildi. Biz LPS (1 mkg/ml) bilan davolash salbiy nazoratga (davolanmagan hujayralar) nisbatan TEER qiymatlarida vaqtga bogʻliq javob keltirib chiqarganini aniqladik. Xususan, LPS taʼsiridan 30 daqiqa oʻtgach, Caco-2 monolayerining TEER qiymati davolanmagan hujayralar TEERiga qaraganda sezilarli (p &amp;lt; 0,001) pastroq (taxminan 160 Ohm·sm2) edi; aksincha, LPS taʼsiridan 2 soat oʻtgach, TEER taxminan 193 Ohm·sm2 gacha koʻtarildi va davolanmagan hujayralarga qaraganda sezilarli (p &amp;lt; 0,05) darajada yuqori boʻldi (1-rasm). Pastroq TEER qiymatlari hujayra monolayerining oʻtkazuvchanligi oshishi bilan bevosita bogʻliq boʻlib, bu ichak toʻsigʻining buzilishini va «oʻtkazuvchan» ichakning boshlanishini koʻrsatadi. TJs ga boʻlgan bu zarar yalligʻlanish yoʻllarini qoʻzgʻatishi mumkin, bu esa ilgari xabar qilinganidek, yalligʻlanishga qarshi sitokinlarning chiqarilishiga olib keladi. Ichak yaxlitligi epitelial birikma yopishish kompleksi, shilliq qavat va ham mezbon hujayralar, ham bakteriyalar tomonidan chiqarilgan mahsulotlar tomonidan saqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro Caco-2 hujayra liniyasida oʻtkazilgan; natijalar immun va asab tizimlarining murakkab tartibga solinishi tufayli tirik organizmdagi jarayonlardan farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1:100 nisbatda suyultirilgan L. paraplantarum A1 biomassasiga taʼsir etgan Caco-2 monolayeri 10 daqiqa (p &amp;lt; 0,0001) va 2 soatdan (p &amp;lt; 0,05) keyin davolanmagan hujayralarga nisbatan yuqori TEER qiymatlarini koʻrsatdi; keyinchalik hech qanday sezilarli (p &amp;gt; 0,05) farqlar topilmadi (2A-rasm). Monolayer bir xil &lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;LAB&lt;/a&gt; biomassasiga (1:10) suyultirilgan holda taʼsir etganda, TEER 30 daqiqadan (p &amp;lt; 0,0001) va 24 soatdan (p &amp;lt; 0,05) keyin oshdi. Biroq, oxirgi namunada 1 soatdan keyin TEER ning pasayishi (p &amp;lt; 0,01) aniqlandi (2A-rasm). Caco-2 monolayeri 6 soat davomida L. paraplantarum A1 CFS (1:100 suyultirilgan) taʼsiriga uchraganda, TEER davolanmagan hujayralarga qaraganda sezilarli (p &amp;lt; 0,05) darajada yuqori ekanligi aniqlandi (2B-rasm). Caco-2 monolayerini L. plantarum A2 biomassasi (1:100 suyultirilgan) bilan davolash faqat 30 daqiqadan keyin davolanmagan hujayralarga qaraganda sezilarli (p &amp;lt; 0,05) darajada yuqori TEER (213 Ohm·sm2) ga olib keldi (2C-rasm). 30 daqiqada L. plantarum A2 ning suyultirilgan (1:10) CFS bilan davolangan monolayer hujayralarining TEERi davolanmagan hujayralarga qaraganda sezilarli darajada yuqori edi (2D-rasm). Umuman olganda, Caco-2 hujayra liniyasini probiotik LAB bilan davolash hujayra toʻsigʻi yaxlitligiga ijobiy taʼsir koʻrsatishi mumkin, ammo bu ishlatilgan LAB, ishlatilgan LAB dozasi va taʼsir vaqtiga bogʻliq. Probiotiklar, ayniqsa Lactiplantibacillus turiga mansub boʻlganlar, ichak sogʻligʻini bir nechta mexanizmlar orqali yaxshilashi mumkin, ulardan biri yaxshi ichak toʻsigʻini saqlash boʻlishi mumkin. Ushbu natijalar L. plantarum bilan davolashda hujayra membranasi yaxlitligiga ijobiy taʼsir koʻrsatgan oldingi tadqiqotlar bilan mos keladi; ammo, baʼzi shtammlar TEER qiymatlariga taʼsir qilmasligi haqida xabar berilgan. Tuzlangan karamdan ajratilgan L. plantarum C06 va Lactobacillus acidophilus C11 oʻn ikki barmoqli ichak hujayralariga yopishish va ichak biotik stressiga chidamlilik nuqtai nazaridan yaxshi in vitro koʻrsatkichlarni koʻrsatdi. Bizning eksperimental sharoitimizda, Caco-2 hujayra liniyasining har ikkala laktobatsilla CFSiga uzoq muddatli (30 daqiqa — 6 soat) taʼsiridan keyin kuzatilgan TEER ning oshishi, laktobatsilla CFSida mavjud boʻlgan baʼzi bioaktiv molekulalar oldingi hisobotlarga muvofiq hujayra-hujayra oʻzaro taʼsirida hal qiluvchi rollarga ega boʻlishi mumkinligini koʻrsatadi.&lt;/p&gt;\n&lt;p&gt;Caco-2 monolayeri L. paraplantarum A1 va L. plantarum A2 (J A1 + A2) tomonidan fermentlangan va 1:10 nisbatda suyultirilgan zgougou sharbatiga taʼsir etganda, biz barcha vaqt nuqtalarida salbiy nazoratga qaraganda yuqori (p &amp;lt; 0,0001) TEER qiymatlarini (690–963 Ohm·sm2) topdik. Hujayralar 1:100 nisbatda suyultirilgan J A1 + A2 bilan davolanganda sezilarli (p &amp;gt; 0,05) farqlar kuzatilmadi (3A-rasm). Oʻz-oʻzidan fermentlangan zgougou sharbati (J) bilan Caco-2 monolayerini davolash paytida topilgan yagona sezilarli (p &amp;lt; 0,05) farq J, 1:10 nisbatda suyultirilgan holda 30 daqiqalik taʼsiridan keyin topildi, bu salbiy nazoratga qaraganda yuqori TEER ga olib keldi (3B-rasm).&lt;/p&gt;\n&lt;p&gt;Bizning topilmalarimiz oʻsimlik asosidagi fermentlangan oziq-ovqat mahsulotlari haqidagi oldingi hisobotlar bilan mos keladi, ular mikroblar va ularning metabolitlariga boy boʻlganligi sababli, fitokimyoviy moddalaridan tashqari, ichak toʻsigʻining oʻtkazuvchanligini modulyatsiya qilishi mumkin. Turli tadqiqotlar shuni koʻrsatdiki, kefir, dahi va koreys kimchisi kabi fermentlangan oziq-ovqatlar, turli probiotik LAB shtammlaridan foydalangan holda, saraton, IBD, nerv anoreksiyasi, yurak-qon tomir kasalliklari va diabet kabi koʻplab kasalliklarga qarshi foydali boʻlishi mumkin. Bizning eksperimental sharoitimizda biz ikkita probiotik shtamm, garchi alohida sinovdan oʻtkazilganda bir xil taʼsir koʻrsatmasa ham, zgougou sharbati fermentatsiyasini boshqarish uchun birgalikda ishlatilganda qisqa vaqt ichida ichak yaxlitligini yaxshilashi mumkinligini aniqladik. Probiotik laktobatsillar va oʻsimlik matritsasi (Aleppo qaragʻayi urugʻlari) kombinatsiyasi bilan bogʻliq taʼsirga qoʻshimcha ravishda, biz probiotik laktobatsillar va mezbon ichak oʻrtasidagi keyingi oʻzaro taʼsirlar yutilganda yuzaga kelishi mumkinligini taxmin qilishimiz mumkin. Darhaqiqat, oʻsimlik matritsalari probiotiklarni oshqozon-ichak trakti orqali oʻtishda, ularning yoʻgʻon ichakka keyingi chiqishigacha himoya qilishi mumkin. Shunday qilib, ushbu natijalar tanlangan laktobatsillar bilan fermentlangan zgougou sharbatining ichak epitelial toʻsigʻini mustahkamlash uchun potentsial taʼsirini taʼkidlaydi, ammo hujayra-hujayra oʻzaro taʼsiri boʻyicha keyingi tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;p&gt;L. paraplantarum A1 va L. plantarum A2 hujayra biomassalari yalligʻlanishga qarshi sitokin TNFα ni kodlovchi genning mRNK ekspressiya darajasini sezilarli (p &amp;lt; 0,0001) darajada oshirdi (4A-rasm). Aksincha, Caco-2 hujayralarining yuqorida aytib oʻtilgan laktobatsillardan olingan CFS taʼsiriga uchrashi TNFα geni ekspressiya darajasining hech qanday sezilarli oʻzgarishiga olib kelmadi. Bundan tashqari, har ikkala laktobatsilla bilan fermentlangan suyultirilgan zgougou sharbati (J (A1 + A2)) TNFα gen ekspressiyasini kuchli kuchaytirdi (p &amp;lt; 0,001) (4A-rasm). Oʻz-oʻzidan fermentlangan zgougou sharbati (J) ham TNFα ekspressiyasini oshirdi, garchi J (A1 + A2) ga qaraganda yumshoqroq taʼsir bilan. TNFα yalligʻlanishga qarshi sitokin deb hisoblanadi, ammo baʼzi hollarda u patogenlarga qarshi immun javoblarni ragʻbatlantirishda ishtirok etishi mumkin. Ichak mikrobiotasi turli xil immun bilan bogʻliq genlarning ekspressiyasiga taʼsir qilishi mumkin. Turli LAB shtammlari TNF-α ishlab chiqarishga turlicha taʼsir koʻrsatishi mumkin, bu probiotik shtammlarni ehtiyotkorlik bilan tanlash va tavsiflash zarurligini taʼkidlaydi. TNF-α ekspressiyasini inhibe qiluvchi yoki qoʻzgʻatuvchi probiotik LAB mos ravishda immun-ragʻbatlantiruvchi yoki immun-sogʻaytiruvchi taʼsirga ega boʻlishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Garchi laktobatsilla biomassasi va fermentlangan zgougou sharbati TNFα geni ekspressiyasini oshirgan boʻlsa-da, ELISA tahlili TNFα oqsilining oʻzi kontsentratsiyasida farqlarni aniqlamadi, bu murakkab post-transkripsion tartibga solishni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bizning eksperimental sharoitimizda, garchi laktobatsilla biomassasi yoki shu laktobatsillar bilan fermentlangan zgougou taʼsiriga uchragan Caco-2 hujayralari TNF-α genining yuqori ekspressiyasini koʻrsatgan boʻlsa-da, ELISA tahlili yuqori va pastki supernatant oʻrtasida TNFα kontsentratsiyasida farqlarni aniqlamadi (S1-jadval). TNFα ni kodlovchi genning ekspressiya darajasi va TNFα darajasidagi farqlar yoʻqligi oʻrtasidagi nomuvofiqlik ushbu yalligʻlanishga qarshi sitokin sintezini bloklagan boʻlishi mumkin boʻlgan transkripsion va post-transkripsion tartibga solish tizimlari bilan izohlanishi mumkin.&lt;/p&gt;\n&lt;p&gt;L. paraplantarum A1 biomassasiga (1:10 suyultirilgan) taʼsir etgan Caco-2 monolayeri salbiy (davolanmagan hujayralar) va ijobiy (LPS taʼsiriga uchragan hujayralar) nazoratlarga nisbatan LCN2 geni ekspressiya darajasining oshganini (p &amp;lt; 0,01) koʻrsatdi (4B-rasm). Bundan tashqari, Caco-2 monolayerini L. paraplantarum A1 biomassasi (1:10 suyultirilgan) bilan davolash OCLN geni transkripsiyasini qoʻllab-quvvatladi (p &amp;lt; 0,01) (4C-rasm). Xuddi shu bakterial shtammning CFS i OCLN genining yanada kuchliroq ekspressiyasini (p &amp;lt; 0,001) qoʻzgʻatgandek tuyuldi. Biz shuningdek, biomassa (1:10 suyultirilgan) (p &amp;lt; 0,0001) va L. plantarum A2 CFS taʼsiriga uchragan Caco-2 hujayralarida har ikkala genning (LCN2 va OCLN) yuqori ekspressiya darajasini topdik (4B,C-rasm). CLDN va OCLN ni oʻz ichiga olgan TJP ichak epiteliyasining fundamental toʻsiq funksiyasiga hissa qoʻshadi, bu erigan moddalarning selektiv transportiga imkon beradi va shu bilan birga xavfli birikmalar va patogen bakteriyalarning ichak boʻshligʻiga yetib borishini oldini oladi. Ushbu tadqiqotda olingan natijalar L. plantarumning oʻziga xos shtammlari TJP ni tartibga solish orqali ichak epiteliyasining toʻsiq funksiyasini mustahkamlashi mumkinligini koʻrsatgan oldingi tadqiqotlar bilan mos keladi.&lt;/p&gt;\n&lt;p&gt;Biroq, kuzatilgan taʼsirlar shtammga bogʻliqligidan tashqari, mezbon va ichak mikrobiotasiga ham taʼsir qilganligi sababli, L. plantarumning TJP ga taʼsiri va oshqozon-ichak sogʻligʻi uchun tegishli oqibatlarni yaxshiroq tushunish uchun koʻproq tadqiqotlar talab etiladi. Caco-2 monolayeri L. paraplantarum A1 va L. plantarum A2 (J A1 + A2) bilan fermentlangan va 1:10 nisbatda suyultirilgan zgougou sharbati bilan davolanganda, CLDN2 (4C-rasm) va OCLN (4D-rasm) genlarining sezilarli darajada yuqori ekspressiya darajasi topildi. Oʻz-oʻzidan fermentlangan zgougou sharbati (J), 1:10 nisbatda suyultirilgan holda, har ikkala genning yanada yuqori (p &amp;lt; 0,0001) ekspressiyasiga olib keldi (4C,D-rasm). Ushbu natijalar qisman TEER natijalari bilan mos keladi, bu ichak epiteliyasining yaxshilangan toʻsiq funksiyasini koʻrsatadi. Biz CLDN2 ekspressiyasi va TEER natijalari oʻrtasida aniq nomuvofiqlikni topdik. Biroq, tegishli oqsil klaudin-2 ning funktsional taʼsiri bitta genning ekspressiya darajasiga emas, balki TJ kompleksining umumiy tuzilishi va tarkibiga bogʻliq. Bundan tashqari, CLDN2 epitelial fiziologiya va kasalliklarda, masalan, toʻqimalarni qayta qurish va epitelial gomeostazda ikki tomonlama funktsiyaga ega boʻlishi mumkin. Bizning eksperimental sharoitimizda CLDN2 ning ortiqcha ekspressiyasi ehtimol ichak oʻtkazuvchanligining oshishidan koʻra TJ ni qayta qurishni koʻrsatadi. Birinchidan, ushbu tadqiqot shuni koʻrsatdiki, fermentlangan zgougou sharbati TJP ni kodlovchi genlarning ekspressiya darajasini oshirishi mumkin. Zgougou uchun ishlatiladigan xomashyo boʻlgan Aleppo qaragʻayi urugʻlari linol va α-linolen kislotasi, flavonoidlar va fenollar kabi antioksidant va yalligʻlanishga qarshi faollikka ega bioaktiv birikmalarni oʻz ichiga oladi. Biz taxmin qilamizki, bizning eksperimental sharoitimizda TJP ni kodlovchi genlarning ekspressiya darajasiga kuzatilgan taʼsirlar Aleppo qaragʻayi urugʻlaridan olingan bioaktiv birikmalar va LAB bilan fermentatsiya oʻrtasidagi sinergiya natijasida kelib chiqishi mumkin. Oʻz-oʻzidan yoki tanlangan laktobatsillar bilan fermentlangan zgougou, shuningdek, tanlangan laktobatsillarning biomassasi va CFS i ustida oʻtkaziladigan maqsadsiz metabolomika Caco-2 monolayerining gen ekspressiyasiga kuzatilgan taʼsirlarni qaysi birikmalar koʻproq keltirib chiqargan boʻlishi mumkinligini tushunish uchun foydali boʻladi.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot shuni koʻrsatdiki, zgougou sharbati, fermentatsiya turiga (oʻz-oʻzidan yoki ikki tanlangan avtoxton laktobatsilla tomonidan boshqariladigan) qarab, inson Caco-2 monolayerining yaxlitligini mustahkamlashi mumkin, bu TEER ning oshishi va TJP ni kodlovchi genlarning ekspressiya darajasi bilan tasdiqlanadi. Bu taʼsir ichak uchun potentsial foydali deb hisoblanishi mumkin. Kelgusi tadqiqotlar quyidagilarga qaratilishi mumkin: (i) bu taʼsir bioaktiv birikmalar va zgougou matritsasi mikrobiotasi oʻrtasidagi sinergiya natijasida kelib chiqishi mumkinligini tushunish; (ii) zgougou sharbatining biologik faolligini hayvonlar modelida baholash.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f1.jpg\" alt=\"Caco-2 monolayi uchun oʻrtacha transepiteliya elektr qarshiligi (TEER; Om·sm²) oʻlchovlari LPS (musbat nazorat) bilan is\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Caco-2 monolayi uchun oʻrtacha transepiteliya elektr qarshiligi (TEER; Om·sm²) oʻlchovlari LPS (musbat nazorat) bilan ishlov berilgandan 10 daqiqa, 30 daqiqa, 1 soat, 2 soat, 6 soat va 24 soat oʻtgach; (*p &amp;lt; 0,05; **&lt;em&gt;p &amp;lt; 0,001).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f2.jpg\" alt=\"Caco-2 monolayi uchun oʻrtacha transepiteliya elektr qarshiligi (TEER; Om·sm²) oʻlchovlari L. paraplantarum A1 hujayrala\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Caco-2 monolayi uchun oʻrtacha transepiteliya elektr qarshiligi (TEER; Om·sm²) oʻlchovlari L. paraplantarum A1 hujayralari (1:10) va (1:100) (A); A1 CFS (1:10) va (1:100) (B); L. plantarum A2 hujayralari (1:10) va (1:100) (C) hamda A2 CFS (1:10) va (1:100) (D) bilan ishlov berilgandan 10 daqiqa, 30 daqiqa, 1 soat, 2 soat, 6 soat va 24 soat oʻtgach. (*p &amp;lt; 0,05; **p &amp;lt; 0,01; ***&lt;em&gt;p &amp;lt; 0,0001).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f3.jpg\" alt=\"Caco-2 monolayi uchun oʻrtacha transepiteliya elektr qarshiligi (TEER; Om·sm²) oʻlchovlari J (A1 + A2) sut kislotasi bak\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Caco-2 monolayi uchun oʻrtacha transepiteliya elektr qarshiligi (TEER; Om·sm²) oʻlchovlari J (A1 + A2) sut kislotasi bakteriyalari starter madaniyati bilan achitilgan zgugu sharbati (1:10) va (1:100) (A) hamda J spontan achitilgan zgugu sharbati (1:10) va (1:100) (B) bilan ishlov berilgandan 10 daqiqa, 30 daqiqa, 1 soat, 2 soat, 6 soat va 24 soat oʻtgach; (*p &amp;lt; 0,05; ***&lt;em&gt;p &amp;lt; 0,0001).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f4.jpg\" alt=\"24 soatlik ishlovdan soʻng RT-qPCR usuli bilan aniqlangan, turli namunalar bilan inkubatsiya qilingan Caco-2 hujayralari\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;24 soatlik ishlovdan soʻng RT-qPCR usuli bilan aniqlangan, turli namunalar bilan inkubatsiya qilingan Caco-2 hujayralaridagi yalligʻlanishga qarshi sitokinlar va zich birikmalar marker genlarining differensial mRNK darajalari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;24 soatlik ishlovdan soʻng RT-qPCR usuli bilan aniqlangan, turli namunalar bilan inkubatsiya qilingan Caco-2 hujayralaridagi yalligʻlanishga qarshi sitokinlar va zich birikmalar marker genlarining differensial mRNK darajalari. (A) Koʻp quduqli planshetlarga ekilgan TNFα yalligʻlanishga qarshi sitokinining normallashtirilgan mRNK darajalari. (B) Caco-2 hujayralaridagi LCN2 marker genlarining normallashtirilgan mRNK darajalari, (C) Caco-2 hujayralaridagi Cldn 2 marker genlarining normallashtirilgan mRNK darajalari, (D) 24 soatlik inkubatsiyadan soʻng Transwell tizimining mos ravishda yuqori va pastki qismiga ekilgan Caco-2 hujayralaridagi Ocln marker genlarining normallashtirilgan mRNK darajalari. #: manfiy nazorat; ##: musbat nazorat; ns, statistik ahamiyatga ega emas; *p &amp;lt; 0,05; **p &amp;lt; 0,01; ***p &amp;lt; 0,001; ****p &amp;lt; 0,0001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ichak to'sig'i&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yaxlitligining&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15
