        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-thermal.jpg\" alt=\"Pishirish texnologiyalari\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Пищевая инженерия и биотехнология&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;Древнейшие методы термической обработки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Экструзия, sous vide, конвекционный нагрев, пастеризация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Journal of Food Engineering, Food Chemistry&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalarni-organadi\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#nimalarni-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalarni o'rganadi&lt;/span&gt;&lt;/a&gt;Nimalarni o'rganadi&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat tayyorlash texnologiyalari — bu oziq-ovqat xomashyosining issiqlik energiyasi ta'sirida yuz beradigan fizik-kimyoviy o'zgarishlarini o'rganadigan ilmiy yo'nalish. Tadqiqot obyekti — mahsulotlarning isitish, sovutish yoki mexanik ta'sir jarayonida tuzilishi, tarkibi va sensor xususiyatlarining o'zgarishidir.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqatga ishlov berish insoniyatning eng qadimgi texnologiyasidir. Tarixan usullar ochiq olovdan sanoat jarayonlarigacha rivojlandi. Asosiy kashfiyot shundaki, termik ishlov berish nafaqat ta'mni, balki makronutriyentlarning biologik o'zlashtirilishini ham o'zgartiradi. Masalan, shokolad tarkibidagi shakar va sutning ekstruziyasi mahsulotning glikemik javobini o'zgartirishi mumkin. Boshqa tadqiqotlar shuni ko'rsatadiki, palma uzunburun lichinkalarini qovurish va pishirish oqsil miqdorini ikki barobar oshiradi, ammo og'ir metallar xavfi tufayli xavfsizlik nazoratini talab qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat texnologiyalarida ikki yondashuv ajratiladi: empirik (an'anaviy usullar, masalan, qurutob tayyorlash) va muhandislik (jarayonlarni modellashtirish). Muhandislik yondashuvi termodinamika va reaksiyalar kinetikasiga tayanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy usullarga konveksion isitish (qovurish, pishirish), kontaktli isitish (gril), vakuumli past haroratli ishlov berish (sous vide) va fizik-mexanik ishlov berish (ekstruziya) kiradi. Asbob-uskunalar qatoriga harorat datchiklari va teksturani baholash asboblari kiradi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat tayyorlash texnologiyalari oziq-ovqat kimyosi, nutritsiologiya va mikrobiologiya bilan chambarchas bog'liq. Isitish jarayonlarini tushunish xavfsizlikni ta'minlash (pasterizatsiya) uchun zarur.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Yo'nalish texnika universitetlarining oziq-ovqat texnologiyalari va biotexnologiya dasturlari doirasida o'qitiladi. Asosiy bilimlarni oziq-ovqat muhandisligi va ovqatlanish biokimyosi bo'yicha akademik sharhlardan olish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Курутоб — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Muhammad 9009, CC0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/thy.2015.0020\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer: The American Thyroid Association Guidelines Task Force on Thyroid Nodules and Differentiated Thyroid Cancer&lt;/a&gt; — sharh, Thyroid 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/jcc.21287\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CHARMM: the biomolecular simulation program&lt;/a&gt; — sharh, J Comput Chem 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41572-020-00240-3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hepatocellular carcinoma&lt;/a&gt; — sharh, Nat Rev Dis Primers 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Pishirish texnologiyalari","description":"Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.","vcsPath":"reference/disciplines/dir-thermal.md"},"headings":[{"title":"Nimalarni o'rganadi","href":"reference/disciplines/dir-thermal.html#nimalarni-organadi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-thermal.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-thermal.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Usullar va vositalar","href":"reference/disciplines/dir-thermal.html#usullar-va-vositalar","level":2},{"title":"Boshqa yo'nalishlar bilan bog'liqlik","href":"reference/disciplines/dir-thermal.html#boshqa-yonalishlar-bilan-bogliqlik","level":2},{"title":"Qayerda o'qish va nimalarni o'qish kerak","href":"reference/disciplines/dir-thermal.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"reference/disciplines/dir-thermal.html#manbalar","level":2}],"title":"Pishirish texnologiyalari"},"router":{"pathname":"reference/disciplines/dir-thermal","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
