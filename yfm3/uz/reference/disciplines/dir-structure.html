            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Пищевая физика и реология&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;XX век (на стыке коллоидной химии и физики)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Реология, текстурный профильный анализ (ТПА), микроскопия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Journal of Food Science, Food Hydrocolloids&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-structure.html\"&gt;Tekstura va oziq-ovqat fizikasi&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalarni-organadi\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#nimalarni-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalarni o'rganadi&lt;/span&gt;&lt;/a&gt;Nimalarni o'rganadi&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat teksturasi va fizikasi — bu oziq-ovqat mahsulotlarining mikro tuzilishi va ularning sensor xususiyatlari o'rtasidagi bog'liqlikni o'rganuvchi ilmiy yo'nalish (jarayon). Tadqiqot obyekti sifatida emulsiyalar, ko'piklar, gellar va kristallar kabi moddiy mohiyatlar tahlil qilinadi. Olimlar tarkibdagi o'zgarishlar, masalan, baliq qiyamasiga sabzavot kukunlarini qo'shish yoki baliq terisidan olingan kollagendan foydalanish mahsulotning reologik ko'rsatkichlariga (yopishqoqlik, elastiklik va mustahkamlik) qanday ta'sir qilishini tahlil qiladilar.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat teksturasi fani kolloid kimyo va polimerlar fizikasi tutashuvida shakllangan. Asosiy kashfiyotlar oqsil va uglevodlarning termik ishlov berish jarayonidagi xatti-harakatlarini tushunish bilan bog'liq. So'nggi o'n yilliklarda e'tibor funksional materiallar yaratishga qaratildi: masalan, dengiz baliqlari terisi kabi akvakultura chiqindilaridan biologik parchalanadigan plyonkalar ishlab chiqish.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Ikki asosiy yondashuv mavjud: empirik va strukturaviy-mexanik. Empirik yondashuv sensor tahlilga tayanadi. Strukturaviy-mexanik yondashuv esa oziq-ovqatni murakkab fizik tizim sifatida ko'rib chiqadi, bunda butun mahsulotning xususiyatlari molekulalarning o'zaro ta'siri bilan belgilanadi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Teksturani o'rganish uchun reologiya (deformatsiya va oqimni o'lchash), teksturaviy profil tahlili (TPA) va mikroskopiya kabi instrumental usullar qo'llaniladi. Zamonaviy tadqiqotlar retseptura o'zgarganda oziq-ovqat tizimlarining xatti-harakatlarini bashorat qilish uchun kompyuter modellashtirishdan ham foydalanadi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/h2&gt;\n&lt;p&gt;Ushbu yo'nalish oziq-ovqat kimyosi, materialshunoslik va biotexnologiya bilan chambarchas bog'liq. U emulsiyalar va ko'piklarning barqarorligini tushuntirish uchun kolloid kimyo tamoyillaridan foydalanadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Ushbu fanni o'rganish texnika universitetlarining oziq-ovqat texnologiyalari va nutritsiologiya dasturlari doirasida amalga oshiriladi. Asosiy bilimlar fizik kimyo, termodinamika va mikrobiologiyani o'z ichiga oladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Survivalcraft\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Survivalcraft — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — sharh, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — sharh, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — sharh, Nature 2015&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Tekstura va oziq-ovqat fizikasi","description":"Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.","vcsPath":"reference/disciplines/dir-structure.md"},"headings":[{"title":"Nimalarni o'rganadi","href":"reference/disciplines/dir-structure.html#nimalarni-organadi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-structure.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-structure.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Metodlar va vositalar","href":"reference/disciplines/dir-structure.html#metodlar-va-vositalar","level":2},{"title":"Boshqa yo'nalishlar bilan bog'liqlik","href":"reference/disciplines/dir-structure.html#boshqa-yonalishlar-bilan-bogliqlik","level":2},{"title":"Qayerda o'qish va nimalarni o'qish kerak","href":"reference/disciplines/dir-structure.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"reference/disciplines/dir-structure.html#manbalar","level":2}],"title":"Tekstura va oziq-ovqat fizikasi"},"router":{"pathname":"reference/disciplines/dir-structure","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterf
