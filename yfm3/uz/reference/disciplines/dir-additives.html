        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Пищевая химия и технологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;Исторически — с момента использования консервантов; научно — XX век&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Химический анализ, микробиологические тесты, органолептическая оценка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Codex Alimentarius, отчеты JECFA и EFSA&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-additives.html\"&gt;Oziq-ovqat qo'shimchalari&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-organiladi\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#nima-organiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima o‘rganiladi&lt;/span&gt;&lt;/a&gt;Nima o‘rganiladi&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat qo‘shimchalari — bu mahsulotlarning istalgan xususiyatlarini (ta’mi, hidi, rangi, saqlash muddati) ta’minlash uchun ishlab chiqarish, qadoqlash yoki tashish jarayonida qo‘shiladigan moddalardir. Ushbu ilmiy yo‘nalish moddalarning kimyoviy tarkibi, funksional xususiyatlari va xavfsizligini o‘rganadi.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Qo‘shimchalardan foydalanish tuz va ziravorlarni konservant sifatida ishlatishdan boshlangan. XX asrda oziq-ovqat kimyosi rivojlanishi bilan E-kodlar tizimi joriy etildi. Zamonaviy tadqiqotlar chiqindilardan biopolimerlar olishga qaratilgan. Masalan, sitrus po‘stlog‘idan tayyorlangan qoplamalar sabzavotlarni mog‘ordan himoya qiladi, greyfrut ekstrakti qo‘shilgan jelatin plyonkalar esa go‘sht mahsulotlarini muzlatgichda 5 oygacha yangi saqlashga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Texnologik yondashuv mahsulot sifatini yaxshilashga, xavfsizlik yondashuvi esa har bir modda uchun ruxsat etilgan sutkalik iste’mol miqdorini (ADI) belgilashga qaratilgan. Hozirgi kunda sintetik moddalarni o‘simlik xomashyosidan olingan tabiiy ingredientlar bilan almashtirish ustuvor hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Kimyoviy tahlil, mikrobiologik testlar va organoleptik baholash (degustatsiya) asosiy metodlardir. Yangi qoplamalar samaradorligini tekshirish uchun mahsulotlarning tezlashtirilgan qarish usullari va mikroorganizmlar o‘sishini nazorat qilish qo‘llaniladi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo‘nalishlar bilan bog‘liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo‘nalishlar bilan bog‘liqlik&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat qo‘shimchalari konservantlar, emulsifikatorlar, stabilizatorlar, bo‘yoqlar va antioksidantlar bilan chambarchas bog‘liq. Shuningdek, qadoqlash materiallarining atrof-muhitga ta’sirini o‘rganuvchi ekologiya fanlari bilan ham aloqador.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o‘qish va nimalarni o‘qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o‘qish va nimalarni o‘qish kerak&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat texnologiyalari bo‘yicha ta’lim texnika universitetlarining «Oziq-ovqat muhandisligi» yo‘nalishlarida olib boriladi. Xavfsizlik tamoyillarini tushunish uchun Codex Alimentarius hujjatlari va JECFA/EFSA hisobotlari asosiy manbalar hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5_%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Пищевые добавки — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/ieam.258\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Perfluoroalkyl and polyfluoroalkyl substances in the environment: terminology, classification, and origins&lt;/a&gt; — sharh, Integr Environ Assess Manag 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.marpolbul.2011.09.025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microplastics as contaminants in the marine environment: a review&lt;/a&gt; — sharh, Mar Pollut Bull 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1098/rstb.2008.0205\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accumulation and fragmentation of plastic debris in global environments&lt;/a&gt; — sharh, Philos Trans R Soc Lond B Biol Sci 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"E-коды без мифов: что это, зачем, как работает и что говорят исследования."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Oziq-ovqat qo'shimchalari","description":"E-коды без мифов: что это, зачем, как работает и что говорят исследования.","vcsPath":"reference/disciplines/dir-additives.md"},"headings":[{"title":"Nima o‘rganiladi","href":"reference/disciplines/dir-additives.html#nima-organiladi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-additives.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-additives.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Metodlar va vositalar","href":"reference/disciplines/dir-additives.html#metodlar-va-vositalar","level":2},{"title":"Boshqa yo‘nalishlar bilan bog‘liqlik","href":"reference/disciplines/dir-additives.html#boshqa-yonalishlar-bilan-bogliqlik","level":2},{"title":"Qayerda o‘qish va nimalarni o‘qish kerak","href":"reference/disciplines/dir-additives.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"reference/disciplines/dir-additives.html#manbalar","level":2}],"title":"Oziq-ovqat qo'shimchalari"},"router":{"pathname":"reference/disciplines/dir-additives","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewe
