        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-safety.jpg\" alt=\"Xavfsizlik va saqlash\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Пищевая безопасность и технологии хранения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;Развитие промышленной пищевой безопасности (XX век)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;HACCP, физико-химический анализ, метаанализ, биоразлагаемые покрытия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Lancet, BMJ, PLoS Medicine&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-safety.html\"&gt;Xavfsizlik va saqlash&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalarni-organadi\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#nimalarni-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalarni o‘rganadi&lt;/span&gt;&lt;/a&gt;Nimalarni o‘rganadi&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat xavfsizligi va saqlash — bu oziq-ovqat mahsulotlarining buzilishi, ifloslanishi va sifatini yo‘qotishining oldini olish usullarini o‘rganadigan ilmiy yo‘nalishdir. Asosiy vazifa mahsulot yaxlitligini ta’minlash, uning ozuqaviy qiymatini saqlash va jismoniy, kimyoviy hamda biologik omillarni boshqarish orqali iste’molchi salomatligi uchun xavflarni kamaytirishdan iborat.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Yo‘nalish rivoji hunarmandchilik usullaridan sanoat texnologiyalariga o‘tish bilan bog‘liq. Mikroorganizmlarning oziq-ovqat buzilishidagi rolini tushunish muhim bosqich bo‘ldi. So‘nggi o‘n yilliklarda e’tibor ultra-qayta ishlangan mahsulotlarning metabolizmga ta’siriga qaratildi: 8,8 million kishi ishtirokidagi metatahlil shuni ko‘rsatdiki, har kuni 100 g ultra-qayta ishlangan oziq-ovqat iste’mol qilish yurak-qon tomir kasalliklari xavfini 14% ga oshiradi. Zamonaviy tadqiqotlar faol qadoqlashga, masalan, hosilni himoya qilish uchun xitozan gidrogellari yoki go‘shtdagi bakteriyalar o‘sishini sekinlashtirish uchun timyan efir moyi qo‘shilgan biologik parchalanadigan materiallarga qaratilgan.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Ilm-fanda ikki yondashuv ajratiladi: reaktiv (tayyor mahsulot sifatini nazorat qilish) va preventiv (ishlab chiqarish bosqichida xavflarni boshqarish). Preventiv yondashuv HACCP tamoyillariga asoslanadi. Tadqiqotlar tashqi omillar ta’sirini ham hisobga oladi: masalan, qon izlari va quyosh nuri o‘simlik moyini bir necha soat ichida aldegidlar manbaiga aylantirishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Usullar fizik-kimyoviy tahlil, mikrobiologik monitoring va qadoqlashni stress-testdan o‘tkazishni o‘z ichiga oladi. Vositalar «aqlli» qoplamalar yaratishdan tortib, organizm to‘qimalarini tiklashga qodir rekombinant oqsillarni ishlab chiqishgacha bo‘lgan doirani qamrab oladi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo‘nalishlar bilan bog‘liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo‘nalishlar bilan bog‘liqlik&lt;/h2&gt;\n&lt;p&gt;Yo‘nalish mikrobiologiya, polimerlar kimyosi, nutritsiologiya va materiallar texnologiyasi bilan chambarchas bog‘liq. U mikrob xavfsizligi, qadoqlash migratsiyasi va jarayon ifloslantiruvchilarini o‘rganish bilan integratsiyalashgan.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o‘qish va nimalarni o‘qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o‘qish va nimalarni o‘qish kerak&lt;/h2&gt;\n&lt;p&gt;Ta’lim «Oziq-ovqat muhandisligi» va «Oziq-ovqat tizimlari xavfsizligi» dasturlari doirasida olib boriladi. Ilmiy ma’lumotlarning shaffofligini ta’minlovchi PRISMA standartlari bo‘yicha rasmiylashtirilgan tizimli sharhlar va metatahlillarni o‘rganish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F_%D0%B1%D0%B5%D0%B7%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D0%BE%D1%81%D1%82%D1%8C\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Информационная безопасность — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Posters_for_information_security_for_the_Ministry_of_Defense_of_the_Russian_Federation.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: MoD of Russian Federation, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — sharh, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(21)02724-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis&lt;/a&gt; — sharh, Lancet 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — sharh, PLoS Med 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Xavfsizlik va saqlash","description":"Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.","vcsPath":"reference/disciplines/dir-safety.md"},"headings":[{"title":"Nimalarni o‘rganadi","href":"reference/disciplines/dir-safety.html#nimalarni-organadi","level":2},{"
