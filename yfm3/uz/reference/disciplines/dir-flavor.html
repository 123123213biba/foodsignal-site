            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Пищевая химия и сенсорный анализ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;Классификация летучих соединений и реакция Майяра&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Газовая хроматография, масс-спектрометрия, сенсорная панель&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Circulation, Nature Medicine, Clinical Microbiology Reviews&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalarni-organadi\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#nimalarni-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalarni o'rganadi&lt;/span&gt;&lt;/a&gt;Nimalarni o'rganadi&lt;/h2&gt;\n&lt;p&gt;Ta'm va xushbo'ylik — bu uchuvchan birikmalarning kimyoviy tabiati va ularning organizm sezgi retseptorlari bilan o'zaro ta'sirini o'rganadigan ilmiy yo'nalish. Soha moddalarning molekulyar tuzilishi oziq-ovqat mahsulotlarining organoleptik xususiyatlarini qanday shakllantirishi va sublimatsiya yoki fermentatsiya kabi tashqi jarayonlar bu profilni qanday o'zgartirishini tadqiq qiladi.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Xushbo'yliklarni o'rganish oziq-ovqat mahsulotlaridagi uchuvchan birikmalarni tasniflashdan boshlangan. Mayyar reaksiyalarining rolini tushunish muhim bosqich bo'ldi, bu termik ishlov berishda qovurilgan notalarning paydo bo'lishini tushuntiradi. So'nggi o'n yilliklarda e'tibor qo'shimchalarni olishning biotexnologik usullariga, masalan, yakon ildizini bakteriyalar yordamida mannitga aylantirishga qaratildi.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Ikkita asosiy yondashuv mavjud: analitik va funksional. Analitik yondashuv o'ziga xos notalar uchun javobgar bo'lgan molekulalarni aniqlashga qaratilgan. Funksional yondashuv ishlov berish texnologiyalarining ozuqaviy moddalarni saqlashga ta'sirini o'rganadi. Tadqiqotlar shuni ko'rsatadiki, sublimatsiya mahsulotning dastlabki profilini saqlaydi, issiq quritish esa yangi aromatik birikmalarni hosil qiladi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Tahlil uchun gaz xromatografiyasi va mass-spektrometriya usullari qo'llaniladi. Sensor tahlil xalqaro standartlarga muvofiq ta'mning intensivligi va sifatini baholaydigan o'qitilgan degustatorlar paneli ishtirokida o'tkaziladi. Biotexnologiyada o'simlik xomashyosining ta'm xususiyatlarini modifikatsiya qilish uchun boshqariladigan fermentatsiya usullari qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/h2&gt;\n&lt;p&gt;Yo'nalish oziq-ovqat kimyosi va idrok fiziologiyasi bilan chambarchas bog'liq. U Mayyar reaksiyalari, uchuvchan birikmalar tahlili va shakar o'rnini bosuvchi moddalarni ishlab chiqish bilan kesishadi. Ta'm mexanizmlarini tushunish diyetologiya uchun muhimdir, chunki mahsulotlar tarkibi metabolik jarayonlarga bevosita ta'sir qiladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Fan sohasini chuqur tushunish uchun oziq-ovqat kimyosi, biotexnologiya va sensor tahlil dasturlarini o'rganish tavsiya etiladi. Asosiy bilimlarni mikrobiologiya va nutritsiologiya bo'yicha akademik sharhlardan, shuningdek, aromatik birikmalar kimyosi va oziq-ovqat xavfsizligiga bag'ishlangan maxsus nashrlardan olish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B0%D1%81%D0%BC%D0%B0%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Басмати — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — sharh, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41591-019-0675-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Chronic inflammation in the etiology of disease across the life span&lt;/a&gt; — sharh, Nat Med 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.12.4.564\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Plant products as antimicrobial agents&lt;/a&gt; — sharh, Clin Microbiol Rev 1999&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ta'm va hid","description":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.","vcsPath":"reference/disciplines/dir-flavor.md"},"headings":[{"title":"Nimalarni o'rganadi","href":"reference/disciplines/dir-flavor.html#nimalarni-organadi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-flavor.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-flavor.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Metodlar va vositalar","href":"reference/disciplines/dir-flavor.html#metodlar-va-vositalar","level":2},{"title":"Boshqa yo'nalishlar bilan bog'liqlik","href":"reference/disciplines/dir-flavor.html#boshqa-yonalishlar-bilan-bogliqlik","level":2},{"title":"Qayerda o'qish va nimalarni o'qish kerak","href":"reference/disciplines/dir-flavor.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"reference/disciplines/dir-flavor.html#manbalar","level":2}],"title":"Ta'm va hid"},"router":{"pathname":"reference/disciplines/dir-flavor","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
