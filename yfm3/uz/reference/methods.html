        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;29 ta tushuncha&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ftir-spectroscopy.html\"&gt;FTIR-спектроскопия&lt;/a&gt; — Amid chiziqlarini identifikatsiya qilish orqali jelatinning tarkibiy yaxlitligini tasdiqlash uchun ishlatiladigan tahliliy usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maldi-tof-mass-spectrometry.html\"&gt;MALDI-TOF масс-спектрометрия&lt;/a&gt; — Ionlashtirilgan molekulalarning massa-spektrometrik tahliliga asoslangan mikroorganizmlarni identifikatsiya qilishning analitik usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-absorption-spectrometry.html\"&gt;Атомно-абсорбционная спектрометрия&lt;/a&gt; — Lichinkalardagi qo'rg'oshin va kadmiy konsentratsiyasini aniqlash uchun ishlatiladigan miqdoriy kimyoviy tahlil usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hurdle-technology.html\"&gt;барьерный подход&lt;/a&gt; — Sintetik konservantlarsiz mikroorganizmlarni bostirish va saqlash muddatini uzaytirish uchun bir nechta ta'sir omillarini birlashtirish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/winterization.html\"&gt;Винтеризация&lt;/a&gt; — Lipid fraktsiyalarini cho'ktirish va keyinchalik olib tashlash uchun sovutish orqali ekstraktni tozalashning texnologik jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hplc.html\"&gt;ВЭЖХ&lt;/a&gt; — Donli dukkakli ekinlarda mikotoksinlar miqdorini aniqlash uchun ishlatiladigan tahliliy usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-chromatography-mass-spectrometry.html\"&gt;Газовая хроматография-масс-спектрометрия&lt;/a&gt; — Kekik efir moyi tarkibidagi 29 ta birikmani aniqlash uchun ishlatiladigan analitik usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha-based-sourdough.html\"&gt;Закваска на основе комбучи&lt;/a&gt; — Kombucha simbiotik hamjamiyatini don matritsasiga moslashtirish orqali olingan non pishirish uchun mikrobial inokulyat.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;ИК-спектроскопия с преобразованием Фурье&lt;/a&gt; — Oshqovoq kukuni ta'sirida oqsillarning ikkilamchi tuzilishidagi o'zgarishlarni aniqlash uchun qo'llanilgan analitik usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elisa.html\"&gt;ИФА&lt;/a&gt; — Xomashyoda mikotoksinlarni aniqlash uchun qo'llaniladigan laboratoriya skrining usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meta-analysis.html\"&gt;Метаанализ&lt;/a&gt; — Bir nechta mustaqil tadqiqotlar natijalarini birlashtirib, umumlashtirilgan baho olish uchun ishlatiladigan statistik usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/check-all-that-apply.html\"&gt;Метод CATA&lt;/a&gt; — Ishtirokchilar taklif etilgan deskriptorlar ro'yxatidan mahsulotning mos xususiyatlarini tanlaydigan sensorli tahlil usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;Метод бляшкообразующих единиц&lt;/a&gt; — Namunadagi hayotiy virus zarralari konsentratsiyasini miqdoriy aniqlash uchun standart laboratoriya usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kjeldahl-method.html\"&gt;Метод Кьельдаля&lt;/a&gt; — Oziq-ovqat mahsulotlaridagi xom protein miqdorini 6,25 qayta hisoblash koeffitsienti yordamida aniqlashning tahliliy usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/technology-acceptance-model.html\"&gt;модель принятия технологий&lt;/a&gt; — Devis savolnomasiga asoslangan hamda foydalanuvchilar tomonidan qabul qilinadigan foydalilik va foydalanish qulayligini o'lchaydigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molecular-docking.html\"&gt;Молекулярный докинг&lt;/a&gt; — Polifenol molekulalarining nishon oqsillar bilan o'zaro ta'sirini modellashtirish va yaqinlik energiyasini baholash uchun kompyuter usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observational-cross-sectional-study.html\"&gt;Наблюдательное кросс-секционное исследование&lt;/a&gt; — Sun'iy intellekt va shifokorlar guruhlari ish natijalarini bir vaqtning o'zida taqqoslashga asoslangan vositalar samaradorligini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/carbohydrate-counting.html\"&gt;подсчет углеводов&lt;/a&gt; — Har bir ovqatlanishda uglevodlar iste'molini hisoblashni hamda glikemik profil va jismoniy faollikni hisobga olgan holda qisqa ta'sirli…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;Сверхвысокоэффективная жидкостная хроматография&lt;/a&gt; — Namunalardagi erkin qandlar va fenol fraksiyalarining tarkibini ajratish va aniqlashning tahliliy usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/16s-rrna-gene-sequencing.html\"&gt;секвенирование гена 16S рРНК&lt;/a&gt; — 16S rRNK genining gipero'zgaruvchan hududlarini tadqiq qilish orqali ichak mikrobiotasini tahlil qilish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-protein-particle-encapsulation-sppe.html\"&gt;Система капсулирования отдельных белковых частиц&lt;/a&gt; — Alohida oqsil zarralarini kapsulalash tizimi — oshqozon-ichak traktida oqsilning ajralib chiqish tezligini nazorat qilish uchun oqsil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;сканирующая электронная микроскопия&lt;/a&gt; — Gelning oqsil to'ri zich joylashganligini tasdiqlash uchun qo'llanilgan mikroskopik tahlil usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hot-air-drying.html\"&gt;сушка горячим воздухом&lt;/a&gt; — Yuqori haroratda oziq-ovqat xomashyosini suvsizlantirish texnologiyasi, Mayyar reaksiyasining kechishiga yordam beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-polymerization.html\"&gt;Термическая полимеризация&lt;/a&gt; — Termik polimerizatsiya — kapsulalash uchun asos sifatida ishlatiladigan barqaror mikrosferalarni shakllantirish uchun oqsil izolyatini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enzymatic-modification.html\"&gt;Ферментативная модификация&lt;/a&gt; — Olma sharbati yordamida past pH darajasida kofe fenollarini oqsillar bilan bog'lash texnologik jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt; — Fermentatsiya — bu mikroorganizmlar yordamida o‘simlik xomashyosini biologik qayta ishlash jarayoni bo‘lib, u mahsulotning kimyoviy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/alkaline-extraction.html\"&gt;Щелочная экстракция&lt;/a&gt; — Muhitning pH darajasini o'zgartirish orqali xomashyodan oqsil ajratib olish texnologik jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt; — Ekstruziya — bu oziq-ovqat tarkibiy qismlarining tuzilishini o'zgartirish uchun yuqori harorat va bosim ostida doimiy aralashtirish va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sds-page.html\"&gt;Электрофорез в полиакриламидном геле&lt;/a&gt; — Oqsil molekulalarining agregatsiyasini tahlil qilish uchun ishlatiladigan, oqsillarni molekulyar og'irligi bo'yicha ajratish usuli.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"29 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Usullar","description":"29 ta tushuncha","vcsPath":"reference/methods.md"},"headings":[],"title":"Usullar"},"router":{"pathname":"reference/methods","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
