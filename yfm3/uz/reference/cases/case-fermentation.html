        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Keyslar: vositalar va usullar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Fermentatsiya — bu mikroorganizmlar yordamida o‘simlik xomashyosini biologik qayta ishlash jarayoni bo‘lib, u mahsulotning kimyoviy tarkibini o‘zgartiradi va yangi funksional xususiyatlarni hosil qiladi.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Vosita&lt;/td&gt;\n&lt;td&gt;Микробиологическая ферментация (биохимическая переработка)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Vazifa&lt;/td&gt;\n&lt;td&gt;Модификация состава сырья для получения функциональных продуктов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ma'lumotlar&lt;/td&gt;\n&lt;td&gt;Корень якона (для маннита), семена алеппской сосны (для кишечного барьера)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Natija&lt;/td&gt;\n&lt;td&gt;Получение сахарозаменителей и биоактивных компонентов без химии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"vazifa\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#vazifa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vazifa&lt;/span&gt;&lt;/a&gt;Vazifa&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya — bu xomashyoni kimyoviy tarkibini o'zgartirish uchun mikroorganizmlar yoki fermentlar ishtirokida organik moddalarni biologik qayta ishlash jarayoni. Metodning asosiy maqsadi mahsulotning dastlabki xususiyatlarini modifikatsiya qilish: organoleptik ko'rsatkichlarni yaxshilash, ozuqa moddalarining biologik mavjudligini oshirish yoki to'g'ridan-to'g'ri kimyoviy ekstraktsiya yo'li bilan olish qiyin bo'lgan yangi funksional birikmalarni yaratishdir.&lt;/p&gt;\n&lt;h2 id=\"instrument-yoki-metod\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#instrument-yoki-metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Instrument yoki metod&lt;/span&gt;&lt;/a&gt;Instrument yoki metod&lt;/h2&gt;\n&lt;p&gt;Metod boshqariladigan biokimyoviy reaksiya bo'lib, unda mikroorganizmlar (bakteriyalar, achitqilar yoki mog'or zamburug'lari) xomashyo komponentlarini o'z metabolizmi uchun substrat sifatida ishlatadi. Mikroorganizmlar hayotiy faoliyati natijasida ikkilamchi metabolitlar: organik kislotalar, spirtlar, fermentlar va o'ziga xos qandlar hosil bo'ladi. Jarayon muhit parametrlarini (harorat, pH va kislorod darajasi) nazorat qilishni talab qiladi, bu esa mikroorganizmlarning metabolik yo'lini kerakli maqsadli mahsulot tomon yo'naltirish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"qanday-qollanildi\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#qanday-qollanildi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday qo'llanildi&lt;/span&gt;&lt;/a&gt;Qanday qo'llanildi&lt;/h2&gt;\n&lt;p&gt;yakon ildizi tadqiqotida fermentatsiya mannitol (shakar o'rnini bosuvchi modda) olish uchun ishlatildi. Xomashyoni ko'p bosqichli kimyoviy qayta ishlash o'rniga, olimlar bakterial fermentatsiyani qo'lladilar. Mikroorganizmlar yakon ildizining tabiiy qandlarini qayta ishlab, ularni mannitolga aylantirdi. Aleppo qarag'ayi urug'laridan olingan fermentlangan sharbat esa ichak to'sig'i hujayralari yaxlitligiga ta'sirini o'rganish uchun ishlatildi.&lt;/p&gt;\n&lt;h2 id=\"natija\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#natija\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natija&lt;/span&gt;&lt;/a&gt;Natija&lt;/h2&gt;\n&lt;p&gt;Fermentatsiyani qo'llash murakkab kimyoviy jarayonlarni chetlab o'tib, yakondan mannitol olish imkonini berdi. Aleppo qarag'ayi urug'lari sharbati misolida, fermentatsiya ichak hujayralarining to'siq funksiyasiga ta'sir qilishi mumkin bo'lgan ichimlik tarkibini o'zgartirishga yordam berdi. Metod agressiv kimyoviy ta'sirisiz tarkibni modifikatsiya qilish usuli sifatida samaradorligini ko'rsatdi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya mikroorganizmlarning hayotiy faoliyatiga bog'liq biologik jarayon bo'lib, u muhit sharoitlarining eng kichik o'zgarishlariga ham sezgir. Jarayon natijasi mikroorganizm shtammi, substrat tarkibi va protokolga rioya qilish aniqligiga qarab o'zgarishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"qanday-takrorlash-kerak\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#qanday-takrorlash-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday takrorlash kerak&lt;/span&gt;&lt;/a&gt;Qanday takrorlash kerak&lt;/h2&gt;\n&lt;p&gt;Metodni amalga oshirish uchun: toza o'simlik xomashyosi, mikroorganizmning o'ziga xos shtammi (kultura), sterillikni saqlash va muhit parametrlarini (termostat, pH-metr) nazorat qilish uchun uskunalar kerak. Jarayon substratni tayyorlash, inokulyatsiya (kulturani kiritish), belgilangan sharoitlarda inkubatsiya va maqsadli mahsulotni tozalashni o'z ichiga oladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — sharh, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3168/jds.s0022-0302(91)78551-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Methods for dietary fiber, neutral detergent fiber, and nonstarch polysaccharides in relation to animal nutrition&lt;/a&gt; — sharh, J Dairy Sci 1991&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41577-019-0165-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The NLRP3 inflammasome: molecular activation and regulation to therapeutics&lt;/a&gt; — sharh, Nat Rev Immunol 2019&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Keyslar: vositalar va usullar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Fermentatsiya — bu mikroorganizmlar yordamida o‘simlik xomashyosini biologik qayta ishlash jarayoni bo‘lib, u mahsulotning kimyoviy tarkibini o‘zgartiradi va ya"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ферментация","description":"Fermentatsiya — bu mikroorganizmlar yordamida o‘simlik xomashyosini biologik qayta ishlash jarayoni bo‘lib, u mahsulotning kimyoviy tarkibini o‘zgartiradi va ya","vcsPath":"reference/cases/case-fermentation.md"},"headings":[{"title":"Vazifa","href":"reference/cases/case-fermentation.html#vazifa","level":2},{"title":"Instrument yoki metod","href":"reference/cases/case-fermentation.html#instrument-yoki-metod","level":2},{"title":"Qanday qo'llanildi","href":"reference/cases/case-fermentation.html#qanday-qollanildi","level":2},{"title":"Natija","href":"reference/cases/case-fermentation.html#natija","level":2},{"title":"Cheklovlar","href":"reference/cases/case-fermentation.html#cheklovlar","level":2},{"title":"Qanday takrorlash kerak","href":"reference/cases/case-fermentation.html#qanday-takrorlash-kerak","level":2},{"title":"Manbalar","href":"reference/cases/case-fermentation.html#manbalar","level":2}],"title":"Ферментация"},"router":{"pathname":"reference/cases/case-fermentation","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
