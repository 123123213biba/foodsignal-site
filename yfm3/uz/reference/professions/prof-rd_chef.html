        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;соединяет кухню и науку: пробует, измеряет, пишет технологические карты&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-rd_chef.jpg\" alt=\"Шеф-технолог (R&amp;amp;D-шеф)\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;соединяет кухню и науку: пробует, измеряет, пишет технологические карты&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;кулинария, физика кухни, документирование&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ta'lim&lt;/td&gt;\n&lt;td&gt;Профильное образование в области пищевых технологий, биотехнологий, химии или физики.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qayerda ishlaydi&lt;/td&gt;\n&lt;td&gt;Ресторанные холдинги, пищевые производства, R&amp;amp;D-лаборатории, фудтех-стартапы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt;, &lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#nima-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima bilan shug'ullanadi&lt;/span&gt;&lt;/a&gt;Nima bilan shug'ullanadi&lt;/h2&gt;\n&lt;p&gt;Shef-texnolog (R&amp;amp;D-shef) — bu gastronomiya va oziq-ovqat fani kesishmasida pazandalik jarayonlarini loyihalashtiruvchi mutaxassis. U ijodiy g'oyalarni takrorlanadigan texnologik protokollarga aylantiradi, mahsulotning ta'mi, tuzilishi va xavfsizligini ta'minlaydi.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vazifa — standartlashtirilgan texnologik kartalarni yaratish. Amaliyotda bu quyidagilarni o'z ichiga oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Retsepturalarni ishlab chiqish: ingredientlarning funksional xususiyatlarini hisobga olgan holda.&lt;/li&gt;\n&lt;li&gt;Jarayonlarni optimallashtirish: saqlash muddatini uzaytirish yoki mahsulotning glikemik javobini o'zgartirish uchun ishlov berish parametrlarini (harorat, bosim) tanlash.&lt;/li&gt;\n&lt;li&gt;Sifat nazorati: degustatsiyalar o'tkazish va instrumental tahlil (masalan, qovurilgan mahsulotlardagi pirazinlarni aniqlash uchun biosensorlar).&lt;/li&gt;\n&lt;li&gt;Xavflarni baholash: xomashyoni og'ir metallar yoki mikrobiologik xavfsizlik nuqtai nazaridan tahlil qilish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko'nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Kasb pazandalik mahorati va muhandislik yondashuvini talab qiladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ishlov berish usullari: su-vid, ekstruziya, sublimatsiya, ultratovushli emulsiya.&lt;/li&gt;\n&lt;li&gt;Analitik vositalar: elektron burunlar (biosensorlar), tekstura va namlikni o'lchash usullari.&lt;/li&gt;\n&lt;li&gt;Hujjatlashtirish: HACCP, ISO 22000 protokollarini tuzish.&lt;/li&gt;\n&lt;li&gt;Sensor tahlil: ISO 5492 standartlari bo'yicha ta'm va hidni baholash.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Kasbga yo'l odatda oziq-ovqat texnologiyalari yoki biotexnologiyalar sohasidagi ta'lim orqali o'tadi. Fizika va kimyo bo'yicha bazaviy bilimlar xomashyo tuzilishini tushunishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-qanday-osish\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#qayerda-ishlash-va-qanday-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va qanday o'sish&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va qanday o'sish&lt;/h2&gt;\n&lt;p&gt;R&amp;amp;D-sheflar yirik restoran xoldinglarida, oziq-ovqat ishlab chiqarish korxonalarida, startaplarda va ilmiy-tadqiqot laboratoriyalarida ishlaydi. Karyera o'sishi kichik texnologdan innovatsiyalar departamenti rahbarigacha bo'lishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%83%D0%BD%D1%82%D0%BE%D0%BB%D0%B0%2C_%D0%A2%D1%83%D0%BE%D0%BC%D0%BE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Сунтола, Туомо — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Tuomo_Suntola,_2014.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Riikka Puurunen, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"соединяет кухню и науку: пробует, измеряет, пишет технологические карты"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Шеф-технолог (R&amp;D-шеф)","description":"соединяет кухню и науку:
