            {"data":{"leading":false,"html":"&lt;p&gt;228 ta tushuncha&lt;/p&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T&lt;/span&gt;&lt;/a&gt;T&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structure.html\"&gt;Tekstura va oziq-ovqat fizikasi&lt;/a&gt; — Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt; — Umumiy uchuvchan asosli azot (TVB-N) — go‘shtning yangiligini ko‘rsatuvchi ko‘rsatkich bo‘lib, u oqsil parchalanishi va bakteriyalar…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_based.html\"&gt;Растительные аналоги&lt;/a&gt; — Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plant-based-yogurt-alternative.html\"&gt;Растительный аналог йогурта&lt;/a&gt; — Sutli yogurtni almashtirish uchun mo'ljallangan o'simlik asosidagi fermentlangan oziq-ovqat mahsuloti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/margin-of-exposure.html\"&gt;Расчетный предел воздействия&lt;/a&gt; — Qo'rg'oshin ta'sir qilish xavfini baholash uchun ishlatiladigan kimyoviy xavfsizlik ko'rsatkichi, bunda 10 dan past qiymat EFSA…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maillard-reaction.html\"&gt;реакция Майяра&lt;/a&gt; — Isitish jarayonida aminokislotalar va qandlar o'rtasidagi kimyoviy reaksiya, o'ziga xos aromatik va ta'm beruvchi birikmalarni hosil qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recombinant-human-type-iii-collagen.html\"&gt;Рекомбинантный человеческий коллаген III типа&lt;/a&gt; — Oshqozon shilliq qavatini himoya qilish uchun biomaterial sifatida ishlatiladigan biotexnologik yo'l bilan olingan hujayradan tashqari…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/trichiurus-haumela.html\"&gt;рыба-сабля&lt;/a&gt; — Miofibrillyar oqsillari kuchli gel hosil qilish qobiliyati past bo'lgan baliq turi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-shelf_life.html\"&gt;Срок годности&lt;/a&gt; — Порча, прогнозирование срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sarcopenia.html\"&gt;Саркопения&lt;/a&gt; — Sarkopeniya — mushak massasi va kuchining yo'qolishi bilan tavsiflanadigan, jismoniy zaiflikka olib keladigan yoshga bog'liq degenerativ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/type-1-diabetes.html\"&gt;сахарный диабет 1 типа&lt;/a&gt; — Bolalar va o'smirlar orasida keng tarqalgan, glikemik nazoratni, insulin yuborishni va ovqatlanishni boshqarishni talab qiladigan surunkali…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;Сверхвысокоэффективная жидкостная хроматография&lt;/a&gt; — Namunalardagi erkin qandlar va fenol fraksiyalarining tarkibini ajratish va aniqlashning tahliliy usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/16s-rrna-gene-sequencing.html\"&gt;секвенирование гена 16S рРНК&lt;/a&gt; — 16S rRNK genining gipero'zgaruvchan hududlarini tadqiq qilish orqali ichak mikrobiotasini tahlil qilish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pi3k-akt-mtor-signaling-pathway.html\"&gt;Сигнальный путь PI3K/AKT/mTOR&lt;/a&gt; — Aktivlanishi mushak oqsili sinteziga va mushak atrofiyasini bostirishga yordam beradigan biokimyoviy yo'l.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-protein-particle-encapsulation-sppe.html\"&gt;Система капсулирования отдельных белковых частиц&lt;/a&gt; — Alohida oqsil zarralarini kapsulalash tizimi — oshqozon-ichak traktida oqsilning ajralib chiqish tezligini nazorat qilish uchun oqsil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;сканирующая электронная микроскопия&lt;/a&gt; — Gelning oqsil to'ri zich joylashganligini tasdiqlash uchun qo'llanilgan mikroskopik tahlil usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/somatostatin.html\"&gt;соматостатин&lt;/a&gt; — Ichakning motor faolligini susaytiruvchi zardob regulyator omili.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/potassium-sorbate.html\"&gt;сорбат калия&lt;/a&gt; — Vasabi sousida gaz hosil qiluvchi bakteriyalarning ko'payishini to'xtatish uchun ishlatiladigan oziq-ovqat konservanti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wasabi-sauce.html\"&gt;соус васаби&lt;/a&gt; — Asosan yerqalampir ildizidan (Armoracia rusticana) tayyorlanadigan, izotiosiyanatlar hisobiga o'tkir ta'm va mikroblarga qarshi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-physiology.html\"&gt;Социальная физиология&lt;/a&gt; — Yaqin kishining mavjudligi stress ta'sirida organizmga tushadigan fiziologik yukni kamaytiradigan hodisa.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mediterranean-mussel.html\"&gt;средиземноморская мидия&lt;/a&gt; — Tadqiqotda konservalash ob'ekti sifatida foydalanilgan, yuqori oqsil miqdori va tez mikrobial buzilishi bilan ajralib turadigan ikki…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Hisob-kitoblar aniqligi ko'rsatkichi, sun'iy intellekt yoki ekspertlar tomonidan olingan qiymatlarning etalon ma'lumotlardan o'rtacha…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/surimi.html\"&gt;сурими&lt;/a&gt; — O'simlik kukuni qo'shilishi orqali teksturasi va gelining oqsil to'ri mustahkamlanishi mumkin bo'lgan baliq qiyma mahsuloti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hot-air-drying.html\"&gt;сушка горячим воздухом&lt;/a&gt; — Yuqori haroratda oziq-ovqat xomashyosini suvsizlantirish texnologiyasi, Mayyar reaksiyasining kechishiga yordam beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/edible-packaging.html\"&gt;Съедобная упаковка&lt;/a&gt; — Yeyiladigan qadoq — bu mahsulotlardagi namlik yo‘qotilishini kamaytirish va mikroorganizmlar o‘sishini bostirish uchun mo‘ljallangan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whey-protein-isolate.html\"&gt;Сывороточный изолят&lt;/a&gt; — Zardob oqsili izolyati — zardob oqsilining yuqori darajada tozalangan shakli bo'lib, tarkibida muhim aminokislotalar mavjud.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l\"&gt;&lt;a href=\"reference/glossary.html#l\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Л&lt;/span&gt;&lt;/a&gt;Л&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rhynchophorus-phoenicis-larvae.html\"&gt;Личинки пальмового долгоносика&lt;/a&gt; — Oqsil manbai sifatida ishlatiladigan, og'ir metallar to'planishi sababli substrat tozaligini nazorat qilishni talab qiladigan yeyiladigan…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-micronutrients.html\"&gt;Витамины и минералы&lt;/a&gt; — Содержание, потери при готовке, обогащение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/winterization.html\"&gt;Винтеризация&lt;/a&gt; — Lipid fraktsiyalarini cho'ktirish va keyinchalik olib tashlash uchun sovutish orqali ekstraktni tozalashning texnologik jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/water-holding-capacity.html\"&gt;влагоудерживающая способность&lt;/a&gt; — Oshqovoq kukunining optimal dozasi qo'shilganda 11,21% ga oshadigan gelning namlikni ushlab turish xususiyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extracellular-matrix.html\"&gt;Внеклеточный матрикс&lt;/a&gt; — Hujayralarning yuzaga birikishi va bo'linishi uchun zarur bo'lgan oqsillardan tashkil topgan tarkibiy asos.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secondary-nucleation.html\"&gt;Вторичная нуклеация&lt;/a&gt; — Mavjud kristallar yoki zarralar mavjudligi sababli o'ta to'yingan eritmada yangi kristallarning hosil bo'lish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hplc.html\"&gt;ВЭЖХ&lt;/a&gt; — Donli dukkakli ekinlarda mikotoksinlar miqdorini aniqlash uchun ishlatiladigan tahliliy usul.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-lipid_aroma.html\"&gt;Окисление жиров и ароматы&lt;/a&gt; — Прогоркание, «рыбный» запах, ароматы жареного масла.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/olfactory-receptor-or5k1.html\"&gt;Обонятельный рецептор OR5K1&lt;/a&gt; — Biosenzorda pirazin molekulalarini o'ziga xos tarzda aniqlash uchun ishlatiladigan oqsil tuzilmasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/total-antioxidant-capacity.html\"&gt;Общая антиоксидантная способность&lt;/a&gt; — Organizmning oksidlovchi stressga qarshi turish qobiliyatini aks ettiruvchi ko'rsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aerobic-plate-count.html\"&gt;Общая обсемененность мезофиллами&lt;/a&gt; — Xomashyo ifloslanish darajasini aks ettiruvchi va issiqlik ishlovining samaradorligini baholash uchun ishlatiladigan mikrobiologik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/residual-organic-solvents.html\"&gt;Остаточные органические растворители&lt;/a&gt; — Kristallanish jarayonida ishlatiladigan kimyoviy birikmalar, ularning izlari yakuniy mahsulotda qoladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acute-gastric-mucosal-lesion.html\"&gt;Острое повреждение слизистой оболочки желудка&lt;/a&gt; — Etanolning haddan tashqari ko'p iste'mol qilinishi natijasida yuzaga keladigan va oshqozon shilliq qavatining to'siq funksiyasining…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hazard-ratio.html\"&gt;Отношение рисков&lt;/a&gt; — Ta'sir guruhida hodisaning yuz berish ehtimolining nazorat guruhidagi ehtimolga nisbatini aks ettiruvchi ko'rsatkich.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P&lt;/span&gt;&lt;/a&gt;P&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; — An'anaviy ravishda achitqilarda uchraydigan va immunomodulyatsion xususiyatlarga ega grammusbat gomoformentativ sut kislotasi bakteriyasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ipp.html\"&gt;PPI&lt;/a&gt; — Oshqozon hujayralarida kislota ishlab chiqaruvchi nasoslarni «o'chiradigan» dorilar bo'lib, ular oshqozon kislotaliligini pasaytiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-prisma.html\"&gt;PRISMA usuli&lt;/a&gt; — Tizimli sharhlar uchun hisobot standarti boʻlib, tadqiqotlarni tanlashda shaffoflikni taʼminlaydi va maʼlumotlarni tahlil qilishda…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pseudomonas-aeruginosa.html\"&gt;Pseudomonas aeruginosa&lt;/a&gt; — Mevalarning chirish o'choqlarini keltirib chiqaradigan va tadqiqotda gidrogelning antibakterial samaradorligini baholash uchun…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zh\"&gt;&lt;a href=\"reference/glossary.html#zh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ж&lt;/span&gt;&lt;/a&gt;Ж&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gelatin.html\"&gt;желатин&lt;/a&gt; — Gellanish qobiliyati, qovushqoqlikni nazorat qilish va sirt faolligi tufayli plyonkalar yaratish uchun oziq-ovqat sanoatida qo'llaniladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sea-bass-skin-gelatin.html\"&gt;Желатин из кожи сибаса&lt;/a&gt; — Yevropa dengiz olabug'asi terisini qayta ishlash chiqindilaridan olingan, yeyiladigan qadoqlash uchun asos sifatida ishlatiladigan yuqori…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/liquid-smoke.html\"&gt;жидкий дым&lt;/a&gt; — Biomassani piroliz qilish orqali olinadigan hamda antibakterial va antioksidant faollikka ega bo'lgan karbonillar va fenollarni o'z ichiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oilseed-cake.html\"&gt;Жмых&lt;/a&gt; — Yog'li ekinlar urug'laridan moy ajratib olingandan so'ng qoladigan qattiq qoldiq.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s1\"&gt;&lt;a href=\"reference/glossary.html#s1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S&lt;/span&gt;&lt;/a&gt;S&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scoby.html\"&gt;SCOBY&lt;/a&gt; — Kombucha fermentatsiyasini amalga oshiruvchi bakteriyalar va achitqi zamburug‘larining simbiotik hamjamiyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sinerezis.html\"&gt;Sineresis&lt;/a&gt; — Fermentlangan mahsulotning gel tuzilishidan zardobning o'z-o'zidan ajralib chiqish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smartcloth-odyssey.html\"&gt;SMARTCLOTH-Odyssey&lt;/a&gt; — Hamshira-pedagoglarga 1-toifa qandli diabeti bor o'smirlarni nutrisiya terapiyasi va uglevodlarni hisoblashga o'rgatishda yordam berish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sous-vide.html\"&gt;Sous-vide usuli&lt;/a&gt; — Mahsulotlarni aniq nazorat qilinadigan harorat va vaqtda vakuumli qadoqda pasterizatsiya qilishni nazarda tutuvchi issiqlik bilan ishlov…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-stomahera.html\"&gt;Stomacher usuli&lt;/a&gt; — Namunani steril paketda mexanik kuraklar yordamida maydalash bo‘lib, u mahsulot ichidagi mikroorganizmlarni hujayralarga zarar yetkazmasdan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/streptococcus-thermophilus-and-lactobacillus-delbrueckii.html\"&gt;Streptococcus thermophilus и Lactobacillus delbrueckii&lt;/a&gt; — O'simlik xomashyosini fermentatsiya qilish uchun ishlatiladigan sut kislotasi bakteriyalarining boshlang'ich madaniyati.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e\"&gt;&lt;a href=\"reference/glossary.html#e\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Э&lt;/span&gt;&lt;/a&gt;Э&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-extrusion.html\"&gt;Экструзия&lt;/a&gt; — Хлопья, снеки, текстурированный белок: как работает экструдер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eugenol.html\"&gt;Эвгенол&lt;/a&gt; — Qoplama uchun antioksidant faollikni ta'minlaydigan chinnigul efir moyining tarkibiy qismi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html\"&gt;экстракт кожуры грейпфрута&lt;/a&gt; — Bakteriyalar va yog'lar oksidlanishini bostirish uchun faol tabiiy konservant sifatida ishlatiladigan, fenol birikmalari va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/broccoli-sprout-extract.html\"&gt;Экстракт ростков брокколи&lt;/a&gt; — Brokkoli novdalaridan olingan biologik faol qo'shimcha, organizmning himoya mexanizmlarini faollashtirish uchun ishlatiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt; — Ekstruziya — bu oziq-ovqat tarkibiy qismlarining tuzilishini o'zgartirish uchun yuqori harorat va bosim ostida doimiy aralashtirish va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/electronic-nose.html\"&gt;электронный нос&lt;/a&gt; — Namunalarning uchuvchi xushbo'y moddalarining sensor profillarini qayd etish va taqqoslash uchun tadqiqotda qo'llaniladigan tahliliy asbob.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sds-page.html\"&gt;Электрофорез в полиакриламидном геле&lt;/a&gt; — Oqsil molekulalarining agregatsiyasini tahlil qilish uchun ishlatiladigan, oqsillarni molekulyar og'irligi bo'yicha ajratish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thyme-essential-oil.html\"&gt;Эфирное масло тимьяна&lt;/a&gt; — Go'shtdagi bakteriyalar o'sishini bostirish va oqsillar hamda lipidlarning oksidlanishini sekinlashtirish uchun plyonka tarkibiga…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p1\"&gt;&lt;a href=\"reference/glossary.html#p1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservation_heat.html\"&gt;Пастеризация и стерилизация&lt;/a&gt; — Тепловая обработка ради безопасности и срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-probiotics.html\"&gt;Пробиотики&lt;/a&gt; — Живые культуры и их выживание в продуктах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioactives.html\"&gt;Полифенолы и биоактивные вещества&lt;/a&gt; — Полифенолы, каротиноиды, флавоноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gpaef-peptide.html\"&gt;Пептид GPAEF&lt;/a&gt; — Oshqozonda rekombinant kollagenni parchalanishi natijasida hosil bo'ladigan va DNK G-kvadruplekslari bilan o'zaro ta'sir orqali…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peroxide-value.html\"&gt;перекисное число&lt;/a&gt; — Go'sht mahsulotlarining yangiligini baholash uchun ishlatiladigan yog'larning oksidlanish darajasi ko'rsatkichi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pyrazines.html\"&gt;Пиразины&lt;/a&gt; — Qovurilgan, yong'oq va non hidlarini hosil qiluvchi geterotsiklik organik birikmalar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;Площадь под гликемической кривой&lt;/a&gt; — Ovqatdan keyin qondagi glyukoza darajasining bazaviy darajadan og'ishining umumiy kattaligi va davomiyligini aks ettiruvchi ko'rsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/carbohydrate-counting.html\"&gt;подсчет углеводов&lt;/a&gt; — Har bir ovqatlanishda uglevodlar iste'molini hisoblashni hamda glikemik profil va jismoniy faollikni hisobga olgan holda qisqa ta'sirli…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenols.html\"&gt;Полифенолы&lt;/a&gt; — Olma tarkibidagi mevalarning erkin radikallarni zararsizlantirish qobiliyatini ta'minlovchi kimyoviy birikmalar guruhi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenol-oxidase.html\"&gt;Полифенолоксидаза&lt;/a&gt; — Fenolik birikmalarning oksidlanishini katalizlovchi va oqsillarni yumshoq sharoitda modifikatsiya qilish uchun ishlatiladigan ferment.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polosa-sore.html\"&gt;Полоса Соре&lt;/a&gt; — Gemoglobin spektridagi 407 nm to'lqin uzunligida kuzatiladigan intensiv yutilish chizig'i bo'lib, oqsil molekulasining yaxlitligini nazorat…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;порошок сушеной тыквы&lt;/a&gt; — Oqsillarning ikkilamchi tuzilishini o'zgartiruvchi va 1,1% dozada surimi gel to'rini mustahkamlovchi sabzavot qo'shimchasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postprandial-metabolic-response.html\"&gt;Постпрандиальный метаболический ответ&lt;/a&gt; — Ovqatlangandan keyin inson qonidagi glyukoza, insulin va triglitseridlar darajasining o'zgarishi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o1\"&gt;&lt;a href=\"reference/glossary.html#o1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O&lt;/span&gt;&lt;/a&gt;O&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Oziq-ovqat qo'shimchalari&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-veg_ferm.html\"&gt;Квашения и соленья&lt;/a&gt; — Кимчи, квашеная капуста, соленья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-koji_precision.html\"&gt;Коджи и прецизионная ферментация&lt;/a&gt; — Aspergillus, мисо, соевый соус; белки, выращенные микробами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cannabidiol.html\"&gt;Каннабидиол&lt;/a&gt; — Biologik faol qo'shimchalarning faol komponenti sifatida ishlatiladigan, Cannabis sativa L. biomassasidan olinadigan lipofil kristalli…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/intestinal-barrier.html\"&gt;Кишечный барьер&lt;/a&gt; — Ichak o'tkazuvchanligini nazorat qiluvchi va organizmni toksinlardan himoya qiluvchi epiteliy hujayralari va oqsillarining tizimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nova-classification.html\"&gt;Классификация NOVA&lt;/a&gt; — Oziq-ovqat mahsulotlarini sanoat tomonidan qayta ishlash darajasiga ko'ra tasniflash tizimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ges-1-cells.html\"&gt;Клетки GES-1&lt;/a&gt; — Shilliq qavat shikastlanishlarini o'rganish uchun model sifatida ishlatiladigan inson oshqozon epiteliy hujayralari liniyasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cultured-meat.html\"&gt;Клеточное мясо&lt;/a&gt; — Butun hayvon organizmidan foydalanmasdan, sun'iy muhitda mushak hujayralarini yetishtirish orqali olingan mahsulot.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha.html\"&gt;Комбуча&lt;/a&gt; — Shirin choydan tayyorlanadigan, bakteriyalar va achitqi zamburug‘larining simbiotik hamjamiyati faoliyati natijasida hosil bo‘ladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/short-chain-fatty-acids.html\"&gt;Короткоцепочечные жирные кислоты&lt;/a&gt; — Ichak mikrobiotasining hayotiy faoliyati natijasida hosil bo'ladigan va immun javobni modulyatsiya qilishda ishtirok etadigan metabolitlar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shrimp-meat-floss.html\"&gt;креветочный флосс&lt;/a&gt; — Qaynatilgan qisqichbaqa go'shtidan ziravorlash, quritish va maydalash orqali olingan suvsizlangan tolali mahsulot.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergens.html\"&gt;Аллергены&lt;/a&gt; — Выявление и снижение аллергенности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/active-packaging.html\"&gt;Активная упаковка&lt;/a&gt; — Tovuq filesining yangiligini saqlash muddatini uzaytirish uchun mo'ljallangan xitozan va efir moyiga asoslangan qadoqlash materiali.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sodium-alginate.html\"&gt;Альгинат натрия&lt;/a&gt; — Meva yuzasida himoya qiluvchi biologik parchalanadigan qoplama yaratish uchun asos sifatida ishlatiladigan tabiiy polisaxarid.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/antimicrobial-resistance.html\"&gt;Антибиотикорезистентность&lt;/a&gt; — Mikroorganizmlarning maxsus genlar mavjudligi tufayli antibiotiklar ta'sirida hayotiy qobiliyatini saqlab qolish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/antioxidant-potential.html\"&gt;Антиоксидантный потенциал&lt;/a&gt; — Moddaning erkin radikallarni zararsizlantirish qobiliyatining ABTS, DPPH va FRAP usullari bilan o'lchanadigan miqdoriy ko'rsatkichi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-absorption-spectrometry.html\"&gt;Атомно-абсорбционная спектрометрия&lt;/a&gt; — Lichinkalardagi qo'rg'oshin va kadmiy konsentratsiyasini aniqlash uchun ishlatiladigan miqdoriy kimyoviy tahlil usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aflatoxin-b1.html\"&gt;Афлатоксин B1&lt;/a&gt; — Zamburug'larning xavfli ikkilamchi metaboliti, IARC tomonidan 1-guruh kanserogeni deb tasniflangan.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z\"&gt;&lt;a href=\"reference/glossary.html#z\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;З&lt;/span&gt;&lt;/a&gt;З&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sourdough.html\"&gt;Закваска и хлеб&lt;/a&gt; — Дикие дрожжи и молочнокислые бактерии в тесте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-contaminants.html\"&gt;Загрязнители процесса&lt;/a&gt; — Акриламид, ПАУ, фуран: как образуются и как снизить.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha-based-sourdough.html\"&gt;Закваска на основе комбучи&lt;/a&gt; — Kombucha simbiotik hamjamiyatini don matritsasiga moslashtirish orqali olingan non pishirish uchun mikrobial inokulyat.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f\"&gt;&lt;a href=\"reference/glossary.html#f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F&lt;/span&gt;&lt;/a&gt;F&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-ferment.html\"&gt;Fermentatsiya&lt;/a&gt; — Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ftir-spectroscopy.html\"&gt;FTIR-спектроскопия&lt;/a&gt; — Amid chiziqlarini identifikatsiya qilish orqali jelatinning tarkibiy yaxlitligini tasdiqlash uchun ishlatiladigan tahliliy usul.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dairy_ferm.html\"&gt;Молочная ферментация&lt;/a&gt; — Йогурт, кефир, сыры: закваски и созревание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbial.html\"&gt;Микробная безопасность&lt;/a&gt; — Патогены, биоплёнки, обеззараживание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malondialdehyde.html\"&gt;Малоновый диальдегид&lt;/a&gt; — Lipidlarning chuqur oksidlanishi natijasida hosil bo'lgan zaharli mahsulot bo'lib, yog'li mahsulotlarning buzilish belgisi sifatida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mannitol.html\"&gt;Маннит&lt;/a&gt; — Kam kaloriyali va past glisemik indeksli shakar o'rnini bosuvchi sifatida ishlatiladigan olti atomli spirt.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scallop-mantle.html\"&gt;Мантия гребешка&lt;/a&gt; — Dengiz mahsulotlarini qayta ishlashning qo'shimcha mahsuloti, oziq-ovqat oqsilini olish uchun xomashyo sifatida ishlatiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensor-matrix.html\"&gt;Матрица сенсора&lt;/a&gt; — O'tkazuvchanlik va barqarorlikni ta'minlaydigan oltin nanozarralari, metall-organik karkaslar, uglerod nanotrubkalari va MXene'dan tashkil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meta-analysis.html\"&gt;Метаанализ&lt;/a&gt; — Bir nechta mustaqil tadqiqotlar natijalarini birlashtirib, umumlashtirilgan baho olish uchun ishlatiladigan statistik usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mpns.html\"&gt;Металл-полифенольные сети&lt;/a&gt; — Metall-polifenol tarmoqlari — metall ionlarining polifenollar bilan xelatlashuvi natijasida hosil bo'ladigan o'z-o'zidan yig'iladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/check-all-that-apply.html\"&gt;Метод CATA&lt;/a&gt; — Ishtirokchilar taklif etilgan deskriptorlar ro'yxatidan mahsulotning mos xususiyatlarini tanlaydigan sensorli tahlil usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dpph-assay.html\"&gt;Метод DPPH&lt;/a&gt; — Namunalarning antioksidant faolligini erkin radikallarni yutish qobiliyati orqali baholashning tahliliy usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;Метод бляшкообразующих единиц&lt;/a&gt; — Namunadagi hayotiy virus zarralari konsentratsiyasini miqdoriy aniqlash uchun standart laboratoriya usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kjeldahl-method.html\"&gt;Метод Кьельдаля&lt;/a&gt; — Oziq-ovqat mahsulotlaridagi xom protein miqdorini 6,25 qayta hisoblash koeffitsienti yordamida aniqlashning tahliliy usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mycotoxins.html\"&gt;Микотоксины&lt;/a&gt; — Zamburug'lar tomonidan ishlab chiqariladigan zaharli ikkilamchi metabolitlar, ular xomashyoning ozuqaviy qiymatini pasaytiradi va sog'liq…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microbial-load.html\"&gt;Микробная нагрузка&lt;/a&gt; — Mahsulotdagi bakteriyalar miqdorining ko'rsatkichi, gramm uchun koloniya hosil qiluvchi birliklarning logarifmik birliklarida o'lchanadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/c2c12-myoblasts.html\"&gt;Миобласты C2C12&lt;/a&gt; — Hujayrali go'sht tadqiqotlarida adgeziya va proliferatsiyani o'rganish uchun model sifatida ishlatiladigan sichqon mushak hujayralari…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mobile-genetic-elements.html\"&gt;Мобильные генетические элементы&lt;/a&gt; — Genom ichida harakatlanish yoki bakterial hujayralar o'rtasida o'tish qobiliyatiga ega bo'lgan, shu jumladan qarshilik genlarini o'z ichiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/technology-acceptance-model.html\"&gt;модель принятия технологий&lt;/a&gt; — Devis savolnomasiga asoslangan hamda foydalanuvchilar tomonidan qabul qilinadigan foydalilik va foydalanish qulayligini o'lchaydigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molecular-docking.html\"&gt;Молекулярный докинг&lt;/a&gt; — Polifenol molekulalarining nishon oqsillar bilan o'zaro ta'sirini modellashtirish va yaqinlik energiyasini baholash uchun kompyuter usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;Молочнокислые бактерии&lt;/a&gt; — O'simlik pishloqlarida fermentatsiyaning asosiy agentlari bo'lgan, uglevodlarni sut kislotasiga aylantiruvchi mikroorganizmlar guruhi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/motilin.html\"&gt;мотилин&lt;/a&gt; — Peristaltikani rag'batlantiruvchi va oshqozon-ichak trakti motorikasini tartibga soluvchi gormon.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimorbidity.html\"&gt;Мультиморбидность&lt;/a&gt; — Bir bemorda bir vaqtning o'zida ikki yoki undan ortiq surunkali kasalliklar mavjud bo'lgan holat.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f1\"&gt;&lt;a href=\"reference/glossary.html#f1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ф&lt;/span&gt;&lt;/a&gt;Ф&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-beverage_ferm.html\"&gt;Ферментированные напитки&lt;/a&gt; — Пиво, вино, комбуча, квас.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/disconfirmation.html\"&gt;Феномен дезавуирования&lt;/a&gt; — Mahsulot haqida qo'shimcha ma'lumot olgandan so'ng iste'molchining baholashining o'zgarishi psixologik effekti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enzymatic-modification.html\"&gt;Ферментативная модификация&lt;/a&gt; — Olma sharbati yordamida past pH darajasida kofe fenollarini oqsillar bilan bog'lash texnologik jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt; — Fermentatsiya — bu mikroorganizmlar yordamida o‘simlik xomashyosini biologik qayta ishlash jarayoni bo‘lib, u mahsulotning kimyoviy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/flexitarians.html\"&gt;Флекситарианцы&lt;/a&gt; — Go'sht iste'molini ongli ravishda kamaytiradigan va sut mahsulotlariga o'simlik asosidagi muqobillarni tez-tez tanlaydigan iste'molchilar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/photooxidation.html\"&gt;Фотоокисление&lt;/a&gt; — Yorug'lik va fotosensibilizatorlar ta'sirida yog' kislotalarining kimyoviy parchalanish jarayoni bo'lib, lipidlarning buzilishiga olib…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fructooligosaccharides.html\"&gt;Фруктоолигосахариды&lt;/a&gt; — Yakon ildizida mavjud bo'lgan uglevod birikmalari, ular fermentatsiya yo'li bilan mannitol olish uchun xomashyo bo'lib xizmat qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-constipation.html\"&gt;функциональный запор&lt;/a&gt; — Ichaklarning surunkali buzilishi bo'lib, kamdan-kam defekatsiya (haftasiga uch martadan kam), qattiq najas va to'liq bo'shalmaslik hissi…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gels.html\"&gt;Гели и желе&lt;/a&gt; — Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-chromatography-mass-spectrometry.html\"&gt;Газовая хроматография-масс-спектрометрия&lt;/a&gt; — Kekik efir moyi tarkibidagi 29 ta birikmani aniqlash uchun ishlatiladigan analitik usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-production.html\"&gt;газообразование&lt;/a&gt; — Mikroorganizmlar faoliyati natijasida yuzaga keladigan va qadoqning shishishiga olib keladigan oziq-ovqat mahsulotlarining buzilish nuqsoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hemoglobin.html\"&gt;Гемоглобин&lt;/a&gt; — Qon tarkibidagi temir saqlovchi oqsil bo'lib, yorug'lik ta'sirida lipidlarning oksidlanishini tezlashtiruvchi katalizator vazifasini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyaluronic-acid.html\"&gt;Гиалуроновая кислота&lt;/a&gt; — Urug' po'stlog'i tuzilishini taqlid qilish uchun nanozarrachalarning tashqi himoya qatlami sifatida ishlatiladigan saxarid.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/giant-freshwater-prawn.html\"&gt;гигантская пресноводная креветка&lt;/a&gt; — Yuqori oqsilli oziq-ovqat mahsulotlarini ishlab chiqarish uchun xomashyo sifatida ishlatiladigan chuchuk suv qisqichbaqasimonlari turi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html\"&gt;гидрогель CTS-ZnO&amp;amp;CA&lt;/a&gt; — Mevalarni buzilishdan himoya qilish uchun antibakterial va antioksidant xususiyatlarga ega bo'lgan xitozan, rux oksidi nanozarrachalari va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glycogen-hepatopathy.html\"&gt;Гликогеновая гепатопатия&lt;/a&gt; — Jigarda glikogenning ortiqcha to'planishi bilan tavsiflanadigan, yuqori uglevodli ratsion tufayli yuzaga keladigan patologik holat.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glucose-homeostasis.html\"&gt;Глюкозный гомеостаз&lt;/a&gt; — Uglevodli yuklama paytida organizmning ichki muhit barqarorligini saqlash jarayoni.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"y\"&gt;&lt;a href=\"reference/glossary.html#y\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Y&lt;/span&gt;&lt;/a&gt;Y&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-newfood.html\"&gt;Yangi taomlar&lt;/a&gt; — Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n\"&gt;&lt;a href=\"reference/glossary.html#n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Н&lt;/span&gt;&lt;/a&gt;Н&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observational-cross-sectional-study.html\"&gt;Наблюдательное кросс-секционное исследование&lt;/a&gt; — Sun'iy intellekt va shifokorlar guruhlari ish natijalarini bir vaqtning o'zida taqqoslashga asoslangan vositalar samaradorligini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc-oxide-nanoparticles.html\"&gt;наночастицы оксида цинка&lt;/a&gt; — Bakteriyalar membranalarini va biofilmlarni yo'q qilish uchun reaktiv kislorod turlarini hosil qiluvchi va rux ionlarini ajratib…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nanoemulsion.html\"&gt;наноэмульсия&lt;/a&gt; — Oziq-ovqat matritsalarida mikroblarga qarshi faollikni oshirish va bioaktiv komponentlarni taqsimlash uchun qo'llaniladigan, tomchilari…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-steroidal-anti-inflammatory-drugs.html\"&gt;Нестероидные противовоспалительные препараты&lt;/a&gt; — Tsiklooksigenaza fermentlarini bostirish orqali oshqozon shikastlanishiga olib keladigan dori vositalari.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3\"&gt;&lt;a href=\"reference/glossary.html#3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3&lt;/span&gt;&lt;/a&gt;3&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"x\"&gt;&lt;a href=\"reference/glossary.html#x\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;X&lt;/span&gt;&lt;/a&gt;X&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-safety.html\"&gt;Xavfsizlik va saqlash&lt;/a&gt; — Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-packaging.html\"&gt;Упаковка и миграция&lt;/a&gt; — Пластик, биоразлагаемые плёнки, миграция веществ в еду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-processed-foods.html\"&gt;Ультраобработанные пищевые продукты&lt;/a&gt; — O‘ta qayta ishlangan oziq-ovqat mahsulotlari (UPF) — bu tarkibida tuz, shakar, gidrogenlangan yog‘lar va ko‘p komponentli texnologik…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n1\"&gt;&lt;a href=\"reference/glossary.html#n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;N&lt;/span&gt;&lt;/a&gt;N&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Nutrientlar&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nlrp3-inflammasome.html\"&gt;NLRP3-инфламмасома&lt;/a&gt; — Organizmda yallig'lanish jarayonlarini qo'zg'atuvchi oqsil kompleksi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"5\"&gt;&lt;a href=\"reference/glossary.html#5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5&lt;/span&gt;&lt;/a&gt;5&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/5-caffeoylquinic-acid.html\"&gt;5-кофеилхинная кислота&lt;/a&gt; — Kofe donalarining asosiy fenolik komponenti bo'lib, o-xinonlarga oksidlangandan so'ng oqsillar bilan bog'lanish xususiyatiga ega.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a1\"&gt;&lt;a href=\"reference/glossary.html#a1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A&lt;/span&gt;&lt;/a&gt;A&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/amp-activated-protein-kinase.html\"&gt;AMPK&lt;/a&gt; — Hujayralardagi energiya almashinuvini tartibga soluvchi ferment.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/bacillus-licheniformis-qjl3.html\"&gt;Bacillus licheniformis QJL3&lt;/a&gt; — Vasabi sousi qadoqlarining shishishi va gaz hosil bo'lishining asosiy manbai sifatida aniqlangan bakteriya shtammi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-backslopping.html\"&gt;Backslopping» (qayta ishlash) usuli&lt;/a&gt; — Xamir turshatishni saqlashning anʼanaviy usuli boʻlib, unda yetilgan xamirning bir qismi yangi un va suvni fermentatsiyalash uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biopolimery.html\"&gt;Biopolimerlar&lt;/a&gt; — Biopolimerlar — bu oziq-ovqat mahsulotlarini tashqi muhitdan himoya qiluvchi ekologik toza qadoqlash uchun ishlatiladigan tabiiy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/krasochnyy-painty-privkus.html\"&gt;Bo'yoqsimon» (painty) ta'm&lt;/a&gt; — Yog'larning oksidlanishi natijasida kelib chiqadigan, moyli bo'yoq hidini eslatuvchi o'ziga xos ta'm nuqsonidir.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/c2c12.html\"&gt;C2C12&lt;/a&gt; — O'simlik qoplamalaridagi hujayralarning yopishishi va ko'payishini baholash uchun tajribalarda ishlatiladigan sichqon mioblastlari liniyasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/caco-2-cells.html\"&gt;Caco-2&lt;/a&gt; — In vitro ichak epiteliysi modeli sifatida ishlatiladigan inson yo'g'on ichak saratoni hujayralari liniyasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/consort.html\"&gt;CONSORT&lt;/a&gt; — Randomizatsiyalangan sinovlar uchun hisobot standarti boʻlib, tadqiqot dizaynining shaffofligini taʼminlaydi va xatoliklarni…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D&lt;/span&gt;&lt;/a&gt;D&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcfh-da.html\"&gt;DCFH-DA&lt;/a&gt; — Hujayra tadqiqotlarida kislorodning reaktiv shakllari (KRF) darajasini aniqlash va miqdoriy o'lchash uchun ishlatiladigan lyuminessent zond.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/test-s-trubkami-darema.html\"&gt;Durham naychalari testi&lt;/a&gt; — Mikrobiologiyada gaz hosil qiluvchi bakteriyalarni aniqlash uchun qo'llaniladigan laboratoriya usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g1\"&gt;&lt;a href=\"reference/glossary.html#g1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G&lt;/span&gt;&lt;/a&gt;G&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/g-quadruplexes.html\"&gt;G-квадруплексы&lt;/a&gt; — Genning promotor sohasidagi DNKning ikkilamchi tuzilmasi bo'lib, u regulyator molekulalar bilan o'zaro ta'sir orqali transkripsiyani…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gallic-acid-equivalent.html\"&gt;GAE&lt;/a&gt; — Namunadagi fenolik birikmalar miqdorini gall kislotasi birliklarida o‘lchash usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-centered-design.html\"&gt;HCD&lt;/a&gt; — Foydalanuvchiga chuqur empatiya, uning ishtirokidagi uzluksiz iteratsiya va real sharoitlarga moslashgan funksional dizaynga asoslangan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hepg2.html\"&gt;HepG2&lt;/a&gt; — Ekstraktlarning antioksidant himoyasini baholash uchun model sifatida ishlatiladigan inson gepatokarsinomasi hujayralari madaniyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zhiznesposobnost-kletok.html\"&gt;Hujayra hayotiyligi&lt;/a&gt; — Shikastlovchi omil ta'siridan keyin madaniyatdagi «tirik» hujayralar foizi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l1\"&gt;&lt;a href=\"reference/glossary.html#l1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L&lt;/span&gt;&lt;/a&gt;L&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/lactococcus-lactis-subsp-cremoris-d2022.html\"&gt;Lactococcus lactis subsp. cremoris D2022&lt;/a&gt; — Douzhierdan ajratib olingan, A gripp virusiga qarshi probiotik faollikka ega bo'lgan gram-musbat sut kislotasi bakteriyalari shtammi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt; — Fruktoza va fruktooligosaxaridlarni yumshoq harorat sharoitida samarali tarzda mannitolga aylantira oladigan mikroorganizmlar.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/maldi-tof-mass-spectrometry.html\"&gt;MALDI-TOF масс-спектрометрия&lt;/a&gt; — Ionlashtirilgan molekulalarning massa-spektrometrik tahliliga asoslangan mikroorganizmlarni identifikatsiya qilishning analitik usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"q\"&gt;&lt;a href=\"reference/glossary.html#q\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q&lt;/span&gt;&lt;/a&gt;Q&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/side-streams.html\"&gt;Qo‘shimcha mahsulotlar&lt;/a&gt; — File ishlab chiqarilgandan keyin qoladigan baliq qismlari (teri, suyak, tanga). Ularni jelatinga qayta ishlash chiqindilarni qimmatli…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r1\"&gt;&lt;a href=\"reference/glossary.html#r1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;R&lt;/span&gt;&lt;/a&gt;R&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgd-motifs.html\"&gt;RGD-мотивы&lt;/a&gt; — Hujayralar yuzasidagi integrinlar bilan o'zaro ta'sir qiluvchi va ularning matritsaga birikishini ta'minlovchi o'ziga xos aminokislota…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u1\"&gt;&lt;a href=\"reference/glossary.html#u1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U&lt;/span&gt;&lt;/a&gt;U&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultrazvukovaya-ekstraktsiya.html\"&gt;Ultratovushli ekstraksiya&lt;/a&gt; — Ultratovush to'lqinlari yordamida o'simlik xomashyosidan biologik faol moddalarni ajratib olish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/v-dannom-issledovanii-ispolzuetsya-model-caco-2.html\"&gt;Ushbu tadqiqotda Caco-2 modeli&lt;/a&gt; — Ichak epiteliyasini taqlid qiluvchi monolayer hosil qiluvchi inson yoʻgʻon ichak adenokarsinomasi hujayra liniyasi qoʻllaniladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v1\"&gt;&lt;a href=\"reference/glossary.html#v1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;V&lt;/span&gt;&lt;/a&gt;V&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/vfd.html\"&gt;VFD&lt;/a&gt; — Oziq-ovqat mahsulotlarini ozuqaviy moddalarni saqlab qolish uchun past harorat va vakuumda namlikni olib tashlash orqali konservatsiya…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"w\"&gt;&lt;a href=\"reference/glossary.html#w\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;W&lt;/span&gt;&lt;/a&gt;W&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/w-w.html\"&gt;w/w&lt;/a&gt; — Massa ulushi, bir komponent massasining boshqasiga nisbati. Bu holda 1:2 nisbati 1 kg teriga 2 kg muz to‘g‘ri kelishini anglatadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d1\"&gt;&lt;a href=\"reference/glossary.html#d1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Δ&lt;/span&gt;&lt;/a&gt;Δ&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-ct.html\"&gt;ΔΔCt usuli&lt;/a&gt; — Gen ekspressiyasini miqdoriy solishtirishning standart usuli boʻlib, nazoratga nisbatan maqsadli gen mRNK miqdori necha barobar…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b1\"&gt;&lt;a href=\"reference/glossary.html#b1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Б&lt;/span&gt;&lt;/a&gt;Б&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/hurdle-technology.html\"&gt;барьерный подход&lt;/a&gt; — Sintetik konservantlarsiz mikroorganizmlarni bostirish va saqlash muddatini uzaytirish uchun bir nechta ta'sir omillarini birlashtirish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tight-junction-proteins.html\"&gt;Белки плотных контактов&lt;/a&gt; — Epiteliyning apikal va bazolateral tomonlari o'rtasidagi moddalar transportini tartibga soluvchi hujayralararo birikmalardagi molekulyar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;бета-глицерофосфат&lt;/a&gt; — Faol komponentlarning bir tekis taqsimlanishiga ega g'ovakli gidrogel plyonkasini shakllantirish uchun 50% li eritma shaklida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biozate1.html\"&gt;БиоЗейт1&lt;/a&gt; — Kofe fenollari bilan bog'lanish uchun substrat sifatida ishlatiladigan sut peptidi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biosensor.html\"&gt;Биосенсор&lt;/a&gt; — Pirazinlar konsentratsiyasini aniqlash uchun inson burni ishini taqlid qiluvchi tahliliy qurilma.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/micropterus-salmoides.html\"&gt;Большеротый окунь&lt;/a&gt; — Ozuqa tarkibining metabolizmga ta'sirini o'rganish uchun biologik model sifatida ishlatiladigan baliq turi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bristol-stool-form-scale.html\"&gt;Бристольская шкала формы кала&lt;/a&gt; — Najasning shakli va konsistensiyasini baholash uchun tibbiy shkala bo'lib, unda 1–2 qiymatlari haddan tashqari qattiq massaga to'g'ri…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d2\"&gt;&lt;a href=\"reference/glossary.html#d2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/twin-screw-extruder.html\"&gt;Двухшнековый экструдер&lt;/a&gt; — Oziq-ovqat xomashyosini termomexanik qayta ishlash uchun mo'ljallangan, belgilangan bosim va harorat parametrlarini ta'minlaydigan asbob.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/douzhier.html\"&gt;Доужир&lt;/a&gt; — Moshdan tayyorlanadigan an'anaviy xitoy fermentlangan mahsuloti, kraxmal sutining o'z-o'zidan fermentatsiyasi orqali olinadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e1\"&gt;&lt;a href=\"reference/glossary.html#e1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Е&lt;/span&gt;&lt;/a&gt;Е&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/european-sea-bass.html\"&gt;Европейский сибас&lt;/a&gt; — O'rta er dengizi mintaqasida akvakulturaning asosiy ob'ekti va jelatin ishlab chiqarish uchun xom ashyo manbai bo'lgan dengiz balig'i turi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/isothiocyanates.html\"&gt;изотиоцианаты&lt;/a&gt; — Glyukozinolatlarning fermentativ gidrolizi natijasida hosil bo'ladigan va vasabi sousiga o'ziga xos xushbo'ylik hamda o'tkirlik beruvchi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;ИК-спектроскопия с преобразованием Фурье&lt;/a&gt; — Oshqovoq kukuni ta'sirida oqsillarning ikkilamchi tuzilishidagi o'zgarishlarni aniqlash uchun qo'llanilgan analitik usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hunter-whiteness-index.html\"&gt;Индекс белизны Хантера&lt;/a&gt; — L* va b* kolorimetrik indekslari asosida hisoblangan namunaning oqlik darajasi ko'rsatkichi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ulcer-index.html\"&gt;Индекс язвенных повреждений&lt;/a&gt; — Oshqozon shilliq qavatining shikastlanish darajasini ko'rsatadigan ballarda o'lchanadigan ko'rsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/artificial-intelligence.html\"&gt;Искусственный интеллект&lt;/a&gt; — Dasturiy tizimlar, ma'lumotlarni tahlil qilish va matnli so'rovlar asosida parhez bo'yicha tavsiyalar berish qobiliyatiga ega.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elisa.html\"&gt;ИФА&lt;/a&gt; — Xomashyoda mikotoksinlarni aniqlash uchun qo'llaniladigan laboratoriya skrining usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t1\"&gt;&lt;a href=\"reference/glossary.html#t1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/gel-hardness.html\"&gt;твердость геля&lt;/a&gt; — Surimining mexanik mustahkamlik ko'rsatkichi, 1,1% oshqovoq kukuni qo'shilganda 313,69 ± 2,54 g qiymatiga yetadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-polymerization.html\"&gt;Термическая полимеризация&lt;/a&gt; — Termik polimerizatsiya — kapsulalash uchun asos sifatida ishlatiladigan barqaror mikrosferalarni shakllantirish uchun oqsil izolyatini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-stability.html\"&gt;Термостабильность&lt;/a&gt; — Oqsil mahsulotining yuqori harorat ta'sirida o'z xususiyatlarini saqlab qolish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thiobarbituric-acid-reactive-substances.html\"&gt;тиобарбитуровое число&lt;/a&gt; — Lipidlarning oksidlanish buzilish intensivligini aks ettiruvchi malon dialdegid miqdori metri.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transepithelial-electrical-resistance.html\"&gt;Трансэпителиальное электрическое сопротивление&lt;/a&gt; — Hujayra monolayining yaxlitligi va to'siq funksiyasining ko'rsatkichi, Ohm·sm² da o'lchanadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tricolor-quinoa.html\"&gt;Трехцветное киноа&lt;/a&gt; — Oshqozon shilliq qavatini himoya qilish uchun ratsionga qo'shiladigan oq, qizil va qora kinva donalari aralashmasi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h1\"&gt;&lt;a href=\"reference/glossary.html#h1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Х&lt;/span&gt;&lt;/a&gt;Х&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/chitosan.html\"&gt;Хитозан&lt;/a&gt; — Alginat va pektin bilan o'zaro ta'sirlashganda himoya plyonkasi tuzilishini zichlashtiradigan kationli polisaxarid.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chlorogenic-acid.html\"&gt;хлорогеновая кислота&lt;/a&gt; — Meva yuzasidagi erkin radikallarni neytrallash va mikroblarga qarshi ta'sirni uzaytirish maqsadida ruxni xelatlashtirish uchun gidrogel…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c1\"&gt;&lt;a href=\"reference/glossary.html#c1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ц&lt;/span&gt;&lt;/a&gt;Ц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/cielab-color-space.html\"&gt;Цветовые индексы CIELab&lt;/a&gt; — Mahsulotning optik xususiyatlarini yorqinlik (L*) va rang o'qlari (a* va b*) parametrlari orqali miqdoriy baholash tizimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc.html\"&gt;Цинк&lt;/a&gt; — Uglevodlar almashinuvini tartibga soluvchi va kraxmal ko'pligida glikoliz fermentlari faolligini tiklovchi mikroelement.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cytokine-storm.html\"&gt;Цитокиновый шторм&lt;/a&gt; — Organizm to'qimalariga zarar yetkazadigan yallig'lanishga qarshi sitokinlarning nazoratsiz ajralib chiqishi bilan tavsiflanadigan ortiqcha…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sh\"&gt;&lt;a href=\"reference/glossary.html#sh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ш&lt;/span&gt;&lt;/a&gt;Ш&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/pin-mill.html\"&gt;Штифтовая мельница&lt;/a&gt; — Ekstrudatni belgilangan zarracha hajmiga ega kukun holiga keltirish uchun maydalash vositasi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sh1\"&gt;&lt;a href=\"reference/glossary.html#sh1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Щ&lt;/span&gt;&lt;/a&gt;Щ&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/alkaline-extraction.html\"&gt;Щелочная экстракция&lt;/a&gt; — Muhitning pH darajasini o'zgartirish orqali xomashyodan oqsil ajratib olish texnologik jarayoni.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ya\"&gt;&lt;a href=\"reference/glossary.html#ya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Я&lt;/span&gt;&lt;/a&gt;Я&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/malic-acid.html\"&gt;Яблочная кислота&lt;/a&gt; — Olma eti tarkibidagi nordon ta'mning asosiy komponenti bo'lgan organik kislota.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"228 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Lug'at A–Z","description":"228 ta tushuncha","vcsPath":"reference/glossary.md"},"headings":[{"title":"T","href":"reference/glossary.html#t","level":2},{"title":"Р","href":"reference/glossary.html#r","level":2},{"title":"С","href":"reference/glossary.html#s","level":2},{"title":"Л","href":"reference/glossary.html#l","level":2},{"title":"В","href":"reference/glossary.html#v","level":2},{"title":"О","href":"reference/glossary.html#o","level":2},{"title":"P","href":"reference/glossary.html#p","level":2},{"title":"Ж","href":"reference/glossary.html#zh","level":2},{"title":"S","href":"reference/glossary.html#s1","level":2},{"title":"Э","href":"reference/glossary.html#e","level":2},{"title":"П","href":"reference/glossary.html#p1","level":2},{"title":"O","href":"reference/glossary.html#o1","level":2},{"title":"К","href":"reference/glossary.html#k","level":2},{"title":"А","href":"reference/glossary.html#a","level":2},{"title":"З","href":"reference/glossary.html#z","level":2},{"title":"F","href":"reference/glossary.html#f","level":2},{"title":"М","href":"reference/glossary.html#m","level":2},{"title":"Ф","href":"reference/glossary.html#f1","level":2},{"title":"Г","href":"reference/glossary.html#g","level":2},{"title":"Y","href":"reference/glossary.html#y","level":2},{"title":"Н","href":"reference/glossary.html#n","level":2},{"title":"3","href":"reference/glossary.html#3","level":2},{"title":"X","href":"reference/glossary.html#x","level":2},{"title":"У","href":"reference/glossary.html#u","level":2},{"title":"N","href":"reference/glossary.html#n1","level":2},{"title":"5","href":"reference/glossary.html#5","level":2},{"title":"A","href":"reference/glossary.html#a1","level":2},{"title":"B","href":"reference/glossary.html#b","level":2},{"title":"C","href":"reference/glossary.html#c","level":2},{"tit
