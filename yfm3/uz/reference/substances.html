        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;44 ta tushuncha&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/5-caffeoylquinic-acid.html\"&gt;5-кофеилхинная кислота&lt;/a&gt; — Kofe donalarining asosiy fenolik komponenti bo'lib, o-xinonlarga oksidlangandan so'ng oqsillar bilan bog'lanish xususiyatiga ega.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgd-motifs.html\"&gt;RGD-мотивы&lt;/a&gt; — Hujayralar yuzasidagi integrinlar bilan o'zaro ta'sir qiluvchi va ularning matritsaga birikishini ta'minlovchi o'ziga xos aminokislota…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sodium-alginate.html\"&gt;Альгинат натрия&lt;/a&gt; — Meva yuzasida himoya qiluvchi biologik parchalanadigan qoplama yaratish uchun asos sifatida ishlatiladigan tabiiy polisaxarid.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aflatoxin-b1.html\"&gt;Афлатоксин B1&lt;/a&gt; — Zamburug'larning xavfli ikkilamchi metaboliti, IARC tomonidan 1-guruh kanserogeni deb tasniflangan.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;бета-глицерофосфат&lt;/a&gt; — Faol komponentlarning bir tekis taqsimlanishiga ega g'ovakli gidrogel plyonkasini shakllantirish uchun 50% li eritma shaklida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biozate1.html\"&gt;БиоЗейт1&lt;/a&gt; — Kofe fenollari bilan bog'lanish uchun substrat sifatida ishlatiladigan sut peptidi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hemoglobin.html\"&gt;Гемоглобин&lt;/a&gt; — Qon tarkibidagi temir saqlovchi oqsil bo'lib, yorug'lik ta'sirida lipidlarning oksidlanishini tezlashtiruvchi katalizator vazifasini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyaluronic-acid.html\"&gt;Гиалуроновая кислота&lt;/a&gt; — Urug' po'stlog'i tuzilishini taqlid qilish uchun nanozarrachalarning tashqi himoya qatlami sifatida ishlatiladigan saxarid.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gelatin.html\"&gt;желатин&lt;/a&gt; — Gellanish qobiliyati, qovushqoqlikni nazorat qilish va sirt faolligi tufayli plyonkalar yaratish uchun oziq-ovqat sanoatida qo'llaniladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sea-bass-skin-gelatin.html\"&gt;Желатин из кожи сибаса&lt;/a&gt; — Yevropa dengiz olabug'asi terisini qayta ishlash chiqindilaridan olingan, yeyiladigan qadoqlash uchun asos sifatida ishlatiladigan yuqori…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/liquid-smoke.html\"&gt;жидкий дым&lt;/a&gt; — Biomassani piroliz qilish orqali olinadigan hamda antibakterial va antioksidant faollikka ega bo'lgan karbonillar va fenollarni o'z ichiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/isothiocyanates.html\"&gt;изотиоцианаты&lt;/a&gt; — Glyukozinolatlarning fermentativ gidrolizi natijasida hosil bo'ladigan va vasabi sousiga o'ziga xos xushbo'ylik hamda o'tkirlik beruvchi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cannabidiol.html\"&gt;Каннабидиол&lt;/a&gt; — Biologik faol qo'shimchalarning faol komponenti sifatida ishlatiladigan, Cannabis sativa L. biomassasidan olinadigan lipofil kristalli…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha.html\"&gt;Комбуча&lt;/a&gt; — Shirin choydan tayyorlanadigan, bakteriyalar va achitqi zamburug‘larining simbiotik hamjamiyati faoliyati natijasida hosil bo‘ladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/short-chain-fatty-acids.html\"&gt;Короткоцепочечные жирные кислоты&lt;/a&gt; — Ichak mikrobiotasining hayotiy faoliyati natijasida hosil bo'ladigan va immun javobni modulyatsiya qilishda ishtirok etadigan metabolitlar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malondialdehyde.html\"&gt;Малоновый диальдегид&lt;/a&gt; — Lipidlarning chuqur oksidlanishi natijasida hosil bo'lgan zaharli mahsulot bo'lib, yog'li mahsulotlarning buzilish belgisi sifatida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mannitol.html\"&gt;Маннит&lt;/a&gt; — Kam kaloriyali va past glisemik indeksli shakar o'rnini bosuvchi sifatida ishlatiladigan olti atomli spirt.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mycotoxins.html\"&gt;Микотоксины&lt;/a&gt; — Zamburug'lar tomonidan ishlab chiqariladigan zaharli ikkilamchi metabolitlar, ular xomashyoning ozuqaviy qiymatini pasaytiradi va sog'liq…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mobile-genetic-elements.html\"&gt;Мобильные генетические элементы&lt;/a&gt; — Genom ichida harakatlanish yoki bakterial hujayralar o'rtasida o'tish qobiliyatiga ega bo'lgan, shu jumladan qarshilik genlarini o'z ichiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/motilin.html\"&gt;мотилин&lt;/a&gt; — Peristaltikani rag'batlantiruvchi va oshqozon-ichak trakti motorikasini tartibga soluvchi gormon.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc-oxide-nanoparticles.html\"&gt;наночастицы оксида цинка&lt;/a&gt; — Bakteriyalar membranalarini va biofilmlarni yo'q qilish uchun reaktiv kislorod turlarini hosil qiluvchi va rux ionlarini ajratib…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-steroidal-anti-inflammatory-drugs.html\"&gt;Нестероидные противовоспалительные препараты&lt;/a&gt; — Tsiklooksigenaza fermentlarini bostirish orqali oshqozon shikastlanishiga olib keladigan dori vositalari.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/olfactory-receptor-or5k1.html\"&gt;Обонятельный рецептор OR5K1&lt;/a&gt; — Biosenzorda pirazin molekulalarini o'ziga xos tarzda aniqlash uchun ishlatiladigan oqsil tuzilmasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/residual-organic-solvents.html\"&gt;Остаточные органические растворители&lt;/a&gt; — Kristallanish jarayonida ishlatiladigan kimyoviy birikmalar, ularning izlari yakuniy mahsulotda qoladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gpaef-peptide.html\"&gt;Пептид GPAEF&lt;/a&gt; — Oshqozonda rekombinant kollagenni parchalanishi natijasida hosil bo'ladigan va DNK G-kvadruplekslari bilan o'zaro ta'sir orqali…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pyrazines.html\"&gt;Пиразины&lt;/a&gt; — Qovurilgan, yong'oq va non hidlarini hosil qiluvchi geterotsiklik organik birikmalar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenols.html\"&gt;Полифенолы&lt;/a&gt; — Olma tarkibidagi mevalarning erkin radikallarni zararsizlantirish qobiliyatini ta'minlovchi kimyoviy birikmalar guruhi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenol-oxidase.html\"&gt;Полифенолоксидаза&lt;/a&gt; — Fenolik birikmalarning oksidlanishini katalizlovchi va oqsillarni yumshoq sharoitda modifikatsiya qilish uchun ishlatiladigan ferment.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;порошок сушеной тыквы&lt;/a&gt; — Oqsillarning ikkilamchi tuzilishini o'zgartiruvchi va 1,1% dozada surimi gel to'rini mustahkamlovchi sabzavot qo'shimchasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recombinant-human-type-iii-collagen.html\"&gt;Рекомбинантный человеческий коллаген III типа&lt;/a&gt; — Oshqozon shilliq qavatini himoya qilish uchun biomaterial sifatida ishlatiladigan biotexnologik yo'l bilan olingan hujayradan tashqari…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/somatostatin.html\"&gt;соматостатин&lt;/a&gt; — Ichakning motor faolligini susaytiruvchi zardob regulyator omili.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/potassium-sorbate.html\"&gt;сорбат калия&lt;/a&gt; — Vasabi sousida gaz hosil qiluvchi bakteriyalarning ko'payishini to'xtatish uchun ishlatiladigan oziq-ovqat konservanti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wasabi-sauce.html\"&gt;соус васаби&lt;/a&gt; — Asosan yerqalampir ildizidan (Armoracia rusticana) tayyorlanadigan, izotiosiyanatlar hisobiga o'tkir ta'm va mikroblarga qarshi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whey-protein-isolate.html\"&gt;Сывороточный изолят&lt;/a&gt; — Zardob oqsili izolyati — zardob oqsilining yuqori darajada tozalangan shakli bo'lib, tarkibida muhim aminokislotalar mavjud.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tricolor-quinoa.html\"&gt;Трехцветное киноа&lt;/a&gt; — Oshqozon shilliq qavatini himoya qilish uchun ratsionga qo'shiladigan oq, qizil va qora kinva donalari aralashmasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fructooligosaccharides.html\"&gt;Фруктоолигосахариды&lt;/a&gt; — Yakon ildizida mavjud bo'lgan uglevod birikmalari, ular fermentatsiya yo'li bilan mannitol olish uchun xomashyo bo'lib xizmat qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chitosan.html\"&gt;Хитозан&lt;/a&gt; — Alginat va pektin bilan o'zaro ta'sirlashganda himoya plyonkasi tuzilishini zichlashtiradigan kationli polisaxarid.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chlorogenic-acid.html\"&gt;хлорогеновая кислота&lt;/a&gt; — Meva yuzasidagi erkin radikallarni neytrallash va mikroblarga qarshi ta'sirni uzaytirish maqsadida ruxni xelatlashtirish uchun gidrogel…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc.html\"&gt;Цинк&lt;/a&gt; — Uglevodlar almashinuvini tartibga soluvchi va kraxmal ko'pligida glikoliz fermentlari faolligini tiklovchi mikroelement.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eugenol.html\"&gt;Эвгенол&lt;/a&gt; — Qoplama uchun antioksidant faollikni ta'minlaydigan chinnigul efir moyining tarkibiy qismi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html\"&gt;экстракт кожуры грейпфрута&lt;/a&gt; — Bakteriyalar va yog'lar oksidlanishini bostirish uchun faol tabiiy konservant sifatida ishlatiladigan, fenol birikmalari va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/broccoli-sprout-extract.html\"&gt;Экстракт ростков брокколи&lt;/a&gt; — Brokkoli novdalaridan olingan biologik faol qo'shimcha, organizmning himoya mexanizmlarini faollashtirish uchun ishlatiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thyme-essential-oil.html\"&gt;Эфирное масло тимьяна&lt;/a&gt; — Go'shtdagi bakteriyalar o'sishini bostirish va oqsillar hamda lipidlarning oksidlanishini sekinlashtirish uchun plyonka tarkibiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malic-acid.html\"&gt;Яблочная кислота&lt;/a&gt; — Olma eti tarkibidagi nordon ta'mning asosiy komponenti bo'lgan organik kislota.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"44 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Moddalar","description":"44 ta tushuncha","vcsPath":"reference/substances.md"},"headings":[],"title":"Moddalar"},"router":{"pathname":"reference/substances","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
