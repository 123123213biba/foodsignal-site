        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;главный научный симпозиум по химии вкуса и аромата&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-weurman.jpg\" alt=\"Weurman Flavour Research Symposium\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;главный научный симпозиум по химии вкуса и аромата&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;сборники трудов, аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество специалистов по химии вкуса и аромата.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Регулярно, периодичность определяется оргкомитетом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Научная конференция с публикацией сборников трудов и аннотаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Официальный сайт симпозиума обновляется перед каждым мероприятием.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;Weurman Flavour Research Symposium — bu oziq-ovqat mahsulotlarining ta'mi va hidi kimyosini o'rganishga bag'ishlangan xalqaro ilmiy konferensiya. Tadbir kimyogarlar, biologlar va oziq-ovqat texnologlari o'rtasida ma'lumot almashish uchun maydon hisoblanadi. Simpoziumning asosiy maqsadi ta'm va hidni idrok etishning molekulyar mexanizmlari haqidagi bilimlarni tizimlashtirish hamda ularni tahlil qilish usullarini muhokama qilishdir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Simpozium gaz xromatografiyasi va aromatik birikmalar tahlili sohasidagi kashshof Kornelis Vurman (Cornelis Weurman) sharafiga nomlangan. Konferensiya muntazam ravishda o'tkazilib, oziq-ovqat kimyosining fundamental va amaliy jihatlarini muhokama qilish uchun yetakchi ekspertlarni birlashtiradi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Simpozium ishi sensorli tahlil va oziq-ovqatning kimyoviy tarkibi bilan bog'liq keng ko'lamli mavzularni qamrab oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Uchuvchi birikmalarni aniqlash: hidni tahlil qilish usullari, jumladan, retseptorlarga asoslangan «elektron burun» va biosensorlardan foydalanish.&lt;/li&gt;\n&lt;li&gt;Texnologik jarayonlar: ishlov berish usullarining (sublimatsiya, termik ishlov berish, fermentatsiya) mahsulotning kimyoviy profiliga ta'siri.&lt;/li&gt;\n&lt;li&gt;Komponentlarning o'zaro ta'siri: oqsillar, yog'lar va uglevodlarning ta'm sezgilarini (masalan, umami yoki shirinlik) shakllantirishi.&lt;/li&gt;\n&lt;li&gt;Biotexnologiyalar: mikrobiologik sintez yordamida oziq-ovqat qo'shimchalari va shakar o'rnini bosuvchi moddalarni olish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#u-yerda-nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;Simpoziumda oziq-ovqat ishlab chiqarishga yondashuvni o'zgartiradigan tadqiqot natijalari birinchi marta taqdim etiladi. Masalan, qovurilgan hid uchun javobgar bo'lgan pirazinlarni aniqlash uchun yangi biosensorlar yoki mahsulotlardagi omega-yog'larini saqlab qolish imkonini beruvchi innovatsion quritish usullari muhokama qilinadi. Ishtirokchilar kimyoviy jarayonlarni fermentatsiya bilan almashtirish (masalan, yakon ildizidan mannitol olish) yakuniy mahsulot sifatiga qanday ta'sir qilishini ko'rsatadilar.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Simpozium natijalarini uchrashuvlar yakunlari bo'yicha nashr etiladigan ilmiy to'plamlar va ma'ruzalar annotatsiyalari orqali kuzatish mumkin. Ishtirok etish o'z tadqiqotlarini stend yoki og'zaki ma'ruzalar ko'rinishida taqdim etishni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Vanilla\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vanilla — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Vanilla_planifolia_(6998639597).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Malcolm Manners from Lakeland FL, USA, CC BY 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"главный научный симпозиум по химии вкуса и аромата"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Weurman Flavour Research Symposium","description":"главный научный симпозиум по химии вкуса и аромата","vcsPath":"reference/conferences/conf-weurman.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-weurman.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-weurman.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-weurman.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar taqdim etiladi","href":"reference/conferences/conf-weurman.html#u-yerda-nimalar-taqdim-etiladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-weurman.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-weurman.html#manbalar","level":2}],"title":"Weurman Flavour Research Symposium"},"router":{"pathname":"reference/conferences/conf-weurman","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
