        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Европейская федерация пищевой науки и технологий&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Европейская федерация пищевой науки и технологий&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;программа, постеры&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;Европейская федерация пищевой науки и технологий (EFFoST)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Международная научная конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;effost.org&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt;, &lt;a href=\"concepts/spec-structure.html\"&gt;Tekstura va oziq-ovqat fizikasi&lt;/a&gt;, &lt;a href=\"concepts/spec-newfood.html\"&gt;Yangi taomlar&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Xavfsizlik va saqlash&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;EFFoST (European Federation of Food Science and Technology) — bu tadqiqotchilar, texnologlar va oziq-ovqat sanoati vakillarini birlashtiradigan yillik xalqaro ilmiy konferensiya. Tadbir oziq-ovqat tizimlaridagi fundamental jarayonlar, xomashyoni qayta ishlash usullari va oziq-ovqat xavfsizligi sohasidagi innovatsiyalar bo'yicha bilim almashish maydonidir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Konferensiya Yevropa oziq-ovqat fanlari va texnologiyalari federatsiyasi (EFFoST) tomonidan tashkil etiladi. Federatsiya Yevropa bo'ylab oziq-ovqat fanlari jamiyatlari ishini muvofiqlashtiruvchi notijorat tashkilotdir.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiya dasturi sanoatning dolzarb muammolariga mos keladigan keng ko'lamli yo'nalishlarni qamrab oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Qayta ishlash texnologiyalari va tekstura: ekstruziyaning mahsulot tuzilishiga ta'sirini o'rganish.&lt;/li&gt;\n&lt;li&gt;Xavfsizlik va saqlash: yog'larning oksidlanishi, o'simlik oqsillaridagi mikotoksinlar va qadoqlashning mikrobiologik barqarorligi bilan bog'liq xavflarni tahlil qilish.&lt;/li&gt;\n&lt;li&gt;Yangi oziq-ovqat: hasharotlar va o'simlik izolyatlari kabi muqobil oqsil manbalarini tadqiq qilish.&lt;/li&gt;\n&lt;li&gt;Funksional komponentlar: qo'shimchalarning tayyor mahsulotlarning fizik-kimyoviy xususiyatlariga ta'sirini o'rganish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo'ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo'ladi&lt;/h2&gt;\n&lt;p&gt;Konferensiyada ultra-qayta ishlangan oziq-ovqatning salomatlikka ta'siri bo'yicha meta-tahlillar va mahsulotlarni barqarorlashtirishning yangi usullari haqidagi ma'lumotlar birinchi marta taqdim etiladi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiyada ishtirok etish uchun ekspertlar bahosidan o'tadigan ma'ruza tezislarini taqdim etish kerak. Natijalarni tadbir yakunlangandan so'ng nashr etiladigan rasmiy tezislar to'plamlari orqali kuzatish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D0%B8%D1%81%D0%BE%D0%BA_%D0%B0%D1%8D%D1%80%D0%BE%D0%BF%D0%BE%D1%80%D1%82%D0%BE%D0%B2_%D0%BF%D0%BE_%D0%BA%D0%BE%D0%B4%D1%83_%D0%98%D0%9A%D0%90%D0%9E%3A_E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Список аэропортов по коду ИКАО: E — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.tifs.2018.07.008\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The next protein transition&lt;/a&gt; — sharh, Trends Food Sci Technol 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.jare.2025.10.004\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of capsaicin, circadian clock genes, and TRPV1 in colorectal carcinogenesis: Lessons and future directions&lt;/a&gt; — sharh, J Adv Res 2026&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{
