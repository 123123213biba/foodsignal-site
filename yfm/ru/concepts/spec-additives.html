        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-additives.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-additives.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Пищевые добавки — это вещества, которые добавляют в продукты питания в технологических целях на этапах производства, упаковки, транспортировки или хранения. Их основная задача — придать продукту желаемые свойства, такие как определенный аромат, цвет, вкус, консистенция или длительность хранения. В широком смысле к ним относятся даже привычные соль и перец, однако в промышленности под этим термином понимают стандартизированные компоненты, регулируемые международными и национальными нормами.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-additives.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Пищевая добавка является информационной сущностью и материальной сущностью одновременно: как химическое соединение она обладает физико-химическими свойствами, а как компонент состава — несет информацию о функции продукта. Классификация добавок базируется на их функциональном классе (например, консерванты, красители, эмульгаторы). Принципы их использования опираются на оценку безопасности, проводимую международными организациями, такими как JECFA и EFSA. Ключевым понятием является допустимое суточное потребление (ДСП) — количество вещества, которое человек может получать ежедневно в течение жизни без риска для здоровья.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-additives.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Функционирование добавок основано на их способности изменять физико-химическую среду продукта. Например, антиоксиданты замедляют окисление жиров, а консерванты подавляют рост микроорганизмов. В современных технологиях добавки часто используются в составе съедобных покрытий. Эти покрытия создают барьер между продуктом и внешней средой, предотвращая потерю влаги и проникновение патогенов. Выбор конкретной добавки зависит от типа матрицы продукта и требуемого срока годности.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-additives.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным методом оценки эффективности добавок являются лабораторные испытания. Исследователи создают модели продуктов, в которые вводят различные концентрации веществ, после чего измеряют показатели качества: микробиологическую чистоту, органолептические свойства (вкус, запах) и физическую стабильность. Инструментарий включает методы хроматографии для анализа состава и сенсорные панели для оценки потребительских свойств.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-additives.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии использования добавок активно развиваются в области упаковки и сохранения свежести продуктов. В статье «Как кожура цитрусовых помогает дольше хранить куриные бургеры» описано применение экстракта грейпфрута в желатиновой пленке, что увеличило срок хранения мяса в морозильной камере на 5 месяцев. В исследовании «Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими» ученые разработали съедобное покрытие из отходов цитрусовых, которое защищает овощи от порчи и плесени.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-additives.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главным ограничением является необходимость строгого соблюдения дозировок, установленных ТР ТС 021/2011 и 029/2012. Важно понимать, что эффективность добавки в лабораторных условиях не всегда гарантирует аналогичный результат при промышленном масштабировании. Кроме того, любые добавки должны проходить проверку на отсутствие нежелательных взаимодействий с другими компонентами пищи.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Пищевые добавки&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%D0%B4%D1%8B%D2%9B%20%D2%9B%D0%BE%D1%81%D0%BF%D0%B0%5D%20--%3E%7C%D0%B0%D0%BD%D1%8B%D2%9B%D1%82%D0%B0%D0%B9%D0%B4%D1%8B%7C%20B%5B%D0%A4%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D0%B4%D1%8B%D2%9B%20%D0%BA%D0%BB%D0%B0%D1%81%D1%81%5D%0A%20%20A%20--%3E%7C%D1%80%D0%B5%D1%82%D1%82%D0%B5%D0%BB%D0%B5%D0%B4%D1%96%7C%20C%5B%D0%A5%D0%B0%D0%BB%D1%8B%D2%9B%D0%B0%D1%80%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BD%D0%BE%D1%80%D0%BC%D0%B0%D0%BB%D0%B0%D1%80%5D%0A%20%20A%20--%3E%7C%D3%A9%D0%B7%D0%B0%D1%80%D0%B0%20%D3%99%D1%80%D0%B5%D0%BA%D0%B5%D1%82%D1%82%D0%B5%D1%81%D0%B5%D0%B4%D1%96%7C%20D%5B%D0%A2%D0%B0%D2%93%D0%B0%D0%BC%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%D1%81%D1%8B%5D%0A%20%20A%20--%3E%7C%D2%9B%D0%B0%D0%BC%D1%82%D0%B0%D0%BC%D0%B0%D1%81%D1%8B%D0%B7%20%D0%B5%D1%82%D0%B5%D0%B4%D1%96%7C%20E%5B%D0%A1%D0%B0%D2%9B%D1%82%D0%B0%D1%83%20%D0%BC%D0%B5%D1%80%D0%B7%D1%96%D0%BC%D1%96%5D%0A%20%20A%20--%3E%7C%D0%B6%D0%B0%D2%9B%D1%81%D0%B0%D1%80%D1%82%D0%B0%D0%B4%D1%8B%7C%20F%5B%D0%9E%D1%80%D0%B3%D0%B0%D0%BD%D0%BE%D0%BB%D0%B5%D0%BF%D1%82%D0%B8%D0%BA%D0%B0%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D0%B1%D0%B5%D0%BB%D0%B3%D1%96%D0%BB%D0%B5%D0%B9%D0%B4%D1%96%7C%20G%5B%D0%A0%D2%B1%D2%9B%D1%81%D0%B0%D1%82%20%D0%B5%D1%82%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20%D1%82%D3%99%D1%83%D0%BB%D1%96%D0%BA%D1%82%D1%96%D0%BA%20%D1%82%D2%B1%D1%82%D1%8B%D0%BD%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-additives.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-additives.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html\"&gt;Гиалуроновая кислота в мороженом: как молекулярный вес меняет текстуру десерта&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html\"&gt;Сладкие яблоки уступают кислым по антиоксидантной защите&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html\"&gt;Как превратить отходы морепродуктов в ценный пищевой белок&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Как кожура цитрусовых помогает дольше хранить куриные бургеры&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-additives.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5_%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Пищевые добавки — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/ieam.258\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Perfluoroalkyl and polyfluoroalkyl substances in the environment: terminology, classification, and origins&lt;/a&gt; — обзор, Integr Environ Assess Manag 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.marpolbul.2011.09.025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microplastics as contaminants in the marine environment: a review&lt;/a&gt; — обзор, Mar Pollut Bull 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1098/rstb.2008.0205\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accumulation and fragmentation of plastic debris in global environments&lt;/a&gt; — обзор, Philos Trans R Soc Lond B Biol Sci 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"E-коды без мифов: что это, зачем, как работает и что говорят исследования."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Пищевые добавки","description":"E-коды без мифов: что это, зачем, как работает и что говорят исследования.","vcsPath":"concepts/spec-additives.md"},"headings":[{"title":"Определение","href":"concepts/spec-additives.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/spec-additives.html#obzor","level":2},{"title":"Теория","href":"concepts/spec-additives.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/spec-additives.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/spec-additives.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/spec-additives.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/spec-additives.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/spec-additives.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/spec-additives.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/spec-additives.html#istochniki","level":2}],"title":"Пищевые добавки"},"router":{"pathname":
