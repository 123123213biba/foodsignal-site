        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-thermal.jpg\" alt=\"Технологии приготовления\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Muhammad 9009, CC0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-thermal.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-thermal.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Технологии приготовления — это совокупность процессов термической и механической обработки пищевого сырья, направленных на изменение его физико-химических свойств, вкусоароматического профиля и микробиологической безопасности. Цель данных процессов заключается в создании продукта, пригодного для усвоения организмом человека и обладающего заданными органолептическими качествами.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-thermal.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;В основе технологий приготовления лежит воздействие энергии на молекулярную структуру продукта. Нагрев вызывает денатурацию белков, желатинизацию крахмалов и карамелизацию сахаров. Эти процессы меняют текстуру и биодоступность нутриентов. Например, экструзия, применяемая при производстве кондитерских изделий, меняет структуру сахаров и белков, что влияет на скорость их усвоения организмом. Термическая обработка, такая как жарка или запекание, не только формирует вкус через реакцию Майяра, но и концентрирует питательные вещества, удаляя влагу.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-thermal.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс приготовления включает три ключевых этапа: подготовку сырья, воздействие агента (тепло, давление, механическое усилие) и фиксацию результата. Тепло передается через конвекцию (воздух), кондукцию (прямой контакт с поверхностью) или излучение (СВЧ). Выбор метода определяет, как именно изменятся свойства продукта: например, sous vide (низкотемпературная готовка) позволяет сохранить структуру тканей, тогда как высокотемпературная жарка создает хрустящую корочку.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-thermal.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;К основным методам относятся:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Жарка и запекание: использование высоких температур для формирования корочки и изменения состава.&lt;/li&gt;\n&lt;li&gt;Экструзия: продавливание сырья через формующее отверстие под давлением, что меняет плотность и усвояемость.&lt;/li&gt;\n&lt;li&gt;Пастеризация: нагрев для снижения количества патогенных микроорганизмов.&lt;/li&gt;\n&lt;li&gt;Sous vide: длительное приготовление в вакуумной упаковке при точно контролируемой температуре.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-thermal.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии приготовления используются для модификации свойств продуктов. В статье «Экструзия против сахарного пика: как обработка сырья меняет усвоение шоколада» показано, что экструзия сахара и молока меняет гликемический ответ организма. В исследовании «Хрустящие личинки пальмового долгоносика: белковый концентрат с неожиданными рисками» отмечено, что жарка и запекание удваивают долю белка в продукте, однако требуют контроля безопасности сырья.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-thermal.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Любая технология приготовления меняет исходный состав продукта. Высокие температуры могут способствовать образованию нежелательных соединений или маскировать наличие опасных примесей, таких как тяжелые металлы. Кроме того, изменение структуры нутриентов может как повышать, так и снижать их биодоступность. Важно учитывать, что термическая обработка не является универсальным способом очистки сырья от всех видов загрязнений.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Технологии приготовления&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A8%D0%B8%D0%BA%D1%96%D0%B7%D0%B0%D1%82%5D%20--%3E%20B%5B%D0%94%D0%B0%D0%B9%D1%8B%D0%BD%D0%B4%D0%B0%D1%83%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20B%20--%3E%7C%D0%96%D1%8B%D0%BB%D1%83%7C%20C%5B%D0%94%D0%B5%D0%BD%D0%B0%D1%82%D1%83%D1%80%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%7C%D2%9A%D1%8B%D1%81%D1%8B%D0%BC%7C%20D%5B%D0%AD%D0%BA%D1%81%D1%82%D1%80%D1%83%D0%B7%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%7C%D0%9C%D0%B5%D1%85%D0%B0%D0%BD%D0%B8%D0%BA%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BA%D2%AF%D1%88%7C%20E%5B%D0%A2%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%D0%BD%D1%8B%D2%A3%20%D3%A9%D0%B7%D0%B3%D0%B5%D1%80%D1%83%D1%96%5D%0A%20%20C%20--%3E%20F%5B%D0%94%D0%B0%D0%B9%D1%8B%D0%BD%20%D3%A9%D0%BD%D1%96%D0%BC%5D%0A%20%20D%20--%3E%20F%0A%20%20E%20--%3E%20F%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-thermal.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-extrusion.html\"&gt;Экструзия&lt;/a&gt; — Хлопья, снеки, текстурированный белок: как работает экструдер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservation_heat.html\"&gt;Пастеризация и стерилизация&lt;/a&gt; — Тепловая обработка ради безопасности и срока хранения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-thermal.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html\"&gt;Как перестать гадать, сколько вы съели: цифровой атлас порций&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Экструзия против сахарного пика: как обработка сырья меняет усвоение шоколада&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Жидкий дым и наноэмульсия продлевают свежесть мидий су-вид до 24 дней&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/nutritional-composition-chemical-safety-and-microbiological.html\"&gt;Хрустящие личинки пальмового долгоносика: белковый концентрат с неожиданными рисками&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-thermal.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Курутоб — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Muhammad 9009, CC0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/thy.2015.0020\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer: The American Thyroid Association Guidelines Task Force on Thyroid Nodules and Differentiated Thyroid Cancer&lt;/a&gt; — обзор, Thyroid 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/jcc.21287\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CHARMM: the biomolecular simulation program&lt;/a&gt; — обзор, J Comput Chem 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41572-020-00240-3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hepatocellular carcinoma&lt;/a&gt; — обзор, Nat Rev Dis Primers 2021&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Технологии приготовления","description":"Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.","vcsPath":"concepts/spec-thermal.md"},"headings":[{"title":"Определение","href":"concepts/spec-thermal.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/spec-thermal.html#obzor","level":2},{"title":"Теория","href":"concepts/spec-thermal.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/spec-thermal.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/spec-thermal.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/spec-thermal.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/spec-thermal.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/spec-thermal.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/spec-thermal.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/spec-thermal.html#istochniki","level":2}],"title":"Технологии приготовления"},"router":{"pathname":"concepts/spec-thermal","depth":2,"base":".
