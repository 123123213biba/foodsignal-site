            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Вещество&lt;/strong&gt; · &lt;em&gt;grapefruit peel extract&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Растительный экстракт, богатый фенольными соединениями и антиоксидантами, используемый в качестве активного природного консерванта для подавления бактерий и окисления жиров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение собрано из статей выпуска автоматически и ждёт проверки редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Кожура грейпфрута продемонстрировала самое высокое содержание антиоксидантов и фенольных соединений, за ней следуют кожура апельсина и лимона. В целом, желатиновые пленки, обогащенные 4% экстрактами цитрусовой кожуры, показали улучшенные антиоксидантные и антибактериальные свойства&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Как кожура цитрусовых помогает дольше хранить куриные бургеры&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;концентрация в пленке&lt;/td&gt;\n&lt;td&gt;1%, 2%, 4%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Как кожура цитрусовых помогает дольше хранить куриные бургеры&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/substances.html\"&gt;Вещества&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Растительный экстракт, богатый фенольными соединениями и антиоксидантами, используемый в качестве активного природного консерванта для подавления бактерий и оки"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"экстракт кожуры грейпфрута","description":"Растительный экстракт, богатый фенольными соединениями и антиоксидантами, используемый в качестве активного природного консерванта для подавления бактерий и оки","vcsPath":"concepts/grapefruit-peel-extract.md"},"headings":[{"title":"Определение","href":"concepts/grapefruit-peel-extract.html#opredelenie","level":2},{"title":"Как об этом пишут в статьях","href":"concepts/grapefruit-peel-extract.html#kak-ob-etom-pishut-v-statyah","level":2},{"title":"Справка","href":"concepts/grapefruit-peel-extract.html#spravka","level":2},{"title":"Где встречается","href":"concepts/grapefruit-peel-extract.html#gde-vstrechaetsya","level":2}],"title":"экстракт кожуры грейпфрута"},"router":{"pathname":"conc
