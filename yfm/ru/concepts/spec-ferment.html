        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-ferment.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-ferment.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Ферментация — это биохимическая переработка органических веществ под воздействием ферментов или микроорганизмов. В пищевых технологиях этот процесс превращает исходное сырье в продукты с новыми вкусовыми, ароматическими и питательными свойствами. Зимология — это прикладная наука, изучающая механизмы ферментации и способы их практического применения.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-ferment.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Ферментация является процессом метаболизма, при котором микроорганизмы (бактерии, дрожжи, плесневые грибы) расщепляют сложные органические соединения, такие как углеводы, для получения энергии в отсутствие кислорода. Ключевым результатом является накопление метаболитов: органических кислот, спиртов, газов и ароматических соединений. Этот процесс тесно связан с микробиотой кишечника, которая использует продукты ферментации, например короткоцепочечные жирные кислоты, для регуляции энергетического обмена хозяина.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-ferment.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс начинается с подготовки субстрата — среды, богатой питательными веществами. Затем в систему вносятся специфические микроорганизмы или активируются собственные ферменты сырья. В ходе реакции микробы потребляют сахара и выделяют продукты жизнедеятельности, которые изменяют pH, текстуру и химический состав продукта. Контроль условий — температуры, влажности и доступа кислорода — определяет, какие именно микроорганизмы будут доминировать в культуре.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-ferment.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основными инструментами являются биореакторы или емкости для ферментации, обеспечивающие заданные параметры среды. В домашнем и промышленном производстве применяются закваски, коджи (культуры плесневых грибов) и естественные стартовые культуры, такие как комбуча. Современные методы включают прецизионную ферментацию, где микроорганизмы программируются для синтеза конкретных молекул.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-ferment.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Ферментация используется для создания широкого спектра продуктов. В статье «Чайный гриб вместо закваски: как комбуча разгоняет брожение хлеба» описывается использование комбучи для ускорения выпечки и обогащения хлеба антиоксидантами. В работе «Может ли сок из семян алеппской сосны укрепить кишечный барьер» рассматривается влияние ферментированного напитка на целостность клеток кишечника. Исследование «Китайский напиток доужир против гриппа: что нашла наука» показывает потенциал ферментированных бобов мунг в поддержке иммунитета.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-ferment.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главным ограничением является риск развития патогенных микроорганизмов при нарушении протоколов безопасности. Ферментация — это не стерильный процесс, поэтому контроль чистоты культуры и условий среды критически важен для предотвращения порчи. Результаты исследований, проводимых на клеточных моделях или животных, не всегда напрямую переносятся на человека, что требует осторожности при интерпретации данных о пользе для здоровья.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Ферментация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%83%D0%B1%D1%81%D1%82%D1%80%D0%B0%D1%82%5D%20--%3E%20B%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D0%B4%D0%B5%D1%80%5D%0A%20%20B%20--%3E%7C%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%7C%20C%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D3%A8%D0%BD%D1%96%D0%BC%D0%BD%D1%96%D2%A3%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%D1%96%5D%0A%20%20D%20--%3E%20E%5B%D0%94%D3%99%D0%BC%5D%0A%20%20D%20--%3E%20F%5B%D0%A5%D0%BE%D1%88%20%D0%B8%D1%96%D1%81%5D%0A%20%20D%20--%3E%20G%5B%D0%A2%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%5D%0A%20%20D%20--%3E%20H%5B%D0%A1%D0%B0%D2%9B%D1%82%D0%B0%D0%BB%D1%83%20%D0%BC%D0%B5%D1%80%D0%B7%D1%96%D0%BC%D1%96%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-ferment.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dairy_ferm.html\"&gt;Молочная ферментация&lt;/a&gt; — Йогурт, кефир, сыры: закваски и созревание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sourdough.html\"&gt;Закваска и хлеб&lt;/a&gt; — Дикие дрожжи и молочнокислые бактерии в тесте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-veg_ferm.html\"&gt;Квашения и соленья&lt;/a&gt; — Кимчи, квашеная капуста, соленья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-beverage_ferm.html\"&gt;Ферментированные напитки&lt;/a&gt; — Пиво, вино, комбуча, квас.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-koji_precision.html\"&gt;Коджи и прецизионная ферментация&lt;/a&gt; — Aspergillus, мисо, соевый соус; белки, выращенные микробами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-probiotics.html\"&gt;Пробиотики&lt;/a&gt; — Живые культуры и их выживание в продуктах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-ferment.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html\"&gt;Скрытая жизнь орехового сыра: что на самом деле происходит в ферментированных аналогах&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html\"&gt;Чайный гриб вместо закваски: как комбуча разгоняет брожение хлеба&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html\"&gt;Может ли сок из семян алеппской сосны укрепить кишечный барьер&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html\"&gt;Китайский напиток доужир против гриппа: что нашла наука&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-ferment.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — обзор, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1194/jlr.r036012\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The role of short-chain fatty acids in the interplay between diet, gut microbiota, and host energy metabolism&lt;/a&gt; — обзор, J Lipid Res 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.11.1.142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diarrheagenic Escherichia coli&lt;/a&gt; — обзор, Clin Microbiol Rev 1998&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Ферментация","description":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.","vcsPath":"concepts/spec-ferment.md"},"headings":[{"title":"
