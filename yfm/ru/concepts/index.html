            {"data":{"leading":false,"html":"&lt;p&gt;Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается.&lt;/p&gt;\n&lt;p&gt;50 концепций.&lt;/p&gt;\n&lt;h2 id=\"specialnost\"&gt;&lt;a href=\"concepts/index.html#specialnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Специальность&lt;/span&gt;&lt;/a&gt;Специальность&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-ferment.html\"&gt;Ферментация&lt;/a&gt; — Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structure.html\"&gt;Текстура и физика еды&lt;/a&gt; — Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-newfood.html\"&gt;Новая еда&lt;/a&gt; — Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt; — Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенты&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"process\"&gt;&lt;a href=\"concepts/index.html#process\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процесс&lt;/span&gt;&lt;/a&gt;Процесс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-lipid_aroma.html\"&gt;Окисление жиров и ароматы&lt;/a&gt; — Прогоркание, «рыбный» запах, ароматы жареного масла.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-extrusion.html\"&gt;Экструзия&lt;/a&gt; — Хлопья, снеки, текстурированный белок: как работает экструдер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservation_heat.html\"&gt;Пастеризация и стерилизация&lt;/a&gt; — Тепловая обработка ради безопасности и срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dairy_ferm.html\"&gt;Молочная ферментация&lt;/a&gt; — Йогурт, кефир, сыры: закваски и созревание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sourdough.html\"&gt;Закваска и хлеб&lt;/a&gt; — Дикие дрожжи и молочнокислые бактерии в тесте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-veg_ferm.html\"&gt;Квашения и соленья&lt;/a&gt; — Кимчи, квашеная капуста, соленья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-beverage_ferm.html\"&gt;Ферментированные напитки&lt;/a&gt; — Пиво, вино, комбуча, квас.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-koji_precision.html\"&gt;Коджи и прецизионная ферментация&lt;/a&gt; — Aspergillus, мисо, соевый соус; белки, выращенные микробами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-probiotics.html\"&gt;Пробиотики&lt;/a&gt; — Живые культуры и их выживание в продуктах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gels.html\"&gt;Гели и желе&lt;/a&gt; — Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_based.html\"&gt;Растительные аналоги&lt;/a&gt; — Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-shelf_life.html\"&gt;Срок годности&lt;/a&gt; — Порча, прогнозирование срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-packaging.html\"&gt;Упаковка и миграция&lt;/a&gt; — Пластик, биоразлагаемые плёнки, миграция веществ в еду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-contaminants.html\"&gt;Загрязнители процесса&lt;/a&gt; — Акриламид, ПАУ, фуран: как образуются и как снизить.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbial.html\"&gt;Микробная безопасность&lt;/a&gt; — Патогены, биоплёнки, обеззараживание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergens.html\"&gt;Аллергены&lt;/a&gt; — Выявление и снижение аллергенности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-micronutrients.html\"&gt;Витамины и минералы&lt;/a&gt; — Содержание, потери при готовке, обогащение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioactives.html\"&gt;Полифенолы и биоактивные вещества&lt;/a&gt; — Полифенолы, каротиноиды, флавоноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Концепции","description":"Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается.","vcsPath":"concepts/index.md"},"headings":[{"title":"Специальность","href":"concepts/index.html#specialnost","level":2},{"title":"Процесс","href":"concepts/index.html#process","level":2}],"title":"Концепции"},"router":{"pathname":"concepts/index","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
