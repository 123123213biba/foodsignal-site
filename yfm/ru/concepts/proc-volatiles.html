        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Key odorants of cold brew coffee identified by GC-olfactometry and headspace analysis&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-volatiles.jpg\" alt=\"Летучие соединения и анализ аромата\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Clément Bucco-Lechat, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Bowmore_bottle.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-volatiles.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-volatiles.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Аромат пищевых продуктов представляет собой комплекс летучих органических соединений, которые взаимодействуют с обонятельными рецепторами человека. Анализ аромата — это процесс идентификации и количественного определения этих молекул для понимания сенсорного профиля продукта.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-volatiles.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Аромат является качеством пищевого продукта, определяемым совокупностью летучих соединений. Эти молекулы имеют низкую молекулярную массу и высокую летучесть, что позволяет им достигать рецепторов в носовой полости. Ключевые одоранты — это подмножество летучих соединений, которые вносят наибольший вклад в узнаваемый запах продукта, даже если их концентрация крайне мала. Анализ аромата тесно связан с химией реакций Майяра и карамелизации, которые производят новые летучие вещества при термической обработке.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-volatiles.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс восприятия аромата начинается с испарения молекул с поверхности продукта. В лаборатории этот процесс имитируется путем экстракции летучих веществ из матрицы продукта. Идентификация соединений основывается на их физико-химических свойствах: массе молекул и их способности удерживаться на сорбентах. Результатом анализа является профиль аромата, который соотносит химический состав с сенсорным восприятием.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-volatiles.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Газовая хроматография-масс-спектрометрия (ГХ-МС) является основным методом анализа. Газовая хроматография разделяет смесь летучих соединений на компоненты, а масс-спектрометрия идентифицирует каждое вещество по его молекулярному весу. Ольфактометрия — это метод, при котором человек-эксперт вдыхает поток газа на выходе из хроматографа, чтобы определить, какие именно соединения обладают выраженным запахом. Анализ паровой фазы (headspace analysis) позволяет изучать ароматы непосредственно над образцом без сложной подготовки.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-volatiles.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Методы анализа аромата используются для контроля качества и разработки новых продуктов. Например, в исследовании «Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке» анализ летучих соединений помогает понять, как сублимация сохраняет естественные ноты продукта, в то время как горячий воздух вызывает появление жареных ароматов, маскирующих исходный вкус.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-volatiles.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Аналитические методы не всегда полностью отражают человеческое восприятие. Концентрация вещества не всегда прямо пропорциональна интенсивности запаха из-за порогов чувствительности рецепторов. Кроме того, взаимодействие различных соединений может усиливать или подавлять восприятие отдельных нот, что делает интерпретацию данных сложной задачей.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Летучие соединения и анализ аромата&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%20--%3E%20B%5B%D0%98%D1%81%D0%BF%D0%B0%D1%80%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%5D%0A%20%20B%20--%3E%20C%5B%D0%AD%D0%BA%D1%81%D1%82%D1%80%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%93%D0%B0%D0%B7%D0%BE%D0%B2%D0%B0%D1%8F%20%D1%85%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%BE%D0%B3%D1%80%D0%B0%D1%84%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20E%5B%D0%9C%D0%B0%D1%81%D1%81-%D1%81%D0%BF%D0%B5%D0%BA%D1%82%D1%80%D0%BE%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20F%5B%D0%9E%D0%BB%D1%8C%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D1%8F%5D%0A%20%20E%20--%3E%20G%5B%D0%98%D0%B4%D0%B5%D0%BD%D1%82%D0%B8%D1%84%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D1%8F%20%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%B0%5D%0A%20%20F%20--%3E%20H%5B%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BE%D1%86%D0%B5%D0%BD%D0%BA%D0%B0%5D%0A%20%20G%20--%3E%20I%5B%D0%9F%D1%80%D0%BE%D1%84%D0%B8%D0%BB%D1%8C%20%D0%B0%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B0%5D%0A%20%20H%20--%3E%20I%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-volatiles.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-volatiles.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Самцы или самки: почему одни мидии в морозилке прогоркают быстрее других&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-volatiles.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BE%D0%BB%D0%BE%D0%B4%D0%BE%D0%B2%D1%8B%D0%B9_%D0%B2%D0%B8%D1%81%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Солодовый виски — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Bowmore_bottle.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Clément Bucco-Lechat, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1172539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extending healthy life span--from yeast to humans&lt;/a&gt; — обзор, Science 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/mp/ssp106\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phenylpropanoid biosynthesis&lt;/a&gt; — обзор, Mol Plant 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/aob/mct067\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Jasmonates: biosynthesis, perception, signal transduction and action in plant stress response, growth and development. An update to the 2007 review in Annals of Botany&lt;/a&gt; — обзор, Ann Bot 2013&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Летучие соединения и анализ аромата","description":"Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.","vcsPath":"concepts/proc-volatiles.md"},"headings":[{"title":"Определение","href":"concepts/proc-volatiles.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-volatiles.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-volatiles.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-volatiles.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-volatiles.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-volatiles.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-volatiles.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-volatiles.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-volatiles.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/proc-volatiles.html#istochniki","level":2}],"title":"Летучие соединения и анализ аромата"},"router":{"pathname":"concepts/proc-volatiles","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
