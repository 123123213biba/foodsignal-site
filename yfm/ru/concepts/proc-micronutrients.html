        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Vitamin C losses during cooking and iron fortification of flour&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-micronutrients.jpg\" alt=\"Витамины и минералы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Schekinov Alexey Victorovich, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%94%D1%80%D0%B0%D0%B6%D0%B5._%D0%A0%D0%B5%D0%B2%D0%B8%D1%82_(%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%90,_%D0%921,_%D0%922_%D0%B8_%D0%A1).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Содержание, потери при готовке, обогащение.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Витамины и минералы являются микронутриентами — незаменимыми химическими соединениями, которые организм человека получает с пищей в малых количествах. Они участвуют в клеточном метаболизме, регуляции ферментативных реакций и поддержании структурной целостности тканей. В отличие от макронутриентов (белков, жиров и углеводов), микронутриенты не служат источником энергии, но обеспечивают протекание всех биохимических процессов в организме.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Витамины представляют собой органические молекулы, которые классифицируются по растворимости: водорастворимые (группа B, витамин C) и жирорастворимые (A, D, E, K). Минералы — это неорганические элементы (например, железо, кальций, магний), которые не синтезируются в организме и должны поступать извне. Микронутриенты являются частью метаболических путей, где выступают в роли кофакторов — компонентов, необходимых для активации ферментов. Их дефицит нарушает гомеостаз, что может приводить к развитию патологических состояний, включая метаболические нарушения и снижение адаптационных возможностей организма.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс усвоения микронутриентов зависит от их химической формы, взаимодействия с другими компонентами пищи и состояния пищеварительной системы. Например, биодоступность железа из растительных источников ниже, чем из продуктов животного происхождения. Термическая обработка продуктов вызывает деградацию термолабильных витаминов, таких как витамин C. Обогащение пищевых продуктов (фортификация) — это технологический процесс добавления микронутриентов в состав муки или других продуктов для предотвращения их дефицита в популяции.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для оценки содержания микронутриентов применяются аналитические методы: высокоэффективная жидкостная хроматография (ВЭЖХ) для витаминов и атомно-абсорбционная спектрометрия для минеральных элементов. В клинической практике используются лабораторные анализы крови для определения концентрации нутриентов. Важным инструментом является нутрициологический мониторинг, который позволяет соотносить потребление нутриентов с физиологическим состоянием человека.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Понимание роли микронутриентов необходимо для разработки стратегий питания. В статье «Как геймификация помогает подросткам с диабетом считать углеводы» рассматривается важность контроля состава рациона для поддержания метаболического баланса. В материале «Почему ужинать вдвоем полезнее для здоровья, чем в одиночку» обсуждается влияние психосоциальных факторов на метаболизм, что косвенно связано с эффективностью усвоения нутриентов при приеме пищи.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основная сложность заключается в вариативности биодоступности нутриентов. Данные о содержании витаминов в продуктах часто являются усредненными и не учитывают потери при хранении и кулинарной обработке. Существует риск избыточного потребления при бесконтрольном приеме биологически активных добавок, что может привести к токсическим эффектам. Научный консенсус подчеркивает, что сбалансированный рацион является предпочтительным источником микронутриентов по сравнению с изолированными добавками.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Витамины и минералы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BD%D1%83%D1%82%D1%80%D0%B8%D0%B5%D0%BD%D1%82%D1%82%D0%B5%D1%80%5D%20--%3E%20B%5B%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D0%B4%D0%B5%D1%80%5D%0A%20%20A%20--%3E%20C%5B%D0%9C%D0%B8%D0%BD%D0%B5%D1%80%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%0A%20%20B%20--%3E%7C%D1%81%D1%83%D0%B4%D0%B0%20%D0%B5%D1%80%D0%B8%D1%82%D1%96%D0%BD%7C%20D%5BB%20%D0%B6%D3%99%D0%BD%D0%B5%20C%20%D1%82%D0%BE%D0%B1%D1%8B%5D%0A%20%20B%20--%3E%7C%D0%BC%D0%B0%D0%B9%D0%B4%D0%B0%20%D0%B5%D1%80%D0%B8%D1%82%D1%96%D0%BD%7C%20E%5BA%20D%20E%20K%5D%0A%20%20C%20--%3E%7C%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%D1%82%D0%B5%D1%80%7C%20F%5B%D0%A2%D0%B5%D0%BC%D1%96%D1%80%20%D0%BA%D0%B0%D0%BB%D1%8C%D1%86%D0%B8%D0%B9%20%D0%BC%D0%B0%D0%B3%D0%BD%D0%B8%D0%B9%5D%0A%20%20A%20--%3E%7C%D2%9B%D0%B0%D1%82%D1%8B%D1%81%D0%B0%D0%B4%D1%8B%7C%20G%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D0%B7%D0%BC%5D%0A%20%20G%20--%3E%7C%D2%9B%D0%B0%D0%BC%D1%82%D0%B0%D0%BC%D0%B0%D1%81%D1%8B%D0%B7%20%D0%B5%D1%82%D0%B5%D0%B4%D1%96%7C%20H%5B%D0%90%D2%93%D0%B7%D0%B0%20%D1%84%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D1%8F%D1%81%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенты&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioactives.html\"&gt;Полифенолы и биоактивные вещества&lt;/a&gt; — Полифенолы, каротиноиды, флавоноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Жировая болезнь печени: почему число новых случаев удвоилось за три десятилетия&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html\"&gt;Как геймификация помогает подросткам с диабетом считать углеводы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html\"&gt;Почему ужинать вдвоем полезнее для здоровья, чем в одиночку&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%B3%D1%80%D1%83%D0%BF%D0%BF%D1%8B_B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Витамины группы B — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%94%D1%80%D0%B0%D0%B6%D0%B5._%D0%A0%D0%B5%D0%B2%D0%B8%D1%82_(%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%90,_%D0%921,_%D0%922_%D0%B8_%D0%A1).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Schekinov Alexey Victorovich, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(12)62167-9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Frailty in elderly people&lt;/a&gt; — обзор, Lancet 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cmet.2015.12.006\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Emerging Hallmarks of Cancer Metabolism&lt;/a&gt; — обзор, Cell Metab 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/ajcn/79.5.727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Polyphenols: food sources and bioavailability&lt;/a&gt; — обзор, Am J Clin Nutr 2004&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Содержание, потери при готовке, обогащение."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Витамины и минералы","description":"Содержание, потери при готовке, обогащение.","vcsPath":"concepts/proc-micronutrients.md"},"headings":[{"title":"Определение","href":"concepts/proc-micronutrients.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-micronutrients.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-micronutrients.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-micronutrients.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-micronutrients.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-micronutrients.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-micronutrients.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-micronutrients.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-micronutrients.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/proc-micronutrients.html#istochniki","level":2}],"title":"Витамины и минералы"},"r
