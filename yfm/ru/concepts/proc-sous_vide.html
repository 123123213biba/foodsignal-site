        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Sous vide cooking of beef loin: time and temperature for tenderness&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-sous_vide.jpg\" alt=\"Sous vide и низкотемпературная готовка\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Pedro.serna, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Sous_Vide_Cooking.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Точная температура, долгое время: мясо, рыба, яйца.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Sous vide (су-вид) — это процесс приготовления пищи, при котором продукт помещается в герметичную упаковку и подвергается термической обработке в водяной бане при строго контролируемой температуре в течение длительного времени. Метод также известен как низкотемпературная готовка (LTLT — low-temperature, long-time). В отличие от традиционных способов, где температура среды значительно выше целевой температуры продукта, су-вид позволяет достичь равномерной степени готовности по всему объему изделия.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;В основе су-вид лежит принцип теплопередачи через жидкую среду, обеспечивающий высокую точность поддержания температуры. В традиционных методах (жарка, гриль) градиент температур между поверхностью и центром продукта велик, что приводит к пересушиванию внешних слоев. При су-вид температура воды устанавливается равной целевой температуре внутри продукта. Это позволяет ферментам и белкам достичь желаемого состояния без денатурации, вызывающей жесткость. Метод является частью технологий приготовления и дополняет такие процессы, как обжарка или гриль, которые часто применяются для создания текстурной корочки после завершения основного цикла су-вид.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс включает три этапа: подготовку продукта, вакуумирование и термообработку. Продукт помещается в полимерный пакет, из которого удаляется воздух, что предотвращает окисление и обеспечивает плотный контакт с водой. Затем пакет погружается в термостат, где циркулирующая вода поддерживает заданную температуру с точностью до долей градуса. Длительность процесса зависит от типа продукта и его плотности, позволяя добиваться мягкости даже у жестких отрубов мяса.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным инструментом является иммерсионный циркулятор (термостат). Он состоит из нагревательного элемента, датчика температуры и насоса, который перемешивает воду для исключения «холодных зон». Для упаковки используются вакуумные упаковщики, удаляющие воздух из пакетов. В лабораторных и профессиональных условиях контроль процесса требует соблюдения протоколов безопасности для предотвращения развития патогенных микроорганизмов.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технология используется для приготовления мяса, рыбы и яиц, требующих точного контроля текстуры. В статье «Жидкий дым и наноэмульсия продлевают свежесть мидий су-вид до 24 дней» описывается применение метода для обработки моллюсков при 85 °C в сочетании с дополнительными компонентами для увеличения срока хранения.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главное ограничение метода — риск размножения анаэробных бактерий при неправильном температурном режиме. Низкие температуры (ниже 55 °C) требуют строгого контроля времени, чтобы избежать опасного уровня микробной обсемененности. Также метод не обеспечивает реакцию Майяра, поэтому для получения ароматической корочки требуется дополнительная финишная обработка (обжарка или опаливание).&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Sous vide и низкотемпературная готовка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%20%D0%B2%20%D0%BF%D0%B0%D0%BA%D0%B5%D1%82%D0%B5%5D%20--%3E%20B%5B%D0%92%D0%B0%D0%BA%D1%83%D1%83%D0%BC%D0%BD%D1%8B%D0%B9%20%D1%83%D0%BF%D0%B0%D0%BA%D0%BE%D0%B2%D1%89%D0%B8%D0%BA%5D%0A%20%20B%20--%3E%20C%5B%D0%92%D0%BE%D0%B4%D1%8F%D0%BD%D0%B0%D1%8F%20%D0%B1%D0%B0%D0%BD%D1%8F%5D%0A%20%20D%5B%D0%98%D0%BC%D0%BC%D0%B5%D1%80%D1%81%D0%B8%D0%BE%D0%BD%D0%BD%D1%8B%D0%B9%20%D1%86%D0%B8%D1%80%D0%BA%D1%83%D0%BB%D1%8F%D1%82%D0%BE%D1%80%5D%20--%3E%7C%D0%BD%D0%B0%D0%B3%D1%80%D0%B5%D0%B2%20%D0%B8%20%D1%86%D0%B8%D1%80%D0%BA%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%7C%20C%0A%20%20C%20--%3E%20E%5B%D0%93%D0%BE%D1%82%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A%20%20E%20--%3E%20F%5B%D0%A4%D0%B8%D0%BD%D0%B8%D1%88%D0%BD%D0%B0%D1%8F%20%D0%BE%D0%B1%D0%B6%D0%B0%D1%80%D0%BA%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Жидкий дым и наноэмульсия продлевают свежесть мидий су-вид до 24 дней&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-sous_vide.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Sous_vide\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sous vide — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Sous_Vide_Cooking.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Pedro.serna, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.00228-20\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tools and Techniques for Severe Acute Respiratory Syndrome Coronavirus 2 (SARS-CoV-2)/COVID-19 Detection&lt;/a&gt; — обзор, Clin Microbiol Rev 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu14030453\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effect of Dietary Protein and Processing on Gut Microbiota-A Systematic Review&lt;/a&gt; — обзор, Nutrients 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/foods9091334\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of Sensory Evaluation in Consumer Acceptance of Plant-Based Meat Analogs and Meat Extenders: A Scoping Review&lt;/a&gt; — обзор, Foods 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Точная температура, долгое время: мясо, рыба, яйца."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Sous vide и низкотемпературная готовка","description":"Точная температура, долгое время: мясо, рыба, яйца.","vcsPath":"concepts/proc-sous_vide.md"},"headings":[{"title":"Определение","href":"concepts/proc-sous_vide.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-sous_vide.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-sous_vide.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-sous_vide.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-sous_vide.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-sous_vide.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-sous_vide.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-sous_vide.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-sous_vide.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/proc-sous_vide.html#istochniki","level":2}],"title":"Sous vide и низкотемпературная готовка"},"router":{"pathname":"concepts/proc-sous_vide","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
