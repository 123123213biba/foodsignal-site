            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Вещество&lt;/strong&gt; · &lt;em&gt;Sodium alginate&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/sodium-alginate.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Природный полисахарид, используемый в качестве основы для создания защитного биоразлагаемого покрытия на поверхности плодов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение собрано из статей выпуска автоматически и ждёт проверки редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/sodium-alginate.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Основой покрытия стал альгинат натрия, дополненный пектином, извлеченным из отходов апельсиновой кожуры. В состав также ввели хитозан — катионный полисахарид, который при pH 3,61–4,07 образует прочные полиэлектролитные комплексы с анионными группами альгината и пектина.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/sodium-alginate.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;pH_range&lt;/td&gt;\n&lt;td&gt;3.61–4.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/sodium-alginate.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;E401, альгинат&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/sodium-alginate.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/substances.html\"&gt;Вещества&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Природный полисахарид, используемый в качестве основы для создания защитного биоразлагаемого покрытия на поверхности плодов."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Альгинат натрия","description":"Природный полисахарид, используемый в качестве основы для создания защитного биоразлагаемого покрытия на поверхности плодов.","vcsPath":"concepts/sodium-alginate.md"},"headings":[{"title":"Определение","href":"concepts/sodium-alginate.html#opredelenie","level":2},{"title":"Как об этом пишут в статьях","href":"concepts/sodium-alginate.html#kak-ob-etom-pishut-v-statyah","level":2},{"title":"Справка","href":"concepts/sodium-alginate.html#spravka","level":2},{"title":"Другие названия","href":"concepts/sodium-alginate.html#
