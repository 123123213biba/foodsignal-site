        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Материал&lt;/strong&gt; · &lt;em&gt;Edible packaging&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/edible-packaging.jpg\" alt=\"Съедобная упаковка\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: File:Edible packaging film.pdf: Paul Pierlot derivative work: Sebastian Wallroth, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Edible_packaging_film.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/edible-packaging.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Съедобная упаковка — это биоразлагаемый защитный барьер из пищевых компонентов, предназначенный для снижения потери влаги и подавления роста микроорганизмов на продуктах.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/edible-packaging.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Съедобная упаковка — это биоразлагаемый защитный барьер, изготовленный из пищевых компонентов, который наносится на поверхность продукта или формируется в виде пленки. Основная функция материала — снижение потери влаги, замедление окисления и подавление роста микроорганизмов, что способствует сохранению свежести продуктов.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/edible-packaging.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Съедобная упаковка является видом биоразлагаемого материала. В основе технологии лежит создание полимерной матрицы из природных макромолекул: полисахаридов (крахмал, альгинаты), белков (казеин, желатин) или липидов (воски, жиры). Эти компоненты образуют непрерывную сеть, которая ограничивает перенос газов, водяного пара и растворенных веществ между продуктом и окружающей средой.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/edible-packaging.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс формирования упаковки включает создание раствора или суспензии, которые затем наносятся на продукт методом окунания, распыления или полива. После испарения растворителя (обычно воды или этанола) образуется тонкий слой. Структура этого слоя определяет его барьерные свойства: белки обеспечивают механическую прочность, липиды препятствуют испарению воды, а полисахариды создают структурный каркас.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/edible-packaging.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основные методы включают влажное формование (casting), экструзию и электроспиннинг. Инструменты зависят от масштаба производства: от лабораторных установок для нанесения покрытий до промышленных линий, интегрированных в процесс упаковки пищевых продуктов. Выбор метода зависит от вязкости исходного состава и требуемой толщины защитного слоя.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/edible-packaging.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технология находит применение в переработке отходов пищевой промышленности. Например, в статье «Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку» описывается создание прочной пленки из побочных продуктов рыбоводства. В исследовании «Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими» показано использование отходов цитрусовых для создания покрытия, защищающего овощи от порчи.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/edible-packaging.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главные ограничения связаны с физико-химической стабильностью: съедобная упаковка чувствительна к влажности окружающей среды, что может привести к потере защитных свойств. Также существуют сложности с масштабированием производства и необходимостью обеспечения органолептической нейтральности, чтобы компоненты упаковки не влияли на вкус и аромат основного продукта. Безопасность материалов должна соответствовать международным стандартам, таким как требования JECFA или ТР ТС 029/2012.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Съедобная упаковка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5%20%D0%BA%D0%BE%D0%BC%D0%BF%D0%BE%D0%BD%D0%B5%D0%BD%D1%82%D1%8B%5D%20--%3E%20B%5B%D0%9F%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%97%D0%B0%D1%89%D0%B8%D1%82%D0%BD%D1%8B%D0%B9%20%D0%B1%D0%B0%D1%80%D1%8C%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%BD%D0%B8%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BF%D0%BE%D1%82%D0%B5%D1%80%D0%B8%20%D0%B2%D0%BB%D0%B0%D0%B3%D0%B8%5D%0A%20%20C%20--%3E%20E%5B%D0%9F%D0%BE%D0%B4%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D0%BE%D0%B2%5D%0A%20%20C%20--%3E%20F%5B%D0%97%D0%B0%D0%BC%D0%B5%D0%B4%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BE%D0%BA%D0%B8%D1%81%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20G%5B%D0%A1%D0%BE%D1%85%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5%20%D1%81%D0%B2%D0%B5%D0%B6%D0%B5%D1%81%D1%82%D0%B8%5D%0A%20%20E%20--%3E%20G%0A%20%20F%20--%3E%20G%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение проверено автоматически и ждёт утверждения редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/edible-packaging.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Из этого желатина были созданы пленки толщиной 0,14 мм с использованием глицерина в качестве пластификатора. Испытания показали предел прочности при растяжении 6,53 МПа и относительное удлинение при разрыве 94,55%.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/edible-packaging.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;film_thickness&lt;/td&gt;\n&lt;td&gt;0,14 мм&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tensile_strength&lt;/td&gt;\n&lt;td&gt;6,53 МПа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;elongation_at_break&lt;/td&gt;\n&lt;td&gt;94,55%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;storage_temperature&lt;/td&gt;\n&lt;td&gt;4 °C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;storage_duration&lt;/td&gt;\n&lt;td&gt;15 days&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/edible-packaging.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;Edible coating, Биоупаковочный материал, биоразлагаемое покрытие&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/edible-packaging.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/materials.html\"&gt;Материалы&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/edible-packaging.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%8A%D0%B5%D0%B4%D0%BE%D0%B1%D0%BD%D0%B0%D1%8F_%D0%BF%D0%BE%D1%81%D1%83%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Съедобная посуда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Edible_packaging_film.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: File:Edible packaging film.pdf: Paul Pierlot derivative work: Sebastian Wallroth, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.carbpol.2020.116178\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Polysaccharides, Protein and Lipid -Based Natural Edible Films in Food Packaging: A Review&lt;/a&gt; — обзор, Carbohydr Polym 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/foods7100170\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Alginate-Based Edible Films and Coatings for Food Packaging Applications&lt;/a&gt; — обзор, Foods 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.foodres.2020.109582\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Film formation and deposition methods of edible coating on food products: A review&lt;/a&gt; — обзор, Food Res Int 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Съедобная упаковка — это биоразлагаемый защитный барьер из пищевых компонентов, предназначенный для снижения потери влаги и подавления роста микроорганизмов на "}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Съедобная упаковка","description":"Съедобная упаковка — это биоразлагаемый защитный барьер из пищевых компонентов, предназначенный для снижения потери влаги и подавления роста микроорганизмов на ","vcsPath":"concepts/edible-packaging.md"},"headings":[{"title":"Определение","href":"concepts/edible-packaging.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/edible-packaging.html#obzor","level":2},{"title":"Теория","href":"concepts/edible-packaging.html#teoriya","level":2},{"title":"Как это устр
