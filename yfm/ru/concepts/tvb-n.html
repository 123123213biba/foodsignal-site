        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Термин&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/tvb-n.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Общий летучий основной азот (TVB-N) — это показатель свежести мяса, отражающий накопление продуктов распада белков и жизнедеятельности бактерий. Низкие значения свидетельствуют о качестве продукта, а превышение норматива в 35 мг N/100 г указывает на порчу.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/tvb-n.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Общий летучий основной азот (TVB-N) — это показатель качества пищевых продуктов, измеряющий концентрацию азотистых соединений, которые образуются при распаде белков и жизнедеятельности микроорганизмов. В пищевой индустрии этот параметр является ключевым индикатором свежести мяса, рыбы и морепродуктов. Высокие значения TVB-N указывают на протекание процессов порчи, что делает этот показатель важным инструментом для контроля безопасности пищевой продукции.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/tvb-n.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;TVB-N (Total Volatile Basic Nitrogen) представляет собой совокупность летучих оснований, таких как аммиак, диметиламин и триметиламин. Эти вещества являются продуктами ферментативного расщепления белков и аминокислот, а также результатом метаболизма бактерий, вызывающих порчу продукта. В свежем мясе содержание этих соединений минимально. По мере хранения активность микрофлоры и эндогенных ферментов возрастает, что приводит к накоплению летучих азотистых соединений. TVB-N является качественным показателем, который позволяет оценить степень микробиологической деградации продукта до появления явных органолептических признаков порчи.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/tvb-n.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс накопления TVB-N разворачивается во времени параллельно с развитием микробиологических процессов. Когда белки подвергаются деградации, высвобождаются аминокислоты, которые затем дезаминируются бактериями. В результате образуются летучие соединения, способные переходить в газовую фазу. Измерение этого показателя позволяет объективно оценить состояние продукта. Нормативным порогом для многих видов мясной продукции считается значение 35 мг азота на 100 г продукта. Превышение этого уровня свидетельствует о том, что продукт перешел в стадию активной порчи.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/tvb-n.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для определения TVB-N применяются методы дистилляции и титрования. Образец продукта гомогенизируют, после чего летучие основания извлекаются путем перегонки с водяным паром в присутствии щелочи. Полученный дистиллят титруют раствором кислоты для определения общего количества азота. Современные исследования также направлены на использование упаковочных технологий, которые замедляют рост бактерий, тем самым сдерживая рост TVB-N.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/tvb-n.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Показатель TVB-N используется для оценки эффективности новых методов консервации. Например, в статье «Как кожура цитрусовых помогает дольше хранить куриные бургеры» описывается применение желатиновой пленки с экстрактом грейпфрута, которая позволяет замедлить накопление продуктов распада и продлить свежесть мяса на 5 месяцев. В исследовании «Жидкий дым и наноэмульсия продлевают свежесть мидий су-вид до 24 дней» комбинация термообработки при 85 °C, жидкого дыма и ультразвуковой эмульсии демонстрирует эффективность в сдерживании роста TVB-N, что позволяет увеличить срок хранения морепродуктов.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/tvb-n.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;TVB-N является интегральным показателем, который не всегда позволяет идентифицировать конкретный вид микроорганизма, вызвавшего порчу. Значения TVB-N могут варьироваться в зависимости от вида животного, условий хранения и начальной обсемененности продукта. Этот метод требует лабораторного оборудования и не является экспресс-тестом для бытового использования. Кроме того, показатель не учитывает другие виды порчи, такие как окисление жиров, поэтому для комплексной оценки качества продукта необходимо использовать дополнительные аналитические методы.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: TVB-N&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%90%D2%9B%D1%83%D1%8B%D0%B7%5D%20--%3E%20B%5B%D0%91%D0%B0%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D1%8F%D0%BB%D0%B0%D1%80%5D%0A%20%20B%20--%3E%20C%5B%D0%90%D0%BC%D0%B8%D0%BD%D2%9B%D1%8B%D1%88%D2%9B%D1%8B%D0%BB%D0%B4%D0%B0%D1%80%D1%8B%5D%0A%20%20C%20--%3E%20D%5B%D2%B0%D1%88%D0%BF%D0%B0%20%D0%BD%D0%B5%D0%B3%D1%96%D0%B7%D0%B4%D0%B5%D1%80%5D%0A%20%20D%20--%3E%20E%5BTVB-N%20%D0%BA%D3%A9%D1%80%D1%81%D0%B5%D1%82%D0%BA%D1%96%D1%88%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%A1%D0%B0%D0%BF%D0%B0%D0%BD%D1%8B%20%D0%B1%D0%B0%D2%93%D0%B0%D0%BB%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение проверено автоматически и ждёт утверждения редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/tvb-n.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;TVB-N (общий летучий основной азот) — это показатель, который растет по мере того, как в мясе размножаются бактерии и разрушаются белки; чем ниже этот показатель, тем свежее продукт.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Как кожура цитрусовых помогает дольше хранить куриные бургеры&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/tvb-n.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;единицы&lt;/td&gt;\n&lt;td&gt;мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;значение для 4% грейпфрута&lt;/td&gt;\n&lt;td&gt;11,20 мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;критический_норматив&lt;/td&gt;\n&lt;td&gt;35 мг N/100 г&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/tvb-n.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;total volatile basic nitrogen, летучий базисный азот, общее содержание летучих основных азотистых соединений, общий летучий базисный азот, общий летучий основной азот&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/tvb-n.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Как кожура цитрусовых помогает дольше хранить куриные бургеры&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Жидкий дым и наноэмульсия продлевают свежесть мидий су-вид до 24 дней&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/tvb-n.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Hello_Kitty\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hello Kitty — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/foods7100170\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Alginate-Based Edible Films and Coatings for Food Packaging Applications&lt;/a&gt; — обзор, Foods 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fnut.2022.1040259\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Impacts of turmeric and its principal bioactive curcumin on human health: Pharmaceutical, medicinal, and food applications: A comprehensive review&lt;/a&gt; — обзор, Front Nutr 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/antiox13081001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Potential Health Benefits of Gallic Acid: Therapeutic and Food Applications&lt;/a&gt; — обзор, Antioxidants (Basel) 2024&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Общий летучий основной азот (TVB-N) — это показатель свежести мяса, отражающий накопление продуктов распада белков и жизнедеятельности бактерий. Низкие значения"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"TVB-N","description":"Общий летучий основной азот (TVB-N) — это показатель свежести мяса, отражающий накопление продуктов распада белков и жизнедеятельности бактерий. Низкие значения","vcsPath":"concepts/tvb-n.md"},"headings":[{"title":"Определение","href":"concepts/tvb-n.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/tvb-n.html#obzor","level":2},{"title":"Теория","href":"concepts/tvb-n.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/tvb-n.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/tvb-n.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/tvb-n.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/tvb-n.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Как об этом пишут в статьях","href":"concepts/tvb-n.html#kak-ob-etom-pishut-v-statyah","level":2},{"title":"Справка","href":"concepts/tvb-n.html#spravka","level":2},{"title":"Другие названия","href":"concepts/tvb-n.html#drugie-nazvaniya","level":2},{"title":"Где встречается","href":"con
