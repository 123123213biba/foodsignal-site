        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-newfood.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-newfood.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Новая еда — это категория пищевых продуктов, полученных с помощью инновационных технологий производства или состоящих из нетрадиционных источников сырья. К ним относятся растительные аналоги продуктов животного происхождения, культивируемое мясо, белок насекомых, грибной мицелий и продукты, созданные методом 3D-печати. Цель развития этой области — повышение эффективности использования ресурсов и поиск альтернатив традиционному сельскому хозяйству.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-newfood.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Новая еда является видом пищевого продукта, который отличается от традиционных аналогов способом получения или составом. В основе концепции лежит принцип замены функциональных компонентов: например, использование растительных белков или клеточных культур вместо мышечной ткани животных. Эти продукты классифицируются по источнику сырья (растения, грибы, клетки) или технологии обработки (культивирование, экструзия, аддитивное производство).&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-newfood.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Производство новой еды базируется на процессах биоинженерии и пищевой химии. В случае с растительными аналогами используется текстурирование белков для имитации волокнистой структуры мяса. Культивируемое мясо представляет собой процесс выращивания мышечных клеток в биореакторах на питательных средах. 3D-печать еды — это метод послойного формирования пищевой массы с заданными параметрами формы и текстуры.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-newfood.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основными инструментами являются биореакторы для культивирования клеток, экструдеры для создания текстуры растительных белков и 3D-принтеры для моделирования структуры продукта. Важным этапом является подбор питательных сред, которые обеспечивают рост клеток без использования компонентов животного происхождения, что описано в статье «Клеточное мясо: арахис и киноа заменят животный белок в производстве».&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-newfood.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии новой еды применяются для создания продуктов, имитирующих привычные рационы. В статье «Почему мы выбираем растительный йогурт: вкус или этикетка?» рассматривается потребительское восприятие таких продуктов, где ключевую роль играет баланс между вкусовыми качествами и информацией о составе. Также методы используются для разработки функциональных продуктов питания, способных заменить традиционные источники белка.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-newfood.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основными ограничениями являются высокая стоимость производства, необходимость масштабирования технологий и строгий контроль безопасности. Новые источники сырья требуют оценки на предмет аллергенности и токсичности. Существуют риски, связанные с микробиологической безопасностью при внедрении новых процессов, а также необходимость соблюдения стандартов качества, аналогичных традиционным пищевым производствам.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Новая еда&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%96%D0%B0%D2%A3%D0%B0%20%D1%82%D0%B0%D2%93%D0%B0%D0%BC%5D%20--%3E%20B%5B%D3%A8%D1%81%D1%96%D0%BC%D0%B4%D1%96%D0%BA%20%D0%B0%D0%BD%D0%B0%D0%BB%D0%BE%D0%B3%D1%82%D0%B0%D1%80%D1%8B%5D%0A%20%20A%20--%3E%20C%5B%D0%9A%D1%83%D0%BB%D1%8C%D1%82%D0%B8%D0%B2%D0%B0%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D0%BD%D2%93%D0%B0%D0%BD%20%D0%B5%D1%82%5D%0A%20%20A%20--%3E%20D%5B%D0%96%D3%99%D0%BD%D0%B4%D1%96%D0%BA%D1%82%D0%B5%D1%80%20%D0%BC%D0%B5%D0%BD%20%D1%81%D0%B0%D2%A3%D1%8B%D1%80%D0%B0%D1%83%D2%9B%D2%B1%D0%BB%D0%B0%D2%9B%D1%82%D0%B0%D1%80%5D%0A%20%20A%20--%3E%20E%5B3D-%D0%B1%D0%B0%D1%81%D1%8B%D0%BF%20%D1%88%D1%8B%D2%93%D0%B0%D1%80%D1%83%5D%0A%20%20B%20--%3E%20F%5B%D0%A2%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%D0%BB%D0%B0%D1%83%5D%0A%20%20C%20--%3E%20G%5B%D0%91%D0%B8%D0%BE%D1%80%D0%B5%D0%B0%D0%BA%D1%82%D0%BE%D1%80%5D%0A%20%20E%20--%3E%20H%5B%D0%90%D0%B4%D0%B4%D0%B8%D1%82%D0%B8%D0%B2%D1%82%D1%96%20%D3%A9%D0%BD%D0%B4%D1%96%D1%80%D1%96%D1%81%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-newfood.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_based.html\"&gt;Растительные аналоги&lt;/a&gt; — Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-newfood.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Может ли продуктовая корзина заменить лекарства: опыт долгосрочной диеты&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Конопля и овес: как ферментация меняет структуру растительного белка&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Скрытая угроза в чечевице и нуте: как плесень меняет растительный белок&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;Почему мы выбираем растительный йогурт: вкус или этикетка?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html\"&gt;Клеточное мясо: арахис и киноа заменят животный белок в производстве&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-newfood.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AF%D0%BD%D0%B4%D0%B5%D0%BA%D1%81_%D0%95%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Яндекс Еда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3201/eid0304.970403\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Emerging foodborne diseases: an evolving public health challenge&lt;/a&gt; — обзор, Emerg Infect Dis 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.brainresbull.2018.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Konzo: a distinct neurological disease associated with food (cassava) cyanogenic poisoning&lt;/a&gt; — обзор, Brain Res Bull 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/advances/nmaa025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Back to the Roots: Revisiting the Use of the Fiber-Rich Cichorium intybusL. Taproots&lt;/a&gt; — обзор, Adv Nutr 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Новая еда","description":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.","vcsPath":"concepts/spec-newfood.md"},"heading
