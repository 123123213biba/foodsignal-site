        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-flavor.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-flavor.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Вкус и аромат — это комплексная система восприятия химических сигналов, поступающих от пищи. В отличие от простого вкуса, который ограничен пятью базовыми ощущениями (сладкий, соленый, кислый, горький, умами), аромат — это результат распознавания тысяч летучих органических соединений. Вместе они формируют «флейвор» (flavor), определяющий наше удовольствие от еды и биологическую ценность продукта.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-flavor.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Восприятие вкуса начинается с взаимодействия молекул пищи с рецепторами на языке. Аромат же подключается через ретроназальное обоняние: летучие вещества попадают из полости рта в носоглотку, где активируют обонятельные рецепторы. Ключевые понятия здесь — летучие органические соединения (ЛОС) и порог восприятия. Вкус и аромат тесно связаны с реакциями трансформации веществ, такими как реакция Майяра или карамелизация, которые создают новые молекулы, отсутствующие в сыром продукте. Эти процессы меняют химический профиль еды, превращая простые сахара и аминокислоты в сложные ароматические ансамбли.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-flavor.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Система работает как биохимический анализатор. Рецепторы на языке передают сигналы о базовых вкусах, а обонятельный эпителий в носу распознает профиль летучих соединений. Мозг объединяет эти данные в единый образ. Например, аромат риса басмати обусловлен специфическими соединениями, которые развиваются в процессе созревания зерна. Управление этим процессом возможно через изменение условий среды: температуру, давление или использование ферментации, что позволяет усиливать желаемые ноты или подавлять нежелательные.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-flavor.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для анализа вкуса и аромата используются методы газовой хроматографии и масс-спектрометрии, позволяющие идентифицировать каждое летучее соединение. В кулинарии инструментами управления выступают технологии сублимации, позволяющие сохранить исходные свойства продукта, или направленная ферментация, меняющая химический состав сырья без агрессивного термического воздействия.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-flavor.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Понимание химии вкуса позволяет создавать новые продукты и улучшать существующие. В статье «Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке» показано, как сублимация сохраняет нежный умами креветки, предотвращая появление «жареных» нот, возникающих при нагреве. В материале «Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель» описывается использование бактерий для изменения вкусового профиля корня, что позволяет получать подсластитель без сложной химии.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-flavor.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главная сложность заключается в нестабильности ароматических соединений. Многие из них легко окисляются или разрушаются при нагреве. Кроме того, индивидуальная чувствительность рецепторов и генетические факторы делают восприятие вкуса субъективным. Также важно помнить, что интенсивный вкус не всегда коррелирует с пользой продукта, а избыточное использование добавок может маскировать естественные дефекты сырья.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Вкус и аромат&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D1%8B%20%D0%BF%D0%B8%D1%89%D0%B8%5D%20--%3E%20B%5B%D0%AF%D0%B7%D1%8B%D0%BA%D0%BE%D0%B2%D1%8B%D0%B5%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D0%BE%D1%80%D1%8B%5D%0A%20%20A%20--%3E%20C%5B%D0%9E%D0%B1%D0%BE%D0%BD%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D0%BE%D1%80%D1%8B%5D%0A%20%20B%20--%3E%20D%5B%D0%A1%D0%B8%D0%B3%D0%BD%D0%B0%D0%BB%20%D0%B2%20%D0%BC%D0%BE%D0%B7%D0%B3%5D%0A%20%20C%20--%3E%20D%0A%20%20D%20--%3E%20E%5B%D0%92%D0%BE%D1%81%D0%BF%D1%80%D0%B8%D1%8F%D1%82%D0%B8%D0%B5%20%D0%B2%D0%BA%D1%83%D1%81%D0%B0%5D%0A%20%20D%20--%3E%20F%5B%D0%92%D0%BE%D1%81%D0%BF%D1%80%D0%B8%D1%8F%D1%82%D0%B8%D0%B5%20%D0%B0%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B0%5D%0A%20%20E%20--%3E%20G%5B%D0%A4%D0%BB%D0%B5%D0%B9%D0%B2%D0%BE%D1%80%5D%0A%20%20F%20--%3E%20G%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-flavor.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-lipid_aroma.html\"&gt;Окисление жиров и ароматы&lt;/a&gt; — Прогоркание, «рыбный» запах, ароматы жареного масла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-flavor.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Как поймать аромат жареного: новый биосенсор для определения пиразинов&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Самцы или самки: почему одни мидии в морозилке прогоркают быстрее других&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-flavor.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B0%D1%81%D0%BC%D0%B0%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Басмати — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — обзор, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41591-019-0675-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Chronic inflammation in the etiology of disease across the life span&lt;/a&gt; — обзор, Nat Med 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.12.4.564\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Plant products as antimicrobial agents&lt;/a&gt; — обзор, Clin Microbiol Rev 1999&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Вкус и аромат","description":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.","vcsPath":"concepts/spec-flavor.md"},"headings":[{"title":"Определение","href":"concepts/spec-flavor.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/spec-flavor.html#obzor","level":2},{"title":"Теория","href":"concepts/spec-flavor.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/spec-flavor.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/spec-flavor.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/spec-flavor.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/spec-flavor.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/spec-flavor.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/spec-flavor.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/spec-flavor.html#istochniki","level":2}],"title":"Вкус и аромат"},"router":{"pathname":"concepts/spec-flavor","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
