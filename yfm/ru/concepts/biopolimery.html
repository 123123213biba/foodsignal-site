        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Термин&lt;/strong&gt; · &lt;em&gt;Chitosan&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/biopolimery.jpg\" alt=\"Биополимеры\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Aariuser I, CC BY-SA 2.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Chitosan.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/biopolimery.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Биополимеры — это природные полимеры, такие как белки или полисахариды, используемые для создания экологически чистой упаковки. Они могут служить основой для активных пленок, защищающих продукты от внешней среды.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/biopolimery.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Биополимеры — это макромолекулы природного происхождения, которые входят в состав живых организмов и служат основой для создания экологически безопасных упаковочных материалов. В пищевой индустрии они применяются для разработки активных пленок и покрытий, способных продлевать срок годности продуктов и защищать их от микробиологической порчи.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/biopolimery.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Биополимеры являются классом полимеров, состоящих из повторяющихся структурных единиц — мономеров. К основным типам биополимеров относятся белки (мономеры — аминокислоты) и полисахариды (мономеры — моносахариды). В отличие от синтетических пластиков, биополимеры обладают способностью к биоразложению, что делает их перспективной альтернативой в производстве упаковки. Принцип их работы основан на создании барьера, который ограничивает доступ кислорода и влаги к продукту, а также может выступать носителем активных компонентов.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/biopolimery.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Биополимерная матрица формирует физический каркас, который удерживает активные вещества, такие как эфирные масла или растительные экстракты. Когда такая пленка или покрытие наносится на продукт, она создает микросреду, замедляющую рост бактерий и развитие плесени. Например, включение экстрактов грейпфрута или масла тимьяна в структуру полимера позволяет высвобождать антимикробные соединения постепенно, что предотвращает порчу мяса или овощей.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/biopolimery.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным инструментом является создание композитных материалов, где биополимер (например, желатин или хитозан) служит матрицей, а растительные добавки — функциональными агентами. Исследователи используют методы экстракции для получения активных веществ из отходов пищевого производства, таких как кожура цитрусовых. Полученные покрытия наносятся на поверхность продуктов методом окунания или распыления, создавая защитный слой.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/biopolimery.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии на основе биополимеров активно исследуются для решения задач хранения продуктов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В статье «Как кожура цитрусовых помогает дольше хранить куриные бургеры» описано применение желатиновой пленки с экстрактом грейпфрута, которая увеличивает срок свежести мяса в морозильной камере на 5 месяцев.&lt;/li&gt;\n&lt;li&gt;В работе «Как эфирное масло тимьяна помогает куриному филе дольше оставаться свежим» показано, что биоразлагаемая упаковка с маслом тимьяна эффективно замедляет рост бактерий на курином филе.&lt;/li&gt;\n&lt;li&gt;В исследовании «Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими» представлено съедобное покрытие из цитрусовых отходов, защищающее овощи от плесени.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/biopolimery.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Биополимерные упаковки пока не являются универсальным решением. Их эффективность зависит от условий хранения, состава продукта и концентрации активных веществ. Существуют сложности с масштабированием производства и обеспечением стабильности свойств пленок при длительном хранении. Кроме того, необходимо учитывать органолептические изменения: активные добавки, такие как эфирные масла, могут влиять на вкус и аромат продукта.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Биополимеры&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%91%D0%B8%D0%BE%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%5D%20--%3E%20B%5B%D0%90%D0%BA%D1%82%D0%B8%D0%B2%D0%BD%D1%8B%D0%B5%20%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8%5D%0A%20%20B%20--%3E%7C%D0%B8%D0%BD%D0%BA%D0%B0%D0%BF%D1%81%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%7C%20A%0A%20%20A%20--%3E%20C%5B%D0%97%D0%B0%D1%89%D0%B8%D1%82%D0%BD%D0%B0%D1%8F%20%D0%BF%D0%BB%D0%B5%D0%BD%D0%BA%D0%B0%5D%0A%20%20C%20--%3E%7C%D0%B1%D0%B0%D1%80%D1%8C%D0%B5%D1%80%7C%20D%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A%20%20D%20--%3E%7C%D1%83%D0%B2%D0%B5%D0%BB%D0%B8%D1%87%D0%B5%D0%BD%D0%B8%D0%B5%20%D1%81%D1%80%D0%BE%D0%BA%D0%B0%7C%20E%5B%D0%A5%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение проверено автоматически и ждёт утверждения редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/biopolimery.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Биополимеры — это природные полимеры (белки или полисахариды), которые можно использовать для создания экологически чистой упаковки, способной защищать продукты от внешней среды.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Как кожура цитрусовых помогает дольше хранить куриные бургеры&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/biopolimery.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;moisture_reduction&lt;/td&gt;\n&lt;td&gt;46.3% to 28.03%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/biopolimery.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;CTS, Хитозан&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/biopolimery.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Как кожура цитрусовых помогает дольше хранить куриные бургеры&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Хитозановая невидимая броня против гниения томатов и цитрусов&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html\"&gt;Как эфирное масло тимьяна помогает куриному филе дольше оставаться свежим&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/biopolimery.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Биополимеры — Википедия (ru)&lt;/a&gt;&lt;/li&g
