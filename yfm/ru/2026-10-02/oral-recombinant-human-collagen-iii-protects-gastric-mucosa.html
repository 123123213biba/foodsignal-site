        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"157\" cy=\"76\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"483\" cy=\"261\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Может ли коллаген защитить&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;желудок от последствий&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;алкоголя&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи изучили влияние рекомбинантного человеческого коллагена III типа (RC) на повреждения слизистой оболочки желудка, вызванные этанолом. В ходе экспериментов на клетках &lt;a href=\"concepts/ges-1-cells.html\"&gt;GES-1&lt;/a&gt; и крысах линии Wistar было доказано, что RC эффективно снижает площадь поражений. Механизм действия связан с активацией Pla2g4a-простагландинового пути через &lt;a href=\"concepts/gpaef-peptide.html\"&gt;пептид GPAEF&lt;/a&gt;, который стабилизирует &lt;a href=\"concepts/g-quadruplexes.html\"&gt;G-квадруплексы&lt;/a&gt; ДНК.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Рекомбинантный коллаген III типа снижает площадь повреждений слизистой желудка на 78%.&lt;/li&gt;\n&lt;li&gt;Пептид GPAEF активирует ген Pla2g4a, запуская синтез защитных простагландинов.&lt;/li&gt;\n&lt;li&gt;RC превосходит коммерческие аналоги животного происхождения по эффективности защиты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В исследовании использовался &lt;a href=\"concepts/recombinant-human-type-iii-collagen.html\"&gt;рекомбинантный человеческий коллаген III типа&lt;/a&gt; (RC), полученный биотехнологическим путем. В экспериментах на клетках GES-1 (линия эпителиальных клеток желудка человека) оптимальная концентрация для защиты определялась после воздействия 6% этанола, вызывающего 40% гибель клеток. Анализ показал, что RC способствует восстановлению митохондриального мембранного потенциала и снижает уровень активных форм кислорода (АФК), измеренных с помощью флуоресцентного зонда &lt;a href=\"concepts/dcfh-da.html\"&gt;DCFH-DA&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Ключевым открытием стало обнаружение пептида GPAEF, образующегося при расщеплении RC в желудке. Этот пентапептид с высокой аффинностью (в 13 раз выше, чем у тиофлавина Т) связывается с G-квадруплексами (G4) в промоторной области гена Pla2g4a. Это взаимодействие переводит структуру G4 в гибридную конформацию, активируя синтез простагландинов, которые отвечают за защиту слизистой и усиление кровотока. В тестах на крысах 30-дневный прием RC снизил площадь повреждений слизистой на 78% по сравнению с контрольной группой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на крысах и клеточных культурах, поэтому прямая экстраполяция дозировок для человека требует клинических испытаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"concepts/acute-gastric-mucosal-lesion.html\"&gt;Острое повреждение слизистой оболочки желудка&lt;/a&gt; (ОПСОЖ), вызванное этанолом, — это патологическое состояние, возникающее в результате кратковременного чрезмерного потребления высококонцентрированного этанола, что приводит к нарушению барьерной функции слизистой оболочки желудка. Основные патологические механизмы включают прямое растворение фосфолипидного бислоя на поверхности слизистой, избыточную выработку активных форм кислорода (АФК), индуцированную этанолом и его метаболитом ацетальдегидом, а также воспалительные реакции, которые разрушают плотные контакты, повышают проницаемость эпителия и способствуют инфильтрации воспалительных клеток. Эпидемиологические данные показывают, что у 15%–35% людей, злоупотребляющих алкоголем в течение короткого времени, развиваются эрозии слизистой оболочки желудка или геморрагический гастрит, а некоторые случаи прогрессируют до язвы желудка, перфорации или даже рака. Поскольку расстройства, связанные с употреблением алкоголя, продолжают расти во всем мире, заболевания, вызванные алкоголем, создают значительное медицинское и социально-экономическое бремя: только в 2018 году более 3 миллионов смертей были связаны со злоупотреблением этанолом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Острое повреждение слизистой желудка этанолом затрагивает до 35% пьющих людей, вызывая разрушение барьера слизистой через окислительный стресс и воспаление.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Текущее клиническое лечение ОПСОЖ, вызванного этанолом, в основном опирается на четыре терапевтические стратегии: (1) топические защитные средства, такие как антациды и сукральфат, которые нейтрализуют желудочную кислоту и образуют физический барьер на поверхности слизистой. (2) Антагонисты H2-рецепторов, такие как ранитидин, которые подавляют секрецию кислоты путем блокирования H2-рецепторов. (3) &lt;a href=\"concepts/ipp.html\"&gt;Ингибиторы протонной помпы&lt;/a&gt; (ИПП, включая омепразол и лансопразол), которые специфически ингибируют активность H+/K+-АТФазы париетальных клеток, тем самым блокируя терминальный этап секреции кислоты. (4) Аналоги простагландинов, которые усиливают защиту слизистой оболочки за счет увеличения кровотока и секреции слизи. Однако длительное применение антагонистов H2-рецепторов и ИПП связано с сердечно-сосудистой, печеночной и почечной токсичностью и может нарушать микробиоту кишечника, в то время как неселективные фармакологические эффекты аналогов простагландинов ограничивают их клиническую полезность из-за системных побочных реакций. Эти ограничения подчеркивают необходимость в более безопасных и механистически точных вмешательствах, особенно тех, которые основаны на биоактивных молекулах с мультимодальным регуляторным потенциалом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИПП (ингибиторы протонной помпы) — это препараты, которые «выключают» насосы в клетках желудка, производящие кислоту, что снижает кислотность желудочного сока.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В последние годы биоактивные компоненты, полученные из натуральных продуктов, привлекают все больше внимания в профилактике и лечении повреждений слизистой оболочки желудка. Сообщалось, что полисахариды оказывают защитное действие на слизистую оболочку посредством иммуномодуляции, фитохимические вещества широко изучаются благодаря своим многоцелевым антиоксидантным свойствам, а биоактивные пептиды (например, пшеничные пептиды, пептиды рыбного коллагена) продемонстрировали двойную антиоксидантную и противовоспалительную активность. Тем не менее, эта область все еще сталкивается с многочисленными техническими и концептуальными препятствиями. На уровне сырья коллагены растительного и животного происхождения часто проявляют высокую иммуногенность и неупорядоченную сборку фибрилл; традиционные методы экстракции не позволяют получить высокоочищенные, структурно определенные фракции коллагена, что затрудняет как клиническое применение, так и выяснение механизмов действия. На механистическом уровне большинство исследований избирательно нацелены на отдельные патологические звенья (такие как окислительный стресс или воспаление) и редко рассматривают, как координированные регуляторные сети перестраиваются во время повреждения и восстановления слизистой оболочки желудка. Продольные анализы динамических метаболических реакций в тканях желудка после вмешательства редки, и систематическая база для понимания метаболического перепрограммирования при ОПСОЖ все еще отсутствует. Более того, текущие исследования преимущественно сосредоточены на низкомолекулярных пептидах коллагена и продуктах их деградации (например, фрагментах глицил-пролина), исходя из предположения, что малые пептиды легче усваиваются и обладают большей биодоступностью. Этот акцент, возможно, привел к относительному пренебрежению механистическим исследованием самих макромолекулярных коллагенов, несмотря на их потенциальный вклад в структурную целостность, прочность и устойчивую биоактивность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Большинство исследований сфокусировано на фрагментах коллагена, игнорируя потенциал целых макромолекул, которые могут быть более эффективны для восстановления структуры ткани.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рекомбинантный человеческий коллаген III типа (rhColIII, RC), основной компонент внеклеточного матрикса, стал перспективным биоматериалом для восстановления тканей благодаря своей превосходной биосовместимости, отсутствию рисков, связанных с животным происхождением, и четко определенной молекулярной структуре. RC может действовать как биомиметический каркас для опосредования механической передачи сигналов, направления миграции эпителиальных клеток и модуляции взаимодействий «клетка-матрикс»; он также взаимодействует с интегриновыми рецепторами и нисходящими сигнальными путями, такими как FAK/RhoA/ROCK, тем самым способствуя активации фибробластов, синтезу внеклеточного матрикса и контролируемым воспалительным реакциям. Эти свойства обеспечивают прочную теоретическую основу для рассмотрения RC в качестве биоматериала-кандидата для защиты слизистой оболочки желудка. Однако существующие исследования RC в основном были сосредоточены на поверхностных тканях, таких как кожа и хрящи. Напротив, слизистая оболочка желудка постоянно подвергается воздействию уникально агрессивной среды, характеризующейся высокой кислотностью, динамическим механическим стрессом от перистальтики и сложными взаимодействиями с люминальными метаболитами и микробиотой. Эти особенности предполагают, что механизмы, с помощью которых RC модулирует восстановление слизистой оболочки желудка, могут принципиально отличаться от таковых в тканях кожи или хряща и не могут быть просто экстраполированы из предыдущих работ, что подчеркивает критический и до сих пор не изученный пробел в исследованиях. В этом исследовании мы систематически изучаем эффективность и механизм действия перорально вводимого рекомбинантного человеческого коллагена III типа (RC) в качестве гастропротекторного биоматериала при ОПСОЖ, вызванном этанолом. Используя клетки эпителия слизистой оболочки желудка человека GES-1, мы сначала оцениваем биобезопасность RC и определяем оптимальный диапазон защитных концентраций на клеточном уровне, закладывая основу для исследований in vivo.&lt;/p&gt;\n&lt;p&gt;Затем мы создаем крысиную модель ОПСОЖ, вызванного этанолом, и демонстрируем, что 30-дневное пероральное предварительное вмешательство с помощью RC заметно предотвращает повреждение слизистой оболочки желудка, уменьшая площадь поражения и улучшая гистологические и биохимические показатели по сравнению с коллагенами животного происхождения. Чтобы выяснить лежащий в основе механизм, мы интегрируем метаболомный и транскриптомный анализы и показываем, что RC индуцирует координированный трехсторонний ответ: поддержание редокс-гомеостаза за счет усиления антиоксидантных путей, центрированных на глутатионе, восстановление цитоскелетного и плотного контактного барьера для сохранения целостности слизистой оболочки и перестройку метаболически-воспалительных сетей в пользу эпителиальной регенерации — все это в совокупности отражает индуцированное RC метаболическое перепрограммирование ткани желудка. Центральное место в этих эффектах занимает ось Pla2g4a-простагландин (PG), посредством которой RC специфически вовлекает путь арахидоновая кислота-простагландин и способствует синтезу защитных медиаторов, связанных с простагландинами. Мы идентифицируем переваренный в желудке пентапептид GPAEF, полученный из RC, который селективно распознает и стабилизирует G-квадруплекс (G4) промотора Pla2g4a, способствует ремоделированию его ансамбля конформаций смешанного типа и стабилизирует комплекс пептид-G4; этот конформационный ответ может способствовать усилению транскрипции Pla2g4a и последующему биосинтезу PG. В совокупности наши результаты подтверждают многомасштабную механистическую модель, связывающую пероральное введение RC и генерацию GPAEF в желудке in vivo, экспериментально наблюдаемое in vitro взаимодействие между GPAEF и эпигенетическим регуляторным элементом G4 гена Pla2g4a, а также связанную с RC активацию оси Pla2g4a-простагландин, тем самым обеспечивая правдоподобную механистическую связь с защитой слизистой оболочки желудка. Эта работа устанавливает RC как безопасный и эффективный пероральный биоматериал для гастропатии, связанной с этанолом, и предоставляет механистическую основу для G4-опосредованной эпигенетико-метаболической регуляции в защите слизистой оболочки желудка.&lt;/p&gt;\n&lt;p&gt;Клетки GES-1 были получены от Baidi Biotechnology Co., Ltd (Чжэцзян, Китай). Рекомбинантный человеческий коллаген III типа (rhColIII, RC) был предоставлен Jiangsu Chuangjian Medical Technology Co., Ltd. Среда RPMI-1640, фетальная бычья сыворотка (FBS, Gibco), трипсин-ЭДТА (Gibco), антибиотическая смесь пенициллин-стрептомицин-неомицин (PSN) и PBS-буфер (pH 7,2) были приобретены у Sigma-Aldrich Inc. (США). Набор для анализа с флуоресцентным зондом 2,7-дихлорфлуоресцеин диацетатом (DCFH-DA), набор для обнаружения митохондриального мембранного потенциала (JC-1), набор для подсчета клеток (CCK-8) и набор для анализа белка BCA были приобретены у Beyotime Biotechnology Co., Ltd. (Шанхай, Китай). Безводный этанол аналитической чистоты был приобретен у Shanghai Guoyao. Набор для анализа восстановленного глутатиона (GSH) и набор для анализа супероксиддисмутазы (SOD) (метод WST-1) были приобретены в Нанкинском институте биоинженерии Jiancheng.&lt;/p&gt;\n&lt;p&gt;Клетки GES-1 культивировали в колбах площадью 75 см² со средой RPMI-1640, дополненной 10% (об./об.) FBS и антибиотической смесью пенициллин-стрептомицин-неомицин (PSN). Культуры инкубировали при 37°C в атмосфере 5% CO₂. Клетки промывали PBS (pH 7,2) и отделяли с помощью трипсина-ЭДТА. Чтобы изучить метод создания модели повреждения клеток GES-1, вызванного этанолом, клетки подвергали воздействию этанола в различных концентрациях: 5%, 6%, 7%, 8%, 9% и 10% в течение 1 часа для определения жизнеспособности клеток. Концентрация этанола, соответствующая жизнеспособности клеток примерно 60%, была выбрана в качестве оптимальной концентрации для моделирования. Клетки GES-1 предварительно обрабатывали различными концентрациями RC в течение 24 часов, после чего следовало воздействие этанола в выбранной концентрации в течение 1 часа. Впоследствии оценивали защитные эффекты RC на &lt;a href=\"concepts/zhiznesposobnost-kletok.html\"&gt;жизнеспособность клеток&lt;/a&gt;, окислительный стресс и воспаление.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жизнеспособность клеток — это процент «живых» клеток в культуре после воздействия повреждающего фактора (в данном случае этанола).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Повреждение&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;слизистой&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;желудка&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;этанолом&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Прием рекомбин&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;антного&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;коллагена III&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;типа&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Активация Pla2&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;g4a-&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;простагландино&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вого пути&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Новый подход к&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;защите стенок&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;желудка&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Advanced science (Weinheim, Baden-Wurttemberg, Germany). Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Advanced science (Weinheim, Baden-Wurttemberg, Germany) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;shelf_life&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Lan X, Dai Q, Wang Y, Gu J, Wang C, Xu W, Gao X, Cheng J, Geng W, Wu X, Li H, He X, Fu S, Zhu L, Xu W.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;
