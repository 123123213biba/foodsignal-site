            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"233\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"567\" cy=\"283\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PROBIOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Китайский напиток доужир&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;против гриппа: что нашла&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;наука&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи выделили из китайского ферментированного продукта &lt;a href=\"concepts/douzhier.html\"&gt;доужир&lt;/a&gt; штамм бактерий &lt;a href=\"concepts/lactococcus-lactis-subsp-cremoris-d2022.html\"&gt;Lactococcus lactis subsp. cremoris D2022&lt;/a&gt;. В экспериментах на мышах этот пробиотик показал способность облегчать течение гриппа А. Он помогает организму быстрее справляться с вирусом, регулируя иммунный ответ и снижая уровень воспаления.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Штамм D2022 повышает выживаемость при гриппе А на 30% за счет раннего ответа интерферона-бета.&lt;/li&gt;\n&lt;li&gt;Пробиотик снижает уровень воспаления (IL-1β, IL-6, TNF-α) на поздних стадиях инфекции.&lt;/li&gt;\n&lt;li&gt;Действие связано с изменением метаболитов в кишечнике, включая рост уровня короткоцепочечных жирных кислот.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Ученые использовали мышей линии C57BL/6J, которых заражали вирусом гриппа А (штамм PR8). Группа, получавшая ежедневно 2 × 10^9 КОЕ (колониеобразующих единиц) штамма D2022, показала выживаемость 30% против 0% в контрольной группе. Бактерии способствовали раннему выбросу интерферона-бета (IFN-β), что ускорило очистку организма от вируса.&lt;/p&gt;\n&lt;p&gt;На поздних стадиях инфекции (7-й день) пробиотик подавлял «&lt;a href=\"concepts/cytokine-storm.html\"&gt;цитокиновый шторм&lt;/a&gt;», снижая концентрацию провоспалительных маркеров IL-1β, IL-6 и TNF-α. Метаболомный анализ выявил рост уровня короткоцепочечных жирных кислот и деаминотирозина (DAT), которые, вероятно, участвуют в модуляции иммунитета. Исследование подтверждает, что специфические штаммы молочнокислых бактерий могут служить вспомогательным средством при вирусных инфекциях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на мышиной модели, поэтому прямая экстраполяция эффективности на людей требует клинических испытаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Дучжиэр (Douzhier) — традиционный китайский ферментированный продукт с более чем 1000-летней историей, восходящей к династии Сун. Он обладает специфическим вкусом и особо популярен среди жителей Пекина. Дучжиэр получают из маша путем спонтанной ферментации. Процесс прост: маш замомачивают в воде, измельчают и фильтруют для получения крахмального молока. В него добавляют закваску от предыдущей партии Дучжиэра и оставляют ферментироваться. При отстаивании смесь расслаивается по плотности на три слоя: нижний состоит в основном из крахмала; средний, богатый белком, известен как мадоуфу (традиционная пекинская закуска); верхний представляет собой серо-зеленую жидкость — сырой Дучжиэр. Затем сырой Дучжиэр дополнительно ферментируют и варят до готовности. Ранее было показано, что &lt;a href=\"concepts/fermentation.html\"&gt;ферментация&lt;/a&gt; сопровождается значительными изменениями микробиоты и образованием метаболитов, включая рост уровня свободных аминокислот.&lt;/p&gt;\n&lt;p&gt;Сезонный грипп остается серьезным бременем для мирового здравоохранения, ежегодно вызывая около 1 млрд случаев заражения, 3–5 млн тяжелых форм заболевания и 290 000–650 000 смертей от респираторных осложнений. В США в сезоне 2024–2025 годов грипп стал причиной порядка 51 млн заболеваний, 710 000 госпитализаций и 45 000 смертей. Вакцинация широко применяется для профилактики, однако ее эффективность снижается из-за высокой мутационной активности вируса, позволяющей ему ускользать от иммунного ответа даже при ежегодном обновлении штаммового состава вакцин. Малые молекулярные противовирусные препараты применяются для лечения уже много лет, но они не подходят для длительной профилактики и также рискуют потерять эффективность из-за формирования лекарственной устойчивости. В связи с этим необходимы новые подходы к профилактике и терапии гриппа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пробиотики защищают от вирусов через неспецифические механизмы хозяина (усиление ответа интерферонов I типа и подавление гиперинфламмации), которые устойчивы к мутациям вирусных антигенов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследования показывают, что защитное действие ряда пробиотиков против респираторных вирусов связано с опосредованными хозяином механизмами, включая усиление ответа интерферонов I типа и снижение избыточного воспаления. Такие механизмы менее чувствительны к антигенной изменчивости вируса, чем антигенспецифический иммунитет. Накапливаются данные о противогриппозной активности таких пробиотиков, как Lactococcus lactis, Lactobacillus plantarum, &lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt;, Akkermansia muciniphila и Bacteroides fragilis. При этом многие пробиотики можно вводить в состав ферментированных продуктов, что позволяет обеспечивать их длительное поступление с пищей для устойчивой защиты.&lt;/p&gt;\n&lt;p&gt;В микробиоте пекинского Дучжиэра доминирует вид Lactococcus lactis subsp. cremoris (L. cremoris). Этот организм активно используется в пищевой промышленности и входит в состав заквасок кефира и мацони (каспийского йогурта). Пробиотическая активность сильно зависит от конкретного штамма: например, штамм L. cremoris YRC3780 из кефира снижает аллергическое воспаление у мышей, а штамм L. cremoris FC из каспийского йогурта защищает от гриппа, снижая вирусную нагрузку в легких и смертность. В данном исследовании из Дучжиэра был изолирован новый штамм L. cremoris D2022. Цель работы — оценить его защитные свойства при инфекции вирусом гриппа А (IAV) у мышей и изучить ассоциированные биологические механизмы.&lt;/p&gt;\n&lt;p&gt;В работе использовали 120 самок мышей линии C57BL/6J в возрасте 6 недель (по 30 животных в 4 независимых экспериментах, разделенных на 3 группы по n = 10: контроль, IAV + PBS и IAV + D2022). Вирус гриппа A/Puerto Rico/8/34 (H1N1 PR8) нарабатывали на клетках MDCK. Штамм L. cremoris D2022 изолировали из Дучжиэра, проводили полногеномное секвенирование (BioProject PRJNA1014919) и оценивали его кверцетин-деградирующую активность.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Оценка титра вируса в бляшкообразующих единицах (&lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;PFU&lt;/a&gt;) и бактерий в колониеобразующих единицах (CFU/мл) — это стандартные методы точного подсчета количества жизнеспособных вирусных частиц и бактериальных клеток в образце.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мышам ежедневно перорально вводили 200 мкл суспензии L. cremoris D2022 (2 × 10⁹ CFU) или PBS с -5 по 7 день относительно заражения. Заражение проводили интраназально под анестезией 1% пентобарбиталом: нелетальной дозой 450 PFU (эксперименты 1–3, выведение из опыта на 1, 3 и 7 dpi) или летальной дозой 900 PFU (эксперимент 4, наблюдение выживаемости до 14 dpi). Определяли индекс легких [масса легких (г) / масса тела (г) × 100%], длину толстой кишки, вирусную нагрузку методом ОТ-ПЦР в реальном времени (ABI 7500 Fast), а также проводили гистопатологическую оценку срезов легких толщиной 5 мкм (окраска гематоксилином и эозином) по шкале от 1 до 4.&lt;/p&gt;\n&lt;p&gt;Уровни 8 цитокинов и хемокинов (IL-1β, IL-6, TNF-α, KC/CXCL1, IL-4, IL-10, IL-12, IFN-γ) в сыворотке и гомогенатах легких измеряли на мультиплексном анализаторе Luminex 200. Транскриптомный анализ легких выполняли путем секвенирования RNA на платформе BGISEQ-500 (NCBI SRA: PRJNA1100256, PRJNA1102099) с последующим биоинформатическим анализом (SOAPnuke, Bowtie2, HISAT, RSEM, GSEA). Белки NF-κB-пути (P65, p-P65, IκBα, p-IκBα) определяли вестерн-блоттингом с нормировкой на β-actin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Таргетный метаболомный анализ HM700 на хромато-масс-спектрометре &lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;UPLC&lt;/a&gt;-MS/MS позволяет одновременно и с высокой точностью измерить концентрации более 700 ключевых малых метаболитов в биообразцах.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В опытах in vitro незрелые дендритные клетки костного мозга мышей (mBMDCs), выделенные с помощью магнитного сепарирования (CD11c Nanobeads), сокультивировали с D2022 в соотношении бактерия:клетка 10:1 в течение 24 ч, после чего методом ИФА (&lt;a href=\"concepts/elisa.html\"&gt;ELISA&lt;/a&gt;) определяли уровень IFN-β. Метаболомный анализ содержимого слепой кишки проводили методом UPLC-MS/MS (системы UPLC I-Class Plus и QTRAP 6500 Plus) с идентификацией по базам KEGG и HMDB. Клеточный иммунный ответ анализировали методом проточной цитометрии (FACSCalibur) на спленоцитах (1 × 10⁶ клеток/лунка) и методом ELISpot (iSpot Spectrum) по секреции IFN-γ в ответ на стимуляцию пептидами гемагглютинина (HA, 5 мкг/мл).&lt;/p&gt;\n&lt;p&gt;Образцы Дучжиэра содержали около 3 × 10⁷ CFU/мл бактерий, где доминировал штамм L. cremoris D2022. Штамм является грамположительным и расщепляет около 65% кверцетина (Рис. SN2). Его геном имеет размер 2,63 Мб с GC-составом 35,42% (NCBI BioProject PRJNA1014919). В геноме обнаружен кандидатный гомолог гидролазы солей желчных кислот (BSH) с относительно низкой идентичностью последовательности к эталону, тогда как гомологи 7α-дегидратазы BaiE отсутствовали (Таблица S1, Таблица S2, Рис. SN1).&lt;/p&gt;\n&lt;p&gt;При нелетальном заражении IAV мыши, получавшие L. cremoris D2022, к 7 дню демонстративно превосходили группу PBS по индексу легких (1,48 ± 0,16 против 2,06 ± 0,32), длине толстой кишки (7,78 ± 0,17 см против 6,82 ± 0,20 см) и сохранению массы тела (83,6 ± 5,22% против 75,3 ± 4,66%) (Рис. 1C–E). На 3 dpi у мышей группы D2022 вирусная нагрузка в легких была существенно ниже (146 000 ± 56 000 PFU против 396 000 ± 220 000 PFU в контроле); к 7 dpi различия сгладились (3700 ± 1800 PFU против 4800 ± 3600 PFU) (Рис. 1F–G). При летальном заражении (900 PFU) в группе PBS погибли 100% животных к 13 dpi, тогда как в группе D2022 выжили 30% (3 из 10 мышей) к 14 dpi (Рис. 1B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Применение L. cremoris D2022 повысило выживаемость мышей при летальном гриппе с 0% до 30%, снизило вирусную нагрузку в легких на 3 dpi в 2,7 раза и уменьшило гистологический счет повреждения легких с 1,72 до 1,26.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гистологически у мышей группы D2022 отмечалось уменьшение утолщения межальвеолярных перегородок, снижение инфильтрации воспалительными клетками, уменьшение периваскулярного отека, сохранение структуры бронхиального эпителия и снижение общего патологического балла с 1,72 ± 0,38 до 1,26 ± 0,42 (Рис. 2A–D).&lt;/p&gt;\n&lt;p&gt;Анализ цитокинового профиля показал, что на 3 dpi D2022 слабо влиял на медиаторы воспаления. Однако на 7 dpi в легких и сыворотке группы D2022 достоверно снизились уровни провоспалительных цитокинов IL-6, KC (CXCL1), IL-1β и TNF-α, а также IL-10 (Рис. 3, Рис. 4). При этом показатели адаптивного иммунитета (IL-12 и IFN-γ) продемонстрировали тенденцию к росту.&lt;/p&gt;\n&lt;p&gt;Транскриптомный анализ легких выявил 495 дифференциально экспрессирующихся генов (DEG) на 1 dpi (391 активирован, 104 подавлен) и 627 DEG на 7 dpi (268 активировано, 359 подавлено) (Рис. 5A,B). На 1 dpi метод GSEA зафиксировал активацию путей RIG-I-подобных, Toll-подобных рецепторов и JAK-STAT, ассоциированных с интерферонами (IRF1, IRF7, IFN-α, IFN-β, ISGs, OAS) (Рис. 5C–G). На 7 dpi подавлялись пути IL-17, NF-κB, NOD-подобных рецепторов и TNF (гены IL-1β, IL-6, TNF-α, NLRP3, S100a9) (Рис. 5H–L). Вестерн-блоттинг подтвердил снижение уровня фосфорилированных белков p-P65 и p-IκBα к 7 dpi (Рис. 6).&lt;/p&gt;\n&lt;p&gt;Сокультивирование mBMDCs с D2022 достоверно увеличивало продукцию IFN-β in vitro (Рис. 7A). В легких мышей группы D2022 экспрессия IFN-β остро возрастала уже на 1 dpi, значительно превосходя контроль PBS (Рис. 7B–D). Анализ метаболома слепой кишки показал, что D2022 предотвращает обусловленное гриппом падение короткоцепочечных жирных кислот (масляной и пропионовой), вторичных желчных кислот (UDCA, Iso-UDCA, IsoalloLCA) и дезаминотирозина (DAT) (Рис. 8). Проточная цитометрия и ELISpot на 7 dpi зафиксировали увеличение доли IFN-γ-секретирующих CD4+ и CD8+ T-клеток, а также числа вирус-специфических T-лимфоцитов (Рис. 9).&lt;/p&gt;\n&lt;p&gt;Результаты исследования показывают, что штамм L. cremoris D2022 из традиционного продукта Дучжиэр эффективно защищает мышей от вируса гриппа А. Пероральный прием бактерий снижает вирусную нагрузку на ранней стадии (3 dpi) и снижает смертность при летальной инфекции. Механизм раннего ограничения репликации вируса связан с быстрым запуском ответа интерферонов I типа (в частности, IFN-β и ISG) уже в 1-е сутки. Этому способствует способность D2022 расщеплять флавоноиды (кверцетин) с образованием дезаминотирозина (DAT) — метаболита, усиливающего интерфероновый сигнал.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Противовирусный эффект L. cremoris D2022 реализуется в два этапа: быстрая индукция IFN-β на 1 dpi сдерживает размножение вируса, а последующее снижение активности NF-κB к 7 dpi предотвращает цитокиновый шторм.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На поздней стадии инфекции (7 dpi) D2022 проявляет выраженное иммуномодулирующее действие, подавляя сигнальные пути NF-κB, NOD, IL-17 и TNF. Это приводит к снижению концентрации провоспалительных цитокинов (IL-1β, IL-6, TNF-α, KC) и предохраняет ткани легких и кишечника от гипервоспалительного повреждения.&lt;/p&gt;\n&lt;p&gt;Важную роль в иммунорегуляции играют кишечные метаболиты: штамм D2022 восстанавливает уровень масляной и пропионовой кислот, а также вторичных желчных кислот (UDCA, IsoalloLCA). Известно, что эти соединения способствуют дифференцировке регуляторных T-клеток (Treg), сдерживающих аутоопасные воспалительные реакции. Кроме того, D2022 ускоряет формирование специфического T-клеточного адаптивного ответа (увеличивая продукцию IFN-γ спленоцитами).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Противовоспалительные эффекты пробиотика могут сильно зависеть от наличия в рационе пищевых волокон и пребиотиков, необходимых бактериям для выработки защитных метаболитов.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Практическая ценность работы заключается в том, что штаммы L. cremoris из ферментированных продуктов (таких как Дучжиэр, кефир или йогурты) могут использоваться в качестве функциональных пищевых компонентов для системной профилактики респираторных вирусных инфекций. На производстве данный штамм может применяться при создании пробиотических заквасок. В бытовых условиях регулярное употребление ферментированных продуктов, богатых L. cremoris, в сочетании с достаточным количеством пребиотической клетчатки в рационе представляет собой доступную стратегию укрепления противовирусного иммунитета.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутагенность&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вируса гриппа&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тестирование&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;штамма D2022&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на мышах&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Снижение&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;воспаления и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рост&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выживаемости&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Перспективный&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пробиотик для&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;поддержки&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;иммунитета&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Nutrients. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead
