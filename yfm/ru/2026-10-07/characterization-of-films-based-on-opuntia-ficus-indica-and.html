            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"181\" cy=\"148\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"579\" cy=\"233\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PACKAGING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кактус вместо пластика:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;новая жизнь отходов опунции&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;в упаковке&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f1.jpg\" alt=\"(a) Толщина, (b) прочность на разрыв и (c) относительное удлинение при разрыве пленок на основе OFICP/пектина\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Толщина, (b) прочность на разрыв и (c) относительное удлинение при разрыве пленок на основе OFICP/пектина&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи разработали экологичную упаковку на основе порошка из высушенных стеблей опунции и пектина. Этот материал полностью разлагается в почве за 28 дней. Пленка обладает высокой прочностью и защищает продукты от ультрафиолета, что делает ее перспективной альтернативой традиционному пластику.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Прочность пленки увеличилась на 232% при добавлении пектина.&lt;/li&gt;\n&lt;li&gt;Материал полностью распадается в почве в течение 28 дней.&lt;/li&gt;\n&lt;li&gt;Высокая непрозрачность защищает продукты от ультрафиолета.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Для создания пленки использовали порошок из высушенных стеблей опунции (OFICP) в количестве 2 г, 30% глицерина в качестве пластификатора и варьируемое количество пектина (от 0,5 до 2,0 г). Увеличение доли пектина в составе значительно улучшило механические свойства материала: предел прочности при растяжении вырос на 232% (с 2,62 до 8,69 МПа) при переходе от состава F1 к F3.&lt;/p&gt;\n&lt;p&gt;Материал обладает гидрофильными свойствами, что подтверждается низкими углами контакта (30,29–39,39°) и высоким содержанием влаги (25,11–35,98%). Испытания в почве показали, что пленки начинают визуально разрушаться уже на 12-й день, а к 28-му дню процесс распада становится практически полным. Высокая непрозрачность пленок (22–25%) позволяет использовать их для защиты жиросодержащих продуктов от окисления под действием света.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в лабораторных условиях, поэтому требуется дополнительная проверка свойств пленки при различных режимах хранения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Пластиковая упаковка широко используется в пищевой промышленности, однако её способность сохраняться в окружающей среде столетиями стимулирует интерес к биоразлагаемым альтернативам. Целью данного исследования была разработка биоразлагаемой пленки с использованием порошка лиофилизированных кладодий Opuntia ficus-indica (OFICP) (2 г), глицерина (30% по массе) и различного количества коммерческого пектина: 0,5 г (F1), 1,0 г (F2), 1,5 г (F3) и 2,0 г (F4). Влияние содержания пектина на механические, термические, структурные, цветовые и влагозависимые свойства пленок оценивалось систематически, наряду с их биоразлагаемостью в почве и имитируемых морских условиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Увеличение содержания пектина повысило прочность на разрыв на 232% (с 2,62 до 8,69 МПа) и улучшило термическую стабильность пленок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Составы с более высоким содержанием пектина продемонстрировали улучшенные механические характеристики, включая увеличение прочности на разрыв на 232% от F1 (2,62) до F3 (8,69), а также повышенную термическую стабильность. Из-за гидрофильной природы пектина и OFICP пленки показали низкие углы контакта (30,29–39,39°) и высокое содержание влаги (25,11–35,98%). Учитывая гидрофильность и влагозависимые свойства, данные пленки могут быть более пригодны для упаковки пищевых продуктов с низким содержанием влаги; однако для подтверждения их пригодности необходимы дальнейшие исследования в различных условиях хранения и окружающей среды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в лабораторных условиях; для подтверждения пригодности пленок для реальных продуктов питания требуются дополнительные испытания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Более того, в экспериментальных условиях пленки показали прогрессирующую визуальную дезинтеграцию в почве: составы F1 и F2 продемонстрировали значительное разрушение к 12-му дню, а все составы практически полностью разрушились к 28-му дню. Таким образом, полученные результаты свидетельствуют о том, что смешивание OFICP с коммерческим пектином позволяет создавать пленки с улучшенными свойствами, имеющие потенциал применения в пищевой упаковке. Кроме того, переработка побочных продуктов Opuntia ficus-indica представляет собой экологически ответственный подход к управлению сельскохозяйственными отходами, поддерживая разработку биоматериалов нового поколения для упаковки пищевых продуктов.&lt;/p&gt;\n&lt;p&gt;Ключевые слова: Полисахариды · Кактус · Устойчивое развитие · Пищевая упаковка · Лиофилизированный · Побочный продукт&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Растущая обеспокоенность экологическими последствиями интенсивного использования пластиковой упаковки стимулировала поиск устойчивых альтернатив, особенно в пищевом секторе, где объемы утилизации материалов высоки. Пластиковая упаковка, преимущественно производимая из невозобновляемых источников, не подвергается биоразложению и вносит значительный вклад в загрязнение окружающей среды и накопление твердых отходов. В этом контексте биоразлагаемые пленки, изготовленные из природных биополимеров, стали перспективным решением, сочетающим технологическую функциональность с меньшим воздействием на окружающую среду, что соответствует принципам экономики замкнутого цикла и устойчивого развития.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биоразлагаемые пленки из природных полимеров предлагают экологичную альтернативу традиционному пластику, соответствуя принципам устойчивого развития.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Среди этих материалов полисахариды растительного происхождения привлекают особое внимание благодаря своему структурному разнообразию и способности формировать непрерывные полимерные матрицы. В этом отношении Opuntia ficus-indica, вид кактуса, широко культивируемый в полузасушливых регионах, представляет собой перспективный, но недостаточно изученный ресурс. Его кладодии образуются в больших количествах при сельскохозяйственных работах и часто выбрасываются или используются не в полной мере, несмотря на то, что они богаты полисахаридами, пищевыми волокнами и другими функциональными компонентами. Недавние исследования показали, что материалы, полученные из кладодиев Opuntia ficus-indica, могут быть использованы для производства биоразлагаемых пленок с приемлемыми механическими и барьерными свойствами. Однако многие из этих подходов основаны на экстракции слизи или специфических фракций, что увеличивает сложность переработки и ограничивает масштабируемость. Альтернативной стратегией является прямое использование цельных кладодиев после сушки, что позволяет полностью переработать биомассу, упрощая этапы обработки. &lt;a href=\"concepts/vfd.html\"&gt;Лиофилизация&lt;/a&gt; (сублимационная сушка) позволяет сохранить структурные компоненты и облегчает получение однородных порошков, пригодных для создания пленок.&lt;/p&gt;\n&lt;p&gt;Несмотря на свой потенциал, пленки на биологической основе часто требуют добавления дополнительных молекул в состав для оптимизации таких характеристик, как гибкость и механическая прочность. Пектин, полисахарид, богатый остатками галактуроновой кислоты и обычно получаемый из цитрусовых, является эффективным вариантом для этой цели. Благодаря своим внутренним гелеобразующим и пленкообразующим способностям он хорошо интегрируется в биоразлагаемые матрицы, улучшая их механические, термические и барьерные характеристики. Таким образом, его включение в состав пленок способствует разработке материалов с повышенной структурной стабильностью и функциональной эффективностью. Пластификаторы также необходимы в пленках на основе биополимеров для преодоления хрупкости и улучшения гибкости. Глицерин является одним из наиболее часто используемых пластификаторов благодаря своей совместимости с гидрофильными полимерами и способности увеличивать подвижность цепей. Комбинация материала, полученного из кладодиев Opuntia ficus-indica, пектина и глицерина, представляет собой стратегию рецептуры, которая использует взаимодополняющие характеристики этих компонентов и может улучшить эксплуатационные качества пленок.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Лиофилизация — это метод удаления влаги из замороженного продукта в вакууме, позволяющий сохранить структуру и свойства сырья.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя в ряде исследований изучались пленки, полученные из Opuntia ficus-indica или пектина по отдельности, исследования их совместного использования остаются ограниченными. Понимание того, как содержание пектина влияет на физико-химические, механические, термические и барьерные свойства пленок, включающих порошок лиофилизированных кладодиев Opuntia ficus-indica, имеет важное значение для развития производства экологически устойчивых упаковочных материалов. Поэтому целью данного исследования была разработка и характеристика биоразлагаемых смесовых пленок на основе порошка лиофилизированных кладодиев Opuntia ficus-indica (OFICP), пектина и глицерина, а также оценка их физико-химических, механических, термических и барьерных свойств для определения их пригодности для потенциального применения в пищевой упаковке.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"vneshnij-vid-plenki\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#vneshnij-vid-plenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внешний вид пленки&lt;/span&gt;&lt;/a&gt;Внешний вид пленки&lt;/h4&gt;\n&lt;p&gt;Первоначально были проведены предварительные испытания по формированию пленок с использованием различных концентраций OFICP и глицерина. Однако эти составы приводили к получению хрупких материалов, которые было трудно отделить от чашек Петри, и они не подходили для использования или дальнейшей характеризации. В результате в качестве контрольной системы был выбран состав только из пектина (2 г пектина + глицерин), который послужил эталонной матрицей для сравнения с композитными пленками OFICP/пектин. Кроме того, все композитные составы (F1–F4) позволили получить однородные пленки без видимых трещин или пузырьков воздуха, с которыми было легко работать (Рис. S1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование только пектина в качестве контроля позволило создать стабильную матрицу, в то время как все композитные составы (F1–F4) сформировали однородные и удобные в обращении пленки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"svojstva,-svyazannye-s-vodoj\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#svojstva,-svyazannye-s-vodoj\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Свойства, связанные с водой&lt;/span&gt;&lt;/a&gt;Свойства, связанные с водой&lt;/h4&gt;\n&lt;p&gt;Вода существенно влияет как на визуальное качество, так и на процессы порчи пищевых продуктов, что делает ее ключевым фактором поддержания безопасности при хранении. Чтобы обеспечить защиту продуктов, упаковочные материалы должны эффективно контролировать перенос влаги, выступая в качестве барьера против внешней влажности. Поэтому оценка свойств, связанных с водой, таких как содержание влаги, угол контакта, активность воды (Aw) и паропроницаемость (WVP), имеет важное значение для понимания и оптимизации характеристик пленок из смеси OFICP/пектин. В Таблице 1 представлены содержание влаги, Aw, WVP, угол контакта и изображение капли воды на поверхности пленок. Содержание влаги в пленках варьировалось в зависимости от состава. Что касается смешанных пленок, увеличение содержания пектина до 1,5 г приводило к снижению содержания влаги. Это можно объяснить образованием водородных связей между OFICP и пектином, что уменьшает количество групп –OH, способных взаимодействовать с водой. Эти результаты согласуются с предыдущими исследованиями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Активность воды (Aw) — это показатель доступности свободной воды в продукте или материале, которая может способствовать росту микроорганизмов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поскольку объем раствора для формирования пленки был одинаковым для всех образцов, а содержание сухих веществ варьировалось, толщина пленок не контролировалась как независимая переменная, что могло повлиять на результаты WVP.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Включение OFICP повлияло на значения Aw и WVP, которые следовали определенной тенденции: по мере увеличения содержания пектина паропроницаемость и активность воды также возрастали, что указывает на более проницаемую структуру. Активность воды варьировалась от 0,408 в F1 до 0,470 в контрольной пленке, что ниже значений, сообщенных в литературе для пленок на основе пектина (0,614–0,652). Несмотря на различия, полученные значения Aw отражают низкое содержание свободной воды внутри матрицы пленки, что согласуется с физико-химическими свойствами используемых полимеров. Следует отметить, что различия в толщине пленок между составами могли способствовать наблюдаемым вариациям WVP и механических свойств. Значения WVP варьировались от 2,78 (г·м⁻¹·с⁻¹·Па⁻¹) для контрольной пленки до 0,54 (г·м⁻¹·с⁻¹·Па⁻¹) для состава F4. Наиболее высокие значения наблюдались в составах F3 и F4, которые значительно отличались от F1 и контрольной пленки. Это увеличение можно объяснить добавлением твердых веществ в составы, в частности, большими количествами пектина, добавленного к самому OFICP. Кроме того, необходимо учитывать гидрофильный характер как полимеров, так и пластификатора, поскольку гигроскопичность глицерина способствует более сильному взаимодействию с молекулами воды, усиливая поглощение и проницаемость, при этом снижая барьерные свойства пленки.&lt;/p&gt;\n&lt;p&gt;Таблица 1 Содержание влаги, активность воды (Aw), паропроницаемость (WVP), угол контакта и изображение капли воды на поверхности C = контрольная пленка (2 г пектина); F1 (0,5 г пектина + 2 г OFICP), F2 (1,0 г пектина + 2 г OFICP), F3 (1,5 г пектина + 2 г OFICP), F4 (2 г пектина + 2 г OFICP). Среднее значение из трех измерений со стандартным отклонением, одинаковая буква в столбце указывает на отсутствие значимой разницы между средними значениями по тесту Тьюки (p &amp;lt; 0,05).&lt;/p&gt;\n&lt;p&gt;Угол контакта дает представление о смачиваемости поверхности пленок. Меньшие углы (&amp;lt; 90°) указывают на высокую смачиваемость, тогда как большие углы (&amp;gt; 90°) свидетельствуют о более гидрофобной поверхности. Все пленки в этом исследовании имели углы контакта менее 90°, что подтверждает их гидрофильную природу. Среди них только контрольная пленка показала значительно больший угол контакта (p &amp;lt; 0,05), что указывает на менее смачиваемую поверхность по сравнению со смешанными составами. Эти результаты согласуются с предыдущими исследованиями: сообщалось о значениях угла контакта 26,94° для пленок крахмал/OFICP без обработки pH, в то время как для пленок OFICP–агар, содержащих 30% (мас./мас.) глицерина, наблюдались значения 26,40°. Интересно, что было также продемонстрировано, что регулировка pH может сильно влиять на смачиваемость, при этом для пленок крахмал/OFICP, обработанных при pH 12, сообщалось об угле контакта 70,85°. Это позволяет предположить, что модификация pH OFICP может быть перспективной стратегией для настройки гидрофобности поверхности в будущих составах.&lt;/p&gt;\n&lt;h4 id=\"neprozrachnost-i-cvet-plenok\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#neprozrachnost-i-cvet-plenok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Непрозрачность и цвет пленок&lt;/span&gt;&lt;/a&gt;Непрозрачность и цвет пленок&lt;/h4&gt;\n&lt;p&gt;Толщина пленки играет решающую роль в определении их общих характеристик, существенно влияя на такие свойства, как механическая прочность, барьерная эффективность и удобство в обращении. Рис. 1 показывает толщину и механические свойства разработанных пленок. Как показано на Рис. 1a, увеличение содержания пектина в смесях привело к получению более толстых пленок: значения толщины варьировались от 0,137 мм для состава F1 до 0,177 мм для F4. Эта тенденция была ожидаемой из-за увеличения содержания сухих веществ.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f1.jpg\" alt=\"(a) Толщина, (b) прочность на разрыв и (c) относительное удлинение при разрыве пленок на основе OFICP/пектина\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Толщина, (b) прочность на разрыв и (c) относительное удлинение при разрыве пленок на основе OFICP/пектина&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"mehanicheskie-svojstva\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#mehanicheskie-svojstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механические свойства&lt;/span&gt;&lt;/a&gt;Механические свойства&lt;/h4&gt;\n&lt;p&gt;Контрольный состав, содержащий 2 г пектина без добавления OFICP, использовался в качестве эталонной пленки для оценки влияния порошка кладодий на свойства биоразлагаемых пленок. Что касается прочности на разрыв (Рис. 1b), контрольная пленка (C) продемонстрировала самое высокое значение (15,23 МПа), значительно превосходя все остальные составы. Напротив, прочность на разрыв пленок OFICP/пектин постепенно увеличивалась от F1 (2,62 МПа) до F3 (8,69 МПа), при этом существенной разницы между F3 и F4 не наблюдалось. Это плато предполагает, что упрочняющий эффект пектина может достигать точки насыщения после определенной концентрации, после чего дальнейшего увеличения прочности на разрыв не происходит. *C = контрольная пленка (2 г пектина); F1 = (0,5 г пектина + 2 г OFICP), F2 = (1,0 г пектина + 2 г OFICP), F3 = (1,5 г пектина + 2 г OFICP), F4 = (2 г пектина + 2 г OFICP). По сравнению с предыдущими исследованиями, текущие результаты демонстрируют заметное улучшение. Де Фариас и соавт. сообщили о более низкой прочности на разрыв (3,0 МПа) для пленок, состоящих из крахмала и OFICP, в то время как Махлуфи и соавт. наблюдали значение 6,7 МПа для пленок, содержащих агар, OFICP и 30% глицерина (по массе). Эти сравнения подчеркивают потенциал умеренных концентраций пектина для значительного повышения прочности на разрыв пленок на основе кактуса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контрольная пленка обладает максимальной прочностью (15,23 МПа), но минимальной эластичностью (1,86%), тогда как добавление OFICP повышает гибкость пленок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Механические свойства пленок выявили типичный компромисс между прочностью на разрыв и удлинением. Контрольная пленка показала самую высокую прочность на разрыв, что указывает на способность выдерживать большую силу до разрушения. Однако она также показала самое низкое удлинение при разрыве (1,86%), что свидетельствует о жесткой и хрупкой структуре с ограниченной гибкостью. Напротив, составы F1 и F2 продемонстрировали значительно меньшую прочность на разрыв, но более высокие значения удлинения (10,30% и 12,46% соответственно), что отражает более эластичную и пластичную природу. В результате, хотя эти пленки более подвержены разрыву под воздействием сильной нагрузки, они лучше способны растягиваться и адаптироваться к механическому напряжению. Эти данные подчеркивают многофункциональную роль OFICP в модуляции баланса между прочностью и гибкостью при разработке биоразлагаемых пленок: контрольная пленка более устойчива, но хрупка, а пленка F2 менее устойчива, но более гибкая.&lt;/p&gt;\n&lt;h4 id=\"termicheskaya-stabilnost\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#termicheskaya-stabilnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Термическая стабильность&lt;/span&gt;&lt;/a&gt;Термическая стабильность&lt;/h4&gt;\n&lt;p&gt;Оценка деградации. Поведение пленок при распаде оценивалось как в почвенных, так и в морских условиях. Процесс деградации различных составов оценивался качественно путем визуального осмотра образцов с течением времени. Из-за сильного прилипания частиц почвы к поверхностям пленок измерения потери массы были невозможны; поэтому визуальный анализ был принят в качестве основного метода мониторинга процесса деградации. Структура пленок постепенно разрушалась с течением времени (Рис. SN4). К шестому дню испытаний все образцы пленок претерпели значительные изменения в цвете и структурной целостности, что указывало на начало деградации полимера. Этот процесс, по-видимому, в основном обусловлен влажностью окружающей среды и температурой, которые вызывают набухание пленки и последующую фрагментацию. К 12-му дню пленки F1 и F2 почти полностью деградировали, тогда как составы с более высоким содержанием пектина показали большую устойчивость к разложению. Это явление можно объяснить высоким сродством порошка кладодий Opuntia ficus-indica к воде: пленки с более выраженным гидрофильным характером позволяют влаге и микроорганизмам легче проникать в их структуру, что ускоряет процесс деградации. К 28-му дню все составы подверглись обширному распаду, и оставшиеся фрагменты пленок уже не отличались визуально от окружающей почвы. Этот распад происходил значительно быстрее, чем обычно наблюдается для традиционной пластиковой упаковки. Эти результаты согласуются с предыдущими данными Маннаи и соавт. и Лопес-Диас и соавт., которые сообщали о столь же быстром разрушении пленок на основе слизи Opuntia ficus-indica и питайи (Hylocereus undatus) в течение 28–40 дней в почве и органическом компосте соответственно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка деградации проводилась визуально; для точного определения кинетики распада требуются количественные методы (например, измерение выделения CO₂).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В имитационном тесте на деградацию в морской среде все образцы пленок полностью распались в течение 2 часов 55 минут. Эта быстрая деградация была ожидаемой, учитывая гидрофильную природу полимеров, присутствующих в матрице пленки, особенно OFICP и пектина. Хотя эти результаты предоставляют качественные доказательства деградации в экологически значимых условиях, необходимы количественные анализы с использованием стандартизированных методов (например, потеря массы при контролируемом компостировании, выделение CO₂ или тесты на биоразлагаемость по стандартам ASTM/ISO) для точного определения кинетики деградации и обеспечения более полных сравнений с традиционными материалами.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;В данном исследовании были успешно разработаны и охарактеризованы биоразлагаемые пленки на основе порошка кладодий Opuntia ficus-indica и пектина, что подчеркивает значимость природных макромолекул, в частности полисахаридов, для создания экологически устойчивой упаковки. Результаты показывают, что комбинация порошка кладодий Opuntia ficus-indica (OFICP) и пектина позволяет получить пленки с адекватными механическими характеристиками, хорошей термической стабильностью и эффективной биоразлагаемостью как в почвенных, так и в морских условиях. Примечательно, что увеличение содержания пектина улучшило ряд свойств пленок, при этом составы F3 и F4 продемонстрировали наиболее сбалансированные показатели по результатам всех оценок.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Составы F3 и F4 показали наилучший баланс механических и термических свойств, что делает их перспективными для упаковки продуктов с низкой влажностью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Благодаря своей гидрофильной природе и физико-химическим характеристикам, данные пленки могут быть потенциально использованы в системах биоразлагаемой упаковки и смежных областях, особенно для продуктов с низким содержанием влаги. Тем не менее, необходимы дополнительные исследования с использованием реальных моделей пищевых продуктов и условий хранения для подтверждения их пригодности для упаковки пищевых продуктов. Кроме того, использование недостаточно востребованных полисахаридов, таких как цельные кладодии Opuntia ficus-indica, в сочетании с коммерческим пектином представляет собой перспективную стратегию разработки устойчивых биоматериалов с потенциальной экологической выгодой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные результаты получены в лабораторных условиях; для подтверждения пригодности пленок в качестве пищевой упаковки требуются испытания с реальными продуктами питания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Материалы и методы представлены в качестве дополнительных материалов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f2.jpg\" alt=\"Инфракрасная спектроскопия (ИК-Фурье) (a) пленок и (b) сырья; а также рентгеновская дифракция (XRD) (c) пленок и (d) сыр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Инфракрасная спектроскопия (ИК-Фурье) (a) пленок и (b) сырья; а также рентгеновская дифракция (XRD) (c) пленок и (d) сырья&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Загрязнение&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;среды&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пластиком&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Смешивание&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;порошка&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;опунции и&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пектина&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Прочная&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;биоразлагаемая&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пленка&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Экологичная&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;упаковка для&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;продуктов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Plant foods for human nutrition (Dordrecht, Netherlands). Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Plant foods for human nutrition (Dordrecht, Netherlands) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;packaging&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Coqueiro JM, Brandão JM, Atanes SP, Fernandes SS, Otero DM.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13601191\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://link.springer.com/content/pdf/10.1007/s11130-026-01570-5.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;link.springer.com&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Копия PDF&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/VivaLyaRaza/biorxiv-digest/releases/download/issue-2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;github.com&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.1007/s11130-026-01570-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&
