            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"100\" cy=\"80\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"600\" cy=\"254\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · STARCH   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Цинк против углеводного&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;стресса: как накормить рыбу&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;правильно&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f1.jpg\" alt=\"Содержание Zn в организме, гепатопанкреасе и мышцах (A), а также удержание Zn\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Содержание Zn в организме, гепатопанкреасе и мышцах (A), а также удержание Zn&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Содержание Zn в организме, гепатопанкреасе и мышцах (A), а также удержание Zn (B) у M. salmoides при кормлении рационами с разным уровнем Zn. Уровень значимости установлен на p &amp;lt; 0,05, n = 3 в группе. Начальное содержание цинка в организме составляло 19,2 мг/кг. Символы звездочки указывают на значимые различия при * p &amp;lt; 0,05.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Избыток крахмала в кормах для рыб приводит к накоплению гликогена в печени и нарушению инсулинового ответа. Исследование на большеротом окуне показало, что &lt;a href=\"concepts/zinc.html\"&gt;цинк&lt;/a&gt; выступает как ключевой регулятор метаболизма. Добавка 150 мг/кг цинка улучшает работу ферментов и восстанавливает чувствительность тканей к инсулину. Это знание помогает оптимизировать рецептуры кормов в аквакультуре.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Цинк восстанавливает активность ферментов гликолиза, подавленных избытком крахмала.&lt;/li&gt;\n&lt;li&gt;Добавка 150 мг/кг цинка улучшает чувствительность к инсулину через путь PI3K/AKT.&lt;/li&gt;\n&lt;li&gt;Высокоуглеводные корма без цинка вызывают гликогеновую гепатопатию у окуня.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В эксперименте использовали 600 особей &lt;a href=\"concepts/micropterus-salmoides.html\"&gt;Micropterus salmoides&lt;/a&gt;, разделенных на группы с разным содержанием крахмала (11,5% в контроле и 16,3% в опытных) и цинка (0, 20 и 150 мг/кг). Высокоуглеводная диета без цинка (HS-LZn) вызывала накопление гликогена в гепатопанкреасе и подавляла активность ключевых ферментов гликолиза: гексокиназы (HK), фосфофруктокиназы (PFK) и пируваткиназы (PK). Также наблюдалось снижение уровня фосфорилированного AKT (p-AKT), что указывает на развитие инсулинорезистентности.&lt;/p&gt;\n&lt;p&gt;Добавление 150 мг/кг цинка (HS-HZn) значимо повысило активность HK, PFK, цитратсинтазы (CS) и кислой альфа-глюкозидазы (GAA). Иммунофлуоресцентный анализ подтвердил восстановление сигнального пути PI3K/AKT, что критически важно для метаболизма глюкозы. При этом избыточное накопление жира не было зафиксировано, что подчеркивает специфическое влияние цинка именно на углеводный обмен в условиях стресса от крахмала.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на одном виде рыб в контролируемых лабораторных условиях, поэтому результаты могут отличаться для других видов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Углеводы являются основным источником энергии для рыб, превосходя по этому показателю жиры и белки. Включение углеводов в рацион фермерских рыб способствует удержанию белка и липидов, снижает азотную нагрузку на сточные воды аквакультуры и повышает стабильность гранул корма. Однако из-за ограниченной способности рыб метаболизировать углеводы, повышение их уровня в рационе требует решения проблем, связанных с метаболическими нарушениями, вызванными глюкозой (Glu). Одним из таких состояний является гликогенная гепатопатия, характеризующаяся избыточным накоплением гликогена в гепатоцитах. Золотым стандартом диагностики этого обратимого состояния является окрашивание по Шиффу (PAS-окрашивание).&lt;/p&gt;\n&lt;p&gt;Инсулин играет ключевую роль в метаболизме Glu у рыб, аналогично млекопитающим. Рыбы в целом считаются нетолерантными к Glu, а высококрахмальные диеты вызывают у них стойкую гипергликемию. Наиболее распространенной гипотезой непереносимости Glu является инсулинорезистентность, вызванная генетическими или средовыми факторами, в частности составом рациона. На клеточном уровне она проявляется в нарушении захвата и использования Glu тканями, а на молекулярном — в сбоях сигнальных путей инсулина. Цинк (Zn) является важным микроэлементом, участвующим в секреции и чувствительности к инсулину. У людей инсулин существует в форме гексамерных кристаллов, содержащих два иона Zn²⁺ и один Ca²⁺. У крыс добавки Zn повышали чувствительность к инсулину. В данном исследовании большеротый окунь (&lt;em&gt;Micropterus salmoides&lt;/em&gt;), склонный к инсулинорезистентности, был выбран для изучения влияния цинка на метаболические нарушения, вызванные высококрахмальной диетой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Высококрахмальные диеты вызывают у рыб метаболические нарушения, включая гликогенную гепатопатию и инсулинорезистентность, а цинк рассматривается как потенциальный агент для улучшения чувствительности к инсулину.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В заключение, высококрахмальные диеты снижали потребление корма и приводили к выраженному накоплению гликогена, однако улучшали использование корма и удержание белка. Цинк облегчал аномальное накопление гликогена в печени, потенциально за счет усиления гликофагии. Кроме того, цинк усиливал фосфорилирование AKT, что указывает на его способность улучшать чувствительность к инсулину. Нецелевая метаболомика показала, что высококрахмальные диеты без добавок Zn подавляли множество путей метаболизма аминокислот. Изменение состава растительного белка является фактором, влияющим на результаты данного исследования.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f1.jpg\" alt=\"Содержание Zn в организме, гепатопанкреасе и мышцах (A), а также удержание Zn\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Содержание Zn в организме, гепатопанкреасе и мышцах (A), а также удержание Zn&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Содержание Zn в организме, гепатопанкреасе и мышцах (A), а также удержание Zn (B) у M. salmoides при кормлении рационами с разным уровнем Zn. Уровень значимости установлен на p &amp;lt; 0,05, n = 3 в группе. Начальное содержание цинка в организме составляло 19,2 мг/кг. Символы звездочки указывают на значимые различия при * p &amp;lt; 0,05.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f2.jpg\" alt=\"Химический состав организма (A) и мышц (B), а также удержание белка и энергии (C) у M. salmoides при кормлении рационами\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Химический состав организма (A) и мышц (B), а также удержание белка и энергии (C) у M. salmoides при кормлении рационами с разным уровнем Zn. Уровень значимости установлен на p &amp;lt; 0,05, n = 3 в группе. Символы звездочки указывают на значимые различия при * p &amp;lt; 0,05.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f3.jpg\" alt=\"Метаболизм гликогена и гликолиз у M. salmoides при кормлении рационами с разным уровнем Zn.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Метаболизм гликогена и гликолиз у M. salmoides при кормлении рационами с разным уровнем Zn.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Метаболизм гликогена и гликолиз у M. salmoides при кормлении рационами с разным уровнем Zn. (A) Содержание гликогена в гепатопанкреасе и мышцах. (B) Гликолиз в гепатопанкреасе. (C, D) Метаболизм гликогена в гепатопанкреасе. Уровень значимости установлен на p &amp;lt; 0,05, n = 3 в группе. CS, цитратсинтаза; GAA, кислая альфа-глюкозидаза; gabarapl1, белок, ассоциированный с рецептором гамма-аминомасляной кислоты; GPa, гликогенфосфорилаза a; GS, гликогенсинтаза; GSK-3β, гликогенсинтаза-киназа-3β; HK, гексокиназа; PFK, фосфофруктокиназа-1; PK, пируваткиназа; stbd1, домен связывания крахмала 1. Символы звездочки указывают на значимые различия при * p &amp;lt; 0,05.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f4.jpg\" alt=\"Липидный обмен у M. salmoides при кормлении рационами с разным уровнем Zn.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Липидный обмен у M. salmoides при кормлении рационами с разным уровнем Zn.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Липидный обмен у M. salmoides при кормлении рационами с разным уровнем Zn. (A, B) Гистология гепатопанкреаса и статистика площади окрашивания по результатам окрашивания масляным красным О. (C) Содержание липидов в тканях. (D, E) Параметры липидного обмена в сыворотке крови и гепатопанкреасе. (F) Экспрессия генов, участвующих в липидном обмене. Уровень значимости установлен на p &amp;lt; 0,05, n = 3 в группе. acadm, ацил-КоА-дегидрогеназа средней цепи; acc1, ацетил-КоА-карбоксилаза 1; atgl, адипозная триглицеридлипаза; cpt1, карнитинпальмитоилтрансфераза 1; dgat1, диацилглицерол-О-ацилтрансфераза 1; fasn, синтаза жирных кислот; gpat4, глицерол-3-фосфат-ацилтрансфераза 4; hadh, гидроксиацил-КоА-дегидрогеназа; HDL-C, холестерин липопротеинов высокой плотности; hsl, гормон-чувствительная липаза; LDL-C, холестерин липопротеинов низкой плотности; lpin1, аутосомно-рецессивный липин-1; lpl, липопротеинлипаза; pparα, пероксисомный пролифератор-активируемый рецептор α; TBA, общие желчные кислоты; TC, общий холестерин; TG, триглицериды. Символы звездочки указывают на значимые различия при * p &amp;lt; 0,05.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f5.jpg\" alt=\"Внутрибрюшинный тест на толерантность к глюкозе у M. salmoides при кормлении рационами с разным уровнем Zn.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Внутрибрюшинный тест на толерантность к глюкозе у M. salmoides при кормлении рационами с разным уровнем Zn.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Внутрибрюшинный тест на толерантность к глюкозе у M. salmoides при кормлении рационами с разным уровнем Zn. (A, B, C) Уровни TC, TG и Glu в сыворотке крови, а также AUC и &lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;iAUC&lt;/a&gt;. Уровень значимости установлен на p &amp;lt; 0,05, n = 3 в группе. AUC, площадь под кривой; Glu, глюкоза; iAUC, инкрементальная площадь под кривой; TC, общий холестерин; TG, триглицериды. Символы звездочки указывают на значимые различия при * p &amp;lt; 0,05.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f6.jpg\" alt=\"Внутрибрюшинный тест на толерантность к инсулину у M. salmoides, получавших рационы с различным содержанием цинка.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Внутрибрюшинный тест на толерантность к инсулину у M. salmoides, получавших рационы с различным содержанием цинка.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Внутрибрюшинный тест на толерантность к инсулину у M. salmoides, получавших рационы с различным содержанием цинка. (A, B, C) Уровни общего холестерина (TC), триглицеридов (TG) и глюкозы (Glu) в сыворотке крови, а также AUC и iAUC. Уровень значимости установлен на p &amp;lt; 0,05, n = 3 в группе. AUC — площадь под кривой; Glu — глюкоза; iAUC — инкрементальная площадь под кривой; TC — общий холестерин; TG — триглицериды. Звездочками отмечены статистически значимые различия при * p &amp;lt; 0,05.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f7.jpg\" alt=\"Влияние пищевого цинка на сигнальный путь инсулина.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Влияние пищевого цинка на сигнальный путь инсулина.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Влияние пищевого цинка на сигнальный путь инсулина. (A, D, F) Репрезентативные конфокальные изображения и статистика совместного окрашивания PI3K (зеленый) и p-AKT (красный) в гепатопанкреасе. (B) Уровень инсулина в сыворотке крови. (C) Экспрессия генов, участвующих в сигнальном пути инсулина. (E, G) Экспрессия белков p-AKT и PI3K в гепатопанкреасе. Уровень значимости установлен на p &amp;lt; 0,05, n = 3 в группе. akt1 — серин/треонинкиназа 1; foxo1 — транскрипционный фактор forkhead FKHR; glut2 — SLC2A2, кодирующий транспортер глюкозы 2; ira — рецептор инсулина a; irb — рецептор инсулина b; pi3kr1 — фосфатидилинозитол-3-киназа p85 α. Звездочками отмечены статистически значимые различия при * p &amp;lt; 0,05.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-f8.jpg\" alt=\"Набор данных нецелевой метаболомики M. salmoides, получавших рационы с различным содержанием цинка.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Набор данных нецелевой метаболомики M. salmoides, получавших рационы с различным содержанием цинка.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Набор данных нецелевой метаболомики M. salmoides, получавших рационы с различным содержанием цинка. (A) Количество достоверно различающихся метаболитов в трех группах сравнения (HS-LZn против контроля, HS-MZn против контроля, HS-LZn против HS-MZn). (B) Анализ главных компонент (PCA) профилей нецелевых метаболитов. (C, D) График обогащения метаболических путей KEGG (пузырьковая диаграмма) и оценка дифференциальной представленности между двумя группами сравнения (HS-LZn против контроля, HS-MZn против контроля). (E) Дифференциально представленные метаболиты, общие для двух групп сравнения (HS-LZn против контроля, HS-MZn против контроля). Звездочками отмечены статистически значимые различия при * p &amp;lt; 0,05 и ** p &amp;lt; 0,01.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Инсулинорезист&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ентность от&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;крахмала&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Добавки цинка&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;в рацион окуня&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Восстановление&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;метаболизма&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;глюкозы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Оптимизация&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;состава рыбных&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кормов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Aquaculture nutrition. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Aquaculture nutrition (Europe PMC)&lt;/td&gt;\n&lt;td&gt;starch&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Shi B, Yu X, Yin Z, Wang B, Kang J, Zhang B, Dong Z, Liang X, Cai W, Zhang Y.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13598439\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&
