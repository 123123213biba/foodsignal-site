        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"212\" cy=\"141\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"528\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · VOLATILES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Самцы или самки: почему одни&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мидии в морозилке прогоркают&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;быстрее других&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f1.jpg\" alt=\"Изменения физико-химических показателей качества мидий мужских и женских особей при замороженном хранении.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Изменения физико-химических показателей качества мидий мужских и женских особей при замороженном хранении.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Изменения физико-химических показателей качества мидий мужских и женских особей при замороженном хранении. (a) Центробежные потери. (b) Содержание общего летучего азота (&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt;). (c) Содержание малонового диальдегида (MDA). (d) ΔE. (e) Твердость. (f) Жевательная способность. Примечание: в (a–f) ** означает p &amp;lt; 0,01, *** означает p &amp;lt; 0,001. Разные строчные буквы в верхнем индексе (a, b, c) обозначают значимые различия между сроками хранения у самцов (p &amp;lt; 0,05), а разные заглавные буквы в верхнем индексе (A, B, C) обозначают значимые различия между сроками хранения у самок (p &amp;lt; 0,05); d: дни.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Разделение мидий по полу перед заморозкой звучит необычно, но биохимия доказывает его обоснованность. За 150 дней хранения при -18 °C самки и самцы толстостенной мидии (Mytilus coruscus) теряют свежесть с разной скоростью. Самки активнее накапливают продукты окисления жиров и альдегиды с прогорклым запахом. Самцы, напротив, сильнее теряют соки при размораживании, но лучше сохраняют глутаминовую кислоту и другие предшественники вкуса.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;При заморозке до 150 дней уровень окисления жиров (MDA) у самок мидий в 1,7 раза выше, чем у самцов&lt;/li&gt;\n&lt;li&gt;Самцы сильнее теряют влагу (потери в 1,5 раза выше нормы), но сохраняют больше свободных аминокислот&lt;/li&gt;\n&lt;li&gt;Накопление кетона 1-пентен-3-он напрямую связано с разрушением полезных омега-3 кислот EPA и DHA&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В эксперименте китайских биохимиков исследовали моллюсков Mytilus coruscus, отобранных в марте на стадии активного развития гонад. Пол определяли визуально по цвету мантии: оранжево-желтые гонады у самок, молочно-белые — у самцов. Образцы хранили при -18 °C в полиэтиленовых пакетах в течение 0, 90 и 150 дней, контролируя порчу с помощью Кьельдаля и газовой хромато-ион-подвижностной спектрометрии (GC-IMS). К 150-му дню центрифугационные потери влаги выросли в 1,2 раза у самок и в 1,5 раза у самцов по сравнению со свежими тканями, а летучий азот (TVB-N) увеличился в 2,7 и 2,4 раза соответственно.&lt;/p&gt;\n&lt;p&gt;Главный маркер прогоркания — &lt;a href=\"concepts/malondialdehyde.html\"&gt;малоновый диальдегид&lt;/a&gt; (MDA) — вырос у обоих полов примерно в 3,3 раза, однако его абсолютная концентрация у самок оказалась в 1,7 раза выше, чем у самцов. Это объясняется особенностями липидного метаболизма: женские особи накапливают больше альдегидов уже к 90-му дню. Спектрометрия выявила 14 ключевых дифференцирующих летучих веществ. В частности, кетон 1-пентен-3-он, коррелирующий с накоплением MDA, выраженно нарастает при распаде полиненасыщенных жирных кислот: эйкозапентаеновой (EPA), докозагексаеновой (DHA) и арахидоновой (ARA). Самцы же на протяжении всего срока демонстрировали более высокий пул свободных аминокислот, отвечая за стабильный умами-профиль.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось только на одной партии мидий, собранных в марте в преднерестовый период, поэтому результаты могут отличаться для моллюсков, выловленных осенью или зимой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Мидия толстораковинная (Mytilus coruscus) — экономически важный вид двустворчатых моллюсков, широко культивируемый вдоль побережья Китая. Согласно «Китайскому статистическому ежегоднику по рыболовству 2026», объем морской аквакультуры мидий в Китае в 2025 году достиг 780 900 т. Свежие мидии ценятся за характерный вкус и текстуру, однако они быстро портятся при хранении, что ограничивает срок их годности и рыночную привлекательность. Замораживание широко используется для длительного хранения, так как оно эффективно подавляет рост микроорганизмов и замедляет ферментативные реакции. Из-за высокого содержания влаги и нежной структуры тканей мидии подвержены ухудшению качества при длительном замораживании, что может приводить к миграции воды, деградации белков, окислению липидов и повреждению структуры кристаллами льда, снижая влагоудерживающую способность и ухудшая текстуру и профиль вкусоароматических веществ.&lt;/p&gt;\n&lt;p&gt;Вкус является важным показателем качества, влияющим на потребительское восприятие. Аромат связан в основном с летучими органическими соединениями (ЛОС), а вкус определяется свободными аминокислотами (САК), органическими кислотами и 5′-нуклеотидами. Летучие и нелетучие компоненты вкуса тесно взаимосвязаны, так как аминокислоты, жирные кислоты и другие предшественники вкуса могут подвергаться деградации или окислению в процессе хранения. Восстановление активности остаточных ферментов при размораживании может способствовать трансформации белков и 5′-нуклеотидов. В частности, деградация белков и малых пептидов изменяет уровни САК, а превращение аденозинтрифосфата (АТФ) модифицирует состав аденозин-5′-монофосфата (5′-АМФ), инозин-5′-монофосфата (5′-ИМФ) и других нуклеотидов. Ненасыщенные жирные кислоты подвержены окислению с образованием низкомолекулярных летучих соединений, таких как альдегиды, кетоны и спирты, некоторые из которых придают прогорклый запах. Таким образом, эволюция вкуса при замораживании отражает совокупный эффект деградации белков, превращения нуклеотидов и окисления липидов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эволюция вкуса при замораживании мидий обусловлена комплексными биохимическими процессами: деградацией белков, превращением нуклеотидов и окислением липидов, что приводит к изменению сенсорных характеристик.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЛОС (летучие органические соединения) — вещества, отвечающие за аромат продукта; САК (свободные аминокислоты) и нуклеотиды — ключевые компоненты, формирующие вкус (например, «умами»).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является наблюдательным: изменения вкусового профиля зависят от множества факторов, включая пол моллюска и условия хранения, что требует комплексного анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Предыдущие исследования часто рассматривали эти показатели отдельно. Интегрированный анализ нелетучих вкусовых соединений, состава жирных кислот и ЛОС необходим для более полного понимания эволюции вкуса. Газовая хроматография с ионно-подвижностной спектрометрией (ГХ-ИПС) характеризуется быстрым анализом и высокой чувствительностью, что делает её подходящей для мониторинга профилей летучих веществ. Помимо длительности хранения, на вкусовые характеристики могут влиять биологические различия между полами. У мидий раздельнополость, и в период размножения самцы и самки различаются по цвету гонад и составу питательных веществ. Исследования показывают, что самцы могут иметь более высокое содержание эйкозапентаеновой (ЭПК) и докозагексаеновой (ДГК) кислот, а также различия в метаболизме.&lt;/p&gt;\n&lt;p&gt;Целью данного исследования было изучение самок и самцов Mytilus coruscus при хранении при −18 °C в течение 0, 90 и 150 дней. Были определены изменения уровней САК, 5′-нуклеотидов, эквивалентной концентрации умами (ЭКУ) и состава жирных кислот. Параллельно оценивались показатели качества: малоновый диальдегид (МДА), общее содержание летучего азота (ОСЛА), центробежные потери и текстурные свойства.&lt;/p&gt;\n&lt;p&gt;Растворители степени чистоты для &lt;a href=\"concepts/hplc.html\"&gt;ВЭЖХ&lt;/a&gt; были приобретены у Fisher Chemical (США). Набор для анализа МДА — у Нанкинского института биоинженерии (Китай). Стандарты аминокислот и набор для дериватизации — у Welch Materials Co., Ltd. (Шанхай, Китай). Стандарты нуклеотидов и органических кислот — у Tanmo Quality Inspection Technology Co., Ltd. (Пекин, Китай). Стандартные смеси метиловых эфиров жирных кислот (МЭЖК) — у ANPEL Laboratory Technologies Inc. (Шанхай, Китай). Ультрачистая вода получена с помощью системы Milli-Q (Millipore, США). Остальные химикаты были аналитической чистоты (Sinopharm Chemical Reagent Co., Ltd., Китай).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ВЭЖХ (высокоэффективная жидкостная хроматография) — метод разделения и анализа смесей веществ, позволяющий точно определить концентрацию отдельных компонентов, таких как аминокислоты или нуклеотиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Живые мидии M. coruscus были собраны в марте 2025 года в провинции Шаньдун (возраст 2–3 года). В этот период мидии находились в стадии активного развития гонад перед весенним нерестом. Образцы транспортировались в лабораторию в охлаждаемых боксах (4 °C) в течение 2 часов. После промывки морской водой (соленость 28 PSU) были отобраны мидии со средними размерами: длина раковины 97,99 ± 3,96 мм, ширина 45,99 ± 2,87 мм, высота 31,88 ± 1,70 мм, масса тела 48,96 ± 6,36 г. Пол определяли визуально: оранжево-желтые гонады — самки, молочно-белые — самцы. Пищеварительный тракт удаляли вручную. Для каждого пола 90 мидий были распределены на три срока хранения (0, 90, 150 дней), по 30 особей на точку. Каждая группа была разделена на три биологические повторности по 10 особей (n = 3). Мидии упаковывали в полиэтиленовые пакеты (10 см × 20 см, толщина 0,20 мм) в один слой. Для физических измерений использовали 2 мидии из каждой повторности, для химических — оставшиеся 8 мидий, которые гомогенизировали в жидком азоте и хранили при −80 °C.&lt;/p&gt;\n&lt;p&gt;Центробежные потери отражают влагоудерживающую способность. Размороженный образец (m1) помещали в центрифужную пробирку с абсорбирующей ватой и центрифугировали при 3000 об/мин в течение 15 минут. После центрифугирования образец взвешивали (m2). Расчет: Центробежные потери (%) = (m1 − m2) / m1 × 100%.&lt;/p&gt;\n&lt;p&gt;ОСЛА определяли согласно китайскому стандарту [27]. 3 г порошкообразного образца смешивали с 20 мл дистиллированной воды и 1 г оксида магния. Анализ проводили на анализаторе азота по Кьельдалю (K1160, Hanon, Китай).&lt;/p&gt;\n&lt;p&gt;МДА определяли методом с тиобарбитуровой кислотой (ТБК) с использованием набора (A003-1, Нанкин, Китай). Ткани мидий гомогенизировали с физиологическим раствором (1:9, вес/объем) в ледяной бане. Гомогенат центрифугировали при 3500 об/мин (10 мин, 4 °C). Супернатант смешивали с реагентами, нагревали при 95 °C в течение 40 минут, охлаждали и повторно центрифугировали. Абсорбцию измеряли при 532 нм на спектрофотометре Multiskan SkyHigh (Thermo Scientific, Сингапур). Концентрацию белка определяли методом Брэдфорда. Результаты выражали в нмоль/мг белка.&lt;/p&gt;\n&lt;p&gt;Цветовые параметры (L*, a*, b*) измеряли спектроколориметром RM200QC (X-Rite, США). Общее цветовое различие (ΔE) рассчитывали относительно свежих образцов (F0 для самок, M0 для самцов): ΔE = √((L1 − L0)² + (a1 − a0)² + (b1 − b0)²). Текстурный анализ (TPA) проводили на анализаторе текстуры (CT3, Brookfield, США) с использованием сферического зонда (TA43, диаметр 25,4 мм). Условия: скорость теста 1 мм/мин, сжатие 20%, триггерная сила 2 Н.&lt;/p&gt;\n&lt;p&gt;САК определяли методом ВЭЖХ после экстракции 5% трихлоруксусной кислотой. Дериватизацию проводили набором Yuexu (Welch Materials, Китай). Использовали систему Agilent 1260 с колонкой Ultimate Amino Acid (4,6 мм × 250 мм, 5 мкм). Подвижная фаза А: 0,1 моль/л ацетатный буфер (pH 6,50) — ацетонитрил (93:7); фаза Б: ацетонитрил — вода (80:20). Скорость потока 1,00 мл/мин, температура колонки 40 °C, детектирование при 254 нм. Таурин определяли согласно GB 5009.169-2016.&lt;/p&gt;\n&lt;p&gt;Использовали систему Agilent 1260 с колонкой CAPCELL PAK C18 SG (4,6 мм × 150 мм, 5 мкм). Подвижная фаза: 20 ммоль/л фосфорная кислота, 20 ммоль/л лимонная кислота, 40 ммоль/л триэтиламин. Скорость потока 1,00 мл/мин, детектирование при 254 нм.&lt;/p&gt;\n&lt;p&gt;ЭКУ (г глутамата натрия/100 г) рассчитывали по формуле: ЭКУ = Σ(ai × bi) + 1218 × Σ(ai × bi) × Σ(aj × bj), где ai — концентрация аминокислот умами (Асп, Глу), bi — коэффициент свежести (Асп 0,077, Глу 1,0), aj — концентрация нуклеотидов (ИМФ, ГМФ, АМФ), bj — коэффициент свежести (ИМФ 1,0, ГМФ 2,3, АМФ 0,18).&lt;/p&gt;\n&lt;p&gt;Анализ проводили согласно GB 5009.168-2016. Липиды экстрагировали петролейным эфиром, омыляли гидроксидом натрия в метаноле и метилировали трифторидом бора. МЭЖК анализировали на газовом хроматографе Agilent 8890 с колонкой DB-Fast FAME (20 м × 0,18 мм, 0,20 мкм). Температурная программа: 80–220 °C (25 °C/мин), затем до 245 °C (5 °C/мин). Детектор FID при 250 °C.&lt;/p&gt;\n&lt;p&gt;Анализ летучих соединений проводили на приборе FlavourSpec® (G.A.S., Германия). 2,00 г гомогената инкубировали при 60 °C в течение 10 минут (500 об/мин). Газ-носитель — азот. Идентификация проводилась по времени удерживания и времени дрейфа в сравнении с базами данных NIST и IMS.&lt;/p&gt;\n&lt;p&gt;Результаты представлены как среднее ± стандартное отклонение (n = 3). Использовали однофакторный дисперсионный анализ (ANOVA) с тестом Дункана (SPSS 26.0). Графики построены в GraphPad Prism 10. PCA и PLS-DA выполнены в MetaboAnalyst 6.0. Статистическая значимость при p &amp;lt; 0,05.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f1.jpg\" alt=\"Изменения физико-химических показателей качества мидий мужских и женских особей при замороженном хранении.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Изменения физико-химических показателей качества мидий мужских и женских особей при замороженном хранении.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Изменения физико-химических показателей качества мидий мужских и женских особей при замороженном хранении. (a) Центробежные потери. (b) Содержание общего летучего азота (TVB-N). (c) Содержание малонового диальдегида (MDA). (d) ΔE. (e) Твердость. (f) Жевательная способность. Примечание: в (a–f) ** означает p &amp;lt; 0,01, *** означает p &amp;lt; 0,001. Разные строчные буквы в верхнем индексе (a, b, c) обозначают значимые различия между сроками хранения у самцов (p &amp;lt; 0,05), а разные заглавные буквы в верхнем индексе (A, B, C) обозначают значимые различия между сроками хранения у самок (p &amp;lt; 0,05); d: дни.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f2.jpg\" alt=\"Изменения профилей свободных аминокислот и многофакторный анализ мидий мужских и женских особей при замороженном хранени\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Изменения профилей свободных аминокислот и многофакторный анализ мидий мужских и женских особей при замороженном хранении.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Изменения профилей свободных аминокислот и многофакторный анализ мидий мужских и женских особей при замороженном хранении. (a) Тепловая карта свободных аминокислот (FAA). (b) Аминокислоты с вкусом умами (UAA). (c) Сладкие аминокислоты (SAA). (d) Горькие аминокислоты (BAA). (e) Общие свободные аминокислоты (TFAA). (f) Таурин (Tau). (g) График оценок PLS-DA. (h) Иерархическая кластерная тепловая карта выбранных дифференциальных FAA. (i) Результаты перекрестной проверки модели PLS-DA, звездочка (*) указывает на статистическую значимость (p &amp;lt; 0,05). (j) Перестановочный тест модели PLS-DA (n = 1000). (k) График оценок VIP, выделяющий ключевые дискриминантные соединения. Примечание: в (b–f) * указывает на различия между самцами и самками в один и тот же срок хранения. * означает p &amp;lt; 0,05, ** означает p &amp;lt; 0,01, *** означает p &amp;lt; 0,001. Разные строчные буквы в верхнем индексе (a, b) обозначают значимые различия между сроками хранения у самцов (p &amp;lt; 0,05), а разные заглавные буквы в верхнем индексе (A, B) обозначают значимые различия между сроками хранения у самок (p &amp;lt; 0,05); d: дни.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f3.jpg\" alt=\"Изменения соединений, связанных с АТФ, и эквивалента умами (EUC) в мидиях мужских и женских особей при замороженном хран\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Изменения соединений, связанных с АТФ, и эквивалента умами (EUC) в мидиях мужских и женских особей при замороженном хранении.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Изменения соединений, связанных с АТФ, и эквивалента умами (EUC) в мидиях мужских и женских особей при замороженном хранении. (a) АТФ. (b) АДФ. (c) АМФ. (d) ИМФ. (e) Гипоксантин (Hx). (f) Инозин (HxR). (g) ГМФ. (h) EUC. Примечание: в (a–h) * указывает на различия между самцами и самками в один и тот же срок хранения. * означает p &amp;lt; 0,05, ** означает p &amp;lt; 0,01, *** означает p &amp;lt; 0,001. Разные строчные буквы в верхнем индексе (a, b, c) обозначают значимые различия между сроками хранения у самцов (p &amp;lt; 0,05), а разные заглавные буквы в верхнем индексе (A, B, C) обозначают значимые различия между сроками хранения у самок (p &amp;lt; 0,05); d: дни.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f4.jpg\" alt=\"Изменения состава жирных кислот мидий мужских и женских особей при замороженном хранении.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Изменения состава жирных кислот мидий мужских и женских особей при замороженном хранении.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Изменения состава жирных кислот мидий мужских и женских особей при замороженном хранении. (a) Тепловая карта метиловых эфиров жирных кислот (FAME). (b) ДГК (DHA). (c) ЭПК (EPA). (d) ПНЖК (PUFA). (e) МНЖК (MUFA). (f) НЖК (SFA). (g) Соотношение ω-3/ω-6 жирных кислот. Примечание: в (b–g) * указывает на различия между самцами и самками в один и тот же срок хранения. * означает p &amp;lt; 0,05, ** означает p &amp;lt; 0,01, *** означает p &amp;lt; 0,001. Разные строчные буквы в верхнем индексе (a, b) обозначают значимые различия между сроками хранения у самцов (p &amp;lt; 0,05), а разные заглавные буквы в верхнем индексе (A, B, C) обозначают значимые различия между сроками хранения у самок (p &amp;lt; 0,05); d: дни.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f5.jpg\" alt=\"Графики различий летучих органических соединений (ЛОС) в мидиях Mytilus coruscus мужских и женских особей при замороженн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Графики различий летучих органических соединений (ЛОС) в мидиях Mytilus coruscus мужских и женских особей при замороженном хранении на основе ГХ-ИМС.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Графики различий летучих органических соединений (ЛОС) в мидиях Mytilus coruscus мужских и женских особей при замороженном хранении на основе ГХ-ИМС. (a) Группы самок с F0 в качестве эталона. (b) Группы самцов с M0 в качестве эталона. (c) Галерейный график, созданный на основе данных ГХ-ИМС. Примечание: на галерейном графике каждая строка представляет образец, а каждый столбец — ЛОС. Цвет представляет относительную интенсивность сигнала каждого ЛОС, варьирующуюся от белого (низкая интенсивность) до красного (высокая интенсивность); более глубокий красный цвет указывает на более высокое относительное содержание.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f6.jpg\" alt=\"(a) PCA на основе профилей летучих соединений, полученных методом ГХ-ИМС.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) PCA на основе профилей летучих соединений, полученных методом ГХ-ИМС.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;(a) PCA на основе профилей летучих соединений, полученных методом ГХ-ИМС. (b) График оценок PLS-DA для профилей ЛОС. (c) Результаты перекрестной проверки (CV), указывающие на точность прогнозирования модели. Значения Q2 (прогностическая способность) со звездочками (*) обозначают статистическую значимость (p &amp;lt; 0,05), что указывает на превосходство модели над случайным выбором; (d) Статистика перестановочного теста (n = 1000), подтверждающая значимость модели (p &amp;lt; 0,001). (e) График VIP-оценок, выделяющий ключевые дискриминантные соединения. (f) Иерархическая кластерная тепловая карта выбранных дифференциальных ЛОС.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f7.jpg\" alt=\"(a) Тепловая карта корреляции Пирсона между нелетучими вкусоароматическими соединениями (свободные аминокислоты, ТВА-Н, \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Тепловая карта корреляции Пирсона между нелетучими вкусоароматическими соединениями (свободные аминокислоты, ТВА-Н, МДА и 5′-нуклеотиды) и дифференциальными летучими соединениями.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;(a) Тепловая карта корреляции Пирсона между нелетучими вкусоароматическими соединениями (свободные аминокислоты, ТВА-Н, МДА и 5′-нуклеотиды) и дифференциальными летучими соединениями. (b) Тепловая карта корреляции Пирсона между ненасыщенными жирными кислотами и дифференциальными летучими соединениями. Примечание: на тепловой карте корреляции красный цвет указывает на положительную корреляцию, а синий — на отрицательную; более насыщенные цвета соответствуют более сильным корреляциям. Звездочки указывают на статистическую значимость (* соответствует p &amp;lt; 0,05, ** соответствует p &amp;lt; 0,01, *** соответствует p &amp;lt; 0,001).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Порча мидий&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;при долгом&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;замораживании&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Хранение при&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;-18 °C до 150&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дней и GC-IMS&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Самки&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;окисляются&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;быстрее самцов&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Разделять&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;партии мидий&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;по полу&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Foods (Basel, Switzerland). Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Foods (Basel, Switzerland) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;volatiles&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Li R, Xiu X, Xiang J, Xu K, Luo J, Wang Y, Jiang X, Liu Y, Feng T
