            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"249\" cy=\"164\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"691\" cy=\"197\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему вздувается упаковка&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;васаби и как это остановить&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f1.jpg\" alt=\"Сравнение антиоксидантных компонентов в обычном и газообразующем васаби. (A) Общее содержание фенолов; (B) Содержание фл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сравнение антиоксидантных компонентов в обычном и газообразующем &lt;a href=\"concepts/wasabi-sauce.html\"&gt;васаби&lt;/a&gt;. (A) Общее содержание фенолов; (B) Содержание флавоноидов; (C) Содержание аскорбиновой кислоты. Разные надстрочные буквы указывают на статистически значимые различия между образцами (P &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Снижение содержания соли в соусах ради здоровья потребителей привело к неожиданной проблеме — порче продукта из-за газообразующих бактерий. Исследование выявило, что виновником вздутия упаковок является &lt;a href=\"concepts/bacillus-licheniformis-qjl3.html\"&gt;штамм Bacillus licheniformis QJL3&lt;/a&gt;. Ученые определили условия, при которых этот микроорганизм перестает размножаться, что поможет стабилизировать рецептуры.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Бактерия Bacillus licheniformis QJL3 является основным источником газообразования в васаби.&lt;/li&gt;\n&lt;li&gt;Рост штамма полностью подавляется при концентрации соли 14% или добавлении 0,2 мг/мл сорбата калия.&lt;/li&gt;\n&lt;li&gt;Микроорганизм устойчив к умеренному нагреву (55°C) и способен развиваться в кислой среде (pH 3,8).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В ходе исследования образцов васаби с признаками порчи (вздутая упаковка) был выделен штамм Bacillus licheniformis QJL3. Этот микроорганизм способен выживать при температурах 4°C и 55°C в течение 10 минут, что делает его устойчивым к умеренному нагреву. Бактерия проявляет высокую толерантность к соли, однако ее рост полностью подавляется при концентрации хлорида натрия 14% в среде.&lt;/p&gt;\n&lt;p&gt;Эксперименты показали, что для эффективного контроля популяции B. licheniformis QJL3 в жидкой питательной среде YPDA достаточно концентрации соли 8%. Кроме того, была определена минимальная ингибирующая концентрация (МИК) сорбата калия, составившая 0,2 мг/мл. Эти данные позволяют производителям корректировать состав соуса, сохраняя его безопасность при сниженном содержании соли.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в лабораторных условиях на конкретном штамме, поэтому результаты могут варьироваться в зависимости от состава соуса и других микроорганизмов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Соус васаби, также известный как зеленая горчица или хрен, представляет собой приправу, изготавливаемую преимущественно из корня хрена (Armoracia rusticana). Он содержит глюкозинолаты, которые при контакте с водой в определенных условиях температуры и pH, а также в присутствии фермента мирозиназы, гидролизуются до изотиоцианатов. &lt;a href=\"concepts/isothiocyanates.html\"&gt;Изотиоцианаты&lt;/a&gt; обеспечивают уникальный аромат и остроту васаби, стимулируя слюноотделение и секрецию желудочного сока, что способствует аппетиту. Кроме того, васаби обладает детоксикационными свойствами, включая способность нейтрализовать токсины из рыбы и морепродуктов, поэтому его традиционно подают к сашими и суши для придания вкуса, дезодорации и антимикробной защиты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Соус васаби обычно имеет pH 4,8–5,2 и концентрацию соли 10%–12% (масса/объем), что подавляет рост большинства бактерий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соус васаби обычно имеет pH 4,8–5,2 и концентрацию соли 10%–12% (масса/объем) — условия, неблагоприятные для роста бактерий. Процесс производства прост и не включает длительную ферментацию, что минимизирует риск перекрестного загрязнения. Экстракт хрена также способен подавлять бактерии порчи. Однако глобальный тренд на снижение потребления соли (цель правительства Китая — снижение на 20% к 2030 году) привел к тому, что производители стали снижать содержание соли в рецептурах. Это вызвало спорадические случаи порчи, характеризующиеся газообразованием, вздутием упаковки и появлением кислого привкуса, что снижает доверие потребителей и ведет к экономическим потерям. Исследования показывают, что в соевом соусе снижение соли увеличивает количество бактерий на 1–2 порядка. Систематическая изоляция и идентификация газообразующих бактерий критически важны для стабильности васаби.&lt;/p&gt;\n&lt;p&gt;Дефекты газообразования (&lt;a href=\"concepts/gas-production.html\"&gt;аэрогенез&lt;/a&gt;) распространены в пищевой промышленности (соусы чили, пасты, суфу, соевый соус, сыр) и связаны с загрязнением микроорганизмами при производстве или хранении. Для борьбы с ними применяют термическую обработку, бактериоцины и консерванты (&lt;a href=\"concepts/potassium-sorbate.html\"&gt;сорбат калия&lt;/a&gt;, бензоат натрия). Однако эффективность методов варьируется. В данном исследовании потенциальные газообразующие бактерии были выделены культуральным методом и тестом с трубками Дарема, идентифицированы методами молекулярной биологии, а также оценена их устойчивость к консервантам и соли.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/test-s-trubkami-darema.html\"&gt;Тест с трубками Дарема&lt;/a&gt; — метод определения газообразования: если в перевернутой маленькой пробирке внутри сосуда с культурой скапливается газ, значит, микроорганизм активно его выделяет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Образцы нормального соуса (ZC1, ZC2, ZC3) и соуса со вздутой упаковкой (CQ1, CQ2, CQ3) были получены с завода в Шаньдуне (Китай). Физико-химические показатели (соль, общая кислотность, аминоазот, растворимые сахара, pH, влажность, белок) определялись стандартными методами титрования, колориметрии и сжигания. Сенсорная оценка проводилась 12 экспертами. Антиоксидантная активность оценивалась по способности нейтрализовать радикалы DPPH, ABTS и гидроксильный радикал. Газообразующие бактерии выделяли на средах RBM, PCA, TSA и YPDA. Идентификация проводилась с помощью системы VITEK 2 и ПЦР-амплификации 16S рДНК с последующим филогенетическим анализом. Устойчивость бактерий к среде (температура 4–65°C, pH 2,6–7,6, соль 2–16%) оценивалась по росту OD600. Минимальная ингибирующая концентрация (МИК) низина, сорбата калия и бензоата натрия определялась в среде YPDA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование наблюдательное: выявлена связь между вздутием упаковки и присутствием Bacillus licheniformis, однако для подтверждения причинно-следственной связи на производстве требуются дополнительные испытания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вздутый соус имел коричневый оттенок, слабый аромат и кисло-терпкий вкус. Физико-химически он отличался более высоким pH (5,31–5,34 против 4,96–5,10) и кислотностью, но меньшим содержанием белка, аминоазота и соли. Антиоксидантная активность в испорченном соусе оказалась выше, что, вероятно, связано с метаболитами микроорганизмов. Основным возбудителем был идентифицирован Bacillus licheniformis (штамм QJL3). Он проявляет устойчивость к соли до 12% и умеренному нагреву. Сочетание 8% соли и 0,2 мг/мл сорбата калия эффективно подавляло рост этого штамма в лабораторных условиях.&lt;/p&gt;\n&lt;p&gt;B. licheniformis QJL3 является основным возбудителем вздутия упаковки соуса васаби. Бактерия устойчива к высоким концентрациям соли и низким значениям pH. Для предотвращения порчи рекомендуется комбинация 8% соли и сорбата калия, что позволяет контролировать рост микроорганизма без существенного изменения рецептуры.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f1.jpg\" alt=\"Сравнение антиоксидантных компонентов в обычном и газообразующем васаби. (A) Общее содержание фенолов; (B) Содержание фл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сравнение антиоксидантных компонентов в обычном и газообразующем васаби. (A) Общее содержание фенолов; (B) Содержание флавоноидов; (C) Содержание аскорбиновой кислоты. Разные надстрочные буквы указывают на статистически значимые различия между образцами (P &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f2.jpg\" alt=\"Сравнение антиоксидантной активности обычного и газообразующего васаби. (A) Скорость поглощения радикалов ABTS; (B) Скор\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сравнение антиоксидантной активности обычного и газообразующего васаби. (A) Скорость поглощения радикалов ABTS; (B) Скорость поглощения радикалов DPPH; (C) Поглощение гидроксильных радикалов. Разные надстрочные буквы указывают на статистически значимые различия между образцами (P &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f3.jpg\" alt=\"График компонентов и тепловые карты иерархической кластеризации различных физико-химических, функциональных и антиоксида\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;График компонентов и тепловые карты иерархической кластеризации различных физико-химических, функциональных и антиоксидантных активных ингредиентов.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;График компонентов и тепловые карты иерархической кластеризации различных физико-химических, функциональных и антиоксидантных активных ингредиентов. Диаграмма анализа главных компонент (A), тепловая карта иерархической кластеризации (B): красный и синий цвета представляют положительные и отрицательные корреляции соответственно; чем темнее и крупнее красные круги, тем выше содержание соответствующего компонента, а шкала нормализации интенсивности цвета варьируется от 2,0 (красный круг) до −2,0 (синий круг), что указывает на содержание каждого компонента в васаби от самого высокого до самого низкого.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f4.jpg\" alt=\"Тест с поплавком Дарема (A), морфология колоний (B), микроскопические изображения окраски по Граму (C), электрофореграмм\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Тест с поплавком Дарема (A), морфология колоний (B), микроскопические изображения окраски по Граму (C), электрофореграмма ПЦР-амплификации 16S рДНК (D), филогенетическое дерево штамма QJL3. Среда, использованная в тесте на газообразующую способность, — жидкая среда YPDA, а чашки, использованные для морфологического наблюдения, — агаризованные среды YPDA; культивирование проводилось в анаэробных условиях.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f5.jpg\" alt=\"Устойчивость Bacillus licheniformis QJL3 к различным стрессовым факторам окружающей среды: (A) Температура, (B) pH и (C)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Устойчивость Bacillus licheniformis QJL3 к различным стрессовым факторам окружающей среды: (A) Температура, (B) pH и (C) соленость.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f6.jpg\" alt=\"Кривые роста Bacillus licheniformis QJL3 при различных концентрациях сорбата калия (A), бензоата натрия (B) и низина (C)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Кривые роста Bacillus licheniformis QJL3 при различных концентрациях сорбата калия (A), бензоата натрия (B) и низина (C), а также кривые роста B. licheniformis QJL3 при различных концентрациях сорбата калия (D) и бензоата натрия (E) в присутствии 8% соли.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вздутие&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;упаковки&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;васаби&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выделение и&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализ штамма&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;подавление&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бактерии солью&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и сорбатом&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стабильная&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рецептура&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;соуса&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Food science &amp;amp; nutrition. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt
