            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"104\" cy=\"132\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"656\" cy=\"272\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PROBIOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Может ли сок из семян&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;алеппской сосны укрепить&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;кишечный барьер&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f1.jpg\" alt=\"Средние значения трансэпителиального электрического сопротивления (TEER; Ом·см²) монослоя Caco-2 через 10 мин, 30 мин, 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Средние значения трансэпителиального электрического сопротивления (&lt;a href=\"concepts/transepithelial-electrical-resistance.html\"&gt;TEER&lt;/a&gt;; Ом·см²) монослоя &lt;a href=\"concepts/caco-2-cells.html\"&gt;Caco-2&lt;/a&gt; через 10 мин, 30 мин, 1 ч, 2 ч, 6 ч и 24 ч после обработки ЛПС (положительный контроль); (*p &amp;lt; 0,05; **&lt;em&gt;p &amp;lt; 0,001).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/intestinal-barrier.html\"&gt;Кишечный барьер&lt;/a&gt; защищает организм от токсинов, но стресс и воспаления могут его ослабить. Ученые проверили, как &lt;a href=\"concepts/fermentation.html\"&gt;ферментация&lt;/a&gt; семян алеппской сосны с помощью пробиотиков влияет на плотные контакты между клетками. Результаты показали, что такой напиток укрепляет барьерную функцию лучше, чем просто бактерии или их метаболиты.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ферментация семян сосны пробиотиками повышает TEER до 963,33 Ом·см².&lt;/li&gt;\n&lt;li&gt;Напиток усиливает экспрессию белков плотных контактов в клетках Caco-2.&lt;/li&gt;\n&lt;li&gt;Комплексный продукт ферментации эффективнее отдельных метаболитов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В исследовании использовали монослой клеток Caco-2, имитирующий эпителий кишечника. Клетки культивировали 21 день до полной дифференцировки, контролируя целостность через измерение трансэпителиального электрического сопротивления (TEER). В качестве стартовых культур для ферментации сока семян сосны (соотношение 2:3) применяли штаммы Lactiplantibacillus paraplantarum A1 и L. plantarum A2 при плотности 8 log КОЕ/г.&lt;/p&gt;\n&lt;p&gt;После 24-часовой ферментации при 25°C образцы воздействовали на клетки Caco-2. Исследователи измеряли TEER и уровень экспрессии белков плотных контактов (&lt;a href=\"concepts/tight-junction-proteins.html\"&gt;TJP&lt;/a&gt;), таких как окклюдин (OCLN) и клаудин-2 (CLDN2), с помощью метода RT-qPCR. Применение ферментированного сока повысило значения TEER до 690–963,33 Ом·см², что свидетельствует об укреплении барьера. Также наблюдалась регуляция экспрессии генов, ответственных за целостность межклеточных соединений, что превзошло эффект от использования чистой биомассы бактерий или их бесклеточных супернатантов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось только на клеточной модели in vitro, поэтому результаты нельзя напрямую переносить на человека без клинических испытаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Семена алеппской сосны (Pinus halepensis Mill.) являются основным ингредиентом тунисского ферментированного продукта «Assidet zgougou». Его предполагаемая польза для здоровья известна по описаниям. Эти свойства могут быть связаны с содержанием фитохимических веществ, особенно фенольных соединений с анальгетическими, противовоспалительными и антиоксидантными свойствами. Помимо фитохимических веществ, молочнокислое брожение, характерное для производства сока zgougou, может приводить к антимикробной и антиоксидантной активности, обусловленной микроорганизмами, вызывающими ферментацию. В свою очередь, такая активность может положительно влиять на состав и функцию микробиоты кишечника, улучшая барьерную функцию кишечника.&lt;/p&gt;\n&lt;p&gt;Кишечный эпителиальный барьер, играющий ключевую роль в поддержании здоровья организма, является результатом сложных взаимодействий, включающих биохимические, иммунологические, микробные и структурные компоненты. Помимо слизистого слоя и микробиоты кишечника, белки плотных контактов (TJP) эпителия кишечника имеют первостепенное значение для его функции «ворот и ограждения». TJP обычно располагаются в zona occludens между эндотелиальными и эпителиальными клетками. Они необходимы для контроля проницаемости клеток для воды, ионов и других растворенных веществ, перемещающихся парацеллюлярным путем, путем создания селективно проницаемых клеточных барьеров, разделяющих апикальную (просветную) и базолатеральную (аблуминальную) стороны организма. Это позволяет плотным контактам контролировать транспортные процессы и сохранять гомеостаз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Белки плотных контактов (TJP), такие как окклюдин и клаудины, критически важны для поддержания целостности кишечного барьера, регулируя проницаемость для ионов и молекул.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Экспрессия TJP, таких как окклюдин и клаудины, является высокоспецифичной для тканей, динамичной и тонко регулируемой. Окклюдин (OCLN), первый идентифицированный TJP, стабилизирует и обеспечивает структурную целостность плотных контактов между эпителиальными клетками кишечника. При избыточном синтезе он ограничивает вызванное цитокинами повышение проницаемости кишечника, а его паттерны экспрессии меняются в процессе развития или при болезненных состояниях, таких как рак. Различные изоформы клаудина (например, 1, 3, 5, 11) придают уникальные барьерные свойства таким органам, как почки, легкие, кишечник, а также гематоэнцефалическому барьеру. В частности, клаудин-2 (CLDN2) ассоциирован с улучшенной проницаемостью эпителия кишечника.&lt;/p&gt;\n&lt;p&gt;Lactiplantibacillus plantarum значительно укрепляет кишечный барьер и предотвращает «синдром дырявого кишечника» за счет улучшения плотных контактов (TJs). Некоторые штаммы этого вида увеличивают выработку и правильную локализацию TJP, таких как Zonula occludens-1 (ZO-1), окклюдин и клаудин-1, путем повышения уровня транскрипции соответствующих генов; это, в свою очередь, снижает проницаемость кишечника и защищает от воспаления. Фактор некроза опухоли-α (TNFα) — это провоспалительный цитокин, который регулирует целостность TJs через интернализацию OCLN, что повышает проницаемость кишечника. Липокалин-2 (LCN2) — еще один белковый компонент кишечного эпителиального барьера с антибактериальной активностью, который, по-видимому, индуцируется воспалительными стимулами. LCN2 является важным регулятором железа и бактериостатическим фактором врожденного иммунитета, играющим сложную роль при различных заболеваниях, таких как воспалительные заболевания кишечника (IBD), рак и метаболические расстройства.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/v-dannom-issledovanii-ispolzuetsya-model-caco-2.html\"&gt;В данном исследовании используется модель Caco-2&lt;/a&gt; — линия клеток аденокарциномы толстой кишки человека, которая при культивировании образует монослой, имитирующий эпителий кишечника.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Некоторые предыдущие отчеты показали, что бактерии группы L. plantarum взаимодействуют с LCN2 в основном через иммунную систему. Некоторые штаммы L. plantarum могут индуцировать макрофаги к секреции LCN2, который, помимо ограничения питания железом нежелательными бактериями, усиливает противоопухолевый иммунитет или влияет на воспаление. Окислительный стресс и ряд патологических состояний могут повредить целостность кишечного барьера, облегчая прохождение патогенных микроорганизмов и их токсичных метаболитов из просвета кишечника в подлежащие слои (например, собственную пластинку слизистой оболочки, обладающую иммунной функцией). Недавно некоторые пробиотические бактерии продемонстрировали пользу для здоровья хозяина за счет восстановления функции кишечного барьера. Например, пробиотические штаммы группы L. plantarum и Bifidobacterium longum subsp. infantis могут восстанавливать кишечный барьер, повышая уровень транскрипции генов, участвующих в TJs. Восстановление барьерной функции также может быть достигнуто путем введения бесклеточного супернатанта (CFS), полученного из пробиотических микроорганизмов, что открывает «постбиотическую» границу. Кроме того, пробиотики могут проявлять свою полезную активность и при введении в качестве пищевого ингредиента.&lt;/p&gt;\n&lt;p&gt;Однако в последнем случае трудно определить границы между пищевой матрицей и пробиотиками с точки зрения их вклада в наблюдаемый полезный эффект. Данное исследование направлено на понимание in vitro эффекта двух отобранных лактобацилл с пробиотическими свойствами на проницаемость кишечника и уровень экспрессии OCLN, CLDN2 и LCN2. Лактобациллы тестировались в различных препаратах: (i) клеточная биомасса из одиночной жидкой культуры; (ii) CFS из одиночной жидкой культуры; (iii) zgougou, полученный путем комбинации двух лактобацилл в качестве стартовых культур. Кроме того, спонтанно ферментированный zgougou также подвергался тем же анализам с использованием монослоя клеток Caco-2 человека в качестве модели in vitro для эпителия кишечника.&lt;/p&gt;\n&lt;p&gt;Клетки Caco-2 (аденокарцинома толстой кишки человека), линия раковых клеток толстой кишки, приобретенные в ATCC (Роквилл, США), высевались в верхнюю часть 12-луночных планшетов Transwell с размером пор 0,4 мкм (Corning Inc., Нью-Йорк, США), содержащих среду Dulbecco Modified Eagles Medium (DMEM, Thermo Fisher Scientific, Массачусетс, США), дополненную L-глутамином, 10% инактивированной нагреванием фетальной бычьей сывороткой (Thermo Fisher Scientific), 1% (1 М) 4-(2-гидроксиэтил)-1-пиперазинэтансульфоновой кислоты (HEPES, Sigma-Aldrich, Сент-Луис, США), 1% раствора пирувата натрия (100 мМ) (Sigma-Aldrich), 1% раствора стрептомицина (10 мг/мл) и раствора пенициллина (10 000 ЕД/мл) (Thermo Fisher Scientific). Клетки инкубировали при 37°C в атмосфере 5% CO2 в течение 21 дня, подкармливая их через день свежей средой DMEM. Полная дифференцировка монослоя была подтверждена измерением трансэпителиального электрического сопротивления (TEER) с использованием вольт-омметра Millicell ERS (Millipore, Эшборн, Германия) и визуальным контролем целостности клеточного слоя с помощью микроскопа, следуя шагам, описанным в других источниках.&lt;/p&gt;\n&lt;p&gt;Lactiplantibacillus paraplantarum A1 и L. plantarum A2, ранее выделенные из традиционного zgougou и принадлежащие Коллекции культур Департамента почвоведения, растениеводства и пищевых наук Университета Бари АЛЬДО МОРО, Италия, и Департамента биоресурсов: интегративная биология и валоризация, Высшего института биотехнологии Монастира, Университет Монастира, Тунис, культивировались в бульоне де Мана, Рогозы и Шарпа (MRS) (Oxoid, Бейзингсток, Гэмпшир, Великобритания) при 37°C в течение 24 ч в анаэробных условиях. Затем культуральный бульон центрифугировали (10 000× g, 20 мин, 4°C), и CFS отделяли от клеточной биомассы. Сок zgougou получали из смеси молотых семян алеппской сосны и водопроводной воды в соотношении 2:3 (w:v), инокулировали L. paraplantarum A1 и L. plantarum A2 (J A1 + A2), оба с плотностью клеток 8 log CFU/г, и ферментировали при 25°C в течение 24 ч, как подробно описано ранее. Кроме того, сок из спонтанно ферментированного zgougou (J) получали после ферментации при 25°C в течение 24 ч без добавления лактобацилл. Как zgougou, заквашенный отобранными лактобациллами, так и zgougou, полученный путем спонтанной ферментации, хранились при −20°C до анализа.&lt;/p&gt;\n&lt;p&gt;После дифференцировки (21 день, значение TEER: около 193 Ом·см2) клетки Caco-2 переносили в новые 12-луночные планшеты Transwell. По достижении конфлюэнтности (около 6 дней) клетки стимулировали индивидуально в течение 24 ч: биомассой пробиотических бактерий A1 и A2 (обе с плотностью клеток порядка 8 log CFU/мл), культивированных в бульоне MRS, CFS, экстрагированным из тех же бактерий, спонтанно ферментированным соком zgougou (J) и соком zgougou, ферментированным пробиотическими бактериями A1 и A2 (J (A1 + A2)). Пустая лунка, не содержащая клеток, использовалась в качестве бланка. Необработанные клетки, а именно клетки, не подвергавшиеся воздействию какого-либо бактериального препарата или сока zgougou, использовались в качестве отрицательных контролей во всех экспериментах (носитель). В качестве положительного контроля использовали 1 мкг/мл липополисахарида (LPS) Escherchia coli (Sigma-Aldrich). Затем планшеты инкубировали при 37°C в 10% CO2 и 90% воздуха. TEER измеряли с помощью вольт-омметра Millicell ERS, а целостность клеточного монослоя визуально контролировали под микроскопом, следуя шагам, описанным ранее. Целостность монослоя оценивали через 10 мин, 30 мин, 1, 2, 6 и 24 ч инкубации. Измерения выражали в стандартных единицах (Ом·см2) после вычитания средних значений сопротивления, измеренных в бланке. Были проведены два технических повтора биологических трипликатов.&lt;/p&gt;\n&lt;p&gt;Уровень экспрессии генов, связанных с целостностью кишечного барьера, анализировали с помощью RT-qPCR. Общую РНК экстрагировали из клеток, подвергнутых воздействию в течение 24 ч вышеупомянутым обработкам, с использованием реагента Invitrogen TRIzol (Thermo Fisher Scientific) в соответствии с инструкциями производителя. Общую РНК (500 нг) подвергали обратной транскрипции в кДНК с использованием набора iScript cDNA Synthesis kit (Biorad, Калифорния, США) со случайными праймерами, как описано в других источниках. Использовались следующие анализы экспрессии генов TaqMan (Thermo Fisher Scientific): Hs00174128_m1 для гена TNFα, кодирующего фактор некроза опухоли; Hs00252666_s1 для гена CLDN2, кодирующего клаудин 2; Hs05465837_g1 для гена OCLN, кодирующего окклюдин; Hs01008571_m1 для гена LCN2, кодирующего липокалин 2; и Hs02758991_g1 для гена GAPDH, кодирующего глицеральдегид-3-фосфатдегидрогеназу. Последний использовался в качестве гена домашнего хозяйства. ПЦР проводили на системе CFX96 (Biorad) с использованием реакционной смеси и условий, описанных Talà et al. (2022). Уровень экспрессии целевых генов рассчитывали с использованием метода ΔΔCt по отношению к уровню экспрессии гена GAPDH.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-ct.html\"&gt;Метод ΔΔCt&lt;/a&gt; — стандартный способ количественного сравнения уровней экспрессии генов, позволяющий определить, во сколько раз изменилось количество мРНК целевого гена по сравнению с контролем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Были проведены три технических повтора биологических трипликатов.&lt;/p&gt;\n&lt;p&gt;Среду культивирования клеток извлекали из верхней и нижней части лунок, содержащих клетки, подвергнутые различным обработкам, и центрифугировали (10 мин). Супернатанты подвергали количественному определению TNFα с использованием набора &lt;a href=\"concepts/elisa.html\"&gt;ELISA&lt;/a&gt; (RD Systems, Миннеаполис, МН, США) с 96-луночными планшетами, как описано Bermudez-Brito et al. (2015). Были проведены два технических повтора биологических трипликатов.&lt;/p&gt;\n&lt;p&gt;Статистический анализ проводили с использованием Graphpad Prism 9.3.1. Все данные выражены как средние значения ± SD. Статистическую значимость оценивали с помощью двустороннего t-критерия Стьюдента и двухфакторного дисперсионного анализа (ANOVA) (* p &amp;lt; 0,05; ** p &amp;lt; 0,01; *** p &amp;lt; 0,001; **** p &amp;lt; 0,0001). Результаты считались статистически значимыми при p &amp;lt; 0,05.&lt;/p&gt;\n&lt;p&gt;Насколько нам известно, это первое исследование, в котором анализировалось влияние на целостность эпителиальных клеток кишечника двух лактобацилл (L. paraplantarum A1 и L. plantarum A2), выделенных из zgougou, их CFS, сока zgougou, ферментированного вышеуказанными лактобациллами (J (A1 + A2)), и сока zgougou, спонтанно ферментированного (J). В анализах использовались клетки монослоя Caco-2 в качестве модели in vitro эпителия кишечника человека. Мы обнаружили, что обработка LPS (1 мкг/мл) вызывала времязависимый ответ значений TEER по сравнению с необработанными клетками (отрицательный контроль). В частности, значение TEER монослоя Caco-2 после 30 мин воздействия LPS было значительно (p &amp;lt; 0,001) ниже (ок. 160 Ом·см2), чем TEER необработанных клеток; напротив, после 2 ч воздействия LPS TEER увеличилось до ок. 193 Ом·см2, будучи значительно (p &amp;lt; 0,05) выше, чем у необработанных клеток (Рис. 1). Более низкие значения TEER напрямую коррелируют с повышенной проницаемостью клеточного монослоя, что указывает на нарушение кишечного барьера и возникновение «дырявого» кишечника. Это повреждение TJs может запустить воспалительные пути, приводя к высвобождению провоспалительных цитокинов, как сообщалось ранее. Целостность кишечника поддерживается эпителиальным комплексом адгезии контактов, слизистым слоем и продуктами, высвобождаемыми как клетками хозяина, так и бактериями.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f1.jpg\" alt=\"Средние значения трансэпителиального электрического сопротивления (TEER; Ом·см²) монослоя Caco-2 через 10 мин, 30 мин, 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Средние значения трансэпителиального электрического сопротивления (TEER; Ом·см²) монослоя Caco-2 через 10 мин, 30 мин, 1 ч, 2 ч, 6 ч и 24 ч после обработки ЛПС (положительный контроль); (*p &amp;lt; 0,05; **&lt;em&gt;p &amp;lt; 0,001).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проведено на клеточной линии Caco-2 in vitro; результаты могут отличаться от процессов в живом организме из-за отсутствия сложной регуляции со стороны иммунной и нервной систем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Монослой Caco-2, подвергнутый воздействию биомассы L. paraplantarum A1, разведенной 1:100, показал повышенные значения TEER через 10 мин (p &amp;lt; 0,0001) и 2 ч (p &amp;lt; 0,05) по сравнению с необработанными клетками; впоследствии значимых (p &amp;gt; 0,05) различий не обнаружено (Рис. 2A). Когда монослой подвергался воздействию биомассы тех же &lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;LAB&lt;/a&gt; в разведении (1:10), TEER увеличивалось через 30 мин (p &amp;lt; 0,0001) и 24 ч (p &amp;lt; 0,05). Однако снижение (p &amp;lt; 0,01) TEER было неожиданно обнаружено через 1 ч с последним образцом (Рис. 2A). Когда монослой Caco-2 подвергался воздействию в течение 6 ч CFS L. paraplantarum A1 (разведенного 1:100), TEER было значительно (p &amp;lt; 0,05) выше, чем у необработанных клеток (Рис. 2B). Обработка монослоя Caco-2 биомассой L. plantarum A2 (разведенной 1:100) приводила к значительно (p &amp;lt; 0,05) более высокому TEER (213 Ом·см2), чем у необработанных клеток, только через 30 мин (Рис. 2C). Через 30 мин TEER монослоя клеток, обработанных разведенным (1:10) CFS L. plantarum A2, было значительно выше, чем у необработанных клеток (Рис. 2D). В целом, обработка клеточной линии Caco-2 пробиотическими LAB могла положительно влиять на целостность клеточного барьера, но в зависимости от используемых LAB, дозы используемых LAB и времени воздействия. Пробиотики, особенно принадлежащие к роду Lactiplantibacillus, могут улучшать здоровье кишечника с помощью нескольких механизмов, одним из которых может быть сохранение хорошего кишечного барьера. Эти результаты согласуются с предыдущими исследованиями, которые показали положительные эффекты на целостность клеточной мембраны при обработке L. plantarum; однако сообщалось, что некоторые штаммы не влияют на значения TEER. L. plantarum C06 и Lactobacillus acidophilus C11, выделенные из квашеной капусты, показали хорошие характеристики in vitro с точки зрения адгезии к клеткам двенадцатиперстной кишки и толерантности к биотическому стрессу кишечника. В наших экспериментальных условиях увеличение TEER, наблюдаемое после длительного (30 мин — 6 ч) воздействия клеточной линии Caco-2 на CFS обоих лактобацилл, предполагает, что некоторые биоактивные молекулы, присутствующие в CFS лактобацилл, могут играть решающую роль во взаимодействии клеток, что согласуется с предыдущими отчетами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f2.jpg\" alt=\"Средние значения трансэпителиального электрического сопротивления (TEER; Ом·см²) монослоя Caco-2 через 10 мин, 30 мин, 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Средние значения трансэпителиального электрического сопротивления (TEER; Ом·см²) монослоя Caco-2 через 10 мин, 30 мин, 1 ч, 2 ч, 6 ч и 24 ч после обработки клетками L. paraplantarum A1 (1:10) и (1:100) (A); культуральной жидкостью (CFS) A1 (1:10) и (1:100) (B); клетками L. plantarum A2 (1:10) и (1:100) (C) и культуральной жидкостью (CFS) A2 (1:10) и (1:100) (D). (*p &amp;lt; 0,05; **p &amp;lt; 0,01; ***&lt;em&gt;p &amp;lt; 0,0001).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Когда монослой Caco-2 подвергался воздействию сока zgougou, ферментированного L. paraplantarum A1 и L. plantarum A2 (J A1 + A2) и разведенного 1:10, мы обнаружили во всех временных точках более высокие (p &amp;lt; 0,0001) значения TEER (690–963 Ом·см2), чем в отрицательном контроле. Никаких значимых (p &amp;gt; 0,05) различий не наблюдалось, когда клетки обрабатывались J A1 + A2, разведенным 1:100 (Рис. 3A). Единственное значимое (p &amp;lt; 0,05) различие, обнаруженное во время обработки монослоя Caco-2 спонтанно ферментированным соком zgougou (J), было обнаружено через 30 мин воздействия J, разведенного 1:10, что привело к более высокому TEER, чем в отрицательном контроле (Рис. 3B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f3.jpg\" alt=\"Средние значения трансэпителиального электрического сопротивления (TEER; Ом·см²) монослоя Caco-2 через 10 мин, 30 мин, 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Средние значения трансэпителиального электрического сопротивления (TEER; Ом·см²) монослоя Caco-2 через 10 мин, 30 мин, 1 ч, 2 ч, 6 ч и 24 ч после обработки ферментированным соком згугу, полученным с использованием стартовой культуры молочнокислых бактерий J (A1 + A2) в разведении (1:10) и (1:100) (A), и соком згугу спонтанного брожения J в разведении (1:10) и (1:100) (B); (*p &amp;lt; 0,05; ***&lt;em&gt;p &amp;lt; 0,0001).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Наши выводы согласуются с предыдущими отчетами о ферментированных продуктах растительного происхождения, которые, будучи богатыми микробами и их метаболитами, в дополнение к своим фитохимическим веществам, могут модулировать проницаемость кишечного барьера. Различные исследования сообщали, что ферментированные продукты, такие как кефир, дахи и корейский кимчи, с использованием различных пробиотических штаммов LAB, могут быть полезны против многих заболеваний, таких как рак, IBD, нервная анорексия, сердечно-сосудистые заболевания и диабет. В наших экспериментальных условиях мы обнаружили, что два пробиотических штамма, хотя и приводили к неоднозначному эффекту при тестировании по отдельности, при использовании в комбинации для управления ферментацией сока zgougou могли улучшить целостность кишечника за короткое время. Помимо эффекта, связанного с комбинацией пробиотических лактобацилл и растительной матрицы (семена алеппской сосны), подвергнутой изучению, мы могли бы постулировать, что дальнейшие взаимодействия между пробиотическими лактобациллами и кишечником хозяина могут происходить при проглатывании. Действительно, растительные матрицы могут защищать пробиотики во время их прохождения через желудочно-кишечный тракт до их последующего высвобождения в толстой кишке. Таким образом, эти результаты подчеркивают потенциальный эффект сока zgougou, ферментированного отобранными лактобациллами, для укрепления эпителиального барьера кишечника, но требуются дальнейшие исследования взаимодействия клеток.&lt;/p&gt;\n&lt;p&gt;Клеточные биомассы L. paraplantarum A1 и L. plantarum A2 значительно (p &amp;lt; 0,0001) увеличивали уровень экспрессии мРНК гена, кодирующего провоспалительный цитокин TNFα (Рис. 4A). Напротив, воздействие на клетки Caco-2 CFS от вышеупомянутых лактобацилл не приводило к каким-либо значимым изменениям уровня экспрессии гена TNFα. Кроме того, разведенный сок zgougou, ферментированный обоими лактобациллами (J (A1 + A2)), сильно усиливал экспрессию гена TNFα (p &amp;lt; 0,001) (Рис. 4A). Спонтанно ферментированный сок zgougou (J) также увеличивал экспрессию TNFα, хотя и с более мягким эффектом, чем J (A1 + A2). TNFα рассматривается как провоспалительный цитокин, но в некоторых случаях он может участвовать в стимулировании иммунных ответов против патогенов. Микробиота кишечника может влиять на экспрессию различных иммунозависимых генов. Различные штаммы LAB могут оказывать различное влияние на выработку TNF-α, подчеркивая необходимость тщательного отбора и характеристики пробиотических штаммов. Пробиотические LAB, которые ингибируют или индуцируют экспрессию TNF-α, могут иметь иммуностимулирующий или иммуносупрессивный эффекты соответственно.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill-f4.jpg\" alt=\"Дифференциальные уровни мРНК провоспалительных цитокинов и маркерных генов плотных контактов в клетках Caco-2, инкубиров\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дифференциальные уровни мРНК провоспалительных цитокинов и маркерных генов плотных контактов в клетках Caco-2, инкубированных с различными образцами, определенные методом RT-qPCR через 24 ч после обработки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Дифференциальные уровни мРНК провоспалительных цитокинов и маркерных генов плотных контактов в клетках Caco-2, инкубированных с различными образцами, определенные методом RT-qPCR через 24 ч после обработки. (A) Нормализованные уровни мРНК провоспалительного цитокина TNFα, высеянного на многолуночные планшеты. (B) Нормализованные уровни мРНК маркерных генов LCN2 в клетках Caco-2, (C) нормализованные уровни мРНК маркерных генов Cldn 2 в клетках Caco-2, (D) нормализованные уровни мРНК маркерных генов Ocln в клетках Caco-2, высеянных, соответственно, на верхнюю и нижнюю части системы Transwell после 24 ч инкубации. #: отрицательный контроль; ##: положительный контроль; ns, статистически незначимо; *p &amp;lt; 0,05; **p &amp;lt; 0,01; ***p &amp;lt; 0,001; ****p &amp;lt; 0,0001.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хотя биомасса лактобацилл и ферментированный сок zgougou повышали экспрессию гена TNFα, анализ ELISA не выявил различий в концентрации самого белка TNFα, что указывает на сложную посттранскрипционную регуляцию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В наших экспериментальных условиях, хотя клетки Caco-2, подвергшиеся воздействию либо биомассы лактобацилл, либо zgougou, ферментированного этими лактобациллами, показали более высокую экспрессию гена TNF-α, анализ ELISA не обнаружил различий в концентрации TNFα между верхним и нижним супернатантом (Таблица S1). Несоответствие, обнаруженное между уровнем экспрессии гена, кодирующего TNFα, и отсутствием различий в уровнях TNFα, может быть объяснено транскрипционными и посттранскрипционными регуляторными системами, которые могли заблокировать синтез этого провоспалительного цитокина.&lt;/p&gt;\n&lt;p&gt;Монослой Caco-2, подвергнутый воздействию биомассы L. paraplantarum A1 (разведение 1:10), показал повышенный (p &amp;lt; 0,01) уровень экспрессии гена LCN2 по сравнению с отрицательным (необработанные клетки) и положительным (клетки, подвергшиеся воздействию LPS) контролями (Рис. 4B). Кроме того, воздействие на монослой Caco-2 биомассы L. paraplantarum A1 (разведение 1:10) способствовало (p &amp;lt; 0,01) транскрипции гена OCLN (Рис. 4C). CFS того же бактериального штамма, по-видимому, индуцировал еще более сильную экспрессию (p &amp;lt; 0,001) гена OCLN. Мы также обнаружили более высокий уровень экспрессии обоих генов (LCN2 и OCLN) в клетках Caco-2, подвергшихся воздействию биомассы (разведенной 1:10) (p &amp;lt; 0,0001) и CFS L. plantarum A2 (Рис. 4B,C). TJP, включая CLDN и OCLN, способствуют фундаментальной барьерной функции эпителия кишечника, позволяя селективный транспорт растворенных веществ, предотвращая при этом попадание опасных соединений и патогенных бактерий в просвет кишечника. Результаты, полученные в настоящем исследовании, согласуются с предыдущими исследованиями, которые показали, что специфические штаммы L. plantarum могут укреплять барьерную функцию эпителия кишечника путем регуляции TJP.&lt;/p&gt;\n&lt;p&gt;Однако, поскольку наблюдаемые эффекты, помимо зависимости от штамма, зависят от хозяина и микробиоты кишечника, необходимы дополнительные исследования, чтобы лучше понять влияние L. plantarum на TJP и связанные с этим последствия для здоровья желудочно-кишечного тракта. Когда монослой Caco-2 обрабатывали соком zgougou, ферментированным L. paraplantarum A1 и L. plantarum A2 (J A1 + A2) и разведенным 1:10, был обнаружен значительно более высокий уровень экспрессии генов CLDN2 (Рис. 4C) и OCLN (Рис. 4D). Воздействие спонтанно ферментированного сока zgougou (J), разведенного 1:10, приводило к еще более высокой (p &amp;lt; 0,0001) экспрессии обоих генов (Рис. 4C,D). Эти результаты частично согласуются с результатами TEER, предполагая улучшенную барьерную функцию эпителия кишечника. Мы обнаружили явное несоответствие между экспрессией CLDN2 и результатами TEER. Однако функциональное влияние соответствующего белка клаудина-2 зависит от общей структуры и состава комплекса TJ, а не от уровня экспрессии одного гена. Кроме того, CLDN2 может выполнять двойную функцию в физиологии эпителия и при заболеваниях, таких как ремоделирование тканей и эпителиальный гомеостаз. В наших экспериментальных условиях сверхэкспрессия CLDN2, вероятно, указывала бы на ремоделирование TJ, а не на повышенную проницаемость кишечника. Во-первых, это исследование показало, что ферментированный сок zgougou может повышать уровень экспрессии генов, кодирующих TJP. Семена алеппской сосны, сырье, используемое для zgougou, содержат биоактивные соединения с антиоксидантной и противовоспалительной активностью, такие как линолевая и α-линоленовая кислоты, флавоноиды и фенолы. Мы предполагаем, что в наших экспериментальных условиях эффекты, наблюдаемые на уровне экспрессии генов, кодирующих TJP, могут быть результатом синергии между биоактивными соединениями из семян алеппской сосны и ферментацией с помощью LAB. Нетаргетная метаболомика, которую необходимо провести на zgougou, ферментированном спонтанно или с помощью отобранных лактобацилл, а также на биомассе и CFS отобранных лактобацилл, была бы полезна для понимания того, какие соединения могли наиболее вероятно вызвать наблюдаемые эффекты на экспрессию генов монослоя Caco-2.&lt;/p&gt;\n&lt;p&gt;Это исследование показало, что сок zgougou, в зависимости от типа ферментации (спонтанная или управляемая двумя отобранными автохтонными лактобациллами), может укреплять целостность монослоя Caco-2 человека, что подтверждается повышенным TEER и уровнем экспрессии генов, кодирующих TJP. Этот эффект можно рассматривать как потенциально полезный для кишечника. Будущие исследования могут сосредоточиться на: (i) понимании того, может ли этот эффект быть результатом синергии между биоактивными соединениями и микробиотой матрицы zgougou; (ii) оценке биологической активности сока zgougou на животной модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/impac
