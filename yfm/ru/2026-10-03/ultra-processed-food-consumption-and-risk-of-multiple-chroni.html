            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"118\" cy=\"174\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"502\" cy=\"174\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Хрустящие снеки и готовая&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;еда: метаанализ на 8,8 млн&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;человек показал скрытую цену&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ультраобработки&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni-f1.jpg\" alt=\"Нелинейный анализ зависимости «воздействие-эффект» между потреблением ультрапереработанных пищевых продуктов и риском ра\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Нелинейный анализ зависимости «воздействие-эффект» между потреблением ультрапереработанных пищевых продуктов и риском развития гипертонии, сердечно-сосудистых заболеваний, онкологических заболеваний, ожирения/избыточного веса, метаболического синдрома/диабета…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Нелинейный анализ зависимости «воздействие-эффект» между потреблением ультрапереработанных пищевых продуктов и риском развития гипертонии, сердечно-сосудистых заболеваний, онкологических заболеваний, ожирения/избыточного веса, метаболического синдрома/диабета и смертности от всех причин. Гипертония (A), сердечно-сосудистые заболевания (B), онкологические заболевания (C), ожирение/избыточный вес (D), метаболический синдром/диабет (E) и смертность от всех причин (F). HR — &lt;a href=\"concepts/hazard-ratio.html\"&gt;отношение рисков&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Масштабный &lt;a href=\"concepts/meta-analysis.html\"&gt;метаанализ&lt;/a&gt; 51 проспективной когорты охватил 8 819 894 взрослых участников со всего мира. Исследователи сопоставили рацион по классификации NOVA с частотой развития хронических недугов за период наблюдения от 2 до 32 лет. Максимальное потребление глубоко переработанных продуктов связали с ростом вероятности сердечно-сосудистых патологий на 24% и расстройств пищеварения на 31%. Дозозависимый расчет показал: риски растут пропорционально каждому съеденному фабричному снеку.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Метаанализ 51 когорты (8,8 млн человек) связал фастфуд и снеки с ростом риска смерти от всех причин на 18%.&lt;/li&gt;\n&lt;li&gt;Каждые +100 г глубоко переработанных продуктов в сутки дают +14% к риску сердечно-сосудистых катастроф.&lt;/li&gt;\n&lt;li&gt;Прибавка ультраобработанных блюд на 10% от суточного рациона повышает риск диабета и метсиндрома на 16%.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"concepts/nova-classification.html\"&gt;Классификация NOVA&lt;/a&gt; делит пищевые продукты на четыре категории по степени технологической переделки, где ультраобработанная продукция (&lt;a href=\"concepts/ultra-processed-foods.html\"&gt;UPF&lt;/a&gt;) представляет собой готовые к употреблению изделия с высоким содержанием соли, сахара, гидрогенизированных масел и многокомпонентных технологических добавок. В сводный анализ вошли данные 51 когортного исследования, охватившего 8 819 894 человека в возрасте от 23,9 до 77 лет. Рацион оценивали с помощью валидированных опросников частоты питания (FFQ), суточных воспоминаний (24-hour recalls) и анамнеза, стандартизируя результаты через отношение рисков (Hazard Ratio, HR).&lt;/p&gt;\n&lt;p&gt;Сравнение крайних категорий потребления выявило статистически значимый рост заболеваемости по ключевым терапевтическим исходам. В группе наивысшего потребления ультраобработанной пищи риск сердечно-сосудистых событий (инфаркты, инсульты) оказался выше на 24% (HR 1,24; 95% ДИ 1,14–1,36), метаболического синдрома и диабета 2 типа — на 24% (HR 1,24; 95% ДИ 1,08–1,42), онкологических заболеваний — на 12% (HR 1,12; 95% ДИ 1,04–1,21), а общей смертности — на 18% (HR 1,18; 95% ДИ 1,10–1,26). Анализ «доза — эффект» показал, что каждые дополнительные 100 г UPF в сутки повышают вероятность гипертонии на 11% (HR 1,11; 95% ДИ 1,02–1,21) и сердечно-сосудистых нарушений на 14% (HR 1,14; 95% ДИ 1,06–1,22).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Когортный дизайн фиксирует корреляцию, а не прямую причинно-следственную связь, опираясь на самоотчеты о рационе. Качество доказательств по шкале GRADE оценено авторами как низкое или умеренное.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Глобальное потребление ультрапереработанных пищевых продуктов (УПП) в последние годы стремительно растет. Накопленные данные связывают высокий уровень потребления УПП с повышенным риском развития серьезных хронических заболеваний, таких как гипертония, сердечно-сосудистые заболевания, рак и метаболические нарушения. Эти состояния часто сосуществуют в виде мультиморбидности в первичной медико-санитарной помощи, что увеличивает клиническую сложность, потребность в медицинской помощи и долгосрочное бремя лечения.&lt;/p&gt;\n&lt;p&gt;Мы обнаружили, что более высокое потребление УПП связано с повышенным риском развития множественных хронических заболеваний, включая сердечно-сосудистые события (24%), ожирение/избыточный вес (23%), метаболический синдром (МС)/диабет (24%), депрессию/тревожные расстройства (27%), заболевания пищеварительной системы (31%), рак (12%) и смертность от всех причин (18%). Анализ «доза-эффект» показал, что каждые дополнительные 100 г/день потребления УПП связаны с повышением риска гипертонии на 11%, сердечно-сосудистых событий — на 14%, рака — на 4% и смертности от всех причин — на 3%; каждые 10% увеличения доли УПП в массе/энергетической ценности рациона связаны с повышением риска МС/диабета на 16%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Высокое потребление УПП коррелирует с ростом риска хронических заболеваний на 12–31% в зависимости от патологии, при этом каждые 100 г/день УПП повышают риск смертности от всех причин на 3%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Будущие исследования должны разработать более стандартизированные и точные методы классификации и количественной оценки потребления УПП, сообщать о результатах «доза-эффект» с использованием сопоставимых единиц измерения, изучать, различаются ли оценки риска в зависимости от популяции, характера питания и исходного риска заболеваний, а также информировать разработку рекомендаций по питанию, основанных на доказательствах. В первичной медико-санитарной помощи медицинские работники могут включать советы по сокращению потребления УПП в рутинное консультирование по образу жизни и управление мультиморбидностью, предоставляя практические рекомендации, адаптированные к доступным диетическим заменам, предпочтениям пациентов и их текущему метаболическому, сопутствующему и эмоциональному профилю.&lt;/p&gt;\n&lt;p&gt;Потребление УПП заметно возросло, составляя значительную часть ежедневного рациона. Согласно классификации NOVA, широко используемой системе, категоризирующей продукты по степени промышленной обработки, УПП — это готовые к употреблению или разогреву продукты, прошедшие глубокую промышленную переработку и часто содержащие множество пищевых добавок. Они обычно обладают высокой энергетической плотностью, содержат много сахара и соли, но бедны пищевыми волокнами, белком, витаминами и минералами, что обеспечивает их удобство, вкусовую привлекательность и длительный срок хранения.&lt;/p&gt;\n&lt;p&gt;Потребление УПП растет во всем мире на протяжении последних десятилетий. Среди взрослых в США УПП составляли 53,5% от общего потребления энергии в 2001 году, увеличившись до 57,0% в 2018 году и оставаясь на уровне 53,0% в 2021–2023 годах. Аналогичный рост наблюдался в других странах: за три десятилетия потребление УПП выросло с 11,0% до 31,7% в Испании, с 10% до 23% в Мексике и Бразилии и с 3,5% до 10,4% в Китае.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на наблюдательных когортных данных: установлена статистическая связь, а не прямая причинно-следственная зависимость. Наблюдаемые эффекты могут быть осложнены смешивающими факторами образа жизни.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Появляющиеся данные свидетельствуют о том, что чрезмерное потребление УПП может негативно влиять на здоровье человека. Например, проспективное исследование UK Biobank с участием 60 298 человек показало, что высокое потребление УПП связано с повышенным риском сердечно-сосудистых заболеваний (ССЗ) и смертности от всех причин при наблюдении в течение 10,9 лет. Многие состояния, связанные с потреблением УПП — гипертония, ожирение, диабет, ССЗ, рак и депрессия — часто сосуществуют у одних и тех же лиц, формируя типичные паттерны мультиморбидности. &lt;a href=\"concepts/multimorbidity.html\"&gt;Мультиморбидность&lt;/a&gt; значительно увеличивает нагрузку на здравоохранение, снижает качество жизни и усложняет долгосрочное лечение. Прямые медицинские расходы оцениваются примерно в 14 300 I ежегодно при гипертонии с диабетом и до 85 820 I при раке с психическими расстройствами в первый год после постановки диагноза. Поэтому понимание общих факторов риска множественных хронических состояний, включая диетическое воздействие УПП, необходимо для формирования стратегий профилактики в первичной медико-санитарной помощи.&lt;/p&gt;\n&lt;p&gt;Данное исследование было зарегистрировано в Международном проспективном реестре систематических обзоров (PROSPERO; номер регистрации: CRD42023421092) и выполнено в соответствии с заявлением PRISMA (онлайн-дополнительная таблица S1). Мы провели всесторонний поиск литературы в PubMed, Embase и Cochrane Library с момента их создания по 28 апреля 2026 года. Стратегия поиска включала как термины MeSH, так и ключевые слова в свободном тексте, включая, помимо прочего, «ультрапереработанная пища», «сердечно-сосудистые заболевания», «гипертония», «диабет», «депрессия», «тревожность», «смертность», «ожирение» и «заболевания пищеварительной системы».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-prisma.html\"&gt;Метод PRISMA&lt;/a&gt; — это стандарт отчетности для систематических обзоров, обеспечивающий прозрачность отбора исследований и минимизирующий предвзятость при анализе данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследования отбирались в соответствии с критериями PECOS (Популяция, Воздействие, Сравнение, Исход и Дизайн исследования): (1) Участники: взрослые (≥18 лет) без ограничений по конкретным клиническим состояниям на исходном уровне; (2) Воздействие и компаратор: сравнение между высшей и низшей категориями потребления УПП. УПП определялись согласно классификации NOVA; (3) Исходы: все показатели здоровья, такие как гипертония, сердечно-сосудистые события, рак, МС/диабет, заболевания пищеварительной системы и смертность от всех причин, исключая субклинические заболевания, такие как артериосклероз и гиперлипидемия; (4) Дизайн исследования: проспективные когортные исследования. Исследования исключались, если они соответствовали критериям: (1) Протоколы, обзоры, исследования на животных, «случай-контроль», ретроспективные когортные и поперечные исследования; (2) Исследования без четкого определения УПП (согласно классификации NOVA) или включающие только подкатегории УПП; (3) Исследования с недоступными данными; (4) Исследования, проведенные исключительно в специфических клинических или группах высокого риска (например, беременные женщины, тяжелобольные пациенты или лица с заболеваниями печени, почек или раком).&lt;/p&gt;\n&lt;p&gt;Следующие данные извлекались независимо тремя авторами (XL, S-WL и Y-TZ): (1) первый автор, год, страна/регион; (2) дизайн исследования и период наблюдения; (3) характеристики популяции; (4) оценка и категории потребления УПП; (5) исходы; (6) ОШ (отношение шансов) или относительный риск (ОР), или ОР (отношение рисков) с 95% ДИ из наиболее полных моделей. Потенциальные риски систематической ошибки оценивались с использованием инструмента ROBINS-E.&lt;/p&gt;\n&lt;p&gt;Для категориального анализа уровни потребления УПП (высший против низшего) объединялись с использованием ОШ/ОР/ОР и 95% ДИ с моделями ДерСимонян-Лэрд. Связи «доза-эффект» оценивались с использованием одностадийной метарегрессии с надежной оценкой ошибок. Линейные оценки сообщались на каждые 10% общего ежедневного веса/энергопотребления, на каждые 100 г/день и на каждые 10 порций/неделю. Гетерогенность оценивалась с помощью tau² и Q-критерия Кокрена (p&amp;lt;0,10). Статистика I² использовалась для описания несогласованности между исследованиями. Анализ проводился с использованием Review Manager (RevMan) версии 5.4 и R версии 4.6.0. p&amp;lt;0,05 считалось статистически значимым.&lt;/p&gt;\n&lt;p&gt;Процесс поиска в базе данных суммирован на онлайн-дополнительном рисунке S1. Всего было выявлено 10 699 статей. После удаления 1420 дубликатов осталось 9279 статей. После обзора названий и аннотаций 9120 статей были исключены. Полные тексты оставшихся 159 статей были оценены на соответствие критериям, что привело к исключению 108 статей. В конечном итоге было включено 51 исследование.&lt;/p&gt;\n&lt;p&gt;В 51 проспективном когортном исследовании приняли участие 8 819 894 человека. Период наблюдения варьировался от 2 до 32 лет, средний возраст участников — от 23,9 до 77 лет. Размер выборки варьировался от 896 до 5 468 444 человек, 46,4% участников — мужчины. Географически 16 исследований были проведены в Америке, 25 в Европе, восемь в Азии и два в Океании. Все исследования имели низкий риск систематической ошибки, за исключением одного с умеренным риском (онлайн-дополнительная таблица S5).&lt;/p&gt;\n&lt;p&gt;Восемь когорт (118 946 участников) показали, что потребление УПП не было значимо связано с более высоким риском гипертонии (высший против низшего ОР 1,09, 95% ДИ 0,99–1,20). Однако в анализе «доза-эффект» каждые дополнительные 100 г/день были положительно линейно связаны с риском гипертонии (ОР 1,11, 95% ДИ 1,02–1,21; p=0,041; Рис. 1 A). Двенадцать когорт (441 175 участников) показали, что потребление УПП значимо связано с сердечно-сосудистыми событиями (высший против низшего ОР 1,24, 95% ДИ 1,14–1,36). В анализе «доза-эффект» положительные линейные ассоциации наблюдались по всем трем метрикам воздействия: каждые 100 г/день (ОР 1,14, 95% ДИ 1,06–1,22; p=0,002; Рис. 1 B), каждые 10% увеличения доли в весе/энергии (ОР 1,03, 95% ДИ 1,02–1,04; p&amp;lt;0,001) и каждые 10 порций/неделю (ОР 1,10, 95% ДИ 1,04–1,16; p=0,003).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni-f1.jpg\" alt=\"Нелинейный анализ зависимости «воздействие-эффект» между потреблением ультрапереработанных пищевых продуктов и риском ра\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Нелинейный анализ зависимости «воздействие-эффект» между потреблением ультрапереработанных пищевых продуктов и риском развития гипертонии, сердечно-сосудистых заболеваний, онкологических заболеваний, ожирения/избыточного веса, метаболического синдрома/диабета…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Нелинейный анализ зависимости «воздействие-эффект» между потреблением ультрапереработанных пищевых продуктов и риском развития гипертонии, сердечно-сосудистых заболеваний, онкологических заболеваний, ожирения/избыточного веса, метаболического синдрома/диабета и смертности от всех причин. Гипертония (A), сердечно-сосудистые заболевания (B), онкологические заболевания (C), ожирение/избыточный вес (D), метаболический синдром/диабет (E) и смертность от всех причин (F). HR — отношение рисков.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Одиннадцать когорт (1 246 153 участника) показали, что потребление УПП значимо связано с более высоким риском раковых заболеваний (высший против низшего ОР 1,12, 95% ДИ 1,04–1,21). В анализе «доза-эффект» положительные ассоциации наблюдались по всем трем метрикам: каждые 100 г/день (ОР 1,04, 95% ДИ 1,02–1,06; p=0,002; Рис. 1 C), каждые 10% увеличения доли в весе/энергии (ОР 1,01, 95% ДИ 1,01–1,01; p&amp;lt;0,001) и каждые 10 порций/неделю (ОР 1,02, 95% ДИ 1,01–1,03; p&amp;lt;0,001).&lt;/p&gt;\n&lt;p&gt;Четыре когорты (135 685 участников) показали, что потребление УПП значимо связано с ожирением/избыточным весом (высший против низшего ОР 1,23, 95% ДИ 1,17–1,30). Восемь когорт (333 242 участника) показали, что потребление УПП значимо связано с более высоким риском МС/диабета (высший против низшего ОР 1,24, 95% ДИ 1,08–1,42). В анализе «доза-эффект» каждые дополнительные 100 г/день были положительно связаны с риском (ОР 1,02, 95% ДИ 1,01–1,04; p=0,009; Рис. 1 E). Каждые 10% увеличения доли в весе/энергии были положительно линейно связаны с риском МС/диабета (ОР 1,16, 95% ДИ 1,09–1,23; p=0,004).&lt;/p&gt;\n&lt;p&gt;Четыре когорты (228 597 участников) показали, что потребление УПП значимо связано с депрессией/тревожностью (высший против низшего ОР 1,27, 95% ДИ 1,15–1,40). Шесть когорт (6 073 960 участников) показали значимую связь с заболеваниями пищеварительной системы (высший против низшего ОР 1,31, 95% ДИ 1,16–1,48). Девять когорт (400 000 участников) показали значимую связь с смертностью от всех причин (высший против низшего ОР 1,18, 95% ДИ 1,10–1,26).&lt;/p&gt;\n&lt;p&gt;Наш мета-анализ 51 проспективной когорты (8 819 894 участника) показал, что более высокое потребление УПП связано с повышенным риском множественных хронических заболеваний и смертности от всех причин. Поскольку эти состояния часто образуют кластеры мультиморбидности, потребление УПП может быть общим фактором риска. Снижение доли УПП в рационе может стать практичной стратегией смягчения бремени мультиморбидности на уровне популяции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Качество доказательств по GRADE оценено как низкое для большинства исходов (сердечно-сосудистые события, рак, МС/диабет, депрессия, заболевания пищеварительной системы, смертность) и очень низкое для гипертонии, что указывает на необходимость интерпретировать результаты с осторожностью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;УПП имеют низкую питательную ценность и высокую энергетическую плотность, что может ускорять темп приема пищи и задерживать сигналы насыщения, приводя к перееданию. Комбинация пищевых добавок может создавать «коктейльный эффект». Кроме того, в процессе обработки могут образовываться вредные соединения, такие как акриламид (в результате реакции Майяра) и акролеин, а также мигрировать химические вещества из упаковки (например, бисфенол А или S), которые связаны с риском ССЗ.&lt;/p&gt;\n&lt;p&gt;Данные свидетельствуют о том, что более высокое потребление УПП связано с повышенным риском множественных хронических заболеваний. Эти ассоциации могут варьироваться в зависимости от способа количественной оценки воздействия. Учитывая, что связанные с УПП хронические заболевания часто кластеризуются как мультиморбидность, сокращение потребления УПП и их замена минимально обработанными альтернативами могут быть актуальны для профилактики заболеваний и управления ими в первичной медико-санитарной помощи.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рост доли ульт&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рапереработки&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;в рационе&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Метаанализ 51&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;когорты 8,8&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;млн человек&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Риск сердечных&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;патологий выше&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на 24%&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Снижение доли&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;снеков&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сохраняет&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;здоровье&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Family medicine and community health. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Family medicine and community health (Europe PMC)&lt;/td&gt;\n
