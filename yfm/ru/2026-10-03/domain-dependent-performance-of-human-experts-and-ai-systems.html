        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"203\" cy=\"146\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"677\" cy=\"239\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Нейросети против диетологов:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;кому доверить проверку&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;детской тарелки&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Родители всё чаще просят &lt;a href=\"concepts/artificial-intelligence.html\"&gt;чат-боты&lt;/a&gt; составить или проверить меню ребенка, но насколько точны такие расчеты? Исследователи сопоставили выводы 42 ИИ-платформ и 260 врачей с эталонным экспертным консилиумом. Алгоритмы блестяще классифицировали разнообразие рациона и уровень переработки продуктов, опередив людей. Однако в оценке калорийности и размеров порций нейросети допустили самые грубые ошибки, что делает их лишь вспомогательным инструментом.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ИИ точнее людей определяет разнообразие рациона и &lt;a href=\"concepts/ultra-processed-foods.html\"&gt;уровень ультраобработки&lt;/a&gt; продуктов&lt;/li&gt;\n&lt;li&gt;Ошибка ИИ в расчете суточной калорийности детского меню составила 260,3 ккал&lt;/li&gt;\n&lt;li&gt;Чат-боты полезны для скрининга меню, но не способны заменить детского диетолога&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Для эксперимента исследователи отобрали три клинических случая здоровых детей (мальчик 7 лет, девочки 12 и 3 лет) с дневниками питания, точным весом порций и фото блюд. Эталонные значения сформировал консилиум педиатров и нутрициологов, рассчитав профиль по базе данных USDA FoodData Central. Затем эти же данные и запросы на румынском языке без сложного программирования передали 42 платформам искусственного интеллекта в двух конфигурациях (всего 84 сессии) и 260 медицинским специалистам.&lt;/p&gt;\n&lt;p&gt;В оценке качественных характеристик алгоритмы превзошли людей: среднее отклонение ИИ от эталона по шкале пищевого разнообразия составило всего 0,37 ± 0,49 балла, а по степени ультраобработки — 0,33 ± 0,47 балла (у групп врачей расхождения варьировали от 1,15 до 1,57, p = 0,0001). ИИ безошибочно выявляет консервированные продукты, соусы и рафинированные ингредиенты в меню.&lt;/p&gt;\n&lt;p&gt;Однако количественный анализ выявил слабую сторону машин: &lt;a href=\"concepts/mean-absolute-error.html\"&gt;средняя абсолютная ошибка&lt;/a&gt; ИИ в оценке суточной калорийности составила 260,3 ± 194,3 ккал, тогда как у профильных нутрициологов она была равна 148,4 ± 81,5 ккал. Отклонение ИИ в расчете порций достигло 0,488 (95% ДИ: 0,38–0,60) против 0,310 у диетологов. Это доказывает, что скрытые жиры, соусы и уварку ИИ пока рассчитывает неточно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тестирование проводилось всего на трех стандартизированных детских рационах, а анализ ошибки калорийности опирался на малую выборку из 77 полных ответов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Питание играет ключевую роль в росте, нейроразвитии, профилактике ожирения и кардиометаболических нарушений. Однако рутинная оценка детского меню в клинической практике остается трудоемкой и сильно зависит от квалификации специалиста. Технологические инструменты для оценки потребления пищи созданы для стандартизации и снижения нагрузки на респондентов, но их валидность и удобство неоднородны, а многие требуют экспертной интерпретации. В то же время большие языковые модели (LLM) и чат-боты на базе искусственного интеллекта (ИИ) стали общедоступными, позволяя родителям мгновенно получать рекомендации по диете и здоровью детей без прямого контакта с врачами. Недавние исследования показывают, что родители все чаще используют ИИ для педиатрических и нутрициологических запросов, иногда доверяя ИИ больше, чем экспертам, что вызывает опасения относительно безопасности и вытеснения квалифицированных советов.&lt;/p&gt;\n&lt;p&gt;Инструменты оценки диеты на базе ИИ, использующие изображения и мобильные интерфейсы, показывают многообещающие результаты в распознавании продуктов и оценке порций, но количественная оценка нутриентов и энергии остается сложной задачей, особенно когда блюда содержат неизвестные ингредиенты, смешанные компоненты, вариативные рецепты и труднооценимое количество добавленных жиров, масел, соусов и потери при кулинарной обработке. Несмотря на интерес к ИИ-оценке диеты, литература в основном рассматривает изолированные задачи: распознавание еды, оценку порций или прогнозирование нутриентов в упрощенных условиях. Мало исследований напрямую сравнивали результаты ИИ с оценками нескольких групп экспертов при анализе детского меню. В результате остается неясным, различается ли эффективность ИИ в количественных и качественных аспектах оценки меню. Несмотря на точность в контролируемых условиях, текущие инструменты на базе LLM демонстрируют ограничения внешней валидности, зависящие от дизайна промпта, языкового контекста и неполных данных из реальной жизни. В польском исследовании классификации диеты три модели достигли 90,3–94,2% совпадения с экспертами, однако значительные различия между моделью и человеком сохранялись, и экспертный надзор оставался необходимым. Данное исследование было разработано для сравнения точности и эффективности оценки детского меню, выполненной тремя группами экспертов (диетологи, педиатры и врачи других специальностей) и платформами ИИ, с использованием экспертных рейтингов по потреблению энергии, порциям, количественным оценкам и ключевым качественным атрибутам. Путем количественного определения отклонений от эталона и анализа бинарных показателей адекватности мы стремились прояснить роль ИИ как вспомогательного инструмента для скрининга детского меню, а не как замены междисциплинарной клинической экспертизы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИИ показывает многообещающие результаты в распознавании еды, но испытывает трудности с точным расчетом энергии и нутриентов, что делает его вспомогательным, а не замещающим инструментом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы провели наблюдательное кросс-секционное &lt;a href=\"concepts/observational-cross-sectional-study.html\"&gt;сравнительное исследование&lt;/a&gt; в Тыргу-Муреш, Румыния, с использованием анонимизированных педиатрических случаев и стандартизированных инструментов оценки меню. Оценки проводились онлайн в период с марта по июнь 2026 года через защищенные ссылки для экспертов и индивидуальные сессии для платформ ИИ. Исследование одобрено Комитетом по этике Университета медицины, фармации, науки и технологий им. Джордже Эмиля Паладе (документ № 3904/4 марта 2026 г.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдательное исследование фиксирует связи между переменными в текущий момент времени, не доказывая причинно-следственную связь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Были выбраны три случая (мальчик 7 лет, девочка 12 лет, девочка 3 года) без хронических заболеваний для представления различных антропометрических и кардиометаболических профилей. Каждый случай включал данные о возрасте, поле, весе, росте, процентилях ИМТ, скорости метаболизма в покое, кардиометаболических параметрах и подробный дневник питания с описанием порций (вес в граммах), фотографиями и графиком приемов пищи. Междисциплинарная панель из трех клинических диетологов, двух педиатров и одного школьного врача установила эталонные экспертные рейтинги. Общие значения энергии и нутриентов рассчитывались с использованием базы данных USDA FoodData Central.&lt;/p&gt;\n&lt;p&gt;Участники из Румынии были разделены на группы: (1) диетологи (n = 116), (2) педиатры (семейная медицина, школьная медицина, педиатрия, детская гастроэнтерология и др.; n = 56), (3) врачи других специальностей (лабораторная медицина, патология, гигиена и др.; n = 88). Рекрутинг проводился без предварительного отбора для имитации реального спектра специалистов.&lt;/p&gt;\n&lt;p&gt;Было отобрано 42 платформы ИИ, что с учетом двух конфигураций доступа (бесплатный/платный) дало 84 оценки. Каждая оценка ИИ представляла собой завершенный анализ одного педиатрического случая. Промпт на румынском языке требовал: (1) количественной оценки потребления, (2) качественной оценки еды (разнообразие, обработка, цвет, привлекательность), (3) классификации меню, (4) пяти оценок по шкале 1–10. Использовался естественный язык, имитирующий запрос родителя или врача.&lt;/p&gt;\n&lt;p&gt;Человеческие эксперты заполняли структурированный отчет, аналогичный промпту ИИ. Каждому эксперту случайным образом назначался один случай. Первичной аналитической единицей была оценка «эксперт–случай». Все результаты рассчитывались как отклонение от эталона, установленного экспертной панелью.&lt;/p&gt;\n&lt;p&gt;Использовались Microsoft Excel и GraphPad Prism 9. Статистическая значимость α = 0,05. Применялись однофакторный ANOVA и тест Краскела–Уоллиса с последующим тестом Тьюки или Данна для множественных сравнений. Уровень ложных открытий контролировался процедурой Бенджамини–Кригера–Екутиели.&lt;/p&gt;\n&lt;p&gt;В анализ включено 344 оценки (84 ИИ, 116 диетологов, 56 педиатров, 88 врачей других специальностей).&lt;/p&gt;\n&lt;p&gt;Средняя абсолютная ошибка (MAE_kcal) значимо различалась (p = 0,0016). ИИ показал наибольшую ошибку (260,3 ± 194,3 ккал), за ним следуют диетологи (148,4 ± 81,5 ккал) и врачи других специальностей (60,4 ± 53,3 ккал).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка энергии ИИ показала наибольшую погрешность, что критично для педиатрии, где калорийный дисбаланс влияет на рост и метаболизм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки порций различия между группами были значимы (p = 0,003). ИИ показал наименьшие отклонения в оценке разнообразия и уровня обработки продуктов, тогда как человеческие группы были более критичны. В оценке нутритивной ценности диетологи показали наибольшее отклонение (1,00 ± 1,02) по сравнению с другими группами.&lt;/p&gt;\n&lt;p&gt;Результаты показывают, что эффективность зависит от домена оценки. ИИ лучше справляется с описательными атрибутами (разнообразие, обработка), но уступает в количественной точности (энергия, порции). Это подтверждает необходимость гибридной модели: ИИ как инструмент первичного скрининга при обязательном экспертном надзоре.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИИ эффективен для первичного скрининга меню по качественным признакам, но требует профессионального контроля для количественной оценки нутриентов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Риск ошибок ИИ&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;в детском&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;питании&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тест 84 сессий&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ и 260&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;врачей&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ слаб в&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;калориях, но&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точен в типах&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;еды&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Использовать&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ только как&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;подсказку&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Nutrients. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nutrients (Europe PMC)&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Martin-Hadmaș RM, Sovea R, Pol D, Gavra GM, Tarcea M, Neghirlă A, Martin ȘA.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13610824\" target=\"_blan
