        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"205\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"595\" cy=\"165\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · EXTRUSION   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Экструзия против сахарного&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;пика: как обработка сырья&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;меняет усвоение шоколада&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f1.jpg\" alt=\"Диаграмма потока CONSORT дизайна исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Диаграмма потока &lt;a href=\"concepts/consort.html\"&gt;CONSORT&lt;/a&gt; дизайна исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Привычные сладости провоцируют резкий скачок глюкозы и триглицеридов в крови. Японские исследователи проверили, можно ли сгладить этот эффект без изменения рецептуры шоколада, изменив лишь физическую структуру ингредиентов. Часть сахара, какао-массы и сухого молока предварительно пропустили через &lt;a href=\"concepts/twin-screw-extruder.html\"&gt;двухшнековый экструдер&lt;/a&gt; при нагреве до 105 °C. В двойном слепом тесте такой шоколад вызвал существенно меньший инсулиновый выброс и продлил чувство сытости.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Состав плиток идентичен: 33,5% сахарозы и 34% жира, разница лишь в предварительной экструзии части сырья&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt; снизила инсулиновый пик на 30-й минуте с 26,8 до 20,6 мкМЕ/мл и сгладила уровень триглицеридов&lt;/li&gt;\n&lt;li&gt;Замедленное высвобождение сахаров обеспечило участникам более длительное насыщение&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Для эксперимента создали два состава с абсолютно идентичным химическим профилем: 33,5 г сахарозы, 14,5–14,9 г лактозы и около 34 г жира на 100 г продукта. В опытном образце (Cw/E) 33,55% сахара, 6,6% какао тёртого и 14,85% цельного сухого молока предварительно подвергали термомеханической пластификации в двухшнековом экструдере Coperion ZSK34Mv Plus (L/D = 44, скорость шнеков 200 об/мин, температура на выходе около 105 °C, давление влаги 0,05 МПа в 7-й зоне). Полученный экструдат измельчали на штифтовой мельнице через сито 1 мм, после чего обе рецептуры классически вальцевали, коншировали и темперировали при 28–30 °C с формованием плиток по 3,8 г.&lt;/p&gt;\n&lt;p&gt;В рандомизированном перекрёстном исследовании 18 здоровых мужчин (ИМТ 22,5 ± 1,6 кг/м²) съедали по 76 г шоколада натощак. Образец после экструзии показал прирост глюкозы всего на 17,8 ± 6,0 мг/дл через 45 минут против 25,1 ± 6,4 мг/дл у контроля, а концентрация инсулина на 30-й минуте составила 20,6 ± 3,1 мкМЕ/мл против 26,8 ± 3,9 мкМЕ/мл. Уровень сывороточных триглицеридов вплоть до 180-й минуты оставался значительно ниже, а тест растворимости in vitro подтвердил, что сахар из экструдированной матрицы высвобождается в воду заметно медленнее.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выборка ограничена 18 здоровыми японскими мужчинами с нормальным весом, поэтому метаболический ответ у женщин и людей с диабетом требует отдельной проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Хотя сахара и липиды являются важными компонентами питания, их избыточное потребление связано с ожирением, метаболическим синдромом, диабетом и сердечно-сосудистыми заболеваниями. Гипергликемия и резкие колебания уровня глюкозы в крови после еды негативно влияют на функцию эндотелия и усиливают окислительный стресс. Оптимальный контроль уровня глюкозы важен для поддержания здоровья. Современный подход к питанию предполагает переход от жестких ограничений к целостному восприятию еды, где учитываются не только нутриенты, но и способы их обработки, влияющие на усвоение.&lt;/p&gt;\n&lt;p&gt;Экструзия — процесс непрерывного смешивания и замешивания при высоких температурах и давлении — широко используется в производстве снеков и сухих завтраков. Исследования показывают, что экструзия может изменять структуру крахмала и липидов, влияя на их перевариваемость. В данном исследовании проверялась гипотеза о том, что экструзия шоколада влияет на &lt;a href=\"concepts/postprandial-metabolic-response.html\"&gt;постпрандиальный метаболический ответ&lt;/a&gt; и устойчивость сахаров к растворению в воде.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экструзия шоколада может замедлять растворение сахаров и снижать постпрандиальный уровень глюкозы, инсулина и триглицеридов в крови, что способствует более длительному ощущению сытости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В рандомизированном двойном слепом исследовании (CONSORT) участвовали 18 здоровых японских мужчин (20–60 лет, ИМТ 20,0–24,9). Участники потребляли 76 г шоколада, изготовленного с применением экструзии (Cw/E) или без неё (Cw/oE). Состав обоих образцов был идентичен. Уровни глюкозы, инсулина и триглицеридов измерялись натощак и в течение 180 минут после еды. Также оценивались показатели аппетита и устойчивость компонентов шоколада к растворению в симулированной желудочной среде.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CONSORT — стандарт отчетности для рандомизированных испытаний, обеспечивающий прозрачность дизайна исследования и минимизацию предвзятости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на небольшой группе (18 человек) исключительно здоровых мужчин, что ограничивает возможность экстраполяции результатов на женщин, детей и людей с метаболическими нарушениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Уровни глюкозы, инсулина и триглицеридов натощак не различались между группами. После употребления Cw/E наблюдались более низкие показатели инсулина (через 30 мин) и триглицеридов (через 30 и 45 мин) по сравнению с Cw/oE. Интегральные показатели (&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;iAUC&lt;/a&gt;) для инсулина были значимо ниже в группе Cw/E. Ощущение сытости через 120 минут было выше в группе Cw/E. В тестах in vitro растворение сахарозы и лактозы из шоколада Cw/E происходило медленнее, чем из Cw/oE.&lt;/p&gt;\n&lt;p&gt;Результаты подтверждают, что способ обработки пищевых продуктов влияет на их метаболический ответ. Замедленное растворение сахаров в шоколаде, прошедшем экструзию, вероятно, обусловлено формированием структурного «каркаса» или изменением вязкости, что замедляет всасывание нутриентов. Это позволяет сохранять вкусовые качества продукта при снижении нагрузки на метаболизм. Необходимы дальнейшие исследования для оценки долгосрочных эффектов и механизмов влияния на гормоны сытости (например, GLP-1).&lt;/p&gt;\n&lt;p&gt;Экструзия шоколада способствует снижению постпрандиальных пиков глюкозы, инсулина и триглицеридов и помогает поддерживать чувство сытости. Данный метод обработки является перспективным инструментом для создания продуктов, способствующих поддержанию метаболического здоровья.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f1.jpg\" alt=\"Диаграмма потока CONSORT дизайна исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Диаграмма потока CONSORT дизайна исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f2.jpg\" alt=\"Изменения во времени уровней (A) глюкозы в плазме, (B) инсулина в сыворотке и (C) триглицеридов в сыворотке после употре\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Изменения во времени уровней (A) глюкозы в плазме, (B) инсулина в сыворотке и (C) триглицеридов в сыворотке после употребления шоколада, обработанного или не обработанного методом экструзии (Cw/E и Cw/oE соответственно). Погрешности указывают стандартную ошибку среднего (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;). &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1, разница между двумя группами.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f3.jpg\" alt=\"Инкрементальные площади под кривыми (iAUC) во времени для изменений уровней (A) глюкозы в плазме, (B) инсулина в сыворот\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Инкрементальные площади под кривыми (iAUC) во времени для изменений уровней (A) глюкозы в плазме, (B) инсулина в сыворотке и (C) триглицеридов в сыворотке после употребления шоколада, обработанного или не обработанного методом экструзии (Cw/E и Cw/oE соответственно). Погрешности указывают SEM. &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1, разница между двумя группами.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f4.jpg\" alt=\"Изменения показателей аппетита участников после употребления шоколада, обработанного или не обработанного методом экстру\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Изменения показателей аппетита участников после употребления шоколада, обработанного или не обработанного методом экструзии (Cw/E и Cw/oE соответственно). (A) Чувство голода; (B) чувство сытости; (C) желание поесть. Погрешности указывают SEM. &lt;em&gt;p &amp;lt; 0,05; разница между двумя группами.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f5.jpg\" alt=\"Профили концентрации (A) сахарозного эквивалента и (B) лактозы во время инкубации в имитированном желудочном растворе дл\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Профили концентрации (A) сахарозного эквивалента и (B) лактозы во время инкубации в имитированном желудочном растворе для растворения с использованием шоколада, обработанного или не обработанного методом экструзии (Cw/E и Cw/oE соответственно). Погрешности указывают SEM. &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1; разница между двумя группами.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Резкие скачки&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сахара от&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сладостей&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Двойной слепой&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тест шоколада&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;с Cw/E&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\
