            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"88\" cy=\"72\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"271\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SOUS_VIDE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жидкий дым и наноэмульсия&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;продлевают свежесть мидий&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;су-вид до 24 дней&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f1.jpg\" alt=\"Результаты цветового анализа групп. Control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное жидким дым\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Результаты цветового анализа групп. Control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное жидким дымом и подвергнутое SV-обработке; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и подвергнутое SV; DNS: группа мяса мидий, обработанная наноэмульсией подсолнечного масла + ароматизатор «&lt;a href=\"concepts/liquid-smoke.html\"&gt;жидкий дым&lt;/a&gt;» (жирорастворимый, 5%) и подвергнутая SV.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/mediterranean-mussel.html\"&gt;Черноморские мидии&lt;/a&gt; — крайне скоропортящийся деликатес, который сложно транспортировать и хранить без заморозки. Исследователи протестировали &lt;a href=\"concepts/hurdle-technology.html\"&gt;барьерный метод консервации&lt;/a&gt;, соединив готовку в вакууме при 85 °C с коптильным ароматизатором и подсолнечной наноэмульсией. Такой подход сдержал окисление липидов, замедлил накопление летучего азота и сохранил упругую структуру волокон. Срок безопасного хранения моллюсков в холодильнике при 3 °C вырос до 24 суток.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/sous-vide.html\"&gt;Су-вид&lt;/a&gt; при 85 °C (10 мин) с жидким дымом и наноэмульсией продлевает срок хранения мидий при 3 °C с 18 до 24 суток&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tvb-n.html\"&gt;Летучий базисный азот&lt;/a&gt; (TVB-N) в группе с наноэмульсией и дымом удерживался значительно ниже нормы в 35 мг N/100 г&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nanoemulsion.html\"&gt;Ультразвуковая наноэмульсия&lt;/a&gt; уменьшает размер капель до 190 нм при нагреве, стабилизируя структуру мышечных волокон&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"rezhimy\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#rezhimy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режимы&lt;/span&gt;&lt;/a&gt;Режимы&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Продукт&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Способ&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Температура&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Время&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Результат&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Мясо мидий (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Су-вид (контроль)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 мин&lt;/td&gt;\n&lt;td&gt;Срок хранения 18 дней при 3 °C; затем превышение микробиологического лимита&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мясо мидий (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Су-вид + 5% жидкий дым (SS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 мин&lt;/td&gt;\n&lt;td&gt;Срок хранения продлен до 21 дня при 3 °C; сдерживание роста микрофлоры&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мясо мидий (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Су-вид + наноэмульсия масла (ANS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 мин&lt;/td&gt;\n&lt;td&gt;Срок хранения 18 дней при 3 °C; аналогичен контролю по микробиологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мясо мидий (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Су-вид + наноэмульсия с жидким дымом (DNS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 мин&lt;/td&gt;\n&lt;td&gt;Срок хранения 24 дня при 3 °C; минимальный TVB-N и стабильная текстура&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Технология су-вид (sous-vide, пастеризация продуктов в вакуумной упаковке) при 85 °C в течение 10 минут обеспечивает базовую микробиологическую безопасность мидий, однако в чистом виде (контрольная группа) бактериальный порог превышается уже к 18-му дню хранения при температуре 3 °C. Чтобы отодвинуть рамки порчи без синтетических консервантов, технологи применили барьерный подход (hurdle technology): объединили мягкий нагрев с 5%-м жирорастворимым жидким дымом и наноэмульсией на основе подсолнечного масла (соотношение мяса к эмульсии 2:1). В состав эмульсии входили вода (80%), масло (4–14%), пищевой эмульгатор полисорбат 80 (Tween 80, 3%) и этанол (3%), гомогенизированные на ультразвуковом процессоре при мощности 51%.&lt;/p&gt;\n&lt;p&gt;Комплексная группа DNS (наноэмульсия с жидким дымом) показала синергетический эффект: капли эмульсии в процессе термообработки уменьшились с 253 нм до 190,15 нм, сохранив стабильность за счёт дзета-потенциала от -24,45 до +27,10 мВ. Это обеспечило глубокое распределение фенольных соединений, защитивших мышечные волокна от гидролиза и термического разрушения, что подтвердили данные электронной микроскопии (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;) и инфракрасной спектроскопии (FTIR). К 24-му дню в группе DNS общий летучий базисный азот (TVB-N) оставался существенно ниже критического норматива 35 мг N/100 г, а накопление свободных жирных кислот оказалось минимальным, тогда как контрольные мидии испортились к 18-му дню, а образцы только с жидким дымом (SS) — к 21-му дню.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Испытания проводились исключительно на средиземноморских мидиях из Черного моря при строгом соблюдении температуры хранения 3 °C; дегустационная выборка составила 6 экспертов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Морепродукты являются важным и устойчивым источником белка для растущего населения планеты. Среди различных водных видов средиземноморская мидия (Mytilus galloprovincialis) считается весьма перспективным источником пищи благодаря высокому содержанию качественного белка, богатому профилю полиненасыщенных жирных кислот и незаменимым макро- и микроэлементам. Среднее мировое потребление двустворчатых моллюсков составляет 2,6 кг на душу населения, а мировое производство моллюсков в 2023 году достигло 25,8 млн тонн, что составляет 14% от общего объема продукции рыболовства и аквакультуры. В связи с этим растущим спросом в Турции в последнее время наблюдается быстрый рост сектора аквакультуры, особенно в области выращивания мидий. За последние несколько лет культивирование мидий стало четвертым по темпам роста сегментом аквакультуры в Турции после форели, сибаса и морского леща. Из-за фильтрационного способа питания мидии крайне восприимчивы к загрязнению окружающей среды и быстро портятся; срок хранения этого продукта при охлаждении строго ограничен и составляет от 1 до 2 дней (сырые) и от 5 до 6 дней (обработанные), главным образом из-за микробной порчи и потенциального размножения патогенных бактерий. Кроме того, несоблюдение гигиенических стандартов при переработке может повысить уровень патогенной микрофлоры и ускорить порчу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мидии — ценный источник белка, но из-за фильтрационного питания и высокой влажности они быстро портятся (срок хранения 1–6 дней), что требует применения технологий консервации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В условиях растущего потребительского спроса на свежие, минимально обработанные морепродукты, сохраняющие максимальную пищевую ценность, все чаще применяются мягкие методы термической обработки. Хотя продукты, прошедшие мягкую термообработку и охлаждение, могут вызывать опасения у общественности относительно микробиологической безопасности, Европейский союз рекомендует тепловую обработку при 60–95 °C в течение 10–30 минут для обеспечения отсутствия патогенов. Кроме того, высокое содержание влаги в мясе мидий ограничивает срок его хранения, препятствуя дистрибуции в отдаленные регионы, что подчеркивает необходимость технологий переработки для продления срока годности и выхода на новые рынки. Однако традиционные методы консервации, такие как замораживание, могут ухудшить общее качество за счет снижения сенсорных характеристик, особенно текстуры и вкуса. Это указывает на критический пробел в отрасли, требующий разработки безопасных стратегий консервации с использованием нескольких барьеров (hurdle technology) для вывода на рынок высококачественных продуктов из мидий.&lt;/p&gt;\n&lt;p&gt;Для безопасного продления срока хранения мидий и сохранения их «свежих» сенсорных свойств применялись различные методы: варка/вакуумная упаковка, копчение, консервирование, жарка/запекание и пастеризация в красном соусе. Поскольку сырое мясо мидий быстро портится, термическая обработка является обязательной и требует точного регулирования температуры и времени для оптимизации качества. В этом контексте метод су-вид (SV) — приготовление вакуумированных продуктов при точно контролируемых параметрах — минимизирует потерю питательных веществ, инактивируя ферменты деградации и микроорганизмы. Это согласуется с технологиями «cook-chill», включающими приготовление при температуре ниже 100 °C, быстрое охлаждение до 0–3 °C и хранение в охлажденном виде. Для мидий рекомендуется обработка SV при 85 °C в течение 10 минут; однако, поскольку не протеолитические штаммы Clostridium botulinum могут вырабатывать токсины в течение 31 дня при 3,3 °C, срок хранения морепродуктов, обработанных методом SV, обычно ограничивается 28 днями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод су-вид (sous-vide) — это приготовление пищи в вакуумной упаковке при строго контролируемой температуре, что позволяет сохранить текстуру и питательные вещества, но требует соблюдения температурного режима для безопасности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для преодоления этого ограничения и улучшения консервации можно интегрировать фракции жидкого дыма, инактивирующие патогены. Жидкий дым, получаемый путем пиролиза биомассы, содержит карбонилы и фенолы, которые определяют вкус, цвет, pH и срок хранения продукта благодаря антибактериальной и антиоксидантной активности. Предлагая более безопасную и стандартизируемую альтернативу с меньшим накоплением полициклических ароматических углеводородов (ПАУ) по сравнению с традиционным копчением, он применим путем распыления, погружения или прямого введения. Для дальнейшей оптимизации доставки и эффективности таких биоактивных антимикробных средств в морепродуктах появились наноэмульсионные системы. Эти системы эффективно повышают антимикробную активность и облегчают включение летучих эфирных масел в пищевые матрицы, увеличивая их распределение в зонах, где активно размножаются микроорганизмы. В последнее время применение наноэмульсий к водным продуктам приобрело значительный импульс. Существующая литература показывает, что наноэмульсии в основном используются для таких видов рыб, как форель, морской лещ и сибас, причем исследования неизменно демонстрируют их эффективность в продлении срока хранения этих продуктов. Однако, насколько нам известно, ни одна литература не рассматривает синергетические эффекты сочетания наноэмульсии, жидкого дыма и обработки SV у двустворчатых моллюсков, в частности мидий. Чтобы восполнить этот пробел, в данном исследовании комплексно оценивалась интеграция ароматизатора «жидкий дым» и наноэмульсий наряду с термической обработкой SV в качестве технологии с несколькими барьерами для консервации мидий. Мидии (6–7 см) обрабатывались различными комбинациями этих инновационных методов и систематически хранились при 3 °C в течение 27 дней. Эффективность консервации и лежащие в ее основе синергетические воздействия изучались с помощью комплексной многопараметрической системы, включающей отслеживание макропоказателей качества, таких как pH мяса, изменение цвета, сенсорные характеристики, накопление общего летучего основного азота (TVB-N), образование свободных жирных кислот (FFA) и микробиологическую нагрузку. Важно отметить, что для более глубокого понимания влияния обработок на пищевую матрицу структурная целостность тканей и молекулярная характеристика исследовались с помощью сканирующей электронной микроскопии (SEM) и Фурье-ИК-спектроскопии (&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;FT-IR&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Использовались реактивы аналитической чистоты: борная кислота (CAS 10043-35-3), оксид магния (CAS 1309-48-4), агар для подсчета микроорганизмов (PCA), усиленный клостридиальный агар (RCM), фиолетово-красный желчный агар (VRBA), пептон, хлорид натрия (Merck, DE); этанол (99,5%, Carlo Erba Regents, FR); индикатор Таширо, фенолфталеин (ChemBio, TR); жидкий парафин (QLP, TR); соляная кислота (Honeywell Fluka, AT); гидроксид калия (AFG Bioscience, USA); диэтиловый эфир (Isolab Chemicals, DE); картофельно-декстрозный агар (PDA, Biolife, IT); маслорастворимый жидкий дым (Alfasol, TR); Твин 80 (Sigma-Aldrich, DE).&lt;/p&gt;\n&lt;p&gt;Всего 77 кг свежих живых средиземноморских мидий (Mytilus galloprovincialis, длина раковины 6–7 см) было выловлено в апреле 2025 года на коммерческой ферме в Черном море (санитарная классификация класса А). Вылов проводился механизированным судном с системой непрерывного подъема для минимизации травм. После вылова мидии упаковывались в сетчатые мешки из полиэтилена высокой плотности и немедленно помещались в контейнеры с охлажденной морской водой и дробленым льдом (0–2 °C). Транспортировка в лабораторию заняла около 40 минут при строгом соблюдении холодовой цепи. В лаборатории поврежденные или нежизнеспособные особи отбраковывались, остальные промывались холодной проточной водой (4 ± 1 °C). Для вскрытия раковин мидии погружали в кипящую воду (100 °C) на 2 минуты, после чего мясо извлекалось, а биссусные нити удалялись. В исследовании использовалось 9650 г мяса мидий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для анализа использовались только живые, неповрежденные мидии, прошедшие первичную термическую обработку для извлечения мяса, после чего проводилась подготовка к упаковке в асептических условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наноэмульсии (NA и ND) готовились по методу Hamouda et al. Состав NA: 80% дистиллированной воды, 14% подсолнечного масла, 3% этанола, 3% Твин 80. Состав ND: 80% воды, 4% масла, 3% этанола, 3% Твин 80 и 10% жидкого дыма (конечная концентрация в смеси для обработки мидий — 5%). Ингредиенты перемешивались на магнитной мешалке (900 об/мин, 30 мин), затем для ND добавлялся жидкий дым (еще 15 мин). Смеси выдерживались при 86 °C в течение 1 часа, охлаждались, разбавлялись водой и гомогенизировались ультразвуковым зондом (HD 2200, Bandelin Sonopuls, Германия) в течение 15 минут. Перед хранением при 4 °C эмульсии стерилизовались УФ-лампой (20 мин).&lt;/p&gt;\n&lt;p&gt;Мясо мидий порционировалось по 100 г. В группах ANS и DNS соотношение мяса к наноэмульсии составляло 2:1. Упаковка проводилась в асептических условиях в многослойные вакуумные пакеты (PE/PA/PE, 90 мкм) на машине Abant MG42 (95% вакуум). Обработка SV проводилась при 85 °C в течение 10 минут (PackTech IPX7). После обработки пакеты охлаждались в ледяной воде (10 мин) и хранились при +3 °C в течение 27 дней. Группы: Control (только SV), SS (5% жидкого дыма + SV), ANS (наноэмульсия масла + SV), DNS (наноэмульсия масла + 5% жидкого дыма + SV).&lt;/p&gt;\n&lt;p&gt;Анализировались: дзета-потенциал, размер частиц (DLS), pH (WTW ProfiLine 3110), цвет (CIE L&lt;em&gt;a&lt;/em&gt;b*, Konica Minolta CR-400), TVB-N (метод Лудорфа и Мейера), свободные жирные кислоты (метод AOAC), текстура (Brookfield CT3), SEM (FEI Quanta FEG 250), FTIR (Bruker Alpha II). Микробиологические показатели: мезофильные и психрофильные аэробные бактерии (PCA), анаэробные бактерии (RCA), плесени и дрожжи (PDA), колиформные бактерии (VRBA). Сенсорная оценка проводилась по 5-балльной шкале 6 обученными экспертами. Статистика: Tukey HSD (p &amp;lt; 0,05), ANOVA, PCA (R 4.5.2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f1.jpg\" alt=\"Результаты цветового анализа групп. Control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное жидким дым\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Результаты цветового анализа групп. Control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное жидким дымом и подвергнутое SV-обработке; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и подвергнутое SV; DNS: группа мяса мидий, обработанная наноэмульсией подсолнечного масла + ароматизатор «жидкий дым» (жирорастворимый, 5%) и подвергнутая SV.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f2.jpg\" alt=\"Результаты анализа pH, TVB-N и FFA в группах. Control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Результаты анализа pH, TVB-N и FFA в группах. Control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное жидким дымом и подвергнутое SV-обработке; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и подвергнутое SV; DNS: группа мяса мидий, обработанная наноэмульсией подсолнечного масла + ароматизатор «жидкий дым» (жирорастворимый, 5%) и подвергнутая SV.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f3.jpg\" alt=\"Результаты анализа текстуры групп. Разные строчные буквы на графике указывают на межгрупповые различия, наблюдаемые при \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Результаты анализа текстуры групп. Разные строчные буквы на графике указывают на межгрупповые различия, наблюдаемые при хранении внутри одной группы (p &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Результаты анализа текстуры групп. Разные строчные буквы на графике указывают на межгрупповые различия, наблюдаемые при хранении внутри одной группы (p &amp;lt; 0,05). Control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное жидким дымом и подвергнутое SV-обработке; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и подвергнутое SV; DNS: группа мяса мидий, обработанная наноэмульсией подсолнечного масла + ароматизатор «жидкий дым» (жирорастворимый, 5%) и подвергнутая SV. (a) Твердость, (b) адгезивность, (c) упругость (resilience), (d) пружинистость, (e) когезивность, (f) жевательная способность.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f4.jpg\" alt=\"СЭМ-изображения групп и сырых мидий ((a) сырое мясо мидий\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;СЭМ-изображения групп и сырых мидий ((a) сырое мясо мидий&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;СЭМ-изображения групп и сырых мидий ((a) сырое мясо мидий, (b) 0-й день, контроль, (c) 27-й день, контроль, (d) 0-й день, ANS, (e) 27-й день, ANS, (f) 0-й день, DNS, (g) 27-й день, DNS, (h) 0-й день, SS, (i) 27-й день, SS). Control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное жидким дымом и подвергнутое SV-обработке; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и подвергнутое SV; DNS: группа мяса мидий, обработанная наноэмульсией подсолнечного масла + ароматизатор «жидкий дым» (жирорастворимый, 5%) и подвергнутая SV.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f5.jpg\" alt=\"Точные ИК-фурье спектры групп на 0-й и 27-й дни (a и b).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Точные ИК-фурье спектры групп на 0-й и 27-й дни (a и b).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Точные ИК-фурье спектры групп на 0-й и 27-й дни (a и b). Детальный вид области амида I (c). Интенсивность вторых производных в области амида I (d). Гауссова деконволюция соотношений вторичной структуры в области амида I (e). (Raw: свежее мясо мидий, control: мясо мидий, подвергнутое только SV; SS: мясо мидий, обработанное жидким дымом и подвергнутое SV-обработке; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и подвергнутое SV; DNS: группа мяса мидий, обработанная наноэмульсией подсолнечного масла + ароматизатор «жидкий дым» (жирорастворимый, 5%) и подвергнутая SV).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f6.jpg\" alt=\"Результаты микробиологического анализа групп (лог КОЕ г−1).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Результаты микробиологического анализа групп (лог КОЕ г−1).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Результаты микробиологического анализа групп (лог КОЕ г−1). (a) Общее количество мезофильных аэробных бактерий (КМАФАнМ), (b) общее количество психрофильных аэробных бактерий, (c) общее количество анаэробных бактерий и (d) общее количество дрожжей и плесневых грибов. Control: мясо мидий, подвергнутое только вакуумной упаковке (SV); SS: мясо мидий, обработанное жидким дымом и вакуумной упаковкой; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и вакуумной упаковкой; DNS: мясо мидий, обработанное наноэмульсией подсолнечного масла с ароматизатором «жидкий дым» (жирорастворимый, 5%) и вакуумной упаковкой.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f7.jpg\" alt=\"Результаты сенсорного анализа сырого мяса мидий.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Результаты сенсорного анализа сырого мяса мидий.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f8.jpg\" alt=\"Результаты сенсорного анализа приготовленных групп. Control: мясо мидий, подвергнутое только вакуумной упаковке (SV); SS\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Результаты сенсорного анализа приготовленных групп. Control: мясо мидий, подвергнутое только вакуумной упаковке (SV); SS: мясо мидий, обработанное жидким дымом и вакуумной упаковкой; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и вакуумной упаковкой; DNS: мясо мидий, обработанное наноэмульсией подсолнечного масла с ароматизатором «жидкий дым» (жирорастворимый, 5%) и вакуумной упаковкой.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f9.jpg\" alt=\"Многофакторный анализ влияния показателей качества (OA, TVB-N, FFAs, TMAB, TAN, TPB и TYM) на группы обработки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Многофакторный анализ влияния показателей качества (OA, TVB-N, FFAs, TMAB, TAN, TPB и TYM) на группы обработки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Многофакторный анализ влияния показателей качества (OA, TVB-N, FFAs, TMAB, TAN, TPB и TYM) на группы обработки. Control: мясо мидий, подвергнутое только вакуумной упаковке (SV); SS: мясо мидий, обработанное жидким дымом и вакуумной упаковкой; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и вакуумной упаковкой; DNS: мясо мидий, обработанное наноэмульсией подсолнечного масла с ароматизатором «жидкий дым» (жирорастворимый, 5%) и вакуумной упаковкой.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f10.jpg\" alt=\"Ухудшение качества во времени при хранении — анализ траекторий методом главных компонент (PCA).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ухудшение качества во времени при хранении — анализ траекторий методом главных компонент (PCA).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Ухудшение качества во времени при хранении — анализ траекторий методом главных компонент (PCA). Control: мясо мидий, подвергнутое только вакуумной упаковке (SV); SS: мясо мидий, обработанное жидким дымом и вакуумной упаковкой; ANS: мясо мидий, обработанное наноэмульсией подсолнечного масла и вакуумной упаковкой; DNS: мясо мидий, обработанное наноэмульсией подсолнечного масла с ароматизатором «жидкий дым» (жирорастворимый, 5%) и вакуумной упаковкой.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мидии портятся&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;за считаные&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дни&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Су-вид 85 °C с&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;наноэмульсией&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;и дымом&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Хранение&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выросло с 18&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;до 24 дней&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\
