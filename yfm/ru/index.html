ect-of-hyaluronic-acid-molecular-weight-on-physicochemica-card.jpg"},"content":{"title":"Гиалуроновая кислота в&amp;nbsp;мороженом: как молекулярный вес меняет текстуру десерта","text":"&lt;p&gt;Ученые проверили, может ли гиалуроновая кислота заменить привычные стабилизаторы в составе домашнего мороженого.&lt;/p&gt;\n","links":[{"url":"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-card.jpg"},"content":{"title":"Жировая болезнь печени: почему число новых случаев удвоилось за&amp;nbsp;три десятилетия","text":"&lt;p&gt;Неалкогольная жировая болезнь печени становится глобальным вызовом. Разбираемся в статистике и трендах за последние 30 лет.&lt;/p&gt;\n","links":[{"url":"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-card.jpg"},"content":{"title":"Кактус вместо пластика: новая жизнь отходов опунции в&amp;nbsp;упаковке","text":"&lt;p&gt;Ученые превратили отходы кактуса опунции в биоразлагаемую пленку, которая может заменить пластик в пищевой промышленности.&lt;/p&gt;\n","links":[{"url":"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese-card.jpg"},"content":{"title":"Гель из&amp;nbsp;алоэ вера против порчи манго: как сохранить свежесть фруктов","text":"&lt;p&gt;Ученые выяснили, что покрытие из алоэ вера вдвое эффективнее меда защищает нарезанное манго от порчи и потери влаги.&lt;/p&gt;\n","links":[{"url":"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-card.jpg"},"content":{"title":"Почему разогрев крахмала не&amp;nbsp;всегда делает его легче для пищеварения","text":"&lt;p&gt;Мы привыкли, что горячая еда усваивается лучше, но с крахмалистыми продуктами всё сложнее. Разбираемся, как структура геля меняет правила игры.&lt;/p&gt;\n","links":[{"url":"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 06.10.2026","url":"2026-10-06/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-card.jpg"},"content":{"title":"Конопля и&amp;nbsp;овес: как ферментация меняет структуру растительного белка","text":"&lt;p&gt;Разбираемся, как смешивание жмыха конопли и овса с последующей ферментацией помогает улучшить качество растительных аналогов мяса.&lt;/p&gt;\n","links":[{"url":"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu-card.jpg"},"content":{"title":"Цинк против углеводного стресса: как накормить рыбу правильно","text":"&lt;p&gt;Высокоуглеводная диета вредит рыбе, но добавление цинка помогает восстановить обмен веществ и чувствительность к инсулину.&lt;/p&gt;\n","links":[{"url":"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe-card.jpg"},"content":{"title":"Скрытая жизнь орехового сыра: что на&amp;nbsp;самом деле происходит в&amp;nbsp;ферментированных аналогах","text":"&lt;p&gt;Мы проверили крафтовые сыры из кешью на безопасность и нашли там кое-что интересное, кроме полезных бактерий.&lt;/p&gt;\n","links":[{"url":"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f-card.jpg"},"content":{"title":"Как поймать аромат жареного: новый биосенсор для определения пиразинов","text":"&lt;p&gt;Ученые создали «электронный нос» на основе человеческого рецептора, который чувствует запах жареного хлеба и кофе точнее приборов.&lt;/p&gt;\n","links":[{"url":"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n-card.jpg"},"content":{"title":"Кристаллы каннабидиола в&amp;nbsp;БАДах: европейский регулятор не&amp;nbsp;признал безопасность изолята","text":"&lt;p&gt;EFSA заблокировала заявку на изолят CBD: производитель не подтвердил наночастицы и чистоту сырья.&lt;/p&gt;\n","links":[{"url":"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct-card.jpg"},"content":{"title":"Сладкие яблоки уступают кислым по&amp;nbsp;антиоксидантной защите","text":"&lt;p&gt;Химический анализ мякоти 12 сортов яблок показал: высокое содержание сахара часто означает минимум фенолов.&lt;/p&gt;\n","links":[{"url":"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-card.jpg"},"content":{"title":"L-теанин против токсинов: как чай помогает печени справляться с&amp;nbsp;тяжелыми металлами","text":"&lt;p&gt;Ученые выяснили, что аминокислота из чая может защищать клетки печени от повреждений, вызванных кадмием.&lt;/p&gt;\n","links":[{"url":"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-card.jpg"},"content":{"title":"Самцы или самки: почему одни мидии в&amp;nbsp;морозилке прогоркают быстрее других","text":"&lt;p&gt;Самки и самцы толстостенной мидии стареют на холоде совершенно по-разному: окисление липидов у самок в 1,7 раза выше.&lt;/p&gt;\n","links":[{"url":"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo-card.jpg"},"content":{"title":"Как перестать гадать, сколько вы&amp;nbsp;съели: цифровой атлас порций","text":"&lt;p&gt;Ученые создали базу данных с фотографиями и составом блюд, чтобы точно оценивать размер порций и калорийность рациона.&lt;/p&gt;\n","links":[{"url":"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 05.10.2026","url":"2026-10-05/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides-card.jpg"},"content":{"title":"Как подружить кофе и&amp;nbsp;яблоки: природный катализатор для создания функциональных продуктов","text":"&lt;p&gt;Ученые нашли способ соединить кофейные антиоксиданты с молочными пептидами, используя яблочный сок вместо агрессивной химии.&lt;/p&gt;\n","links":[{"url":"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/comparative-evaluation-of-white-quinoa-and-tri-color-quinoa-card.jpg"},"content":{"title":"Разноцветная крупа против язвы: почему смесь киноа защищает желудок лучше белых зерен","text":"&lt;p&gt;Обезболивающие разрушают слизистую желудка, но хлеб с трехцветным киноа снизил некроз тканей на 83%.&lt;/p&gt;\n","links":[{"url":"2026-10-05/comparative-evaluation-of-white-quinoa-and-tri-color-quinoa.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi-card.jpg"},"content":{"title":"Как превратить отходы морепродуктов в&amp;nbsp;ценный пищевой белок","text":"&lt;p&gt;Мантия гребешка обычно отправляется в мусор. Технологи нашли способ превратить её в функциональный белок с помощью изменения pH.&lt;/p&gt;\n","links":[{"url":"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"Как устроен ФудСигнал","items":[{"title":"Отбор","text":"&lt;p&gt;Каждый день модель сравнивает десятки свежих исследований и выбирает самые значимые и понятные.&lt;/p&gt;\n"},{"title":"Разбор","text":"&lt;p&gt;Суть, ключевые выводы и ограничения — простым языком, но без упрощений.&lt;/p&gt;\n"},{"title":"Три языка","text":"&lt;p&gt;Каждый материал выходит на русском, узбекском и казахском.&lt;/p&gt;\n"},{"title":"Рисунки и&amp;nbsp;полный текст","text":"&lt;p&gt;Иллюстрации из самих статей, а для открытых лицензий — полный перевод.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Вопросы","items":[{"title":"&lt;p&gt;Это рецензированные статьи?&lt;/p&gt;\n","text":"&lt;p&gt;Нет, это препринты — свежие работы до рецензирования. В каждом материале отмечены ограничения исследования.&lt;/p&gt;
