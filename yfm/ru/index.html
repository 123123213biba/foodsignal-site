,{"title":"Новая еда","tabName":"Новая еда · 2","text":"&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;Почему мы выбираем растительный йогурт: вкус или этикетка?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html\"&gt;Клеточное мясо: арахис и киноа заменят животный белок в производстве&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/newfood.html\"&gt;Все материалы темы →&lt;/a&gt;&lt;/p&gt;\n","media":{"image":"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer-card.jpg"}},{"title":"Безопасность и&amp;nbsp;хранение","tabName":"Безопасность и хранение · 2","text":"&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html\"&gt;Может ли коллаген защитить желудок от последствий алкоголя&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html\"&gt;Как эфирное масло тимьяна помогает куриному филе дольше оставаться свежим&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/safety.html\"&gt;Все материалы темы →&lt;/a&gt;&lt;/p&gt;\n","media":{"image":"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa-card.jpg"}},{"title":"Нутриенты","tabName":"Нутриенты · 2","text":"&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html\"&gt;Как заставить сывороточный белок работать дольше: молекулярный «клей» для мышц&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html\"&gt;Почему ужинать вдвоем полезнее для здоровья, чем в одиночку&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/nutrition.html\"&gt;Все материалы темы →&lt;/a&gt;&lt;/p&gt;\n","media":{"image":"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par-card.jpg"}},{"title":"Другое","tabName":"Другое · 1","text":"&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/broccoli-sprout-extract-restores-renal-lipid-metabolism-in-h.html\"&gt;Могут ли ростки брокколи защитить почки при избытке жиров в рационе&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"topics/other.html\"&gt;Все материалы темы →&lt;/a&gt;&lt;/p&gt;\n","media":{"image":"2026-10-02/broccoli-sprout-extract-restores-renal-lipid-metabolism-in-h-card.jpg"}}]},{"type":"header-block","title":"ФудСигнал в Telegram","description":"&lt;p&gt;Каждый день — по одному материалу с карточкой и рисунками из статьи. Наведите камеру на QR-код.&lt;/p&gt;\n","theme":"dark","width":"m","image":"qr-telegram.svg","verticalOffset":"s","background":{"color":"#1F7A5C","image":"home-tg-5.jpg"},"buttons":[{"text":"Открыть канал","url":"https://t.me/oba_boba","theme":"normal-contrast"}]},{"type":"header-block","title":"Приложение для Android","description":"&lt;p&gt;Лента по темам, все рисунки и полный перевод — даже без интернета. Наведите камеру на QR-код.&lt;/p&gt;\n","theme":"dark","width":"m","image":"qr-app.svg","verticalOffset":"s","background":{"color":"#1F7A5C","image":"home-app-5.jpg"},"buttons":[{"text":"Скачать APK","url":"https://vivalyaraza.github.io/biosignal/app/biosignal.apk","theme":"normal-contrast"}]},{"type":"media-block","animated":false,"title":"&lt;p&gt;Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке&lt;/p&gt;\n","description":"&lt;p&gt;При изготовлении креветочного флосса (хрустящей волокнистой закуски) способ сушки радикально меняет вкусовой букет и пищевую ценность. Исследователи сопоставили вакуумную сублимацию (VFD) и конвекционную горячую сушку (HAD) вареного и маринованного мяса гигантской пресноводной креветки Macrobrachium rosenbergii. Сублимация надежнее сберегает термолабильные полиненасыщенные жирные кислоты и свободные аминокислоты, ответственные за умами. Горячий воздух ускоряет реакции Майяра, формируя насыщенный жареный профиль, но маринад заглушает природную сладость мяса.&lt;/p&gt;\n","media":{"image":"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-card.jpg"},"buttons":[{"text":"Читать","url":"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html","theme":"action"}]},{"type":"card-layout-block","animated":false,"title":{"text":"Свежий выпуск &amp;middot; 03.10.2026","url":"2026-10-03/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-card.jpg"},"content":{"title":"Холодный вакуум или печь: что происходит со&amp;nbsp;вкусом и&amp;nbsp;белком креветки при сушке","text":"&lt;p&gt;Сублимация сохраняет омега-жиры и нежный умами креветки, а горячий воздух запускает жареные ноты, перебивая естественную сладость.&lt;/p&gt;\n","links":[{"url":"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural-card.jpg"},"content":{"title":"Как кожура цитрусовых помогает дольше хранить куриные бургеры","text":"&lt;p&gt;Обычная желатиновая пленка с добавлением экстракта грейпфрута продлевает свежесть мяса в морозилке на 5 месяцев.&lt;/p&gt;\n","links":[{"url":"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-card.jpg"},"content":{"title":"Тыква в&amp;nbsp;рыбном фарше: как улучшить текстуру сурими с&amp;nbsp;помощью овощного порошка","text":"&lt;p&gt;Рыбный фарш капризен, но щепотка тыквенного порошка может изменить всё. Разбираемся, как это работает на уровне белков.&lt;/p&gt;\n","links":[{"url":"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 02.10.2026","url":"2026-10-02/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa-card.jpg"},"content":{"title":"Может&amp;nbsp;ли коллаген защитить желудок от&amp;nbsp;последствий алкоголя","text":"&lt;p&gt;Ученые выяснили, как рекомбинантный человеческий коллаген III типа помогает восстанавливать слизистую желудка при повреждениях.&lt;/p&gt;\n","links":[{"url":"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/nutritional-composition-chemical-safety-and-microbiological-card.jpg"},"content":{"title":"Хрустящие личинки пальмового долгоносика: белковый концентрат с&amp;nbsp;неожиданными рисками","text":"&lt;p&gt;Жарка и запекание удваивают долю белка в личинках долгоносика, но скрывают проблемы с тяжелыми металлами.&lt;/p&gt;\n","links":[{"url":"2026-10-02/nutritional-composition-chemical-safety-and-microbiological.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented-card.jpg"},"content":{"title":"Китайский напиток доужир против гриппа: что нашла наука","text":"&lt;p&gt;Традиционный ферментированный напиток из бобов мунг может стать союзником иммунитета в борьбе с вирусом гриппа.&lt;/p&gt;\n","links":[{"url":"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer-card.jpg"},"content":{"title":"Почему мы&amp;nbsp;выбираем растительный йогурт: вкус или этикетка?","text":"&lt;p&gt;Разбираемся, что важнее для потребителя: реальный вкус продукта или информация о его пользе на упаковке.&lt;/p&gt;\n","links":[{"url":"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par-card.jpg"},"content":{"title":"Как заставить сывороточный белок работать дольше: молекулярный &amp;laquo;клей&amp;raquo; для мышц","text":"&lt;p&gt;Сывороточный белок усваивается слишком быстро. Ученые придумали, как замедлить его распад с помощью «семенной оболочки» из полифенолов.&lt;/p&gt;\n","links":[{"url":"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of-card.jpg"},"content":{"title":"Кожа сибаса: как отходы аквакультуры превращаются в&amp;nbsp;съедобную упаковку","text":"&lt;p&gt;Ученые научились делать биоразлагаемую пленку из кожи сибаса. Это прочный, халяльный и экологичный материал для пищевой промышленности.&lt;/p&gt;\n","links":[{"url":"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/broccoli-sprout-extract-restores-renal-lipid-metabolism-in-h-card.jpg"},"content":{"title":"Могут&amp;nbsp;ли ростки брокколи защитить почки при избытке жиров в&amp;nbsp;рационе","text":"&lt;p&gt;Исследование на мышах показало, как экстракт ростков брокколи помогает почкам справляться с последствиями высокожировой диеты.&lt;/p&gt;\n","links":[{"url":"2026-10-02/broccoli-sprout-extract-restores-renal-lipid-metabolism-in-h.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa-card.jpg"},"content":{"title":"Маннит из&amp;nbsp;якона: как превратить сладкий корень в&amp;nbsp;полезный сахарозаменитель","text":"&lt;p&gt;Ученые научились делать популярный подсластитель из корня якона с помощью бактерий, минуя сложную химическую обработку.&lt;/p&gt;\n","links":[{"url":"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co-card.jpg"},"content":{"title":"Как кожура апельсина и&amp;nbsp;гвоздика помогают помидорам дольше оставаться свежими","text":"&lt;p&gt;Ученые создали съедобное покрытие из отходов цитрусовых, которое защищает овощи от порчи и плесени.&lt;/p&gt;\n","links":[{"url":"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 01.10.2026","url":"2026-10-01/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived-card.jpg"},"content":{"title":"Клеточное мясо: арахис и&amp;nbsp;киноа заменят животный белок в&amp;nbsp;производстве","text":"&lt;p&gt;Ученые нашли способ выращивать культивируемое мясо без использования компонентов животного происхождения.&lt;/p&gt;\n","links":[{"url":"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc-card.jpg"},"content":{"title":"Почему ужинать вдвоем полезнее для здоровья, чем в&amp;nbsp;одиночку","text":"&lt;p&gt;Ученые доказали, что присутствие близкого человека рядом помогает организму быстрее усваивать углеводы и снижает уровень сахара в крови.&lt;/p&gt;\n","links":[{"url":"2
