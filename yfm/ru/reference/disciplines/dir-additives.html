        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Пищевая химия и технологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;Исторически — с момента использования консервантов; научно — XX век&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Химический анализ, микробиологические тесты, органолептическая оценка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Codex Alimentarius, отчеты JECFA и EFSA&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Пищевые добавки — это вещества, которые добавляют в продукты питания в технологических целях при производстве, упаковке, транспортировке или хранении для придания им желаемых свойств. Научное направление изучает химический состав, функциональные свойства, безопасность и влияние этих веществ на качество пищевых продуктов. В сферу интересов входит контроль текстуры, цвета, аромата и микробиологической стабильности.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Использование добавок началось с применения соли и специй для консервации. В XX веке развитие пищевой химии позволило систематизировать эти вещества. Ключевым этапом стало создание систем классификации, таких как E-коды, для стандартизации контроля безопасности. Современные исследования сместились в сторону использования биополимеров из пищевых отходов. Например, создание съедобных покрытий из кожуры цитрусовых позволяет защищать овощи от плесени, а желатиновые пленки с экстрактом грейпфрута продлевают срок хранения мясных полуфабрикатов в замороженном состоянии до 5 месяцев.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;В науке выделяют два основных подхода. Первый — технологический, направленный на оптимизацию свойств продукта (улучшение консистенции, цвета). Второй — подход безопасности и оценки рисков, который базируется на установлении допустимого суточного потребления (ДСП) для каждого вещества. Современные исследования активно развивают «зеленую» химию, заменяя синтетические компоненты на функциональные ингредиенты из растительного сырья.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Методы включают химический анализ состава, микробиологические тесты на устойчивость к порче и органолептическую оценку (дегустацию) для проверки соответствия стандартам. Для оценки эффективности новых покрытий применяются методы ускоренного старения продуктов и мониторинг динамики роста микроорганизмов в контролируемых условиях.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Пищевые добавки тесно связаны с консервантами, которые обеспечивают микробиологическую безопасность; эмульгаторами и стабилизаторами, отвечающими за структуру; красителями и антиоксидантами. Также направление взаимодействует с экологией, изучая влияние упаковочных материалов и добавок на окружающую среду, включая вопросы накопления пластиковых частиц и стойких органических загрязнителей.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Изучение пищевых технологий доступно в рамках программ «Пищевая инженерия» и «Технология продуктов питания» в технических университетах. Для глубокого понимания принципов безопасности следует обращаться к документам Codex Alimentarius и отчетам профильных комитетов по оценке пищевых добавок (JECFA, EFSA).&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-additives.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5_%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Пищевые добавки — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/ieam.258\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Perfluoroalkyl and polyfluoroalkyl substances in the environment: terminology, classification, and origins&lt;/a&gt; — обзор, Integr Environ Assess Manag 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.marpolbul.2011.09.025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microplastics as contaminants in the marine environment: a review&lt;/a&gt; — обзор, Mar Pollut Bull 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1098/rstb.2008.0205\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Accumulation and fragmentation of plastic debris in global environments&lt;/a&gt; — обзор, Philos Trans R Soc Lond B Biol Sci 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"E-коды без мифов: что это, зачем, как работает и что говорят исследования."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Пищевые добавки","description":"E-коды без мифов: что это, зачем, как работает и что говорят исследования.","vcsPath":"reference/disciplines/dir-additives.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-additives.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-additives.html#istoriya-i-klyuchevye-otkrytiya","level":2},{"title":"Основные школы и подходы","href":"reference/disciplines/dir-additives.html#osnovnye-shkoly-i-podhody","level":2},{"title":"Методы и инструменты","href":"reference/disciplines/dir-additives.html#metody-i-instrumenty","level":2},{"title":"Связи с другими направлениями","href":"reference/disciplines/dir-additives.html#svyazi-s-drugimi-napravleniyami","level":2},{"title":"Где учиться и что читать","href":"reference/disciplines/dir-additives.html#gde-uchitsya-i-chto-chitat","level":2},{"title":"Источники","href":"reference/disciplines/dir-additives.html#istochniki","level":2}],"title":"Пищевые добавки"},"router":{"pathname":"reference/disciplines/dir-additives","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
