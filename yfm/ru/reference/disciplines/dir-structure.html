        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Пищевая физика и реология&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;XX век (на стыке коллоидной химии и физики)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Реология, текстурный профильный анализ (ТПА), микроскопия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Journal of Food Science, Food Hydrocolloids&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-structure.html\"&gt;Текстура и физика еды&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Текстура и физика еды — это научное направление (процесс), изучающее связь между микроструктурой пищевых продуктов и их сенсорными свойствами. Предметом исследования являются материальные сущности: эмульсии, пены, гели и кристаллы. Ученые анализируют, как изменение состава, например, добавление растительных порошков в рыбный фарш или использование коллагена из кожи рыб, влияет на реологические показатели — вязкость, упругость и прочность продукта.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Наука о текстуре еды сформировалась на стыке коллоидной химии и физики полимеров. Фундаментальные открытия связаны с пониманием поведения белков и углеводов при термической обработке. В последние десятилетия фокус сместился на создание функциональных материалов: например, разработку биоразлагаемых пленок из отходов аквакультуры, таких как кожа сибаса, которые обладают высокой прочностью и пригодны для пищевой упаковки.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;Существуют два основных подхода: эмпирический и структурно-механический. Эмпирический подход опирается на сенсорный анализ, где текстура оценивается экспертными панелями. Структурно-механический подход рассматривает еду как сложную физическую систему, где свойства целого определяются взаимодействием молекул (белков, липидов, воды). Исследования показывают, что введение добавок (например, овощных порошков) меняет матрицу белкового геля, что позволяет корректировать текстуру сурими.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для изучения текстуры применяются инструментальные методы анализа: реология (измерение деформации и течения), текстурный профильный анализ (ТПА) и микроскопия. Эти методы позволяют количественно оценить качество продукта. Современные исследования также используют методы компьютерного моделирования для прогнозирования поведения пищевых систем при изменении рецептуры.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Данное направление тесно связано с пищевой химией, материаловедением и биотехнологией. Оно использует принципы коллоидной химии для объяснения стабильности эмульсий и пен. Взаимосвязь с аквакультурой проявляется в переработке побочных продуктов (кожи рыб) в новые упаковочные материалы, что объединяет физику еды с принципами устойчивого развития.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Изучение дисциплины доступно в рамках программ по пищевым технологиям и нутрициологии в технических университетах. Базовые знания включают физическую химию, термодинамику и микробиологию. Для углубленного изучения рекомендуется следить за публикациями в профильных журналах по пищевой науке и технологиям, а также изучать отчеты по безопасности пищевых добавок и новых материалов.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-structure.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Survivalcraft\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Survivalcraft — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — обзор, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — обзор, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — обзор, Nature 2015&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Текстура и физика еды","description":"Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.","vcsPath":"reference/disciplines/dir-structure.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-structure.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-structure.html#istoriya-i-klyuchevye-otkrytiya","level":2},{"title":"Основные школы и подходы","href":"reference/disciplines/dir-structure.html#osnovnye-shkoly-i-podhody","level":2},{"title":"Методы и инструменты","href":"reference/disciplines/dir-structure.html#metody-i-instrumenty","level":2},{"title":"Связи с другими направлениями","href":"reference/disciplines/dir-structure.html#svyazi-s-drugimi-napravleniyami","level":2},{"title":"Где учиться и что читать","href":"reference/disciplines/dir-structure.html#gde-uchitsya-i-chto-chitat","level":2},{"title":"Источники","href":"r
