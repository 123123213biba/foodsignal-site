        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-safety.jpg\" alt=\"Безопасность и хранение\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Пищевая безопасность и технологии хранения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;Развитие промышленной пищевой безопасности (XX век)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;HACCP, физико-химический анализ, метаанализ, биоразлагаемые покрытия&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Lancet, BMJ, PLoS Medicine&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Безопасность и хранение пищевых продуктов — это научное направление, изучающее методы предотвращения порчи, загрязнения и потери качества продовольствия на всех этапах: от производства до потребления. Основная задача заключается в обеспечении целостности продукта, сохранении его питательной ценности и минимизации рисков для здоровья потребителя через управление физическими, химическими и биологическими факторами.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Развитие направления связано с переходом от кустарных методов к промышленным технологиям. Ключевым этапом стало понимание роли микроорганизмов в порче еды. В последние десятилетия фокус сместился на изучение влияния ультраобработки на метаболизм: метаанализ на 8,8 млн человек показал, что каждые 100 г ультраобработанной еды в день повышают риск сердечно-сосудистых катастроф на 14%. Современные исследования сосредоточены на активной упаковке, например, использовании хитозановых гидрогелей с оксидом цинка и жимолостью для защиты урожая или внедрении эфирного масла тимьяна в биоразлагаемые материалы для замедления роста бактерий в мясе.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;В науке выделяют два подхода: реактивный (контроль качества готового продукта) и превентивный (управление рисками на этапе производства). Превентивный подход базируется на принципах HACCP (анализ рисков и критические контрольные точки), который позволяет идентифицировать источники угроз, такие как окисление жиров под воздействием света или микробное обсеменение. Исследования также учитывают влияние внешних факторов: например, следы крови и солнечный свет могут превратить растительное масло в источник альдегидов всего за несколько часов.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Методы включают физико-химический анализ (определение состава, уровня окисления), микробиологический мониторинг и стресс-тестирование упаковки. Инструменты варьируются от создания «умных» покрытий (хитозановая броня) до разработки рекомбинантных белков (коллаген III типа), способных восстанавливать ткани организма при повреждениях. Важным инструментом является системный анализ и метаанализ, позволяющие обобщать данные о влиянии пищевых технологий на здоровье населения.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Направление тесно связано с микробиологией, химией полимеров, нутрициологией и технологией материалов. Оно интегрируется с концепциями микробной безопасности, упаковки и миграции веществ, а также изучением загрязнителей процесса. Понимание этих связей критично для разработки стандартов, обеспечивающих доступность и безопасность еды.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Обучение ведется в рамках программ «Пищевая инженерия», «Технология продуктов питания» и «Безопасность пищевых систем». Для глубокого погружения рекомендуется изучать систематические обзоры и метаанализы, оформленные по стандартам PRISMA, которые обеспечивают прозрачность и воспроизводимость научных данных.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-safety.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F_%D0%B1%D0%B5%D0%B7%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D0%BE%D1%81%D1%82%D1%8C\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Информационная безопасность — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Posters_for_information_security_for_the_Ministry_of_Defense_of_the_Russian_Federation.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: MoD of Russian Federation, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — обзор, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(21)02724-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis&lt;/a&gt; — обзор, Lancet 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — обзор, PLoS Med 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Безопасность и хранение","description":"Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.","vcsPath":"reference/disciplines/dir-safety.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-safety.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-safety.html#istoriya-i-klyuchevye-otkrytiya","level":2},{"title":"Основные школы и подходы","href":"reference/disciplines/dir-safety.html#osnovnye-shkoly-i-podhody","level":2},{"title":"Методы и инструменты","href":"reference/disciplines/dir-safety.html#metody-i-instrumenty","level":2},{"title":"Связи с другими направлениями","href":"reference/disciplines/dir-safety.html#svyazi-s-drugimi-napravleniyami","level":2},{"title":"Где учиться и что читать","href":"reference/disciplines/dir-safety.html#gde-uchitsya-i-chto-chitat","level":2},{"title":"Источники","href":"reference/disciplines/dir-safety.html#istochniki","level":2}],"title":"Безопасность и хранение"},"router":{"pathname":"reference/disciplines/dir-safety","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
