        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-thermal.jpg\" alt=\"Технологии приготовления\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Пищевая инженерия и биотехнология&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;Древнейшие методы термической обработки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Экструзия, sous vide, конвекционный нагрев, пастеризация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Journal of Food Engineering, Food Chemistry&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Технологии приготовления — это научное направление, изучающее физико-химические изменения пищевого сырья под воздействием тепловой энергии. Предметом изучения является процесс трансформации структуры, состава и сенсорных свойств продуктов при нагреве, охлаждении или механическом воздействии. Цель направления — понимание механизмов, которые определяют усвояемость нутриентов и безопасность готовых блюд.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Кулинарная обработка является древнейшей технологией человечества. Исторически методы развивались от открытого огня до контролируемых промышленных процессов. Ключевым открытием стало понимание того, что термическая обработка не только меняет вкус, но и модифицирует биодоступность макронутриентов. Например, исследования показывают, что экструзия сахара и молока в составе шоколада способна изменять гликемический ответ продукта. Другие работы демонстрируют, что жарка и запекание личинок пальмового долгоносика удваивают концентрацию белка, однако требуют контроля безопасности из-за риска накопления тяжелых металлов.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;В науке о технологиях приготовления выделяют два основных подхода: эмпирический (традиционные методы, такие как приготовление курутоба) и инженерный (моделирование процессов). Инженерный подход опирается на термодинамику и кинетику реакций. Ученые анализируют, как изменение параметров процесса влияет на конечную структуру продукта, используя методы компьютерного моделирования для прогнозирования поведения молекул при нагреве.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основные методы включают конвекционный нагрев (жарка, выпечка), контактный нагрев (гриль, обжарка), вакуумную низкотемпературную обработку (sous vide) и физико-механическую обработку (экструзия). Инструментарий включает датчики температуры, хроматографы для анализа состава и приборы для оценки текстуры. Исследователи используют методы симуляции для изучения взаимодействия компонентов на молекулярном уровне.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Технологии приготовления тесно связаны с пищевой химией, нутрициологией и микробиологией. Понимание процессов нагрева необходимо для обеспечения безопасности (пастеризация, стерилизация) и предотвращения образования нежелательных соединений. Направление пересекается с медициной, так как способы обработки напрямую влияют на метаболический ответ организма.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Изучение направления ведется в рамках программ по пищевым технологиям и биотехнологиям в технических университетах. Базовые знания можно получить из академических обзоров по пищевой инженерии и биохимии питания. Для углубленного изучения рекомендуется обращаться к специализированным базам данных, содержащим результаты исследований влияния обработки на нутриентный профиль сырья.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-thermal.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Курутоб — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%9A%D1%83%D1%80%D1%83%D1%82%D0%BE%D0%B1.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Muhammad 9009, CC0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/thy.2015.0020\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer: The American Thyroid Association Guidelines Task Force on Thyroid Nodules and Differentiated Thyroid Cancer&lt;/a&gt; — обзор, Thyroid 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/jcc.21287\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CHARMM: the biomolecular simulation program&lt;/a&gt; — обзор, J Comput Chem 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41572-020-00240-3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hepatocellular carcinoma&lt;/a&gt; — обзор, Nat Rev Dis Primers 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Технологии приготовления","description":"Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.","vcsPath":"reference/disciplines/dir-thermal.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-thermal.html#chto-izuchaet","level
