        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Профессии&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;оценивает риски, сроки годности, упаковку и аллергены&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Чем занимается&lt;/td&gt;\n&lt;td&gt;оценивает риски, сроки годности, упаковку и аллергены&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что нужно уметь&lt;/td&gt;\n&lt;td&gt;HACCP, токсикология, регуляторика (ЕАЭС, Codex)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Образование&lt;/td&gt;\n&lt;td&gt;Пищевые технологии, ветеринария, микробиология, стандарты ISO 22000.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Где работают&lt;/td&gt;\n&lt;td&gt;Пищевые производства, лаборатории контроля, госорганы, R&amp;amp;D центры.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chem-zanimaetsya\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#chem-zanimaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем занимается&lt;/span&gt;&lt;/a&gt;Чем занимается&lt;/h2&gt;\n&lt;p&gt;Специалист по безопасности пищевых продуктов — это профессионал, который обеспечивает соответствие пищевой продукции установленным стандартам качества и гигиены на всех этапах: от производства до упаковки. Его работа направлена на предотвращение биологических, химических и физических рисков, которые могут привести к порче продуктов или заболеваниям потребителей. Специалист оценивает риски, контролирует сроки годности и проверяет состав на наличие аллергенов, опираясь на принципы доказательной науки и регуляторные нормы.&lt;/p&gt;\n&lt;h2 id=\"tipichnye-zadachi\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#tipichnye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типичные задачи&lt;/span&gt;&lt;/a&gt;Типичные задачи&lt;/h2&gt;\n&lt;p&gt;Ежедневная работа включает мониторинг производственных процессов и анализ причин порчи продуктов. Например, специалист изучает, почему соусы могут «бродить» в упаковке или как предотвратить окисление жиров в продуктах, содержащих следы крови, под воздействием света. В рамках проектов специалист внедряет новые технологии хранения: от использования съедобных пленок на основе цитрусовых экстрактов для продления свежести овощей и мяса до разработки биоразлагаемой упаковки с эфирными маслами, такими как тимьян. Также он проводит оценку рисков при ультраобработке продуктов, учитывая данные о влиянии состава на здоровье человека.&lt;/p&gt;\n&lt;h2 id=\"navyki-i-instrumenty\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#navyki-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Навыки и инструменты&lt;/span&gt;&lt;/a&gt;Навыки и инструменты&lt;/h2&gt;\n&lt;p&gt;Ключевым инструментом является система HACCP (ХАССП) — протокол анализа рисков и критических контрольных точек. Специалист должен владеть методами токсикологического анализа и знать требования регуляторики, включая ТР ТС 021/2011 и 029/2012 (ЕАЭС) и стандарты Codex Alimentarius. Он использует методы оценки микробиологической стабильности, изучает влияние ионизирующего излучения на уничтожение контаминантов и анализирует данные о влиянии пищевых добавок на организм. Важным навыком является интерпретация метаанализов и научных публикаций для внедрения инноваций в производство.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#gde-uchitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться&lt;/span&gt;&lt;/a&gt;Где учиться&lt;/h2&gt;\n&lt;p&gt;Базовое образование включает подготовку в области пищевых технологий, ветеринарной медицины или микробиологии. Специалисты изучают дисциплины, связанные с гигиеной питания, химией пищевых продуктов и управлением качеством. Дополнительное обучение часто проходит через специализированные курсы по внедрению систем менеджмента безопасности пищевой продукции (ISO 22000) и международные программы по безопасности пищевых систем.&lt;/p&gt;\n&lt;h2 id=\"gde-rabotayut-i-kak-rasti\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#gde-rabotayut-i-kak-rasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают и как расти&lt;/span&gt;&lt;/a&gt;Где работают и как расти&lt;/h2&gt;\n&lt;p&gt;Профессионалы востребованы на пищевых производствах, в лабораториях контроля качества, государственных надзорных органах и научно-исследовательских центрах. Карьерный рост возможен от инженера по качеству до руководителя отдела безопасности, аудитора международных систем или эксперта-консультанта по разработке новых безопасных упаковочных решений и технологий консервации.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D0%B1%D0%BB%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%D0%BE%D0%B2_%D0%BF%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Облучение продуктов питания — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://europepmc.org/article/MED/9262857\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ecosystem health as a clinical rotation for senior students in Canadian veterinary schools&lt;/a&gt; — обзор, Can Vet J 1997&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Профессии&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"оценивает риски, сроки годности, упаковку и аллергены"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Специалист по безопасности пищевых продуктов","description":"оценивает риски, сроки годности, упаковку и аллергены","vcsPath":"reference/professions/prof-food_safety_specialist.md"},"headings":[{"title":"Чем занимается","href":"reference/professions/prof-food_safety_specialist.html#chem-zanimaetsya","level":2},{"title":"Типичные задачи","href":"reference/professions/prof-food_safety_specialist.html#tipichnye-zadachi","level":2},{"title":"Навыки и инструменты","href":"reference/professions/prof-food_safety_specialist.html#navyki-i-instrumenty","level":2},{"title":"Где учиться","href":"reference/professions/prof-food_safety_specialist.html#gde-uchitsya","level":2},{"title":"Где работают и как расти","href":"reference/professions/prof-food_safety_specialist.html#gde-rabotayut-i-kak-rasti","level":2},{"title":"Источники","href":"reference/professions/prof-food_safety_specialist.html#istochniki","level":2}],"title":"Специалист по безопасности пищевых продуктов"},"router":{"pathname":"reference/professions/prof-food_safety_specialist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
