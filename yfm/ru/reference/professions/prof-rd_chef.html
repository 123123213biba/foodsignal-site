        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Профессии&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;соединяет кухню и науку: пробует, измеряет, пишет технологические карты&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-rd_chef.jpg\" alt=\"Шеф-технолог (R&amp;amp;D-шеф)\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Чем занимается&lt;/td&gt;\n&lt;td&gt;соединяет кухню и науку: пробует, измеряет, пишет технологические карты&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что нужно уметь&lt;/td&gt;\n&lt;td&gt;кулинария, физика кухни, документирование&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Образование&lt;/td&gt;\n&lt;td&gt;Профильное образование в области пищевых технологий, биотехнологий, химии или физики.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Где работают&lt;/td&gt;\n&lt;td&gt;Ресторанные холдинги, пищевые производства, R&amp;amp;D-лаборатории, фудтех-стартапы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt;, &lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chem-zanimaetsya\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#chem-zanimaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем занимается&lt;/span&gt;&lt;/a&gt;Чем занимается&lt;/h2&gt;\n&lt;p&gt;Шеф-технолог (R&amp;amp;D-шеф) — это специалист, который проектирует кулинарные процессы на стыке гастрономии и пищевой науки. Он переводит творческие идеи в воспроизводимые технологические протоколы, обеспечивая стабильность вкуса, текстуры и безопасности продукта. В отличие от обычного шеф-повара, R&amp;amp;D-шеф опирается на физико-химические данные, анализируя влияние методов обработки (например, сублимации или экструзии) на структуру молекул и сенсорные свойства блюд.&lt;/p&gt;\n&lt;h2 id=\"tipichnye-zadachi\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#tipichnye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типичные задачи&lt;/span&gt;&lt;/a&gt;Типичные задачи&lt;/h2&gt;\n&lt;p&gt;Основная задача — создание стандартизированных технологических карт. В ежедневной практике это включает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Разработку рецептур: подбор ингредиентов с учетом их функциональных свойств (например, использование маннита из якона как подсластителя).&lt;/li&gt;\n&lt;li&gt;Оптимизацию процессов: выбор параметров обработки (температура 85 °C, время, давление) для продления срока годности или изменения гликемического ответа продукта.&lt;/li&gt;\n&lt;li&gt;Контроль качества: проведение дегустаций (панели по ISO 8586) и инструментальный анализ (например, использование биосенсоров для определения пиразинов в жареных продуктах).&lt;/li&gt;\n&lt;li&gt;Оценку рисков: анализ сырья на наличие тяжелых металлов или микробиологическую безопасность, особенно при работе с новыми источниками белка.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"navyki-i-instrumenty\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#navyki-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Навыки и инструменты&lt;/span&gt;&lt;/a&gt;Навыки и инструменты&lt;/h2&gt;\n&lt;p&gt;Профессия требует сочетания кулинарного мастерства и инженерного подхода:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Методы обработки: су-вид, экструзия, сублимация, ультразвуковая эмульсия.&lt;/li&gt;\n&lt;li&gt;Аналитические инструменты: электронные носы (биосенсоры), методы измерения текстуры и влажности.&lt;/li&gt;\n&lt;li&gt;Документирование: составление протоколов (HACCP, ISO 22000), ведение лабораторных журналов, работа с базами данных.&lt;/li&gt;\n&lt;li&gt;Сенсорный анализ: владение методологией оценки вкуса, аромата и текстуры согласно стандартам ISO 5492.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-uchitsya\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#gde-uchitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться&lt;/span&gt;&lt;/a&gt;Где учиться&lt;/h2&gt;\n&lt;p&gt;Путь в профессию обычно лежит через профильное образование в области пищевых технологий или биотехнологий. Базовые знания физики и химии (подобные тем, что применяются в атомно-слоевом осаждении для контроля слоев на молекулярном уровне) помогают глубже понимать процессы изменения структуры сырья. Дополнительно требуются курсы по пищевой безопасности и управлению качеством.&lt;/p&gt;\n&lt;h2 id=\"gde-rabotayut-i-kak-rasti\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#gde-rabotayut-i-kak-rasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают и как расти&lt;/span&gt;&lt;/a&gt;Где работают и как расти&lt;/h2&gt;\n&lt;p&gt;R&amp;amp;D-шефы работают в крупных ресторанных холдингах, на пищевых производствах, в стартапах по разработке альтернативных продуктов питания и научно-исследовательских лабораториях. Карьерный рост возможен от младшего технолога до руководителя департамента инноваций или технического директора пищевого предприятия. Профессиональный рост связан с участием в разработке патентуемых технологий и внедрением инновационных методов обработки сырья.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/professions/prof-rd_chef.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%83%D0%BD%D1%82%D0%BE%D0%BB%D0%B0%2C_%D0%A2%D1%83%D0%BE%D0%BC%D0%BE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Сунтола, Туомо — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Tuomo_Suntola,_2014.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Riikka Puurunen, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Профессии&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"соединяет кухню и науку: пробует, измеряет, пишет технологические карты"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Шеф-технолог (R&amp;D-шеф)","description":"соединяет кухню и науку: пробует, измеряет, пишет технологические карты","vcsPath":"reference/professions/prof-rd_chef.md"},"headings":[{"title":"Чем занимается","href":"reference/professions/prof-rd_chef.html#chem-zanimaetsya","level":2},{"title":"Типичные задачи","href":"reference/professions/prof-rd_chef.html#tipichnye-zadachi","level":2},{"title":"Навыки и инструменты","href":"reference/professions/prof-rd_chef.html#navyki-i-instrumenty","level":2},{"title":"Где учиться","href":"reference/professions/prof-rd_chef.html#gde-uchitsya","level":2},{"title":"Где работают и как расти","href":"reference/professions/prof-rd_chef.html#gde-rabotayut-i-kak-rasti","level":2},{"title":"Источники","href":"reference/professions/prof-rd_chef.html#istochniki","level":2}],"title":"Шеф-технолог (R&amp;D-шеф)"},"router":{"pathname":"reference/professions/prof-rd_chef","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
