            {"data":{"leading":false,"html":"&lt;p&gt;19 концепций&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/bacillus-licheniformis-qjl3.html\"&gt;Bacillus licheniformis QJL3&lt;/a&gt; — Бактериальный штамм, идентифицированный как основной источник газообразования и вздутия упаковок соуса васаби.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/c2c12.html\"&gt;C2C12&lt;/a&gt; — Линия мышиных миобластов, используемая в экспериментах для оценки адгезии и пролиферации клеток на растительных покрытиях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/caco-2-cells.html\"&gt;Caco-2&lt;/a&gt; — Линия раковых клеток толстой кишки человека, используемая как модель кишечного эпителия in vitro.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hepg2.html\"&gt;HepG2&lt;/a&gt; — Культура клеток гепатокарциномы человека, используемая в качестве модели для оценки антиоксидантной защиты экстрактов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lactococcus-lactis-subsp-cremoris-d2022.html\"&gt;Lactococcus lactis subsp. cremoris D2022&lt;/a&gt; — Штамм грамположительных молочнокислых бактерий, выделенный из Дучжиэра, обладающий пробиотической активностью против вируса гриппа А.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt; — Микроорганизмы, способные эффективно перерабатывать фруктозу и фруктоолигосахариды в маннит при мягких температурных условиях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; — Грамположительная гомоферментативная молочнокислая бактерия, традиционно встречающаяся в заквасках и обладающая иммуномодулирующими…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pseudomonas-aeruginosa.html\"&gt;Pseudomonas aeruginosa&lt;/a&gt; — Бактериальный патоген, вызывающий очаги гниения плодов и используемый в исследовании для оценки антибактериальной эффективности гидрогеля.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scoby.html\"&gt;SCOBY&lt;/a&gt; — Симбиотическое сообщество бактерий и дрожжей, осуществляющее ферментацию комбучи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/streptococcus-thermophilus-and-lactobacillus-delbrueckii.html\"&gt;Streptococcus thermophilus и Lactobacillus delbrueckii&lt;/a&gt; — Стартовая культура молочнокислых бактерий, применяемая для ферментации растительного сырья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/micropterus-salmoides.html\"&gt;Большеротый окунь&lt;/a&gt; — Вид рыб, используемый в качестве биологической модели для изучения влияния состава кормов на метаболизм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/giant-freshwater-prawn.html\"&gt;гигантская пресноводная креветка&lt;/a&gt; — Вид пресноводных ракообразных, используемый в качестве сырья для производства высокобелковых пищевых продуктов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/european-sea-bass.html\"&gt;Европейский сибас&lt;/a&gt; — Вид морской рыбы, являющийся основным объектом аквакультуры в Средиземноморском регионе и источником сырья для производства желатина.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ges-1-cells.html\"&gt;Клетки GES-1&lt;/a&gt; — Линия эпителиальных клеток желудка человека, используемая в качестве модели для изучения повреждений слизистой оболочки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rhynchophorus-phoenicis-larvae.html\"&gt;Личинки пальмового долгоносика&lt;/a&gt; — Вид съедобных насекомых, используемый как источник белка, требующий контроля чистоты субстрата из-за накопления тяжелых металлов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/c2c12-myoblasts.html\"&gt;Миобласты C2C12&lt;/a&gt; — Линия мышечных клеток мыши, используемая в качестве модели для изучения адгезии и пролиферации в исследованиях клеточного мяса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;Молочнокислые бактерии&lt;/a&gt; — Группа микроорганизмов, преобразующих углеводы в молочную кислоту, которые являются основными агентами ферментации в растительных сырах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/trichiurus-haumela.html\"&gt;рыба-сабля&lt;/a&gt; — Вид рыбы, миофибриллярные белки которой обладают слабой способностью к формированию прочного геля.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mediterranean-mussel.html\"&gt;средиземноморская мидия&lt;/a&gt; — Вид двустворчатых моллюсков, используемый в исследовании в качестве объекта консервации и характеризующийся высоким содержанием белка и…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"19 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Организмы и модели","description":"19 концепций","vcsPath":"reference/organisms.md"},"headings":[],"title":"Организмы и модели"},"router":{"pathname":"reference/organisms","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
