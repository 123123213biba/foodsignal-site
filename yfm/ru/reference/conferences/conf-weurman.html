        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;главный научный симпозиум по химии вкуса и аромата&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-weurman.jpg\" alt=\"Weurman Flavour Research Symposium\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;главный научный симпозиум по химии вкуса и аромата&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;сборники трудов, аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество специалистов по химии вкуса и аромата.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Регулярно, периодичность определяется оргкомитетом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научная конференция с публикацией сборников трудов и аннотаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальный сайт симпозиума обновляется перед каждым мероприятием.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Weurman Flavour Research Symposium — это международная научная конференция, посвященная изучению химии вкуса и аромата пищевых продуктов. Мероприятие является площадкой для обмена данными между химиками, биологами и технологами пищевой промышленности. Основная цель симпозиума — систематизация знаний о молекулярных механизмах восприятия вкуса и аромата, а также обсуждение методов их анализа.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Симпозиум назван в честь Корнелиса Вурмана (Cornelis Weurman), пионера в области газовой хроматографии и анализа ароматических соединений. Конференция проводится регулярно, собирая ведущих экспертов для обсуждения фундаментальных и прикладных аспектов пищевой химии. Мероприятие служит платформой для представления результатов исследований, которые впоследствии формируют стандарты в оценке качества продуктов.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Работа симпозиума охватывает широкий спектр тем, связанных с сенсорным анализом и химическим составом пищи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Идентификация летучих соединений: методы анализа аромата, включая использование «электронных носов» и биосенсоров на основе рецепторов.&lt;/li&gt;\n&lt;li&gt;Технологические процессы: влияние способов обработки (сублимация, термическая обработка, ферментация) на химический профиль продукта.&lt;/li&gt;\n&lt;li&gt;Взаимодействие компонентов: как белки, жиры и углеводы формируют вкусовые ощущения, такие как умами или сладость.&lt;/li&gt;\n&lt;li&gt;Биотехнологии: получение пищевых добавок и заменителей сахара с помощью микробиологического синтеза.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На симпозиуме впервые представляются результаты исследований, которые меняют подход к производству еды. Например, здесь обсуждаются новые биосенсоры для определения пиразинов, отвечающих за аромат жареного, или инновационные методы сушки, позволяющие сохранять омега-жиры в продуктах. Участники представляют данные о том, как замена химических процессов на ферментацию (например, при получении маннита из якона) влияет на чистоту и свойства конечного продукта. Результаты публикуются в сборниках трудов, которые служат справочной базой для специалистов.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Следить за результатами симпозиума можно через сборники трудов и аннотации докладов, публикуемые по итогам встреч. Участие предполагает представление собственных исследований в виде стендовых или устных докладов. Для специалистов это основной способ ознакомиться с актуальными методами анализа вкуса и аромата, которые еще не вошли в широкую практику.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-weurman.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Vanilla\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Vanilla — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Vanilla_planifolia_(6998639597).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Malcolm Manners from Lakeland FL, USA, CC BY 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"главный научный симпозиум по химии вкуса и аромата"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Weurman Flavour Research Symposium","description":"главный научный симпозиум по химии вкуса и аромата","vcsPath":"reference/conferences/conf-weurman.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-weurman.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-weurman.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-weurman.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-weurman.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-weurman.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-weurman.html#istochniki","level":2}],"title":"Weurman Flavour Research Symposium"},"router":{"pathname":"reference/conferences/conf-weurman","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
