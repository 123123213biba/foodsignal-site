        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;отделение сельскохозяйственной и пищевой химии ACS&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;отделение сельскохозяйственной и пищевой химии ACS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;аннотации сессий AGFD&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Пищевые добавки&lt;/a&gt;, &lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенты&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;ACS Fall/Spring — это масштабные полугодовые научные форумы, организуемые Американским химическим обществом (ACS). В рамках этих встреч работает отделение сельскохозяйственной и пищевой химии (AGFD — Agricultural and Food Chemistry Division). Это площадка, где фундаментальная химия встречается с прикладными задачами пищевой индустрии. Здесь ученые представляют результаты исследований, которые объясняют, как молекулярные изменения влияют на вкус, аромат, стабильность и питательную ценность продуктов.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференции проводятся Американским химическим обществом, старейшей и крупнейшей научной организацией в области химии. Отделение AGFD сфокусировано на междисциплинарных исследованиях: от молекулярного состава сырья до технологий переработки, которые позволяют сохранять нутриенты и улучшать качество еды. История этих встреч — это летопись того, как пищевая наука перешла от простого анализа состава к управлению свойствами продуктов на молекулярном уровне.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Работа AGFD охватывает широкий спектр вопросов, связанных с тем, что мы едим. Ключевые направления включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Технологии сохранения: использование природных антиоксидантов (например, экстрактов грейпфрута или апельсиновой кожуры) для создания съедобных покрытий, продлевающих свежесть продуктов.&lt;/li&gt;\n&lt;li&gt;Модификация нутриентов: разработка способов замедления усвоения белков, например, через создание «оболочек» из полифенолов для сывороточного протеина.&lt;/li&gt;\n&lt;li&gt;Биотехнологии: получение полезных добавок (таких как маннит) из растительного сырья с помощью бактериальной ферментации.&lt;/li&gt;\n&lt;li&gt;Физико-химические процессы: изучение влияния методов обработки (сублимация против горячего воздуха) на структуру белков и вкусовые качества, такие как умами.&lt;/li&gt;\n&lt;li&gt;Психофизиология питания: исследование того, как социальные факторы влияют на метаболизм, например, на усвоение углеводов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На конференциях ACS AGFD рождаются решения, которые позже становятся стандартами индустрии. Это не просто теоретические доклады, а прототипы технологий: от упаковочных материалов, предотвращающих порчу мяса, до новых методов обработки корней растений для получения сахарозаменителей. Участники обсуждают, как вкус и аромат, воспринимаемые рецепторами полости рта, зависят от химических манипуляций с продуктом. Эти данные помогают понять, почему сублимированная креветка сохраняет нежный вкус, а горячая сушка лишает её естественной сладости.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Материалы конференций публикуются в виде аннотаций сессий, которые доступны в архивах ACS. Для исследователей и специалистов пищевой отрасли участие в сессиях AGFD — это способ узнать о передовых методах анализа вкуса, аромата и пищевых добавок до того, как они станут массовыми продуктами. Следить за анонсами можно на официальном портале Американского химического общества.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Taste\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Taste — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"отделение сельскохозяйственной и пищевой химии ACS"}],"style":["_assets/biosignal.css"],"s
