        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;коллоиды, эмульсии, пены и гели в пищевых системах&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-food_colloids.jpg\" alt=\"Food Colloids\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;коллоиды, эмульсии, пены и гели в пищевых системах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;Академиялық институттар мен кәсіби қоғамдастықтар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Тұрақты түрде (жыл сайын немесе екі жылда бір)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Халықаралық ғылыми конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Арнайы конференциялық веб-сайттар немесе ғылыми порталдар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-structure.html\"&gt;Текстура и физика еды&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Food Colloids — это серия международных научных конференций, посвященных изучению физико-химических свойств пищевых систем. В центре внимания исследователей находятся коллоидные структуры: эмульсии, пены, гели и суспензии. Конференция объединяет специалистов в области пищевой химии, физики полимеров и материаловедения для обсуждения того, как микроструктура компонентов определяет текстуру, стабильность и питательную ценность готовых продуктов.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференции серии Food Colloids проводятся на регулярной основе под эгидой различных академических институтов и профессиональных сообществ. Мероприятия направлены на обмен данными между фундаментальной наукой и прикладными технологиями пищевой промышленности. История конференций охватывает десятилетия, в течение которых они стали ключевой площадкой для обсуждения коллоидной химии в контексте питания.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа конференции охватывает широкий спектр вопросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Физика пищевых систем: изучение поведения белков, полисахаридов и липидов на микроскопическом уровне.&lt;/li&gt;\n&lt;li&gt;Разработка новых материалов: создание биоразлагаемых пленок и съедобных упаковок, например, на основе коллагена из кожи рыб.&lt;/li&gt;\n&lt;li&gt;Текстурный дизайн: использование добавок, таких как овощные порошки, для модификации свойств фарша или других сложных систем.&lt;/li&gt;\n&lt;li&gt;Взаимодействие компонентов: влияние структуры еды на процессы пищеварения и биодоступность нутриентов.&lt;/li&gt;\n&lt;li&gt;Сенсорный анализ: связь между физической структурой коллоидов и восприятием вкуса или текстуры человеком.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На конференции представляют результаты исследований, которые впоследствии внедряются в производство. Примеры включают использование побочных продуктов аквакультуры для создания экологичной упаковки или применение растительных добавок для улучшения текстуры сурими. Участники демонстрируют методы визуализации, такие как сканирующая электронная микроскопия, позволяющие увидеть коллоидные частицы в продуктах. Также обсуждаются вопросы безопасности добавок, например, влияние полисахаридов на желудочно-кишечный тракт.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Для участия в конференции исследователи подают тезисы своих работ, которые проходят рецензирование. Материалы конференций обычно публикуются в виде сборников или тематических выпусков научных журналов. Чтобы следить за актуальными исследованиями, рекомендуется обращаться к публикациям в профильных изданиях, таких как «Critical Reviews in Food Science and Nutrition» или «Journal of Texture Studies», где часто обсуждаются темы, поднимаемые на Food Colloids.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Food_Machinery_and_Chemical_Corporation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Food Machinery and Chemical Corporation — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:SEM_Image_of_Colloidal_Particles.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Yasrena, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/10408398.2014.939263\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of polysaccharides in food, digestion, and health&lt;/a&gt; — обзор, Crit Rev Food Sci Nutr 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1289/ehp.01109983\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Review of harmful gastrointestinal effects of carrageenan in animal experiments&lt;/a&gt; — обзор, Environ Health Perspect 2001&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/jtxs.12356\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Aging-related changes in quantity and quality of saliva: Where do we stand in our understanding?&lt;/a&gt; — обзор, J Texture Stud 2019&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"коллоиды, эмульсии, пены и гели в пищевых системах"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Food Colloids","description":"коллоиды, эмульсии, пены и гели в пищевых системах","vcsPath":"reference/conferences/conf-food_colloids.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-food_colloids.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-food_colloids.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-food_colloids.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-food_colloids.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-food_colloids.html#kak-sledit-i-
