        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;молочнокислые бактерии и ферментация&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;молочнокислые бактерии и ферментация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-ferment.html\"&gt;Ферментация&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Symposium on Lactic Acid Bacteria (Симпозиум по молочнокислым бактериям) — это специализированная научная площадка, организованная Федерацией европейских микробиологических обществ (FEMS). Конференция является процессом обмена знаниями, где исследователи представляют результаты изучения молочнокислых бактерий (МКБ) и их роли в пищевых технологиях, медицине и биотехнологии. Основная задача мероприятия — обсуждение механизмов ферментации и влияния микроорганизмов на свойства продуктов питания.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Организатором выступает FEMS — международная организация, объединяющая микробиологические общества Европы. Симпозиум проводится регулярно и служит центральным местом встречи для академических ученых и специалистов пищевой промышленности. Мероприятие фокусируется на фундаментальных исследованиях микробиологии, которые в дальнейшем находят применение в создании новых продуктов, таких как ферментированные аналоги сыра из кешью или традиционные напитки вроде доужира.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Научная программа охватывает широкий спектр вопросов: от генетики и метаболизма бактерий до их влияния на здоровье человека. Ключевые секции включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Метаболизм и физиология МКБ: изучение процессов, при которых бактерии превращают углеводы в молочную кислоту.&lt;/li&gt;\n&lt;li&gt;Пищевая безопасность и качество: оценка рисков и контроль микробиологического состава в крафтовых продуктах.&lt;/li&gt;\n&lt;li&gt;Функциональные продукты: исследование влияния ферментированных напитков (например, из семян сосны или бобов мунг) на барьерные функции кишечника и иммунитет.&lt;/li&gt;\n&lt;li&gt;Технологии заквасок: использование культур, включая комбучу, для ускорения брожения хлеба и улучшения его органолептических свойств.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На симпозиуме впервые озвучиваются данные, которые меняют подход к производству еды. Участники представляют результаты анализа состава заквасок, данные о безопасности альтернативных молочных продуктов и доказательства биологической активности традиционных ферментированных напитков. Это место, где теоретические знания о молочнокислом брожении превращаются в прикладные протоколы для пищевой индустрии.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Следить за результатами можно через официальные публикации тезисов и отчеты FEMS. Участие предполагает подачу собственных исследований для стендовой или устной сессии. Для специалистов это возможность ознакомиться с актуальными данными о безопасности пищевых добавок и методах контроля качества, соответствующих стандартам безопасности.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Sourdough\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sourdough — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"молочнокислые бактерии и ферментация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Symposium on Lactic Acid Bacteria (FEMS)","description":"молочнокислые бактерии и ферментация","vcsPath":"reference/conferences/conf-lab_symposium.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-lab_symposium.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-lab_symposium.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-lab_symposium.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-lab_symposium.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-lab_symposium.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-lab_symposium.html#istochniki","level":2}],"title":"Symposium on Lactic Acid Bacteria (FEMS)"},"router":{"pathname":"reference/conferences/conf-lab_symposium","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
