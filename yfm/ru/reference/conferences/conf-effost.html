        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Европейская федерация пищевой науки и технологий&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Европейская федерация пищевой науки и технологий&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;программа, постеры&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;Европейская федерация пищевой науки и технологий (EFFoST)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Международная научная конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;effost.org&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-thermal.html\"&gt;Технологии приготовления&lt;/a&gt;, &lt;a href=\"concepts/spec-structure.html\"&gt;Текстура и физика еды&lt;/a&gt;, &lt;a href=\"concepts/spec-newfood.html\"&gt;Новая еда&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Безопасность и хранение&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;EFFoST (European Federation of Food Science and Technology) — это ежегодная международная научная конференция, объединяющая исследователей, технологов и представителей пищевой индустрии. Мероприятие является площадкой для обмена знаниями о фундаментальных процессах в пищевых системах, методах обработки сырья и инновациях в области безопасности питания. Конференция фокусируется на междисциплинарном подходе, связывающем физику еды, микробиологию и инженерные решения.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Организатором выступает Европейская федерация пищевой науки и технологий (EFFoST). Федерация является некоммерческой организацией, координирующей работу национальных обществ пищевых наук по всей Европе. История конференции насчитывает несколько десятилетий, в течение которых она стала ключевым событием для академического сообщества, занимающегося вопросами устойчивого производства продуктов питания и перехода к новым источникам белка.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа конференции охватывает широкий спектр направлений, соответствующих актуальным вызовам индустрии:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Технологии обработки и текстура: изучение влияния экструзии и других методов на гликемический ответ и структуру продуктов.&lt;/li&gt;\n&lt;li&gt;Безопасность и хранение: анализ рисков, связанных с окислением жиров, микотоксинами в растительных белках и микробиологической стабильностью упаковки.&lt;/li&gt;\n&lt;li&gt;Новая еда: исследование альтернативных источников белка, включая насекомых и растительные изоляты, с оценкой их питательной ценности и потенциальных рисков, таких как накопление тяжелых металлов.&lt;/li&gt;\n&lt;li&gt;Функциональные компоненты: изучение влияния добавок, таких как тыквенный порошок или коллаген, на физико-химические свойства готовых изделий.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На конференции впервые представляются результаты метаанализов, таких как исследования влияния ультраобработанной еды на здоровье, и данные о новых методах стабилизации продуктов. Участники презентуют постеры и доклады, содержащие первичные данные экспериментов, которые позже становятся основой для отраслевых стандартов и рекомендаций по безопасности (например, в рамках ТР ТС 021/2011).&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Для участия в конференции необходимо подать тезисы доклада, которые проходят экспертное рецензирование. Следить за результатами можно через официальные сборники тезисов, публикуемые после завершения мероприятия. Научные статьи, представленные на EFFoST, часто становятся основой для публикаций в профильных журналах, таких как Trends in Food Science &amp;amp; Technology.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D0%B8%D1%81%D0%BE%D0%BA_%D0%B0%D1%8D%D1%80%D0%BE%D0%BF%D0%BE%D1%80%D1%82%D0%BE%D0%B2_%D0%BF%D0%BE_%D0%BA%D0%BE%D0%B4%D1%83_%D0%98%D0%9A%D0%90%D0%9E%3A_E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Список аэропортов по коду ИКАО: E — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.tifs.2018.07.008\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The next protein transition&lt;/a&gt; — обзор, Trends Food Sci Technol 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.jare.2025.10.004\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of capsaicin, circadian clock genes, and TRPV1 in colorectal carcinogenesis: Lessons and future directions&lt;/a&gt; — обзор, J Adv Res 2026&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Европейская федерация пищевой науки и технологий"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"EFFoST","description":"Европейская федерация пищевой науки и технологий","vcsPath":"reference/conferences/conf-effost.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-effost.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-effost.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-effost.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-effost.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-effost.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-effost.html#istochniki","level":2}],"title":"EFFoST"},"router":{"pathname":"reference/conferences/conf-effost","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
