        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;как люди воспринимают вкус&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;как люди воспринимают вкус&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество сенсорных ученых&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Раз в два года (в нечетные годы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научная конференция (4–5 дней, 800–1000 участников)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальный сайт конференции (выбирается за 2 года до события)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-flavor.html\"&gt;Вкус и аромат&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Pangborn Sensory Science Symposium — это международная научная конференция, посвященная сенсорному анализу пищевых продуктов и изучению потребительского поведения. Мероприятие является площадкой для обмена знаниями между учеными, технологами и специалистами по анализу восприятия вкуса, аромата и текстуры. Конференция носит имя Роуз Мари Пэнгборн, пионера в области сенсорных исследований, чьи работы заложили фундамент современной методологии оценки продуктов.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Симпозиум проводится раз в два года, обычно в нечетные годы. Место проведения выбирается заранее, за два года до начала события, что позволяет географически охватить научные сообщества разных стран. В среднем мероприятие собирает от 800 до 1000 участников, представляющих как академические институты, так и исследовательские подразделения пищевой индустрии. Длительность научной программы составляет 4–5 дней.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Основная тематика симпозиума охватывает методы оценки качества продуктов, психологию восприятия и разработку новых пищевых технологий. Ключевые секции включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Методология сенсорного анализа: обсуждение стандартизированных протоколов оценки, таких как Preferred Attribute Elicitation (PAE).&lt;/li&gt;\n&lt;li&gt;Потребительская наука: изучение предпочтений и факторов, влияющих на выбор продуктов питания.&lt;/li&gt;\n&lt;li&gt;Технологические инновации: анализ того, как способы обработки (например, сублимация или ферментация) меняют сенсорный профиль продукта.&lt;/li&gt;\n&lt;li&gt;Физиология восприятия: изучение механизмов, с помощью которых человек распознает вкус и аромат.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На симпозиуме впервые представляются результаты исследований, которые меняют подход к производству еды. Например, здесь обсуждаются способы сохранения естественных свойств продуктов, таких как умами в креветках при сублимационной сушке, или методы получения функциональных ингредиентов, включая маннит из корня якона, с помощью биологических процессов. Участники представляют новые методы описательного анализа, которые позволяют точнее классифицировать вкусовые оттенки и текстурные характеристики.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Для участия в симпозиуме исследователи подают тезисы своих работ, которые проходят экспертную оценку. Следить за актуальной повесткой можно через официальные ресурсы конференции, где публикуются анонсы будущих встреч и сборники тезисов прошедших мероприятий. Материалы симпозиума служат важным источником для специалистов, работающих на стыке пищевой химии, психологии и технологий производства.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Pangborn_Sensory_Science_Symposium\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pangborn Sensory Science Symposium — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/1541-4337.70197\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Preferred Attribute Elicitation (PAE) in the Sensory Descriptive Analysis of Foods: A Deep Comprehensive Review of the Method Steps, Application, Challenges, and Trends&lt;/a&gt; — обзор, Compr Rev Food Sci Food Saf 2025&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"как люди воспринимают вкус"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Pangborn Sensory Science Symposium","description":"как люди воспринимают вкус","vcsPath":"reference/conferences/conf-pangborn.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-pangborn.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-pangborn.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-pangborn.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-pangborn.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-pangborn.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-pangborn.html#istochniki","level":2}],"title":"Pangborn Sensory Science Symposium"},"router":{"pathname":"reference/conferences/conf-pangborn","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
