        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейсы: инструменты и методы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Экструзия — это процесс непрерывного смешивания и замешивания сырья при высоких температурах и давлении, применяемый для изменения структуры пищевых компонентов. Технология используется в производстве снеков, сухих завтраков и текстуратов из растительных белков.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/cases/case-extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Инструмент&lt;/td&gt;\n&lt;td&gt;Экструдер (термомеханикалық өңдеу құрылғысы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Задача&lt;/td&gt;\n&lt;td&gt;Сырьенің құрылымын өзгерту және сіңімділігін басқару&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Данные&lt;/td&gt;\n&lt;td&gt;Шоколадтың гликемиялық жауабының өзгеруі, изоляттардағы микотоксиндер&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Результат&lt;/td&gt;\n&lt;td&gt;Өнімнің физикалық қасиеттері мен метаболикалық әсерінің өзгеруі&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"zadacha\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#zadacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Задача&lt;/span&gt;&lt;/a&gt;Задача&lt;/h2&gt;\n&lt;p&gt;Пищевая промышленность стремится к управлению скоростью усвоения нутриентов и повышению безопасности растительного сырья. Основная задача заключается в изменении физико-химических свойств компонентов, таких как сахара, молочные белки или бобовые, для улучшения их технологических характеристик и влияния на метаболический ответ организма.&lt;/p&gt;\n&lt;h2 id=\"instrument-ili-metod\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#instrument-ili-metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструмент или метод&lt;/span&gt;&lt;/a&gt;Инструмент или метод&lt;/h2&gt;\n&lt;p&gt;Экструзия (extrusion) — это процесс непрерывного смешивания, сжатия и термической обработки сырья при прохождении через формующее отверстие (фильеру). Метод основан на воздействии сдвиговых усилий и высоких температур, что приводит к денатурации белков, клейстеризации крахмала и изменению структуры молекулярных комплексов. В пищевой индустрии экструдер выступает как реактор, где материал подвергается воздействию давления и тепла, приобретая заданную форму и текстуру.&lt;/p&gt;\n&lt;h2 id=\"kak-primenili\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#kak-primenili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как применили&lt;/span&gt;&lt;/a&gt;Как применили&lt;/h2&gt;\n&lt;p&gt;В исследовании влияния обработки на гликемический ответ шоколада экструзия была применена к смеси сахара и молока до их включения в конечный продукт. Метод позволил изменить структуру этих компонентов, что привело к различиям в скорости их усвоения организмом. В контексте работы с бобовыми (чечевица, нут), экструзия рассматривается как метод обработки, способный влиять на состояние растительных белков, хотя вопрос контроля микотоксинов при производстве изолятов остается открытым.&lt;/p&gt;\n&lt;h2 id=\"chto-poluchilos\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#chto-poluchilos\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что получилось&lt;/span&gt;&lt;/a&gt;Что получилось&lt;/h2&gt;\n&lt;p&gt;Применение экструзии к сахару и молоку в составе шоколада привело к изменению гликемического ответа по сравнению с продуктами, прошедшими иную обработку. Это доказывает, что технологический процесс напрямую влияет на метаболическую доступность нутриентов. В случае с бобовыми, экструзия меняет структуру белка, однако текущие данные указывают на необходимость осторожности: микотоксины, возникающие при поражении сырья плесенью, могут сохраняться в изолятах, что требует дополнительных методов контроля.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;Экструзия не является универсальным методом очистки сырья от биологических загрязнений, таких как микотоксины. Эффективность процесса зависит от параметров давления, температуры и влажности. Изменение структуры компонентов может как улучшать усвоение, так и создавать новые технологические вызовы, требующие тщательного анализа состава на каждом этапе.&lt;/p&gt;\n&lt;h2 id=\"kak-povtorit\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#kak-povtorit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как повторить&lt;/span&gt;&lt;/a&gt;Как повторить&lt;/h2&gt;\n&lt;p&gt;Для реализации процесса необходим экструдер, обеспечивающий контроль температуры и давления. Процесс требует стандартизации состава сырья (влажность, размер частиц) и фиксации параметров прохождения через фильеру. Для оценки результата необходимо проведение сравнительных тестов на усвояемость или анализ структуры полученного продукта.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Extrusion\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extrusion — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — обзор, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/bjc.1972.33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a basic biological phenomenon with wide-ranging implications in tissue kinetics&lt;/a&gt; — обзор, Br J Cancer 1972&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm2330\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Membrane lipids: where they are and how they behave&lt;/a&gt; — обзор, Nat Rev Mol Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейсы: инструменты и методы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Экструзия — это процесс непрерывного смешивания и замешивания сырья при высоких температурах и давлении, применяемый для изменения структуры пищевых компонентов"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Экструзия","description":"Экструзия — это процесс непрерывного смешивания и замешивания сырья при высоких температурах и давлении, применяемый для изменения структуры пищевых компонентов","vcsPath":"reference/cases/case-extrusion.md"},"headings":[{"title":"Задача","href":"reference/cases/case-extrusion.html#zadacha","level":2},{"title":"Инструмент или метод","href":"reference/cases/case-extrusion.html#instrument-ili-metod","level":2},{"title":"Как применили","href":"reference/cases/case-extrusion.html#kak-primenili","level":2},{"title":"Что получилось","href":"reference/cases/case-extrusion.html#chto-poluchilos","level":2},{"title":"Ограничения","href":"reference/cases/case-extrusion.html#ogranicheniya","level":2},{"title":"Как повторить","href":"reference/cases/case-extrusion.html#kak-povtorit","level":2},{"title":"Источники","href":"reference/cases/case-extrusion.html#istochniki","level":2}],"title":"Экструзия"},"router":{"pathname":"reference/cases/case-extrusion","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
