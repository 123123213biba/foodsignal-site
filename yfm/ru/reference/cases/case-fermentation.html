        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейсы: инструменты и методы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Ферментация — это процесс биологической переработки растительного сырья с помощью микроорганизмов, приводящий к изменению химического состава и появлению новых функциональных свойств продукта.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Инструмент&lt;/td&gt;\n&lt;td&gt;Микробиологическая ферментация (биохимическая переработка)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Задача&lt;/td&gt;\n&lt;td&gt;Модификация состава сырья для получения функциональных продуктов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Данные&lt;/td&gt;\n&lt;td&gt;Корень якона (для маннита), семена алеппской сосны (для кишечного барьера)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Результат&lt;/td&gt;\n&lt;td&gt;Получение сахарозаменителей и биоактивных компонентов без химии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"zadacha\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#zadacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Задача&lt;/span&gt;&lt;/a&gt;Задача&lt;/h2&gt;\n&lt;p&gt;Ферментация — это процесс биологической переработки органических веществ с участием микроорганизмов или ферментов, направленный на изменение химического состава сырья. Основная цель метода заключается в модификации исходных свойств продукта: улучшении органолептических характеристик, повышении биодоступности нутриентов или создании новых функциональных соединений, которые сложно получить путем прямой химической экстракции.&lt;/p&gt;\n&lt;h2 id=\"instrument-ili-metod\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#instrument-ili-metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструмент или метод&lt;/span&gt;&lt;/a&gt;Инструмент или метод&lt;/h2&gt;\n&lt;p&gt;Метод представляет собой управляемую биохимическую реакцию, в ходе которой микроорганизмы (бактерии, дрожжи или плесневые грибы) используют компоненты сырья в качестве субстрата для собственного метаболизма. В результате жизнедеятельности микроорганизмов образуются вторичные метаболиты: органические кислоты, спирты, ферменты и специфические сахара. Процесс требует контроля параметров среды, таких как температура, pH и доступ кислорода, что позволяет направлять метаболический путь микроорганизмов в сторону нужного целевого продукта.&lt;/p&gt;\n&lt;h2 id=\"kak-primenili\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#kak-primenili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как применили&lt;/span&gt;&lt;/a&gt;Как применили&lt;/h2&gt;\n&lt;p&gt;В исследовании корня якона ферментацию использовали для получения маннита — сахарозаменителя. Вместо многостадийной химической обработки сырья ученые применили бактериальную ферментацию. Микроорганизмы переработали природные сахара корня якона, превратив их в маннит. В другом кейсе ферментированный сок из семян алеппской сосны применялся для изучения влияния на целостность клеток кишечного барьера. В обоих случаях метод позволил трансформировать исходное растительное сырье в продукт с новыми функциональными свойствами.&lt;/p&gt;\n&lt;h2 id=\"chto-poluchilos\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#chto-poluchilos\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что получилось&lt;/span&gt;&lt;/a&gt;Что получилось&lt;/h2&gt;\n&lt;p&gt;Применение ферментации позволило получить маннит из якона, минуя сложные химические процессы. В случае с соком семян алеппской сосны, ферментация способствовала изменению состава напитка, что, согласно предварительным данным, может влиять на барьерную функцию клеток кишечника. Метод доказал свою эффективность как способ модификации состава без агрессивного химического воздействия.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;Ферментация является биологическим процессом, зависящим от жизнедеятельности микроорганизмов, что делает его чувствительным к малейшим изменениям условий среды. Результат процесса может варьироваться в зависимости от штамма микроорганизма, состава субстрата и точности соблюдения протокола. Метод не гарантирует идентичность состава при смене условий культивирования.&lt;/p&gt;\n&lt;h2 id=\"kak-povtorit\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#kak-povtorit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как повторить&lt;/span&gt;&lt;/a&gt;Как повторить&lt;/h2&gt;\n&lt;p&gt;Для реализации метода необходимы: чистое растительное сырье, специфический штамм микроорганизма (культура), оборудование для поддержания стерильности и контроля параметров среды (термостат, pH-метр). Процесс включает подготовку субстрата, инокуляцию (внесение культуры), инкубацию в заданных условиях и последующую очистку целевого продукта.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — обзор, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3168/jds.s0022-0302(91)78551-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Methods for dietary fiber, neutral detergent fiber, and nonstarch polysaccharides in relation to animal nutrition&lt;/a&gt; — обзор, J Dairy Sci 1991&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41577-019-0165-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The NLRP3 inflammasome: molecular activation and regulation to therapeutics&lt;/a&gt; — обзор, Nat Rev Immunol 2019&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейсы: инструменты и методы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ферментация — это процесс биологической переработки растительного сырья с помощью микроорганизмов, приводящий к изменению химического состава и появлению новых "}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ферментация","description":"Ферментация — это процесс биологической переработки растительного сырья с помощью микроорганизмов, приводящий к изменению химического состава и появлению новых ","vcsPath":"reference/cases/case-fermentation.md"},"headings":[{"title":"Задача","href":"reference/cases/case-fermentation.html#zadacha","level":2},{"title":"Инструмент или метод","href":"reference/cases/case-fermentation.html#instrument-ili-metod","level":2},{"title":"Как применили","href":"reference/cases/case-fermentation.html#kak-primenili","level":2},{"title":"Что получилось","href":"reference/cases/case-fermentation.html#chto-poluchilos","level":2},{"title":"Ограничения","href":"reference/cases/case-fermentation.html#ogranicheniya","level":2},{"title":"Как повторить","href":"reference/cases/c
