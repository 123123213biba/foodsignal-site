        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;44 концепции&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/5-caffeoylquinic-acid.html\"&gt;5-кофеилхинная кислота&lt;/a&gt; — Основной фенольный компонент кофейных зерен, способный связываться с белками после окисления в о-хиноны.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgd-motifs.html\"&gt;RGD-мотивы&lt;/a&gt; — Специфические аминокислотные последовательности, которые взаимодействуют с интегринами на поверхности клеток и обеспечивают их прикрепление…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sodium-alginate.html\"&gt;Альгинат натрия&lt;/a&gt; — Природный полисахарид, используемый в качестве основы для создания защитного биоразлагаемого покрытия на поверхности плодов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aflatoxin-b1.html\"&gt;Афлатоксин B1&lt;/a&gt; — Опасный вторичный метаболит плесневых грибов, классифицированный IARC как канцероген группы 1.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;бета-глицерофосфат&lt;/a&gt; — Сшивающий агент, используемый в виде 50%-го раствора для формирования пористой пленки гидрогеля с равномерным распределением активных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biozate1.html\"&gt;БиоЗейт1&lt;/a&gt; — Молочный пептид, используемый в качестве субстрата для связывания с фенолами кофе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hemoglobin.html\"&gt;Гемоглобин&lt;/a&gt; — Железосодержащий белок крови, который при воздействии света выступает катализатором окисления липидов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyaluronic-acid.html\"&gt;Гиалуроновая кислота&lt;/a&gt; — Сахарид, используемый в качестве внешнего защитного слоя наночастиц для имитации структуры семенной кожуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gelatin.html\"&gt;желатин&lt;/a&gt; — Белковый биополимер, используемый в пищевой промышленности для создания пленок благодаря способности к гелеобразованию, контролю вязкости и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sea-bass-skin-gelatin.html\"&gt;Желатин из кожи сибаса&lt;/a&gt; — Высокобелковый биополимер, полученный из отходов переработки кожи европейского сибаса, используемый как основа для съедобной упаковки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/liquid-smoke.html\"&gt;жидкий дым&lt;/a&gt; — Пищевой ароматизатор, получаемый путем пиролиза биомассы и содержащий карбонилы и фенолы, обладающие антибактериальной и антиоксидантной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/isothiocyanates.html\"&gt;изотиоцианаты&lt;/a&gt; — Химические соединения, образующиеся при ферментативном гидролизе глюкозинолатов и придающие соусу васаби характерный аромат и остроту.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cannabidiol.html\"&gt;Каннабидиол&lt;/a&gt; — Липофильное кристаллическое вещество, получаемое из биомассы Cannabis sativa L., используемое в качестве активного компонента биологически…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha.html\"&gt;Комбуча&lt;/a&gt; — Слабокислый ферментированный напиток из подслащенного чая, получаемый в результате деятельности симбиотического сообщества бактерий и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/short-chain-fatty-acids.html\"&gt;Короткоцепочечные жирные кислоты&lt;/a&gt; — Метаболиты, образующиеся в кишечнике в результате жизнедеятельности микробиоты, участвующие в модуляции иммунного ответа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malondialdehyde.html\"&gt;Малоновый диальдегид&lt;/a&gt; — Токсичный продукт глубокого окисления липидов, используемый как маркер порчи жиросодержащих продуктов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mannitol.html\"&gt;Маннит&lt;/a&gt; — Шестиатомный спирт, используемый в качестве низкокалорийного сахарозаменителя с низким гликемическим индексом.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mycotoxins.html\"&gt;Микотоксины&lt;/a&gt; — Токсичные вторичные метаболиты, вырабатываемые плесневыми грибами, которые снижают питательную ценность сырья и представляют опасность для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mobile-genetic-elements.html\"&gt;Мобильные генетические элементы&lt;/a&gt; — Фрагменты ДНК, способные перемещаться внутри генома или переноситься между бактериальными клетками, включая гены устойчивости.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/motilin.html\"&gt;мотилин&lt;/a&gt; — Гормон, стимулирующий перистальтику и регулирующий моторику желудочно-кишечного тракта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc-oxide-nanoparticles.html\"&gt;наночастицы оксида цинка&lt;/a&gt; — Компонент гидрогеля, синтезируемый методом термического разложения при 260 °C, который генерирует активные формы кислорода и высвобождает…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-steroidal-anti-inflammatory-drugs.html\"&gt;Нестероидные противовоспалительные препараты&lt;/a&gt; — Лекарственные средства, вызывающие поражение желудка путем угнетения ферментов циклооксигеназ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/olfactory-receptor-or5k1.html\"&gt;Обонятельный рецептор OR5K1&lt;/a&gt; — Белковая структура, используемая в биосенсоре для специфического распознавания молекул пиразинов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/residual-organic-solvents.html\"&gt;Остаточные органические растворители&lt;/a&gt; — Химические соединения, используемые в процессе кристаллизации, следы которых остаются в конечном продукте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gpaef-peptide.html\"&gt;Пептид GPAEF&lt;/a&gt; — Пентапептид, образующийся при расщеплении рекомбинантного коллагена в желудке, который активирует синтез простагландинов через…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pyrazines.html\"&gt;Пиразины&lt;/a&gt; — Гетероциклические органические соединения, отвечающие за формирование ароматов жареного, орехового и хлебного профилей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenols.html\"&gt;Полифенолы&lt;/a&gt; — Группа химических соединений в составе яблок, обеспечивающая основную способность плодов нейтрализовать свободные радикалы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenol-oxidase.html\"&gt;Полифенолоксидаза&lt;/a&gt; — Фермент, катализирующий окисление фенольных соединений, используемый для модификации белков в мягких условиях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;порошок сушеной тыквы&lt;/a&gt; — Овощная добавка, изменяющая вторичную структуру белков и укрепляющая гелевую сеть сурими при дозировке 1,1%.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recombinant-human-type-iii-collagen.html\"&gt;Рекомбинантный человеческий коллаген III типа&lt;/a&gt; — Биотехнологически полученный белок внеклеточного матрикса, используемый как биоматериал для защиты слизистой оболочки желудка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/somatostatin.html\"&gt;соматостатин&lt;/a&gt; — Сывороточный регуляторный фактор, угнетающий моторную активность кишечника.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/potassium-sorbate.html\"&gt;сорбат калия&lt;/a&gt; — Пищевой консервант, используемый для подавления роста газообразующих бактерий в соусе васаби.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wasabi-sauce.html\"&gt;соус васаби&lt;/a&gt; — Приправа, изготавливаемая преимущественно из корня хрена (Armoracia rusticana), обладающая антимикробными свойствами и остротой за счет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whey-protein-isolate.html\"&gt;Сывороточный изолят&lt;/a&gt; — Высокоочищенная форма белка молочной сыворотки, содержащая значительное количество незаменимых аминокислот.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tricolor-quinoa.html\"&gt;Трехцветное киноа&lt;/a&gt; — Смесь зерен белого, красного и черного киноа, используемая как добавка в рацион для защиты слизистой оболочки желудка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fructooligosaccharides.html\"&gt;Фруктоолигосахариды&lt;/a&gt; — Углеводные соединения, содержащиеся в корне якона, которые служат сырьем для получения маннита путем ферментации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chitosan.html\"&gt;Хитозан&lt;/a&gt; — Катионный полисахарид, который при взаимодействии с альгинатом и пектином уплотняет структуру защитной пленки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chlorogenic-acid.html\"&gt;хлорогеновая кислота&lt;/a&gt; — Экстрагированное из жимолости вещество, входящее в состав гидрогеля для нейтрализации свободных радикалов на поверхности плодов и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc.html\"&gt;Цинк&lt;/a&gt; — Микроэлемент, выступающий регулятором метаболизма углеводов и восстанавливающий активность ферментов гликолиза при избытке крахмала.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eugenol.html\"&gt;Эвгенол&lt;/a&gt; — Компонент эфирного масла гвоздики, обеспечивающий антиоксидантную активность покрытия.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html\"&gt;экстракт кожуры грейпфрута&lt;/a&gt; — Растительный экстракт, богатый фенольными соединениями и антиоксидантами, используемый в качестве активного природного консерванта для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/broccoli-sprout-extract.html\"&gt;Экстракт ростков брокколи&lt;/a&gt; — Биологически активная добавка, полученная из ростков брокколи, используемая для активации защитных механизмов организма.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thyme-essential-oil.html\"&gt;Эфирное масло тимьяна&lt;/a&gt; — Природное соединение, добавляемое в состав пленки для подавления роста бактерий и замедления окисления белков и липидов в мясе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malic-acid.html\"&gt;Яблочная кислота&lt;/a&gt; — Органическая кислота, являющаяся доминирующим компонентом кислого вкуса в мякоти яблок.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"44 концепции"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Вещества","description":"44 концепции","vcsPath":"reference/substances.md"},"headings":[],"title":
