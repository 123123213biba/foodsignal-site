            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"81\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"599\" cy=\"167\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · MICRONUTRIENTS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Nima uchun yolg'iz&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ovqatlangandan ko'ra birga&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kechki ovqat qilish&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;foydaliroq&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Yaqinlarimiz yonimizda bo'lganda tanamiz samaraliroq ishlaydi. Yangi tadqiqot shuni ko'rsatadiki, yaqin inson ishtirokida organizm uglevod yuklamasini osonroq yengib o'tadi va glyukoza darajasini tezroq normaga qaytaradi. Ushbu hodisa «ijtimoiy fiziologiya» deb nomlandi. Bu yaqin munosabatlar shunchaki ruhiy tasalli emas, balki tana resurslarini tejashning real vositasi ekanligini isbotlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Yaqin insonning yonida bo'lishi ovqatdan keyingi glyukoza miqdorini kamaytiradi va uni tezroq normaga qaytaradi.&lt;/li&gt;\n&lt;li&gt;Sherik bilan birga bo'lganda glikemik egri chiziq ostidagi maydon (iAUC) o'rtacha 14,55–23,9% ga kamayadi.&lt;/li&gt;\n&lt;li&gt;Ijtimoiy fiziologiya samarasi sovuq va stress sharoitida ham organizmga tushadigan yuklamani kamaytiradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Eksperiment davomida tadqiqotchilar uglevod yuklamasi ostida glyukoza gomeostazi — ichki muhit barqarorligini saqlash jarayonining samaradorligini baholadilar. Ishtirokchilar (108 kishi) 50 g toza uglevodga teng bo'lgan 102 g standart oq bug'doy nonini iste'mol qildilar. Qon plazmasidagi glyukoza miqdori ovqatdan keyin 120 daqiqa davomida o'lchab turildi. Dinamika tahlili ko'rsatkichlarning bazaviy darajadan og'ishining umumiy miqdori va davomiyligini aks ettiruvchi egri chiziq ostidagi maydon (iAUC) hisobi orqali amalga oshirildi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, romantik sherik ishtirokida (ijtimoiy holat) iAUC ko'rsatkichi yolg'iz ovqatlanishga qaraganda guruh ichidagi taqqoslashda 14,55% ga, guruhlararo tahlilda esa 23,9% ga kamaydi. Glyukoza konsentratsiyasi 45, 60, 90 va 120-daqiqalardagi o'lchovlarda ijtimoiy holatda sezilarli darajada past bo'ldi. Energiyani tejashning shunga o'xshash samarasi sovuq harorat (12 °C, n = 116) va elektr toki urishi (7 V, n = 115) stressi ostidagi testlarda ham tasdiqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotda ijtimoiy sherik sifatida faqat juda yaqin insonlar qatnashgan, begona odamlar bilan ham bunday samara bo'lish-bo'lmasligi noma'lum.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Tana ovqat&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;hazm qilishga&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ko'p kuch&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sarflaydi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;102 g non&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bilan yolg'iz&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va birga&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o'tilgan test&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Birgalikda&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qondagi qand&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;24% tezroq&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;pasayadi&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yaqinlarimiz&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tana&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;resurslarini&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tejaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maqola taqriz qilinadigan Science advances jurnalida nashr etilgan. Ammo bu ham bit
