        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"270\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"630\" cy=\"284\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · FIBRE_MICROBIOME   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Achitqi bakteriyasi ich&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qotishini yumshatadi: PA53&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;shtammining klinik sinovlari&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f1.jpg\" alt=\"Klinik tadqiqotning blok-sxemasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Klinik tadqiqotning blok-sxemasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Surunkali funksional ich qotishi ko‘pincha mikrobiota xilma-xilligining kamayishi va ichak harakatining sekinlashishi bilan bog‘liq. Randomizatsiyalangan tadqiqotda &lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; PA53 shtammi najas zichligini me’yorlashtirishga yordam berishi aniqlandi. Ushbu bakteriyani har kuni qabul qilish ichak motorikasi gormonlari va yallig‘lanish belgilarini ijobiy tomonga o‘zgartirdi. Biroq ich kelish chastotasi bo‘yicha guruhlararo farq sezilarli darajada bo‘lmadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Kuniga 3,0 × 10¹⁰ KHT PA53 shtammi 8 haftada Bristol shkalasi bo‘yicha najasni sezilarli darajada yumshatdi.&lt;/li&gt;\n&lt;li&gt;Bakteriya motilin va IL-10 darajasini oshirib, IL-6 yallig‘lanish ko‘rsatkichini kamaytirdi.&lt;/li&gt;\n&lt;li&gt;Ich kelish chastotasi bo‘yicha guruhlar orasidagi farq statistik jihatdan ahamiyatsiz bo‘ldi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Pediococcus acidilactici — bu fermentatsiyalangan oziq-ovqatlarda uchraydigan gram-musbat sut kislotasi bakteriyasidir. Rim IV mezonlari bo‘yicha funksional ich qotishi aniqlangan 87 nafar katta yoshli ishtirokchi 8 hafta davomida kuniga 3,0 × 10¹⁰ KHT PA53 shtammini yoki platsebo (dekstrin) qabul qildi. Najas shakli Bristol shkalasi (&lt;a href=\"concepts/bristol-stool-form-scale.html\"&gt;BSFS&lt;/a&gt;) bo‘yicha baholandi, unda 1–2 ballar haddan tashqari qattiq konsistensiyani bildiradi. Natijada PA53 guruhida BSFS ko‘rsatkichi platsebodagi 2,03 ± 0,85 ga nisbatan 2,76 ± 0,93 gacha oshdi (p = 0,004), bu najasning sezilarli yumshaganini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;Qon zardobi tahlili PA53 guruhida ichak motorikasini faollashtiruvchi motilin gormoni va yallig‘lanishga qarshi interleykin-10 (IL-10) miqdori oshganini ko‘rsatdi. Shu bilan birga, harakatni sekinlashtiruvchi somatostatin va yallig‘lanish chaqiruvchi interleykin-6 (IL-6) darajasi pasaydi. 16S rRNK sekvenirlash tahlili Pediococcus ulushi ortganini va mikrobiota tuzilmasi ijobiy o‘zgarganini ko‘rsatdi. Haftasiga 4–6 marta ich kelishi kuzatilganlar ulushi 16,7% dan 38,1% gacha oshgan bo‘lsa-da, guruhlararo farq statistik jihatdan ishonchsiz bo‘lib qoldi (p = 0,144).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 87 kishilik kichik guruhda o‘tkazilgan va ich kelish chastotasi bo‘yicha platsebodan yaqqol ustunlik ko‘rsatmadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Funksional qabziyat (FQ) ichakning keng tarqalgan surunkali kasalligi boʻlib, odatda kamdan-kam ich kelishi (haftasiga uch martadan kam), qattiq axlat (Bristol axlat shakli shkalasi, BSFS boʻyicha 1–2-turlar) va toʻliq boʻshashmaslik hissi bilan tavsiflanadi. Kattalarda FQning global tarqalishi 10–14% ni, keksalarda esa 30% gacha yetishi mumkin. FQ patofiziologiyasi koʻp omilli boʻlib, yoʻgʻon ichak motorikasining buzilishi, visseral oʻta sezuvchanlik va «ichak-miya» oʻqi regulyatsiyasining buzilishini oʻz ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 8 haftalik randomizatsiyalangan ikki tomonlama koʻr, platsebo-nazoratli sinov davomida kattalardagi funksional qabziyatda Pediococcus acidilactici PA53 probiotigining samaradorligini baholaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Anʼanaviy davolash turmush tarzini oʻzgartirish va surgi vositalarini oʻz ichiga oladi, ammo ularning samaradorligi nojoʻya taʼsirlar va bemorlarning past darajadagi rioya qilishi bilan cheklangan. Bifidobacterium lactis HN019 va Weizmannia coagulans BC99 kabi probiotiklar axlat konsistensiyasini va tranzit vaqtini yaxshilashda oʻrtacha samaradorlikni koʻrsatadi. Pediococcus acidilactici — potentsial immunomodulyatsion xususiyatlarga va pediotsin ishlab chiqarish qobiliyatiga ega boʻlgan gram-musbat gomofermentativ sut kislotasi bakteriyasidir.&lt;/p&gt;\n&lt;p&gt;Tadqiqot Ningsya tibbiyot universiteti kasalxonasida (Xitoy) 2024-yil 1-avgustdan 2025-yil 30-maygacha oʻtkazildi (NCT06761443 roʻyxatdan oʻtish raqami). Rim IV mezonlari boʻyicha FQ tashxisi qoʻyilgan 87 nafar ishtirokchi (18–70 yosh) qamrab olindi. Tadqiqot boshlanishidan 4 hafta oldin surgi vositalari yoki probiotiklar qabul qilgan, shuningdek, ogʻir hamroh kasalliklarga ega shaxslar chiqarib tashlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Randomizatsiyalangan ikki tomonlama koʻr, platsebo-nazoratli tadqiqot — klinik sinovlarning «oltin standarti» boʻlib, unda na ishtirokchilar, na tadqiqotchilar kim faol preparat, kim platsebo olayotganini bilishmaydi, bu esa tarafkashlikni minimallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishtirokchilar ikki guruhga (1:1) randomizatsiya qilindi: PA53 guruhi (3 g dekstrin va 3,0 × 10¹⁰ CFU P. acidilactici PA53) va platsebo guruhi (3 g dekstrin). Birlamchi natija — BSFS shkalasi boʻyicha axlat konsistensiyasining oʻzgarishi. Ikkilamchi natijalar — spontan defekatsiya chastotasi (SBM), hayot sifati (PAC-QOL), psixologik holat (DASS-21), biokimyoviy va yalligʻlanish markerlari, shuningdek, mikrobiota tarkibi (16S rRNA sekvenlash).&lt;/p&gt;\n&lt;p&gt;Tadqiqotda 81 kishi (PA53 guruhida 42, platsebo guruhida 39) ishtirok etdi. 8 haftadan soʻng PA53 guruhida BSFS koʻrsatkichi sezilarli darajada oshdi (1,93 ± 0,80 dan 2,76 ± 0,93 gacha, p = 0,001), bu platsebo guruhidagidan yuqori edi (2,03 ± 0,85, p = 0,004). PA53 guruhida defekatsiya chastotasi guruh ichida yaxshilandi (p = 0,028), ammo guruhlar oʻrtasida sezilarli farq aniqlanmadi (p = 0,144).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gormonlar (MTL, SS) va sitokinlar (IL-6, IL-10) darajasidagi kuzatilgan oʻzgarishlar asosan guruh ichidagi xususiyatga ega boʻlib, bu davolashning toʻgʻridan-toʻgʻri taʼsiridan koʻra vaqtinchalik tebranishlarni aks ettirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biokimyoviy xavfsizlik koʻrsatkichlari (albumin, ALT, AST, kreatinin, siydik kislotasi, mochevina, glyukoza) meʼyor chegarasida qoldi. Mikrobiota tahlili 8-haftaga kelib PA53 guruhida Pediococcus turkumining boyiganligini koʻrsatdi. Guruhlar oʻrtasidagi alfa va beta xilma-xillikdagi farqlar statistik ahamiyatlilik chegarasiga yetmadi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni koʻrsatadiki, 8 hafta davomida har kuni P. acidilactici PA53 qabul qilish funksional qabziyati boʻlgan kattalarda axlat konsistensiyasini yaxshilashga yordam beradi. Neyroendokrin oʻq orqali motorikaga taʼsir qilish mexanizmlari gipoteza darajasida qolsa-da, aniqlangan IL-6 pasayishi va IL-10 koʻtarilishi potentsial immunomodulyatsion taʼsirni koʻrsatadi. Tadqiqot cheklovlari tanlanmaning nisbatan kichikligi va parhez ustidan qatʼiy nazoratning yoʻqligini oʻz ichiga oladi, bu esa kengroq koʻp markazli sinovlarni oʻtkazishni talab qiladi.&lt;/p&gt;\n&lt;p&gt;P. acidilactici PA53 qoʻshimchasi xavfsiz, yaxshi oʻzlashtiriladi va funksional qabziyati boʻlgan bemorlarda axlat shaklini sezilarli darajada yaxshilaydi, shu bilan birga defekatsiya chastotasiga taʼsiri kamroq ifodalangan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f1.jpg\" alt=\"Klinik tadqiqotning blok-sxemasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Klinik tadqiqotning blok-sxemasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f2.jpg\" alt=\"Platsebo va PA53 guruhlaridagi 5-HT, MTL, SS va sitokinlar (IL-4, IL-6, IL-10) darajalari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Platsebo va PA53 guruhlaridagi 5-HT, MTL, SS va sitokinlar (IL-4, IL-6, IL-10) darajalari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Platsebo va PA53 guruhlaridagi 5-HT, MTL, SS va sitokinlar (IL-4, IL-6, IL-10) darajalari. 5-HT: 5-gidroksitriptamin, MTL: motilin, SS: somatostatin, IL-4: interleykin-4, IL-6: interleykin-6, IL-10: interleykin-10. Placebo_W0, Placebo_W4, Placebo_W8 platsebo guruhidagi mos ravishda 0, 4 va 8-haftalardagi vaqt nuqtalarini ifodalaydi. PA53_W0, PA53_W4, PA53_W8 PA53 guruhidagi mos ravishda 0, 4 va 8-haftalardagi vaqt nuqtalarini ifodalaydi. Barcha keltirilgan p-qiymatlari Benjamini–Xoxbergning noto‘g‘ri aniqlash darajasi (FDR) usuli yordamida ko‘p sonli taqqoslashlar uchun tuzatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f3.jpg\" alt=\"PA53 va platsebo guruhlarida boshlang‘ich darajadagi ichak mikrobiotasi xilma-xilligi va tarkibi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;PA53 va platsebo guruhlarida boshlang‘ich darajadagi ichak mikrobiotasi xilma-xilligi va tarkibi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;PA53 va platsebo guruhlarida boshlang‘ich darajadagi ichak mikrobiotasi xilma-xilligi va tarkibi. (A–C) Alfa-xilma-xillik indekslari (ACE, Chao1 va Shannon). (D) Brey–Kertis dissimalyarligi asosida asosiy koordinatalar tahlili (PCoA) grafigi. (E) Tip darajasidagi ichak mikrobiotasi tarkibi. (F) Guruhlar o‘rtasidagi differensial ko‘pligini ko‘rsatuvchi chiziqli diskriminant tahlil (LDA) effekt hajmi (LEfSe) tahlilidan olingan LDA ballari gistogrammasi. p-qiymatlari ko‘p sonli taqqoslashlar uchun Benjamini–Xoxbergning noto‘g‘ri aniqlash darajasi (FDR) tuzatishi yordamida moslashtirilgan. LEfSe yordamida aniqlangan differensial taksonlar LDA bali &amp;gt; 2,5 bo‘lgan chegara asosida saralangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f4.jpg\" alt=\"4 haftalik aralashuvdan so‘ng PA53 va platsebo guruhlarida ichak mikrobiotasi xilma-xilligi va tarkibi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4 haftalik aralashuvdan so‘ng PA53 va platsebo guruhlarida ichak mikrobiotasi xilma-xilligi va tarkibi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4 haftalik aralashuvdan so‘ng PA53 va platsebo guruhlarida ichak mikrobiotasi xilma-xilligi va tarkibi. (A–C) Alfa-xilma-xillik indekslari (ACE, Chao1 va Shannon). (D) Brey–Kertis dissimalyarligi asosida asosiy koordinatalar tahlili (PCoA) grafigi. (E) Tip darajasidagi ichak mikrobiotasi tarkibi. (F) Guruhlar o‘rtasidagi differensial ko‘pligini ko‘rsatuvchi chiziqli diskriminant tahlil (LDA) effekt hajmi (LEfSe) tahlilidan olingan LDA ballari gistogrammasi. p-qiymatlari ko‘p sonli taqqoslashlar uchun Benjamini–Xoxbergning noto‘g‘ri aniqlash darajasi (FDR) tuzatishi yordamida moslashtirilgan. LEfSe yordamida aniqlangan differensial taksonlar LDA bali &amp;gt; 2,5 bo‘lgan chegara asosida saralangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f5.jpg\" alt=\"8 haftalik aralashuvdan so‘ng PA53 va platsebo guruhlarida ichak mikrobiotasi xilma-xilligi va tarkibi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8 haftalik aralashuvdan so‘ng PA53 va platsebo guruhlarida ichak mikrobiotasi xilma-xilligi va tarkibi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8 haftalik aralashuvdan so‘ng PA53 va platsebo guruhlarida ichak mikrobiotasi xilma-xilligi va tarkibi. (A–C) Alfa-xilma-xillik indekslari (ACE, Chao1 va Shannon). (D) Brey–Kertis dissimalyarligi asosida asosiy koordinatalar tahlili (PCoA) grafigi. (E) Tip darajasidagi ichak mikrobiotasi tarkibi. (F) Guruhlar o‘rtasidagi differensial ko‘pligini ko‘rsatuvchi chiziqli diskriminant tahlil (LDA) effekt hajmi (LEfSe) tahlilidan olingan LDA ballari gistogrammasi. Qiymatlar ko‘p sonli taqqoslashlar uchun Benjamini–Xoxbergning noto‘g‘ri aniqlash darajasi (FDR) tuzatishi yordamida moslashtirilgan. LEfSe yordamida aniqlangan differensial taksonlar LDA bali &amp;gt; 2,5 bo‘lgan chegara asosida saralangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f6.jpg\" alt=\"Intervensiyaning 0, 4 va 8-haftalarida PA53 guruhidagi ichak mikrobiotasi dinamikasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Intervensiyaning 0, 4 va 8-haftalarida PA53 guruhidagi ichak mikrobiotasi dinamikasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Intervensiyaning 0, 4 va 8-haftalarida PA53 guruhidagi ichak mikrobiotasi dinamikasi. (A–C) Alfa-xilma-xillik indekslari (ACE, Chao1 va Shannon). (D) Bray-Curtis dissimilyatsiyasi asosida beta-xilma-xillikning asosiy koordinatalar tahlili (PCoA). (E) Tip darajasidagi nisbiy taksonomik moʻllik. (F) LEfSe tahlili yordamida aniqlangan differensial taksonlar. p-qiymatlari koʻp sonli taqqoslashlar uchun Benjamini-Hochberg soxta kashfiyot darajasi (FDR) tuzatishidan foydalangan holda moslashtirildi. LEfSe tomonidan aniqlangan differensial taksonlar LDA balli chegarasi &amp;gt; 2,5 asosida saralandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool-f7.jpg\" alt=\"Intervensiyaning 0, 4 va 8-haftalarida platsebo guruhidagi ichak mikrobiotasi dinamikasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Intervensiyaning 0, 4 va 8-haftalarida platsebo guruhidagi ichak mikrobiotasi dinamikasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Intervensiyaning 0, 4 va 8-haftalarida platsebo guruhidagi ichak mikrobiotasi dinamikasi. (A–C) Alfa-xilma-xillik indekslari (ACE, Chao1 va Shannon). (D) Bray-Curtis dissimilyatsiyasi asosida beta-xilma-xillikning asosiy koordinatalar tahlili (PCoA). (E) Tip darajasidagi nisbiy taksonomik moʻllik.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Surunkali ich&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qotishi va&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff
