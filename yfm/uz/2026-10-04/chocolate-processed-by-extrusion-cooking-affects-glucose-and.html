        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"205\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"595\" cy=\"165\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · EXTRUSION   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Shakar sakrashiga qarshi&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ekstruziya: shokoladni qayta&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ishlash metabolizmni qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o'zgartiradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f1.jpg\" alt=\"Tadqiqot dizaynining CONSORT oqim diagrammasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Tadqiqot dizaynining &lt;a href=\"concepts/consort.html\"&gt;CONSORT&lt;/a&gt; oqim diagrammasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Shirinliklar qondagi glyukoza va yog'lar miqdorining keskin oshishiga sabab bo'ladi. Yaponiya olimlari shokolad tarkibini o'zgartirmasdan, faqat ingredientlarning fizik tuzilishini o'zgartirish orqali ushbu ta'sirni yumshatish yo'lini sinab ko'rishdi. Shakar, kakao massasi va quruq sutning bir qismi 105 °C gacha bo'lgan haroratda ikki shnekli ekstruderdan o'tkazildi. Bunday shokolad insulin ajralishini sezilarli darajada kamaytirdi va to'qlik hissini uzaytirdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Retsept mutlaqo bir xil: 33,5% shakar va 34% yog', farq faqat xomashyoga ekstruziya bilan ishlov berishda&lt;/li&gt;\n&lt;li&gt;Ekstruziya 30-daqiqadagi insulin sakrashini 26,8 dan 20,6 mkXE/ml gacha kamaytirdi&lt;/li&gt;\n&lt;li&gt;Shakarning sekinroq erishi to'qlik hissini uzoqroq saqlab qolishga yordam berdi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqot uchun kimyoviy tarkibi bir xil bo'lgan ikkita shokolad tayyorlandi: 100 g mahsulotda 33,5 g saxoza, qariyb 14,5–14,9 g laktoza va 34 g yog'. Tajriba namunasida (Cw/E) shakarning 33,55% qismi, 6,6% kakao massasi va 14,85% quruq sut &lt;a href=\"concepts/twin-screw-extruder.html\"&gt;Coperion ZSK34Mv Plus&lt;/a&gt; ikki shnekli ekstruderida (aylanish tezligi 200 ayl/daq, chiqishdagi harorat 105 °C) oldindan ishlovdan o'tkazildi. olingan ekstrudat 1 mm elakdan o'tkazilib, an'anaviy usulda konshirlandi va 28–30 °C da temperlandi.&lt;/p&gt;\n&lt;p&gt;Klinik sinovda 18 nafar sog'lom erkak och qoringa 76 g shokolad iste'mol qildi. Ekstruziyadan o'tgan shokoladni iste'mol qilganda, 45-daqiqada qondagi glyukoza o'sishi nazorat guruhidagi 25,1 ± 6,4 mg/dL ga nisbatan 17,8 ± 6,0 mg/dL ni tashkil etdi. 30-daqiqada insulin miqdori 26,8 dan 20,6 mkXE/ml gacha tushdi, triglitseridlar darajasi esa 180 daqiqa davomida pastroq bo'ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat 18 nafar yaponiyalik erkakda o'tkazilgan; ayollar va diabetga chalingan bemorlar uchun natijalar farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Shakar va lipidlar muhim oziq moddalar boʻlsa-da, ularni haddan tashqari koʻp isteʼmol qilish semizlik, metabolik sindrom, qandli diabet va yurak-qon tomir kasalliklari bilan bogʻliq. Giperglikemiya va ovqatdan keyin qondagi glyukoza darajasining keskin oʻzgarishi endoteliy funksiyasiga salbiy taʼsir qiladi va oksidlovchi stressni kuchaytiradi. Qondagi glyukoza darajasini optimal nazorat qilish salomatlik uchun muhimdir. Oziqlanishga zamonaviy yondashuv qatʼiy cheklovlardan voz kechib, oziq-ovqatga yaxlit qarashni, yaʼni nafaqat oziq moddalar miqdorini, balki ularning oʻzlashtirilishiga taʼsir qiluvchi ishlov berish usullarini ham hisobga olishni taklif qiladi.&lt;/p&gt;\n&lt;p&gt;Ekstruziya — yuqori harorat va bosim ostida uzluksiz aralashtirish va qorishtirish jarayoni — gazaklar va quruq nonushtalar ishlab chiqarishda keng qoʻllaniladi. Tadqiqotlar shuni koʻrsatadiki, ekstruziya kraxmal va lipidlar tuzilishini oʻzgartirib, ularning hazm boʻlishiga taʼsir qilishi mumkin. Ushbu tadqiqotda ekstruziya qilingan shokoladning ovqatdan keyingi metabolik javobga va shakarlarning suvda erishga chidamliligiga taʼsiri tekshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Shokoladni ekstruziya qilish shakarlarning erishini sekinlashtirishi va ovqatdan keyin qondagi glyukoza, insulin va triglitseridlar darajasini pasaytirib, uzoqroq toʻqlik hissini taʼminlashi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Randomizatsiyalangan ikki tomonlama koʻr-koʻrona sinovda (CONSORT) 18 nafar sogʻlom yapon erkaklari (20–60 yosh, BMI 20,0–24,9) ishtirok etdi. Ishtirokchilar ekstruziya qilingan (Cw/E) yoki ekstruziya qilinmagan (Cw/oE) shokolad isteʼmol qilishdi. Ikkala namunaning tarkibi bir xil edi. Glyukoza, insulin va triglitseridlar darajasi och qoringa va ovqatdan keyin 180 daqiqa davomida oʻlchandi. Shuningdek, ishtaha koʻrsatkichlari va shokolad komponentlarining sunʼiy oshqozon muhitida erishga chidamliligi baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CONSORT — randomizatsiyalangan sinovlar uchun hisobot standarti boʻlib, tadqiqot dizaynining shaffofligini taʼminlaydi va xatoliklarni minimallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kichik guruhda (18 kishi) faqat sogʻlom erkaklar ishtirokida oʻtkazilgan, bu natijalarni ayollar, bolalar va metabolik kasalliklari boʻlgan odamlarga tatbiq etish imkoniyatini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Och qoringa glyukoza, insulin va triglitseridlar darajasi guruhlar oʻrtasida farq qilmadi. Cw/E isteʼmol qilgandan soʻng, Cw/oE ga nisbatan insulin (30-daqiqada) va triglitseridlar (30 va 45-daqiqalarda) darajasi pastroq boʻldi. Insulin uchun integral koʻrsatkichlar (&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;iAUC&lt;/a&gt;) Cw/E guruhida sezilarli darajada pastroq boʻldi. 120-daqiqada toʻqlik hissi Cw/E guruhida yuqoriroq edi. In vitro testlarida Cw/E shokoladidan saxaroza va laktozaning erishi Cw/oE ga qaraganda sekinroq kechdi.&lt;/p&gt;\n&lt;p&gt;Natijalar oziq-ovqat mahsulotlariga ishlov berish usuli metabolik javobga taʼsir qilishini tasdiqlaydi. Ekstruziyadan oʻtgan shokoladdagi shakarlarning sekin erishi, ehtimol, strukturaviy «karkas» hosil boʻlishi yoki qovushqoqlikning oʻzgarishi bilan bogʻliq boʻlib, bu oziq moddalarning soʻrilishini sekinlashtiradi. Bu metabolizmga yuklamani kamaytirgan holda mahsulotning taʼm sifatlarini saqlab qolish imkonini beradi. Uzoq muddatli taʼsirlarni va toʻqlik gormonlariga (masalan, GLP-1) taʼsir qilish mexanizmlarini baholash uchun qoʻshimcha tadqiqotlar zarur.&lt;/p&gt;\n&lt;p&gt;Shokoladni ekstruziya qilish ovqatdan keyin glyukoza, insulin va triglitseridlar darajasining keskin koʻtarilishini kamaytiradi va toʻqlik hissini saqlashga yordam beradi. Ishlov berishning ushbu usuli metabolik salomatlikni qoʻllab-quvvatlovchi mahsulotlar yaratish uchun istiqbolli vositadir.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f1.jpg\" alt=\"Tadqiqot dizaynining CONSORT oqim diagrammasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Tadqiqot dizaynining CONSORT oqim diagrammasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f2.jpg\" alt=\"Ekstruziya usuli bilan yoki usulsiz qayta ishlangan shokoladni (mos ravishda Cw/E yoki Cw/oE) isteʼmol qilgandan soʻng (\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Ekstruziya usuli bilan yoki usulsiz qayta ishlangan shokoladni (mos ravishda Cw/E yoki Cw/oE) isteʼmol qilgandan soʻng (A) plazmadagi glyukoza, (B) zardobdagi insulin va (C) zardobdagi triglitseridlar darajasining vaqtga bogʻliq oʻzgarishlari. Xatolik chiziqlari oʻrtacha qiymatning standart xatosini (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;) koʻrsatadi. &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1, ikki guruh oʻrtasidagi farq.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f3.jpg\" alt=\"Ekstruziya usuli bilan yoki usulsiz qayta ishlangan shokoladni (mos ravishda Cw/E yoki Cw/oE) isteʼmol qilgandan soʻng (\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Ekstruziya usuli bilan yoki usulsiz qayta ishlangan shokoladni (mos ravishda Cw/E yoki Cw/oE) isteʼmol qilgandan soʻng (A) plazmadagi glyukoza, (B) zardobdagi insulin va (C) zardobdagi triglitseridlar darajasining oʻzgarishi uchun vaqtga bogʻliq inkremental egri chiziq ostidagi maydonlar (iAUC). Xatolik chiziqlari SEMni koʻrsatadi. &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1, ikki guruh oʻrtasidagi farq.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f4.jpg\" alt=\"Ekstruziya usuli bilan yoki usulsiz qayta ishlangan shokoladni (mos ravishda Cw/E yoki Cw/oE) isteʼmol qilgandan soʻng i\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Ekstruziya usuli bilan yoki usulsiz qayta ishlangan shokoladni (mos ravishda Cw/E yoki Cw/oE) isteʼmol qilgandan soʻng ishtirokchilarning ishtaha koʻrsatkichlaridagi oʻzgarishlar. (A) Ochlik; (B) toʻqlik; (C) ovqatlanish istagi. Xatolik chiziqlari SEMni koʻrsatadi. &lt;em&gt;p &amp;lt; 0,05; ikki guruh oʻrtasidagi farq.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and-f5.jpg\" alt=\"Ekstruziya usuli bilan yoki usulsiz qayta ishlangan shokolad (mos ravishda Cw/E yoki Cw/oE) yordamida oshqozonning imita\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Ekstruziya usuli bilan yoki usulsiz qayta ishlangan shokolad (mos ravishda Cw/E yoki Cw/oE) yordamida oshqozonning imitatsion eritmasida inkubatsiya jarayonida (A) saxaroza ekvivalenti va (B) laktoza konsentratsiyasi profillari. Xatolik chiziqlari SEMni koʻrsatadi. &lt;em&gt;p &amp;lt; 0,05; #p &amp;lt; 0,1; ikki guruh oʻrta
