            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"88\" cy=\"72\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"271\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SOUS_VIDE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Suyuq tutun va nanoemulsiya&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;sous-vide midiyalarining&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;saqlanishini 24 kunga&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;uzaytiradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f1.jpg\" alt=\"Guruhlarning rang tahlili natijalari. Control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bilan ishlov b\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Guruhlarning rang tahlili natijalari. Control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtkazilgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti; DNS guruhi: kungaboqar yogʻi + tutun xushboʻylantirgichi (yogʻda eriydigan, 5%) nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;O‘rta yer dengizi midiyalari tez buzilishi sababli ularni muzlatmasdan uzoq saqlash mushkul. Tadqiqotchilar 85 °C da vakuumni (sous-vide), suyuq tutun va kungaboqar moyi asosidagi nanoemulsiyani birlashtirgan to‘siq texnologiyasini o‘rgandilar. Ushbu usul oqsillar yemirilishini va lipidlar oksidlanishini to‘xtatib, to‘qima tuzilishini saqlab qoldi. Natijada mahsulotning 3 °C da xavfsiz saqlanish muddati 24 kungacha yetdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;85 °C sous-vide, suyuq tutun va nanoemulsiya midiya saqlanishini 3 °C da 18 kundan 24 kunga uzaytiradi&lt;/li&gt;\n&lt;li&gt;DNS guruhida uchuvchan azot (&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt;) ruxsat etilgan 35 mg N/100 g chegarasidan ancha past darajada saqlandi&lt;/li&gt;\n&lt;li&gt;Ultratovushli nanoemulsiya qizdirilganda tomchilar hajmini 190 nm gacha kamaytirib, to‘qimani mustahkamlaydi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"rejimlar\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#rejimlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rejimlar&lt;/span&gt;&lt;/a&gt;Rejimlar&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Mahsulot&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Usul&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Harorat&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Vaqt&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Natija&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Midiya go‘shti (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Faqat sous-vide (nazorat)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 daq&lt;/td&gt;\n&lt;td&gt;3 °C da saqlash muddati 18 kun; so‘ng mikrobiologik me’yordan oshadi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Midiya go‘shti (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Sous-vide + 5% suyuq tutun (SS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 daq&lt;/td&gt;\n&lt;td&gt;3 °C da saqlash muddati 21 kungacha uzaydi; mikroblar ko‘payishi sekinlashdi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Midiya go‘shti (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Sous-vide + yog‘ nanoemulsiyasi (ANS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 daq&lt;/td&gt;\n&lt;td&gt;3 °C da saqlash muddati 18 kun; mikrobiologiya bo‘yicha nazorat bilan teng&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Midiya go‘shti (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Sous-vide + suyuq tutunli nanoemulsiya (DNS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 daq&lt;/td&gt;\n&lt;td&gt;3 °C da saqlash muddati 24 kungacha yetdi; TVB-N minimal va to‘qima mustahkam&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Midiyalarni 85 °C da 10 daqiqa davomida sous-vide (vakuum paketda past haroratda pishirish) usulida qayta ishlash xavfsizlikni ta’minlasa-da, sof holatda (nazorat guruhi) 3 °C haroratda 18-kunga kelib mikrobiologik me’yor buziladi. Yaroqlilik muddatini kimyoviy konservantlarsiz uzaytirish maqsadida to‘siq texnologiyasi (hurdle technology) qo‘llandi: 5% suyuq tutun va kungaboqar nanoemulsiyasi (go‘sht va emulsiya nisbati 2:1) birlashtirildi. Emulsiya suv (80%), moy (4–14%), polisorbat 80 (Tween 80, 3%) va etanoldan (3%) ultratovushli gomogenizator (51% quvvat) yordamida tayyorlandi.&lt;/p&gt;\n&lt;p&gt;Nanoemulsiya va suyuq tutun birikmasi (DNS guruhi) yuqori sinergetik samara berdi: termik ishlov berilganda tomchilar o‘lchami 253 nm dan 190,15 nm gacha kichrayib, dzeta-potensial (-24,45 dan +27,10 mV gacha) barqarorligini saqladi. Bu fenol birikmalarining to‘qimalarga chuqur kirib, oqsillarni denaturatsiyadan himoyalashiga imkon yaratdi. 24-kunga kelib DNS guruhida uchuvchan asosli azot (TVB-N) me’yordagi 35 mg N/100 g ko‘rsatkichidan ancha past bo‘ldi, erkin yog‘ kislotalari to‘planishi sekinlashdi, oddiy sous-vide namunalari esa 18-kunda yaroqsiz holga keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat Qora dengiz midiyalarida va qat’iy 3 °C haroratda o‘tkazilgan; hissiy baholash 6 nafar mutaxassis tomonidan bajarilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Suv mahsulotlari oʻsib borayotgan global aholi uchun oqsilning muhim va barqaror manbai hisoblanadi. Turli suv turlari orasida Oʻrta yer dengizi midiyasi (&lt;a href=\"concepts/mediterranean-mussel.html\"&gt;Mytilus galloprovincialis&lt;/a&gt;) oʻzining yuqori sifatli oqsili, boy koʻp toʻyinmagan yogʻ kislotalari profili hamda zarur makro va mikroelementlari tufayli kelajak uchun juda istiqbolli oziq-ovqat manbai hisoblanadi. Ikki pallali mollyuskalarning oʻrtacha global isteʼmoli aholi jon boshiga 2,6 kg ni tashkil etadi, 2023-yilda mollyuskalarning global ishlab chiqarilishi 25,8 million tonnaga yetdi, bu baliqchilik va akvakultura umumiy mahsulotining 14 foizini tashkil qiladi. Ushbu oʻsib borayotgan talab tufayli Turkiyada soʻnggi paytlarda akvakultura sektorida, xususan, midiya yetishtirishda tez oʻsish kuzatilmoqda. Soʻnggi bir necha yil ichida midiya yetishtirish Turkiyada alabalık (forel), dengiz olabugʻasi va dengiz choʻrtanidan keyin akvakulturaning toʻrtinchi eng tez rivojlanayotgan segmentiga aylandi. Filtrlash orqali oziqlanishi tufayli midiyalar atrof-muhit ifloslanishiga juda sezgir va tez buziladi; sovutgichda saqlash vaqtida bu mahsulotning yaroqlilik muddati asosan mikrobial buzilish va patogen bakteriyalarning koʻpayishi tufayli 1-2 kundan 5-6 kungacha qatʼiy cheklangan. Bundan tashqari, qayta ishlash jarayonida gigiyena standartlariga rioya qilmaslik patogen mikrobial yukni oshirishi va buzilishni tezlashtirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Midiyalar oqsilning qimmatli manbai, ammo filtrlash orqali oziqlanishi va yuqori namligi tufayli ular tez buziladi (saqlash muddati 1–6 kun), bu esa konservatsiya texnologiyalarini qoʻllashni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Isteʼmolchilarning maksimal ozuqaviy qiymatni saqlaydigan yangi, minimal qayta ishlangan dengiz mahsulotlariga boʻlgan talabi ortib borayotganligi sababli, yumshoq termal ishlov berish usullari tobora koʻproq qoʻllanilmoqda. Yumshoq issiqlik bilan ishlov berilgan va sovutilgan mahsulotlar mikrobial xavfsizlik boʻyicha jamoatchilikda xavotir uygʻotishi mumkin boʻlsa-da, Yevropa Ittifoqi patogensiz dengiz mahsulotlarini taʼminlash uchun 10–30 daqiqa davomida 60–95 °C haroratda issiqlik bilan ishlov berishni tavsiya qiladi. Bundan tashqari, midiya goʻshtining yuqori namligi uning saqlash muddatini cheklaydi, bu esa mahalliy boʻlmagan hududlarga tarqatishga toʻsqinlik qiladi, bu esa saqlash muddatini uzaytirish va yangi isteʼmol bozorlariga chiqish uchun qayta ishlash texnologiyalarining zarurligini taʼkidlaydi. Biroq, muzlatish kabi anʼanaviy konservatsiya usullari sensorli xususiyatlarni, ayniqsa tekstura va taʼmni pasaytirib, umumiy sifatga putur yetkazishi mumkin. Bu sanoatdagi muhim boʻshliqni koʻrsatadi va bozorda yuqori sifatli midiya mahsulotlarini taqdim etish uchun xavfsiz, koʻp maqsadli toʻsiqli (hurdle) konservatsiya strategiyalarini ishlab chiqishni talab qiladi.&lt;/p&gt;\n&lt;p&gt;Midiya saqlash muddatini xavfsiz uzaytirish va yangidek sensorli xususiyatlarni saqlab qolish uchun turli usullar, jumladan, pishirish/vakuumli qadoqlash, dudlash, konservalash, qovurish/pishirish va qizil sousda pasterizatsiya qilish qoʻllanilgan. Xom midiya goʻshti tez buzilganligi sababli, termal ishlov berish ajralmas hisoblanadi va sifatni optimallashtirish uchun aniq harorat-vaqt regulyatsiyasini talab qiladi. Shu nuqtai nazardan, sous-vide (SV) termal ishlov berish — vakuumli qadoqlangan oziq-ovqatlarni aniq nazorat qilinadigan parametrlarda pishirish — ozuqa moddalarining yoʻqolishini minimallashtiradi, shu bilan birga buzilish fermentlari va mikroorganizmlarni inaktivatsiya qiladi. Bu 100 °C dan past haroratda pishirish, 0–3 °C gacha tez sovutish va sovutilgan holda saqlashni oʻz ichiga olgan «cook-chill» texnologiyalari bilan mos keladi. Midiyalar uchun 85 °C haroratda 10 daqiqa davomida SV ishlov berish tavsiya etiladi; ammo, proteolitik boʻlmagan Clostridium botulinum shtammlari 3,3 °C haroratda 31 kun ichida toksinlar ishlab chiqarishi mumkinligi sababli, SV bilan ishlov berilgan dengiz mahsulotlarining saqlash muddati odatda 28 kun bilan cheklangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/sous-vide.html\"&gt;Sous-vide usuli&lt;/a&gt; — bu oziq-ovqatni vakuumli qadoqda qatʼiy nazorat qilinadigan haroratda pishirish boʻlib, u tekstura va ozuqaviy moddalarni saqlab qoladi, ammo xavfsizlik uchun harorat rejimiga rioya qilishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Buni yengish va konservatsiyani kuchaytirish uchun patogenlarni inaktivatsiya qiluvchi suyuq tutun fraksiyalarini integratsiya qilish mumkin. Biomassa pirolizi orqali olingan suyuq tutun tarkibida antibakterial va antioksidant faollik orqali mahsulot taʼmi, rangi, pH va saqlash muddatini belgilovchi karbonillar va fenollar mavjud. Anʼanaviy dudlashga qaraganda kamroq politsiklik aromatik uglevodorodlar (PAU) toʻplanishi bilan xavfsizroq, standartlashtiriladigan muqobilni taklif qilib, u purkash, botirish yoki toʻgʻridan-toʻgʻri qoʻshish orqali qoʻllaniladi. Dengiz mahsulotlarida bunday bioaktiv mikroblarga qarshi vositalarni yetkazib berish va samaradorligini yanada optimallashtirish uchun nanoemulsiya tizimlari juda murakkab yondashuv sifatida paydo boʻldi. Ushbu tizimlar mikroblarga qarshi faollikni samarali oshiradi va uchuvchi efir moylarini oziq-ovqat matritsalariga kiritishni osonlashtiradi, ularning mikroorganizmlar faol koʻpayadigan zonalarda taqsimlanishini oshiradi. Yaqinda nanoemulsiyalarni suv mahsulotlariga qoʻllash sezilarli surʼat kasb etdi. Mavjud adabiyotlar shuni koʻrsatadiki, nanoemulsiyalar asosan alabalık, dengiz choʻrtani va dengiz olabugʻasi kabi yetishtiriladigan baliq turlarida qoʻllaniladi va tadqiqotlar doimiy ravishda ushbu mahsulotlarning saqlash muddatini uzaytirishda samaradorligini koʻrsatadi. Biroq, bizning maʼlumotlarimizga koʻra, hech qanday adabiyotda ikki pallali mollyuskalarda, xususan midiyalarda nanoemulsiya, suyuq tutun va SV ishlov berishni birlashtirishning sinergetik taʼsiri oʻrganilmagan. Adabiyotdagi boʻshliqni toʻldirish uchun ushbu tadqiqotda midiyani konservatsiya qilish uchun koʻp maqsadli toʻsiqli texnologiya sifatida suyuq tutun xushboʻylashtiruvchisi va nanoemulsiya ilovalarini SV termal ishlov berish bilan bir qatorda integratsiyalash har tomonlama baholandi. Midiyalar (6–7 sm) ushbu innovatsion usullarning turli kombinatsiyalari bilan ishlov berildi va 3 °C haroratda 27 kungacha tizimli ravishda saqlandi. Konservatsiya samaradorligi va uning asosidagi sinergetik taʼsirlar kompleks, koʻp parametrli tizim orqali tekshirildi; bunga goʻsht pH qiymati, rang oʻzgarishi, sensorli xususiyatlar, umumiy uchuvchi asosiy azot (TVB-N) toʻplanishi, FFA hosil boʻlishi va mikrobiologik yuk kabi makro-sifat koʻrsatkichlarini kuzatish kiradi. Muhimi, ishlov berishning oziq-ovqat matritsasiga taʼsirini chuqurroq tushunish uchun toʻqimalarning strukturaviy yaxlitligi va molekulyar tavsifi skanerlovchi elektron mikroskopiya (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;) va Furye-transform infraqizil (&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;FT-IR&lt;/a&gt;) spektroskopiyasi orqali tekshirildi.&lt;/p&gt;\n&lt;p&gt;Tahliliy toifadagi kimyoviy moddalar ishlatildi: bor kislotasi (CAS 10043-35-3), magniy oksidi (CAS 1309-48-4), PCA (PCA, 105463.0500), kuchaytirilgan klostridial agar (RCM, 105411.0500), binafsha qizil safro agari (VRBA, 101406.0500), pepton, natriy xlorid (Merck, DE); etanol (99,5%, Carlo Erba Regents, FR); Tashiro indikatori, fenolftalein (ChemBio, TR); suyuq kerosin (QLP, TR); xlorid kislota (Honeywell Fluka, AT); kaliy gidroksid (AFG Bioscience, AQSH); dietil efiri (Isolab Chemicals, DE); kartoshka dekstroza agari (PDA, Biolife, IT); yogʻda eriydigan suyuq tutun (Alfasol, TR); Tvin 80 (Sigma-Aldrich, DE).&lt;/p&gt;\n&lt;p&gt;Jami 77 kg yangi, tirik Oʻrta yer dengizi midiyalari (Mytilus galloprovincialis, qobiq uzunligi 6–7 sm) 2025-yil aprel oyida Qora dengizning Sinop qirgʻogʻida joylashgan tijorat akvakultura xoʻjaligidan yigʻib olindi (A sinf sanitariya tasnifi). Yigʻib olish mexanizatsiyalashgan midiya yigʻish kemasi yordamida amalga oshirildi. Yigʻib olingandan soʻng, midiyalar oziq-ovqat darajasidagi polietilen toʻrli qoplarga joylashtirildi va darhol toza dengiz suvi va maydalangan muz (0–2 °C) bilan toʻldirilgan izolyatsiyalangan idishlarga oʻtkazildi. Dengiz platformasidan laboratoriyaga tashish taxminan 40 daqiqa ichida amalga oshirildi. Laboratoriyaga kelgach, midiyalar darhol tekshirildi; qobigʻi yorilgan yoki oʻlik namunalar olib tashlandi, yashovchanlari toza suv (4 ± 1 °C) ostida tozalandi. Qobiqni ochish jarayoni uchun midiyalar 100 °C qaynoq suvga 2 daqiqaga botirildi, soʻngra goʻshti ajratib olindi va bissus iplari olib tashlandi. Tadqiqotda jami 9650 g midiya goʻshti ishlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot uchun faqat tirik, shikastlanmagan midiyalar ishlatildi, ular dastlabki termal ishlovdan oʻtkazilib, aseptik sharoitda qadoqlandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nanoemulsiyalar (NA va ND) Hamouda va boshq. tomonidan qoʻllanilgan usul asosida tayyorlandi. NA tarkibi: 80% distillangan suv, 14% kungaboqar yogʻi, 3% etanol, 3% Tvin 80. ND tarkibi: 80% suv, 4% yogʻ, 3% etanol, 3% Tvin 80 va 10% suyuq tutun. Ingredientlar magnit aralashtirgichda (900 rpm, 30 daqiqa) aralashtirildi, ND uchun suyuq tutun qoʻshildi (yana 15 daqiqa). Aralashmalar 86 °C da 1 soat davomida saqlandi, sovutildi, distillangan suv qoʻshildi va ultratovushli zond (HD 2200, Bandelin Sonopuls, Germaniya) yordamida 15 daqiqa davomida gomogenlashtirildi. Nanoemulsiyalar tayyorlangach, 4 °C da saqlashdan oldin UV chiroq ostida 20 daqiqa davomida sterilizatsiya qilindi.&lt;/p&gt;\n&lt;p&gt;Midiya goʻshti 100 g dan qadoqlandi. ANS va DNS guruhlarida goʻsht va nanoemulsiya nisbati 2:1 qilib tanlandi. Qadoqlash Abant MG42 vakuumli qadoqlash mashinasida (95% vakuum) amalga oshirildi. SV jarayoni 85 °C da 10 daqiqa davomida (PackTech IPX7) amalga oshirildi. SV dan soʻng paketlar muzli suvda 10 daqiqa sovutildi va 27 kun davomida +3 °C da saqlandi. Guruhlar: Control (faqat SV), SS (5% suyuq tutun + SV), ANS (kungaboqar yogʻi nanoemulsiyasi + SV), DNS (kungaboqar yogʻi + 5% suyuq tutun nanoemulsiyasi + SV).&lt;/p&gt;\n&lt;p&gt;Quyidagilar tahlil qilindi: zeta potensiali, zarracha hajmi (DLS), pH (WTW ProfiLine 3110), rang (CIE L&lt;em&gt;a&lt;/em&gt;b*, Konica Minolta CR-400), TVB-N (Ludorf va Meyer usuli), erkin yogʻ kislotalari (AOAC usuli), tekstura (Brookfield CT3), SEM (FEI Quanta FEG 250), FTIR (Bruker Alpha II). Mikrobiologik koʻrsatkichlar: mezofil va psixrofil aerob bakteriyalar (PCA), anaerob bakteriyalar (RCA), mogʻor va achitqilar (PDA), koliform bakteriyalar (VRBA). Sensorli baholash 5 balli shkala boʻyicha 6 nafar oʻqitilgan ekspert tomonidan amalga oshirildi. Statistika: Tukey HSD (p &amp;lt; 0,05), ANOVA, PCA (R 4.5.2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f1.jpg\" alt=\"Guruhlarning rang tahlili natijalari. Control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bilan ishlov b\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Guruhlarning rang tahlili natijalari. Control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtkazilgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti; DNS guruhi: kungaboqar yogʻi + tutun xushboʻylantirgichi (yogʻda eriydigan, 5%) nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f2.jpg\" alt=\"Guruhlarning pH, TVB-N, FFA tahlili natijalari. Control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bila\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Guruhlarning pH, TVB-N, FFA tahlili natijalari. Control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtkazilgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti; DNS guruhi: kungaboqar yogʻi + tutun xushboʻylantirgichi (yogʻda eriydigan, 5%) nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f3.jpg\" alt=\"Guruhlarning tekstura tahlili natijalari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Guruhlarning tekstura tahlili natijalari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Guruhlarning tekstura tahlili natijalari. Grafikdagi har xil kichik harflar bir guruh ichida saqlash davrida kuzatilgan guruhlararo farqlarni koʻrsatadi (p &amp;lt; 0,05). Control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtkazilgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti; DNS guruhi: kungaboqar yogʻi + tutun xushboʻylantirgichi (yogʻda eriydigan, 5%) nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti. (a) Qattiqlik, (b) yopishqoqlik, (c) elastiklik (resilience), (d) qaytuvchanlik (springiness), (e) bogʻliqlik (cohesiveness), (f) chaynalish qobiliyati.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f4.jpg\" alt=\"Guruhlar va xom midiyaning SEM tasvirlari ((a) xom midiya goʻshti\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Guruhlar va xom midiyaning SEM tasvirlari ((a) xom midiya goʻshti&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Guruhlar va xom midiyaning SEM tasvirlari ((a) xom midiya goʻshti, (b) 0-kun, control, (c) 27-kun, control, (d) 0-kun, ANS, (e) 27-kun, ANS, (f) 0-kun, DNS, (g) 27-kun, DNS, (h) 0-kun, SS, (i) 27-kun, SS). Control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtkazilgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti; DNS guruhi: kungaboqar yogʻi + tutun xushboʻylantirgichi (yogʻda eriydigan, 5%) nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f5.jpg\" alt=\"Guruhlarning 0 va 27-kunlardagi aniq FTIR spektrlari (a va b).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Guruhlarning 0 va 27-kunlardagi aniq FTIR spektrlari (a va b).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Guruhlarning 0 va 27-kunlardagi aniq FTIR spektrlari (a va b). Amid I mintaqasining batafsil koʻrinishi (c). Amid I mintaqasidagi ikkinchi hosilalar intensivligi (d). Amid I mintaqasidagi ikkilamchi tuzilish nisbatlarining Gauss dekonvolyutsiyasi (e). (Raw: yangi midiya goʻshti, control: faqat SVga duchor qilingan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtkazilgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti; DNS guruhi: kungaboqar yogʻi + tutun xushboʻylantirgichi (yogʻda eriydigan, 5%) nanoemulsiyasi bilan ishlov berilgan va SVga duchor qilingan midiya goʻshti).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f6.jpg\" alt=\"Guruhlarning mikrobiologik tahlil natijalari (log CFU g−1).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Guruhlarning mikrobiologik tahlil natijalari (log CFU g−1).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Guruhlarning mikrobiologik tahlil natijalari (log CFU g−1). (a) Umumiy mezofil aerob bakteriyalar soni (TMAB), (b) umumiy psixrofil aerob bakteriyalar soni (TPAB), (c) umumiy anaerob bakteriyalar soni (TAN) va (d) umumiy achitqi va mogʻor zamburugʻlari soni (TYM). Control: faqat vakuumli qadoqlash (SV) qoʻllanilgan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti; DNS: kungaboqar yogʻi + tutun xushboʻylantiruvchisi (yogʻda eruvchan, 5%) nanoemulsiyasi bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f7.jpg\" alt=\"Xom midiya goʻshti uchun sensorli tahlil natijalari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Xom midiya goʻshti uchun sensorli tahlil natijalari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f8.jpg\" alt=\"Pishirilgan guruhlarning sensorli tahlil natijalari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Pishirilgan guruhlarning sensorli tahlil natijalari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Pishirilgan guruhlarning sensorli tahlil natijalari. Control: faqat vakuumli qadoqlash (SV) qoʻllanilgan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti; DNS: kungaboqar yogʻi + tutun xushboʻylantiruvchisi (yogʻda eruvchan, 5%) nanoemulsiyasi bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f9.jpg\" alt=\"Sifat parametrlarining (OA, TVB-N, FFAs, TMAB, TAN, TPB va TYM) ishlov berish guruhlariga taʼsirini koʻp omilli tahlil q\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Sifat parametrlarining (OA, TVB-N, FFAs, TMAB, TAN, TPB va TYM) ishlov berish guruhlariga taʼsirini koʻp omilli tahlil qilish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Sifat parametrlarining (OA, TVB-N, FFAs, TMAB, TAN, TPB va TYM) ishlov berish guruhlariga taʼsirini koʻp omilli tahlil qilish. Control: faqat vakuumli qadoqlash (SV) qoʻllanilgan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti; DNS: kungaboqar yogʻi + tutun xushboʻylantiruvchisi (yogʻda eruvchan, 5%) nanoemulsiyasi bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f10.jpg\" alt=\"Saqlash davrida sifatning yomonlashuvi — PCA trayektoriya tahlili.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Saqlash davrida sifatning yomonlashuvi — PCA trayektoriya tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Saqlash davrida sifatning yomonlashuvi — PCA trayektoriya tahlili. Control: faqat vakuumli qadoqlash (SV) qoʻllanilgan midiya goʻshti; SS: suyuq tutun bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti; ANS: kungaboqar yogʻi nanoemulsiyasi bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti; DNS: kungaboqar yogʻi + tutun xushboʻylantiruvchisi (yogʻda eruvchan, 5%) nanoemulsiyasi bilan ishlov berilgan va SV jarayonidan oʻtgan midiya goʻshti.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Midiya tez&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;buziladi&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Sous-vide 85&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;°C, tutun va&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;emulsiya&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;
