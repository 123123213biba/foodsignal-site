        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"207\" cy=\"135\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"653\" cy=\"265\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Pomidor va sitruslarni&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;chirishdan asrovchi&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ko‘rinmas xitozan qoplamasi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f1.jpg\" alt=\"CTS-ZnO&amp;amp;CA gidrogelining morfologik tahlili. CTS-ZnO&amp;amp;CA gidrogelining SEM tasvirlari: (A) koʻndalang kesim, (B) boʻylama\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;&lt;a href=\"concepts/biopolimery.html\"&gt;CTS&lt;/a&gt;-ZnO&amp;amp;CA gidrogelining morfologik tahlili. CTS-ZnO&amp;amp;CA gidrogelining &lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt; tasvirlari: (A) koʻndalang kesim, (B) boʻylama kesim. CTS-ZnO&amp;amp;CA gidrogelining koʻndalang kesim SEM tasvirlari (C) va tegishli (D–G) xaritalash (kislorod — yashil, uglerod — koʻk, rux — qizil, azot — toʻq sariq) va (H) EDS spektri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Dunyo bo‘yicha meva-sabzavotlarning uchdan bir qismi bakteriyalar va oksidlanish tufayli nobud bo‘ladi. Olimlar xitozan, rux oksidi nanozarralari va xlorogen kislotasi asosida yeyiladigan gidrogel ishlab chiqishdi. Ushbu qoplama patogen mikroblarni yo‘q qiladi va namlik yo‘qolishining oldini oladi. Natijada pomidor va sitrus mevalari uzoq vaqt yangidek saqlanib turadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Xitozan, ZnO va xlorogen kislotali gidrogel mikroblarga qarshi va antioksidant to‘siq yaratadi.&lt;/li&gt;\n&lt;li&gt;Faol radikallar va rux ionlari MDR S. aureus hamda &lt;a href=\"concepts/pseudomonas-aeruginosa.html\"&gt;P. aeruginosa&lt;/a&gt; bioplyonkalarini yo‘q qiladi.&lt;/li&gt;\n&lt;li&gt;Qoplama pomidorda suv yo‘qotilishini kamaytiradi va sitrus mevalarda chirish tarqalishini to‘xtatadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Pomidor va sitrus mevalarining tez buzilishiga ko‘pincha oksidlanish jarayonlari hamda Pseudomonas aeruginosa va chidamli Staphylococcus aureus (MDR S. aureus) kabi bakteriyalar sabab bo‘ladi. Bunga qarshi kurashish uchun xitozan, rux oksidi (ZnO) nanozarralari va xlorogen kislotasidan (CA) iborat 1:0,1:0,1 nisbatdagi CTS-ZnO&amp;amp;CA gidrogeli sintez qilindi. Strukturani mustahkamlash uchun 50% li beta-glitserofosfat (&lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;β-GP&lt;/a&gt;) eritmasi qo‘llanilib, bir xil g‘ovakli plyonka olindi.&lt;/p&gt;\n&lt;p&gt;Antibakterial ta’sir mexanizmi ZnO nanozarralarining erkin radikallar (ROS) hosil qilishi va Zn²⁺ ionlarini ajratishi bilan bog‘liq bo‘lib, bu bakteriya qobig‘ini yoradi va bioplyonkalarni parchalaydi. Xlorogen kislotasi esa kuchli antioksidant sifatida meva to‘qimalarini yemirilishdan saqlaydi va rux ionlarini bog‘&lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;lab&lt;/a&gt;, ta’sir muddatini uzaytiradi. Tajribalarda ushbu qoplama pomidordan suv bug‘lanishini sezilarli darajada kamaytirdi va zararlangan sitrus mevalarida chirish dog‘larining tarqalishini to‘xtatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat laboratoriya sharoitida sun’iy zararlash orqali o‘tkazilgan; nanozarralarning oziq-ovqatdagi xavfsizligi uzoq muddatli qo‘shimcha sinovlarni talab etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Global aholi sonining oʻsishi va texnologik taraqqiyot xavfsiz va sifatli oziq-ovqat mahsulotlariga boʻlgan talabni oshirmoqda. Ishlab chiqarish texnologiyalarining takomillashuviga qaramay, oziq-ovqat mahsulotlarining buzilishi dolzarb muammo boʻlib qolmoqda. Dunyo boʻylab har yili 1 trln kg dan ortiq oziq-ovqat isrof boʻladi, buning qariyb uchdan bir qismi saqlash va tashish jarayonida mikrobial ifloslanish yoki oksidlanish reaksiyalari tufayli yuzaga keladi. Ayniqsa, meva va sabzavotlar kabi tez buziladigan mahsulotlar harorat va namlik oʻzgarishlariga juda sezgir.&lt;/p&gt;\n&lt;p&gt;Buzilishning asosiy sabablari — mikrobial ifloslanish (masalan, Staphylococcus aureus va Pseudomonas aeruginosa) va ozuqa moddalarining oksidlanishidir. Anʼanaviy konservantlar taʼmga taʼsir qilishi va sogʻliq uchun xavf tugʻdirishi mumkin. Soʻnggi yillarda «yashil kimyo» va tabiiy polisaxaridlar (xitozan, alginat, karragenan) asosidagi antimikrob va antioksidant xususiyatlarga ega vositalar istiqbolli yoʻnalish hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xitozan asosidagi (CTS-ZnO&amp;amp;CA) gidrogel qoplamasi, tarkibida xlorogen kislota (CA) va rux oksidi (ZnO) nanozarrachalari mavjud boʻlib, bakteriyalar oʻsishini samarali bostiradi va oksidlanishni sekinlashtirib, mevalarning saqlash muddatini uzaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya modeli hisoblanadi: qoplamaning samaradorligi nazorat qilinadigan sharoitda pomidor va sitrus mevalarida tekshirilgan, bu sanoat miqyosida qoʻllash uchun qoʻshimcha sinovlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ZnO nanozarrachalarini sintez qilish 260 °C da termik parchalanish usuli bilan amalga oshirildi. CTS-ZnO&amp;amp;CA gidrogeli xitozan (CTS), β-glitserofosfat (β-GP), ZnO nanozarrachalari va xlorogen kislotani (CA) 1:0,1:0,1 massa nisbatida aralashtirish orqali olindi. Antibakterial faollik MDR S. aureus va P. aeruginosa ga qarshi baholandi. Sitotoksiklik mezenximal oʻzak hujayralari (MSC) va oʻpka saratoni hujayralari (NCI-H1299) ustida CCK-8 toʻplami yordamida tekshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bulʼonda mikrosuyuqlantirish usuli (broth microdilution) minimal ingibitsiyalovchi konsentratsiyani (MIK) — bakteriyalar oʻsishini toʻxtatuvchi moddaning eng kam miqdorini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fizik-kimyoviy tahlillar (SEM, XPS, &lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;FT-IR&lt;/a&gt;) gidrogelning 10–30 mkm gʻovakli tuzilishga ega ekanligini va ZnO nanozarrachalari bir tekis taqsimlanganligini tasdiqladi. Gemosuvchanlik sinovlari 500 mkg/ml konsentratsiyada ham gidrogel eritrotsitlar gemolizini keltirib chiqarmasligini koʻrsatdi. Sitotoksiklik testlari MSC va NCI-H1299 hujayralarining yashovchanligi 95% dan yuqori ekanligini tasdiqladi.&lt;/p&gt;\n&lt;p&gt;Antibakterial faollik: har ikki shtamm uchun MIK 250 mkg/ml, MBK (minimal bakteritsid konsentratsiya) esa 500 mkg/ml ni tashkil etdi. Taʼsir mexanizmi biofilmlarni parchalash, membranani shikastlash (nuklein kislotalar sizib chiqishi bilan tasdiqlangan) va reaktiv kislorod turlari (ROS) hosil boʻlishi orqali oksidlovchi stressni keltirib chiqarishni oʻz ichiga oladi.&lt;/p&gt;\n&lt;p&gt;Pomidorlarda qoʻllanilishi CTS-ZnO&amp;amp;CA qoplamasi vazn yoʻqotishni sezilarli darajada kamaytirishi va nazorat guruhiga nisbatan buzilishni sekinlashtirishini koʻrsatdi. Antioksidant faollik DPPH va ABTS testlari bilan tasdiqlandi. P. aeruginosa bilan zararlangan sitrus mevalari modelida qoplama zararlangan hududlarning kengayishini samarali chekladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f1.jpg\" alt=\"CTS-ZnO&amp;amp;CA gidrogelining morfologik tahlili. CTS-ZnO&amp;amp;CA gidrogelining SEM tasvirlari: (A) koʻndalang kesim, (B) boʻylama\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA gidrogelining morfologik tahlili. CTS-ZnO&amp;amp;CA gidrogelining SEM tasvirlari: (A) koʻndalang kesim, (B) boʻylama kesim. CTS-ZnO&amp;amp;CA gidrogelining koʻndalang kesim SEM tasvirlari (C) va tegishli (D–G) xaritalash (kislorod — yashil, uglerod — koʻk, rux — qizil, azot — toʻq sariq) va (H) EDS spektri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f2.jpg\" alt=\"CTS-ZnO&amp;amp;CA gidrogelining XPS spektrlari. (A) Umumiy koʻrinish, (B) O 1s, (C) C 1s, (D) Zn 2p, (E) N 1s va (F) P 2p spekt\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA gidrogelining XPS spektrlari. (A) Umumiy koʻrinish, (B) O 1s, (C) C 1s, (D) Zn 2p, (E) N 1s va (F) P 2p spektrlari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f3.jpg\" alt=\"CTS-ZnO&amp;amp;CA gidrogelining gemolitik tahlil tasvirlari va tahlili. (A va E) CTS uchun gemolitik tahlil tasvirlari va nisbi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA gidrogelining gemolitik tahlil tasvirlari va tahlili. (A va E) CTS uchun gemolitik tahlil tasvirlari va nisbiy gemoliz darajalari, (B va F) CA uchun, (C va G) ZnO uchun, (D va H) CTS-ZnO&amp;amp;CA gidrogeli uchun.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f4.jpg\" alt=\"CTS-ZnO&amp;amp;CA gidrogelining sitotoksikligini baholash. CTS-ZnO&amp;amp;CA ning MSC hujayralariga (A va B) va NCI-H1299 hujayralarig\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA gidrogelining sitotoksikligini baholash. CTS-ZnO&amp;amp;CA ning MSC hujayralariga (A va B) va NCI-H1299 hujayralariga (C va D) 12 va 24 soatlik taʼsirdan keyingi sitotoksik taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f5.jpg\" alt=\"CTS-ZnO&amp;amp;CA gidrogelining antibakterial faolligini baholash. CTS-ZnO&amp;amp;CA ning (A) MDR S. aureus va (B) P. aeruginosa ga qa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA gidrogelining antibakterial faolligini baholash. CTS-ZnO&amp;amp;CA ning (A) MDR S. aureus va (B) P. aeruginosa ga qarshi antibakterial taʼsiri hamda (C va D) ularning tegishli antibakterial darajalari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f6.jpg\" alt=\"CTS-ZnO&amp;amp;CA gidrogelining antibakterial mexanizmini baholash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA gidrogelining antibakterial mexanizmini baholash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;CTS-ZnO&amp;amp;CA gidrogelining antibakterial mexanizmini baholash. (A) MDR S. aureus va P. aeruginosa biofilmlarining turli konsentratsiyadagi CTS-ZnO&amp;amp;CA bilan ishlov berilgandan keyingi mikroskopik tasvirlari. (B) Kristalli binafsha rang bilan boʻyalgan biofilmlarning CLSM uch oʻlchamli proyeksiyalari. (C) CTS-ZnO&amp;amp;CA ning MDR S. aureus va P. aeruginosa ga qarshi biofilm yoʻq qilish darajasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f7.jpg\" alt=\"CTS-ZnO&amp;amp;CA ning turli konsentratsiyalari bilan ishlov berilgandan soʻng (A) MDR S. aureus va (B) P. aeruginosa dagi nukl\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA ning turli konsentratsiyalari bilan ishlov berilgandan soʻng (A) MDR S. aureus va (B) P. aeruginosa dagi nuklein kislotalar sizib chiqish darajasi. CTS-ZnO&amp;amp;CA bilan ishlov berilgandan keyin (C) MDR S. aureus va (D) P. aeruginosa dagi hujayra ichidagi ROS darajasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f8.jpg\" alt=\"Saqlash davrida pomidorlardagi turli qoplamalarning saqlash samaradorligi va antioksidant faolligi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Saqlash davrida pomidorlardagi turli qoplamalarning saqlash samaradorligi va antioksidant faolligi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Saqlash davrida pomidorlardagi turli qoplamalarning saqlash samaradorligi va antioksidant faolligi. (A) CTS-ZnO&amp;amp;CA antibakterial gidrogel qoplamasi yordamida pomidorlarni saqlash jarayonining sxematik tasviri. (B) Xona haroratida 14 kungacha saqlash davrida nazorat, CTS, ZnO&amp;amp;CA va CTS-ZnO&amp;amp;CA qoplamalari bilan ishlov berilgan pomidorlarning tashqi koʻrinishidagi oʻzgarishlarni koʻrsatuvchi vakillik fotosuratlari. (C) Saqlash davrida pomidorlarning vazn yoʻqotish tezligidagi oʻzgarishlar. CTS-ZnO&amp;amp;CA ning ikkita turli erkin radikallarga qarshi mexanizmi, yutilish profillari va tozalash qobiliyati: (D) DPPH, (E) ABTS (n = 3).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f9.jpg\" alt=\"P. aeruginosa bilan zararlangan sitrus mevalarida turli xil ishlov berish usullarining in vivo korroziyaga qarshi va ant\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;P. aeruginosa bilan zararlangan sitrus mevalarida turli xil ishlov berish usullarining in vivo korroziyaga qarshi va antibakterial samaradorligi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;P. aeruginosa bilan zararlangan sitrus mevalarida turli xil ishlov berish usullarining in vivo korroziyaga qarshi va antibakterial samaradorligi. (A) In vivo sitrus mevalarini zararlantirish va ishlov berish jarayonining sxematik tasviri. (B) 37 °C haroratda 15 kun saqlash davrida nazorat, CTS, ZnO&amp;amp;CA va CTS-ZnO&amp;amp;CA qoplamalari bilan ishlov berilgan sitrus mevalaridagi chirish belgilarining rivojlanishini koʻrsatuvchi vakillik fotosuratlari. Tasvirlar inokulyatsiyadan keyingi 1, 3, 5, 7, 9, 11, 13 va 15-kunlari olingan. (C) Zararlangan toʻqimalar gomogenatlari surtmalari tushirilgan idishlarning fotosuratlari. (D) Turli ishlov berish guruhlari uchun vaqt oʻtishi bilan zararlanish maydonini miqdoriy baholash. (E) LB muhitida 2 soat inkubatsiyadan soʻng zararlangan toʻqimalar gomogenatlarining optik zichligini oʻlchash orqali aniqlangan antibakterial daraja.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Mevalarning&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;mikrob sababli&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tez chirishi&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Xitozan ZnO va&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CA asosli&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" f
