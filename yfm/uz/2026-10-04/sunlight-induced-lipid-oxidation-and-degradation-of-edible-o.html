        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"263\" cy=\"171\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"517\" cy=\"179\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Yorug'likdagi go'shtli yog'&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kutilganidan tezroq buziladi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f1.jpg\" alt=\"(a) Koʻrinadigan yorugʻlik nurlanishi ostida fotooksidlanish jarayonida «oʻsimlik moyi — eritrotsitlar» tizimining UB-ko\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Koʻrinadigan yorugʻlik nurlanishi ostida fotooksidlanish jarayonida «oʻsimlik moyi — eritrotsitlar» tizimining UB-koʻrinadigan sohadagi spektral oʻzgarishlari va saqlanib qolgan eritrotsitlarning ulushi. (b) Fotooksidlanish jarayonida peroksid sonining (PS) vaqt boʻyicha oʻzgarishi. Turli bosh harflar Dunkan koʻp oraliqli testi boʻyicha statistik jihatdan ahamiyatli farqlarni bildiradi (p &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Gemoglobinning ozgina zarrasi ham o'simlik moyini quyosh nuri ta'sirida tez buzilishiga olib keladi. Qon oqsili va ko'rinadigan yorug'lik kanola moyi emulsiyasida oksidlanishni atigi 2,5 soat ichida keskin kuchaytirdi. Yog' kislotalarining yemirilishi ham singlet kislorod, ham erkin radikallar orqali parallel kechishi isbotlandi. Bu holat go'shtli marinadlarni saqlashda muhim bo'lib, oqova suvlarni tozalashda ham asqotadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Yorug'lik va gemoglobin 2,5 soatda peroksid sonini 9,7 mekv/kg ga yetkazdi&lt;/li&gt;\n&lt;li&gt;To'yinmagan bog'larning 30% dan ko'pi parchalanib, MDA aldegidi hosil bo'ldi&lt;/li&gt;\n&lt;li&gt;Jarayon BHT antioksidanti va singlet kislorod tutqichlari bilan sekinlashadi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotda kanola moyi (2% v/v) va qo'y qoni eritrotsitlari suspenziyasi (oqsillar konsentratsiyasi 1,0 mg/ml) aralashmasi 25 °C haroratda quyosh simulyatori (380–780 nm, 59 660 lyuks) ostida 2,5 soat davomida havo haydalgan holda nurlantirildi. Ushbu vaqt ichida peroksid soni (PS) dastlabki iz holatidan 9,7 mekv O2/kg gacha ko'tarildi; qorong'ida yoki gemoglobinsiz tizimda esa deyarli o'zgarish bo'lmadi. Haqiqiy quyosh nuri (61 200 lyuks) ostida bu ko'rsatkich 10,5 mekv O2/kg ga yetdi.&lt;/p&gt;\n&lt;p&gt;6 soatlik nurlanishdan so'ng 1H YaMR tahlili vinil protonlarining 31,2% ga va bis-allil protonlarining 36,9% ga kamayganini ko'rsatdi, bu to'yinmagan yog' kislotalarining parchalanishidan dalolat beradi. Shu bilan birga, 9,5 ppm sohasida malondialdegid (MDA) hosil bo'lganini bildiruvchi signal qayd etildi. Butilgidroksitoluol (BHT) antioksidanti qo'shilganda peroksid miqdori 3,8 mekv/kg gacha, natriy azidi (NaN3) qo'shilganda esa 3,1 mekv/kg gacha kamaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajriba suv-atsetonitril (9:1) modeli asosida o'tkazilgan bo'lib, suvsiz toza yog' yoki murakkab oziq-ovqat mahsulotlaridagi jarayonlarni to'liq qamrab olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"rasmlar\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#rasmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rasmlar&lt;/span&gt;&lt;/a&gt;Rasmlar&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f2.jpg\" alt=\"(a) Oʻsimlik moyining eritrotsitlar ishtirokida fotooksidlanishdan oldingi va (b) keyingi 1H YMR spektrlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Oʻsimlik moyining eritrotsitlar ishtirokida fotooksidlanishdan oldingi va (b) keyingi 1H YMR spektrlari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f3.jpg\" alt=\"(a) Eritrotsitlar ishtirokida nurlantirishdan oldin va keyingi antratsenning UB-koʻrinadigan sohadagi yutilish spektrlar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Eritrotsitlar ishtirokida nurlantirishdan oldin va keyingi antratsenning UB-koʻrinadigan sohadagi yutilish spektrlari. (b) Antratsenning singlet kislorod (1O2) ishtirokidagi fotooksigenatsiyasi sxematik tasviri. Turli bosh harflar Dunkan koʻp oraliqli testi boʻyicha statistik jihatdan ahamiyatli farqlarni bildiradi (p &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f4.jpg\" alt=\"Oʻsimlik moyining gemoglobin vositachiligidagi fotooksidlanishining taklif etilayotgan mexanizmlari: singlet kislorod ho\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Oʻsimlik moyining gemoglobin vositachiligidagi fotooksidlanishining taklif etilayotgan mexanizmlari: singlet kislorod hosil boʻlishi va ferril/radikalli oksidlanish yoʻli.&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Qonli yog'ning&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yorug'da&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;aynishi&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Emulsiyani&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yorug'likda&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;nurlantirish&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Peroksidlar&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;9,7 mekv/kg ga&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yetdi&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Marinadlarni&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qorong'ida&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;saqlash&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maqola taqriz qilinadigan Food science &amp;amp; nutrition jurnalida nashr etilgan. Ammo bu ham bitta tadqiqot, yakuniy xulosa emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&g
