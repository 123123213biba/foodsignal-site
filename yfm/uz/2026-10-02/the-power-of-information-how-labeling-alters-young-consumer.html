            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"140\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"500\" cy=\"240\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;O‘simlik yogurti: tanlovda&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ta’m muhimmi yoki yorliq?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqot shuni ko‘rsatdiki, o‘simlik asosidagi yogurtlarni tanlashda iste’molchilar birinchi navbatda sensor hislarga tayanadi. Tarkib va foyda haqidagi ma’lumotlar kutishlarni shakllantirsa-da, u ta’m va teksturaning past sifatini qoplay olmaydi. Kokosli yogurt sutli analogga eng yaqin mahsulot deb topildi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ta’m, qaymoqlilik va quyuqlik — iste’molchi tanlovini belgilovchi asosiy omillar.&lt;/li&gt;\n&lt;li&gt;Kokosli yogurt o‘simlik analoglari orasida eng yaxshi sensor ko‘rsatkichlarga ega.&lt;/li&gt;\n&lt;li&gt;Yorliqdagi ma’lumotlar ta’m kutishni oqlamasa, mahsulot xarid qilinmaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tajribada 77 nafar yosh iste’molchi kokos, suli, soya va keshyu asosidagi yogurtlarni baholadi. Fizik-kimyoviy ko‘rsatkichlar, jumladan pH va sinerezis (zardob ajralishi) 4 °C haroratda o‘lchandi. Sensor profil CATA (Check-All-That-Apply) usuli yordamida aniqlandi, unda ishtirokchilar 18 ta tavsifdan moslarini tanlashdi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko‘rsatdiki, ta’m, qaymoqlilik va quyuqlik iste’molchi tanlovining asosiy omillaridir. Aksincha, «bo‘sh» ta’m, kulrang tus va suyuq konsistensiya baholarni pasaytirdi. Kokosli variant sutli yogurtga maksimal darajada yaqinlashib, eng yaxshi natijalarni ko‘rsatdi. Yorliqdagi ma’lumotlar kutishlarni shakllantirsa-da, yakuniy xarid qarori haqiqiy ta’m bu va’dalarni oqlashiga bog‘liq bo‘ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 77 kishilik cheklangan guruhda o‘tkazildi, bu barcha aholi qatlamining fikrini aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;O'simlikka asoslangan sut mahsulotlari muqobillari global bozori 2025-yilda taxminan 36,8 milliard AQSh dollarini tashkil etdi va 2033-yilga kelib deyarli 96 milliard AQSh dollariga yetishi kutilmoqda. O'simlik ichimliklari ushbu toifada ustunlik qiladi, ammo eng tez rivojlanayotgan kichik toifani yogurt muqobillari tashkil etadi. Germaniya va Fransiya kabi yetuk Yevropa bozorlaridan olingan chakana savdo ma'lumotlari o'simlikka asoslangan yogurt muqobillari uchun nisbatan cheklangan o'sishni ko'rsatadi, Ispaniya, Niderlandiya va Buyuk Britaniyada esa kuchliroq o'sish kuzatilgan, bu Yevropa mamlakatlari bo'ylab bozor rivojlanish bosqichidagi farqlarni aks ettiradi. Go'sht iste'molini kamaytiradigan yevropalik iste'molchilar o'simlikka asoslangan yogurt muqobillarini ham tez-tez iste'mol qilishga moyildirlar. 2023-yilda Yevropada o'simlikka asoslangan yogurt muqobillari fleksitarianchilar orasida o'simlik ichimliklaridan keyin ikkinchi eng ko'p iste'mol qilinadigan o'simlik mahsuloti bo'ldi. Yogurt muqobillariga o'tish sut chorvachiligi bilan bog'liq salbiy ekologik ta'sirlarni kamaytirish potentsiali bilan bog'liq bo'lishi mumkin, bu resurs talab qiladigan, ayniqsa yerga bo'lgan katta talablar, shuningdek, issiqxona gazlari emissiyasiga hissa qo'shadigan suv va ozuqa resurslari tufayli tan olingan. Bu o'sib borayotgan qiziqish sog'liqni saqlash masalalari bilan ham bog'liq, chunki o'simlik yogurtlari veganlar va laktozani ko'tara olmaydigan iste'molchilar uchun muqobil oqsil manbai hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O'simlikka asoslangan yogurt muqobillari — bozorning eng tez o'sayotgan segmenti bo'lib, ular tekstura va ta'mdagi texnologik qiyinchiliklarga qaramay, ekologik tozaligi va sog'liq uchun foydasi bilan iste'molchilarni jalb qilmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fermerlangan o'simlikka asoslangan sut analoglarini ishlab chiqish uchun dukkaklilar, urug'lar (asosan moyli urug'lar), yong'oqlar, donli ekinlar (boshoqlilar va soxta boshoqlilar) va hatto meva pulpalari kabi turli xil o'simliklardan foydalanish mumkin. Ushbu ingredientlar nafaqat o'simlikka asoslangan yogurt muqobilining ozuqaviy qiymatiga, balki tekstura va ta'miga ham ta'sir qiladi. Sut yogurtiga nisbatan o'simlik muqobillari noyob fitokimyoviy komponentlar va xun tolalarini o'z ichiga oladi, ammo ularning aksariyati no'xat va soyadan tashqari past oqsil tarkibiga ega. Bundan tashqari, o'simlikka asoslangan yogurt muqobillarida ilgari aniqlangan loviya, yong'oq va bo'yoqsimon kabi yoqimsiz ta'mlar, xuddi suvli, yupqa va ajralgan tekstura kabi iste'molchilarning qabul qilish darajasini pasaytirishi mumkin. Tekstura xususiyatlari, ayniqsa gel tuzilmalari va namlikni ushlab turish qobiliyati o'simlikka asoslangan yogurt muqobillarida zaifroq; shuning uchun stabilizatorlarni qo'shish sut mahsulotlariga qaraganda kengroq tarqalgan. Ta'm o'simlik mahsulotlarining maqbulligi va sotilishini cheklovchi muhim omil sifatida tan olingan. Hozirgi vaqtda oddiy o'simlik yogurtining sensor sifati ancha past va uni yaxshilash juda muhim bo'lib qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Bo'yoqsimon» (painty) ta'm — bu yog'larning oksidlanishi natijasida kelib chiqadigan, moyli bo'yoq hidini eslatuvchi o'ziga xos ta'm nuqsonidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sut kislotasi bakteriyalari bilan fermentatsiya begona ta'mlarni yo'qotish va yakuniy mahsulotga boy qatlamli ta'm profilini beradigan uchuvchi birikmalarni ishlab chiqarish uchun ekologik toza, xavfsiz va yumshoq yechim bo'lib ko'rinadi. Fermerlangan o'simlik mahsulotlarida bu funksional, ozuqaviy va tekstura xususiyatlarini ham yaxshilaydi. Agar oziq-ovqatning sensor sifati iste'molchilar kutganiga mos kelmasa, bu umumiy qabul qilish darajasining pasayishiga olib kelishi mumkin. Oziq-ovqatning sensor xususiyatlari iste'molchilar tanlovi va umumiy yoqtirishning asosiy omillari sifatida tan olingan. Kutishlar oziq-ovqatni qabul qilishda juda muhim rol o'ynaydi; ular asosan shunga o'xshash mahsulot bilan oldingi tajribaga, ayniqsa vizual ko'rinishga va mahsulot qadoqlash hamda yorlig'idagi ma'lumotlarga asoslanadi. Qadoqlash, brending, markalash va hukmlarning ta'siri murakkab psixologik mexanizmlarga, asosan mahsulot haqidagi haqiqiy hukmlarga ta'sir qiluvchi kognitiv kutishlarga tegishli. Iste'molchilarning oziq-ovqat mahsulotlarini faqat o'z xohish-istaklari va sensor atributlariga ko'ra baholashi mahsulot haqidagi ma'lumotlar oshkor etilganda sezilarli darajada o'zgarishi mumkin. Ma'lumotlarning tatib ko'rgandan keyin yoqtirishga bo'lgan bu kuchli ta'siri adabiyotda «rad etish» (disconfirmation) fenomeni sifatida tanilgan. Sensor atributni idrok etish ham ijobiy, ham salbiy ta'sir ko'rsatishi mumkin. Oziq-ovqat mahsulotining qabul qilinishini yaxshilash uchun tashqi o'zgaruvchilardan foydalanish iste'molchilar tanlovi, qabul qilishi va iste'moliga ta'sir qiluvchi strategiyalardan biri bo'lib, «hissiyotlar o'tkazilishi» jarayoni orqali amalga oshiriladi, bunda tashqi atributlar mahsulotning sensor idrokiga o'tkaziladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot yosh iste'molchilarga qaratilgan bo'lib, ularning afzalliklari boshqa yosh guruhlaridan farq qilishi mumkin, bu esa natijalarni butun aholiga ekstrapolyatsiya qilishni cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot uchun Yevropa Ittifoqi ishlab chiqaruvchilaridan tijorat sut va o'simlikka asoslangan yogurt muqobillari tanlab olindi. Sut yogurti va turli o'simlik asosidagi (keshyu, kokos, suli va soya) yogurt muqobillari ularning mintaqaviy mavjudligiga qarab sotib olindi. Barcha fermerlangan mahsulotlar turli ta'mlar va qo'shimchalar tufayli sensor xususiyatlaridagi potentsial o'zgaruvchanlikni bartaraf etish uchun qo'shimchalarsiz edi. Tijorat nomlari va brendlari ko'rsatilmagan. Namunalar sinovdan o'tgunga qadar 4 °C haroratda saqlangan. Namunalar tarkibi va ozuqaviy qiymatini o'z ichiga olgan batafsil tavsifni 1-jadvalda topish mumkin. Namunalar Yevropa qonunchiligiga (Yevropa Ittifoqi reglamenti 1169/2011) muvofiq markalangan; barcha ma'lumotlar barcha bozor ishtirokchilari uchun ochiq va kompaniyaning nou-xausini oshkor etmaydi. Barcha o'lchovlar uch marta takrorlandi.&lt;/p&gt;\n&lt;p&gt;Fermerlangan mahsulotlarning faol kislotaliligi o'lchashdan oldin kalibrlangan pH-metr CP-411 (ELMETRON, Zabrze, Polsha) yordamida o'lchandi. O'lchovlar xona haroratida amalga oshirildi va natijalar pH birliklarida ifodalandi. Titrlanadigan kislotalilik namunada mavjud bo'lgan kislotalarning 0,1 mol/l NaOH eritmasi bilan neytrallanishi asosida Polsha standarti ko'rsatmalariga muvofiq aniqlandi. Natija asosida sut kislotasi foizi (LA%) hisoblab chiqildi.&lt;/p&gt;\n&lt;p&gt;Fermerlangan mahsulotlarning optik xususiyatlari Konica Minolta CM-600d (KONICA MINOLTA Inc., Osaka, Yaponiya) ixcham spektrofotometri yordamida D65 ksenon chirog'i yorug'lik manbai va 10° kuzatuv burchagi bilan miqdoriy baholandi. Kolorimetriya natijalari CIELab (L*, a* va b*) rang indekslari sifatida aniqlanishi mumkin. L* indeksi namunaning 0–100 shkalasi bo'yicha yorqinlik qiymati bo'lib, 0 qora, 100 esa oq rangni bildiradi. a* indeksi yashil-qizil o'qidagi, b* esa ko'k-sariq o'qidagi rang fazosidagi holatni ifodalaydi. Manfiy a* yashil, musbat a* qizil; manfiy b* ko'k, musbat b* sariq rangni bildiradi. O'lchovlarni boshlashdan oldin asbob oq standart bo'yicha kalibrlandi. Namunalar orasidagi rang farqi (ΔE&lt;em&gt;ab) CIE76 formulasi (1-tenglama) bo'yicha hisoblab chiqildi. (1) ΔE&lt;/em&gt;ab = √((ΔL*)² + (Δa*)² + (Δb*)²) va Hunter oqlik indeksi (1960) quyidagicha hisoblandi (2-tenglama): (2) WI = L* − 3b*.&lt;/p&gt;\n&lt;p&gt;Fermerlangan mahsulotlarning sineresis tahlili Jbikovskaya va boshqalar usuli bo'yicha sentrifugalash orqali amalga oshirildi. Qisqacha aytganda, 5,0 g namuna 7 °C haroratda 20 daqiqa davomida 2500 aylanish/daqiqada sentrifugalandi. Supernatant tortildi va sineresis indeksi 3-tenglama bo'yicha hisoblab chiqildi: (3) Sineresis (%) = (supernatant og'irligi (g) / umumiy og'irligi (g)) × 100%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sineresis — bu zardobning quyuqlashgan massadan ajralib chiqish jarayoni bo'lib, u vizual ravishda yogurt yuzasida suyuqlik paydo bo'lishi sifatida qabul qilinadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Iste'molchilar bilan sensor tajriba 2024-yilda Poznan Iqtisodiyot va Biznes Universitetida (PUEB) ISO 8589:2007 talablariga va boshqa tegishli institutsional ko'rsatmalar va qoidalarga muvofiq sensor sinov laboratoriyasida o'tkazildi. Tadqiqotda jami 77 nafar tayyorlanmagan iste'molchi, asosan yosh avlod vakillari (93,5%), 63,5% ayollar va 36,5% erkaklar ishtirok etdi (2-jadval). Ishtirokchilar shaxsiy aloqalar va ijtimoiy tarmoqlar yordamida jalb qilindi. Ulardan tadqiqotga qabul qilish uchun oziq-ovqat allergiyasi va laktoza intoleransi haqida so'raldi. Tajriba anonimlikni ta'minladi. Tadqiqotda ishtirok etishdan oldin barcha ishtirokchilar xabardor qilingan rozilikni (shartlarni tasdiqlab) taqdim etdilar va ishtirok etish ixtiyoriy va anonim ekanligi hamda ular sababini tushuntirmasdan istalgan vaqtda tadqiqotdan chiqib ketishlari mumkinligi haqida xabardor qilindilar. Nozik shaxsiy ma'lumotlar yig'ilmadi, ma'lumotlar identifikatsiyadan chiqarildi va faqat umumlashtirilgan shaklda tahlil qilindi. Har bir sessiya yakunlangandan so'ng, ishtirokchilarga sinov xonasidan chiqqandan keyin tadqiqot tafsilotlarini muhokama qilmaslik ko'rsatmasi berildi. Barcha ishtirokchilarga tadqiqotdagi ishtiroki uchun kichik sovg'a berildi.&lt;/p&gt;\n&lt;p&gt;Tajribaning birinchi qismida barcha ishtirokchilardan ularning ijtimoiy-demografik xususiyatlari va ularda biron bir oziq-ovqat allergiyasi yoki laktoza intoleransi bor-yo'qligi haqidagi savollarga javob berish so'raldi. Ular mahsulot haqida xabardor qilindi, sinov tartibi bo'yicha ko'rsatmalar berildi va qog'oz shakllarini to'ldirish so'raldi. Barcha ishtirokchilar 3 ta alohida sinov sessiyasida (ko'r-ko'rona, kutilgan va xabardor qilingan) ishtirok etdilar. Tajribaning birinchi bosqichida brend nomlari va mahsulotlar haqidagi aniq ma'lumotlar iste'molchilarga noma'lum edi, bu potentsial tarafkashlikni minimallashtirish va barcha mahsulotlarning ichki sifatini yanada haqiqiy baholashga imkon berdi. Tajribaning ikkinchi qismida ishtirokchilar mahsulotlarning ozuqaviy ma'lumotlari va ingredientlarini ko'rdilar (1-jadval), uchinchi bosqichda esa ular sinovdan o'tgan mahsulotlar haqida to'liq ma'lumotga ega bo'ldilar. Ishtirokchilar namunalarni faqat birinchi va uchinchi sessiyalarda tatib ko'rdilar. Ishtirokchilar avval sifat atributlarining yoqtirish darajasini 9 balli hedonik shkalada baholadilar, bu yerda 1 «juda yoqmaydi», 9 esa «juda yoqadi» degan ma'noni anglatadi, so'ngra Check-All-That-Apply (CATA) so'rovnomasi yordamida fermerlangan mahsulotlarning sensor xususiyatlarini aniqladilar. Tanishuv sessiyasida ishtirokchilar CATA vazifasi va sinov jarayoni bo'yicha to'liq ko'rsatmalar oldilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CATA (Check-All-That-Apply) usuli iste'molchiga mahsulotga mos keladi deb hisoblagan barcha xususiyatlarni ro'yxatdan tanlash imkonini beradi, bu esa oddiy «yoqadi/yoqmaydi» bahosidan ko'ra aniqroq sensor profilni beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;So'rovnoma 18 ta termindan iborat bo'lib, ularning har biri turli sensor atributlarga tegishli edi. Ushbu atributlar keng qamrovli adabiyotlar sharhi natijasida olingan va PUEB mutaxassislari tomonidan yanada aniqlashtirilgan. CATAga kiritilgan atributlar so'rovnomamizning haqiqiyligini ta'minlash va taqdimot tartibidan kelib chiqishi mumkin bo'lgan har qanday potentsial tarafkashlikni yumshatish uchun tasodifiy tartibga solingan. Sotib olish niyatini baholash uchun 5 balli Likert shkalasi ishlatilgan, bu yerda 1 «qat'iyan yo'q», 5 esa «qat'iyan ha» degan ma'noni anglatadi. Namunalar 15 °C haroratda, jami 20 g (taxminan 2 osh qoshiq) hajmda taqdim etildi, bu iste'molchilar sessiya davomida namunani bir necha marta qayta tatib ko'rishlarini ta'minladi. Tadqiqotda hidsiz va shaffof plastik stakanlar ishlatilgan. Namunalar monadik ketma-ketlikda, tasodifiy uch xonali raqamlar bilan kodlangan holda, namunalarning tartiblanishi ta'sirini oldini olish uchun muvozanatli tasodifiy tartibda taqdim etildi. Namunalar taqdim etilishidan oldin yuzaga kelishi mumkin bo'lgan har qanday suyuqlik ajralishini bartaraf etish uchun ehtiyotkorlik bilan aralashtirildi. Barcha sensor baholash sessiyalari davomida iste'molchilarga tanglayni tozalash uchun gazsiz yoki gazlangan suv, shuningdek, bir namunadan ikkinchisiga o'tish ta'sirini minimallashtirish uchun quruq, tuzsiz non tayoqchalari taklif qilindi.&lt;/p&gt;\n&lt;p&gt;Statistik tahlillar XLSTAT 2023.1.6 (Addinsoft, Parij, Fransiya) va Statistica 13.3 (TIBCO Software Inc., Tulsa, OK, AQSh) yordamida amalga oshirildi. Ahamiyatlilik darajasi α = 0,05 deb belgilandi. Fizik-kimyoviy ma'lumotlar bir omilli dispersiya tahlili (ANOVA) yordamida tahlil qilindi. Tukeyning HSD testi mahsulot o'rtacha ko'rsatkichlari o'rtasidagi post-hoc taqqoslashlar uchun ishlatilgan. Hedonik yoqtirish ma'lumotlari takroriy o'lchovlar ANOVA (RM-ANOVA) yordamida tahlil qilindi. Tegishli hollarda, juftlik taqqoslashlari Holm protsedurasi yordamida tuzatildi va umumlashtirilgan eta-kvadrat (ηG²) effekt hajmi o'lchovi sifatida xabar qilindi. Ko'r-ko'rona sharoitlarda umumiy yoqtirish va individual sensor sifat atributlari o'rtasidagi munosabatlar Pirson korrelyatsiya koeffitsientlari yordamida tekshirildi. CATA ma'lumotlari Cochran Q testi va undan keyingi McNemar juftlik taqqoslashlari yordamida tahlil qilindi. Mahsulotlar va deskriptorlar o'rtasidagi umumiy bog'liqlik x-kvadrat testi yordamida baholandi va x-kvadrat masofalari asosidagi moslik tahlili ularning munosabatlarini vizualizatsiya qilish uchun ishlatildi. Pirson korrelyatsiyalari va jarima/ko'tarilish tahlili (penalty/lift analysis) umumiy yoqtirishning oshishi yoki kamayishi bilan bog'liq sensor deskriptorlarni aniqlash uchun ishlatildi. Ko'p omilli tahlil (MFA) sensor yoqtirish, CATA deskriptorlari va fizik-kimyoviy xususiyatlarni o'z ichiga olgan uchta faol ma'lumotlar blokini integratsiya qilish uchun ishlatildi. Global tahlildan oldin har bir blok alohida tahlil qilindi va turli ma'lumotlar bloklarining ta'sirini muvozanatlash uchun birinchi yagona qiymatiga ko'ra normallashtirildi. Normallashtirilgan bloklar keyinchalik global MFAga birlashtirildi. Ko'r-ko'rona sharoitlarda umumiy yoqtirish qo'shimcha o'zgaruvchi sifatida kiritildi va shuning uchun MFA o'lchamlarini qurishga hissa qo'shmadi. Faol ma'lumotlar bloklari tomonidan taqdim etilgan konfiguratsiyalar o'rtasidagi o'xshashlik RV koeffitsientlari yordamida miqdoriy baholandi, ular 0 dan 1 gacha o'zgarib turadi, yuqori qiymatlar ko'p o'lchovli konfiguratsiyalar o'rtasida katta o'xshashlikni ko'rsatadi. Kutish effektlari «kutilgan minus ko'r-ko'rona», «xabardor qilingan minus ko'r-ko'rona» va «xabardor qilingan minus kutilgan» farqlari yordamida baholandi. Individual assimilyatsiya va kontrast javoblari (I − B)/(E − B) nisbati yo'nalishi bo'yicha tasniflandi; nol yoki aniqlanmagan nisbatlar ta'sir yo'qligi yoki noaniq javoblar sifatida tasniflandi. Sotib olish niyati mahsulotlarni taqqoslash uchun Fridman testi va kutilgan hamda xabardor qilingan sharoitlarni taqqoslash uchun Uilkoxonning imzolangan daraja testlari yordamida tahlil qilindi. Umumiy yoqtirish va sotib olish niyati o'rtasidagi munosabatlar kutilgan va xabardor qilingan sharoitlarda har bir mahsulot uchun alohida Spirman daraja korrelyatsiyalari yordamida tekshirildi. Umumiy yoqtirish sotib olish niyatini bashorat qiladimi yoki yo'qligini tekshirish uchun chiziqli aralash effektli modellar ishlatildi. Sotib olish niyati bog'liq o'zgaruvchi sifatida, umumiy yoqtirish va mahsulot esa qat'iy effektlar sifatida kutilgan va xabardor qilingan sharoitlar uchun alohida modellar moslashtirildi. Qo'shimcha model umumiy yoqtirishdagi «xabardor qilingan minus kutilgan» o'zgarish sotib olish niyatidagi tegishli o'zgarishni bashorat qiladimi yoki yo'qligini tekshirdi. Iste'molchi har bir ishtirokchi tomonidan taqdim etilgan beshta mahsulot bahosining mustaqil emasligini hisobga olish uchun tasodifiy kesishish sifatida kiritildi. Modellar cheklangan maksimal ehtimollik (REML) yordamida baholandi va erkinlik darajalari Satterthwaite yaqinlashuvi yordamida baholandi. Model taxminlari qoldiq taqsimotlarini va qoldiq-moslashtirilgan grafiklarini o'rganish orqali baholandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Analoglar&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sensor jozibad&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\
