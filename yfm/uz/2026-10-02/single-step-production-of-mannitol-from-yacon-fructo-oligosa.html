        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"158\" cy=\"99\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"582\" cy=\"208\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · TASTE_MOD   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Yakon ildizidan mannitol:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;shirin ildizni foydali&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;shakar o'rnini bosuvchiga&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;aylantirish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Mannitol — bu past kaloriyali shakar o'rnini bosuvchi modda bo'lib, odatda murakkab kimyoviy sintez orqali olinadi. Tadqiqotchilar yakon ildizi kukunini sut kislotasi bakteriyalari yordamida fermentatsiya qilishning ekologik toza usulini taklif qildilar. Bu usul o'simlikdagi fruktooligosaxaridlarni oldindan parchalashsiz to'g'ridan-to'g'ri ishlatish imkonini beradi. Texnologiya oziq-ovqat sanoati uchun yuqori samaradorlik va kengaytirish imkoniyatini ko'rsatdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Leuconostoc mesenteroides bakteriyalari yakondagi FOSni mannitolga aylantiradi.&lt;/li&gt;\n&lt;li&gt;Jarayon 30–37°C haroratda, xomashyoni gidroliz qilmasdan amalga oshiriladi.&lt;/li&gt;\n&lt;li&gt;1 g FOSdan 0,6 g dan ortiq mannitol olish samaradorligiga erishildi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Mannitol (E421) — past glikemik indeks va kaloriyaga ega bo'lgan olti atomli spirt hisoblanadi. Uni olishning an'anaviy sanoat usuli yuqori bosim va haroratda invert shakarni kimyoviy qaytarishga asoslangan, bu esa ko'pincha qo'shimcha mahsulot sifatida sorbit hosil bo'lishiga olib keladi. Ushbu tadqiqotda olimlar fruktozani yumshoq sharoitda (30–37°C) mannitolga samarali aylantira oladigan Leuconostoc mesenteroides kabi fruktofil sut kislotasi bakteriyalaridan (FLAB) foydalanishdi.&lt;/p&gt;\n&lt;p&gt;Xomashyo sifatida 50% dan ortiq fruktooligosaxaridlar (FOS) saqlaydigan yakon ildizi (Smallanthus sonchifolius) kukuni tanlandi. Bakteriyalar FOSni muvaffaqiyatli parchalab, gidrolizsiz mannitolga aylantirdi. 200 ml hajmli bioreaktorlarda o'tkazilgan tajribalarda 2% yakon kukuni konsentratsiyasida 7 g/l gacha mahsulot olishga erishildi. Konversiya samaradorligi 1 g FOS uchun 0,6 g dan ortiq mannitolni tashkil etdi va jarayonni kengaytirish mahsulot chiqishining kamayishiga olib kelmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 200 ml hajmli laboratoriya bioreaktorlarida o'tkazilgan, shuning uchun sanoat miqyosida qo'shimcha sinovlar talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"rasmlar\"&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html#rasmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rasmlar&lt;/span&gt;&lt;/a&gt;Rasmlar&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Mannitolning&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;murakkab&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kimyoviy&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sintezi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yakon kukunini&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bakteriyalar&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bilan achitish&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Gidrolizsiz 7&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;g/l mannitol&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;hosil bo'lishi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Shakar o'rnini&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bosuvchini&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ekologik&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ishlab chiqar&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maqola taqriz qilinadigan MicrobiologyOpen jurnalida nashr etilgan. Ammo bu ham bitta tadqiqot, yakuniy xulosa emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Litsenziya&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;MicrobiologyOpen (Europe PMC)&lt;/td&gt;\n&lt;td&gt;taste_mod&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mualliflar: Rajkumar AS, Leech J, McAuliffe O.&lt;/p&gt;\n&lt;h3 id=\"manbalar\"&gt;&lt;a href=\"2026-10-02/single-step-pro
