        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"235\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"545\" cy=\"282\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · GELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sibas terisi: baliqchilik&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;chiqindilaridan yeyiladigan&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qadoqlar&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Har yili baliqni qayta ishlash jarayonida ko'p miqdorda chiqindi hosil bo'ladi. Turkiyalik tadqiqotchilar sibas terisini yuqori sifatli jelatinga aylantirish usulini topdilar. Ushbu material sanoat analoglaridan qolishmaydi va yeyiladigan qadoqlash uchun asos bo'la oladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Sibas terisi jelatinida oqsil miqdori 90,93% ni tashkil etadi.&lt;/li&gt;\n&lt;li&gt;Gelning mustahkamligi 189,5 g ga teng.&lt;/li&gt;\n&lt;li&gt;Plyonkalar 6,53 MPa kuchlanishga va yuqori elastiklikka ega.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Sibas (&lt;a href=\"concepts/european-sea-bass.html\"&gt;Dicentrarchus labrax&lt;/a&gt;) terisidan olingan jelatin 90,93% oqsilga ega yuqori sifatli polimerdir. Uni olish uchun teri 35°C da yog'sizlantirildi, aralashmalarni yo'qotish uchun 0,2 M NaOH va kollagen matritsasini shishirish uchun 0,05 M HCl bilan ishlov berildi. Natijada glitsin (27,27%) va iminokislotalarga (18,71%) boy bo'lgan, 189,5 g kuchlanishga chidamli gel hosil bo'ldi.&lt;/p&gt;\n&lt;p&gt;Ushbu jelatindan glitserin yordamida 0,14 mm qalinlikdagi plyonkalar tayyorlandi. Sinovlar materialning 6,53 MPa kuchlanishga chidamliligi va 94,55% uzilishga nisbatan cho'zilish qobiliyatini ko'rsatdi. FTIR spektroskopiyasi tahlili materialning tijorat standartlariga mos keladigan barqaror tuzilishga ega ekanligini tasdiqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya sharoitida o'tkazilgan, shuning uchun sanoat miqyosida ishlab chiqarish qo'shimcha tekshiruvlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Oqsil asosidagi polimer sifatida jelatin o‘ziga xos biokimyoviy reaksiyalarga moyil bo‘lib, turli proteolitik fermentlar ta’sirida tarkibiy aminokislotalar va peptidlarga parchalanib ketishi mumkin. Strukturaviy jihatdan u kollagendan meros bo‘lib qolgan Gly–X–Y takrorlanuvchi motivini saqlab qoladi va tarkibida glitsin bilan bir qatorda prolin va gidroksiprolin kabi iminokislotalarning yuqori konsentratsiyasini o‘z ichiga oladi (1-rasm). Ushbu biopolimer matritsasining moyni bog‘lash bo‘yicha noyob qobiliyatini ta’minlovchi molekulyar mexanizmlar hali to‘liq o‘rganilmagan. Shu sababli, ushbu tadqiqot D. labrax terisini qayta ishlashning barqaror yo‘lini asoslashga qaratilgan bo‘lib, uning fizik-kimyoviy, strukturaviy va mexanik xususiyatlarini har tomonlama tavsiflash orqali raqobatbardosh, universal va halol bio-qadoqlash materiali sifatida uning samaradorligi uchun ishonchli baza yaratishni maqsad qiladi. Jelatin ko‘pincha yog‘ miqdori kamaytirilgan retsepturalarda odatda lipidlar tomonidan ta’minlanadigan qaymoqli tekstura va hajmni takrorlash uchun ishlatiladi. Oziq-ovqat sanoatidan tashqari, u ilg‘or biotibbiyot sohalarida ham qo‘llaniladi: hozirgi tadqiqotlar uning to‘qima muhandisligidagi, xususan, dori vositalarini yetkazib berish tizimlari, regenerativ tibbiyot karkaslari va hujayra differensiatsiyasi uchun matritsalar ishlab chiqishdagi rolini ta’kidlaydi. Bundan tashqari, jelatin past immunogenlik, biologik parchalanuvchanlik va biokompatibillik kabi afzalliklarga ega. Strukturaviy jihatdan jelatin hujayra adgeziyasiga yordam beradigan RGD (Arg–Gly–Asp) aminokislota ketma-ketligini o‘z ichiga oladi. Shu bilan birga, u plyonka hosil qilishning yuqori xususiyatlariga hissa qo‘shadigan bir va ikki qatlamli gidrofil zanjirlarni o‘z ichiga oladi. Jelatinning ko‘plab foydali xususiyatlari tufayli u keng ko‘lamli sohalarda qo‘llaniladi. Jelatin eritmalari sovutilganda termoreversiv gellar hosil qilishi mumkin, chunki zanjirlar «tartibsizlik–tartib» konformatsion o‘tishini boshdan kechiradi va bu ularga kollagenning uch spiral strukturasini tiklashga imkon beradi. Dengiz biopolimerlaridan iste’mol qilinadigan bio-qadoqlashni ishlab chiqish neft asosidagi sintetik materiallarni almashtirish uchun muhim muqobillarni taklif etadi. Jelatin plyonkalari plastifikatorlar qo‘shilishi bilan hosil bo‘lishi mumkin; ular namligi yoki yog‘i kam bo‘lgan oziq-ovqat tarkibiy qismlarini inkapsulatsiya qilish uchun ishlatilishi mumkin. Ular, shuningdek, kislorod, namlik va lipidlar migratsiyasidan himoya qilish uchun go‘sht ustida plyonkalar va qoplamalar hosil qilish uchun qo‘llanilishi mumkin (1-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Jelatin — bu o‘zining uch spiral strukturasi va termoreversiv gel hosil qilish qobiliyati tufayli sintetik qadoqlash uchun istiqbolli ekologik muqobil bo‘lgan universal biopolimerdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jahon aholisining tez o‘sishi tufayli oziq-ovqat va qo‘shimchalarda ishlatiladigan jelatinga bo‘lgan talab so‘nggi yillarda ortib, 2023-yilda 6,51 milliard AQSh dollariga yetdi va 2030-yilgacha yillik o‘sish sur’ati (CAGR) 10,1% bilan o‘sishi kutilmoqda. Ushbu ortib borayotgan sanoat talabini qondirish yirik mintaqaviy akvakultura qayta ishlash markazlarining resurslaridan foydalanishni talab qiladi, ular toza xomashyoning yuqori konsentratsiyali, kuzatilishi mumkin bo‘lgan oqimlarini hosil qiladi. Bozordagi jelatinning 90% dan ortig‘i cho‘chqa va qoramol terisi va paylariga to‘g‘ri keladi. Biroq, ma’lum diniy cheklovlar tufayli sutemizuvchilardan ishlab chiqarilgan jelatin ko‘pincha halol va kosher talablariga javob bermaydi. Bundan tashqari, sutemizuvchilardan olingan jelatin qoramol gubkasimon ensefalopatiyasi va og‘iz-tirnoq kasalligi bilan bog‘liq xavflarni keltirib chiqaradi. Binobarin, dengiz mahsulotlaridan olingan xavfsizroq jelatin manbalariga bo‘lgan talab tobora ko‘proq e’tibor qozonmoqda. Baliq sanoatining qo‘shimcha mahsulotlari baliq umumiy vaznining 75% gacha bo‘lishi mumkin va ko‘pincha past tijorat qiymatiga ega mahsulotlar (masalan, silos, o‘g‘itlar va baliq uni) ishlab chiqarish uchun ishlatiladi yoki poligonlarda yoki dengizda organik chiqindi sifatida tashlab yuboriladi. Odatda teri, suyak, bosh, tanga va ichki a’zolarni o‘z ichiga olgan ushbu qo‘shimcha mahsulotlarning jelatin kabi funksional biopolimerga biokonversiyasi zamonaviy chiqindisiz dengiz mahsulotlarini qayta ishlash va aylanma bioiqtisodiyot uchun birlamchi ahamiyatga ega. Jelatinning xususiyatlari hayvon turi, yoshi, dastlabki to‘qima va ekstraksiya sharoitlari kabi ko‘plab omillarga bog‘liq. Jelatin suyaklarga qaraganda baliq terisidan yuqoriroq chiqish va sifat bilan olinadi. Bugungi kunga qadar qora mushuk akulasi (Galeus melastomus), titan spinoroq (B. viridescens), atlantika treskasi, qizil tilapiya, oq amur va dengiz okuni kabi turli baliq turlarining terisidan jelatin ekstraksiyasi va tavsifi haqida xabar berilgan. Turkiya O‘rta yer dengizi mintaqasida dengiz va chuchuk suv mahsulotlari akvakulturasida ilg‘or mamlakat hisoblanadi. 156 602 tonna ishlab chiqarish hajmi bilan Yevropa dengiz okuni akvakulturada eng keng yetishtiriladigan tur hisoblanadi. Qayta ishlangan dengiz okuni milliy va xalqaro bozorlarda yangi, sovutilgan yoki file ko‘rinishida sotiladi. Qayta ishlangan dengiz mahsulotlariga, ayniqsa baliq filesiga bo‘lgan iste’molchi talabining o‘sishi qayta ishlash oqimlarining mutanosib o‘sishiga olib keldi. Terisiz file olish jarayonidan so‘ng, teri va suyaklar tashlab yuboriladi yoki ozuqa sanoatida ishlatiladi. Dengiz baliqchiligi va akvakultura sektorlarida Yevropa dengiz okuni yuqori qiymatli tijorat turi hisoblanadi, uning filesini olish va sanoat qayta ishlashi teri ko‘rinishidagi sezilarli hajmdagi qo‘shimcha mahsulotlarni hosil qiladi, bu qayta ishlash chiqindilarining 30% gacha qismini tashkil qiladi. Strategiya Yevropa dengiz okuni qayta ishlashni O‘rta yer dengizi havzasida tez rivojlanayotgan sektor sifatida taqdim etishdan iborat bo‘lib, u katta mahalliy ekologik yukni yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/side-streams.html\"&gt;Qo‘shimcha mahsulotlar&lt;/a&gt; (side-streams) — bu file ishlab chiqarilgandan keyin qoladigan baliq qismlari (teri, suyak, tanga). Ularni jelatinga qayta ishlash chiqindilarni qimmatli resursga aylantiradi va ishlab chiqarishning ekologik izini kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jelatin dengiz okuni terisidan avval ham ekstraksiya qilingan bo‘lsa-da, bizning tadqiqotimiz noyob strukturaviy va optik o‘zaro taqqoslashdan foydalangan holda ham sutemizuvchilar, ham sovuq suv dengiz jelatinining tijorat standartlariga nisbatan aniq etalonni o‘rnatadi. Bundan tashqari, ushbu biopolimer matritsasining moyni bog‘lash bo‘yicha noyob qobiliyatini ta’minlovchi molekulyar mexanizmlar hali to‘liq o‘rganilmagan. Shu sababli, ushbu tadqiqot D. labrax terisini qayta ishlashning barqaror yo‘lini asoslashga qaratilgan bo‘lib, uning fizik-kimyoviy, strukturaviy va mexanik xususiyatlarini har tomonlama tavsiflash orqali raqobatbardosh, global inklyuziv, halol bio-qadoqlash materiali sifatida uning samaradorligi uchun yakuniy baza yaratadi. Oldingi tadqiqotlar asosan yetishtiriladigan dengiz okuni jelatini (&lt;a href=\"concepts/sea-bass-skin-gelatin.html\"&gt;SSG&lt;/a&gt;) chiqishi yoki reologik profillashiga qaratilgan edi. Hozirgi vaqtda ushbu turning birlamchi aminokislota ketma-ketliklari va iminokislotalar taqsimotini sutemizuvchilar va baliq terisi jelatinlarining tijorat namunalari bilan to‘g‘ridan-to‘g‘ri taqqoslaydigan, shu bilan birga olingan jelatin plyonkalarining XRD, &lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt; va optik tiniqligini o‘rganadigan kompleks tadqiqotlar yetishmaydi. Yevropa dengiz okuni terisini yuqori qiymatli jelatinga aylantirish — ushbu tadqiqotning asosiy maqsadi — ekologik chiqindilarni boshqarish strategiyalari va aylanma bioiqtisodiyot tamoyillariga bevosita mos keladi. Bundan tashqari, polipeptid zanjirining moslashuvchan konformatsiyasi iste’mol qilinadigan plyonka ishlab chiqarish jarayonida plastifikatorning samarali kirib borishi va diffuziyasini osonlashtiradi, bu esa kogeziyali, shaffof va strukturaviy jihatdan barqaror iste’mol qilinadigan qadoqlash matritsalarini ishlab chiqishga imkon beradi. Shu munosabat bilan, dengiz okuni terisidan yuqori qiymatli tabiiy polimer — jelatin ekstraksiya qilindi va har tomonlama tavsiflandi. Ekstraksiya qilingan jelatindan iste’mol qilinadigan plyonkalar ham tayyorlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;w/w (&lt;a href=\"concepts/w-w.html\"&gt;weight/weight&lt;/a&gt;) — massa ulushi, bir komponent massasining boshqasiga nisbati. Bu holda 1:2 nisbati 1 kg teriga 2 kg muz to‘g‘ri kelishini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dengiz okuni terisidan ekstraksiya qilingan jelatin (SSG) yuqori oqsil tozaligi (90,93%) va juda past lipid miqdorini (0,13%) ko‘rsatdi, bu uni oziq-ovqat sanoati uchun sifatli xomashyoga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24
