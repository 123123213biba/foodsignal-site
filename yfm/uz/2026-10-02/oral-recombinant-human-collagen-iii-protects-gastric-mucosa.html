        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"157\" cy=\"76\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"483\" cy=\"261\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Kollagen oshqozon shilliq&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qavatini alkogol ta'siridan&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;himoya qila oladimi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar rekombinant inson III turdagi kollagenining (RC) etanol keltirib chiqaradigan oshqozon shilliq qavati shikastlanishlariga ta'sirini o'rganishdi. GES-1 hujayralari va Wistar kalamushlarida o'tkazilgan tajribalar RC shikastlanish maydonini samarali kamaytirishini ko'rsatdi. Ta'sir mexanizmi GPAEF peptidi orqali Pla2g4a-prostaglandin yo'lini faollashtirish bilan bog'liq.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;III turdagi rekombinant kollagen oshqozon shikastlanishini 78% ga kamaytiradi.&lt;/li&gt;\n&lt;li&gt;GPAEF peptidi Pla2g4a genini faollashtirib, himoya prostaglandinlarini hosil qiladi.&lt;/li&gt;\n&lt;li&gt;RC hayvonlardan olingan kollagen analoglariga qaraganda samaraliroq.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotda biotexnologik usulda olingan III turdagi rekombinant inson kollageni (RC) ishlatildi. GES-1 (inson oshqozon epiteliy hujayralari) hujayralarida o'tkazilgan tajribalarda himoya uchun optimal konsentratsiya 6% etanol ta'siridan keyin aniqlandi. Tahlillar shuni ko'rsatdiki, RC mitoxondrial membrana potensialini tiklashga yordam beradi va DCFH-DA floresan zondi yordamida o'lchangan reaktiv kislorod turlari (ROS) darajasini pasaytiradi.&lt;/p&gt;\n&lt;p&gt;Asosiy kashfiyot oshqozonda RC parchalanishi natijasida hosil bo'ladigan GPAEF peptidining aniqlanishi bo'ldi. Ushbu pentapeptid Pla2g4a geni promotor sohasidagi G-kvadruplekslar (G4) bilan yuqori yaqinlikda bog'lanadi. Bu o'zaro ta'sir G4 tuzilishini gibrid konformatsiyaga o'tkazib, shilliq qavatni himoya qiluvchi va qon oqimini kuchaytiruvchi prostaglandinlar sintezini faollashtiradi. Kalamushlarda o'tkazilgan testlarda 30 kunlik RC qabuli nazorat guruhiga nisbatan shilliq qavat shikastlanishini 78% ga kamaytirdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kalamushlar va hujayra madaniyatlarida o'tkazilgan, shuning uchun inson uchun dozalarni to'g'ridan-to'g'ri qo'llash klinik sinovlarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Etanol keltirib chiqaradigan o'tkir oshqozon shilliq qavati shikastlanishi (AGMI) bu yuqori konsentratsiyali etanolni qisqa muddatli haddan tashqari iste'mol qilish natijasida yuzaga keladigan patologik holat bo'lib, oshqozon shilliq qavati to'sig'ining buzilishiga olib keladi. Asosiy patologik mexanizmlarga shilliq qavat yuzasidagi fosfolipid ikki qavatining bevosita erishi, etanol va uning metaboliti atsetaldegid keltirib chiqaradigan reaktiv kislorod turlari (ROS) ning haddan tashqari ishlab chiqarilishi, shuningdek, zich birikmalarni buzadigan, epiteliy o'tkazuvchanligini oshiradigan va yallig'lanish hujayralarining infiltratsiyasini rag'batlantiradigan yallig'lanish reaksiyalari kiradi. Epidemiologik ma'lumotlar shuni ko'rsatadiki, qisqa muddatli ichkilikbozlik qiluvchilarning 15%–35% qismida oshqozon shilliq qavati eroziyalari yoki gemorragik gastrit rivojlanadi va ba'zi hollarda oshqozon yarasi, perforatsiya yoki hatto saratonga o'tadi. Spirtli ichimliklarni iste'mol qilish bilan bog'liq buzilishlar butun dunyo bo'ylab ortib borayotganligi sababli, spirtli ichimliklar bilan bog'liq kasalliklar sezilarli tibbiy va ijtimoiy-iqtisodiy yukni keltirib chiqaradi, faqat 2018 yilning o'zida 3 milliondan ortiq o'lim etanolni suiiste'mol qilish bilan bog'liq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Etanol keltirib chiqaradigan o'tkir oshqozon shikastlanishi ichuvchilarning 35% gacha qismini qamrab oladi, bu oksidlovchi stress va yallig'lanish orqali shilliq qavat to'sig'ini vayron qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Etanol keltirib chiqaradigan AGMI ni hozirgi klinik davolash asosan to'rtta terapevtik strategiyaga tayanadi: (1) antatsidlar va sukralfat kabi mahalliy himoya vositalari, ular oshqozon kislotasini zararsizlantiradi va shilliq qavat yuzasida fizik to'siq hosil qiladi. (2) Ranitidin kabi H2-retseptor antagonistlari, ular H2-retseptorlarini blokirovka qilish orqali kislota sekretsiyasini inhibe qiladi. (3) Proton pompasi ingibitorlari (PPI, shu jumladan omeprazol va lansoprazol), ular parietal hujayralarning H+/K+-ATFaza faolligini maxsus inhibe qiladi, shu bilan kislota sekretsiyasining terminal bosqichini bloklaydi. (4) Prostaglandin analoglari, ular qon oqimi va shilliq sekretsiyasini oshirish orqali shilliq qavat himoyasini kuchaytiradi. Biroq, H2-retseptor antagonistlari va PPI lardan uzoq muddatli foydalanish yurak-qon tomir, jigar va buyrak toksikligi bilan bog'liq va ichak mikrobiotasini buzishi mumkin, prostaglandin analoglarining neselektiv farmakologik ta'siri esa tizimli nojo'ya reaksiyalar tufayli ularning klinik foydaliligini cheklaydi. Ushbu cheklovlar xavfsizroq va mexanistik jihatdan aniqroq aralashuvlarga, ayniqsa multimodal regulyator salohiyatiga ega bioaktiv molekulalarga asoslangan aralashuvlarga ehtiyoj borligini ta'kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PPI (proton pompasi ingibitorlari) — bu oshqozon hujayralarida kislota ishlab chiqaruvchi nasoslarni «o'chiradigan» dorilar bo'lib, ular oshqozon kislotaliligini pasaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;So'nggi yillarda tabiiy mahsulotlardan olingan bioaktiv komponentlar oshqozon shilliq qavati shikastlanishining oldini olish va davolashda tobora ko'proq e'tiborni tortmoqda. Polisaxaridlar immunomodulyatsiya orqali shilliq qavatni himoya qiluvchi ta'sir ko'rsatishi, fitokimyoviy moddalar o'zlarining ko'p maqsadli antioksidant xususiyatlari uchun keng o'rganilishi va bioaktiv peptidlar (masalan, bug'doy peptidlari, baliq kollagen peptidlari) ikki tomonlama antioksidant va yallig'lanishga qarshi faollikni ko'rsatishi haqida xabar berilgan. Shunga qaramay, bu soha hali ham ko'plab texnik va kontseptual to'siqlarga duch kelmoqda. Xomashyo darajasida o'simlik va hayvonlardan olingan kollagenlar ko'pincha yuqori immunogenlik va tartibsiz fibrill yig'ilishini namoyon qiladi; an'anaviy ekstraksiya usullari yuqori darajada tozalangan, strukturaviy jihatdan aniqlangan kollagen fraktsiyalarini bera olmaydi, bu esa klinik tarjima va mexanistik tushuntirishga to'sqinlik qiladi. Mexanistik darajada aksariyat tadqiqotlar tanlab bitta patologik bo'g'inga (masalan, oksidlovchi stress yoki yallig'lanish) qaratilgan va oshqozon shilliq qavati shikastlanishi va tiklanishi jarayonida muvofiqlashtirilgan regulyator tarmoqlar qanday qayta qurilishini kamdan-kam hollarda ko'rib chiqadi. Aralashuvdan so'ng oshqozon to'qimalarida dinamik metabolik javoblarning bo'ylama tahlillari kam va AGMI da metabolik qayta dasturlashni tushunish uchun tizimli baza hali ham mavjud emas. Bundan tashqari, hozirgi tadqiqotlar asosan past molekulyar og'irlikdagi kollagen peptidlari va ularning parchalanish mahsulotlariga (masalan, glitsil-prolin fragmentlari) qaratilgan, kichik peptidlar osonroq so'riladi va bioavailable degan taxminga asoslanib. Bu urg'u makromolekulyar kollagenlarning o'zini mexanistik o'rganishga nisbatan e'tiborsizlikka olib kelgan bo'lishi mumkin, garchi ularning strukturaviy yaxlitlik, qattiqlik va barqaror bioaktivlikka qo'shgan hissasi bo'lsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotlarning aksariyati kollagen fragmentlariga qaratilgan bo'lib, to'qimalar tuzilishini tiklashda samaraliroq bo'lishi mumkin bo'lgan butun makromolekulalar salohiyatini e'tiborsiz qoldiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Rekombinant inson III turdagi kollageni (rhColIII, RC), hujayradan tashqari matritsaning asosiy komponenti, o'zining ajoyib biologik mosligi, hayvon kelib chiqishi xavfining yo'qligi va yaxshi aniqlangan molekulyar tuzilishi tufayli to'qimalarni tiklash uchun istiqbolli biomaterial sifatida paydo bo'ldi. RC mexanik signal uzatilishini vositalash, epitelial hujayralar migratsiyasini yo'naltirish va hujayra-matritsa o'zaro ta'sirini modulyatsiya qilish uchun biomimetik karkas sifatida harakat qilishi mumkin; u shuningdek, integrin retseptorlari va FAK/RhoA/ROCK kabi quyi oqim signal yo'llari bilan o'zaro ta'sir qiladi, shu bilan fibroblastlar faollashuvini, hujayradan tashqari matritsa sintezini va nazorat qilinadigan yallig'lanish reaksiyalarini rag'batlantiradi. Ushbu xususiyatlar RC ni oshqozon shilliq qavatini himoya qilish uchun nomzod biomaterial sifatida ko'rib chiqish uchun kuchli nazariy asos yaratadi. Biroq, RC bo'yicha mavjud tadqiqotlar asosan teri va tog'ay kabi sirt to'qimalariga qaratilgan. Aksincha, oshqozon shilliq qavati doimiy ravishda yuqori kislotalilik, peristaltikadan kelib chiqadigan dinamik mexanik stress va lyuminal metabolitlar va mikrobiota bilan murakkab o'zaro ta'sirlar bilan tavsiflangan noyob qattiq muhitga ta'sir qiladi. Ushbu xususiyatlar shuni ko'rsatadiki, RC ning oshqozon shilliq qavatini tiklashni modulyatsiya qilish mexanizmlari teri yoki tog'ay to'qimalaridan tubdan farq qilishi mumkin va oldingi ishlardan shunchaki ekstrapolyatsiya qilinishi mumkin emas, bu esa muhim va hali o'rganilmagan tadqiqot bo'shlig'ini ta'kidlaydi. Ushbu tadqiqotda biz etanol keltirib chiqaradigan AGMI da oshqozonni himoya qiluvchi biomaterial sifatida og'iz orqali yuboriladigan rekombinant inson III turdagi kollageni (RC) ning samaradorligi va ta'sir mexanizmini tizimli ravishda o'rganamiz. GES-1 inson oshqozon shilliq qavati epitelial hujayralaridan foydalanib, biz birinchi navbatda RC ning biologik xavfsizligini baholaymiz va in vivo tadqiqotlar uchun asos bo'lib xizmat qiladigan hujayra darajasida optimal himoya konsentratsiyasi diapazonini belgilaymiz.&lt;/p&gt;\n&lt;p&gt;Keyin biz etanol keltirib chiqaradigan AGMI ning kalamush modelini yaratamiz va 30 kunlik RC bilan og'iz orqali oldindan aralashuv oshqozon shilliq qavati shikastlanishini sezilarli darajada oldini olishini, hayvonlardan olingan kollagenlarga nisbatan shikastlanish maydonini kamaytirishini va gistologik va biokimyoviy ko'rsatkichlarni yaxshilashini namoyish etamiz. Asosiy mexanizmni aniqlash uchun biz metabolomik va transkriptomik tahlillarni birlashtiramiz va RC muvofiqlashtirilgan, uch tomonlama javobni qo'zg'atishini ko'rsatamiz: glutationga asoslangan antioksidant yo'llarni kuchaytirish orqali redoks gomeostazni saqlash, shilliq qavat yaxlitligini saqlash uchun sitoskeletal va zich birikma to'sig'ini tiklash va epitelial regeneratsiyani rag'batlantirish uchun metabolik-yallig'lanish tarmoqlarini qayta ulash — bularning barchasi birgalikda RC keltirib chiqaradigan oshqozon to'qimalarining metabolik qayta dasturlashini aks ettiradi. Ushbu ta'sirlarning markazida Pla2g4a-prostaglandin (PG) o'qi joylashgan bo'lib, u orqali RC maxsus araxidon kislotasi-prostaglandin yo'lini jalb qiladi va prostaglandin bilan bog'liq himoya vositalari sintezini rag'batlantiradi. Biz RC dan olingan oshqozonda hazm qilingan GPAEF pentapeptidini aniqlaymiz, u Pla2g4a promouteri G-kvadrupleksini (G4) tanlaydi va barqarorlashtiradi, uning aralash turdagi konformatsion ansamblini qayta qurishga yordam beradi va peptid-G4 kompleksini barqarorlashtiradi; bu konformatsion javob Pla2g4a transkripsiyasining kuchayishiga va quyi oqim PG biosinteziga hissa qo'shishi mumkin. Umuman olganda, bizning topilmalarimiz og'iz orqali RC yuborilishi va in vivo oshqozonda GPAEF hosil bo'lishi, in vitro eksperimental kuzatilgan GPAEF va Pla2g4a G4 elementi o'rtasidagi o'zaro ta'sir va RC bilan bog'liq Pla2g4a-prostaglandin o'qining faollashuvi o'rtasidagi ko'p miqyosli mexanistik modelni qo'llab-quvvatlaydi, shu bilan oshqozon shilliq qavatini himoya qilish bilan ishonchli mexanistik bog'liqlikni ta'minlaydi. Ushbu ish RC ni etanol bilan bog'liq gastropatiya uchun xavfsiz va samarali og'iz orqali qabul qilinadigan biomaterial sifatida belgilaydi va oshqozon shilliq qavati himoyasida G4 vositachiligidagi epigenetik-metabolik regulyatsiya uchun mexanistik asos yaratadi.&lt;/p&gt;\n&lt;p&gt;GES-1 hujayralari Baidi Biotechnology Co., Ltd (Zhejiang, Xitoy) dan olingan. Rekombinant inson III turdagi kollageni (rhColIII, RC) Jiangsu Chuangjian Medical Technology Co., Ltd tomonidan taqdim etilgan. RPMI-1640 muhiti, homila buzoq zardobi (FBS, Gibco), tripsin-EDTA (Gibco), penitsillin-streptomitsin-neomitsin (PSN) antibiotik aralashmasi va PBS buferi (pH 7,2) Sigma-Aldrich Inc. (AQSh) dan sotib olingan. 2,7-dixlorfluoressein diasetat (DCFH-DA) lyuminestsent zond tahlil to'plami, mitoxondrial membrana potentsialini aniqlash to'plami (JC-1), hujayralarni hisoblash tahlili (CCK-8) va BCA oqsil tahlili to'plami Beyotime Biotechnology Co., Ltd. (Shanxay, Xitoy) dan sotib olingan. Analitik toza suvsiz etanol Shanghai Guoyao dan sotib olingan. Qisqartirilgan glutation (GSH) tahlil to'plami va superoksiddismutaza (SOD) tahlil to'plami (WST-1 usuli) Nanjing Jiancheng Bioengineering Institute dan sotib olingan.&lt;/p&gt;\n&lt;p&gt;GES-1 hujayralari 10% (v/v) FBS va penitsillin-streptomitsin-neomitsin (PSN) antibiotik aralashmasi bilan to'ldirilgan RPMI-1640 muhiti bilan 75 sm² kolbalarda o'stirilgan. Madaniyatlar 37°C da 5% CO₂ atmosferasida inkubatsiya qilingan. Hujayralar PBS (pH 7,2) bilan yuvilgan va tripsin-EDTA yordamida ajratilgan. Etanol keltirib chiqaradigan GES-1 hujayra shikastlanishi modelini yaratish usulini o'rganish uchun hujayralar 1 soat davomida turli konsentratsiyalarda: 5%, 6%, 7%, 8%, 9% va 10% etanol ta'siriga uchratilgan, hujayra hayotiyligini aniqlash uchun. Hujayra hayotiyligining taxminan 60% ga mos keladigan etanol konsentratsiyasi optimal modellashtirish konsentratsiyasi sifatida tanlangan. GES-1 hujayralari 24 soat davomida turli konsentratsiyadagi RC bilan oldindan ishlov berilgan, so'ngra 1 soat davomida tanlangan konsentratsiyada etanol ta'siri kuzatilgan. Keyinchalik RC ning hujayra hayotiyligi, oksidlovchi stress va yallig'lanishga himoya ta'siri baholangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hujayra hayotiyligi — bu shikastlovchi omil (bu holda etanol) ta'siridan keyin madaniyatdagi «tirik» hujayralar foizi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Etanol sababli&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;oshqozon&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;shikastlanishi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff
