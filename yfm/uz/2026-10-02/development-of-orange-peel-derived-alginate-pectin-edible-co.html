            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"228\" cy=\"178\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"164\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · HYDROCOLLOIDS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Apelsin po‘sti va chinnigul&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;pomidorlarni uzoqroq&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;saqlashga qanday yordam&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;beradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Har yili dunyo bo‘ylab hosilning 40% gacha qismi saqlash jarayonida nobud bo‘ladi. Tadqiqotchilar natriy alginat, apelsin po‘stidan olingan pektin va chinnigul efir moyi asosida biologik parchalanadigan qoplama ishlab chiqishdi. Ushbu tarkib namlik yo‘qotilishini kamaytiradigan va mikroblar o‘sishini to‘xtatadigan himoya qatlamini hosil qiladi. Tajribalar shuni ko‘rsatdiki, bunday «yeyiladigan qadoq» cheri pomidorlarining saqlash muddatini sezilarli darajada uzaytiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Apelsin pektini va xitozan namlikni ushlab turuvchi zich to‘siq hosil qiladi.&lt;/li&gt;\n&lt;li&gt;Chinnigul moyidagi evgenol kuchli antioksidant ta’sir ko‘rsatadi.&lt;/li&gt;\n&lt;li&gt;Qoplama cheri pomidorlarini 4 °C da 15 kun davomida yangi saqlaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Qoplamaning asosi natriy alginat bo‘lib, u apelsin po‘sti chiqindilaridan olingan pektin bilan boyitilgan. Tarkibga xitozan — kationli polisaxarid ham qo‘shilgan bo‘lib, u pH 3,61–4,07 muhitda alginat va pektinning anion guruhlari bilan mustahkam polielektrolit komplekslarini hosil qiladi. Bu o‘zaro ta’sir plyonka tuzilishini zichlashtirib, uning namligini 46,3% dan 28,03% gacha pasaytiradi, bu esa meva vaznini yo‘qotmaslik uchun juda muhimdir.&lt;/p&gt;\n&lt;p&gt;Asosiy komponent sifatida chinnigul efir moyida mavjud bo‘lgan evgenol ishlatilgan. U kuchli antioksidant faollikni ta’minlaydi: F3 tarkibi DPPH radikallarini 89,46–94,82% gacha zararsizlantirish qobiliyatini ko‘rsatdi. 4 °C haroratda 15 kun davomida saqlanganda, F3 qoplamasi pomidorlarning vizual sifatini saqlab qoldi, ishlov berilmagan nazorat namunalari esa mog‘orlab ketdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya sharoitida o‘tkazilgan, shuning uchun katta hajmdagi mahsulotlarda samaradorlikni tekshirish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"rasmlar\"&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html#rasmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rasmlar&lt;/span&gt;&lt;/a&gt;Rasmlar&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Saqlash&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;vaqtida&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;hosilning&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;nobud bo‘lishi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M18 font-weight=\"600\"&gt;ekologik&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;muqobil&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maqola taqriz qilinadigan Molecules (Basel, Switzerland) jurnalida nashr etilgan. Ammo bu ham bitta tadqiqot, yakuniy xulosa emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Litsenziya&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Molecules (Basel, Switzerland) (Europe PMC)&lt;/td&gt;\n&lt;td&gt;hydrocolloids&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mualliflar: Thekkath A, Yoo MJY.&lt;/p&gt;\n&lt;h3 id=\"manbalar\"&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Havola&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13610544\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;t
