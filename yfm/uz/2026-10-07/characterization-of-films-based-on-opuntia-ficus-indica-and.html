            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"181\" cy=\"148\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"579\" cy=\"233\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PACKAGING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Plastik o‘rniga kaktus:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;opuntiya chiqindilaridan&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yangi qadoqlash&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f1.jpg\" alt=\"(a) Qalinlik, (b) choʻzilish kuchi va (c) OFICP/pektin asosidagi plyonkalarning uzilishdagi nisbiy uzayishi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Qalinlik, (b) choʻzilish kuchi va (c) OFICP/pektin asosidagi plyonkalarning uzilishdagi nisbiy uzayishi&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar quritilgan opuntiya poyasi kukuni va pektin asosida ekologik toza qadoqlash materialini ishlab chiqishdi. Bu material tuproqda 28 kun ichida to‘liq parchalanadi. Plyonka yuqori mustahkamlikka ega va mahsulotlarni ultrabinafsha nurlaridan himoya qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Pektin qo‘shilishi plyonka mustahkamligini 232% ga oshirdi.&lt;/li&gt;\n&lt;li&gt;Material 28 kun ichida tuproqda to‘liq parchalanadi.&lt;/li&gt;\n&lt;li&gt;Yuqori xiralik mahsulotlarni ultrabinafsha nurlaridan asraydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Plyonkani yaratish uchun 2 g quritilgan opuntiya poyasi (OFICP), plastifikator sifatida 30% glitserin va 0,5 dan 2,0 g gacha bo‘lgan pektin ishlatildi. Tarkibdagi pektin miqdorining oshishi materialning mexanik xususiyatlarini sezilarli darajada yaxshiladi: cho‘zilishga chidamlilik F1 dan F3 tarkibiga o‘tishda 232% ga (2,62 dan 8,69 MPa gacha) oshdi.&lt;/p&gt;\n&lt;p&gt;Material gidrofil xususiyatlarga ega, bu past kontakt burchaklari (30,29–39,39°) va yuqori namlik darajasi (25,11–35,98%) bilan tasdiqlanadi. Tuproqdagi sinovlar plyonkalar 12-kundan boshlab vizual ravishda parchalana boshlaganini va 28-kunga kelib deyarli butunlay yo‘q bo‘lib ketganini ko‘rsatdi. Plyonkalarning yuqori xiraligi (22–25%) ularni yorug‘lik ta’sirida yog‘li mahsulotlarning oksidlanishidan himoya qilish uchun mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya sharoitida o‘tkazilgan, shuning uchun turli saqlash rejimlarida plyonka xususiyatlarini qo‘shimcha tekshirish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Plastik qadoqlash oziq-ovqat sanoatida keng qoʻllaniladi, ammo uning atrof-muhitda asrlar davomida saqlanib qolishi biologik parchalanadigan muqobillarga boʻlgan qiziqishni kuchaytirdi. Ushbu tadqiqotning maqsadi muzlatib quritilgan (liofilizatsiya qilingan) Opuntia ficus-indica kladodiyalari kukuni (OFICP) (2 g), glitserin (30%, massa boʻyicha) va tijorat pektinining turli miqdorlari: 0,5 g (F1), 1,0 g (F2), 1,5 g (F3) va 2,0 g (F4) yordamida biologik parchalanadigan plyonkani ishlab chiqish edi. Pektin miqdorining plyonkalarning mexanik, termal, strukturaviy, rang va namlik bilan bogʻliq xususiyatlariga taʼsiri, shuningdek, ularning tuproq va simulyatsiya qilingan dengiz muhitida biologik parchalanishi tizimli ravishda baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pektin miqdorining oshishi uzilishga chidamlilikni 232% ga (2,62 dan 8,69 gacha) oshirdi va plyonkalarning termal barqarorligini yaxshiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yuqori miqdorda pektin saqlagan tarkiblar yaxshilangan mexanik koʻrsatkichlarni, jumladan, F1 (2,62) dan F3 (8,69) gacha uzilishga chidamlilikning 232% ga oshishini, shuningdek, yaxshilangan termal barqarorlikni namoyon etdi. Pektin va OFICP ning gidrofil tabiati tufayli plyonkalar past kontakt burchaklari (30,29–39,39°) va yuqori namlik darajasini (25,11–35,98%) koʻrsatdi. Gidrofil tabiati va namlik bilan bogʻliq xususiyatlarini hisobga olgan holda, plyonkalar namligi past boʻlgan oziq-ovqat mahsulotlari uchun koʻproq mos kelishi mumkin; biroq, ularning yaroqliligini tasdiqlash uchun turli saqlash va atrof-muhit sharoitlarida qoʻshimcha tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya sharoitida oʻtkazilgan; plyonkalarning haqiqiy oziq-ovqat mahsulotlari uchun yaroqliligini tasdiqlash uchun qoʻshimcha sinovlar zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, eksperimental sharoitda plyonkalar tuproqda bosqichma-bosqich vizual parchalanishni koʻrsatdi: F1 va F2 tarkiblari 12-kunga kelib sezilarli darajada parchalangan boʻlsa, barcha tarkiblar 28-kunga kelib deyarli toʻliq parchalanib ketdi. Shunday qilib, ushbu topilmalar OFICP ni tijorat pektini bilan aralashtirish yaxshilangan xususiyatlarga ega plyonkalarni hosil qilishini va ularning oziq-ovqat qadoqlashda qoʻllanilishi mumkinligini koʻrsatadi. Qolaversa, Opuntia ficus-indica qoʻshimcha mahsulotlarini qayta ishlash qishloq xoʻjaligi chiqindilarini boshqarishda ekologik masʼuliyatli yondashuvni taʼminlaydi va oziq-ovqat qadoqlash uchun bio-asosli materiallarning yangi avlodini rivojlantirishni qoʻllab-quvvatlaydi.&lt;/p&gt;\n&lt;p&gt;Kalit soʻzlar: Polisaxaridlar · Kaktus · Barqarorlik · Oziq-ovqat qadoqlash · Muzlatib quritilgan · Qoʻshimcha mahsulot&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Plastik qadoqlashdan intensiv foydalanishning ekologik oqibatlari haqidagi xavotirlarning ortishi barqaror muqobillarni izlashni ragʻbatlantirdi, ayniqsa oziq-ovqat sektorida, bu yerda materiallarni utilizatsiya qilish hajmi yuqori. Asosan qayta tiklanmaydigan manbalardan olinadigan plastik qadoqlash biologik parchalanmaydi va atrof-muhitning ifloslanishiga hamda qattiq chiqindilarning toʻplanishiga sezilarli hissa qoʻshadi. Shu nuqtayi nazardan, tabiiy biopolimerlardan tayyorlangan biologik parchalanadigan plyonkalar texnologik funksionallikni atrof-muhitga kamroq taʼsir bilan birlashtirib, aylanma iqtisodiyot va barqarorlik tamoyillariga mos keladigan istiqbolli yechim sifatida paydo boʻldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tabiiy polimerlardan tayyorlangan biologik parchalanadigan plyonkalar anʼanaviy plastikka ekologik toza muqobil boʻlib, barqaror rivojlanish tamoyillariga mos keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu materiallar orasida oʻsimliklardan olingan polisaxaridlar oʻzlarining tarkibiy xilma-xilligi va uzluksiz polimer matritsalarini hosil qilish qobiliyati tufayli alohida qiziqish uygʻotmoqda. Shu nuqtayi nazardan, yarim qurgʻoqchil hududlarda keng yetishtiriladigan kaktus turi Opuntia ficus-indica istiqbolli, ammo kam oʻrganilgan resurs hisoblanadi. Uning kladodiyalari qishloq xoʻjaligi boshqaruvida katta miqdorda hosil boʻladi va koʻpincha tashlab yuboriladi yoki toʻliq ishlatilmaydi, garchi ular polisaxaridlar, xun tolalari va boshqa funksional tarkibiy qismlarga boy boʻlsa ham. Soʻnggi tadqiqotlar shuni koʻrsatdiki, Opuntia ficus-indica kladodiyalaridan olingan materiallar maqbul mexanik va toʻsiq xususiyatlariga ega biologik parchalanadigan plyonkalar ishlab chiqarish uchun ishlatilishi mumkin. Biroq, bu yondashuvlarning koʻpchiligi shilimshiq moddalarni yoki maxsus fraksiyalarni ajratib olishga tayanadi, bu esa qayta ishlash murakkabligini oshiradi va miqyosni cheklaydi. Muqobil strategiya — quritgandan soʻng butun kladodiyalardan bevosita foydalanish boʻlib, bu biomassani toʻliq baholashga imkon beradi va qayta ishlash bosqichlarini soddalashtiradi. Liofilizatsiya (muzlatib quritish) tarkibiy qismlarni saqlab qolishga imkon beradi va plyonka formulasi uchun mos boʻlgan bir jinsli kukunlarni ishlab chiqarishni osonlashtiradi.&lt;/p&gt;\n&lt;p&gt;Potensialiga qaramay, biologik asosdagi plyonkalar koʻpincha egiluvchanlik va mexanik chidamlilik kabi xususiyatlarni optimallashtirish uchun tarkibida qoʻshimcha molekulalarni talab qiladi. Galakturon kislotasi birliklariga boy va odatda sitrus mevalaridan olinadigan polisaxarid boʻlgan pektin bu maqsad uchun samarali variantdir. Oʻzining ichki gellanish va plyonka hosil qilish qobiliyati tufayli u biologik parchalanadigan matritsalarga yaxshi integratsiyalanadi va ularning mexanik, termik va toʻsiq xususiyatlarini yaxshilaydi. Shunday qilib, uning plyonka formulalariga kiritilishi yaxshilangan tarkibiy barqarorlik va funksional samaradorlikka ega materiallarni ishlab chiqishni qoʻllab-quvvatlaydi. Plastifikatorlar ham moʻrtlikni yengish va egiluvchanlikni yaxshilash uchun biopolimer asosidagi plyonkalarda muhim ahamiyatga ega. Glitserin gidrofil polimerlar bilan mosligi va zanjir harakatchanligini oshirish qobiliyati tufayli eng koʻp qoʻllaniladigan plastifikatorlardan biridir. Opuntia ficus-indica kladodiyasidan olingan material, pektin va glitserin kombinatsiyasi ushbu komponentlarning bir-birini toʻldiruvchi xususiyatlaridan foydalanadigan va plyonka ish faoliyatini yaxshilashi mumkin boʻlgan formulalar strategiyasini ifodalaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Liofilizatsiya — bu xomashyoning tuzilishi va xususiyatlarini saqlab qolish uchun vakuumda muzlatilgan mahsulotdan namlikni olib tashlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Garchi bir nechta tadqiqotlar Opuntia ficus-indica yoki pektindan alohida olingan plyonkalarni oʻrgangan boʻlsa-da, ularning birgalikda ishlatilishini tekshirish cheklangan boʻlib qolmoqda. Pektin miqdori muzlatib quritilgan Opuntia ficus-indica kladodiyasi kukunini oʻz ichiga olgan plyonkalarning fizik-kimyoviy, mexanik, termik va toʻsiq xususiyatlariga qanday taʼsir qilishini tushunish barqaror qadoqlash materiallarini rivojlantirish uchun juda muhimdir. Shu sababli, ushbu tadqiqot muzlatib quritilgan Opuntia ficus-indica kladodiyasi kukuni (OFICP), pektin va glitserin asosida biologik parchalanadigan aralash plyonkalarni ishlab chiqish va tavsiflash hamda ularning oziq-ovqat mahsulotlarini qadoqlashda potensial qoʻllanilishi uchun yaroqliligini baholash maqsadida ularning fizik-kimyoviy, mexanik, termik va toʻsiq xususiyatlarini baholashga qaratilgan.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"plyonka-korinishi\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#plyonka-korinishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plyonka koʻrinishi&lt;/span&gt;&lt;/a&gt;Plyonka koʻrinishi&lt;/h4&gt;\n&lt;p&gt;Dastlab, OFICP va glitserinning turli konsentratsiyalaridan foydalangan holda plyonka hosil qiluvchi dastlabki sinovlar oʻtkazildi. Biroq, bu tarkiblar moʻrt materiallarning hosil boʻlishiga olib keldi, ularni Petri idishlaridan ajratib olish qiyin edi va ular ishlov berish yoki keyingi tavsiflash uchun mos emas edi. Natijada, nazorat tizimi sifatida faqat pektinli tarkib (2 g pektin + glitserin) tanlandi, u OFICP/pektin kompozit plyonkalari bilan solishtirish uchun mos yozuvlar matritsasi boʻlib xizmat qildi. Bundan tashqari, barcha kompozit tarkiblar (F1–F4) koʻrinadigan yoriqlar yoki havo pufakchalarisiz bir hil plyonkalarni hosil qildi va ular bilan ishlash oson edi (Rasm S1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazorat sifatida faqat pektindan foydalanish barqaror matritsani yaratishga imkon berdi, barcha kompozit tarkiblar (F1–F4) esa bir hil va ishlov berish oson boʻlgan plyonkalarni hosil qildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"suv-bilan-bogliq-xususiyatlar\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#suv-bilan-bogliq-xususiyatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Suv bilan bogʻliq xususiyatlar&lt;/span&gt;&lt;/a&gt;Suv bilan bogʻliq xususiyatlar&lt;/h4&gt;\n&lt;p&gt;Suv oziq-ovqat mahsulotlarining vizual sifati va buzilish jarayonlariga sezilarli taʼsir koʻrsatadi, bu uni saqlash vaqtida xavfsizlikni taʼminlashda asosiy omilga aylantiradi. Oziq-ovqat mahsulotlarini himoyalangan holda saqlash uchun qadoqlash materiallari tashqi namlikka qarshi toʻsiq boʻlib, namlik oʻtishini samarali nazorat qilishi kerak. Shuning uchun namlik miqdori, kontakt burchagi, suv faolligi (Aw) va suv bugʻining oʻtkazuvchanligi (WVP) kabi suv bilan bogʻliq xususiyatlarni baholash OFICP/pektin aralash plyonkalarining ishlashini tushunish va optimallashtirish uchun juda muhimdir. 1-jadvalda plyonkalarning namlik miqdori, Aw, WVP, kontakt burchagi va plyonka yuzasidagi suv tomchisining tasviri keltirilgan. Plyonkalarning namlik miqdori bir tarkibdan ikkinchisiga qarab oʻzgargan. Aralash plyonkalarga kelsak, pektin miqdorining 1,5 g gacha oshishi namlik miqdorining kamayishiga olib keldi. Buni OFICP va pektin oʻrtasida vodorod bogʻlanishlarining hosil boʻlishi bilan izohlash mumkin, bu suv bilan bogʻlanishi mumkin boʻlgan –OH guruhlari sonini kamaytiradi. Bu topilmalar oldingi tadqiqotlarga mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Suv faolligi (Aw) — bu mahsulot yoki materialdagi mikroorganizmlarning oʻsishiga yordam beradigan erkin suvning mavjudligi koʻrsatkichi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plyonka hosil qiluvchi eritmaning hajmi barcha namunalar uchun bir xil boʻlganligi va quruq moddalar miqdori turlicha boʻlganligi sababli, plyonka qalinligi mustaqil oʻzgaruvchi sifatida nazorat qilinmadi, bu WVP natijalariga taʼsir qilgan boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;OFICP ning qoʻshilishi Aw va WVP qiymatlariga taʼsir qildi, ular maʼlum bir tendensiyaga amal qildi: pektin miqdori oshgani sayin, suv bugʻining oʻtkazuvchanligi va suv faolligi ham oshdi, bu esa koʻproq oʻtkazuvchan tuzilishdan dalolat beradi. Suv faolligi F1 da 0,408 dan nazorat plyonkasida 0,470 gacha oʻzgardi, bu pektin asosidagi plyonkalar uchun adabiyotlarda keltirilgan qiymatlardan (0,614–0,652) pastroqdir. Farqlarga qaramay, olingan Aw qiymatlari plyonka matritsasi ichidagi erkin suv miqdori pastligini aks ettiradi, bu ishlatilgan polimerlarning fizik-kimyoviy xususiyatlariga mos keladi. Shuni taʼkidlash kerakki, tarkiblar oʻrtasidagi plyonka qalinligidagi farqlar WVP va mexanik xususiyatlardagi kuzatilgan oʻzgarishlarga hissa qoʻshgan boʻlishi mumkin. WVP qiymatlari nazorat plyonkasi uchun 2,78 (g·m⁻¹·s⁻¹·Pa⁻¹) dan F4 tarkibi uchun 0,54 (g·m⁻¹·s⁻¹·Pa⁻¹) gacha oʻzgardi. Eng yuqori qiymatlar F3 va F4 tarkiblarida kuzatildi, ular F1 va nazorat plyonkasidan sezilarli darajada farq qildi. Bu oʻsishni tarkiblarga qattiq moddalarning qoʻshilishi, xususan, OFICP ning oʻziga qoʻshilgan pektinning katta miqdori bilan izohlash mumkin. Bundan tashqari, ham polimerlarning, ham plastifikatorning gidrofil xususiyatini hisobga olish kerak, chunki glitserinning gigroskopikligi suv molekulalari bilan kuchliroq oʻzaro taʼsirni ragʻbatlantiradi, yutilish va oʻtkazuvchanlikni kuchaytiradi, shu bilan birga plyonkaning toʻsiq xususiyatlarini pasaytiradi.&lt;/p&gt;\n&lt;p&gt;1-jadval Namlik miqdori, suv faolligi (Aw), suv bugʻining oʻtkazuvchanligi (WVP), kontakt burchagi va C = nazorat plyonkasi (2 g pektin); F1 (0,5 g pektin + 2 g OFICP), F2 (1,0 g pektin + 2 g OFICP), F3 (1,5 g pektin + 2 g OFICP), F4 (2 g pektin + 2 g OFICP) yuzasidagi suv tomchisining tasviri. Standart ogʻish bilan uchta oʻlchovning oʻrtacha qiymati, ustundagi bir xil harf Tukey testi (p &amp;lt; 0,05) boʻyicha oʻrtacha qiymatlar oʻrtasida sezilarli farq yoʻqligini koʻrsatadi.&lt;/p&gt;\n&lt;p&gt;Kontakt burchagi plyonkalarning sirt namlanuvchanligi haqida tushuncha beradi. Kichikroq burchaklar (&amp;lt; 90°) yuqori namlanuvchanlikni, kattaroq burchaklar (&amp;gt; 90°) esa koʻproq gidrofobik sirtni bildiradi. Ushbu tadqiqotdagi barcha plyonkalar 90° dan past kontakt burchaklariga ega edi, bu ularning gidrofil tabiatini tasdiqlaydi. Ular orasida faqat nazorat plyonkasi sezilarli darajada yuqori kontakt burchagini (p &amp;lt; 0,05) koʻrsatdi, bu aralash tarkiblarga nisbatan kamroq namlanadigan sirtni bildiradi. Bu natijalar oldingi tadqiqotlarga mos keladi: pH ishlovi boʻlmagan kraxmal/OFICP plyonkalari uchun 26,94° kontakt burchagi qiymatlari haqida xabar berilgan, 30% (m/m) glitserin oʻz ichiga olgan OFICP–agar plyonkalari uchun esa 26,40° qiymatlari kuzatilgan. Qizigʻi shundaki, pH ni sozlash namlanuvchanlikka kuchli taʼsir qilishi mumkinligi ham koʻrsatilgan, pH 12 da ishlov berilgan kraxmal/OFICP plyonkalari uchun 70,85° kontakt burchagi haqida xabar berilgan. Bu shuni koʻrsatadiki, OFICP ning pH modifikatsiyasi kelajakdagi tarkiblarda sirt gidrofobligini sozlash uchun istiqbolli strategiya boʻlishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"plyonkalar-xiraligi-va-rangi\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#plyonkalar-xiraligi-va-rangi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plyonkalar xiraligi va rangi&lt;/span&gt;&lt;/a&gt;Plyonkalar xiraligi va rangi&lt;/h4&gt;\n&lt;p&gt;Plyonka qalinligi ularning umumiy samaradorligini belgilashda hal qiluvchi rol o‘ynaydi va mexanik mustahkamlik, to‘siq samaradorligi va ishlov berish qulayligi kabi xususiyatlarga sezilarli ta’sir ko‘rsatadi. 1-rasmda ishlab chiqilgan plyonkalarning qalinligi va mexanik xususiyatlari ko‘rsatilgan. 1a-rasmda ko‘rsatilganidek, aralashmalarda pektin miqdorining oshishi qalinroq plyonkalarning hosil bo‘lishiga olib keldi, qalinlik qiymatlari F1 formulasi uchun 0,137 mm dan F4 uchun 0,177 mm gacha o‘zgardi. Bu tendensiya quruq moddalar miqdorining oshishi tufayli kutilgan edi.&lt;/p&gt;\n&lt;h4 id=\"mexanik-xususiyatlar\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#mexanik-xususiyatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mexanik xususiyatlar&lt;/span&gt;&lt;/a&gt;Mexanik xususiyatlar&lt;/h4&gt;\n&lt;p&gt;OFICP qo‘shilmagan 2 g pektinni o‘z ichiga olgan nazorat formulasi biologik parchalanadigan plyonkalar xususiyatlariga kladod kukunining ta’sirini baholash uchun mos yozuvlar plyonkasi sifatida ishlatilgan. Uzilishga chidamlilik (1b-rasm) bo‘yicha nazorat plyonkasi (C) eng yuqori qiymatni (15,23 MPa) ko‘rsatdi va barcha boshqa formulalardan sezilarli darajada ustun keldi. Aksincha, OFICP/pektin plyonkalarining uzilishga chidamliligi F1 (2,62 MPa) dan F3 (8,69 MPa) gacha bosqichma-bosqich oshdi, F3 va F4 o‘rtasida sezilarli farq kuzatilmadi. Bu plato pektinning mustahkamlovchi ta’siri ma’lum bir konsentratsiyadan keyin to‘yinish nuqtasiga yetishi mumkinligini, shundan so‘ng uzilishga chidamlilikning keyingi o‘sishi kuzatilmasligini anglatadi. *C = nazorat plyonkasi (2 g pektin); F1 = (0,5 g pektin + 2 g OFICP), F2 = (1,0 g pektin + 2 g OFICP), F3 = (1,5 g pektin + 2 g OFICP), F4 = (2 g pektin + 2 g OFICP). Oldingi tadqiqotlar bilan solishtirganda, hozirgi natijalar sezilarli yaxshilanishni ko‘rsatadi. De Farias va boshqalar kraxmal va OFICP dan tashkil topgan plyonkalar uchun pastroq uzilishga chidamlilikni (3,0 MPa) xabar qilishgan, Makhloufi va boshqalar esa agar, OFICP va 30% glitserinni (m/m) o‘z ichiga olgan plyonkalar uchun 6,7 MPa qiymatini kuzatishgan. Ushbu taqqoslashlar kaktus asosidagi plyonkalarning uzilishga chidamliligini sezilarli darajada oshirish uchun o‘rtacha pektin konsentratsiyasining salohiyatini ta’kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazorat plyonkasi maksimal mustahkamlikka (15,23 MPa), lekin minimal elastiklikka (1,86%) ega, OFICP qo‘shilishi esa plyonkalar egiluvchanligini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Plyonkalarning mexanik xususiyatlari uzilishga chidamlilik va cho‘zilish o‘rtasidagi odatiy kelishuvni ochib berdi. Nazorat plyonkasi eng yuqori uzilishga chidamlilikni ko‘rsatdi, bu uning sinishdan oldin katta kuchga bardosh bera olishini anglatadi. Biroq, u eng past cho‘zilish ko‘rsatkichini (1,86%) ham ko‘rsatdi, bu cheklangan egiluvchanlikka ega qattiq va mo‘rt tuzilmani bildiradi. Aksincha, F1 va F2 formulalari sezilarli darajada pastroq uzilishga chidamlilikni, lekin yuqoriroq cho‘zilish qiymatlarini (mos ravishda 10,30% va 12,46%) ko‘rsatdi, bu esa ko‘proq elastik va plastik tabiatni aks ettiradi. Natijada, garchi bu plyonkalar kuchli kuch ta’sirida yirtilishga ko‘proq moyil bo‘lsa-da, ular mexanik stressga moslashish va cho‘zilish qobiliyatiga ega. Ushbu topilmalar biologik parchalanadigan plyonkalarni ishlab chiqishda mustahkamlik va egiluvchanlik o‘rtasidagi muvozanatni modulyatsiya qilishda OFICP ning ko‘p funksiyali rolini ta’kidlaydi: nazorat plyonkasi chidamliroq, lekin mo‘rt, F2 plyonkasi esa kamroq chidamli, lekin egiluvchanroq.&lt;/p&gt;\n&lt;h4 id=\"termik-barqarorlik\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#termik-barqarorlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Termik barqarorlik&lt;/span&gt;&lt;/a&gt;Termik barqarorlik&lt;/h4&gt;\n&lt;p&gt;Degradatsiyani baholash. Plyonkaning parchalanish xulq-atvori ham tuproq, ham dengiz sharoitida baholandi. Turli formulalarning parchalanish xulq-atvori vaqt o‘tishi bilan namunalarni vizual tekshirish orqali sifat jihatidan baholandi. Tuproq zarralarining plyonka yuzalariga kuchli yopishishi tufayli vazn yo‘qotish o‘lchovlarini amalga oshirish imkonsiz edi; shuning uchun vizual tahlil degradatsiya jarayonini kuzatishning asosiy usuli sifatida qabul qilindi. Plyonkalar tuzilishi vaqt o‘tishi bilan asta-sekin yemirilgan (SN4-rasm). Sinovning oltinchi kuniga kelib, barcha plyonka namunalari rang va strukturaviy yaxlitlikda sezilarli o‘zgarishlarga uchradi, bu polimer degradatsiyasining boshlanishini ko‘rsatadi. Bu jarayon asosan atrof-muhit namligi va harorati bilan boshqariladigan ko‘rinadi, ular plyonkaning shishishiga va keyinchalik parchalanishiga olib keladi. 12-kunga kelib, F1 va F2 plyonkalari deyarli butunlay parchalanib ketdi, pektin miqdori yuqori bo‘lgan formulalar esa parchalanishga ko‘proq qarshilik ko‘rsatdi. Bu hodisani Opuntia ficus-indica kladod kukunining suvga yuqori yaqinligi bilan izohlash mumkin: gidrofil xarakterga ega plyonkalar namlik va mikroorganizmlarning ularning tuzilishiga osonroq kirib borishiga imkon beradi, natijada parchalanish jarayoni tezlashadi. 28-kunga kelib, barcha formulalar keng ko‘lamli parchalanishga uchradi va qolgan plyonka qoldiqlari atrof-muhitdagi tuproqdan vizual ravishda farqlanmay qoldi. Bu parchalanish odatdagi plastik qadoqlash uchun kuzatiladiganidan sezilarli darajada tezroq sodir bo‘ldi. Ushbu natijalar Mannai va boshqalar hamda López-Díaz va boshqalarning oldingi topilmalari bilan mos keladi, ular mos ravishda tuproq va organik kompostda 28–40 kun ichida Opuntia ficus-indica va pitaya (Hylocereus undatus) dan tayyorlangan shilimshiq asosidagi plyonkalarning shunday tez parchalanishi haqida xabar berishgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Degradatsiyani baholash vizual tarzda amalga oshirildi; parchalanish kinetikasini aniq belgilash uchun miqdoriy usullar (masalan, CO₂ ajralib chiqishini o‘lchash) talab qilinadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Simulyatsiya qilingan dengiz degradatsiyasi testida barcha plyonka namunalari 2 soat 55 daqiqa ichida to‘liq parchalanib ketdi. Bu tez degradatsiya plyonka matritsasida, ayniqsa OFICP va pektinda mavjud bo‘lgan polimerlarning gidrofil tabiatini hisobga olgan holda kutilgan edi. Garchi bu natijalar atrof-muhitga mos sharoitlarda degradatsiyaning sifat dalillarini taqdim etsa-da, degradatsiya kinetikasini aniq belgilash va an’anaviy materiallar bilan kengroq taqqoslashni ta’minlash uchun standartlashtirilgan usullardan (masalan, nazorat qilinadigan kompostlashda massa yo‘qotilishi, CO₂ ajralib chiqishi yoki ASTM/ISO biologik parchalanish testlari) foydalangan holda miqdoriy tahlillar zarur bo‘ladi.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Ushbu tadqiqotda Opuntia ficus-indica kladodiyalari kukuni va pektin asosida biologik parchalanadigan plyonkalar muvaffaqiyatli ishlab chiqildi va tavsiflandi, bu barqaror qadoqlash ilovalari uchun tabiiy makromolekulalar, xususan polisaxaridlarning ahamiyatini ta'kidlaydi. Natijalar shuni ko'rsatadiki, Opuntia ficus-indica kladodiyalari kukuni (OFICP) va pektin kombinatsiyasi mos mexanik ko'rsatkichlarga, yaxshi termal barqarorlikka hamda tuproq va dengiz sharoitlarida samarali biologik parchalanuvchanlikka ega plyonkalarni hosil qiladi. Ta'kidlash joizki, pektin miqdorining oshishi plyonkaning bir qator xususiyatlarini yaxshiladi, bunda F3 va F4 tarkiblari barcha baholashlar bo'yicha eng muvozanatli natijalarni ko'rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;F3 va F4 tarkiblari mexanik va termal xususiyatlarning eng yaxshi muvozanatini ko'rsatdi, bu ularni namligi past mahsulotlarni qadoqlash uchun istiqbolli qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O'zining gidrofil tabiati va fizik-kimyoviy xususiyatlari tufayli, ushbu plyonkalar biologik parchalanadigan qadoqlash tizimlarida va tegishli sohalarda, ayniqsa namligi past mahsulotlar uchun potentsial foydalanish imkoniyatiga ega. Shunga qaramay, ularning oziq-ovqat mahsulotlarini qadoqlash uchun yaroqliligini tasdiqlash uchun haqiqiy oziq-ovqat modellari va saqlash sharoitlarini o'z ichiga olgan qo'shimcha tadqiqotlar zarur. Bundan tashqari, Opuntia ficus-indica butun kladodiyalari kabi kam foydalaniladigan polisaxaridlarni tijorat pektini bilan birgalikda qo'llash potentsial ekologik foyda keltiradigan barqaror biomateriallarni ishlab chiqish uchun istiqbolli strategiyadir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu natijalar laboratoriya sharoitida olingan; plyonkalarning oziq-ovqat qadoqlash uchun yaroqliligini tasdiqlash uchun haqiqiy oziq-ovqat mahsulotlari bilan sinovlar o'tkazish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;Materiallar va usullar qoʻshimcha materiallar sifatida taqdim etilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f1.jpg\" alt=\"(a) Qalinlik, (b) choʻzilish kuchi va (c) OFICP/pektin asosidagi plyonkalarning uzilishdagi nisbiy uzayishi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Qalinlik, (b) choʻzilish kuchi va (c) OFICP/pektin asosidagi plyonkalarning uzilishdagi nisbiy uzayishi&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and-f2.jpg\" alt=\"(a) Plyonkalar va (b) xomashyoning infraqizil spektroskopiyasi (FTIR); hamda (c) plyonkalar va (d) xomashyoning rentgen \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Plyonkalar va (b) xomashyoning infraqizil spektroskopiyasi (FTIR); hamda (c) plyonkalar va (d) xomashyoning rentgen nurlari difraksiyasi (XRD) namunalari&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Plastik bilan&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;atrof-muhit&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-w
