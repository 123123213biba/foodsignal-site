            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"132\" cy=\"147\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"568\" cy=\"236\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · EMULSIFIERS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Muzqaymoqda gialuron&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kislotasi: molekulyar&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;og'irlik teksturani qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o'zgartiradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f1.jpg\" alt=\"Muzqaymoq aralashmasi va muzqaymoq ishlab chiqarish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Muzqaymoq aralashmasi va muzqaymoq ishlab chiqarish.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar turli molekulyar og'irlikdagi gialuron kislotasining (GK) muzqaymoq xususiyatlariga ta'sirini o'rgandilar. 1550 va 2550 kDa massali polimerlar aralashmaning barqarorligi va qovushqoqligini sezilarli darajada yaxshilashi aniqlandi. GK emulgatorlarni to'liq almashtirmasa-da, u teksturali desertlar yaratish uchun yangi imkoniyatlar ochadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Yuqori molekulyar GK (1550 kDa dan) qovushqoqlikni oshiradi.&lt;/li&gt;\n&lt;li&gt;GK namlikni ushlab turadi va emulsiya qatlamlanishini oldini oladi.&lt;/li&gt;\n&lt;li&gt;GK erish tezligiga ta'sir qiladi, lekin hajmga ta'sir etmaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tajribada 0,3% konsentratsiyadagi 320, 980, 1550 va 2550 kDa molekulyar og'irlikka ega gialuron kislotasi ishlatildi. Namunalar sanoat stabilizatorlari (guar saqichi, karragen, mono- va diglitseridlar) bo'lgan nazorat aralashmasi bilan solishtirildi. 4°C haroratda o'tkazilgan reologik testlar GK molekulyar og'irligi oshishi bilan aralashmaning to'planish moduli (G'), yo'qotish moduli (G'') va qovushqoqligi ortishini ko'rsatdi.&lt;/p&gt;\n&lt;p&gt;Barqarorlik tahlili shuni ko'rsatdiki, yuqori molekulyar GK (1550–2550 kDa) 4°C haroratda 21 kun davomida saqlashda krem hosil bo'lish indeksini (Creaming Index) samarali pasaytiradi. Shu bilan birga, yuqori molekulyar massali namunalarning erish tezligi nazorat namunasiga qaraganda yuqori bo'ldi. GK bo'lgan barcha namunalarda qo'shimcha emulgatorlar bo'lmaganligi sababli, natijalar polimerning funksionalligini baholash uchun juda muhimdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sanoat emulgatorlarini to'liq almashtirish imkoniyatini isbotlamaydi, chunki nazorat namunasi boshqacha tarkibga ega edi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Muzqaymoq dunyodagi eng mashhur sutli desertlardan biri boʻlib, oʻzining silliq teksturasi, boy taʼmi va tetiklantiruvchi xususiyatlari bilan qadrlanadi. Keng isteʼmol qilinishiga qaramay, yuqori sifatli muzqaymoq ishlab chiqarish bir qator texnik qiyinchiliklarni keltirib chiqaradi. Ulardan biri — saqlash muddati davomida barqaror struktura, maqbul tekstura va doimiy sensor xususiyatlarni saqlab qolishdir. Bu mahsulotning murakkab tabiati, yaʼni havo katakchalari, yogʻ globulalari, muz kristallari va uzluksiz suv fazasini oʻz ichiga olgan qisman muzlatilgan emulsiya ekanligi bilan bogʻliq. Retseptura muzning qayta kristallanishini, erish jarayonini va muzlatish, saqlash hamda tarqatish davridagi strukturaviy barqarorlikni nazorat qilish uchun ehtiyotkorlik bilan ishlab chiqilishi kerak. Ushbu muammolarni hal qilish uchun muzqaymoq tarkibiga namlik migratsiyasini nazorat qilish, muzning qayta kristallanishini toʻxtatish va umumiy teksturani yaxshilash uchun polisaxarid asosidagi stabilizatorlar qoʻshiladi. Guar gumi, karragenan, rovon daraxti gumi va karboksimetilsellyuloza (KMS) kabi keng qoʻllaniladigan stabilizatorlar qovushqoqlikni va muzlatish-eritish barqarorligini yaxshilashi koʻrsatilgan. Biroq, ularning konsentratsiyasi va boshqa ingredientlar bilan oʻzaro taʼsiriga qarab, bu stabilizatorlar ortiqcha yopishqoqlik kabi istalmagan tekstura xususiyatlarini keltirib chiqarishi mumkin. Bu esa, kerakli sensor xususiyatlarni saqlab qolgan holda yaxshilangan funksionallikni taʼminlay oladigan muqobil polisaxaridlarga qiziqishni oshirdi.&lt;/p&gt;\n&lt;p&gt;Gigiyena kislotasi (GK) oʻzining suvni bogʻlash qobiliyati yuqori boʻlganligi sababli oziq-ovqat tizimlarida potensial funksional ingredient sifatida oʻrganilgan. Sut (Joshi va boshq., 2024; Sutariya va Salunke, 2022, 2023) va qayta ishlangan pishloq (Joshi va boshq., 2025) kabi sut mahsulotlarida GK suvni ushlab turish qobiliyatini oshirishi va strukturaviy xususiyatlarga taʼsir qilishi qayd etilgan. Oldingi tadqiqotlar (Joshi va boshq., 2024; Sutariya va Salunke, 2022) GK sut tizimlarida emulsiya barqarorligi va oqsil oʻzaro taʼsirini yaxshilashi mumkinligini koʻrsatgan. GK — bu β-1,4-D-glyukuron kislotasi va β-1,3-N-asetil-D-glyukozaminning takrorlanuvchi disaxarid birliklaridan tashkil topgan tabiiy chiziqli polisaxariddir. Uning tuzilishi yuqori manfiy zaryad zichligini beradi, bu esa katta miqdordagi suvni bogʻlash va qovushqoq tizimlarni hosil qilish imkonini beradi. GKning yana bir muhim xususiyati shundaki, uning funksionalligi molekulyar ogʻirlikka (MO) bogʻliq. Tijoriy GK bir necha kilo-Daltondan 3000 kDa dan ortiqgacha boʻlgan keng MO diapazonida mavjud boʻlib, yuqori MO ga ega GK odatda yuqori qovushqoqlik va yaqqolroq viskoelastik xatti-harakatlar bilan bogʻliq, past MO ga ega GK esa cheklangan strukturaviy hissa qoʻshadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yuqori molekulyar ogʻirlikka ega (≥ 980 kDa) gigiyena kislotasi suvni bogʻlash qobiliyati va qovushqoqlikni oshirish orqali sut tizimlarining barqarorligini yaxshilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Viskoelastiklik — materialning ham qattiq jism (elastiklik), ham suyuqlik (qovushqoqlik) xususiyatlarini namoyon etish qobiliyati boʻlib, muzqaymoqning «tana» tuzilishi uchun muhimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hozirgi vaqtda AQSh Oziq-ovqat va farmatsevtika idorasi (FDA) GKni barcha oziq-ovqat toifalari uchun umumiy oziq-ovqat qoʻshimchasi sifatida tasdiqlamagan. Biroq, GK Yaponiya, Janubiy Koreya, Xitoy va Yevropa Ittifoqining ayrim qismlarini oʻz ichiga olgan bir qancha boshqa hududlarda oziq-ovqat va funksional mahsulotlarda foydalanish uchun tasdiqlangan. Shuning uchun, ushbu tadqiqot anʼanaviy stabilizator-emulgator tizimlarini toʻliq almashtirishni bevosita koʻrsatishdan koʻra, GKning turli molekulyar ogʻirliklarining stabilizatsiya qiluvchi ingredient sifatida foydalanilganda muzqaymoqning fizik-kimyoviy, reologik va tekstura xususiyatlariga taʼsirini baholashga qaratilgan.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot anʼanaviy stabilizatorlarni almashtirib, muzqaymoq ishlab chiqarishda GKning turli MO (320 kDa, 980 kDa, 1550 kDa va 2550 kDa) taʼsirini baholashga qaratilgan. Nazorat namunasi (IC-C) standart stabilizator aralashmasini (0,3%) oʻz ichiga olgan. IC-1, IC-2, IC-3 va IC-4 namunalari 0,3% GKni oʻz ichiga olgan.&lt;/p&gt;\n&lt;p&gt;Asosiy aralashma 33,92% qaymoq, 41,8% yogʻsizlantirilgan sut, 5,89% yogʻsiz quruq sut (YQS), 14,8% shakar va 3,29% quruq makkajoʻxori siropidan iborat boʻlgan. Nazorat partiyasida 0,3% tijoriy stabilizator (guar gumi, mono- va diglitseridlar, rovon daraxti gumi, karragenan va polisorbat 80 aralashmasi) qoʻshilgan, davolash partiyalarida esa GK (0,3%) emulgatorlarsiz ishlatilgan. Yakuniy tarkib: 12,2% yogʻ, 4,1% oqsil, 11,2% YQS va 41,8% umumiy quruq moddalar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazorat namunasi emulgatorlarni oʻz ichiga olgan, GK namunalari esa yoʻq. Xususiyatlardagi farqlar ham stabilizator turi, ham tajriba guruhlarida emulgatorlarning yoʻqligi bilan bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ingredientlar termomikserda aralashtirilgan (10 daqiqa, 3-tezlik, oxirgi 60 soniyada 5-tezlik). Aralashma 85°C da 20 soniya davomida pasterizatsiya qilingan, soʻngra 4°C da bir kecha (12–16 soat) davomida yetiltirilgan. Muzqaymoq 15 daqiqa davomida muzlatgichda tayyorlangan va -20°C da 24 soat davomida qotirilgan.&lt;/p&gt;\n&lt;p&gt;Krem hosil boʻlish barqarorligi (CI) saqlash davridagi (4°C, 21 kun) faza ajralishi indeksi boʻyicha aniqlangan. Reologik xususiyatlar (toʻplanish moduli G', yoʻqotish moduli G'', qovushqoqlik) reometr yordamida 4°C da 0,1–62,8 rad/s burchak chastotasi oraligʻida oʻlchangan.&lt;/p&gt;\n&lt;p&gt;Koʻpiklanish (overrun) aralashma va tayyor mahsulot ogʻirligi oʻrtasidagi farq boʻyicha hisoblangan. Qattiqlik va yopishqoqlik penetratsiya usuli (chuqurligi 3 mm, harorati -20°C) yordamida oʻlchangan. Erish tezligi 25°C da 3 soat davomida namunaning (100 g) massa yoʻqotishi boʻyicha aniqlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koʻpiklanish (overrun) — muzqaymoq tarkibiga kiritilgan havo hajmi koʻrsatkichi; qiymat qanchalik yuqori boʻlsa, mahsulot shunchalik «yengil» boʻladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nazorat va IC-1 (320 kDa) namunalari pastroq qovushqoqlikka ega boʻlgan va yetilish davrida faza ajralishi belgilarini koʻrsatgan, yuqori MO ga ega GK namunalari esa barqaror boʻlgan.&lt;/p&gt;\n&lt;p&gt;Barcha namunalar 21 kun davomida CI oʻsishini koʻrsatgan. Nazorat va IC-1 eng yuqori CI (&amp;gt;40%) qiymatlariga ega boʻlib, bu beqarorlikdan dalolat beradi. 1550 kDa va 2550 kDa GK namunalari minimal faza ajralishini koʻrsatgan.&lt;/p&gt;\n&lt;p&gt;Toʻgʻridan-toʻgʻri bogʻliqlik kuzatilgan: GK MO ortishi bilan G', G'' va koʻrinadigan qovushqoqlik ortgan. ICM-4 (2550 kDa) namunasi eng yuqori qovushqoqlik va oqimga qarshilikni koʻrsatgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yuqori MO ga ega GK (2550 kDa) aralashmaning eng barqaror va qovushqoq strukturasini taʼminlaydi, bu esa qatlamlanishga qarshi yaxshi chidamlilik bilan bogʻliq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Namunalar oʻrtasida sezilarli farqlar (p &amp;gt; 0,05) aniqlanmagan (29,20–30,86% oraligʻida). GK qoʻshilishi havoning kirishiga toʻsqinlik qilmagan.&lt;/p&gt;\n&lt;p&gt;GK ≥ 980 kDa boʻlgan namunalar nazorat va IC-1 ga qaraganda sezilarli darajada qattiqroq boʻlgan. Namunalar oʻrtasida yopishqoqlik boʻyicha farqlar aniqlanmagan.&lt;/p&gt;\n&lt;p&gt;GK 1550 kDa va 2550 kDa boʻlgan namunalar nazorat va IC-1 ga qaraganda sekinroq erigan, bu strukturaviy termobardoshlik yaxshiroq ekanligini koʻrsatadi.&lt;/p&gt;\n&lt;p&gt;GK (MO ≥ 980 kDa) muzqaymoqning qattiqligi, qovushqoqligi, emulsiya barqarorligi va termobardoshligini yaxshilaydi. Biroq, tajriba namunalarida emulgatorlar yoʻqligi sababli, natijalar anʼanaviy tizimlarga toʻliq ekvivalentlikni anglatmaydi. Mikrotuzilmaviy va sensor tahlillarni hisobga olgan holda qoʻshimcha tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;p&gt;Gigiyena kislotasi (ayniqsa 1550 va 2550 kDa) muzqaymoq uchun istiqbolli struktura hosil qiluvchi ingredient boʻlib, fizik-kimyoviy xususiyatlarni yaxshilaydi. Anʼanaviy stabilizator-emulgator tizimlarini toʻliq almashtirish uchun solishtirma retsepturalar bilan qoʻshimcha tadqiqotlar oʻtkazish zarur.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f1.jpg\" alt=\"Muzqaymoq aralashmasi va muzqaymoq ishlab chiqarish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Muzqaymoq aralashmasi va muzqaymoq ishlab chiqarish.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f2.jpg\" alt=\"4°C haroratda 21 kun saqlanganidan soʻng, turli molekulyar ogʻirlikdagi gialuron kislotasi qoʻshilgan muzqaymoq aralashm\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4°C haroratda 21 kun saqlanganidan soʻng, turli molekulyar ogʻirlikdagi gialuron kislotasi qoʻshilgan muzqaymoq aralashmasi namunalarining krem hosil qilish indeksi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f3.jpg\" alt=\"Turli molekulyar ogʻirlikdagi gialuron kislotasining muzqaymoq aralashmasi namunalarining yoʻqotish moduliga (G'': Pa) t\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli molekulyar ogʻirlikdagi gialuron kislotasining muzqaymoq aralashmasi namunalarining yoʻqotish moduliga (G'': Pa) taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f4.jpg\" alt=\"Turli molekulyar ogʻirlikdagi gialuron kislotasining muzqaymoq aralashmasi namunalarining saqlash moduliga (G': Pa) taʼs\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli molekulyar ogʻirlikdagi gialuron kislotasining muzqaymoq aralashmasi namunalarining saqlash moduliga (G': Pa) taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f5.jpg\" alt=\"Turli molekulyar ogʻirlikdagi gialuron kislotasining muzqaymoq aralashmasi namunalarining qovushqoqligiga (mPa·s) taʼsir\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli molekulyar ogʻirlikdagi gialuron kislotasining muzqaymoq aralashmasi namunalarining qovushqoqligiga (mPa·s) taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f6.jpg\" alt=\"Turli molekulyar ogʻirlikka ega gialuron kislotasining muzqaymoq namunalarining koʻpirtirilishiga taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli molekulyar ogʻirlikka ega gialuron kislotasining muzqaymoq namunalarining koʻpirtirilishiga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f7.jpg\" alt=\"Turli molekulyar ogʻirlikka ega gialuron kislotasining muzqaymoq namunalarining qattiqligiga taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli molekulyar ogʻirlikka ega gialuron kislotasining muzqaymoq namunalarining qattiqligiga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f8.jpg\" alt=\"Turli molekulyar ogʻirlikka ega gialuron kislotasining muzqaymoq namunalarining yopishqoqligiga taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli molekulyar ogʻirlikka ega gialuron kislotasining muzqaymoq namunalarining yopishqoqligiga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f9.jpg\" alt=\"Turli molekulyar ogʻirlikka ega gialuron kislotasining muzqaymoq namunalarining erish tezligiga (g/min) taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Turli molekulyar ogʻirlikka ega gialuron kislotasining muzqaymoq namunalarining erish tezligiga (g/min) taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Muzqaymoq&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tuzilishining&lt;/text&gt;&lt;
