            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"205\" cy=\"135\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"535\" cy=\"265\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · MICRONUTRIENTS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Jigar yog'lanishi: nima&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;uchun kasallanish holatlari&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;30 yilda ikki baravar oshdi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f1.jpg\" alt=\"NAJBP kasallanish koʻrsatkichlarining global oʻsishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;NAJBP kasallanish koʻrsatkichlarining global oʻsishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;NAJBP kasallanish koʻrsatkichlarining global oʻsishi. (A) 1990-yildan 2021-yilgacha boʻlgan davrda 5 ta SDI mintaqasi boʻyicha NAJBP bilan bogʻliq oʻlim ulushining har bir mintaqadagi aholi ulushiga nisbatan oʻzgarishi. (B) 1990-yildan 2021-yilgacha boʻlgan davrda SDI kvintillari boʻyicha NAJBP kasallanish koʻrsatkichlari tendensiyalari. &lt;a href=\"concepts/aerobic-plate-count.html\"&gt;APC&lt;/a&gt; = yosh-davr-kogorta, NAJBP = alkogolsiz yogʻli jigar kasalligi, SDI = ijtimoiy-demografik indeks.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;1990-yildan 2021-yilgacha alkogolsiz yog'li jigar kasalligi (AYJK) bilan bog'liq yangi holatlar soni deyarli ikki baravar ko'paydi. 204 mamlakat ma'lumotlarini qamrab olgan tadqiqot shuni ko'rsatadiki, o'sish sur'atlari ayniqsa o'rta daromadli hududlarda yuqori. Kasallik endilikda yoshlar orasida ham keng tarqalmoqda.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;AYJK holatlari 1990-yildan 2021-yilgacha 24,9 milliondan 48,4 millionga yetdi.&lt;/li&gt;\n&lt;li&gt;Eng yuqori o'sish sur'ati 25–29 yoshdagi aholi qatlamida qayd etildi.&lt;/li&gt;\n&lt;li&gt;2021-yilda global ASIR ko'rsatkichi 100 000 kishiga 593,28 tani tashkil qildi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Global Burden of Disease 2021 ma'lumotlariga ko'ra, AYJK bilan bog'liq yangi holatlar 1990-yildagi 24,9 milliondan 2021-yilda 48,4 millionga yetdi. 2021-yilda yosh bo'yicha standartlashtirilgan kasallanish ko'rsatkichi (ASIR) har 100 000 aholiga 593,28 tani tashkil etdi. Tadqiqotchilar «yosh-davr-kogorta» (APC) modelidan foydalanib, demografik o'zgarishlar va vaqtinchalik tendensiyalarni ajratib ko'rsatishdi. Kasallanishning sof siljishi (net drift) yiliga 0,56% ni tashkil etdi.&lt;/p&gt;\n&lt;p&gt;Eng yuqori yillik o'sish (0,886%) 25–29 yoshlilar guruhida kuzatildi. 45 yoshgacha bo'lgan erkaklar xavf ostida bo'lsa, bu yoshdan keyin ayollar orasida kasallanish ko'rsatkichi oshadi. Yuqori daromadli mamlakatlarda 30–34 yoshlilar orasida o'sish sur'ati 1,415% ni tashkil qiladi. Bu ma'lumotlar kasallikning yosharib borayotganini va mehnatga layoqatli aholi uchun xavf tug'dirayotganini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot GBD 2021 modellashtirilgan baholariga asoslangan bo'lib, diagnostika usullaridagi mintaqaviy farqlarni to'liq qamrab olmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Nonalogolik yogʻli jigar kasalligi (NAJBK) butun dunyo boʻylab jigar surunkali kasalliklarining yetakchi sabablaridan biriga aylandi, bu asosan semizlik, 2-turdagi qandli diabet va metabolik sindrom koʻrsatkichlarining oʻsishi bilan bogʻliq. Soʻnggi oʻn yilliklarda ushbu kasalliklar tez surʼatlar bilan koʻpayishi natijasida NAJBK tarqalishi keskin oshdi va jamoat sogʻliqni saqlash tizimi oldiga jiddiy muammolarni qoʻydi. NAJBK nafaqat jigar sogʻligʻiga taʼsir qiladi, balki nonalogolik steatohepatit, sirroz va gepatotsellyulyar karsinoma kabi ogʻirroq holatlarga oʻtish xavfini ham tugʻdiradi. NAJBK tarqalishi keng oʻrganilgan boʻlsa-da, kasallanish darajasi boʻyicha maʼlumotlar kamligicha qolmoqda. Tarqalish boʻyicha tadqiqotlar kasallik yukini baholashga imkon beradi, ammo yangi holatlar paydo boʻlish tezligini qayd etmaydi. Kasallanish darajasi toʻgʻrisidagi maʼlumotlar kasallik tuzilishini tushunish, yangi tendensiyalarni aniqlash va jamoat sogʻliqni saqlash choralarining samaradorligini baholash uchun juda muhimdir. Ushbu maʼlumotlar, shuningdek, NAJBK bilan bogʻliq boʻlgan parhez va jismoniy faollik kabi aholi darajasidagi xavf omillaridagi oʻzgarishlarni ham aks ettiradi. Soʻnggi dalillar NAJBK rivojlanishi va kasallanishini kamaytirishda jamoat sogʻliqni saqlash strategiyalarining, jumladan, sanitariya-maʼrifiy ishlar, parhez boʻyicha maslahatlar va turmush tarzini oʻzgartirishning rolini taʼkidlaydi. Hamshiralar boshchiligidagi bemorlarni oʻqitish va turmush tarzini oʻzgartirishga qaratilgan tashabbuslar xavfni kamaytirish va rivojlanishni sekinlashtirishda istiqbolli ekanligini koʻrsatdi. Ushbu saʼy-harakatlar jamoat sogʻliqni saqlash dasturlari bilan birlashtirilganda, asosiy xavf omillariga taʼsir koʻrsatish orqali aholi salomatligi koʻrsatkichlarini sezilarli darajada yaxshilashi mumkin. Biroq, NAJBK kasallanishi boʻyicha tadqiqotlarning aksariyati mintaqaviy xususiyatga ega, bu esa global maʼlumotlarning parchalanishiga olib keladi. NAJBK kasallanishi boʻyicha kompleks uzoq muddatli maʼlumotlarning yoʻqligi iqtisodiy oʻzgarishlar va turmush tarzi oʻzgarishlari NAJBK kasallanishiga qanday taʼsir qilganini tushunishni qiyinlashtiradi. Ushbu tadqiqot 1990-yildan 2021-yilgacha 204 mamlakat va hududda «yosh-davr-kogorta» (APC) modelini qoʻllash orqali NAJBK kasallanish tendensiyalarini oʻrganish orqali ushbu boʻshliqni toʻldirishga qaratilgan. APC modeli yosh, davr va kogorta taʼsirini samarali ajratib beradi va kasallanish tendensiyalariga hissa qoʻshadigan omillar haqida qimmatli maʼlumotlarni taqdim etadi. Ushbu tahlil soʻnggi 3 oʻn yillikdagi NAJBK tendensiyalari boʻyicha kompleks qarashni taʼminlaydi va ushbu oʻsib borayotgan kasallik yuki bilan kurashish boʻyicha global jamoat sogʻliqni saqlash strategiyalarini xabardor qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NAJBK boʻyicha global kasallanish darajasi 30 yil ichida ikki barobardan koʻproqqa oshdi, bu esa faqat umumiy tarqalishga emas, balki yangi holatlar boʻyicha maʼlumotlarga asoslangan jamoat sogʻliqni saqlash strategiyalarini ishlab chiqishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotda Global Burden of Disease (GBD) 2021 maʼlumotlar bazasidan foydalanildi, u akademik nashrlar, kasalliklar reestrlari, uy xoʻjaliklari soʻrovlari va klinik maʼlumotlar kabi 100 000 dan ortiq manbalardan olingan maʼlumotlarni birlashtirib, global epidemiologiyaning har tomonlama vakilligini taʼminlaydi. Xususan, GBD 2021 maʼlumotlar bazasi standartlashtirilgan baholash tartib-qoidalari yordamida yosh guruhlari, jins va geografik joylashuv boʻyicha NAJBK kasallanishining modellashtirilgan baholarini taqdim etadi. NAJBK kasallik yuki baholari kasallikni modellashtirish meta-regressiyasining 2.1-versiyasi va fazoviy-vaqtinchalik Gauss jarayoni regressiya modellari yordamida yaratilgan boʻlib, ular Bayes tizimi orqali yosh guruhlari, jins va geografik mintaqalar boʻyicha oʻzgarishlarni hisobga oladi. Bundan tashqari, daromad, taʼlim va tugʻilish koeffitsiyentlarining kompozit oʻlchovi boʻlgan ijtimoiy-demografik indeks (SDI) mintaqalarni tabaqalashtirish va ijtimoiy-iqtisodiy rivojlanishning turli darajalaridagi tendensiyalarni baholash uchun ishlatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Meta-regressiya — bu turli xil manbalardan olingan maʼlumotlarni birlashtirib, ularning nomutanosibligini hisobga olgan holda yagona baholashni olishga imkon beradigan statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;NAJBK kasallanishining vaqtinchalik tendensiyalari barcha yosh guruhlari boʻyicha barcha yoshdagi kasallanish koʻrsatkichlari (AAIR) va yoshga qarab standartlashtirilgan kasallanish koʻrsatkichlari (ASIR)ni hisobga olgan holda, yoshga oid tendensiyalarga alohida eʼtibor qaratilgan holda baholandi. Kasallanish koʻrsatkichlari GBD 2021 da qoʻllaniladigan global aholi tuzilishiga asoslanib, 100 000 kishi-yil uchun yosh boʻyicha standartlashtirildi. Bundan tashqari, har bir yosh guruhidagi holatlar ulushini aniqlash va har qanday sezilarli oʻzgarishlarni kuzatish uchun kasallanishning taqsimlanishi 9 ta yosh toifasi (masalan, 15–19, 20–24, 25–29, …, 50–69, 70+ yosh) boʻyicha oʻrganildi.&lt;/p&gt;\n&lt;p&gt;NAJBK kasallanishiga vaqtinchalik va avlod taʼsirini baholash uchun biz APC modelidan foydalandik. Ushbu statistik yondashuv yosh, davr va kogorta taʼsirini ajratishga imkon beradi va vaqt oʻtishi bilan kasallanishni boshqaradigan dinamikani chuqurroq tushunishni taklif qiladi. APC modeli kasallik koʻrsatkichlarining umumiy yillik oʻzgarishini ifodalovchi «sof dreyf» (net drift) va kasallanishning yoshga oid oʻzgarishlarini aks ettiruvchi «mahalliy dreyf» (local drift)ni aniqlashga imkon beradi. Nisbiy xavflarni tahlil qilish orqali model vaqtinchalik va kogorta taʼsirining NAJBK kasallanishiga taʼsirini miqdoriy baholaydi, bunda &amp;gt;1 qiymatlar xavfning oshganligini, &amp;lt;1 qiymatlar esa xavfning kamayganligini koʻrsatadi. APC oʻzgaruvchilari oʻrtasidagi kollinearlik muammosini yumshatish uchun ichki baholash usuli (intrinsic estimator) ishlatilgan, bu ularning chiziqli bogʻliqligiga qaramay, ushbu taʼsirlarni mustaqil baholashni taʼminlaydi. APC tahlili GBD 2021 dan olingan NAJBK kasallanishi boʻyicha 16 ta yosh guruhi (15–19 dan 90–94 yoshgacha) va 1896–1904 dan 1996–2004 gacha boʻlgan 21 ta bir-birining ustiga chiqadigan tugʻilish kogortasini oʻz ichiga olgan maʼlumotlarni oʻz ichiga oladi. Model Milliy saraton instituti tomonidan taqdim etilgan veb-vosita orqali qoʻllanildi, vizualizatsiyalar R statistik dasturi (4.4.2-versiya; R Foundation for Statistical Computing) yordamida yaratildi. Statistik ahamiyatlilik P = 0,05 chegaraviy qiymati bilan ikki tomonlama testlar yordamida aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;APC modeli GBD 2021 modellashtirilgan maʼlumotlariga asoslangan; natijalar har bir bemorning bevosita klinik kuzatuvlarini emas, balki statistik baholarni aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-rasm A, B va 2-rasm, 1-jadval va S1-jadvalda (qoʻshimcha raqamli kontent 1) keltirilgan kasallanish maʼlumotlari aholi soni, umumiy holatlar soni, AAIR, ASIR va oʻrganilayotgan davr mobaynida kasallanish koʻrsatkichlarining sof dreyfini oʻz ichiga oladi. 1990-yildan 2021-yilgacha NAJBK boʻyicha global kasallanish 24 856 159 holatdan (95% ishonch oraligʻi [IO]: 22 579 697,49–27 333 109,87) 48 353 272 holatgacha (95% IO: 44 229 138,51–52 358 017,44) koʻtarildi. 2021-yilda ASIR 100 000 kishiga 593,28 ni tashkil etdi (95% IO: 542,72–643,7). Ushbu davrda APC modeli tomonidan NAJBK kasallanishining sof dreyfi 0,56 (95% IO: 0,53–0,6) darajasida baholandi.&lt;/p&gt;\n&lt;p&gt;Mintaqaviy darajada, oʻrtacha SDI ga ega hududlarda 2021-yilda NAJBK uchun eng yuqori AAIR kuzatildi — 100 000 kishiga 695 (95% IO: 635,18–752,12), past SDI ga ega mintaqalarda esa AAIR pastroq boʻldi — 100 000 kishiga 483 (95% IO: 434,72–535,87). Bundan tashqari, eng yuqori ASIR oʻrtacha SDI ga ega mintaqalarda qayd etildi — 656,97/100 000 (95% IO: 602,08–712,86), eng past ASIR (450,03/100 000; 95% IO: 412,2–488,43) esa yuqori SDI ga ega mintaqalarda kuzatildi. APC modeli boʻyicha sof dreyf prognozlari ushbu mintaqalarda qarama-qarshi tendensiyalarni aniqladi. Milliy darajada Xitoy 2021-yilda NAJBK kasallanishining eng koʻp sonini qayd etdi — 9 572 435,36 (95% IO: 8 788 951,07–10 377 517,46), undan keyin Hindiston (8 267 947,86; 95% IO: 7 485 362,61–9 068 568,69), Indoneziya (2 080 647; 95% IO: 1 898 615,39–2 275 132,87), Braziliya (1 545 088,94; 95% IO: 1 422 183,53–1 665 108,04) va AQSH (1 502 212,17; 95% IO: 1 374 518,06–1 626 330,09) turadi. Qatarda eng yuqori AAIR — 100 000 kishiga 1309,14 (95% IO: 1163,31–1470,03) kuzatildi, Daniyada esa eng past AAIR — 100 000 kishiga 341,52 (95% IO: 312,86–369,42) qayd etildi. 2021-yilda Misrda eng yuqori ASIR — 100 000 aholiga 1188,57 (95% IO: 1107,18–1268,67) kuzatildi, Finlandiyada esa eng past ASIR — 100 000 kishiga 310,17 (95% IO: 284,58–338,28) kuzatildi. Sof dreyf qiymatlari turlicha boʻldi: Sudanda eng yuqori qiymat 0,75 (95% IO: 0,69–0,8), Gruziyada esa eng past qiymat 0,12 (95% IO: 0,04–0,2) kuzatildi (2-rasm, S1-jadval, qoʻshimcha raqamli kontent 1 va S1-rasm, qoʻshimcha raqamli kontent 2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NAJBK boʻyicha global kasallanish 1990-yildagi 24,8 million holatdan 2021-yilda 48,3 million holatga koʻtarildi, bunda eng yuqori ASIR koʻrsatkichlari oʻrtacha ijtimoiy-demografik indeksga (SDI) ega mamlakatlarda kuzatilmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1990-yildan 2021-yilgacha barcha yosh guruhlarida NAJBK kasallanishining global oʻsishi 3A-rasmda koʻrsatilgan. Eng yuqori yillik oʻsish 0,886% (95% IO: 0,855%–0,917%) 25–29 yosh guruhida kuzatildi. 45–49 yosh guruhidan keyin kasallanishning oʻsishi asta-sekin sekinlashadi va 90–94 yosh guruhida eng kichik oʻsish 0,107% (95% IO: -0,394% dan 0,612% gacha) ga yetadi. Ushbu tendensiya yuqori va oʻrtacha SDI ga ega mintaqalarda izchil boʻlib, eng sezilarli oʻsish yuqori SDI ga ega mamlakatlarda 30–34 yosh guruhida yuz berdi va yillik oʻsish 1,415% (95% IO: 1,363%–1,467%) ni tashkil etdi. 15–19 yosh guruhi yuqori-oʻrtacha, past-oʻrtacha va past SDI ga ega mintaqalarda eng katta oʻsishni koʻrsatdi, shundan soʻng keyingi yosh guruhlarida asta-sekin pasayish kuzatildi. 45 yoshgacha boʻlgan erkaklarda kasallanish darajasi ayollarga qaraganda yuqori boʻlgan; ammo 45 yoshdan keyin bu holat teskari tomonga oʻzgardi. Yuqori SDI ga ega mamlakatlarda erkaklarda kasallanish darajasining oʻsishi ayollarga qaraganda kamroq boʻlgan, past-oʻrtacha va past SDI ga ega aholida esa sezilarli jinsiy farqlar kuzatilmagan.&lt;/p&gt;\n&lt;p&gt;3B-rasmda vaqt oʻtishi bilan NAJBK holatlarining yosh boʻyicha taqsimlanishidagi oʻzgarishlar tasvirlangan. 1990-yilda 30 yoshgacha boʻlgan shaxslar global NAJBK holatlarining yarmini tashkil etgan, eng yuqori ulush 20–24 yosh guruhiga toʻgʻri kelgan. 2021-yilga kelib, 50–69 yosh guruhida NAJBK kasallanishining sezilarli oʻsishi kuzatildi va bu guruh dunyo boʻylab eng keng tarqalgan guruhga aylandi. Ushbu holat yuqori, yuqori-oʻrtacha va oʻrtacha SDI ga ega mintaqalarda izchil kuzatildi, bunda eng sezilarli oʻsish 50–69 yosh guruhida yuz berdi. Aksincha, past va past-oʻrtacha SDI ga ega mintaqalarda yoshga oid tendensiyalarda kichik oʻzgarishlar kuzatildi. S2-rasm (qoʻshimcha raqamli kontent 3) turli mamlakatlarda yoshga oid NAJBK kasallanishi namunalarining har tomonlama sharhini taqdim etadi.&lt;/p&gt;\n&lt;p&gt;SDI kvinfillari boʻyicha guruhlangan NAJBK kasallanishiga APC taʼsiri tahlili 4-rasmda keltirilgan. Yoshga oid tendensiyalar yuqori SDI ga ega mintaqalar bundan mustasno, barcha SDI kvinfillari boʻyicha asosan oʻxshash boʻlgan. Global aholida NAJBK kasallanish koʻrsatkichlari 2 ta yosh taqsimoti choʻqqisini koʻrsatdi. Birinchi choʻqqi global miqyosda 20–24 yosh guruhida yuz berdi, yuqori SDI ga ega mintaqalarda esa u 15–19 yosh guruhiga oʻtdi, bu guruh eng yuqori kasallanish darajasiga ega edi. Ikkinchi choʻqqi 65–69 yosh guruhida kuzatildi, shundan soʻng yosh oshishi bilan pasayish va 90–94 yosh guruhida biroz oʻsish kuzatildi (4A-rasm). Jinsiy farqlar ham butun dunyo boʻylab yaqqol namoyon boʻldi, 50 yoshgacha boʻlgan erkaklarda kasallanish darajasi ayollarga qaraganda sezilarli darajada yuqori boʻldi, 50 yoshdan keyin esa tendensiya teskari tomonga oʻzgardi, ayollar yuqoriroq koʻrsatkichlarni koʻrsatdi, ayniqsa turli SDI mintaqalarida.&lt;/p&gt;\n&lt;p&gt;Global miqyosda davr taʼsiri vaqt oʻtishi bilan NAJBK xavfining doimiy oʻsishini koʻrsatdi (4B-rasm), bu barcha mintaqalar uchun xos boʻlgan holat. Yuqori-oʻrtacha va oʻrtacha SDI ga ega mintaqalar bundan mustasno, davr taʼsirida minimal jinsiy farqlar kuzatildi, bu mintaqalarda erkaklar ayollarga qaraganda yuqori kasallanish darajasini koʻrsatdi, ayniqsa 2003-yilgacha, bu mintaqaviy farqlarni taʼkidlaydi. Global miqyosda kogorta taʼsiri koʻproq yaqinda tugʻilgan kogortalarda NAJBK xavfining barqaror oʻsishini koʻrsatdi, eng yuqori xavf 2000-yilgi kogortada kuzatildi. Yuqori, yuqori-oʻrtacha, past-oʻrtacha va past SDI ga ega mintaqalarda oʻxshash tendensiyalar kuzatildi. Oʻrtacha SDI mintaqasida 1950-yilgacha tugʻilgan tugʻilish kogortalari nisbatan barqaror xavflarni koʻrsatdi, ammo 1950-yildan keyin tugʻilganlarda xavfning sezilarli oʻsishi kuzatildi, bu yoshroq yosh guruhlariga mos keladi (4C-rasm). 1950-yilgacha tugʻilgan kogortalar uchun erkaklarda kasallanish xavfi ayollarga qaraganda sezilarli darajada yuqori boʻlgan, ammo bu jinsiy farq keyingi kogortalarda kamaygan, oʻrtacha SDI mintaqalari bundan mustasno, u yerda erkaklar yuqori xavfga ega boʻlishda davom etgan. S3, S4 va S5-rasmlar (qoʻshimcha raqamli kontent 4) turli mamlakatlarda APC taʼsirining NAJBK kasallanishiga taʼsiri haqida qoʻshimcha maʼlumotlarni taqdim etadi.&lt;/p&gt;\n&lt;p&gt;NAJBK butun dunyo boʻylab jamoat sogʻliqni saqlashning asosiy muammosiga aylandi, birinchi navbatda semizlik va 2-turdagi qandli diabet kabi metabolik kasalliklar bilan bogʻliqligi sababli. Boshqa koʻplab jigar kasalliklaridan farqli oʻlaroq, NAJBK alkogol isteʼmoli bilan bevosita bogʻliq emas, bu uning davolash va profilaktikasini turmush tarzini oʻzgartirish va jamoat sogʻliqni saqlash aralashuvlariga qattiq bogʻliq qiladi. Kasallikning nonalogolik steatohepatit va sirroz kabi ogʻirroq shakllarga oʻtish salohiyati erta aniqlash va aralashuv zarurligini taʼkidlaydi. Tarqalish boʻyicha tadqiqotlar kasallik yukining maʼlum bir vaqtdagi holatini koʻrsatsa-da, kasallanish maʼlumotlari yangi holatlar paydo boʻlish tezligi haqida tushuncha beradi. Bu kasallik dinamikasini tushunish, yangi tendensiyalarni aniqlash va profilaktika choralarining samaradorligini baholash uchun juda muhimdir. NAJBK boʻyicha kompleks kasallanish maʼlumotlarining yoʻqligi uning epidemiologiyasini chuqur tushunishga va maqsadli jamoat sogʻliqni saqlash strategiyalarini ishlab chiqishga toʻsqinlik qildi. 1990-yildan 2021-yilgacha NAJBK boʻyicha global kasallanish ikki barobardan koʻproqqa oshdi — taxminan 24,9 million holatdan (95% IO: 22,6–27,3 million) 48,4 million holatgacha (95% IO: 44,2–52,4 million), bu bizning GBD 2021 maʼlumotlar bazasidan foydalangan holda oʻtkazilgan tadqiqotimizda xabar qilingan. ASIR ham oshdi, 2021-yilda ASIR 100 000 kishiga 593,28 ni (95% IO: 542,72–643,7) tashkil etdi, bu aholining qarishini hisobga olgandan keyin ham xavfning oshib borayotganini koʻrsatadi. Osiyo va Lotin Amerikasining qismlari kabi oʻrtacha SDI mintaqalari eng yuqori kasallik yukini koʻtaradi, bunda AAIR ham, ASIR ham Shimoliy Amerika va Yevropa kabi yuqori SDI mintaqalariga qaraganda yuqoriroqdir. Masalan, bizning topilmalarimizga koʻra, Xitoy 2021-yilda NAJBK kasallanishining eng koʻp sonini qayd etdi — 9,6 million (95% IO: 8,8–10,4 million), undan keyin Hindiston 8,3 million (95% IO: 7,5–9,1 million) bilan turadi. Milliy darajada Qatarda eng yuqori AAIR — 100 000 kishiga 1309,14 (95% IO: 1163,31–1470,03) kuzatildi, Misrda esa eng yuqori ASIR — 100 000 kishiga 1188,57 (95% IO: 1107,18–1268,67) kuzatildi, bu mintaqaviy farqlarni taʼkidlaydi.&lt;/p&gt;\n&lt;p&gt;Yoshga oid tendensiyalar shuni koʻrsatadiki, NAJBK kasallanishining global miqyosdagi eng yuqori oʻsishi 25–29 yosh guruhida yuz berdi, yillik oʻsish 0,886% (95% IO: 0,855%–0,917%) ni tashkil etdi, bu bizning natijalarimizda tasvirlangan. Vaqt oʻtishi bilan yosh taqsimotida sezilarli oʻzgarish yuz berdi, 50–69 yosh guruhi 2021-yilga kelib eng keng tarqalgan guruhga aylandi, 1990-yildagi 20–24 yosh kabi yoshroq guruhlarga qaraganda. Bir nechta omillar NAJBK kasallanishidagi kuzatilgan tendensiyalarga hissa qoʻshishi mumkin. Ular orasida semizlik va boshqa metabolik anomaliyalarning global oʻsishi muhim hissa qoʻshuvchi omil boʻlishi mumkin. Semizlik NAJBK uchun yaxshi tashkil etilgan xavf omilidir va 381 655 ishtirokchini oʻz ichiga olgan 21 ta kogorta tadqiqotining meta-tahlili shuni koʻrsatdiki, semizlik NAJBK rivojlanish xavfining 3,53 baravar yuqoriligi bilan bogʻliq, bunda BMI oshishi bilan xavf dozaga bogʻliq holda ortadi. Ushbu bogʻliqlikka muvofiq, global tizimli sharh va meta-tahlil ortiqcha vaznli va semiz aholi orasida NAJBK ning yuqori tarqalishini xabar qildi, birlashtirilgan baholar mos ravishda 69,99% va 75,27% ni tashkil etdi. Biroq, semizlik va NAJBK oʻrtasidagi bogʻliqlik mamlakatlar va aholi kichik guruhlari boʻylab bir xil boʻlishi dargumon. Global tahlillar soʻnggi oʻn yilliklarda ortiqcha vazn va semizlikning sezilarli darajada oshganini, mamlakatlar va aholi guruhlari boʻylab sezilarli darajada nomutanosiblikni koʻrsatdi. Semizlik epidemiyasining koʻlami va vaqtidagi bunday farqlar bizning tadqiqotimizda kuzatilgan NAJBK kasallanishining geografik va vaqtinchalik nomutanosibligiga qisman hissa qoʻshishi mumkin. Xususan, koʻplab oʻrtacha daromadli sharoitlarda tez urbanizatsiya, parhez oʻzgarishi va jismoniy faollikdagi oʻzgarishlar semizlikni keltirib chiqaruvchi muhitga taʼsirni oshirgan boʻlishi mumkin, bu esa oʻrtacha SDI mintaqalarida kuzatilgan nisbatan yuqori NAJBK kasallanishiga hissa qoʻshishi mumkin. Ijtimoiy-iqtisodiy sharoitlar aholi darajasidagi semizlik bilan bogʻliq xavf omillariga taʼsirni yanada kuchaytirishi mumkin, chunki 1,2 milliondan ortiq shaxsni oʻz ichiga olgan tizimli sharh va meta-tahlilda pastroq mahalla ijtimoiy-iqtisodiy maqomi ortiqcha vazn va semizlikning yuqori ehtimoli bilan bogʻliq boʻlgan. Shunga qaramay, bu munosabatlar murakkab va shuningdek, sogʻliqni saqlashga kirish imkoniyati, diagnostika qobiliyati, parhez modellari va boshqa metabolik xavf omillaridagi farqlar taʼsirida boʻlishi mumkin.&lt;/p&gt;\n&lt;p&gt;Yoshga oid namunalar kuzatilgan tendensiyalar haqida qoʻshimcha maʼlumot berishi mumkin. Bizning APC tahlilimizda NAJBK kasallanishining eng katta yillik oʻsishi 25–29 yoshdagi shaxslar orasida kuzatildi, shu bilan birga kasallik holatlarining ulushi keksa yosh guruhlariga oʻtdi, 50–69 yosh guruhi 2021-yilda 1990-yilga qaraganda kattaroq ulushni tashkil etdi. Katta istiqbolli kogorta tadqiqotidan olingan dalillar shuni koʻrsatadiki, erta voyaga yetgan davrda vazn ortishi NAJBK ning keyingi xavfi bilan sezilarli darajada bogʻliq, bu hayot davomida kümülatif adipoz taʼsirining potentsial ahamiyatini qoʻllab-quvvatlaydi. Shuning uchun bizning tadqiqotimizda koʻproq yaqinda tugʻilgan kogortalar orasida kuzatilgan ortib borayotgan xavf qisman ketma-ket avlodlar davomida tobora koʻproq semizlikni keltirib chiqaruvchi muhitga taʼsirni aks ettirishi mumkin. Biroq, semizlikni kuzatilgan namunalar uchun yetarli tushuntirish deb hisoblamaslik kerak, chunki NAJBK semiz boʻlmagan shaxslarda ham uchraydi va metabolik disfunktsiya, parhez omillari, jismoniy harakatsizlik, genetik moyillik va boshqa atrof-muhit determinantlari taʼsirida boʻlishi mumkin. Shuning uchun kuzatilgan geografik, yoshga oid va kogortaga oid namunalar semizlikning oʻzi emas, balki semizlik va boshqa oʻzaro taʼsir qiluvchi metabolik va atrof-muhit omillarining birgalikdagi taʼsirini aks ettirishi mumkin. APC modeliga asoslanib, 0,56%/yil (95% IO: 0,53%–0,60%) ijobiy sof dreyf oʻrganilayotgan davrda NAJBK kasallanishining umumiy oʻsishini koʻrsatadi. Kogorta taʼsiri ham koʻproq yaqinda tugʻilgan kogortalarda, ayniqsa 1950-yildan keyin tugʻilganlarda yuqori nisbiy xavflarni koʻrsatdi. Ushbu topilmalar ushbu kogortalar qarishi bilan NAJBK kasallanishi va uning metabolik xavf omillarini doimiy kuzatib borish muhimligini taʼkidlaydi. NAJBK ning oʻsib borayotgan yukini hal qilish uchun global konsensus bayonotida ilgari surilganidek, koʻp qirrali yondashuv zarur. Muvozanatli parhez va muntazam jismoniy faollikni oʻz ichiga olgan sogʻlom turmush tarzini targʻib qiluvchi jamoatchilik xabardorligi kampaniyalari muhim ahamiyatga ega. Masalan, toʻyingan yogʻ miqdori pastligi bilan mashhur boʻlgan Oʻrta yer dengizi parhezi NAJBK xavfini kamaytirishi koʻrsatilgan. Yuqori xavfli populyatsiyalarda, ayniqsa semizlik yoki diabet bilan kasallanganlarda tegishli xavfni baholash va erta aniqlash strategiyalarini amalga oshirish NAJBK ni erta aniqlash va boshqarishga yordam berishi mumkin. Semizlik, diabet va boshqa metabolik xavf omillarini boshqarish uchun moslashtirilgan dasturlar juda muhim, dalillar shuni koʻrsatadiki, vazn yoʻqotish NAJBK belgilarini yaxshilashi yoki qaytarishi mumkin, bu turmush tarzini oʻzgartirish muhimligini taʼkidlaydi. Sogʻlom oziq-ovqat muhitini targʻib qilish va jismoniy faollikni ragʻbatlantirish boʻyicha tartibga solish choralari, masalan, aerobik mashqlar bilan birlashtirilgan past glikemik indeksli Oʻrta yer dengizi parhezi NAJBK kasallanishini kamaytirishi mumkin. NAJBK kasallanishi va uning xavf omillarini doimiy monitoring qilish aralashuvlarning samaradorligini baholash va yangi tendensiyalarni aniqlash uchun muhimdir. Garchi bizning tadqiqotimiz qimmatli maʼlumotlarni taqdim etsa-da, bir nechta cheklovlarni tan olish kerak. Birinchidan, mamlakatlar boʻylab maʼlumotlarning mavjudligi, holatlarni aniqlash va diagnostika amaliyotidagi farqlar GBD baholarining taqqoslanishiga taʼsir qilishi mumkin va sogʻliqni saqlashga kirish imkoniyati va diagnostika qobiliyati cheklanganligi sababli past SDI mintaqalarida yetarli darajada tashxis qoʻyilmasligi koʻproq boʻlishi mumkin. Ikkinchidan, semizlik va boshqa metabolik xavf omillari NAJBK ga muhim hissa qoʻshsa-da, hozirgi tahlil semizlik tarqalishini yoki boshqa metabolik taʼsirlarni vaqt oʻtishi bilan oʻzgaruvchan tushuntiruvchi oʻzgaruvchilar sifatida kiritmadi. Shuning uchun ularning kuzatilgan vaqtinchalik, yoshga oid va kogortaga oid namunalarga mustaqil hissasi bevosita miqdoriy baholana olmadi. Shunga koʻra, bu yerda muhokama qilingan munosabatlar sabab-oqibat bogʻliqliklari emas, balki kontekstual tushuntirishlar sifatida talqin qilinishi kerak. Kelajakda mamlakatlar boʻylab semizlik, metabolik xavf omillari, turmush tarzi xususiyatlari va NAJBK kasallanishi boʻyicha uygʻunlashtirilgan maʼlumotlarni birlashtirgan kelajakdagi logitudinal tadqiqotlar NAJBK kasallanish tendensiyalaridagi kuzatilgan nomutanosiblikning asosiy mexanizmlarini aniqlashga yordam berishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Semizlik va NAJBK oʻrtasidagi kuzatilgan bogʻliqliklar korrelyatsion xususiyatga ega; tadqiqot barcha metabolik omillarni hisobga olmadi, shuning uchun sabablar haqidagi xulosalar kontekstualdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xulosa qilib aytganda, ushbu tadqiqot NAJBK ning global yukining ortib borayotganini, ayniqsa oʻrtacha daromadli mamlakatlarda, taʼkidlaydi va ushbu tendensiyaga hissa qoʻshgan asosiy yosh, davr va kogorta taʼsirini aniqlaydi. Natijalar NAJBK bilan bogʻliq boʻlgan oʻzgartirilishi mumkin boʻlgan xavf omillarini hal qilish va uning kasallanishini kamaytirish uchun yoʻnaltirilgan jamoat sogʻliqni saqlash strategiyalarini amalga oshirish muhimligini taʼkidlaydi. Kelgusi tadqiqotlar NAJBK ning tub sabablarini yanada oʻrganishi va ushbu oʻsib borayotgan jamoat sogʻliqni saqlash muammosining taʼsirini kamaytirishda profilaktika va terapevtik yondashuvlarning muvaffaqiyatini baholashi kerak.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f1.jpg\" alt=\"NAJBP kasallanish koʻrsatkichlarining global oʻsishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;NAJBP kasallanish koʻrsatkichlarining global oʻsishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;NAJBP kasallanish koʻrsatkichlarining global oʻsishi. (A) 1990-yildan 2021-yilgacha boʻlgan davrda 5 ta SDI mintaqasi boʻyicha NAJBP bilan bogʻliq oʻlim ulushining har bir mintaqadagi aholi ulushiga nisbatan oʻzgarishi. (B) 1990-yildan 2021-yilgacha boʻlgan davrda SDI kvintillari boʻyicha NAJBP kasallanish koʻrsatkichlari tendensiyalari. APC = yosh-davr-kogorta, NAJBP = alkogolsiz yogʻli jigar kasalligi, SDI = ijtimoiy-demografik indeks.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f2.jpg\" alt=\"Sof siljish (A), AAIR\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Sof siljish (A), AAIR&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Sof siljish (A), AAIR (B) va ASIR (C) 204 ta mamlakat va hududlar boʻyicha. (A) NAJBP kasallanish koʻrsatkichlaridagi sof siljishlarni koʻrsatuvchi jahon xaritasi, kalendar yillar va ketma-ket tugʻilgan kogortalar bilan bogʻliq tendensiyalarni aks ettiradi. NAJBP kasallanish koʻrsatkichi uchun global sof siljish 0,564% (95% CI: 0,530–0,598) ni tashkil etdi. (B) 2021-yilda NAJBP uchun AAIRni koʻrsatuvchi jahon xaritasi, 100 000 kishiga 612,74 (95% CI: 560,48–663,49) global AAIR bilan. (C) 2021-yilda NAJBP uchun ASIR jahon xaritasi, 100 000 kishiga 593,28 (95% CI: 542,72–643,7) global ASIR bilan. AAIR = barcha yoshdagi kasallanish darajasi, ASIR = yosh boʻyicha standartlashtirilgan kasallanish darajasi, CI = ishonchlilik oraligʻi, NAJBP = alkogolsiz yogʻli jigar kasalligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f3.jpg\" alt=\"1990-yildan 2021-yilgacha boʻlgan davrda SDI kvintillari boʻyicha kasallanish koʻrsatkichlarining mahalliy siljishlari v\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1990-yildan 2021-yilgacha boʻlgan davrda SDI kvintillari boʻyicha kasallanish koʻrsatkichlarining mahalliy siljishlari va NAJBP holatlarining yosh taqsimoti.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1990-yildan 2021-yilgacha boʻlgan davrda SDI kvintillari boʻyicha kasallanish koʻrsatkichlarining mahalliy siljishlari va NAJBP holatlarining yosh taqsimoti. (A) 1990-yildan 2021-yilgacha 16 ta yosh guruhi (15–19, 20–24, 25–29, …, 90–94 yosh) boʻyicha NAJBP kasallanish koʻrsatkichlarining mahalliy siljishlari (yosh-davr-kogorta modellari asosida hisoblangan). Nuqtalar va shtrixlangan hududlar kasallanish koʻrsatkichining yillik foiz oʻzgarishini (%/yil) tegishli 95% ishonchlilik oraligʻi (CI) bilan ifodalaydi. (B) 1990-yildan 2021-yilgacha turli yosh guruhlari (15–19, 20–24, 25–29, 30–34, 35–39, 40–44, 45–49, 50–69, 70+ yosh) boʻyicha NAJBP kasallanishining nisbiy taqsimotidagi vaqt oʻtishi bilan oʻzgarishlar. ASIR = yosh boʻyicha standartlashtirilgan kasallanish darajasi, CI = ishonchlilik oraligʻi, NAJBP = alkogolsiz yogʻli jigar kasalligi, SDI = ijtimoiy-demografik indeks.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro-f4.jpg\" alt=\"Yosh, davr va kogortaning SDI kvintillari boʻyicha NAJBP kasallanishiga taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Yosh, davr va kogortaning SDI kvintillari boʻyicha NAJBP kasallanishiga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Yosh, davr va kogortaning SDI kvintillari boʻyicha NAJBP kasallanishiga taʼsiri. (A) Davr oʻzgarishlariga moslashtirilgan, kasallanishning (100 000 kishi-yil uchun) moslashtirilgan uzunlamasiga yosh egri chiziqlari bilan ifodalangan yosh taʼsirlari. (B) 1990–1994-yillardagi yoshga xos koʻrsatkichlarning (2000–2004-yillar referent davr sifatida) 2015–2019-yillarga nisbati sifatida hisoblangan kasallanishning nisbiy xavfi (kasallanish darajasi nisbati) bilan koʻrsatilgan davr taʼsirlari. (C) 1950-yilgi kogorta referent sifatida olingan holda, 1900 va 2000-yillardagi kogortalar oʻrtasidagi yoshga xos koʻrsatkichlar nisbati sifatida hisoblangan kasallanishning nisbiy xavfi bilan ifodalangan kogorta taʼsirlari. Nuqtalar va shtrixlangan hududlar kasallanish koʻrsatkichlarini yoki nisbatlarini tegishli 95% ishonchlilik oraligʻi (CI) bilan birga koʻrsatadi. CI = ishonchlilik oraligʻi, NAJBP = alkogolsiz yogʻli jigar kasalligi, SDI = ijtimoiy-demografik indeks.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Jigar kasallik&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;larining&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ortishi&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;GBD 1990-2021&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ma'lumotlari&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tahlili&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yangi holatlar&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ikki baravar&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;oshdi&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"
