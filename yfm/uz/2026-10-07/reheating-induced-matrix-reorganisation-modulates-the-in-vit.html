        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"88\" cy=\"89\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"492\" cy=\"231\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · DIGESTION   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Nima uchun kraxmalni qayta&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;isitish har doim ham hazm&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qilishni osonlashtirmaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-f1.jpg\" alt=\"Tarmoqlanmagan kraxmal namunalarining zanjir uzunligi taqsimoti.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Tarmoqlanmagan kraxmal namunalarining zanjir uzunligi taqsimoti.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Tarmoqlanmagan kraxmal namunalarining zanjir uzunligi taqsimoti. Native NM: tabiiy normal makkajoʻxori kraxmali; Native HM: tarkibida taxminan 46% amiloza boʻlgan tabiiy yuqori amilozali makkajoʻxori kraxmali; 50/50: normal makkajoʻxori kraxmali va yuqori amilozali makkajoʻxori kraxmalining 50/50 (massa boʻyicha) aralashmasi; NM-50: markaziy qismidagi harorat 50 °C ga yetguncha bugʻda qayta isitilgan retrogradatsiyalangan normal makkajoʻxori kraxmali geli; NM-80: markaziy qismidagi harorat 80 °C ga yetguncha bugʻda qayta isitilgan retrogradatsiyalangan normal makkajoʻxori kraxmali geli. Retro: retrogradatsiyalangan kraxmal.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Kraxmal gellarini 50 yoki 80 °C gacha qizdirish ularning tuzilishi va fermentlar uchun ochiqligiga turlicha ta'sir ko'rsatadi. Tadqiqot shuni ko'rsatdiki, amiloza miqdori hazm bo'lishni belgilovchi yagona omil emas. Aralash kraxmallarda matritsa arxitekturasi kristallik darajasidan muhimroqdir.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;80 °C gacha qizdirish matritsa zichlashishi hisobiga kraxmal hazm bo'lishini kamaytirishi mumkin.&lt;/li&gt;\n&lt;li&gt;Kristallik darajasi kraxmalning fermentlar tomonidan parchalanish tezligini har doim ham aniq ko'rsatmaydi.&lt;/li&gt;\n&lt;li&gt;Gelning g'ovak morfologiyasi va ichki arxitekturasi hazm jarayonida hal qiluvchi ahamiyatga ega.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar oddiy makkajo'xori kraxmali (NM), yuqori amilozali kraxmal (HM) va ularning 50/50 nisbatdagi aralashmasini solishtirdilar. 4 °C haroratda 7 kun saqlangan gellar bug' yordamida 50 yoki 80 °C gacha qizdirildi. Tahlil uchun differensial skanerlovchi kalorimetriya (DSC) va simobli porometriya usullari qo'llanildi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, 50/50 aralashmada 80 °C gacha qizdirish molekulyar tartib ortmagan bo'lsa ham, gidrolizni 72,6% dan 65,6% gacha pasaytirdi. Bu morfologiyaning o'zgarishi bilan bog'liq: g'ovaklar maydoni 12,8 dan 4,6 m²/g gacha qisqardi, g'ovak diametri esa oshdi. Natijada, matritsaning zich tuzilishi fermentlarning kirishiga to'sqinlik qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot in vitro sharoitida o'tkazilgan bo'lib, inson organizmidagi murakkab hazm jarayonlarini to'liq aks ettirmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Kraxmal koʻplab parhezlardagi asosiy glikemik uglevod hisoblanadi va uning hazm boʻlish tezligi hamda darajasi kraxmal saqlovchi mahsulotlardan glyukoza ajralib chiqishiga taʼsir qiladi. Sovutish va saqlash jarayonida retrogradatsiya jelatinlangan amiloza va amilopektin zanjirlarining qayta assotsiatsiyasini ragʻbatlantiradi hamda 3-tur rezistent kraxmal (RS3) va fermentativ taʼsirga chidamliligi kamaytirilgan boshqa tuzilmalarni hosil qilishi mumkin. Shunga qaramay, retrogradatsiyalangan kraxmal saqlovchi mahsulotlar isteʼmol qilishdan oldin koʻpincha qayta isitiladi. Qayta isitish qoʻshaloq spirallar va kristallitlarni qisman eritishi, matritsani yumshatishi va molekulyar hamda matritsaviy qayta tashkil etilishiga imkon berishi mumkin. Shu sababli, qayta isitishdan keyin retrogradatsiyadan olingan fermentativ chidamlilikning qanchalik saqlanib qolishi noaniqligicha qolmoqda.&lt;/p&gt;\n&lt;p&gt;Oddiy makkajoʻxori kraxmali (NM) asosan amilopektinni oʻz ichiga oladi, yuqori amilozali makkajoʻxori kraxmali (HM) esa uzun, nisbatan chiziqli glyukan zanjirlarining katta ulushini saqlaydi. Sovutish jarayonida ushbu zanjirlar qoʻshaloq spiral agregatsiyasi, B-tur kristalizatsiyasi va fermentativ gidrolizni cheklovchi zich nokristallik assotsiatsiyalarda ishtirok etadi. Yuqori amilozali kraxmal granulalari anʼanaviy gidrotermik ishlov berishda toʻliq jelatinlanmagan holda qolishi mumkin. Granula darajasidagi tashkil etilish va kristall polimorf ham kraxmalning amilolizga moyilligiga taʼsir qilishi mumkin. Natijada, qayta ishlangan HM ning past hazm boʻlishi faqat amiloza miqdori bilan emas, balki qoldiq granula arxitekturasi, sovutish jarayonida hosil boʻlgan tuzilmalar va mahalliy molekulyar zichlik bilan izohlanadi. Amiloza miqdori turlicha boʻlgan kraxmallar bir xil qayta isitish sharoitida retrogradatsiyadan olingan chidamlilikni bir xil darajada saqlab qolishi noaniq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatdiki, kraxmal tarkibi va matritsa darajasidagi tashkil etilish qayta isitilgan retrogradatsiyalangan kraxmalning hazm boʻlishini birgalikda belgilaydi, bunda yuqori amilozali tizimlar gidrolizga nisbatan yuqori tarkibiy chidamlilikni saqlab qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SEC (eksklyuzion xromatografiya) usuli kraxmal molekulalarining taqsimlanishini (zanjir uzunligi) aniqlash uchun, DSC (differensial skanerlovchi kalorimetriya) esa erish harorati va entalpiya kabi termik xususiyatlarni oʻlchash uchun ishlatiladi, bu esa tuzilmalarning kristallik darajasini baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar in vitro modelida olingan; maʼlumotlarni inson metabolizmiga oʻtkazish klinik tasdiqni talab qiladi. XRD va MIP maʼlumotlariga statistik tahlil qoʻllanilmadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;50/50 NM/HM aralashmasida 80 °C gacha qizdirish molekulyar tartibning pasayishiga qaramay, gidroliz darajasining 72,6% dan 65,6% gacha kamayishiga olib keldi, bu fermentlar uchun mavjud interfeyslari kamroq boʻlgan uzluksizroq matritsaning shakllanishi bilan izohlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kraxmal tarkibi uchta kraxmal tizimi oʻrtasidagi gidrolizdagi umumiy farqni belgilab berdi. HM saqlovchi namunalar koʻproq issiqlikka chidamli tartibli tuzilmalarni, qattiqroq matritsalarni va koʻproq qoldiq granula materialini saqlab qoldi hamda NM ga qaraganda kamroq gidrolizlandi. 50/50 aralashmasi qayta isitishga nisbatan qoʻshimcha matritsa darajasidagi javobni koʻrsatdi. Garchi 80 °C gacha qizdirish uning molekulyar va kristall tartibini pasaytirgan boʻlsa-da, gidroliz kamaydi. Umuman olganda, qoldiq molekulyar tartibning oʻzi qayta isitishdan keyin hazm boʻlish reaksiyasini bashorat qilmadi; aksincha, gidroliz kraxmalning molekulyar tashkil etilishi, qoldiq granula arxitekturasi va matritsa morfologiyasidagi farqlar bilan bogʻliq edi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-f1.jpg\" alt=\"Tarmoqlanmagan kraxmal namunalarining zanjir uzunligi taqsimoti.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Tarmoqlanmagan kraxmal namunalarining zanjir uzunligi taqsimoti.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Tarmoqlanmagan kraxmal namunalarining zanjir uzunligi taqsimoti. Native NM: tabiiy normal makkajoʻxori kraxmali; Native HM: tarkibida taxminan 46% amiloza boʻlgan tabiiy yuqori amilozali makkajoʻxori kraxmali; 50/50: normal makkajoʻxori kraxmali va yuqori amilozali makkajoʻxori kraxmalining 50/50 (massa boʻyicha) aralashmasi; NM-50: markaziy qismidagi harorat 50 °C ga yetguncha bugʻda qayta isitilgan retrogradatsiyalangan normal makkajoʻxori kraxmali geli; NM-80: markaziy qismidagi harorat 80 °C ga yetguncha bugʻda qayta isitilgan retrogradatsiyalangan normal makkajoʻxori kraxmali geli. Retro: retrogradatsiyalangan kraxmal.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-f2.jpg\" alt=\"Tabiiy kraxmal, retrogradatsiyalangan kraxmal va qayta isitilgan kraxmalning differensial skanerlovchi kalorimetriya pro\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Tabiiy kraxmal, retrogradatsiyalangan kraxmal va qayta isitilgan kraxmalning differensial skanerlovchi kalorimetriya profili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Tabiiy kraxmal, retrogradatsiyalangan kraxmal va qayta isitilgan kraxmalning differensial skanerlovchi kalorimetriya profili. NM: tabiiy normal makkajoʻxori kraxmali; HM: tarkibida taxminan 46% amiloza boʻlgan tabiiy yuqori amilozali makkajoʻxori kraxmali; 50/50: 50% normal makkajoʻxori kraxmali va 50% yuqori amilozali makkajoʻxori kraxmalining aralashmasi; NM-50: markaziy qismidagi harorat 50 °C ga yetguncha bugʻda qayta isitilgan retrogradatsiyalangan normal makkajoʻxori kraxmali geli; NM-80: markaziy qismidagi harorat 80 °C ga yetguncha bugʻda qayta isitilgan retrogradatsiyalangan normal makkajoʻxori kraxmali geli. Retro: retrogradatsiyalangan kraxmal.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-f3.jpg\" alt=\"Namunalarning rentgen nurlari difraksiyasi difraktogrammalari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Namunalarning rentgen nurlari difraksiyasi difraktogrammalari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Namunalarning rentgen nurlari difraksiyasi difraktogrammalari. 50/50: 50% normal makkajoʻxori kraxmali va 50% yuqori amilozali makkajoʻxori kraxmalining aralashmasi; NM-50: markaziy qismidagi harorat 50 °C ga yetguncha bugʻda qayta isitilgan retrogradatsiyalangan normal makkajoʻxori kraxmali geli; NM-80: markaziy qismidagi harorat 80 °C ga yetguncha bugʻda qayta isitilgan retrogradatsiyalangan normal makkajoʻxori kraxmali geli. Retro: retrogradatsiyalangan kraxmal.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-f4.jpg\" alt=\"Kraxmal geli va granulalarining mikro tuzilishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Kraxmal geli va granulalarining mikro tuzilishi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-f5.jpg\" alt=\"Qayta isitilgan retrogradatsiyalangan kraxmal gellarining in vitro fermentativ gidrolizi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qayta isitilgan retrogradatsiyalangan kraxmal gellarining in vitro fermentativ gidrolizi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit-f6.jpg\" alt=\"50 °C ga nisbatan 80 °C gacha qayta qizdirilgandan soʻng 50/50 NM/HM aralashmasining in vitro gidroliz tezligining pastr\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;50 °C ga nisbatan 80 °C gacha qayta qizdirilgandan soʻng 50/50 NM/HM aralashmasining in vitro gidroliz tezligining pastroq boʻlishi uchun taklif etilgan tarkibiy tushuntirish. NM — oddiy makkajoʻxori kraxmali, HM — yuqori amilozali makkajoʻxori kraxmali.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Qizdirishning&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kraxmal&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tuzilishiga&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ta'siri&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Gellarni 50 va&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;80 °C da&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;gidrolizlash&lt;/text&gt;&lt;path stroke=\"#7A3FCC\"
