            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"277\" cy=\"151\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"663\" cy=\"228\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Oziq-ovqat savati dori&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o‘rnini bosa oladimi: uzoq&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;muddatli parhez tajribasi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Olimlar kam ta’minlangan insonlar uchun haftalik o‘simlik mahsulotlari to‘plamlarining sog‘liqqa ta’sirini tahlil qilishdi. 2,7 yil davomida ishtirokchilar yangi sabzavotlar, mevalar, dukkaklilar va butun donli mahsulotlarni olishdi. Ma’lum bo‘lishicha, bunday yondashuv olingan to‘plamlar soniga qarab qon bosimi va tana massasi indeksini pasaytirishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Har 100 ta oziq-ovqat to‘plami diastolik bosimni 3,21 mm sim. ust. ga pasaytiradi.&lt;/li&gt;\n&lt;li&gt;Har 100 ta to‘plam uchun o‘rtacha vazn yo‘qotish 2,63 kg ni tashkil etdi.&lt;/li&gt;\n&lt;li&gt;Gipertoniya bilan og‘rigan bemorlarda sistolik bosim 5,83 mm sim. ust. ga tushdi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqot 2019-yildan 2025-yilgacha MGH Revere Food Pantry oziq-ovqat markazi bazasida o‘tkazildi. Tanlanmaga USDA 2020 tavsiyalariga muvofiq parhezshunos tomonidan tuzilgan haftalik oziq-ovqat to‘plamlarini olgan 68 nafar kattalar kiritildi. Ratsion yangi mevalar, sabzavotlar, konservalangan dukkaklilar, yong‘oq pastasi va butun donli mahsulotlarni o‘z ichiga olib, kuniga uch mahal ovqatlanishni ta’minladi.&lt;/p&gt;\n&lt;p&gt;Natijalarni baholash uchun yosh, jins va COVID-19 pandemiyasining ta’sirini hisobga oluvchi aralash effektli chiziqli modellar qo‘llanildi. Har 100 ta olingan oziq-ovqat to‘plami (MTGs) diastolik bosimning 3,21 mm sim. ust. ga va vaznning 2,63 kg ga pasayishiga olib keldi. Dastlabki ko‘rsatkichlari yuqori bo‘lgan ishtirokchilarda ta’sir yanada yaqqolroq namoyon bo‘ldi: sistolik bosim 5,83 mm sim. ust. ga, diastolik bosim esa 6,23 mm sim. ust. ga kamaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotda nazorat guruhi mavjud emas edi va ma’lumotlar klinik o‘lchovlarga asoslangan bo‘lib, ular o‘zgaruvchan bo‘lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;\"Oziq-ovqat — bu dori\" (Food Is Medicine, FIM) konsepsiyasi doirasidagi aralashuvlar, masalan, tibbiy koʻrsatmalarni hisobga olgan holda oziq-ovqat mahsulotlari bilan taʼminlash (MTG), ixtisoslashtirilgan ovqatlanish va sabzavotlar uchun retseptlar ratsion sifatini yaxshilash va oziq-ovqat xavfsizligi darajasini pasaytirish qobiliyatini namoyish etadi. Biroq, FIM-aralashuvlarining yurak-qon tomir, buyrak va metabolik (CKM) salomatlik koʻrsatkichlariga taʼsiri turlicha boʻlib qolmoqda.&lt;/p&gt;\n&lt;p&gt;Bugungi kunga qadar FIM boʻyicha oʻtkazilgan tadqiqotlarning aksariyati bir necha hafta yoki oy bilan cheklangan va ularning oz qismi ozuqaviy sifatni optimallashtirishga qaratilgan. Ushbu hisobot oʻsimlik asosidagi MTG taʼsirini deyarli 3 yillik kuzatuv davomida baholashi bilan noyobdir.&lt;/p&gt;\n&lt;p&gt;Oʻsimlik asosidagi FIM-aralashuvlari istiqbolli; CKM salomatligini yaxshilash uchun kelajakdagi dasturlar uzoqroq muddatli boʻlishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatdiki, deyarli 3 yil davomida oʻsimlik asosidagi oziq-ovqat toʻplamlarini (MTG) olish diastolik qon bosimi, tana vazni va BMI ning dozaga bogʻliq pasayishiga olib keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oziq-ovqat xavfsizligining yoʻqligi ovqatlanish sifati pastligi va yurak-qon tomir, buyrak va metabolik (CKM) salomatligining yomonlashuvi, shu jumladan gipertenziya, semizlik va 2-toifa qandli diabetning yuqori koʻrsatkichlari bilan bogʻliq. Soʻnggi yillarda oziq-ovqat xavfsizligini taʼminlash, surunkali kasalliklarning oldini olish va davolashga qaratilgan MTG, ixtisoslashtirilgan ovqatlanish va retseptlar kabi FIM-aralashuvlari keng tarqaldi. Ular ratsion sifatini yaxshilasa-da, CKM salomatligiga taʼsiri turlicha. Doza taʼsirini oʻrganish FIM uchun ham, farmatsevtik aralashuvlar uchun ham juda muhimdir. FIM dozasining toʻrtta asosiy omili — chastota, sifat, miqdor va davomiylik. FIM-aralashuvlari eng toʻyimli oziq-ovqatlarni koʻproq miqdorda va uzoqroq vaqt davomida taqdim etish orqali kuchaytirilishi mumkin. Ushbu tadqiqotning maqsadi oziq-ovqat bankidan olingan tez-tez, toʻyimli va hajmli oʻsimlik asosidagi MTG toʻplamlari va oziq-ovqat xavfsizligi past boʻlgan kattalardagi uzoq muddatli CKM natijalari oʻrtasidagi dozaga bogʻliq bogʻliqlikni oʻrganish edi.&lt;/p&gt;\n&lt;p&gt;MGH Revere (Massachusets) oziq-ovqat banki jamoat sogʻliqni saqlash markazida joylashgan va haftalik oʻsimlik asosidagi MTG bilan taʼminlaydi. MTG oluvchi bemorlar asosan ingliz tilini bilmaydigan, ijtimoiy-iqtisodiy holati past va davlat tibbiy sugʻurtasidan foydalanadigan shaxslardir. Dietolog dastlab AQSh Qishloq xoʻjaligi vazirligining 2020-yildagi parhez tavsiyalari asosida mahsulot tanlashni yoʻnaltirdi va har bir oila aʼzosini haftasiga kuniga uch mahal ovqat bilan taʼminladi. MTG tarkibida yangi meva va sabzavotlar, konservalangan dukkakli ekinlar va/yoki yongʻoq pastasi, shuningdek, butun donli mahsulotlar mavjud.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Retrospektiv tadqiqot: toʻgʻridan-toʻgʻri sabab-oqibat bogʻliqligini oʻrnatish imkoniyatini cheklaydigan nazorat guruhisiz, yordam olgan bemorlar maʼlumotlarini tahlil qilish.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu retrospektiv tadqiqot homilador boʻlmagan kattalarni (≥18 yosh) oʻz ichiga oldi, ular: 1) 2019-yil 20-dekabrdan 2025-yil 1-aprelgacha kamida 26 ta MTG olgan; 2) kamida bitta dastlabki CKM oʻlchoviga ega boʻlgan (birinchi MTG olishdan 12 oy oldin; oʻlchovlar medianasi = 4); 3) kamida bitta kuzatuv CKM oʻlchoviga ega boʻlgan (birinchi MTG olgandan 6 oy oʻtgach va oxirgi MTG olgandan 3 oy oʻtgach; oʻlchovlar medianasi = 8). Birlamchi natijalar sistolik va diastolik qon bosimi hamda glikirlangan gemoglobinni (HbA1c) oʻz ichiga olgan. Ikkilamchi natijalar BMI va tana vaznini oʻz ichiga olgan.&lt;/p&gt;\n&lt;p&gt;Biz natijalarning uzoq muddatli koʻrsatkichlarini elektron tibbiy kartalardan oldik. Boʻy va vazn maʼlumotlari Daymont va boshqalar algoritmi yordamida tozalandi. Aralash effektli chiziqli modellar olingan MTG miqdori va natijalarning oʻzgarish surʼatlaridagi farqlar oʻrtasidagi bogʻliqlikni baholadi. 1-model (tuzatilmagan) olingan MTG (yuzlab qadoqlarda), tadqiqot davri va ularning oʻzaro taʼsiri uchun sobit effektlarni oʻz ichiga olgan. 2-model qoʻshimcha ravishda yosh, jins, dastlabki qiymatlar va oʻlchovlar orasidagi vaqtga qarab tuzatildi. 3-model qoʻshimcha ravishda COVID-19 pandemiyasi davrlarini hisobga oldi.&lt;/p&gt;\n&lt;p&gt;68 nafar kattalar ishtirokchilari orasida (Rasm) 47 nafari (69,1%) ayollar, oʻrtacha yosh 57,4 (13,7) yoshni tashkil etdi. 50 nafarida (80,6%) dastlabki BMI 25 yoki undan yuqori boʻlgan; oʻrtacha sistolik qon bosimi — 130,3 (20,0) mm sim. ust.; oʻrtacha diastolik qon bosimi — 76,5 (8,4) mm sim. ust.; oʻrtacha HbA1c — 6,9% (1,8%). Oʻrtacha hisobda ishtirokchilar 2,7 yil davomida har 1,4 haftada MTG olishgan (Jadval 1). Har 100 ta olingan MTG uchun diastolik qon bosimining oʻzgarish surʼati toʻliq tuzatilgan modellarda 3,21 mm sim. ust. ga (95% CI, -4,89 dan -1,52 gacha) pasaygan (Jadval 2). Umumiy guruhda sistolik qon bosimi yoki HbA1c ning sezilarli oʻzgarishlari kuzatilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cheklov: nazorat guruhining yoʻqligi va oʻlchov sharoitlariga qarab oʻzgarishi mumkin boʻlgan ofis biometrik oʻlchovlaridan foydalanish.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sezgirlik tahlilida dastlab yuqori sistolik qon bosimi (≥130 mm sim. ust.) boʻlgan shaxslar orasida har 100 MTG uchun sistolik qon bosimining oʻzgarish surʼati 5,83 mm sim. ust. ga (95% CI, -10,09 dan -1,57 gacha) pasaygan; yuqori diastolik qon bosimi (≥80 mm sim. ust.) boʻlganlar orasida diastolik qon bosimining oʻzgarish surʼati 6,23 mm sim. ust. ga (95% CI, -9,25 dan -3,32 gacha) pasaygan. Har 100 MTG uchun BMI oʻzgarish surʼati 1,04 kg/m² ga (95% CI, -1,50 dan -0,58 gacha) va vazn oʻzgarish surʼati 2,63 kg ga (95% CI, -3,73 dan -1,53 gacha) pasaygan.&lt;/p&gt;\n&lt;p&gt;Ushbu retrospektiv tadqiqotda biz diastolik qon bosimi, vazn va BMI koʻrsatkichlarining dozaga bogʻliq yaxshilanishini kuzatdik. Dastlab yuqori koʻrsatkichlarga ega boʻlgan shaxslarda sistolik qon bosimining ham yaxshilanishi kuzatildi. HbA1c darajasida sezilarli oʻzgarishlar yoʻqligi boshqa FIM tadqiqotlari bilan mos keladi, bu davolanishga rioya qilish va jismoniy faollik kabi koʻplab omillarning taʼsiri bilan bogʻliq boʻlishi mumkin. Kelajakdagi tadqiqotlar randomizatsiyalangan dizayn va biometrik koʻrsatkichlarni oʻlchashning aniqroq usullaridan foydalanishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ovqatlanish va&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\
