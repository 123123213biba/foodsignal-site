            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"177\" cy=\"62\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"523\" cy=\"295\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;L-teanin va og'ir metallar:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;choy tarkibidagi modda&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;jigarni qanday himoya&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qiladi?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f1.jpg\" alt=\"Oʻtkir Cd taʼsiriga uchragan sichqonlarda LT ning oʻlimga taʼsiri. (A) LT ning kimyoviy tuzilishi. (B) Hayvonlar tajriba\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Oʻtkir Cd taʼsiriga uchragan sichqonlarda LT ning oʻlimga taʼsiri. (A) LT ning kimyoviy tuzilishi. (B) Hayvonlar tajribasining sxematik diagrammasi. (C) Cd bilan ishlov berilgandan keyingi yashash vaqti (n = 8). # p &amp;lt; 0,05, Cd guruhiga nisbatan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Kadmiy organizmda to'planib, hujayralarni tozalash jarayonini buzadigan zaharli metalldir. Sichqonlarda o'tkazilgan tadqiqot shuni ko'rsatdiki, choy barglarida mavjud bo'lgan L-teanin bu jarayonlarni tiklashga yordam beradi. Ushbu modda himoya mexanizmlarini faollashtirib, oksidlovchi stressni kamaytiradi va jigardagi metabolizmni yaxshilaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;L-teanin &lt;a href=\"concepts/amp-activated-protein-kinase.html\"&gt;AMPK&lt;/a&gt; ni faollashtirib, jigar hujayralarida autofagiya va energiya almashinuvini tiklaydi.&lt;/li&gt;\n&lt;li&gt;Qo'shimcha &lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;DPP&lt;/a&gt;-4 faolligini pasaytirib, SIRT1 darajasini oshiradi va mitoxondriyalarni himoya qiladi.&lt;/li&gt;\n&lt;li&gt;L-teanin kadmiy ta'sirida yuzaga keladigan ferroptoz va lipidlar to'planishini bloklaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Kadmiy (Cd) autofagiya — hujayralarni tozalash tizimini izdan chiqaradi, bu esa shikastlangan mitoxondriyalarning to'planishiga va ferroptozga (temir miqdori oshishi sababli hujayralar nobud bo'lishi) olib keladi. 8 mg/kg kadmiy xlorid (CdCl2) bilan o'tkir zaharlanish tajribasida o'lim darajasi 8 soat ichida 100% ni tashkil etdi. 200 mg/kg dozada L-teanin qabul qilish o'rtacha yashash vaqtini 4 soatdan 16 soatgacha uzaytirdi va o'limni 60% gacha kamaytirdi.&lt;/p&gt;\n&lt;p&gt;Surunkali ta'sirda L-teanin AMPK/mTOR signal yo'lini faollashtiradi, DPP-4 fermenti faolligini pasaytiradi va SIRT1 oqsili darajasini oshiradi. Bu energiya muvozanatini tiklaydi: jigarda glikogen va lipidlar to'planishi kamayadi, PGC-1α/Nrfs/TFAM yo'li faollashishi hisobiga mitoxondriyalar ishi normallashadi. Natijada, L-teanin oksidlovchi stressda hujayralar o'limini oldini oluvchi GPX4 fermentining parchalanishini to'xtatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqonlarda o'tkazilgan, shuning uchun dozalarni odamlarga to'g'ridan-to'g'ri ko'chirish ehtiyotkorlikni talab qiladi. Ish L-teaninning odam organizmida uzoq muddatli to'planish ta'sirini o'rganmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Bugungi kunda dunyodagi ekin maydonlarining 14–17 foizi kadmiy (Cd), mishyak, kobalt, xrom, mis, nikel va qoʻrgʻoshin kabi kamida bitta zaharli metall bilan ifloslangan boʻlib, bu 0,9–1,4 milliard odamning sogʻligʻi va ekologik xavf ostida yashashiga sabab boʻlmoqda. Kadmiy qishloq xoʻjaligi tuproqlarida eng koʻp uchraydigan ifloslantiruvchi moddadir (9,0%). Cd ning odam organizmidagi biologik yarim yemirilish davri 20–40 yilni tashkil etadi. Hatto past dozalarda ham Cd jigar kasalliklari, yurak-qon tomir tizimi, diabet, osteoporoz va neyrodegeneratsiya bilan bogʻliq. Cd taʼsiri oʻlim darajasini taxminan 17 foizga oshiradi. Cd taʼsirining 90 foizi oziq-ovqat mahsulotlari hissasiga toʻgʻri keladi (oʻrtacha jahon isteʼmoli ~2,20 mkg/kg tana vazniga kuniga), chekish esa kuniga 2–4 mkg qoʻshadi. Kasbiy taʼsir Yevropa Ittifoqida 207 350 va AQShda 525 000 ishchini qamrab oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kadmiy organizmda oʻnlab yillar davomida toʻplanadi va uning 90 foizi ratsion bilan bogʻliq, bu esa jigarni toksik taʼsirning asosiy nishoniga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Cd toksikligi mitoxondrial disfunksiya, endokrin buzilishlar, endoplazmatik retikulum stressi, oksidlovchi stress va yalligʻlanish orqali namoyon boʻladi. Autofagiya — hujayra tarkibiy qismlarini qayta ishlash jarayoni — ikki tomonlama rol oʻynaydi: oʻrtacha stressda omon qolish yoki xavfsizlik chegarasidan oshib ketganda hujayra oʻlimi. Autofagiyaning buzilishi Cd sitotoksikligining asosidir. Mavjud xelatorlar (dimerkaptosuksin kislotasi va boshqalar) oʻtkir zaharlanishda samarali, ammo yuqori toksiklikka ega va hayotiy muhim mikroelementlarning (K⁺, Ca²⁺, Mg⁺) yoʻqolishiga olib keladi. Surunkali Cd intoksikatsiyasiga qarshi samarali usullar mavjud emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Autofagiya — bu hujayraning „oʻzini tozalash“ jarayoni boʻlib, unda hujayra energiya va qurilish materiallari olish uchun shikastlangan tuzilmalarni qayta ishlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;L-teanin (LT) — choy (&lt;em&gt;Camellia sinensis&lt;/em&gt; L.) tarkibidagi aminokislota — antioksidant va neyroprotektiv xususiyatlarga ega. Sichqonlarda oʻtkazilgan tadqiqotlar shuni koʻrsatdiki, LT Cd keltirib chiqargan neyrotoksiklik va PC12 hujayralari apoptozidan himoya qiladi. LT AQSh Oziq-ovqat va farmatsevtika idorasi (FDA) tomonidan xavfsiz (GRAS) deb tan olingan, tavsiya etilgan norma — kuniga 1200 mg gacha. Ushbu ishda LT jigarda autofagiyani qoʻllab-quvvatlashi va sichqonlarda Cd taʼsiriga qarshi tura olishi haqidagi gipoteza tekshirildi.&lt;/p&gt;\n&lt;p&gt;Tadqiqot 3 haftalik Kunming liniyasidagi erkak sichqonlarda oʻtkazildi. Protokollar laboratoriya hayvonlari etikasi qoʻmitasi tomonidan tasdiqlangan (raqami LLSC410240005). Oʻtkir oʻlim tajribasida sichqonlar 3 kunlik LT (200 mg/kg, ogʻiz orqali) kiritilgandan soʻng CdCl₂ (8 mg/kg, qorin boʻshligʻiga) oldi. Surunkali tajribada sichqonlar 10 hafta davomida CdCl₂ (2,5 mg/kg, ogʻiz orqali) oldi, LT ichimlik suvi bilan (1 yoki 2 mg/ml) berildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sichqonlarda oʻtkazilgan; natijalar odamlarda yoki jigar organoidlari modellarida klinik sinovlar orqali tasdiqlanishi kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LT oʻtkir Cd taʼsirida sichqonlar oʻlimini 100 foizdan 60 foizgacha kamaytirdi va omon qolish medianasini 4 soatdan 16 soatgacha uzaytirdi. Surunkali taʼsirda Cd jigar gipertrofiyasi, yogʻli infiltratsiya va fibrozni keltirib chiqardi. LT bu shikastlanishlarning oldini oldi. LT ning taʼsir mexanizmi SIRT1/PGC-1α yoʻlini tartibga solish, mitoxondriyalar funksiyasini tiklash va AMPK/mTOR yoʻlini faollashtirish orqali ferroptozni (temirga bogʻliq hujayra oʻlimi) bloklash bilan bogʻliq.&lt;/p&gt;\n&lt;p&gt;LT toʻqimalarda Cd toʻplanishiga taʼsir qilmaydi, bu uni xelatorlardan ajratib turadi. Uning himoya taʼsiri metabolik buzilishlarni tuzatish va autofagiyani tiklashga asoslangan. Cheklov shundaki, hozirgi maʼlumotlar autofagosomalar shakllanishining faollashuvi va ularning degradatsiyasining buzilishini aniq ajratishga imkon bermaydi. Oqsil darajasida va autofagiya oqimi boʻyicha keyingi tadqiqotlar talab etiladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f1.jpg\" alt=\"Oʻtkir Cd taʼsiriga uchragan sichqonlarda LT ning oʻlimga taʼsiri. (A) LT ning kimyoviy tuzilishi. (B) Hayvonlar tajriba\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Oʻtkir Cd taʼsiriga uchragan sichqonlarda LT ning oʻlimga taʼsiri. (A) LT ning kimyoviy tuzilishi. (B) Hayvonlar tajribasining sxematik diagrammasi. (C) Cd bilan ishlov berilgandan keyingi yashash vaqti (n = 8). # p &amp;lt; 0,05, Cd guruhiga nisbatan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f2.jpg\" alt=\"Subxronik Cd taʼsiriga uchragan sichqonlarda LT ning tana vazni, jigar gistologiyasi va funksiyasiga taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Subxronik Cd taʼsiriga uchragan sichqonlarda LT ning tana vazni, jigar gistologiyasi va funksiyasiga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Subxronik Cd taʼsiriga uchragan sichqonlarda LT ning tana vazni, jigar gistologiyasi va funksiyasiga taʼsiri. (A) Hayvonlar tajribasining sxematik diagrammasi. (B, C) Ozuqa va suyuqlik isteʼmoli. (D, E) Tana vazni va tana vaznining ortishi. (F) Jigar morfologiyasi. (G) Jigar vazni. (H) Jigar indeksi. (I–K) H&amp;amp;E, Oil Red O va Masson boʻyash usullari. (L, M) Glikogen darajalari va PAS boʻyash usuli. (N, O) Zardob va jigardagi AKP faollik darajalari. (P–R) Jigar, zardob va axlatdagi Cd darajalari. (S) MT1 va MT2 ning nisbiy mRNK ifodalanish darajalari. Maʼlumotlar oʻrtacha ± standart xatolik (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;) koʻrinishida taqdim etilgan (n = 9). * p &amp;lt; 0,05, ** p &amp;lt; 0,01 va *** p &amp;lt; 0,001, nazorat guruhiga nisbatan. # p &amp;lt; 0,05, ## p &amp;lt; 0,01 va ### p &amp;lt; 0,001, Cd guruhiga nisbatan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f3.jpg\" alt=\"Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning mitoxondrial funksiya, SIRT1/PGC-1α signal yoʻli va uning qu\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning mitoxondrial funksiya, SIRT1/PGC-1α signal yoʻli va uning quyi nishonlariga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning mitoxondrial funksiya, SIRT1/PGC-1α signal yoʻli va uning quyi nishonlariga taʼsiri. (A, B) COX va SDH darajalari (n = 9). (C) SIRT1/PGC-1α signal yoʻli bilan bogʻliq oqsillar (n = 3). (D) TFAM va NRF1 ning nisbiy mRNK ifodalanish darajalari (n = 9). (E) Nrf2 oqsilining ifodalanishi. (F, G) Fibroz bilan bogʻliq oqsillar va genlar. (H) Insulin signal yoʻli oqsillari (n = 3). Maʼlumotlar oʻrtacha ± standart xatolik (SEM) koʻrinishida taqdim etilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f4.jpg\" alt=\"Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning ferroptozga taʼsiri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning ferroptozga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning ferroptozga taʼsiri. (A, B) Zardob va jigardagi Fe2+ darajalari. (C, D) MDA va GSH darajalari. (E) GPX1, GPX3 va GPX4 ning nisbiy mRNK darajalari (n = 9). (F) GPX4, FSP1 va ACSL4 oqsillarining ifodalanishi. (G) Membranadagi FSP1 oqsilining ifodalanishi. (H) Ubikvitin oqsilining ifodalanishi (n = 3). Maʼlumotlar oʻrtacha ± standart xatolik (SEM) koʻrinishida taqdim etilgan. * p &amp;lt; 0,05, ** p &amp;lt; 0,01 va *** p &amp;lt; 0,001, nazorat guruhiga nisbatan. # p &amp;lt; 0,05, ## p &amp;lt; 0,01 va ### p &amp;lt; 0,001, Cd guruhiga nisbatan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f5.jpg\" alt=\"Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning AMPK/mTOR vositachiligidagi autofagiya signal yoʻliga hamda \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning AMPK/mTOR vositachiligidagi autofagiya signal yoʻliga hamda AMPK tomonidan boshqariladigan glyuko-lipid almashinuvi genlari va oqsillariga taʼsiri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Subxronik Cd taʼsiriga uchragan sichqonlar jigarida LT ning AMPK/mTOR vositachiligidagi autofagiya signal yoʻliga hamda AMPK tomonidan boshqariladigan glyuko-lipid almashinuvi genlari va oqsillariga taʼsiri. (A) DPP-4 darajasi (n = 9). (B) p-AMPK (Thr172) oqsilining ifodalanishi (n = 3). (C) LC3B ning nisbiy mRNK darajalari (n = 9). (D) p-mTOR (Ser2481) va p-p70S6K (Ser371) oqsillarining ifodalanishi (n = 3). (E, F) Yogʻ kislotalari sintezi bilan bogʻliq genlar (n = 9) va oqsillar (n = 3). (G, H) Yogʻ kislotalari oksidlanishi bilan bogʻliq genlar (n = 9) va oqsillar (n = 3). (I) Glyukoneogenez genlari TXNIP va Trx1 ning nisbiy mRNK darajalari (n = 9). (J, K) Glyukoza tashuvchisi GLUT2 va membranadagi GLUT2 ifodalanishi (n = 3). Maʼlumotlar oʻrtacha ± standart xatolik (SEM) koʻrinishida taqdim etilgan. * p &amp;lt; 0,05, ** p &amp;lt; 0,01 va *** p &amp;lt; 0,001, nazorat guruhiga nisbatan. # p &amp;lt; 0,05 va ## p &amp;lt; 0,01, Cd guruhiga nisbatan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi-f6.jpg\" alt=\"LT ning kadmiy keltirib chiqargan mitoxondrial disfunksiya, ferroptoz va glyuko-lipid almashinuvi buzilishini DPP4/AMPK/\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;LT ning kadmiy keltirib chiqargan mitoxondrial disfunksiya, ferroptoz va glyuko-lipid almashinuvi buzilishini DPP4/AMPK/mTOR va SIRT1/AMPK/LKB1/mTOR signal yoʻllari orqali modulyatsiya qilinadigan autofagiya yordamida yengillashtirish mexanizmlarini koʻrsatuvchi sxematik diagramma.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Kadmiy jigar&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;hujayralarini&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;nobud qiladi&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Sichqonlarda&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;L-teanin bilan&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;davolash&
