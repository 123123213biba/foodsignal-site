        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Биотехнология и пищевые технологии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;XXI век (активное развитие)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Культивирование клеток, экструзия, 3D-печать, сенсорный анализ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Emerging Infectious Diseases, Advances in Nutrition&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-newfood.html\"&gt;Yangi taomlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-organiladi\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#nima-organiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima o‘rganiladi&lt;/span&gt;&lt;/a&gt;Nima o‘rganiladi&lt;/h2&gt;\n&lt;p&gt;«Yangi oziq-ovqat» (novel food) — bu noan’anaviy manbalardan yoki innovatsion texnologiyalar yordamida oziq-ovqat mahsulotlarini ishlab chiqishni o‘rganuvchi ilmiy yo‘nalish. Tadqiqot obyekti o‘simlik analoglari, kultivatsiya qilingan go‘sht, yeyiladigan hasharotlar, zamburug‘lar va suv o‘tlari kabi muqobil oqsil manbalarini, shuningdek, ularni qayta ishlash usullarini, jumladan 3D-bosmani o‘z ichiga oladi.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Yo‘nalish rivoji oziq-ovqat xavfsizligini oshirish va qishloq xo‘jaligiga yuklamani kamaytirish usullarini izlashdan boshlangan. Asosiy bosqichlardan biri o‘simlik xomashyosi, masalan, oziq-ovqat tolalari manbai sifatida sirk (Cichorium intybus L.) ildizlarini o‘rganish bo‘ldi. So‘nggi o‘n yilliklarda e’tibor biotexnologik usullarga qaratildi: hayvonot mahsulotlaridan foydalanishdan o‘simlik oqsillari (yer yong‘oq va kinva) asosidagi ozuqa muhitlarida hujayralarni yetishtirishga o‘tish.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;«Yangi oziq-ovqat» sohasida ikkita asosiy yondashuv mavjud. Birinchisi — an’anaviy mahsulotlarning teksturasi va ta’mini taqlid qilishga qaratilgan texnologik yondashuv. Ikkinchisi — hujayraviy tuzilmalarni yaratishga qaratilgan biotexnologik yondashuv. Tadqiqotchilar iste’molchilar xulq-atvorini ham tahlil qiladilar.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;«Yangi oziq-ovqat» usullari bioreaktorlarda hujayralarni yetishtirish, tolali tuzilmani yaratish uchun o‘simlik oqsillarini ekstruziya qilish va murakkab oziq-ovqat shakllarini hosil qilish uchun 3D-bosmani o‘z ichiga oladi. Sifatni baholash uchun ISO standartlari bo‘yicha sensor tahlil va HACCP tamoyillariga mos xavfsizlik nazorati usullari qo‘llaniladi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo‘nalishlar bilan bog‘liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo‘nalishlar bilan bog‘liqlik&lt;/h2&gt;\n&lt;p&gt;«Yangi oziq-ovqat» biotexnologiya, oziq-ovqat kimyosi, nutritsiologiya va ekologiya bilan chambarchas bog‘liq. U mahsulotlarni oxirgi iste’molchiga yetkazib berishni ta’minlaydigan Yandex Eda kabi logistika xizmatlari bilan kesishadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o‘qish va nimalarni o‘qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o‘qish va nimalarni o‘qish kerak&lt;/h2&gt;\n&lt;p&gt;Yo‘nalishni o‘rganish oziq-ovqat texnologiyalari, biotexnologiya va nutritsiologiya dasturlari doirasida amalga oshirilishi mumkin. Chuqur o‘rganish uchun oziq-ovqat xavfsizligi va innovatsion texnologiyalar bo‘yicha ilmiy jurnallarga murojaat qilish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-newfood.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AF%D0%BD%D0%B4%D0%B5%D0%BA%D1%81_%D0%95%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Яндекс Еда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3201/eid0304.970403\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Emerging foodborne diseases: an evolving public health challenge&lt;/a&gt; — sharh, Emerg Infect Dis 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.brainresbull.2018.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Konzo: a distinct neurological disease associated with food (cassava) cyanogenic poisoning&lt;/a&gt; — sharh, Brain Res Bull 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/advances/nmaa025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Back to the Roots: Revisiting the Use of the Fiber-Rich Cichorium intybusL. Taproots&lt;/a&gt; — sharh, Adv Nutr 2020&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Yangi taomlar","description":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.","vcsPath":"reference/disciplines/dir-newfood.md"},"headings":[{"title":"Nima o‘rganiladi","href":"reference/disciplines/dir-newfood.html#nima-organiladi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-newfood.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-newfood.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Usullar va vositalar","href":"reference/disciplines/dir-newfood.html#usullar-va-vositalar","level":2},{"title":"Boshqa yo‘nalishlar bilan bog‘liqlik","href":"reference/disciplines/dir-newfood.html#boshqa-yonalishlar-bilan-bogliqlik","level":2},{"title":"Qayerda o‘qish va nimalarni o‘qish kerak","href":"reference/disciplines/dir-newfood.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"r
