            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Зимология (биотехнология)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;Исторически — с древности, как наука — XIX век&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Биореакторный синтез, секвенирование микробиома, хроматография&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Science, J Lipid Res, Clin Microbiol Rev&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-ferment.html\"&gt;Fermentatsiya&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalarni-organadi\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#nimalarni-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalarni o'rganadi&lt;/span&gt;&lt;/a&gt;Nimalarni o'rganadi&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya — bu fermentlar yoki mikroorganizmlar ta'sirida organik moddalarning biokimyoviy qayta ishlanishi. Ushbu jarayonlarni va ularning amaliy qo'llanilishini o'rganadigan fan zimologiya deb ataladi. Tadqiqot predmeti mikroorganizmlarning metabolik faoliyati bo'lib, u substratlarni yangi mahsulotlarga aylantiradi, ularning organoleptik xususiyatlarini, tarkibini va biologik faolligini o'zgartiradi.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya tarixan mahsulotlarni saqlash va ularning hazm bo'lishini yaxshilash uchun ishlatilgan. Ilmiy tushunish jarayoni mikroorganizmlarning metabolizmdagi rolini o'rganishdan boshlandi. Zamonaviy tadqiqotlar fermentatsiya mahsulotlarining inson metabolizmiga, jumladan ichak to'sig'ining yaxlitligiga va immun javobiga ta'siriga qaratilgan.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Zamonaviy zimologiyada empirik va molekulyar-biologik yondashuvlar ajratiladi. Empirik yondashuv an'anaviy usullarga (masalan, kombucha yordamida non pishirish) tayanadi. Molekulyar yondashuv esa mikroorganizmlarning metabolik yo'llarini va ularning xo'jayin organizmga ta'sirini o'rganadi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vositalar — nazorat qilinadigan bioreaktorlar va mahsulot tarkibini baholashning analitik usullari. Laboratoriya sharoitida mikrobiomni ketma-ketlashtirish va metabolitlar tarkibini aniqlash uchun xromatografik tahlillar qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-aloqalar\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#boshqa-yonalishlar-bilan-aloqalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo'nalishlar bilan aloqalar&lt;/span&gt;&lt;/a&gt;Boshqa yo'nalishlar bilan aloqalar&lt;/h2&gt;\n&lt;p&gt;Zimologiya mikrobiologiya, biokimyo va dietologiya bilan chambarchas bog'liq. U probiotiklar bilan bog'liq, chunki ko'plab fermentlangan mahsulotlar faol madaniyatlarni o'z ichiga oladi. Shuningdek, immunologiya bilan ichak to'sig'i orqali bog'liq.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Chuqur o'rganish uchun oziq-ovqat biotexnologiyasi va mikrobiologiya bo'yicha akademik dasturlarga murojaat qilish tavsiya etiladi. Asosiy bilimlarni lipidologiya, klinik mikrobiologiya va metabolik biologiya bo'yicha ilmiy jurnallardagi sharhlardan olish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-ferment.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — sharh, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1194/jlr.r036012\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The role of short-chain fatty acids in the interplay between diet, gut microbiota, and host energy metabolism&lt;/a&gt; — sharh, J Lipid Res 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.11.1.142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diarrheagenic Escherichia coli&lt;/a&gt; — sharh, Clin Microbiol Rev 1998&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Fermentatsiya","description":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.","vcsPath":"reference/disciplines/dir-ferment.md"},"headings":[{"title":"Nimalarni o'rganadi","href":"reference/disciplines/dir-ferment.html#nimalarni-organadi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-ferment.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-ferment.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Metodlar va vositalar","href":"reference/disciplines/dir-ferment.html#metodlar-va-vositalar","level":2},{"title":"Boshqa yo'nalishlar bilan aloqalar","href":"reference/disciplines/dir-ferment.html#boshqa-yonalishlar-bilan-aloqalar","level":2},{"title":"Qayerda o'qish va nimalarni o'qish kerak","href":"reference/disciplines/dir-ferment.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"reference/disciplines/dir-ferment.html#manbalar","level":2}],"title":"Fermentatsiya"},"router":{"pathname":"reference/disciplines/dir-ferment","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
