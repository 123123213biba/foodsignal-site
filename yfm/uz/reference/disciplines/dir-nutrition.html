            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Нутрициология&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;Начало XX века (открытие витаминов)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Хроматография, масс-спектрометрия, метаболический мониторинг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Journal of Dairy Science, Thyroid, The Lancet&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-nutrition.html\"&gt;Nutrientlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-organiladi\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#nima-organiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima o'rganiladi&lt;/span&gt;&lt;/a&gt;Nima o'rganiladi&lt;/h2&gt;\n&lt;p&gt;Nutrisiologiya — bu oziq-ovqatning kimyoviy tarkibi, organizm tomonidan ozuqa moddalarining so'rilish jarayonlari va ularning hayotiy faoliyatga ta'sirini o'rganadigan ilmiy yo'nalish. Ozuqa moddalari (biologik ahamiyatga ega elementlar) — bu metabolizm, o'sish va to'qimalarni tiklash uchun zarur bo'lgan kimyoviy moddalardir. Soha makronutriyentlar (oqsil, yog', uglevod) parchalanishi, mikronutriyentlar (vitaminlar, minerallar) va bioaktiv birikmalarning (polifenollar) gomeostazni saqlashdagi rolini qamrab oladi.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Intizomning shakllanishi tanqislik holatlarini o'rganish bilan bog'liq. XX asr boshlarida vitaminlar kashf etildi, bu esa muayyan kasalliklarni ma'lum mikroelementlar yetishmasligi bilan bog'lash imkonini berdi. Keyinchalik e'tibor metabolik yo'llarni o'rganishga qaratildi. Hozirgi bosqich ozuqa moddalarining ichak mikrobiotasi bilan o'zaro ta'sirini va birgalikda ovqatlanish kabi ijtimoiy omillarning uglevodlar almashinuviga ta'sirini tadqiq qilish bilan tavsiflanadi.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Nutrisiologiyada oziq-ovqat transformatsiyasining molekulyar mexanizmlariga qaratilgan biokimyoviy yondashuv va ratsionning salomatlikka ta'sirini baholovchi klinik yondashuv ajratiladi. Zamonaviy tadqiqotlar «nutritiv muhandislik» konsepsiyasidan faol foydalanmoqda: masalan, zardob oqsilining parchalanishini sekinlashtirish uchun polifenollardan himoya qobiqlarini yaratish.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat tarkibini baholash uchun xromatografiya va mass-spektrometriya kabi analitik usullar qo'llaniladi. Klinik tadqiqotlarda glikemik javobni monitoring qilish va tana tarkibini tahlil qilish usullari qo'llaniladi. 1-toifa diabet bilan og'rigan bemorlarni o'qitish uchun interaktiv raqamli platformalar an'anaviy bosma materiallarga qaraganda samaraliroq ekanligi aniqlangan.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/h2&gt;\n&lt;p&gt;Nutrisiologiya gastroenterologiya (ovqat hazm qilish jarayonlari), endokrinologiya (moddalar almashinuvini tartibga solish) va mikrobiologiya bilan chambarchas bog'liq. Kletchatkaning mikrobiota bilan o'zaro ta'sirini tushunish immunitet tizimini baholash uchun muhimdir.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Nutrisiologiyani o'rganish biokimyo va inson fiziologiyasi sohasida fundamental tayyorgarlikni talab qiladi. Ta'lim dasturlari universitetlarning tibbiyot va biologiya fakultetlarida taqdim etiladi. Chuqur o'rganish uchun «Journal of Dairy Science» yoki «Thyroid» kabi ilmiy jurnallarga, shuningdek, «The Lancet» darajasidagi nashrlarda chop etilgan tizimli sharhlarga murojaat qilish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-nutrition.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8_%D0%B7%D0%BD%D0%B0%D1%87%D0%B8%D0%BC%D1%8B%D0%B5_%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Биологически значимые элементы — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3168/jds.s0022-0302(91)78551-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Methods for dietary fiber, neutral detergent fiber, and nonstarch polysaccharides in relation to animal nutrition&lt;/a&gt; — sharh, J Dairy Sci 1991&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(21)02724-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis&lt;/a&gt; — sharh, Lancet 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1089/thy.2015.0020\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer: The American Thyroid Association Guidelines Task Force on Thyroid Nodules and Differentiated Thyroid Cancer&lt;/a&gt; — sharh, Thyroid 2016&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Nutrientlar","description":"Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.","vcsPath":"reference/disciplines/dir-nutrition.md"},"headings":[{"title":"Nima o'rganiladi","href":"reference/disciplines/dir-nutrition.html#nima-organiladi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-nutrition.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-nutrition.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Usullar va vositalar","href":"reference/disciplines/dir-nutrition.html#usullar-va-vositalar","level":2},{"title":"Boshqa yo'nalishlar bilan bog'liqlik","href":"reference/disciplines/dir-nutrition.html#boshqa-yonalishlar-bilan-bogliqlik","level":2},{"title":"Qayerda o'qish va nimalarni o'qish kerak","href":"reference/disciplines/dir-nutrition.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"reference/disciplines/dir-nutrition.html#manbalar","level":2}],"title":"Nutrientlar"},"router":{"pathname":"reference/disciplines/dir-nutrition","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
