        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Keyslar: vositalar va usullar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Ekstruziya — bu oziq-ovqat tarkibiy qismlarining tuzilishini o'zgartirish uchun yuqori harorat va bosim ostida doimiy aralashtirish va qorishtirish jarayoni. Texnologiya gazaklar, quruq nonushtalar va o'simlik oqsillaridan teksturatlar ishlab chiqarishda qo'llaniladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/cases/case-extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Vosita&lt;/td&gt;\n&lt;td&gt;Экструдер (термомеханикалық өңдеу құрылғысы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Vazifa&lt;/td&gt;\n&lt;td&gt;Сырьенің құрылымын өзгерту және сіңімділігін басқару&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ma'lumotlar&lt;/td&gt;\n&lt;td&gt;Шоколадтың гликемиялық жауабының өзгеруі, изоляттардағы микотоксиндер&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Natija&lt;/td&gt;\n&lt;td&gt;Өнімнің физикалық қасиеттері мен метаболикалық әсерінің өзгеруі&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"vazifa\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#vazifa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vazifa&lt;/span&gt;&lt;/a&gt;Vazifa&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat sanoati ozuqa moddalarining so‘rilish tezligini boshqarish va o‘simlik xomashyosi xavfsizligini oshirishga intiladi. Asosiy vazifa — shakar, sut oqsillari yoki dukkakli ekinlar kabi komponentlarning fizik-kimyoviy xossalarini o‘zgartirishdan iborat.&lt;/p&gt;\n&lt;h2 id=\"asbob-yoki-usul\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#asbob-yoki-usul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asbob yoki usul&lt;/span&gt;&lt;/a&gt;Asbob yoki usul&lt;/h2&gt;\n&lt;p&gt;Ekstruziya (extrusion) — bu xomashyoni qolip teshigidan (filyera) o‘tkazish orqali uzluksiz aralashtirish, siqish va termik ishlov berish jarayoni. Usul siljish kuchlari va yuqori harorat ta’siriga asoslangan bo‘lib, oqsillarning denaturatsiyasiga va kraxmalning kleysterlanishiga olib keladi.&lt;/p&gt;\n&lt;h2 id=\"qanday-qollanildi\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#qanday-qollanildi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday qo‘llanildi&lt;/span&gt;&lt;/a&gt;Qanday qo‘llanildi&lt;/h2&gt;\n&lt;p&gt;Shokoladning glikemik javobiga ishlov berish ta’sirini o‘rganishda ekstruziya shakar va sut aralashmasiga qo‘llandi. Dukkakli ekinlar (yasmiq, no‘xat) bilan ishlashda ekstruziya o‘simlik oqsillarining holatiga ta’sir qiluvchi usul sifatida ko‘rib chiqiladi, garchi izolyatlardagi mikotoksinlarni nazorat qilish masalasi ochiq qolmoqda.&lt;/p&gt;\n&lt;h2 id=\"natija\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#natija\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natija&lt;/span&gt;&lt;/a&gt;Natija&lt;/h2&gt;\n&lt;p&gt;Shokolad tarkibidagi shakar va sutga ekstruziyani qo‘llash boshqa usullar bilan ishlangan mahsulotlarga nisbatan glikemik javobning o‘zgarishiga olib keldi. Dukkakli ekinlar holatida ekstruziya oqsil tuzilishini o‘zgartiradi, biroq xomashyodagi mog‘or tufayli hosil bo‘lgan mikotoksinlar izolyatlarda saqlanib qolishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h2&gt;\n&lt;p&gt;Ekstruziya xomashyoni mikotoksinlar kabi biologik ifloslanishlardan tozalashning universal usuli emas. Jarayon samaradorligi bosim, harorat va namlik parametrlariga bog‘liq.&lt;/p&gt;\n&lt;h2 id=\"qanday-takrorlash-kerak\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#qanday-takrorlash-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday takrorlash kerak&lt;/span&gt;&lt;/a&gt;Qanday takrorlash kerak&lt;/h2&gt;\n&lt;p&gt;Jarayonni amalga oshirish uchun harorat va bosimni nazorat qiluvchi ekstruder kerak. Xomashyo tarkibini standartlashtirish va filyeradan o‘tish parametrlarini qayd etish talab qilinadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Extrusion\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extrusion — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — sharh, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/bjc.1972.33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a basic biological phenomenon with wide-ranging implications in tissue kinetics&lt;/a&gt; — sharh, Br J Cancer 1972&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm2330\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Membrane lipids: where they are and how they behave&lt;/a&gt; — sharh, Nat Rev Mol Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Keyslar: vositalar
