        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;изучает, как еда влияет на обмен веществ и микробиом&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-nutritionist_researcher.jpg\" alt=\"Нутрициолог-исследователь\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;изучает, как еда влияет на обмен веществ и микробиом&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;биохимия питания, клинические исследования&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ta'lim&lt;/td&gt;\n&lt;td&gt;Академическая подготовка в области нутрициологии, диетологии или биохимии.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qayerda ishlaydi&lt;/td&gt;\n&lt;td&gt;НИИ, R&amp;amp;D-отделы пищевых корпораций, государственные органы здравоохранения.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-nutrition.html\"&gt;Nutrientlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#nima-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima bilan shug‘ullanadi&lt;/span&gt;&lt;/a&gt;Nima bilan shug‘ullanadi&lt;/h2&gt;\n&lt;p&gt;Nutrisiolog-tadqiqotchi — bu oziq moddalarning inson metabolizmi va mikrobiomi bilan o‘zaro ta’sirini klinik ma’lumotlar va biokimyo asosida o‘rganadigan mutaxassis. Patologiyalarda davolovchi ovqatlanish bilan ishlaydigan diyetologdan farqli o‘laroq, nutrisiolog-tadqiqotchi ozuqa moddalarining so‘rilish mexanizmlari, oziq-ovqat matritsalarining sog‘liqqa ta’siri va sog‘lom ovqatlanish strategiyalarini ishlab chiqishga e’tibor qaratadi.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Mutaxassis oziq-ovqat komponentlarining organizmga ta’sirini tahlil qiladi. Sanoatda bu zardob oqsilining parchalanishini sekinlashtirish yoki funksional mahsulotlar yaratish uchun tabiiy katalizatorlardan foydalanish bo‘lishi mumkin. Klinik amaliyotda nutrisiolog-tadqiqotchi Pediococcus acidilactici PA53 shtammining yallig‘lanish markerlariga ta’siri kabi aralashuvlar samaradorligini baholaydi. Shuningdek, diabet bilan og‘rigan bemorlar uchun o‘qitish usullarini ishlab chiqish va birgalikda ovqatlanishning uglevodlar almashinuviga ta’siri kabi ijtimoiy omillarni tahlil qilish ham vazifalarga kiradi.&lt;/p&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko‘nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko‘nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Ish uchun ovqatlanish biokimyosi, mikrobiologiya va klinik tadqiqot usullari bo‘yicha bilimlar talab etiladi. Asboblar to‘plamiga meta-tahlillar va tizimli sharhlarni qayta ishlash uchun statistik paketlar kiradi. Muhim ko‘nikma — tana tarkibini baholash usullarini bilish va mahsulotlarning ozuqaviy tarkibi to‘g‘risidagi ma’lumotlarni talqin qilishdir.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o‘qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o‘qish kerak&lt;/h2&gt;\n&lt;p&gt;Bazaviy ta’lim nutrisiologiya, diyetologiya yoki biokimyo sohasidagi akademik tayyorgarlikni o‘z ichiga oladi. Kasbiy yo‘l tizimli sharhlar va meta-tahlillarni o‘rganish hamda klinik tadqiqotlarda ishtirok etishni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-qanday-osish\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#qayerda-ishlash-va-qanday-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va qanday o‘sish&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va qanday o‘sish&lt;/h2&gt;\n&lt;p&gt;Nutrisiolog-tadqiqotchilar ilmiy-tadqiqot institutlari, oziq-ovqat korporatsiyalarining R&amp;amp;D bo‘limlari, sog‘liqni saqlash davlat organlari va ta’lim markazlarida ishlaydilar. Karyera o‘sishi tadqiqot natijalarini ilmiy jurnallarda nashr etish va funksional oziq-ovqat mahsulotlarini yaratish loyihalariga rahbarlik qilish bilan bog‘liq.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D1%83%D1%82%D1%80%D0%B8%D1%86%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нутрициология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Nutrition_label.gif\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Wikimedia Commons, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pone.0251142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Assessment of body composition in spinal cord injury: A scoping review&lt;/a&gt; — sharh, PLoS One 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12884-025-07185-z\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effective dietary interventions during pregnancy: a systematic review and meta-analysis of behavior change techniques to promote healthy eating&lt;/a&gt; — sharh, BMC Pregnancy Childbirth 2025&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu13114161\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Trends in the Number of Behavioural Theory-Based Healthy Eating Interventions Inclusive of Dietitians/Nutritionists in 2000-2020&lt;/a&gt; — sharh, Nutrients 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"изучает, как еда влияет на обмен веществ и микробиом"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Нутрициолог-исследователь","description":"изучает, как еда влияет на обмен веществ и микробиом","vcsPath":"reference/professions/prof-nutritionist_researcher.md"},"headings":[{"title":"Nima bilan shug‘ullanadi","href":"reference/professions/prof-nutritionist_researcher.html#nima-bilan-shugullanadi","level":2},{"title":"Tipik vazifalar","href":"reference/professions/prof-nutritionist_researcher.html#tipik-vazifalar","level":2},{"title":"Ko‘nikmalar va vositalar","href":"reference/professions/prof-nutritionist_researcher.html#konikmalar-va-vositalar","level":2},{"title":"Qayerda o‘qish kerak","href":"reference/professions/prof-nutritionist_researcher.html#qayerda-oqish-kerak","level":2},{"title":"Qayerda ishlash va qanday o‘sish","href":"reference/professions/prof-nutritionist_researcher.html#qayerda-ishlash-va-qanday-osish","level":2},{"title":"Manbalar","href":"reference/professions/prof-nutritionist_researcher.html#manbalar","level":2}],"title":"Нутрициолог-исследователь"},"router":{"pathname":"reference/professions/prof-nutritionist_researcher","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
