        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;оценивает риски, сроки годности, упаковку и аллергены&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;оценивает риски, сроки годности, упаковку и аллергены&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;HACCP, токсикология, регуляторика (ЕАЭС, Codex)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ta'lim&lt;/td&gt;\n&lt;td&gt;Пищевые технологии, ветеринария, микробиология, стандарты ISO 22000.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qayerda ishlaydi&lt;/td&gt;\n&lt;td&gt;Пищевые производства, лаборатории контроля, госорганы, R&amp;amp;D центры.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-safety.html\"&gt;Xavfsizlik va saqlash&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Oziq-ovqat qo'shimchalari&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#nima-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima bilan shug'ullanadi&lt;/span&gt;&lt;/a&gt;Nima bilan shug'ullanadi&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat xavfsizligi bo'yicha mutaxassis — bu ishlab chiqarishdan tortib qadoqlashgacha bo'lgan barcha bosqichlarda oziq-ovqat mahsulotlarining belgilangan sifat va gigiyena standartlariga muvofiqligini ta'minlaydigan professionaldir. Uning ishi mahsulotlarning buzilishiga yoki iste'molchilarning kasallanishiga olib kelishi mumkin bo'lgan biologik, kimyoviy va fizik xavflarning oldini olishga qaratilgan.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Kundalik ish ishlab chiqarish jarayonlarini monitoring qilish va mahsulotlarning buzilish sabablarini tahlil qilishni o'z ichiga oladi. Mutaxassis souslarning qadoqda nima uchun «achishi» yoki yorug'lik ta'sirida yog'larning oksidlanishini qanday oldini olishni o'rganadi. Loyihalar doirasida u saqlashning yangi texnologiyalarini joriy qiladi: sitrus ekstraktlari asosidagi yeyiladigan plyonkalardan tortib, timyan efir moylari qo'shilgan biologik parchalanadigan qadoqlargacha.&lt;/p&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko'nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vosita — HACCP (XASSP) tizimi, ya'ni xavflarni tahlil qilish va tanqidiy nazorat nuqtalari protokoli. Mutaxassis toksikologik tahlil usullarini bilishi, EAII (TR TS 021/2011 va 029/2012) va Codex Alimentarius talablarini tushunishi kerak. Shuningdek, mikrobiologik barqarorlikni baholash va ionlashtiruvchi nurlanishning ta'sirini o'rganish muhim ahamiyatga ega.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Asosiy ta'lim oziq-ovqat texnologiyalari, veterinariya tibbiyoti yoki mikrobiologiya sohasini qamrab oladi. Mutaxassislar oziq-ovqat gigiyenasi, kimyosi va sifat menejmenti fanlarini o'rganadilar. Qo'shimcha ta'lim ISO 22000 tizimlarini joriy etish bo'yicha kurslar orqali amalga oshiriladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-osish\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#qayerda-ishlash-va-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va o'sish&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va o'sish&lt;/h2&gt;\n&lt;p&gt;Mutaxassislar oziq-ovqat korxonalarida, sifat nazorati laboratoriyalarida, davlat nazorat organlarida va ilmiy-tadqiqot markazlarida talabga ega. Karyera o'sishi sifat bo'yicha muhandislikdan xavfsizlik bo'limi rahbarligigacha yoki xalqaro tizimlar auditorligigacha bo'lishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-food_safety_specialist.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D0%B1%D0%BB%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%D0%BE%D0%B2_%D0%BF%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Облучение продуктов питания — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://europepmc.org/article/MED/9262857\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ecosystem health as a clinical rotation for senior students in Canadian veterinary schools&lt;/a&gt; — sharh, Can Vet J 1997&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"оценивает риски, сроки годности, упаковку и аллергены"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Специалист по безопасности пищевых продуктов","description":"оценивает риски, сроки годности, упаковку и аллергены","vcsPath":"reference/professions/prof-food_safety_specialist.md"},"headings":[{"title":"Nima bilan shug'ullanadi","href":"reference/professions/prof-food_safety_specialist.html#nima-bilan-shugullanadi","level":2},{"title":"Tipik vazifalar","href":"reference/professions/prof-food_safety_specialist.html#tipik-vazifalar","level":2},{"title":"Ko'nikmalar va vositalar","href":"reference/professions/prof-food_safety_specialist.html#konikmalar-va-vositalar","level":2},{"title":"Qayerda o'qish kerak","href":"reference/professions/prof-food_safety_specialist.html#qayerda-oqish-kerak","level":2},{"title":"Qayerda ishlash va o'sish","href":"reference/professions/prof-food_safety_specialist.html#qayerda-ishlash-va-osish","level":2},{"title":"Manbalar","href":"reference/professions/prof-food_safety_specialist.html#manbalar","level":2}],"title":"Специалист по безопасности пищевых продуктов"},"router":{"pathname":"reference/professions/prof-food_safety_specialist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
