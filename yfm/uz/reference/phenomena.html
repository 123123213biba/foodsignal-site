        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;15 ta tushuncha&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/antimicrobial-resistance.html\"&gt;Антибиотикорезистентность&lt;/a&gt; — Mikroorganizmlarning maxsus genlar mavjudligi tufayli antibiotiklar ta'sirida hayotiy qobiliyatini saqlab qolish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secondary-nucleation.html\"&gt;Вторичная нуклеация&lt;/a&gt; — Mavjud kristallar yoki zarralar mavjudligi sababli o'ta to'yingan eritmada yangi kristallarning hosil bo'lish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-production.html\"&gt;газообразование&lt;/a&gt; — Mikroorganizmlar faoliyati natijasida yuzaga keladigan va qadoqning shishishiga olib keladigan oziq-ovqat mahsulotlarining buzilish nuqsoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glycogen-hepatopathy.html\"&gt;Гликогеновая гепатопатия&lt;/a&gt; — Jigarda glikogenning ortiqcha to'planishi bilan tavsiflanadigan, yuqori uglevodli ratsion tufayli yuzaga keladigan patologik holat.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimorbidity.html\"&gt;Мультиморбидность&lt;/a&gt; — Bir bemorda bir vaqtning o'zida ikki yoki undan ortiq surunkali kasalliklar mavjud bo'lgan holat.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acute-gastric-mucosal-lesion.html\"&gt;Острое повреждение слизистой оболочки желудка&lt;/a&gt; — Etanolning haddan tashqari ko'p iste'mol qilinishi natijasida yuzaga keladigan va oshqozon shilliq qavatining to'siq funksiyasining…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postprandial-metabolic-response.html\"&gt;Постпрандиальный метаболический ответ&lt;/a&gt; — Ovqatlangandan keyin inson qonidagi glyukoza, insulin va triglitseridlar darajasining o'zgarishi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maillard-reaction.html\"&gt;реакция Майяра&lt;/a&gt; — Isitish jarayonida aminokislotalar va qandlar o'rtasidagi kimyoviy reaksiya, o'ziga xos aromatik va ta'm beruvchi birikmalarni hosil qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sarcopenia.html\"&gt;Саркопения&lt;/a&gt; — Sarkopeniya — mushak massasi va kuchining yo'qolishi bilan tavsiflanadigan, jismoniy zaiflikka olib keladigan yoshga bog'liq degenerativ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/type-1-diabetes.html\"&gt;сахарный диабет 1 типа&lt;/a&gt; — Bolalar va o'smirlar orasida keng tarqalgan, glikemik nazoratni, insulin yuborishni va ovqatlanishni boshqarishni talab qiladigan surunkali…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pi3k-akt-mtor-signaling-pathway.html\"&gt;Сигнальный путь PI3K/AKT/mTOR&lt;/a&gt; — Aktivlanishi mushak oqsili sinteziga va mushak atrofiyasini bostirishga yordam beradigan biokimyoviy yo'l.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-physiology.html\"&gt;Социальная физиология&lt;/a&gt; — Yaqin kishining mavjudligi stress ta'sirida organizmga tushadigan fiziologik yukni kamaytiradigan hodisa.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/disconfirmation.html\"&gt;Феномен дезавуирования&lt;/a&gt; — Mahsulot haqida qo'shimcha ma'lumot olgandan so'ng iste'molchining baholashining o'zgarishi psixologik effekti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-constipation.html\"&gt;функциональный запор&lt;/a&gt; — Ichaklarning surunkali buzilishi bo'lib, kamdan-kam defekatsiya (haftasiga uch martadan kam), qattiq najas va to'liq bo'shalmaslik hissi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cytokine-storm.html\"&gt;Цитокиновый шторм&lt;/a&gt; — Organizm to'qimalariga zarar yetkazadigan yallig'lanishga qarshi sitokinlarning nazoratsiz ajralib chiqishi bilan tavsiflanadigan ortiqcha…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"15 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Hodisalar","description":"15 ta tushuncha","vcsPath":"reference/phenomena.md"},"headings":[],"title":"Hodisalar"},"router":{"pathname":"reference/phenomena","depth"
