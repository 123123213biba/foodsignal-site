uz berish ehtimolining nazorat guruhidagi ehtimolga nisbatini aks ettiruvchi ko'rsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peroxide-value.html\"&gt;перекисное число&lt;/a&gt; — Go'sht mahsulotlarining yangiligini baholash uchun ishlatiladigan yog'larning oksidlanish darajasi ko'rsatkichi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;Площадь под гликемической кривой&lt;/a&gt; — Ovqatdan keyin qondagi glyukoza darajasining bazaviy darajadan og'ishining umumiy kattaligi va davomiyligini aks ettiruvchi ko'rsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/margin-of-exposure.html\"&gt;Расчетный предел воздействия&lt;/a&gt; — Qo'rg'oshin ta'sir qilish xavfini baholash uchun ishlatiladigan kimyoviy xavfsizlik ko'rsatkichi, bunda 10 dan past qiymat EFSA…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Hisob-kitoblar aniqligi ko'rsatkichi, sun'iy intellekt yoki ekspertlar tomonidan olingan qiymatlarning etalon ma'lumotlardan o'rtacha…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gel-hardness.html\"&gt;твердость геля&lt;/a&gt; — Surimining mexanik mustahkamlik ko'rsatkichi, 1,1% oshqovoq kukuni qo'shilganda 313,69 ± 2,54 g qiymatiga yetadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-stability.html\"&gt;Термостабильность&lt;/a&gt; — Oqsil mahsulotining yuqori harorat ta'sirida o'z xususiyatlarini saqlab qolish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thiobarbituric-acid-reactive-substances.html\"&gt;тиобарбитуровое число&lt;/a&gt; — Lipidlarning oksidlanish buzilish intensivligini aks ettiruvchi malon dialdegid miqdori metri.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transepithelial-electrical-resistance.html\"&gt;Трансэпителиальное электрическое сопротивление&lt;/a&gt; — Hujayra monolayining yaxlitligi va to'siq funksiyasining ko'rsatkichi, Ohm·sm² da o'lchanadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cielab-color-space.html\"&gt;Цветовые индексы CIELab&lt;/a&gt; — Mahsulotning optik xususiyatlarini yorqinlik (L*) va rang o'qlari (a* va b*) parametrlari orqali miqdoriy baholash tizimi.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"18 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Metrikalar","description":"18 ta tushuncha","vcsPath":"reference/metrics.md"},"headings":[],"title":"Metrikalar"},"router":{"pathname":"reference/metrics","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
