        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Институт пищевых технологов (США): крупнейшая научная программа и выставка&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-ift_first.jpg\" alt=\"IFT FIRST\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Институт пищевых технологов (США): крупнейшая научная программа и выставка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;программа и аннотации докладов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;Institute of Food Technologists (IFT)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Научная конференция и выставка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;ift.org&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Oziq-ovqat qo'shimchalari&lt;/a&gt;, &lt;a href=\"concepts/spec-newfood.html\"&gt;Yangi taomlar&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Xavfsizlik va saqlash&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;IFT FIRST (Food Improved by Research, Science, and Technology) — oziq-ovqat texnologiyalari, nutritsiologiya va oziq-ovqat xavfsizligi sohasidagi ekspertlarni birlashtiruvchi yillik ilmiy tadbir. Konferensiya laboratoriya protokollarini sanoat yechimlariga aylantiruvchi amaliy tadqiqotlarni taqdim etish maydonidir. Tadbirning asosiy maqsadi — kundalik iste'mol qilinadigan oziq-ovqat sifatini, ozuqaviy qiymatini va xavfsizligini oshirishga qodir innovatsiyalarni namoyish etish.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Ushbu tadbir Oziq-ovqat texnologlari instituti (Institute of Food Technologists, IFT) tomonidan o‘tkaziladi. Bu AQShda joylashgan xalqaro professional tashkilot bo‘lib, oziq-ovqat sanoati olimlari, muhandislari va mutaxassislarini birlashtiradi. Konferensiya o‘z turidagi eng yirik dastur hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiya dasturi oziq-ovqat muhandisligi va kimyosi bilan bog‘liq keng ko‘lamli fanlarni qamrab oladi. Asosiy yo‘nalishlar: qayta ishlash texnologiyalari, xavfsizlik va saqlash, funksional ingredientlar hamda xavflarni tahlil qilish.&lt;/p&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo‘ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo‘ladi&lt;/h2&gt;\n&lt;p&gt;IFT FIRST'da oziq-ovqat ishlab chiqarishga yondashuvni o‘zgartiradigan tadqiqot natijalari birinchi marta namoyish etiladi. Masalan, shakar va sutni ekstruziya qilish parametrlarini o‘zgartirish orqali glikemik javobni pasaytirish usullari yoki suyuq tutun va nanoemulsiya yordamida mahsulotlar yangiligini saqlash usullari muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Ishtirokchilar institut tomonidan nashr etiladigan tezislar to‘plamlari va ma’ruzalar annotatsiyalari orqali ilmiy natijalar bilan tanishishlari mumkin. Mutaxassislar uchun konferensiya materiallaridan foydalanish yangi xavfsizlik standartlari uchun asos bo‘ladigan tadqiqot protokollarini o‘rganish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-ift_first.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D0%B8%D1%81%D0%BE%D0%BA_%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D0%BA%D0%BE%D0%B2_%D1%80%D0%B0%D0%BA%D0%B5%D1%82%D1%8B-%D0%BD%D0%BE%D1%81%D0%B8%D1%82%D0%B5%D0%BB%D1%8F_Starship\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Список запусков ракеты-носителя Starship — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Starship-IFT2-ascent_(cropped).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Osunpokeh, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrg2774\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The primary cilium: a signalling centre during vertebrate development&lt;/a&gt; — sharh, Nat Rev Genet 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.tibs.2015.09.003\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IFT-Cargo Interactions and Protein Transport in Cilia&lt;/a&gt; — sharh, Trends Biochem Sci 2015&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1083/jcb.200709133\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Intraflagellar transport motors in cilia: moving along the cell's antenna&lt;/a&gt; — sharh, J Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Институт пищевых технологов (США): крупнейшая научная программа и выставка"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IFT FIRST","description":"Институт пищевых технологов (США): крупнейшая научная программа и выставка","vcsPath":"reference/conferences/conf-ift_first.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-ift_first.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-ift_first.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-ift_first.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo‘ladi","href":"reference/conferences/conf-ift_first.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-ift_first.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-ift_first.html#manbalar","level":2}],"title":"IFT FIRST"},"router":{"pathname":"reference/conferences/conf-ift_first","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
