        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;европейская конференция по пищевой химии&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;европейская конференция по пищевой химии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;программа, тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;EuChemS (Отделение пищевой химии)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Регулярно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Международная научная конференция (доклады, тезисы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы EuChemS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Oziq-ovqat qo'shimchalari&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Xavfsizlik va saqlash&lt;/a&gt;, &lt;a href=\"concepts/spec-nutrition.html\"&gt;Nutrientlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;Euro Food Chem — bu oziq-ovqat kimyosining fundamental va amaliy jihatlariga bag'ishlangan xalqaro ilmiy konferensiyalar turkumi. Tadbir tadqiqotchilar, texnologlar va oziq-ovqat sanoati vakillari o'rtasida ma'lumot almashish maydonidir. Konferensiyaning asosiy maqsadi — oziq-ovqat mahsulotlarini ishlab chiqarish, saqlash va qayta ishlash jarayonida yuz beradigan kimyoviy jarayonlarni muhokama qilish, shuningdek, ushbu jarayonlarning oziq-ovqat sifati va xavfsizligiga ta'sirini baholash.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Konferensiya Yevropa kimyo jamiyatlari assotsiatsiyasining (EuChemS) Oziq-ovqat kimyosi bo'limi shafeligida o'tkaziladi. Tadbir muntazam ravishda o'tkazilib, oziq-ovqat fanidagi dolzarb muammolarni muhokama qilish uchun butun dunyodan ekspertlarni to'playdi. Ushbu ilmiy konferensiyani o'g'itlar ishlab chiqaruvchi «Yevroxim» kimyo kompaniyasi bilan adashtirmaslik kerak: bular bir-biriga bog'liq bo'lmagan turli tushunchalardir.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Euro Food Chem ilmiy dasturi keng ko'lamli fanlarni qamrab oladi. Asosiy seksiyalar odatda quyidagilarni o'z ichiga oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Oziq-ovqat mahsulotlarining analitik kimyosi: tarkib va sifatni aniqlash usullari.&lt;/li&gt;\n&lt;li&gt;Qayta ishlash texnologiyalari: xomashyo xossalarini o'zgartirish usullari.&lt;/li&gt;\n&lt;li&gt;Xavfsizlik va barqarorlik: mahsulotlarning aynish jarayonlarini o'rganish.&lt;/li&gt;\n&lt;li&gt;Nutrisiologiya va funksional ovqatlanish: oziq-ovqat komponentlarining organizmga ta'sirini tadqiq qilish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-namoyish-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#u-yerda-nimalar-namoyish-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar namoyish etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar namoyish etiladi&lt;/h2&gt;\n&lt;p&gt;Euro Food Chem'da kelajakda oziq-ovqat texnologiyalariga ta'sir ko'rsatadigan tadqiqot natijalari birinchi marta taqdim etiladi. Bularga chiqindilarni qimmatli oqsilga aylantirish usullari, sabzavotlarning saqlash muddatini uzaytirish uchun himoya qoplamalari va probiotik shtammlarning klinik sinovlari kiradi. Konferensiya dastlabki ma'lumotlar ilmiy hamjamiyat tomonidan ekspert bahosidan o'tadigan filtr vazifasini bajaradi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiyada ishtirok etish o'z ilmiy ishlarini og'zaki ma'ruzalar yoki stend sessiyalari ko'rinishida taqdim etishni nazarda tutadi. Shaxsan ishtirok etmaydiganlar uchun asosiy ma'lumot manbai tadbir yakunlari bo'yicha nashr etiladigan tezislar to'plamidir (Abstract Books). E'lonlarni EuChemS rasmiy resurslari orqali kuzatish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-eurofoodchem.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%95%D0%B2%D1%80%D0%BE%D1%85%D0%B8%D0%BC\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Еврохим — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"европейская конференция по пищевой химии"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Euro Food Chem","description":"европейская конференция по пищевой химии","vcsPath":"reference/conferences/conf-eurofoodchem.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-eurofoodchem.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-eurofoodchem.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-eurofoodchem.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar namoyish etiladi","href":"reference/conferences/conf-eurofoodchem.html#u-yerda-nimalar-namoyish-etiladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-eurofoodchem.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-eurofoodchem.html#manbalar","level":2}],"title":"Euro Food Chem"},"router":{"pathname":"reference/conferences/conf-eurofoodchem","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
