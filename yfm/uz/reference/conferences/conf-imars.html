        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-imars.jpg\" alt=\"IMARS — International Maillard Reaction Society\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;International Maillard Reaction Society (IMARS)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Регулярно (симпозиумы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Международная научная конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Официальные публикации тезисов и сборники материалов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt;, &lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Xavfsizlik va saqlash&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;IMARS (International Maillard Reaction Society) — bu Mayyar reaksiyasini o'rganishga bag'ishlangan xalqaro ilmiy jamiyat va simpoziumlar seriyasi. Mayyar reaksiyasi — bu aminokislotalar va qandlarning qizdirilganda o'zaro ta'siri bo'lib, u xushbo'y birikmalar, melanoidinlar va potentsial ifloslantiruvchi moddalarning hosil bo'lishiga olib keladi. Konferensiya oziq-ovqat texnologlari, nutritsiologlar va xavfsizlik bo'yicha mutaxassislar uchun asosiy maydon hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;IMARS hamjamiyati mahsulotlarning fermentativ bo'lmagan qorayishi bo'yicha fundamental va amaliy tadqiqotlar olib boruvchi olimlarni birlashtiradi. Tashkilot faoliyati quritilgan krevetkalardan tortib shokolad ekstruziyasigacha bo'lgan texnologik jarayonlarda reaksiyaning mexanizmlarini tizimlashtirishga qaratilgan.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Simpoziumlarning ilmiy dasturi bir nechta muhim yo'nalishlarni qamrab oladi:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Sensor profil: Mayyar reaksiyasi mahsulotlarining ta'm, hid va rangga ta'siri.&lt;/li&gt;\n&lt;li&gt;Kimyoviy xavfsizlik: ultra-qayta ishlangan mahsulotlarda akrilamid va boshqa xavfli birikmalarning hosil bo'lishi.&lt;/li&gt;\n&lt;li&gt;Nazorat texnologiyalari: mahsulot sifatini yaxshilash uchun reaksiyani boshqarish usullari.&lt;/li&gt;\n&lt;li&gt;Biologik ta'sirlar: mahsulotlarning organizm tomonidan hazm bo'lishi va glikemik javobga ta'siri.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;Nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;IMARS simpoziumlarida meta-tahlillar, mahsulotlarni barqarorlashtirish bo'yicha laboratoriya tajribalari va saqlashning innovatsion yondashuvlari taqdim etiladi. Ishtirokchilar dengiz mahsulotlarining yangiligini saqlash yoki shokoladning glikemik indeksini o'zgartirish kabi masalalarni muhokama qiladilar.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Jamiyat faoliyatini tezislar va konferensiya materiallari to'plamlari orqali kuzatish mumkin. Ishtirok etish o'z tadqiqotlarini taqdim etishni nazarda tutadi. Bu oziq-ovqat texnologiyalari sohasidagi mutaxassislar uchun kimyoviy o'zgarishlarni molekulyar darajada nazorat qilish bo'yicha ishonchli ma'lumot manbaidir.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Mars\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mars — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Mars_-_August_30_2021_-_Flickr_-_Kevin_M._Gill.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Kevin Gill from Los Angeles, CA, United States, CC BY 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IMARS — International Maillard Reaction Society","description":"симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса","vcsPath":"reference/conferences/conf-imars.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-imars.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-imars.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-imars.html#mavzular-va-seksiyalar","level":2},{"title":"Nimalar taqdim etiladi","href":"reference/conferences/conf-imars.html#nimalar-taqdim-etiladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-imars.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-imars.html#manbalar","level":2}],"title":"IMARS — International Maillard Reaction Society"},"router":{"pathname":"reference/conferences/conf-imars","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
