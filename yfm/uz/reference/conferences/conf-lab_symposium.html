        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;молочнокислые бактерии и ферментация&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;молочнокислые бактерии и ферментация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-ferment.html\"&gt;Fermentatsiya&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;Symposium on Lactic Acid Bacteria (Sut kislotasi bakteriyalari simpoziumi) — bu Yevropa mikrobiologiya jamiyatlari federatsiyasi (FEMS) tomonidan tashkil etilgan ixtisoslashgan ilmiy maydon. Konferensiya sut kislotasi bakteriyalari (SKB) va ularning oziq-ovqat texnologiyalari, tibbiyot va biotexnologiyadagi rolini oʻrganish natijalarini taqdim etish jarayonidir. Tadbirning asosiy maqsadi fermentatsiya mexanizmlarini va mikroorganizmlarning oziq-ovqat mahsulotlari sifatiga taʼsirini muhokama qilishdir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Tashkilotchi — Yevropaning mikrobiologiya jamiyatlarini birlashtiruvchi xalqaro tashkilot FEMS. Simpozium muntazam ravishda oʻtkaziladi va akademik olimlar hamda oziq-ovqat sanoati mutaxassislari uchun markaziy uchrashuv joyi hisoblanadi. Tadbir mikrobiologiyaning fundamental tadqiqotlariga qaratilgan boʻlib, ular keyinchalik kaju yongʻogʻidan tayyorlangan pishloq analoglari yoki doujir kabi anʼanaviy ichimliklar kabi yangi mahsulotlarni yaratishda qoʻllaniladi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Ilmiy dastur bakteriyalar genetikasi va metabolizmidan tortib, ularning inson salomatligiga taʼsirigacha boʻlgan keng koʻlamli masalalarni qamrab oladi. Asosiy seksiyalar:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;SKB metabolizmi va fiziologiyasi: bakteriyalarning uglevodlarni sut kislotasiga aylantirish jarayonlarini oʻrganish.&lt;/li&gt;\n&lt;li&gt;Oziq-ovqat xavfsizligi va sifati: kraft mahsulotlaridagi xavflarni baholash va mikrobiologik tarkibni nazorat qilish.&lt;/li&gt;\n&lt;li&gt;Funksional mahsulotlar: fermentlangan ichimliklarning (masalan, qaragʻay urugʻlari yoki mung loviyalari) ichak toʻsiqlari funksiyasi va immunitetga taʼsirini tadqiq qilish.&lt;/li&gt;\n&lt;li&gt;Achitqi texnologiyalari: non fermentatsiyasini tezlashtirish va uning organoleptik xususiyatlarini yaxshilash uchun kombucha kabi madaniyatlardan foydalanish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;Nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;Simpoziumda oziq-ovqat ishlab chiqarishga yondashuvni oʻzgartiradigan maʼlumotlar birinchi marta eʼlon qilinadi. Ishtirokchilar achitqi tarkibini tahlil qilish natijalari, muqobil sut mahsulotlarining xavfsizligi va anʼanaviy fermentlangan ichimliklarning biologik faolligi toʻgʻrisidagi dalillarni taqdim etadilar.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Natijalarni tezislar va FEMS hisobotlari orqali kuzatish mumkin. Ishtirok etish oʻz tadqiqotlaringizni stend yoki ogʻzaki sessiya uchun taqdim etishni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-lab_symposium.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Sourdough\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sourdough — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"молочнокислые бактерии и ферментация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Symposium on Lactic Acid Bacteria (FEMS)","description":"молочнокислые бактерии и ферментация","vcsPath":"reference/conferences/conf-lab_symposium.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-lab_symposium.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-lab_symposium.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-lab_symposium.html#mavzular-va-seksiyalar","level":2},{"title":"Nimalar taqdim etiladi","href":"reference/conferences/conf-la
