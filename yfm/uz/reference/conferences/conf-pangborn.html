        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;как люди воспринимают вкус&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;как люди воспринимают вкус&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество сенсорных ученых&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Раз в два года (в нечетные годы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Научная конференция (4–5 дней, 800–1000 участников)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Официальный сайт конференции (выбирается за 2 года до события)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;Pangborn Sensory Science Symposium — oziq-ovqat mahsulotlarini sensor tahlil qilish va iste'molchilar xulq-atvorini o'rganishga bag'ishlangan xalqaro ilmiy konferensiya. Tadbir ta'm, hid va teksturani idrok etishni tahlil qiluvchi olimlar, texnologlar va mutaxassislar o'rtasida bilim almashish maydonidir. Konferensiya sensor tadqiqotlar sohasidagi kashshof Rouz Mari Pangborn sharafiga nomlangan.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Simpozium har ikki yilda bir marta, odatda toq yillarda o'tkaziladi. O'tkazilish joyi ikki yil oldin tanlanadi, bu esa turli mamlakatlardagi ilmiy hamjamiyatlarni qamrab olish imkonini beradi. Tadbir o'rtacha 800–1000 nafar ishtirokchini to'playdi. Ilmiy dastur 4–5 kun davom etadi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Simpoziumning asosiy mavzulari mahsulot sifatini baholash usullari, idrok psixologiyasi va yangi oziq-ovqat texnologiyalarini ishlab chiqishni qamrab oladi. Asosiy seksiyalar quyidagilarni o'z ichiga oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Sensor tahlil metodologiyasi: baholash protokollarini muhokama qilish.&lt;/li&gt;\n&lt;li&gt;Iste'molchi fani: oziq-ovqat tanlashga ta'sir qiluvchi omillarni o'rganish.&lt;/li&gt;\n&lt;li&gt;Texnologik innovatsiyalar: ishlov berish usullari (masalan, sublimatsiya yoki fermentatsiya) mahsulotning sensor profilini qanday o'zgartirishini tahlil qilish.&lt;/li&gt;\n&lt;li&gt;Idrok fiziologiyasi: inson ta'm va hidni qanday aniqlashini o'rganish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#u-yerda-nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;Simpoziumda oziq-ovqat ishlab chiqarishga yondashuvni o'zgartiruvchi tadqiqot natijalari birinchi marta taqdim etiladi. Masalan, sublimatsiya jarayonida krevetkadagi umami ta'mini saqlab qolish yoki yakon ildizidan biologik jarayonlar orqali mannitol olish usullari muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Ishtirok etish uchun tadqiqotchilar o'z ishlarining tezislarini taqdim etadilar. Konferensiyaning rasmiy resurslari orqali bo'lajak uchrashuvlar va o'tgan tadbirlar tezislari to'plamlarini kuzatib borish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Pangborn_Sensory_Science_Symposium\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pangborn Sensory Science Symposium — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/1541-4337.70197\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Preferred Attribute Elicitation (PAE) in the Sensory Descriptive Analysis of Foods: A Deep Comprehensive Review of the Method Steps, Application, Challenges, and Trends&lt;/a&gt; — sharh, Compr Rev Food Sci Food Saf 2025&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"как люди воспринимают вкус"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Pangborn Sensory Science Symposium","description":"как люди воспринимают вкус","vcsPath":"reference/conferences/conf-pangborn.md"},"headings":[{"title":"K
