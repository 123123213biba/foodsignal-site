        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;реология и структура пищевых продуктов&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;реология и структура пищевых продуктов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;труды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество специалистов по реологии и структуре пищевых продуктов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Регулярно, согласно графику профильных научных ассоциаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Научный симпозиум с представлением тезисов и публикацией трудов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы профильных научных ассоциаций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-structure.html\"&gt;Tekstura va oziq-ovqat fizikasi&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;ISFRS (International Symposium on Food Rheology and Structure) — oziq-ovqat mahsulotlarining fizik xossalarini o‘rganishga bag‘ishlangan ilmiy tadbir. Reologiya bu yerda moddaning deformatsiyasi va oqimi haqidagi fan sifatida, struktura esa mahsulot ichidagi komponentlarning fazoviy joylashuvi sifatida qaraladi. Konferensiya fiziklar, kimyogarlar va texnologlarni birlashtirib, oziq-ovqat mikrostrukturasi uning teksturasi, barqarorligi va qayta ishlash jarayonidagi xulq-atvorini qanday belgilashini muhokama qiladi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;ISFRS — bu oziq-ovqat fizikasi tamoyillarini muhokama qiladigan xalqaro maydon. Konferensiya molekulyar o‘zaro ta’sirlarni biz iste’mol qiladigan mahsulotlarning makroskopik xossalari bilan bog‘lab, fanlararo yondashuvga e’tibor qaratadi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiyaning asosiy mavzulari quyidagilarni qamrab oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Murakkab tizimlar reologiyasi: emulsiyalar, gellar va ko‘piklar xulq-atvorini o‘rganish.&lt;/li&gt;\n&lt;li&gt;Strukturaviy tahlil: oziq-ovqat matritsalarining ichki arxitekturasini o‘lchash usullari.&lt;/li&gt;\n&lt;li&gt;Teksturani modifikatsiya qilish: masalan, baliq qiyma mahsulotlarining xossalarini yaxshilash uchun sabzavot kukunlaridan foydalanish.&lt;/li&gt;\n&lt;li&gt;Biomateriallar va qadoqlash: baliq terisidan olinadigan yeyiladigan plyonkalar.&lt;/li&gt;\n&lt;li&gt;Metabolik jihatlar: oziq-ovqat strukturasi va uning hazm bo‘lishi o‘rtasidagi bog‘liqlik.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#u-yerda-nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;ISFRSda oziq-ovqat texnologiyalariga yondashuvni o‘zgartiradigan tadqiqot natijalari namoyish etiladi. Masalan, qovoq kukunining surimi baliq qiyma mahsulotlaridagi oqsil bog‘lanishlariga ta’siri yoki biologik parchalanadigan qadoqlash materiallari. Konferensiya polimerlar fizikasi sohasidagi fundamental kashfiyotlar sanoat uchun amaliy yechimlarga aylanadigan joydir.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-isfrs.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Ishtirok etish uchun tadqiqotchilar odatda o‘z ishlarining tezislarini taqdim etadilar. Natijalarni konferensiya to‘plamlari orqali kuzatish mumkin. Ishtirok etish mutaxassislarga yopishqoqlik, elastiklik va mustahkamlikni o‘lchash metodologiyalari bo‘yicha ma’lumot almashish imkonini beradi.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"реология и структура пищевых продуктов"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ISFRS — Food Rheology and Structure","description":"реология и структура пищевых продуктов","vcsPath":"reference/conferences/conf-isfrs.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-isfrs.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-isfrs.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-isfrs.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar taqdim etiladi","href":"reference/conferences/conf-isfrs.html#u-yerda-nimalar-taqdim-etiladi","level":2},{"title":"Qanday kuzatish va ish
