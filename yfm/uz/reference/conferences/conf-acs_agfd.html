        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;отделение сельскохозяйственной и пищевой химии ACS&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;отделение сельскохозяйственной и пищевой химии ACS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;аннотации сессий AGFD&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Oziq-ovqat qo'shimchalari&lt;/a&gt;, &lt;a href=\"concepts/spec-nutrition.html\"&gt;Nutrientlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-konferensiya\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#bu-qanday-konferensiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday konferensiya&lt;/span&gt;&lt;/a&gt;Bu qanday konferensiya&lt;/h2&gt;\n&lt;p&gt;ACS Fall/Spring — bu Amerika Kimyo Jamiyati (ACS) tomonidan tashkil etiladigan yirik yarim yillik ilmiy forumlardir. Ushbu uchrashuvlar doirasida qishloq xo'jaligi va oziq-ovqat kimyosi bo'limi (AGFD) faoliyat yuritadi. Bu fundamental kimyo oziq-ovqat sanoatining amaliy vazifalari bilan uchrashadigan maydonchadir. Bu yerda olimlar molekulyar o'zgarishlar ta'm, xushbo'ylik, barqarorlik va ozuqaviy qiymatga qanday ta'sir qilishini tushuntiruvchi tadqiqot natijalarini taqdim etadilar.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Konferensiyalar kimyo sohasidagi eng qadimgi va eng yirik ilmiy tashkilot — Amerika Kimyo Jamiyati tomonidan o'tkaziladi. AGFD bo'limi fanlararo tadqiqotlarga qaratilgan: xomashyoning molekulyar tarkibidan tortib, ozuqa moddalarini saqlab qolish va oziq-ovqat sifatini yaxshilashga imkon beradigan qayta ishlash texnologiyalarigacha. Ushbu uchrashuvlar tarixi oziq-ovqat fani tarkibni oddiy tahlil qilishdan mahsulot xususiyatlarini molekulyar darajada boshqarishga qanday o'tganligining yilnomasi hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;AGFD ishi biz iste'mol qiladigan narsalar bilan bog'liq keng ko'lamli masalalarni qamrab oladi. Asosiy yo'nalishlar quyidagilarni o'z ichiga oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Saqlash texnologiyalari: mahsulotlarning yangiligini uzaytiruvchi iste'mol qilinadigan qoplamalarni yaratish uchun tabiiy antioksidantlardan (masalan, greyfrut yoki apelsin po'stlog'i ekstraktlari) foydalanish.&lt;/li&gt;\n&lt;li&gt;Ozuqa moddalarini modifikatsiyalash: oqsilni o'zlashtirishni sekinlashtirish usullarini ishlab chiqish, masalan, zardob oqsili uchun polifenollardan «qobiq» yaratish orqali.&lt;/li&gt;\n&lt;li&gt;Biotexnologiyalar: bakterial fermentatsiya yordamida o'simlik xomashyosidan foydali qo'shimchalarni (masalan, mannitol) olish.&lt;/li&gt;\n&lt;li&gt;Fizik-kimyoviy jarayonlar: qayta ishlash usullarining (sublimatsiya va issiq havo) oqsil tuzilishiga va umami kabi ta'm sifatlariga ta'sirini o'rganish.&lt;/li&gt;\n&lt;li&gt;Ovqatlanish psixofiziologiyasi: ijtimoiy omillarning metabolizmga, masalan, uglevodlarning o'zlashtirilishiga ta'sirini tadqiq qilish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo'ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo'ladi&lt;/h2&gt;\n&lt;p&gt;ACS AGFD konferensiyalarida keyinchalik sanoat standartlariga aylanadigan yechimlar tug'iladi. Bular shunchaki nazariy ma'ruzalar emas, balki texnologiya prototiplaridir: go'shtning aynishini oldini oluvchi qadoqlash materiallaridan tortib, shakar o'rnini bosuvchi moddalarni olish uchun o'simlik ildizlarini qayta ishlashning yangi usullarigacha. Ishtirokchilar og'iz bo'shlig'i retseptorlari tomonidan qabul qilinadigan ta'm va xushbo'ylik mahsulot bilan qilinadigan kimyoviy manipulyatsiyalarga qanday bog'liqligini muhokama qiladilar.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiya materiallari ACS arxivlarida mavjud bo'lgan sessiya annotatsiyalari ko'rinishida nashr etiladi. Tadqiqotchilar va oziq-ovqat sanoati mutaxassislari uchun AGFD sessiyalarida ishtirok etish — ta'm, xushbo'ylik va oziq-ovqat qo'shimchalarini tahlil qilishning ilg'or usullari haqida ular ommaviy mahsulotga aylanishidan oldin bilib olish usulidir. E'lonlarni Amerika Kimyo Jamiyatining rasmiy portalida kuzatib borish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Taste\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Taste — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"отделение сельскохозяйственной и пищевой химии ACS"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ACS Fall/Spring · AGFD","description":"отделение сельскохозяйственной и пищевой химии ACS","vcsPath":"reference/conferences/conf-acs_agfd.md"},"headings":[{"title":"Bu qanday konferensiya","href":"reference/conferences/conf-acs_agfd.html#bu-qanday-konferensiya","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-acs_agfd.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-acs_agfd.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo'ladi","href":"reference/conferences/conf-acs_agfd.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-acs_agfd.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-acs_agfd.html#manbalar","level":2}],"title":"ACS Fall/Spring · AGFD"},"router":{"pathname":"reference/conferences/conf-acs_agfd","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
