        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;коллоиды, эмульсии, пены и гели в пищевых системах&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-food_colloids.jpg\" alt=\"Food Colloids\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;коллоиды, эмульсии, пены и гели в пищевых системах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;Академиялық институттар мен кәсіби қоғамдастықтар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Тұрақты түрде (жыл сайын немесе екі жылда бір)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Халықаралық ғылыми конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Арнайы конференциялық веб-сайттар немесе ғылыми порталдар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-structure.html\"&gt;Tekstura va oziq-ovqat fizikasi&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima?&lt;/span&gt;&lt;/a&gt;Konferensiya nima?&lt;/h2&gt;\n&lt;p&gt;Food Colloids — bu oziq-ovqat tizimlarining fizik-kimyoviy xossalarini o‘rganishga bag‘ishlangan xalqaro ilmiy konferensiyalar seriyasidir. Tadqiqotchilar diqqat markazida kolloid tuzilmalar: emulsiyalar, ko‘piklar, gellar va suspenziyalar turadi. Konferensiya oziq-ovqat kimyosi, polimerlar fizikasi va materialshunoslik mutaxassislarini birlashtiradi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Food Colloids konferensiyalari turli akademik institutlar va professional hamjamiyatlar homiyligida muntazam o‘tkaziladi. Tadbirlar fundamental fan va oziq-ovqat sanoatining amaliy texnologiyalari o‘rtasida ma’lumot almashishga qaratilgan.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiya dasturi quyidagi yo‘nalishlarni qamrab oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Oziq-ovqat tizimlari fizikasi: oqsillar, polisaxaridlar va lipidlarning mikroskopik darajadagi xulq-atvori.&lt;/li&gt;\n&lt;li&gt;Yangi materiallarni ishlab chiqish: biologik parchalanadigan plyonkalar va yeyiladigan qadoqlar yaratish.&lt;/li&gt;\n&lt;li&gt;Tekstura dizayni: mahsulot xossalarini o‘zgartirish uchun qo‘shimchalardan foydalanish.&lt;/li&gt;\n&lt;li&gt;Komponentlararo o‘zaro ta’sir: oziq-ovqat tuzilishining hazm qilish jarayonlariga ta’siri.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-namoyish-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#u-yerda-nimalar-namoyish-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar namoyish etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar namoyish etiladi&lt;/h2&gt;\n&lt;p&gt;Konferensiyada keyinchalik ishlab chiqarishga joriy etiladigan tadqiqot natijalari taqdim etiladi. Masalan, akvakultura chiqindilaridan ekologik qadoqlar yaratish yoki surimi teksturasini yaxshilash uchun o‘simlik qo‘shimchalarini qo‘llash. Ishtirokchilar kolloid zarrachalarni ko‘rish imkonini beruvchi skanerlovchi elektron mikroskopiya usullarini namoyish etadilar.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Ishtirok etish uchun tadqiqotchilar o‘z ishlarining tezislarini taqdim etadilar. Konferensiya materiallari odatda ilmiy jurnallarning maxsus sonlarida chop etiladi. Dolzarb tadqiqotlarni kuzatish uchun «Critical Reviews in Food Science and Nutrition» yoki «Journal of Texture Studies» kabi nashrlarga murojaat qilish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-food_colloids.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/Food_Machinery_and_Chemical_Corporation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Food Machinery and Chemical Corporation — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:SEM_Image_of_Colloidal_Particles.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Yasrena, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/10408398.2014.939263\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of polysaccharides in food, digestion, and health&lt;/a&gt; — sharh, Crit Rev Food Sci Nutr 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1289/ehp.01109983\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Review of harmful gastrointestinal effects of carrageenan in animal experiments&lt;/a&gt; — sharh, Environ Health Perspect 2001&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/jtxs.12356\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Aging-related changes in quantity and quality of saliva: Where do we stand in our understanding?&lt;/a&gt; — sharh, J Texture Stud 2019&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"коллоиды, эмульсии, пены и гели в пищевых системах"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Food Colloids","description":"коллоиды, эмульсии, пены и гели в пищевых системах","vcsPath":"reference/conferences/conf-food_colloids.md"},"headings":[{"title":"Konferensiya nima?","href":"reference/conferences/conf-food_colloids.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-food_colloids.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-food_colloids.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar namoyish etiladi","href":"reference/conferences/conf-food_colloids.html#u-yerda-nimalar-namoyish-etiladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-food_colloids.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar","href":"reference/conferences/conf-food_colloids.html#manbalar","level":2}],"title":"Food Colloids"},"router":{"pathname":"reference/conferences/conf-food_colloids","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
