        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;High-moisture extrusion of pea protein into fibrous texture&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Coyau, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-extrusion.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Хлопья, снеки, текстурированный белок: как работает экструдер.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-extrusion.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Ekstruziya — bu yopishqoq material yoki quyuq pastani shakl beruvchi teshikdan o‘tkazish orqali mahsulotlar olish texnologik jarayonidir. Oziq-ovqat sanoatida ushbu usul xomashyoni quruq nonushtalar, sneklar yoki teksturalangan o‘simlik oqsillari kabi belgilangan tuzilish va shaklga ega mahsulotlarga aylantirish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-extrusion.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Ekstruziya jarayoni oziq-ovqat xomashyosiga mexanik siljish, bosim va harorat ta’siriga asoslanadi. Ekstruder ichida material yopishqoq eritma holatiga o‘tadi. Jarayonning asosiy tamoyillari deformatsiya, aralashtirish va shakl berishni o‘z ichiga oladi. Issiqlik asosan sirt orqali uzatiladigan pishirish yoki qovurishdan farqli o‘laroq, ekstruziya termik ishlov berishni intensiv mexanik ta’sir bilan birlashtiradi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-extrusion.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Ekstruziya tizimi yuklash bunkeri, shnek mexanizmi va shakl beruvchi kallakdan iborat. Xomashyo kameraga beriladi, u yerda aylanuvchi shneklar yuqori bosim hosil qiladi va aralashtirishni ta’minlaydi. Harakat jarayonida material qiziydi, bu uning yopishqoqligini kamaytiradi. Chiqish joyida eritma filyera — mahsulotga yakuniy ko‘rinish beruvchi ma’lum shakldagi teshikdan o‘tadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-extrusion.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vosita — ekstruder. Shneklar konstruksiyasiga qarab bir shnekli va ikki shnekli tizimlar ajratiladi. Ikki shnekli ekstruderlar materialning kamerada bo‘lish vaqti va siljish yuklamalari intensivligini aniqroq nazorat qilish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-extrusion.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Texnologiya keng turdagi mahsulotlarni yaratish uchun ishlatiladi. Masalan, «Ekstruziya qandli cho‘qqiga qarshi: xomashyoni qayta ishlash shokoladning o‘zlashtirilishini qanday o‘zgartiradi» maqolasida shakar va sutni dastlabki ekstruziya qilish organizmning glikemik javobini sezilarli darajada o‘zgartirishi ko‘rsatilgan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/proc-extrusion.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov — harorat, xomashyo namligi va shneklar aylanish tezligi kabi parametrlarni qat’iy nazorat qilish zarurati. Noto‘g‘ri tanlangan rejim ozuqaviy qiymatning yo‘qolishiga yoki ta’m sifatining o‘zgarishiga olib kelishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Экструзия&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A8%D0%B8%D0%BA%D1%96%D0%B7%D0%B0%D1%82%5D%20--%3E%20B%5B%D0%96%D2%AF%D0%BA%D1%82%D0%B5%D1%83%20%D0%B1%D1%83%D0%BD%D0%BA%D0%B5%D1%80%D1%96%5D%0A%20%20B%20--%3E%20C%5B%D0%A8%D0%BD%D0%B5%D0%BA%20%D0%BC%D0%B5%D1%85%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D1%96%5D%0A%20%20C%20--%3E%7C%D2%9A%D1%8B%D1%81%D1%8B%D0%BC%20%D0%BC%D0%B5%D0%BD%20%D0%B6%D1%8B%D0%BB%D1%83%7C%20D%5B%D0%9F%D1%96%D1%88%D1%96%D0%BD%D0%B4%D0%B5%D1%83%D1%88%D1%96%20%D0%B1%D0%B0%D1%81%D1%82%D0%B8%D0%B5%D0%BA%5D%0A%20%20D%20--%3E%20E%5B%D0%A4%D0%B8%D0%BB%D1%8C%D0%B5%D1%80%D0%B0%5D%0A%20%20E%20--%3E%20F%5B%D0%94%D0%B0%D0%B9%D1%8B%D0%BD%20%D1%8D%D0%BA%D1%81%D1%82%D1%80%D1%83%D0%B4%D0%B0%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-extrusion.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Pishirish texnologiyalari&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-extrusion.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Shakar sakrashiga qarshi ekstruziya: shokoladni qayta ishlash metabolizmni qanday o'zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-extrusion.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AD%D0%BA%D1%81%D1%82%D1%80%D1%83%D0%B7%D0%B8%D1%8F_(%D1%82%D0%B5%D1%85%D0%BD%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B9_%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%81)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Экструзия (технологический процесс) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — sharh, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/bjc.1972.33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a basic biological phenomenon with wide-ranging implications in tissue kinetics&lt;/a&gt; — sharh, Br J Cancer 1972&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm2330\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Membrane lipids: where they are and how they behave&lt;/a&gt; — sharh, Nat Rev Mol Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Хлопья, снеки, текстурированный белок: как работает экструдер."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Экструзия","description":"Хлопья, снеки, текстурированный белок: как работает экструдер.","vcsPath":"concepts/proc-extrusion.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-extrusion.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/proc-extrusion.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/proc-extrusion.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/proc-extrusion.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/proc-extrusion.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo‘llaniladi","href":"concepts/proc-extrusion.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va qiyinchiliklar","href":"concepts/proc-extrusion.html#cheklovlar-va-qiyinchiliklar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/proc-extrusion.html#bogliq-tushunchalar","level"
