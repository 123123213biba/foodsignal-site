        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Sugar reduction in yogurt using stevia and allulose blends&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-taste_mod.jpg\" alt=\"Сахарозаменители и управление вкусом\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Sergio Calleja (Life is a trip), CC BY-SA 2.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Old_Mods_photo.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Как снизить сахар и соль без потери вкуса.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Shakar o‘rnini bosuvchilar — bu oziq-ovqat mahsulotlariga shirin ta’m beruvchi va shakar o‘rniga ishlatiladigan moddalar va kimyoviy birikmalardir. Shakarni kamaytirish jarayonida ta’mni boshqarish mahsulot tarkibi o‘zgarganda uning sensor profilini saqlab qolishga qaratilgan. Asosiy vazifa shakar ta’mdan tashqari ta’minlaydigan hajm, tekstura va o‘ziga xos ta’mning yo‘qolishini kompensatsiya qilishdir.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Shirin ta’mni idrok etish shirinlashtiruvchi molekulalarning ta’m bilish hujayralari yuzasidagi T1R2 va T1R3 retseptorlari bilan o‘zaro ta’siriga asoslanadi. Shakar o‘rnini bosuvchilar intensiv shirinlashtiruvchilar va hajmli o‘rnini bosuvchilarga bo‘linadi. Ta’mni boshqarish sinergiyani hisobga olishni talab qiladi: bir nechta moddalarning kombinatsiyasi ko‘pincha umumiy kaloriyani kamaytirgan holda saxarozaga maksimal darajada yaqin shirinlik profiliga erishishga imkon beradi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Shakarni almashtirish jarayoni nafaqat ta’mni, balki shakarning fizik xususiyatlarini ham taqlid qiluvchi agentni tanlashni o‘z ichiga oladi. Shakar Mayyar reaksiyalari va karamellanishda ishtirok etib, rang va xushbo‘ylikka ta’sir qiladi. Steviya kabi intensiv shirinlashtiruvchilardan foydalanganda teksturani tiklash uchun to‘ldiruvchilar qo‘shish kerak. Zamonaviy usullar noyob shakarlar yoki tabiiy shirinlashtiruvchilarni olish uchun mikrobiologik sintezdan foydalanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vosita ISO standartlariga muvofiq ekspertlar paneli tomonidan o‘tkaziladigan sensor tahlildir. Texnologik jarayon aralashmalarni tanlashni o‘z ichiga oladi, bunda bir komponent boshqasining achchiqligini niqoblaydi, ikkinchisi esa shirinlikning boshlang‘ich ta’sirini ta’minlaydi. Bakterial fermentatsiya o‘simlik xomashyosidan funksional ingredientlarni olish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo‘llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo‘llaniladi&lt;/h2&gt;\n&lt;p&gt;Shakarni kamaytirish texnologiyalari sut sanoatida faol joriy etilmoqda. Masalan, «Yakon ildizidan mannit: shirin ildizni foydali shakar o‘rnini bosuvchiga qanday aylantirish mumkin» maqolasida bakteriyalar yordamida yakon ildizidan shirinlashtiruvchi olish usuli tasvirlangan. Shuningdek, yogurt ishlab chiqarishda steviya va alluloza kombinatsiyalari keng qo‘llaniladi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov — mahsulot teksturasi va barqarorligining o‘zgarishi. Ko‘pgina shakar o‘rnini bosuvchilar saxarozaga nisbatan shirinlikning boshlanish vaqti va davomiyligi bo‘yicha farq qiladi. Shuningdek, tartibga soluvchi cheklovlar mavjud: qo‘shimchalardan foydalanish TR TS 021/2011 va 029/2012 talablariga javob berishi va JECFA/EFSA tomonidan belgilangan xavfsizlik normalaridan oshmasligi kerak.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Сахарозаменители и управление вкусом&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20C%5B%D0%A2%D3%99%D1%82%D1%82%D1%96%D0%BB%D0%B5%D0%BD%D0%B4%D1%96%D1%80%D0%B3%D1%96%D1%88%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%D0%BB%D1%8B%D2%9B%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D3%A8%D0%BD%D1%96%D0%BC%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D1%83%D1%80%D0%B0%D1%81%D1%8B%5D%0A%20%20E%20--%3E%20F%5B%D0%A2%D2%B1%D1%82%D1%8B%D0%BD%D1%83%D1%88%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Yakon ildizidan mannitol: shirin ildizni foydali shakar o'rnini bosuvchiga aylantirish&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%B0%D1%85%D0%B0%D1%80%D0%BE%D0%B7%D0%B0%D0%BC%D0%B5%D0%BD%D0%B8%D1%82%D0%B5%D0%BB%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Сахарозаменители — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Old_Mods_photo.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Sergio Calleja (Life is a trip), CC BY-SA 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s00018-006-6077-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Natural sweet macromolecules: how sweet proteins work&lt;/a&gt; — sharh, Cell Mol Life Sci 2006&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Как снизить сахар и соль без потери вкуса."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Сахарозаменители и управление вкусом","description":"Как снизить сахар и соль без потери вкуса.","vcsPath":"concepts/proc-taste_mod.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-taste_mod.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/proc-taste_mod.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/proc-taste_mod.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/proc-taste_mod.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/proc-taste_mod.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo‘llaniladi","href":"concepts/proc-taste_mod.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavflar","href":"concepts/proc-taste_mod.html#cheklovlar-va-xavflar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/proc-taste_mod.html#bogliq-tushunchalar","level":2},{"title":"Qayerda uch
