            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Polyphenol and flavonoid content of green tea infusions&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-bioactives.jpg\" alt=\"Полифенолы и биоактивные вещества\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: No machine-readable author provided. Jorgealfonso assumed (based on copyright claims)., CC BY-SA 2.5&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Mate_en_calabaza.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-bioactives.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Полифенолы, каротиноиды, флавоноиды.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-bioactives.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Polifenollar va bioaktiv moddalar — o'simlik organizmlarida himoya funksiyasini bajaradigan va iste'mol qilinganda fiziologik jarayonlarga ta'sir ko'rsatadigan ikkilamchi metabolitlardir. Ular muhim ozuqa moddalari hisoblanmaydi, ammo oqsillar va ichak mikrobiotasi bilan o'zaro ta'sir qilish orqali metabolik reaksiyalarda qatnashadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-bioactives.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Bioaktiv moddalar polifenollar, flavonoidlar va karotinoidlarni o'z ichiga olgan keng organik birikmalar sinfidir. Bu molekulalar o'simliklarning himoya tizimi tarkibiga kirib, ultrabinafsha nurlanish va patogenlarga chidamlilikni ta'minlaydi. Inson organizmida ular biokimyoviy jarayonlar modulyatori sifatida ishlaydi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-bioactives.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Polifenollarning boshqa oziq-ovqat komponentlari bilan o'zaro ta'siri molekulalarning oqsillar bilan kovalent bo'lmagan bog'lanishlar hosil qilish qobiliyatiga asoslangan. Bu jarayon oqsillarning fizik-kimyoviy xossalarini, masalan, fermentlar tomonidan parchalanish tezligini o'zgartiradi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-bioactives.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Bioaktiv moddalarni o'rganish uchun ekstraksiya va xromatografik tahlil usullari qo'llaniladi. Tadqiqotlarda ko'pincha antioksidant faollik va oqsillar bilan bog'lanish qobiliyati baholanadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-bioactives.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Polifenollardan foydalanish texnologiyalari funksional oziq-ovqat mahsulotlarini yaratishda joriy etilmoqda:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;«Kofe va olmani qanday do'stlashtirish kerak: funksional mahsulotlar uchun tabiiy katalizator» maqolasida kofe antioksidantlarini sut peptidlariga bog'lash uchun olma sharbatidan foydalanish usuli tasvirlangan.&lt;/li&gt;\n&lt;li&gt;«Zardob oqsilini uzoqroq ishlashga majburlash: mushaklar uchun molekulyar yelim» maqolasida zardob oqsili atrofida polifenollardan «urug' qobig'i» hosil qilish orqali uning parchalanishini sekinlashtirish usuli ko'rib chiqiladi.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"cheklovlar-va-xavfli-jihatlar\"&gt;&lt;a href=\"concepts/proc-bioactives.html#cheklovlar-va-xavfli-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavfli jihatlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavfli jihatlar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov ko'plab polifenollarning past biologik mavjudligidir: ularning katta qismi ingichka ichakda so'rilmaydi. Shuningdek, in vitro tadqiqotlar natijalari har doim ham inson organizmida takrorlanmaydi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Полифенолы и биоактивные вещества&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A0%D0%B0%D1%81%D1%82%D0%B5%D0%BD%D0%B8%D0%B5%5D%20--%3E%7C%D1%81%D0%B8%D0%BD%D1%82%D0%B5%D0%B7%D0%B8%D1%80%D1%83%D0%B5%D1%82%7C%20B%5B%D0%9F%D0%BE%D0%BB%D0%B8%D1%84%D0%B5%D0%BD%D0%BE%D0%BB%D1%8B%5D%0A%20%20B%20--%3E%7C%D0%B2%D0%B7%D0%B0%D0%B8%D0%BC%D0%BE%D0%B4%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D1%83%D0%B5%D1%82%7C%20C%5B%D0%91%D0%B5%D0%BB%D0%BA%D0%B8%5D%0A%20%20B%20--%3E%7C%D1%84%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B8%D1%80%D1%83%D0%B5%D1%82%D1%81%D1%8F%7C%20D%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D1%82%D0%B0%5D%0A%20%20C%20--%3E%7C%D0%B8%D0%B7%D0%BC%D0%B5%D0%BD%D1%8F%D0%B5%D1%82%7C%20E%5B%D0%A1%D0%BA%D0%BE%D1%80%D0%BE%D1%81%D1%82%D1%8C%20%D1%83%D1%81%D0%B2%D0%BE%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%7C%D0%BF%D1%80%D0%BE%D0%B8%D0%B7%D0%B2%D0%BE%D0%B4%D0%B8%D1%82%7C%20F%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D1%82%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-bioactives.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Nutrientlar&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-micronutrients.html\"&gt;Витамины и минералы&lt;/a&gt; — Содержание, потери при готовке, обогащение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-bioactives.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html\"&gt;Qahva va olmani birlashtirish: funksional oziq-ovqat uchun tabiiy katalizator&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html\"&gt;Zardob oqsilini uzoqroq ishlashga majbur qilish: mushaklar uchun molekulyar «yelim»&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-bioactives.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D1%82%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Мате — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Mate_en_calabaza.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: No machine-readable author provided. Jorgealfonso assumed (based on copyright claims)., CC BY-SA 2.5&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/gutjnl-2015-309990\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The gut microbiota and host health: a new clinical frontier&lt;/a&gt; — sharh, Gut 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/circulationaha.115.018585\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Dietary and Policy Priorities for Cardiovascular Disease, Diabetes, and Obesity: A Comprehensive Review&lt;/a&gt; — sharh, Circulation 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.biotechadv.2015.08.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Discovery and resupply of pharmacologically active plant-derived natural products: A review&lt;/a&gt; — sharh, Biotechnol Adv 2015&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Полифенолы, каротиноиды, флавоноиды."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Полифенолы и биоактивные вещества","description":"Полифенолы, каротиноиды, флавоноиды.","vcsPath":"concepts/proc-bioactives.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-bioactives.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/proc-bioactives.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/proc-bioactives.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/proc-bioactives.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/proc-bioactives.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/proc-bioactives.html#qayer
