        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Metrika&lt;/strong&gt; · &lt;em&gt;peroxide value&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/peroxide-value.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Go'sht mahsulotlarining yangiligini baholash uchun ishlatiladigan yog'larning oksidlanish darajasi ko'rsatkichi.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/peroxide-value.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Peroksid soni (peroxide value) — yog'lar va moylardagi lipidlarning birlamchi oksidlanish mahsulotlari miqdorini ifodalovchi sifat ko'rsatkichi. Oziq-ovqat sanoatida bu ko'rsatkich go'sht mahsulotlarining yangiligi va o'simlik moylarining barqarorligini baholash uchun asosiy vosita hisoblanadi. Yuqori peroksid soni mahsulotning ta'mi, hidi va ozuqaviy qiymatini o'zgartiruvchi buzilish jarayonlari ketayotganidan dalolat beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/peroxide-value.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Lipidlar (yog'lar) kislorod, yorug'lik, issiqlik va metallar ta'sirida oksidlanish degradatsiyasiga uchraydi. Bu jarayon lipidlarning peroksidli oksidlanishi deb ataladi. Reaksiya davomida erkin radikallar hosil bo'lib, ular yog' kislotalari molekulalariga hujum qiladi. Ushbu jarayonning birlamchi mahsulotlari gidroperoksidlardir. Peroksid soni aynan ularning konsentratsiyasini o'lchaydi. Vaqt o'tishi bilan gidroperoksidlar aldegidlar kabi ikkilamchi mahsulotlarga parchalanadi, bu esa mahsulotga achchiq ta'm beradi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/peroxide-value.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Yog'larning oksidlanish jarayoni uch bosqichda kechadi: initsiatsiya, tarqalish va zanjir uzilishi. Initsiatsiya bosqichida tashqi omillar (masalan, quyosh nuri yoki go'shtdagi qon izlari) ta'sirida erkin radikallar hosil bo'ladi. Keyin ular kislorod bilan reaksiyaga kirishib, gidroperoksidlarni hosil qiladi. Peroksid soni ushbu birikmalar to'planishi bilan ortib boradi. Agar tizimga antioksidantlar qo'shilsa, ular erkin radikallarni ushlab qolib, peroksid sonining o'sishini sekinlashtiradi va mahsulotning yaroqlilik muddatini uzaytiradi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/peroxide-value.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Peroksid sonini aniqlash uchun titrlash usuli qo'llaniladi. Yog' namunasi erituvchilar aralashmasida eritiladi, so'ngra gidroperoksidlar bilan reaksiyaga kirishadigan reagent qo'shiladi. Ajralib chiqqan yod miqdori natriy tiosulfat eritmasi bilan titrlash orqali aniqlanadi. Natija kilogramm yog'ga nisbatan faol kislorodning milliekvivalentlarida (mekv/kg) ifodalanadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/peroxide-value.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Ko'rsatkich mahsulotlarni saqlashda sifat nazorati uchun ishlatiladi. «Go'sht moy ichida yorug'likda o'ylagandan tezroq buziladi» maqolasida yorug'lik va qon izlari ta'siri aldegidlar to'planishini tezlashtirishi ko'rsatilgan. «Sitrus po'stlog'i tovuq burgerlarini qanday uzoqroq saqlashga yordam beradi» tadqiqotida oksidlanishni sekinlashtirish uchun ekstraktlardan foydalanish tasvirlangan: greyfurtli jelatin plyonkasi go'sht yangiligini muzlatgichda 5 oyga ko'proq saqlash imkonini beradi, bu peroksid soni o'sish tezligining pasayishi bilan tasdiqlanadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavfli-jihatlar\"&gt;&lt;a href=\"concepts/peroxide-value.html#cheklovlar-va-xavfli-jihatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavfli jihatlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavfli jihatlar&lt;/h2&gt;\n&lt;p&gt;Peroksid soni — bu dinamik ko'rsatkich. Gidroperoksidlar beqaror bo'lgani va tezda ikkilamchi mahsulotlarga parchalanib ketgani sababli, past qiymat har doim ham mahsulot sifati yuqoriligini kafolatlamaydi: yog' allaqachon peroksidlar to'planish bosqichidan o'tib, aldegidlar to'planish bosqichiga o'tgan bo'lishi mumkin. Mahsulot holatini to'liq baholash uchun peroksid sonini oksidlanishning ikkilamchi mahsulotlari tahlili bilan birgalikda ishlatish tavsiya etiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: перекисное число&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%82%D2%9B%D1%8B%20%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D1%80%D0%BB%D0%B0%D1%80%5D%20--%3E%7C%D0%98%D0%BD%D0%B8%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D1%83%7C%20B%5B%D0%95%D1%80%D0%BA%D1%96%D0%BD%20%D1%80%D0%B0%D0%B4%D0%B8%D0%BA%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%0A%20%20B%20--%3E%7C%D0%A2%D0%BE%D1%82%D1%8B%D2%93%D1%83%7C%20C%5B%D0%93%D0%B8%D0%B4%D1%80%D0%BE%D0%BF%D0%B5%D1%80%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D0%AB%D0%B4%D1%8B%D1%80%D0%B0%D1%83%7C%20D%5B%D0%90%D0%BB%D1%8C%D0%B4%D0%B5%D0%B3%D0%B8%D0%B4%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D3%A8%D0%BB%D1%88%D0%B5%D1%83%7C%20E%5B%D0%9F%D0%B5%D1%80%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%20%D1%81%D0%B0%D0%BD%D1%8B%5D%0A%20%20F%5B%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D0%BD%D1%82%D1%82%D0%B0%D1%80%5D%20--%3E%7C%D0%91%D0%B0%D1%8F%D1%83%D0%BB%D0%B0%D1%82%D1%83%7C%20C%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasdig'ini kutmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"malumot\"&gt;&lt;a href=\"concepts/peroxide-value.html#malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumot&lt;/span&gt;&lt;/a&gt;Ma'lumot&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;единицы&lt;/td&gt;\n&lt;td&gt;мэкв O₂/кг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;значение для 4% грейпфрута&lt;/td&gt;\n&lt;td&gt;4,50 мэкв O₂/кг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;unit&lt;/td&gt;\n&lt;td&gt;мэкв O₂/кг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;value_max&lt;/td&gt;\n&lt;td&gt;4.5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"boshqa-nomlari\"&gt;&lt;a href=\"concepts/peroxide-value.html#boshqa-nomlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa nomlari&lt;/span&gt;&lt;/a&gt;Boshqa nomlari&lt;/h2&gt;\n&lt;p&gt;ПЧ&lt;/p&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/peroxide-value.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html\"&gt;Yorug'likdagi go'shtli yog' kutilganidan tezroq buziladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Sitrus po‘stlog‘i tovuq kotletlarini uzoqroq saqlashga qanday yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt; · &lt;a href=\"reference/metrics.html\"&gt;Metrikalar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/peroxide-value.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%B5%D1%80%D0%B5%D0%BA%D0%B8%D1%81%D0%BD%D0%BE%D0%B5_%D0%BE%D0%BA%D0%B8%D1%81%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BB%D0%B8%D0%BF%D0%B8%D0%B4%D0%BE%D0%B2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Перекисное окисление липидов — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/antiox8100429\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Comprehensive Review on Lipid Oxidation in Meat and Meat Products&lt;/a&gt; — sharh, Antioxidants (Basel) 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/plants6040042\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phytochemicals: Extraction, Isolation, and Identification of Bioactive Compounds from Plant Extracts&lt;/a&gt; — sharh, Plants (Basel) 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.btre.2014.09.002\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Potential applications of ferulic acid from natural sources&lt;/a&gt; — sharh, Biotechnol Rep (Amst) 2014&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Go'sht mahsulotlarining yangiligini baholash uchun ishlatiladigan yog'lar
