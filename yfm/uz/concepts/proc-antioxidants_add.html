        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Rosemary extract as an antioxidant in repeated frying oil&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-antioxidants_add.jpg\" alt=\"Антиоксиданты\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Wu X, Beecher GR, Holden JM, Haytowitz DB, Gebhardt SE, Prior RL, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Foods_highest_in_antioxidants.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Antioksidantlar — bu organik birikmalarning oksidlanish jarayonini sekinlashtiradigan yoki oldini oladigan moddalardir. Oziq-ovqat sanoatida ular mahsulot sifatini saqlash, yog'lar va boshqa tarkibiy qismlarning kislorod ta'sirida buzilishining oldini olish uchun ishlatiladi. Antioksidantlar tabiiy yoki sintetik bo'lishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Oksidlanish — bu molekulalar elektron yo'qotadigan kimyoviy jarayon. Oziq-ovqatlarda bu jarayon ko'pincha erkin radikallar tomonidan qo'zg'atiladi. Antioksidantlar elektron donorlari sifatida ishlaydi: ular o'z elektronini erkin radikalga berib, uni barqarorlashtiradi va oksidlanish zanjirini uzadi. Oziq-ovqat texnologiyasida ular lipidlarni achishdan, vitaminlar va pigmentlarni parchalanishdan himoya qiluvchi qo'shimchalar sinfiga kiradi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Mahsulotni himoya qilish jarayoni antioksidantlarning erkin radikallar uchun «qopqon» vazifasini bajarishiga asoslanadi. Antioksidant radikal bilan reaksiyaga kirishganda, u o'zi kamroq faol bo'lib qoladi va yangi vayronkor jarayonlarni keltirib chiqarmaydi. Samaradorlik antioksidant molekulasining tuzilishiga, muhitdagi kislorod konsentratsiyasiga va haroratga bog'liq.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Antioksidant faollikni baholash uchun spektrofotometriya kabi laboratoriya usullari qo'llaniladi. Oziq-ovqat sanoatida qo'shimchalarning mahsulot ta'mi va hidiga ta'sirini tekshirish uchun degustatsiya panellari o'tkaziladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Antioksidantlar yog'lar, go'sht mahsulotlari va yarim tayyor mahsulotlarning saqlash muddatini uzaytirish uchun ishlatiladi. «Shirin olmalar nordonlariga qaraganda antioksidant himoyasi bo'yicha pastroq» maqolasida ko'rsatilishicha, mevalarning tabiiy tarkibi ularning oksidlanishga chidamliligiga bevosita ta'sir qiladi: 12 ta olma navi tahlili shuni ko'rsatdiki, yuqori shakar miqdori ko'pincha antioksidant xususiyatga ega fenol birikmalarining kamligi bilan bog'liq.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-antioxidants_add.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Antioksidantlar mahsulotni cheksiz saqlash uchun universal vosita emas. Ularning samaradorligi dozalash va tashqi muhit sharoitlari bilan cheklangan. Haddan tashqari oksidlanish termik ishlov berish, masalan, qovurish uchun yog'ni qayta ishlatish natijasida yuzaga kelishi mumkin. Antioksidantlarning mavjudligi mahsulotni tibbiy ma'noda «foydali» qilmaydi; ularning asosiy vazifasi — texnologik himoya.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Антиоксиданты&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%91%D0%BE%D1%81%20%D1%80%D0%B0%D0%B4%D0%B8%D0%BA%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%20--%3E%7C%D1%82%D0%BE%D1%82%D1%8B%D2%93%D1%83%D0%B4%D1%8B%20%D1%82%D1%83%D0%B4%D1%8B%D1%80%D0%B0%D0%B4%D1%8B%7C%20B%5B%D0%9B%D0%B8%D0%BF%D0%B8%D0%B4%D1%82%D0%B5%D1%80%5D%0A%20%20C%5B%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D0%BD%D1%82%D1%82%D0%B0%D1%80%5D%20--%3E%7C%D1%8D%D0%BB%D0%B5%D0%BA%D1%82%D1%80%D0%BE%D0%BD%20%D0%B1%D0%B5%D1%80%D0%B5%D0%B4%D1%96%7C%20A%0A%20%20A%20--%3E%7C%D1%82%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D0%B0%D0%BD%D0%B0%D0%B4%D1%8B%7C%20D%5B%D0%A2%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D1%8B%20%D0%BC%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D0%B0%5D%0A%20%20C%20--%3E%7C%D2%9B%D0%BE%D1%80%D2%93%D0%B0%D0%B9%D0%B4%D1%8B%7C%20B%0A%20%20E%5B%D0%97%D0%B5%D1%80%D1%82%D1%85%D0%B0%D0%BD%D0%B0%D0%BB%D1%8B%D2%9B%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%20--%3E%7C%D3%A9%D0%BB%D ntioxidants_add.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D0%BD%D1%82%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Антиоксиданты — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Foods_highest_in_antioxidants.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Wu X, Beecher GR, Holden JM, Haytowitz DB, Gebhardt SE, Prior RL, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.2147/vhrm.1.1.55.58939\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Endothelial cell dysfunction and the vascular complications associated with type 2 diabetes: assessing the health of the endothelium&lt;/a&gt; — sharh, Vasc Health Risk Manag 2005&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu12113366\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nutrition in Cancer Therapy in the Elderly-An Epigenetic Connection?&lt;/a&gt; — sharh, Nutrients 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ijms24054408\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Towards a New Biomarker for Diabetic Retinopathy: Exploring RBP3 Structure and Retinoids Binding for Functional Imaging of Eyes In Vivo&lt;/a&gt; — sharh, Int J Mol Sci 2023&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Токоферолы, розмарин, TBHQ: как замедляют окисление."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Антиоксиданты","description":"Токоферолы, розмарин, TBHQ: как замедляют окисление.","vcsPath":"concepts/proc-antioxidants_ad
