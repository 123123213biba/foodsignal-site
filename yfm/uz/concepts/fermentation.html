        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Usul&lt;/strong&gt; · &lt;em&gt;Fermentation&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/fermentation.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya — bu mikroorganizmlar yordamida o‘simlik xomashyosini biologik qayta ishlash jarayoni bo‘lib, u mahsulotning kimyoviy tarkibini o‘zgartiradi va yangi funksional xususiyatlarni hosil qiladi.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/fermentation.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya — bu mikroorganizmlar yoki ularning fermentlari yordamida organik moddalarni biologik qayta ishlash jarayoni bo'lib, u mahsulotning kimyoviy tarkibini o'zgartiradi va yangi xususiyatlarni hosil qiladi. Oziq-ovqat sanoatida ushbu usul xomashyoni murakkab kimyoviy ishlovsiz o'zgartirib, uning ta'mi va funksional xususiyatlarini yaxshilashga imkon beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/fermentation.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya bakteriyalar, achitqi yoki mog'or zamburug'lari kabi mikroorganizmlarning metabolik faoliyati jarayonidir. Jarayonning negizida murakkab organik birikmalarni (uglevodlar, oqsillar, lipidlar) oddiyroq molekulalarga parchalash yotadi. Bu jarayonlarni o'rganuvchi fan zimologiya deb ataladi. Biokimyoviy nuqtai nazardan, fermentatsiya hujayralarga kislorod cheklangan sharoitda energiya olish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/fermentation.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Jarayon substratni — o'simlik yoki hayvon xomashyosini tayyorlashdan boshlanadi. Unga mikroorganizmlarning maxsus shtammlari kiritiladi, ular fermentlar ishlab chiqara boshlaydi. Ushbu katalizator oqsillar kimyoviy reaksiyalarni tezlashtirib, dastlabki ozuqa moddalarini organik kislotalar, spirtlar yoki maxsus qandlar kabi yangi birikmalarga aylantiradi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/fermentation.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vosita — harorat, namlik va aeratsiya parametrlari nazorat qilinadigan bioreaktor. Ushbu sharoitlarni nazorat qilish maqsadli mikroorganizmlarning ustunligini ta'minlash va patogen mikrofloraning o'sishini oldini olish uchun juda muhimdir.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/fermentation.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Texnologiya belgilangan xususiyatlarga ega mahsulotlarni yaratish uchun keng qo'llaniladi. Masalan, «Manniit iz yakona: kak prevratit sladkiy koren v polezniy saxarozamenitel» maqolasida yakon ildizidan shirinlashtiruvchi modda olish uchun bakteriyalardan foydalanish tasvirlangan. «Mojet li sok iz semyan aleppskoy sosni ukrepit kishechniy baryer» tadqiqotida esa fermentlangan ichimlikning ichak hujayralari yaxlitligiga ta'siri o'rganiladi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/fermentation.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Fermentatsiya istalmagan mikroorganizmlar rivojlanishining oldini olish uchun xavfsizlik protokollariga qat'iy rioya qilishni talab qiladi. Tadqiqot natijalari, masalan, ichak to'sig'iga ta'siri, ko'pincha dastlabki xarakterga ega va odamlarda klinik sinovlarni talab qiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Ферментация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D1%8B%5D%0A%20%20B%20--%3E%20C%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D1%8B%5D%0A%20%20D%20--%3E%20E%5B%D0%A5%D0%B8%D0%BC%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5%20%D1%80%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D0%B8%5D%0A%20%20E%20--%3E%20F%5B%D0%9D%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasdig'ini kutmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"malumot\"&gt;&lt;a href=\"concepts/fermentation.html#malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumot&lt;/span&gt;&lt;/a&gt;Ma'lumot&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;conversion_efficiency&lt;/td&gt;\n&lt;td&gt;&amp;gt;0.6 г маннита на 1 г ФОС&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;te
