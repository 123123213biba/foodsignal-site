        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-flavor.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/spec-flavor.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Ta'm va xushbo'ylik — bu oziq-ovqatdan keladigan kimyoviy signallarni qabul qilishning murakkab tizimi. Oddiy ta'mdan farqli o'laroq, xushbo'ylik minglab uchuvchan organik birikmalarni aniqlash natijasidir. Ular birgalikda mahsulotdan olinadigan zavq va uning biologik qiymatini belgilaydigan «flavor»ni hosil qiladi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-flavor.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Ta'mni idrok etish tildagi retseptorlarning oziq-ovqat molekulalari bilan o'zaro ta'siridan boshlanadi. Xushbo'ylik esa retronazal hid bilish orqali ulanadi: uchuvchan moddalar og'iz bo'shlig'idan burun-halqumga o'tib, hid bilish retseptorlarini faollashtiradi. Bu jarayonlar Mayyar reaksiyasi yoki karamellanish kabi kimyoviy o'zgarishlar bilan chambarchas bog'liq.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-flavor.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Tizim biokimyoviy analizator kabi ishlaydi. Tildagi retseptorlar asosiy ta'mlar haqida signal bersa, burundagi hid bilish epiteliysi uchuvchan birikmalar profilini aniqlaydi. Miya bu ma'lumotlarni yagona obrazga birlashtiradi. Masalan, basmati guruchining hidi don yetilish jarayonida rivojlanadigan o'ziga xos birikmalar bilan bog'liq.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-flavor.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Ta'm va hidni tahlil qilish uchun gaz xromatografiyasi va mass-spektrometriya usullari qo'llaniladi. Oshpazlikda esa mahsulotning dastlabki xususiyatlarini saqlab qolish uchun sublimatsiya yoki xomashyoning kimyoviy tarkibini o'zgartiruvchi fermentatsiya kabi texnologiyalar boshqaruv vositasi bo'lib xizmat qiladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-flavor.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Ta'm kimyosini tushunish yangi mahsulotlar yaratishga yordam beradi. «Холодный вакуум или печь: что происходит со вкусом и белком креветки при сушке» maqolasida sublimatsiya qisqichbaqaning nozik umami ta'mini qanday saqlab qolishi ko'rsatilgan. «Маннит из якона: как превратить сладкий корень в полезный сахарозаменитель» materialida esa bakteriyalar yordamida ildizning ta'm profilini o'zgartirish usuli tasvirlangan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/spec-flavor.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Asosiy qiyinchilik xushbo'y birikmalarning beqarorligidadir. Ularning ko'pchiligi qizdirilganda oson oksidlanadi yoki parchalanadi. Shuningdek, retseptorlarning individual sezgirligi ta'mni idrok etishni subyektiv qiladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Ta'm va hid&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%D1%8B%20%D0%BF%D0%B8%D1%89%D0%B8%5D%20--%3E%20B%5B%D0%AF%D0%B7%D1%8B%D0%BA%D0%BE%D0%B2%D1%8B%D0%B5%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D0%BE%D1%80%D1%8B%5D%0A%20%20A%20--%3E%20C%5B%D0%9E%D0%B1%D0%BE%D0%BD%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D0%BE%D1%80%D1%8B%5D%0A%20%20B%20--%3E%20D%5B%D0%A1%D0%B8%D0%B3%D0%BD%D0%B0%D0%BB%20%D0%B2%20%D0%BC%D0%BE%D0%B7%D0%B3%5D%0A%20%20C%20--%3E%20D%0A%20%20D%20--%3E%20E%5B%D0%92%D0%BE%D1%81%D0%BF%D1%80%D0%B8%D1%8F%D1%82%D0%B8%D0%B5%20%D0%B2%D0%BA%D1%83%D1%81%D0%B0%5D%0A%20%20D%20--%3E%20F%5B%D0%92%D0%BE%D1%81%D0%BF%D1%80%D0%B8%D1%8F%D1%82%D0%B8%D0%B5%20%D0%B0%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B0%5D%0A%20%20E%20--%3E%20G%5B%D0%A4%D0%BB%D0%B5%D0%B9%D0%B2%D0%BE%D1%80%5D%0A%20%20F%20--%3E%20G%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-flavor.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-lipid_aroma.html\"&gt;Окисление жиров и ароматы&lt;/a&gt; — Прогоркание, «рыбный» запах, ароматы жареного масла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-flavor.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Qovurilgan mahsulotlar hidi: pirazinlarni aniqlovchi yangi biosensor&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Urg‘ochi yoki erkak: nega ba’zi midiyalar muzlatgichda tezroq aynib qoladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Sovuq vakuum yoki issiq pech: quritish krevetka ta'mi va oqsilini qanday o'zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Yakon ildizidan mannitol: shirin ildizni foydali shakar o'rnini bosuvchiga aylantirish&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-flavor.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B0%D1%81%D0%BC%D0%B0%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Басмати — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — sharh, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41591-019-0675-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Chronic inflammation in the etiology of disease across the life span&lt;/a&gt; — sharh, Nat Med 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.12.4.564\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Plant products as antimicrobial agents&lt;/a&gt; — sharh, Clin Microbiol Rev 1999&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Ta'm va hid","description":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.","vcsPath":"concepts/spec-flavor.md"},"headings":[{"title":"Ta'rif","href":"concepts/spec-flavor.html#tarif","level":2},{"title":"Umumiy ko'rinish","href":"concepts/spec-flavor.html#umumiy-korinish","level":2},{"title":"Nazariya","href":"concepts/spec-flavor.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/spec-flavor.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/spec-flavor.html#usullar-va-v
