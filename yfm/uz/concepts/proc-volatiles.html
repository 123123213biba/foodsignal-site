            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Key odorants of cold brew coffee identified by GC-olfactometry and headspace analysis&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-volatiles.jpg\" alt=\"Летучие соединения и анализ аромата\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Clément Bucco-Lechat, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Bowmore_bottle.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-volatiles.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/proc-volatiles.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat mahsulotlarining xushbo'yligi insonning hid bilish retseptorlari bilan o'zaro ta'sir qiluvchi uchuvchan organik birikmalar majmuasidir. Xushbo'ylik tahlili — bu mahsulotning sensor profilini tushunish uchun ushbu molekulalarni aniqlash va miqdorini belgilash jarayonidir.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-volatiles.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Xushbo'ylik — bu uchuvchan birikmalar yig'indisi bilan belgilanadigan oziq-ovqat mahsulotining sifati. Ushbu molekulalar past molekulyar og'irlikka va yuqori uchuvchanlikka ega. Asosiy odorantlar — bu mahsulotning o'ziga xos hidiga eng katta hissa qo'shadigan uchuvchan birikmalar guruhidir. Xushbo'ylik tahlili termik ishlov berish jarayonida yangi moddalar hosil qiluvchi Mayyar reaksiyalari va karamellanish kimyosi bilan chambarchas bog'liq.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-volatiles.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Xushbo'ylikni idrok etish jarayoni molekulalarning mahsulot yuzasidan bug'lanishi bilan boshlanadi. Laboratoriyada bu jarayon mahsulot matritsasidan uchuvchan moddalarni ajratib olish orqali amalga oshiriladi. Birikmalarni aniqlash ularning fizik-kimyoviy xossalariga asoslanadi. Tahlil natijasi kimyoviy tarkibni sensor idrok bilan bog'laydigan xushbo'ylik profilidir.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-volatiles.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Gaz xromatografiyasi-mass-spektrometriya (GX-MS) tahlilning asosiy usuli hisoblanadi. Gaz xromatografiyasi uchuvchan birikmalar aralashmasini komponentlarga ajratadi, mass-spektrometriya esa har bir moddani molekulyar og'irligi bo'yicha aniqlaydi. Olfaktometriya — bu xromatografdan chiqayotgan gaz oqimini ekspert hidlab, qaysi birikmalar kuchli hidga ega ekanligini aniqlaydigan usul. Bug' fazasi tahlili (headspace analysis) murakkab tayyorgarliksiz namuna ustidagi xushbo'yliklarni o'rganish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-volatiles.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Xushbo'ylik tahlili usullari sifat nazorati va yangi mahsulotlar yaratishda qo'llaniladi. Masalan, «Sovuq vakuum yoki pech: quritish jarayonida krevetka ta'mi va oqsili bilan nimalar sodir bo'ladi» tadqiqotida uchuvchan birikmalar tahlili sublimatsiya mahsulotning tabiiy notalarini qanday saqlab qolishini, issiq havo esa qovurilgan hidlarni keltirib chiqarib, asl ta'mni yashirishini tushunishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/proc-volatiles.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Analitik usullar har doim ham inson idrokini to'liq aks ettirmaydi. Modda konsentratsiyasi har doim ham hid intensivligiga to'g'ridan-to'g'ri proportsional emas. Bundan tashqari, turli birikmalarning o'zaro ta'siri ayrim notalarning idrokini kuchaytirishi yoki bostirishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Летучие соединения и анализ аромата&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%20--%3E%20B%5B%D0%98%D1%81%D0%BF%D0%B0%D1%80%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%5D%0A%20%20B%20--%3E%20C%5B%D0%AD%D0%BA%D1%81%D1%82%D1%80%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%93%D0%B0%D0%B7%D0%BE%D0%B2%D0%B0%D1%8F%20%D1%85%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%BE%D0%B3%D1%80%D0%B0%D1%84%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20E%5B%D0%9C%D0%B0%D1%81%D1%81-%D1%81%D0%BF%D0%B5%D0%BA%D1%82%D1%80%D0%BE%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20F%5B%D0%9E%D0%BB%D1%8C%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D1%8F%5D%0A%20%20E%20--%3E%20G%5B%D0%98%D0%B4%D0%B5%D0%BD%D1%82%D0%B8%D1%84%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D1%8F%20%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%B0%5D%0A%20%20F%20--%3E%20H%5B%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BE%D1%86%D0%B5%D0%BD%D0%BA%D0%B0%5D%0A%20%20G%20--%3E%20I%5B%D0%9F%D1%80%D0%BE%D1%84%D0%B8%D0%BB%D1%8C%20%D0%B0%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B0%5D%0A%20%20H%20--%3E%20I%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-volatiles.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Ta'm va hid&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-volatiles.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Urg‘ochi yoki erkak: nega ba’zi midiyalar muzlatgichda tezroq aynib qoladi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Sovuq vakuum yoki issiq pech: quritish krevetka ta'mi va oqsilini qanday o'zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-volatiles.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BE%D0%BB%D0%BE%D0%B4%D0%BE%D0%B2%D1%8B%D0%B9_%D0%B2%D0%B8%D1%81%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Солодовый виски — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Bowmore_bottle.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Clément Bucco-Lechat, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1172539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extending healthy life span--from yeast to humans&lt;/a&gt; — sharh, Science 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/mp/ssp106\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phenylpropanoid biosynthesis&lt;/a&gt; — sharh, Mol Plant 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/aob/mct067\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Jasmonates: biosynthesis, perception, signal transduction and action in plant stress response, growth and development. An update to the 2007 review in Annals of Botany&lt;/a&gt; — sharh, Ann Bot 2013&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты."}],"style":["_assets/biosignal.css","_assets/cut-extens
