        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Plant-based burger meat analogue with pea and soy protein&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-plant_based.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/proc-plant_based.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;O'simlik analoglari (plant-based analogues) — bu o'simlik xomashyosidan tayyorlangan, hayvonot mahsulotlarining organoleptik xususiyatlari va ozuqaviy qiymatini taqlid qiluvchi oziq-ovqat mahsulotlari. Ularning asosi go'sht, sut yoki tuxumning tuzilishi, ta'mi va hidini takrorlash uchun oqsil, yog' va uglevodlarni qayta ishlash texnologiyalaridir.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-plant_based.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;O'simlik analogi — bu hayvonot mahsulotlarining fizik-kimyoviy xususiyatlari va sensorli xususiyatlarini (ta'm, tekstura, hid) taqlid qiluvchi oziq-ovqat mahsulotining bir turi. Asosiy prinsip o'simlik oqsillari (izolyatlari) yordamida matritsa tuzilmasini yaratishdan iborat bo'lib, u termik ishlov berishda mushak to'qimalarining tolali tuzilishini yoki sut mahsulotlarining emulsiyaviy barqarorligini taqlid qiladi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-plant_based.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Analog yaratish jarayoni dukkakli yoki donli ekinlardan oqsil ajratib olish, uni tozalash va keyinchalik strukturallashtirishni o'z ichiga oladi. Yog' fazasini taqlid qilish uchun o'simlik moylari ishlatiladi. Ta'm beruvchilar va bo'yoqlar mahsulotning sensorli profiliga mos kelishi uchun qo'shiladi. Tuzilmaning barqarorligi TR TS 029/2012 tomonidan ruxsat etilgan emulsifikatorlar va stabilizatorlar bilan ta'minlanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-plant_based.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy usul — ekstruziya, ya'ni oqsil massasini yuqori bosim va harorat ostida qoliplardan o'tkazish jarayoni bo'lib, u oqsil molekulalarining denaturatsiyasiga va tolalarga yo'nalishiga olib keladi. Shuningdek, ta'm va hidni yaxshilash hamda ozuqa moddalarining biologik mavjudligini oshirish uchun fermentatsiya usullari qo'llaniladi. Sifat nazorati HACCP tamoyillari asosida amalga oshiriladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-plant_based.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;O'simlik analoglari ratsiondagi an'anaviy mahsulotlarga muqobil sifatida ishlatiladi. «Nima uchun biz o'simlik yogurtini tanlaymiz: ta'mi yoki yorlig'i?» maqolasida iste'molchilarning foydani idrok etishi va haqiqiy ta'm sifatlari o'rtasidagi muvozanat tahlil qilinadi. «Yasmiq va no'xatdagi yashirin tahdid: mog'or o'simlik oqsilini qanday o'zgartiradi» materialida xomashyo sifatini nazorat qilish muhimligi ta'kidlanadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-plant_based.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklovlar o'simlik xomashyosidagi antinutriyentlar va saqlash sharoitlari buzilganda mikotoksinlar bilan ifloslanish xavfidir. Shuningdek, o'simlik oqsillarining hayvonot oqsillariga nisbatan hazm bo'lish muammosi mavjud. Iste'molchi analoglarning tarkibi murakkab bo'lishi mumkinligini va yuqori darajada qayta ishlash ishlab chiqarishning barcha bosqichlarida qat'iy xavfsizlik nazoratini talab qilishini hisobga olishi kerak.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Растительные аналоги&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A0%D0%B0%D1%81%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5%20%D1%81%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%92%D1%8B%D0%B4%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B1%D0%B5%D0%BB%D0%BA%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%A1%D1%82%D1%80%D1%83%D0%BA%D1%82%D1%83%D1%80%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%94%D0%BE%D0%B1%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B6%D0%B8%D1%80%D0%BE%D0%B2%5D%0A%20%20D%20--%3E%20E%5B%D0%90%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20E%20--%3E%20F%5B%D0%93%D0%BE%D1%82%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%B0%D0%BD%D0%B0%D0%BB%D0%BE%D0%B3%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-plant_based.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-newfood.html\"&gt;Yangi taomlar&lt;/a&gt; — Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-plant_based.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Oziq-ovqat savati dori o‘rnini bosa oladimi: uzoq muddatli parhez tajribasi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Nasha va suli: fermentatsiya o‘simlik oqsilini qanday o‘zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Yasmiq va no‘xatdagi yashirin xavf: mog‘or o‘simlik oqsilini qanday buzadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;O‘simlik yogurti: tanlovda ta’m muhimmi yoki yorliq?&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-plant_based.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%80%D0%B5%D0%B4_(%D1%80%D0%B0%D1%81%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5_%D0%BC%D0%B0%D1%81%D0%BB%D0%BE)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спред (растительное масло) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature11550\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diversity, stability and resilience of the human gut microbiota&lt;/a&gt; — sharh, Nature 2012&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — sharh, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12951-018-0392-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nano based drug delivery systems: recent developments and future prospects&lt;/a&gt; — sharh, J Nanobiotechnology 2018&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Растительные аналоги","description":"Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.","vcsPath":"concepts/proc-plant_based.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-plant_based.html#tarif","level":2},{"title":"Umumiy ko'rinish","href":"concepts/proc-plant_based.html#umumiy-korinish","level":2},{"title":"Nazariya","href":"concepts/proc-plant_based.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/proc-plant_based.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/proc-plant_based.html#usullar-va-
