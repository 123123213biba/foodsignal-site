        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Material&lt;/strong&gt; · &lt;em&gt;Edible packaging&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/edible-packaging.jpg\" alt=\"Съедобная упаковка\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: File:Edible packaging film.pdf: Paul Pierlot derivative work: Sebastian Wallroth, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Edible_packaging_film.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/edible-packaging.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Yeyiladigan qadoq — bu mahsulotlardagi namlik yo‘qotilishini kamaytirish va mikroorganizmlar o‘sishini bostirish uchun mo‘ljallangan, oziq-ovqat komponentlaridan tayyorlangan biologik parchalanadigan himoya to‘sig‘idir.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/edible-packaging.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Iste'mol qilinadigan qadoq — bu oziq-ovqat komponentlaridan tayyorlangan, mahsulot yuzasiga surtiladigan yoki plyonka shaklida hosil qilinadigan biologik parchalanadigan himoya to'sig'idir. Materialning asosiy vazifasi namlik yo'qotilishini kamaytirish, oksidlanishni sekinlashtirish va mikroorganizmlar o'sishini bostirish orqali mahsulot yangiligini saqlashdan iborat.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/edible-packaging.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Iste'mol qilinadigan qadoq biologik parchalanadigan materialning bir turi hisoblanadi. Texnologiya tabiiy makromolekulalar: polisaxaridlar (kraxmal, alginatlar), oqsillar (kazein, jelatin) yoki lipidlar (mumlar, yog'lar) asosida polimer matritsasini yaratishga asoslangan. Ushbu komponentlar mahsulot va atrof-muhit o'rtasida gazlar, suv bug'lari va erigan moddalar almashinuvini cheklovchi uzluksiz tarmoq hosil qiladi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/edible-packaging.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Qadoqni shakllantirish jarayoni eritma yoki suspenziya tayyorlashni, so'ngra uni mahsulotga botirish, purkash yoki quyish usuli bilan surtishni o'z ichiga oladi. Erituvchi (odatda suv yoki etanol) bug'langandan so'ng yupqa qatlam hosil bo'ladi. Ushbu qatlamning tuzilishi uning to'siq xususiyatlarini belgilaydi: oqsillar mexanik mustahkamlikni ta'minlaydi, lipidlar suv bug'lanishiga to'sqinlik qiladi, polisaxaridlar esa strukturaviy karkasni yaratadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/edible-packaging.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy usullarga nam shakllantirish (casting), ekstruziya va elektrospinning kiradi. Vositalar ishlab chiqarish ko'lamiga bog'liq: qoplamalarni surtish uchun laboratoriya qurilmalaridan tortib, oziq-ovqat mahsulotlarini qadoqlash jarayoniga integratsiya qilingan sanoat liniyalarigacha. Usul tanlash boshlang'ich tarkibning yopishqoqligiga va himoya qatlamining kerakli qalinligiga bog'liq.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/edible-packaging.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Texnologiya oziq-ovqat sanoati chiqindilarini qayta ishlashda qo'llaniladi. Masalan, «Кожа сибаса: как отходы аквакультуры превращаются в съедобную упаковку» maqolasida baliqchilik qo'shimcha mahsulotlaridan mustahkam plyonka yaratish tasvirlangan. «Как кожура апельсина и гвоздика помогают помидорам дольше оставаться свежими» tadqiqotida esa sabzavotlarni buzilishdan himoya qiluvchi qoplama yaratish uchun sitrus chiqindilaridan foydalanish ko'rsatilgan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/edible-packaging.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklovlar fizik-kimyoviy barqarorlik bilan bog'liq: iste'mol qilinadigan qadoq atrof-muhit namligiga sezgir, bu himoya xususiyatlarining yo'qolishiga olib kelishi mumkin. Shuningdek, ishlab chiqarishni kengaytirish va qadoq komponentlari mahsulot ta'mi va hidiga ta'sir qilmasligi uchun organoleptik betaraflikni ta'minlash zarurati bilan bog'liq qiyinchiliklar mavjud. Materiallar xavfsizligi JECFA yoki TR TS 029/2012 kabi xalqaro standartlarga mos kelishi kerak.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Съедобная упаковка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D0%B8%D1%89%D0%B5%D0%B2%D1%8B%D0%B5%20%D0%BA%D0%BE%D0%BC%D0%BF%D0%BE%D0%BD%D0%B5%D0%BD%D1%82%D1%8B%5D%20--%3E%20B%5B%D0%9F%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%97%D0%B0%D1%89%D0%B8%D1%82%D0%BD%D1%8B%D0%B9%20%D0%B1%D0%B0%D1%80%D1%8C%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%BD%D0%B8%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BF%D0%BE%D1%82%D0%B5%D1%80%D0%B8%20%D0%B2%D0%BB%D0%B0%D0%B3%D0%B8%5D%0A%20%20C%20--%3E%20E%5B%D0%9F%D0%BE%D0%B4%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D0%BE%D0%B2%5D%0A%20%20C%20--%3E%20F%5B%D0%97%D0%B0%D0%BC%D0%B5%D0%B4%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BE%D0%BA%D0%B8%D1%81%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20G%5B%D0%A1%D0%BE%D1%85%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5%20%D1%81%D0%B2%D0%B5%D0%B6%D0%B5%D1%81%D1%82%D0%B8%5D%0A%20%20E%20--%3E%20G%0A%20%20F%20--%3E%20G%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasdig'ini kutmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"malumot\"&gt;&lt;a href=\"concepts/edible-packaging.html#malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumot&lt;/span&gt;&lt;/a&gt;Ma'lumot&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;film_thickness&lt;/td&gt;\n&lt;td&gt;0,14 мм&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tensile_strength&lt;/td&gt;\n&lt;td&gt;6,53 МПа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;elongation_at_break&lt;/td&gt;\n&lt;td&gt;94,55%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;storage_temperature&lt;/td&gt;\n&lt;td&gt;4 °C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;storage_duration&lt;/td&gt;\n&lt;td&gt;15 days&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"boshqa-nomlari\"&gt;&lt;a href=\"concepts/edible-packaging.html#boshqa-nomlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa nomlari&lt;/span&gt;&lt;/a&gt;Boshqa nomlari&lt;/h2&gt;\n&lt;p&gt;Edible coating, Биоупаковочный материал, биоразлагаемое покрытие&lt;/p&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/edible-packaging.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html\"&gt;Sibas terisi: baliqchilik chiqindilaridan yeyiladigan qadoqlar&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Apelsin po‘sti va chinnigul pomidorlarni uzoqroq saqlashga qanday yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt; · &lt;a href=\"reference/materials.html\"&gt;Materiallar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/edible-packaging.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%8A%D0%B5%D0%B4%D0%BE%D0%B1%D0%BD%D0%B0%D1%8F_%D0%BF%D0%BE%D1%81%D1%83%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Съедобная посуда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Edible_packaging_film.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: File:Edible packaging film.pdf: Paul Pierlot derivative work: Sebastian Wallroth, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.carbpol.2020.116178\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Polysaccharides, Protein and Lipid -Based Natural Edible Films in Food Packaging: A Review&lt;/a&gt; — sharh, Carbohydr Polym 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/foods7100170\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Alginate-Based Edible Films and Coatings for Food Packaging Applications&lt;/a&gt; — sharh, Foods 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.foodres.2020.109582\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Film formation and deposition methods of edible coating on food products: A review&lt;/a&gt; — sharh, Food Res Int 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Yeyiladigan qadoq — bu mahsulotlardagi namlik yo‘qotilishini kamaytirish va mikroorganizmlar o‘sishini bostirish uchun mo‘ljallangan, oziq-ovqat komponentlarida"}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Съедобная упаковка","description":"Yeyiladigan qadoq — bu mahsulotlardagi namlik yo‘qotilishini kamaytirish va mikroorganizmlar o‘sishini bostirish uchun mo‘ljallangan, oziq-ovqat komponentlarida","vcsPath":"concepts/edible-packaging.md"},"headings":[{"title":"Ta'rif","href":"concepts/edible-packaging.html#tarif","level":2},{"title":"Umumiy ko'rinish","href":"concepts/edible-packaging.html#umumiy-korinish","level":2},{"title":"Nazariya","href":"concepts/edible-packaging.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/edible-packaging.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/edible-packaging.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/edible-packaging.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va qiyinchiliklar","href":"concepts/edible-packaging.html#cheklovlar-va-qiyinchiliklar","level":2},{"title":"Ma'lumot","href":"concepts/edible-packaging.html#malumot","level":2},{"title":"Boshqa nomlari"
