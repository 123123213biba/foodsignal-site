        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Atama&lt;/strong&gt; · &lt;em&gt;Chitosan&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/biopolimery.jpg\" alt=\"Biopolimerlar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Aariuser I, CC BY-SA 2.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Chitosan.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/biopolimery.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Biopolimerlar — bu oziq-ovqat mahsulotlarini tashqi muhitdan himoya qiluvchi ekologik toza qadoqlash uchun ishlatiladigan tabiiy polimerlardir (oqsil yoki polisaxaridlar). Tadqiqotchilar xitozan kabi biopolimerlardan faol plyonkalar yaratishda foydalanadilar.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/biopolimery.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Biopolimerlar — tirik organizmlar tarkibiga kiruvchi va ekologik toza qadoqlash materiallarini yaratish uchun asos bo'lib xizmat qiladigan tabiiy kelib chiqishga ega makromolekulalardir. Oziq-ovqat sanoatida ular mahsulotlarning saqlash muddatini uzaytirish va ularni mikrobiologik buzilishdan himoya qilishga qodir faol plyonkalar va qoplamalar ishlab chiqish uchun qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/biopolimery.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Biopolimerlar takrorlanuvchi tarkibiy birliklar — monomerlardan tashkil topgan polimerlar sinfidir. Asosiy biopolimer turlariga oqsillar (monomerlari — aminokislotalar) va polisaxaridlar (monomerlari — monosaxaridlar) kiradi. Sintetik plastmassalardan farqli o'laroq, biopolimerlar biologik parchalanish xususiyatiga ega, bu ularni qadoqlash ishlab chiqarishda istiqbolli muqobil qiladi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/biopolimery.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Biopolimer matritsasi efir moylari yoki o'simlik ekstraktlari kabi faol moddalarni ushlab turadigan fizik karkasni hosil qiladi. Bunday plyonka yoki qoplama mahsulotga surilganda, u bakteriyalar o'sishi va mog'or rivojlanishini sekinlashtiradigan muhit yaratadi. Masalan, greypfrut ekstrakti yoki timyan moyini polimer tuzilishiga kiritish mikroblarga qarshi birikmalarning asta-sekin ajralib chiqishini ta'minlaydi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/biopolimery.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vosita kompozit materiallarni yaratishdir, bunda biopolimer (masalan, jelatin yoki xitozan) matritsa, o'simlik qo'shimchalari esa funksional agent vazifasini bajaradi. Tadqiqotchilar sitrus mevalari po'stlog'i kabi oziq-ovqat chiqindilaridan faol moddalarni olish uchun ekstraksiya usullaridan foydalanadilar.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/biopolimery.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Biopolimerlarga asoslangan texnologiyalar mahsulotlarni saqlash muammolarini hal qilish uchun faol o'rganilmoqda:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;«Sitrus po'stlog'i tovuq burgerlarini uzoqroq saqlashga qanday yordam beradi» maqolasida greypfrut ekstrakti qo'shilgan jelatin plyonkasi go'shtning muzlatgichdagi yangiligini 5 oyga uzaytirishi tasvirlangan.&lt;/li&gt;\n&lt;li&gt;«Timyan efir moyi tovuq filesini uzoqroq yangi saqlashga qanday yordam beradi» ishida timyan moyi bo'lgan biologik parchalanadigan qadoq tovuq filesida bakteriyalar o'sishini sekinlashtirishi ko'rsatilgan.&lt;/li&gt;\n&lt;li&gt;«Apelsin po'stlog'i va chinnigul pomidorlarni uzoqroq yangi saqlashga qanday yordam beradi» tadqiqotida sabzavotlarni mog'ordan himoya qiluvchi sitrus chiqindilaridan tayyorlangan yeyiladigan qoplama taqdim etilgan.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/biopolimery.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Biopolimer qadoqlar hali universal yechim emas. Ularning samaradorligi saqlash sharoitlari, mahsulot tarkibi va faol moddalar konsentratsiyasiga bog'liq. Ishlab chiqarishni kengaytirish va plyonkalarning xususiyatlarini barqaror saqlashda qiyinchiliklar mavjud. Shuningdek, efir moylari kabi qo'shimchalar mahsulotning ta'mi va hidiga ta'sir qilishi mumkinligini hisobga olish kerak.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Biopolimerlar&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%91%D0%B8%D0%BE%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%20%D0%BC%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%5D%20--%3E%20B%5B%D0%90%D0%BA%D1%82%D0%B8%D0%B2%D0%BD%D1%8B%D0%B5%20%D0%B4%D0%BE%D0%B1%D0%B0%D0%B2%D0%BA%D0%B8%5D%0A%20%20B%20--%3E%7C%D0%B8%D0%BD%D0%BA%D0%B0%D0%BF%D1%81%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%7C%20A%0A%20%20A%20--%3E%20C%5B%D0%97%D0%B0%D1%89%D0% nctional-hydrogel-coatings-with-dual-a.html\"&gt;Pomidor va sitruslarni chirishdan asrovchi ko‘rinmas xitozan qoplamasi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi.html\"&gt;Zig'ir moyi va xitozan: tovuq go'shtini saqlashning yangi usuli&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html\"&gt;Apelsin po‘sti va chinnigul pomidorlarni uzoqroq saqlashga qanday yordam beradi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/biopolimery.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B8%D0%BE%D0%BF%D0%BE%D0%BB%D0%B8%D0%BC%D0%B5%D1%80%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Биополимеры — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Chitosan.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Aariuser I, CC BY-SA 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41577-019-0165-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The NLRP3 inflammasome: molecular activation and regulation to therapeutics&lt;/a&gt; — sharh, Nat Rev Immunol 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrd.2017.243\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mRNA vaccines - a new era in vaccinology&lt;/a&gt; — sharh, Nat Rev Drug Discov 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12951-018-0392-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nano based drug delivery systems: recent developments and future prospects&lt;/a&gt; — sharh, J Nanobiotechnology 2018&lt;/li
