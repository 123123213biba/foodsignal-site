        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-newfood.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/spec-newfood.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Yangi oziq-ovqat — bu innovatsion ishlab chiqarish texnologiyalari yordamida olingan yoki noan'anaviy xomashyo manbalaridan iborat oziq-ovqat mahsulotlari toifasidir. Bularga o'simlik asosidagi muqobillar, kultivatsiya qilingan go'sht, hasharotlar oqsili, zamburug'lar va 3D-bosma usulida yaratilgan mahsulotlar kiradi. Bu sohaning maqsadi resurslardan foydalanish samaradorligini oshirish va an'anaviy qishloq xo'jaligiga muqobillar izlashdir.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-newfood.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Yangi oziq-ovqat — bu olinish usuli yoki tarkibi bilan an'anaviy mahsulotlardan farq qiladigan oziq-ovqat turi. Konsepsiya funksional komponentlarni almashtirish prinsipiga asoslanadi: masalan, hayvonlar mushak to'qimalari o'rniga o'simlik oqsillari yoki hujayra kulturalaridan foydalanish. Bu mahsulotlar xomashyo manbai (o'simliklar, zamburug'lar, hujayralar) yoki ishlov berish texnologiyasi (kultivatsiya, ekstruziya, additiv ishlab chiqarish) bo'yicha tasniflanadi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-newfood.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Yangi oziq-ovqat ishlab chiqarish biotexnologiya va oziq-ovqat kimyosi jarayonlariga asoslanadi. O'simlik muqobillarida go'shtning tolali tuzilishini taqlid qilish uchun oqsillarni teksturalash qo'llaniladi. Kultivatsiya qilingan go'sht — bu bioreaktorlarda ozuqaviy muhitda mushak hujayralarini yetishtirish jarayoni. 3D-bosma — bu oziq-ovqat massasini shakl va tekstura parametrlari bo'yicha qatlamma-qatlam shakllantirish usuli.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-newfood.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vositalar hujayralarni yetishtirish uchun bioreaktorlar, o'simlik oqsillari teksturasini yaratish uchun ekstruderlar va mahsulot tuzilishini modellashtirish uchun 3D-printerlardir. Muhim bosqich — bu «Kultivatsiya qilingan go'sht: yeryong'oq va kinoa ishlab chiqarishda hayvon oqsilini almashtiradi» maqolasida ta'kidlanganidek, hayvon tarkibiy qismlarisiz hujayralar o'sishini ta'minlaydigan ozuqaviy muhitni tanlashdir.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-newfood.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Yangi oziq-ovqat texnologiyalari odatiy ratsionga taqlid qiluvchi mahsulotlar yaratish uchun ishlatiladi. «Nima uchun biz o'simlik yogurtini tanlaymiz: ta'mi yoki yorlig'i?» maqolasida iste'molchilarning bunday mahsulotlarga munosabati ko'rib chiqiladi, bunda ta'm sifati va tarkib haqidagi ma'lumotlar o'rtasidagi muvozanat muhim rol o'ynaydi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/spec-newfood.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklovlar — ishlab chiqarishning yuqori narxi, texnologiyalarni kengaytirish zarurati va xavfsizlikni qat'iy nazorat qilishdir. Yangi xomashyo manbalari allergenlik va toksiklik nuqtai nazaridan baholanishi kerak. Yangi jarayonlarni joriy etishda mikrobiologik xavfsizlik bilan bog'liq xavflar va an'anaviy oziq-ovqat ishlab chiqarish standartlariga rioya qilish zarurati mavjud.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Yangi taomlar&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%96%D0%B0%D2%A3%D0%B0%20%D1%82%D0%B0%D2%93%D0%B0%D0%BC%5D%20--%3E%20B%5B%D3%A8%D1%81%D1%96%D0%BC%D0%B4%D1%96%D0%BA%20%D0%B0%D0%BD%D0%B0%D0%BB%D0%BE%D0%B3%D1%82%D0%B0%D1%80%D1%8B%5D%0A%20%20A%20--%3E%20C%5B%D0%9A%D1%83%D0%BB%D1%8C%D1%82%D0%B8%D0%B2%D0%B0%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D0%BD%D2%93%D0%B0%D0%BD%20%D0%B5%D1%82%5D%0A%20%20A%20--%3E%20D%5B%D0%96%D3%99%D0%BD%D0%B4%D1%96%D0%BA%D1%82%D0%B5%D1%80%20%D0%BC%D0%B5%D0%BD%20%D1%81%D0%B0%D2%A3%D1%8B%D1%80%D0%B0%D1%83%D2%9B%D2%B1%D0%BB%D0%B0%D2%9B%D1%82%D0%B0%D1%80%5D%0A%20%20A%20--%3E%20E%5B3D-%D0%B1%D0%B0%D1%81%D1%8B%D0%BF%20%D1%88%D1%8B%D2%93%D0%B0%D1%80%D1%83%5D%0A%20%20B%20--%3E%20F%5B%D0%A2%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%D0%BB%D0%B0%D1%83%5D%0A%20%20C%20--%3E%20G%5B%D0%91%D0%B8%D0%BE%D1%80%D0%B5%D0%B0%D0%BA%D1%82%D0%BE%D1%80%5D%0A%20%20E%20--%3E%20H%5B%D0%90%D0%B4%D0%B4%D0%B8%D1%82%D0%B8%D0%B2%D1%82%D1%96%20%D3%A9%D0%BD%D0%B4%D1%96%D1%80%D1%96%D1%81%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-newfood.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_based.html\"&gt;Растительные аналоги&lt;/a&gt; — Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-newfood.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Oziq-ovqat savati dori o‘rnini bosa oladimi: uzoq muddatli parhez tajribasi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Nasha va suli: fermentatsiya o‘simlik oqsilini qanday o‘zgartiradi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Yasmiq va no‘xatdagi yashirin xavf: mog‘or o‘simlik oqsilini qanday buzadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;O‘simlik yogurti: tanlovda ta’m muhimmi yoki yorliq?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html\"&gt;Hujayra go‘shti: yeryong‘oq va kinva hayvon oqsiliga muqobil bo‘ladi&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-newfood.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AF%D0%BD%D0%B4%D0%B5%D0%BA%D1%81_%D0%95%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Яндекс Еда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3201/eid0304.970403\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Emerging foodborne diseases: an evolving public health challenge&lt;/a&gt; — sharh, Emerg Infect Dis 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.brainresbull.2018.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Konzo: a distinct neurological disease associated with food (cassava) cyanogenic poisoning&lt;/a&gt; — sharh, Brain Res Bull 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/advances/nmaa025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Back to the Roots: Revisiting the Use of the Fiber-Rich Cichorium intybusL. Taproots&lt;/a&gt; — sharh, Adv Nutr 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Yangi taomlar","description":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.","vcsPath":"concepts/spec-newfood.md"},"headings":[{"title":"Ta'rif","href":"concept
