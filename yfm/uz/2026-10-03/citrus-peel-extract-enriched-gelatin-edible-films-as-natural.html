            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"252\" cy=\"130\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"628\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PRESERVATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sitrus po‘stlog‘i tovuq&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kotletlarini uzoqroq&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;saqlashga qanday yordam&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;beradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural-f1.jpg\" alt=\"1-rasm. Sitrus mevalar poʻstlogʻi ekstrakti qoʻshilgan jelatin pardalar bilan qoplangan tovuq kotletlarining (burgerlari\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Sitrus mevalar poʻstlogʻi ekstrakti qoʻshilgan jelatin pardalar bilan qoplangan tovuq kotletlarining (burgerlarining) 147 kunlik muzlatilgan holda saqlash davomidagi mikrobiologik sifat oʻzgarishlari&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. Sitrus mevalar poʻstlogʻi ekstrakti qoʻshilgan jelatin pardalar bilan qoplangan tovuq kotletlarining (burgerlarining) 147 kunlik muzlatilgan holda saqlash davomidagi mikrobiologik sifat oʻzgarishlari: (A) umumiy psixrofil bakteriyalar, (B) umumiy aerob mezofil bakteriyalar, (C) umumiy koliform bakteriyalar, (D) umumiy sut kislotasi bakteriyalari va (E) umumiy gʻovak va achitqi zamburugʻlari soni. Qiymatlar oʻrtacha ± SD (n = 3) koʻrinishida ifodalangan. Mikrob soni log KOE/g larda berilgan. Tegishli ma'lumotlar jadvalidagi har xil harflar ishlov berish usullari va saqlash muddatlari oʻrtasidagi sezilarli farqlarni koʻrsatadi (P &amp;lt; 0,05).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Tadqiqotchilar muzlatilgan yarim tayyor mahsulotlarning buzilishini sekinlashtirishning tabiiy usulini topdilar. Sitrus po‘stlog‘i ekstraktlari bilan boyitilgan jelatin qobig‘i oksidlanish va bakteriyalar ko‘payishini samarali to‘xtatadi. 4% li greyfurt ekstrakti 147 kun davomida kotletlar sifatini saqlab qolishda eng yaxshi natijani ko‘rsatdi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Jelatin plyonkasidagi 4% li greyfurt ekstrakti yog‘lar oksidlanishini eng yaxshi to‘xtatadi.&lt;/li&gt;\n&lt;li&gt;Qadoq -18 °C da psixrofil va mezofil bakteriyalar o‘sishini samarali bostiradi.&lt;/li&gt;\n&lt;li&gt;Sitrus ekstraktlari tabiiy konservant vazifasini bajaruvchi fenolik birikmalarga boy.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tajribada 1%, 2% va 4% li greyfurt, apelsin va limon ekstraktlari qo‘shilgan jelatin plyonkalari ishlatildi. Ekstraktlar 45 °C da quritilgan po‘stloqlardan &lt;a href=\"concepts/ultrazvukovaya-ekstraktsiya.html\"&gt;ultratovushli ekstraksiya&lt;/a&gt; (40 kGs, 30 °C) usuli bilan olindi. Kotletlar -18 °C haroratda saqlandi va ularning holati bir necha hafta oralig‘ida tahlil qilindi.&lt;/p&gt;\n&lt;p&gt;147-kunga kelib, 4% li greyfurt ekstrakti bilan o‘ralgan namunalar peroksid soni (4,50 meq O₂/kg) va tiobarbitur kislotasi qiymati (0,74 mg MDA/kg) bo‘yicha eng past ko‘rsatkichlarni qayd etdi, bu yuqori antioksidant himoyani bildiradi. Shuningdek, nazorat guruhiga nisbatan aerob mezofil va psixrofil bakteriyalar, mog‘or va achitqilar miqdori sezilarli darajada kamaygani aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot laboratoriya sharoitida o‘tkazilgan, shuning uchun plyonkaning sanoat miqyosidagi samaradorligi qo‘shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ushbu tadqiqotda sitrus mevalari po‘stlog‘i ekstraktlari (greypfrut, apelsin va limon) bilan 1%, 2% va 4% konsentratsiyalarda boyitilgan yeyiladigan jelatin plyonkalarining − 18 °C haroratda muzlatilgan holda saqlanayotgan tovuq burgerlarining sifati va saqlash muddatiga ta’siri 147 kun davomida o‘rganildi. Muhimi, boyitilgan jelatin plyonkalari yordamida tovuq burgerlarida mikrobial va oksidlanish kabi ikki omilni inhibitsiya qilish orqali saqlash muddati uzaytirildi. 147-kuni 4% greypfrut po‘stlog‘i ekstrakti nazorat guruhidagi o‘ramsiz namunalarga nisbatan sezilarli darajada past peroksid qiymati (4,50 meq O₂/kg), tiobarbitur kislotasi qiymati (0,74 mg MDA/kg), umumiy uchuvchan asosli azot (11,20 mg N/100 g) va pH (6,77) ko‘rsatkichlarini namoyon etdi (p ≤ 0,05). Bundan tashqari, mikrobiologik tahlillar shuni ko‘rsatdiki, 4% sitrus po‘stlog‘i ekstraktlari nazorat va boshqa guruhlarga nisbatan burgerlardagi umumiy aerob psixrofil bakteriyalar, umumiy mezofil bakteriyalar, umumiy koliform bakteriyalar, umumiy sut kislotasi bakteriyalari, umumiy achitqi va mog‘or zamburug‘lari sonini sezilarli darajada inhibitsiya qilgan. Greypfrut po‘stlog‘i eng yuqori antioksidant va fenolik tarkibga ega bo‘lib, undan keyin apelsin va limon po‘stloqlari turadi. Umuman olganda, 4% sitrus po‘stlog‘i ekstraktlari bilan boyitilgan jelatin plyonkalari yaxshilangan antioksidant va antibakterial qobiliyatlarni ko‘rsatdi, bu ularning go‘shtni saqlash uchun tabiiy faol qadoqlash materiallari sifatidagi salohiyatini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4% greypfrut ekstrakti qo‘shilgan jelatin plyonkalari oksidlanish va mikroblar o‘sishini sekinlashtirib, muzlatilgan tovuq burgerlarining saqlash muddatini 147 kungacha uzaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kalit so‘zlar: Faol qadoqlash · Sitrus po‘stlog‘i ekstrakti · Saqlash muddati · Yeyiladigan jelatin plyonka · Tovuq burgerlari · Antimikrobial · Muzlatilgan holda saqlash · Lipidlar oksidlanishi · Tabiiy konservant&lt;/p&gt;\n&lt;p&gt;Tovuq go‘shti oqsillar, kam yog‘, erkin aminokislotalar, vitaminlar va minerallarni o‘z ichiga olgan yuqori ozuqaviy qiymatga ega. Biroq, tovuq go‘shti past haroratlarda saqlanganda ham tez buziluvchan hisoblanadi. Buzilishga olib keladigan asosiy omillar qatoriga kislorod, tabiiy fermentlar va mikrobial faollik kiradi. Sovutgichda saqlash vaqtida Pseudomonas spp., Enterobacteriaceae, Brochothrix thermosphacta va sut kislotasi bakteriyalari kabi psixrotrof bakteriyalarning metabolik faoliyati ko‘pincha fizik-kimyoviy o‘zgarishlarga olib keladi. Umuman olganda, tovuq go‘shtidagi bu buzilish jarayonlari pH o‘zgarishiga, shilimshiq hosil bo‘lishiga va tarkibiy qismlarning degradatsiyasiga sabab bo‘ladi. Shu sababli, hozirgi vaqtda tadqiqotchilar mikrobial o‘sish va oksidlanishni inhibitsiya qilish uchun tabiiy usullarni, jumladan, biopolimerlardan (jelatin, xitozan, alginat, kraxmal, agar, karragenan, kollagen va keratin) konservant sifatida foydalanishni o‘rganmoqdalar. Ushbu &lt;a href=\"concepts/biopolimery.html\"&gt;biopolimerlar&lt;/a&gt; bioplastiklar, yeyiladigan plyonkalar yoki funksional qo‘shimchalarga aylantiriladi. Yeyiladigan plyonka — bu oziq-ovqat mahsulotining yuzasiga to‘g‘ridan-to‘g‘ri qo‘llaniladigan yeyiladigan materialning yupqa qatlami. Uning asosiy vazifasi...&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Biopolimerlar — bu oziq-ovqat mahsulotlarini tashqi muhitdan himoya qilish uchun ishlatiladigan, tabiatda mavjud bo‘lgan oqsil yoki polisaxarid asosidagi ekologik toza materiallar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Tovuq go‘shti dunyoda eng ko‘p iste’mol qilinadigan go‘sht turlaridan biri bo‘lib, hayvon oqsilining muhim manbai hisoblanadi. U o‘z xususiyatlari tufayli sog‘lomroq parhez varianti deb hisoblanadi. Plyonkalarning asosiy vazifasi mikrob o‘sishi, kislorod va suv bug‘ining o‘tkazuvchanligi hamda xushbo‘y moddalarning yo‘qolishi kabi buzilish omillarini kamaytirish, shu bilan oziq-ovqat mahsulotlarining saqlash muddatini uzaytirishdan iborat. Bunday plyonkalar odatda polisaxaridlar va oqsillar kabi biopolimerlardan foydalangan holda ishlab chiqariladi. Binobarin, ushbu biopolimerlarning fizik xususiyatlari va tarkibiy xususiyatlari matritsa tarkibi va tuzilishiga qarab farq qilishi mumkin. Jelatin eng muhim va e’tiborga molik biopolimerlardan biridir. Bu oqsil hosilasi bo‘lib, o‘zining noyob xususiyatlari, jumladan, gel hosil qilish qobiliyati, sirt faolligi, yopishqoqlikni nazorat qilish va ajoyib plyonka hosil qilish qobiliyati tufayli oziq-ovqat sanoatida keng qo‘llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Jelatin asosidagi biopolimer plyonkalar mikroblar va kislorod uchun to‘siq yaratib, mahsulotlarning buzilishini samarali sekinlashtiradi, biroq oksidlanishdan himoya qilish uchun qo‘shimchalarni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Biopolimerlar — bu oziq-ovqat mahsulotlarini o‘rash uchun ishlatilishi mumkin bo‘lgan tabiiy polimerlar (oqsil, kraxmal).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biroq, ushbu afzalliklarga qaramay, sof jelatin va jelatin asosidagi plyonkalar o‘ziga xos antioksidant va mikroblarga qarshi xususiyatlarga ega emasligi sababli qo‘llanilishi cheklangan. Ushbu cheklovni bartaraf etish uchun so‘nggi tadqiqotlar biologik parchalanadigan plyonkalarning funksional xususiyatlarini tabiiy o‘simlik antioksidantlari, masalan, ekstraktlar va efir moylarini qo‘shish orqali yaxshilashga qaratilgan. Fenolik birikmalarga boy va turli o‘simlik qismlaridan (masalan, mevalar, barglar, urug‘lar va po‘stloqlar) olingan bu o‘simlik ekstraktlari jelatin asosidagi plyonkalar va qoplamalarni ishlab chiqishda faol moddalar sifatida samarali ishlatilgan. Shu sababli, sitrus mevalari o‘zining jozibali rangi, ta’mi va xushbo‘yligi tufayli dunyodagi eng mashhur meva ekinlaridan biri hisoblanadi. Dunyo bo‘ylab sitrus ishlab chiqarish yiliga 157 million tonnadan ko‘proqqa oshdi. Bu mevalar 1300 dan ortiq turni o‘z ichiga olgan Rutaceae oilasiga mansub. Apelsin, limon, mandarin, laym va greypfrut dunyoda eng ko‘p iste’mol qilinadigan sitrus mevalaridir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot plyonkalarning laboratoriya modeliga qaratilgan; sanoat miqyosida natijalar farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunga qaramay, sitrus mevalari chiqindilarining taxminan 50–60% iste’mol yoki qayta ishlashdan keyin yaroqsiz holga keladi, bunga po‘stloqlar, urug‘lar, mag‘iz va segment qoldiqlari kiradi. Ko‘pgina tadqiqotlar sitrus po‘stlog‘ining oziq-ovqat sanoatidagi salohiyatini o‘rgangan, chunki ular efir moylari, vitaminlar, flavonoidlar, xun tolasi, oqsillar, pektin va turli fenolik birikmalar kabi qimmatli bioaktiv komponentlarning boy manbaidir. Sitrus po‘stlog‘i ekstraktlarining antioksidant va mikroblarga qarshi xususiyatlari fenolik kislotalar, efir moylari va flavonoidlar (masalan, hesperidin va naringin) kabi bioaktiv birikmalarning mavjudligi bilan bog‘liq bo‘lib, ular oldingi tadqiqotlarda tasvirlanganidek, oziq-ovqat tizimlarida tabiiy konservantlar sifatida katta salohiyatga ega ekanligini ko‘rsatdi. Oldingi tadqiqotlar shuni ko‘rsatdiki, sitrus po‘stlog‘idan olingan bioaktiv birikmalarni biopolimer matritsalariga kiritish suv bug‘ining o‘tkazuvchanligi, kislorod to‘sig‘i qobiliyati va mexanik kuch kabi muhim fizik xususiyatlarni o‘zgartirishi mumkin. Ushbu modifikatsiyalar iste’mol qilinadigan plyonkalarning antioksidant va mikroblarga qarshi xususiyatlarini sezilarli darajada yaxshilashi, shu bilan oziq-ovqat sifatini oshirishi va saqlash muddatini uzaytirishi mumkin. Bundan tashqari, sitrus po‘stlog‘i ekstraktlari oziq-ovqat tizimlarida tabiiy konservantlar sifatida katta salohiyatga ega bo‘lgan fenolik birikmalar, flavonoidlar va boshqa fitokimyoviy moddalarga boy.&lt;/p&gt;\n&lt;p&gt;Biroq, ushbu istiqbolli topilmalarga qaramay, muzlatilgan holda uzoq vaqt saqlash davrida tovuq kotletlarini saqlash uchun jelatin asosidagi iste’mol qilinadigan plyonkalarga kiritilgan greypfrut, apelsin va limon po‘stlog‘i ekstraktlarining qiyosiy samaradorligi to‘g‘risida ma’lumotlar cheklangan. Bizning ma’lumotlarimizga ko‘ra, kam sonli tadqiqotlar ushbu sitrus po‘stlog‘i ekstraktlarining konservantlik samaradorligini bir xil formulalar va saqlash sharoitlarida turli darajalarda kiritilganda tizimli ravishda taqqoslagan, shu bilan birga ularning fizik-kimyoviy xususiyatlar, oksidlanish barqarorligi va mikrobiologik sifatga ta’sirini baholagan. Shu sababli, ushbu tadqiqot 1%, 2% va 4% greypfrut, apelsin va limon po‘stlog‘i ekstraktlari bilan boyitilgan jelatinli iste’mol qilinadigan plyonkalarning − 18 °C haroratda 147 kun davomida muzlatilgan holda saqlash vaqtida tovuq kotletlarining sifati va saqlash muddatiga ta’sirini baholashga qaratilgan. Asosan alohida sitrus ekstraktlari yoki plyonkalarni alohida o‘rgangan oldingi tadqiqotlardan farqli o‘laroq, ushbu tadqiqot bir xil formulalar va muzlatilgan holda saqlash sharoitlarida jelatin asosidagi iste’mol qilinadigan plyonkalarga kiritilgan greypfrut, apelsin va limon po‘stlog‘i ekstraktlarini tizimli qiyosiy baholashni taqdim etadi. Topilmalar qishloq xo‘jaligi chiqindilarini qayta ishlashni qo‘llab-quvvatlagan holda, sitrus mahsulotlarini qayta ishlash qo‘shimcha mahsulotlarining go‘sht mahsulotlari uchun tabiiy konservantlar sifatidagi salohiyatini namoyish etib, barqaror faol qadoqlash tizimlarini rivojlantirishga hissa qo‘shadi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"jelatin-plyonkalarining-fizik-kimyoviy-xossalari\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#jelatin-plyonkalarining-fizik-kimyoviy-xossalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jelatin plyonkalarining fizik-kimyoviy xossalari&lt;/span&gt;&lt;/a&gt;Jelatin plyonkalarining fizik-kimyoviy xossalari&lt;/h4&gt;\n&lt;p&gt;Sitrus po‘stlog‘i ekstraktlari jelatin plyonkalarning mexanik sifatlariga sezilarli ta’sir ko‘rsatib, ularning egiluvchanligi va foydalilik darajasini oshirdi. Tovuq go‘shtining yangiligini belgilovchi ikkita muhim omilamchi muhim omillar bu pH va umumiy uchuvchan asosli azot (&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt;) qiymatlari bo‘lib, bu ikki ko‘rsatkichning ortishi go‘shtning aynishidan dalolat beradi. Dastlab barcha namunalarning pH qiymati 6,10 ni tashkil etdi. 147 kunlik saqlash davrida barcha guruhlarda pH ning biroz ko‘tarilishi kuzatildi (1-jadval). Tarkibida sitrus po‘stlog‘i ekstraktlarining yuqori konsentratsiyasi (4%) bo‘lgan jelatin plyonkalar bilan ishlov berilgan tovuq kotletlarida pH ning kichikroq o‘sishi kuzatildi, bu biokimyoviy reaksiyalarning silliq kechishidan dalolat beradi. Saqlash muddati oxirida G-G4, G-O4 va G-L4 guruhlarida qiymatlar mos ravishda 6,77, 6,88 va 6,80 ni tashkil etdi. Aksincha, C va G-C guruhlarida pH qiymatlari sezilarli darajada yuqori — 7,13 bo‘ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Plyonkalar tarkibida 4% sitrus ekstraktlaridan foydalanish pH va TVB-N o‘sishini sekinlashtiradi, bu esa muzlatilgan go‘sht mahsulotlarining yangiligini uzoqroq saqlashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Muzlatilgan holda saqlash davrida kuzatilgan pH ning bosqichma-bosqich o‘sishi faqat oqsil degradatsiyasi bilan emas, balki aynish bilan bog‘liq mikrobial metabolizm va oqsil parchalanishi jarayonida hosil bo‘ladigan ammiak va biogen aminlar kabi ishqoriy metabolitlarning to‘planishi bilan bog‘liq. Bu talqin saqlash davrida kuzatilgan TVB-N qiymatlarining bir vaqtda o‘sishi bilan ham tasdiqlanadi, bu esa sifatning yomonlashuvi bilan bog‘liq uchuvchan azotli birikmalarning bosqichma-bosqich shakllanishini ko‘rsatadi. Shunga o‘xshash kuzatishlar Farokhzad va boshqalar (2023) tomonidan keltirilgan bo‘lib, ular ishlov berilmagan nazorat namunalarida kuzatilgan yuqori pH qiymatlarini saqlash davrida aynish bilan bog‘liq bo‘lgan chuqurroq biokimyoviy o‘zgarishlar bilan izohlaganlar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TVB-N (umumiy uchuvchan asosli azot) — bu go‘shtda bakteriyalar ko‘payib, oqsillar parchalanganda ortib boradigan ko‘rsatkich; bu qiymat qancha past bo‘lsa, mahsulot shunchalik yangi bo‘ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan tashqari, jelatinli yeyiladigan plyonkalar tarkibiga kiritilgan greypfrut, apelsin va limon po‘stlog‘i ekstraktlari konsentratsiyasining oshirilishi muzlatilgan holda saqlash vaqtida pH o‘sishini samarali sekinlashtirdi. Ushbu himoya ta’sirini sitrus po‘stlog‘i fitokimyoviy moddalarining, jumladan fenolik birikmalar va flavonoidlarning antioksidant xususiyatlari va tabiiy mikroblarga qarshi faolligi bilan izohlash mumkin, ular aynish bilan bog‘liq biokimyoviy reaksiyalarni kamaytirishga va saqlash davrida tovuq kotletlarining fizik-kimyoviy barqarorligini saqlashga yordam beradi (Ebrahimian va boshqalar, 2023). Xuddi shunday, 1-jadvalda ko‘rsatilganidek, nazorat namunasi ishlov berilgan namunalarga nisbatan yuqoriroq TVB-N qiymatlarini ko‘rsatdi, bu go‘shtda aynish faolligi va oqsil parchalanishi yuqoriroq ekanligini anglatadi (Manthey va boshqalar, 1988). Biroq, ekstraktli plyonkalar (G-G4, G-O4, G-L4), (G-G2, G-O2, G-L2) va (G-G1, G-O1, G-L1) muzlatilgan holda saqlash davrida kotletlarning TVB-N qiymatiga sezilarli ta’sir ko‘rsatdi (P &amp;lt; 0,05). Saqlash muddati oxirida eng past TVB-N qiymati qayd etildi...&lt;/p&gt;\n&lt;h4 id=\"greypfrut-posti-ekstraktlari\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#greypfrut-posti-ekstraktlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Greypfrut po‘sti ekstraktlari&lt;/span&gt;&lt;/a&gt;Greypfrut po‘sti ekstraktlari&lt;/h4&gt;\n&lt;p&gt;Sitrus mevalarining po‘stloq qismlari fenolik birikmalar, limonoidlar va flavonoidlarga boy. 2-jadvalda ko‘rsatilganidek, greypfrut, apelsin va limon po‘sti ekstraktlarining umumiy antioksidant va fenolik birikmalari tarkibida sezilarli farq kuzatildi (P&amp;lt;0,05). Greypfrut po‘sti eng ko‘p fenolik birikmalar va antioksidant faollikka ega, undan keyin apelsin va limon po‘stlari turadi. Bu farq har bir sitrus po‘stlog‘ida topilgan fenolik kimyoviy moddalarning tarkibi va konsentratsiyasidagi tafovutlar bilan izohlanishi mumkin. Greypfrut po‘sti ekstraktining antioksidant qiymati 70% li etanolli ekstraktda 687,48 µmol trolox/g deb qayd etildi. Xuddi shunday, limon po‘sti ekstrakti eng past qiymatni (227,40 µmol trolox/g) ko‘rsatdi. Natijalarga ko‘ra, fenolik birikmalar mos ravishda greypfrutda (598,45 mg &lt;a href=\"concepts/gallic-acid-equivalent.html\"&gt;GAE&lt;/a&gt;/g), apelsin po‘stida (428,62 mg GAE/g) va limon po‘stida (364,8 mg GAE/g) qayd etildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Greypfrut po‘sti ekstrakti eng yuqori antioksidant faollik (687,48 µmol trolox/g) va fenolik tarkibni (598,45 mg GAE/g) ko‘rsatdi, bu uni o‘rganilgan namunalar orasida eng samarali tabiiy konservantga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mavjud natijalar sitrus po‘stloqlaridagi umumiy fenollar miqdori 188,2 dan 766,7 mg GAE/100 g gacha o‘zgarganligi haqidagi tadqiqotlarga mos keladi. Xuddi shunday, 70% li etanolli apelsin po‘sti ekstrakti 607,67 µmol trolox/g qiymati bilan kuchli antioksidant faollikka ega ekanligi, limon po‘sti ekstrakti esa 203,22 µmol trolox/g ekanligi ta’kidlangan. Boshqa tadqiqotda 50% li etanolli apelsin po‘sti ekstraktida (OPE) 189,7 mg GAE/100 g umumiy fenollar qayd etilgan. Topilgan natijalar greypfrut po‘stining umumiy antioksidant faolligi va fenolik tarkibi mandarin po‘stinikidan yuqori ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;Peroksidlar lipid oksidlanishining birlamchi reaktiv mahsulotlari bo‘lib, dastlabki oksidlanish uchun javobgardir. Saqlash boshida peroksid qiymati (PV) 1,00 meq O₂/kg deb qayd etilgan va bu qiymat saqlash davomida barcha namunalarda oshgan (3-jadval). Sitrus po‘sti ekstrakti bilan o‘ralgan jelatin plyonkali namunalar (G-G, G-O va G-L guruhlari) saqlash davomida sezilarli darajada past PV qiymatlarini saqlab qoldi (P &amp;lt; 0,05). Saqlash oxirida nazorat guruhining PV qiymati 7,00 meq O₂/kg, G-G4 guruhi esa 4,50 meq O₂/kg deb qayd etildi. Bu topilmalar oldingi hisobotlarga mos keladi. PV qiymatining vaqt o‘tishi bilan oshishi saqlash muddati bilan oksidlanishning kuchayishi bilan bog‘liq. Xuddi shunday tendensiya lipid oksidlanishining ikkilamchi ko‘rsatkichi bo‘lgan &lt;a href=\"concepts/thiobarbituric-acid-reactive-substances.html\"&gt;TBARS&lt;/a&gt; qiymatlarida ham kuzatildi, bu hidning o‘zgarishi, rang va yoqimsiz ta’mlarni bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Peroksid soni (PV) va TBARS — bu yog‘larning «yangi»ligini ko‘rsatuvchi laboratoriya ko‘rsatkichlari. Ular qancha past bo‘lsa, mahsulot shunchalik sekin aynaydi va buziladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dastlabki TBARS darajasi qayta ishlangan va qayta ishlanmagan tovuq burgerlarida 0,15 mg MDA/kg ni tashkil etdi (3-jadval). Saqlash vaqti oshishi bilan barcha sinovdan o‘tgan burgerlarning TBARS qiymatlari oshdi (p &amp;lt; 0,05). Saqlashning 147-kunida TBARS qiymatlari C va G-C guruhlarida (1,01 va 0,92 mg MDA/kg) va sitrus po‘sti ekstrakti plyonkali guruhlarda: G-G4 (0,74 mg MDA/kg), G-O4 (0,75 mg MDA/kg) va G-L4 (0,80 mg MDA/kg) ni tashkil etdi. Bu natijalar jelatin va apelsin po‘sti ekstrakti bilan ishlov berilgan namunalar saqlash vaqtida eng yuqori antioksidant faollikni ko‘rsatganligi haqidagi ma’lumotlarga mos keladi. 3-jadvalda ko‘rsatilganidek, barcha namunalarning PV va TBARS qiymatlari saqlash davomida asta-sekin oshib bordi.&lt;/p&gt;\n&lt;p&gt;2-jadval. Greypfrut, apelsin va limon po‘sti ekstraktlarining umumiy fenolik birikmalari va antioksidant sig‘imi&lt;br /&gt;\nNamunalar / Umumiy fenolik birikmalar (mg GAE/g) / Umumiy antioksidant sig‘imi (µmol trolox/g)&lt;br /&gt;\nGreypfrut po‘sti / 598,45 ± 112,16a / 687,48 ± 94,60a&lt;br /&gt;\nApelsin po‘sti / 428,62 ± 105,82a / 533,91 ± 102,80ab&lt;br /&gt;\nLimon po‘sti / 364,8 ± 64,61ab / 227,40 ± 170,36b&lt;br /&gt;\nIzoh: Har xil kichik harflar namunalar o‘rtasidagi sezilarli farqni ko‘rsatadi (P &amp;lt; 0,05). Qiymatlar o‘rtacha ± standart og‘ish (n = 3) sifatida ifodalangan.&lt;/p&gt;\n&lt;h4 id=\"greypfrut-posti-ekstraktlari1\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#greypfrut-posti-ekstraktlari1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Greypfrut po‘sti ekstraktlari&lt;/span&gt;&lt;/a&gt;Greypfrut po‘sti ekstraktlari&lt;/h4&gt;\n&lt;p&gt;Sitrussimonlarning po‘stloq qismlari fenolik birikmalar, limonoidlar va flavonoidlarga boy. 2-jadvalda ko‘rsatilganidek, greypfrut, apelsin va limon po‘sti ekstraktlarining umumiy antioksidant va fenolik birikmalari miqdorida sezilarli farq kuzatildi (P&amp;lt;0,05). Greypfrut po‘sti eng ko‘p fenolik birikmalar va antioksidant faollikka ega, undan keyin apelsin va limon po‘stlari turadi. Bu farq har bir sitrus po‘stida mavjud bo‘lgan fenolik kimyoviy moddalarning tarkibi va konsentratsiyasidagi tafovutlar bilan izohlanishi mumkin. 70% li etanolli ekstraktda greypfrut po‘sti ekstraktining antioksidant qiymati 687,48 µmol trolox/g ni tashkil etdi, xuddi shunday, limon po‘sti ekstrakti eng past qiymatni (227,40 µmol trolox/g) ko‘rsatdi. Shuningdek, natijalarga ko‘ra, fenolik birikmalar mos ravishda greypfrut po‘stida (598,45 mg GAE/g), apelsin po‘stida (428,62 mg GAE/g) va limon po‘stida (364,8 mg GAE/g) qayd etildi. Mavjud natijalar sitrus po‘stlaridagi umumiy fenollar miqdori 188,2 dan 766,7 mg GAE/100 g gacha o‘zgarganligini xabar qilgan tadqiqotlar bilan mos keladi. Xuddi shunday, 70% li etanolli apelsin po‘sti ekstrakti 607,67 µmol trolox/g qiymati bilan kuchli antioksidant faollikka ega ekanligi, limon po‘sti ekstrakti esa 203,22 µmol trolox/g ekanligi ta’kidlangan. Shuningdek, 50% li etanolli apelsin po‘sti ekstraktida (OPE) umumiy fenollar (189,7 mg GAE/100 g) kuzatilgan. Topilmalar greypfrut po‘stining umumiy antioksidant faolligi va fenolik tarkibi mandarin po‘stinikidan yuqori ekanligini qayd etgan tadqiqotlar bilan mos keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Greypfrut po‘sti ekstrakti eng yuqori antioksidant faollik (687,48 µmol trolox/g) va fenolik tarkib (598,45 mg GAE/g) bilan ajralib turadi, bu esa uni apelsin va limon ekstraktlaridan ustun qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GAE (Gall kislotasi ekvivalenti) — namunadagi fenolik birikmalar miqdorini gall kislotasi birliklarida o‘lchash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotda kuzatilgan greypfrut po‘sti ekstraktining yuqori konservantlik samaradorligi, ehtimol, faqat umumiy fenolik tarkib bilan emas, balki uning fitokimyoviy tarkibidagi farqlar bilan bog‘liq. Greypfrut po‘sti ayniqsa flavanon naringin, shuningdek furanokumarinlar, limonoidlar, fenolik kislotalar va efir moyi tarkibiy qismlariga boy, apelsin po‘sti esa yuqori konsentratsiyali hesperidinni o‘z ichiga oladi, limon po‘sti esa ko‘p miqdordagi eriositrin va boshqa flavanon glikozidlar bilan tavsiflanadi. Ushbu fitokimyoviy moddalar erkin radikallarni zararsizlantirish, metall ionlarini xelatlash, lipidlarning peroksidlanishini inhibe qilish, mikroblar hujayra membranalarini buzish va mikroblarning metabolik jarayonlariga aralashish kabi ko‘plab mexanizmlar orqali bir-birini to‘ldiruvchi antioksidant va mikroblarga qarshi xususiyatlarga ega. Binobarin, ushbu bioaktiv tarkibiy qismlarning birgalikdagi ta’siri va nisbiy ko‘pligi ushbu tadqiqotda kuzatilgan greypfrut po‘sti ekstraktining yuqori antioksidant va mikroblarga qarshi samaradorligini tushuntirishi mumkin. Shunga qaramay, HPLC yoki GC-MS kabi tahliliy usullardan foydalangan holda sitrus po‘sti ekstraktlarining har tomonlama fitokimyoviy tavsifi ushbu ta’sirlar uchun javobgar bo‘lgan birikmalar haqida batafsilroq tushuncha beradi va kelgusi tadqiqotlarda ko‘rib chiqilishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot jelatin plyonkalari bilan cheklangan; plyonkalarning antioksidant xususiyatlari bevosita baholanmagan, bu esa yakuniy mahsulot samaradorligini aniqlashni qiyinlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqot sitrus po‘sti ekstrakti qo‘shilgan jelatinli yeyiladigan plyonkalarning muzlatilgan holda saqlash vaqtida tovuq burgerlarining fizik-kimyoviy barqarorligi va mikrobiologik sifatini yaxshilash salohiyatini ko‘rsatgan bo‘lsa-da, bir nechta cheklovlarni tan olish kerak. Birinchidan, sitrus po‘sti ekstraktlari qo‘shilgandan so‘ng kompozit jelatin plyonkalarning antioksidant xususiyatlari bevosita baholanmagan, garchi alohida sitrus po‘sti ekstraktlarining antioksidant faolligi aniqlangan bo‘lsa ham. Jelatin matritsasiga kiritish bioaktiv birikmalarning funksional xususiyatlariga ta’sir qilishi mumkinligi sababli, kelgusi tadqiqotlar ishlab chiqilgan yeyiladigan plyonkalarning antioksidant xususiyatlarini o‘rganishi kerak. Ikkinchidan, sitrus po‘sti ekstraktlari va tayyorlangan jelatin plyonkalarning pH darajasi o‘lchanmagan, bu ularning fizik-kimyoviy xulq-atvori va konservatsiya mexanizmlari haqida qo‘shimcha ma’lumot berishi mumkin edi. Bundan tashqari, ushbu tadqiqot muzlatilgan saqlash sharoitida konservantlik samaradorligini ko‘rsatgan bo‘lsa-da, sovutilgan holda saqlash va mexanizmlarni chuqurroq o‘rganish ularning funksionalligini yaxshiroq tushunishga yordam beradi. Nihoyat, saqlash vaqtida yeyiladigan plyonkalardan ajralib chiqadigan bioaktiv birikmalarni har tomonlama tavsiflash go‘sht mahsulotlarini saqlashdagi hissasi haqida qimmatli ma’lumot beradi. Kelgusi tadqiqotlar, shuningdek, oziq-ovqat sanoatida barqaror faol qadoqlash materiallari sifatida foydalanishni osonlashtirish uchun masshtablashtirish, mexanik xususiyatlar, iste’molchilarning sensorli qabul qilishi va tijorat maqsadida qo‘llanilishini baholashi kerak.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Ushbu tadqiqot shuni ko'rsatdiki, greyfurt, apelsin va limon po'stlog'i ekstraktlari bilan boyitilgan jelatin asosidagi yeyiladigan plyonkalar muzlatilgan tovuq kotletlarini saqlash uchun barqaror faol qadoqlash materiallari sifatida katta salohiyatga ega. Sitrus po'stlog'i ekstraktlarining qo'shilishi jelatin plyonkalarining antioksidant va mikroblarga qarshi xususiyatlarini yaxshiladi, bunda greyfurt po'stlog'i ekstrakti sinovdan o'tgan variantlar orasida eng yuqori konservantlik samaradorligini ko'rsatdi. Sitrus ekstrakti qo'shilgan jelatin plyonkalar bilan qoplangan tovuq kotletlari muzlatilgan holda saqlash davomida qoplamasiz nazorat namunalariga nisbatan barqaror ravishda pastroq pH, umumiy uchuvchi asosli azot (TVB-N), peroksid qiymati (PV), tiobarbitur kislotasi bilan reaksiyaga kirishuvchi moddalar (TBARS) va mikrob sonini ko'rsatdi, bu fizik-kimyoviy barqarorlikning yaxshilanganini va saqlash muddatining uzayganini anglatadi. Konservantlik ta'siri ekstrakt konsentratsiyasi oshishi bilan kuchaydi, bunda 4% li formulalar eng yuqori himoyani ta'minladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4% li greyfurt po'stlog'i ekstrakti qo'shilgan jelatin plyonkasi muzlatilgan go'sht mahsulotlarining oksidlanishini va mikroblar ko'payishini maksimal darajada kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, ushbu topilmalar shuni ko'rsatadiki, sitrus mahsulotlarini qayta ishlashdan qolgan chiqindilarni biologik parchalanadigan jelatin plyonkalarda tabiiy konservantlar sifatida muvaffaqiyatli qayta ishlatish mumkin. Bu go'sht mahsulotlari saqlanishini yaxshilash uchun ekologik barqaror yondashuvni ta'minlaydi va oziq-ovqat mahsulotlarini faol qadoqlash tizimlarini rivojlantirishga xizmat qiladi. Kelgusi tadqiqotlar ishlab chiqilgan plyonkalarning fizik-kimyoviy xususiyatlarini chuqurroq o'rganishi, ularning antioksidant va mikroblarga qarshi faolligi mexanizmlarini aniqlashi, turli saqlash sharoitlarida samaradorligini baholashi va oziq-ovqat qadoqlash sanoatida tijorat maqsadida qo'llanilishini tekshirishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TVB-N va TBARS — go'shtning yangiligini ob'ektiv o'lchashga imkon beruvchi laboratoriya ko'rsatkichlari: birinchisi oqsillarning parchalanishini, ikkinchisi esa yog'larning oksidlanishini aks ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"tsitrus-posti-ekstraktlarini-tayyorlash\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#tsitrus-posti-ekstraktlarini-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tsitrus po‘sti ekstraktlarini tayyorlash&lt;/span&gt;&lt;/a&gt;Tsitrus po‘sti ekstraktlarini tayyorlash&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda greyfurt, apelsin va limon Niğde shahridagi mahalliy bozordan xarid qilindi. Meva laboratoriyaga keltirildi, kran suvi bilan yuvildi va tozalandi. Greyfurt, apelsin va limon po‘stlari alohida laboratoriya konveksion pechida 45 °C haroratda 48 soat davomida quritildi. Keyin maydalangan po‘st kukuni ekstraksiya uchun ishlatildi. Ekstraksiya uchun 10 g kukun 100 ml 70% li etanolga qo‘shildi va aralashma ultratovushli ishlov berish (CUB-5, Citizen, 40 kHz, 220–240 V) yordamida 30 °C da 45 daqiqa davomida ishlandi. Aralashmalar filtr qog‘ozi orqali filtrlanib, etanol ajratib olindi va u 45 °C da rotatsion vakuumli bug‘latgichda 45 daqiqa davomida ishlatilib, ekstrakt olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ultratovushli ekstraksiya — bu yuqori chastotali tovush to‘lqinlari yordamida xomashyodan foydali moddalarni ajratib olish usuli bo‘lib, u hujayra devorlarini parchalab, jarayonni tezlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tovuq-burgerini-tayyorlash\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#tovuq-burgerini-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tovuq burgerini tayyorlash&lt;/span&gt;&lt;/a&gt;Tovuq burgerini tayyorlash&lt;/h4&gt;\n&lt;p&gt;Taxminan 22 kg yangi tovuq go‘shti (ko‘krak va son qismlari) Bayaz bozoridan xarid qilindi, muz bilan tashildi, tozalandi, yuvildi va suyakdan ajratildi. Tovuq burgerlari tovuq ko‘krak qiyma go‘shti (69,5%), bug‘doy uni (10,0%), makkajo‘xori kraxmali (10,0%), soya yog‘i (5,0%), guruch uni (2,0%), tuz (1,0%), piyoz kukuni (2,0%), sarimsoq kukuni (0,20%), qora murch (0,10%), tog‘rayhon (0,10%) va zira (0,10%) aralashtirilib tayyorlandi. Keyin 100 g li burger kotletlari (1 × 8 sm) shakllantirildi va har biri alohida plyonkaga o‘raldi. Solishtirish uchun namunalar 11 guruhga bo‘lindi: nazorat (ishlov berilmagan); ekstraktsiz jelatin plyonkali guruh (C-G); 1%, 2% va 4% greyfurt ekstrakti bilan boyitilgan jelatin plyonkali uchta guruh (G-G1, G-G2, G-G4); 1%, 2% va 4% apelsin ekstrakti bilan (G-O1, G-O2, G-O4) va 1%, 2% va 4% limon ekstrakti bilan (G-L1, G-L2, G-L4). Tovuq burgeri namunalari −18 °C da 147 kun davomida saqlandi, bu tijorat muzlatilgan tovuq burgerlarining uzoq muddatli saqlash muddatini imitatsiya qiladi. Fizik-kimyoviy va mikrobiologik tahlillar 0, 21, 42, 63, 84, 105 va 147-kunlarda o‘tkazildi.&lt;/p&gt;\n&lt;h4 id=\"jelatin-plyonka-hosil-qiluvchi-eritmalarni-tayyorlash\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#jelatin-plyonka-hosil-qiluvchi-eritmalarni-tayyorlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jelatin plyonka hosil qiluvchi eritmalarni tayyorlash&lt;/span&gt;&lt;/a&gt;Jelatin plyonka hosil qiluvchi eritmalarni tayyorlash&lt;/h4&gt;\n&lt;p&gt;Jelatin plyonkalari Gómez-Estaca va boshq. (2009) tomonidan tasvirlangan quyish texnikasi yordamida 3 bosqichda tayyorlandi. Jelatin plyonka hosil qiluvchi vosita sifatida ishlatildi. Glitserin moslashuvchanlikni oshirish uchun, d-sorbitol esa plastifikator sifatida qo‘shildi. Tsitrus ekstraktlari tabiiy funksional qo‘shimchalar sifatida jelatin eritmasiga qo‘shildi. 1%, 2% va 4% konsentratsiyalar oziq-ovqat plyonkalari formulalarida samarali qo‘shilish darajalari haqidagi oldingi tadqiqotlarga asoslanib tanlandi. Bu konsentratsiyalar konservantlik salohiyatini baholash uchun past, o‘rta va yuqori darajalar sifatida qabul qilindi. 3% konsentratsiya dastlabki eksperimental rejaga kiritilmaganligi sababli ishlatilmadi.&lt;/p&gt;\n&lt;h4 id=\"fizik-kimyoviy-tahlil-namuna-ph-qiymatini-aniqlash\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#fizik-kimyoviy-tahlil-namuna-ph-qiymatini-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fizik-kimyoviy tahlil: Namuna pH qiymatini aniqlash&lt;/span&gt;&lt;/a&gt;Fizik-kimyoviy tahlil: Namuna pH qiymatini aniqlash&lt;/h4&gt;\n&lt;p&gt;pH Manthey va boshq. (1988) usuli bo‘yicha aniqlandi. Raqamli pH-metr (Hanna HI2211, Hanna Instruments, Ruminiya) ishlatildi. Taxminan 10 g namuna 90 ml distillangan suv bilan laboratoriya gomogenizatorida 1–2 daqiqa davomida aralashtirildi. pH-metr o‘lchashdan oldin pH 4,0 va 7,0 bo‘lgan standart bufer eritmalar bilan kalibrlandi. Namunani gomogenlashdan so‘ng, elektrod joylashtirildi va ko‘rsatkich barqarorlashgach, pH qiymati yozib olindi. O‘lchovlar uch marta takrorlandi va o‘rtacha qiymatlar natija sifatida olindi.&lt;/p&gt;\n&lt;h4 id=\"umumiy-uchuvchi-asosli-azot-tvb-n\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#umumiy-uchuvchi-asosli-azot-tvb-n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy uchuvchi asosli azot (TVB-N)&lt;/span&gt;&lt;/a&gt;Umumiy uchuvchi asosli azot (TVB-N)&lt;/h4&gt;\n&lt;p&gt;TVB-N miqdori Schormüller (1968) usuli bo‘yicha o‘lchandi. Qisqacha aytganda, 20 g gomogenlangan tovuq burgeriga 50 ml distillangan suv qo‘shildi. Keyin ko‘pikni yo‘qotuvchi vosita sifatida taxminan 1 qoshiq magniy oksidi (MgO) qo‘shildi. Distillat 0,1 N xlorid kislota (HCl) saqlaydigan qabul qiluvchi kolbaga yig‘ildi, u yerda uchuvchi asoslar yutiladi. Keyinchalik, kislota ortiqchasi teng normallikdagi asos eritmasi (0,1 N NaOH) bilan teskari titrlandi. Ishlatilgan titrant hajmi yozib olindi va TVB-N miqdori har 100 g namunaga nisbatan azot milligrammida (mg/100 g) hisoblab chiqildi.&lt;/p&gt;\n&lt;h4 id=\"peroksid-soni-pv\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#peroksid-soni-pv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Peroksid soni (PV)&lt;/span&gt;&lt;/a&gt;Peroksid soni (PV)&lt;/h4&gt;\n&lt;p&gt;Tovuq go‘shtining peroksid sonini (POV) aniqlash AOAC (1990) va AOAC (1998) usullari bo‘yicha amalga oshirildi. Peroksid sonini aniqlash uchun ishlatilgan kimyoviy moddalar: 1 g namuna, 30 ml xloroform–sirka kislotasi eritmasi (2:3, v/v), 1 ml to‘yingan kaliy yodid (KI), 75 ml distillangan suv, 0,5 ml kraxmal va 0,1 M natriy tiosulfat (Na₂S₂O₃). Namunalarning peroksid sonlari mэкв/kg da hisoblandi.&lt;/p&gt;\n&lt;h4 id=\"tiobarbitur-kislotasi-bilan-reaksiyaga-kirishuvchi-moddalar-tbars\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#tiobarbitur-kislotasi-bilan-reaksiyaga-kirishuvchi-moddalar-tbars\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tiobarbitur kislotasi bilan reaksiyaga kirishuvchi moddalar (TBARS)&lt;/span&gt;&lt;/a&gt;Tiobarbitur kislotasi bilan reaksiyaga kirishuvchi moddalar (TBARS)&lt;/h4&gt;\n&lt;p&gt;TBARS miqdori AOAC (1998) usuli bo‘yicha aniqlandi. 0,100 g namuna uchun quyidagi kimyoviy moddalar ishlatildi: 5 ml n-butanol, 5 ml tiobarbitur kislotasi (TBA) reaktivi. Olingan supernatantning absorbansiyasi 530 nm to‘lqin uzunligida spektrofotometr yordamida o‘lchandi. Natijalar quyidagi formula bo‘yicha hisoblandi va mg malondialdegid / kg namuna ko‘rinishida ifodalandi.&lt;/p&gt;\n&lt;h4 id=\"mikrobiologik-tahlil\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#mikrobiologik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mikrobiologik tahlil&lt;/span&gt;&lt;/a&gt;Mikrobiologik tahlil&lt;/h4&gt;\n&lt;p&gt;Mikrobiologik hisoblashlar 10 g namunani 90 ml Ringer eritmasida stomacher yordamida gomogenizatsiya qilish orqali amalga oshirildi. Psixrofil bakteriyalar 7–10 °C haroratda bir hafta inkubatsiyadan so‘ng Tryptone Glucose Yeast (TGYE Agar) muhitida hisoblandi. Mezofil bakteriyalar soni Tryptone Glucose Yeast (TGYE Agar) muhitidan foydalangan holda, 30 °C haroratda 2 kun inkubatsiya qilingan holda, quyma likopcha usuli bilan aniqlandi. Koliform bakteriyalar 37 °C haroratda 24–48 soat davomida inkubatsiya qilingan Violet Red Bile Agar (VRBA) muhitida hisoblandi. Sut kislotasi bakteriyalari ularning o‘sishini qo‘llab-quvvatlaydigan Man Rogosa and Sharpe (MRS) agarida 30 °C haroratda 48 soat davomida inkubatsiya qilinib hisoblandi. Mog‘or va achitqilar 25 °C haroratda 5 kun inkubatsiyadan so‘ng BAM Media M127 muhitida hisoblandi. Barcha mikrobiologik ko‘rsatkichlar log CFU/g birligida ifodalandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-stomahera.html\"&gt;Stomacher usuli&lt;/a&gt; — bu namunani steril paketda mexanik kuraklar yordamida maydalash bo‘lib, u mahsulot ichidagi mikroorganizmlarni hujayralarga zarar yetkazmasdan ajratib olish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bioaktiv-komponentlar-tahlili\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#bioaktiv-komponentlar-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bioaktiv komponentlar tahlili&lt;/span&gt;&lt;/a&gt;Bioaktiv komponentlar tahlili&lt;/h4&gt;\n&lt;p&gt;Antioksidant faollik. Greypfrut, apelsin va limon po‘stlog‘i ekstraktining antioksidant faolligi Re va boshq. (1999) tomonidan tasvirlangan usul bo‘yicha aniqlandi. Namunalarning antioksidant faolligi ABTS testi yordamida kuchli chiziqli korrelyatsiya (r = 0,971) asosida hisoblandi va (µmol TE/g) ko‘rinishida ko‘rsatildi.&lt;/p&gt;\n&lt;p&gt;Umumiy fenolik tarkib. Umumiy fenolik tarkibni (TPC) aniqlash uchun Folin-Ciocalteu kolorimetrik usuli qo‘llanildi. Namunalarning umumiy fenolik tarkibi kuchli egri chiziq (r = 0,995) yordamida hisoblandi va natija bir gramm uchun gall kislotasi ekvivalenti (mg GAE/g) sifatida ifodalandi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Har bir sitrus po‘stlog‘i ekstrakti uchta mustaqil partiyada tayyorlandi va har bir jelatin plyonka formulasi uchta mustaqil takroriy sinovda ishlab chiqildi. Barcha fizik-kimyoviy va mikrobiologik tahlillar har bir ishlov berish uchun va har bir namuna olish oralig‘ida uch marta (n = 3) takrorlandi. Natijalar o‘rtacha qiymat ± standart og‘ish (SD) sifatida ifodalangan. Statistik tahlil IBM SPSS Statistics (IBM Corp., Armonk, NY, AQSh) yordamida amalga oshirildi. Ishlov berish o‘rtacha qiymatlari o‘rtasidagi farqlar bir faktorli dispersiya tahlili (ANOVA) va undan keyingi Tukeyning ko‘p qirrali taqqoslash testi yordamida baholandi. Statistik ahamiyatlilik p &amp;lt; 0,05 darajasida deb hisoblandi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural-f1.jpg\" alt=\"1-rasm. Sitrus mevalar poʻstlogʻi ekstrakti qoʻshilgan jelatin pardalar bilan qoplangan tovuq kotletlarining (burgerlari\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Sitrus mevalar poʻstlogʻi ekstrakti qoʻshilgan jelatin pardalar bilan qoplangan tovuq kotletlarining (burgerlarining) 147 kunlik muzlatilgan holda saqlash davomidagi mikrobiologik sifat oʻzgarishlari&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. Sitrus mevalar poʻstlogʻi ekstrakti qoʻshilgan jelatin pardalar bilan qoplangan tovuq kotletlarining (burgerlarining) 147 kunlik muzlatilgan holda saqlash davomidagi mikrobiologik sifat oʻzgarishlari: (A) umumiy psixrofil bakteriyalar, (B) umumiy aerob mezofil bakteriyalar, (C) umumiy koliform bakteriyalar, (D) umumiy sut kislotasi bakteriyalari va (E) umumiy gʻovak va achitqi zamburugʻlari soni. Qiymatlar oʻrtacha ± SD (n = 3) koʻrinishida ifodalangan. Mikrob soni log KOE/g larda berilgan. Tegishli ma'lumotlar jadvalidagi har xil harflar ishlov berish usullari va saqlash muddatlari oʻrtasidagi sezilarli farqlarni koʻrsatadi (P &amp;lt; 0,05).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Muzlatilgan&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;go‘shtning tez&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;buzilishi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ekstraktli&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;jelatin&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;plyonkasi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#
