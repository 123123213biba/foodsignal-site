            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"216\" cy=\"176\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"544\" cy=\"168\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · GELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Baliq qiyma mahsulotlarini&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qovoq kukuni bilan&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yaxshilash siri&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotlar shuni ko'rsatdiki, qilquyruq baliq (Trichiurus haumela) surimisiga 1,1% qovoq kukuni qo'shish uning sifatini sezilarli darajada oshiradi. Bu qo'shimcha oqsil tarmog'ini mustahkamlab, mahsulotning qattiqligi va namlikni ushlab turish qobiliyatini yaxshilaydi. Dozani oshirib yuborish esa teskari natija berib, tuzilishni buzadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Surimi uchun qovoq kukunining optimal miqdori 1,1% ni tashkil qiladi.&lt;/li&gt;\n&lt;li&gt;Namlikni ushlab turish qobiliyati 11,21% ga yaxshilanadi.&lt;/li&gt;\n&lt;li&gt;1,5% dan ortiq qo'shimcha tolalarning agregatsiyasiga olib keladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Qilquyruq baliq miofibrillyar oqsillari tabiiy ravishda kuchsiz gel hosil qiladi, bu esa tayyor mahsulot sifatiga salbiy ta'sir ko'rsatadi. Tajribada quritilgan qovoq kukuni (&lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;DPP&lt;/a&gt;) 0 dan 1,85% gacha bo'lgan nisbatda qo'shildi. 1,1% miqdoridagi qo'shimcha gel qattiqligini 313,69 ± 2,54 g gacha yetkazdi va namlikni saqlash qobiliyatini (&lt;a href=\"concepts/water-holding-capacity.html\"&gt;WHC&lt;/a&gt;) 11,21% ga oshirdi.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;FT-IR&lt;/a&gt; spektroskopiyasi tahlili shuni ko'rsatdiki, qovoq kukuni oqsillarning ikkilamchi strukturasini o'zgartiradi: α-spiral miqdori kamayib, tasodifiy o'ramlar (random coils) ko'payadi. Bu oqsil tarmog'ining yanada zichroq va bir jinsli bo'lishiga yordam beradi. Biroq, 1,5% dan ortiq qo'shilganda tolalarning to'planishi kuzatilib, gel strukturasi yomonlashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat qilquyruq baliq surimisi bilan cheklangan va boshqa baliq turlariga to'liq tatbiq etilmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"rasmlar\"&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html#rasmlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rasmlar&lt;/span&gt;&lt;/a&gt;Rasmlar&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-f7.jpg\" alt=\"Rasm 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr-f8.jpg\" alt=\"Rasm 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 8&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\
