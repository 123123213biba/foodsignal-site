            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"118\" cy=\"174\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"502\" cy=\"174\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Do‘kon gazaklari va yarim&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tayyor taomlar: 8,8 mln&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kishilik tahlil sanoat&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ozuqasining asoratini ochdi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni-f1.jpg\" alt=\"Oʻta qayta ishlangan oziq-ovqat mahsulotlarini isteʼmol qilish va gipertoniya, yurak-qon tomir kasalliklari, saraton, se\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Oʻta qayta ishlangan oziq-ovqat mahsulotlarini isteʼmol qilish va gipertoniya, yurak-qon tomir kasalliklari, saraton, semirish/ortiqcha vazn, metabolik sindrom/diabet hamda barcha sabablarga koʻra oʻlim xavfi oʻrtasidagi «taʼsir-samara» bogʻliqligining nochiziqli tahlili. Gipertoniya (A), yurak-qon tomir kasalliklari (B), saraton (C), semirish/ortiqcha vazn (D), metabolik sindrom/diabet (E) va barcha sabablarga koʻra oʻlim (F). HR — xavf nisbati.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Dunyo bo‘ylab 8 819 894 nafar katta yoshlini qamrab olgan 51 ta istiqbolli kohorta tadqiqotining yirik metatahlili yakunlandi. Olimlar NOVA tasnifi bo‘yicha chuqur qayta ishlangan taomlar va 2 yildan 32 yilgacha bo‘lgan davrdagi surunkali kasalliklar bog‘liqligini o‘rgandi. Bunday mahsulotlarni eng ko‘p iste’mol qilish yurak-qon tomir asoratlari xavfini 24 foizga, hazm qilish a’zolari xastaliklarini esa 31 foizga kuchaytirishi aniqlandi. Har bir ortiqcha porsiya xavfni mutanosib ravishda ko‘taradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;8,8 mln kishi ishtirokidagi metatahlil &lt;a href=\"concepts/ultra-processed-foods.html\"&gt;UPF&lt;/a&gt; iste’moli barcha sabablarga ko‘ra o‘lim xavfini 18% oshirishini tasdiqladi.&lt;/li&gt;\n&lt;li&gt;Har qo‘shimcha 100 g chuqur qayta ishlangan yegulik yurak-qon tomir muammolari xavfini 14% ga ko‘paytiradi.&lt;/li&gt;\n&lt;li&gt;Ratsiondagi UPF ulushining har 10% ga ortishi qandli diabet va metabolik sindrom ehtimolini 16% ga oshiradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Oziq-ovqat mahsulotlarini sanoatda qayta ishlash darajasini belgilovchi NOVA tasnifiga ko‘ra, ultra-qayta ishlangan mahsulotlar (UPF) tarkibida ko‘p miqdorda tuz, shakar, gidrogenlangan yog‘lar va texnologik qo‘shimchalar bo‘lgan tayyor yeguliklarni anglatadi. Tahlil doirasida yoshi 23,9 dan 77 gacha bo‘lgan 8 819 894 ishtirokchining ma’lumotlari umumlashtirildi. Ratsion oziqlanish chastotasi anketalari (FFQ) hamda sutkalik so‘rovnomalar (24-hour recalls) yordamida baholanib, ko‘rsatkichlar xatarlar nisbati (Hazard Ratio, HR) orqali hisoblandi.&lt;/p&gt;\n&lt;p&gt;UPFni eng ko‘p iste’mol qilgan guruhda eng kam yeganlarga nisbatan yurak-qon tomir hodisalari xavfi 24% ga (HR 1,24; 95% CI 1,14–1,36), metabolik sindrom va diabet xavfi 24% ga (HR 1,24; 95% CI 1,08–1,42), oshqozon-ichak xastaliklari esa 31% ga (HR 1,31; 95% CI 1,16–1,48) yuqori bo‘lib chiqdi. Shuningdek, saraton ehtimoli 12% ga, umumiy o‘lim darajasi esa 18% ga oshgan. Doza-samara tahlili har qo‘shimcha 100 g/kun UPF iste’moli gipertoniya xavfini 11% ga (HR 1,11; 95% CI 1,02–1,21), yurak xastaliklarini esa 14% ga (HR 1,14; 95% CI 1,06–1,22) oshirishini ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatuv tadqiqotlari bevosita sabab-oqibatni isbotlamaydi va ishtirokchilarning xotirasiga tayanadi. GRADE tizimi bo‘yicha dalillar ishonchliligi past yoki o‘rtacha deb baholangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ultra-qayta ishlangan oziq-ovqat mahsulotlarini (UQO) global isteʼmol qilish soʻnggi yillarda tez surʼatlar bilan oʻsmoqda. Toʻplangan dalillar UQO isteʼmolining yuqori darajasini gipertoniya, yurak-qon tomir kasalliklari, saraton va metabolik buzilishlar kabi jiddiy surunkali kasalliklar xavfining ortishi bilan bogʻlaydi. Ushbu holatlar birlamchi tibbiy yordam koʻrsatish sharoitida koʻpincha multimorbidlik (bir vaqtning oʻzida bir nechta kasallikning mavjudligi) sifatida birga uchraydi, bu esa klinik murakkablikni, tibbiy yordamga boʻlgan ehtiyojni va uzoq muddatli davolash yukini oshiradi.&lt;/p&gt;\n&lt;p&gt;Biz UQO isteʼmolining yuqori darajasi koʻplab surunkali kasalliklar xavfining ortishi bilan bogʻliqligini aniqladik, jumladan: yurak-qon tomir hodisalari (24%), semirish/ortiqcha vazn (23%), metabolik sindrom (MS)/diabet (24%), depressiya/xavotir (27%), ovqat hazm qilish tizimi kasalliklari (31%), saraton (12%) va barcha sabablarga koʻra oʻlim (18%). «Doza-taʼsir» tahlili shuni koʻrsatdiki, har bir qoʻshimcha 100 g/kun UQO isteʼmoli gipertoniya xavfini 11%, yurak-qon tomir hodisalari xavfini 14%, saraton xavfini 4% va barcha sabablarga koʻra oʻlim xavfini 3% ga oshiradi; ratsiondagi vazn/energiya ulushining har 10% ga ortishi MS/diabet xavfini 16% ga oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;UQO isteʼmolining yuqori darajasi patologiyaga qarab surunkali kasalliklar xavfining 12–31% ga oʻsishi bilan bogʻliq, bunda har 100 g/kun UQO barcha sabablarga koʻra oʻlim xavfini 3% ga oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kelajakdagi tadqiqotlar UQO isteʼmolini tasniflash va miqdorini aniqlashning yanada standartlashtirilgan va aniq usullarini ishlab chiqishi, taqqoslanadigan oʻlchov birliklari yordamida «doza-taʼsir» natijalari haqida hisobot berishi, xavf baholari aholi, ovqatlanish tartibi va kasallikning dastlabki xavfiga qarab farq qilishini oʻrganishi hamda dalillarga asoslangan ovqatlanish boʻyicha tavsiyalarni shakllantirishi kerak. Birlamchi tibbiy yordam sharoitida tibbiyot xodimlari UQO isteʼmolini kamaytirish boʻyicha maslahatlarni turmush tarzi boʻyicha odatiy maslahatlarga va multimorbidlikni boshqarishga kiritishi, bemorlarning ovqatlanish afzalliklari va ularning mavjud metabolik profiliga moslashtirilgan amaliy tavsiyalar berishi mumkin.&lt;/p&gt;\n&lt;p&gt;UQO isteʼmoli sezilarli darajada oshdi va kundalik ratsionning katta qismini tashkil etadi. Sanoat qayta ishlash darajasiga koʻra oziq-ovqat mahsulotlarini tasniflovchi keng qoʻllaniladigan NOVA tasnifiga koʻra, UQO — bu isteʼmol qilishga yoki qizdirishga tayyor boʻlgan, chuqur sanoat qayta ishlashdan oʻtgan va koʻpincha koʻplab oziq-ovqat qoʻshimchalarini oʻz ichiga olgan mahsulotlardir. Ular odatda yuqori energiya zichligiga ega, koʻp miqdorda shakar va tuz saqlaydi, lekin oziq-ovqat tolalari, oqsil, vitaminlar va minerallarga boy emas, bu ularning qulayligi, taʼmi va uzoq saqlash muddatini taʼminlaydi.&lt;/p&gt;\n&lt;p&gt;UQO isteʼmoli soʻnggi oʻn yilliklarda butun dunyoda ortib bormoqda. AQSHdagi kattalar orasida UQO 2001-yilda umumiy energiya isteʼmolining 53,5% ni tashkil etgan, 2018-yilda 57,0% gacha koʻtarilgan va 2021–2023-yillarda 53,0% darajasida qolgan. Boshqa mamlakatlarda ham shunga oʻxshash oʻsish kuzatilgan: uch oʻn yillik ichida UQO isteʼmoli Ispaniyada 11,0% dan 31,7% gacha, Meksika va Braziliyada 10% dan 23% gacha va Xitoyda 3,5% dan 10,4% gacha oʻsgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv kohort maʼlumotlariga asoslangan: toʻgʻridan-toʻgʻri sabab-oqibat bogʻliqligi emas, balki statistik bogʻliqlik oʻrnatilgan. Kuzatilgan taʼsirlar turmush tarzining aralash omillari bilan murakkablashishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Paydo boʻlayotgan dalillar shuni koʻrsatadiki, UQO ni haddan tashqari koʻp isteʼmol qilish inson salomatligiga salbiy taʼsir koʻrsatishi mumkin. Masalan, 60 298 kishi ishtirok etgan UK Biobank istiqbolli tadqiqoti shuni koʻrsatdiki, UQO ni yuqori darajada isteʼmol qilish 10,9 yil davomida kuzatuvda yurak-qon tomir kasalliklari (YQTK) va barcha sabablarga koʻra oʻlim xavfining ortishi bilan bogʻliq. UQO isteʼmoli bilan bogʻliq koʻplab sogʻliq holatlari — gipertoniya, semirish, diabet, YQTK, saraton va depressiya — koʻpincha bir xil shaxslarda birga uchraydi va birlamchi tibbiy yordamda koʻriladigan tipik multimorbidlik namunalarini hosil qiladi. Multimorbidlik sogʻliqni saqlash yukini sezilarli darajada oshiradi, hayot sifatini pasaytiradi va uzoq muddatli davolashni murakkablashtiradi. Toʻgʻridan-toʻgʻri tibbiy xarajatlar diabet bilan kechadigan gipertoniya uchun yiliga taxminan 14 300 I ni va tashxis qoʻyilganidan keyingi birinchi yilda ruhiy kasalliklar bilan kechadigan saraton uchun 85 820 I gacha baholanadi. Shuning uchun, UQO kabi parhez taʼsirlarini oʻz ichiga olgan koʻplab surunkali kasalliklarning umumiy xavf omillarini tushunish birlamchi tibbiy yordamda profilaktika strategiyalarini shakllantirish uchun zarurdir.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot Tizimli sharhlarning xalqaro istiqbolli reestrida (PROSPERO; roʻyxatdan oʻtish raqami: CRD42023421092) roʻyxatdan oʻtkazilgan va PRISMA bayonotiga muvofiq bajarilgan (onlayn qoʻshimcha jadval S1). Biz PubMed, Embase va Cochrane Library maʼlumotlar bazalarida ularning yaratilishidan 2026-yil 28-aprelgacha boʻlgan davr uchun adabiyotlarni har tomonlama qidirib topdik. Qidiruv strategiyasi MeSH atamalarini ham, erkin matndagi kalit soʻzlarni ham oʻz ichiga olgan, jumladan, «ultra-qayta ishlangan oziq-ovqat», «yurak-qon tomir kasalliklari», «gipertoniya», «diabet», «depressiya», «xavotir», «oʻlim», «semirish» va «ovqat hazm qilish tizimi kasalliklari».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-prisma.html\"&gt;PRISMA usuli&lt;/a&gt; — bu tizimli sharhlar uchun hisobot standarti boʻlib, tadqiqotlarni tanlashda shaffoflikni taʼminlaydi va maʼlumotlarni tahlil qilishda tarafkashlikni minimallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqotlar PECOS (Aholi, Taʼsir, Taqqoslash, Natija va Tadqiqot dizayni) mezonlariga muvofiq tanlab olindi: (1) Ishtirokchilar: dastlabki bosqichda aniq klinik holatlar boʻyicha cheklovlarsiz kattalar (≥18 yosh); (2) Taʼsir va komparator: UQO isteʼmolining eng yuqori va eng past toifalari oʻrtasidagi taqqoslash. UQO NOVA tasnifiga koʻra aniqlangan; (3) Natijalar: gipertoniya, yurak-qon tomir hodisalari, saraton, MS/diabet, ovqat hazm qilish tizimi kasalliklari va barcha sabablarga koʻra oʻlim kabi barcha sogʻliq natijalari, arteroskleroz va giperlipidemiya kabi subklinik kasalliklar bundan mustasno; (4) Tadqiqot dizayni: istiqbolli kohort tadqiqotlari. Quyidagi mezonlarga javob beradigan tadqiqotlar chiqarib tashlandi: (1) Protokollar, sharhlar, hayvonlardagi tadqiqotlar, «holat-nazorat», retrospektiv kohort va kesma tadqiqotlar; (2) UQO uchun aniq taʼrifga ega boʻlmagan (NOVA tasnifiga koʻra) yoki faqat UQO kichik toifalarini oʻz ichiga olgan tadqiqotlar; (3) Maʼlumotlari mavjud boʻlmagan tadqiqotlar; (4) Faqat maxsus klinik yoki yuqori xavf guruhlarida (masalan, homilador ayollar, ogʻir bemorlar yoki jigar, buyrak yoki saraton kasalliklari boʻlgan shaxslar) oʻtkazilgan tadqiqotlar.&lt;/p&gt;\n&lt;p&gt;Quyidagi maʼlumotlar uch muallif (XL, S-WL va Y-TZ) tomonidan mustaqil ravishda ajratib olindi: (1) birinchi muallif, yil, mamlakat/mintaqa; (2) tadqiqot dizayni va kuzatuv davri; (3) aholi xususiyatlari; (4) UQO isteʼmolini baholash va toifalari; (5) natijalar; (6) eng toʻliq modellardan 95% CI bilan OR (imkoniyatlar nisbati) yoki RR (nisbiy xavf) yoki HR (xavf nisbati). Tarafkashlikning potentsial xavflari ROBINS-E vositasi yordamida baholandi.&lt;/p&gt;\n&lt;p&gt;Kategoriyali tahlil uchun UQO isteʼmol darajalari (eng yuqori va eng past) DerSimonian-Laird modellari bilan OR/RR/HR va 95% CI yordamida birlashtirildi. «Doza-taʼsir» bogʻliqliklari xatolarni ishonchli baholash bilan bir bosqichli metaregressiya yordamida baholandi. Chiziqli baholar umumiy kunlik vazn/energiya isteʼmolining har 10% ga, har 100 g/kun ga va har 10 porsiya/hafta ga nisbatan xabar qilindi. Heterogenlik tau² va Cochran Q-testi (p&amp;lt;0,10) yordamida baholandi. I² statistikasi tadqiqotlar oʻrtasidagi nomuvofiqlikni tavsiflash uchun ishlatildi. Tahlil Review Manager (RevMan) 5.4 versiyasi va R 4.6.0 versiyasi yordamida amalga oshirildi. p&amp;lt;0,05 statistik jihatdan ahamiyatli deb hisoblandi.&lt;/p&gt;\n&lt;p&gt;Maʼlumotlar bazasini qidirish jarayoni onlayn qoʻshimcha rasm S1 da jamlangan. Jami 10 699 ta maqola aniqlandi. 1420 ta dublikat oʻchirilgandan soʻng 9279 ta maqola qoldi. Nomlar va annotatsiyalarni koʻrib chiqishdan soʻng 9120 ta maqola chiqarib tashlandi. Qolgan 159 ta maqolaning toʻliq matnlari mezonlarga muvofiqligi baholandi, bu 108 ta maqolaning chiqarib tashlanishiga olib keldi. Yakunda 51 ta tadqiqot kiritildi.&lt;/p&gt;\n&lt;p&gt;51 ta istiqbolli kohort tadqiqotida 8 819 894 kishi ishtirok etdi. Kuzatuv davri 2 yildan 32 yilgacha, ishtirokchilarning oʻrtacha yoshi 23,9 yoshdan 77 yoshgacha boʻldi. Tanlov hajmi 896 dan 5 468 444 kishigacha boʻldi, 46,4% ishtirokchilar erkaklar. Geografik jihatdan 16 ta tadqiqot Amerikada, 25 tasi Yevropada, sakkiztasi Osiyoda va ikkitasi Okeaniyada oʻtkazildi. Barcha tadqiqotlar past tarafkashlik xavfiga ega edi, bittasidan tashqari (oʻrtacha xavf, onlayn qoʻshimcha jadval S5).&lt;/p&gt;\n&lt;p&gt;Sakkizta kohort (118 946 ishtirokchi) UQO isteʼmoli gipertoniya xavfining yuqori boʻlishi bilan sezilarli darajada bogʻliq emasligini koʻrsatdi (eng yuqori va eng past HR 1,09, 95% CI 0,99–1,20). Biroq, «doza-taʼsir» tahlilida har bir qoʻshimcha 100 g/kun gipertoniya xavfi bilan ijobiy chiziqli bogʻliq edi (HR 1,11, 95% CI 1,02–1,21; p=0,041; Rasm 1 A). Oʻn ikkita kohort (441 175 ishtirokchi) UQO isteʼmoli yurak-qon tomir hodisalari bilan sezilarli darajada bogʻliqligini koʻrsatdi (eng yuqori va eng past HR 1,24, 95% CI 1,14–1,36). «Doza-taʼsir» tahlilida uchta taʼsir koʻrsatkichi boʻyicha ijobiy chiziqli bogʻliqliklar kuzatildi: har 100 g/kun (HR 1,14, 95% CI 1,06–1,22; p=0,002; Rasm 1 B), vazn/energiya ulushining har 10% ga ortishi (HR 1,03, 95% CI 1,02–1,04; p&amp;lt;0,001) va har 10 porsiya/hafta (HR 1,10, 95% CI 1,04–1,16; p=0,003).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni-f1.jpg\" alt=\"Oʻta qayta ishlangan oziq-ovqat mahsulotlarini isteʼmol qilish va gipertoniya, yurak-qon tomir kasalliklari, saraton, se\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Oʻta qayta ishlangan oziq-ovqat mahsulotlarini isteʼmol qilish va gipertoniya, yurak-qon tomir kasalliklari, saraton, semirish/ortiqcha vazn, metabolik sindrom/diabet hamda barcha sabablarga koʻra oʻlim xavfi oʻrtasidagi «taʼsir-samara» bogʻliqligining nochiziqli tahlili. Gipertoniya (A), yurak-qon tomir kasalliklari (B), saraton (C), semirish/ortiqcha vazn (D), metabolik sindrom/diabet (E) va barcha sabablarga koʻra oʻlim (F). HR — xavf nisbati.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Oʻn bitta kohort (1 246 153 ishtirokchi) UQO isteʼmoli saraton kasalliklari xavfining yuqori boʻlishi bilan sezilarli darajada bogʻliqligini koʻrsatdi (eng yuqori va eng past HR 1,12, 95% CI 1,04–1,21). «Doza-taʼsir» tahlilida uchta koʻrsatkich boʻyicha ijobiy bogʻliqliklar kuzatildi: har 100 g/kun (HR 1,04, 95% CI 1,02–1,06; p=0,002; Rasm 1 C), vazn/energiya ulushining har 10% ga ortishi (HR 1,01, 95% CI 1,01–1,01; p&amp;lt;0,001) va har 10 porsiya/hafta (HR 1,02, 95% CI 1,01–1,03; p&amp;lt;0,001).&lt;/p&gt;\n&lt;p&gt;Toʻrtta kohort (135 685 ishtirokchi) UQO isteʼmoli semirish/ortiqcha vazn bilan sezilarli darajada bogʻliqligini koʻrsatdi (eng yuqori va eng past HR 1,23, 95% CI 1,17–1,30). Sakkizta kohort (333 242 ishtirokchi) UQO isteʼmoli MS/diabet xavfining yuqori boʻlishi bilan sezilarli darajada bogʻliqligini koʻrsatdi (eng yuqori va eng past HR 1,24, 95% CI 1,08–1,42). «Doza-taʼsir» tahlilida har bir qoʻshimcha 100 g/kun xavf bilan ijobiy bogʻliq edi (HR 1,02, 95% CI 1,01–1,04; p=0,009; Rasm 1 E). Vazn/energiya ulushining har 10% ga ortishi MS/diabet xavfi bilan ijobiy chiziqli bogʻliq edi (HR 1,16, 95% CI 1,09–1,23; p=0,004).&lt;/p&gt;\n&lt;p&gt;Toʻrtta kohort (228 597 ishtirokchi) UQO isteʼmoli depressiya/xavotir bilan sezilarli darajada bogʻliqligini koʻrsatdi (eng yuqori va eng past HR 1,27, 95% CI 1,15–1,40). Oltita kohort (6 073 960 ishtirokchi) ovqat hazm qilish tizimi kasalliklari bilan sezilarli darajada bogʻliqligini koʻrsatdi (eng yuqori va eng past HR 1,31, 95% CI 1,16–1,48). Toʻqqizta kohort (400 000 ishtirokchi) barcha sabablarga koʻra oʻlim bilan sezilarli darajada bogʻliqligini koʻrsatdi (eng yuqori va eng past HR 1,18, 95% CI 1,10–1,26).&lt;/p&gt;\n&lt;p&gt;51 ta istiqbolli kohort (8 819 894 ishtirokchi) ishtirokidagi meta-tahlilimiz shuni koʻrsatdiki, UQO ni yuqori darajada isteʼmol qilish koʻplab surunkali kasalliklar va barcha sabablarga koʻra oʻlim xavfining ortishi bilan bogʻliq. Ushbu holatlar koʻpincha multimorbidlik klasterlarini hosil qilganligi sababli, UQO isteʼmoli umumiy xavf omili boʻlishi mumkin. Ratsionda UQO ulushini kamaytirish aholi darajasida multimorbidlik yukini yumshatishning amaliy strategiyasi boʻlishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GRADE boʻyicha dalillar sifati aksariyat natijalar (yurak-qon tomir hodisalari, saraton, MS/diabet, depressiya, ovqat hazm qilish tizimi kasalliklari, oʻlim) uchun past va gipertoniya uchun juda past deb baholandi, bu natijalarni ehtiyotkorlik bilan talqin qilish kerakligini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UQO past ozuqaviy qiymatga va yuqori energiya zichligiga ega, bu ovqatlanish tezligini oshirishi va toʻqlik signallarini kechiktirishi mumkin, bu esa ortiqcha ovqatlanishga olib keladi. Oziq-ovqat qoʻshimchalarining kombinatsiyasi «kokteyl effekti»ni yaratishi mumkin. Bundan tashqari, qayta ishlash jarayonida akrilamid (Maillard reaksiyasi natijasida) va akrolein kabi zararli birikmalar hosil boʻlishi, shuningdek, qadoqlashdan kimyoviy moddalar (masalan, bisfenol A yoki S) oʻtishi mumkin, ular YQTK xavfi bilan bogʻliq.&lt;/p&gt;\n&lt;p&gt;Dalillar shuni koʻrsatadiki, UQO ni yuqori darajada isteʼmol qilish koʻplab surunkali kasalliklar xavfining ortishi bilan bogʻliq. Ushbu bogʻliqliklar taʼsirni miqdoriy baholash usuliga qarab farq qilishi mumkin. UQO bilan bogʻliq surunkali kasalliklar koʻpincha multimorbidlik sifatida klasterlanishini hisobga olsak, UQO isteʼmolini kamaytirish va ularni minimal qayta ishlangan alternativalar bilan almashtirish kasalliklarning oldini olish va birlamchi tibbiy yordamda ularni boshqarish uchun dolzarb boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Sanoat ozuqasi&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ulushining&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;keskin o‘sishi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;8,8 mln&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kishilik 51&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kohorta&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tahlili&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yurak&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kasalligi&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;xavfi 24&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;foizga yuqori&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#
