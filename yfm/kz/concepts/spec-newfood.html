        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандық&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/spec-newfood.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/spec-newfood.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Жаңа тағам — бұл инновациялық өндіріс технологиялары арқылы алынған немесе дәстүрлі емес шикізат көздерінен тұратын азық-түлік өнімдерінің санаты. Оларға өсімдік тектес баламалар, культивацияланған ет, жәндіктер ақуызы, саңырауқұлақ мицелийі және 3D-басып шығару әдісімен жасалған өнімдер жатады. Бұл саланың мақсаты — ресурстарды пайдалану тиімділігін арттыру және дәстүрлі ауыл шаруашылығына балама іздеу.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-newfood.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Жаңа тағам — бұл алыну тәсілі немесе құрамы бойынша дәстүрлі аналогтардан ерекшеленетін тағам түрі. Тұжырымдама функционалды компоненттерді алмастыру принципіне негізделген: мысалы, жануарлардың бұлшықет тіндерінің орнына өсімдік ақуыздарын немесе жасушалық культураларды пайдалану. Бұл өнімдер шикізат көзі (өсімдіктер, саңырауқұлақтар, жасушалар) немесе өңдеу технологиясы (культивация, экструзия, аддитивті өндіріс) бойынша жіктеледі.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/spec-newfood.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Жаңа тағам өндірісі биотехнология және тағам химиясы процестеріне негізделген. Өсімдік тектес баламаларда еттің талшықты құрылымын имитациялау үшін ақуыздарды текстуралау қолданылады. Культивацияланған ет — бұл биореакторларда қоректік ортада бұлшықет жасушаларын өсіру процесі. Тағамды 3D-басып шығару — бұл тағам массасын пішін мен текстура параметрлері бойынша қабаттап қалыптастыру әдісі.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/spec-newfood.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құралдар — жасушаларды өсіруге арналған биореакторлар, өсімдік ақуыздарының текстурасын жасауға арналған экструдерлер және өнім құрылымын модельдеуге арналған 3D-принтерлер. Маңызды кезең — «Культивацияланған ет: жержаңғақ пен киноа өндірісте жануар ақуызын алмастырады» мақаласында сипатталғандай, жануар компоненттерінсіз жасушалардың өсуін қамтамасыз ететін қоректік ортаны таңдау.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/spec-newfood.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Жаңа тағам технологиялары әдеттегі рационға ұқсас өнімдерді жасау үшін қолданылады. «Неліктен біз өсімдік йогуртын таңдаймыз: дәмі ме әлде жапсырмасы ма?» мақаласында тұтынушылардың мұндай өнімдерге деген көзқарасы қарастырылады, мұнда дәмдік сапа мен құрамы туралы ақпарат арасындағы тепе-теңдік маңызды рөл атқарады.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/spec-newfood.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеулер — өндірістің жоғары құны, технологияларды масштабтау қажеттілігі және қауіпсіздікті қатаң бақылау. Шикізаттың жаңа көздері аллергенділік пен уыттылық тұрғысынан бағалануы тиіс. Жаңа процестерді енгізу кезінде микробиологиялық қауіпсіздікке байланысты тәуекелдер бар, сонымен қатар дәстүрлі тағам өндірісінің стандарттарын сақтау қажеттілігі туындайды.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Жаңа тағам&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%96%D0%B0%D2%A3%D0%B0%20%D1%82%D0%B0%D2%93%D0%B0%D0%BC%5D%20--%3E%20B%5B%D3%A8%D1%81%D1%96%D0%BC%D0%B4%D1%96%D0%BA%20%D0%B0%D0%BD%D0%B0%D0%BB%D0%BE%D0%B3%D1%82%D0%B0%D1%80%D1%8B%5D%0A%20%20A%20--%3E%20C%5B%D0%9A%D1%83%D0%BB%D1%8C%D1%82%D0%B8%D0%B2%D0%B0%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D0%BD%D2%93%D0%B0%D0%BD%20%D0%B5%D1%82%5D%0A%20%20A%20--%3E%20D%5B%D0%96%D3%99%D0%BD%D0%B4%D1%96%D0%BA%D1%82%D0%B5%D1%80%20%D0%BC%D0%B5%D0%BD%20%D1%81%D0%B0%D2%A3%D1%8B%D1%80%D0%B0%D1%83%D2%9B%D2%B1%D0%BB%D0%B0%D2%9B%D1%82%D0%B0%D1%80%5D%0A%20%20A%20--%3E%20E%5B3D-%D0%B1%D0%B0%D1%81%D1%8B%D0%BF%20%D1%88%D1%8B%D2%93%D0%B0%D1%80%D1%83%5D%0A%20%20B%20--%3E%20F%5B%D0%A2%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%D0%BB%D0%B0%D1%83%5D%0A%20%20C%20--%3E%20G%5B%D0%91%D0%B8%D0%BE%D1%80%D0%B5%D0%B0%D0%BA%D1%82%D0%BE%D1%80%5D%0A%20%20E%20--%3E%20H%5B%D0%90%D0%B4%D0%B4%D0%B8%D1%82%D0%B8%D0%B2%D1%82%D1%96%20%D3%A9%D0%BD%D0%B4%D1%96%D1%80%D1%96%D1%81%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/spec-newfood.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_based.html\"&gt;Растительные аналоги&lt;/a&gt; — Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/spec-newfood.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Азық-түлік себеті дәрінің орнын баса ала ма: ұзақ мерзімді диета тәжірибесі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Кендір мен сұлы: ферментация өсімдік ақуызының құрылымын қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Жасымық пен ноқаттағы жасырын қауіп: зең өсімдік ақуызын қалай бұзады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;Өсімдік йогурты: таңдау кезінде дәм маңызды ма әлде жапсырма ма?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html\"&gt;Жасушалық ет: жержаңғақ пен киноа жануар ақуызын алмастырады&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/spec-newfood.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AF%D0%BD%D0%B4%D0%B5%D0%BA%D1%81_%D0%95%D0%B4%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Яндекс Еда — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3201/eid0304.970403\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Emerging foodborne diseases: an evolving public health challenge&lt;/a&gt; — шолу, Emerg Infect Dis 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.brainresbull.2018.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Konzo: a distinct neurological disease associated with food (cassava) cyanogenic poisoning&lt;/a&gt; — шолу, Brain Res Bull 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/advances/nmaa025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Back to the Roots: Revisiting the Use of the Fiber-Rich Cichorium intybusL. Taproots&lt;/a&gt; — шолу, Adv Nutr 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Жаңа тағам","description":"Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.","vcsPath":"concepts/spec-newfood.md"},"headings":[{"title":"Анықтама","href":"concepts/spec-newfood.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/spec-newfood.html#sholu","level":2},{"title":"Теория","href":"concepts/spec-newfood.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/spec-newfood.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/spec-newfood.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/spec-newfood.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қауіптер","href":"concepts/spec-newfood.html#shekteuler-men-khauipter","level":2},{"title":"Байланысты ұғымдар","href":"concepts/spec-newfood.html#bajlanysty-ughymdar","level":2},{"title":"Қай жерде кездеседі","href":"concepts/spec-newfood.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts/spec-newfood.html#derekkoezder","level":2}],"title":"Жаңа тағам"},"router":{"pathname":"concepts/spec-newfood","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
