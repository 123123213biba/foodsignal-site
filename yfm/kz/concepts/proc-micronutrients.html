        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Vitamin C losses during cooking and iron fortification of flour&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-micronutrients.jpg\" alt=\"Витамины и минералы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Schekinov Alexey Victorovich, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%94%D1%80%D0%B0%D0%B6%D0%B5._%D0%A0%D0%B5%D0%B2%D0%B8%D1%82_(%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%90,_%D0%921,_%D0%922_%D0%B8_%D0%A1).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Содержание, потери при готовке, обогащение.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Витаминдер мен минералдар микронутриенттер болып табылады — бұл адам ағзасы тағам арқылы аз мөлшерде алатын маңызды химиялық қосылыстар. Олар жасушалық метаболизмге, ферментативті реакцияларды реттеуге және тіндердің құрылымдық тұтастығын сақтауға қатысады. Макронутриенттерден (ақуыздар, майлар және көмірсулар) айырмашылығы, микронутриенттер энергия көзі емес, бірақ ағзадағы барлық биохимиялық процестердің жүруін қамтамасыз етеді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Витаминдер ерігіштігіне қарай жіктелетін органикалық молекулалар: суда еритін (B тобы, C витамині) және майда еритін (A, D, E, K). Минералдар — бұл ағзада синтезделмейтін және сырттан келуі тиіс бейорганикалық элементтер (мысалы, темір, кальций, магний). Микронутриенттер метаболикалық жолдардың бөлігі болып табылады, мұнда олар ферменттерді белсендіру үшін қажетті кофакторлар ретінде қызмет етеді. Олардың тапшылығы гомеостазды бұзады және патологиялық жағдайларға әкелуі мүмкін.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Микронутриенттердің сіңу процесі олардың химиялық түріне, тағамның басқа компоненттерімен өзара әрекеттесуіне және ас қорыту жүйесінің жағдайына байланысты. Мысалы, өсімдік көздерінен алынған темірдің биожетімділігі жануар өнімдеріне қарағанда төменірек. Термиялық өңдеу C витамині сияқты ыстыққа сезімтал витаминдердің ыдырауына әкеледі. Азық-түлік өнімдерін байыту (фортификация) — бұл халық арасында тапшылықтың алдын алу үшін ұн немесе басқа өнімдердің құрамына микронутриенттер қосудың технологиялық процесі.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Микронутриенттердің мөлшерін бағалау үшін аналитикалық әдістер қолданылады: витаминдер үшін жоғары тиімді сұйықтық хроматографиясы (ЖТСХ) және минералды элементтер үшін атом-абсорбциялық спектрометрия. Клиникалық тәжірибеде қан талдаулары қолданылады. Маңызды құрал — нутрициологиялық мониторинг, ол қоректік заттарды тұтынуды адамның физиологиялық жағдайымен байланыстыруға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Микронутриенттердің рөлін түсіну тамақтану стратегияларын әзірлеу үшін қажет. «Геймификация диабеті бар жасөспірімдерге көмірсуларды санауға қалай көмектеседі» мақаласында метаболикалық тепе-теңдікті сақтау үшін рацион құрамын бақылаудың маңыздылығы қарастырылады. «Неге жалғыз емес, жұппен кешкі ас ішу денсаулық үшін пайдалырақ» материалында психоәлеуметтік факторлардың метаболизмге әсері талқыланады.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipti-tustary\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#shekteuler-men-khauipti-tustary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіпті тұстары&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіпті тұстары&lt;/h2&gt;\n&lt;p&gt;Негізгі қиындық — қоректік заттардың биожетімділігінің өзгермелілігі. Өнімдердегі витаминдер мөлшері туралы деректер көбінесе орташа болып келеді және сақтау мен пісіру кезіндегі жоғалтуларды ескермейді. Биологиялық белсенді қоспаларды бақылаусыз қабылдау кезінде артық тұтыну қаупі бар. Ғылыми консенсус теңгерімді рацион оқшауланған қоспаларға қарағанда микронутриенттердің артықшылықты көзі екенін атап көрсетеді.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Витамины и минералы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BD%D1%83%D1%82%D1%80%D0%B8%D0%B5%D0%BD%D1%82%D1%82%D0%B5%D1%80%5D%20--%3E%20B%5B%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D0%B4%D0%B5%D1%80%5D%0A%20%20A%20--%3E%20C%5B%D0%9C%D0%B8%D0%BD%D0%B5%D1%80%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%0A%20%20B%20--%3E%7C%D1%81%D1%83%D0%B4%D0%B0%20%D0%B5%D1%80%D0%B8%D1%82%D1%96%D0%BD%7C%20D%5BB%20%D0%B6%D3%99%D0%BD%D0%B5%20C%20%D1%82%D0%BE%D0%B1%D1%8B%5D%0A%20%20B%20--%3E%7C%D0%BC%D0%B0%D0%B9%D0%B4%D0%B0%20%D0%B5%D1%80%D0%B8%D1%82%D1%96%D0%BD%7C%20E%5BA%20D%20E%20K%5D%0A%20%20C%20--%3E%7C%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%D1%82%D0%B5%D1%80%7C%20F%5B%D0%A2%D0%B5%D0%BC%D1%96%D1%80%20%D0%BA%D0%B0%D0%BB%D1%8C%D1%86%D0%B8%D0%B9%20%D0%BC%D0%B0%D0%B3%D0%BD%D0%B8%D0%B9%5D%0A%20%20A%20--%3E%7C%D2%9B%D0%B0%D1%82%D1%8B%D1%81%D0%B0%D0%B4%D1%8B%7C%20G%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D0%B7%D0%BC%5D%0A%20%20G%20--%3E%7C%D2%9B%D0%B0%D0%BC%D1%82%D0%B0%D0%BC%D0%B0%D1%81%D1%8B%D0%B7%20%D0%B5%D1%82%D0%B5%D0%B4%D1%96%7C%20H%5B%D0%90%D2%93%D0%B7%D0%B0%20%D1%84%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D1%8F%D1%81%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенттер&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioactives.html\"&gt;Полифенолы и биоактивные вещества&lt;/a&gt; — Полифенолы, каротиноиды, флавоноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Бауырдың майлы ауруы: неге жаңа жағдайлар саны 30 жылда екі есе өсті&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html\"&gt;Диабеті бар жасөспірімдерге арналған цифрлық білім беру платформасы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html\"&gt;Неліктен жалғыз тамақтанғаннан көрі бірге кешкі ас ішкен денсаулыққа пайдалырақ&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-micronutrients.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%B3%D1%80%D1%83%D0%BF%D0%BF%D1%8B_B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Витамины группы B — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:%D0%94%D1%80%D0%B0%D0%B6%D0%B5._%D0%A0%D0%B5%D0%B2%D0%B8%D1%82_(%D0%92%D0%B8%D1%82%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B_%D0%90,_%D0%921,_%D0%922_%D0%B8_%D0%A1).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Schekinov Alexey Victorovich, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(12)62167-9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Frailty in elderly people&lt;/a&gt; — шолу, Lancet 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cmet.2015.12.006\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The Emerging Hallmarks of Cancer Metabolism&lt;/a&gt; — шолу, Cell Metab 2016&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/ajcn/79.5.727\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Polyphenols: food sources and bioavailability&lt;/a&gt; — шолу, Am J Clin Nutr 2004&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Содержание, потери при готовке, обогащение."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Витамины и минералы","description":"Содержание, потери при готовке, обогащение.","vcsPath":"concepts/proc-micronutrients.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-micronutrients.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-micronutrients.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-micronutrients.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/proc-micronutrients.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/proc-micronutrients.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/proc-micronutrients.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қауіпті тұстары","href":"concepts/proc-micronutrients.html#shekteuler-men-khauipti-tustary","level":2},{"title":"Байланысты ұғымдар","href":"concepts/proc-micronutrients.html#bajlanysty-ughymdar","level":2},{"title":"Қай жерде кездеседі","href":"concepts/proc-micronutrients.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts/proc-micronutrients.html#derekkoezder","level":2}],"title":"Витамины и минералы"},"router":{"pathname":"concepts/proc-micronutrients","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
