        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Метрика&lt;/strong&gt; · &lt;em&gt;peroxide value&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/peroxide-value.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Ет өнімдерінің балғындығын бағалау үшін қолданылатын майлардың тотығу дәрежесінің көрсеткіші.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/peroxide-value.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Пероксид саны (peroxide value) — майлар мен майлы өнімдердегі липидтердің бастапқы тотығу өнімдерінің мөлшерін білдіретін сапа көрсеткіші. Тамақ өнеркәсібінде бұл көрсеткіш ет өнімдерінің балғындығын және өсімдік майларының тұрақтылығын бағалау үшін негізгі құрал болып табылады. Пероксид санының жоғары болуы өнімнің дәмі, иісі және тағамдық құндылығын өзгертетін бұзылу процестерінің жүріп жатқанын көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/peroxide-value.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Липидтер (майлар) оттегі, жарық, жылу және металдардың әсерінен тотығу деградациясына ұшырайды. Бұл процесс липидтердің пероксидті тотығуы деп аталады. Реакция барысында еркін радикалдар түзіліп, олар май қышқылдарының молекулаларына шабуыл жасайды. Бұл процестің бастапқы өнімдері гидропероксидтер болып табылады. Пероксид саны дәл осылардың концентрациясын өлшейді. Уақыт өте келе гидропероксидтер альдегидтер сияқты екінші реттік өнімдерге ыдырайды, бұл өнімге ащы дәм береді.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/peroxide-value.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Майлардың тотығу процесі үш кезеңнен тұрады: инициялау, таралу және тізбектің үзілуі. Инициялау кезеңінде сыртқы факторлардың (мысалы, күн сәулесі немесе еттегі қан іздері) әсерінен еркін радикалдар түзіледі. Содан кейін олар оттегімен реакцияға түсіп, гидропероксидтерді түзеді. Пероксид саны осы қосылыстардың жиналуына қарай артады. Егер жүйеге антиоксиданттар қосылса, олар еркін радикалдарды ұстап қалып, пероксид санының өсуін баяулатады және өнімнің жарамдылық мерзімін ұзартады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/peroxide-value.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Пероксид санын анықтау үшін титрлеу әдісі қолданылады. Май үлгісі еріткіштер қоспасында ерітіледі, содан кейін гидропероксидтермен реакцияға түсетін реагент қосылады. Бөлінген йод мөлшері натрий тиосульфаты ерітіндісімен титрлеу арқылы анықталады. Нәтиже килограмм майға шаққандағы белсенді оттегінің миллиэквиваленттерімен (мэкв/кг) өрнектеледі.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/peroxide-value.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Көрсеткіш өнімдерді сақтау кезінде сапаны бақылау үшін пайдаланылады. «Ет май ішінде жарықта ойлағаннан тезірек бұзылады» мақаласында жарық пен қан іздерінің әсері альдегидтердің жиналуын тездететіні көрсетілген. «Цитрус қабығы тауық бургерлерін қалай ұзағырақ сақтауға көмектеседі» зерттеуінде тотығуды баяулату үшін сығындыларды қолдану сипатталған: грейпфрут қосылған желатин пленкасы еттің балғындығын мұздатқышта 5 айға ұзағырақ сақтауға мүмкіндік береді, бұл пероксид санының өсу жылдамдығының төмендеуімен расталады.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipti-tustary\"&gt;&lt;a href=\"concepts/peroxide-value.html#shekteuler-men-khauipti-tustary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіпті тұстары&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіпті тұстары&lt;/h2&gt;\n&lt;p&gt;Пероксид саны — бұл динамикалық көрсеткіш. Гидропероксидтер тұрақсыз болғандықтан және тез арада екінші реттік өнімдерге ыдырап кететіндіктен, төмен мән әрқашан өнім сапасының жоғарылығына кепілдік бермейді: май пероксидтердің жиналу кезеңінен өтіп, альдегидтердің жиналу кезеңіне өтіп кеткен болуы мүмкін. Өнімнің жай-күйін толық бағалау үшін пероксид санын тотығудың екінші реттік өнімдерін талдаумен бірге қолдану ұсынылады.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: перекисное число&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%82%D2%9B%D1%8B%20%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D1%80%D0%BB%D0%B0%D1%80%5D%20--%3E%7C%D0%98%D0%BD%D0%B8%D1%86%D0%B8%D1%8F%D0%BB%D0%B0%D1%83%7C%20B%5B%D0%95%D1%80%D0%BA%D1%96%D0%BD%20%D1%80%D0%B0%D0%B4%D0%B8%D0%BA%D0%B0%D0%BB%D0%B4%D0%B0%D1%80%5D%0A%20%20B%20--%3E%7C%D0%A2%D0%BE%D1%82%D1%8B%D2%93%D1%83%7C%20C%5B%D0%93%D0%B8%D0%B4%D1%80%D0%BE%D0%BF%D0%B5%D1%80%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D0%AB%D0%B4%D1%8B%D1%80%D0%B0%D1%83%7C%20D%5B%D0%90%D0%BB%D1%8C%D0%B4%D0%B5%D0%B3%D0%B8%D0%B4%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D3%A8%D0%BB%D1%88%D0%B5%D1%83%7C%20E%5B%D0%9F%D0%B5%D1%80%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%20%D1%81%D0%B0%D0%BD%D1%8B%5D%0A%20%20F%5B%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D0%BD%D1%82%D1%82%D0%B0%D1%80%5D%20--%3E%7C%D0%91%D0%B0%D1%8F%D1%83%D0%BB%D0%B0%D1%82%D1%83%7C%20C%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анықтама автоматты түрде тексерілді, редакцияның бекітуін күтуде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"anykhtamalykh\"&gt;&lt;a href=\"concepts/peroxide-value.html#anykhtamalykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтамалық&lt;/span&gt;&lt;/a&gt;Анықтамалық&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;единицы&lt;/td&gt;\n&lt;td&gt;мэкв O₂/кг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;значение для 4% грейпфрута&lt;/td&gt;\n&lt;td&gt;4,50 мэкв O₂/кг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;unit&lt;/td&gt;\n&lt;td&gt;мэкв O₂/кг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;value_max&lt;/td&gt;\n&lt;td&gt;4.5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"baskha-ataulary\"&gt;&lt;a href=\"concepts/peroxide-value.html#baskha-ataulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа атаулары&lt;/span&gt;&lt;/a&gt;Басқа атаулары&lt;/h2&gt;\n&lt;p&gt;ПЧ&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/peroxide-value.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html\"&gt;Жарықта тұрған етті май күткеннен де тез бұзылады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Цитрус қабығы тауық котлеттерін ұзақ сақтауға қалай көмектеседі&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/metrics.html\"&gt;Метрикалар&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/peroxide-value.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%B5%D1%80%D0%B5%D0%BA%D0%B8%D1%81%D0%BD%D0%BE%D0%B5_%D0%BE%D0%BA%D0%B8%D1%81%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BB%D0%B8%D0%BF%D0%B8%D0%B4%D0%BE%D0%B2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Перекисное окисление липидов — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/antiox8100429\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Comprehensive Review on Lipid Oxidation in Meat and Meat Products&lt;/a&gt; — шолу, Antioxidants (Basel) 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/plants6040042\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phytochemicals: Extraction, Isolation, and Identification of Bioactive Compounds from Plant Extracts&lt;/a&gt; — шолу, Plants (Basel) 2017&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.btre.2014.09.002\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Potential applications of ferulic acid from natural sources&lt;/a&gt; — шолу, Biotechnol Rep (Amst) 2014&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ет өнімдерінің балғындығын бағалау үшін қолданылатын майлардың тотығу дәрежесінің көрсеткіші."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"перекисное число","de
