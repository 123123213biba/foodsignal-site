        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Replacing nitrite in cured sausages with natural preservatives&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-preservatives.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-preservatives.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Консерванттар — бұл микроорганизмдер немесе химиялық процестер әсерінен азық-түліктің бұзылуын баяулататын немесе алдын алатын тағамдық қоспалар. Олардың негізгі міндеті — сақтау мерзімін ұзарту және тағам қауіпсіздігін қамтамасыз ету. Тамақ өнеркәсібінде олар функционалдық мақсатына қарай жіктеледі және ТР ТС 029/2012 сияқты қауіпсіздік стандарттарымен реттеледі.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-preservatives.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Консерванттар — бактериялардың, зең саңырауқұлақтарының және ашытқылардың тіршілік әрекетін басатын заттар. Олардың әсер ету механизмі микроорганизмдердің ортасын өзгертуге, атап айтқанда, жасуша мембраналарының тұтастығын бұзуға немесе ферментативті реакцияларды тежеуге негізделген. Майлардың тотығуын баяулататын антиоксиданттардан айырмашылығы, консерванттар биологиялық тұрақтылықты сақтауға бағытталған.&lt;/p&gt;\n&lt;h2 id=\"khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-preservatives.html#khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Консерванттың жұмыс істеу механизмі оның химиялық табиғатына байланысты. Мысалы, сорбаттар мен бензоаттар қышқыл ортада микроорганизм жасушасына еніп, оның ішкі тепе-теңдігін бұзатын молекулаларды бөледі. Ет өнімдерінде қолданылатын нитриттер патогенді бактериялардың өсуін тежейді. Қазіргі заманғы зерттеулер өсімдік сығындыларының табиғи микробқа қарсы қасиеттерін пайдалана отырып, консерванттарға табиғи баламалар іздеуге бағытталған.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-preservatives.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Консервациялау технологиялары химиялық қосылыстарды енгізуді де, pH деңгейін өзгерту сияқты физикалық әдістерді де қамтиды. Инновациялық тәсілдер көбінесе екі әдісті біріктіреді. Мысалы, грейпфрут сығындысы қосылған желатинді қабықша өнімді қорғайтын физикалық кедергі жасайды және микробқа қарсы компоненттерді бөліп шығарады.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-preservatives.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Консерванттар ет, балық және сүт өнімдерін өндіруде қолданылады. «Теңіз өнімдерінің қалдықтарын құнды тағамдық ақуызға айналдыру» мақаласында ақуыз фракцияларын тұрақтандыру үшін pH деңгейін өзгерту әдісі сипатталған. «Цитрус қабығы тауық бургерлерін қалай ұзағырақ сақтауға көмектеседі» зерттеуінде табиғи сығындылардың еттің мұздатқышта сақталу мерзімін 5 айға ұзартатыны көрсетілген.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/proc-preservatives.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Консерванттарды пайдалану халықаралық ұйымдар (JECFA/EFSA) белгілеген рұқсат етілген тәуліктік дозалармен (РТД) шектелген. Негізгі тәуекелдер дозаны дұрыс сақтамаған жағдайда микроорганизмдердің антисептиктерге төзімділігінің қалыптасуымен байланысты. Сондай-ақ, табиғи консерванттар өнімнің дәмі мен иісіне әсер етуі мүмкін екенін ескеру қажет.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Консерванты&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9A%D0%BE%D0%BD%D1%81%D0%B5%D1%80%D0%B2%D0%B0%D0%BD%D1%82%D1%8B%5D%20--%3E%20B%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%B1%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%B1%D0%B8%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D1%8C%5D%0A%20%20A%20--%3E%20C%5B%D0%A5%D0%B8%D0%BC%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%B1%D0%B8%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D1%8C%5D%0A%20%20B%20--%3E%20D%5B%D0%9F%D0%BE%D0%B4%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D0%B7%D0%BC%D0%B0%20%D0%B1%D0%B0%D0%BA%D1%82%D0%B5%D1%80%D0%B8%D0%B9%5D%0A%20%20C%20--%3E%20E%5B%D0%97%D0%B0%D0%BC%D0%B5%D0%B4%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BE%D0%BA%D0%B8%D1%81%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20F%5B%D0%9F%D1%80%D0%BE%D0%B4%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D1%81%D1%80%D0%BE%D0%BA%D0%B0%20%D1%85%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20E%20--%3E%20F%0A%20%20F%20--%3E%20G%5B%D0%91%D0%B5%D0%B7%D0%BE%D0%BF%D0%B0%D1%81%D0%BD%D0%BE%D1%81%D1%82%D1%8C%20%D0%BF%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%D0%B0%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-preservatives.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-preservatives.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html\"&gt;Теңіз өнімдерінің қалдықтарын құнды ақуызға айналдыру&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Цитрус қабығы тауық котлеттерін ұзақ сақтауға қалай көмектеседі&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-preservatives.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9A%D0%BE%D0%BD%D1%81%D0%B5%D1%80%D0%B2%D0%B0%D0%BD%D1%82%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Консерванты — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.4161/auto.19496\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Guidelines for the use and interpretation of assays for monitoring autophagy&lt;/a&gt; — шолу, Autophagy 2012&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.12.1.147\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Antiseptics and disinfectants: activity, action, and resistance&lt;/a&gt; — шолу, Clin Microbiol Rev 1999&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/978-3-7643-8340-4_6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heavy metal toxicity and the environment&lt;/a&gt; — шолу, Exp Suppl 2012&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Сорбаты, бензоаты, нитриты, натуральные консерванты."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Консерванты","description":"Сорбаты, бензоаты, нитриты, натуральные консерванты.","vcsPath":"concepts/proc-preservatives.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-preservatives.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-preservatives.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-preservatives.html#teoriya","level":2},{"title":"Қалай жұмыс істейді","href":"concepts/proc-preservatives.html#khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/proc-preservatives.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/proc-preservatives.html#khajda-kholdanylady","level":2},{"tit
