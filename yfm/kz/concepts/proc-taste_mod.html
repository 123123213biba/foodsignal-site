            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Sugar reduction in yogurt using stevia and allulose blends&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-taste_mod.jpg\" alt=\"Сахарозаменители и управление вкусом\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Sergio Calleja (Life is a trip), CC BY-SA 2.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Old_Mods_photo.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Как снизить сахар и соль без потери вкуса.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Қант алмастырғыштар — бұл тағам өнімдеріне тәтті дәм беретін және қанттың орнына қолданылатын заттар мен химиялық қосылыстар. Қантты азайту кезінде дәмді басқару процесі өнімнің құрамы өзгерген кезде оның сенсорлық профилін сақтауға бағытталған. Негізгі міндет — қанттың тәттіліктен бөлек қамтамасыз ететін көлемі, құрылымы мен ерекше дәмін өтеу.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Тәтті дәмді қабылдау тәттілендіргіш молекулаларының дәм сезу жасушаларының бетіндегі T1R2 және T1R3 рецепторларымен өзара әрекеттесуіне негізделген. Қант алмастырғыштар қарқынды тәттілендіргіштер және көлемді алмастырғыштар болып бөлінеді. Дәмді басқару синергияны ескеруді талап етеді: бірнеше заттың үйлесімі көбінесе жалпы калорияны азайта отырып, сахарозаға барынша жақын тәттілік профиліне қол жеткізуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Қантты алмастыру процесі тек дәмді ғана емес, қанттың физикалық қасиеттерін де имитациялайтын агентті таңдауды қамтиды. Қант Майяр реакциялары мен карамелденуге қатысып, түс пен хош иіске әсер етеді. Стевия сияқты қарқынды тәттілендіргіштерді қолданғанда құрылымды қалпына келтіру үшін толтырғыштар қосу қажет. Заманауи әдістер сирек қанттарды немесе табиғи тәттілендіргіштерді алу үшін микробиологиялық синтезді пайдаланады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құрал — ISO стандарттарына сәйкес сарапшылар панелі өткізетін сенсорлық талдау. Технологиялық процесс қоспаларды таңдауды қамтиды, мұнда бір компонент екіншісінің ащы дәмін бүркемелейді, ал екіншісі тәттіліктің бастапқы әсерін қамтамасыз етеді. Бактериялық ашыту өсімдік шикізатынан функционалды ингредиенттерді алуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Қантты азайту технологиялары сүт өнеркәсібінде белсенді енгізілуде. Мысалы, «Якон тамырынан маннит: тәтті тамырды пайдалы қант алмастырғышқа қалай айналдыруға болады» мақаласында бактериялардың көмегімен якон тамырынан тәттілендіргіш алу әдісі сипатталған. Сондай-ақ, йогурт өндірісінде стевия мен аллюлоза комбинациялары кеңінен қолданылады.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу — өнімнің құрылымы мен тұрақтылығының өзгеруі. Көптеген қант алмастырғыштар сахарозаға қарағанда тәттіліктің басталу уақыты мен ұзақтығы бойынша ерекшеленеді. Сондай-ақ, реттеуші шектеулер бар: қоспаларды пайдалану ТР ТС 021/2011 және 029/2012 талаптарына сәйкес келуі және JECFA/EFSA белгілеген қауіпсіздік нормаларынан (ДСП/ADI) аспауы тиіс.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Сахарозаменители и управление вкусом&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20C%5B%D0%A2%D3%99%D1%82%D1%82%D1%96%D0%BB%D0%B5%D0%BD%D0%B4%D1%96%D1%80%D0%B3%D1%96%D1%88%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%D0%BB%D1%8B%D2%9B%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D3%A8%D0%BD%D1%96%D0%BC%20%D1%80%D0%B5%D1%86%D0%B5%D0%BF%D1%82%D1%83%D1%80%D0%B0%D1%81%D1%8B%5D%0A%20%20E%20--%3E%20F%5B%D0%A2%D2%B1%D1%82%D1%8B%D0%BD%D1%83%D1%88%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html\"&gt;Якон тамырынан маннит: тәтті түйнекті пайдалы қант алмастырғышқа айналдыру&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-taste_mod.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%B0%D1%85%D0%B0%D1%80%D0%BE%D0%B7%D0%B0%D0%BC%D0%B5%D0%BD%D0%B8%D1%82%D0%B5%D0%BB%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Сахарозаменители — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Old_Mods_photo.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Sergio Calleja (Life is a trip), CC BY-SA 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s00018-006-6077-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Natural sweet macromolecules: how sweet proteins work&lt;/a&gt; — шолу, Cell Mol Life Sci 2006&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Как снизить сахар и соль без потери вкуса."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Сахарозаменители и управление вкусом","description":"Как снизить сахар и соль без потери вкуса.","vcsPath":"concepts/proc-taste_mod.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-taste_mod.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-taste_mod.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-taste_mod.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/proc-taste_mod.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/proc-taste_mod.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/proc-taste_mod.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қиындықтар","href":"concepts/proc-taste_mod.html#shekteuler-men-khiyndykhtar","level":2},{"title":"Байланысты ұғымдар","href":"concepts/proc-taste_mod.html#bajlanysty-ughymdar","level":2},{"title":"Қай жерде кездеседі","href":"concepts/proc-taste_mod.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts/proc-taste_mod.html#derekkoezder","level":2}],"title":"Сахарозаменители и управление вкусом"},"router":{"pathname":"co
