        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Plant-based burger meat analogue with pea and soy protein&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-plant_based.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-plant_based.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Өсімдік тектес аналогтар (plant-based analogues) — өсімдік шикізатынан жасалған, жануарлардан алынатын өнімдердің органолептикалық қасиеттері мен тағамдық құндылығына еліктейтін тағам өнімдері. Олардың негізінде ет, сүт немесе жұмыртқаның құрылымын, дәмі мен иісін қайталау үшін ақуыздарды, майлар мен көмірсуларды өңдеу технологиялары жатыр.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-plant_based.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Өсімдік аналогы — жануарлардан алынатын өнімдердің физика-химиялық және сенсорлық сипаттамаларына (дәмі, текстурасы, иісі) еліктейтін тағам өнімінің бір түрі. Негізгі принцип — өсімдік ақуыздарынан (изоляттардан) матрицалық құрылым жасау, ол термиялық өңдеу кезінде бұлшықет тінінің талшықтылығына немесе сүт өнімдерінің эмульсиялық тұрақтылығына еліктейді.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-plant_based.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Аналогты жасау процесі бұршақ немесе дәнді дақылдардан ақуызды бөліп алуды, оны тазартуды және кейіннен құрылымдауды қамтиды. Май фазасына еліктеу үшін өсімдік майлары қолданылады. Дәмдеуіштер мен бояғыштар өнімнің сенсорлық профиліне сәйкес келуі үшін қосылады. Құрылымның тұрақтылығы ТР ТС 029/2012 талаптарына сәйкес эмульгаторлар мен тұрақтандырғыштар арқылы қамтамасыз етіледі.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-plant_based.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі әдіс — экструзия, яғни ақуыз массасын жоғары қысым мен температурада қалыптар арқылы өткізу процесі, бұл ақуыз молекулаларының денатурациясына және талшықтарға бағытталуына әкеледі. Сондай-ақ, дәм мен иісті жақсарту және қоректік заттардың биожетімділігін арттыру үшін ашыту (ферментация) әдістері қолданылады. Сапаны бақылау HACCP қағидаттары негізінде жүзеге асырылады.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-plant_based.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Өсімдік аналогтары рациондағы дәстүрлі өнімдерге балама ретінде қолданылады. «Неліктен біз өсімдік йогуртын таңдаймыз: дәмі ме, әлде жапсырмасы ма?» мақаласында тұтынушылардың пайданы қабылдауы мен нақты дәмдік сапалар арасындағы тепе-теңдік талданады. «Жасымық пен ноқаттағы жасырын қауіп: зең өсімдік ақуызын қалай өзгертеді» материалында шикізат сапасын бақылаудың маңыздылығы атап өтіледі.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/proc-plant_based.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеулер — өсімдік шикізатындағы антинутриенттердің болуы және сақтау шарттары бұзылған кезде микотоксиндермен ластану қаупі. Сондай-ақ, өсімдік ақуыздарының жануар ақуыздарына қарағанда сіңімділігінің төмен болуы мәселесі бар. Тұтынушы аналогтардың құрамы күрделі болуы мүмкін екенін және өңдеудің жоғары деңгейі өндірістің барлық кезеңдерінде қатаң қауіпсіздік бақылауын талап ететінін ескеруі керек.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Растительные аналоги&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A0%D0%B0%D1%81%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5%20%D1%81%D1%8B%D1%80%D1%8C%D0%B5%5D%20--%3E%20B%5B%D0%92%D1%8B%D0%B4%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B1%D0%B5%D0%BB%D0%BA%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%A1%D1%82%D1%80%D1%83%D0%BA%D1%82%D1%83%D1%80%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%94%D0%BE%D0%B1%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B6%D0%B8%D1%80%D0%BE%D0%B2%5D%0A%20%20D%20--%3E%20E%5B%D0%90%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20E%20--%3E%20F%5B%D0%93%D0%BE%D1%82%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%B0%D0%BD%D0%B0%D0%BB%D0%BE%D0%B3%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-plant_based.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-newfood.html\"&gt;Жаңа тағам&lt;/a&gt; — Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-plant_based.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Азық-түлік себеті дәрінің орнын баса ала ма: ұзақ мерзімді диета тәжірибесі&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Кендір мен сұлы: ферментация өсімдік ақуызының құрылымын қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Жасымық пен ноқаттағы жасырын қауіп: зең өсімдік ақуызын қалай бұзады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html\"&gt;Өсімдік йогурты: таңдау кезінде дәм маңызды ма әлде жапсырма ма?&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-plant_based.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%80%D0%B5%D0%B4_(%D1%80%D0%B0%D1%81%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5_%D0%BC%D0%B0%D1%81%D0%BB%D0%BE)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спред (растительное масло) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature11550\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diversity, stability and resilience of the human gut microbiota&lt;/a&gt; — шолу, Nature 2012&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — шолу, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12951-018-0392-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Nano based drug delivery systems: recent developments and future prospects&lt;/a&gt; — шолу, J Nanobiotechnology 2018&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Растительные аналоги","description":"Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.","vcsPath":"concepts/proc-plant_based.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-plant_based.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-plant_based.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-plant_based.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/proc-plant_based.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/proc-plant_based.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/proc-plant_based.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қи
