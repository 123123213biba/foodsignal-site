            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Key odorants of cold brew coffee identified by GC-olfactometry and headspace analysis&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-volatiles.jpg\" alt=\"Летучие соединения и анализ аромата\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Clément Bucco-Lechat, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Bowmore_bottle.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-volatiles.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-volatiles.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Тағам өнімдерінің хош иісі адамның иіс сезу рецепторларымен әрекеттесетін ұшпа органикалық қосылыстар кешені болып табылады. Хош иісті талдау — бұл өнімнің сенсорлық профилін түсіну үшін осы молекулаларды анықтау және сандық бағалау процесі.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-volatiles.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Хош иіс — бұл ұшпа қосылыстардың жиынтығымен анықталатын тағам өнімінің сапасы. Бұл молекулалардың молекулалық массасы төмен және ұшқыштығы жоғары. Негізгі одоранттар — бұл өнімнің танымал иісіне ең үлкен үлес қосатын ұшпа қосылыстардың ішкі жиыны. Хош иісті талдау термиялық өңдеу кезінде жаңа ұшпа заттарды түзуші Майяр реакциялары мен карамелдену химиясымен тығыз байланысты.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-volatiles.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Хош иісті қабылдау процесі молекулалардың өнім бетінен булануынан басталады. Зертханада бұл процесс өнім матрицасынан ұшпа заттарды экстракциялау арқылы имитацияланады. Қосылыстарды сәйкестендіру олардың физика-химиялық қасиеттеріне негізделеді. Талдау нәтижесі химиялық құрамды сенсорлық қабылдаумен байланыстыратын хош иіс профилі болып табылады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-volatiles.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Газды хроматография-масс-спектрометрия (ГХ-МС) талдаудың негізгі әдісі болып табылады. Газды хроматография ұшпа қосылыстар қоспасын компоненттерге бөледі, ал масс-спектрометрия әр затты молекулалық салмағы бойынша анықтайды. Ольфактометрия — бұл хроматографтан шыққан газ ағынын сарапшы иіскеп, қай қосылыстардың айқын иісі бар екенін анықтайтын әдіс. Бу фазасын талдау (headspace analysis) үлгінің үстіндегі хош иістерді күрделі дайындықсыз зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-volatiles.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Хош иісті талдау әдістері сапаны бақылау және жаңа өнімдерді әзірлеу үшін қолданылады. Мысалы, «Суық вакуум немесе пеш: кептіру кезінде асшаянның дәмі мен ақуызымен не болады» зерттеуінде ұшпа қосылыстарды талдау сублимацияның өнімнің табиғи ноталарын қалай сақтайтынын, ал ыстық ауаның қуырылған иістерді тудырып, бастапқы дәмді жасыратынын түсінуге көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khiyndykhtar\"&gt;&lt;a href=\"concepts/proc-volatiles.html#shekteuler-men-khiyndykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қиындықтар&lt;/span&gt;&lt;/a&gt;Шектеулер мен қиындықтар&lt;/h2&gt;\n&lt;p&gt;Аналитикалық әдістер әрқашан адамның қабылдауын толық көрсете бермейді. Заттың концентрациясы иіс қарқындылығына әрқашан тікелей пропорционал емес. Сонымен қатар, әртүрлі қосылыстардың өзара әрекеттесуі жекелеген ноталардың қабылдауын күшейтуі немесе басуы мүмкін, бұл деректерді түсіндіруді қиындатады.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Летучие соединения и анализ аромата&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%BE%D0%B4%D1%83%D0%BA%D1%82%5D%20--%3E%20B%5B%D0%98%D1%81%D0%BF%D0%B0%D1%80%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%BE%D0%BB%D0%B5%D0%BA%D1%83%D0%BB%5D%0A%20%20B%20--%3E%20C%5B%D0%AD%D0%BA%D1%81%D1%82%D1%80%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%93%D0%B0%D0%B7%D0%BE%D0%B2%D0%B0%D1%8F%20%D1%85%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%BE%D0%B3%D1%80%D0%B0%D1%84%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20E%5B%D0%9C%D0%B0%D1%81%D1%81-%D1%81%D0%BF%D0%B5%D0%BA%D1%82%D1%80%D0%BE%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20F%5B%D0%9E%D0%BB%D1%8C%D1%84%D0%B0%D0%BA%D1%82%D0%BE%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D1%8F%5D%0A%20%20E%20--%3E%20G%5B%D0%98%D0%B4%D0%B5%D0%BD%D1%82%D0%B8%D1%84%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D1%8F%20%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%B0%5D%0A%20%20F%20--%3E%20H%5B%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%D0%BD%D0%B0%D1%8F%20%D0%BE%D1%86%D0%B5%D0%BD%D0%BA%D0%B0%5D%0A%20%20G%20--%3E%20I%5B%D0%9F%D1%80%D0%BE%D1%84%D0%B8%D0%BB%D1%8C%20%D0%B0%D1%80%D0%BE%D0%BC%D0%B0%D1%82%D0%B0%5D%0A%20%20H%20--%3E%20I%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-volatiles.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-volatiles.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Аналық немесе аталық: неге кейбір мидиялар мұздатқышта тезірек бұзылады&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Суық вакуум немесе пеш: кептіру асшаянның дәмі мен ақуызын қалай өзгертеді&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-volatiles.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BE%D0%BB%D0%BE%D0%B4%D0%BE%D0%B2%D1%8B%D0%B9_%D0%B2%D0%B8%D1%81%D0%BA%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Солодовый виски — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Bowmore_bottle.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Clément Bucco-Lechat, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1172539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extending healthy life span--from yeast to humans&lt;/a&gt; — шолу, Science 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/mp/ssp106\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phenylpropanoid biosynthesis&lt;/a&gt; — шолу, Mol Plant 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/aob/mct067\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Jasmonates: biosynthesis, perception, signal transduction and action in plant stress response, growth and development. An update to the 2007 review in Annals of Botany&lt;/a&gt; — шолу, Ann Bot 2013&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Летучие соединения и анализ аромата","description":"Что именно пахнет: ГХ-МС, ольфактометрия, кл
