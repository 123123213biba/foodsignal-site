        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандық&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/spec-ferment.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/spec-ferment.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Ашыту — ферменттердің немесе микроорганизмдердің әсерінен органикалық заттарды биохимиялық өңдеу процесі. Тамақ технологиясында бұл процесс шикізатты жаңа дәмдік, хош иісті және тағамдық қасиеттері бар өнімдерге айналдырады. Зимология — ашыту процестерін және олардың практикалық қолданылуын зерттейтін қолданбалы ғылым.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-ferment.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Ашыту — микроорганизмдер (бактериялар, ашытқылар, зең саңырауқұлақтары) оттегі жоқ ортада энергия алу үшін көмірсулар сияқты күрделі органикалық қосылыстарды ыдырататын метаболизм процесі. Негізгі нәтиже — метаболиттердің: органикалық қышқылдардың, спирттердің, газдардың және хош иісті қосылыстардың жинақталуы. Бұл процесс ішек микробиотасымен тығыз байланысты, ол иесінің энергия алмасуын реттеу үшін ашыту өнімдерін, мысалы, қысқа тізбекті май қышқылдарын пайдаланады.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/spec-ferment.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Процесс субстратты — қоректік заттарға бай ортаны дайындаудан басталады. Содан кейін жүйеге арнайы микроорганизмдер енгізіледі немесе шикізаттың өз ферменттері белсендіріледі. Реакция барысында микробтар қантты тұтынып, өнімнің pH деңгейін, текстурасын және химиялық құрамын өзгертетін тіршілік өнімдерін бөліп шығарады. Температураны, ылғалдылықты және оттегінің қолжетімділігін бақылау мәдениетте дәл қай микроорганизмдердің басым болатынын анықтайды.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/spec-ferment.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құралдар — ортаның белгіленген параметрлерін қамтамасыз ететін биореакторлар немесе ашыту ыдыстары. Үй және өнеркәсіптік жағдайда ашытқылар, коджи (зең саңырауқұлақтарының мәдениеті) және комбуча сияқты табиғи бастапқы мәдениеттер қолданылады. Заманауи әдістер нақты молекулаларды синтездеу үшін бағдарламаланған микроорганизмдерді пайдаланатын дәл ашытуды қамтиды.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/spec-ferment.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Ашыту өнімдердің кең спектрін жасау үшін қолданылады. «Шай саңырауқұлағы ашытқы орнына: комбуча нан ашытуды қалай тездетеді» мақаласында нан пісіруді тездету және нанды антиоксиданттармен байыту үшін комбучаны пайдалану сипатталған. «Алеппо қарағайының тұқымынан алынған шырын ішек тосқауылын нығайта ала ма» жұмысында ашытылған сусынның ішек жасушаларының тұтастығына әсері зерттеледі. «Қытайлық доужир сусыны тұмауға қарсы: ғылым не анықтады» зерттеуі ашытылған мунг бұршақтарының иммунитетті қолдаудағы әлеуетін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/spec-ferment.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу — қауіпсіздік хаттамалары бұзылған кезде патогендік микроорганизмдердің даму қаупі. Ашыту — стерильді процесс емес, сондықтан мәдениеттің тазалығын және орта жағдайларын бақылау бұзылудың алдын алу үшін өте маңызды. Жасушалық модельдерде немесе жануарларда жүргізілген зерттеулердің нәтижелері әрқашан тікелей адамға ауыстырылмайды, бұл денсаулыққа пайдасы туралы деректерді түсіндіруде сақтықты талап етеді.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Ашыту&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D1%83%D0%B1%D1%81%D1%82%D1%80%D0%B0%D1%82%5D%20--%3E%20B%5B%D0%9C%D0%B8%D0%BA%D1%80%D0%BE%D0%BE%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%BC%D0%B4%D0%B5%D1%80%5D%0A%20%20B%20--%3E%7C%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F%7C%20C%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B1%D0%BE%D0%BB%D0%B8%D1%82%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%20D%5B%D3%A8%D0%BD%D1%96%D0%BC%D0%BD%D1%96%D2%A3%20%D2%9B%D0%B0%D1%81%D0%B8%D0%B5%D1%82%D1%82%D0%B5%D1%80%D1%96%5D%0A%20%20D%20--%3E%20E%5B%D0%94%D3%99%D0%BC%5D%0A%20%20D%20--%3E%20F%5B%D0%A5%D0%BE%D1%88%20%D0%B8%D1%96%D1%81%5D%0A%20%20D%20--%3E%20G%5B%D0%A2%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0%5D%0A%20%20D%20--%3E%20H%5B%D0%A1%D0%B0%D2%9B%D1%82%D0%B0%D0%BB%D1%83%20%D0%BC%D0%B5%D1%80%D0%B7%D1%96%D0%BC%D1%96%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/spec-ferment.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dairy_ferm.html\"&gt;Молочная ферментация&lt;/a&gt; — Йогурт, кефир, сыры: закваски и созревание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sourdough.html\"&gt;Закваска и хлеб&lt;/a&gt; — Дикие дрожжи и молочнокислые бактерии в тесте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-veg_ferm.html\"&gt;Квашения и соленья&lt;/a&gt; — Кимчи, квашеная капуста, соленья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-beverage_ferm.html\"&gt;Ферментированные напитки&lt;/a&gt; — Пиво, вино, комбуча, квас.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-koji_precision.html\"&gt;Коджи и прецизионная ферментация&lt;/a&gt; — Aspergillus, мисо, соевый соус; белки, выращенные микробами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-probiotics.html\"&gt;Пробиотики&lt;/a&gt; — Живые культуры и их выживание в продуктах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/spec-ferment.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html\"&gt;Кешью ірімшігінің жасырын өмірі: ферменттелген өнімдерде не бар&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html\"&gt;Шай саңырауқұлағы ашытқы орнына: комбуча нан ашуын қалай жеделдетеді&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html\"&gt;Алеппо қарағайы тұқымының шырыны ішек тосқауылын нығайта ала ма&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html\"&gt;Қытайлық доужир сусыны тұмауға қарсы көмектесе ала ма?&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/spec-ferment.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — шолу, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1194/jlr.r036012\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The role of short-chain fatty acids in the interplay between diet, gut microbiota, and host energy metabolism&lt;/a&gt; — шолу, J Lipid Res 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.11.1.142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diarrheagenic Escherichia coli&lt;/a&gt; — шолу, Clin Microbiol Rev 1998&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Ашыту","description":"Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.","vcsPath":"concepts/spec-ferment.md"},"headings":[{"title":"Анықтама","href":"concepts/spec-ferment.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/spec-ferment.html#sholu
