            {"data":{"leading":false,"html":"&lt;p&gt;Жаңа шығарылым күн сайын Астана уақытымен 12:00-де шығады: редакция іріктеген ең маңызды 3–5 жаңа зерттеу. Күн бойы материалдар Telegram-да бір-бірден жарияланады.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Күні&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Мақала&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-07&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/plant-based-medically-tailored-groceries-from-a-food-pantry.html\"&gt;Азық-түлік себеті дәрінің орнын баса ала ма: ұзақ мерзімді диета тәжірибесі&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;plant_based&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-07&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html\"&gt;Балмұздақтағы гиалурон қышқылы: молекулалық салмақ текстураны қалай өзгертеді&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;emulsifiers&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-07&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/three-decade-trends-in-nonalcoholic-fatty-liver-disease-acro.html\"&gt;Бауырдың майлы ауруы: неге жаңа жағдайлар саны 30 жылда екі есе өсті&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;micronutrients&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-07&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/characterization-of-films-based-on-opuntia-ficus-indica-and.html\"&gt;Пластик орнына кактус: опунция қалдықтарынан жаңа қаптама&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;packaging&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-07&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/aloe-vera-honey-edible-coating-prolongs-shelf-life-and-prese.html\"&gt;Алоэ вера гелі кесілген мангоны бүлінуден қалай сақтайды&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;gels&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-07&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-07/reheating-induced-matrix-reorganisation-modulates-the-in-vit.html\"&gt;Крахмалды қайта қыздыру неге әрқашан ас қорытуды жеңілдетпейді&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;digestion&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html\"&gt;Кендір мен сұлы: ферментация өсімдік ақуызының құрылымын қалай өзгертеді&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;plant_based&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/nutritional-intervention-of-zinc-on-metabolic-disorders-indu.html\"&gt;Мырыш және көмірсулар: балықтардың рационын қалай дұрыстау керек&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;starch&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html\"&gt;Кешью ірімшігінің жасырын өмірі: ферменттелген өнімдерде не бар&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;dairy_ferm&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/development-of-an-olfactory-receptor-or5k1-based-biosensor-f.html\"&gt;Қуырылған өнімдердің иісі: пиразиндерді анықтайтын жаңа биосенсор&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;maillard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/safety-of-cannabidiol-isolated-from-cannabis-sativa-l-as-a-n.html\"&gt;ББҚ-дағы каннабидиол кристалдары: еуропалық реттеуші изолят қауіпсіздігін мақұлдамады&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;crystals&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/integrated-sugar-acid-phenolic-profiling-identifies-distinct.html\"&gt;Тәтті алмалар антиоксиданттық қорғаныс жағынан қышқыл сорттарға жол береді&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;antioxidants_add&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/l-theanine-prevents-autophagy-impairment-to-counteract-cadmi.html\"&gt;L-теанин және ауыр металдар: шай құрамындағы зат бауырды қалай қорғайды?&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html\"&gt;Аналық немесе аталық: неге кейбір мидиялар мұздатқышта тезірек бұзылады&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;volatiles&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-06&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-06/development-of-an-open-access-food-atlas-with-nutrient-compo.html\"&gt;Қанша жегеніңізді дәл білу: цифрлық тағам атласы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;frying&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-05&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-05/conjugation-of-coffee-phenolics-with-milk-bioactive-peptides.html\"&gt;Кофе мен алманы біріктіру: функционалды тағамдарға арналған табиғи катализатор&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;bioactives&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-05&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-05/comparative-evaluation-of-white-quinoa-and-tri-color-quinoa.html\"&gt;Асқазан жарасынан қорғаныс: неге түрлі-түсті киноа ақ дәнге қарағанда әлдеқайда пайдалы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-05&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-05/strategic-modification-of-scallop-mantle-protein-isolates-vi.html\"&gt;Теңіз өнімдерінің қалдықтарын құнды ақуызға айналдыру&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;preservatives&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-04&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-04/kombread-kombucha-as-a-functional-starter-for-sourdough-brea.html\"&gt;Шай саңырауқұлағы ашытқы орнына: комбуча нан ашуын қалай жеделдетеді&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;sourdough&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-04&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-04/chocolate-processed-by-extrusion-cooking-affects-glucose-and.html\"&gt;Қант секірісіне қарсы экструзия: шоколадты өңдеу ағзаның реакциясын қалай өзгертеді&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;extrusion&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-04&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html\"&gt;Жарықта тұрған етті май күткеннен де тез бұзылады&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;shelf_life&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-04&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-04/pediococcus-acidilacticipa53-supplementation-improves-stool.html\"&gt;Ашытқыдағы сүт қышқылы бактериясы іш қатуды жеңілдетеді: PA53 штаммының клиникалық сынағы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;fibre_microbiome&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-04&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html\"&gt;Қызанақ пен цитрустарды шіруден қорғайтын көрінбейтін хитозан қабықшасы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;shelf_life&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-04&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html\"&gt;Сұйық түтін мен наноэмульсия су-вид мидиясының сақталуын 24 күнге дейін ұзартады&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;sous_vide&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/ultra-processed-food-consumption-and-risk-of-multiple-chroni.html\"&gt;Дайын тағамдар мен тіскебасарлар: 8,8 млн адамға жасалған талдау өңделген өнімдердің салдарын көрсетті&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;shelf_life&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html\"&gt;Васаби қаптамасы неге ісінеді және оны қалай тоқтатуға болады&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;shelf_life&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html\"&gt;Суық вакуум немесе пеш: кептіру асшаянның дәмі мен ақуызын қалай өзгертеді&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;volatiles&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/impacts-of-fungal-infection-and-mycotoxin-contamination-on-n.html\"&gt;Жасымық пен ноқаттағы жасырын қауіп: зең өсімдік ақуызын қалай бұзады&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;plant_based&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/citrus-peel-extract-enriched-gelatin-edible-films-as-natural.html\"&gt;Цитрус қабығы тауық котлеттерін ұзақ сақтауға қалай көмектеседі&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;preservatives&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/effects-of-dried-pumpkin-powder-on-the-gel-properties-and-pr.html\"&gt;Балық фаршына асқабақ ұнтағын қосу: сурими текстурасын жақсарту&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;gels&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/smartcloth-odyssey-for-nutrition-education-in-type-1-diabete.html\"&gt;Диабеті бар жасөспірімдерге арналған цифрлық білім беру платформасы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;micronutrients&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/impact-of-tunisian-fermented-zgougou-and-related-lactobacill.html\"&gt;Алеппо қарағайы тұқымының шырыны ішек тосқауылын нығайта ала ма&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;probiotics&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2026-10-03&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html\"&gt;Бала мәзірін бағалау: жасанды интеллект пе, әлде диетолог па&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&g
