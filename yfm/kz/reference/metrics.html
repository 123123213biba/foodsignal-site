        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;18 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/antioxidant-potential.html\"&gt;Антиоксидантный потенциал&lt;/a&gt; — Заттың бос радикалдарды бейтараптандыру қабілетінің ABTS, DPPH және FRAP әдістерімен өлшенетін сандық көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/water-holding-capacity.html\"&gt;влагоудерживающая способность&lt;/a&gt; — Асқабақ ұнтағының оңтайлы мөлшерін қосқанда 11,21%-ға артатын гельдің ылғал ұстау қасиеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hunter-whiteness-index.html\"&gt;Индекс белизны Хантера&lt;/a&gt; — L* және b* колориметриялық индекстері негізінде есептелетін үлгінің ақтық дәрежесінің көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ulcer-index.html\"&gt;Индекс язвенных повреждений&lt;/a&gt; — Асқазанның шырышты қабығының зақымдану дәрежесін көрсететін баллмен өлшенетін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dpph-assay.html\"&gt;Метод DPPH&lt;/a&gt; — Үлгілердің антиоксиданттық белсенділігін бос радикалдарды сіңіру қабілеті арқылы бағалаудың аналитикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microbial-load.html\"&gt;Микробная нагрузка&lt;/a&gt; — Өнімдегі бактериялар санының көрсеткіші, граммға шаққандағы колония түзетін бірліктердің логарифмдік бірліктерімен өлшенеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/total-antioxidant-capacity.html\"&gt;Общая антиоксидантная способность&lt;/a&gt; — Ағзаның тотығу стрессіне қарсы тұру қабілетін көрсететін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aerobic-plate-count.html\"&gt;Общая обсемененность мезофиллами&lt;/a&gt; — Шикізаттың ластану деңгейін көрсететін және термиялық өңдеудің тиімділігін бағалау үшін қолданылатын микробиологиялық көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hazard-ratio.html\"&gt;Отношение рисков&lt;/a&gt; — Белгілі бір кезең ішінде әсер ету тобындағы оқиғаның орын алу ықтималдығының бақылау тобындағы ықтималдыққа қатынасын көрсететін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peroxide-value.html\"&gt;перекисное число&lt;/a&gt; — Ет өнімдерінің балғындығын бағалау үшін қолданылатын майлардың тотығу дәрежесінің көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;Площадь под гликемической кривой&lt;/a&gt; — Тамақтанғаннан кейін қандағы глюкоза деңгейінің базалық деңгейден ауытқуының жалпы шамасы мен ұзақтығын көрсететін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/margin-of-exposure.html\"&gt;Расчетный предел воздействия&lt;/a&gt; — Қорғасын әсерінің қаупін бағалау үшін қолданылатын химиялық қауіпсіздік көрсеткіші, мұнда 10-нан төмен мән EFSA стандарттары бойынша…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Есептеулердің дәлдік көрсеткіші, жасанды интеллект немесе сарапшылар алған мәндердің эталондық деректерден орташа ауытқуын көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gel-hardness.html\"&gt;твердость геля&lt;/a&gt; — 1,1% асқабақ ұнтағын қосқан кезде 313,69 ± 2,54 г мәніне жететін суримидің механикалық беріктік көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-stability.html\"&gt;Термостабильность&lt;/a&gt; — Ақуыз өнімінің жоғары температура әсерінен өз қасиеттерін сақтап қалу қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thiobarbituric-acid-reactive-substances.html\"&gt;тиобарбитуровое число&lt;/a&gt; — Липидтердің тотығу бұзылу қарқындылығын көрсететін малон диальдегидінің мөлшері метрикасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transepithelial-electrical-resistance.html\"&gt;Трансэпителиальное электрическое сопротивление&lt;/a&gt; — Жасушалық моноқабаттың тұтастығы мен тосқауылдық қызметінің көрсеткіші, Ом·см²-мен өлшенеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cielab-color-space.html\"&gt;Цветовые индексы CIELab&lt;/a&gt; — Өнімнің оптикалық қасиеттерін жарықтық (L*) және түс осьтері (a* және b*) параметрлері арқылы сандық бағалау жүйеси.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"18 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Метрикалар","description":"18 ұғым","vcsPath":"reference/metrics.md"},"headings":[],"title":"Метрикалар"},"router":{"pathname":"reference/metrics","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
