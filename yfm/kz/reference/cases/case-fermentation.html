            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейстер: құралдар мен әдістер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Ашыту — бұл микроорганизмдердің көмегімен өсімдік шикізатын биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа функционалдық қасиеттердің пайда болуына әкеледі.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Құрал&lt;/td&gt;\n&lt;td&gt;Микробиологическая ферментация (биохимическая переработка)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Міндет&lt;/td&gt;\n&lt;td&gt;Модификация состава сырья для получения функциональных продуктов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Деректер&lt;/td&gt;\n&lt;td&gt;Корень якона (для маннита), семена алеппской сосны (для кишечного барьера)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Нәтиже&lt;/td&gt;\n&lt;td&gt;Получение сахарозаменителей и биоактивных компонентов без химии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"mindet\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#mindet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Міндет&lt;/span&gt;&lt;/a&gt;Міндет&lt;/h2&gt;\n&lt;p&gt;Ферментация — бұл шикізаттың химиялық құрамын өзгерту үшін микроорганизмдердің немесе ферменттердің қатысуымен органикалық заттарды биологиялық өңдеу процесі. Әдістің негізгі мақсаты — өнімнің бастапқы қасиеттерін модификациялау: органолептикалық сипаттамаларды жақсарту, қоректік заттардың биожетімділігін арттыру немесе тікелей химиялық экстракция арқылы алу қиын жаңа функционалды қосылыстарды жасау.&lt;/p&gt;\n&lt;h2 id=\"khural-nemese-aedis\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#khural-nemese-aedis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрал немесе әдіс&lt;/span&gt;&lt;/a&gt;Құрал немесе әдіс&lt;/h2&gt;\n&lt;p&gt;Әдіс басқарылатын биохимиялық реакция болып табылады, онда микроорганизмдер (бактериялар, ашытқылар немесе зең саңырауқұлақтары) шикізат компоненттерін өз метаболизмі үшін субстрат ретінде пайдаланады. Микроорганизмдердің тіршілік әрекеті нәтижесінде екінші реттік метаболиттер: органикалық қышқылдар, спирттер, ферменттер және арнайы қанттар түзіледі. Процесс орта параметрлерін (температура, pH және оттегі деңгейі) бақылауды талап етеді, бұл микроорганизмдердің метаболикалық жолын қажетті мақсатты өнімге қарай бағыттауға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"khalaj-kholdandy\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#khalaj-kholdandy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай қолданды&lt;/span&gt;&lt;/a&gt;Қалай қолданды&lt;/h2&gt;\n&lt;p&gt;Якон тамырына қатысты зерттеуде ферментация маннитті (қант алмастырғыш) алу үшін қолданылды. Шикізатты көп сатылы химиялық өңдеудің орнына ғалымдар бактериялық ферментацияны қолданды. Микроорганизмдер якон тамырының табиғи қанттарын өңдеп, оларды маннитке айналдырды. Алеппо қарағайының тұқымынан алынған ферменттелген шырын ішек тосқауылы жасушаларының тұтастығына әсерін зерттеу үшін пайдаланылды.&lt;/p&gt;\n&lt;h2 id=\"naetizhe\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#naetizhe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтиже&lt;/span&gt;&lt;/a&gt;Нәтиже&lt;/h2&gt;\n&lt;p&gt;Ферментацияны қолдану күрделі химиялық процестерді айналып өтіп, яконнан маннит алуға мүмкіндік берді. Алеппо қарағайы тұқымының шырыны мысалында, ферментация ішек жасушаларының тосқауылдық қызметіне әсер етуі мүмкін сусын құрамын өзгертуге көмектесті. Әдіс агрессивті химиялық әсерсіз құрамды модификациялау тәсілі ретінде тиімділігін көрсетті.&lt;/p&gt;\n&lt;h2 id=\"shekteuler\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h2&gt;\n&lt;p&gt;Ферментация микроорганизмдердің тіршілік әрекетіне тәуелді биологиялық процесс болғандықтан, ол орта жағдайларының кез келген өзгерісіне сезімтал. Процесс нәтижесі микроорганизм штаммына, субстрат құрамына және хаттаманы сақтау дәлдігіне байланысты өзгеруі мүмкін.&lt;/p&gt;\n&lt;h2 id=\"khalaj-khajtalau-kerek\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#khalaj-khajtalau-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай қайталау керек&lt;/span&gt;&lt;/a&gt;Қалай қайталау керек&lt;/h2&gt;\n&lt;p&gt;Әдісті жүзеге асыру үшін: таза өсімдік шикізаты, микроорганизмнің арнайы штаммы (культура), стерильділікті сақтау және орта параметрлерін (термостат, pH-метр) бақылау үшін жабдықтар қажет. Процесс субстратты дайындауды, инокуляцияны (культураны енгізу), белгіленген жағдайларда инкубациялауды және мақсатты өнімді тазартуды қамтиды.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/cases/case-fermentation.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B5%D1%80%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Ферментация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — шолу, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3168/jds.s0022-0302(91)78551-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Methods for dietary fiber, neutral detergent fiber, and nonstarch polysaccharides in relation to animal nutrition&lt;/a&gt; — шолу, J Dairy Sci 1991&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41577-019-0165-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The NLRP3 inflammasome: molecular activation and regulation to therapeutics&lt;/a&gt; — шолу, Nat Rev Immunol 2019&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейстер: құралдар мен әдістер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ашыту — бұл микроорганизмдердің көмегімен өсімдік шикізатын биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа функционалдық қасиеттердің пай"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ферментация","description":"Ашыту — бұл микроорганизмдердің көмегімен өсімдік шикізатын биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа функционалдық қасиеттердің пай","vcsPath":"reference/cases/case-fermentation.md"},"headings":[{"title":"Міндет","href":"reference/cases/case-fermentation.html#mindet","level":2},{"title":"Құрал немесе әдіс","href":"reference/cases/case-fermentation.html#khural-nemese-aedis","level":2},{"title":"Қалай қолданды","href":"reference/cases/case-fermentation.html#khalaj-kholdandy","level":2},{"title":"Нәтиже","href":"reference/cases/case-fermentation.html#naetizhe","level":2},{"title":"Шектеулер","href":"reference/cases/case-fermentation.html#shekteuler","level":2},{"title":"Қалай қайталау керек","href":"reference/cases/case-fermentation.html#khalaj-khajtalau-kerek","level":2},{"title":"Дереккөздер","href":"reference/cases/case-fermentation.html#derekkoezder","level":2}],"title":"Ферментация"},"router":{"pathname":"reference/cases/case-fermentation","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_asse
