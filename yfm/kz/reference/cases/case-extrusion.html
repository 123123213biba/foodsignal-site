        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейстер: құралдар мен әдістер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Экструзия — бұл тағамдық компоненттердің құрылымын өзгерту үшін жоғары температура мен қысымда үздіксіз араластыру және илеу процесі. Технология снектер, құрғақ таңғы астар мен өсімдік ақуыздарынан текстураттар өндіруде қолданылады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/cases/case-extrusion.jpg\" alt=\"Экструзия\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Құрал&lt;/td&gt;\n&lt;td&gt;Экструдер (термомеханикалық өңдеу құрылғысы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Міндет&lt;/td&gt;\n&lt;td&gt;Сырьенің құрылымын өзгерту және сіңімділігін басқару&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Деректер&lt;/td&gt;\n&lt;td&gt;Шоколадтың гликемиялық жауабының өзгеруі, изоляттардағы микотоксиндер&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Нәтиже&lt;/td&gt;\n&lt;td&gt;Өнімнің физикалық қасиеттері мен метаболикалық әсерінің өзгеруі&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"mindet\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#mindet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Міндет&lt;/span&gt;&lt;/a&gt;Міндет&lt;/h2&gt;\n&lt;p&gt;Тамақ өнеркәсібі қоректік заттардың сіңу жылдамдығын басқаруға және өсімдік шикізатының қауіпсіздігін арттыруға ұмтылады. Негізгі міндет — қант, сүт ақуыздары немесе бұршақ дақылдары сияқты компоненттердің физика-химиялық қасиеттерін өзгерту.&lt;/p&gt;\n&lt;h2 id=\"khural-nemese-aedis\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#khural-nemese-aedis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрал немесе әдіс&lt;/span&gt;&lt;/a&gt;Құрал немесе әдіс&lt;/h2&gt;\n&lt;p&gt;Экструзия (extrusion) — шикізатты қалыптау тесігінен (фильера) өткізу арқылы үздіксіз араластыру, сығу және термиялық өңдеу процесі. Әдіс ығысу күштері мен жоғары температура әсеріне негізделген, бұл ақуыздардың денатурациясына және крахмалдың клейстерленуіне әкеледі.&lt;/p&gt;\n&lt;h2 id=\"khalaj-kholdanyldy\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#khalaj-kholdanyldy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай қолданылды&lt;/span&gt;&lt;/a&gt;Қалай қолданылды&lt;/h2&gt;\n&lt;p&gt;Шоколадтың гликемиялық жауабына өңдеудің әсерін зерттеуде экструзия қант пен сүт қоспасына қолданылды. Бұршақ дақылдарымен (жасымық, ноқат) жұмыс істегенде, экструзия өсімдік ақуыздарының күйіне әсер ететін әдіс ретінде қарастырылады, дегенмен изоляттардағы микотоксиндерді бақылау мәселесі ашық күйінде қалуда.&lt;/p&gt;\n&lt;h2 id=\"naetizhe\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#naetizhe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтиже&lt;/span&gt;&lt;/a&gt;Нәтиже&lt;/h2&gt;\n&lt;p&gt;Шоколад құрамындағы қант пен сүтке экструзияны қолдану басқа әдістермен өңделген өнімдерге қарағанда гликемиялық жауаптың өзгеруіне әкелді. Бұршақ дақылдары жағдайында экструзия ақуыз құрылымын өзгертеді, бірақ шикізаттағы зеңнен пайда болған микотоксиндер изоляттарда сақталуы мүмкін.&lt;/p&gt;\n&lt;h2 id=\"shekteuler\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h2&gt;\n&lt;p&gt;Экструзия шикізатты микотоксиндер сияқты биологиялық ластанулардан тазартудың әмбебап әдісі емес. Процестің тиімділігі қысым, температура және ылғалдылық параметрлеріне байланысты.&lt;/p&gt;\n&lt;h2 id=\"khalaj-khajtalau-kerek\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#khalaj-khajtalau-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай қайталау керек&lt;/span&gt;&lt;/a&gt;Қалай қайталау керек&lt;/h2&gt;\n&lt;p&gt;Процесті жүзеге асыру үшін температура мен қысымды бақылайтын экструдер қажет. Шикізат құрамын стандарттау және фильерадан өту параметрлерін тіркеу талап етіледі.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/cases/case-extrusion.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Extrusion\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Extrusion — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:S%C3%A8vres_-_Moulin_-_boudineuse-d%C3%A9sa%C3%A9reuse_027.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Coyau, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — шолу, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/bjc.1972.33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a basic biological phenomenon with wide-ranging implications in tissue kinetics&lt;/a&gt; — шолу, Br J Cancer 1972&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrm2330\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Membrane lipids: where they are and how they behave&lt;/a&gt; — шолу, Nat Rev Mol Cell Biol 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейстер: құралдар мен әдістер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Экструзия — бұл тағамдық компоненттердің құрылымын өзгерту үшін жоғары температура мен қысымда үздіксіз араластыру және илеу процесі. Технология снектер, құрғақ"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Экструзия","description":"Экструзия — бұл тағамдық компоненттердің құрылымын өзгерту үшін жоғары температура мен қысымда үздіксіз араластыру және илеу процесі. Технология снектер, құрғақ","vcsPath":"reference/cases/case-extrusion.md"},"headings":[{"title":"Міндет","href":"reference/cases/case-extrusion.html#mindet","level":2},{"title":"Құрал немесе әдіс","href":"reference/cases/case-extrusion.html#khural-nemese-aedis","level":2},{"title":"Қалай қолданылды","href":"reference/cases/case-extrusion.html#khalaj-kholdanyldy","level":2},{"title":"Нәтиже","href":"reference/cases/case-extrusion.html#naetizhe","level":2},{"title":"Шектеулер","href":"reference/cases/case-extrusion.html#shekteuler","level":2},{"title":"Қалай қайталау керек","href":"reference/cases/case-extrusion.html#khalaj-khajtalau-kerek","level":2},{"title":"Дереккөздер","href":"reference/cases/case-extrusion.html#derekkoezder","level":2}],"title":"Экструзия"},"router":{"pathname":"reference/cases/case-extrusion","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
