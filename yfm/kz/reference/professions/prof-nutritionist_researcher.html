        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;изучает, как еда влияет на обмен веществ и микробиом&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-nutritionist_researcher.jpg\" alt=\"Нутрициолог-исследователь\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;изучает, как еда влияет на обмен веществ и микробиом&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;биохимия питания, клинические исследования&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Білім&lt;/td&gt;\n&lt;td&gt;Академическая подготовка в области нутрициологии, диетологии или биохимии.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қайда жұмыс істейді&lt;/td&gt;\n&lt;td&gt;НИИ, R&amp;amp;D-отделы пищевых корпораций, государственные органы здравоохранения.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенттер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nemen-ajnalysady\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#nemen-ajnalysady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Немен айналысады&lt;/span&gt;&lt;/a&gt;Немен айналысады&lt;/h2&gt;\n&lt;p&gt;Нутрициолог-зерттеуші — бұл клиникалық деректер мен биохимия негізінде қоректік заттардың адам метаболизмі мен микробиомына әсерін зерттейтін маман. Патология кезінде емдік тамақтанумен жұмыс істейтін диетологтан айырмашылығы, нутрициолог-зерттеуші қоректік заттардың сіңу механизмдеріне, тағам матрицаларының денсаулыққа әсеріне және салауатты тамақтану стратегияларын әзірлеуге назар аударады.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Маман тағам компоненттерінің ағзаға әсерін талдайды. Өнеркәсіпте бұл сарысу ақуызының ыдырауын баяулату немесе функционалды өнімдер жасау үшін табиғи катализаторларды қолдану болуы мүмкін. Клиникалық тәжірибеде нутрициолог-зерттеуші Pediococcus acidilactici PA53 штаммының қабыну маркерлеріне әсері сияқты араласулардың тиімділігін бағалайды. Сондай-ақ, диабетпен ауыратын науқастарды оқыту әдістерін әзірлеу және бірге тамақтанудың көмірсулар алмасуына әсері сияқты әлеуметтік факторларды талдау міндеттерге кіреді.&lt;/p&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Жұмыс үшін тамақтану биохимиясы, микробиология және клиникалық зерттеу әдістері бойынша білім қажет. Құралдар жиынтығына мета-талдаулар мен жүйелі шолуларды өңдеуге арналған статистикалық пакеттер кіреді. Маңызды дағды — дене құрамын бағалау әдістерін білу және өнімдердің қоректік құрамы туралы деректерді түсіндіру.&lt;/p&gt;\n&lt;h2 id=\"khajda-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#khajda-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу керек&lt;/h2&gt;\n&lt;p&gt;Базалық білім нутрициология, диетология немесе биохимия саласындағы академиялық дайындықты қамтиды. Кәсіби жол жүйелі шолулар мен мета-талдауларды зерттеуді және клиникалық зерттеулерге қатысуды көздейді.&lt;/p&gt;\n&lt;h2 id=\"khajda-zhumys-isteu-zhaene-khalaj-oesu\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#khajda-zhumys-isteu-zhaene-khalaj-oesu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда жұмыс істеу және қалай өсу&lt;/span&gt;&lt;/a&gt;Қайда жұмыс істеу және қалай өсу&lt;/h2&gt;\n&lt;p&gt;Нутрициолог-зерттеушілер ғылыми-зерттеу институттарында, тамақ корпорацияларының R&amp;amp;D бөлімдерінде, денсаулық сақтау мемлекеттік органдарында және білім беру орталықтарында жұмыс істейді. Мансаптық өсу зерттеу нәтижелерін ғылыми журналдарда жариялаумен және функционалды тамақ өнімдерін жасау жобаларына жетекшілік етумен байланысты.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-nutritionist_researcher.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D1%83%D1%82%D1%80%D0%B8%D1%86%D0%B8%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нутрициология — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Nutrition_label.gif\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Wikimedia Commons, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pone.0251142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Assessment of body composition in spinal cord injury: A scoping review&lt;/a&gt; — шолу, PLoS One 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12884-025-07185-z\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effective dietary interventions during pregnancy: a systematic review and meta-analysis of behavior change techniques to promote healthy eating&lt;/a&gt; — шолу, BMC Pregnancy Childbirth 2025&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/nu13114161\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Trends in the Number of Behavioural Theory-Based Healthy Eating Interventions Inclusive of Dietitians/Nutritionists in 2000-2020&lt;/a&gt; — шолу, Nutrients 2021&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"изучает, как еда влияет на обмен веществ и микробиом"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Нутрициолог-исследователь","description":"изучает, как еда влияет на обмен веществ и микробиом","vcsPath":"reference/professions/prof-nutritionist_researcher.md"},"headings":[{"title":"Немен айналысады","href":"reference/professions/prof-nutritionist_researcher.html#nemen-ajnalysady","level":2},{"title":"Типтік міндеттер","href":"reference/professions/prof-nutritionist_researcher.html#tiptik-mindetter","level":2},{"title":"Дағдылар мен құралдар","href":"reference/professions/prof-nutritionist_researcher.html#daghdylar-men-khuraldar","level":2},{"title":"Қайда оқу керек","href":"reference/professions/prof-nutritionist_researcher.html#khajda-okhu-kerek","level":2},{"title":"Қайда жұмыс істеу және қалай өсу","href":"reference/professions/prof-nutritionist_researcher.html#khajda-zhumys-isteu-zhaene-khalaj-oesu","level":2},{"title":"Дереккөздер","href":"reference/professions/prof-nutritionist_researcher.html#derekkoezder","level":2}],"title":"Нутрициолог-исследователь"},"router":{"pathname":"reference/professions/prof-nutritionist_researcher","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
