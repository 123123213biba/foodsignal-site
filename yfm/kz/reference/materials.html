            {"data":{"leading":false,"html":"&lt;p&gt;11 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/extracellular-matrix.html\"&gt;Внеклеточный матрикс&lt;/a&gt; — Жасушалардың бетке бекінуі мен бөлінуі үшін қажетті ақуыздардан тұратын құрылымдық негіз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html\"&gt;гидрогель CTS-ZnO&amp;amp;CA&lt;/a&gt; — Жемістерді бұзылудан қорғауға арналған бактерияға қарсы және антиоксиданттық қасиеттері бар хитозан, мырыш оксидінің нанобөлшектері және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/douzhier.html\"&gt;Доужир&lt;/a&gt; — Маштан жасалатын дәстүрлі қытай ашытылған өнімі, крахмал сүтінің өздігінен ашуы арқылы алынады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oilseed-cake.html\"&gt;Жмых&lt;/a&gt; — Майлы дақылдардың тұқымынан майды сығып алғаннан кейін қалатын қатты қалдық.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shrimp-meat-floss.html\"&gt;креветочный флосс&lt;/a&gt; — Дәмдеу, кептіру және ұсақтау арқылы пісірілген асшаян етінен алынған сусыздандырылған талшықты өнім.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scallop-mantle.html\"&gt;Мантия гребешка&lt;/a&gt; — Теңіз өнімдерін қайта өңдеудің қосымша өнімі, тағамдық ақуыз алу үшін шикізат ретінде пайдаланылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensor-matrix.html\"&gt;Матрица сенсора&lt;/a&gt; — Өткізгіштік пен тұрақтылықты қамтамасыз ететін алтын нанобөлшектерінен, металл-органикалық қаңқалардан, көміртекті нанотүтікшелерден және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nanoemulsion.html\"&gt;наноэмульсия&lt;/a&gt; — Өнімдердегі микробқа қарсы белсенділікті арттыру және биоактивті компоненттерді тарату үшін қолданылатын, тамшылары нанометрлік өлшемдегі…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plant-based-yogurt-alternative.html\"&gt;Растительный аналог йогурта&lt;/a&gt; — Сүт йогуртын алмастыруға арналған өсімдік негізіндегі ашытылған тағамдық өнім.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/surimi.html\"&gt;сурими&lt;/a&gt; — Өсімдік ұнтағын қосу арқылы құрылымы мен гелінің ақуыз торы нығайтылатын балық тартылған еті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/edible-packaging.html\"&gt;Съедобная упаковка&lt;/a&gt; — Жемілі қаптама — бұл өнімдердегі ылғал жоғалуын азайтуға және микроорганизмдердің өсуін тежеуге арналған, тағамдық компоненттерден жасалған…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"11 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Материалдар","description":"11 ұғым","vcsPath":"reference/materials.md"},"headings":[],"title":"Материалдар"},"router":{"pathname":"reference/materials","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
