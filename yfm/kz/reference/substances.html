        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;44 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/5-caffeoylquinic-acid.html\"&gt;5-кофеилхинная кислота&lt;/a&gt; — Кофе дәндерінің негізгі фенолды компоненті, о-хинондарға тотыққаннан кейін белоктармен байланысуға қабілетті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgd-motifs.html\"&gt;RGD-мотивы&lt;/a&gt; — Жасуша бетіндегі интегриндермен өзара әрекеттесетін және олардың матрицаға бекітілуін қамтамасыз ететін арнайы аминқышқылдар тізбегі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sodium-alginate.html\"&gt;Альгинат натрия&lt;/a&gt; — Жеміс бетінде қорғаныш биологиялық ыдырайтын қабықша жасау үшін негіз ретінде қолданылатын табиғи полисахарид.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aflatoxin-b1.html\"&gt;Афлатоксин B1&lt;/a&gt; — Саңырауқұлақтардың қауіпті екінші реттік метаболиті, IARC бойынша 1-топтағы канцероген ретінде жіктелген.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;бета-глицерофосфат&lt;/a&gt; — Белсенді компоненттері біркелкі таралған кеуекті гидрогельді қабықшаны қалыптастыру үшін 50%-дық ерітінді түрінде қолданылатын тігуші агент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biozate1.html\"&gt;БиоЗейт1&lt;/a&gt; — Кофе фенолдарымен байланысу үшін субстрат ретінде қолданылатын сүт пептиді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hemoglobin.html\"&gt;Гемоглобин&lt;/a&gt; — Қан құрамындағы темір ұстайтын ақуыз, ол жарық әсерінен липидтердің тотығуын тездететін катализатор қызметін атқарады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyaluronic-acid.html\"&gt;Гиалуроновая кислота&lt;/a&gt; — Тұқым қабығының құрылымына еліктеу үшін нанобөлшектердің сыртқы қорғаныш қабаты ретінде қолданылатын сахарид.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gelatin.html\"&gt;желатин&lt;/a&gt; — Гель түзу қабілеті, тұтқырлықты бақылау және беттік белсенділігі арқасында пленкалар жасау үшін тамақ өнеркәсібінде қолданылатын ақуызды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sea-bass-skin-gelatin.html\"&gt;Желатин из кожи сибаса&lt;/a&gt; — Еуропалық теңіз алабұғасының терісін өңдеу қалдықтарынан алынған, жеуге жарамды қаптама үшін негіз ретінде қолданылатын жоғары ақуызды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/liquid-smoke.html\"&gt;жидкий дым&lt;/a&gt; — Биомасса пиролизі арқылы алынатын және бактерияға қарсы әрі антиоксиданттық белсенділігі бар карбонилдер мен фенолдарды қамтитын тағамдық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/isothiocyanates.html\"&gt;изотиоцианаты&lt;/a&gt; — Глюкозинолаттардың ферменттік гидролизі нәтижесінде түзілетін және васаби соусына өзіне тән хош иіс пен ащылық беретін химиялық қосылыстар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cannabidiol.html\"&gt;Каннабидиол&lt;/a&gt; — Биологиялық белсенді қоспалардың белсенді компоненті ретінде қолданылатын, Cannabis sativa L. биомассасынан алынатын липофильді кристалды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha.html\"&gt;Комбуча&lt;/a&gt; — Тәтті шайдан дайындалатын, бактериялар мен ашытқы саңырауқұлақтарының симбиотикалық қауымдастығының әрекеті нәтижесінде алынатын қышқылтым…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/short-chain-fatty-acids.html\"&gt;Короткоцепочечные жирные кислоты&lt;/a&gt; — Иммундық жауапты модуляциялауға қатысатын ішек микробиотасының тіршілік әрекеті нәтижесінде түзілетін метаболиттер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malondialdehyde.html\"&gt;Малоновый диальдегид&lt;/a&gt; — Липидтердің терең тотығуы нәтижесінде түзілген улы өнім, майлы өнімдердің бұзылу көрсеткіші ретінде қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mannitol.html\"&gt;Маннит&lt;/a&gt; — Төмен калориялы және гликемиялық индексі төмен қант алмастырғыш ретінде қолданылатын алты атомды спирт.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mycotoxins.html\"&gt;Микотоксины&lt;/a&gt; — Зиянды саңырауқұлақтар бөліп шығаратын улы екінші реттік метаболиттер, олар шикізаттың тағамдық құндылығын төмендетеді және денсаулыққа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mobile-genetic-elements.html\"&gt;Мобильные генетические элементы&lt;/a&gt; — Геном ішінде қозғалуға немесе бактериялық жасушалар арасында тасымалдануға қабілетті, соның ішінде төзімділік гендерін қамтитын ДНҚ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/motilin.html\"&gt;мотилин&lt;/a&gt; — Перистальтиканы ынталандыратын және асқазан-ішек жолдарының моторикасын реттейтін гормон.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc-oxide-nanoparticles.html\"&gt;наночастицы оксида цинка&lt;/a&gt; — Бактерия мембраналары мен биоқабықшаларды бұзу үшін оттегінің белсенді түрлерін түзетін және мырыш иондарын бөлетін, 260 °C-та термиялық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-steroidal-anti-inflammatory-drugs.html\"&gt;Нестероидные противовоспалительные препараты&lt;/a&gt; — Циклооксигеназа ферменттерін тежеу арқылы асқазанның зақымдануын тудыратын дәрілік заттар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/olfactory-receptor-or5k1.html\"&gt;Обонятельный рецептор OR5K1&lt;/a&gt; — Биосенсорда пиразин молекулаларын арнайы анықтау үшін қолданылатын ақуыз құрылымы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/residual-organic-solvents.html\"&gt;Остаточные органические растворители&lt;/a&gt; — Кристалдану процесінде қолданылатын химиялық қосылыстар, олардың іздері соңғы өнімде қалады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gpaef-peptide.html\"&gt;Пептид GPAEF&lt;/a&gt; — Асқазанда рекомбинантты коллагеннің ыдырауы нәтижесінде түзілетін және ДНҚ G-квадруплекстерімен өзара әрекеттесу арқылы простагландиндер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pyrazines.html\"&gt;Пиразины&lt;/a&gt; — Қуырылған, жаңғақ және нан иістерін қалыптастыратын гетероциклді органикалық қосылыстар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenols.html\"&gt;Полифенолы&lt;/a&gt; — Жемістің бос радикалдарды бейтараптандыру қабілетін қамтамасыз ететін алма құрамындағы химиялық қосылыстар тобы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenol-oxidase.html\"&gt;Полифенолоксидаза&lt;/a&gt; — Фенолды қосылыстардың тотығуын катализдейтін және белоктарды жұмсақ жағдайда модификациялау үшін қолданылатын фермент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;порошок сушеной тыквы&lt;/a&gt; — Ақуыздардың екіншілік құрылымын өзгертіп, 1,1% мөлшерінде сурими гель торын нығайтатын көкөніс қоспасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recombinant-human-type-iii-collagen.html\"&gt;Рекомбинантный человеческий коллаген III типа&lt;/a&gt; — Асқазанның шырышты қабығын қорғау үшін биоматериал ретінде қолданылатын биотехнологиялық жолмен алынған жасушадан тыс матрица ақуызы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/somatostatin.html\"&gt;соматостатин&lt;/a&gt; — Ішектің моторлық белсенділігін тежейтін сарысулық реттегіш фактор.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/potassium-sorbate.html\"&gt;сорбат калия&lt;/a&gt; — Васаби соусындағы газ түзетін бактериялардың өсуін тежеу үшін қолданылатын тағамдық консервант.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wasabi-sauce.html\"&gt;соус васаби&lt;/a&gt; — Негізінен ақжелкек тамырынан (Armoracia rusticana) дайындалатын, изотиоцианаттар есебінен ащы дәмі мен микробқа қарсы қасиеттері бар…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whey-protein-isolate.html\"&gt;Сывороточный изолят&lt;/a&gt; — Сарысу изоляты — сүт сарысуы ақуызының жоғары тазартылған түрі, құрамында маңызды аминқышқылдары бар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tricolor-quinoa.html\"&gt;Трехцветное киноа&lt;/a&gt; — Асқазанның шырышты қабығын қорғау үшін рационға қосылатын ақ, қызыл және қара киноа дәндерінің қоспасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fructooligosaccharides.html\"&gt;Фруктоолигосахариды&lt;/a&gt; — Маннитті ашыту арқылы алу үшін шикізат ретінде қызмет ететін, якон тамырында болатын көмірсутекті қосылыстар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chitosan.html\"&gt;Хитозан&lt;/a&gt; — Альгинатпен және пектинмен әрекеттескенде қорғаныш үлдірінің құрылымын тығыздайтын катионды полисахарид.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chlorogenic-acid.html\"&gt;хлорогеновая кислота&lt;/a&gt; — Жеміс бетіндегі бос радикалдарды бейтараптандыру және микробқа қарсы әсерді ұзарту мақсатында мырышты хелаттау үшін гидрогель құрамына…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc.html\"&gt;Цинк&lt;/a&gt; — Көмірсулар алмасуын реттейтін және крахмал мөлшері көп болғанда гликолиз ферменттерінің белсенділігін қалпына келтіретін микроэлемент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eugenol.html\"&gt;Эвгенол&lt;/a&gt; — Қабықшаның антиоксиданттық белсенділігін қамтамасыз ететін қалампыр эфир майының құрамдас бөлігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html\"&gt;экстракт кожуры грейпфрута&lt;/a&gt; — Бактериялар мен майлардың тотығуын тежеу үшін белсенді табиғи консервант ретінде қолданылатын фенолды қосылыстар мен антиоксиданттарға бай…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/broccoli-sprout-extract.html\"&gt;Экстракт ростков брокколи&lt;/a&gt; — Брокколи өскіндерінен алынған биологиялық белсенді қоспа, ағзаның қорғаныс механизмдерін белсендіру үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thyme-essential-oil.html\"&gt;Эфирное масло тимьяна&lt;/a&gt; — Еттегі бактериялардың өсуін тежеу және ақуыздар мен липидтердің тотығуын баяулату үшін пленка құрамына қосылатын табиғи қосылыс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malic-acid.html\"&gt;Яблочная кислота&lt;/a&gt; — Алма жұмсағындағы қышқыл дәмнің басым компоненті болып табылатын органикалық қышқыл.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"44 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Заттар","description":"44 ұғым","vcsPath":"reference/substances.md"},"headings":[],"title":"Заттар"},"router":{"pathname":"reference/substances","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
        </script>
