            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Пищевая химия и сенсорный анализ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;Классификация летучих соединений и реакция Майяра&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Газовая хроматография, масс-спектрометрия, сенсорная панель&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Circulation, Nature Medicine, Clinical Microbiology Reviews&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"ne-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#ne-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не зерттейді&lt;/span&gt;&lt;/a&gt;Не зерттейді&lt;/h2&gt;\n&lt;p&gt;Дәм мен хош иіс — бұл ұшпа қосылыстардың химиялық табиғатын және олардың ағзаның сезімтал рецепторларымен өзара әрекеттесуін зерттейтін ғылыми бағыт. Сала заттардың молекулалық құрылымы тағам өнімдерінің органолептикалық қасиеттерін қалай қалыптастыратынын және сублимация немесе ашыту сияқты сыртқы процестердің бұл профильді қалай өзгертетінін зерттейді.&lt;/p&gt;\n&lt;h2 id=\"tarih-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#tarih-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарих және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарих және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Хош иістерді зерттеу тағам өнімдеріндегі ұшпа қосылыстарды жіктеуден басталды. Майяр реакцияларының рөлін түсіну маңызды кезең болды, бұл термиялық өңдеу кезінде қуырылған ноталардың пайда болуын түсіндіреді. Соңғы онжылдықтарда назар қоспаларды алудың биотехнологиялық әдістеріне, мысалы, бактериялардың көмегімен якон тамырын маннитке айналдыруға ауысты.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Екі негізгі тәсіл бар: аналитикалық және функционалдық. Аналитикалық тәсіл ерекше ноталарға жауап беретін молекулаларды анықтауға бағытталған. Функционалдық тәсіл өңдеу технологияларының қоректік заттарды сақтауға әсерін зерттейді. Зерттеулер көрсеткендей, сублимация өнімнің бастапқы профилін сақтайды, ал ыстық кептіру жаңа хош иісті қосылыстарды тудырады.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Талдау үшін газ хроматографиясы мен масс-спектрометрия әдістері қолданылады. Сенсорлық талдау халықаралық стандарттарға сәйкес дәмнің қарқындылығы мен сапасын бағалайтын арнайы дайындалған дегустаторлар панелінің қатысуымен өткізіледі. Биотехнологияда өсімдік шикізатының дәмдік сипаттамаларын модификациялау үшін бақыланатын ашыту әдістері қолданылады.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Бағыт тағам химиясымен және қабылдау физиологиясымен тығыз байланысты. Ол Майяр реакцияларымен, ұшпа қосылыстарды талдаумен және қант алмастырғыштарды әзірлеумен қиылысады. Дәм механизмдерін түсіну диетология үшін маңызды, өйткені өнімдердің құрамы метаболикалық процестерге тікелей әсер етеді.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Пәнді терең түсіну үшін тағам химиясы, биотехнология және сенсорлық талдау бағдарламаларын оқу ұсынылады. Негізгі білімді микробиология және нутрициология бойынша академиялық шолулардан, сондай-ақ хош иісті қосылыстар химиясы мен тағам қауіпсіздігіне арналған арнайы басылымдардан алуға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-flavor.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B0%D1%81%D0%BC%D0%B0%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Басмати — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/cir.0000000000001123\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Heart Disease and Stroke Statistics-2023 Update: A Report From the American Heart Association&lt;/a&gt; — шолу, Circulation 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41591-019-0675-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Chronic inflammation in the etiology of disease across the life span&lt;/a&gt; — шолу, Nat Med 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1128/cmr.12.4.564\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Plant products as antimicrobial agents&lt;/a&gt; — шолу, Clin Microbiol Rev 1999&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Дәм мен хош иіс","description":"Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.","vcsPath":"reference/disciplines/dir-flavor.md"},"headings":[{"title":"Не зерттейді","href":"reference/disciplines/dir-flavor.html#ne-zerttejdi","level":2},{"title":"Тарих және негізгі жаңалықтар","href":"reference/disciplines/dir-flavor.html#tarih-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-flavor.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-flavor.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-flavor.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қай жерде оқу және не оқу керек","href":"reference/disciplines/dir-flavor.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-flavor.html#derekkoezder","level":2}],"title":"Дәм мен хош иіс"},"router":{"pathname":"reference/disciplines/dir-flavor","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favi
