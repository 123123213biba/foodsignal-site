            {"data":{"leading":false,"html":"&lt;p&gt;228 ұғым&lt;/p&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt; — Химия вкуса и запаха: откуда берутся ароматы, как рецепторы их считывают и как вкусом управляют.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/test-s-trubkami-darema.html\"&gt;Дарем түтікшелері тесті&lt;/a&gt; — Микробиологияда газ түзетін бактерияларды анықтау үшін қолданылатын зертханалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/twin-screw-extruder.html\"&gt;Двухшнековый экструдер&lt;/a&gt; — Тағамдық шикізатты термомеханикалық өңдеуге арналған, қысым мен температураның белгіленген параметрлерін қамтамасыз ететін аспап.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/douzhier.html\"&gt;Доужир&lt;/a&gt; — Маштан жасалатын дәстүрлі қытай ашытылған өнімі, крахмал сүтінің өздігінен ашуы арқылы алынады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-maillard.html\"&gt;Реакция Майяра и карамелизация&lt;/a&gt; — Бурые корочки, жареные и карамельные ноты: сахара + аминокислоты при нагреве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-rheology.html\"&gt;Реология и текстура&lt;/a&gt; — Вязкость, упругость, текстурный анализ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-plant_based.html\"&gt;Растительные аналоги&lt;/a&gt; — Растительное мясо, молоко, яйца: как добиваются вкуса и текстуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plant-based-yogurt-alternative.html\"&gt;Растительный аналог йогурта&lt;/a&gt; — Сүт йогуртын алмастыруға арналған өсімдік негізіндегі ашытылған тағамдық өнім.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/margin-of-exposure.html\"&gt;Расчетный предел воздействия&lt;/a&gt; — Қорғасын әсерінің қаупін бағалау үшін қолданылатын химиялық қауіпсіздік көрсеткіші, мұнда 10-нан төмен мән EFSA стандарттары бойынша…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/maillard-reaction.html\"&gt;реакция Майяра&lt;/a&gt; — Қыздыру кезінде аминқышқылдары мен қанттар арасындағы химиялық реакция, ол өзіндік хош иісті және дәмдік қосылыстарды түзеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recombinant-human-type-iii-collagen.html\"&gt;Рекомбинантный человеческий коллаген III типа&lt;/a&gt; — Асқазанның шырышты қабығын қорғау үшін биоматериал ретінде қолданылатын биотехнологиялық жолмен алынған жасушадан тыс матрица ақуызы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/trichiurus-haumela.html\"&gt;рыба-сабля&lt;/a&gt; — Миофибриллярлық ақуыздары берік гель түзу қабілеті төмен балық түрі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-pairing.html\"&gt;Сочетания и композиции вкуса&lt;/a&gt; — Что с чем сочетается и почему: специи, травы, среды (масло, сливки, вода), нагрев — по данным ГХ-О, панелей и сетей вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste_mod.html\"&gt;Сахарозаменители и управление вкусом&lt;/a&gt; — Как снизить сахар и соль без потери вкуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-novel_heat.html\"&gt;СВЧ, омический и индукционный нагрев&lt;/a&gt; — Новые способы греть еду быстро и равномерно.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-shelf_life.html\"&gt;Срок годности&lt;/a&gt; — Порча, прогнозирование срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sarcopenia.html\"&gt;Саркопения&lt;/a&gt; — Саркопения — бұлшықет массасы мен күшінің жоғалуымен сипатталатын, физикалық әлсіздікке әкелетін жасқа байланысты дегенеративті ауру.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/type-1-diabetes.html\"&gt;сахарный диабет 1 типа&lt;/a&gt; — Балалар мен жасөспірімдер арасында кең таралған, гликемиялық бақылауды, инсулин енгізуді және тамақтануды басқаруды талап ететін созылмалы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;Сверхвысокоэффективная жидкостная хроматография&lt;/a&gt; — Үлгілердегі бос қанттар мен фенолды фракциялардың құрамын бөлу және анықтаудың аналитикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/16s-rrna-gene-sequencing.html\"&gt;секвенирование гена 16S рРНК&lt;/a&gt; — 16S рРНҚ генінің гипервариабельді аймақтарын зерттеу арқылы ішек микробиотасын талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pi3k-akt-mtor-signaling-pathway.html\"&gt;Сигнальный путь PI3K/AKT/mTOR&lt;/a&gt; — Белсендірілуі бұлшықет ақуызының синтезіне және бұлшықет атрофиясын басуға ықпал ететін биохимиялық жол.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sinerezis.html\"&gt;Синерезис&lt;/a&gt; — Ашытылған өнімнің гель құрылымынан сарысудың өздігінен бөліну процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-protein-particle-encapsulation-sppe.html\"&gt;Система капсулирования отдельных белковых частиц&lt;/a&gt; — Жеке ақуыз бөлшектерін капсулалау жүйемі — асқазан-ішек жолында ақуыздың бөліну жылдамдығын бақылау үшін ақуыз микросфераларының…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;сканирующая электронная микроскопия&lt;/a&gt; — Гельдің ақуыз торының тығыз орналасуын растау үшін пайдаланылған микроскопиялық талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/somatostatin.html\"&gt;соматостатин&lt;/a&gt; — Ішектің моторлық белсенділігін тежейтін сарысулық реттегіш фактор.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/potassium-sorbate.html\"&gt;сорбат калия&lt;/a&gt; — Васаби соусындағы газ түзетін бактериялардың өсуін тежеу үшін қолданылатын тағамдық консервант.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wasabi-sauce.html\"&gt;соус васаби&lt;/a&gt; — Негізінен ақжелкек тамырынан (Armoracia rusticana) дайындалатын, изотиоцианаттар есебінен ащы дәмі мен микробқа қарсы қасиеттері бар…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-physiology.html\"&gt;Социальная физиология&lt;/a&gt; — Жақын адамның қатысуы стресстік әсерлер кезінде ағзаға түсетін физиологиялық жүктемені азайтатын құбылыс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mediterranean-mussel.html\"&gt;средиземноморская мидия&lt;/a&gt; — Зерттеуде консервациялау объектісі ретінде пайдаланылған, ақуыздың жоғары мөлшерімен және тез микробтық бұзылуымен сипатталатын қос…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Есептеулердің дәлдік көрсеткіші, жасанды интеллект немесе сарапшылар алған мәндердің эталондық деректерден орташа ауытқуын көрсетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-stomahera.html\"&gt;Стомакер әдісі&lt;/a&gt; — Үлгіні стерильді пакетте механикалық күрекшелер арқылы ұсақтау, бұл өнімнің ішіндегі микроорганизмдерді жасушаларға зақым келтірмей бөліп…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sous-vide.html\"&gt;Су-вид (sous-vide) әдісі&lt;/a&gt; — Өнімдерді дәл бақыланатын температура мен уақытта вакуумдық қаптамада пастеризациялауды көздейтін жылумен өңдеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/surimi.html\"&gt;сурими&lt;/a&gt; — Өсімдік ұнтағын қосу арқылы құрылымы мен гелінің ақуыз торы нығайтылатын балық тартылған еті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hot-air-drying.html\"&gt;сушка горячим воздухом&lt;/a&gt; — Майяр реакциясының жүруіне ықпал ететін, жоғары температурада тағамдық шикізатты сусыздандыру технологиясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/edible-packaging.html\"&gt;Съедобная упаковка&lt;/a&gt; — Жемілі қаптама — бұл өнімдердегі ылғал жоғалуын азайтуға және микроорганизмдердің өсуін тежеуге арналған, тағамдық компоненттерден жасалған…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/whey-protein-isolate.html\"&gt;Сывороточный изолят&lt;/a&gt; — Сарысу изоляты — сүт сарысуы ақуызының жоғары тазартылған түрі, құрамында маңызды аминқышқылдары бар.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l\"&gt;&lt;a href=\"reference/glossary.html#l\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Л&lt;/span&gt;&lt;/a&gt;Л&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-volatiles.html\"&gt;Летучие соединения и анализ аромата&lt;/a&gt; — Что именно пахнет: ГХ-МС, ольфактометрия, ключевые одоранты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rhynchophorus-phoenicis-larvae.html\"&gt;Личинки пальмового долгоносика&lt;/a&gt; — Ақуыз көзі ретінде пайдаланылатын, ауыр металдардың жиналуына байланысты субстрат тазалығын бақылауды талап ететін жеуге жарамды жәндіктер…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-taste.html\"&gt;Вкусовые рецепторы и восприятие&lt;/a&gt; — Сладкий, горький, умами, кокуми: как язык и мозг складывают вкус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-baking.html\"&gt;Выпечка&lt;/a&gt; — Тесто, подъём, мякиш и корка: хлеб, кондитерка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-micronutrients.html\"&gt;Витамины и минералы&lt;/a&gt; — Содержание, потери при готовке, обогащение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/winterization.html\"&gt;Винтеризация&lt;/a&gt; — Липидті фракцияларды тұндыру және кейіннен алып тастау үшін салқындату арқылы экстрактіні тазартудың технологиялық процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/water-holding-capacity.html\"&gt;влагоудерживающая способность&lt;/a&gt; — Асқабақ ұнтағының оңтайлы мөлшерін қосқанда 11,21%-ға артатын гельдің ылғал ұстау қасиеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extracellular-matrix.html\"&gt;Внеклеточный матрикс&lt;/a&gt; — Жасушалардың бетке бекінуі мен бөлінуі үшін қажетті ақуыздардан тұратын құрылымдық негіз.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secondary-nucleation.html\"&gt;Вторичная нуклеация&lt;/a&gt; — Қазірдің өзінде бар кристалдардың немесе бөлшектердің болуына байланысты қаныққан ерітіндіде жаңа кристалдардың түзілу процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hplc.html\"&gt;ВЭЖХ&lt;/a&gt; — Дәнді-дақылдардағы микотоксиндердің мөлшерін сандық анықтау үшін қолданылатын аналитикалық әдіс.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-lipid_aroma.html\"&gt;Окисление жиров и ароматы&lt;/a&gt; — Прогоркание, «рыбный» запах, ароматы жареного масла.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-roasting.html\"&gt;Обжарка, гриль, копчение&lt;/a&gt; — Кофе, орехи, мясо на огне; копчёные ароматы и ПАУ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/olfactory-receptor-or5k1.html\"&gt;Обонятельный рецептор OR5K1&lt;/a&gt; — Биосенсорда пиразин молекулаларын арнайы анықтау үшін қолданылатын ақуыз құрылымы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/total-antioxidant-capacity.html\"&gt;Общая антиоксидантная способность&lt;/a&gt; — Ағзаның тотығу стрессіне қарсы тұру қабілетін көрсететін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aerobic-plate-count.html\"&gt;Общая обсемененность мезофиллами&lt;/a&gt; — Шикізаттың ластану деңгейін көрсететін және термиялық өңдеудің тиімділігін бағалау үшін қолданылатын микробиологиялық көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/residual-organic-solvents.html\"&gt;Остаточные органические растворители&lt;/a&gt; — Кристалдану процесінде қолданылатын химиялық қосылыстар, олардың іздері соңғы өнімде қалады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acute-gastric-mucosal-lesion.html\"&gt;Острое повреждение слизистой оболочки желудка&lt;/a&gt; — Этанолды шамадан тыс тұтыну нәтижесінде туындайтын және асқазанның шырышты қабығының тосқауылдық қызметінің бұзылуына әкелетін патологиялық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hazard-ratio.html\"&gt;Отношение рисков&lt;/a&gt; — Белгілі бір кезең ішінде әсер ету тобындағы оқиғаның орын алу ықтималдығының бақылау тобындағы ықтималдыққа қатынасын көрсететін көрсеткіш.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-thermal.html\"&gt;Пісіру технологиялары&lt;/a&gt; — Что делает с продуктом нагрев: жарка, выпечка, sous vide, СВЧ, экструзия, пастеризация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservation_heat.html\"&gt;Пастеризация и стерилизация&lt;/a&gt; — Тепловая обработка ради безопасности и срока хранения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-probiotics.html\"&gt;Пробиотики&lt;/a&gt; — Живые культуры и их выживание в продуктах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bioactives.html\"&gt;Полифенолы и биоактивные вещества&lt;/a&gt; — Полифенолы, каротиноиды, флавоноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-digestion.html\"&gt;Пищеварение и усвоение&lt;/a&gt; — In vitro пищеварение, биодоступность, гликемический ответ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gpaef-peptide.html\"&gt;Пептид GPAEF&lt;/a&gt; — Асқазанда рекомбинантты коллагеннің ыдырауы нәтижесінде түзілетін және ДНҚ G-квадруплекстерімен өзара әрекеттесу арқылы простагландиндер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/peroxide-value.html\"&gt;перекисное число&lt;/a&gt; — Ет өнімдерінің балғындығын бағалау үшін қолданылатын майлардың тотығу дәрежесінің көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pyrazines.html\"&gt;Пиразины&lt;/a&gt; — Қуырылған, жаңғақ және нан иістерін қалыптастыратын гетероциклді органикалық қосылыстар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/incremental-area-under-the-glycemic-curve.html\"&gt;Площадь под гликемической кривой&lt;/a&gt; — Тамақтанғаннан кейін қандағы глюкоза деңгейінің базалық деңгейден ауытқуының жалпы шамасы мен ұзақтығын көрсететін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/carbohydrate-counting.html\"&gt;подсчет углеводов&lt;/a&gt; — Әрбір тамақтанудағы көмірсулар тұтынуын есептеуді және гликемиялық профиль мен дене белсенділігіне байланысты қысқа әсерлі инсулин дозасын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenols.html\"&gt;Полифенолы&lt;/a&gt; — Жемістің бос радикалдарды бейтараптандыру қабілетін қамтамасыз ететін алма құрамындағы химиялық қосылыстар тобы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polyphenol-oxidase.html\"&gt;Полифенолоксидаза&lt;/a&gt; — Фенолды қосылыстардың тотығуын катализдейтін және белоктарды жұмсақ жағдайда модификациялау үшін қолданылатын фермент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polosa-sore.html\"&gt;Полоса Соре&lt;/a&gt; — Гемоглобин спектріндегі 407 нм толқын ұзындығында байқалатын қарқынды жұтылу сызығы, ол ақуыз молекуласының тұтастығын бақылау үшін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dried-pumpkin-powder.html\"&gt;порошок сушеной тыквы&lt;/a&gt; — Ақуыздардың екіншілік құрылымын өзгертіп, 1,1% мөлшерінде сурими гель торын нығайтатын көкөніс қоспасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/postprandial-metabolic-response.html\"&gt;Постпрандиальный метаболический ответ&lt;/a&gt; — Тамақтанғаннан кейін адам қанындағы глюкоза, инсулин және триглицеридтер деңгейінің өзгеруі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zh\"&gt;&lt;a href=\"reference/glossary.html#zh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ж&lt;/span&gt;&lt;/a&gt;Ж&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-frying.html\"&gt;Жарка во фритюре и аэрогриле&lt;/a&gt; — Впитывание масла, корочка, акриламид, аэрофритюр против фритюра.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-newfood.html\"&gt;Жаңа тағам&lt;/a&gt; — Альтернативный белок и еда будущего: растительные аналоги, клеточное мясо, насекомые, грибы, 3D-печать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zhiznesposobnost-kletok.html\"&gt;Жасуша тіршілігі&lt;/a&gt; — Зақымдаушы фактордың әсерінен кейінгі мәдениеттегі «тірі» жасушалардың пайызы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gelatin.html\"&gt;желатин&lt;/a&gt; — Гель түзу қабілеті, тұтқырлықты бақылау және беттік белсенділігі арқасында пленкалар жасау үшін тамақ өнеркәсібінде қолданылатын ақуызды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sea-bass-skin-gelatin.html\"&gt;Желатин из кожи сибаса&lt;/a&gt; — Еуропалық теңіз алабұғасының терісін өңдеу қалдықтарынан алынған, жеуге жарамды қаптама үшін негіз ретінде қолданылатын жоғары ақуызды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/liquid-smoke.html\"&gt;жидкий дым&lt;/a&gt; — Биомасса пиролизі арқылы алынатын және бактерияға қарсы әрі антиоксиданттық белсенділігі бар карбонилдер мен фенолдарды қамтитын тағамдық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oilseed-cake.html\"&gt;Жмых&lt;/a&gt; — Майлы дақылдардың тұқымынан майды сығып алғаннан кейін қалатын қатты қалдық.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s1\"&gt;&lt;a href=\"reference/glossary.html#s1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S&lt;/span&gt;&lt;/a&gt;S&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sous_vide.html\"&gt;Sous vide и низкотемпературная готовка&lt;/a&gt; — Точная температура, долгое время: мясо, рыба, яйца.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scoby.html\"&gt;SCOBY&lt;/a&gt; — Комбуча ферментациясын жүзеге асыратын бактериялар мен ашытқы саңырауқұлақтарының симбиотикалық қауымдастығы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smartcloth-odyssey.html\"&gt;SMARTCLOTH-Odyssey&lt;/a&gt; — Мейіргер-педагогтарға 1 типті қант диабеті бар жасөспірімдерді нутритивті терапия мен көмірсуларды есептеуге үйретуде қолдау көрсету үшін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/streptococcus-thermophilus-and-lactobacillus-delbrueckii.html\"&gt;Streptococcus thermophilus и Lactobacillus delbrueckii&lt;/a&gt; — Өсімдік шикізатын ашыту үшін қолданылатын сүт қышқылы бактерияларының бастапқы мәдениеті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e\"&gt;&lt;a href=\"reference/glossary.html#e\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Э&lt;/span&gt;&lt;/a&gt;Э&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-extrusion.html\"&gt;Экструзия&lt;/a&gt; — Хлопья, снеки, текстурированный белок: как работает экструдер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsifiers.html\"&gt;Эмульгаторы и стабилизаторы&lt;/a&gt; — Лецитин, моно- и диглицериды, полисорбаты: что держит соус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-emulsions_foams.html\"&gt;Эмульсии и пены&lt;/a&gt; — Майонез, взбитые сливки, безе, пивная пена.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/eugenol.html\"&gt;Эвгенол&lt;/a&gt; — Қабықшаның антиоксиданттық белсенділігін қамтамасыз ететін қалампыр эфир майының құрамдас бөлігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/grapefruit-peel-extract.html\"&gt;экстракт кожуры грейпфрута&lt;/a&gt; — Бактериялар мен майлардың тотығуын тежеу үшін белсенді табиғи консервант ретінде қолданылатын фенолды қосылыстар мен антиоксиданттарға бай…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/broccoli-sprout-extract.html\"&gt;Экстракт ростков брокколи&lt;/a&gt; — Брокколи өскіндерінен алынған биологиялық белсенді қоспа, ағзаның қорғаныс механизмдерін белсендіру үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/extrusion.html\"&gt;Экструзия&lt;/a&gt; — Экструзия — бұл тағамдық компоненттердің құрылымын өзгерту үшін жоғары температура мен қысымда үздіксіз араластыру және илеу процесі.…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/electronic-nose.html\"&gt;электронный нос&lt;/a&gt; — Үлгілердің ұшпа хош иісті заттарының сенсорлық профильдерін тіркеу және салыстыру үшін зерттеуде қолданылатын талдамалық құрал.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sds-page.html\"&gt;Электрофорез в полиакриламидном геле&lt;/a&gt; — Ақуыз молекулаларының агрегациясын талдау үшін қолданылатын, ақуыздарды молекулалық салмағы бойынша бөлу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thyme-essential-oil.html\"&gt;Эфирное масло тимьяна&lt;/a&gt; — Еттегі бактериялардың өсуін тежеу және ақуыздар мен липидтердің тотығуын баяулату үшін пленка құрамына қосылатын табиғи қосылыс.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt; — E-коды без мифов: что это, зачем, как работает и что говорят исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-structure.html\"&gt;Текстура және тағам физикасы&lt;/a&gt; — Почему безе держит форму, а соус расслаивается: эмульсии, пены, гели, кристаллы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gel-hardness.html\"&gt;твердость геля&lt;/a&gt; — 1,1% асқабақ ұнтағын қосқан кезде 313,69 ± 2,54 г мәніне жететін суримидің механикалық беріктік көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-polymerization.html\"&gt;Термическая полимеризация&lt;/a&gt; — Термиялық полимерлену — капсулалау үшін негіз ретінде пайдаланылатын тұрақты микросфераларды қалыптастыру үшін ақуыз изолятын қыздыру…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thermal-stability.html\"&gt;Термостабильность&lt;/a&gt; — Ақуыз өнімінің жоғары температура әсерінен өз қасиеттерін сақтап қалу қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/thiobarbituric-acid-reactive-substances.html\"&gt;тиобарбитуровое число&lt;/a&gt; — Липидтердің тотығу бұзылу қарқындылығын көрсететін малон диальдегидінің мөлшері метрикасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/transepithelial-electrical-resistance.html\"&gt;Трансэпителиальное электрическое сопротивление&lt;/a&gt; — Жасушалық моноқабаттың тұтастығы мен тосқауылдық қызметінің көрсеткіші, Ом·см²-мен өлшенеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tricolor-quinoa.html\"&gt;Трехцветное киноа&lt;/a&gt; — Асқазанның шырышты қабығын қорғау үшін рационға қосылатын ақ, қызыл және қара киноа дәндерінің қоспасы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-preservatives.html\"&gt;Консерванты&lt;/a&gt; — Сорбаты, бензоаты, нитриты, натуральные консерванты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-colorants.html\"&gt;Красители&lt;/a&gt; — Натуральные и синтетические цвета, антоцианы, каротиноиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-veg_ferm.html\"&gt;Квашения и соленья&lt;/a&gt; — Кимчи, квашеная капуста, соленья.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-koji_precision.html\"&gt;Коджи и прецизионная ферментация&lt;/a&gt; — Aspergillus, мисо, соевый соус; белки, выращенные микробами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-starch.html\"&gt;Крахмал&lt;/a&gt; — Клейстеризация, ретроградация, черствение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crystals.html\"&gt;Кристаллизация: шоколад, мороженое, сахар&lt;/a&gt; — Темперирование шоколада, кристаллы льда, помадка.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-cultivated.html\"&gt;Клеточное мясо&lt;/a&gt; — Мясо из клеток: скаффолды, среды, стоимость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fibre_microbiome.html\"&gt;Клетчатка и микробиота&lt;/a&gt; — Пищевые волокна, пребиотики и кишечные бактерии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cannabidiol.html\"&gt;Каннабидиол&lt;/a&gt; — Биологиялық белсенді қоспалардың белсенді компоненті ретінде қолданылатын, Cannabis sativa L. биомассасынан алынатын липофильді кристалды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/intestinal-barrier.html\"&gt;Кишечный барьер&lt;/a&gt; — Ішек өткізгіштігін бақылайтын және ағзаны токсиндерден қорғайтын эпителий жасушалары мен ақуыздардың жүйесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nova-classification.html\"&gt;Классификация NOVA&lt;/a&gt; — Тағам өнімдерін өнеркәсіптік өңдеу дәрежесіне қарай санаттау жүйесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ges-1-cells.html\"&gt;Клетки GES-1&lt;/a&gt; — Шырышты қабықтың зақымдануын зерттеу үшін модель ретінде пайдаланылатын адамның асқазан эпителий жасушаларының желісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cultured-meat.html\"&gt;Клеточное мясо&lt;/a&gt; — Тұтас жануар ағзасын пайдаланбай, жасанды ортада бұлшықет жасушаларын өсіру арқылы алынған өнім.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha.html\"&gt;Комбуча&lt;/a&gt; — Тәтті шайдан дайындалатын, бактериялар мен ашытқы саңырауқұлақтарының симбиотикалық қауымдастығының әрекеті нәтижесінде алынатын қышқылтым…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/short-chain-fatty-acids.html\"&gt;Короткоцепочечные жирные кислоты&lt;/a&gt; — Иммундық жауапты модуляциялауға қатысатын ішек микробиотасының тіршілік әрекеті нәтижесінде түзілетін метаболиттер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/shrimp-meat-floss.html\"&gt;креветочный флосс&lt;/a&gt; — Дәмдеу, кептіру және ұсақтау арқылы пісірілген асшаян етінен алынған сусыздандырылған талшықты өнім.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-antioxidants_add.html\"&gt;Антиоксиданты&lt;/a&gt; — Токоферолы, розмарин, TBHQ: как замедляют окисление.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-ferment.html\"&gt;Ашыту&lt;/a&gt; — Микробы на кухне: сыр, хлеб на закваске, квашения, напитки, коджи и прецизионная ферментация.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-allergens.html\"&gt;Аллергены&lt;/a&gt; — Выявление и снижение аллергенности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/active-packaging.html\"&gt;Активная упаковка&lt;/a&gt; — Тауық етінің балғындық мерзімін ұзартуға арналған хитозан мен эфир майы негізіндегі қаптама материалы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sodium-alginate.html\"&gt;Альгинат натрия&lt;/a&gt; — Жеміс бетінде қорғаныш биологиялық ыдырайтын қабықша жасау үшін негіз ретінде қолданылатын табиғи полисахарид.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/antimicrobial-resistance.html\"&gt;Антибиотикорезистентность&lt;/a&gt; — Микроорганизмдердің арнайы гендердің болуына байланысты антибиотиктердің әсеріне қарамастан тіршілік қабілетін сақтап қалу қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/antioxidant-potential.html\"&gt;Антиоксидантный потенциал&lt;/a&gt; — Заттың бос радикалдарды бейтараптандыру қабілетінің ABTS, DPPH және FRAP әдістерімен өлшенетін сандық көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-absorption-spectrometry.html\"&gt;Атомно-абсорбционная спектрометрия&lt;/a&gt; — Дернәсілдердегі қорғасын мен кадмий концентрациясын анықтау үшін қолданылатын сандық химиялық талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aflatoxin-b1.html\"&gt;Афлатоксин B1&lt;/a&gt; — Саңырауқұлақтардың қауіпті екінші реттік метаболиті, IARC бойынша 1-топтағы канцероген ретінде жіктелген.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z\"&gt;&lt;a href=\"reference/glossary.html#z\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;З&lt;/span&gt;&lt;/a&gt;З&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-hydrocolloids.html\"&gt;Загустители и гидроколлоиды&lt;/a&gt; — Ксантан, агар, пектин, каррагинан.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sourdough.html\"&gt;Закваска и хлеб&lt;/a&gt; — Дикие дрожжи и молочнокислые бактерии в тесте.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-contaminants.html\"&gt;Загрязнители процесса&lt;/a&gt; — Акриламид, ПАУ, фуран: как образуются и как снизить.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kombucha-based-sourdough.html\"&gt;Закваска на основе комбучи&lt;/a&gt; — Комбуча симбиотикалық қауымдастығын астық матрицасына бейімдеу арқылы алынған нан пісіруге арналған микробтық инокулят.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-dairy_ferm.html\"&gt;Молочная ферментация&lt;/a&gt; — Йогурт, кефир, сыры: закваски и созревание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-microbial.html\"&gt;Микробная безопасность&lt;/a&gt; — Патогены, биоплёнки, обеззараживание.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/malondialdehyde.html\"&gt;Малоновый диальдегид&lt;/a&gt; — Липидтердің терең тотығуы нәтижесінде түзілген улы өнім, майлы өнімдердің бұзылу көрсеткіші ретінде қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mannitol.html\"&gt;Маннит&lt;/a&gt; — Төмен калориялы және гликемиялық индексі төмен қант алмастырғыш ретінде қолданылатын алты атомды спирт.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scallop-mantle.html\"&gt;Мантия гребешка&lt;/a&gt; — Теңіз өнімдерін қайта өңдеудің қосымша өнімі, тағамдық ақуыз алу үшін шикізат ретінде пайдаланылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensor-matrix.html\"&gt;Матрица сенсора&lt;/a&gt; — Өткізгіштік пен тұрақтылықты қамтамасыз ететін алтын нанобөлшектерінен, металл-органикалық қаңқалардан, көміртекті нанотүтікшелерден және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/meta-analysis.html\"&gt;Метаанализ&lt;/a&gt; — Зерттеу нәтижелерінің жалпыланған бағасын алу үшін бірнеше тәуелсіз зерттеулердің нәтижелерін біріктірудің статистикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mpns.html\"&gt;Металл-полифенольные сети&lt;/a&gt; — Металл-полифенолды желілер — металл иондарының полифенолдармен хелаттануы нәтижесинде түзілетін, ақуыз бөлшектерін қорғауға арналған…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/check-all-that-apply.html\"&gt;Метод CATA&lt;/a&gt; — Қатысушылар ұсынылған дескрипторлар тізімінен өнімнің сәйкес сипаттамаларын таңдайтын сенсорлық талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dpph-assay.html\"&gt;Метод DPPH&lt;/a&gt; — Үлгілердің антиоксиданттық белсенділігін бос радикалдарды сіңіру қабілеті арқылы бағалаудың аналитикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;Метод бляшкообразующих единиц&lt;/a&gt; — Үлгідегі тіршілікке қабілетті вирус бөлшектерінің концентрациясын сандық анықтауға арналған стандартты зертханалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kjeldahl-method.html\"&gt;Метод Кьельдаля&lt;/a&gt; — Тағам өнімдеріндегі шикі ақуыз мөлшерін 6,25 қайта есептеу коэффициентін қолдану арқылы анықтаудың аналитикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mycotoxins.html\"&gt;Микотоксины&lt;/a&gt; — Зиянды саңырауқұлақтар бөліп шығаратын улы екінші реттік метаболиттер, олар шикізаттың тағамдық құндылығын төмендетеді және денсаулыққа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/microbial-load.html\"&gt;Микробная нагрузка&lt;/a&gt; — Өнімдегі бактериялар санының көрсеткіші, граммға шаққандағы колония түзетін бірліктердің логарифмдік бірліктерімен өлшенеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/c2c12-myoblasts.html\"&gt;Миобласты C2C12&lt;/a&gt; — Жасушалық ет зерттеулерінде адгезия мен пролиферацияны зерттеу үшін модель ретінде қолданылатын тышқан бұлшықет жасушаларының желісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mobile-genetic-elements.html\"&gt;Мобильные генетические элементы&lt;/a&gt; — Геном ішінде қозғалуға немесе бактериялық жасушалар арасында тасымалдануға қабілетті, соның ішінде төзімділік гендерін қамтитын ДНҚ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/technology-acceptance-model.html\"&gt;модель принятия технологий&lt;/a&gt; — Дэвис сауалнамасына негізделген және пайдаланушылар қабылдайтын пайдалылық пен қолдану қарапайымдылығын өлшейтін цифрлық құралды бағалау…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/molecular-docking.html\"&gt;Молекулярный докинг&lt;/a&gt; — Полифенол молекулаларының нысана-ақуыздармен өзара әрекеттесуін модельдеу және жақындық энергиясын бағалау үшін қолданылатын компьютерлік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;Молочнокислые бактерии&lt;/a&gt; — Өсімдік ірімшіктеріндегі ашытудың негізгі агенттері болып табылатын, көмірсуларды сүт қышқылына айналдыратын микроорганизмдер тобы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/motilin.html\"&gt;мотилин&lt;/a&gt; — Перистальтиканы ынталандыратын және асқазан-ішек жолдарының моторикасын реттейтін гормон.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimorbidity.html\"&gt;Мультиморбидность&lt;/a&gt; — Бір пациентте бір уақытта екі немесе одан да көп созылмалы аурулардың болуы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f\"&gt;&lt;a href=\"reference/glossary.html#f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ф&lt;/span&gt;&lt;/a&gt;Ф&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-beverage_ferm.html\"&gt;Ферментированные напитки&lt;/a&gt; — Пиво, вино, комбуча, квас.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/disconfirmation.html\"&gt;Феномен дезавуирования&lt;/a&gt; — Өнім туралы қосымша ақпарат алғаннан кейін тұтынушының бағалауының өзгеруінің психологиялық әсері.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enzymatic-modification.html\"&gt;Ферментативная модификация&lt;/a&gt; — Алма шырынының көмегімен төмендетілген pH деңгейінде кофе фенолдарын белоктармен байланыстырудың технологиялық процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fermentation.html\"&gt;Ферментация&lt;/a&gt; — Ашыту — бұл микроорганизмдердің көмегімен өсімдік шикізатын биологиялық өңдеу процесі, ол өнімнің химиялық құрамын өзгертіп, жаңа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/flexitarians.html\"&gt;Флекситарианцы&lt;/a&gt; — Ет тұтынуды саналы түрде азайтатын және сүт өнімдеріне өсімдік тектес баламаларды жиі таңдайтын тұтынушылар тобы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/photooxidation.html\"&gt;Фотоокисление&lt;/a&gt; — Жарық пен фотосенсибилизаторлар әсерінен май қышқылдарының химиялық ыдырау процесі, бұл липидтердің бұзылуына әкеледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fructooligosaccharides.html\"&gt;Фруктоолигосахариды&lt;/a&gt; — Маннитті ашыту арқылы алу үшін шикізат ретінде қызмет ететін, якон тамырында болатын көмірсутекті қосылыстар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/functional-constipation.html\"&gt;функциональный запор&lt;/a&gt; — Сирек дәретпен (аптасына үш реттен аз), қатты нәжіспен және ішектің толық босамау сезімімен сипатталатын созылмалы ішек бұзылысы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-gels.html\"&gt;Гели и желе&lt;/a&gt; — Желатин, агар, белковые гели: прочность и тающая текстура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-chromatography-mass-spectrometry.html\"&gt;Газовая хроматография-масс-спектрометрия&lt;/a&gt; — Тимьян эфир майының құрамындағы 29 қосылысты анықтау үшін қолданылатын аналитикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gas-production.html\"&gt;газообразование&lt;/a&gt; — Микроорганизмдердің тіршілік әрекетінен туындайтын және қаптаманың ісінуіне әкелетін тамақ өнімдерінің бұзылу ақауы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hemoglobin.html\"&gt;Гемоглобин&lt;/a&gt; — Қан құрамындағы темір ұстайтын ақуыз, ол жарық әсерінен липидтердің тотығуын тездететін катализатор қызметін атқарады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hyaluronic-acid.html\"&gt;Гиалуроновая кислота&lt;/a&gt; — Тұқым қабығының құрылымына еліктеу үшін нанобөлшектердің сыртқы қорғаныш қабаты ретінде қолданылатын сахарид.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/giant-freshwater-prawn.html\"&gt;гигантская пресноводная креветка&lt;/a&gt; — Жоғары ақуызды тағамдық өнімдерді өндіру үшін шикізат ретінде пайдаланылатын тұщы су шаянтәрізділерінің түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cts-zno-ca-hydrogel.html\"&gt;гидрогель CTS-ZnO&amp;amp;CA&lt;/a&gt; — Жемістерді бұзылудан қорғауға арналған бактерияға қарсы және антиоксиданттық қасиеттері бар хитозан, мырыш оксидінің нанобөлшектері және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glycogen-hepatopathy.html\"&gt;Гликогеновая гепатопатия&lt;/a&gt; — Жоғары көмірсутекті рационнан туындаған бауырда гликогеннің шамадан тыс жиналуымен сипатталатын патологиялық жағдай.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/glucose-homeostasis.html\"&gt;Глюкозный гомеостаз&lt;/a&gt; — Көмірсулар жүктемесі кезінде ағзаның ішкі ортасының тұрақтылығын сақтау процесі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n\"&gt;&lt;a href=\"reference/glossary.html#n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Н&lt;/span&gt;&lt;/a&gt;Н&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-insects_fungi.html\"&gt;Насекомые, грибы и водоросли&lt;/a&gt; — Микопротеин, насекомые, спирулина как белок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенттер&lt;/a&gt; — Что еда даёт организму: витамины, биоактивные вещества, усвоение. Без медицинских советов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observational-cross-sectional-study.html\"&gt;Наблюдательное кросс-секционное исследование&lt;/a&gt; — Жасанды интеллект пен дәрігерлер топтарының жұмыс нәтижелерін бір мезгілде салыстыруға негізделген құралдардың тиімділігін бағалаудың…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc-oxide-nanoparticles.html\"&gt;наночастицы оксида цинка&lt;/a&gt; — Бактерия мембраналары мен биоқабықшаларды бұзу үшін оттегінің белсенді түрлерін түзетін және мырыш иондарын бөлетін, 260 °C-та термиялық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nanoemulsion.html\"&gt;наноэмульсия&lt;/a&gt; — Өнімдердегі микробқа қарсы белсенділікті арттыру және биоактивті компоненттерді тарату үшін қолданылатын, тамшылары нанометрлік өлшемдегі…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-steroidal-anti-inflammatory-drugs.html\"&gt;Нестероидные противовоспалительные препараты&lt;/a&gt; — Циклооксигеназа ферменттерін тежеу арқылы асқазанның зақымдануын тудыратын дәрілік заттар.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3\"&gt;&lt;a href=\"reference/glossary.html#3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3&lt;/span&gt;&lt;/a&gt;3&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-food_printing.html\"&gt;3D-печать еды&lt;/a&gt; — Печать шоколадом, пастами, персональные порции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kh\"&gt;&lt;a href=\"reference/glossary.html#kh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қ&lt;/span&gt;&lt;/a&gt;Қ&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-safety.html\"&gt;Қауіпсіздік және сақтау&lt;/a&gt; — Срок годности, упаковка, загрязнители и аллергены — спокойно и с цифрами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/side-streams.html\"&gt;Қосымша өнімдер&lt;/a&gt; — Филе өндірілгеннен кейін қалатын балық бөліктері (тері, сүйек, қабыршақ). Оларды желатинге қайта өңдеу қалдықтарды құнды ресурсқа…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-packaging.html\"&gt;Упаковка и миграция&lt;/a&gt; — Пластик, биоразлагаемые плёнки, миграция веществ в еду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultrazvukovaya-ekstraktsiya.html\"&gt;Ультрадыбыстық экстракция&lt;/a&gt; — Ультрадыбыстық толқындардың көмегімен өсімдік шикізатынан биологиялық белсенді заттарды бөліп алу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ultra-processed-foods.html\"&gt;Ультраобработанные пищевые продукты&lt;/a&gt; — Ультраөңделген тағамдық өнімдер (UPF) — бұл құрамында тұз, қант, гидрогенделген майлар және көп компонентті технологиялық қоспалардың…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"5\"&gt;&lt;a href=\"reference/glossary.html#5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5&lt;/span&gt;&lt;/a&gt;5&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/5-caffeoylquinic-acid.html\"&gt;5-кофеилхинная кислота&lt;/a&gt; — Кофе дәндерінің негізгі фенолды компоненті, о-хинондарға тотыққаннан кейін белоктармен байланысуға қабілетті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a1\"&gt;&lt;a href=\"reference/glossary.html#a1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A&lt;/span&gt;&lt;/a&gt;A&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/amp-activated-protein-kinase.html\"&gt;AMPK&lt;/a&gt; — Жасушалардағы энергия алмасуын реттейтін фермент.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/bacillus-licheniformis-qjl3.html\"&gt;Bacillus licheniformis QJL3&lt;/a&gt; — Васаби соусы қаптамасының ісінуі мен газ түзілуінің негізгі көзі ретінде анықталған бактерия штаммы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-backslopping.html\"&gt;Backslopping» (қайта өңдеу) әдісі&lt;/a&gt; — Ашытқы қамырды сақтаудың дәстүрлі әдісі, онда піскен қамырдың бір бөлігі жаңа ұн мен суды ашыту үшін пайдаланылады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/c2c12.html\"&gt;C2C12&lt;/a&gt; — Өсімдік жабындарындағы жасушалардың адгезиясы мен пролиферациясын бағалау үшін тәжірибелерде қолданылатын тышқан миобласттарының желісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/caco-2-cells.html\"&gt;Caco-2&lt;/a&gt; — In vitro ішек эпителийінің моделі ретінде қолданылатын адамның тоқ ішек рагы жасушаларының желісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/consort.html\"&gt;CONSORT&lt;/a&gt; — Рандомизацияланған сынақтар үшін есеп беру стандарты, ол зерттеу дизайнының ашықтығын қамтамасыз етеді және қателіктерді азайтады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d1\"&gt;&lt;a href=\"reference/glossary.html#d1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D&lt;/span&gt;&lt;/a&gt;D&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/dcfh-da.html\"&gt;DCFH-DA&lt;/a&gt; — Жасушалық зерттеулерде оттегінің белсенді түрлерінің (ОБТ) деңгейін анықтау және сандық өлшеу үшін қолданылатын флуоресцентті зонд.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f1\"&gt;&lt;a href=\"reference/glossary.html#f1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F&lt;/span&gt;&lt;/a&gt;F&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ftir-spectroscopy.html\"&gt;FTIR-спектроскопия&lt;/a&gt; — Амидтік жолақтарды сәйкестендіру арқылы желатиннің құрылымдық тұтастығын растау үшін қолданылатын аналитикалық әдіс.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g1\"&gt;&lt;a href=\"reference/glossary.html#g1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G&lt;/span&gt;&lt;/a&gt;G&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/g-quadruplexes.html\"&gt;G-квадруплексы&lt;/a&gt; — Реттеуші молекулалармен өзара әрекеттесу арқылы транскрипцияны басқаратын геннің промоторлық аймағындағы ДНҚ-ның екінші реттік құрылымы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gallic-acid-equivalent.html\"&gt;GAE&lt;/a&gt; — Үлгідегі фенолды қосылыстардың мөлшерін галл қышқылының бірліктерімен өлшеу әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-centered-design.html\"&gt;HCD&lt;/a&gt; — Пайдаланушыға терең жанашырлыққа, оның қатысуымен үздіксіз қайталауға және нақты жағдайларға бейімделген функционалдық дизайнға негізделген…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hepg2.html\"&gt;HepG2&lt;/a&gt; — Экстракттардың антиоксиданттық қорғанысын бағалау үшін модель ретінде қолданылатын адам гепатокарциномасы жасушаларының дақылы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l1\"&gt;&lt;a href=\"reference/glossary.html#l1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L&lt;/span&gt;&lt;/a&gt;L&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/lactococcus-lactis-subsp-cremoris-d2022.html\"&gt;Lactococcus lactis subsp. cremoris D2022&lt;/a&gt; — Douzhier-ден бөлінген, А тұмау вирусына қарсы пробиотикалық белсенділігі бар грам-оң сүт қышқылы бактерияларының штаммы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt; — Жұмсақ температура жағдайында фруктоза мен фруктоолигосахаридтерді маннитке тиімді түрде айналдыра алатын микроорганизмдер.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/maldi-tof-mass-spectrometry.html\"&gt;MALDI-TOF масс-спектрометрия&lt;/a&gt; — Иондалған молекулалардың масса-спектрометриялық талдауына негізделген микроорганизмдерді сәйкестендірудің аналитикалық әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n1\"&gt;&lt;a href=\"reference/glossary.html#n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;N&lt;/span&gt;&lt;/a&gt;N&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/nlrp3-inflammasome.html\"&gt;NLRP3-инфламмасома&lt;/a&gt; — Ағзадағы қабыну процестерін қоздыратын ақуыз кешені.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p1\"&gt;&lt;a href=\"reference/glossary.html#p1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P&lt;/span&gt;&lt;/a&gt;P&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; — Дәстүрлі түрде ашытқыларда кездесетін және иммуномодуляциялық қасиеттері бар грамоң гомоферментті сүт қышқылы бактериясы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ipp.html\"&gt;PPI&lt;/a&gt; — Асқазан жасушаларында қышқыл өндіретін сорғыларды «өшіретін» дәрілер, олар асқазан қышқылдығын төмендетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-prisma.html\"&gt;PRISMA әдісі&lt;/a&gt; — Жүйелі шолулар үшін есеп беру стандарты, зерттеулерді таңдауда ашықтықты қамтамасыз етеді және деректерді талдауда бейтараптықты барынша…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pseudomonas-aeruginosa.html\"&gt;Pseudomonas aeruginosa&lt;/a&gt; — Жемістердің шіру ошақтарын тудыратын және зерттеуде гидрогельдің бактерияға қарсы тиімділігін бағалау үшін пайдаланылған бактериялық…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r1\"&gt;&lt;a href=\"reference/glossary.html#r1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;R&lt;/span&gt;&lt;/a&gt;R&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgd-motifs.html\"&gt;RGD-мотивы&lt;/a&gt; — Жасуша бетіндегі интегриндермен өзара әрекеттесетін және олардың матрицаға бекітілуін қамтамасыз ететін арнайы аминқышқылдар тізбегі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t1\"&gt;&lt;a href=\"reference/glossary.html#t1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T&lt;/span&gt;&lt;/a&gt;T&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt; — Жалпы ұшпа негізді азот (TVB-N) — ақуыздың ыдырауы мен бактериялардың көбеюі нәтижесінде етте жиналатын балғындық көрсеткіші. Көрсеткіштің…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v1\"&gt;&lt;a href=\"reference/glossary.html#v1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;V&lt;/span&gt;&lt;/a&gt;V&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/vfd.html\"&gt;VFD&lt;/a&gt; — Тағамдық заттарды сақтап қалу үшін төмен температура мен вакуумда ылғалды кетіру арқылы азық-түлікті консервілеу әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"w\"&gt;&lt;a href=\"reference/glossary.html#w\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;W&lt;/span&gt;&lt;/a&gt;W&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/w-w.html\"&gt;w/w&lt;/a&gt; — Массалық үлес, бір компонент массасының екіншісіне қатынасы. Бұл жағдайда 1:2 қатынасы 1 кг теріге 2 кг мұз сәйкес келетінін білдіреді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d2\"&gt;&lt;a href=\"reference/glossary.html#d2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Δ&lt;/span&gt;&lt;/a&gt;Δ&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-ct.html\"&gt;ΔΔCt әдісі&lt;/a&gt; — Ген экспрессиясын сандық салыстырудың стандартты әдісі болып табылады, ол бақылауға қатысты мақсатты ген мРНҚ мөлшерінің қанша есе…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b1\"&gt;&lt;a href=\"reference/glossary.html#b1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Б&lt;/span&gt;&lt;/a&gt;Б&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/hurdle-technology.html\"&gt;барьерный подход&lt;/a&gt; — Синтетикалық консерванттарсыз микроорганизмдерді басу және сақтау мерзімін ұзарту үшін бірнеше әсер ету факторларын біріктіру арқылы тамақ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tight-junction-proteins.html\"&gt;Белки плотных контактов&lt;/a&gt; — Эпителийдің апикальды және базолатеральды жақтары арасындағы заттар тасымалын реттейтін жасушааралық қосылыстардағы молекулалық құрылымдар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;бета-глицерофосфат&lt;/a&gt; — Белсенді компоненттері біркелкі таралған кеуекті гидрогельді қабықшаны қалыптастыру үшін 50%-дық ерітінді түрінде қолданылатын тігуші агент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biozate1.html\"&gt;БиоЗейт1&lt;/a&gt; — Кофе фенолдарымен байланысу үшін субстрат ретінде қолданылатын сүт пептиді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biopolimery.html\"&gt;Биополимерлер&lt;/a&gt; — Биополимерлер — бұл өнімдерді сыртқы ортадан қорғайтын экологиялық таза қаптама жасау үшін қолданылатын табиғи полимерлер (ақуыздар немесе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/biosensor.html\"&gt;Биосенсор&lt;/a&gt; — Пиразиндердің концентрациясын анықтау үшін адам мұрнының жұмысына еліктейтін аналитикалық құрылғы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/micropterus-salmoides.html\"&gt;Большеротый окунь&lt;/a&gt; — Жем құрамының метаболизмге әсерін зерттеу үшін биологиялық модель ретінде қолданылатын балық түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/krasochnyy-painty-privkus.html\"&gt;Бояу» (painty) дәмі&lt;/a&gt; — Майлардың тотығуы нәтижесінде пайда болатын, майлы бояу иісін еске түсіретін өзіндік дәм ақауы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bristol-stool-form-scale.html\"&gt;Бристольская шкала формы кала&lt;/a&gt; — Нәжістің пішіні мен тығыздығын бағалауға арналған медициналық шкала, мұнда 1–2 мәндері шамадан тыс қатты массаға сәйкес келеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/v-dannom-issledovanii-ispolzuetsya-model-caco-2.html\"&gt;Бұл зерттеуде Caco-2 моделі&lt;/a&gt; — Ішек эпителийіне еліктейтін моноқабат түзуші адам тоқ ішегінің аденокарциномасы жасуша желісі қолданылады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e1\"&gt;&lt;a href=\"reference/glossary.html#e1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Е&lt;/span&gt;&lt;/a&gt;Е&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/european-sea-bass.html\"&gt;Европейский сибас&lt;/a&gt; — Жерорта теңізі аймағындағы аквакультураның негізгі нысаны және желатин өндіруге арналған шикізат көзі болып табылатын теңіз балығының түрі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/isothiocyanates.html\"&gt;изотиоцианаты&lt;/a&gt; — Глюкозинолаттардың ферменттік гидролизі нәтижесінде түзілетін және васаби соусына өзіне тән хош иіс пен ащылық беретін химиялық қосылыстар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;ИК-спектроскопия с преобразованием Фурье&lt;/a&gt; — Асқабақ ұнтағының әсерінен ақуыздардың екіншілік құрылымындағы өзгерістерді анықтау үшін қолданылған талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hunter-whiteness-index.html\"&gt;Индекс белизны Хантера&lt;/a&gt; — L* және b* колориметриялық индекстері негізінде есептелетін үлгінің ақтық дәрежесінің көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ulcer-index.html\"&gt;Индекс язвенных повреждений&lt;/a&gt; — Асқазанның шырышты қабығының зақымдану дәрежесін көрсететін баллмен өлшенетін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/artificial-intelligence.html\"&gt;Искусственный интеллект&lt;/a&gt; — Мәліметтерді талдауға және мәтіндік сұраулар негізінде диета бойынша ұсыныстар беруге қабілетті бағдарламалық жүйелер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/elisa.html\"&gt;ИФА&lt;/a&gt; — Шикізаттағы микотоксиндерді анықтау үшін қолданылатын зертханалық скрининг әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h1\"&gt;&lt;a href=\"reference/glossary.html#h1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Х&lt;/span&gt;&lt;/a&gt;Х&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/chitosan.html\"&gt;Хитозан&lt;/a&gt; — Альгинатпен және пектинмен әрекеттескенде қорғаныш үлдірінің құрылымын тығыздайтын катионды полисахарид.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chlorogenic-acid.html\"&gt;хлорогеновая кислота&lt;/a&gt; — Жеміс бетіндегі бос радикалдарды бейтараптандыру және микробқа қарсы әсерді ұзарту мақсатында мырышты хелаттау үшін гидрогель құрамына…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c1\"&gt;&lt;a href=\"reference/glossary.html#c1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ц&lt;/span&gt;&lt;/a&gt;Ц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/cielab-color-space.html\"&gt;Цветовые индексы CIELab&lt;/a&gt; — Өнімнің оптикалық қасиеттерін жарықтық (L*) және түс осьтері (a* және b*) параметрлері арқылы сандық бағалау жүйеси.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zinc.html\"&gt;Цинк&lt;/a&gt; — Көмірсулар алмасуын реттейтін және крахмал мөлшері көп болғанда гликолиз ферменттерінің белсенділігін қалпына келтіретін микроэлемент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cytokine-storm.html\"&gt;Цитокиновый шторм&lt;/a&gt; — Ағза тіндерін зақымдайтын қабынуға қарсы цитокиндердің бақылаусыз бөлінуімен сипатталатын шамадан тыс қабыну жағдайы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sh\"&gt;&lt;a href=\"reference/glossary.html#sh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ш&lt;/span&gt;&lt;/a&gt;Ш&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/pin-mill.html\"&gt;Штифтовая мельница&lt;/a&gt; — Экструдатты белгілі бір бөлшек өлшемі бар ұнтақ күйіне келтіру үшін ұсақтау құралы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sh1\"&gt;&lt;a href=\"reference/glossary.html#sh1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Щ&lt;/span&gt;&lt;/a&gt;Щ&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/alkaline-extraction.html\"&gt;Щелочная экстракция&lt;/a&gt; — Ортаның pH деңгейін өзгерту арқылы шикізаттан ақуызды бөліп алу технологиялық процесі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ya\"&gt;&lt;a href=\"reference/glossary.html#ya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Я&lt;/span&gt;&lt;/a&gt;Я&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/malic-acid.html\"&gt;Яблочная кислота&lt;/a&gt; — Алма жұмсағындағы қышқыл дәмнің басым компоненті болып табылатын органикалық қышқыл.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"228 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Глоссарий А–Я","description":"228 ұғым","vcsPath":"reference/glossary.md"},"headings":[{"title":"Д","href":"reference/glossary.html#d","level":2},{"title":"Р","href":"reference/glossary.html#r","level":2},{"title":"С","href":"reference/glossary.html#s","level":2},{"title":"Л","href":"reference/glossary.html#l","level":2},{"title":"В","href":"reference/glossary.html#v","level":2},{"title":"О","href":"reference/glossary.html#o","level":2},{"title":"П","href":"reference/glossary.html#p","level":2},{"title":"Ж","href":"reference/glossary.html#zh","level":2},{"title":"S","href":"reference/glossary.html#s1","level":2},{"title":"Э","href":"reference/glossary.html#e","level":2},{"title":"Т","href":"reference/glossary.html#t","level":2},{"title":"К","href":"reference/glossary.html#k","level":2},{"title":"А","href":"reference/glossary.html#a","level":2},{"title":"З","href":"reference/glossary.html#z","level":2},{"title":"М","href":"reference/glossary.html#m","level":2},{"title":"Ф","href":"reference/glossary.html#f","level":2},{"title":"Г","href":"reference/glossary.html#g","level":2},{"title":"Н","href":"reference/glossary.html#n","level":2},{"title":"3","href":"reference/glossary.html#3","level":2},{"title":"Қ","href":"reference/glossary.html#kh","level":2},{"title":"У","href":"reference/glossary.html#u","level":2},{"title":"5","href":"reference/glossary.html#5","level":2},{"title":"A","href":"reference/glossary.html#a1","level":2},{"title":"B","href":"reference/glossary.html#b","level":2},{"title":"C","href":"reference/glossary.html#c","level":2},{"title":"D","href":"reference/glossary.html#d1","level":2},{"title":"F","href":"reference/glossary.html#f1","level":2},{"title":"G","href":"reference/glossary.html#g1","level":2},{"title":"H","href":"reference/glossary.html#h","level":2},{"title":"L","href":"reference/glossary.html#l1","level":2},{"title":"M","href":"reference/glossary.html#m1","level":2},{"title":"N","href":"reference/glossary.html#n1","level"
