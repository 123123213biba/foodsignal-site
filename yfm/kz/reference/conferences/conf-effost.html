        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Европейская федерация пищевой науки и технологий&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Европейская федерация пищевой науки и технологий&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;программа, постеры&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;Европейская федерация пищевой науки и технологий (EFFoST)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Международная научная конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;effost.org&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-thermal.html\"&gt;Пісіру технологиялары&lt;/a&gt;, &lt;a href=\"concepts/spec-structure.html\"&gt;Текстура және тағам физикасы&lt;/a&gt;, &lt;a href=\"concepts/spec-newfood.html\"&gt;Жаңа тағам&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Қауіпсіздік және сақтау&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;EFFoST (European Federation of Food Science and Technology) — зерттеушілерді, технологтарды және тамақ өнеркәсібінің өкілдерін біріктіретін жыл сайынғы халықаралық ғылыми конференция. Іс-шара тамақ жүйелеріндегі іргелі процестер, шикізатты өңдеу әдістері және тамақтану қауіпсіздігі саласындағы инновациялар бойынша білім алмасу алаңы болып табылады.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Конференцияны Еуропалық тамақ ғылымы және технологиялары федерациясы (EFFoST) ұйымдастырады. Федерация Еуропа бойынша тамақ ғылымдары қоғамдарының жұмысын үйлестіретін коммерциялық емес ұйым.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференция бағдарламасы индустрияның өзекті мәселелеріне сәйкес келетін кең ауқымды бағыттарды қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Өңдеу технологиялары және текстура: экструзияның өнім құрылымына әсерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Қауіпсіздік және сақтау: майлардың тотығуы, өсімдік ақуыздарындағы микотоксиндер және қаптаманың микробиологиялық тұрақтылығына байланысты тәуекелдерді талдау.&lt;/li&gt;\n&lt;li&gt;Жаңа тамақ: жәндіктер мен өсімдік изоляттары сияқты баламалы ақуыз көздерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Функционалды компоненттер: қоспалардың дайын өнімдердің физика-химиялық қасиеттеріне әсерін зерттеу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-neler-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#onda-neler-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда нелер пайда болады&lt;/span&gt;&lt;/a&gt;Онда нелер пайда болады&lt;/h2&gt;\n&lt;p&gt;Конференцияда ультра өңделген тамақтың денсаулыққа әсері бойынша мета-талдаулар және өнімдерді тұрақтандырудың жаңа әдістері туралы деректер алғаш рет ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференцияға қатысу үшін сараптамалық бағалаудан өтетін баяндама тезистерін ұсыну қажет. Нәтижелерді іс-шара аяқталғаннан кейін жарияланатын ресми тезистер жинақтары арқылы бақылауға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-effost.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D0%B8%D1%81%D0%BE%D0%BA_%D0%B0%D1%8D%D1%80%D0%BE%D0%BF%D0%BE%D1%80%D1%82%D0%BE%D0%B2_%D0%BF%D0%BE_%D0%BA%D0%BE%D0%B4%D1%83_%D0%98%D0%9A%D0%90%D0%9E%3A_E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Список аэропортов по коду ИКАО: E — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.tifs.2018.07.008\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The next protein transition&lt;/a&gt; — шолу, Trends Food Sci Technol 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.jare.2025.10.004\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Role of capsaicin, circadian clock genes, and TRPV1 in colorectal carcinogenesis: Lessons and future directions&lt;/a&gt; — шолу, J Adv Res 2026&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Европейская федерация пищевой науки и технологий"}],"style":["_assets/biosi
