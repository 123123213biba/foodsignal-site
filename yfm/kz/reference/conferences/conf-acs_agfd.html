        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;отделение сельскохозяйственной и пищевой химии ACS&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;отделение сельскохозяйственной и пищевой химии ACS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;аннотации сессий AGFD&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt;, &lt;a href=\"concepts/spec-additives.html\"&gt;Тағамдық қоспалар&lt;/a&gt;, &lt;a href=\"concepts/spec-nutrition.html\"&gt;Нутриенттер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;ACS Fall/Spring — бұл Америка химиялық қоғамы (ACS) ұйымдастыратын ауқымды жартыжылдық ғылыми форумдар. Осы кездесулер аясында ауыл шаруашылығы және тамақ химиясы бөлімі (AGFD) жұмыс істейді. Бұл іргелі химия тамақ өнеркәсібінің қолданбалы міндеттерімен кездесетін алаң. Мұнда ғалымдар молекулалық өзгерістердің дәмге, хош иіске, тұрақтылыққа және тағамдық құндылыққа қалай әсер ететінін түсіндіретін зерттеу нәтижелерін ұсынады.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Конференцияларды химия саласындағы ең көне және ең ірі ғылыми ұйым — Америка химиялық қоғамы өткізеді. AGFD бөлімі пәнаралық зерттеулерге бағытталған: шикізаттың молекулалық құрамынан бастап, қоректік заттарды сақтап қалуға және тағам сапасын жақсартуға мүмкіндік беретін өңдеу технологияларына дейін. Бұл кездесулердің тарихы — тамақ ғылымының құрамды қарапайым талдаудан өнім қасиеттерін молекулалық деңгейде басқаруға қалай өткенінің жылнамасы.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;AGFD жұмысы біз тұтынатын нәрселерге қатысты кең ауқымды мәселелерді қамтиды. Негізгі бағыттарға мыналар жатады:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Сақтау технологиялары: өнімдердің балғындығын ұзартатын жеуге жарамды жабындарды жасау үшін табиғи антиоксиданттарды (мысалы, грейпфрут немесе апельсин қабығының сығындылары) пайдалану.&lt;/li&gt;\n&lt;li&gt;Қоректік заттарды модификациялау: ақуызды сіңіруді баяулату әдістерін әзірлеу, мысалы, сарысу ақуызы үшін полифенолдардан «қабықша» жасау арқылы.&lt;/li&gt;\n&lt;li&gt;Биотехнологиялар: бактериялық ашыту көмегімен өсімдік шикізатынан пайдалы қоспаларды (мысалы, маннит) алу.&lt;/li&gt;\n&lt;li&gt;Физика-химиялық процестер: өңдеу әдістерінің (сублимация және ыстық ауа) ақуыз құрылымына және умами сияқты дәмдік қасиеттерге әсерін зерттеу.&lt;/li&gt;\n&lt;li&gt;Тамақтану психофизиологиясы: әлеуметтік факторлардың метаболизмге, мысалы, көмірсулардың сіңуіне әсерін зерттеу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ol-zherde-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#ol-zherde-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ол жерде не пайда болады&lt;/span&gt;&lt;/a&gt;Ол жерде не пайда болады&lt;/h2&gt;\n&lt;p&gt;ACS AGFD конференцияларында кейіннен салалық стандарттарға айналатын шешімдер туындайды. Бұлар жай ғана теориялық баяндамалар емес, технология прототиптері: еттің бұзылуына жол бермейтін орауыш материалдарынан бастап, қант алмастырғыштарды алу үшін өсімдік тамырларын өңдеудің жаңа әдістеріне дейін. Қатысушылар ауыз қуысы рецепторлары қабылдайтын дәм мен хош иістің өніммен жасалатын химиялық манипуляцияларға қалай байланысты екенін талқылайды.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференция материалдары ACS мұрағаттарында қолжетімді сессия аннотациялары түрінде жарияланады. Зерттеушілер мен тамақ өнеркәсібі мамандары үшін AGFD сессияларына қатысу — дәмді, хош иісті және тағамдық қоспаларды талдаудың озық әдістері туралы олар бұқаралық өнімге айналғанға дейін біліп алу тәсілі. Хабарландыруларды Америка химиялық қоғамының ресми порталында бақылауға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-acs_agfd.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Taste\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Taste — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"отделение сельскохозяйственной и пищевой химии ACS"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ACS Fall/Spring · AGFD","description":"отделение сельскохозяйственной и пищевой химии ACS","vcsPath":"reference/conferences/conf-acs_agfd.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-acs_agfd.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-acs_agfd.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-acs_agfd.html#takhyryptar-men-sekciyalar","level":2},{"title":"Ол жерде не пайда болады","href":"reference/conferences/conf-acs_agfd.html#ol-zherde-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-acs_agfd.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-acs_agfd.html#derekkoezder","level":2}],"title":"ACS Fall/Spring · AGFD"},"router":{"pathname":"reference/conferences/conf-acs_agfd","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
