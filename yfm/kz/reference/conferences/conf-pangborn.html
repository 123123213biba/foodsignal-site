        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;как люди воспринимают вкус&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;как люди воспринимают вкус&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;Международное научное сообщество сенсорных ученых&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Раз в два года (в нечетные годы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научная конференция (4–5 дней, 800–1000 участников)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальный сайт конференции (выбирается за 2 года до события)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferenciya-ne-turaly\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#konferenciya-ne-turaly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конференция не туралы&lt;/span&gt;&lt;/a&gt;Конференция не туралы&lt;/h2&gt;\n&lt;p&gt;Pangborn Sensory Science Symposium — тағам өнімдерін сенсорлық талдау және тұтынушылардың мінез-құлқын зерттеуге арналған халықаралық ғылыми конференция. Бұл іс-шара дәм, иіс және текстураны қабылдауды талдайтын ғалымдар мен технологтар арасындағы білім алмасу алаңы. Конференция сенсорлық зерттеулер саласының пионері Роуз Мари Пэнгборнның құрметіне аталған.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Симпозиум екі жылда бір рет, әдетте тақ жылдары өткізіледі. Өткізілетін орны екі жыл бұрын таңдалады, бұл әртүрлі елдердің ғылыми қауымдастықтарын қамтуға мүмкіндік береді. Іс-шара орта есеппен 800–1000 қатысушыны жинайды. Ғылыми бағдарлама 4–5 күнге созылады.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Симпозиумның негізгі тақырыптары өнім сапасын бағалау әдістері, қабылдау психологиясы және жаңа тағам технологияларын әзірлеуді қамтиды. Негізгі секцияларға мыналар жатады:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Сенсорлық талдау әдіснамасы: бағалау хаттамаларын талқылау.&lt;/li&gt;\n&lt;li&gt;Тұтынушы ғылымы: тағам таңдауға әсер ететін факторларды зерттеу.&lt;/li&gt;\n&lt;li&gt;Технологиялық инновациялар: өңдеу әдістерінің (мысалы, сублимация немесе ашыту) өнімнің сенсорлық профилін қалай өзгертетінін талдау.&lt;/li&gt;\n&lt;li&gt;Қабылдау физиологиясы: адамның дәм мен иісті қалай анықтайтынын зерттеу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-usynylady\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#onda-ne-usynylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не ұсынылады&lt;/span&gt;&lt;/a&gt;Онда не ұсынылады&lt;/h2&gt;\n&lt;p&gt;Симпозиумда тағам өндірісіне деген көзқарасты өзгертетін зерттеу нәтижелері алғаш рет ұсынылады. Мысалы, сублимация кезінде креветкадағы умами дәмін сақтау немесе якон тамырынан биологиялық процестер арқылы маннит алу әдістері талқыланады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Қатысу үшін зерттеушілер өз жұмыстарының тезистерін ұсынады. Конференцияның ресми ресурстары арқылы алдағы кездесулер мен өткен іс-шаралардың тезистер жинағын бақылап отыруға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-pangborn.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Pangborn_Sensory_Science_Symposium\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pangborn Sensory Science Symposium — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/1541-4337.70197\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Preferred Attribute Elicitation (PAE) in the Sensory Descriptive Analysis of Foods: A Deep Comprehensive Review of the Method Steps, Application, Challenges, and Trends&lt;/a&gt; — шолу, Compr Rev Food Sci Food Saf 2025&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"как люди воспринимают вкус"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Pangborn Sensory Science Symposium","description":"как люди воспринимают вкус","vcsPath":"reference/conferences/conf-pangborn.md"},"headings":[{"title":"Конференция не туралы","href":"reference/conferences/conf-pangborn.html#konferenciya-ne-turaly","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-
