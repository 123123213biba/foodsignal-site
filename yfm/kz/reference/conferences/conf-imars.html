        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-imars.jpg\" alt=\"IMARS — International Maillard Reaction Society\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;тезисы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;International Maillard Reaction Society (IMARS)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Регулярно (симпозиумы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Международная научная конференция&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальные публикации тезисов и сборники материалов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-flavor.html\"&gt;Дәм мен хош иіс&lt;/a&gt;, &lt;a href=\"concepts/spec-thermal.html\"&gt;Пісіру технологиялары&lt;/a&gt;, &lt;a href=\"concepts/spec-safety.html\"&gt;Қауіпсіздік және сақтау&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;IMARS (International Maillard Reaction Society) — Майяр реакциясын зерттеуге арналған халықаралық ғылыми қоғамдастық және симпозиумдар сериясы. Майяр реакциясы — аминқышқылдары мен қанттардың қыздыру кезіндегі өзара әрекеттесуі, бұл хош иісті қосылыстардың, меланоидиндердің және ықтимал ластаушы заттардың түзілуіне әкеледі. Конференция тамақ өндірісінің химиктері, нутрициологтар және азық-түлік қауіпсіздігі мамандары үшін негізгі алаң болып табылады.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-men-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#ujymdastyrushylar-men-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар мен тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар мен тарихы&lt;/h2&gt;\n&lt;p&gt;IMARS қоғамдастығы өнімдердің ферментативті емес қызаруы бойынша іргелі және қолданбалы зерттеулермен айналысатын ғалымдарды біріктіреді. Ұйымның қызметі кептірілген асшаяндардан бастап шоколад экструзиясына дейінгі технологиялық процестердегі реакция механизмдерін жүйелеуге бағытталған.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Симпозиумдардың ғылыми бағдарламасы бірнеше маңызды бағытты қамтиды:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Сенсорлық профиль: Майяр реакциясы өнімдерінің дәміне, хош иісіне және түсіне әсері.&lt;/li&gt;\n&lt;li&gt;Химиялық қауіпсіздік: ультра өңделген өнімдерде акриламид пен басқа да қауіпті қосылыстардың түзілуі.&lt;/li&gt;\n&lt;li&gt;Бақылау технологиялары: өнім сапасын жақсарту үшін реакцияны басқару әдістері.&lt;/li&gt;\n&lt;li&gt;Биологиялық әсерлер: өнімдердің ағзада сіңуі және гликемиялық жауапқа әсері.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;IMARS симпозиумдарында мета-талдаулар, өнімдерді тұрақтандыру бойынша зертханалық тәжірибелер және сақтаудың инновациялық тәсілдері алғаш рет ұсынылады. Қатысушылар теңіз өнімдерінің балғындығын сақтау немесе шоколадтың гликемиялық индексін өзгерту сияқты мәселелерді талқылайды.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Қоғамдастық қызметін тезистер мен конференция материалдарының жинақтары арқылы бақылауға болады. Қатысу өз зерттеулерін ұсынуды көздейді. Бұл тамақ технологиясы саласындағы мамандар үшін химиялық өзгерістерді молекулалық деңгейде бақылау туралы сенімді ақпарат көзі болып табылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-imars.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Mars\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mars — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Mars_-_August_30_2021_-_Flickr_-_Kevin_M._Gill.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Kevin Gill from Los Angeles, CA, United States, CC BY 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"симпозиум по реакции Майяра: вкус, цвет, загрязнители процесса"}],"style":["_assets/biosignal.css"],"script"
