            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"88\" cy=\"72\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"572\" cy=\"271\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SOUS_VIDE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Сұйық түтін мен наноэмульсия&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;су-вид мидиясының сақталуын&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;24 күнге дейін ұзартады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f1.jpg\" alt=\"Топтардың түс талдауының нәтижелері. Control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Топтардың түс талдауының нәтижелері. Control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті; DNS тобы: күнбағыс майы + түтін хош иістендіргіші (майлы ерігіш, 5%) наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Қара теңіз мидиялары өте тез бұзылатындықтан, оларды мұздатпай тасымалдау қиын. Ғалымдар 85 °C-тағы вакуумдық термоөңдеуді сұйық түтін хош иістендіргішімен және күнбағыс наноэмульсиясымен біріктірді. Бұл тосқауыл әдісі липидтердің тотығуын бәсеңдетіп, ұшқыш азоттың жиналуын шектеді және бұлшықет талшықтарының тығыздығын сақтады. Нәтижесінде өнімнің 3 °C тоңазытқышта сақталу мерзімі 24 күнге жетті.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;85 °C &lt;a href=\"concepts/sous-vide.html\"&gt;су-вид&lt;/a&gt;, сұйық түтін және &lt;a href=\"concepts/nanoemulsion.html\"&gt;наноэмульсия&lt;/a&gt; мидияның сақталуын 3 °C-та 18 күннен 24 күнге дейін ұзартады&lt;/li&gt;\n&lt;li&gt;DNS үлгісінде ұшқыш азот (&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt;) шекті 35 мг N/100 г мөлшерінен едәуір төмен деңгейде қалды&lt;/li&gt;\n&lt;li&gt;Ультрадыбыстық наноэмульсия тамшылары қызғанда 190 нм-ге дейін азайып, бұлшықет құрылымын сақтайды&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"rezhimder\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#rezhimder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режимдер&lt;/span&gt;&lt;/a&gt;Режимдер&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Өнім&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тәсіл&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Температура&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Уақыт&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Нәтиже&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Мидия еті (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Тек су-вид (бақылау)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 мин&lt;/td&gt;\n&lt;td&gt;3 °C-та 18 күн сақталады; одан кейін микробиологиялық нормадан асады&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мидия еті (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Су-вид + 5% сұйық түтін (SS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 мин&lt;/td&gt;\n&lt;td&gt;3 °C-та сақтау мерзімі 21 күнге дейін ұзарды; бактериялар өсуі бәсеңдеді&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мидия еті (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Су-вид + майлы наноэмульсия (ANS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 мин&lt;/td&gt;\n&lt;td&gt;3 °C-та 18 күн сақталады; микробиологиялық көрсеткіші бақылаумен бірдей&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мидия еті (Mytilus galloprovincialis)&lt;/td&gt;\n&lt;td&gt;Су-вид + сұйық түтінді наноэмульсия (DNS)&lt;/td&gt;\n&lt;td&gt;85&lt;/td&gt;\n&lt;td&gt;10 мин&lt;/td&gt;\n&lt;td&gt;3 °C-та 24 күн сақталады; TVB-N өте төмен және құрылымы тығыз&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Мидияларды вакуум пакетте 85 °C температурада 10 минут су-вид (sous-vide) әдісімен өңдеу бастапқы микробтарды жойғанымен, таза күйінде (бақылау тобы) 3 °C жағдайында сақтаудың 18-күні бактериялық шектен асып кетеді. Жарамдылық мерзімін жасанды консервантсыз ұзарту үшін зерттеушілер көпсатылы тосқауыл әдісін (&lt;a href=\"concepts/hurdle-technology.html\"&gt;hurdle technology&lt;/a&gt;) таңдады: жұмсақ қыздыру 5%-дық сұйық түтінмен және күнбағыс наноэмульсиясымен (ет пен эмульсия қатынасы 2:1) біріктірілді. Эмульсия су (80%), май (4–14%), Tween 80 тағамдық эмульгаторы (3%) және этанолдан (3%) ультрадыбыстық өңдеу (51% қуат) арқылы дайындалды.&lt;/p&gt;\n&lt;p&gt;Наноэмульсия мен сұйық түтін қосындысы (DNS тобы) жоғары нәтиже көрсетті: термоөңдеу кезінде эмульсия тамшылары 253 нм-ден 190,15 нм-ге дейін кішірейіп, дзета-потенциалы (-24,45-тен +27,10 мВ-қа дейін) тұрақтылықты қамтамасыз етті. Бұл фенолды қосылыстардың ет талшықтарына терең таралуына және ақуыздың ыдырауын тежеуге көмектесті. Сақтаудың 24-күнінде DNS тобындағы жалпы ұшқыш негізді азот (TVB-N) рұқсат етілген 35 мг N/100 г шегінен әлдеқайда төмен болды, ал бақылау тобы 18-күні, тек түтін қосылған үлгілер 21-күні жарамсыз болып қалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәжірибе тек Қара теңіз мидияларына және қатаң 3 °C жағдайында жүргізілді; дәм мен сапаны бағалауға 6 сарапшы қатысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Теңіз өнімдері өсіп келе жатқан жаһандық халық үшін ақуыздың маңызды және тұрақты көзі болып табылады. Су жануарларының әртүрлі түрлерінің ішінде Жерорта теңізі мидиясы (&lt;a href=\"concepts/mediterranean-mussel.html\"&gt;Mytilus galloprovincialis&lt;/a&gt;) жоғары сапалы ақуызы, қанықпаған май қышқылдарының бай профилі және маңызды макро- және микроэлементтерінің арқасында болашақ үшін өте перспективалы азық-түлік көзі болып саналады. Қосжақтаулы моллюскалардың орташа жаһандық тұтынуы жан басына шаққанда 2,6 кг-ды құрайды, ал 2023 жылы моллюскалардың жаһандық өндірісі 25,8 миллион тоннаға жетіп, балық шаруашылығы мен аквакультураның жалпы өнімінің 14%-ын құрады. Осы өсіп келе жатқан сұранысқа байланысты Түркияда соңғы уақытта аквакультура секторында, әсіресе мидия өсіруде қарқынды өсу байқалады. Соңғы бірнеше жыл ішінде мидия өсіру Түркияда форель, теңіз алабұғасы және теңіз шорасынан кейінгі аквакультураның төртінші ең жылдам дамып келе жатқан сегментіне айналды. Сүзгіштік қоректенуіне байланысты мидиялар қоршаған ортаның ластануына өте сезімтал және тез бұзылады; тоңазытқышта сақтау кезінде бұл өнімнің жарамдылық мерзімі микробтық бұзылу және патогенді бактериялардың көбеюіне байланысты 1-2 күннен 5-6 күнге дейін қатаң шектелген. Сонымен қатар, өңдеу кезінде гигиеналық стандарттарды сақтамау патогенді микробтық жүктемені арттырып, бұзылуды жеделдетуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мидиялар — ақуыздың құнды көзі, бірақ сүзгіштік қоректенуі және жоғары ылғалдылығына байланысты олар тез бұзылады (сақтау мерзімі 1–6 күн), бұл консервация технологияларын қолдануды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тұтынушылардың максималды тағамдық құндылықты сақтайтын жаңа, минималды өңделген теңіз өнімдеріне деген сұранысының артуына байланысты жұмсақ термиялық өңдеу әдістері көбірек қолданылуда. Жұмсақ термиялық өңделген және салқындатылған өнімдер микробтық қауіпсіздік бойынша қоғамда алаңдаушылық тудыруы мүмкін болса да, Еуропалық Одақ патогенсіз теңіз өнімдерін қамтамасыз ету үшін 10–30 минут ішінде 60–95 °C температурада термиялық өңдеуді ұсынады. Сонымен қатар, мидия етінің жоғары ылғалдылығы оның сақтау мерзімін шектейді, бұл жергілікті емес аймақтарға таратуға кедергі келтіреді, бұл сақтау мерзімін ұзарту және жаңа тұтынушылық нарықтарға шығу үшін өңдеу технологияларының қажеттілігін көрсетеді. Алайда, мұздату сияқты дәстүрлі консервация әдістері сенсорлық сипаттамаларды, әсіресе текстура мен дәмді төмендетіп, жалпы сапаға нұқсан келтіруі мүмкін. Бұл саладағы маңызды олқылықты көрсетеді және нарыққа жоғары сапалы мидия өнімдерін ұсыну үшін қауіпсіз, көп мақсатты тосқауылдық (hurdle) консервация стратегияларын әзірлеуді талап етеді.&lt;/p&gt;\n&lt;p&gt;Мидияның сақтау мерзімін қауіпсіз ұзарту және жаңа күйіндегі сенсорлық сипаттамаларын сақтау үшін әртүрлі әдістер, соның ішінде пісіру/вакуумдық орау, ыстау, консервілеу, қуыру/пісіру және қызыл тұздықта пастерлеу қолданылды. Шикі мидия еті тез бұзылатындықтан, термиялық өңдеу міндетті болып табылады және сапаны оңтайландыру үшін нақты температура-уақытты реттеуді талап етеді. Осы тұрғыда, су-вид (SV) термиялық өңдеу — вакуумдық оралған тағамдарды нақты бақыланатын параметрлерде пісіру — қоректік заттардың жоғалуын азайтады, сонымен бірге бұзылу ферменттері мен микроорганизмдерді инактивациялайды. Бұл 100 °C-тан төмен температурада пісіруді, 0–3 °C-қа дейін тез салқындатуды және салқындатылған күйде сақтауды қамтитын «cook-chill» технологияларымен сәйкес келеді. Мидиялар үшін 85 °C температурада 10 минут бойы SV өңдеу ұсынылады; алайда, протеолитикалық емес Clostridium botulinum штаммдары 3,3 °C температурада 31 күн ішінде токсиндер шығаруы мүмкін болғандықтан, SV өңделген теңіз өнімдерінің сақтау мерзімі әдетте 28 күнмен шектеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Су-вид (sous-vide) әдісі — бұл тағамды вакуумдық қаптамада қатаң бақыланатын температурада пісіру, бұл текстура мен қоректік заттарды сақтауға мүмкіндік береді, бірақ қауіпсіздік үшін температуралық режимді сақтауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұны жеңу және консервацияны күшейту үшін патогендерді инактивациялайтын сұйық түтін фракцияларын интеграциялауға болады. Биомасса пиролизі арқылы алынған сұйық түтін құрамында антибактериалды және антиоксидантты белсенділік арқылы өнімнің дәмін, түсін, pH және сақтау мерзімін анықтайтын карбонилдер мен фенолдар бар. Дәстүрлі ыстауға қарағанда полициклді ароматты көмірсутектердің (ПАУ) аз жиналуымен қауіпсіз, стандартталатын балама ұсына отырып, ол бүрку, батыру немесе тікелей қосу арқылы қолданылады. Теңіз өнімдерінде мұндай биоактивті микробқа қарсы құралдарды жеткізуді және тиімділігін одан әрі оңтайландыру үшін наноэмульсиялық жүйелер өте күрделі тәсіл ретінде пайда болды. Бұл жүйелер микробқа қарсы белсенділікті тиімді арттырады және ұшпа эфир майларын тағамдық матрицаларға енгізуді жеңілдетеді, олардың микроорганизмдер белсенді көбейетін аймақтарда таралуын арттырады. Жақында наноэмульсияларды су өнімдеріне қолдану айтарлықтай қарқын алды. Қолда бар әдебиеттер наноэмульсиялардың негізінен форель, теңіз шорасы және теңіз алабұғасы сияқты өсірілетін балық түрлерінде қолданылатынын және зерттеулер бұл өнімдердің сақтау мерзімін ұзартудағы тиімділігін үнемі көрсетіп келе жатқанын көрсетеді. Алайда, біздің білуімізше, ешқандай әдебиетте қосжақтаулы моллюскаларда, атап айтқанда мидияларда наноэмульсия, сұйық түтін және SV өңдеуді біріктірудің синергетикалық әсері зерттелмеген. Әдебиеттегі олқылықты толтыру үшін бұл зерттеуде мидияны консервациялау үшін көп мақсатты тосқауылдық технология ретінде сұйық түтін хош иістендіргіші мен наноэмульсиялық қосымшаларды SV термиялық өңдеумен қатар интеграциялау жан-жақты бағаланды. Мидиялар (6–7 см) осы инновациялық әдістердің әртүрлі комбинацияларымен өңделді және 3 °C температурада 27 күнге дейін жүйелі түрде сақталды. Консервация тиімділігі және оның негізіндегі синергетикалық әсерлер кешенді, көп параметрлі жүйе арқылы тексерілді; бұған еттің pH көрсеткіші, түсінің өзгеруі, сенсорлық сипаттамалар, жалпы ұшпа негізгі азоттың (TVB-N) жиналуы, FFA түзілуі және микробиологиялық жүктеме сияқты макро-сапа көрсеткіштерін бақылау кіреді. Маңыздысы, өңдеудің тағамдық матрицаға әсерін тереңірек түсіну үшін тіндердің құрылымдық тұтастығы мен молекулалық сипаттамасы сканерлеуші электронды микроскопия (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;) және Фурье-трансформ инфрақызыл (&lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;FT-IR&lt;/a&gt;) спектроскопиясы арқылы тексерілді.&lt;/p&gt;\n&lt;p&gt;Талдау деңгейіндегі химиялық заттар қолданылды: бор қышқылы (CAS 10043-35-3), магний оксиді (CAS 1309-48-4), PCA (PCA, 105463.0500), күшейтілген клостридиалды агар (RCM, 105411.0500), күлгін қызыл өт агары (VRBA, 101406.0500), пептон, натрий хлориді (Merck, DE); этанол (99,5%, Carlo Erba Regents, FR); Таширо индикаторы, фенолфталеин (ChemBio, TR); сұйық парафин (QLP, TR); тұз қышқылы (Honeywell Fluka, AT); калий гидроксиді (AFG Bioscience, АҚШ); диэтил эфирі (Isolab Chemicals, DE); картоп декстроза агары (PDA, Biolife, IT); майда еритін сұйық түтін (Alfasol, TR); Твин 80 (Sigma-Aldrich, DE).&lt;/p&gt;\n&lt;p&gt;Барлығы 77 кг жаңа, тірі Жерорта теңізі мидиялары (Mytilus galloprovincialis, қабық ұзындығы 6–7 см) 2025 жылдың сәуірінде Қара теңіздің Синоп жағалауында орналасқан коммерциялық аквакультура шаруашылығынан жиналды (А сыныпты санитарлық жіктеу). Жинау механикаландырылған мидия жинайтын кеме арқылы жүзеге асырылды. Жиналғаннан кейін мидиялар азық-түлік деңгейіндегі полиэтилен торлы қаптарға салынып, дереу таза теңіз суы мен ұсақталған мұз (0–2 °C) толтырылған оқшауланған ыдыстарға ауыстырылды. Теңіз платформасынан зертханаға тасымалдау шамамен 40 минут ішінде жүзеге асырылды. Зертханаға келгенде мидиялар дереу тексерілді; қабығы жарылған немесе өлі үлгілер алынып тасталды, тірілері таза су (4 ± 1 °C) астында тазартылды. Қабықты ашу процесі үшін мидиялар 100 °C қайнаған суға 2 минутқа батырылды, содан кейін еті бөлініп алынды және биссус жіптері алынып тасталды. Зерттеуде барлығы 9650 г мидия еті пайдаланылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу үшін тек тірі, зақымдалмаған мидиялар пайдаланылды, олар алдын ала термиялық өңдеуден өтіп, асептикалық жағдайда қапталды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наноэмульсиялар (NA және ND) Hamouda және т.б. қолданған әдіс негізінде дайындалды. NA құрамы: 80% дистилденген су, 14% күнбағыс майы, 3% этанол, 3% Твин 80. ND құрамы: 80% су, 4% май, 3% этанол, 3% Твин 80 және 10% сұйық түтін. Ингредиенттер магниттік араластырғышта (900 rpm, 30 минут) араластырылды, ND үшін сұйық түтін қосылды (тағы 15 минут). Қоспалар 86 °C-та 1 сағат бойы сақталды, суытылды, дистилденген су қосылды және ультрадыбыстық зонд (HD 2200, Bandelin Sonopuls, Германия) көмегімен 15 минут бойы гомогенделді. Наноэмульсиялар дайындалғаннан кейін, 4 °C-та сақтау алдында UV шам астында 20 минут бойы зарарсыздандырылды.&lt;/p&gt;\n&lt;p&gt;Мидия еті 100 г-нан қапталды. ANS және DNS топтарында ет пен наноэмульсия қатынасы 2:1 етіп таңдалды. Қаптау Abant MG42 вакуумдық қаптау машинасымен (95% вакуум) жүзеге асырылды. SV процесі 85 °C-та 10 минут бойы (PackTech IPX7) жүзеге асырылды. SV-ден кейін пакеттер мұзды суда 10 минут суытылды және 27 күн бойы +3 °C-та сақталды. Топтар: Control (тек SV), SS (5% сұйық түтін + SV), ANS (күнбағыс майы наноэмульсиясы + SV), DNS (күнбағыс майы + 5% сұйық түтін наноэмульсиясы + SV).&lt;/p&gt;\n&lt;p&gt;Төмендегілер талданды: дзета-потенциал, бөлшек өлшемі (DLS), pH (WTW ProfiLine 3110), түс (CIE L&lt;em&gt;a&lt;/em&gt;b*, Konica Minolta CR-400), TVB-N (Лудорф пен Мейер әдісі), еркін май қышқылдары (AOAC әдісі), текстура (Brookfield CT3), SEM (FEI Quanta FEG 250), FTIR (Bruker Alpha II). Микробиологиялық көрсеткіштер: мезофильді және психрофильді аэробты бактериялар (PCA), анаэробты бактериялар (RCA), зең мен ашытқылар (PDA), колиформды бактериялар (VRBA). Сенсорлық бағалау 5 балдық шкала бойынша 6 оқытылған сарапшы тарапынан жүзеге асырылды. Статистика: Tukey HSD (p &amp;lt; 0,05), ANOVA, PCA (R 4.5.2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f1.jpg\" alt=\"Топтардың түс талдауының нәтижелері. Control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Топтардың түс талдауының нәтижелері. Control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті; DNS тобы: күнбағыс майы + түтін хош иістендіргіші (майлы ерігіш, 5%) наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f2.jpg\" alt=\"Топтардың pH, TVB-N, FFA талдауының нәтижелері. Control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Топтардың pH, TVB-N, FFA талдауының нәтижелері. Control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті; DNS тобы: күнбағыс майы + түтін хош иістендіргіші (майлы ерігіш, 5%) наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f3.jpg\" alt=\"Топтардың текстурасын талдау нәтижелері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Топтардың текстурасын талдау нәтижелері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Топтардың текстурасын талдау нәтижелері. Графиктегі әртүрлі кіші әріптер бір топ ішінде сақтау кезінде байқалған топтық айырмашылықтарды көрсетеді (p &amp;lt; 0,05). Control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті; DNS тобы: күнбағыс майы + түтін хош иістендіргіші (майлы ерігіш, 5%) наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті. (a) Қаттылық, (b) адгезия, (c) серпімділік (resilience), (d) серіппелілік (springiness), (e) когезия, (f) шайнау қабілеті.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f4.jpg\" alt=\"Топтар мен шикі мидияның СЭМ кескіндері ((a) шикі мидия еті\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Топтар мен шикі мидияның СЭМ кескіндері ((a) шикі мидия еті&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Топтар мен шикі мидияның СЭМ кескіндері ((a) шикі мидия еті, (b) 0-күн, control, (c) 27-күн, control, (d) 0-күн, ANS, (e) 27-күн, ANS, (f) 0-күн, DNS, (g) 27-күн, DNS, (h) 0-күн, SS, (i) 27-күн, SS). Control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті; DNS тобы: күнбағыс майы + түтін хош иістендіргіші (майлы ерігіш, 5%) наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f5.jpg\" alt=\"Топтардың 0 және 27-күндердегі нақты FTIR спектрлері (a және b).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Топтардың 0 және 27-күндердегі нақты FTIR спектрлері (a және b).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Топтардың 0 және 27-күндердегі нақты FTIR спектрлері (a және b). Амид I аймағының егжей-тегжейлі көрінісі (c). Амид I аймағындағы екінші туындылардың қарқындылығы (d). Амид I аймағындағы екінші реттік құрылым қатынастарының Гаусс деконволюциясы (e). (Raw: жаңа мидия еті, control: тек SV-ге ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті; DNS тобы: күнбағыс майы + түтін хош иістендіргіші (майлы ерігіш, 5%) наноэмульсиясымен өңделген және SV-ге ұшыраған мидия еті).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f6.jpg\" alt=\"Топтардың микробиологиялық талдау нәтижелері (лог КОЕ г−1).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Топтардың микробиологиялық талдау нәтижелері (лог КОЕ г−1).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Топтардың микробиологиялық талдау нәтижелері (лог КОЕ г−1). (a) Мезофильді аэробты бактериялардың жалпы саны (TMAB), (b) психрофильді аэробты бактериялардың жалпы саны (TPAB), (c) анаэробты бактериялардың жалпы саны (TAN) және (d) ашытқы мен зең саңырауқұлақтарының жалпы саны (TYM). Control: тек вакуумдық қаптамаға (SV) ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV процесінен өткен мидия еті; DNS: күнбағыс майы + түтін хош иістендіргіші (майлы ерітінді, 5%) наноэмульсиясымен өңделген және SV процесінен өткен мидия еті.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f7.jpg\" alt=\"Шикі мидия етіне арналған сенсорлық талдау нәтижелері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Шикі мидия етіне арналған сенсорлық талдау нәтижелері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f8.jpg\" alt=\"Пісірілген топтардың сенсорлық талдау нәтижелері. Control: тек вакуумдық қаптамаға (SV) ұшыраған мидия еті; SS: сұйық тү\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Пісірілген топтардың сенсорлық талдау нәтижелері. Control: тек вакуумдық қаптамаға (SV) ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV процесінен өткен мидия еті; DNS: күнбағыс майы + түтін хош иістендіргіші (майлы ерітінді, 5%) наноэмульсиясымен өңделген және SV процесінен өткен мидия еті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f9.jpg\" alt=\"Сапа параметрлерінің (OA, TVB-N, FFAs, TMAB, TAN, TPB және TYM) өңдеу топтарына әсерін көпфакторлы талдау. Control: тек \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сапа параметрлерінің (OA, TVB-N, FFAs, TMAB, TAN, TPB және TYM) өңдеу топтарына әсерін көпфакторлы талдау. Control: тек вакуумдық қаптамаға (SV) ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV процесінен өткен мидия еті; DNS: күнбағыс майы + түтін хош иістендіргіші (майлы ерітінді, 5%) наноэмульсиясымен өңделген және SV процесінен өткен мидия еті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif-f10.jpg\" alt=\"Сақтау кезіндегі сапаның нашарлауы — PCA траекториялық талдауы. Control: тек вакуумдық қаптамаға (SV) ұшыраған мидия еті\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сақтау кезіндегі сапаның нашарлауы — PCA траекториялық талдауы. Control: тек вакуумдық қаптамаға (SV) ұшыраған мидия еті; SS: сұйық түтінмен өңделген және SV процесінен өткен мидия еті; ANS: күнбағыс майының наноэмульсиясымен өңделген және SV процесінен өткен мидия еті; DNS: күнбағыс майы + түтін хош иістендіргіші (майлы ерітінді, 5%) наноэмульсиясымен өңделген және SV процесінен өткен мидия еті.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мидия өте тез&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұзылады&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;85 °C су-вид,&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;түтін және&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эмульсия&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сақтау мерзімі&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;24 күнге жетті&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қоспасыз&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қауіпсіз теңіз&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өнімі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын RSC advances журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;RSC advances (Europe PMC)&lt;/td&gt;\n&lt;td&gt;sous_vide&lt;/td&gt;\n&lt;td&gt;CC BY-NC 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Kocatepe D, Corapci B, Köstekli B, Altan CO, Başkan S, Çelik MY.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-04/comprehensive-control-of-quality-deterioration-and-shelf-lif.html#derekkoezder\" class=\"yfm-anch
