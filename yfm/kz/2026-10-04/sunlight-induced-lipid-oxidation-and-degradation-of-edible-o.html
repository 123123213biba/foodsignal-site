        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"263\" cy=\"171\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"517\" cy=\"179\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жарықта тұрған етті май&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;күткеннен де тез бұзылады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f1.jpg\" alt=\"(a) Көрінетін жарықпен сәулелендіру кезіндегі фотототығу барысында «өсімдік майы — эритроциттер» жүйесінің УК-көрінетін \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Көрінетін жарықпен сәулелендіру кезіндегі фотототығу барысында «өсімдік майы — эритроциттер» жүйесінің УК-көрінетін спектріндегі өзгерістер және сақталған эритроциттердің үлесі. (b) Фотототығу кезіндегі асқын тотық санының (АТС) уақытқа байланысты өзгеруі. Әртүрлі бас әріптер Дунканның көп ауқымды критерийі бойынша статистикалық маңызды айырмашылықтарды көрсетеді (p &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Қандағы гемоглобиннің тіпті шамалы қалдығы күн сәулесі түскенде өсімдік майын тез бұзады. Канола майының сулы эмульсиясында қан ақуызы мен жарық небәрі 2,5 сағатта тотығуды шарықтатып жіберді. Май қышқылдарының ыдырауы синглетті оттек пен бос радикалдардың қатар түзілуінен жүретіні анықталды. Бұл құбылыс ет маринадтарын сақтау үшін аса маңызды және майлы ағынды суларды тазартуға жол ашады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Жарық пен &lt;a href=\"concepts/hemoglobin.html\"&gt;гемоглобин&lt;/a&gt; 2,5 сағатта тотық санын 9,7 мэкв/кг-ға жеткізді&lt;/li&gt;\n&lt;li&gt;Қанықпаған байланыстардың 30%-дан астамы бұзылып, &lt;a href=\"concepts/malondialdehyde.html\"&gt;МДА&lt;/a&gt; альдегиді түзілді&lt;/li&gt;\n&lt;li&gt;Тотығуды BHT антиоксиданты мен синглетті оттек тұзақтары бәсеңдетеді&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу барысында канола майы (2% v/v) мен қой қанының эритроциттер суспензиясы (ақуыз шамамен 1,0 мг/мл) қоспасы 25 °C-та күн симуляторының (380–780 нм, 59 660 лк) жарығымен 2,5 сағат бойы ауа үрлене отырып сәулелендірілді. Нәтижесінде асқын тотық саны (АТС) іздік мәннен 9,7 мэкв O2/кг деңгейіне дейін секірді, ал қараңғыда немесе гемоглобинсіз бұл өзгеріс байқалмады. 61 200 лк табиғи күн сәулесінде бұл көрсеткіш 10,5 мэкв O2/кг-ға жетті.&lt;/p&gt;\n&lt;p&gt;6 сағаттық сәулелендіруден соң 1H ЯМР талдауы винилді протондардың 31,2%-ға, ал бис-аллилді протондардың 36,9%-ға азайғанын көрсетті, бұл қанықпаған май қышқылдарының күйрегенін дәлелдейді. Сондай-ақ 9,5 ppm тұсында уытты малонді диальдегидтің (МДА) түзілгенін білдіретін сигнал анықталды. Бутилгидрокситолуол (BHT, 0,0016 ммоль) антиоксидантын қосу АТС мәнін 3,8 мэкв/кг-ға дейін, ал натрий азидін (NaN3) қосу 3,1 мэкв/кг-ға дейін төмендетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәжірибе су мен ацетонитрил (9:1) қосылған модельдік ортада жасалғандықтан, таза майдағы немесе күрделі тағам құрамындағы жағдайды толық көрсетпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"suretter\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#suretter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Суреттер&lt;/span&gt;&lt;/a&gt;Суреттер&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f2.jpg\" alt=\"(a) Өсімдік майының эритроциттер қатысында фотототығуға дейінгі және (b) кейінгі 1H ЯМР спектрлері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Өсімдік майының эритроциттер қатысында фотототығуға дейінгі және (b) кейінгі 1H ЯМР спектрлері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f3.jpg\" alt=\"(a) Эритроциттер қатысында сәулелендіруге дейінгі және кейінгі антраценнің УК-көрінетін аймақтағы жұтылу спектрлері. (b)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Эритроциттер қатысында сәулелендіруге дейінгі және кейінгі антраценнің УК-көрінетін аймақтағы жұтылу спектрлері. (b) Синглетті оттекпен (1O2) антраценнің фотооксигенденуінің сызбалық көрінісі. Әртүрлі бас әріптер Дунканның көп ауқымды критерийі бойынша статистикалық маңызды айырмашылықтарды көрсетеді (p &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o-f4.jpg\" alt=\"Синглетті оттектің түзілуін және феррил/радикалды тотығу жолын қамтитын өсімдік майының гемоглобин арқылы жүретін фотото\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Синглетті оттектің түзілуін және феррил/радикалды тотығу жолын қамтитын өсімдік майының гемоглобин арқылы жүретін фотототығуының ұсынылған механизмдері.&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-04/sunlight-induced-lipid-oxidation-and-degradation-of-edible-o.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Майдың қан мен&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жарықта&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұзылуы&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Эмульсияны&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жарықпен&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сәулелендіру&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;r
