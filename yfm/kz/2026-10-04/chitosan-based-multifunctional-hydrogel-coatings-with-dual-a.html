        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"207\" cy=\"135\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"653\" cy=\"265\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Қызанақ пен цитрустарды&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;шіруден қорғайтын&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;көрінбейтін хитозан&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қабықшасы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f1.jpg\" alt=\"CTS-ZnO&amp;amp;CA гидрогелінің морфологиялық талдауы. CTS-ZnO&amp;amp;CA гидрогелінің СЭМ-кескіндері: (A) көлденең қима, (B) бойлық қим\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;&lt;a href=\"concepts/biopolimery.html\"&gt;CTS&lt;/a&gt;-ZnO&amp;amp;CA гидрогелінің морфологиялық талдауы. CTS-ZnO&amp;amp;CA гидрогелінің СЭМ-кескіндері: (A) көлденең қима, (B) бойлық қима. CTS-ZnO&amp;amp;CA гидрогелінің көлденең қимасының СЭМ-кескіндері (C) және сәйкес (D–G) карталау (оттегі — жасыл, көміртегі — көк, мырыш — қызыл, азот — қызғылт сары) және (H) ЭДС-спектрі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Жаңа жиналған көкөністер мен жемістердің үштен бірі микробтар мен тотығу салдарынан бұзылады. Зерттеушілер &lt;a href=\"concepts/chitosan.html\"&gt;хитозан&lt;/a&gt;, мырыш оксидінің нанобөлшектері және хлороген қышқылы негізінде көпфункционалды гидрогель жасап шығарды. Қабат бактерияларды жойып, өнімнің құрғап кетуіне жол бермейді. Тәжірибеде өңделген қызанақ пен цитрустар табиғи сапасын ұзақ уақыт бойы жоғалтпады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Хитозан, ZnO және хлороген қышқылынан құралған гидрогель тотығу мен микробтардан қорғайды.&lt;/li&gt;\n&lt;li&gt;Қоспа ROS түзу және мырыш иондары арқылы MDR S. aureus пен &lt;a href=\"concepts/pseudomonas-aeruginosa.html\"&gt;P. aeruginosa&lt;/a&gt; қабықшаларын жояды.&lt;/li&gt;\n&lt;li&gt;Қаптама қызанақтың салмақ жоғалтуын азайтып, цитрус жемістерінің шіруіне жол бермейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жеміс-жидектердің ерте бұзылуы көбінесе тотығу мен Pseudomonas aeruginosa және тұрақты Staphylococcus aureus (MDR S. aureus) сияқты қоздырғыштардың әсерінен болады. Бұл мәселені шешу үшін хитозан, мырыш оксиді (ZnO) және итмұрыннан бөлінген хлороген қышқылы (CA) 1:0,1:0,1 массалық қатынасында біріктіріліп, CTS-ZnO&amp;amp;CA гидрогелі алынды. Құрылымды тұрақтандыру үшін 50%-дық &lt;a href=\"concepts/beta-glycerophosphate.html\"&gt;бета-глицерофосфат&lt;/a&gt; (β-GP) қосылып, біртекті кеуекті қорғаныс қабаты жасалды.&lt;/p&gt;\n&lt;p&gt;Бактерияға қарсы әсер кешенді сипатқа ие: ZnO нанобөлшектері оттегінің белсенді формаларын (ROS) түзіп және Zn²⁺ иондарын бөліп, бактерия мембраналарын зақымдайды әрі биоқабықшаларды ыдыратады. Хлороген қышқылы тотығуға тосқауыл қойып, антиоксиданттық қорғанысты қамтамасыз етеді. Тәжірибе нәтижесінде гидрогель қызанақтардың ылғал жоғалтуын айтарлықтай тежеп, қабығы зақымдалған цитрустардағы шіру ошақтарының ұлғаюын тоқтатты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс тек зертханалық ортада жасанды жұқтыру арқылы тексерілген, ал нанокомпоненттердің қауіпсіздігі нақты өндірістік желілерде қосымша дәлелдеуді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Жаһандық халық санының өсуі мен технологиялық прогресс қауіпсіз және сапалы азық-түлік өнімдеріне деген сұранысты арттыруда. Өндіріс технологияларының жетілдірілуіне қарамастан, азық-түліктің бұзылуы өзекті мәселе болып қалуда. Жыл сайын әлемде 1 трлн кг-нан астам азық-түлік ысырап болады, оның шамамен үштен бірі сақтау және тасымалдау кезіндегі микробтық ластану немесе тотығу реакцияларына байланысты. Әсіресе жемістер мен көкөністер сияқты тез бұзылатын өнімдер температура мен ылғалдылықтың өзгеруіне өте сезімтал.&lt;/p&gt;\n&lt;p&gt;Бұзылудың негізгі себептері — микробтық ластану (мысалы, Staphylococcus aureus және Pseudomonas aeruginosa) және қоректік заттардың тотығуы. Дәстүрлі консерванттар дәмге әсер етіп, денсаулыққа қауіп төндіруі мүмкін. Соңғы жылдары «жасыл химия» және табиғи полисахаридтер (хитозан, &lt;a href=\"concepts/sodium-alginate.html\"&gt;альгинат&lt;/a&gt;, каррагинан) негізіндегі микробқа қарсы және антиоксиданттық қасиеттері бар құралдар перспективалы бағыт болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хитозан негізіндегі (CTS-ZnO&amp;amp;CA) гидрогельді жабын, құрамында хлороген қышқылы (CA) және мырыш оксиді (ZnO) нанобөлшектері бар, бактериялардың өсуін тиімді басады және тотығуды баяулатып, жемістердің сақталу мерзімін ұзартады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зертханалық модель болып табылады: жабынның тиімділігі бақыланатын жағдайда қызанақ пен цитрус жемістерінде тексерілген, бұл өнеркәсіптік ауқымда қолдану үшін қосымша сынақтарды қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ZnO нанобөлшектерін синтездеу 260 °C-та термиялық ыдырау әдісімен жүзеге асырылды. CTS-ZnO&amp;amp;CA гидрогелі хитозанды (CTS), β-глицерофосфатты (β-GP), ZnO нанобөлшектерін және хлороген қышқылын (CA) 1:0,1:0,1 массалық қатынаста араластыру арқылы алынды. Микробқа қарсы белсенділік MDR S. aureus және P. aeruginosa-ға қарсы бағаланды. Цитотоксикалық қасиеті мезенхималық діңгекті жасушалар (MSC) мен өкпе обыры жасушаларында (NCI-H1299) CCK-8 жиынтығының көмегімен тексерілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сорпадағы микросұйылту әдісі (broth microdilution) ең төменгі тежеуші концентрацияны (МИК) — бактериялардың өсуін тоқтататын заттың ең аз мөлшерін анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Физика-химиялық талдаулар (&lt;a href=\"concepts/scanning-electron-microscopy.html\"&gt;SEM&lt;/a&gt;, XPS, &lt;a href=\"concepts/fourier-transform-infrared-spectroscopy.html\"&gt;FT-IR&lt;/a&gt;) гидрогельдің 10–30 мкм кеуекті құрылымы бар екенін және ZnO нанобөлшектерінің біркелкі таралғанын растады. Гемоүйлесімділік сынақтары 500 мкг/мл концентрацияда да гидрогель эритроциттердің гемолизін тудырмайтынын көрсетті. Цитотоксикалық тесттер MSC және NCI-H1299 жасушаларының тіршілік қабілеті 95%-дан жоғары екенін растады.&lt;/p&gt;\n&lt;p&gt;Микробқа қарсы белсенділік: екі штамм үшін де МИК 250 мкг/мл, МБК (ең төменгі бактерицидтік концентрация) 500 мкг/мл құрады. Әсер ету механизмі биофильмдерді бұзу, мембрананы зақымдау (нуклеин қышқылдарының сыртқа шығуымен расталған) және реактивті оттегі түрлерінің (ROS) түзілуі арқылы тотығу стрессін тудыруды қамтиды.&lt;/p&gt;\n&lt;p&gt;Қызанақтарда қолданылуы CTS-ZnO&amp;amp;CA жабынының салмақ жоғалтуды айтарлықтай азайтатынын және бақылау тобымен салыстырғанда бұзылуды баяулататынын көрсетті. Антиоксиданттық белсенділік DPPH және ABTS тесттерімен расталды. P. aeruginosa-мен зақымдалған цитрус жемістерінің моделінде жабын зақымдалған аймақтардың кеңеюін тиімді шектеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f1.jpg\" alt=\"CTS-ZnO&amp;amp;CA гидрогелінің морфологиялық талдауы. CTS-ZnO&amp;amp;CA гидрогелінің СЭМ-кескіндері: (A) көлденең қима, (B) бойлық қим\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA гидрогелінің морфологиялық талдауы. CTS-ZnO&amp;amp;CA гидрогелінің СЭМ-кескіндері: (A) көлденең қима, (B) бойлық қима. CTS-ZnO&amp;amp;CA гидрогелінің көлденең қимасының СЭМ-кескіндері (C) және сәйкес (D–G) карталау (оттегі — жасыл, көміртегі — көк, мырыш — қызыл, азот — қызғылт сары) және (H) ЭДС-спектрі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f2.jpg\" alt=\"CTS-ZnO&amp;amp;CA гидрогелінің XPS-спектрлері. (A) Шолу спектрі, (B) O 1s, (C) C 1s, (D) Zn 2p, (E) N 1s және (F) P 2p спектрле\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA гидрогелінің XPS-спектрлері. (A) Шолу спектрі, (B) O 1s, (C) C 1s, (D) Zn 2p, (E) N 1s және (F) P 2p спектрлері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f3.jpg\" alt=\"CTS-ZnO&amp;amp;CA гидрогелінің гемолитикалық талдау кескіндері мен талдауы. (A және E) CTS үшін гемолитикалық талдау кескіндері\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA гидрогелінің гемолитикалық талдау кескіндері мен талдауы. (A және E) CTS үшін гемолитикалық талдау кескіндері мен салыстырмалы гемолиз көрсеткіштері, (B және F) CA үшін, (C және G) ZnO үшін, (D және H) CTS-ZnO&amp;amp;CA гидрогелі үшін.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f4.jpg\" alt=\"CTS-ZnO&amp;amp;CA гидрогелінің цитоуыттылығын бағалау. CTS-ZnO&amp;amp;CA-ның MSC жасушаларына (A және B) және NCI-H1299 жасушаларына (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA гидрогелінің цитоуыттылығын бағалау. CTS-ZnO&amp;amp;CA-ның MSC жасушаларына (A және B) және NCI-H1299 жасушаларына (C және D) 12 және 24 сағаттық әсерінен кейінгі цитоуытты әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f5.jpg\" alt=\"CTS-ZnO&amp;amp;CA гидрогелінің бактерияға қарсы белсенділігін бағалау. CTS-ZnO&amp;amp;CA-ның (A) MDR S. aureus және (B) P. aeruginosa-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA гидрогелінің бактерияға қарсы белсенділігін бағалау. CTS-ZnO&amp;amp;CA-ның (A) MDR S. aureus және (B) P. aeruginosa-ға қарсы бактерияға қарсы әсері және (C және D) олардың сәйкес бактерияға қарсы көрсеткіштері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f6.jpg\" alt=\"CTS-ZnO&amp;amp;CA гидрогелінің бактерияға қарсы механизмін бағалау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA гидрогелінің бактерияға қарсы механизмін бағалау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;CTS-ZnO&amp;amp;CA гидрогелінің бактерияға қарсы механизмін бағалау. (A) MDR S. aureus және P. aeruginosa биофильмдерінің CTS-ZnO&amp;amp;CA әртүрлі концентрацияларымен өңделгеннен кейінгі микроскопиялық кескіндері. (B) Кристаллды күлгін түспен боялған биофильмдердің CLSM үш өлшемді проекциялары. (C) CTS-ZnO&amp;amp;CA-ның MDR S. aureus және P. aeruginosa-ға қарсы биофильмді жою деңгейі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f7.jpg\" alt=\"CTS-ZnO&amp;amp;CA әртүрлі концентрацияларымен өңделгеннен кейінгі (A) MDR S. aureus және (B) P. aeruginosa-дағы нуклеин қышқылд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;CTS-ZnO&amp;amp;CA әртүрлі концентрацияларымен өңделгеннен кейінгі (A) MDR S. aureus және (B) P. aeruginosa-дағы нуклеин қышқылдарының сыртқа шығу деңгейі. CTS-ZnO&amp;amp;CA-мен өңдеуден кейінгі (C) MDR S. aureus және (D) P. aeruginosa-дағы жасушаішілік АФК деңгейі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f8.jpg\" alt=\"Сақтау кезінде қызанақтардағы әртүрлі жабындардың сақталу тиімділігі мен антиоксиданттық белсенділігі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сақтау кезінде қызанақтардағы әртүрлі жабындардың сақталу тиімділігі мен антиоксиданттық белсенділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Сақтау кезінде қызанақтардағы әртүрлі жабындардың сақталу тиімділігі мен антиоксиданттық белсенділігі. (A) CTS-ZnO&amp;amp;CA бактерияға қарсы гидрогельді жабынын қолдану арқылы қызанақты сақтау процесінің схемалық иллюстрациясы. (B) Бөлме температурасында 14 күнге дейін сақтау кезінде бақылау тобы, CTS, ZnO&amp;amp;CA және CTS-ZnO&amp;amp;CA жабындарымен өңделген қызанақтардың сыртқы түрінің өзгеруін көрсететін репрезентативті фотосуреттер. (C) Сақтау кезінде қызанақтардың салмақ жоғалту жылдамдығының өзгеруі. CTS-ZnO&amp;amp;CA-ның екі түрлі бос радикалға қарсы механизмі, сіңіру профильдері және тазарту қабілеті: (D) DPPH, (E) ABTS (n = 3).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a-f9.jpg\" alt=\"P. aeruginosa-мен зақымданған цитрус жемістеріндегі әртүрлі өңдеу әдістерінің in vivo коррозияға қарсы және бактерияға қ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;P. aeruginosa-мен зақымданған цитрус жемістеріндегі әртүрлі өңдеу әдістерінің in vivo коррозияға қарсы және бактерияға қарсы тиімділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;P. aeruginosa-мен зақымданған цитрус жемістеріндегі әртүрлі өңдеу әдістерінің in vivo коррозияға қарсы және бактерияға қарсы тиімділігі. (A) Цитрус жемістерін in vivo зақымдау және өңдеу процедурасының схемалық иллюстрациясы. (B) 37 °C температурада 15 күн сақтау кезінде бақылау тобы, CTS, ZnO&amp;amp;CA және CTS-ZnO&amp;amp;CA жабындарымен өңделген цитрус жемістеріндегі шіру белгілерінің дамуын көрсететін репрезентативті фотосуреттер. Кескіндер инокуляциядан кейінгі 1, 3, 5, 7, 9, 11, 13 және 15-күндері түсірілген. (C) Зақымданған тіндер гомогенаттары жағылған табақшалардың фотосуреттері. (D) Әртүрлі өңдеу топтары үшін уақыт өте келе зақымдану аймағын сандық бағалау. (E) LB ортасында 2 сағат инкубациядан кейін зақымданған тіндер гомогенаттарының оптикалық тығыздығын өлшеу арқылы анықталған бактерияға қарсы деңгей.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Өнімнің&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;микробтан тез&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұзылуы&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Хитозан ZnO&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және CA&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гидрогелі&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Бактериялар&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жойылып ылғал&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сақталды&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Өнім мерзімін&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;химиясыз&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ұзарту&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын RSC advances журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-04/chitosan-based-multifunctional-hydrogel-coatings-with-dual-a.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&g
