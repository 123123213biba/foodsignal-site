        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"132\" cy=\"147\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"568\" cy=\"236\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · EMULSIFIERS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Балмұздақтағы гиалурон&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қышқылы: молекулалық салмақ&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;текстураны қалай өзгертеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f1.jpg\" alt=\"Балмұздақ қоспасы және балмұздақ өндірісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Балмұздақ қоспасы және балмұздақ өндірісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер әртүрлі молекулалық салмақтағы гиалурон қышқылының (ГҚ) балмұздақ қасиеттеріне әсерін зерттеді. 1550 және 2550 кДа салмағы бар полимерлер қоспаның тұрақтылығы мен тұтқырлығын едәуір жақсартатыны анықталды. ГҚ эмульгаторларды толық алмастырмаса да, ол текстуралы десерттер жасау үшін жаңа мүмкіндіктер ашады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Жоғары молекулалық ГҚ (1550 кДа-дан бастап) тұтқырлықты арттырады.&lt;/li&gt;\n&lt;li&gt;ГҚ ылғалды ұстап тұрады және эмульсияның қабаттануына жол бермейді.&lt;/li&gt;\n&lt;li&gt;ГҚ еру жылдамдығына әсер етеді, бірақ көлемге әсер етпейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Тәжірибеде 0,3% концентрациядағы 320, 980, 1550 және 2550 кДа молекулалық салмақтағы гиалурон қышқылы қолданылды. Үлгілер стандартты өнеркәсіптік тұрақтандырғышы (гуар сағызы, каррагинан, моно- және диглицеридтер) бар бақылау қоспасымен салыстырылды. 4°C температурада реометрде өткізілген реологиялық тесттер ГҚ молекулалық салмағы артқан сайын қоспаның жинақталу модулі (G'), жоғалту модулі (G'') және тұтқырлығы артатынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Тұрақтылықты талдау жоғары молекулалық ГҚ (1550–2550 кДа) 4°C температурада 21 күн сақтау кезінде крем түзілу индексін (Creaming Index) тиімді төмендететінін көрсетті. Сонымен қатар, жоғары молекулалық үлгілердің еру жылдамдығы бақылау үлгісіне қарағанда жоғары болды. ГҚ бар барлық үлгілерде қосымша эмульгаторлар болмағандықтан, нәтижелер полимердің функционалдығын бағалау үшін өте маңызды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу өнеркәсіптік эмульгаторларды толық алмастыру мүмкіндігін дәлелдемейді, себебі бақылау үлгісінің құрамы басқаша болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Балмұздақ — өзінің тегіс құрылымы, бай дәмі және сергітетін қасиеттері үшін бағаланатын әлемдегі ең танымал сүт десерттерінің бірі. Кеңінен тұтынылғанына қарамастан, жоғары сапалы балмұздақ өндіру бірқатар техникалық қиындықтарды тудырады. Солардың бірі — сақтау мерзімі ішінде тұрақты құрылымды, қажетті текстураны және тұрақты сенсорлық қасиеттерді сақтап қалу. Бұл өнімнің күрделі табиғатымен, яғни ауа ұяшықтарын, май глобулаларын, мұз кристалдары мен үздіксіз су фазасын қамтитын ішінара мұздатылған эмульсия болуымен байланысты. Рецептура мұздың қайта кристалдануын, еру процесін және мұздату, сақтау мен тарату кезіндегі құрылымдық тұрақтылықты бақылау үшін мұқият әзірленуі керек. Осы мәселелерді шешу үшін балмұздақ құрамына ылғал миграциясын бақылау, мұздың қайта кристалдануын тежеу және жалпы текстураны жақсарту үшін полисахарид негізіндегі тұрақтандырғыштар қосылады. Гуар шайыры, каррагинан, рожков ағашының шайыры және карбоксиметилцеллюлоза (КМЦ) сияқты кеңінен қолданылатын тұрақтандырғыштар тұтқырлықты және мұздату-еріту тұрақтылығын жақсартатыны көрсетілген. Алайда, олардың концентрациясына және басқа ингредиенттермен өзара әрекеттесуіне байланысты, бұл тұрақтандырғыштар артық жабысқақтық сияқты қалаусыз текстуралық сипаттамаларды тудыруы мүмкін. Бұл қажетті сенсорлық қасиеттерді сақтай отырып, жақсартылған функционалдылықты қамтамасыз ете алатын балама полисахаридтерге қызығушылықты арттырды.&lt;/p&gt;\n&lt;p&gt;Гиалурон қышқылы (ГҚ) суды байланыстыру қабілеті жоғары болғандықтан, тағамдық жүйелерде әлеуетті функционалды ингредиент ретінде зерттелген. Сүт (Joshi және т.б., 2024; Sutariya және Salunke, 2022, 2023) және өңделген ірімшік (Joshi және т.б., 2025) сияқты сүт өнімдерінде ГҚ суды ұстап тұру қабілетін арттыратыны және құрылымдық қасиеттерге әсер ететіні хабарланған. Алдыңғы зерттеулер (Joshi және т.б., 2024; Sutariya және Salunke, 2022) ГҚ сүт жүйелерінде эмульсия тұрақтылығы мен ақуыздың өзара әрекеттесуін жақсарта алатынын көрсеткен. ГҚ — бұл β-1,4-D-глюкурон қышқылы мен β-1,3-N-ацетил-D-глюкозаминнің қайталанатын дисахаридтік бірліктерінен тұратын табиғи сызықтық полисахарид. Оның құрылымы жоғары теріс заряд тығыздығын береді, бұл үлкен мөлшердегі суды байланыстыруға және тұтқыр жүйелерді қалыптастыруға мүмкіндік береді. ГҚ-ның тағы бір маңызды сипаттамасы — оның функционалдығының молекулалық салмаққа (МС) байланыстылығы. Коммерциялық ГҚ бірнеше кило-Дальтоннан 3000 кДа-дан астамға дейінгі кең МС диапазонында қолжетімді, жоғары МС-ға ие ГҚ әдетте жоғары тұтқырлықпен және айқын вискоэластикалық мінез-құлықпен байланысты, ал төмен МС-ға ие ГҚ шектеулі құрылымдық үлес қосады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жоғары молекулалық салмаққа ие (≥ 980 кДа) гиалурон қышқылы суды байланыстыру қабілеті мен тұтқырлықты арттыру арқылы сүт жүйелерінің тұрақтылығын жақсартады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вискоэластикалық — материалдың қатты дене (серпімділік) және сұйықтық (тұтқырлық) қасиеттерін бірдей көрсете алу қабілеті, бұл балмұздақтың «дене» құрылымы үшін маңызды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қазіргі уақытта АҚШ Азық-түлік және дәрі-дәрмек басқармасы (FDA) ГҚ-ны барлық тағам санаттары үшін жалпы тағамдық қоспа ретінде мақұлдамаған. Алайда, ГҚ Жапония, Оңтүстік Корея, Қытай және Еуропалық Одақтың бірқатар бөліктерін қоса алғанда, басқа да аймақтарда тағамдық және функционалды өнімдерде қолдануға мақұлданған. Сондықтан, бұл зерттеу дәстүрлі тұрақтандырғыш-эмульгатор жүйелерін толық алмастыруды тікелей көрсетуден гөрі, ГҚ-ның әртүрлі молекулалық салмақтарының тұрақтандырушы ингредиент ретінде пайдаланылғанда балмұздақтың физика-химиялық, реологиялық және текстуралық қасиеттеріне әсерін бағалауға бағытталған.&lt;/p&gt;\n&lt;p&gt;Бұл зерттеу дәстүрлі тұрақтандырғыштарды алмастыра отырып, балмұздақ өндірісінде ГҚ-ның әртүрлі МС (320 кДа, 980 кДа, 1550 кДа және 2550 кДа) әсерін бағалауға бағытталған. Бақылау үлгісі (IC-C) стандартты тұрақтандырғыш қоспасын (0,3%) қамтыды. IC-1, IC-2, IC-3 және IC-4 үлгілері 0,3% ГҚ-ны қамтыды.&lt;/p&gt;\n&lt;p&gt;Негізгі қоспа 33,92% кілегей, 41,8% майсыздандырылған сүт, 5,89% майсыз құрғақ сүт (МҚС), 14,8% қант және 3,29% құрғақ жүгері шәрбатынан тұрды. Бақылау партиясында 0,3% коммерциялық тұрақтандырғыш (гуар шайыры, моно- және диглицеридтер, рожков ағашының шайыры, каррагинан және полисорбат 80 қоспасы) қосылды, ал тәжірибелік партияларда ГҚ (0,3%) эмульгаторсыз пайдаланылды. Қорытынды құрамы: 12,2% май, 4,1% ақуыз, 11,2% МҚС және 41,8% жалпы құрғақ заттар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау үлгісі эмульгаторларды қамтыды, ал ГҚ үлгілерінде олар жоқ. Қасиеттердегі айырмашылықтар тұрақтандырғыш түріне де, тәжірибелік топтарда эмульгаторлардың болмауына да байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ингредиенттер термомиксерде араластырылды (10 минут, 3-жылдамдық, соңғы 60 секундта 5-жылдамдық). Қоспа 85°C-та 20 секунд бойы пастерленді, содан кейін 4°C-та бір түн (12–16 сағат) бойы жетілдірілді. Балмұздақ 15 минут бойы мұздатқышта дайындалды және -20°C-та 24 сағат бойы қатырылды.&lt;/p&gt;\n&lt;p&gt;Крем түзілу тұрақтылығы (CI) сақтау кезіндегі (4°C, 21 күн) фазалық бөліну индексі бойынша анықталды. Реологиялық қасиеттер (жинақталу модулі G', жоғалу модулі G'', тұтқырлық) реометр көмегімен 4°C-та 0,1–62,8 рад/с бұрыштық жиілік аралығында өлшенді.&lt;/p&gt;\n&lt;p&gt;Көпіршіктену (overrun) қоспа мен дайын өнім салмағы арасындағы айырмашылық бойынша есептелді. Қаттылық пен жабысқақтық пенетрация әдісі (тереңдігі 3 мм, температурасы -20°C) көмегімен өлшенді. Еру жылдамдығы 25°C-та 3 сағат бойы үлгінің (100 г) салмақ жоғалтуы бойынша анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Көпіршіктену (overrun) — балмұздақ құрамына енгізілген ауа көлемінің көрсеткіші; мән неғұрлым жоғары болса, өнім соғұрлым «жеңіл» болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бақылау және IC-1 (320 кДа) үлгілері төменірек тұтқырлыққа ие болды және жетілу кезінде фазалық бөліну белгілерін көрсетті, ал жоғары МС-ға ие ГҚ үлгілері тұрақты болды.&lt;/p&gt;\n&lt;p&gt;Барлық үлгілер 21 күн ішінде CI өсуін көрсетті. Бақылау және IC-1 ең жоғары CI (&amp;gt;40%) мәндеріне ие болды, бұл тұрақсыздықты білдіреді. 1550 кДа және 2550 кДа ГҚ үлгілері минималды фазалық бөлінуді көрсетті.&lt;/p&gt;\n&lt;p&gt;Тікелей байланыс байқалды: ГҚ МС өсуімен G', G'' және көрінетін тұтқырлық артты. ICM-4 (2550 кДа) үлгісі ең жоғары тұтқырлық пен ағынға қарсылықты көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жоғары МС-ға ие ГҚ (2550 кДа) қоспаның ең тұрақты және тұтқыр құрылымын қамтамасыз етеді, бұл қабаттануға қарсы жақсы төзімділікпен байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Үлгілер арасында елеулі айырмашылықтар (p &amp;gt; 0,05) анықталмады (29,20–30,86% аралығында). ГҚ қосу ауаның кіруіне кедергі жасамады.&lt;/p&gt;\n&lt;p&gt;ГҚ ≥ 980 кДа болатын үлгілер бақылау және IC-1-ге қарағанда айтарлықтай қаттырақ болды. Үлгілер арасында жабысқақтық бойынша айырмашылықтар анықталмады.&lt;/p&gt;\n&lt;p&gt;ГҚ 1550 кДа және 2550 кДа болатын үлгілер бақылау және IC-1-ге қарағанда баяуырақ еріді, бұл құрылымдық термотөзімділіктің жақсырақ екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;ГҚ (МС ≥ 980 кДа) балмұздақтың қаттылығын, тұтқырлығын, эмульсия тұрақтылығын және термотөзімділігін жақсартады. Алайда, тәжірибелік үлгілерде эмульгаторлардың болмауына байланысты, нәтижелер дәстүрлі жүйелерге толық эквиваленттілікті білдірмейді. Микроқұрылымдық және сенсорлық талдауларды ескере отырып, қосымша зерттеулер талап етіледі.&lt;/p&gt;\n&lt;p&gt;Гиалурон қышқылы (әсіресе 1550 және 2550 кДа) балмұздақ үшін келешегі бар құрылым түзуші ингредиент болып табылады, физика-химиялық қасиеттерді жақсартады. Дәстүрлі тұрақтандырғыш-эмульгатор жүйелерін толық алмастыру үшін салыстырмалы рецептуралармен қосымша зерттеулер жүргізу қажет.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f1.jpg\" alt=\"Балмұздақ қоспасы және балмұздақ өндірісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Балмұздақ қоспасы және балмұздақ өндірісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f2.jpg\" alt=\"4°C температурада 21 күн сақталғаннан кейінгі әртүрлі молекулалық салмақтағы гиалурон қышқылы бар балмұздақ қоспасы үлгі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4°C температурада 21 күн сақталғаннан кейінгі әртүрлі молекулалық салмақтағы гиалурон қышқылы бар балмұздақ қоспасы үлгілерінің крем түзілу индексі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f3.jpg\" alt=\"Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ қоспасы үлгілерінің жоғалу модуліне (G'': Па) әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ қоспасы үлгілерінің жоғалу модуліне (G'': Па) әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f4.jpg\" alt=\"Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ қоспасы үлгілерінің сақтау модуліне (G': Па) әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ қоспасы үлгілерінің сақтау модуліне (G': Па) әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f5.jpg\" alt=\"Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ қоспасы үлгілерінің тұтқырлығына (мПа·с) әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ қоспасы үлгілерінің тұтқырлығына (мПа·с) әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f6.jpg\" alt=\"Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ үлгілерінің көпіршігіне әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ үлгілерінің көпіршігіне әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f7.jpg\" alt=\"Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ үлгілерінің қаттылығына әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ үлгілерінің қаттылығына әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f8.jpg\" alt=\"Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ үлгілерінің жабысқақтығына әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ үлгілерінің жабысқақтығына әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica-f9.jpg\" alt=\"Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ үлгілерінің еру жылдамдығына (г/мин) әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі молекулалық салмақтағы гиалурон қышқылының балмұздақ үлгілерінің еру жылдамдығына (г/мин) әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Балмұздақ&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрылымының&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тұрақсыздығы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Әртүрлі&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;молекулалық&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;салмақтағы ГҚ&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жоғары салмақ&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тұтқырлықты&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арттырады&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Болашағы бар&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрылымдық&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ингредиент&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Food science &amp;amp; nutrition журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-07/effect-of-hyaluronic-acid-molecular-weight-on-physicochemica.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д
