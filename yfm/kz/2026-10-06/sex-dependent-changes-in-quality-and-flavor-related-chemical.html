            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"212\" cy=\"141\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"528\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · VOLATILES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Аналық немесе аталық: неге&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;кейбір мидиялар мұздатқышта&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тезірек бұзылады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f1.jpg\" alt=\"Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың физика-химиялық сапа көрсеткіштерінің өзгеруі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың физика-химиялық сапа көрсеткіштерінің өзгеруі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың физика-химиялық сапа көрсеткіштерінің өзгеруі. (a) Центрифугалық жоғалту. (b) Жалпы ұшпа азот (&lt;a href=\"concepts/tvb-n.html\"&gt;TVB-N&lt;/a&gt;) мөлшері. (c) Малондиальдегид (MDA) мөлшері. (d) ΔE. (e) Қаттылық. (f) Шайнау қабілеті. Ескертпе: (a–f) ішінде ** p &amp;lt; 0,01, *** p &amp;lt; 0,001 дегенді білдіреді. Жоғарғы индекстегі әртүрлі кіші әріптер (a, b, c) еркек мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05), ал жоғарғы индекстегі әртүрлі бас әріптер (A, B, C) ұрғашы мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05) білдіреді; d: күндер.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Мұздату алдында мидияларды жынысына қарай бөлу біртүрлі көрінуі мүмкін, бірақ биохимия мұның мәні бар екенін дәлелдейді. -18 °C температурада 150 күн сақталғанда қалың қабықты мидиялар (Mytilus coruscus) балғындығын әртүрлі жоғалтады. Аналықтарында майлар тезірек тотығып, жағымсыз альдегидтер көбейеді. Ал аталықтары сөлінен көбірек айырылғанымен, умами дәмі мен бос аминқышқылдарын жақсырақ сақтайды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;150 күннен кейін аналық мидияларда майдың тотығуы (MDA) аталықтарға қарағанда 1,7 есе жоғары болады&lt;/li&gt;\n&lt;li&gt;Аталық мидиялар сөлін көбірек жоғалтқанымен, аминқышқылдары мен умами дәмін ұзағырақ сақтайды&lt;/li&gt;\n&lt;li&gt;1-пентен-3-он затының жиналуы пайдалы омега-3 май қышқылдарының тотығып ыдырауымен байланысты&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеуде көктемде, уылдырық шашу алдында жиналған Mytilus coruscus мидиялары сыналды. Олардың жынысы гонада түсіне қарай ажыратылды: аналықтары сары-қызғылт, аталықтары сүттей ақ болады. Үлгілер -18 °C температурада 0, 90 және 150 күн бойы сақталып, олардың ұшқыш қосылыстары газды хроматография-иондық қозғалғыштық спектрометриясы (GC-IMS) арқылы зерттелді. 150 күннен кейін центрифугалық су жоғалту аналықтарда 1,2 есе, аталықтарда 1,5 есе өсті, ал жалпы ұшқыш азот (TVB-N) сәйкесінше 2,7 және 2,4 есе артты.&lt;/p&gt;\n&lt;p&gt;Майлардың тотығу көрсеткіші — малон диальдегиді (MDA) — екі жыныста да шамамен 3,3 есе өскенімен, аналықтарда оның мөлшері аталықтарға қарағанда 1,7 есе жоғары болды. 90 күннен кейін аналықтарда жағымсыз иіс беретін альдегидтер басым түсті. GC-IMS талдауы 14 негізгі ұшқыш затты анықтады: мысалы, 1-пентен-3-он кетонының көбеюі пайдалы май қышқылдарының (EPA және DHA) ыдырауымен тікелей байланысты болып шықты. Аталық мидиялар болса, сақтау барысында бос аминқышқылдарының жоғары деңгейін ұстап тұрды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек наурыз айында (уылдырық шашу алдында) ауланған мидияларға жүргізілді; күзде немесе қыста жиналған шикізатта нәтиже өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қалың қабықты мидия (Mytilus coruscus) — Қытай жағалауында кеңінен өсірілетін, экономикалық маңызы бар қос жақтаулы моллюска. «Қытайдың балық шаруашылығы бойынша статистикалық жылнамасы 2026» деректеріне сәйкес, 2025 жылы Қытайда мидиялардың теңіз аквакультурасы өндірісі 780 900 тоннаға жетті. Жаңа мидиялар өзіне тән дәмі мен текстурасы үшін бағаланады, алайда олар сақтау кезінде тез бұзылады, бұл олардың жарамдылық мерзімін, таралуын және нарықтық тартымдылығын шектейді. Мұздату су өнімдерін ұзақ мерзімді сақтау үшін кеңінен қолданылады, өйткені ол микроорганизмдердің өсуін тиімді тежейді және ферментативті реакцияларды баяулатады. Жоғары ылғалдылық пен нәзік тіндердің құрылымына байланысты мидиялар ұзақ уақыт мұздату кезінде сапасының нашарлауына бейім, бұл судың миграциясына, ақуыздың деградациясына, липидтердің тотығуына және мұз кристалдарының құрылымдық зақымдануына әкеледі, нәтижесінде суды ұстап тұру қабілеті төмендейді және текстура мен дәм профилі өзгереді.&lt;/p&gt;\n&lt;p&gt;Дәм — тұтынушының қабылдауына әсер ететін маңызды сапа көрсеткіші. Хош иіс негізінен ұшпа органикалық қосылыстармен (ҰОҚ), ал дәм негізінен бос аминқышқылдарымен (БАҚ), органикалық қышқылдармен және 5′-нуклеотидтермен анықталады. Ұшпа және ұшпайтын дәм компоненттері тығыз байланысты, өйткені аминқышқылдары, май қышқылдары және басқа дәм ізашарлары (прекурсорлары) өңдеу және сақтау кезінде деградацияға немесе тотығуға ұшырауы мүмкін. Еріту кезінде қалдық фермент белсенділігінің қалпына келуі ақуыздардың, 5′-нуклеотидтердің және басқа компоненттердің трансформациясын одан әрі күшейтуі мүмкін. Атап айтқанда, ақуыздар мен шағын пептидтердің деградациясы БАҚ деңгейін өзгертуі мүмкін, ал аденозинтрифосфат (АТФ) пен оның туындыларының конверсиясы аденозин-5′-монофосфат (5′-АМФ), инозин-5′-монофосфат (5′-ИМФ) және басқа дәм беретін нуклеотидтердің құрамын өзгертуі мүмкін. Сонымен қатар, қанықпаған май қышқылдары тотығуға бейім келіп, альдегидтер, кетондар және спирттер сияқты төмен молекулалы ұшпа қосылыстарды түзеді, олардың кейбіреулері ащы иістерге ықпал етеді. Осылайша, мұздату кезіндегі дәм эволюциясы ақуыз деградациясы, нуклеотидтер конверсиясы және липидтер тотығуының жиынтық әсерін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мидияларды мұздату кезіндегі дәм эволюциясы ақуыз деградациясы, нуклеотидтер конверсиясы және липидтер тотығуы сияқты күрделі биохимиялық процестерге байланысты, бұл сенсорлық сипаттамалардың өзгеруіне әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ҰОҚ (ұшпа органикалық қосылыстар) — өнімнің хош иісіне жауапты заттар; БАҚ (бос аминқышқылдары) және нуклеотидтер — дәм (мысалы, «умами») қалыптасуындағы негізгі компоненттер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында: дәм профиліндегі өзгерістер моллюсканың жынысы мен сақтау шарттары сияқты көптеген факторларға байланысты, бұл кешенді талдауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдыңғы зерттеулер бұл көрсеткіштерді көбінесе бөлек зерттеген. Мұздату кезіндегі дәм эволюциясын толығырақ сипаттау үшін ұшпайтын дәм қосылыстары, май қышқылдарының құрамы және ҰОҚ-ның интеграцияланған талдауы қажет. Газ хроматографиясы — ионды-қозғалғыштық спектрометрия (ГХ-ИПС) жедел талдау және жоғары сезімталдықпен ерекшеленеді, бұл оны ұшпа дәм профильдерін мониторингтеу үшін қолайлы етеді. Сақтау мерзімінен басқа, шикізаттың жыныстық биологиялық айырмашылықтары да дәм реакцияларына әсер етуі мүмкін. Мидиялар дара жынысты, көбею кезеңінде еркек және ұрғашы даралар гонадалардың түсі мен сенсорлық сипаттамаларымен ерекшеленеді.&lt;/p&gt;\n&lt;p&gt;Бұл зерттеуде Mytilus coruscus ұрғашы және еркек даралары −18 °C температурада 0, 90 және 150 күн бойы мұздатылған күйде сақталды. БАҚ, 5′-нуклеотидтер, эквивалентті умами концентрациясы (ЭУК) және май қышқылдарының құрамындағы өзгерістер анықталды. Сонымен қатар, сапа өзгерістері малондік диальдегид (&lt;a href=\"concepts/malondialdehyde.html\"&gt;МДА&lt;/a&gt;), жалпы ұшпа негіздік азот (ЖҰНА), центрифугалау шығындары және текстура қасиеттері арқылы бағаланды.&lt;/p&gt;\n&lt;p&gt;Жоғары тиімді сұйықтық хроматографиясы (ЖТСХ) деңгейіндегі еріткіштер Fisher Chemical (АҚШ) компаниясынан сатып алынды. МДА талдауына арналған жинақ — Нанкин биотехнология институты (Қытай). Аминқышқылдарының стандарттары және дериватизация жинағы — Welch Materials Co., Ltd. (Шанхай, Қытай). Нуклеотидтер мен органикалық қышқылдардың стандарттары — Tanmo Quality Inspection Technology Co., Ltd. (Бейжің, Қытай). Стандартты май қышқылдарының метил эфирлері (МЭМҚ) қоспалары — ANPEL Laboratory Technologies Inc. (Шанхай, Қытай). Ультра таза су Milli-Q жүйесі (Millipore, АҚШ) көмегімен дайындалды. Басқа химиялық заттар аналитикалық деңгейде болды (Sinopharm Chemical Reagent Co., Ltd., Қытай).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЖТСХ (жоғары тиімді сұйықтық хроматографиясы) — заттар қоспасын бөлу және талдау әдісі, аминқышқылдары немесе нуклеотидтер сияқты жеке компоненттердің концентрациясын дәл анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тірі M. coruscus мидиялары 2025 жылдың наурызында Шаньдун провинциясынан жиналды (жасы 2–3 жыл). Бұл кезеңде мидиялар көктемгі уылдырық шашу маусымы алдындағы гонадалардың белсенді даму сатысында болды. Үлгілер зертханаға шамамен 2 сағат ішінде салқындатқыш жәшіктерде (4 °C) жеткізілді. Теңіз суымен (тұздылығы 28 PSU) жуылғаннан кейін, орташа өлшемдегі мидиялар таңдап алынды: қабық ұзындығы 97,99 ± 3,96 мм, ені 45,99 ± 2,87 мм, биіктігі 31,88 ± 1,70 мм, дене массасы 48,96 ± 6,36 г. Жынысы визуалды түрде анықталды: қызғылт-сары гонадалар — ұрғашы, сүт түсті-ақ — еркек. Ас қорыту жолы қолмен алынып тасталды. Әр жыныс үшін 90 мидия үш сақтау мерзіміне (0, 90, 150 күн) бөлінді, әр нүктеде 30-дан. Әр топ 10 дарадан тұратын үш биологиялық қайталанымға бөлінді (n = 3). Мидиялар полиэтилен пакеттерге (10 см × 20 см, қалыңдығы 0,20 мм) бір қабат етіп салынды. Физикалық өлшемдер үшін әр қайталанымнан 2 мидия, химиялық талдаулар үшін қалған 8 мидия пайдаланылды, олар сұйық азотта гомогенизацияланды және −80 °C-та сақталды.&lt;/p&gt;\n&lt;p&gt;Центрифугалау шығындары суды ұстап тұру қабілетін көрсетеді. Ерітілген үлгі (m1) сүзгі қағазына оралып, түбінде мақта қабаты бар центрифуга түтігіне салынды және 3000 айн/мин жылдамдықта 15 минут бойы центрифугаланды. Центрифугалаудан кейін үлгі өлшенді (m2). Есептеу: Центрифугалау шығындары (%) = (m1 − m2) / m1 × 100%.&lt;/p&gt;\n&lt;p&gt;ЖҰНА Қытай стандарты [27] бойынша анықталды. 3 г ұнтақталған үлгі 20 мл дистилденген су және 1 г магний оксидімен араластырылды. Талдау Кьельдаль азот анализаторы (K1160, Hanon, Қытай) көмегімен жүзеге асырылды.&lt;/p&gt;\n&lt;p&gt;МДА тиобарбитур қышқылы (ТБК) әдісімен жинақ (A003-1, Нанкин, Қытай) көмегімен анықталды. Мидия тіндері физиологиялық ерітіндімен (1:9, салмақ/көлем) мұзды ваннада гомогенизацияланды. Гомогенат 3500 айн/мин жылдамдықта (10 минут, 4 °C) центрифугаланды. Супернатант реагенттермен араластырылды, 95 °C-та 40 минут бойы қыздырылды, суытылды және қайта центрифугаланды. Абсорбция Multiskan SkyHigh спектрофотометрі (Thermo Scientific, Сингапур) көмегімен 532 нм-де өлшенді. Ақуыз концентрациясы Брэдфорд әдісімен анықталды. Нәтижелер нмоль/мг ақуыз түрінде көрсетілді.&lt;/p&gt;\n&lt;p&gt;Түс параметрлері (L*, a*, b*) RM200QC спектроколориметрі (X-Rite, АҚШ) көмегімен өлшенді. Жалпы түс айырмашылығы (ΔE) жаңа үлгілерге (ұрғашылар үшін F0, еркектер үшін M0) қатысты есептелді: ΔE = √((L1 − L0)² + (a1 − a0)² + (b1 − b0)²). Текстура талдауы (TPA) текстура анализаторы (CT3, Brookfield, АҚШ) көмегімен сфералық зондпен (TA43, диаметрі 25,4 мм) жүзеге асырылды. Шарттар: тест жылдамдығы 1 мм/мин, сығылу 20%, триггер күші 2 Н.&lt;/p&gt;\n&lt;p&gt;БАҚ ЖТСХ әдісімен 5% трихлор сірке қышқылымен экстракциядан кейін анықталды. Дериватизация Yuexu жинағы (Welch Materials, Қытай) көмегімен жүзеге асырылды. Agilent 1260 жүйесі және Ultimate Amino Acid бағанасы (4,6 мм × 250 мм, 5 мкм) пайдаланылды. Қозғалмалы фаза А: 0,1 моль/л ацетат буфері (pH 6,50) — ацетонитрил (93:7); фаза Б: ацетонитрил — су (80:20). Ағын жылдамдығы 1,00 мл/мин, бағана температурасы 40 °C, детекция 254 нм-де. Таурин GB 5009.169-2016 бойынша анықталды.&lt;/p&gt;\n&lt;p&gt;Agilent 1260 жүйесі және CAPCELL PAK C18 SG бағанасы (4,6 мм × 150 мм, 5 мкм) пайдаланылды. Қозғалмалы фаза: 20 ммоль/л фосфор қышқылы, 20 ммоль/л лимон қышқылы, 40 ммоль/л триэтиламин. Ағын жылдамдығы 1,00 мл/мин, детекция 254 нм-де.&lt;/p&gt;\n&lt;p&gt;ЭУК (г мононатрий глутаматы/100 г) формула бойынша есептелді: ЭУК = Σ(ai × bi) + 1218 × Σ(ai × bi) × Σ(aj × bj), мұнда ai — умами аминқышқылдарының концентрациясы (Asp, Glu), bi — балғындық коэффициенті (Asp 0,077, Glu 1,0), aj — нуклеотидтер концентрациясы (IMF, GMF, AMF), bj — балғындық коэффициенті (IMF 1,0, GMF 2,3, AMF 0,18).&lt;/p&gt;\n&lt;p&gt;Талдау GB 5009.168-2016 бойынша өткізілді. Липидтер мұнай эфирімен экстракцияланды, натрий гидроксидімен метанолда сабынданды және бор трифторидімен метанолда метилденді. МЭМҚ Agilent 8890 газ хроматографы және DB-Fast FAME бағанасы (20 м × 0,18 мм, 0,20 мкм) көмегімен талданды. Температура бағдарламасы: 80–220 °C (25 °C/мин), содан кейін 245 °C-қа дейін (5 °C/мин). FID детекторы 250 °C-та.&lt;/p&gt;\n&lt;p&gt;Ұшпа қосылыстар талдауы FlavourSpec® (G.A.S., Германия) аспабында өткізілді. 2,00 г гомогенат 10 минут бойы 60 °C-та (500 айн/мин) инкубацияланды. Газ-тасымалдаушы — азот. Идентификация уақыт және дрейф уақыты бойынша NIST және IMS деректер базаларымен салыстырылды.&lt;/p&gt;\n&lt;p&gt;Нәтижелер орташа ± стандартты ауытқу (n = 3) ретінде көрсетілген. Дункан тестімен бір факторлы дисперсиялық талдау (ANOVA) (SPSS 26.0) қолданылды. Графиктер GraphPad Prism 10-да жасалды. PCA және PLS-DA MetaboAnalyst 6.0-да орындалды. Статистикалық маңыздылық p &amp;lt; 0,05 деңгейінде қабылданды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f1.jpg\" alt=\"Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың физика-химиялық сапа көрсеткіштерінің өзгеруі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың физика-химиялық сапа көрсеткіштерінің өзгеруі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың физика-химиялық сапа көрсеткіштерінің өзгеруі. (a) Центрифугалық жоғалту. (b) Жалпы ұшпа азот (TVB-N) мөлшері. (c) Малондиальдегид (MDA) мөлшері. (d) ΔE. (e) Қаттылық. (f) Шайнау қабілеті. Ескертпе: (a–f) ішінде ** p &amp;lt; 0,01, *** p &amp;lt; 0,001 дегенді білдіреді. Жоғарғы индекстегі әртүрлі кіші әріптер (a, b, c) еркек мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05), ал жоғарғы индекстегі әртүрлі бас әріптер (A, B, C) ұрғашы мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05) білдіреді; d: күндер.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f2.jpg\" alt=\"Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың бос аминқышқылдары профилі және көпфакторлы талдауы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың бос аминқышқылдары профилі және көпфакторлы талдауы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың бос аминқышқылдары профилі және көпфакторлы талдауы. (a) Бос аминқышқылдарының (FAA) жылу картасы. (b) Умами дәмі бар аминқышқылдары (UAA). (c) Тәтті аминқышқылдары (SAA). (d) Ащы аминқышқылдары (BAA). (e) Жалпы бос аминқышқылдары (TFAA). (f) Таурин (Tau). (g) PLS-DA бағалау графигі. (h) Таңдалған дифференциалды FAA-лардың иерархиялық кластерлік жылу картасы. (i) PLS-DA моделін қайта тексеру нәтижелері, жұлдызша (*) статистикалық маңыздылықты (p &amp;lt; 0,05) көрсетеді. (j) PLS-DA моделінің ауыстыру тесті (n = 1000). (k) Негізгі дискриминантты қосылыстарды бөліп көрсететін VIP бағалау графигі. Ескертпе: (b–f) ішінде * бірдей сақтау мерзіміндегі еркек және ұрғашы мидиялар арасындағы айырмашылықтарды білдіреді. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001 дегенді білдіреді. Жоғарғы индекстегі әртүрлі кіші әріптер (a, b) еркек мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05), ал жоғарғы индекстегі әртүрлі бас әріптер (A, B) ұрғашы мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05) білдіреді; d: күндер.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f3.jpg\" alt=\"Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардағы АТФ-пен байланысты қосылыстар мен умами эквивалентінің (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардағы АТФ-пен байланысты қосылыстар мен умами эквивалентінің (EUC) өзгеруі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардағы АТФ-пен байланысты қосылыстар мен умами эквивалентінің (EUC) өзгеруі. (a) АТФ. (b) АДФ. (c) АМФ. (d) ИМФ. (e) Гипоксантин (Hx). (f) Инозин (HxR). (g) ГМФ. (h) EUC. Ескертпе: (a–h) ішінде * бірдей сақтау мерзіміндегі еркек және ұрғашы мидиялар арасындағы айырмашылықтарды білдіреді. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001 дегенді білдіреді. Жоғарғы индекстегі әртүрлі кіші әріптер (a, b, c) еркек мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05), ал жоғарғы индекстегі әртүрлі бас әріптер (A, B, C) ұрғашы мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05) білдіреді; d: күндер.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f4.jpg\" alt=\"Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың май қышқылдары құрамының өзгеруі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың май қышқылдары құрамының өзгеруі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Мұздатылған күйде сақтау кезінде еркек және ұрғашы мидиялардың май қышқылдары құрамының өзгеруі. (a) Май қышқылдарының метил эфирлері (FAME) жылу картасы. (b) ДГК (DHA). (c) ЭПК (EPA). (d) ПНЖҚ (PUFA). (e) МНЖҚ (MUFA). (f) НЖҚ (SFA). (g) ω-3/ω-6 май қышқылдарының қатынасы. Ескертпе: (b–g) ішінде * бірдей сақтау мерзіміндегі еркек және ұрғашы мидиялар арасындағы айырмашылықтарды білдіреді. * p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001 дегенді білдіреді. Жоғарғы индекстегі әртүрлі кіші әріптер (a, b) еркек мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05), ал жоғарғы индекстегі әртүрлі бас әріптер (A, B, C) ұрғашы мидиялардағы сақтау мерзімдері арасындағы елеулі айырмашылықтарды (p &amp;lt; 0,05) білдіреді; d: күндер.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f5.jpg\" alt=\"GC-IMS негізінде мұздатылған күйде сақтау кезінде еркек және ұрғашы Mytilus coruscus мидияларындағы ұшпа органикалық қос\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;GC-IMS негізінде мұздатылған күйде сақтау кезінде еркек және ұрғашы Mytilus coruscus мидияларындағы ұшпа органикалық қосылыстар (VOC) айырмашылықтарының графиктері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;GC-IMS негізінде мұздатылған күйде сақтау кезінде еркек және ұрғашы Mytilus coruscus мидияларындағы ұшпа органикалық қосылыстар (VOC) айырмашылықтарының графиктері. (a) F0 бақылау тобы ретінде алынған ұрғашы мидиялар топтары. (b) M0 бақылау тобы ретінде алынған еркек мидиялар топтары. (c) GC-IMS деректерінен жасалған галерея графигі. Ескертпе: Галерея графигінде әрбір жол үлгіні, ал әрбір баған VOC-ты білдіреді. Түс әрбір VOC-тың салыстырмалы сигнал қарқындылығын білдіреді, ол ақтан (төмен қарқындылық) қызыл түске дейін (жоғары қарқындылық) өзгереді; қанық қызыл түс салыстырмалы мөлшердің жоғары екенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f6.jpg\" alt=\"(a) GC-IMS ұшпа профильдеріне негізделген PCA.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) GC-IMS ұшпа профильдеріне негізделген PCA.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;(a) GC-IMS ұшпа профильдеріне негізделген PCA. (b) VOC профильдерінің PLS-DA баллдық графигі. (c) Модельдің болжау дәлдігін көрсететін кросс-тексеру (CV) нәтижелері. Жұлдызшалармен (*) белгіленген Q2 мәндері (болжау қабілеті) статистикалық маңыздылықты (p &amp;lt; 0,05) білдіреді, бұл модельдің кездейсоқ таңдаудан артықшылығын көрсетеді; (d) Модельдің маңыздылығын растайтын ауыстыру тестінің статистикасы (n = 1000) (p &amp;lt; 0,001). (e) Негізгі дискриминантты қосылыстарды бөліп көрсететін VIP баллдық графигі. (f) Таңдалған дифференциалды VOC-тардың иерархиялық кластерлік жылу картасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical-f7.jpg\" alt=\"(a) Ұшпа емес дәмдік қосылыстар (еркін аминқышқылдары, TVB-N, MDA және 5′-нуклеотидтер) мен дифференциалды ұшпа қосылыст\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;(a) Ұшпа емес дәмдік қосылыстар (еркін аминқышқылдары, TVB-N, MDA және 5′-нуклеотидтер) мен дифференциалды ұшпа қосылыстар арасындағы Пирсон корреляциясының жылу картасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;(a) Ұшпа емес дәмдік қосылыстар (еркін аминқышқылдары, TVB-N, MDA және 5′-нуклеотидтер) мен дифференциалды ұшпа қосылыстар арасындағы Пирсон корреляциясының жылу картасы. (b) Қанықпаған май қышқылдары мен дифференциалды ұшпа қосылыстар арасындағы Пирсон корреляциясының жылу картасы. Ескертпе: Корреляциялық жылу картасында қызыл түс оң корреляцияны, ал көк түс теріс корреляцияны білдіреді; қанық түстер күштірек корреляцияны көрсетеді. Жұлдызшалар статистикалық маңыздылықты білдіреді (* p &amp;lt; 0,05, ** p &amp;lt; 0,01, *** p &amp;lt; 0,001).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/sex-dependent-changes-in-quality-and-flavor-related-chemical.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мидияның ұзақ&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мұздатудан&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұзылуы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;-18 °C-та 150&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;күн сақтау&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және GC-IMS&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Аналықтар&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;майды тезірек&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тотықтырады&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-
