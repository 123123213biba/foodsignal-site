            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"141\" cy=\"165\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"619\" cy=\"193\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · DAIRY_FERM   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кешью ірімшігінің жасырын&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өмірі: ферменттелген&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өнімдерде не бар&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe-f1.jpg\" alt=\"Талданған үлгілер арасындағы бактериялық изоляттардың таралуы (a) және әрбір түр үшін анықталған изоляттардың жалпы саны\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Талданған үлгілер арасындағы бактериялық изоляттардың таралуы (a) және әрбір түр үшін анықталған изоляттардың жалпы саны (b)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Кешью негізіндегі өсімдік ірімшіктерінің танымалдылығы олардың микробиологиялық құрамын қатаң бақылауды талап етеді. Бразилиядан алынған 13 үлгіні зерттеу сальмонелла сияқты қауіпті патогендердің жоқтығын көрсетті. Алайда, өнімдерде антибиотиктерге төзімділік гендері бар бактериялар анықталды, бұл өндірушілер үшін маңызды белгі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Кешью ірімшігінде қауіпті патогендер жоқ, бірақ антибиотиктерге төзімді бактериялардың гендері анықталды.&lt;/li&gt;\n&lt;li&gt;Ферменттелген өнімдерде зең мен ашытқылардың жоғары мөлшері, егер олар әдейі қосылса, қалыпты жағдай болып табылады.&lt;/li&gt;\n&lt;li&gt;Штаммдардағы мобильді генетикалық элементтердің болуы ашытқылардың қауіпсіздігін қатаң бақылауды талап етеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер 13 кешью ірімшігі үлгісін микрофлораны анықтау үшін MALDI-TOF масс-спектрометриясы және антибиотиктерге төзімділік (&lt;a href=\"concepts/antimicrobial-resistance.html\"&gt;AMR&lt;/a&gt;) гендерін іздеу үшін толық геномдық секвенирлеу әдістері арқылы талдады. Үлгілерде Salmonella spp., E. coli немесе коагулаза-оң стафилококктар анықталмады, бұл өндіріс гигиенасының деңгейі қанағаттанарлық екенін білдіреді. Дегенмен, бір үлгіде Bacillus cereus, сондай-ақ Cronobacter malonaticus және Delftia acidovorans анықталды.&lt;/p&gt;\n&lt;p&gt;Бөлінген 176 сүт қышқылы бактерияларының (&lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;LAB&lt;/a&gt;) штаммдарының ішінде Enterococcus faecium және Lactiplantibacillus plantarum ең көп таралғаны болып шықты. Талдау 8 антибиотикке төзімділік генін анықтады, олардың 4-еуі басқа бактерияларға таралуы мүмкін мобильді генетикалық элементтер — плазмидаларда орналасқан. C. malonaticus және Levilactobacillus brevis штаммдарында мұндай гендердің болуы ферменттелген өнімдер арқылы төзімділіктің таралу қаупін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек бір аймақтан алынған 13 үлгіні қамтыды, сондықтан нәтижелерді өсімдік ірімшіктерінің барлық түріне қатысты деп санауға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Соңғы жылдары өсімдік тектес ірімшік аналогтарына сұраныс артты, бұған вегандық және вегетариандық диеталардың таралуы мен тұтынушылардың жануарлардан алынатын өнімдерге өсімдік тектес балама іздеуі себеп болды. Оларды өндіру әртүрлі шикізатқа негізделеді және көбінесе зең саңырауқұлақтары, ашытқылар мен сүт қышқылы бактериялары (СҚБ) қатысатын ашыту процестерін қамтиды. Осы тұрғыда, ашытуға қатысатын күрделі микробтық қауымдастықтарға байланысты азық-түлік қауіпсіздігін, соның ішінде микробқа қарсы төзімділік (МҚТ) аспектілерін қамтамасыз ету маңызды. Осыған байланысты, бұл зерттеуде Бразилияда сатып алынған өсімдік тектес ірімшік аналогтарында қоғамдық денсаулық сақтау үшін әлеуетті маңызы бар бактерия түрлерінің болуы зерттеліп, МҚТ профильдері мен гендері бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттелген үлгілерде Salmonella spp., коагулаза-оң Staphylococcus немесе Escherichia coli анықталмады, алайда бір үлгіде Bacillus cereus табылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сыналған үлгілердің ешқайсысында Salmonella spp., коагулаза-оң Staphylococcus немесе Escherichia coli анықталмады, ал Bacillus cereus бір үлгіде тіркелді. Salmonella үшін селективті ортада бөлінген екі атипті колония Cronobacter malonaticus және Delftia acidovorans деп сәйкестендірілді. Үлгілердің көпшілігінде зең мен ашытқылардың жоғары мөлшері анықталды, бұл ашыту және пісу процестерімен байланысты болуы мүмкін. 176 СҚБ изолятының ішінен MALDI-TOF көмегімен 11 түр сәйкестендірілді және жиырма өкілдік штамм микробқа қарсы сезімталдықты тексеру үшін таңдап алынды. Төзімділік изоляттардың шектеулі санында, негізінен ципрофлоксацин, тетрациклин және гентамицинге қатысты анықталды, ал C. malonaticus пенициллинге төзімділік көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MALDI-TOF — микроорганизмдерді олардың ақуыз профилі бойынша жедел сәйкестендіруге мүмкіндік беретін масс-спектрометрия әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Lactiplantibacillus plantarum, Levilactobacillus brevis, &lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt;, Enterococcus faecium және C. malonaticus түрлеріне толық геномдық секвенирлеу жүргізілді. Барлығы сегіз микробқа қарсы төзімділік гені анықталды, олардың төртеуі C. malonaticus және L. brevis плазмидаларында орналасқан. Бұл нәтижелер өсімдік тектес ірімшік аналогтарымен байланысты микроорганизмдер микробқа қарсы төзімділік детерминанттарының резервуары ретінде қызмет етуі мүмкін екенін көрсетеді, бұл технологиялық немесе пробиотикалық мақсаттарда қолдануға арналған штаммдарды қауіпсіздік тұрғысынан бағалау және микробиологиялық қадағалаудың маңыздылығын көрсетеді.&lt;/p&gt;\n&lt;p&gt;Түйінді сөздер: Микробиологиялық қауіпсіздік · Сүт қышқылы бактериялары · Толық геномдық секвенирлеу · Мобильді генетикалық элементтер · Төзімділік гендері&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"ashytylghan-oenimderding-mikrobiologiyalykh-khauipsizdigi\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#ashytylghan-oenimderding-mikrobiologiyalykh-khauipsizdigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ашытылған өнімдердің микробиологиялық қауіпсіздігі&lt;/span&gt;&lt;/a&gt;Ашытылған өнімдердің микробиологиялық қауіпсіздігі&lt;/h4&gt;\n&lt;p&gt;Тамақ өнімдерінің қауіпсіздігі бүкіл әлемде, әсіресе микробтық ашытуға негізделген өнімдерде қоғамдық денсаулық сақтаудың басты мәселесі болып қала береді. Ашытылған өнімдер өнімнің сапасына, тұрақтылығына және сенсорлық сипаттамаларына ықпал ететін күрделі микробтық қауымдастықтарды қамтиды, бірақ олар шикізат, өндірістік орта немесе өндірістен кейінгі ластану арқылы енген қалаусыз микроорганизмдерді де қамтуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ашытылған өнімдердегі микробтық қауымдастықтар сапа үшін маңызды, бірақ олар сыртқы ортадан түскен патогендерді қамтуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңғы жылдары өсімдік тектес ірімшік аналогтарының нарығы тұрақты, этикалық және денсаулыққа пайдалы жануар өнімдеріне балама іздеген тұтынушылар сұранысының артуына байланысты айтарлықтай өсті. Бұл өнімдер әдетте жаңғақтардан, бұршақ дақылдарынан, тұқымдардан, крахмалдардан және өсімдік майларынан өндіріледі және жиі дәмді, текстураны, сақтау мерзімін және өнімнің жалпы қабылдануын жақсарту үшін ашытқылар, зең саңырауқұлақтары және сүт қышқылы бактериялары (LAB) қатысатын ашыту процестерін қамтиды. Осы микробтардың ішінде LAB қышқылдану, дәмнің дамуы және бұзылу микроорганизмдерін басу арқылы орталық технологиялық рөл атқарады.&lt;/p&gt;\n&lt;h4 id=\"taeuekelder-zhaene-antimikrobtykh-toezimdilik\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#taeuekelder-zhaene-antimikrobtykh-toezimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тәуекелдер және антимикробтық төзімділік&lt;/span&gt;&lt;/a&gt;Тәуекелдер және антимикробтық төзімділік&lt;/h4&gt;\n&lt;p&gt;Өсімдік тектес ірімшік секторының қарқынды өсуіне қарамастан, бұл өнімдердің микробиологиялық қауіпсіздігі туралы ақпарат шектеулі болып қалуда. Бұл әсіресе өзекті, өйткені көптеген өнімдер шағын өндірушілер тарапынан дайындалады және термиялық өңдеуден немесе ашытудан өтпеуі мүмкін, бұл олардың оппортунистік немесе патогендік микроорганизмдермен ластануға бейімділігін арттыруы мүмкін. Сонымен қатар, ашытылған өнімдерде бар микробтық популяциялар антимикробтық төзімділік (AMR) детерминанттарының әлеуетті резервуарлары ретінде көбірек назар аудартуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Антимикробтық төзімділік (AMR) — бұл микроорганизмдердің антибиотиктердің әсеріне төзімділігі, бұл инфекцияларды емдеуді қиындатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LAB әдетте қауіпсіз деп танылған және бастапқы дақылдар мен пробиотиктер ретінде кеңінен қолданылғанымен, кейбір штамдарда алынған антимикробтық төзімділік гендері (ARG) бар екені, әсіресе микробтық қауымдастықтар ішінде гендердің көлденең тасымалдануына ықпал ететін мобильді генетикалық элементтермен байланыстылары туралы хабарланған. Тамақ өнімдерімен байланысты микроорганизмдерде ARG болуы міндетті түрде денсаулыққа тікелей қауіп төндірмейді; алайда, осы детерминанттарды мониторингтеу тамақ өнімдерінің AMR экологиясы мен таралуындағы әлеуетті рөлін жақсырақ түсінуге көмектеседі. Демек, микробиологиялық қауіпсіздікті де, AMR профильдерін де бағалау ашытылған тамақ жүйелерінде барған сайын өзекті бола түсуде.&lt;/p&gt;\n&lt;p&gt;Осы контекстте, бұл зерттеу бразилиялық кешью негізіндегі өсімдік ірімшік аналогтарының микробиологиялық қауіпсіздігін бағалады және осы өнімдерден бөлінген сүт қышқылы бактериялары мен бактериялық ластаушылардың антимикробтық сезімталдық профильдерін зерттеді. Сонымен қатар, таңдалған изоляттар AMR гендерінің бар-жоғын бағалау үшін толық геномдық секвенирлеу арқылы сипатталды.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"indikatorlykh-zhaene-patogendi-mikroorganizmderdi-saejkestendiru\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#indikatorlykh-zhaene-patogendi-mikroorganizmderdi-saejkestendiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индикаторлық және патогенді микроорганизмдерді сәйкестендіру&lt;/span&gt;&lt;/a&gt;Индикаторлық және патогенді микроорганизмдерді сәйкестендіру&lt;/h4&gt;\n&lt;p&gt;Талданған үлгілердің ешқайсысында Salmonella spp., E. coli немесе коагулаза-оң Staphylococcus анықталмады (Кесте 1). ISO негізіндегі санау әдісіне сәйкес B. cereus колониялары расталмады. Дегенмен, сүт қышқылы бактерияларын (LAB) бөліп алу кезінде алынған бір изолят MALDI-TOF MS көмегімен B. cereus деп жіктелді. Негізгі тағамдық патогендер мен гигиена индикаторларының болмауы талданған өнімдердің қанағаттанарлық гигиеналық жағдайда өндірілгенін көрсетеді. Correia және т.б. (2026) зерттеуінде де ұқсас нәтижелер хабарланған, онда Бразилиядан алынған өсімдік негізіндегі ірімшік аналогтарында Salmonella spp. немесе Listeria monocytogenes іздері табылмаған, бірақ бағаланған өнімдердің 27%-ында B. cereus споралары анықталған. Бұл зерттеуде, тек бір B. cereus изоляты анықталғанына және ол селективті санау процедурасы арқылы қалпына келтірілмегеніне қарамастан, оның болуы назар аударуға тұрарлық, өйткені кейбір штамдар тағамдық аурулармен байланысты токсиндерді өндіре алады. Бұл микроорганизм әдетте өсімдік тектес ингредиенттермен және қоршаған орта көздерімен байланысты болғандықтан, оның болуы шикізаттан немесе өндірістік ортадан туындайтын ластануды көрсетуі мүмкін, бұл өсімдік негізіндегі ірімшік аналогтарын өндіру тізбегінде спора түзуші бактерияларды мониторингтеудің маңыздылығын арттырады. Үлгілердің көпшілігінде зең мен ашытқылардың жоғары мөлшері байқалды, оның ішінде ашытқылар басым болды (Кесте 1). Бразилия заңнамасына (IN № 313/2024) сәйкес, зең мен ашытқыларға арналған микробиологиялық шектеулер тірі микроорганизмдермен әдейі өндірілген тағамдарға қолданылмайды. Сондықтан, ферменттелген өсімдік негізіндегі ірімшік аналогтарындағы бұл жоғары көрсеткіштер микробиологиялық сапаның төмендігін көрсететін индикатор ретінде қабылданбауы керек. Осы зерттеуде талданған бірнеше үлгінің жапсырмаларында пробиотикалық, мезофильді немесе вегандық дақылдар қолданылғаны көрсетілген, бұл байқалған көрсеткіштерді ішінара түсіндіруі мүмкін. Сонымен қатар, өздігінен ферменттелумен байланысты жарияланбаған микроорганизмдер де бұл микробтық популяцияларға үлес қосуы мүмкін. Технологиялық тұрғыдан алғанда, ашытқылар мен зеңдер ферменттелген өсімдік негізіндегі ірімшік аналогтарында пісіп-жетілу кезінде дәмнің дамуына қосқан үлесі үшін қолайлы болуы мүмкін. Geotrichum candidum сияқты түрлер липолитикалық және протеолитикалық белсенділігіне байланысты әдетте пісіп-жетілу дақылдары ретінде қолданылады, бұл сенсорлық қасиеттерді жақсарта алады. Дегенмен, &lt;a href=\"concepts/fermentation.html\"&gt;ферментация&lt;/a&gt; немесе пісіп-жетілу процестеріне арналмаған өнімдерде ашытқылардың жоғары мөлшері бұзылу әлеуетін немесе процесті жеткіліксіз бақылауды көрсетуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттелген үлгілерде патогендер (Salmonella, E. coli, S. aureus) анықталмады, алайда B. cereus болуы және ашытқылардың жоғары деңгейі өндірісте бақылауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"suet-khyshkhyly-bakteriyalaryn-lab-boelip-alu-zhaene-saejkestendiru\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#suet-khyshkhyly-bakteriyalaryn-lab-boelip-alu-zhaene-saejkestendiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сүт қышқылы бактерияларын (LAB) бөліп алу және сәйкестендіру&lt;/span&gt;&lt;/a&gt;Сүт қышқылы бактерияларын (LAB) бөліп алу және сәйкестендіру&lt;/h4&gt;\n&lt;p&gt;Болжамды LAB талданған 13 үлгінің 10-ында анықталып, барлығы 176 изолят алынды, ал қалған үш үлгіде LAB табылмады. Бактерия түрлерінің таралуы өнімдер арасында әртүрлі болды (Сурет 1A). Үлгілер бойынша бактериялық қауымдастық құрылымында айтарлықтай өзгерістер байқалды. Кейбір өнімдерде бір түр басым болса, басқаларында бактериялық таксондардың кең ауқымы болды. Бұл үлгілер шикізат, өңдеу шарттары, бастапқы дақылдарды қолдану және өздігінен ферменттелу құбылыстарындағы айырмашылықтарды көрсетуі мүмкін. LAB қауымдастығында E. faecium (39 изолят), L. plantarum (32 изолят), &lt;a href=\"concepts/pediococcus-acidilactici.html\"&gt;Pediococcus acidilactici&lt;/a&gt; (24 изолят), L. mesenteroides (23 изолят), Pediococcus pentosaceus (17 изолят) және Lacticaseibacillus paracasei (15 изолят) басым болды (Сурет 1B). Сонымен қатар, LAB-қа жатпайтын бірнеше түр, атап айтқанда Bacillus subtilis, B. cereus, Cronobacter malonaticus және Delftia acidovorans анықталды. Осы зерттеуде анықталған басым түрлердің бірнешеуі бұрын ферменттелген өсімдік негізіндегі ірімшік аналогтарында тіркелген. Атап айтқанда, L. plantarum, Leuconostoc spp. және Pediococcus spp. өсімдік негізіндегі субстраттарға жақсы бейімделген және ферментация кезінде қышқылдану, дәмнің дамуы және құрылымның қалыптасуында маңызды рөл атқарады. Дегенмен, мұнда байқалған E. faecium басымдығы Lactococcus lactis және L. mesenteroides ең көп таралған түрлер ретінде тіркелген алдыңғы зерттеулерден ерекшеленеді. Enterococcus spp. әдетте ферменттелген тағамдарда кездесіп, ферментация процестеріне үлес қоса алатынына қарамастан, кейбір штамдар AMR (антимикробтық төзімділік) және оппортунистік инфекциялармен байланысты. Демек, талданған үлгілерде олардың жоғары деңгейде таралуы қауіпсіздік пен технологиялық маңыздылықты бағалау үшін штамм деңгейінде қосымша сипаттау қажеттілігін көрсетеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe-f1.jpg\" alt=\"Талданған үлгілер арасындағы бактериялық изоляттардың таралуы (a) және әрбір түр үшін анықталған изоляттардың жалпы саны\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Талданған үлгілер арасындағы бактериялық изоляттардың таралуы (a) және әрбір түр үшін анықталған изоляттардың жалпы саны (b)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Микроорганизмдерді сәйкестендіру MALDI-TOF MS әдісі арқылы жүзеге асырылды — бұл бактерияны ақуыз профилі бойынша жылдам анықтауға мүмкіндік беретін масс-спектрометрия әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"patogendik-aeleueti-bar-baskha-bakteriyalardy-saejkestendiru\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#patogendik-aeleueti-bar-baskha-bakteriyalardy-saejkestendiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Патогендік әлеуеті бар басқа бактерияларды сәйкестендіру&lt;/span&gt;&lt;/a&gt;Патогендік әлеуеті бар басқа бактерияларды сәйкестендіру&lt;/h4&gt;\n&lt;p&gt;Зерттелген нысаналы микроорганизмдерден бөлек, BGA ортасында бөлінген атипті колониялар C. malonaticus және Delftia acidovorans ретінде сәйкестендірілді (1-сурет). 1-кестеде кешью негізіндегі ірімшік аналогтары үлгілерінің микробиологиялық талдауы келтірілген. C. malonaticus екі үлгіде (S4 және S5) анықталды. Бұл түр өзінің оппортунистік патогендік әлеуеті және адамдардағы инфекциялармен байланысы себебінен ерекше назар аударуды талап етеді. Cronobacter spp. өкілдері дәнді дақылдар, шөптер, көкөністер, сүт өнімдері және құрғақ сәби қоспалары сияқты тағам өнімдерінің кең ауқымынан бөлінген. Cronobacter spp. негізгі резервуарлары толық анықталмағанымен, өсімдік шикізаты мен өндірістік орта ластанудың маңызды көздері болып саналады. Сонымен қатар, бұл бактериялардың биофильмдер түзу қабілеті олардың өндіріс орындарында сақталуына ықпал етіп, тағам өндірісі кезінде ластану қаупін арттыруы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кешью негізіндегі ірімшік аналогтары үлгілерінде C. malonaticus және D. acidovorans анықталды, бұл қоршаған ортадан немесе шикізаттан ластану ықтималдығын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Delftia acidovorans — су жүйелері мен биофильмдерде жиі анықталатын қоршаған орта бактериясы. Ол әдетте вируленттілігі төмен микроорганизм деп есептелсе де, кейде оппортунистік инфекциялармен, әсіресе иммунитеті әлсіз адамдарда байланыстырылады. Бұл зерттеуде оның анықталуы ферментация процесіне тікелей қатысуынан гөрі, шикізаттан немесе өндірістік орындардан туындаған қоршаған ортаның ластануын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"antimikrobtykh-toezimdilik\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#antimikrobtykh-toezimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Антимикробтық төзімділік&lt;/span&gt;&lt;/a&gt;Антимикробтық төзімділік&lt;/h4&gt;\n&lt;p&gt;Алынған 69 өкілдік изоляттан 20 штамм антимикробтық сезімталдықты тексеру үшін таңдап алынды. Төзімділік 11 изолятта (55%) анықталды, олар бактериялардың төрт түрін білдіреді (2-кесте). Төзімділік фенотиптері негізінен ципрофлоксацин, тетрациклин, гентамицин және пенициллинмен байланысты болды. Екі E. faecium изоляты гентамицин мен ципрофлоксацинге төзімділік көрсетті, бұл тағаммен байланысты Enterococcus spp. арасындағы антимикробтық төзімділік (AMR) туралы алдыңғы есептерге сәйкес келеді. Керісінше, D. acidovorans сыналған барлық антимикробтық препараттарға сезімтал болды, ал C. malonaticus пенициллинге төзімділік көрсетті. Алдыңғы зерттеулер де ферменттелген өнімдерден бөлінген сүт қышқылы бактериялары (LAB) арасында, әсіресе ванкомицинге, аминогликозидтерге және хинолондарға төзімділік бар екенін растаған. Бұл нәтижелер ферменттелген тағам өнімдерімен байланысты микроорганизмдерде AMR мониторингін жүргізудің маңыздылығын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында: таңдап алынған изоляттардың 55 пайызында анықталған төзімділік тұтынушылар үшін қауіптерді бағалау мақсатында қосымша зерттеуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"genomdykh-sekvenirleu-zhaene-rezistomdy-taldau\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#genomdykh-sekvenirleu-zhaene-rezistomdy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Геномдық секвенирлеу және резистомды талдау&lt;/span&gt;&lt;/a&gt;Геномдық секвенирлеу және резистомды талдау&lt;/h4&gt;\n&lt;p&gt;Микробқа қарсы препараттарға сезімталдық профильдері негізінде таңдалған бес репрезентативті изолятқа толық геномдық секвенирлеу жүргізілді. Секвенирленген штамдардың ішінде микробқа қарсы резистенттілік (AMR) гендері тек C. malonaticus геномында анықталды. Анықталған резистенттілік детерминанттары, оларға сәйкес келетін микробқа қарсы препараттар кластары және резистенттілік механизмдері 3-кестеде келтірілген. C. malonaticus — бұл өзінің вируленттілік әлеуетімен және AMR детерминанттарын қабылдап, сақтап қалу қабілетімен белгілі грам-теріс оппортунистік патоген. Бұл түрде анықталған резистенттілік гендерінің көпшілігі көптеген дәрілік заттарға төзімділік (multidrug efflux) жүйелерімен және реттеуші жолдармен байланысты, бұл фторхинолондар, цефалоспориндер және тетрациклиндер, сондай-ақ дезинфекциялаушы және антисептикалық қосылыстарды қоса алғанда, бірнеше микробқа қарсы препараттар кластарына сезімталдықтың төмендеуіне ықпал етуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AMR гендері тек C. malonaticus-та анықталды; олар бірнеше антибиотиктер класы мен антисептиктерге төзімділікті қамтамасыз ететін эффлюкс жүйелерімен байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Плазмидамен байланысты аймақтарда орналасқан резистенттілік детерминанттарына келетін болсақ, ванкомицин, хлорамфеникол, фосфомицин және тетрациклинге төзімділікпен байланысты гендер C. malonaticus және L. brevis-те анықталды (4-кесте). C. malonaticus-та анықталған гендердің көпшілігі грам-теріс бактерияларда жиі кездесетін көптеген дәрілік заттарға төзімділік эффлюкс жүйелерімен және реттеуші механизмдермен байланысты болды. Керісінше, L. brevis құрамында Major Facilitator Superfamily (MFS) жататын тетрациклиндік эффлюкс транспортерлерін кодтайтын гендер болды. Ішкі (intrinsic) резистенттілік сүт қышқылы бактерияларының (LAB) бірнеше түрінің танылған сипаттамасы болғанымен, тамақ өнімдерімен байланысты бактерияларда мобильді генетикалық элементтер тасымалдайтын AMR гендерінің болуы олардың көлденең таралу әлеуетіне байланысты алаңдаушылық тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффлюкс — бұл бактериялық жасушаның антибиотикті сыртқа белсенді «айдап шығару» механизмі, ол оның жасуша ішінде жиналуына жол бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы тұрғыда, ашытылған өсімдік тектес тамақ өнімдерінде төзімді микроорганизмдер мен резистенттілік детерминанттарының анықталуы микробиологиялық және геномдық мониторинг стратегияларын біріктірудің маңыздылығын, әсіресе технологиялық немесе пробиотикалық қолданылуы мүмкін штамдар үшін атап көрсетеді. Бағаланған изоляттар арасында резистенттіліктің кездесуі шектеулі болғанымен, бұл гендердің анықталуы тамақ өнімдерімен байланысты микроорганизмдердің AMR детерминанттарының резервуары ретіндегі әлеуетті рөлін көрсетеді және қадағалау мақсатында фенотиптік және геномдық тәсілдерді біріктірудің құндылығын айқындайды (2-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бес изоляттан тұратын шектеулі таңдамада жүргізілді; нәтижелерді барлық тамақ өнімдеріне экстраполяциялауға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"uelgilerdi-zhinau\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#uelgilerdi-zhinau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Үлгілерді жинау&lt;/span&gt;&lt;/a&gt;Үлгілерді жинау&lt;/h4&gt;\n&lt;p&gt;Бразилияда өндірілген кешью негізіндегі өсімдік ірімшігі аналогтарының он үш үлгісі (S1–S13) жергілікті супермаркеттерден, жәрмеңкелерден және электронды коммерция платформаларынан сатып алынды (Қосымша кесте 1). Үлгілерді таңдау Google сияқты желілерде іздеу арқылы жүзеге асырылды, бұл ретте 2023 жылдың тамызы мен 2024 жылдың қаңтары аралығында қолжетімді өнімдер ескерілді. Үлгілер 4 °C температурада сақталды, ал микробиологиялық талдаулар өнім жапсырмасында көрсетілген жарамдылық мерзімі аяқталғанға дейін орындалды.&lt;/p&gt;\n&lt;h4 id=\"indikatorlykh-zhaene-patogendik-mikroorganizmderdi-saejkestendiru\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#indikatorlykh-zhaene-patogendik-mikroorganizmderdi-saejkestendiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индикаторлық және патогендік микроорганизмдерді сәйкестендіру&lt;/span&gt;&lt;/a&gt;Индикаторлық және патогендік микроорганизмдерді сәйкестендіру&lt;/h4&gt;\n&lt;p&gt;Зерттелетін микроорганизмдерді таңдау Бразилияның Денсаулық сақтауды реттеу агенттігі (ANVISA) 2022 жылғы 1 шілдеде шығарған № 161 Нормативтік нұсқаулықтың (IN) I қосымшасына, атап айтқанда, 4-топқа (өсімдік негізіндегі басқа өнімдер), (c) санатына: салқындатылған тофу, суфу және ұқсас өнімдерге негізделді. Микробиологиялық талдаулар Salmonella spp. анықтауды және коагулаза-оң Staphylococcus, Escherichia coli, болжамды Bacillus cereus, сондай-ақ зең саңырауқұлақтары мен ашытқыларды санауды қамтыды. Әдістер Халықаралық стандарттау ұйымының (ISO) 6579:2002, ISO 6888-1:1999, ISO 16649-2:2001, ISO 7932:2004 және ISO 21527-1:2008 стандарттарына бейімделе отырып негізделді. Әрбір талдау үшін 25 г үлгі буферлі пептонды суда (BPW; Oxoid, Бейзингсток, Ұлыбритания) гомогенизацияланды. Коагулаза-оң Staphylococcus, болжамды B. cereus, сондай-ақ зең саңырауқұлақтары мен ашытқылар сұйылтылған үлгінің 0,1 мл бөлігін селективті ортаға беттік егу әдісімен саналды. Baird-Parker агары (BP; Oxoid) коагулаза-оң Staphylococcus үшін, &lt;a href=\"concepts/mannitol.html\"&gt;маннит&lt;/a&gt;-жұмыртқа сарысы-полимиксин агары (MYP; Oxoid) болжамды B. cereus үшін және ашытқы-глюкоза-хлорамфеникол агары (YGC; Merck, Германия) зең саңырауқұлақтары мен ашытқылар үшін пайдаланылды. Табақшалар Drigalski шпателінің көмегімен егілді және аэробты жағдайда 35 ± 1 °C температурада 48 ± 2 сағат (BP), 30 ± 1 °C температурада 18–24 сағат (MYP) және 25 ± 1 °C температурада 5 күн (YGC) бойы инкубацияланды. Escherichia coli Петри табақшасына 1 мл сұйылтылған үлгіні ауыстыру және кейіннен триптон-өт-X-глюкуронид агарын (TBX; Neogen, АҚШ) қосу арқылы саналды. Гомогенизациядан кейін табақшалар аэробты жағдайда 44 ± 1 °C температурада 24 сағат бойы инкубацияланды. Salmonella spp. анықтау үшін BPW суспензиялары 37 ± 1 °C температурада 18–24 сағат бойы алдын ала байытылды. Кейіннен 0,1 мл және 1 мл аликвоттар Rappaport-Vassiliadis соя (RVS; Oxoid) және Muller-Kauffmann тетратионат новобиоцин (MKTTn; Oxoid) орталарына ауыстырылды және сәйкесінше 45 ± 1 °C және 37 ± 1 °C температурада 24 ± 3 сағат бойы инкубацияланды. Келесі селективті байыту үшін алдын ала байытылған үлгінің 10 мкл бөлігі ксилоза-лизин-дезоксихолат агарына (XLD) және жасыл бриллиант агарына (BGA; Oxoid) егілді. Зең саңырауқұлақтары мен ашытқыларды санау үшін BPW-де тізбекті ондық сұйылтулар дайындалды және әрбір сұйылтудан 0,1 мл YGC агарына беттік егілді. Барлық табақшалар нысаналы микроорганизмнің типтік морфологиясына ие колониялар үшін талданды. Сонымен қатар, қоректік агарда (NA; Neogen, АҚШ) өсірілген морфологиялық жағынан ерекшеленетін колониялар таңдап алынды және матрицамен активтендірілген лазерлік десорбция/ионизация және уақыт өлшемді масс-спектрометрия (MALDI-TOF MS) көмегімен сәйкестендірілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MALDI-TOF MS әдісі микроорганизмдердің бірегей ақуыз профилін лазер және масс-спектрометр көмегімен талдап, оларды жедел анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"suet-khyshkhyly-bakteriyalaryn-skhb-boelip-alu-zhaene-saejkestendiru\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#suet-khyshkhyly-bakteriyalaryn-skhb-boelip-alu-zhaene-saejkestendiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сүт қышқылы бактерияларын (СҚБ) бөліп алу және сәйкестендіру&lt;/span&gt;&lt;/a&gt;Сүт қышқылы бактерияларын (СҚБ) бөліп алу және сәйкестендіру&lt;/h4&gt;\n&lt;p&gt;СҚБ ISO 15214:1998 стандартынан бейімделген әдіс бойынша бөліп алынды. Үлгілердің тізбекті ондық сұйылтулары BPW-де дайындалды және 0,1 мл Drigalski шпателінің көмегімен Man, Rogosa &amp;amp; Sharpe (MRS) агарына беттік егілді. Табақшалар анаэробты жағдайда 30 ± 2 °C температурада 48 ± 3 сағат бойы инкубацияланды. Инкубациядан кейін колониялар өлшемі, пішіні, түсі, текстурасы және жиегі сияқты морфологиялық ерекшеліктеріне қарай таңдап алынды, бұл ретте әрбір үлгіден 24 колонияға дейін алынды. Изоляттар MRS сорпасында тазартылды және MALDI-TOF MS көмегімен сәйкестендіру алдында бірдей жағдайда инкубацияланды.&lt;/p&gt;\n&lt;h4 id=\"antimikrobtykh-sezimtaldykhty-tekseru\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#antimikrobtykh-sezimtaldykhty-tekseru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Антимикробтық сезімталдықты тексеру&lt;/span&gt;&lt;/a&gt;Антимикробтық сезімталдықты тексеру&lt;/h4&gt;\n&lt;p&gt;Антимикробтық сезімталдық тесті диск-диффузия әдісі (Kirby-Bauer) және BrCAST анықтамалығы көмегімен орындалды. Сынақтан бұрын СҚБ изоляттары және C. malonaticus пен D. acidovorans-тың жеке колониялары MRS және BHI сорпаларында өсірілді. Келесі антибиотиктер сыналды: ванкомицин (30 мкг), тетрациклин (30 мкг), хлорамфеникол (30 мкг), амоксициллин (10 мкг), гентамицин (120 мкг), ампициллин (10 мкг), стрептомицин (300 мкг), эритромицин (15 мкг), ципрофлоксацин (5 мкг) және пенициллин (10 мкг). Бактериялық суспензиялар 0,85% физиологиялық ерітіндіде 0,5 McFarland стандарты бойынша реттелді және стерильді тампон көмегімен тиісті агар ортасына жайылды. Антибиотик дискілері агар бетіне орналастырылды және табақшалар әрбір изоляттың өсу талаптарына сәйкес 30 ± 2 °C (MRS) анаэробты немесе 36 ± 2 °C (BHI) аэробты жағдайда 24 сағат бойы инкубацияланды. Ингибиция аймақтарының диаметрлері өлшенді және BrCAST критерийлеріне сәйкес сезімтал немесе резистентті деп бағаланды.&lt;/p&gt;\n&lt;h4 id=\"tolykh-genomdy-sekvenirleu-zhaene-genomdykh-taldau\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#tolykh-genomdy-sekvenirleu-zhaene-genomdykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толық геномды секвенирлеу және геномдық талдау&lt;/span&gt;&lt;/a&gt;Толық геномды секвенирлеу және геномдық талдау&lt;/h4&gt;\n&lt;p&gt;Антимикробтық сезімталдық профильдеріне негізделе отырып, толық геномды секвенирлеу үшін бес изолят таңдап алынды: Lactiplantibacillus plantarum, Levilactobacillus brevis, Leuconostoc mesenteroides, Enterococcus faecium және Cronobacter malonaticus. Геномдық ДНҚ PureLink™ Genomic DNA Mini Kit жинағын қолдану арқылы бөлініп алынды және Qubit™ dsDNA Quantification Assay Kit көмегімен сандық анықталды. ДНҚ концентрациясы ≥ 10 нг/мкл болатын үлгілер IPEC Guarapuava (Бразилия) зертханасына Illumina NovaSeq 6000 платформасы мен жұптық-соңғы (paired-end) оқылымдарды қолдана отырып, «shotgun» әдісімен секвенирлеуге жіберілді. Деректерді талдау fastp (v0.23.2) бағдарламасының көмегімен оқылымдардың сапасын бастапқы бақылау кезеңін қамтыды, мұнда -q 30 -w 30 --cut_front --cut_tail --n_base_limit 0 --length_required 50 жалаушалары қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Толық геномды секвенирлеу (WGS) — бұл организмнің ДНҚ-сындағы нуклеотидтердің толық тізбегін анықтау әдісі, ол антибиотиктерге төзімділік гендері мен патогендік факторларды анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Геномды de novo жинақтау SPAdes (v3.15.5) бағдарламалық жасақтамасы арқылы жүзеге асырылды, мұнда жоғары қамту (coverage) алынғандықтан «--isolate» жалаушасы қолданылды. Антимикробтық төзімділік (AMR) гендері RGI (Resistance Gene Identifier, v6.0.0) құралының көмегімен CARD (Comprehensive Antibiotic Resistance Database, v3.2.6) деректер базасына қатысты анықталды, мұнда негізгі функциялар, қатаң теңестіру шектері және сәйкес келетін аймақтың ≥ 85% сәйкестігі ескерілді. Мобильді генетикалық элементтер мен олармен байланысты төзімділік гендері стандартты параметрлері бар geNomad көмегімен зерттелді. Секвенс-типтері (ST) көп локусты секвенс-типтеу (MLST) деректер базасы арқылы анықталды. Әрбір геномның патогендік әлеуеті кейіннен PathogenFinder 1.1 веб-сервері арқылы бағаланды, ол геномдық сипаттамаларға негізделе отырып, бактерияның адам үшін патоген болу ықтималдығын болжайды. Болжамды патогендік ықтималдығы ≥ 0,5 болатын геномдар потенциалды патогенді деп жіктелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Өсімдік&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ірімшіктерінің&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қауіпсіздігі&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Микробиологиял&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ық талдау және&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;секвенирлеу&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Антибиотиктерг&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;е төзімділік&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гендері&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;табылды&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ашытқыларды&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қатаң бақылау&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қажет&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Brazilian journal of microbiology : (publication of the Brazilian Society for Microbiology) журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-06/microbiological-safety-and-antimicrobial-resistance-in-cashe.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Brazilian journal of microbiology : (publication of the Brazilian Societ
