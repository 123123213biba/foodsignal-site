        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"244\" cy=\"174\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"496\" cy=\"172\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кендір мен сұлы: ферментация&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өсімдік ақуызының құрылымын&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай өзгертеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f1.jpg\" alt=\"Жалпы амин қышқылдарының құрамын негізгі компоненттер бойынша талдау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жалпы амин қышқылдарының құрамын негізгі компоненттер бойынша талдау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Жалпы амин қышқылдарының құрамын негізгі компоненттер бойынша талдау. Өлшенген айнымалылар арасындағы байланысты көрсететін 1-компонент (PC1, 59,9%) және 2-компонент (PC2, 20,0%) биплоттары. (A) Өңдеу әдісі бойынша топтастырылған үлгілері бар биплот. (B) Құрамы бойынша топтастырылған үлгілері бар биплот.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Зерттеушілер кендір мен сұлы күнжарасының қоспасы болашақ өнімдердің қасиеттеріне қалай әсер ететінін зерттеді. Сүт қышқылы бактерияларымен ферментациялау термиялық өңдеу кезінде бұзылған ақуыздың ерігіштігін ішінара қалпына келтіруге көмектесетіні анықталды. Текстура мен қоректік құндылық үшін 75% кендір мен 25% сұлы қатынасы оңтайлы деп танылды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;pH 5,2 деңгейіндегі &lt;a href=\"concepts/fermentation.html\"&gt;ферментация&lt;/a&gt; пастерлеуден кейін ақуыздың ерігіштігін қалпына келтіреді.&lt;/li&gt;\n&lt;li&gt;75:25 кендір мен сұлы күнжарасының қатынасы қоректік құндылық үшін ең оңтайлысы.&lt;/li&gt;\n&lt;li&gt;Сұлы күнжарасы сүт қышқылы бактериялары үшін көмірсу көзі қызметін атқарады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу май өндірісінің қосымша өнімі — күнжараны пайдалануға негізделген. Кендір күнжарасы ақуызға бай (20–40%), бірақ бактерияларға қажетті көмірсуларға кедей, сондықтан құрамға сұлы күнжарасы қосылды. Үлгілер 80 °C температурада 10 минут бойы пастерленді, содан кейін 40 °C температурада pH 5,2 деңгейіне жеткенше Streptococcus thermophilus және Lactobacillus delbrueckii (100 DCU/кг) дақылдарымен ферменттелді.&lt;/p&gt;\n&lt;p&gt;Талдау көрсеткендей, пастерлеу ақуыз агрегациясын тудырады, бұл &lt;a href=\"concepts/sds-page.html\"&gt;SDS-PAGE&lt;/a&gt; (полиакриламидті гельдегі электрофорез) деректерімен расталды. Ферментация болса, pH өзгеруі және құрылымдық қайта құрылу есебінен ақуыздың ерігіштігін ішінара қалпына келтіруге көмектеседі. 75:25 қатынасы (кендір:сұлы) функционалдық қасиеттері бойынша ең жақсы нәтижелерді көрсетті және таза кендір күнжарасымен салыстырғанда ақуыз мөлшері мен аминқышқылдарының профилін сақтап қалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу әр үлгінің бір ғана партиясында жүргізілді, бұл нәтижелердің статистикалық сенімділігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Вегетариандық, вегетариандық және флекситариандық диеталардың кеңінен таралуы жануарлар этикасы, қоршаған орта мәселелері, тамақтану және денсаулыққа қатысты тәуекелдер сияқты әртүрлі факторлармен байланысты. Көптеген адамдар етті оның сенсорлық қасиеттері немесе жергілікті тағамдардағы мәдени маңызы үшін бағалайтынына қарамастан, өсімдік шикізаты ет өнімдерінің аналогтарын немесе етті алмастыратын ингредиенттерді өндіру үшін жиі қолданылуда. Сонымен қатар, өсімдік негізіндегі өнеркәсіпте 3D-басып шығару және ылғалды иіру сияқты жаңа құрылымдау әдістерін ашыту (ферментация) сияқты белгілі биохимиялық өңдеу әдістерімен біріктіріп, тұтынушылар үшін тартымды, қоректік және тұрақты нұсқаларды ұсыну үрдісі байқалады. Май өндіру өнеркәсібінің жанама өнімі болып табылатын сығындылар (күнжаралар) ақуыз бен биоактивті қосылыстарға бай болғандықтан, тамақ өндірісі үшін құнды шикізат ретінде пайда болуда. Май алу үшін қарасора тұқымын суық сығымдау нәтижесінде алынған қарасора сығындысы (HPC) майлы дақылдар сығындылары арасында салыстырмалы түрде жоғары ақуыз мөлшері (20–40%), маңызды аминқышқылдары мен аргининнің жоғары деңгейі, сондай-ақ Литвадағы қарасора майы өнеркәсібінің кеңеюіне байланысты ерекше қызығушылық тудырады, бұл адам тағамында шектеулі қолданылатын осы жанама өнімнің көлемін арттыруда. Әлеуетіне қарамастан, сығындылар жиі толық пайдаланылмайды, олардың көбісі тасталады немесе жануарлар жемі сияқты төмен құнды қолданумен шектеледі. Сығындылардың ақуыз емес фракциясы, соның ішінде тағамдық талшықтар, минералдар және биоактивті қосылыстар ақуыз концентраттары мен изоляттарын өндіруге бағытталған өнеркәсіптік процестерде негізінен пайдаланылмай қалады. Тұндыру, сүзу және концентрациялау сияқты қосымша өңдеу кезеңдері де айтарлықтай энергия мен су ресурстарын жұмсайды, бұл тұрақтылыққа қатысты алаңдаушылық тудырады. Сонымен қатар, өсімдік ақуызының ерігіштігі көптеген дәстүрлі экстракция әдістері үшін күрделі шектеу болып қала береді. Минималды өңдеуге көшу және сығындыларды тікелей тағамдық рецептураларға енгізу қалдықтар мен энергия шығынын азайтып, өсімдік негізіндегі азық-түлік жүйелерінің жалпы тұрақтылығын арттыруы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қарасора сығындысы 20–40% ақуызды қамтиды және аргининге бай, алайда оның тамақ өнеркәсібіндегі әлеуеті ақуыз емес компоненттердің толық пайдаланылмауы және экстракция шығындарының жоғарылығына байланысты шектеулі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сығындыларды ақуыз көзі ретінде пайдалану қиындықсыз емес. Өсімдік ақуыздары әдетте маңызды аминқышқылдары профильдеріндегі шектеулер мен қорытылу деңгейінің төмендеуіне байланысты жануарлар ақуыздарына қарағанда сапасыз деп саналады. Сонымен қатар, өсімдік матрицалары фитин қышқылы, таниндер, сапониндер және лектиндер сияқты антинутритивті факторларды қамтиды, олар ас қорыту ферменттерін тежеу арқылы қоректік заттардың сіңуіне және ақуыздың қорытылуына кедергі келтіреді. Ферментация сығындылардың қоректік және функционалдық қасиеттерін жақсарту үшін перспективалы стратегия болып табылады. Ферментация сақтау ақуыздарын ішінара денатурациялау, ақуыз ерігіштігін арттыру және аминқышқылдарының қолжетімділігін жақсарту арқылы ақуыздың қорытылуын арттыруы мүмкін. Сонымен қатар, ферментация дәнді және жалған дәнді дақылдарда фитин қышқылы сияқты антинутритивті факторларды айтарлықтай төмендететіні көрсетілген және сығындыларға да ұқсас әсер етуі мүмкін. Қоректік жақсартулардан бөлек, ферментация сығындылардың су ұстау қабілеті (&lt;a href=\"concepts/water-holding-capacity.html\"&gt;WHC&lt;/a&gt;), эмульсиялау және гельдену қасиеттері сияқты техно-функционалдық қасиеттерін де арттыруы мүмкін, бұл олардың тағамдық рецептураларда қолданылуы үшін өте маңызды. Кейбір жеке сығындылардың ферментация әлеуеті зерттелгенімен, ферментацияның біріктірілген сығынды матрицаларына әсері негізінен зерттелмеген.&lt;/p&gt;\n&lt;p&gt;Қарасора сығындысы өзінің айтарлықтай ақуыз және талшық мөлшеріне байланысты осы зерттеуде негізгі матрица ретінде таңдалды. Алайда, оның төмен көмірсу мөлшері (~3,7 г/100 г) сүт қышқылы бактериялары үшін ферменттелетін субстраттың қолжетімділігін шектейді, олар көміртегі көзі ретінде негізінен суда еритін көмірсуларға сүйенеді. Сұлы сығындысы осы шектеуді жою үшін функционалдық модификатор ретінде енгізілді: оның қалдық крахмал мөлшері қосымша ферменттелетін көмірсу көзі бола алады, сонымен бірге кейінгі өңдеу кезеңдерінде (яғни, жоғары ылғалды &lt;a href=\"concepts/extrusion.html\"&gt;экструзия&lt;/a&gt;) кеңею мен текстураны модуляциялауға ықпал етеді. Осы екі сығындыны біріктіру олардың құрамдық толықтырушылығын пайдалануға бағытталған, өйткені өсімдіктен алынған ингредиенттерді әртүрлі қоректік және функционалдық профильдермен араластыру жеке шектеулерді өзара өтеу стратегиясы ретінде ұсынылған. Осы біріктірілген матрицаның ферментациясы оның қоректік құндылығы мен техно-функционалдық қасиеттерін одан әрі өзгертуі мүмкін, бұл оның өсімдік негізіндегі азық-түлік өнімдерін әзірлеудегі әлеуетті қолданылуын қолдайды. Қазіргі зерттеу сүт қышқылы ферментациясының ақуыз құрылымына, қоректік сипаттамаларына және біріктірілген сығынды матрицаларының техно-функционалдық параметрлеріне әсерін зерттеуге бағытталған. Атап айтқанда, зерттеу ақуыз тотығуы, деградациясы және байланыс профильдеріндегі, аминқышқылдары мен биогендік аминдер профильдеріндегі, сондай-ақ фитин қышқылы мөлшеріндегі өзгерістерді бағалайды. Сонымен қатар, зерттеу тұрақты және қоректік өсімдік негізіндегі тағамдық рецептураларды әзірлеу мақсатында WHC, май ұстау қабілеті (OHC) және бөлшек мөлшерін зерттейді. Біз қарасора-сұлы сығындысы біріктірілген матрицаларының сүт қышқылы ферментациясы олардың ақуыз құрылымын, қоректік сипаттамаларын және техно-функционалдық қасиеттерін рецептураға байланысты модуляциялайтынын, антинутритивті факторлар мөлшері мен ақуыз тотығуының азаюы және өңделмеген материалдарға қарағанда ақуыз ерігіштігі, WHC және OHC-ның жақсаруы күтілетінін болжаймыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу алдын ала болып табылады: ресурстардың шектеулілігіне байланысты әрбір рецептура мен өңдеу комбинациясы үшін тек бір өкілдік партия пайдаланылды, бұл тәуелсіз қайталаулармен болашақ жұмыстарда растауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Органикалық қарасора сығындысының (HPC) түйіршіктері Allive Europe UAB, Вошконяй, Литвадан алынды. Материал суық сығымдалған органикалық қарасора тұқымдарынан (максималды шығу температурасы 40 °C) алынды және кейіннен түйіршіктерге сығымдалды. Өңдеу процесінде ешқандай химиялық өңдеу жүргізілмеді. KTU Азық-түлік институтының зертханасында түйіршіктер бөлшек мөлшерінің біркелкілігін қамтамасыз ету үшін екі кезеңде ұнтақталды. Дөрекі ұнтақтау қолмен ет тартқышпен, ал неғұрлым ұсақ ұнтақтау әмбебап құрғақ өнім диірменімен (MLVS-M100, Мажейкяй, Литва) жүзеге асырылды. Ұнтақталған материал 500 мкм өлшемді тот баспайтын болаттан жасалған елеуіш (Glenammer, Шотландия, Ұлыбритания) арқылы елеуден өткізілді және бөлшек мөлшері &amp;gt;500 мкм және &amp;lt;500 мкм болатын екі фракцияға бөлінді; барлық кейінгі тәжірибелер үшін кішірек бөлшек мөлшері фракциясы пайдаланылды. Сұлы сығындысы (OPC) коммерциялық сұлыдан (Pranciškaus malūnas, Каунас, Литва) сол жерде өндірілді. Сұлы үлпектері дистилденген сумен 20 секунд бойы араластырылды және дәке арқылы сығылды. Сұлы сығындысы пеште 45 °C температурада 12 сағат бойы кептірілді, кофе тартқышпен механикалық түрде ұнтақталды және елеуден өткізілді (елеуіш өлшемі 500 мкм).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&amp;lt;500 мкм бөлшек мөлшері шикізатты стандарттауды қамтамасыз ету үшін таңдалды, бұл ферментация процестері мен кейінгі талдаулардың қайталануы үшін өте маңызды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ферментация тәжірибелері үшін HPC және OPC-ден тұратын өсімдік негізіндегі сығынды матрицаларының екі рецептурасы HPC:OPC араластыру қатынастарында 75:25 (H75:O25) және 50:50 (H50:O50) дайындалды. Бұл қатынастар OPC енгізілуінің градиентін көрсету үшін таңдалды: 75:25 қатынасы HPC-ні доминантты фракция ретінде сақтайды, оның ақуыз үлесін сақтай отырып, ферментация субстратының қолжетімділігі мен функционалдық қасиеттерін модуляциялау үшін орташа мөлшерде OPC енгізеді, 50:50 қатынасы болса ақуыз мөлшері OPC-нің төменірек ақуыз мөлшерімен қауіп төнуіне дейінгі жоғары енгізу деңгейін білдіреді. Таза HPC (H100)-дің үшінші рецептурасы да негізгі сілтеме ретінде енгізілді.&lt;/p&gt;\n&lt;p&gt;Шикі үлгілер (RAW) үшін әрбір сығынды рецептурасының (H100, H75:O25 және H50:O50) 500 г мөлшері өңделмеген күйінде қалдырылды, пластикалық пакеттерге ауыстырылды, вакууммен жабылды және талдауға дейін 4 °C-та сақталды. Пастерленген үлгілер (PAS) үшін әрбір сығынды рецептурасының (H100, H75:O25 және H50:O50) 500 г мөлшері 2 л көлемді шыны ыдыста 1450 мл дистилденген сумен араластырылды. Қоспалар келесідей пастерленді: индукциялық плита үстіндегі су моншасы көмегімен 80 °C-қа дейін қыздырылды. Температура 10 минут бойы ұсталып, термометр көмегімен бақыланды. Қоспа әр минут сайын стерильді металл үстел пышағы көмегімен араластырылды. 10 минуттан соң қоспа жабық ыдысты мұзды су моншасына батыру арқылы дереу 40 °C-қа дейін суытылды. Алынған қоспалар қалайы табаға жайылып, 60 °C-та 24 сағат бойы пеште кептірілді. Кептірілген үлгілер пластикалық пакеттерге ауыстырылды, вакууммен жабылды және талдауға дейін 4 °C-та сақталды. Пастерлеу процестің аралық бақылауы ретінде енгізілді, өйткені алдын ала тәжірибелер сүт қышқылы бактериялары пастерленбеген сығынды үлгілерін ферменттей алмайтынын көрсетті. Бұл топ тек пастерлеудің термиялық әсері мен сүт қышқылы ферментациясына байланысты биохимиялық әсерлерді ажыратуға мүмкіндік берді. Ферменттелген үлгілер (FER) үшін әрбір сығынды рецептурасының (H100, H75:O25 және H50:O50) 500 г мөлшері 2 л көлемді шыны ыдыста 1450 мл дистилденген сумен араластырылды. Қоспалар алдымен жоғарыда айтылғандай пастерленді — индукциялық плита үстіндегі су моншасы көмегімен 80 °C-қа дейін қыздырылды. Температура 10 минут бойы ұсталып, термометр көмегімен бақыланды. Қоспа әр минут сайын стерильді металл үстел пышағы көмегімен араластырылды. 10 минуттан соң қоспа жабық ыдысты мұзды су моншасына батыру арқылы дереу 40 °C-қа дейін суытылды. Содан кейін қоспаларға 0,375 г лиофилизацияланған коммерциялық стартер мәдениеті Y883 LYO 50 DCU (Streptococcus thermophilus және Lactobacillus delbrueckii subsp. bulgaricus штамдары) (Danisco, Копенгаген, Дания) қосылды, бұл 25 DCU/л немесе 100 DCU/кг инокуляция жылдамдығына әкелді. Ферментация 4–5 сағат бойы инкубаторда (BINDER, Tuttlingen, Германия) 40 °C-та жүзеге асырылды. Әр 30 минут сайын pH SevenCompact S220 pH-метрі (Mettler Toledo, Колумбус, OH, АҚШ) көмегімен тексерілді. Ферментация pH шамамен 5,2-ге жеткенде үлгіні 4 °C-қа қою арқылы тоқтатылды. Әрбір рецептура үшін бастапқы және соңғы pH, сондай-ақ ферментация уақыты төменде көрсетілген: H100 — бастапқы pH 6,50, соңғы pH 5,22, ферментация уақыты 5 сағат; H75:O25 — бастапқы pH 6,42, соңғы pH 5,20, ферментация уақыты 4 сағат; H50:O50 — бастапқы pH 6,35, соңғы pH 5,22, ферментация уақыты 4 сағат. Титрленетін қышқылдылық пен тіршілікке қабілетті &lt;a href=\"concepts/lactic-acid-bacteria.html\"&gt;LAB&lt;/a&gt; саны осы зерттеу үшін өлшенбеді және микробтық белсенділікті бағалаудың шектеуі болып табылады. Алынған қоспалар қалайы табаға жайылып, 60 °C-та 24 сағат бойы пеште кептірілді. Құрғақ үлгілер пластикалық пакеттерге ауыстырылды, вакууммен жабылды және талдауға дейін 4 °C-та сақталды. Әрбір рецептура × өңдеу комбинациясының екі партиясы өндірілді, бірақ уақыт пен ресурстардың шектеулілігіне байланысты, кейінгі талдаулар үшін тек бір өкілдік партия пайдаланылды. Бұл қазіргі зерттеудің шектеуі ретінде танылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f1.jpg\" alt=\"Жалпы амин қышқылдарының құрамын негізгі компоненттер бойынша талдау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жалпы амин қышқылдарының құрамын негізгі компоненттер бойынша талдау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Жалпы амин қышқылдарының құрамын негізгі компоненттер бойынша талдау. Өлшенген айнымалылар арасындағы байланысты көрсететін 1-компонент (PC1, 59,9%) және 2-компонент (PC2, 20,0%) биплоттары. (A) Өңдеу әдісі бойынша топтастырылған үлгілері бар биплот. (B) Құрамы бойынша топтастырылған үлгілері бар биплот.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f2.jpg\" alt=\"Бос амин қышқылдарының құрамын негізгі компоненттер бойынша талдау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Бос амин қышқылдарының құрамын негізгі компоненттер бойынша талдау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Бос амин қышқылдарының құрамын негізгі компоненттер бойынша талдау. Өлшенген айнымалылар арасындағы байланысты көрсететін 1-компонент (PC1, 63,4%) және 2-компонент (PC2, 18,7%) биплоттары. (A) Өңдеу әдісі бойынша топтастырылған үлгілері бар биплот. (B) Құрамы бойынша топтастырылған үлгілері бар биплот.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f3.jpg\" alt=\"Төрт жеке биогенді аминнің құрамын негізгі компоненттер бойынша талдау (PCA).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Төрт жеке биогенді аминнің құрамын негізгі компоненттер бойынша талдау (PCA).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Төрт жеке биогенді аминнің құрамын негізгі компоненттер бойынша талдау (PCA). Өлшенген айнымалылар арасындағы байланысты көрсететін 1-компонент (PC1, 52,7%) және 2-компонент (PC2, 36,3%) биплоттары. (A) Өңдеу әдісі бойынша топтастырылған үлгілері бар биплот. (B) Құрамы бойынша топтастырылған үлгілері бар биплот. (C) Жеке график.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f4.jpg\" alt=\"DNPH әдісімен карбонил мөлшері ретінде есептелген өсімдік негізіндегі құрамдастырылған матрицалардағы ақуыздың тотығуы (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;DNPH әдісімен карбонил мөлшері ретінде есептелген өсімдік негізіндегі құрамдастырылған матрицалардағы ақуыздың тотығуы (H100: кендір күнжарасы, H75:O25: 75% кендір күнжарасы және 25% сұлы күнжарасы құрамы, H50:O50: 50% кендір күнжарасы және 50% сұлы күнжарасы…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;DNPH әдісімен карбонил мөлшері ретінде есептелген өсімдік негізіндегі құрамдастырылған матрицалардағы ақуыздың тотығуы (H100: кендір күнжарасы, H75:O25: 75% кендір күнжарасы және 25% сұлы күнжарасы құрамы, H50:O50: 50% кендір күнжарасы және 50% сұлы күнжарасы құрамы, P: пастерленген, F: ашытылған). Қателік сызықтары стандартты ауытқуды (SD) білдіреді. (*) белгісі бар көлденең сызықтар бірдей құрамдағы үлгілер арасындағы байқалатын елеулі жұптық айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f5.jpg\" alt=\"Арнайы химиялық байланыстарды ерітетін экстракциялаушы ерітінділер әсерінен кендір және сұлы күнжарасының құрамдастырылғ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Арнайы химиялық байланыстарды ерітетін экстракциялаушы ерітінділер әсерінен кендір және сұлы күнжарасының құрамдастырылған қоспаларының (H100, H75:O25, H50:O50) ақуыз ерігіштігі (H100: кендір күнжарасы, H75:O25: 75% кендір күнжарасы және 25% сұлы күнжарасы…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Арнайы химиялық байланыстарды ерітетін экстракциялаушы ерітінділер әсерінен кендір және сұлы күнжарасының құрамдастырылған қоспаларының (H100, H75:O25, H50:O50) ақуыз ерігіштігі (H100: кендір күнжарасы, H75:O25: 75% кендір күнжарасы және 25% сұлы күнжарасы құрамы, H50:O50: 50% кендір күнжарасы және 50% сұлы күнжарасы құрамы, P: пастерленген, F: ашытылған). (A) Нативті күйдегі ақуыз; (B) Сутектік байланыстар; (C) Дисульфидтік байланыстар; (D) Гидрофобтық өзара әрекеттесулер; (E) Сутектік байланыстар x дисульфидтік байланыстар; (F) Сутектік байланыстар x гидрофобтық өзара әрекеттесулер; (G) Дисульфидтік байланыстар x гидрофобтық өзара әрекеттесулер; (H) Сутектік байланыстар x дисульфидтік байланыстар x гидрофобтық өзара әрекеттесулер. Жұлдызшалар Тьюки түзетуімен бағаланған маржиналды орташа мәндерге негізделген елеулі жұптық айырмашылықтарды көрсетеді, тек сипаттамалық мақсатта берілген (p ≤ 0,05 (&lt;em&gt;), ≤0,01 (&lt;strong&gt;), ≤0,001 (&lt;/strong&gt;&lt;/em&gt;), ≤0,0001 (****)).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f6.jpg\" alt=\"Кендір мен сұлы күнжарасының құрамдастырылған қоспаларының SDS-PAGE гелі (H100: кендір күнжарасы, H75:O25: 75% кендір кү\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Кендір мен сұлы күнжарасының құрамдастырылған қоспаларының SDS-PAGE гелі (H100: кендір күнжарасы, H75:O25: 75% кендір күнжарасы және 25% сұлы күнжарасы қоспасы, H50:O50: 50% кендір күнжарасы және 50% сұлы күнжарасы қоспасы, P: пастерленген, F: ашытылған, EXT: құрғақ экструзияланған) тотықсыздандырғыш (A) және тотықсыздандырмайтын (B) жағдайларда.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure-f7.jpg\" alt=\"Фосфор мөлшері бойынша есептелген өсімдік тектес құрамдастырылған матрицалардағы фитин қышқылының мөлшері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Фосфор мөлшері бойынша есептелген өсімдік тектес құрамдастырылған матрицалардағы фитин қышқылының мөлшері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Фосфор мөлшері бойынша есептелген өсімдік тектес құрамдастырылған матрицалардағы фитин қышқылының мөлшері. (H100: кендір күнжарасы, H75:O25: 75% кендір күнжарасы және 25% сұлы күнжарасы қоспасы, H50:O50: 50% кендір күнжарасы және 50% сұлы күнжарасы қоспасы, P: пастерленген, F: ашытылған). Қателік сызықтары стандартты ауытқуды (SD) білдіреді. Үстінде (*) белгісі бар көлденең сызықтар бірдей құрамдағы үлгілер арасындағы байқалған елеулі жұптық айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/effect-of-formulation-and-fermentation-on-protein-structure.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;күнжаралардың&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;төмен&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;функционалдығы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кендір мен&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сұлы қоспасын&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ферменттеу&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақуыз&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ерігіштігінің&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жақсаруы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сапалы ет&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аналогтарын&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасау&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Foods (Basel, Switzerland) журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-06/effect-of-formu
