        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"231\" cy=\"115\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"669\" cy=\"170\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · VOLATILES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Суық вакуум немесе пеш:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;кептіру асшаянның дәмі мен&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ақуызын қалай өзгертеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f1.jpg\" alt=\"Әртүрлі өңдеу әдістеріндегі аминқышқылдарының спектрі (A, B, C, D, E, F, TD, TE, TF).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі өңдеу әдістеріндегі аминқышқылдарының спектрі (A, B, C, D, E, F, TD, TE, TF).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Асшаян флоссын (ұсақ талшықты кептірілген тағам) дайындауда кептіру тәсілі дәм мен тағамдық құндылықты түбегейлі өзгертеді. Зерттеушілер Macrobrachium rosenbergii ірі тұщы су асшаяндарына вакуумдық сублимация (VFD) мен ыстық ауамен кептіру (HAD) әдістерін салыстырды. Сублимация қызуға сезімтал қанықпаған май қышқылдары мен умами дәміне жауапты аминқышқылдарын жақсы сақтайды. 70 °C ыстық ауа Майяр реакциясын жеделдетіп, қуырылған хош иіс береді, бірақ маринад еттің табиғи тәттілігін басып тастайды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;0,035 мбар вакуумда лиофилизациялау пайдалы омега-майлар мен умами дәмін толық сақтайды&lt;/li&gt;\n&lt;li&gt;70 °C ыстық ауа қуырылған дәм береді, алайда құнды аминқышқылдарының мөлшерін азайтады&lt;/li&gt;\n&lt;li&gt;Дәмдеуіштер мен қант асшаян етінің табиғи тәттілігін қышқыл-тұзды дәммен бүркеп тастайды&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Орташа салмағы 35,5 г болатын алып тұщы су асшаяндары (Macrobrachium rosenbergii) 3–5 минут қайнатылып, дәмдеуіштер қосылған ерітіндіде маринадталды және флосс күйіне дейін өңделді. Тәжірибеде вакуумдық сублимация (0,035 мбар қысым, конденсатор температурасы −84 °C, 21 сағат) және ыстық ауамен конвекциялық кептіру (70 °C, 21 сағат) қолданылды. Ылғалдың ұшуына байланысты барлық топта ақуыз бен майдың концентрациясы артты. Дегенмен, HP-88 капиллярлы бағанасындағы (100 м) газды хроматография пісірілген етті лиофилизациялау көп қанықпаған май қышқылдары (ҚМҚ) мен май қышқылдарының метил эфирлерін (FAME) тотығудан барынша сақтайтынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Аминқышқылдар құрамын талдау ерекше заңдылықты анықтады: цистин тек маринадталмаған піскен үлгілерде пайда болды, бұл цистеиннің жылу әсерінен тотығып димеризациялануын көрсетеді. Ал маринадталған етте қанттар тудырған тотықсыздандырғыш орта бұл процесті тежеген. Электронды мұрын (PEN3) мен электронды тіл деректері VFD өнімінде табиғи глутаматты умами мен қанықтылық теңгерімі сақталғанын растады. Ал 70 °C ауамен кептіру азотты ұшпа қосылыстарды (N,N-диметилметанамин) және қуырылған ноталарды арттырды, ал маринадтағы тұз бен қышқыл глициннің табиғи тәтті дәмін жауып кетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс тек бір партияның шикізатында жасалған және сенсорлық бағалау адамдардан тұратын дегустациялық панельсіз, электронды сенсорлармен ғана шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"suretter\"&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html#suretter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Суреттер&lt;/span&gt;&lt;/a&gt;Суреттер&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f2.jpg\" alt=\"Электронды тілді тестілеу нәтижелерінің биплот талдауындағы әртүрлі өңделген үлгілерді салыстыру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Электронды тілді тестілеу нәтижелерінің биплот талдауындағы әртүрлі өңделген үлгілерді салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Электронды тілді тестілеу нәтижелерінің биплот талдауындағы әртүрлі өңделген үлгілерді салыстыру. Көлеңкеленген аумақтар әрбір үлгі тобы үшін 95% сенімділік эллипстерін көрсетеді, ал әртүрлі түстер әртүрлі топтарға сәйкес келеді. Сызықтар бастапқы айнымалылардың жүктеме векторларын білдіреді. (A) Шкіл шаян етін өңдеудегі айырмашылықтарды салыстыру; (B) Пісірілген шаян етін өңдеудегі айырмашылықтарды салыстыру; (C) Дәмдеуіштер қосып пісірілген шаян етін өңдеудегі айырмашылықтарды салыстыру; (D) Кептірілмеген шаян етін өңдеудегі айырмашылықтарды салыстыру; (E) Сублимациялық кептірілген (VFD) шаян етін өңдеудегі айырмашылықтарды салыстыру; (F) Вентиляциялық ыстық ауамен кептірілген (HAD) шаян етін өңдеудегі айырмашылықтарды салыстыру.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f3.jpg\" alt=\"Электронды тілді тестілеу нәтижелерінің радарлық диаграммасындағы әртүрлі өңделген үлгілерді салыстыру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Электронды тілді тестілеу нәтижелерінің радарлық диаграммасындағы әртүрлі өңделген үлгілерді салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f4.jpg\" alt=\"Электронды мурынды тестілеу нәтижелерінің PCA талдауындағы әртүрлі өңделген үлгілерді салыстыру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Электронды мурынды тестілеу нәтижелерінің PCA талдауындағы әртүрлі өңделген үлгілерді салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Электронды мурынды тестілеу нәтижелерінің PCA талдауындағы әртүрлі өңделген үлгілерді салыстыру. (A) Шкіл шаян етін өңдеудегі айырмашылықтарды салыстыру; (B) Пісірілген шаян етін өңдеудегі айырмашылықтарды салыстыру; (C) Дәмдеуіштер қосып пісірілген шаян етін өңдеудегі айырмашылықтарды салыстыру; (D) Кептірілмеген шаян етін өңдеудегі айырмашылықтарды салыстыру; (E) Сублимациялық кептірілген (VFD) шаян етін өңдеудегі айырмашылықтарды салыстыру; (F) Вентиляциялық ыстық ауамен кептірілген (HAD) шаян етін өңдеудегі айырмашылықтарды салыстыру.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f5.jpg\" alt=\"Электронды мурынды тестілеу нәтижелерінің радарлық диаграммасындағы әртүрлі өңделген үлгілерді салыстыру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Электронды мурынды тестілеу нәтижелерінің радарлық диаграммасындағы әртүрлі өңделген үлгілерді салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on-f7.jpg\" alt=\"Сурет 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 7&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/the-impact-of-drying-technologies-and-thermal-processing-on.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Кептіру&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кезінде дәм&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мен майдың&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұзылуы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;VFD мен 70 °C&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;HAD әдісін&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;салыстыру&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;VFD умамиді&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сақтайды, HAD&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қуырады&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тағам түріне&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қарай дұрыс&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кептіруді&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;таңдау&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&l
