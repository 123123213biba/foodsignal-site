            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"249\" cy=\"164\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"691\" cy=\"197\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Васаби қаптамасы неге&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ісінеді және оны қалай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тоқтатуға болады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f1.jpg\" alt=\"Қалыпты және газ түзуші васаби арасындағы антиоксиданттық компоненттерді салыстыру. (A) Жалпы фенол мөлшері; (B) Флавоно\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қалыпты және газ түзуші &lt;a href=\"concepts/wasabi-sauce.html\"&gt;васаби&lt;/a&gt; арасындағы антиоксиданттық компоненттерді салыстыру. (A) Жалпы фенол мөлшері; (B) Флавоноидтар мөлшері; (C) Аскорбин қышқылының мөлшері. Әртүрлі жоғарғы индексті әріптер үлгілер арасындағы статистикалық маңызды айырмашылықтарды көрсетеді (P &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Тұз мөлшерін азайту үрдісі соустарда газ түзуші бактериялардың көбеюіне әкелді. Зерттеу &lt;a href=\"concepts/bacillus-licheniformis-qjl3.html\"&gt;Bacillus licheniformis QJL3&lt;/a&gt; штаммы қаптаманың ісінуіне себеп болатынын көрсетті. Ғалымдар осы микроорганизмнің өсуін тежеу үшін қажетті тұз бен консервант мөлшерін анықтады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Bacillus licheniformis QJL3 — васабидегі газ түзілуінің басты себепкері.&lt;/li&gt;\n&lt;li&gt;14% тұз немесе 0,2 мг/мл калий сорбаты бактерияның өсуін тиімді тоқтатады.&lt;/li&gt;\n&lt;li&gt;Микроорганизм pH 3,8-ге дейінгі қышқыл ортада да дами алады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу барысында бұзылған васаби үлгілерінен Bacillus licheniformis QJL3 штаммы бөліп алынды. Бұл микроорганизм 4°C және 55°C температурада 10 минут бойы тіршілік ете алады, бұл оны жылулық өңдеуге төзімді етеді. Бактерия тұздың жоғары концентрациясына төзімді болғанымен, ортадағы тұз мөлшері 14%-ға жеткенде оның өсуі толығымен тоқтайды.&lt;/p&gt;\n&lt;p&gt;Тәжірибелер YPDA қоректік ортасында B. licheniformis QJL3 дамуын бақылау үшін 8% тұз концентрациясы тиімді екенін көрсетті. Сондай-ақ, калий сорбатының минималды тежеуші концентрациясы (MIC) 0,2 мг/мл деп белгіленді. Бұл деректер өндірушілерге тұз мөлшерін азайтқан кезде өнімнің қауіпсіздігін сақтауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зертханалық жағдайда жүргізілді, сондықтан нәтижелер соустың құрамы мен басқа микроорганизмдердің әсеріне байланысты өзгеруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Васаби соусы, сондай-ақ жасыл қыша немесе ақжелкек (хрен) деп аталатын, негізінен ақжелкек тамырынан (Armoracia rusticana) жасалатын дәмдеуіш. Оның құрамында сумен белгілі бір температура мен pH жағдайында, сондай-ақ мирозиназа ферментінің қатысуымен изотиоцианаттарға дейін гидролизденетін глюкозинолаттар бар. Изотиоцианаттар васабидің ерекше хош иісі мен ащылығын қамтамасыз етеді, бұл сілекей мен асқазан сөлінің бөлінуін ынталандырып, тәбетті ашады. Сонымен қатар, васаби детоксикациялық қасиеттерге ие, соның ішінде балық пен теңіз өнімдеріндегі токсиндерді бейтараптандыру қабілеті бар. Сондықтан жапон асханасында оны сашими мен сушиге дәм беру, иісін кетіру және микробқа қарсы қорғаныс үшін қосады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Васаби соусы әдетте pH 4,8–5,2 және 10%–12% (масса/көлем) тұз концентрациясына ие, бұл көптеген бактериялардың өсуі үшін қолайсыз жағдай.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Васаби соусы әдетте pH 4,8–5,2 және 10%–12% (масса/көлем) тұз концентрациясына ие — бұл бактериялардың өсуі үшін қолайсыз жағдай. Өндіріс процесі өте қарапайым және ұзақ ашытуды қамтымайды, бұл ашытылған өнімдерге тән айқаспалы ластану қаупін азайтады. Ақжелкек сығындысы да тағамды бұзатын бактерияларды жоя немесе тежей алады. Соңғы жылдары денсаулық сақтау саласындағы хабардарлық пен диеталық саясаттың енгізілуі (Қытай үкіметі 2030 жылға қарай тұз тұтынуды 20%-ға азайтуды мақсат еткен) жаһандық деңгейде тұзды азайту үрдісін тудырды. Осыған орай, васаби өндірушілері тұз концентрациясын азайта бастады. Алайда, тұздылықтың төмендеуі газ түзілуі, қаптаманың ісінуі және сақтау кезінде қышқыл дәмнің пайда болуы сияқты бұзылу жағдайларына әкелді, бұл тұтынушылардың сенімін төмендетіп, экономикалық шығындарға әкеледі. Зерттеулер көрсеткендей, соя соусында тұздың азаюы бактериялар санын 1–2 еселікке арттырады. Газ түзуші бактерияларды жүйелі түрде бөліп алу және сәйкестендіру васаби соусының сақталу мерзімі мен қауіпсіздігін арттыру үшін өте маңызды.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/gas-production.html\"&gt;Аэрогенез&lt;/a&gt; (газ түзілуі) ақаулары тамақ өнеркәсібінде кең таралған мәселе болып табылады және әртүрлі өнімдерде (чили соусы, бұршақ пастасы, суфу, соя соусы және ірімшік) тіркелген. Бұл ақаулар өндіріс, сақтау немесе ашыту кезінде газ түзуші микробтық ластану нәтижесінде туындайтын қалаусыз бұзылу құбылыстары. Оларға қарсы күресу үшін термиялық өңдеу, бактериоциндер және консерванттар (калий сорбаты, натрий бензоаты) қолданылады. Алайда, бұл әдістердің тиімділігі әртүрлі. Бұл зерттеуде газ түзуші бактериялар мәдени әдіс және &lt;a href=\"concepts/test-s-trubkami-darema.html\"&gt;Дарем түтікшелері тесті&lt;/a&gt; арқылы бөлініп алынды, молекулалық биология әдістерімен сәйкестендірілді, сондай-ақ олардың консерванттар мен тұзға төзімділігі бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дарем түтікшелері тесті — газ түзілуін анықтау әдісі: егер мәдениет салынған ыдыс ішіндегі төңкерілген кішкентай түтікшеде газ жиналса, демек, микроорганизм оны белсенді түрде бөліп шығарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қалыпты (ZC1, ZC2, ZC3) және қаптамасы ісінген (CQ1, CQ2, CQ3) васаби соусы үлгілері Қытайдың Шаньдун қаласындағы зауыттан алынды. Физикалық-химиялық көрсеткіштер (тұз, жалпы қышқылдылық, аминқышқылды азот, еритін қанттар, pH, ылғалдылық, ақуыз) стандартты титрлеу, колориметрия және жағу әдістерімен анықталды. Сенсорлық бағалау 12 сарапшы тарапынан өткізілді. Антиоксиданттық белсенділік DPPH, ABTS және гидроксил радикалдарының бейтараптандыру қабілеті бойынша бағаланды. Газ түзуші бактериялар RBM, PCA, TSA және YPDA орталарында бөлініп алынды. Сәйкестендіру VITEK 2 жүйесі және 16S rDNA ПТР-амплификациясы мен филогенетикалық талдау арқылы жүзеге асырылды. Бактериялардың ортаға төзімділігі (температура 4–65°C, pH 2,6–7,6, тұз 2–16%) OD600 өсуі бойынша бағаланды. Низин, калий сорбаты және натрий бензоатының минималды тежеуші концентрациясы (МИК) YPDA ортасында анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында: қаптаманың ісінуі мен Bacillus licheniformis болуы арасында байланыс анықталды, бірақ өндірісте себеп-салдарлық байланысты растау үшін қосымша сынақтар қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ісінген қаптамадағы васаби соусы қоңыр түске, әлсіз иіске және қышқыл-тұтқыр дәмге ие болды. Физикалық-химиялық тұрғыдан ол жоғарырақ pH (5,31–5,34-ке қарсы 4,96–5,10) және қышқылдылыққа ие болды, бірақ ақуыз, аминқышқылды азот және тұз мөлшері аз болды. Бұзылған соустағы антиоксиданттық белсенділік жоғарырақ болып шықты, бұл микроорганизмдердің метаболиттерімен байланысты болуы мүмкін. Негізгі қоздырғыш ретінде Bacillus licheniformis (QJL3 штаммы) сәйкестендірілді. Ол 12%-ға дейінгі тұзға және орташа ыстыққа төзімділік көрсетеді. 8% тұз бен 0,2 мг/мл калий сорбатының комбинациясы зертханалық жағдайда осы штаммның өсуін тиімді тежеді.&lt;/p&gt;\n&lt;p&gt;B. licheniformis QJL3 васаби соусы қаптамаларының ісінуіне себеп болатын негізгі микроорганизм болып табылады. Бактерия жоғары тұз концентрациясы мен төмен pH мәндеріне төзімді. Бұзылудың алдын алу үшін 8% тұз бен калий сорбатының комбинациясы ұсынылады, бұл рецептураны айтарлықтай өзгертпестен микробтық тұрақтылықты бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f1.jpg\" alt=\"Қалыпты және газ түзуші васаби арасындағы антиоксиданттық компоненттерді салыстыру. (A) Жалпы фенол мөлшері; (B) Флавоно\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қалыпты және газ түзуші васаби арасындағы антиоксиданттық компоненттерді салыстыру. (A) Жалпы фенол мөлшері; (B) Флавоноидтар мөлшері; (C) Аскорбин қышқылының мөлшері. Әртүрлі жоғарғы индексті әріптер үлгілер арасындағы статистикалық маңызды айырмашылықтарды көрсетеді (P &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f2.jpg\" alt=\"Қалыпты және газ түзуші васаби арасындағы антиоксиданттық белсенділікті салыстыру. (A) ABTS радикалдарының сіңірілу жылд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қалыпты және газ түзуші васаби арасындағы антиоксиданттық белсенділікті салыстыру. (A) ABTS радикалдарының сіңірілу жылдамдығы; (B) DPPH радикалдарының сіңірілу жылдамдығы; (C) Гидроксил радикалдарын сіңіру. Әртүрлі жоғарғы индексті әріптер үлгілер арасындағы статистикалық маңызды айырмашылықтарды көрсетеді (P &amp;lt; 0,05).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f3.jpg\" alt=\"Әртүрлі физика-химиялық, функционалдық және антиоксиданттық белсенді ингредиенттердің компоненттер графигі мен иерархиял\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әртүрлі физика-химиялық, функционалдық және антиоксиданттық белсенді ингредиенттердің компоненттер графигі мен иерархиялық кластерлеу жылу карталары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Әртүрлі физика-химиялық, функционалдық және антиоксиданттық белсенді ингредиенттердің компоненттер графигі мен иерархиялық кластерлеу жылу карталары. Негізгі компоненттерді талдау диаграммасы (A), иерархиялық кластерлеу жылу картасы (B): қызыл және көк түстер сәйкесінше оң және теріс корреляцияларды білдіреді; қызыл шеңберлер неғұрлым қара және үлкен болса, тиісті компоненттің мөлшері соғұрлым жоғары болады, ал түс қарқындылығын нормалау шкаласы 2,0 (қызыл шеңбер) мен −2,0 (көк шеңбер) аралығында өзгереді, бұл васабидегі әрбір компоненттің ең жоғарыдан ең төменге дейінгі мөлшерін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f4.jpg\" alt=\"Дарем түтікшесімен тест (A), колония морфологиясы (B), Грам бойынша боялған микроскопиялық кескіндер (C), 16S рДНҚ ПТР а\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дарем түтікшесімен тест (A), колония морфологиясы (B), Грам бойынша боялған микроскопиялық кескіндер (C), 16S рДНҚ ПТР амплификациясының электрофорез кескіні (D), QJL3 штаммының филогенетикалық ағашы. Газ түзу қабілетін тексеруде қолданылған орта — YPDA сұйық ортасы, ал морфологиялық бақылау үшін қолданылған табақшалар — YPDA агар табақшалары, екеуі де анаэробты жағдайда өсірілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f5.jpg\" alt=\"Bacillus licheniformis QJL3-тің әртүрлі қоршаған орта стресстеріне төзімділігі: (A) Температура, (B) pH және (C) тұздылы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Bacillus licheniformis QJL3-тің әртүрлі қоршаған орта стресстеріне төзімділігі: (A) Температура, (B) pH және (C) тұздылық.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte-f6.jpg\" alt=\"Bacillus licheniformis QJL3-тің калий сорбатының (A), натрий бензоатының (B) және низиннің (C) әртүрлі концентрацияларын\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Bacillus licheniformis QJL3-тің калий сорбатының (A), натрий бензоатының (B) және низиннің (C) әртүрлі концентрацияларындағы өсу қисықтары, сондай-ақ 8% тұз болған кездегі Bacillus licheniformis QJL3-тің калий сорбатының (D) және натрий бензоатының (E) әртүрлі концентрацияларындағы өсу қисықтары.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;васаби&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қаптамасының&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ісінуі&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;штаммды бөліп&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алу және&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдау&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тұз бен сорбат&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арқылы тежеу&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тұрақты соус&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рецептурасы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Food science &amp;amp; nutrition журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/isolation-and-identification-of-gas-producing-spoilage-bacte.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&g
