        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"203\" cy=\"146\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"677\" cy=\"239\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Бала мәзірін бағалау:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жасанды интеллект пе, әлде&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;диетолог па&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Ата-аналар баласының тамақтануын тексеру үшін чат-боттарды жиі қолдана бастады. Ғалымдар 42 жасанды интеллект жүйесі мен 260 дәрігердің бағалауын сарапшылар кеңесінің эталонымен салыстырды. Нейрожелі тағамның өңделу дәрежесі мен әртүрлілігін анықтауда дәрігерлерден асып түсті. Дегенмен порция көлемі мен тәуліктік калорияны есептеуде алгоритмдер ең үлкен ауытқу көрсетті.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ЖИ тағамның өңделу дәрежесін адамдарға қарағанда әлдеқайда дәл анықтады&lt;/li&gt;\n&lt;li&gt;Балалар мәзірінің калориясын есептеуде ЖИ 260,3 ккал-ға дейін қателесті&lt;/li&gt;\n&lt;li&gt;Чат-боттар алғашқы скринингке жарағанымен, диетологтың орнын баса алмайды&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеуге дені сау үш баланың (3, 7 және 12 жас) тамақтану күнделігі, тағам өлшемдері мен фотосуреттері алынды. Педиатрлар мен нутрициологтардан құралған сарапшылар тобы USDA FoodData Central базасы негізінде эталондық көрсеткіштерді есептеп шықты. Дәл осы мәліметтер 42 ЖИ платформасына (84 сессия) және Румынияның 260 дәрігеріне бағалауға берілді.&lt;/p&gt;\n&lt;p&gt;Сапалық сипаттамаларды бағалауда ЖИ жүйелері жоғары нәтиже көрсетті: рационның алуантүрлілігі бойынша ауытқу небәрі 0,37 ± 0,49 балл, ал ультра-өңделу деңгейі бойынша 0,33 ± 0,47 балл болды (дәрігерлерде бұл көрсеткіш 1,15–1,57 аралығында, p = 0,0001). ЖИ тағамдағы өңделген өнімдерді бірден таниды.&lt;/p&gt;\n&lt;p&gt;Бірақ нақты өлшемдерде нейрожелілер қателікке бой алдырды: ЖИ-дің тәуліктік калорияны бағалаудағы орташа қателігі 260,3 ± 194,3 ккал құрады (диетологтарда — 148,4 ± 81,5 ккал). Порция мөлшеріндегі ауытқу 0,488-ге жетті. Бұл алгоритмдердің жасырын майлар мен тұздықтарды нақты есептей алмайтынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу небәрі үш баланың рационымен шектелген, ал калорияны салыстыру 77 толық жауаптан тұратын шағын топта ғана жасалды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Тамақтану өсу, нейродаму, семіздік пен диетаға байланысты кардиометаболикалық бұзылулардың алдын алуда маңызды рөл атқарады. Алайда, клиникалық және қоғамдық жағдайларда балалар мәзірін жүйелі бағалау көп уақытты талап етеді және маманның жеке тәжірибесіне тәуелді. Тағам тұтынуды бағалауға арналған технологиялық құралдар стандарттауды жақсарту және респонденттерге түсетін жүктемені азайту үшін әзірленген, бірақ олардың жарамдылығы мен қолдану ыңғайлылығы әртүрлі, ал көбісі әлі де сарапшылық түсіндіруді талап етеді. Сонымен қатар, үлкен тілдік модельдер (&lt;a href=\"concepts/artificial-intelligence.html\"&gt;LLM&lt;/a&gt;) мен жасанды интеллект (AI) негізіндегі чат-боттар еркін және кеңінен қолжетімді болды, бұл ата-аналарға медицина қызметкерлерімен тікелей байланыссыз балалары үшін жедел диета мен денсаулық туралы ақпарат алуға мүмкіндік береді. Соңғы зерттеулер көрсеткендей, ата-аналар педиатриялық медициналық және нутрициологиялық сұраулар үшін AI-ды жиі пайдалануда және кейде AI жасаған контентке сарапшылардың ақпаратынан гөрі көбірек сенуі мүмкін, бұл қауіпсіздік пен білікті кеңестердің орнын басу қаупіне қатысты алаңдаушылық тудырады.&lt;/p&gt;\n&lt;p&gt;Кескіндер мен мобильді интерфейстерге негізделген AI диетаны бағалау құралдары тағамды анықтау мен порцияны бағалауда перспективалы нәтижелерді көрсетеді, бірақ қоректік заттар мен энергияны сандық бағалау қиын күйінде қалуда, әсіресе тағамдар құрамында белгісіз ингредиенттер, аралас тағамдар, өзгермелі рецепттер және қосылған майлар, тұздықтар мен пісіру процесіндегі жоғалтулардың нақты емес мөлшерлері болғанда. AI-ды қолдайтын диетаны бағалауға деген қызығушылықтың артуына қарамастан, қолда бар әдебиеттер негізінен тағамды тану, порцияны бағалау немесе қоректік заттарды болжау сияқты жеке тапсырмаларды жеңілдетілген жағдайларда зерттеген. Балалар мәзірін бағалауда AI нәтижелерін бірнеше адам-бағалаушы топтарымен тікелей салыстырған зерттеулер аз. Нәтижесінде, AI-дың мәзірді бағалаудың сандық және сапалық аспектілерінде әртүрлі жұмыс істейтіні түсініксіз күйінде қалуда. Бақыланатын жағдайлардағы перспективалы дәлдікке қарамастан, қазіргі LLM негізіндегі тамақтану құралдары сыртқы жарамдылықта маңызды шектеулерді көрсетеді, олардың жұмысы промпт дизайнына, тілдік контекстке және нақты өмірдегі толық емес деректерге байланысты. Польшада өткізілген диеталық классификация зерттеуінде үш модель сарапшылармен 90,3–94,2% сәйкестікке қол жеткізді, алайда модель мен адам арасындағы елеулі айырмашылықтар сақталды және сарапшылық бақылау қажет болып қалды. Бұл зерттеу үш адам-бағалаушы тобы (тамақтану мамандары, педиатрияға бағытталған дәрігерлер және басқа мамандықтағы дәрігерлер) мен AI платформалары жасаған балалар мәзірін бағалаудың дәлдігі мен доменге тәуелді тиімділігін салыстыру үшін әзірленді, мұнда энергияны тұтыну, порция, сандық бағалаулар және негізгі сапалық атрибуттар бойынша сарапшылар белгілеген рейтингтер пайдаланылды. Эталондық стандарттан ауытқуларды сандық анықтау және адам сарапшылары арасындағы бинарлық сәйкестік көрсеткіштері мен бағалаушы сипаттамаларын зерттеу арқылы біз AI-дың көп салалы клиникалық сараптаманың орнын басушы емес, керісінше, құрылымдалған балалар мәзірінің скринингі мен тамақтану білімі үшін көмекші құрал ретіндегі қазіргі рөлін нақтылауды мақсат еттік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI тағамды анықтауда перспективалы нәтижелерді көрсетеді, бірақ энергия мен қоректік заттарды нақты есептеуде қиындықтарға тап болады, бұл оны алмастырушы емес, көмекші құралға айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз Румынияның Тыргу-Муреш қаласында анонимдендірілген педиатриялық жағдайлар мен стандартталған мәзірді бағалау құралдарын пайдалана отырып, бақылаушы, кесінді, салыстырмалы зерттеу жүргіздік. Бағалаулар 2026 жылдың наурызы мен маусымы аралығында адам-бағалаушылар үшін қауіпсіз сауалнама сілтемелері және AI платформалары үшін жеке сессиялар арқылы онлайн аяқталды. Зерттеу Тыргу-Муреш қаласындағы Джордже Эмиль Паладе атындағы Медицина, фармация, ғылым және технология университетінің Этика комитетімен мақұлданды (құжат № 3904/4 наурыз 2026 жыл).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау зерттеуі айнымалылар арасындағы байланысты тіркейді, бірақ себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Созылмалы аурулары жоқ үш педиатриялық жағдай (7 жасар ұл бала, 12 жасар қыз бала, 3 жасар қыз бала) нақты антропометриялық және кардиометаболикалық профильдерді көрсету үшін таңдалды. Әрбір жағдай жас, жыныс, салмақ, бой, БМИ пайыздық көрсеткіштері, тыныштықтағы метаболикалық жылдамдық, кардиометаболикалық параметрлер және порция сипаттамалары (граммдағы салмақ), фотосуреттер мен тамақтану кестесі бар егжей-тегжейлі тамақтану күнделігін қамтыды. Үш клиникалық тамақтану маманы, екі педиатр және бір мектеп дәрігерінен тұратын көп салалы панель жағдайға тән сарапшылық рейтингтерді белгіледі. Жалпы энергия мен қоректік заттардың мәндері USDA FoodData Central деректер базасын пайдалана отырып есептелді.&lt;/p&gt;\n&lt;p&gt;Румыниялық қатысушылар келесі топтарға бөлінді: (1) тамақтану мамандары (n = 116), (2) педиатрияға бағытталған дәрігерлер (отбасылық медицина, мектеп медицинасы, педиатрия, балалар гастроэнтерологиясы және т.б.; n = 56), (3) басқа мамандықтағы дәрігерлер (зертханалық медицина, патология, гигиена және т.б.; n = 88).&lt;/p&gt;\n&lt;p&gt;42 AI платформасы таңдалды, бұл екі кіру конфигурациясымен (тегін/ақылы) 84 бағалауды құрады. Әрбір AI бағалауы бір педиатриялық жағдайдың аяқталған талдауын білдірді. Румын тіліндегі промпт мыналарды талап етті: (1) тұтынуды сандық бағалау, (2) сапалық бағалау (әртүрлілік, өңдеу, түс, тартымдылық), (3) мәзір классификациясы, (4) 1–10 шкаласы бойынша бес рейтинг.&lt;/p&gt;\n&lt;p&gt;Адам-бағалаушылар AI промптына ұқсас құрылымдалған есепті толтырды. Әрбір сарапшыға кездейсоқ түрде бір жағдай тағайындалды. Бастапқы талдау бірлігі «сарапшы–жағдай» бағалауы болды. Барлық нәтижелер сарапшылар панелі белгілеген эталоннан ауытқу ретінде есептелді.&lt;/p&gt;\n&lt;p&gt;Microsoft Excel және GraphPad Prism 9 қолданылды. Статистикалық маңыздылық α = 0,05. Бір факторлы ANOVA және Краскел–Уоллис тесті, содан кейін көптеген салыстырулар үшін Тьюки немесе Данн тесті қолданылды. Жалған жаңалықтар деңгейі Бенджамини–Кригер–Екутиели тәртібімен бақыланды.&lt;/p&gt;\n&lt;p&gt;344 бағалау енгізілді (84 AI, 116 тамақтану маманы, 56 педиатр, 88 басқа мамандықтағы дәрігер).&lt;/p&gt;\n&lt;p&gt;Орташа абсолюттік қателік (MAE_kcal) айтарлықтай ерекшеленді (p = 0,0016). AI ең үлкен қателікті көрсетті (260,3 ± 194,3 ккал), одан кейін тамақтану мамандары (148,4 ± 81,5 ккал) және басқа мамандықтағы дәрігерлер (60,4 ± 53,3 ккал).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI-дың энергияны бағалаудағы қателігі ең жоғары болып шықты, бұл педиатрияда критикалық маңызға ие, өйткені калория теңгерімсіздігі өсу мен метаболизмге әсер етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Порцияларды бағалауда топтар арасындағы айырмашылықтар маңызды болды (p = 0,003). AI әртүрлілік пен өнімдерді өңдеу деңгейін бағалауда ең кіші ауытқуларды көрсетті, ал адам топтары сыншыл болды. Тамақтану құндылығын бағалауда тамақтану мамандары басқа топтарға қарағанда ең үлкен ауытқуды көрсетті (1,00 ± 1,02).&lt;/p&gt;\n&lt;p&gt;Нәтижелер тиімділіктің бағалау доменіне байланысты екенін көрсетеді. AI сипаттамалық атрибуттармен (әртүрлілік, өңдеу) жақсы жұмыс істейді, бірақ сандық дәлдікте (энергия, порция) қалысады. Бұл гибридті модельдің қажеттілігін растайды: AI міндетті сарапшылық бақылаудағы бастапқы скрининг құралы ретінде.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI мәзірді сапалық белгілері бойынша бастапқы скрининг жасау үшін тиімді, бірақ қоректік заттарды сандық бағалау үшін кәсіби бақылауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Бала&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мәзіріндегі ЖИ&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сенімділігі&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;84 ЖИ және 260&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маман сынағы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ЖИ калорияда&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қателесті,&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сапада озық&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тек қосымша&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;көмекші&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ретінде&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қолдану&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Nutrients журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nutrients (Europe PMC)&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Martin-Hadmaș RM, Sovea R, Pol D, Gavra GM, Tarcea M, Neghirlă A, Martin ȘA.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-03/domain-dependent-performance-of-human-experts-and-ai-systems.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13610824\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/articles/PMC13610824?pdf=render\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https:
