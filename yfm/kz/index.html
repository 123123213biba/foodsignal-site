imated":false,"title":{"text":"Шығарылым &amp;middot; 02.10.2026","url":"2026-10-02/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa-card.jpg"},"content":{"title":"Коллаген асқазанды алкогольдің әсерінен қорғай ала ма","text":"&lt;p&gt;Ғалымдар III типті рекомбинантты адам коллагені асқазанның шырышты қабығын қалай қалпына келтіретінін анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/nutritional-composition-chemical-safety-and-microbiological-card.jpg"},"content":{"title":"Қытырлақ пальма бізтұмсығының дернәсілі: ақуыз концентраты және ауыр металдар қаупі","text":"&lt;p&gt;Қуыру мен пісіру дернәсілдердегі ақуызды екі есеге арттырады, бірақ ауыр металдардың жиналу қаупі бар.&lt;/p&gt;\n","links":[{"url":"2026-10-02/nutritional-composition-chemical-safety-and-microbiological.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented-card.jpg"},"content":{"title":"Қытайлық доужир сусыны тұмауға қарсы көмектесе ала&amp;nbsp;ма?","text":"&lt;p&gt;Мунг бұршағынан жасалған ашытылған сусын құрамындағы бактериялар тұмау вирусына қарсы иммунитетті нығайтуы мүмкін.&lt;/p&gt;\n","links":[{"url":"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer-card.jpg"},"content":{"title":"Өсімдік йогурты: таңдау кезінде дәм маңызды ма&amp;nbsp;әлде жапсырма&amp;nbsp;ма?","text":"&lt;p&gt;Тұтынушы үшін не маңыздырақ: өнімнің шынайы дәмі ме әлде қаптамадағы пайдалы ақпарат па?&lt;/p&gt;\n","links":[{"url":"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par-card.jpg"},"content":{"title":"Сарысу ақуызын ұзағырақ жұмыс істету: бұлшықетке арналған молекулалық &amp;laquo;желім&amp;raquo;","text":"&lt;p&gt;Сарысу ақуызы тым тез сіңеді. Ғалымдар полифенолдардан жасалған «тұқым қабығы» арқылы оның ыдырауын баяулату әдісін тапты.&lt;/p&gt;\n","links":[{"url":"2026-10-02/developing-metal-polyphenol-network-based-single-protein-par.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of-card.jpg"},"content":{"title":"Теңіз алабұғасының терісі: балық өңдеу қалдықтарынан жеуге жарамды қаптама","text":"&lt;p&gt;Ғалымдар теңіз алабұғасының терісінен биоыдырағыш пленка жасап шығарды. Бұл тамақ өнеркәсібі үшін берік әрі экологиялық таза материал.&lt;/p&gt;\n","links":[{"url":"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/broccoli-sprout-extract-restores-renal-lipid-metabolism-in-h-card.jpg"},"content":{"title":"Брокколи өскіндері бүйректі майлы тағамдардың зиянынан қорғай ала ма","text":"&lt;p&gt;Зерттеу брокколи өскіндері сығындысының майлы диетадан зақымданған бүйрек қызметін қалпына келтіруге көмектесетінін көрсетті.&lt;/p&gt;\n","links":[{"url":"2026-10-02/broccoli-sprout-extract-restores-renal-lipid-metabolism-in-h.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa-card.jpg"},"content":{"title":"Якон тамырынан маннит: тәтті түйнекті пайдалы қант алмастырғышқа айналдыру","text":"&lt;p&gt;Ғалымдар күрделі химиялық өңдеусіз, бактериялардың көмегімен якон тамырынан танымал тәттілендіргіш алу әдісін тапты.&lt;/p&gt;\n","links":[{"url":"2026-10-02/single-step-production-of-mannitol-from-yacon-fructo-oligosa.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co-card.jpg"},"content":{"title":"Апельсин қабығы мен қалампыр қызанақтың сақталу мерзімін қалай ұзартады","text":"&lt;p&gt;Ғалымдар цитрус қалдықтарынан көкөністерді шіруден қорғайтын жеуге жарамды қабықша ойлап тапты.&lt;/p&gt;\n","links":[{"url":"2026-10-02/development-of-orange-peel-derived-alginate-pectin-edible-co.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Шығарылым &amp;middot; 01.10.2026","url":"2026-10-01/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived-card.jpg"},"content":{"title":"Жасушалық ет: жержаңғақ пен киноа жануар ақуызын алмастырады","text":"&lt;p&gt;Ғалымдар жануар компоненттерінсіз культивацияланған ет өндірудің жолын тапты.&lt;/p&gt;\n","links":[{"url":"2026-10-01/quinoa-and-peanut-extracts-as-alternatives-to-animal-derived.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc-card.jpg"},"content":{"title":"Неліктен жалғыз тамақтанғаннан көрі бірге кешкі ас&amp;nbsp;ішкен денсаулыққа пайдалырақ","text":"&lt;p&gt;Жаныңызда жақын адамыңыздың болуы ағзаға көмірсуларды тез сіңіруге көмектесіп, қандағы қант деңгейін төмендететіні дәлелденді.&lt;/p&gt;\n","links":[{"url":"2026-10-01/social-physiology-human-homeostasis-is-more-efficient-in-soc.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-01/chitosan-based-active-films-enriched-with-thyme-essential-oi-card.jpg"},"content":{"title":"Киікшөп майы мен хито
