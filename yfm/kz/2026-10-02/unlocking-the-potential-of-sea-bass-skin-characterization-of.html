        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"235\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"545\" cy=\"282\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · GELS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Теңіз алабұғасының терісі:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;балық өңдеу қалдықтарынан&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жеуге жарамды қаптама&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Жыл сайын балық өңдеу кезінде көптеген қалдықтар жиналады. Түркиялық зерттеушілер теңіз алабұғасының терісін сапалы желатинге айналдыру жолын тапты. Алынған материал өнеркәсіптік аналогтардан кем түспейді және жеуге жарамды қаптама жасауға негіз бола алады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Теңіз алабұғасы желатиніндегі ақуыз мөлшері 90,93%.&lt;/li&gt;\n&lt;li&gt;Гельдің беріктігі 189,5 г-ға тең.&lt;/li&gt;\n&lt;li&gt;Пленкалар 6,53 МПа беріктікке және жоғары икемділікке ие.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Теңіз алабұғасының (Dicentrarchus labrax) терісінен алынған желатин құрамында 90,93% ақуызы бар полимер. Оны алу үшін тері 35°C температурада майсыздандырылып, қоспалардан тазарту үшін 0,2 M NaOH ерітіндісімен және коллаген матрицасын ісіндіру үшін 0,05 M HCl ерітіндісімен өңделді. Нәтижесінде глицинге (27,27%) және иминоқышқылдарға (18,71%) бай, 189,5 г гель беріктігіне ие құрылым алынды.&lt;/p&gt;\n&lt;p&gt;Осы желатиннен глицерин қосып, қалыңдығы 0,14 мм пленкалар дайындалды. Сынақтар материалдың созылу кезіндегі беріктігі 6,53 МПа және үзілу кезіндегі салыстырмалы ұзаруы 94,55% екенін көрсетті. FTIR спектроскопиясы материалдың коммерциялық стандарттарға сәйкес келетін тұрақты құрылымын растады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зертханалық жағдайда жүргізілгендіктен, өндірістік ауқымда қолдану қосымша тексерулерді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Ақуыз негізіндегі полимер ретінде желатин арнайы биохимиялық реакцияларға бейім және әртүрлі протеолитикалық ферменттердің әсерінен құрамдас аминқышқылдары мен пептидтерге ыдырауы мүмкін. Құрылымдық жағынан ол коллагеннен мұраланған Gly–X–Y қайталанатын мотивін сақтайды және құрамында глицинмен қатар пролин және гидроксипролин сияқты иминоқышқылдардың жоғары концентрациясы бар (1-сурет). Осы биополимерлік матрицаның майды байланыстыру бойынша бірегей қабілетін қамтамасыз ететін молекулалық механизмдер әлі толық зерттелмеген. Сондықтан бұл зерттеу D. labrax терісін қайта өңдеудің тұрақты жолын негіздеуге бағытталған, оның физика-химиялық, құрылымдық және механикалық қасиеттерін жан-жақты сипаттау арқылы бәсекеге қабілетті, әмбебап және халал био-орауыш материалы ретінде оның тиімділігі үшін сенімді база құруды мақсат етеді. Желатин көбінесе май мөлшері азайтылған рецептураларда әдетте липидтер қамтамасыз ететін қаймақты текстура мен көлемді қайталау үшін қолданылады. Азық-түлік өнеркәсібінен бөлек, ол озық биомедициналық салаларда да қолданылады: қазіргі зерттеулер оның тіндік инженериядағы, атап айтқанда, дәрілік заттарды жеткізу жүйелерін, регенеративті медицина қаңқаларын және жасушалық дифференциацияға арналған матрицаларды әзірлеудегі рөлін атап көрсетеді. Сонымен қатар, желатин төмен иммуногенділік, биологиялық ыдырағыштық және биоүйлесімділік сияқты артықшылықтарға ие. Құрылымдық жағынан желатин жасуша адгезиясына көмектесетін RGD (Arg–Gly–Asp) аминқышқылдық тізбегін қамтиды. Сонымен бірге, ол пленка түзудің жоғары қасиеттеріне ықпал ететін бір және екі қабатты гидрофильді тізбектерді қамтиды. Желатиннің көптеген пайдалы қасиеттеріне байланысты ол кең ауқымды салаларда қолданылады. Желатин ерітінділері суытылғанда термореверсивті гельдер түзе алады, өйткені тізбектер «ретсіздік–реттілік» конформациялық ауысуын бастан кешіреді және бұл оларға коллагеннің үштік спираль құрылымын қалпына келтіруге мүмкіндік береді. Теңіз биополимерлерінен тұтынылатын био-орауышты әзірлеу мұнай негізіндегі синтетикалық материалдарды алмастыру үшін маңызды баламаларды ұсынады. Желатин пленкалары пластификаторлар қосылуымен түзілуі мүмкін; олар ылғалдылығы немесе майы аз азық-түлік құрамдас бөліктерін инкапсуляциялау үшін пайдаланылуы мүмкін. Олар, сондай-ақ, оттегі, ылғал және липидтер миграциясынан қорғау үшін ет үстінде пленкалар мен жабындар түзу үшін қолданылуы мүмкін (1-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Желатин — бұл өзінің үштік спираль құрылымы және термореверсивті гель түзу қабілеті арқасында синтетикалық орауыш үшін перспективалы экологиялық балама болып табылатын әмбебап биополимер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әлем халқының тез өсуіне байланысты азық-түлік пен қоспаларда қолданылатын желатинге деген сұраныс соңғы жылдары артып, 2023 жылы 6,51 миллиард АҚШ долларына жетті және 2030 жылға дейін жылдық өсу қарқынымен (CAGR) 10,1% өседі деп күтілуде. Осы артып келе жатқан өнеркәсіптік сұранысты қанағаттандыру ірі аймақтық аквакультураны қайта өңдеу орталықтарының ресурстарын пайдалануды талап етеді, олар таза шикізаттың жоғары концентрациялы, бақыланатын ағындарын түзеді. Нарықтағы желатиннің 90%-дан астамы шошқа және ірі қара малдың терісі мен сіңірлеріне тиесілі. Алайда, белгілі бір діни шектеулерге байланысты сүтқоректілерден өндірілген желатин көбінесе халал және кошер талаптарына жауап бермейді. Сонымен қатар, сүтқоректілерден алынған желатин ірі қара малдың губка тәрізді энцефалопатиясы мен аусыл ауруына байланысты қауіптерді тудырады. Демек, теңіз өнімдерінен алынған қауіпсіздеу желатин көздеріне деген сұраныс көбірек назар аударуда. Балық өнеркәсібінің қосымша өнімдері балықтың жалпы салмағының 75%-ына дейін болуы мүмкін және көбінесе төмен коммерциялық құны бар өнімдер (мысалы, силос, тыңайтқыштар және балық ұны) өндіру үшін пайдаланылады немесе полигондарда немесе теңізде органикалық қалдық ретінде тасталады. Әдетте тері, сүйек, бас, қабыршақ және ішкі мүшелерді қамтитын осы қосымша өнімдердің желатин сияқты функционалды биополимерге биоконверсиясы заманауи қалдықсыз теңіз өнімдерін қайта өңдеу және айналмалы биоэкономика үшін бастапқы маңызға ие. Желатиннің қасиеттері жануар түріне, жасына, бастапқы тінге және экстракция шарттарына байланысты. Желатин сүйектерге қарағанда балық терісінен жоғары шығыммен және сапамен алынады. Бүгінгі күнге дейін қара мысық акуласы (Galeus melastomus), титан спинорогы (B. viridescens), атлантикалық треска, қызыл тилапия, ақ амур және теңіз алабұғасы сияқты әртүрлі балық түрлерінің терісінен желатин экстракциясы мен сипаттамасы туралы хабарланды. Түркия Жерорта теңізі аймағында теңіз және тұщы су өнімдері аквакультурасында озық ел болып табылады. 156 602 тонна өндіріс көлемімен Еуропалық теңіз алабұғасы аквакультурада ең кең өсірілетін түр болып табылады. Қайта өңделген теңіз алабұғасы ұлттық және халықаралық нарықтарда жаңа, салқындатылған немесе филе түрінде сатылады. Қайта өңделген теңіз өнімдеріне, әсіресе балық филесіне деген тұтынушылық сұраныстың өсуі қайта өңдеу ағындарының пропорционалды өсуіне әкелді. Терісіз филе алу процесінен кейін тері мен сүйектер тасталады немесе жем өнеркәсібінде пайдаланылады. Теңіз балық шаруашылығы және аквакультура секторларында Еуропалық теңіз алабұғасы жоғары құнды коммерциялық түр болып табылады, оның филесін алу және өнеркәсіптік қайта өңдеу тері түріндегі айтарлықтай көлемдегі қосымша өнімдерді түзеді, бұл қайта өңдеу қалдықтарының 30%-ына дейінгі бөлігін құрайды. Стратегия Еуропалық теңіз алабұғасын қайта өңдеуді Жерорта теңізі бассейнінде тез дамып келе жатқан сектор ретінде ұсынудан тұрады, ол үлкен жергілікті экологиялық жүктемені жаратады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қосымша өнімдер (side-streams) — бұл филе өндірілгеннен кейін қалатын балық бөліктері (тері, сүйек, қабыршақ). Оларды желатинге қайта өңдеу қалдықтарды құнды ресурсқа айналдырады және өндірістің экологиялық ізін азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Желатин теңіз алабұғасы терісінен бұрын да экстракцияланған болса да, біздің зерттеуіміз бірегей құрылымдық және оптикалық өзара салыстыруды пайдалана отырып, сүтқоректілердің де, суық су теңіз желатинінің коммерциялық стандарттарына қатысты нақты эталонды орнатады. Сонымен қатар, осы биополимерлік матрицаның майды байланыстыру бойынша бірегей қабілетін қамтамасыз ететін молекулалық механизмдер әлі толық зерттелмеген. Сондықтан бұл зерттеу D. labrax терісін қайта өңдеудің тұрақты жолын негіздеуге бағытталған, оның физика-химиялық, құрылымдық және механикалық қасиеттерін жан-жақты сипаттау арқылы бәсекеге қабілетті, жаһандық инклюзивті, халал био-орауыш материалы ретінде оның тиімділігі үшін түпкілікті база құрады. Алдыңғы зерттеулер негізінен өсірілетін теңіз алабұғасы желатинінің (SSG) шығымына немесе реологиялық профильдеуіне бағытталған еді. Қазіргі уақытта бұл түрдің бастапқы аминқышқылдық тізбектері мен иминоқышқылдардың таралуын сүтқоректілер мен балық терісі желатиндерінің коммерциялық үлгілерімен тікелей салыстыратын, сонымен бірге алынған желатин пленкаларының XRD, SEM және оптикалық мөлдірлігін зерттейтін кешенді зерттеулер жетіспейді. Еуропалық теңіз алабұғасы терісін жоғары құнды желатинге айналдыру — бұл зерттеудің негізгі мақсаты — экологиялық қалдықтарды басқару стратегиялары мен айналмалы биоэкономика қағидаттарына тікелей сәйкес келеді. Сонымен қатар, полипептидтік тізбектің икемді конформациясы тұтынылатын пленка өндіру процесінде пластификатордың тиімді енуі мен диффузиясын жеңілдетеді, бұл когезиялы, мөлдір және құрылымдық жағынан тұрақты тұтынылатын орауыш матрицаларын әзірлеуге мүмкіндік береді. Осыған байланысты, теңіз алабұғасы терісінен жоғары құнды табиғи полимер — желатин экстракцияланды және жан-жақты сипатталды. Экстракцияланған желатиннен тұтынылатын пленкалар да дайындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;w/w (weight/weight) — массалық үлес, бір компонент массасының екіншісіне қатынасы. Бұл жағдайда 1:2 қатынасы 1 кг теріге 2 кг мұз сәйкес келетінін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Теңіз алабұғасы терісінен экстракцияланған желатин (SSG) жоғары ақуыз тазалығын (90,93%) және өте төмен липид мөлшерін (0,13%) көрсетті, бұл оны азық-түлік өнеркәсібі үшін сапалы шикізатқа айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Балық&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қалдықтарын&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кәдеге жарату&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&l ence &amp;amp; nutrition журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Food science &amp;amp; nutrition (Europe PMC)&lt;/td&gt;\n&lt;td&gt;gels&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Gokcin M, Yanar Y, Dikel C.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-02/unlocking-the-potential-of-sea-bass-skin-characterization-of.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13594388\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/articles/PMC13594388?pdf=render\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.1002/fsn3.72333\" target=\"_blank
