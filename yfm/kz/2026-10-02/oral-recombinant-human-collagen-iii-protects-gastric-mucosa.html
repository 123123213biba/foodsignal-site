        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"157\" cy=\"76\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"483\" cy=\"261\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · SHELF_LIFE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Коллаген асқазанды&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;алкогольдің әсерінен қорғай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ала ма&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер III типті рекомбинантты адам коллагенінің (RC) этанол тудыратын асқазанның шырышты қабығының зақымдануына әсерін зерттеді. GES-1 жасушалары мен Wistar егеуқұйрықтарындағы тәжірибелер RC зақымдану аймағын тиімді азайтатынын дәлелдеді. Әсер ету механизмі GPAEF пептиді арқылы Pla2g4a-простагландин жолын белсендірумен байланысты.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;III типті рекомбинантты коллаген асқазанның зақымдануын 78%-ға азайтады.&lt;/li&gt;\n&lt;li&gt;GPAEF пептиді Pla2g4a генін белсендіріп, қорғаныс простагландиндерін түзеді.&lt;/li&gt;\n&lt;li&gt;RC жануарлардан алынған коллаген аналогтарына қарағанда тиімдірек.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеуде биотехнологиялық жолмен алынған III типті рекомбинантты адам коллагені (RC) қолданылды. GES-1 (адамның асқазан эпителий жасушалары) жасушаларындағы тәжірибелерде қорғаныс үшін оңтайлы концентрация 6% этанол әсерінен кейін анықталды. Талдаулар RC митохондриялық мембраналық потенциалды қалпына келтіруге көмектесетінін және DCFH-DA флуоресцентті зонды арқылы өлшенген реактивті оттегі түрлерінің (АФК) деңгейін төмендететінін көрсетті.&lt;/p&gt;\n&lt;p&gt;Басты жаңалық асқазанда RC ыдырауы кезінде түзілетін GPAEF пептидінің табылуы болды. Бұл пентапептид Pla2g4a генінің промоторлық аймағындағы G-квадруплекстермен (G4) жоғары аффинділікпен байланысады. Бұл өзара әрекеттесу G4 құрылымын гибридті конформацияға ауыстырып, шырышты қабықты қорғайтын және қан ағымын күшейтетін простагландиндер синтезін белсендіреді. Егеуқұйрықтардағы сынақтарда 30 күндік RC қабылдау бақылау тобымен салыстырғанда шырышты қабықтың зақымдануын 78%-ға азайтты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу егеуқұйрықтар мен жасуша дақылдарында жүргізілген, сондықтан адамға арналған дозаларды тікелей қолдану клиникалық сынақтарды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Этанол тудырған асқазанның шырышты қабығының жедел зақымдануы (AGMI) — бұл жоғары концентрациялы этанолды қысқа мерзімді шамадан тыс тұтыну нәтижесінде туындайтын патологиялық жағдай, ол асқазанның шырышты қабығының тосқауылдық қызметінің бұзылуына әкеледі. Негізгі патологиялық механизмдерге шырышты қабат бетіндегі фосфолипидті екі қабаттың тікелей еруі, этанол мен оның метаболиті ацетальдегид тудырған реактивті оттегі түрлерінің (ROS) шамадан тыс өндірілуі, сондай-ақ тығыз байланыстарды бұзатын, эпителийдің өткізгіштігін арттыратын және қабыну жасушаларының инфильтрациясына ықпал ететін қабыну реакциялары жатады. Эпидемиологиялық деректер қысқа мерзімді ішімдік ішушілердің 15%–35%-ында асқазанның шырышты қабығының эрозиясы немесе геморрагиялық гастрит дамитынын, ал кейбір жағдайларда асқазан жарасы, перфорация немесе тіпті қатерлі ісікке ауысатынын көрсетеді. Алкогольді тұтынуға байланысты бұзылулар бүкіл әлем бойынша артып келе жатқандықтан, алкогольге байланысты аурулар айтарлықтай медициналық және әлеуметтік-экономикалық жүктеме тудырады, тек 2018 жылдың өзінде 3 миллионнан астам өлім этанолды теріс пайдаланумен байланысты болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Этанол тудырған асқазанның жедел зақымдануы ішімдік ішушілердің 35%-ына дейін әсер етіп, тотығу стрессі мен қабыну арқылы шырышты қабықтың тосқауылын бұзады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Этанол тудырған AGMI-ді қазіргі клиникалық емдеу негізінен төрт терапиялық стратегияға сүйенеді: (1) антацидтер мен сукральфат сияқты жергілікті қорғаныс құралдары, олар асқазан қышқылын бейтараптандырады және шырышты қабат бетінде физикалық тосқауыл түзеді. (2) Ранитидин сияқты H2-рецептор антагонистері, олар H2-рецепторларын бөгеу арқылы қышқыл секрециясын тежейді. (3) Протон сорғысының ингибиторлары (PPI, оның ішінде омепразол мен лансопразол), олар париетальды жасушалардың H+/K+-АТФаза белсенділігін арнайы тежейді, осылайша қышқыл секрециясының терминалды кезеңін бөгейді. (4) Простагландин аналогтары, олар қан ағымы мен шырыш секрециясын арттыру арқылы шырышты қабықтың қорғанысын күшейтеді. Алайда, H2-рецептор антагонистері мен PPI-ді ұзақ уақыт қолдану жүрек-қан тамыр, бауыр және бүйрек уыттылығымен байланысты және ішек микробиотасын бұзуы мүмкін, ал простагландин аналогтарының селективті емес фармакологиялық әсері жүйелік жағымсыз реакцияларға байланысты олардың клиникалық пайдалылығын шектейді. Бұл шектеулер қауіпсіз және механизмдік тұрғыдан дәлірек араласуларға, әсіресе мультимодальды реттеуші әлеуеті бар биоактивті молекулаларға негізделген араласуларға қажеттілікті көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PPI (протон сорғысының ингибиторлары) — бұл асқазан жасушаларында қышқыл өндіретін сорғыларды «өшіретін» дәрілер, олар асқазан қышқылдығын төмендетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңғы жылдары табиғи өнімдерден алынған биоактивті компоненттер асқазанның шырышты қабығының зақымдануын алдын алу мен емдеуде көбірек назар аударуда. Полисахаридтер иммуномодуляция арқылы шырышты қабықты қорғау әсерін көрсететіні, фитохимиялық заттар өздерінің көп мақсатты антиоксиданттық қасиеттері үшін кеңінен зерттелетіні және биоактивті пептидтер (мысалы, бидай пептидтері, балық коллагенінің пептидтері) қос антиоксиданттық және қабынуға қарсы белсенділікті көрсететіні туралы хабарланған. Соған қарамастан, бұл сала әлі де көптеген техникалық және концептуалды кедергілерге тап болуда. Шикізат деңгейінде өсімдік және жануарлардан алынған коллагендер көбінесе жоғары иммуногенділік пен ретсіз фибриллді жиналуды көрсетеді; дәстүрлі экстракция әдістері жоғары тазартылған, құрылымдық тұрғыдан анықталған коллаген фракцияларын бере алмайды, бұл клиникалық қолдануға және механизмдік түсіндіруге кедергі келтіреді. Механизмдік деңгейде зерттеулердің көпшілігі жеке патологиялық буындарға (мысалы, тотығу стрессі немесе қабыну) бағытталған және асқазанның шырышты қабығының зақымдануы мен қалпына келуі кезінде үйлестірілген реттеуші желілердің қалай қайта құрылатынын сирек қарастырады. Араласудан кейін асқазан тіндеріндегі динамикалық метаболикалық жауаптардың бойлық талдаулары аз және AGMI-де метаболикалық қайта бағдарламалауды түсіну үшін жүйелі база әлі де жоқ. Сонымен қатар, қазіргі зерттеулер негізінен төмен молекулалық салмақтағы коллаген пептидтері мен олардың ыдырау өнімдеріне (мысалы, глицил-пролин фрагменттері) бағытталған, кіші пептидтер оңай сіңеді және биожетімді деген болжамға негізделген. Бұл екпін макромолекулалық коллагендердің өзін механизмдік зерттеуге қатысты немқұрайлылыққа әкелуі мүмкін, олардың құрылымдық тұтастыққа, беріктікке және тұрақты биоактивтілікке қосқан үлесіне қарамастан.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеулердің көпшілігі коллаген фрагменттеріне бағытталған, бұл тін құрылымын қалпына келтіруде тиімдірек болуы мүмкін тұтас макромолекулалардың әлеуетін елемеуге әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рекомбинантты адамның III типті коллагені (rhColIII, RC), жасушадан тыс матрицаның негізгі компоненті, өзінің тамаша биологиялық үйлесімділігі, жануарлардан алынған қауіптердің жоқтығы және жақсы анықталған молекулалық құрылымы арқасында тіндерді қалпына келтіру үшін перспективалы биоматериал ретінде пайда болды. RC механикалық сигнал беруді делдалдау, эпителий жасушаларының көшуін бағыттау және жасуша-матрица өзара әрекеттесуін модуляциялау үшін биомиметикалық қаңқа ретінде әрекет ете алады; ол сонымен қатар интегрин рецепторларымен және FAK/RhoA/ROCK сияқты төменгі сигналдық жолдармен өзара әрекеттеседі, осылайша фибробласттардың белсенуіне, жасушадан тыс матрицаның синтезіне және бақыланатын қабыну реакцияларына ықпал етеді. Бұл қасиеттер RC-ді асқазанның шырышты қабығын қорғау үшін үміткер биоматериал ретінде қарастыру үшін күшті теориялық негіз жасайды. Алайда, RC бойынша қолданыстағы зерттеулер негізінен тері және шеміршек сияқты беткейлік тіндерге бағытталған. Керісінше, асқазанның шырышты қабығы үнемі жоғары қышқылдылықпен, перистальтикадан туындайтын динамикалық механикалық стресспен және люминальды метаболиттер мен микробиотамен күрделі өзара әрекеттесулермен сипатталатын бірегей қатал ортаға ұшырайды. Бұл ерекшеліктер RC-дің асқазанның шырышты қабығының қалпына келуін модуляциялау механизмдері тері немесе шеміршек тіндерінен түбегейлі өзгеше болуы мүмкін екенін және алдыңғы жұмыстардан жай ғана экстраполяциялауға болмайтынын көрсетеді, бұл маңызды және әлі зерттелмеген зерттеу олқылығын атап көрсетеді. Бұл зерттеуде біз этанол тудырған AGMI-де асқазанды қорғайтын биоматериал ретінде ауыз арқылы енгізілетін рекомбинантты адамның III типті коллагенінің (RC) тиімділігі мен әсер ету механизмін жүйелі түрде зерттейміз. GES-1 адамның асқазан шырышты қабығының эпителий жасушаларын пайдалана отырып, біз алдымен RC-дің биологиялық қауіпсіздігін бағалаймыз және in vivo зерттеулері үшін негіз болатын жасушалық деңгейде оңтайлы қорғаныс концентрациясының диапазонын анықтаймыз.&lt;/p&gt;\n&lt;p&gt;Содан кейін біз этанол тудырған AGMI-дің егеуқұйрық моделін жасаймыз және 30 күндік RC-мен ауыз арқылы алдын ала араласу асқазанның шырышты қабығының зақымдануын айтарлықтай алдын алатынын, жануарлардан алынған коллагендерге қарағанда зақымдану аймағын азайтатынын және гистологиялық және биохимиялық көрсеткіштерді жақсартатынын көрсетеміз. Негізгі механизмді анықтау үшін біз метаболомдық және транскриптомдық талдауларды біріктіреміз және RC үйлестірілген, үш жақты жауапты қоздыратынын көрсетеміз: глутатионға негізделген антиоксиданттық жолдарды күшейту арқылы редокс-гомеостазды сақтау, шырышты қабықтың тұтастығын сақтау үшін цитоскелеттік және тығыз байланыс тосқауылын қалпына келтіру және эпителийдің регенерациясын ынталандыру үшін метаболикалық-қабыну желілерін қайта қосу — мұның бәрі жиынтығында RC тудырған асқазан тіндерінің метаболикалық қайта бағдарламалануын көрсетеді. Бұл әсерлердің орталығында Pla2g4a-простагландин (PG) осі орналасқан, оның көмегімен RC арнайы арахидон қышқылы-простагландин жолын тартады және простагландинмен байланысты қорғаныс медиаторларының синтезін ынталандырады. Біз RC-ден алынған асқазанда қорытылған GPAEF пентапептидін анықтаймыз, ол Pla2g4a промоторының G-квадруплексін (G4) таңдап, тұрақтандырады, оның аралас типтегі конформациялық ансамблін қайта құруға көмектеседі және пептид-G4 кешенін тұрақтандырады; бұл конформациялық жауап Pla2g4a транскрипциясының күшеюіне және төменгі PG биосинтезіне ықпал етуі мүмкін. Тұтастай алғанда, біздің нәтижелеріміз ауыз арқылы RC енгізілуі мен in vivo асқазанда GPAEF түзілуі, in vitro эксперименттік бақыланған GPAEF пен Pla2g4a G4 элементі арасындағы өзара әрекеттесу және RC-мен байланысты Pla2g4a-простагландин осінің белсенуі арасындағы көп ауқымды механизмдік модельді қолдайды, осылайша асқазанның шырышты қабығын қорғаумен сенімді механизмдік байланысты қамтамасыз етеді. Бұл жұмыс RC-ді этанолға байланысты гастропатия үшін қауіпсіз және тиімді ауыз арқылы қабылданатын биоматериал ретінде белгілейді және асқазанның шырышты қабығын қорғаудағы G4 делдалдығымен эпигенетикалық-метаболикалық реттеу үшін механизмдік негіз жасайды.&lt;/p&gt;\n&lt;p&gt;GES-1 жасушалары Baidi Biotechnology Co., Ltd (Чжэцзян, Қытай) компаниясынан алынды. Рекомбинантты адамның III типті коллагені (rhColIII, RC) Jiangsu Chuangjian Medical Technology Co., Ltd ұсынды. RPMI-1640 ортасы, ұрық бұзау сарысуы (FBS, Gibco), трипсин-EDTA (Gibco), пенициллин-стрептомицин-неомицин (PSN) антибиотикалық қоспасы және PBS буфері (pH 7,2) Sigma-Aldrich Inc. (АҚШ) компаниясынан сатып алынды. 2,7-дихлорфлуоресцеин диацетат (DCFH-DA) люминесцентті зонд талдау жинағы, митохондриялық мембраналық потенциалды анықтау жинағы (JC-1), жасушаларды санау талдауы (CCK-8) және BCA ақуыз талдау жинағы Beyotime Biotechnology Co., Ltd. (Шанхай, Қытай) компаниясынан сатып алынды. Аналитикалық таза сусыз этанол Shanghai Guoyao компаниясынан сатып алынды. Қысқартылған глутатион (GSH) талдау жинағы және супероксиддисмутаза (SOD) талдау жинағы (WST-1 әдісі) Nanjing Jiancheng Bioengineering Institute компаниясынан сатып алынды.&lt;/p&gt;\n&lt;p&gt;GES-1 жасушалары 10% (v/v) FBS және пенициллин-стрептомицин-неомицин (PSN) антибиотикалық қоспасымен толықтырылған RPMI-1640 ортасымен 75 см² колбаларда өсірілді. Мәдениеттер 37°C-та 5% CO₂ атмосферасында инкубацияланды. Жасушалар PBS (pH 7,2) арқылы жуылды және трипсин-EDTA көмегімен бөлінді. Этанол тудырған GES-1 жасушасының зақымдану моделін жасау әдісін зерттеу үшін жасушалар 1 сағат бойы әртүрлі концентрацияларда: 5%, 6%, 7%, 8%, 9% және 10% этанол әсеріне ұшырады, жасуша тіршілігін анықтау үшін. Жасуша тіршілігінің шамамен 60%-ына сәйкес келетін этанол концентрациясы оңтайлы модельдеу концентрациясы ретінде таңдалды. GES-1 жасушалары 24 сағат бойы әртүрлі концентрациядағы RC-мен алдын ала өңделді, содан кейін 1 сағат бойы таңдалған концентрацияда этанол әсері бақыланды. Кейіннен RC-дің жасуша тіршілігіне, тотығу стрессіне және қабынуға қорғаныс әсері бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасуша тіршілігі — бұл зақымдаушы фактордың (бұл жағдайда этанол) әсерінен кейінгі мәдениеттегі «тірі» жасушалардың пайызы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/oral-recombinant-human-collagen-iii-protects-gastric-mucosa.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Этанолдан&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;асқазанның&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зақымдануы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;III типті&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рекомбинантты&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;коллаген&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қабылдау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fil
