        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"140\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"500\" cy=\"240\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PLANT_BASED   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Өсімдік йогурты: таңдау&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;кезінде дәм маңызды ма әлде&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жапсырма ма?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеу көрсеткендей, өсімдік тектес йогурт баламаларын таңдауда тұтынушылар бірінші кезекте сенсорлық сезімдерге сүйенеді. Құрамы мен пайдасы туралы ақпарат күтуді қалыптастырғанымен, ол дәм мен текстураның төмен сапасын өтей алмайды. Кокос йогурты сүт аналогына ең жақын өнім болып шықты.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Дәм, қаймақтылық және қоюлық — тұтынушы таңдауын анықтайтын негізгі факторлар.&lt;/li&gt;\n&lt;li&gt;Кокос йогурты өсімдік аналогтары арасында ең жақсы сенсорлық көрсеткіштерге ие.&lt;/li&gt;\n&lt;li&gt;Жапсырмадағы ақпарат дәм күтуді ақтамаса, өнім сатып алынбайды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Тәжірибеге 77 жас тұтынушы қатысып, кокос, сұлы, соя және кешью негізіндегі йогурттарды бағалады. Физикалық-химиялық көрсеткіштер, соның ішінде pH және синерезис (сарысудың бөлінуі) 4 °C температурада өлшенді. Сенсорлық профиль CATA (Check-All-That-Apply) әдісі арқылы анықталды, онда қатысушылар 18 сипаттаманың ішінен сәйкесін таңдады.&lt;/p&gt;\n&lt;p&gt;Нәтижелер дәм, қаймақтылық және қоюлық тұтынушы таңдауының негізгі драйверлері екенін көрсетті. Керісінше, «бос» дәм, сұр реңк және сұйық консистенция бағаны төмендетті. Кокос нұсқасы сүт йогуртына барынша жақындап, ең жақсы нәтиже көрсетті. Жапсырмадағы ақпарат күтуді қалыптастырғанымен, сатып алу туралы түпкілікті шешім шынайы дәмнің сол уәделерді ақтауына байланысты болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 77 адамнан тұратын шектеулі топта жүргізілді, бұл бүкіл халықтың пікірін толық көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Өсімдік тектес сүт өнімдерінің баламаларының жаһандық нарығы 2025 жылы шамамен 36,8 миллиард АҚШ долларын құрады және 2033 жылға қарай 96 миллиард АҚШ долларына жетеді деп күтілуде. Өсімдік тектес сусындар бұл санатта басымдыққа ие, бірақ ең жылдам өсіп келе жатқан кіші санатты йогурт баламалары құрайды. Германия мен Франция сияқты дамыған еуропалық нарықтардан алынған бөлшек сауда деректері өсімдік тектес йогурт баламаларының салыстырмалы түрде шектеулі өсімін көрсетеді, ал Испания, Нидерланды және Ұлыбританияда күштірек өсім байқалды, бұл еуропалық елдердегі нарықтың даму кезеңіндегі айырмашылықтарды көрсетеді. Ет тұтынуды азайтатын еуропалық тұтынушылар өсімдік тектес йогурт баламаларын да жиірек тұтынуға бейім. 2023 жылы Еуропада өсімдік тектес йогурт баламалары флекситариандар арасында өсімдік тектес сусындардан кейінгі ең көп тұтынылатын екінші өсімдік өнімі болды. Йогурт баламаларына көшу сүт шаруашылығымен байланысты теріс экологиялық әсерлерді азайту әлеуетімен байланысты болуы мүмкін, бұл ресурстарды көп қажет ететін, әсіресе жерге деген үлкен сұраныс, сондай-ақ парниктік газдар шығарындыларына ықпал ететін су және жем-шөп ресурстарына байланысты танылған. Бұл өсіп келе жатқан қызығушылық денсаулық сақтау мәселелерімен де байланысты, өйткені өсімдік йогурттары вегандар мен лактозаны көтере алмайтын тұтынушылар үшін баламалы ақуыз көзі болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өсімдік тектес йогурт баламалары — нарықтың ең жылдам өсіп келе жатқан сегменті, олар текстура мен дәмдегі технологиялық қиындықтарға қарамастан, экологиялық тазалығы мен денсаулыққа пайдасымен тұтынушыларды тартуда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ашытылған өсімдік тектес сүт аналогтарын әзірлеу үшін бұршақ тұқымдастар, тұқымдар (негізінен майлы тұқымдар), жаңғақтар, дәнді дақылдар (дәнді және жалған дәнді дақылдар) және тіпті жеміс пульпалары сияқты көптеген өсімдіктерді пайдалануға болады. Бұл ингредиенттер өсімдік тектес йогурт баламасының тағамдық құндылығына ғана емес, сонымен қатар текстурасы мен дәміне де әсер етеді. Сүт йогуртымен салыстырғанда, өсімдік баламалары бірегей фитохимиялық компоненттер мен тағамдық талшықтарды қамтиды, бірақ олардың көпшілігі ноқат пен соядан басқа төмен ақуыз мөлшеріне ие. Сонымен қатар, өсімдік тектес йогурт баламаларында бұрын анықталған бұршақ, жаңғақ және «бояу» (тотыққан) сияқты жағымсыз дәмдер, сулы, жұқа және бөлінген текстура сияқты тұтынушылардың қабылдау деңгейін төмендетуі мүмкін. Текстуралық қасиеттер, әсіресе гель құрылымдары мен ылғалды ұстау қабілеті өсімдік тектес йогурт баламаларында әлсіздеу; сондықтан тұрақтандырғыштарды қосу сүт өнімдеріне қарағанда жиірек кездеседі. Дәм өсімдік өнімдерінің қолайлылығы мен сатылымын шектейтін маңызды фактор ретінде танылған. Қазіргі уақытта қарапайым өсімдік йогуртының сенсорлық сапасы айтарлықтай төмен және оны жақсарту өте маңызды болып қалуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Бояу» (painty) дәмі — бұл майлардың тотығуы нәтижесінде пайда болатын, майлы бояу иісін еске түсіретін өзіндік дәм ақауы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сүт қышқылы бактерияларымен ашыту бөгде дәмдерді жою және соңғы өнімге бай қабатты дәм профилін беретін ұшпа қосылыстарды өндіру үшін экологиялық таза, қауіпсіз және жұмсақ шешім болып көрінеді. Ашытылған өсімдік өнімдерінде бұл функционалдық, тағамдық және текстуралық қасиеттерді де жақсартады. Егер тағамның сенсорлық сапасы тұтынушылардың күткеніне сәйкес келмесе, бұл жалпы қабылдау деңгейінің төмендеуіне әкелуі мүмкін. Тағамның сенсорлық сипаттамалары тұтынушылар таңдауы мен жалпы ұнатудың негізгі факторлары ретінде танылған. Күтулер тағамды қабылдауда өте маңызды рөл атқарады; олар негізінен ұқсас өніммен алдыңғы тәжірибеге, әсіресе визуалды көрініске және өнімнің қаптамасы мен жапсырмасындағы ақпаратқа негізделеді. Қаптаманың, брендингтің, таңбалаудың және пайымдаулардың әсері күрделі психологиялық механизмдерге, негізінен өнім туралы нақты пайымдауларға әсер ететін когнитивті күтулерге жатады. Тұтынушылардың азық-түлік өнімдерін тек өз қалаулары мен сенсорлық атрибуттарына қарай бағалауы өнім туралы ақпарат ашылғанда айтарлықтай өзгеруі мүмкін. Ақпараттың дәмін татып көргеннен кейін ұнатуға болған бұл күшті әсері әдебиетте «теріске шығару» (disconfirmation) феномені ретінде танылған. Сенсорлық атрибутты қабылдауға оң да, теріс те әсер етуі мүмкін. Азық-түлік өнімінің қабылдануын жақсарту үшін сыртқы айнымалыларды пайдалану тұтынушылар таңдауына, қабылдауына және тұтынуына әсер ететін стратегиялардың бірі болып табылады, ол «сезімдердің ауысуы» процесі арқылы жүзеге асырылады, мұнда сыртқы атрибуттар өнімнің сенсорлық қабылдауына ауысады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жас тұтынушыларға бағытталған, олардың артықшылықтары басқа жас топтарынан өзгеше болуы мүмкін, бұл нәтижелерді бүкіл халыққа экстраполяциялауды шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу үшін Еуропалық Одақ өндірушілерінен коммерциялық сүт және өсімдік тектес йогурт баламалары таңдап алынды. Сүт йогурты және әртүрлі өсімдік негізіндегі (кешью, кокос, сұлы және соя) йогурт баламалары олардың аймақтық қолжетімділігіне қарай сатып алынды. Барлық ашытылған өнімдер әртүрлі дәмдер мен қоспалар салдарынан сенсорлық сипаттамалардағы әлеуетті өзгермелілікті жою үшін қоспасыз болды. Коммерциялық атаулары мен брендтері көрсетілмеген. Үлгілер сынақтан өткенге дейін 4 °C температурада сақталды. Үлгілердің құрамы мен тағамдық құндылығын қамтитын егжей-тегжейлі сипаттаманы 1-кестеден табуға болады. Үлгілер Еуропалық заңнамаға (Еуропалық Одақ регламенті 1169/2011) сәйкес таңбаланған; барлық ақпарат барлық нарық қатысушылары үшін ашық және компанияның ноу-хауын ашпайды. Барлық өлшеулер үш рет қайталанды.&lt;/p&gt;\n&lt;p&gt;Ашытылған өнімдердің белсенді қышқылдығы өлшеуден бұрын калибрленген pH-метр CP-411 (ELMETRON, Zabrze, Польша) көмегімен өлшенді. Өлшеулер бөлме температурасында жүзеге асырылды және нәтижелер pH бірліктерінде көрсетілді. Титрленетін қышқылдық үлгіде бар қышқылдардың 0,1 моль/л NaOH ерітіндісімен бейтараптануы негізінде Польша стандартының нұсқауларына сәйкес анықталды. Нәтиже негізінде сүт қышқылының пайызы (LA%) есептелді.&lt;/p&gt;\n&lt;p&gt;Ашытылған өнімдердің оптикалық қасиеттері Konica Minolta CM-600d (KONICA MINOLTA Inc., Осака, Жапония) ықшам спектрофотометрі көмегімен D65 ксенон шамының жарық көзі және 10° бақылау бұрышымен сандық бағаланды. Колориметрия нәтижелері CIELab (L*, a* және b*) түс индекстері ретінде анықталуы мүмкін. L* индексі үлгінің 0–100 шкаласы бойынша жарықтық мәні болып табылады, мұнда 0 қара, 100 ақ түсті білдіреді. a* индексі жасыл-қызыл өсіндегі, b* көк-сары өсіндегі түс кеңістігіндегі орнын білдіреді. Теріс a* жасыл, оң a* қызыл; теріс b* көк, оң b* сары түсті білдіреді. Өлшеулерді бастамас бұрын аспап ақ стандарт бойынша калибрленді. Үлгілер арасындағы түс айырмашылығы (ΔE&lt;em&gt;ab) CIE76 формуласы (1-теңдеу) бойынша есептелді. (1) ΔE&lt;/em&gt;ab = √((ΔL*)² + (Δa*)² + (Δb*)²) және Hunter ақтық индексі (1960) келесідей есептелді (2-теңдеу): (2) WI = L* − 3b*.&lt;/p&gt;\n&lt;p&gt;Ашытылған өнімдердің синерезис талдауы Жбиковская және басқалар әдісі бойынша центрифугалау арқылы жүзеге асырылды. Қысқаша айтқанда, 5,0 г үлгі 7 °C температурада 20 минут бойы 2500 айналым/минутта центрифугаланды. Супернатант өлшенді және синерезис индексі 3-теңдеу бойынша есептелді: (3) Синерезис (%) = (супернатант салмағы (г) / жалпы салмағы (г)) × 100%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синерезис — бұл сарысудың қоюланған массадан бөлініп шығу процесі, ол визуалды түрде йогурт бетінде сұйықтықтың пайда болуы ретінде қабылданады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тұтынушылармен сенсорлық тәжірибе 2024 жылы Познань Экономика және Бизнес Университетінде (PUEB) ISO 8589:2007 талаптарына және басқа тиісті институционалдық нұсқаулар мен ережелерге сәйкес сенсорлық сынақ зертханасында өткізілді. Зерттеуге барлығы 77 дайындалмаған тұтынушы, негізінен жас ұрпақ өкілдері (93,5%), 63,5% әйелдер және 36,5% ерлер қатысты (2-кесте). Қатысушылар жеке байланыстар мен әлеуметтік желілер арқылы тартылды. Олардан зерттеуге қабылдау үшін азық-түлік аллергиясы және лактоза көтере алмаушылығы туралы сұралды. Тәжірибе анонимділікті қамтамасыз етті. Зерттеуге қатысудан бұрын барлық қатысушылар хабардар етілген келісімді (шарттарды растап) ұсынды және қатысу ерікті әрі анонимді екендігі және олар себебін түсіндірместен кез келген уақытта зерттеуден шығып кете алатындығы туралы хабардар етілді. Нәзік жеке деректер жиналмады, деректер сәйкестендіруден шығарылды және тек жалпыланған түрде талданды. Әрбір сессия аяқталғаннан кейін қатысушыларға сынақ бөлмесінен шыққаннан кейін зерттеу мәліметтерін талқыламау нұсқауы берілді. Барлық қатысушыларға зерттеуге қатысқаны үшін шағын сыйлық берілді.&lt;/p&gt;\n&lt;p&gt;Тәжірибенің бірінші бөлігінде барлық қатысушылардан олардың әлеуметтік-демографиялық сипаттамалары және оларда қандай да бір азық-түлік аллергиясы немесе лактоза көтере алмаушылығы бар-жоғы туралы сұрақтарға жауап беру сұралды. Олар өнім туралы хабардар етілді, сынақ тәртібі бойынша нұсқаулар берілді және қағаз пішіндерін толтыру сұралды. Барлық қатысушылар 3 бөлек сынақ сессиясында (соқыр, күтілетін және хабардар етілген) қатысты. Тәжірибенің бірінші кезеңінде бренд атаулары мен өнімдер туралы нақты ақпарат тұтынушыларға белгісіз болды, бұл әлеуетті бейтараптықты азайтуға және барлық өнімдердің ішкі сапасын анағұрлым шынайы бағалауға мүмкіндік берді. Тәжірибенің екінші бөлігінде қатысушылар өнімдердің тағамдық ақпараты мен ингредиенттерін көрді (1-кесте), үшінші кезеңде олар сыналған өнімдер туралы толық ақпаратқа ие болды. Қатысушылар үлгілерді тек бірінші және үшінші сессияларда татып көрді. Қатысушылар алдымен сапа атрибуттарының ұнату деңгейін 9 балдық гедоникалық шкалада бағалады, мұнда 1 «өте ұнамайды», 9 болса «өте ұнайды» деген мағынаны білдіреді, содан кейін Check-All-That-Apply (CATA) сауалнамасы көмегімен ашытылған өнімдердің сенсорлық сипаттамаларын анықтады. Танысу сессиясында қатысушылар CATA тапсырмасы мен сынақ процесі бойынша толық нұсқаулар алды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CATA (Check-All-That-Apply) әдісі тұтынушыға өнімге сәйкес келеді деп санаған барлық сипаттамаларды тізімнен таңдауға мүмкіндік береді, бұл қарапайым «ұнайды/ұнамайды» бағасынан гөрі дәлірек сенсорлық профильді береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сауалнама 18 терминнен тұрды, олардың әрқайсысы әртүрлі сенсорлық атрибуттарға қатысты болды. Бұл атрибуттар кең ауқымды әдебиеттер шолуы нәтижесінде алынды және PUEB мамандары тарапынан одан әрі нақтыланды. CATA-ға енгізілген атрибуттар сауалнамамыздың шынайылығын қамтамасыз ету және ұсыну тәртібінен туындауы мүмкін кез келген әлеуетті бейтараптықты азайту үшін кездейсоқ тәртіпке келтірілді. Сатып алу ниетін бағалау үшін 5 балдық Лайкерт шкаласы қолданылды, мұнда 1 «қатаң жоқ», 5 болса «қатаң иә» деген мағынаны білдіреді. Үлгілер 15 °C температурада, жалпы көлемі 20 г (шамамен 2 ас қасық) мөлшерінде ұсынылды, бұл тұтынушылардың сессия барысында үлгіні бірнеше рет қайта татып көрулерін қамтамасыз етті. Зерттеуде иіссіз және мөлдір пластик стақандар қолданылды. Үлгілер монадикалық тізбекте, кездейсоқ үш таңбалы сандармен кодталған күйде, үлгілердің реттілігі әсерін болдырмау үшін теңдестірілген кездейсоқ тәртіпте ұсынылды. Үлгілер ұсынылғанға дейін туындауы мүмкін кез келген сұйықтықтың бөлінуін болдырмау үшін мұқият араластырылды. Барлық сенсорлық бағалау сессиялары барысында тұтынушыларға таңдайды тазарту үшін газдалмаған немесе газдалған су, сондай-ақ бір үлгінен екіншісіне өту әсерін азайту үшін құрғақ, тұзсыз нан таяқшалары ұсынылды.&lt;/p&gt;\n&lt;p&gt;Статистикалық талдаулар XLSTAT 2023.1.6 (Addinsoft, Париж, Франция) және Statistica 13.3 (TIBCO Software Inc., Талса, ОК, АҚШ) көмегімен жүзеге асырылды. Маңыздылық деңгейі α = 0,05 деп белгіленді. Физикалық-химиялық деректер бір факторлы дисперсиялық талдау (ANOVA) көмегімен талданды. Тьюкидің HSD тесті өнім орташа көрсеткіштері арасындағы post-hoc салыстырулар үшін қолданылды. Гедоникалық ұнату деректері қайталанатын өлшеулер ANOVA (RM-ANOVA) көмегімен талданды. Тиісті жағдайларда, жұптық салыстырулар Холм процедурасы көмегімен түзетілді және жалпыланған эта-квадрат (ηG²) эффект көлемі өлшемі ретінде хабарланды. Соқыр жағдайларда жалпы ұнату мен жеке сенсорлық сапа атрибуттары арасындағы қатынастар Пирсон корреляция коэффициенттері көмегімен тексерілді. CATA деректері Кокрен Q тесті және одан кейінгі Макнемар жұптық салыстырулары көмегімен талданды. Өнімдер мен дескрипторлар арасындағы жалпы байланыс х-квадрат тесті көмегімен бағаланды және х-квадрат қашықтықтары негізіндегі сәйкестік талдауы олардың қатынастарын визуализациялау үшін қолданылды. Пирсон корреляциялары және айыппұл/көтерілу талдауы (penalty/lift analysis) жалпы ұнатудың артуы немесе кемуімен байланысты сенсорлық дескрипторларды анықтау үшін қолданылды. Көп факторлы талдау (MFA) сенсорлық ұнату, CATA дескрипторлары және физикалық-химиялық сипаттамаларды қамтитын үш белсенді деректер блогын интеграциялау үшін қолданылды. Жаһандық талдаудан бұрын әрбір блок бөлек талданды және әртүрлі деректер блоктарының әсерін теңестіру үшін бірінші бірегей мәніне қарай қалыпқа келтірілді. Қалыпқа келтірілген блоктар кейіннен жаһандық MFA-ға біріктірілді. Соқыр жағдайларда жалпы ұнату қосымша айнымалы ретінде енгізілді және сондықтан MFA өлшемдерін құруға үлес қосқан жоқ. Белсенді деректер блоктары ұсынған конфигурациялар арасындағы ұқсастық RV коэффициенттері көмегімен сандық бағаланды, олар 0 мен 1 аралығында өзгереді, жоғары мәндер көп өлшемді конфигурациялар арасында үлкен ұқсастықты көрсетеді. Күту эффектілері «күтілетін минус соқыр», «хабардар етілген минус соқыр» және «хабардар етілген минус күтілетін» айырмашылықтары көмегімен бағаланды. Жеке ассимиляция және контраст жауаптары (I − B)/(E − B) қатынасының бағыты бойынша сыныпталды; нөлдік немесе анықталмаған қатынастар әсердің жоқтығы немесе түсініксіз жауаптар ретінде сыныпталды. Сатып алу ниеті өнімдерді салыстыру үшін Фридман тесті және күтілетін мен хабардар етілген жағдайларды салыстыру үшін Уилкоксонның қол қойылған дәреже тестілері көмегімен талданды. Жалпы ұнату мен сатып алу ниеті арасындағы қатынастар күтілетін және хабардар етілген жағдайларда әрбір өнім үшін бөлек Спирмен дәреже корреляциялары көмегімен тексерілді. Жалпы ұнату сатып алу ниетін болжай ма, жоқ па, соны тексеру үшін сызықтық аралас эффектілі модельдер қолданылды. Сатып алу ниеті тәуелді айнымалы ретінде, жалпы ұнату мен өнім болса қатаң эффектілер ретінде күтілетін және хабардар етілген жағдайлар үшін бөлек модельдер сәйкестендірілді. Қосымша модель жалпы ұнатудағы «хабардар етілген минус күтілетін» өзгеріс сатып алу ниетіндегі тиісті өзгерісті болжай ма, жоқ па, соны тексерді. Тұтынушы әрбір қатысушы ұсынған бес өнім бағасының тәуелсіз еместігін ескеру үшін кездейсоқ қиылысу ретінде енгізілді. Модельдер шектелген максималды ықтималдық (REML) көмегімен бағаланды және еркіндік дәрежелері Саттертуэйт жақындауы көмегімен бағаланды. Модель болжамдары қалдық таралуларын және қалдық-бейімделген графиктерді зерттеу арқылы бағаланды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/the-power-of-information-how-labeling-alters-young-consumer.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-
