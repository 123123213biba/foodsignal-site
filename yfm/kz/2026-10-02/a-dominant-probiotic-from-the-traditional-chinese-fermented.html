        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"233\" cy=\"127\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"567\" cy=\"283\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     FOODSIGNAL · PROBIOTICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Қытайлық доужир сусыны&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тұмауға қарсы көмектесе ала&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ма?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер қытайлық &lt;a href=\"concepts/douzhier.html\"&gt;доужир&lt;/a&gt; өнімінен &lt;a href=\"concepts/lactococcus-lactis-subsp-cremoris-d2022.html\"&gt;Lactococcus lactis subsp. cremoris D2022&lt;/a&gt; штаммын бөліп алды. Тышқандарға жасалған тәжірибелер бұл пробиотик тұмаудың А вирусының әсерін жеңілдететінін көрсетті. Ол ағзаға вирусты тезірек жеңуге және қабыну процестерін бақылауға көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;D2022 штамы интерферон-бета жауабын күшейтіп, тұмау кезінде тірі қалуды 30%-ға арттырады.&lt;/li&gt;\n&lt;li&gt;Пробиотик инфекцияның кешкі кезеңінде қабыну белгілерін (IL-1β, IL-6, TNF-α) азайтады.&lt;/li&gt;\n&lt;li&gt;Әсер ету механизмі ішек метаболиттері, атап айтқанда, май қышқылдары деңгейінің өзгеруімен байланысты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Ғалымдар C57BL/6J тышқандарын тұмаудың А вирусымен (PR8 штамы) зақымдады. Күніне 2 × 10^9 CFU (колония түзетін бірлік) D2022 штамын алған топта тірі қалу деңгейі 30%-ды құрады, ал бақылау тобында бұл көрсеткіш 0% болды. Бактериялар интерферон-бета (IFN-β) өндірілуін ерте кезеңде ынталандырып, вирустың ағзадан шығуын жеделдетті.&lt;/p&gt;\n&lt;p&gt;Инфекцияның кешкі кезеңдерінде (7-күн) пробиотик қабынуға қарсы цитокиндер (IL-1β, IL-6 және TNF-α) деңгейін төмендетті. Метаболомдық талдаулар қысқа тізбекті май қышқылдары мен деаминотирозин (DAT) мөлшерінің артқанын көрсетті. Бұл заттар иммунитетті модуляциялауда маңызды рөл атқарады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тышқандар моделінде өткізілген, сондықтан нәтижелерді адамдарға тікелей қолдану үшін клиникалық сынақтар қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Дучжиэр (Douzhier) — Сун династиясы дәуірінен басталған 1000 жылдан астам тарихы бар дәстүрлі қытайлық ферменттелген тағам. Ол өзіндік ерекше дәмге ие және Пекин тұрғындары арасында өте танымал. Дучжиэр маш бұршағын спонтанды ферменттеу арқылы алынады. Машты алдымен суға жібітіп, содан кейін ұсақтап, сүзіп, крахмал сүтін алады. Оған Дучжиэрдің алдыңғы партиясынан ашытқы қосып, ферменттеуге қалдырады. Тұнған кезде ол тығыздығына қарай үш қабатқа бөлінеді: төменгі қабаты крахмалдан тұрады; ақуызға бай ортаңғы қабаты мадоуфу (дәстүрлі пекиндік жеңіл тағам) деп аталады; ал жоғарғы қабаты сұр-жасыл сұйықтық — шикі Дучжиэр болып табылады. Содан кейін шикі Дучжиэр әрі қарай ферменттеліп, пісіріледі. Ферменттеу процесі микробиотаның өзгеруімен және бос аминқышқылдары сияқты метаболиттердің көбеюімен қатар жүреді.&lt;/p&gt;\n&lt;p&gt;Маусымдық тұмау бүкіл әлемде жылына шамамен 1 миллиард жұқтыру, 3–5 миллион ауыр жағдай және 290 000–650 000 тыныс алу жолдары өліміне себеп болатын денсаулық сақтаудың үлкен жүгі болып табылады. АҚШ-та 2024–2025 маусымында тұмау 51 миллион ауруды, 710 000 госпитальдауды және 45 000 өлімді тудырды. Вакцинация кеңінен қолданылады, бірақ вирус мутациясының жоғары жылдамдығы оның тиімділігін төмендетеді. Көмірсутекті шағын молекулалы вирусқа қарсы препараттар ұзақ мерзімді профилактикаға жарамайды және резистенттілік даму қаупі бар. Сондықтан тұмауды алдын алу мен емдеудің жаңа әдістерін табу өте маңызды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пробиотиктер вирустардан организмнің бейспецификалық механизмдерін (I типті интерферондарды күшейту және гиперинінуді басу) белсендіру арқылы қорғайды, бұл вирус мутацияларына тәуелсіз.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеулер кейбір пробиотиктердің (Lactococcus lactis, Lactobacillus plantarum, &lt;a href=\"concepts/leuconostoc-mesenteroides.html\"&gt;Leuconostoc mesenteroides&lt;/a&gt;, Akkermansia muciniphila, Bacteroides fragilis) вируска қарсы әсері I типті интерферон жауабын арттыру және артық қабынуды азайту арқылы жүзеге асатынын көрсетеді. Пробиотиктерді ферменттелген тағамдар құрамында тұрақты тұтыну ұзақ мерзімді қорғанысты қамтамасыз етеді.&lt;/p&gt;\n&lt;p&gt;Пекин Дучжиэрінің микробиотасында Lactococcus lactis subsp. cremoris (L. cremoris) түрі басым. Бұл бактерия айран мен каспий йогуртында да кездеседі. Пробиотикалық белсенділік штаммға тығыз байланысты: мысалы, L. cremoris FC штаммы өкпені тұмаудан қорғап, аман қалу деңгейін арттырады. Бұл зерттеуде Дучжиэрден жаңа L. cremoris D2022 штаммы бөлініп алынып, оның тұмау А вирусына (IAV) қарсы қасиеттері зерттелді.&lt;/p&gt;\n&lt;p&gt;Жұмыста 6 апталық C57BL/6J тұқымдас 120 ұрғашы тышқан пайдаланылды (4 тәуелсіз экспериментте n = 10 бойынша 3 топ: бақылау, IAV + PBS және IAV + D2022). Тұмау вирусы A/Puerto Rico/8/34 (H1N1 PR8) MDCK клеткаларында өсірілді. L. cremoris D2022 штаммы Дучжиэрден бөлініп, толық геномдық секвенирлеуден өтті (BioProject PRJNA1014919) және кверцетинді ыдырату белсенділігі бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Вирус пен бактериялар дозасын &lt;a href=\"concepts/plaque-forming-unit-assay.html\"&gt;PFU&lt;/a&gt; және CFU/мл бірліктерімен өлшеу үлгідегі тірі вирус бөлшектері мен бактерия клеткаларының нақты санын анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тышқандарға -5 күннен 7 күнге дейін күн сайын пероральді түрде 200 мкл L. cremoris D2022 (2 × 10⁹ CFU) немесе PBS берілді. Вирус жұқтыру анестезия астында интраназальді жүргізілді: нолетальді доза 450 PFU (1, 3 және 7 dpi күндері үлгілер алынды) немесе летальді доза 900 PFU (14 dpi дейін аман қалу бақыланды). Өкпе индексі [өкпе салмағы (г) / дене салмағы (г) × 100%], тоқ ішек ұзындығы, ОТ-ПТР арқылы вирус жүктемесі және гистологиялық өзгерістер (5 мкм кесінділер, гематоксилин-эозин бояуы, 1-4 балдық шкала) бағаланды.&lt;/p&gt;\n&lt;p&gt;Сарысу мен өкпе гомогенатындағы 8 цитокин мен хемокин деңгейі (IL-1β, IL-6, TNF-α, KC, IL-4, IL-10, IL-12, IFN-γ) Luminex 200 жүйесінде өлшенді. Өкпе транскриптомасын талдау BGISEQ-500 платформасында РНҚ секвенирлеу арқылы орындалды (NCBI SRA: PRJNA1100256, PRJNA1102099). NF-κB жолының ақуыздары (P65, p-P65, IκBα, p-IκBα) вестерн-блоттинг әдісімен β-актинге қатысты талданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;&lt;a href=\"concepts/ultra-performance-liquid-chromatography.html\"&gt;UPLC&lt;/a&gt;-MS/MS аппаратындағы HM700 мақсатты метаболомдық талдауы бір уақытта 700-ден астам шағын метаболиттердің концентрациясын жоғары дәлдікпен өлшейді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In vitro тәжірибелерінде тышқанның сүйек кемігі дендритті клеткалары (mBMDCs) D2022-мен 10:1 қатынасында 24 сағат өсіріліп, &lt;a href=\"concepts/elisa.html\"&gt;ELISA&lt;/a&gt; әдісімен IFN-β деңгейі анықталды. Соқыр ішек метаболомын талдау UPLC-MS/MS жүйесінде жүргізілді. Адаптивті иммундық жауап ағынды цитометрия (FACSCalibur) және ELISpot (iSpot Spectrum) арқылы спленоциттердегі IFN-γ секрециясы бойынша бағаланды.&lt;/p&gt;\n&lt;p&gt;Дучжиэр үлгісінде шамамен 3 × 10⁷ CFU/мл бактерия болды, онда L. cremoris D2022 басым болды. Бұл грам-оң штамм кверцетиннің 65%-ын ыдыратты (Сурет SN2). Геном көлемі 2,63 Мб, GC мөлшері 35,42% құрады. Геномда өт қышқылдары гидролазасының (BSH) кандидаты анықталды, бірақ BaiE гені табылмады (Кесте S1, Кесте S2, Сурет SN1).&lt;/p&gt;\n&lt;p&gt;Нолетальді инфекция кезінде D2022 тобындағы тышқандар 7-күні өкпе индексі (1,48 ± 0,16 қарсы 2,06 ± 0,32), тоқ ішек ұзындығы (7,78 ± 0,17 см қарсы 6,82 ± 0,20 см) және дене салмағын сақтау (83,6 ± 5,22% қарсы 75,3 ± 4,66%) бойынша PBS тобынан айтарлықтай артық болды (Сурет 1C–E). Инфекцияның 3-күні D2022 тобында өкпедегі вирус жүктемесі нақты төмен болды (146 000 ± 56 000 PFU қарсы 396 000 ± 220 000 PFU); 7-күнге қарай айырмашылық теңесті (Сурет 1F–G). Летальді доза берілгенде (900 PFU) PBS тобындағы барлық тышқандар 13 күнде өледі, ал D2022 тобында 30% тышқан (10-нан 3-еуі) 14 күнге дейін аман қалды (Сурет 1B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;L. cremoris D2022 қолдану тышқандардың өлімге әкелетін тұмаудан аман қалуын 0%-дан 30%-ға дейін арттырды және 3 dpi-де өкпедегі вирус жүктемесін 2,7 есе азайтты.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гистологиялық тұрғыдан D2022 тобында өкпе ұяшықтары қабырғасының қалыңдауы, қабыну клеткаларының инфильтрациясы мен ісіну азайып, патология балы 1,72 ± 0,38-ден 1,26 ± 0,42-ге дейін төмендеді (Сурет 2A–D).&lt;/p&gt;\n&lt;p&gt;Цитокиндер талдауы 7-күні D2022 тобының өкпесі мен сарысуында қабынуға қарсы цитокиндер (IL-6, KC, IL-1β, TNF-α) мен IL-10 деңгейінің төмендегенін көрсетті (Сурет 3, Сурет 4). Адаптивті иммунитет цитокиндері (IL-12, IFN-γ) жоғарылау тенденциясын білдірді.&lt;/p&gt;\n&lt;p&gt;Өкпе транскриптомасында 1 dpi-де 495 DEG (391 жоғарылаған) және 7 dpi-де 627 DEG (359 төмендеген) табылды (Сурет 5A,B). 1 dpi-де RIG-I, Toll-тәрізді және JAK-STAT жолдары (IRF1, IRF7, IFN-α, IFN-β, ISG-лар) белсендірілсе (Сурет 5C–G), 7 dpi-де IL-17, NF-κB, NOD және TNF қабыну жолдары (IL-1β, IL-6, TNF-α, NLRP3) басылды (Сурет 5H–L). Вестерн-блоттинг p-P65 және p-IκBα ақуыздарының азайғанын растады (Сурет 6).&lt;/p&gt;\n&lt;p&gt;mBMDCs клеткаларында D2022 in vitro жағдайында IFN-β өндірісін арттырды (Сурет 7A). Тышқандар өкпесінде IFN-β деңгейі 1 dpi-де бірден жоғарылады (Сурет 7B–D). Соқыр ішек метаболомын талдау D2022 әсерінен қысқа тізбекті май қышқылдарының (май және пропион), екіншілік өт қышқылдарының (UDCA, Iso-UDCA, IsoalloLCA) және дезаминотирозиннің (DAT) қалпына келгенін көрсетті (Сурет 8). Т-клеткалар белсенділігі де артты (Сурет 9).&lt;/p&gt;\n&lt;p&gt;Зерттеу нәтижелері Дучжиэр дәстүрлі өнімінен бөлінген L. cremoris D2022 штаммы тышқандарды тұмау А вирусынан тиімді қорғайтынын дәлелдейді. Пробиотикті ішу аурудың бастапқы кезеңінде (3 dpi) вирустың көбеюін шектейді және өлім-жітімді азайтады. Вирус репликациясын тез тоқтату механизмі 1-тәулікте-ақ I типті интерферондардың (IFN-β және ISG) жедел белсендірілуімен байланысты. D2022 штаммының кверцетинді ыдыратып, интерферон сигналын күшейтетін дезаминотирозин (DAT) түзу қабілеті бұған септігін тигізеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;L. cremoris D2022 вируска қарсы әсері екі кезеңді: 1 dpi-де IFN-β жедел индукциясы вирустың таралуын бөгейді, ал 7 dpi-де NF-κB басылуы цитокиндік дауылдың алдын алады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Инфекцияның соңғы кезеңінде (7 dpi) D2022 NF-κB, NOD, IL-17 және TNF сигналдық жолдарын басу арқылы айқын иммуномодуляциялық әсер көрсетеді. Бұл қабыну цитокиндерінің (IL-1β, IL-6, TNF-α, KC) деңгейін төмендетеді және өкпе мен ішек тіндерін зақымданудан қорғайды.&lt;/p&gt;\n&lt;p&gt;Ішек метаболиттері де маңызды рөл атқарады: D2022 май және пропион қышқылдарының, сондай-ақ екіншілік өт қышқылдарының (UDCA, IsoalloLCA) мөлшерін қалпына келтіреді. Бұл қосылыстар қабынуды реттейтін T-клеткалардың (Treg) дамуына ықпал етеді. Бұған қоса, D2022 вирусқа қарсы арнайы T-клеткалық адаптивті жауапты жеделдетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пробиотиктің қабынуға қарсы қасиеттері рационда бактериялар қорғаныс метаболиттерін түзуі үшін қажетті тағамдық талшықтардың (пребиотиктердің) болуына байланысты.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұмыстың практикaлық құндылығы сонда, ферменттелген өнімдерден (Дучжиэр, айран, йогурт) бөлінген L. cremoris штаммдары респираторлық вирустық инфекциялардың алдын алу үшін функционалдық тағам компоненті ретінде қолданылуы мүмкін. Өндірісте бұл штамм пробиотикалық ашытқылар құрамына енгізіле алады. Үй жағдайында L. cremoris-ке бай ферменттелген тағамдарды жеткілікті пребиотикалық талшықтармен бірге тұрақты пайдалану иммунитетті нығайтудың тиімді тәсілі болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тұмау&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;вирусының&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жоғары&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутациясы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;D2022 штамын&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тышқандарда&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сынау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қабынудың&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;азаюы және&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тірі қалу&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Иммунитетті&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қолдайтын&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пробиотик&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Nutrients журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nutrients (Europe PMC)&lt;/td&gt;\n&lt;td&gt;probiotics&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Zhang X, Yang Y, He S, Huang Y, Ren Z, Song L.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-02/a-dominant-probiotic-from-the-traditional-chinese-fermented.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница статьи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/article/PMC/PMC13610886\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/articles/PMC13610886?pdf=render\" target=\"_b
